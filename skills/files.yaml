# yaml-language-server: $schema=../schemas/knowledge-files.schema.yaml
files:
  - path: text-review/SKILL.md
    name: 文章の点検のスキル
    description: docs/skill/text-review.yaml から生成した、渡した範囲の文章を knowledge の文章の規約に合わせて点検して修正するスキルの手順を受け持つ。スキルとして読み込まれる手順を確認するときに参照する。
    tags: [topic:文章, topic:スキル, tool:claude-code]
    related:
      - to: text-review
        type: implements
