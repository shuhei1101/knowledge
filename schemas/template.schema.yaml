$schema: https://json-schema.org/draft/2020-12/schema
title: テンプレート
description: ドキュメントの書式を定めるテンプレート。
x-rules:
  - テンプレートには書式だけを記載し、背景の説明・運用の流れ・検討の進め方・他の方式との対比を記載しない。
  - 他のプロジェクトにも使うので、特定のプロジェクトに固有の内容を含めない。
  - 補足は正の指示（何をどう記載するか）だけにする。
  - テンプレートと実体のファイルは個別のバージョンを持たない。
  - 設計書の種類のテンプレートは、`schemas/design/` のスキーマが正本で、文書を手で記載しない。
  - 設計書の種類のテンプレートの `items` は `scripts/build_templates.py` が生成し、`items` の決まり（セクション一覧・記述例・補足の構成）を当てない。
allOf:
  - $ref: common.schema.yaml#/$defs/metadata
properties:
  kind:
    title: 種類
    description: 文書の種類。この種類では `template` に固定する。
    const: template
  id:
    title: ID
    description: '`template-{対象}`。ファイル名と同じにする。'
    pattern: ^template-
    x-bad-examples:
      - value: template-external-api-page
        reason: 「ページ」の接尾語を付けている
  name:
    title: 名前
    description: '`テンプレート: {対象}`。'
    examples:
      - "テンプレート: 外部API"
  items:
    title: 項目
    description: 冒頭リード、セクション一覧、実体のファイルのセクションごとの書き方の順で並べる。
    x-rules:
      - '`id: overview` の項目を冒頭リードにし、何の書式かを 1〜3 行で記載する。'
      - 冒頭リードに、実体のファイルの配置先と命名、新しく作るときの付随作業を記載する。
      - 冒頭リードの直後にセクション一覧の項目を置き、列が `セクション`・`サブセクション`・`必須or条件` の表で全体の構造を記載する。
      - セクション一覧の順は実体のファイルでの登場順と揃える。
      - セクション一覧のセクション列は実体のファイルの `group` の最上位の名前をバッククォートで囲み、動的なサブセクションは `{名前テンプレ}` で記載する。
      - セクション一覧の必須or条件の列は `必須`・`{条件} の場合のみ`・`必須（{追加条件}）` のどれかで記載する。
      - 実体のファイルのセクションごとに 1 つの項目を置き、`name` を `{名前}` にする。
      - セクションの項目は、概要・`### 記述例`・列ごとの決まり・`### 補足` の順で記載し、説明が要らないセクションは概要を省く。
      - 記述例はコードフェンスで実物の YAML をそのまま記載し、入れ子のコードフェンスは外側を 4 連のバッククォートにする。
      - 表のあるセクションの列の決まりは、特殊な決まりを持つ列だけ `{カラム名}列:` の行と箇条書きで記載する。
      - 補足は最後に置き、セクション全体に共通する決まりを箇条書きで記載する。
    x-bad-examples:
      - value: |-
          ### 補足

          - 別の方式と比べて、この書式にした
        reason: 他の方式との対比で、書式ではない
unevaluatedProperties: false
