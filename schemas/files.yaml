# yaml-language-server: $schema=knowledge-files.schema.yaml
files:
  - path: changelog.schema.yaml
    name: 変更履歴のスキーマ
    description: 変更履歴の文書の構造（キー・必須・値の形）を定め、変更履歴の文書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ]
  - path: checksheet.schema.yaml
    name: チェックシートのスキーマ
    description: チェックシートの文書の構造（キー・必須・値の形）を定め、チェックシートの文書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ]
  - path: decision-table.schema.yaml
    name: 判定表のスキーマ
    description: 判定表の文書の構造（キー・必須・値の形）を定め、判定表の文書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ]
  - path: flowchart.schema.yaml
    name: 判定フローチャートのスキーマ
    description: 判定フローチャートの文書の構造（キー・必須・値の形）を定め、判定フローチャートの文書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ]
  - path: guide.schema.yaml
    name: 手順のスキーマ
    description: 使い方の文書の構造（キー・必須・値の形）を定め、使い方の文書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ]
  - path: knowhow.schema.yaml
    name: ノウハウのスキーマ
    description: ノウハウの文書の構造（キー・必須・値の形）を定め、ノウハウの文書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ]
  - path: knowledge-common.schema.yaml
    name: 共通の型のスキーマ
    description: 種類をまたいで使用する ID・タグ・関連・項目・メタデータの型を定め、各種類のスキーマが共通に持つ型を修正するときに参照する。
    tags: [topic:スキーマ, topic:メタデータ]
  - path: knowledge-files.schema.yaml
    name: 管理用の YAMLのスキーマ
    description: YAML でない文書のメタデータを 1 ファイル 1 行で持つ管理用の YAML の構造を定め、管理用の YAML の行のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ, topic:メタデータ]
  - path: meta.schema.yaml
    name: スキーマの記載方法のスキーマ
    description: スキーマのファイルと各項目に持つキーの記載方法を定め、スキーマを作る・修正するときと全ての文書の検査がスキーマを検査する内容を変えるときに参照する。
    tags: [topic:スキーマ, topic:検査]
    related:
      - to: dev-yaml
        type: see_also
  - path: prompt.schema.yaml
    name: プロンプトのスキーマ
    description: プロンプトの本文を部品の配列と変数の定義で記載する YAML の構造を定め、プロンプトのファイルのキーを追加・修正するときに参照する。
    tags: [topic:スキーマ, topic:プロンプト]
    related:
      - to: prompt-file
        type: see_also
  - path: rule.schema.yaml
    name: 規約のスキーマ
    description: 規約の文書の構造（キー・必須・値の形）を定め、規約の文書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ]
  - path: template.schema.yaml
    name: テンプレートのスキーマ
    description: テンプレートの文書の構造（キー・必須・値の形）を定め、テンプレートの文書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ]
  - path: terms.schema.yaml
    name: 用語集のスキーマ
    description: 用語集の文書の構造（キー・必須・値の形）を定め、用語集の文書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ]
  - path: word-list.schema.yaml
    name: 単語の対応表のスキーマ
    description: 単語の対応表の文書の構造（キー・必須・値の形）を定め、単語の対応表の文書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ]
  - path: design/agent.schema.yaml
    name: 設計書『エージェントの定義』のスキーマ
    description: エージェント 1 つのセッションの持ち方・モデル・きっかけ・実行する段階を記載する設計書の構造を定め、各プロジェクトが design-schemas のタグで指す設計書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ, topic:設計書]
  - path: design/agent_flow.schema.yaml
    name: 設計書『エージェントフロー』のスキーマ
    description: エージェントが順に進める工程と工程で呼ぶもの（スキルの SKILL.md を記載するときに参照する設計書を含む）を記載する設計書の構造を定め、各プロジェクトが design-schemas のタグで指す設計書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ, topic:設計書]
  - path: design/architecture.schema.yaml
    name: 設計書『アーキテクチャ図』のスキーマ
    description: サブシステムの分け方と外部システムとの境界を記載する設計書の構造を定め、各プロジェクトが design-schemas のタグで指す設計書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ, topic:設計書]
  - path: design/common.schema.yaml
    name: 設計書『共通の型』のスキーマ
    description: 設計書の種類をまたいで使用する ID・参照・本文などの型を記載する設計書の構造を定め、各プロジェクトが design-schemas のタグで指す設計書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ, topic:設計書]
  - path: design/component.schema.yaml
