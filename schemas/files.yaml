    description: サブシステム 1 つの設定値・環境変数の一覧を記載する設計書の構造を定め、各プロジェクトが design-schemas のタグで指す設計書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ, topic:設計書]
  - path: design/data.schema.yaml
    name: 設計書『データ』のスキーマ
    description: 利用者と決めるデータの構造を記載する設計書の構造を定め、各プロジェクトが design-schemas のタグで指す設計書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ, topic:設計書]
  - path: design/dataflow.schema.yaml
    name: 設計書『データフロー』のスキーマ
    description: 1 つのデータがシステムを流れる経路（DFD）を記載する設計書の構造を定め、各プロジェクトが design-schemas のタグで指す設計書のキーを追加・修正するときに参照する。
    tags: [topic:スキーマ, topic:設計書]
  - path: design/dev_command.schema.yaml
