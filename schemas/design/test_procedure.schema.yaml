$schema: https://json-schema.org/draft/2020-12/schema
title: テスト実行方法
description: テスト種別ごとの実行コマンドと前提。
x-rules:
  - 1 プロジェクト 1 ファイルにする。
x-kind: test_procedure
x-folder: docs/test-procedure
x-id-prefix: TP
type: object
additionalProperties: false
required:
- id
- title
- layers
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  tags:
    $ref: common.schema.yaml#/$defs/tags
  aliases:
    $ref: common.schema.yaml#/$defs/aliases
  title:
    type: string
    title: タイトル
    description: '`テスト実行方法`。'
    x-used-by:
      - 生成で、ページの見出しにする。
      - project-index の検索で、文書の名前にする。
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 対象を 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - project-index の検索で、文書の概要文にする。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。
      - 対象そのものが変わったときだけ書き換える。
    x-bad-examples:
      - value: 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。
        reason: 仕様を冒頭リードに記載している。仕様は各項目へ分ける
  prerequisites:
    type: array
    title: 前提
    description: 全種別に共通の前提（言語ランタイム・依存サービス・環境変数）。
    x-used-by:
      - 実行で、テストを実行する前にランタイム・依存サービス・環境変数を用意する。
    x-heading: 前提
    x-shape: list
    items:
      type: string
  layers:
    type: array
    title: テスト種別
    description: テスト種別ごとの実行コマンド。
    x-used-by:
      - テストで、種別ごとに実行するコマンドを決める。
      - 生成で、種別ごとのセクションにする。
    x-rules:
      - 初期構築では種別だけを作り、コマンドはテストを作る担当が確定させる。
      - 確定させるまでは `run_all` を `未確定` にする。
      - '`lint` 層は、プロジェクトの言語に応じて linter・formatter の check・型検査・構造と依存の向きの検査を全て含める（コンパイラが担う検査は除く）。'
      - マニフェストのスクリプト・コーディング規約で使用すると決めたツールが持つ検査は `lint` 層へコピーし、`lint` 層に無い検査を残さない。Git フックと CI では動かさない。
      - GitHub Actions の workflow のファイル（`.github/workflows/`）を持つリポジトリは、`lint` 層に actionlint を含める。
      - 型検査と構造の検査は、変更ファイルだけでなくプロジェクト全体に回す。
      - 全件実行は、どれかが失敗しても全ての検査を最後まで回し、1 つでも失敗したら失敗で終える 1 コマンドにまとめる（task runner・スクリプト・終了コードを集約するサブシェル 等）。
    x-shape: sections
    x-key: name
    x-unique-in-kind: true
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - run_all
      properties:
        id:
          type: string
          title: ID
          description: 設計書の中で一意な要素の ID。1 要素 1 ページにするときのページの ID になる。
          x-used-by:
            - 生成で、種別を 1 ページにするときのページの ID にする。
            - 設計で、ほかの設計書の参照（`TP-1#layers[lint]` 等）から種別を指す。
          x-rules:
            - 並びの順に `TL-{番号}` を振る。
            - 新しく追加する要素には、既にある番号の最大の次を振る。
            - 並べ替えても変えない。
          pattern: "^[A-Za-z0-9_-]+$"
          examples:
            - TL-1
        name:
          type: string
          title: 種別
          description: テスト種別の名前（`単体`・`結合`・`E2E`・`lint`）。
          x-used-by:
            - テストで、テストのレベル（単体・結合・E2E・lint）とテストの配置先を対応させる。
            - 生成で、セクションの見出しにする。
          enum:
          - 非機能要件テスト
          - E2E テスト
          - 結合テスト（フロント）
          - 結合テスト（バック）
          - 単体テスト（フロント）
          - 単体テスト（バック）
          - 外部疎通テスト
          - lint
        description:
          $ref: common.schema.yaml#/$defs/markdown
          title: 説明
          description: 使用するツールと実行の方式。
          x-used-by:
            - テストで、使用するツールと実行の方式を決める。
        prerequisites:
          type: array
          title: 前提
          description: 種別に固有の前提（起動しておくもの・Mock の状況・誤実行を防ぐフラグ）。
          x-used-by:
            - 実行で、種別のテストを実行する前に、起動しておくもの・Mock・フラグを用意する。
          x-rules:
            - 料金・副作用のある種別は必ず記載する。
          x-shape: list
          items:
            type: string
        run_all:
          $ref: common.schema.yaml#/$defs/markdown
          title: 全件実行
          description: 1 コマンドのコードブロック（`bash`）。
          x-used-by:
            - 実行で、実装・テスト作成の後に全件を実行するコマンドにする。
            - レビューで、配置されたテストのログが同じコマンドの出力かを照合する。
          x-rules:
            - 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。
            - '`parallelism` を持つ層は、並列数をプレースホルダ `{並列数}` で記載する（pytest-xdist は `-n {並列数} --dist loadfile`、vitest は `--maxWorkers={並列数}`）。'
            - プールを複数持つ実行は、`{並列数}` をプールの数で割った値を指定する。
            - 直列のマーカーで分けて 2 回実行するときは、選ばれたテストが無いときの終了（pytest の終了コード 5）を成功として扱う。
        run_one:
          type: object
          title: 個別実行
          description: 1 つのテストだけを実行するコマンドと、その指定方法。
          x-used-by:
            - 実行で、失敗したテストだけを再実行するコマンドにする。
          additionalProperties: false
          required:
          - label
          - command
          properties:
            label:
              type: string
              title: 単位
              description: '`シナリオ` / `画面` / `エンドポイント` / `ファイル` 等。見出しは `個別{単位}実行`。'
              x-used-by:
                - 生成で、`個別{単位}実行` の見出しにする。
            command:
              $ref: common.schema.yaml#/$defs/markdown
              title: コマンド
              description: プレースホルダの形式（`{シナリオファイルパス}`）の 1 コマンドのコードブロック。
              x-used-by:
                - 実行で、失敗したテストだけを再実行するときにプレースホルダを置き換えて実行する。
                - 実行で、判定フローチャート『結合テストの実行範囲』で決めた結合テストだけを実行するときにプレースホルダを置き換えて実行する。
              x-rules:
                - 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。
                - 結合テストの層は、実行する結合テストのファイルかフォルダを空白で区切って並べるプレースホルダ `{結合テストのパス}` で記載する。
                - '`parallelism` を持つ層は、`run_all` と同じく `{並列数}` で記載する。'
        location:
          type: string
          title: 実行場所
          description: 全件を回す場所（`runner` = GitHub Actions のランナー / `local` = 手元）。
          x-used-by:
            - 実行で、全件をランナーの全件実行で回すか、手元の全件実行で回すかを決める。
          x-rules:
            - 判定フローチャート『テストの実行場所』で決める。
            - 決めるまでは記載しない。
          enum:
          - runner
          - local
        run_runner:
          $ref: common.schema.yaml#/$defs/markdown
          title: ランナーでの実行
          description: '`location` が `runner` の層だけが持つ。層の全件か、指定した結合テストを回す workflow を `workflow_dispatch` で起動し、終わるまで待ち、ログを取得する 1 コマンドのコードブロック（`bash`）。'
          x-used-by:
            - 実行で、ランナーで全件を実行するコマンドにする。
            - 実行で、判定フローチャート『結合テストの実行範囲』で決めた結合テストをランナーで実行するコマンドにする。
            - レビューで、配置されたテストのログが同じコマンドの出力かを照合する。
          x-rules:
            - '`run_all`・`run_one` は手元で回すコマンドのまま残し、ランナーで回せないときに使用する。'
            - workflow は手動の起動（`workflow_dispatch`）だけで起動し、push・PR を契機にしない。
            - 失敗したときもログを取得してから失敗で終える。
            - '`parallelism` を持つ層は、workflow の入力に `{並列数}` を指定するコマンドで記載する。'
            - 結合テストの層は、workflow の入力に `{結合テストのパス}` を指定するコマンドで記載し、入力を省いたときは全件を回す。
        carry_over:
          $ref: common.schema.yaml#/$defs/markdown
          title: セッションを跨いで実行する形式
          description: E2E テストだけが持つ。結果と状態を配置するフォルダ（`RUN_DIR`）と、その中のファイルの名前を記載する。
          x-used-by:
            - 実行で、E2E の結果と状態を配置するフォルダとファイルを決める。
        monitoring:
          $ref: common.schema.yaml#/$defs/markdown
          title: 実行中の進行の監視
          description: E2E テストだけが持つ。
          x-used-by:
            - 実行で、E2E の実行中に進行を確認する方法にする。
        abort:
          $ref: common.schema.yaml#/$defs/markdown
          title: 実行の中断
          description: 中断の仕方。E2E テストは合図ファイル（`$RUN_DIR/abort`）。
          x-used-by:
            - 実行で、実行を中断するときの手順にする。
        duration:
          type: string
          title: 所要時間の目安
          description: 全件実行の所要時間の目安。
          x-used-by:
            - 実行で、実行を待つ時間と、ほかの全件実行と重ねないかを判断する。
        parallel:
          type: boolean
          title: 並列にできる
          description: ほかの作業の全件実行と同時に実行してよいなら `true`。
          x-used-by:
            - 実行で、ほかの作業の全件実行と同時に実行してよいかを判断する。
        excluded_paths:
          type: array
          title: 実行に影響しないパス
          description: 変更しても結合テストの結果が変わらないパスの glob。結合テストの層だけが持つ。
          x-used-by:
            - 実行で、判定フローチャート『結合テストの実行範囲』の Q1 で、変更したファイルの分を実行しないかを決める。
            - レビューで、実行範囲の表の R1 の行が一覧のとおりかを確認する。
          x-rules:
            - エージェントに配信する文書・スキーマで検査する設計書・テストが参照する文書のフォルダは記載しない。
            - ソースのコードのファイルは、コメントだけの変更でも記載しない。
            - ほかの層（単体テスト・E2E など）だけが使用するテストのフォルダは記載する。
            - 一覧への追加は、範囲を狭くする変更として reviewer の確認で行ってよい。
          x-shape: list
          items:
            type: string
          examples:
            - - docs/pr/**
              - README.md
              - tests/unit/**
        full_run_paths:
          type: array
          title: 全件にするパス
          description: 変更したら層の全件を実行するパスの glob と、全件が必要だと分かっている理由。結合テストの層だけが持つ。
          x-used-by:
            - 実行で、判定フローチャート『結合テストの実行範囲』の Q3 で、層の全件を実行するかを決める。
            - レビューで、実行範囲の表の R3 の行が一覧のとおりかと、理由が全件の必要を示すかを確認する。
          x-rules:
            - テストの土台（テストのフォルダの下の、テストのファイルでないファイル）・依存のマニフェストとロックファイル・ビルドとテストと lint の設定・ほとんどの入口が通る基盤のコードを記載する。
            - 一覧への追加は範囲を広げる変更なので、利用者の確認を取ってから行う。
          x-shape: table
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - reason
            properties:
              path:
                type: string
                title: パス
                description: 全件にするパスの glob。
                x-used-by:
                  - 実行で、変更したファイルと照合する。
              reason:
                type: string
                title: 理由
                description: そのパスを変更すると全件が必要だと分かっている理由。
                minLength: 1
                x-used-by:
                  - レビューで、全件にする理由が「安全のため」「分からないため」になっていないかを確認する。
          examples:
            - - path: tests/conftest.py
                reason: 全ての結合テストが使用するフィクスチャを持つ
              - path: uv.lock
                reason: 依存のバージョンが変わると、全ての結合テストの実行環境が変わる
        folder_map:
          type: array
          title: フォルダの対応表
          description: ソースのフォルダ（文書・スキーマ・設定のフォルダを含む）と、そのフォルダの変更で実行する結合テストのフォルダかファイル。結合テストの層だけが持つ。
          x-used-by:
            - 実行で、判定フローチャート『結合テストの実行範囲』の Q4 で、変更したファイルに対応する結合テストを決める。
            - レビューで、実行範囲の表の R5 の行が対応表のとおりかを確認する。
          x-rules:
            - 1 つのソースのフォルダを、複数の結合テストのフォルダに対応させてよい（複数の画面が使用する共通の部品は、使用する全ての画面のフォルダ）。
            - 文書のフォルダは、その文書を照合するテストのファイルに対応させる。
            - 行の削除は範囲を狭くする変更として reviewer の確認で行ってよく、行の追加は reviewer の確認を取ってから行う。
          x-shape: table
          items:
            type: object
            additionalProperties: false
            required:
            - source
            - tests
            properties:
              source:
                type: string
                title: ソースのフォルダ
                description: ソースのフォルダの glob。
                x-used-by:
                  - 実行で、変更したファイルと照合する。
              tests:
                type: array
                title: 結合テスト
                description: 実行する結合テストのフォルダかファイル。
                minItems: 1
                x-used-by:
                  - 実行で、個別実行の `{結合テストのパス}` に並べる。
                items:
                  type: string
                  pattern: ^tests/.+
          examples:
            - - source: src/app/mcp/**
                tests:
                  - tests/integration/mcp/
              - source: docs/phase/**
                tests:
                  - tests/integration/docs/test_phase_docs.py
        test_selector:
          $ref: common.schema.yaml#/$defs/markdown
          title: 関係するテストを選ぶ道具
          description: 変更したコードを通る結合テストを選ぶ道具の 1 コマンドのコードブロック（`bash`）。道具を使用できる結合テストの層だけが持つ。
          x-used-by:
            - 実行で、判定フローチャート『結合テストの実行範囲』の Q4・Q5 の代わりに、道具の結果で実行する結合テストを決める。
          x-rules:
            - 道具が選べないテスト（ソースを import しないテスト等）があるときは、その範囲を説明に記載する。
        parallelism:
          type: object
          title: 並列の設定
          description: 1 回の実行の中でテストを複数のプロセスに分けて実行するときの値。結合テストの層だけが持つ。
          x-used-by:
            - 実行で、判定フローチャート『結合テストの並列数』で並列数を求める。
          x-rules:
            - 値は実測から記載し、実測するまでは判定フローチャート『結合テストの並列数』の初期値を使用する。
          additionalProperties: false
          required:
          - enabled
          properties:
            enabled:
              type: boolean
              title: 層の中で並列にできる
              description: 層のテストを複数のプロセスに分けて実行してよいなら `true`。
              x-used-by:
                - 実行で、判定フローチャート『結合テストの並列数』の Q3 で、並列数 1 で実行するかを決める。
              x-rules:
                - 共有の資源（固定のポート・固定のパスのファイル・1 つのデータベース・同じ名前の tmux のセッション）を取り合うテストは、直列のマーカーを付けて `true` のまま残す。
            memory_per_process_gb:
              type: number
              title: 1 並列あたりのメモリ
              description: 1 並列が使用するメモリ（GB）。全件実行の最大の実測を並列数で割った値。
              exclusiveMinimum: 0
              x-used-by:
                - 実行で、メモリから求めた並列数の分母にする。
            fixed_memory_gb:
              type: number
              title: 固定のメモリ
              description: 並列数に比例しないメモリ（GB）。Storybook・ビルド・テストの準備処理の分。
              minimum: 0
              x-used-by:
                - 実行で、メモリから求めた並列数を求めるときに空きのメモリから引く。
            max:
              type: integer
              title: 並列数の上限
              description: 層で使用する並列数の上限。
              minimum: 1
              x-used-by:
                - 実行で、メモリ・CPU から求めた数と比べて並列数を決める。
          examples:
            - enabled: true
              memory_per_process_gb: 0.5
              fixed_memory_gb: 2.5
              max: 4
        external_cost:
          type: string
          title: 外部への依存と費用
          description: テストが呼ぶ外部のサービスと、発生する費用。
          x-used-by:
            - 実行で、実行の前に外部への依存と費用の確認が要るかを判断する。
        results:
          type: string
          title: 結果の配置場所
          description: 実行した結果のログを配置する場所。
          x-used-by:
            - 実行で、実行した後に結果のログを探す場所にする。
        notes:
          $ref: common.schema.yaml#/$defs/notes
  refs:
    type: array
    title: 関連
    description: 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。
    x-used-by:
      - 生成で、関連する設計書へのリンクにする。
      - レビューで、関連する設計書をたどって食い違いを確認する。
    items:
      $ref: common.schema.yaml#/$defs/ref
  decisions:
    type: array
    title: 検討事項
    description: 根拠になった話し合いの記録の検討事項の ID。
    x-used-by:
      - 生成で、話し合いの記録の検討事項へのリンクにする。
      - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
    items:
      $ref: common.schema.yaml#/$defs/decision
  notes:
    $ref: common.schema.yaml#/$defs/notes
    x-heading: 補足
    x-shape: sections
examples:
- id: TP-1
  title: テスト実行方法
  lead: テスト種別ごとの実行コマンドと前提。
  prerequisites:
  - Python 3.12 と uv
  - 'DB: PostgreSQL 16 のローカル起動（`docker compose up -d postgres`）'
  layers:
  - id: TL-1
    name: 単体テスト（バック）
    description: pytest で実行する。DB / API に依存しない。
    prerequisites:
    - 外部依存なし（純粋関数と Mock だけ）
    run_all: |-
      ```bash
      uv run pytest tests/unit/
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run pytest {単体テストファイルパス}
        ```
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" -f layer=unit | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; gh run view "$run_id" --log; exit $rc)
      ```
    parallel: true
  - id: TL-2
    name: 外部疎通テスト
    description: 実 API に繋いで疎通を確認する。
    prerequisites:
    - 実 API の認証情報を環境変数に設定する
    - 料金と副作用が出ることを認識した上で実行する
    - 誤実行を防ぐため `--run-external` を必須にする
    run_all: |-
      ```bash
      uv run pytest tests/external/ --run-external
      ```
    run_one:
      label: テスト
      command: |-
        ```bash
        uv run pytest {外部疎通テストファイルパス} --run-external
        ```
    location: local
    external_cost: テストごとの料金は外部API の設計書の料金を参照する
  - id: TL-3
    name: lint
    description: ruff で linter・formatter の check を、mypy で型検査を、import-linter で依存の向きを検査する。型検査と依存の向きの検査はプロジェクト全体に回す。
    prerequisites:
    - 検査の設定は `pyproject.toml` が持つ
    run_all: |-
      ```bash
      (rc=0; uv run ruff check . || rc=1; uv run ruff format --check . || rc=1; uv run mypy . || rc=1; uv run lint-imports || rc=1; exit $rc)
      ```
  - id: TL-4
    name: 結合テスト（バック）
    description: pytest と pytest-xdist で、ファイルの単位でプロセスに分けて実行する。共有の資源を取り合うテストは `serial_integration` のマーカーを付け、並列の後に並列数 1 で実行する。
    run_all: |-
      ```bash
      (rc=0; uv run pytest tests/integration/ -m "not serial_integration" -n {並列数} --dist loadfile; r=$?; [ $r -eq 0 ] || [ $r -eq 5 ] || rc=1; uv run pytest tests/integration/ -m serial_integration; r=$?; [ $r -eq 0 ] || [ $r -eq 5 ] || rc=1; exit $rc)
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        (rc=0; uv run pytest {結合テストのパス} -m "not serial_integration" -n {並列数} --dist loadfile; r=$?; [ $r -eq 0 ] || [ $r -eq 5 ] || rc=1; uv run pytest {結合テストのパス} -m serial_integration; r=$?; [ $r -eq 0 ] || [ $r -eq 5 ] || rc=1; exit $rc)
        ```
    location: local
    excluded_paths:
    - docs/pr/**
    - README.md
    - tests/unit/**
    full_run_paths:
    - path: tests/conftest.py
      reason: 全ての結合テストが使用するフィクスチャを持つ
    - path: uv.lock
      reason: 依存のバージョンが変わると、全ての結合テストの実行環境が変わる
    folder_map:
    - source: src/app/mcp/**
      tests:
      - tests/integration/mcp/
    - source: docs/phase/**
      tests:
      - tests/integration/docs/test_phase_docs.py
    parallelism:
      enabled: true
      memory_per_process_gb: 0.5
      fixed_memory_gb: 2.5
      max: 4
