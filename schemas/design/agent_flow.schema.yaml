$schema: https://json-schema.org/draft/2020-12/schema
title: エージェントフロー
description: |-
  エージェントが順に進める工程と、工程で呼ぶもの（MCP のツール・組み込みのツール・コマンド・サブエージェント・スキル・別のエージェントフロー）を記載する設計書。
  エージェントがそのまま参照する原本で、`type` が `skill` の文書は SKILL.md の生成元にもなる。
x-rules:
  - 1 ファイル = 1 つの手順にする。
  - ファイルの配置はフォルダ構成の設計書の `entries[]` と `naming` で決め、段階（stage）はフォルダ構成の `placeholders` を適用してパスから導く。
  - エージェントフローの索引は、エージェントごとに、そのエージェントのエージェントフローから `stages[]` の順で生成し、原本を持たない。
  - '`embed_only` の手順と `type` が `skill` の手順は、エージェントフローの索引に出さない。'
  - スキルにするのは、起動の仕組み（システムプロンプト・エージェントフローの索引）で指定できない理由があるときだけにする。
  - 工程の名前は進み具合の目印になるので、変えたときは変える前の進み具合を無効にする。
  - 新しい手順をエージェントフロー・サブエージェント・スキルのどれで指定するかは、判定フローチャート『機能を呼ぶインターフェースの選び方』（`flowchart-interface-choice`）で決める。
x-kind: agent_flow
type: object
additionalProperties: false
required:
- id
- summary
- steps
properties:
  id:
    $ref: '#/$defs/flow_id'
    title: ID
    description: 文書の ID。フォルダ構成で `id_root` を付けたフォルダからのパスから `.yaml` を除いたもの。
    x-used-by:
      - 設計で、`steps[].ref`・`steps[].calls[].flow`・`steps[].calls[].skill` から指す。
      - 生成で、エージェントフローの索引の ID の列にする。
      - 実行で、エージェントがエージェントフローを取得する ID にする。
    examples:
    - brain/stream/on-event
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  type:
    type: string
    title: 種類
    description: '`flow`（エージェントが MCP で参照するエージェントフロー）か `skill`（SKILL.md として配布するスキル）。記載しなければ `flow`。'
    x-used-by:
      - 検査で、種類ごとのキーの要否を確認する。
      - 生成で、`skill` なら SKILL.md を作り、エージェントフローの索引に出さない。
    enum:
    - flow
    - skill
  title:
    type: string
    title: 手順の名前
    description: 手順の名前。記載しなければ、パスの段階の `stages[].title`。
    x-used-by:
      - 生成で、エージェントフローの索引の手順の列と、Markdown に変換したときの見出しにする。
    examples:
    - イベントの手順
  summary:
    $ref: common.schema.yaml#/$defs/summary
    title: 概要
    description: 手順の概要（1 文）。
    x-used-by:
      - dev-docs の検索で、文書の概要文にする。
      - 生成で、`type` が `skill` なら SKILL.md の `description` にする。
    examples:
    - コメントと状態を取得し、次の一手を決めて演出指示書を書き込む
  condition:
    $ref: common.schema.yaml#/$defs/summary
    title: 実行条件
    description: 手順を実行する条件。`type` が `flow` のときだけ記載する。
    x-used-by:
      - 生成で、エージェントフローの索引の実行条件の列にする。
      - 実行で、エージェントが参照する手順を決める。
    examples:
    - 「次へ」を受けたとき
  agents:
    type: array
    title: 使用するエージェント
    description: この手順を使用する『エージェントの定義』への参照。複数のエージェントが使用する共通の手順で記載する。
    x-used-by:
      - 生成で、エージェントフローの索引をエージェントごとに作る。
    x-rules:
      - 記載しなければ、フォルダ構成で配置先のフォルダの `used_by` にあるエージェントにする。
      - 配置先のフォルダの `used_by` と両方を記載したときは、食い違いを検査する。
    items:
      $ref: common.schema.yaml#/$defs/ref
    examples:
    - - AG-1#
      - AG-2#
  triggers:
    type: array
    title: きっかけ
    description: この手順を実行するきっかけで、『エージェントの定義』の `triggers[]` への参照。記載しなければ、パスの段階の `stages[].trigger`。
    x-used-by:
      - レビューで、きっかけごとにエージェントフローがあるかを確認する。
    items:
      $ref: common.schema.yaml#/$defs/ref
    examples:
    - - AG-1#triggers[external-event]
  embed_only:
    type: boolean
    title: 埋め込み専用
    description: '`true` なら、ほかの手順の `steps[].ref` で埋め込むだけの部品にする。記載しなければ `false`。'
    x-used-by:
      - 生成で、`true` の手順をエージェントフローの索引に出さない。
  tags:
    type: array
    title: タグ
    description: 検索で絞り込むタグ。
    x-used-by:
      - dev-docs の検索で、文書の絞り込みにする。
    uniqueItems: true
    items:
      type: string
    examples:
    - - topic:コメント
  skill:
    type: object
    title: スキル
    description: スキルに固有の項目。`type` が `skill` のときだけ記載する。
    x-used-by:
      - 生成で、SKILL.md の配置先と frontmatter にする。
    x-shape: attributes
    additionalProperties: false
    required:
    - path
    properties:
      path:
        type: string
        title: 配置先
        description: 生成する SKILL.md の、リポジトリの直下からのパス。
        x-used-by:
          - 生成で、SKILL.md を書き出す先にする。
        pattern: ^\S+/SKILL\.md$
        examples:
        - plugins/mindstella/skills/setup/SKILL.md
      name:
        type: string
        title: 名前
        description: スキルの名前。記載しなければ `path` のフォルダ名。
        x-used-by:
          - 生成で、SKILL.md の `name` にする。
        examples:
        - setup
      arguments:
        type: array
        title: 引数
        description: スキルの引数。
        x-used-by:
          - 生成で、SKILL.md の `arguments`・`argument-hint` と、本文の引数の説明にする。
        items:
          type: object
          additionalProperties: false
          required:
          - name
          - hint
          - description
          properties:
            name:
              type: string
              title: 引数名
              description: 引数の名前。本文では `$名前` で参照する。
              x-used-by:
                - 生成で、SKILL.md の `arguments` にする。
              examples:
              - workspace
            hint:
              type: string
              title: 書式
              description: 補完で出す書式。
              x-used-by:
                - 生成で、SKILL.md の `argument-hint` にする。
              examples:
              - ワークスペースのフォルダ
            description:
              type: string
              title: 説明
              description: 引数の意味と、省いたときの動き。
              x-used-by:
                - 生成で、SKILL.md の本文の引数の説明にする。
              examples:
              - ワークスペースにするフォルダ。省くと今のフォルダ
      allowed_tools:
        type: array
        title: 確認なしで使用するツール
        description: スキルの実行中に確認なしで使用できるツール。
        x-used-by:
          - 生成で、SKILL.md の `allowed-tools` にする。
          - 検査で、`steps[].calls` の `command` が含まれるかを確認する。
        items:
          type: string
        examples:
        - - Bash(mindstella init *)
      frontmatter:
        type: object
        title: その他の frontmatter
        description: 上の項目に無い SKILL.md の frontmatter の項目を、SKILL.md の項目名のまま記載する。
        x-used-by:
          - 生成で、SKILL.md の frontmatter に加える。
        x-rules:
          - 上の項目で表せない理由があるときだけ記載する。
        examples:
        - paths:
          - docs/**
      frontmatter_reason:
        type: string
        title: その他の frontmatter の理由
        description: '`frontmatter` を記載する理由。`frontmatter` を記載したときは必須。'
        x-used-by:
          - レビューで、`frontmatter` が要るかを確認する。
        examples:
        - docs の編集のときだけ読み込ませるため
    dependentRequired:
      frontmatter:
      - frontmatter_reason
  steps:
    type: array
    title: 工程
    description: 順に進める工程。
    x-used-by:
      - 生成で、Markdown の工程のセクションにする。
      - 実行で、エージェントが順に進める工程にする。
    x-heading: 工程
    x-shape: sections
    x-key: name
    minItems: 1
    items:
      $ref: '#/$defs/step'
  refs:
    type: array
    title: 関連
    description: 参照する共通の手順・ノウハウへの参照。
    x-used-by:
      - 生成で、関連する手順へのリンクにする。
      - レビューで、関連する手順をたどって食い違いを確認する。
    items:
      $ref: '#/$defs/flow_ref'
    examples:
    - - shared/character-state#
  decisions:
    type: array
    title: 検討事項
    description: 根拠になった話し合いの記録の検討事項の ID。
    x-used-by:
      - 生成で、話し合いの記録の検討事項へのリンクにする。
      - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
    items:
      $ref: common.schema.yaml#/$defs/decision
allOf:
- if:
    properties:
      type:
        const: skill
    required:
    - type
  then:
    required:
    - skill
    properties:
      condition: false
      agents: false
      triggers: false
      embed_only: false
  else:
    required:
    - condition
    properties:
      skill: false
$defs:
  flow_id:
    type: string
    title: エージェントフローの ID
    description: '`id_root` のフォルダからのパスから `.yaml` を除いたもの。英字の名前はハイフンでつなぎ、`_` を使用しない。'
    pattern: ^[a-z0-9]+(-[a-z0-9]+)*(/[a-z0-9]+(-[a-z0-9]+)*)*$
    examples:
    - brain/stream/on-event
    x-bad-examples:
    - value: brain/stream/on_event
      reason: '`_` でつないでいる'
  flow_ref:
    type: string
    title: エージェントフローの参照
    description: エージェントフローか、その項目を指す。`{エージェントフローの id}#{項目のパス}` で記載し、全体を指すときは `#` の後を空にする。
    x-used-by:
      - 検査で、指すエージェントフローと項目が実在するかを確認する。
      - 変換で、指したエージェントフローの中身を埋め込む・呼ぶものにする。
    pattern: ^[^\s#]+#.*$
    examples:
    - shared/character-state#steps[キャラクター情報を取得する]
    - review/script#
  step:
    type: object
    title: 工程
    description: 工程 1 つ。`body` か `ref` のどちらか 1 つを持つ。
    additionalProperties: false
    required:
    - name
    properties:
      name:
        type: string
        title: 名前
        description: 工程の名前。手順の中で重ねない。
        x-used-by:
          - 生成で、Markdown の工程の見出しにする。
          - 設計で、`ref` が工程を指すキーにする。
          - 実行で、進み具合の目印にする。
        examples:
        - コメントを取得する
      body:
        $ref: common.schema.yaml#/$defs/markdown
        title: 本文
        description: 工程でやること。
        x-used-by:
          - 生成で、Markdown の工程の本文にする。
        examples:
        - 選別済みで未読のコメントを取得する
      ref:
        $ref: '#/$defs/flow_ref'
        title: 埋め込む工程
        description: 共通の工程を埋め込む。`{エージェントフローの id}#steps[{name}]` で記載する。
        x-used-by:
          - 変換で、指した工程の中身に置き換える。
        examples:
        - shared/character-state#steps[キャラクター情報を取得する]
      when:
        type: string
        title: 条件
        description: この工程をする条件。記載しなければ毎回する。
        x-used-by:
          - 生成で、Markdown の工程の頭に条件を出す。
        examples:
        - 細かい値や過去のことが要るとき
      calls:
        type: array
        title: 呼ぶもの
        description: 工程で呼ぶもの。互いの結果を使用しないものだけを並べる。
        x-used-by:
          - 生成で、Markdown の工程に呼ぶものを出す。
        items:
          $ref: '#/$defs/call'
    oneOf:
    - required:
      - body
    - required:
      - ref
  call:
    type: object
    title: 呼ぶもの
    description: 工程で呼ぶもの 1 つ。`type` で持つキーが変わる。
    additionalProperties: false
    required:
    - type
    properties:
      type:
        type: string
        title: 種類
        description: '`mcp`（MCP のツール）/ `tool`（組み込みのツール）/ `command`（シェルのコマンド）/ `agent`（Agent ツールで起動するサブエージェント）/ `skill`（Skill ツールで呼ぶスキル）/ `flow`（別のエージェントフローを参照し、全ての工程を進める）。'
        x-used-by:
          - 検査で、種類ごとのキーの要否を確認する。
          - 検査で、文書の `type` が `flow` なら、`agents` の起動の構成で使用できるか（`permissions.deny` に無いか）を確認する。
        enum:
        - mcp
        - tool
        - command
        - agent
        - skill
        - flow
      server:
        $ref: common.schema.yaml#/$defs/ref
        title: MCP サーバー
        description: '`type` が `mcp` のときの『MCP サーバーの定義』への参照。'
        x-used-by:
          - 変換で、ツールの完全な名前（Claude Code では `mcp__{server}__{tool}`）を作る。
        examples:
        - MCP-1#
      tool:
        type: string
        title: ツール
        description: '`type` が `mcp`・`tool` のときのツールの名前。`mcp` は『MCP サーバーの定義』の `tools[].name`、`tool` は組み込みのツールの名前。'
        x-used-by:
          - 生成で、Markdown に呼ぶツールを出す。
          - 検査で、`mcp` のツールがエージェントの `clients[].allow` にあるかを確認する。
        examples:
        - search
      args:
        type: object
        title: 引数の制約
        description: '`type` が `mcp`・`tool` のときの引数の制約。JSON Schema の `required`・`properties`・`additionalProperties` と、引数ごとの `const`・`enum`・`pattern` で記載する。'
        x-used-by:
          - 生成で、Markdown に引数の制約を出す。
          - 検査で、`mcp` のツールの `inputSchema` に合うかを確認する。
        x-rules:
          - 引数を自由にするときは記載しない。
        examples:
        - required:
          - character_id
      command:
        type: string
        title: コマンド
        description: '`type` が `command` のときに実行するコマンド。'
        x-used-by:
          - 生成で、Markdown にコマンドを出す。
          - 検査で、文書の `type` が `skill` なら `skill.allowed_tools` にあるかを確認する。
        examples:
        - mdmark export {file}
      flow:
        $ref: '#/$defs/flow_ref'
        title: エージェントフロー
        description: '`type` が `flow` のときに進めるエージェントフロー、または `type` が `agent` のときにサブエージェントに参照させるエージェントフローへの参照。'
        x-used-by:
          - 生成で、Markdown に進めるエージェントフローか起動するサブエージェントを出す。
          - 検査で、指すエージェントフローがあるかを確認する。
        examples:
        - review/script#
      instruction:
        type: string
        title: 指示
        description: '`type` が `agent` のときにサブエージェントに指定する指示の文。`flow` と一方だけを記載する。'
        x-used-by:
          - 生成で、Markdown にサブエージェントへの指示を出す。
        examples:
        - 成果物を確認観点で敵対的に検証し、指摘を返却する
      agent_type:
        type: string
        title: サブエージェントの種類
        description: '`type` が `agent` のときのサブエージェントの種類。記載しなければ `general-purpose`。'
        x-used-by:
          - 生成で、Agent ツールの `subagent_type` にする。
        examples:
        - general-purpose
      model:
        type: string
        title: モデル
        description: '`type` が `agent` のときのモデル。記載しなければ呼ぶ側と同じ。'
        x-used-by:
          - 生成で、Agent ツールの `model` にする。
        examples:
        - claude-sonnet-5-5
      tools:
        type: object
        title: ツールの制限
        description: '`type` が `agent` のときに使用させるツールの制限（`allow`・`deny`）。'
        x-used-by:
          - 生成で、サブエージェントの許可と拒否にする。
        x-rules:
          - レビュアーのサブエージェントには `Agent` を許可しない。
        additionalProperties: false
        properties:
          allow:
            type: array
            title: 許可
            description: 使用させるツール。
            x-used-by:
              - 生成で、サブエージェントに許可するツールにする。
            items:
              type: string
          deny:
            type: array
            title: 拒否
            description: 使用させないツール。
            x-used-by:
              - 生成で、サブエージェントに拒否するツールにする。
            items:
              type: string
            examples:
            - - Agent
              - Edit
              - Write
      wait:
        type: boolean
        title: 完了を待つ
        description: '`type` が `agent` のとき、完了を待ってから次の工程へ進むか（記載しなければ `true`）。`false` ならバックグラウンドで起動し、完了の通知を受けてから結果を使用する。'
        x-used-by:
          - 生成で、Markdown に完了の待ち方を出す。
      session:
        type: string
        title: 起動の仕方
        description: '`type` が `agent` のとき、`new`（新しいサブエージェントを起動する）か `reuse`（前回起動した同じサブエージェントに続けて依頼する）。記載しなければ `new`。'
        x-used-by:
          - 生成で、Markdown に起動の仕方を出す。
          - 設計で、`reuse` なら呼ぶ側の起動の構成でメッセージを送信するツールを読み込む。
        enum:
        - new
        - reuse
      renew_when:
        type: string
        title: 新しく起動する条件
        description: '`session` が `reuse` のとき、前回のサブエージェントを使用せずに新しく起動する条件。'
        x-used-by:
          - 生成で、Markdown に新しく起動する条件を出す。
        examples:
        - 成果物が別のものに変わったとき
      skill:
        $ref: '#/$defs/flow_ref'
        title: スキル
        description: '`type` が `skill` のときに呼ぶ、`type` が `skill` のエージェントフローへの参照。'
        x-used-by:
          - 生成で、Markdown に呼ぶスキルを出す。
        examples:
        - mindstella/setup#
    allOf:
    - if:
        properties:
          type:
            const: mcp
      then:
        required:
        - server
        - tool
    - if:
        properties:
          type:
            const: tool
      then:
        required:
        - tool
    - if:
        properties:
          type:
            const: command
      then:
        required:
        - command
    - if:
        properties:
          type:
            const: flow
      then:
        required:
        - flow
    - if:
        properties:
          type:
            const: skill
      then:
        required:
        - skill
    - if:
        properties:
          type:
            const: agent
      then:
        oneOf:
        - required:
          - flow
        - required:
          - instruction
    - if:
        properties:
          session:
            const: reuse
        required:
        - session
      then:
        required:
        - renew_when
examples:
- id: brain/stream/on-event
  summary: コメントと状態を取得し、次の一手を決めて演出指示書を書き込む
  condition: 「次へ」を受けたとき
  steps:
  - name: コメントを取得する
    body: 選別済みで未読のコメントを取得する
    calls:
    - type: mcp
      server: MCP-1#
      tool: search
      args:
        required:
        - kind
        - unread
        properties:
          kind:
            const: comment
          unread:
            const: true
  - name: キャラクター情報を取得する
    ref: shared/character-state#steps[キャラクター情報を取得する]
  - name: 演出指示書を書き込む
    body: 次の一手を決め、演出指示書を書き込む
    calls:
    - type: mcp
      server: MCP-1#
      tool: write_direction_memo
      args:
        required:
        - segment_id
        - memo
- id: script/review
  summary: 台本をレビュアーに検証させ、指摘を受け取る
  condition: 台本の工程を終えたとき
  steps:
  - name: レビューを依頼する
    body: 台本と参照した資料をレビュアーに指定し、指摘を受け取る
    calls:
    - type: agent
      flow: review/script#
      session: reuse
      renew_when: 台本が別のトピックに変わったとき
      tools:
        deny:
        - Agent
        - Edit
        - Write
- id: mindstella/setup
  type: skill
  summary: ワークスペースを作り、MindStella の画面の URL を出す
  skill:
    path: plugins/mindstella/skills/setup/SKILL.md
    arguments:
    - name: workspace
      hint: ワークスペースのフォルダ
      description: ワークスペースにするフォルダ。省くと今のフォルダ
    allowed_tools:
    - Bash(mindstella init *)
  steps:
  - name: ワークスペースを作る
    body: 指定したフォルダにワークスペースを作る
    calls:
    - type: command
      command: mindstella init $workspace
  - name: 画面の URL を出す
    body: 作ったワークスペースの画面の URL を出す
