$schema: https://json-schema.org/draft/2020-12/schema
title: 開発コマンド
description: 開発者とエージェントが開発で使用するコマンドの、分類ごとの前提・実行の順序・コマンド・料金や副作用や所要時間・確認した記録。
x-rules:
  - 1 プロジェクト 1 ファイルにする。
  - 何を記載するか・どの分類かは判定フローチャート『コマンドの書き先』で決める。
x-kind: dev_command
x-folder: docs/dev-command
x-id-prefix: CMD
type: object
additionalProperties: false
required:
- id
- title
- categories
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  title:
    type: string
    title: タイトル
    description: '`開発コマンド`。'
    x-used-by:
      - 生成で、ページの見出しにする。
      - dev-docs の検索で、文書の名前にする。
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 対象を 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - dev-docs の検索で、文書の概要文にする。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。
      - 対象そのものが変わったときだけ書き換える。
    x-bad-examples:
      - value: 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。
        reason: 仕様を冒頭リードに記載している。仕様は各項目へ分ける
  prerequisites:
    type: array
    title: 前提
    description: 全分類に共通の前提（言語ランタイム・パッケージマネージャ・認証済みのツール）。
    x-used-by:
      - 実行で、コマンドを実行する前にランタイム・パッケージマネージャ・認証を揃える。
    x-heading: 前提
    x-shape: list
    items:
      type: string
  categories:
    type: array
    title: 分類
    description: 分類ごとのセクション。
    x-used-by:
      - 実行で、コマンドを探すときに分類ごとの節を参照する。
      - 生成で、分類ごとの節にする。
    x-rules:
      - 初期構築では全ての分類を作る。
      - コマンドは差分が該当した実装・テスト作成の担当が確定させ、確定させるまでは `commands` を `未確定` にする。
      - テストと静的検査以外のセクションは `commands` か `refs` のどちらかを持つ。
    x-shape: sections
    x-key: name
    x-unique-in-kind: true
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          title: 分類
          x-used-by:
            - 生成で、節の見出しにする。
            - 設計で、ほかの設計書の参照から分類を指す。
          enum:
          - 環境構築（クローン直後）
          - 取り込み後の追従（pull 後）
          - 依存の追加・更新・削除
          - 起動・停止
          - テスト
          - 静的検査
          - ビルド・生成
          - 取り込み前の検査
          - 管理作業
        prerequisites:
          type: array
          title: 前提
          description: この分類のコマンドを実行する前に満たしておくこと（先に実行する分類・起動しておくもの・環境変数）。
          x-used-by:
            - 実行で、分類のコマンドを実行する前に、先に実行する分類・起動しておくもの・環境変数を揃える。
          x-shape: list
          items:
            type: string
        commands:
          $ref: common.schema.yaml#/$defs/markdown
          title: コマンド
          description: 実行の順序どおりに並べたコマンドのコードブロック（`bash`）。
          x-used-by:
            - 実行で、記載の順にコマンドを実行する。
          x-rules:
            - 複数あるときは番号つきの手順にし、各コマンドの前に何をするかを 1 行で添える。
            - 記載できるまでは `未確定` にする。
            - 既に他のページが持つコマンドはコピーせず `refs` で指し、このページだけが持つコマンドを `commands` に記載する。
            - テストと静的検査のセクションはコマンドを持たず、`refs` でテスト実行方法を指す。
        effects:
          type: string
          title: 料金・副作用・所要時間
          description: 料金・外へ書き込む副作用・長い所要時間があるコマンドは、そのとおりに明記する。
          x-used-by:
            - 実行で、実行の前に料金・副作用・所要時間からユーザーの確認が要るかを判断する。
        verification:
          type: object
          title: 確認した記録
          description: 記載したコマンドを実行して確認したか。実行できないもの（副作用・権限、または規約『開発時の従量課金APIの実行』の「比べる」の工程でユーザーへ回す料金）は、確認していないことと理由を残す。
          x-used-by:
            - 実行で、実行の前にコマンドが確認済みかを判断する。
            - レビューで、確認していないコマンドに理由があるかを確認する。
          x-shape: attributes
          additionalProperties: false
          required:
          - state
          properties:
            state:
              type: string
              title: 状態
              x-used-by:
                - 実行で、実行の前に確認済みのコマンドかを判断する。
              enum:
              - 済
              - 未確認
            date:
              type: string
              title: 確認日
              description: '`YYYY-MM-DD`。状態が `済` のときに記載する。'
              x-used-by:
                - 保守で、確認した記録が古くなっていないかを判断する。
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
            detail:
              type: string
              title: 確認内容
              description: 確認した内容か、確認していない理由。状態が `未確認` のときは理由を記載する。
              x-used-by:
                - 実行で、確認していないコマンドを実行してよいかを判断する。
          allOf:
          - if:
              properties:
                state:
                  const: 済
            then:
              required:
              - date
            else:
              required:
              - detail
        refs:
          type: array
          title: 参照
          description: 他のページが持つコマンドの原本。テストのセクションはテスト実行方法（`TP-1#`）を、静的検査のセクションはその `lint` 層（`TP-1#layers[lint]`）を指す。
          x-used-by:
            - 実行で、テスト・静的検査のコマンドを原本のテスト実行方法から参照する。
          items:
            $ref: common.schema.yaml#/$defs/ref
        decisions:
          type: array
          title: 検討事項
          description: 根拠になった話し合いの記録の検討事項の ID。
          x-used-by:
            - 生成で、話し合いの記録の検討事項へのリンクにする。
            - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
          items:
            $ref: common.schema.yaml#/$defs/decision
      allOf:
      - if:
          properties:
            name:
              enum:
              - テスト
              - 静的検査
        then:
          required:
          - refs
        else:
          anyOf:
          - required:
            - commands
          - required:
            - refs
  refs:
    type: array
    title: 関連
    x-used-by:
      - 生成で、関連する設計書へのリンクにする。
      - レビューで、関連する設計書をたどって食い違いを確認する。
    items:
      $ref: common.schema.yaml#/$defs/ref
  decisions:
    type: array
    title: 検討事項
    description: 根拠になった話し合いの記録の検討事項の ID。
    x-used-by:
      - 生成で、話し合いの記録の検討事項へのリンクにする。
      - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
    items:
      $ref: common.schema.yaml#/$defs/decision
  notes:
    $ref: common.schema.yaml#/$defs/notes
    x-heading: 補足
    x-shape: sections
examples:
- id: CMD-1
  title: 開発コマンド
  lead: 開発で使用するコマンドの、分類ごとの前提・順序・コマンド・確認した記録。
  prerequisites:
  - Python 3.12 と uv
  categories:
  - name: 環境構築（クローン直後）
    commands: |-
      1. 依存を lock どおりに入れる

      ```bash
      uv sync --frozen
      ```
    effects: 数分かかる（依存のダウンロード）
    verification:
      state: 済
      date: '2026-01-15'
      detail: 空の作業ツリーで実行して依存が入ることを確認した
  - name: テスト
    refs:
    - TP-1#
  - name: 静的検査
    refs:
    - TP-1#layers[lint]
  - name: 管理作業
    commands: |-
      ```bash
      uv run python scripts/migrate_users.py
      ```
    effects: 本番の DB へ書き込む（戻せない）
    verification:
      state: 未確認
      detail: 本番の DB へ書き込むため走らせていない
