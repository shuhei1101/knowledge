$schema: https://json-schema.org/draft/2020-12/schema
title: データフロー
description: |-
  1 つのデータがシステムをどう流れるか（DFD）。
  図は各レベルのノードと辺から生成する。
x-rules:
  - 1 ファイル = データ 1 つにする。
  - 実装の関数とは 1:1 に対応させない。
  - データ一覧の各データに DFD を作るかは判定表『データフローを作る条件』で決める。
x-kind: dataflow
x-folder: docs/dataflow
x-id-prefix: DF
x-cross: dictionary
type: object
additionalProperties: false
required:
- id
- title
- levels
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
  title:
    type: string
    title: タイトル
    description: '`データフロー: {データ名}`。'
    x-used-by:
      - 生成で、ページの見出しにする。
      - dev-docs の検索で、文書の名前にする。
    pattern: '^データフロー: .+$'
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 対象を 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - dev-docs の検索で、文書の概要文にする。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。
      - 対象そのものが変わったときだけ書き換える。
    x-bad-examples:
      - value: 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。
        reason: 仕様を冒頭リードに記載している。仕様は各項目へ分ける
  source:
    type: string
    title: 発生源
    description: 外部エンティティかシステムの中の処理。
    x-used-by:
      - レビューで、データの発生源が図の Level 0 の外部の相手と一致するかを確認する。
  sink:
    type: string
    title: 出口
    description: 外部エンティティかデータストア。
    x-used-by:
      - レビューで、データの出口が図の Level 0 の外部の相手・データストアと一致するかを確認する。
  levels:
    type: array
    title: 図
    description: Level 0（外部の境界）と Level 1（主要な処理とデータストア）は必須。Level 2 は複雑な処理だけ。
    x-used-by:
      - 生成で、レベルごとのデータフロー図にする。
      - 実装で、処理とデータストアの間で受け渡すデータを参照する。
    x-shape: sections
    x-key: name
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - diagram
      properties:
        name:
          type: string
          title: レベル
          description: '`Level 0` / `Level 1` / `Level 2: {親の処理}の分解`。'
          x-used-by:
            - 生成で、図の見出しにする。
        description:
          $ref: common.schema.yaml#/$defs/markdown
          title: 説明
          x-used-by:
            - 生成で、図の説明にする。
        diagram:
          $ref: common.schema.yaml#/$defs/flowchart
          title: 図
          description: ノードの `kind` で外部の相手・処理・データストアを分けた図。
          x-used-by:
            - 生成で、データフロー図にする。
          x-rules:
            - 辺のラベルに流れるデータの名前を記載する。
            - 処理は動詞句、データは名詞で記載する。
            - 1 図の処理は 3〜7 個にする。
            - 信頼境界は枠で描く。
          x-shape: diagram
          x-diagram: dataflow
  dictionary:
    type: array
    title: データ辞書
    description: 処理の境界を越える主要な流れだけ。
    x-used-by:
      - 実装で、処理の境界を越えるデータの構造にする。
      - レビューで、信頼境界を越える流れの脅威と対策を確認する。
    x-heading: データ辞書
    x-shape: table
    x-key: name
    x-unique-in-kind: true
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - from
      - to
      - structure
      properties:
        name:
          type: string
          title: データフロー名
          x-used-by:
            - 設計で、図の矢印のラベルと流れを対応させる。
        from:
          type: string
          title: 発生元
          x-used-by:
            - レビューで、図の矢印の元と一致するかを確認する。
        to:
          type: string
          title: 到達先
          x-used-by:
            - レビューで、図の矢印の先と一致するかを確認する。
        structure:
          type: string
          title: 構造
          description: ペイロードの型（`{name, email}`）。
          x-used-by:
            - 実装で、受け渡すデータの型にする。
        crosses_boundary:
          type: boolean
          title: 信頼境界を越える
          x-used-by:
            - レビューで、脅威の検討が要る流れかを判断する。
        sensitivity:
          type: string
          title: 機密の区分
          x-used-by:
            - 実装で、暗号化・マスク・ログへの出力の可否を決める。
          enum:
          - 個人情報
          - 機密
        threats:
          type: array
          title: 脅威
          description: 信頼境界を越える流れの STRIDE の脅威。
          x-used-by:
            - 実装で、脅威ごとの対策を入れる。
            - レビューで、信頼境界を越える流れに脅威の検討があるかを確認する。
          items:
            type: string
            enum:
            - なりすまし
            - 改ざん
            - 否認
            - 情報漏えい
            - サービス拒否
            - 権限昇格
        volume:
          type: string
          title: 頻度と量
          x-used-by:
            - 実装で、処理の方式（一括・逐次）と上限の値を決める。
        notes:
          type: string
          title: 補足
          x-used-by:
            - 実装で、流れの前提・制約を参照する。
  refs:
    type: array
    title: 関連
    x-used-by:
      - 生成で、関連する設計書へのリンクにする。
      - レビューで、関連する設計書をたどって食い違いを確認する。
    items:
      $ref: common.schema.yaml#/$defs/ref
  decisions:
    type: array
    title: 検討事項
    description: 根拠になった話し合いの記録の検討事項の ID。
    x-used-by:
      - 生成で、話し合いの記録の検討事項へのリンクにする。
      - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
    items:
      $ref: common.schema.yaml#/$defs/decision
  notes:
    $ref: common.schema.yaml#/$defs/notes
    x-heading: 補足
    x-shape: sections
examples:
- id: DF-1
  title: 'データフロー: 問い合わせメッセージ'
  lead: '`問い合わせメッセージ` がシステムを流れる過程。'
  source: 問い合わせ者
  sink: 問い合わせ DB とサポート担当
  levels:
  - name: Level 0
    diagram:
      nodes:
      - id: USER
        label: 問い合わせ者
        kind: actor
      - id: S
        label: 問い合わせ処理システム
        kind: process
      - id: SUP
        label: サポート担当
        kind: actor
      edges:
      - from: USER
        to: S
        label: 問い合わせメッセージ
      - from: S
        to: SUP
        label: 問い合わせ通知
  - name: Level 1
    diagram:
      nodes:
      - id: USER
        label: 問い合わせ者
        kind: actor
      - id: P1
        label: 1. 受付
        kind: process
      - id: P2
        label: 2. 保存
        kind: process
      - id: DB
        label: 問い合わせ DB
        kind: store
      - id: P3
        label: 3. 通知
        kind: process
      - id: SUP
        label: サポート担当
        kind: actor
      edges:
      - from: USER
        to: P1
        label: 問い合わせメッセージ
      - from: P1
        to: P2
        label: 検証済みメッセージ
      - from: P2
        to: DB
        label: 問い合わせレコード
      - from: P2
        to: P3
        label: 保存完了イベント
      - from: P3
        to: SUP
        label: 通知ペイロード
      frame:
        label: '信頼境界: システム'
        nodes:
        - P1
        - P2
        - DB
        - P3
  dictionary:
  - name: 問い合わせメッセージ
    from: 問い合わせ者
    to: 1. 受付
    structure: '{name, email, subject, body}'
    crosses_boundary: true
    sensitivity: 個人情報
    threats:
    - 改ざん
    - 情報漏えい
  - name: 問い合わせレコード
    from: 2. 保存
    to: 問い合わせ DB
    structure: '{id, name, email, subject, body, received_at}'
