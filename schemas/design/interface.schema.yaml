examples:
- id: IF-1
  title: タスク作成
  entry:
    kind: operation
    value: '`create_task`（サービス層の公開関数）'
  lead: タイトルとサブタスクを受け取ってタスクを永続化し、採番済みのタスクを返却する。
  test_file: tests/integration/task/test_create_task.py
  request:
  - name: title
    type: str
    required: true
    location: argument
    description: タスク名
    constraints: 100 文字以内
  exceptions:
  - name: なし（正常終了）
    condition: 作成成功
  - name: ValidationError
    condition: タイトルが 100 文字を超える
  constraints:
  - item: タイムアウト
    constraint: 制限なし
  flows:
  - name: 正常系
    summary: タスクを作成する
    setup:
    - name: Mock
      description: DB を stub に差し替え
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as クライアント
        participant IF as create_task
        participant DB as DB

        C->>IF: title
        IF->>DB: タスクを保存
        IF-->>C: 採番済みのタスク
      ```

      <!-- /map -->
    expected:
    - 採番済みのタスクが返る
    - DB にタスクが 1 件ある
    test: test_normal
- id: IF-2
  title: テストの全件実行
  entry:
    kind: trigger
    value: '`.github/workflows/test.yml`（手動の起動 `workflow_dispatch`）'
  lead: 指定された層のテストの全件をランナーで実行し、ログを成果物に上げる。
  test_file: tests/e2e/workflow/test_test_yml.py
  permissions: '`contents: read`'
  exclusivity: '同じブランチ・同じ層の実行は、古い方を止める（`concurrency` の `group: test-${{ github.ref }}-${{ inputs.layer }}`・`cancel-in-progress: true`）'
  request:
  - name: layer
    type: unit / integration
    required: true
    location: argument
    description: 全件を回す層
  constraints:
  - item: ランナー
    constraint: '`ubuntu-latest`'
  overall_flow: |-
    <!-- map -->

    ```mermaid
    flowchart TD
      s([workflow_dispatch で起動]) --> a[ブランチを取得する]
      a -- 成功 --> b[Python と uv を入れる]
      a -->|"失敗（if: always()）"| d[ログを成果物に上げる]
      b -- 成功 --> c[層の全件を回す]
      b -->|"失敗（if: always()）"| d
      c -->|"成功・失敗（if: always()）"| d
      d --> q{全ての step が成功したか}
      q -- YES --> ok([成功])
      q -- NO --> ng([失敗])
    ```

    <!-- /map -->
  flows:
  - name: 正常系
    summary: 層の全件が pass して成功で終わる
    setup:
    - name: Mock
      description: なし（本物の GitHub Actions で回す）
    - name: ブランチ
      description: 全件が pass するブランチ
      notes: '`layer: unit`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: unit で起動]) --> a[ブランチを取得する] --> b[Python と uv を入れる]
        b -- 成功 --> c[層の全件を回す]
        c -- 全件 pass --> d[ログを成果物に上げる] --> e([成功])
      ```

      <!-- /map -->
    expected:
    - 実行の結論が `success`
    - 成果物 `test-log` がある
    test: test_normal
  - name: 異常系（道具の導入に失敗・failure）
    summary: 道具の導入に失敗し、層の全件を回さずに失敗で終わる
    setup:
    - name: Mock
      description: なし（本物の GitHub Actions で回す）
    - name: ブランチ
      description: 存在しない Python のバージョンを指定したブランチ
      notes: '`layer: unit`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([layer: unit で起動]) --> a[ブランチを取得する] --> b[Python と uv を入れる]
        b -- 失敗 --> d[ログを成果物に上げる] --> e([失敗])
      ```

      <!-- /map -->
    expected:
    - 実行の結論が `failure`
    - step「層の全件を回す」の結論が `skipped`
    test: test_error_when_setup_fails
