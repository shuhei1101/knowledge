$schema: https://json-schema.org/draft/2020-12/schema
title: インターフェース定義
description: 1 操作（API エンドポイント / MCP ツール / 画面操作 / 周期・イベント起動の処理）の入出力・制約・正常系と異常系のフロー。
x-rules:
  - 1 ファイル = 1 操作 = 結合テストの 1 ファイルにする。
  - 外部依存は Mock 前提で記載する。
x-kind: interface
x-folder: docs/interface
x-id-prefix: IF
x-cross: flows
x-test-file: test_file
x-test-file-optional: true
type: object
additionalProperties: false
not:
  required:
    - status_codes
    - exceptions
allOf:
- if:
    properties:
      read_only:
        const: true
    required:
    - read_only
  then:
    properties:
      destructive: false
required:
- id
- title
- entry
- flows
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  tags:
    $ref: common.schema.yaml#/$defs/tags
  aliases:
    $ref: common.schema.yaml#/$defs/aliases
  title:
    type: string
    title: タイトル
    description: 日本語の論理名。ファイル名に合わせる。
    x-used-by:
      - 生成で、ページの見出しにする。
      - project-index の検索で、文書の名前にする。
  entry:
    type: object
    title: 入口
    description: 操作の入口。冒頭のメタ情報の行に出す。
    x-used-by:
      - 実装で、操作の入口（エンドポイント・MCP ツール・画面操作・周期の処理）を作る。
      - 生成で、冒頭のメタ情報の行にする。
    x-rules:
      - 入口が `trigger` の GitHub Actions の workflow は、`value` に workflow のファイルの `on` のイベントと、起動を絞る条件（`branches`・`paths`・`types`・`schedule` の `cron` 等）を記載する。
    x-shape: attributes
    additionalProperties: false
    required:
    - kind
    - value
    properties:
      kind:
        type: string
        title: 種類
        description: '`endpoint`（HTTP を返却する。値はメソッド + パス）/ `mcp_tool`（MCP ツール名）/ `operation`（呼び出す識別子 + 境界の種別）/ `trigger`（起動契機 + 周期）/ `screen`（画面の実装ファイル）。'
        x-used-by:
          - 実装で、入口の種類（HTTP・MCP・画面・周期・イベント）を決める。
        enum:
        - endpoint
        - mcp_tool
        - operation
        - trigger
        - screen
      value:
        type: string
        title: 値
        description: 操作を指す値。
        x-used-by:
          - 実装で、メソッドとパス・ツール名・識別子にする。
        examples:
          - POST /auth/signin
          - add_labels
          - heartbeat 周期（`heartbeat_interval_sec` ごと）
      api:
        type: string
        title: 呼び出し API
        description: '`screen` のときの呼び出す API（Mock）。'
        x-used-by:
          - 結合テストで、画面が呼ぶ API の Mock にする。
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 対象を 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - project-index の検索で、文書の概要文にする。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。
      - 対象そのものが変わったときだけ書き換える。
    x-bad-examples:
      - value: 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。
        reason: 仕様を冒頭リードに記載している。仕様は各項目へ分ける
  test_file:
    type: string
    title: 対応テストファイル
    description: 対応する結合テストのファイル（`tests/integration/{サブシステム名}/…`。規約『V字モデル』）。
    x-used-by:
      - テストで、結合テストを作るファイルにする。
      - 検査で、テストのファイルがあるかを確認する。
    pattern: ^tests/.+
  identifier:
    type: string
    title: 識別子
    description: 操作の識別子（OpenAPI の operationId に該当する）。
    x-used-by:
      - 実装で、ハンドラ・ツールの関数の名前にする。
  permissions:
    type: string
    title: 必要な権限
    description: 操作に要る権限・ロール。
    x-used-by:
      - 実装で、操作の前に確認する権限にする。
      - テストで、権限が無いときのケースにする。
  idempotent:
    type: boolean
    title: 冪等
    description: 同じ要求を繰り返しても結果が変わらないか。
    x-used-by:
      - 実装で、同じ要求の繰り返しを受け付けるか、重複を弾くかを決める。
      - 実装で、呼び出し元が失敗したときに再試行してよいかを決める。
  read_only:
    type: boolean
    title: 読み取りだけ
    description: 外へ書き込まず、読み取るだけの操作か。
    x-used-by:
      - 実装で、MCP ツールの `annotations` の `readOnlyHint` にする。
  destructive:
    type: boolean
    title: 破壊的
    description: 既存のデータを削除・上書きする操作か。
    x-used-by:
      - 実装で、MCP ツールの `annotations` の `destructiveHint` にする。
  side_effects:
    $ref: common.schema.yaml#/$defs/markdown
    title: 副作用
    description: 書き込むデータ・外部への送信。
    x-used-by:
      - 実装で、書き込むデータと外部への送信にする。
      - テストで、副作用を確認する項目にする。
  callers:
    type: array
    title: 呼び出し元
    description: 操作を呼ぶシナリオ・設計書の項目。
    x-used-by:
      - レビューで、呼び出し元のシナリオと入出力が一致するかを確認する。
    items:
      $ref: common.schema.yaml#/$defs/ref
  exclusivity:
    type: string
    title: 排他
    description: 同時に呼ばれたときの扱い。
    x-used-by:
      - 実装で、同時に呼ばれたときのロック・キューにする。
    x-rules:
      - 入口が `trigger` の GitHub Actions の workflow は、workflow のファイルの `concurrency` の `group` と `cancel-in-progress` を記載する。
  request:
    type: array
    title: リクエスト
    description: 呼び出し元から受け取る引数。周期・イベントで自分から動く処理は持たない。
    x-used-by:
      - 実装で、引数の型と検証にする。
      - 生成で、リクエストの表にする。
    x-rules:
      - 入口が `trigger` の GitHub Actions の workflow は、workflow のファイルの `on.workflow_dispatch.inputs` の名前・型・必須・既定値と一致させる。
    x-heading: リクエスト
    x-shape: table
    x-key: name
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - type
      - description
      - required
      properties:
        name:
          type: string
          title: パラメータ
          description: オブジェクトの子は `parent.child`、配列の要素の子は `parent[].child` で 1 フィールド = 1 要素に展開する。
          x-used-by:
            - 実装で、引数・フィールドの名前にする。
        type:
          type: string
          title: 型
          description: 実装言語の型名。取りうる値が限られるときはリテラルの列挙。
          x-used-by:
            - 実装で、引数の型にする。
        required:
          type: boolean
          title: 必須
          description: 省けない引数なら `true`。
          x-used-by:
            - 実装で、無いときにエラーにするかを決める。
            - テストで、引数を省いたときのケースにする。
        default:
          type: string
          title: デフォルト
          description: 省略時の値。省略できて既定の値が無いときは `なし（{省略時の挙動}）`。
          x-used-by:
            - 実装で、引数を省いたときの値にする。
        location:
          type: string
          title: 配置場所
          description: HTTP のパラメータの配置場所。MCP ツール・関数の引数は `argument`。
          x-used-by:
            - 実装で、値を取り出す場所（パス・クエリ・ヘッダ・本文・引数）にする。
          enum:
          - path
          - query
          - header
          - cookie
          - body
          - argument
        description:
          type: string
          title: 説明
          description: 引数が何を表すか。
          x-used-by:
            - 呼び出し元の実装で、指定する値を決める。
        constraints:
          type: string
          title: 制限
          description: そのフィールド単体にかかる上限・形式。
          x-used-by:
            - 実装で、フィールドの検証にする。
            - テストで、制限の境界のケースにする。
        format:
          type: string
          title: 形式
          description: 文字列の形式（`date-time` / `uri` 等）。
          x-used-by:
            - 実装で、文字列の形式の検証にする。
        example:
          type: string
          title: 例
          description: 値の具体例。
          x-used-by:
            - テストで、要求の値にする。
        nullable:
          type: boolean
          title: 空を許す
          description: '`null` を受け付けるなら `true`。'
          x-used-by:
            - 実装で、`null` を受け付けるかを決める。
        notes:
          type: string
          title: 補足
          description: 引数の前提（ほかの引数との組み合わせ 等）。
          x-used-by:
            - 実装で、引数の組み合わせと前提を、受け取ったときの検証にする。
        status:
          $ref: common.schema.yaml#/$defs/status
  request_example:
    $ref: common.schema.yaml#/$defs/markdown
    title: リクエスト例
    description: ネスト構造の実形が分かる代表 1 ケース（JSON のコードブロック）。
    x-used-by:
      - テストで、要求の本文の見本にする。
  response:
    type: array
    title: レスポンス
    description: 返却する値のフィールド。1 要素 = 1 フィールド。
    x-used-by:
      - 実装で、戻り値の型にする。
      - 呼び出し元の実装で、受け取る値を決める。
      - 生成で、レスポンスの表にする。
    x-heading: レスポンス
    x-shape: table
    x-key: name
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - type
      - description
      properties:
        name:
          type: string
          title: フィールド
          description: オブジェクトの子は `parent.child`、配列の要素の子は `parent[].child` で 1 フィールド = 1 要素に展開する。
          x-used-by:
            - 実装で、戻り値のフィールドの名前にする。
        type:
          type: string
          title: 型
          description: 実装言語の型名。取りうる値が限られるときはリテラルの列挙。
          x-used-by:
            - 実装で、フィールドの型にする。
        description:
          type: string
          title: 説明
          description: フィールドの値が何を表すか。
          x-used-by:
            - 呼び出し元の実装で、値で分岐する条件を決める。
        constraints:
          type: string
          title: 制限
          description: そのフィールド単体にかかる上限・形式。
          x-used-by:
            - テストで、戻り値の上限・形式を確認する。
        format:
          type: string
          title: 形式
          description: 文字列の形式（`date-time` / `uri` 等）。
          x-used-by:
            - 実装で、文字列の形式にする。
        example:
          type: string
          title: 例
          description: 値の具体例。
          x-used-by:
            - テストで、期待する戻り値の見本にする。
        notes:
          type: string
          title: 補足
          description: フィールドの前提（返らない条件 等）。
          x-used-by:
            - 実装で、フィールドを返却しない条件を決める。
  response_example:
    $ref: common.schema.yaml#/$defs/markdown
    title: レスポンス例
    description: JSON のコードブロック。
    x-used-by:
      - テストで、戻り値の見本にする。
  response_notes:
    $ref: common.schema.yaml#/$defs/markdown
    title: レスポンスの注記
    description: 冪等性など表に載らない挙動（`> [!NOTE]` のコールアウトで出す）。
    x-used-by:
      - 呼び出し元の実装で、表に載らない挙動（並び順・空のときの値 等）に合わせて受け取る処理を決める。
  status_codes:
    type: array
    title: ステータスコード
    description: HTTP を返却する操作の出口。
    x-used-by:
      - 実装で、返却するステータスコードにする。
      - テストで、ステータスコードごとのケースにする。
    x-rules:
      - 異常の行は異常系のフローと 1:1 にする。
    x-heading: ステータスコード
    x-shape: table
    x-key: code
    items:
      type: object
      additionalProperties: false
      required:
      - code
      - condition
      properties:
        code:
          type: string
          title: ステータスコード
          description: ステータスコード・終了コード。
          x-used-by:
            - 実装で、返却するステータスコードにする。
        condition:
          type: string
          title: 発生条件
          description: そのコードを返却する条件。
          x-used-by:
            - 実装で、そのコードを返却する条件にする。
        notes:
          type: string
          title: 補足
          description: コードの前提（応答の本文 等）。
          x-used-by:
            - 実装で、そのコードを返却するときの応答の本文を決める。
  exceptions:
    type: array
    title: 例外
    description: HTTP を返却しない操作の出口。異常の行は異常系のフローと 1:1。
    x-used-by:
      - 実装で、送出する例外にする。
      - テストで、異常系のケースにする。
    x-heading: 例外
    x-shape: table
    x-key: name
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - condition
      properties:
        name:
          type: string
          title: 例外
          description: 送出する例外のクラス名。正常終了の行は `なし（正常終了）`。
          x-used-by:
            - 実装で、例外のクラスにする。
        condition:
          type: string
          title: 発生条件
          description: 例外を送出する条件。
          x-used-by:
            - 実装で、例外を送出する条件にする。
        notes:
          type: string
          title: 補足
          description: 例外の前提（呼び出し元での扱い 等）。
          x-used-by:
            - 実装で、例外を送出する前に済ませる処理（ロールバック・ログ）を決める。
  error_format:
    $ref: common.schema.yaml#/$defs/markdown
    title: エラーの形式
    description: エラー応答の形式（RFC 9457 の type・title・status・detail 等）。
    x-used-by:
      - 実装で、エラー応答の形式にする。
      - 呼び出し元の実装で、エラーの解釈方法にする。
  constraints:
    type: array
    title: 制約
    description: 操作全体にかかる制約。関連する項目は制限を設けないときも行を配置する。
    x-used-by:
      - 実装で、タイムアウト・認可・レート制限・上限などの値にする。
      - テストで、制約の境界のケースにする。
    x-heading: 制約
    x-shape: table
    x-key: item
    items:
      type: object
      additionalProperties: false
      required:
      - item
      - constraint
      properties:
        item:
          type: string
          title: 項目
          description: タイムアウト・認可・レート制限・合計サイズ・許可値の定義・周期・閾値など。
          x-used-by:
            - レビューで、制約の項目に漏れが無いかを確認する。
        constraint:
          type: string
          title: 制約
          description: 設けないときも `制限なし` と記載する。
          x-used-by:
            - 実装で、制約の値と処理にする。
        decided_by:
          $ref: common.schema.yaml#/$defs/ref
          title: 決定値
          description: 値の出所になる非機能要件の項目。
          x-used-by:
            - 実装で、値を非機能要件の決定値と同じにする。
            - レビューで、値が非機能要件の決定値と一致するかを確認する。
        notes:
          type: string
          title: 補足
          description: 制約の前提（守れないときの扱い 等）。
          x-used-by:
            - 実装で、制約を守れないときの扱いを決める。
  overall_flow:
    $ref: common.schema.yaml#/$defs/map
    title: 全体の流れ
    description: 入口が `trigger` の GitHub Actions の workflow だけが持つ。全ての分岐と結末を描いた mdmark の map の図（Mermaid の `flowchart`）。
    x-used-by:
      - レビューで、分岐ごとの結末にフローがあるかを確認する。
      - 生成で、フローの前の図にする。
    x-rules:
      - step は、workflow のファイルの step の `name` で記載する。
      - 分岐の判定は、workflow のファイルの `if` の条件と、step の成否で記載する。
    x-heading: 全体の流れ
  flows:
    type: array
    title: フロー
    description: 正常系と異常系のフロー。1 フロー = 結合テストの 1 ケース。
    x-used-by:
      - 結合テストで、フローごとのテスト関数にする。
      - 設計で、モジュール構成の処理の順と呼ぶ相手を決める。
    x-rules:
      - 並びは正常 → 異常にする。
      - フロー一覧は各フローの名前と概要から生成する。
    x-heading: フロー
    x-shape: sections
    x-key: name
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - summary
      - setup
      - flow
      - expected
      properties:
        name:
          type: string
          title: フロー名
          description: 正常の基本形は `正常系`。正常な結末が条件で分かれるときは `正常系（{条件}）`、異常は `異常系（{原因}・{ステータスか例外名}）`。
          x-used-by:
            - 結合テストで、テスト関数の名前に対応させる。
            - 設計で、ほかの設計書の参照（`flows[正常系]`）からフローを指す。
          pattern: ^(正常系|異常系)(（.+）)?$
        summary:
          $ref: common.schema.yaml#/$defs/summary
          title: 概要
          description: 1 行でフローの中身を要約する。
          x-used-by:
            - 生成で、フローの一覧の説明にする。
            - 結合テストで、関数の docstring の要約にする。
        setup:
          type: array
          title: セットアップ
          description: 事前に要るデータ・状態と、分岐・異常を決定的に誘発する入力。
          x-used-by:
            - 結合テストで、前提を作る Factory・Mock にする。
          x-rules:
            - '`Mock` の行（差し替える依存。差し替えないときも `なし（…）`）を必ず配置する。'
          x-heading: セットアップ
          x-shape: table
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - description
            properties:
              name:
                type: string
                title: セットアップ
                description: 前提を作る Factory 関数名か状態の名前。
                x-used-by:
                  - 結合テストで、呼ぶ Factory 関数か作る状態にする。
                x-rules:
                  - '`Mock` の行を必ず配置する。'
              description:
                type: string
                title: 説明
                description: その前提の意味・役割・依存関係。Mock の行は差し替える依存と応答。
                x-used-by:
                  - 結合テストで、前提の役割と Mock の応答にする。
              notes:
                type: string
                title: 補足
                description: 引数に指定する重要な値・分岐を決定的に誘発する値。
                x-used-by:
                  - 結合テストで、分岐を決定的に発生させる値にする。
        flow:
          $ref: common.schema.yaml#/$defs/map
          title: フロー
          description: mdmark の map の図。Mermaid の `sequenceDiagram`（入口が `trigger` の GitHub Actions の workflow は `flowchart`）。1 図 = 結末 1 本の一本道。
          x-used-by:
            - 設計で、モジュール構成の処理の順と呼ぶ相手を決める。
            - 生成で、シーケンス図・フローチャートにする。
          x-rules:
            - '`<!-- map -->` から `<!-- /map -->` の範囲に、```mermaid のコードブロックを 1 つ記載する。'
            - 登場人物は呼び出し元（バックエンドは `participant クライアント`、フロントエンドは `actor ユーザー`）・インターフェース・外部システムの境界だけにする。
            - 読み取りと応答は点線 `-->>`、書き込み・操作は実線 `->>` にする。
            - '`flowchart` は、そのフローで通る step だけを並べ、分岐でどちらへ進んだかを矢印のラベルに記載する。'
            - '`flowchart` の step は、workflow のファイルの step の `name` で記載する。'
          x-heading: フロー
        expected:
          type: array
          title: 期待値
          description: フローの終了時点で外部から観測できる状態・戻り値。1 要素 = 1 つの確認項目。
          x-used-by:
            - 結合テストで、確認する項目にする。
          x-heading: 期待値
          x-shape: list
          minItems: 1
          items:
            type: string
        test:
          $ref: common.schema.yaml#/$defs/test
          description: 対応する結合テストの関数（`正常系` → `test_normal` / `正常系（{条件}）` → `test_normal_when_{条件}` / `異常系（{条件}）` → `test_error_when_{条件}`。`{条件}` は英訳）。
          x-test-function: true
        refs:
          type: array
          title: 関連
          description: 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。
          x-used-by:
            - 生成で、関連する設計書へのリンクにする。
            - レビューで、関連する設計書をたどって食い違いを確認する。
          items:
            $ref: common.schema.yaml#/$defs/ref
        decisions:
          type: array
          title: 検討事項
          description: 根拠になった話し合いの記録の検討事項の ID。
          x-used-by:
            - 生成で、話し合いの記録の検討事項へのリンクにする。
            - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
          items:
            $ref: common.schema.yaml#/$defs/decision
        notes:
          $ref: common.schema.yaml#/$defs/notes
  refs:
    type: array
    title: 関連
    description: 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。
    x-used-by:
