$schema: https://json-schema.org/draft/2020-12/schema
title: 外部API
description: |-
  利用する外部 API 1 つにつき 1 ファイル。
  そのプロジェクトで使用するエンドポイントだけを公式ドキュメントから抜き出す。
x-kind: external_api
x-folder: docs/external-api
x-id-prefix: API
x-cross: endpoints
type: object
additionalProperties: false
required:
- id
- title
- version
- auth
- endpoints
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
  title:
    type: string
    title: タイトル
    description: API 名。ファイル名に合わせる。
    x-used-by:
      - 生成で、ページの見出しにする。
      - dev-docs の検索で、文書の名前にする。
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: API が何をするものかを 1〜3 行で要約する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - dev-docs の検索で、文書の概要文にする。
    x-rules:
      - 自プロジェクトでの用途は記載しない。
      - 初回に記載した内容のまま保ち、後から情報を追加しない。
  used_in:
    type: array
    title: 使用箇所
    description: 呼び出す境界層のパス（リポジトリの直下から）。
    x-used-by:
      - 保守で、API の仕様が変わったときに、修正する境界層のファイルを探す。
    items:
      type: string
  verification:
    type: object
    title: 動作確認
    description: 動かして確認したか。
    x-used-by:
      - 実装で、実装の前に API を動かして確認済みかを判断する。
      - レビューで、確認していない API に理由があるかを確認する。
    x-shape: attributes
    additionalProperties: false
    required:
    - state
    properties:
      state:
        type: string
        title: 状態
        x-used-by:
          - 実装で、実装の前に動作確認が要るかを判断する。
        enum:
        - 済
        - 未確認
      date:
        type: string
        title: 確認日
        description: '`YYYY-MM-DD`。'
        x-used-by:
          - 保守で、確認の記録が古くなっていないかを判断する。
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      detail:
        type: string
        title: 確認内容
        description: 確認した内容か、確認できない理由。
        x-used-by:
          - 実装で、確認していない API を使用してよいかを判断する。
  version:
    type: object
    title: 現在のバージョン情報
    x-used-by:
      - 実装で、指定する API のバージョンにする。
    x-heading: 現在のバージョン情報
    x-shape: attributes
    additionalProperties: false
    required:
    - api_version
    - checked_on
    properties:
      api_version:
        type: string
        title: API バージョン
        description: header 指定型か URL 埋め込み型かを添える。
        x-used-by:
          - 実装で、ヘッダか URL に入れる API のバージョンにする。
      checked_on:
        type: string
        title: 確認日
        x-used-by:
          - 保守で、バージョンの情報が古くなっていないかを判断する。
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      sunset:
        type: string
        title: 廃止予定日
        x-used-by:
          - 計画で、廃止の前に移行する作業を計画する。
  base_urls:
    type: array
    title: ベース URL
    x-used-by:
      - 実装で、環境ごとの接続先の設定にする。
    x-shape: table
    x-key: env
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - env
      - url
      properties:
        env:
          type: string
          title: 環境
          x-used-by:
            - 実装で、接続先を切り替える環境にする。
        url:
          type: string
          title: URL
          x-used-by:
            - 実装で、接続先の URL にする。
  official_url:
    type: string
    title: 公式 URL
    x-used-by:
      - 実装で、仕様を確認するときに公式のページを開く。
  docs_url:
    type: string
    title: 公式ドキュメント
    x-used-by:
      - 実装で、仕様を確認するときに公式のドキュメントを開く。
  terms_url:
    type: string
    title: 利用規約
    x-used-by:
      - レビューで、使い方が利用規約に反しないかを確認する。
  contact:
    type: string
    title: 連絡先
    x-used-by:
      - 保守で、障害・不具合を問い合わせる先にする。
  status_page:
    type: string
    title: 障害情報の確認先
    x-used-by:
      - 保守で、呼び出しが失敗したときに提供元の障害かを確認する。
  auth:
    type: object
    title: 認証セットアップ
    x-used-by:
      - 実装で、認証の処理にする。
    x-heading: 認証セットアップ
    additionalProperties: false
    required:
    - method
    properties:
      method:
        type: string
        title: 認証方式
        description: Bearer / API Key Header / OAuth2 / JWT 等。
        x-used-by:
          - 実装で、認証の方式にする。
      scopes:
        type: array
        title: スコープ
        x-used-by:
          - 実装で、要求するスコープにする。
          - レビューで、スコープが必要な範囲に収まっているかを確認する。
        items:
          type: string
      steps:
        $ref: common.schema.yaml#/$defs/markdown
        title: 取得手順
        description: キー取得の公式ページの URL と番号付きの手順。
        x-used-by:
          - 反映作業で、認証の値を発行する作業の手順にする。
      env_vars:
        type: array
        title: 環境変数
        description: '`.env.example` と一致させる。'
        x-used-by:
          - 実装で、認証の値を読む環境変数にする。
        items:
          type: string
      usage:
        $ref: common.schema.yaml#/$defs/markdown
        title: リクエスト時の利用
        description: コードブロック。
        x-used-by:
          - 実装で、要求に認証の値を付ける方法にする。
  rate_limits:
    type: array
    title: レートリミット
    x-used-by:
      - 設計で、非機能要件のレート制限の値の出所にする。
      - 実装で、呼び出しの間隔と同時実行数を決める。
    x-heading: レートリミット
    x-shape: table
    items:
      type: object
      additionalProperties: false
      required:
      - target
      - limit
      properties:
        target:
          type: string
          title: 対象
          x-used-by:
            - 実装で、上限が掛かる単位（API キー・エンドポイント）にする。
        limit:
          type: string
          title: 上限
          description: 単位（RPM / TPM 等）を付ける。
          x-used-by:
            - 実装で、呼び出しの上限にする。
        notes:
          type: string
          title: 補足
          x-used-by:
            - 実装で、上限の前提を参照する。
  retry:
    $ref: common.schema.yaml#/$defs/markdown
    title: 再試行
    description: 超過時のステータスと再試行の方針（Retry-After・Exponential Backoff 等）。
    x-used-by:
      - 実装で、上限を超えたときの再試行の処理にする。
  pricing:
    type: array
    title: 課金単価
    x-used-by:
      - 実行で、実行の前に料金を見積もってユーザーの確認が要るかを判断する。
    x-heading: 課金単価
    x-shape: table
    items:
      type: object
      additionalProperties: false
      required:
      - target
      - price
      properties:
        target:
          type: string
          title: 対象
          x-used-by:
            - 実行で、料金を見積もる単位にする。
        price:
          type: string
          title: 単価
          x-used-by:
            - 実行で、料金の見積もりにする。
        notes:
          type: string
          title: 補足
          x-used-by:
            - 実行で、料金の見積もりの前提を参照する。
  pricing_url:
    type: string
    title: 課金の公式ページ
    description: 課金の公式ページの URL。
    x-used-by:
      - 保守で、単価が変わっていないかを公式のページで確認する。
    x-rules:
      - 課金単価を記載するときは必ず持つ。
  error_format:
    $ref: common.schema.yaml#/$defs/markdown
    title: エラー応答の形式
    x-used-by:
      - 実装で、エラー応答を読む処理にする。
  pagination:
    $ref: common.schema.yaml#/$defs/markdown
    title: ページングの方式
    x-used-by:
      - 実装で、全件を取る繰り返しの処理にする。
  timeout:
    type: string
    title: タイムアウト
    x-used-by:
      - 実装で、呼び出しのタイムアウトにする。
  endpoints:
    type: array
    title: エンドポイント
    description: このプロジェクトで使用するエンドポイント。一覧の表は各エンドポイントのメソッド・パス・用途から生成する。
    x-used-by:
      - 実装で、呼ぶエンドポイントの要求と応答にする。
      - 生成で、エンドポイントの一覧の表と節にする。
    x-heading: エンドポイント
    x-shape: sections
    x-key: name
    x-unique-in-kind: true
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - method
      - path
      - summary
      - status_codes
      properties:
        name:
          type: string
          title: 名前
          description: '`{METHOD} {パス}`。パスはベース URL からの相対。'
          x-used-by:
            - 設計で、ほかの設計書の参照（`endpoints[GET /tasks]`）からエンドポイントを指す。
            - 生成で、節の見出しにする。
        method:
          type: string
          title: メソッド
          x-used-by:
            - 実装で、要求のメソッドにする。
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - HEAD
          - OPTIONS
        path:
          type: string
          title: パス
          x-used-by:
            - 実装で、要求のパスにする。
        summary:
          $ref: common.schema.yaml#/$defs/summary
          title: 用途
          description: 1 行の用途。
          x-used-by:
            - 生成で、エンドポイントの一覧の用途にする。
        operation_id:
          type: string
          title: 操作の識別子
          x-used-by:
            - 実装で、SDK の関数の名前を参照する。
        tags:
          type: array
          title: 分類タグ
          x-used-by:
            - 実装で、公式のドキュメントからエンドポイントの分類を参照する。
          items:
            type: string
        permissions:
          type: string
          title: 必要な権限
          x-used-by:
            - 実装で、要求する権限・スコープにする。
        idempotent:
          type: boolean
          title: 冪等
          x-used-by:
            - 実装で、失敗したときに再試行してよいかを決める。
        description:
          $ref: common.schema.yaml#/$defs/markdown
          title: 説明
          x-used-by:
            - 実装で、エンドポイントの挙動を参照する。
        request:
          type: array
          title: リクエスト
          x-used-by:
            - 実装で、要求の組み立てにする。
          x-heading: リクエスト
          x-shape: table
          x-key: name
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - type
            - description
            properties:
              name:
                type: string
                title: パラメータ
                description: オブジェクトの子は `parent.child`、配列の要素の子は `parent[].child`。
                x-used-by:
                  - 実装で、要求のパラメータの名前にする。
              type:
                type: string
                title: 型
                description: 取りうる値が限られるときは列挙し、各値の意味は補足に記載する。
                x-used-by:
                  - 実装で、パラメータの型にする。
              required:
                type: boolean
                title: 必須
                x-used-by:
                  - 実装で、省けないパラメータにする。
              default:
                type: string
                title: 既定
                description: 任意のパラメータの省略時の値。
                x-used-by:
                  - 実装で、省いたときに使われる値を参照する。
              description:
                type: string
                title: 説明
                x-used-by:
                  - 実装で、パラメータに入れる値を決める。
              constraints:
                type: string
                title: 制限
                x-used-by:
                  - 実装で、送る前の検証にする。
              notes:
                type: string
                title: 補足
                x-used-by:
                  - 実装で、パラメータの前提を参照する。
              location:
                type: string
                title: 配置場所
                x-used-by:
                  - 実装で、パラメータを入れる場所（パス・クエリ・ヘッダ・本文）にする。
                enum:
                - path
                - query
                - header
                - cookie
                - body
              format:
                type: string
                title: 形式
                x-used-by:
                  - 実装で、文字列の形式にする。
              example:
                type: string
                title: 例
                x-used-by:
                  - テストで、Mock の要求の値にする。
              nullable:
                type: boolean
                title: 空を許す
                x-used-by:
                  - 実装で、`null` を送ってよいかを決める。
              status:
                $ref: common.schema.yaml#/$defs/status
        request_example:
          $ref: common.schema.yaml#/$defs/markdown
          title: リクエスト例
          description: JSON のコードブロック。body を持たないときはリクエストライン。
          x-used-by:
            - テストで、Mock の要求の見本にする。
        response:
          type: array
          title: レスポンス
          description: 別のエンドポイントと同形のときは持たず、`same_as` に記載する。
          x-used-by:
            - 実装で、応答を読む型にする。
          x-heading: レスポンス
          x-shape: table
          x-key: name
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - type
            - description
            properties:
              name:
                type: string
                title: フィールド
                description: 返らないことがあるフィールドは `field?` と記載し、条件を補足に記載する。
                x-used-by:
                  - 実装で、応答のフィールドの名前にする。
              type:
                type: string
                title: 型
                x-used-by:
                  - 実装で、フィールドの型にする。
              description:
                type: string
                title: 説明
                x-used-by:
                  - 実装で、値の意味を参照する。
              constraints:
                type: string
                title: 制限
                x-used-by:
                  - 実装で、応答の値の上限・形式を参照する。
              notes:
                type: string
                title: 補足
                x-used-by:
                  - 実装で、返らないことがあるフィールドの条件を参照する。
        same_as:
          type: string
          title: 同形のレスポンス
          description: レスポンスが同形のエンドポイントの名前。
          x-used-by:
            - 実装で、同じ形の応答の型を使い回す。
        response_headers:
          type: array
          title: 応答のヘッダー
          x-used-by:
            - 実装で、応答のヘッダを読む処理にする。
          x-shape: table
          x-key: name
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - description
            properties:
              name:
                type: string
                title: ヘッダー
                x-used-by:
                  - 実装で、読むヘッダの名前にする。
              description:
                type: string
                title: 説明
                x-used-by:
                  - 実装で、ヘッダの値の意味を参照する。
              notes:
                type: string
                title: 補足
                x-used-by:
                  - 実装で、ヘッダの前提を参照する。
        response_example:
          $ref: common.schema.yaml#/$defs/markdown
          title: レスポンス例
          description: JSON のコードブロック。
          x-used-by:
            - テストで、Mock の応答にする。
        status_codes:
          type: array
          title: ステータスコード
          description: 正常・異常とも網羅する。
          x-used-by:
            - 実装で、ステータスコードごとの処理にする。
            - テストで、Mock が返すステータスコードのケースにする。
          x-heading: ステータスコード
          x-shape: table
          x-key: code
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - condition
            properties:
              code:
                type: string
                title: ステータスコード
                x-used-by:
                  - 実装で、分岐するステータスコードにする。
              condition:
                type: string
                title: 発生条件
                x-used-by:
                  - 実装で、そのコードが返る条件を参照する。
              notes:
                type: string
                title: 補足
                description: 再試行の方針など。
                x-used-by:
                  - 実装で、再試行の方針にする。
        refs:
          type: array
          title: 関連
          x-used-by:
            - 生成で、関連する設計書へのリンクにする。
            - レビューで、関連する設計書をたどって食い違いを確認する。
          items:
            $ref: common.schema.yaml#/$defs/ref
        decisions:
          type: array
          title: 検討事項
          description: 根拠になった話し合いの記録の検討事項の ID。
          x-used-by:
            - 生成で、話し合いの記録の検討事項へのリンクにする。
            - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
          items:
            $ref: common.schema.yaml#/$defs/decision
        reason:
          $ref: common.schema.yaml#/$defs/reason
        status:
          $ref: common.schema.yaml#/$defs/status
        visibility:
          $ref: common.schema.yaml#/$defs/visibility
        notes:
          $ref: common.schema.yaml#/$defs/notes
  issues:
    type: array
    title: 不具合一覧
    description: 仕様どおりに使用しても期待どおり動かない事象。
    x-used-by:
      - 実装で、仕様どおりに動かない事象を避ける。
      - 生成で、不具合一覧の節にする。
    x-rules:
      - こちらの使用方法の誤りだったものは記載しない。
      - 解消を確認したら削除する。
    x-heading: 不具合一覧
    x-shape: sections
    x-key: title
    items:
      type: object
      additionalProperties: false
      required:
      - title
      - summary
      - occurred_on
      - description
      - workarounds
      properties:
        title:
          type: string
          title: タイトル
          x-used-by:
            - 生成で、節の見出しにする。
        summary:
          $ref: common.schema.yaml#/$defs/summary
          title: 概要
          description: 1 行で事象を要約する。
          x-used-by:
            - 生成で、不具合の一覧の説明にする。
        occurred_on:
          type: string
          title: 発生日
          description: 事象を確認した日（`YYYY-MM-DD`）。再確認して続いていたら更新する。
          x-used-by:
            - 保守で、事象が今も続いているかを確認し直す時期を判断する。
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        state:
          type: string
          title: 状態
          x-used-by:
            - 保守で、回避策を入れたままにするかを判断する。
          enum:
          - 未解決
          - 回避策あり
          - 解消済み
        description:
          $ref: common.schema.yaml#/$defs/markdown
          title: 概要
          description: 何が起きるかを事実だけで記載する。
          x-used-by:
            - 実装で、起きる事象を参照する。
        conditions:
          type: array
          title: 条件
          description: 再現する状況。
          x-used-by:
            - 実装で、事象を避ける条件にする。
            - テストで、事象を再現するケースにする。
          x-shape: list
          items:
            type: string
        workarounds:
          type: array
          title: 対処法
          x-used-by:
            - 実装で、回避策を入れる。
          x-heading: 対処法
          x-shape: table
          x-key: method
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - method
            - result
            properties:
              method:
                type: string
                title: 方法
                description: 回避策が無いときは `回避策なし`。
                x-used-by:
                  - 実装で、回避策の方法にする。
              result:
                type: string
                title: 結果
                description: 得られるものと、本来やりたかったことからのずれ。
                x-used-by:
                  - 実装で、回避策を選ぶときに得られるものとずれを比べる。
              recommended:
                type: boolean
                title: 推奨
                description: 最初に試す 1 案だけ。
                x-used-by:
                  - 実装で、最初に試す回避策にする。
        upstream_issue:
          type: string
          title: 上流の Issue
          description: 上流の Issue の URL。
          x-used-by:
            - 保守で、上流で解消したかを確認する先にする。
        fixed_in:
          type: string
          title: 解消版
          description: 解消したバージョン。達したら回避策を削除する候補になる。
          x-used-by:
            - 保守で、解消した版へ上げた後に回避策を外す。
        refs:
          type: array
          title: 関連
          x-used-by:
            - 生成で、関連する設計書へのリンクにする。
            - レビューで、関連する設計書をたどって食い違いを確認する。
          items:
            $ref: common.schema.yaml#/$defs/ref
        decisions:
          type: array
          title: 検討事項
          description: 根拠になった話し合いの記録の検討事項の ID。
          x-used-by:
            - 生成で、話し合いの記録の検討事項へのリンクにする。
            - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
          items:
            $ref: common.schema.yaml#/$defs/decision
        notes:
          $ref: common.schema.yaml#/$defs/notes
  refs:
