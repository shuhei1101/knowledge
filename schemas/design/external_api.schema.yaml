examples:
- id: API-1
  title: OpenAI
  lead: OpenAI が提供する LLM・埋め込み・音声の API。
  used_in:
  - integrations/openai/
  verification:
    state: 済
    date: '2026-01-10'
    detail: チャットの応答を 1 回取得した
  version:
    api_version: v1（URL 埋め込み型）
    checked_on: '2026-07-24'
  base_urls:
  - env: 本番
    url: https://api.openai.com/v1
  official_url: https://openai.com/api/
  docs_url: https://platform.openai.com/docs/api-reference
  auth:
    method: Bearer トークン（API キー）
    steps: |-
      1. https://platform.openai.com/api-keys を開く
      2. `Create new secret key` で API キーを作る
      3. 作ったキーを記録する（再表示できない）
    env_vars:
    - OPENAI_API_KEY
  rate_limits:
  - target: gpt-4o-mini
    limit: 500 RPM / 200,000 TPM
    notes: tier 1
  retry: 超過すると 429 を返却する。Exponential Backoff（1 秒 → 2 秒 → 4 秒）で最大 3 回再試行する。
  pricing:
  - target: gpt-4o-mini
    price: 入力 $0.150 / 出力 $0.600（1M トークン）
  pricing_url: https://openai.com/api/pricing/
  endpoints:
  - name: POST /chat/completions
    method: POST
    path: /chat/completions
    summary: チャット形式の LLM の応答を作る
    request:
    - name: model
      type: string
      required: true
      location: body
      description: モデル名
    - name: messages
      type: '{ role, content }[]'
      required: true
      location: body
      description: チャットの履歴
    - name: messages[].role
      type: '"system" or "user" or "assistant"'
      required: true
      location: body
      description: 送信者の役割
    - name: temperature
      type: number
      required: false
      default: '1'
      location: body
      description: 応答のばらつき
      constraints: 0〜2
    request_example: |-
      ```json
      {"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "Hello"}]}
      ```
    response:
    - name: choices[].message.content
      type: string
      description: 生成されたテキスト
    - name: usage.prompt_tokens
      type: number
      description: 入力のトークン数
    status_codes:
    - code: '200'
      condition: 正常
    - code: '401'
      condition: API キーが不正
    - code: '429'
      condition: レートリミットの超過
      notes: Exponential Backoff で最大 3 回再試行する
