$schema: https://json-schema.org/draft/2020-12/schema
title: シナリオ
description: 単一ユースケース（ユーザーの 1 操作）または複合ユースケース（単一ユースケースの連鎖）の正常・異常シナリオ。
x-rules:
  - 1 ファイル = 1 ユースケース = テストの 1 ファイルにする。
  - 外部 API は Mock 前提で記載する。
  - 既存の流用・既存の修正・新規の単一・新規の複合のどれで記載するかは判定フローチャート『シナリオ』で決める。
x-kind: scenario
x-folder: docs/scenario
x-id-prefix: SC
x-cross: scenarios
x-test-file: test_file
x-test-file-optional: true
type: object
additionalProperties: false
required:
- id
- title
- scenarios
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  title:
    type: string
    title: タイトル
    description: 単一ユースケースは機能名、複合ユースケースは業務シナリオの論理名。ファイル名に合わせる。
    x-used-by:
      - 生成で、ページの見出しにする。
      - dev-docs の検索で、文書の名前にする。
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 対象を 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - dev-docs の検索で、文書の概要文にする。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。
      - 対象そのものが変わったときだけ書き換える。
    x-bad-examples:
      - value: 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。
        reason: 仕様を冒頭リードに記載している。仕様は各項目へ分ける
  test_file:
    type: string
    title: 対応テストファイル
    description: |-
      `tests/e2e/{単一ユースケース,複合ユースケース}/…`（規約『V字モデル』）。
    x-used-by:
      - テストで、E2E テストを作るファイルにする。
      - 検査で、テストのファイルがあるかを確認する。
      - 計画で、作業 PR の影響するユースケースから E2E の対象を集める。
    pattern: ^tests/.+
  primary_actor:
    type: string
    title: 主アクター
    description: シナリオで目的を達成する主体。
    x-used-by:
      - E2E テストで、操作する主体にする。
      - レビューで、主アクターの目的が満たされるかを確認する。
  stakeholders:
    type: array
    title: 関係者と関心
    description: シナリオの結果に関心を持つ関係者と、その関心。1 要素 = 1 関係者。
    x-used-by:
      - レビューで、関係者ごとの関心が成功時の保証で守られるかを確認する。
    x-shape: table
    x-key: name
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - interest
      properties:
        name:
          type: string
          title: 関係者
          description: 関係者の名前。
          x-used-by:
            - レビューで、関心を守る相手にする。
        interest:
          type: string
          title: 関心
          description: 関係者がシナリオの結果に求めること。
          x-used-by:
            - レビューで、成功時の保証と失敗しても守ることに関心が入っているかを確認する。
  trigger:
    type: string
    title: きっかけ
    description: シナリオを始めるきっかけ（利用者の操作・時刻・イベント）。
    x-used-by:
      - E2E テストで、シナリオを始める操作にする。
      - 設計で、インターフェース定義の入口の種類を決める。
  preconditions:
    type: array
    title: 事前条件
    description: シナリオを始める前に成り立っている状態。1 要素 = 1 つの状態。
    x-used-by:
      - E2E テストで、事前に用意する状態にする。
    x-shape: list
    items:
      type: string
  success_guarantee:
    $ref: common.schema.yaml#/$defs/markdown
    title: 成功時に保証すること
    x-used-by:
      - E2E テストで、正常シナリオの終わりに確認する状態にする。
  minimal_guarantee:
    $ref: common.schema.yaml#/$defs/markdown
    title: 失敗しても守ること
    x-used-by:
      - E2E テストで、異常シナリオの終わりに確認する状態にする。
  frequency:
    type: string
    title: 頻度
    description: シナリオが起きる頻度（1 日あたりの回数 等）。
    x-used-by:
      - 設計で、非機能要件の性能の値を決める前提にする。
  priority:
    type: string
    title: 優先度
    description: シナリオを実現する優先度。
    x-used-by:
      - 計画で、着手の順を決める。
  reading:
    $ref: common.schema.yaml#/$defs/markdown
    title: 置き換え
    description: 1 ファイルで複数のレイヤー・役割を代表するときの置き換えの表。
    x-used-by:
      - E2E テストで、1 つのファイルで代表させたレイヤー・役割へ置き換える。
    x-heading: 置き換え
  scenarios:
    type: array
    title: シナリオ
    description: 正常・異常のシナリオを並列に並べる。異常の無い機能は `異常シナリオ` を持たない。
    x-used-by:
      - E2E テストで、シナリオごとのテスト関数にする。
      - 生成で、シナリオごとのセクションにする。
    x-heading: シナリオ
    x-shape: sections
    x-key: name
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - setup
      - flow
      - expected
      properties:
        name:
          type: string
          title: シナリオ名
          description: 基本形は `正常シナリオ`。正常な結末が条件で分かれるときは `正常シナリオ（{条件}）`、異常は `異常シナリオ（{条件}）`。
          x-used-by:
            - E2E テストで、テスト関数の名前に対応させる。
            - 設計で、ほかの設計書の参照（`scenarios[正常シナリオ]`）からシナリオを指す。
          pattern: ^(正常|異常)シナリオ(（.+）)?$
        setup:
          type: array
          title: セットアップ
          description: 事前に要るデータ・状態と、分岐・異常を決定的に誘発する入力。
          x-used-by:
            - E2E テストで、前提を作る Factory・Mock にする。
          x-rules:
            - '`Mock` の行（差し替える依存。差し替えないときも `なし（…）`）を必ず配置する。'
          x-heading: セットアップ
          x-shape: table
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - description
            properties:
              name:
                type: string
                title: セットアップ
                description: 前提を作る Factory 関数名か状態の名前。
                x-used-by:
                  - E2E テストで、呼ぶ Factory 関数か作る状態にする。
                x-rules:
                  - '`Mock` の行を必ず配置する。'
              description:
                type: string
                title: 説明
                description: その前提の意味・役割・依存関係。Mock の行は差し替える依存と応答。
                x-used-by:
                  - E2E テストで、前提の役割と Mock の応答にする。
              notes:
                type: string
                title: 補足
                description: 引数に指定する重要な値・分岐を決定的に誘発する値。
                x-used-by:
                  - E2E テストで、分岐を決定的に発生させる値にする。
        flow:
          $ref: common.schema.yaml#/$defs/map
          title: フロー
          description: mdmark の map の図。単一ユースケースは `sequenceDiagram`、複合ユースケースは単一ユースケースをノードとして連鎖させる `flowchart TD`。
          x-used-by:
            - 設計で、インターフェース定義の操作の流れと関わる相手を決める。
            - 生成で、シーケンス図・フロー図にする。
          x-rules:
            - '`<!-- map -->` から `<!-- /map -->` の範囲に、```mermaid のコードブロックを 1 つ記載する。'
            - 1 図 = 結末 1 本の一本道にする。
            - ユーザー視点で観測できる境界まで記載する。
            - 複合ユースケースのノード名は `{UC名}:{シナリオ名}` にする。
          x-heading: フロー
        expected:
          type: array
          title: 期待値
          description: フローの終了時点で外部から観測できる状態・戻り値。1 要素 = 1 つの確認項目。
          x-used-by:
            - E2E テストで、確認する項目にする。
          x-heading: 期待値
          x-shape: list
          minItems: 1
          items:
            type: string
        test:
          $ref: common.schema.yaml#/$defs/test
          description: 対応するテスト関数（`正常シナリオ` → `test_normal` / `正常シナリオ（{条件}）` → `test_normal_when_{条件}` / `異常シナリオ（{条件}）` → `test_error_when_{条件}`。`{条件}` は英訳）。
          x-test-function: true
        uses:
          type: array
          title: 使用する単一ユースケース
          description: 複合ユースケースのノードが指す単一ユースケースのシナリオ。
          x-used-by:
            - テストで、複合ユースケースの E2E がつなぐ単一ユースケースのシナリオを決める。
            - 検査で、指すシナリオが実在するかを確認する。
          items:
            $ref: common.schema.yaml#/$defs/ref
        refs:
          type: array
          title: 関連
          description: 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。
          x-used-by:
            - 生成で、関連する設計書へのリンクにする。
            - レビューで、関連する設計書をたどって食い違いを確認する。
          items:
            $ref: common.schema.yaml#/$defs/ref
        decisions:
          type: array
          title: 検討事項
          description: 根拠になった話し合いの記録の検討事項の ID。
          x-used-by:
            - 生成で、話し合いの記録の検討事項へのリンクにする。
            - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
          items:
            $ref: common.schema.yaml#/$defs/decision
        notes:
          $ref: common.schema.yaml#/$defs/notes
  refs:
    type: array
    title: 関連
    description: 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。
    x-used-by:
      - 生成で、関連する設計書へのリンクにする。
      - レビューで、関連する設計書をたどって食い違いを確認する。
    items:
      $ref: common.schema.yaml#/$defs/ref
  decisions:
    type: array
    title: 検討事項
    description: 根拠になった話し合いの記録の検討事項の ID。
    x-used-by:
      - 生成で、話し合いの記録の検討事項へのリンクにする。
      - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
    items:
      $ref: common.schema.yaml#/$defs/decision
  notes:
    $ref: common.schema.yaml#/$defs/notes
    x-heading: 補足
    x-shape: sections
examples:
- id: SC-1
  title: プロフィール編集
  lead: ログイン中のユーザーが自身のプロフィール（氏名・自己紹介・アバター画像）を編集する単一ユースケース。
  test_file: tests/e2e/単一ユースケース/test_profile_edit.py
  primary_actor: ログイン中のユーザー
  trigger: プロフィール編集画面を開く
  preconditions:
  - ユーザーがログインしている
  scenarios:
  - name: 正常シナリオ
    setup:
    - name: Mock
      description: なし（実環境で実行）
    - name: createUser
      description: ログイン中のユーザー A
    - name: createProfile
      description: ユーザー A に紐づくプロフィール
      notes: '`visible: true`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant FE as 画面（フロントエンド）
        participant BE as バックエンド API
        participant DB as DB

        U->>FE: プロフィール編集画面を開く
        FE-->>BE: プロフィールを取得
        BE-->>FE: 初期値
        U->>FE: 氏名・自己紹介を編集して保存
        FE->>BE: プロフィールを更新
        BE->>DB: 更新
        BE-->>FE: 200 OK
        FE-->>U: 詳細画面へ遷移
      ```

      <!-- /map -->
    expected:
    - プロフィール表示画面に編集後の氏名・自己紹介が表示されている
    - DB の該当プロフィールが編集後の値になっている
    test: test_normal
  - name: 異常シナリオ（5MB 超の画像アップロード）
    setup:
    - name: Mock
      description: なし（実環境で実行）
    - name: createUser
      description: ログイン中のユーザー A
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as ユーザー
        participant FE as 画面（フロントエンド）

        U->>FE: 5MB 超の画像を選択
        FE->>FE: 入力の検証に失敗
        FE-->>U: 選択欄の下にエラーを表示
      ```

      <!-- /map -->
    expected:
    - エラーが表示され、画像が選ばれていない
    test: test_error_when_image_too_large
