$schema: https://json-schema.org/draft/2020-12/schema
title: 非機能要件
description: 外部コンポーネントの制約を踏まえてアプリとして守る値（コンポーネントをまたぐ要件だけ）。
x-rules:
  - 1 プロジェクト 1 ファイルにする。
  - 1 コンポーネント内で閉じる要件は、その変更の計画に記載する（判定フローチャート『非機能要件のレイヤー』）。
x-kind: nonfunctional
x-folder: docs/nonfunctional
x-id-prefix: NFR
x-cross: requirements
type: object
additionalProperties: false
required:
- id
- title
- requirements
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  title:
    type: string
    title: タイトル
    description: '`非機能要件`。'
    x-used-by:
      - 生成で、ページの見出しにする。
      - dev-docs の検索で、文書の名前にする。
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 対象を 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - dev-docs の検索で、文書の概要文にする。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。
      - 対象そのものが変わったときだけ書き換える。
    x-bad-examples:
      - value: 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。
        reason: 仕様を冒頭リードに記載している。仕様は各項目へ分ける
  requirements:
    type: array
    title: 一覧
    description: 外部の制約から逆算したアプリの値。一覧の表は各要素から生成する。
    x-used-by:
      - 実装で、守る値を参照する。
      - 生成で、非機能要件の一覧の表と要素ごとのページにする。
    x-rules:
      - 決まっていない項目も同じ一覧に配置し、決定値を `未確定` にする。
      - 未確定だった項目が決まったら同じ要素を書き換える。
    x-heading: 一覧
    x-shape: sections
    x-key: name
    x-unique-in-kind: true
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - category
      - external_constraint
      - source_kind
      - value
      - rationale
      properties:
        id:
          type: string
          title: ID
          description: 設計書の中で一意な要素の ID。1 要素 1 ページにするときのページの ID になる。
          x-used-by:
            - 生成で、要素を 1 ページにするときのページの ID にする。
            - 設計で、ほかの設計書の参照から要素を指す。
          x-rules:
            - 並びの順に `NFR-{番号}` を振る。
            - 新しく追加する要素には、既にある番号の最大の次を振る。
            - 並べ替えても変えない。
          pattern: "^[A-Za-z0-9_-]+$"
          examples:
            - NFR-1
        name:
          type: string
          title: 項目
          description: 何についての値か。1 項目 = 1 要素。
          x-used-by:
            - 生成で、表の行の名前とページの見出しにする。
        english_name:
          type: string
          title: 英語名
          description: テスト関数・ファイルの名前に使用する。
          x-used-by:
            - テストで、テストの関数・ファイルの名前にする。
          pattern: ^[a-z0-9_]+$
        category:
          type: string
          title: カテゴリ
          description: |-
            性能 / レート制限 / 可用性 / 耐障害 / セキュリティ / コスト / 保守性 / 動作環境 等。
            動作環境は対応端末・OS・ブラウザ・画面サイズ・入力方式・通信を 1 項目ずつ配置する。
          x-used-by:
            - 生成で、一覧の分類にする。
            - レビューで、カテゴリごとに要件の漏れが無いかを確認する。
        external_constraint:
          type: string
          title: 外部の制約
          description: 外部が示す上限・下限・保証値。自主基準は `制限なし`、分からなければ `未確定`。
          x-used-by:
            - レビューで、決定値が外部の制約を超えていないかを確認する。
        source_kind:
          type: string
          title: 出所種別
          description: 6 種類を 1 つずつ突き合わせ、どれにも該当しないときだけ `制限なし`。
          x-used-by:
            - レビューで、外部の制約の出所を全ての種類と突き合わせたかを確認する。
          enum:
          - 外部 API の制限
          - 外部ライブラリの制限
          - 実行基盤の制限
          - PC 性能
          - ユーザー要望
          - 制限なし
          - 未確定
        source:
          type: string
          title: 出所
          description: |-
            外部の制約を記載した設計書の参照・資料の URL・ユーザーの回答コメントの URL。
            設計書の参照は `{ID}#{項目のパス}` で記載する。
          x-used-by:
            - レビューで、外部の制約の出所をたどって値を確認する。
        value:
          type: string
          title: 決定値
          description: 実装とテストが参照する値。まだ決められないときは `未確定`。
          x-used-by:
            - 実装で、上限・待ち・回数などの値にする。
            - テストで、境界の値にする。
        unit:
          type: string
          title: 単位
          x-used-by:
            - 実装で、値の単位にする。
        rationale:
          type: string
          title: 根拠
          description: 外部の制約そのままでない理由。未確定なら何が分かれば決まるか。
          x-used-by:
            - レビューで、外部の制約そのままでない値の根拠を確認する。
            - 設計で、値を変えるときに根拠が今も成り立つかを判断する。
        measurement:
          type: string
          title: 測り方
          x-used-by:
            - テストで、値を測る方法にする。
        test_file:
          type: string
          title: 対応テスト
          description: 非機能要件テストのファイル（`tests/nfr/test_{英語名}.py`）。測れない項目は持たない（規約『V字モデル』）。
          x-used-by:
            - テストで、非機能要件のテストを作るファイルにする。
            - 検査で、テストのファイルがあるかを確認する。
          pattern: ^tests/.+
        verification:
          type: object
          title: 確認の記録
          description: 確認した結果。
          x-used-by:
            - レビューで、実機で確認した結果を確認する。
          x-heading: 確認の記録
          x-shape: attributes
          additionalProperties: false
          required:
          - device
          - version
          - date
          - result
          properties:
            device:
              type: string
              title: 端末
              description: 確認した端末（OS・ブラウザなど）。
              x-used-by:
                - 保守で、確認した端末と違う端末で確認し直すかを判断する。
            version:
              type: string
              title: バージョン
              description: 確認した端末のバージョン（OS・ブラウザのバージョン）。
              x-used-by:
                - 保守で、確認したバージョンと違うバージョンで確認し直すかを判断する。
            date:
              type: string
              title: 確認日
              description: '`YYYY-MM-DD`。'
              x-used-by:
                - 保守で、確認の記録が古くなっていないかを判断する。
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
            result:
              type: string
              title: 合否
              x-used-by:
                - 実装で、不合格の要件を修正する対象にする。
              enum:
              - 合格
              - 不合格
            detail:
              type: string
              title: 確認内容
              description: 不合格のとき、起きた事象。
              x-used-by:
                - 実装で、不合格の要件を修正するときに起きた事象を参照する。
          examples:
          - device: Windows 11 の PC の Edge
            version: Edge 140
            date: '2026-10-05'
            result: 合格
        overflow:
          $ref: common.schema.yaml#/$defs/markdown
          title: 超過時の挙動
          description: 決定値を超えたときに何が起きるか（分割 / 待機 / リトライ / エラー）。
          x-used-by:
            - 実装で、値を超えたときの処理（分割・待機・リトライ・エラー）にする。
            - テストで、値を超えたときのケースにする。
          x-rules:
            - 黙って切り捨てない。
          x-heading: 超過時の挙動
        breakdown:
          type: array
          title: 内訳
          description: 決定値に至る内訳（外部の上限からの差し引き、または内側の値の合計）。内訳の無い項目は持たない。
          x-used-by:
            - レビューで、決定値が内訳から導けるかを確認する。
          x-heading: 内訳
          x-shape: table
          x-key: part
          items:
            type: object
            additionalProperties: false
            required:
            - part
            - value
            properties:
              part:
                type: string
                title: 区分
                x-used-by:
                  - レビューで、内訳の区分に漏れが無いかを確認する。
              value:
                type: string
                title: 値
                x-used-by:
                  - レビューで、内訳の値の合計・差し引きが決定値と一致するかを確認する。
              notes:
                type: string
                title: 補足
                description: なぜその値か。
                x-used-by:
                  - レビューで、内訳の値の根拠を確認する。
        tests:
          type: array
          title: 非機能要件テスト
          description: 測れない項目・未確定の項目は持たない。
          x-used-by:
            - テストで、非機能要件のテストのケースにする。
            - 検査で、テストのファイルに関数があるかを確認する。
          x-heading: 非機能要件テスト
          x-shape: table
          x-key: name
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - summary
            - condition
            - measurement
            - expected
            properties:
              name:
                type: string
                title: テスト名
                description: '`test_{英語名}_when_{条件}`（条件分岐の無い唯一のケースは `test_{英語名}`）。'
                x-used-by:
                  - テストで、テスト関数の名前にする。
                pattern: ^test_[a-z0-9_]+$
                x-test-function: true
              summary:
                type: string
                title: 概要
                x-used-by:
                  - テストで、関数の docstring の要約にする。
              condition:
                type: string
                title: 条件
                description: 入力・負荷・回数を数値で。決定値の境界を 1 行以上入れる。
                x-used-by:
                  - テストで、入力・負荷・回数にする。
              measurement:
                type: string
                title: 測定方法
                x-used-by:
                  - テストで、測定の方法にする。
              expected:
                type: string
                title: 期待値
                description: 合否の判定の基準。
                x-used-by:
                  - テストで、合否を判定する基準にする。
              notes:
                type: string
                title: 補足
                x-used-by:
                  - テストで、ケースの前提を参照する。
        refs:
          type: array
          title: 関連
          x-used-by:
            - 生成で、関連する設計書へのリンクにする。
            - レビューで、関連する設計書をたどって食い違いを確認する。
          items:
            $ref: common.schema.yaml#/$defs/ref
        decisions:
          type: array
          title: 検討事項
          description: 根拠になった話し合いの記録の検討事項の ID。
          x-used-by:
            - 生成で、話し合いの記録の検討事項へのリンクにする。
            - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
          items:
            $ref: common.schema.yaml#/$defs/decision
        status:
          $ref: common.schema.yaml#/$defs/status
        visibility:
          $ref: common.schema.yaml#/$defs/visibility
        notes:
          $ref: common.schema.yaml#/$defs/notes
  refs:
    type: array
    title: 関連
    x-used-by:
      - 生成で、関連する設計書へのリンクにする。
      - レビューで、関連する設計書をたどって食い違いを確認する。
    items:
      $ref: common.schema.yaml#/$defs/ref
  decisions:
    type: array
    title: 検討事項
    description: 根拠になった話し合いの記録の検討事項の ID。
    x-used-by:
      - 生成で、話し合いの記録の検討事項へのリンクにする。
      - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
    items:
      $ref: common.schema.yaml#/$defs/decision
  notes:
    $ref: common.schema.yaml#/$defs/notes
    x-heading: 補足
    x-shape: sections
examples:
- id: NFR-1
  title: 非機能要件
  lead: 外部の制約から逆算したアプリの決定値。
  requirements:
  - id: NFR-1
    name: 入力トークン上限
    english_name: input_limit
    category: 性能
    external_constraint: 100 万トークン
    source_kind: 外部 API の制限
    source: API-2#
    value: 10 万
    unit: トークン
    rationale: 内部のシステムプロンプトと出力枠を差し引く
    measurement: API へ渡ったトークン数を数える
    test_file: tests/nfr/test_input_limit.py
    overflow: |-
      上限を超える入力は送信の前に分割する。
      分割できない単一のメッセージが超えたときは古い履歴から切り詰め、それでも収まらなければエラーにして呼び出し元へ返却する。
    breakdown:
    - part: 外部の上限
      value: 1,000,000
      notes: モデルのコンテキストウィンドウ
    - part: 出力枠
      value: 64,000
      notes: 最大出力トークン
    - part: アプリの決定値
      value: 100,000
      notes: 入力として受け付ける上限
    tests:
    - name: test_input_limit
      summary: 上限ちょうどの入力
      condition: 100,000 トークンの入力を 1 回送る
      measurement: API へ渡ったトークン数
      expected: 分割されずに 1 回で送信される
    - name: test_input_limit_when_over
      summary: 上限を超えた入力
      condition: 100,001 トークンの入力を 1 回送る
      measurement: API へ渡ったトークン数
      expected: 2 回に分かれ、各回が 100,000 以下
  - id: NFR-2
    name: 応答の待ちの上限
    english_name: response_wait_limit
    category: 耐障害
    external_constraint: 制限なし
    source_kind: 制限なし
    value: "30"
    unit: 秒
    rationale: 内側の待ち 2 つの合計に余裕を追加する（規約『資源の値の決め方』の入れ子の待ち）
    measurement: 内側の待ちを両方とも上限まで遅らせた要求を 1 回送り、応答までの時間を測る
    overflow: 上限を超えたら呼び出し元へタイムアウトのエラーを返却する。回復は呼び出し元のリトライで待つ
    breakdown:
    - part: 内側の待ち（外部 API の呼び出し）
      value: "10"
      notes: 外部 API の実測 p99.9 + 余裕
    - part: 内側の待ち（保存）
      value: "10"
      notes: 保存の実測 p99.9 + 余裕
    - part: 余裕
      value: "10"
      notes: 実測が無いため内側の待ちの合計の 50% を仮に設定する
    - part: アプリの決定値
      value: "30"
      notes: 内側の待ちの合計 + 余裕
  - id: NFR-3
    name: 同時接続数
    category: 性能
    external_constraint: 未確定
    source_kind: 未確定
    value: 未確定
    rationale: 想定利用者数が決まる Issue「利用者管理」の要件が確定してから決める
  - id: NFR-4
    name: 対応ブラウザ
    category: 動作環境
    external_constraint: Chrome と Edge の最新版
    source_kind: ユーザー要望
    source: https://github.com/{owner}/{repo}/issues/{番号}#issuecomment-{ID}
    value: Chrome と Edge の最新版
    rationale: 利用者が社内の PC だけで使用するため
    measurement: Chrome と Edge の実機で、全ての画面の操作を最後まで完了できるかを確認する
    verification:
      device: Windows 11 の PC の Edge
      version: Edge 140
      date: '2026-10-05'
      result: 合格
  - id: NFR-5
    name: 最小画面幅
    english_name: min_viewport_width
    category: 動作環境
    external_constraint: "360"
    source_kind: ユーザー要望
    source: https://github.com/{owner}/{repo}/issues/{番号}#issuecomment-{ID}
    value: "360"
    unit: px
    rationale: スマホでは閲覧できれば足りる
    measurement: ブラウザの表示幅を変えて全ての画面を開き、横スクロールの有無を確認する
    test_file: tests/nfr/test_min_viewport_width.py
    tests:
    - name: test_min_viewport_width
      summary: 最小幅での表示
      condition: 表示幅 360px で全ての画面を開く
      measurement: 文書の横幅と表示幅
      expected: 全ての画面で文書の横幅が 360px 以下
- id: NFR-2
  title: 非機能要件
  lead: 外部の制約から逆算したゲームの決定値。
  requirements:
  - id: NFR-1
    name: 対応端末
    category: 動作環境
    external_constraint: Windows の PC と Nintendo Switch
    source_kind: ユーザー要望
    source: https://github.com/{owner}/{repo}/issues/{番号}#issuecomment-{ID}
    value: Windows の PC と Nintendo Switch
    rationale: 企画の工程で決めた販売先
    measurement: 各端末の実機で、タイトル画面から 1 ステージを最後まで遊べるかを確認する
    verification:
      device: Nintendo Switch の実機
      version: システムソフトウェア 19.0.0
      date: '2026-10-05'
      result: 合格
  - id: NFR-2
    name: 入力方式
    english_name: input_devices
    category: 動作環境
    external_constraint: キーボードとゲームパッド
    source_kind: ユーザー要望
    source: https://github.com/{owner}/{repo}/issues/{番号}#issuecomment-{ID}
    value: キーボードとゲームパッド
    rationale: 対応端末の標準の入力に合わせる
    measurement: 論理操作ごとに、割り当てたキーとボタンの入力を送信する
    test_file: tests/nfr/test_input_devices.py
    tests:
    - name: test_input_devices
      summary: 全ての論理操作の割り当て
      condition: 論理操作ごとに、キーボードとゲームパッドの割り当てを 1 回ずつ送信する
      measurement: ゲームが受け取った論理操作
      expected: 全ての論理操作を、どちらの入力からも受け取る
  - id: NFR-3
    name: 通信
    category: 動作環境
    external_constraint: 未確定
    source_kind: 未確定
    value: 未確定
    rationale: オンラインで遊ぶ機能を持つかが企画の工程で決まってから決める
