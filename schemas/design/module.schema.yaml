          x-heading: プロパティ
          x-shape: table
          x-key: name
          items: *id008
        methods:
          type: array
          title: メソッド
          description: インタフェース・抽象クラスの契約のメソッドは引数と戻り値だけを持つ。
          x-used-by:
            - 実装で、クラスのメソッドにする。
