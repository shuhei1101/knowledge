$schema: https://json-schema.org/draft/2020-12/schema
title: モジュール構成
description: |-
  物理ファイル 1 つ分の構成要素（データモデル / クラス / 関数 / 関数型 / 定数 / 画面・コンポーネント / フック / ストア / スタイル）。
  設計書の中を横断する一覧（ユースケース・役割・コンテナ・種別・名前・概要）は、各要素の項目から生成する。
x-rules:
  - 1 ファイル = 物理ファイル 1 つにする。
  - 全ての要素の `container` は同じ物理ファイルを指す。
  - 配置場所は `モジュール構成/{container}.yaml` にする。
  - 分類の構成図と分類全体の決まりは、分類をまとめる設計書に配置する。
  - 分類をまとめる設計書は `モジュール構成/分類/` の下に配置し、要素を持たず `diagrams`・`notes` だけを持つ。
  - ファイルの配置はフォルダ構成の設計書に記載する。
x-kind: module
x-folder: docs/module
x-id-prefix: MOD
x-cross: functions
x-test-file: test_files
x-test-file-optional: true
type: object
additionalProperties: false
required:
- id
- title
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  title:
    type: string
    title: タイトル
    description: '`{サブシステム名} / {分類名}`（物理ファイルの設計書は `{サブシステム名} / {分類名} / {物理ファイルの名前}`）。'
    x-used-by:
      - 生成で、ページの見出しにする。
      - dev-docs の検索で、文書の名前にする。
    pattern: ^.+ / .+$
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 対象を 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - dev-docs の検索で、文書の概要文にする。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。
      - 対象そのものが変わったときだけ書き換える。
    x-bad-examples:
      - value: 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。
        reason: 仕様を冒頭リードに記載している。仕様は各項目へ分ける
  test_files:
    type: array
    title: 対応テストファイル
    description: |-
      属する物理ファイルごとの単体テストのファイル（1 物理ファイル = 1 テストファイル、規約『V字モデル』）。
      テストを作ったときに記入する（設計の時点では空でよい）。
    x-used-by:
      - テストで、単体テストを作るファイルにする。
      - 検査で、テストのファイルと単体テストの関数があるかを確認する。
    maxItems: 1
    items:
      type: string
      pattern: ^tests/.+
  external_test_files:
    type: array
    title: 対応疎通テストファイル
    description: |-
      疎通テスト（`connectivity_tests`）を持つ関数・メソッドの、外部疎通テストのファイル（`tests/external/` の下）。
      疎通テストを作ったときに記入する（設計の時点では空でよい）。
    x-used-by:
      - テストで、外部疎通のテストを作るファイルにする。
      - 検査で、テストのファイルと疎通テストの関数があるかを確認する。
    items:
      type: string
      pattern: ^tests/external/.+
  diagrams:
    type: array
    title: 構成図
    description: 矢印で繋がる塊 1 つ = 1 枚の図。
    x-used-by:
      - 生成で、構成図にする。
      - レビューで、要素どうしの依存の向きを確認する。
    x-rules:
      - 1 枚のノードが 15 を超えるときは観点で分ける。
    x-heading: 構成図
    x-shape: sections
    x-key: name
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - diagram
      properties:
        name:
          type: string
          title: 塊の論理名
          description: 図が 1 枚なら `全体`。
          x-used-by:
            - 実装で、ソースコードの名前にする。
            - 設計で、ほかの設計書の参照（`functions[main]`）から要素を指す。
        diagram:
          $ref: common.schema.yaml#/$defs/mermaid
          title: 図
          description: Mermaid の `classDiagram`。
          x-used-by:
            - 生成で、クラス図にする。
          x-rules:
            - 次の行に `direction` を記載する。
            - 図の中の名前は論理名で記載する。
            - 定数・先頭 `_` の要素と、他の要素と矢印で繋がらない要素は記載しない。
  data_models:
    type: array
    title: データモデル
    description: プロパティ主体の型（dataclass・BaseModel・TypedDict・TS の type 等）。
    x-used-by:
      - 実装で、プロパティ主体の型（dataclass・BaseModel・TypedDict 等）にする。
      - 生成で、要素ごとの節にする。
    x-heading: データモデル
    x-shape: sections
    x-key: name
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - title
      - container
      - summary
      properties:
        name: &id001
          type: string
          title: 物理名
          description: ソースコード上の名前。項目のパスで指すときのキー。
          x-used-by:
            - 実装で、ソースコードの名前にする。
            - 設計で、ほかの設計書の参照（`functions[main]`）から要素を指す。
        title: &id002
          type: string
          title: 論理名
          description: 図と見出しに出す名前。
          x-used-by:
            - 生成で、図と見出しの名前にする。
        container: &id003
          type: string
          title: コンテナ
          description: 所属ファイル。
          x-used-by:
            - 実装で、要素を書くファイルにする。
            - 検査で、設計書の全ての要素が同じ物理ファイルを指すかを確認する。
          examples:
            - oauth/service.ts
        usecase: &id004
          type: string
          title: ユースケース
          description: 属するユースケース名。複数で共用するものは `共通`。
          x-used-by:
            - 生成で、ユースケースごとの一覧にする。
            - レビューで、ユースケースの変更が及ぶ要素を探す。
        role: &id005
          type: string
          title: 役割
          description: 設計上のパターン・ロールの短いラベル（`DTO` / `リポジトリ` / `サービス` 等）。
          x-used-by:
            - レビューで、役割（DTO・リポジトリ・サービス）に合う責務と依存の向きかを確認する。
        summary: &id006
          $ref: common.schema.yaml#/$defs/summary
          title: 概要
          description: 1 行で何を担うか。
          x-used-by:
            - 生成で、要素の一覧の説明にする。
        description: &id007
          $ref: common.schema.yaml#/$defs/markdown
          title: 説明
          x-used-by:
            - 実装で、要素の処理と docstring に、満たす前提と挙動を反映する。
        inherits:
          type: string
          title: 継承元
          description: 継承する型・実装する Protocol の名前。
          x-used-by:
            - 実装で、継承・実装する型にする。
        properties:
          type: array
          title: プロパティ
          description: 型が持つフィールド。1 要素 = 1 フィールド。
          x-used-by:
            - 実装で、型のフィールドにする。
          x-heading: プロパティ
          x-shape: table
          x-key: name
          items: &id008
            type: object
            additionalProperties: false
            required:
            - name
            - type
            - description
            properties:
              name:
                type: string
                title: プロパティ名
                description: コード上の名前（物理名）。
                x-used-by:
                  - 実装で、コード上の名前にする。
              title:
                type: string
                title: 論理名
                description: 日本語で表した名前。
                x-used-by:
                  - 生成で、表の論理名にする。
              type:
                type: string
                title: 型
                description: 取りうる値が有限の文字列はリテラル型で列挙する。
                x-used-by:
                  - 実装で、型にする。
              access:
                type: string
                title: 可視性
                description: '`public` / `protected` / `private`。可視性の無い言語は `公開` / `内部 (_)` / `非公開 (__)`。'
                x-used-by:
                  - 実装で、可視性（公開・内部）にする。
              default:
                type: string
                title: デフォルト
                description: 生成時の値。無いときは記載しない。
                x-used-by:
                  - 実装で、省いたときの値にする。
              description:
                type: string
                title: 説明
                description: 値が何を表すか（意味・単位・取りうる範囲）。
                x-used-by:
                  - 実装で、入れる値を決め、docstring・コメントの説明にする。
              example:
                type: string
                title: 例
                description: 値の具体例。
                x-used-by:
                  - テストで、Factory の値にする。
              notes:
                type: string
                title: 補足
                description: 説明に収まらない前提・制約。
                x-used-by:
                  - 実装で、満たす前提を検証の処理か docstring にする。
        methods:
          type: array
          title: メソッド
          description: 型が持つメソッド。書式は関数と同じ。
          x-used-by:
            - 実装で、型のメソッドにする。
          x-heading: メソッド
          x-shape: sections
          x-key: name
          items:
            $ref: '#/$defs/function'
        refs:
          type: array
          title: 関連
          description: 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。
          x-used-by:
            - 生成で、関連する設計書へのリンクにする。
            - レビューで、関連する設計書をたどって食い違いを確認する。
          items:
            $ref: common.schema.yaml#/$defs/ref
        decisions:
          type: array
          title: 検討事項
          description: 根拠になった話し合いの記録の検討事項の ID。
          x-used-by:
            - 生成で、話し合いの記録の検討事項へのリンクにする。
            - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
          items:
            $ref: common.schema.yaml#/$defs/decision
        reason:
          $ref: common.schema.yaml#/$defs/reason
        status:
          $ref: common.schema.yaml#/$defs/status
        visibility:
          $ref: common.schema.yaml#/$defs/visibility
        notes:
          $ref: common.schema.yaml#/$defs/notes
  enums:
    type: array
    title: Enum
    description: 取りうる値の列挙。`Literal` の型エイリアスも含む。
    x-used-by:
      - 実装で、Enum・`Literal` の型にする。
      - 生成で、要素ごとの節にする。
    x-heading: Enum
    x-shape: sections
    x-key: name
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - title
      - container
      - summary
      properties:
        name: *id001
        title: *id002
        container: *id003
        usecase: *id004
        role: *id005
        summary: *id006
        description: *id007
        values:
          type: array
          title: 値一覧
          description: Enum のメンバー。1 要素 = 1 メンバー。
          x-used-by:
            - 実装で、Enum のメンバーにする。
          x-heading: 値一覧
          x-shape: table
          x-key: value
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - value
            - title
            - description
            properties:
              value:
                type: string
                title: 値
                description: 実際に持つ値。
                x-used-by:
                  - 実装で、メンバーが持つ値にする。
              member:
                type: string
                title: メンバー名
                description: コード上の識別子。
                x-used-by:
                  - 実装で、メンバーの識別子にする。
              title:
                type: string
                title: 論理名
                description: 日本語で表した名前。
                x-used-by:
                  - 生成で、表の論理名にする。
              description:
                type: string
                title: 説明
                description: 値が何を表すか（意味・単位・取りうる範囲）。
                x-used-by:
                  - 実装で、メンバーを使い分ける条件を決める。
              notes:
                type: string
                title: 補足
                description: 説明に収まらない前提・制約。
                x-used-by:
                  - 実装で、メンバーを使用する前に満たす前提を、検証の処理か docstring にする。
        refs:
          type: array
          title: 関連
          description: 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。
          x-used-by:
            - 生成で、関連する設計書へのリンクにする。
            - レビューで、関連する設計書をたどって食い違いを確認する。
          items:
            $ref: common.schema.yaml#/$defs/ref
        decisions:
          type: array
          title: 検討事項
          description: 根拠になった話し合いの記録の検討事項の ID。
          x-used-by:
            - 生成で、話し合いの記録の検討事項へのリンクにする。
            - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
          items:
            $ref: common.schema.yaml#/$defs/decision
        reason:
          $ref: common.schema.yaml#/$defs/reason
        status:
          $ref: common.schema.yaml#/$defs/status
        visibility:
          $ref: common.schema.yaml#/$defs/visibility
        notes:
          $ref: common.schema.yaml#/$defs/notes
  classes:
    type: array
    title: クラス
    description: 振る舞いを持つクラス・抽象クラス・インタフェース。
    x-used-by:
      - 実装で、振る舞いを持つクラス・インタフェースにする。
