          x-shape: sections
          x-key: name
          items:
            $ref: '#/$defs/function'
        implementations:
          type: array
          title: 実装
          description: インタフェース・抽象クラスだけが持つ。この契約を満たすクラス。
          x-used-by:
            - 実装で、契約を満たすクラスと、それを使う条件にする。
          x-heading: 実装
          x-shape: table
          x-key: target
          items: &id009
            type: object
            additionalProperties: false
            required:
            - target
            properties:
              target:
                type: string
                title: 実装
                description: この契約を満たす実装の論理名（別の設計書なら参照）。
                x-used-by:
                  - 実装で、契約を満たすクラス・関数を作る対象にする。
              notes:
                type: string
                title: 補足
                description: どの条件で使用されるか。
                x-used-by:
                  - 実装で、その実装を使う条件にする。
        refs:
          type: array
          title: 関連
          description: 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。
          x-used-by:
            - 生成で、関連する設計書へのリンクにする。
            - レビューで、関連する設計書をたどって食い違いを確認する。
          items:
            $ref: common.schema.yaml#/$defs/ref
        decisions:
          type: array
          title: 検討事項
          description: 根拠になった話し合いの記録の検討事項の ID。
          x-used-by:
            - 生成で、話し合いの記録の検討事項へのリンクにする。
            - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
          items:
            $ref: common.schema.yaml#/$defs/decision
        reason:
          $ref: common.schema.yaml#/$defs/reason
        status:
          $ref: common.schema.yaml#/$defs/status
        visibility:
          $ref: common.schema.yaml#/$defs/visibility
        notes:
          $ref: common.schema.yaml#/$defs/notes
  constants:
