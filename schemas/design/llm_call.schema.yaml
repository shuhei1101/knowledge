$schema: https://json-schema.org/draft/2020-12/schema
title: LLM の呼び出し
description: |-
  LLM・意思決定モデルを 1 回呼んで結果を受け取る処理（ステートレスな呼び出し）1 つの、モデル・プロンプト・入力・待つ上限・失敗したときの扱いを記載する設計書。
  出力の書式はプロンプトファイルの `output` を原本にする。
x-rules:
  - 1 ファイル = 1 つの呼び出しにする。
  - ツールを使用して手順を進めるものは『エージェントの定義』に記載する。
  - 精度評価との関係は『精度評価のスイート』の `targets` に記載し、この設計書には記載しない。
  - 意思決定モデルに固有の値は、プロジェクトのスキーマの `x-` の拡張に記載する。
x-kind: llm_call
x-folder: docs/llm-call
x-id-prefix: LLM
type: object
additionalProperties: false
required:
- id
- title
- lead
- type
- model
- prompt
- inputs
- timeout
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-used-by:
      - 設計で、『精度評価のスイート』の `targets`・`fallback.target` から指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
    examples:
    - LLM-1
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  title:
    type: string
    title: タイトル
    description: 呼び出しの名前。
    x-used-by:
      - 生成で、ページの見出しにする。
      - dev-docs の検索で、文書の名前にする。
    examples:
    - 行動選択ノード
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 呼び出しを 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - dev-docs の検索で、文書の概要文にする。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない。
    examples:
    - 選択肢から次の行動を 1 つ選ぶ
  component:
    $ref: common.schema.yaml#/$defs/ref
    title: 呼び出す側
    description: 呼び出す側のアーキテクチャ図の構成要素への参照。
    x-used-by:
      - 実装で、呼び出しを実装するコンポーネントを決める。
    examples:
    - ARCH-1#subsystems[virtual-life]
  type:
    type: string
    title: 種類
    description: '`choose`（選択肢から選ぶ）/ `score`（当てはまるか・点数を返却する）/ `generate`（文章を生成する）/ `extract`（入力から値を取り出す・分類する）。'
    x-used-by:
      - 検査で、種類ごとのキーの要否を確認する。
      - 実装で、出力の受け取り方を決める。
    enum:
    - choose
    - score
    - generate
    - extract
  model:
    $ref: common.schema.yaml#/$defs/model
    title: モデル
    description: 使用するモデル。
  prompt:
    type: string
    title: プロンプト
    description: 'プロンプトファイルの id（`kind: llm`）。'
    x-used-by:
      - 実装で、呼び出しのプロンプトにする。
      - 実装で、プロンプトファイルの `output` で出力を検査する。
    examples:
    - virtual-life/choose_action
  inputs:
    type: array
    title: 入力
    description: プロンプトに入れる値。
    x-used-by:
      - 実装で、プロンプトを組み立てる。
    x-heading: 入力
    x-shape: table
    x-key: name
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - from
      properties:
        name:
          type: string
          title: 変数名
          description: プロンプトファイルの変数の名前。
          x-used-by:
            - 実装で、プロンプトの変数に値を入れる。
            - 設計で、`choices.input` から指す。
          examples:
          - options
        from:
          $ref: common.schema.yaml#/$defs/ref
          title: 取得元
          description: 値の取得元の設計書（ER 図・インターフェース定義など）への参照。
          x-used-by:
            - 実装で、呼び出す側が値を取得する場所にする。
          examples:
          - ER-1#tables[action_options]
  choices:
    type: object
    title: 選択肢
    description: 選択肢の持ち方。`type` が `choose` のときだけ記載し、そのときは必須。
    x-used-by:
      - 実装で、選択肢を組み立てる。
    x-shape: attributes
    additionalProperties: false
    required:
    - input
    properties:
      input:
        type: string
        title: 選択肢の入力
        description: 選択肢を入れる `inputs[].name`。
        x-used-by:
          - 実装で、選択肢を入れる入力を決める。
        examples:
        - options
      max:
        type: integer
        title: 上限
        description: 一度に指定する選択肢の上限。
        x-used-by:
          - 実装で、選択肢を絞る処理の上限にする。
        minimum: 1
        examples:
        - 10
  timeout:
    $ref: common.schema.yaml#/$defs/timeout
    title: 待つ上限
    description: 呼び出しを待つ上限。
    x-used-by:
      - 実装で、呼び出しの上限にする。
  retry:
    type: object
    title: 再試行
    description: 失敗したときの再試行（規約『資源の値の決め方』）。記載しなければ再試行しない。
    x-used-by:
      - 実装で、失敗したときの処理にする。
    x-rules:
      - 冪等でない呼び出しには記載しない。
      - 各回の待つ上限と間隔の合計が、外側の待ちに収まる回数にする。
    x-shape: attributes
    additionalProperties: false
    required:
    - max
    - backoff
    properties:
      max:
        type: integer
        title: 回数の上限
        description: 再試行の回数の上限。
        x-used-by:
          - 実装で、再試行の回数の上限にする。
        minimum: 1
        examples:
        - 2
      backoff:
        type: string
        title: 間隔
        description: '`exponential_jitter`（指数バックオフ + ジッター）か `none`。'
        x-used-by:
          - 実装で、再試行の間隔にする。
        enum:
        - exponential_jitter
        - none
  fallback:
    type: object
    title: 代わりの経路
    description: 再試行しても失敗したときに使用する、仕様を満たす代わりの経路（判定フローチャート『フォールバックを置くか』）。記載しなければエラーにする。
    x-used-by:
      - 実装で、失敗したときの処理にする。
    x-shape: attributes
    additionalProperties: false
    required:
    - target
    - basis
    properties:
      target:
        $ref: common.schema.yaml#/$defs/ref
        title: 代わりの呼び出し
        description: 代わりの『LLM の呼び出し』への参照。
        x-used-by:
          - 実装で、失敗したときに呼ぶ呼び出しにする。
        examples:
        - LLM-2#
      basis:
        type: string
        title: 根拠
        description: 代わりの経路が仕様を満たすとした根拠（『フォールバックを置くか』の判定の結果）。
        x-used-by:
          - レビューで、代わりの経路が等価かを確認する。
        examples:
        - 別のプロバイダの同じ用途のモデルで、精度評価に合格した
  refs:
    type: array
    title: 関連
    x-used-by:
      - 生成で、関連する設計書へのリンクにする。
      - レビューで、関連する設計書をたどって食い違いを確認する。
    items:
      $ref: common.schema.yaml#/$defs/ref
  decisions:
    type: array
    title: 検討事項
    description: 根拠になった話し合いの記録の検討事項の ID。
    x-used-by:
      - 生成で、話し合いの記録の検討事項へのリンクにする。
      - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
    items:
      $ref: common.schema.yaml#/$defs/decision
  notes:
    $ref: common.schema.yaml#/$defs/notes
    x-heading: 補足
    x-shape: sections
allOf:
- if:
    properties:
      type:
        const: choose
    required:
    - type
  then:
    required:
    - choices
  else:
    properties:
      choices: false
examples:
- id: LLM-1
  title: 行動選択ノード
  lead: 選択肢から次の行動を 1 つ選ぶ
  component: ARCH-1#subsystems[virtual-life]
  type: choose
  model:
    name: jev-1
    reason: 選ぶだけなので速く安いモデルにする
  prompt: virtual-life/choose_action
  inputs:
  - name: character_status
    from: ER-1#tables[character_status]
  - name: options
    from: ER-1#tables[action_options]
  choices:
    input: options
    max: 10
  timeout:
    seconds: 8
    basis: measured_p999
    measured: p99.9 が 5.2 秒（1,200 回）
  retry:
    max: 2
    backoff: exponential_jitter
  refs:
  - SC-5#
