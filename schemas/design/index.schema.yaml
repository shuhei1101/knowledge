$schema: https://json-schema.org/draft/2020-12/schema
title: 目次
description: フォルダ 1 つの直下の目次。`dev/` と `docs/` の各フォルダに `index.yaml` として置く。
x-rules:
  - README は `index.yaml` から生成して commit する。
  - '`index.yaml` を置かないフォルダは文書の索引から外れる。'
  - '画面では辿れるようにしつつ、文書の索引には載せないフォルダは `docs_index: false` を付ける。'
x-kind: index
type: object
additionalProperties: false
required:
- summary
- items
properties:
  title:
    type: string
    title: タイトル
    description: '`dev/` と `docs/` の直下だけが持つ見出し。'
    x-rules:
      - それ以外のフォルダはフォルダの名前を見出しにする。
  summary:
    $ref: common.schema.yaml#/$defs/summary
    title: 概要
    description: フォルダの 1 行の説明。
    x-rules:
      - 親の `index.yaml` のこのフォルダの行の `summary` と同じ文言にする。
  docs_index:
    type: boolean
    title: 文書の索引に載せるか
    description: '`false` のとき、このフォルダの配下のページを文書の索引に載せない（ビュワーの上タブ・サイドバーには出す）。'
    x-rules:
      - ルール注入が案内する規約のように、索引で並べると起動プロンプトが太るだけのフォルダに付ける。
    default: true
  columns:
    type: array
    title: 列
    description: '目次の表の列の並びと列名。`page`・`summary`・`group` 以外のキーは、各行が同じキーで値を持つ（例: 実行条件の列の `condition`）。'
    x-rules:
      - 省略したときは、`group` を持つ行があれば `分類`・`ページ`・`概要`、無ければ `ページ`・`概要` の並びにする。
      - ページ名は `page` の列だけが持つ。
      - ページ名を値にする列と、全行が同じ値になる列は置かない。
      - 並びは `ページ`・`概要` の順にし、他の列はその後ろに置く（`分類` を持つ目次は `分類` を先頭に置く）。
    minItems: 2
    items:
      type: object
      additionalProperties: false
      required:
      - key
      - title
      properties:
        key:
          type: string
          title: キー
          description: 行の項目のキー。
          pattern: ^[a-z][a-z0-9_]*$
        title:
          type: string
          title: 列名
          description: 表の見出しに出す名前。
  items:
    type: array
    title: 目次
    description: フォルダの直下のページとサブフォルダ。並びがサイドバーの並びになる。
    x-rules:
      - 深い階層はサブフォルダの `index.yaml` が持つ。
      - 利用頻度・重要度の高い順に並べ、同じ種類を連続させる。
    x-heading: 目次
    x-shape: table
    x-key: page
    items:
      type: object
      additionalProperties:
        type: string
        description: '`columns` で並べた、`page`・`summary`・`group` 以外の列の値。'
      required:
      - page
      properties:
        page:
          type: string
          title: ページ
          description: |-
            直下のファイルは実体のファイル名（Markdown は `{ファイル名}.md`、YAML の設計書は `{ファイル名}.yaml`）、サブフォルダは `{フォルダ名}/`。
            別のフォルダと共有するページを並べるときだけ、`../` から始まる別のフォルダのページ（`../共通/後片付け.yaml`）を書く。
          pattern: ^(?:[^/\s][^/]*/?|(?:\.\./)+[^/\s.][^/]*(?:/[^/\s][^/]*)*)$
        summary:
          $ref: common.schema.yaml#/$defs/summary
          title: 概要
          description: 1 行の説明。
        group:
          type: string
          title: 分類
          description: 行をまとまりで見せるときの分類。サイドバーの見出しになる。
          x-rules:
            - 行のページ名と同じ値にしない。
examples:
- summary: 実体ファイルの書式定義
  items:
  - page: common.schema.yaml
    summary: 種別をまたいで使う型
  - page: シナリオ/
    summary: 単一・複合ユースケースのシナリオの書式
- summary: 手順の索引
  columns:
  - key: page
    title: ページ
  - key: summary
    title: 概要
  - key: condition
    title: 実行条件
  items:
  - page: 準備.yaml
    summary: 作業ツリーと依存を揃える
    condition: 毎回最初に実行
  - page: ../共通/後片付け.yaml
    summary: 一時ファイルを消す
    condition: 上のどれにも当たらない
