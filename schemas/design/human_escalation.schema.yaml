$schema: https://json-schema.org/draft/2020-12/schema
title: ヒューマンエスカレーションの表
description: |-
  ヒューマンゲートをオフにしていても、該当すれば必ず利用者に判断を仰ぐ項目の一覧を、制作の種類 1 つ分記載する設計書。
  実行者とレビュアーが、成果物が該当するかを判定するときに参照する。
x-rules:
  - 1 ファイル = 制作の種類 1 つにする。
  - ファイルの配置はフォルダ構成の設計書で決め、エージェントフローの `human_escalation.ref` から文書の ID で指す。
  - レビュアーは全ての項目を判定し、実行者は `executor_context` のある項目を判定する。
  - エージェントゲートがオフの工程では、実行者が全ての項目を判定する。
  - 実行者とレビュアーのどちらかが該当と判定し、利用者の判断が済んでいない項目があれば、該当（`escalated`）にする。
  - 利用者が判断した項目と箇所は、内容が変わらない限り、後の工程と修正の後のレビューで該当にしない。
  - 実行者は、判断が済んだ項目・箇所・検討事項の ID を成果の資料とレビューの依頼文に記載する。
  - 利用者が確認しなくてよいと回答した項目は削除し、新規に確認したい項目は追加する。
  - 利用者に判断を仰ぐ条件は、確認観点の表（`review_checklist`）に同じ条件の項目を設けず、この表に記載する。
x-kind: human_escalation
type: object
additionalProperties: false
required:
- id
- title
- items
properties:
  id:
    $ref: '#/$defs/doc_id'
    title: ID
    description: 文書の ID。フォルダ構成で `id_root` を付けたフォルダからのパスから `.yaml` を除いたもの。
    x-used-by:
      - 設計で、エージェントフローの `human_escalation.ref` から指す。
      - 実行で、実行者とレビュアーが表を取得する ID にする。
    examples:
    - script-creation/human-escalation
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  title:
    type: string
    title: タイトル
    description: 制作の種類の名前。
    x-used-by:
      - 生成で、ページの見出しにする。
      - project-index の検索で、文書の名前にする。
    x-rules:
      - '種類の名前（`データ: `・`ER 図: ` など）・フォルダの名前を前置きに付けない。'
    examples:
    - 台本作成
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 何の制作の表で、誰が参照するかを 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - project-index の検索で、文書の概要文にする。
  items:
    type: array
    title: 項目
    description: 該当すれば利用者に判断を仰ぐ項目。1 要素が 1 項目。
    x-used-by:
      - 実行で、実行者とレビュアーが成果物ごとに該当を判定する。
      - 生成で、項目の表にする。
    x-heading: 項目
    x-shape: table
    x-key: id
    minItems: 1
    items:
      $ref: '#/$defs/item'
  notes:
    type: array
    title: 補足
    description: 項目の表に収まらない、この制作の種類の決まり。
    x-used-by:
      - 実行で、実行者とレビュアーが項目の判定と確認の検討事項の記載方法に適用する。
      - 生成で、補足の表にする。
    x-heading: 補足
    x-shape: table
    items:
      $ref: '#/$defs/note'
$defs:
  doc_id:
    type: string
    title: 文書の ID
    description: '`id_root` のフォルダからのパスから `.yaml` を除いたもの。英字の名前はハイフンでつなぎ、`_` を使用しない。'
    pattern: ^[a-z0-9]+(-[a-z0-9]+)*(/[a-z0-9]+(-[a-z0-9]+)*)*$
    examples:
    - script-creation/human-escalation
    x-bad-examples:
    - value: script-creation/human_escalation
      reason: '`_` でつないでいる'
  item:
    type: object
    title: 項目
    description: 利用者に判断を仰ぐ項目 1 つ。
    additionalProperties: false
    required:
    - id
    - name
    - condition
    - ask
    properties:
      id:
        type: string
        title: 識別子
        description: 項目の識別子。英語の名前を `_` でつなぐ。
        x-used-by:
          - 実行で、利用者の判断の記録（台本の `approvals[].gate` など）に記載する値にする。
        x-rules:
          - 一度使用した識別子は判断の記録に残るので、意味を変えない。
        pattern: ^[a-z][a-z0-9]*(_[a-z0-9]+)*$
        examples:
        - fact_change
      name:
        type: string
        title: 名前
        description: 項目の表示の名前。
        x-used-by:
          - 実行で、確認の検討事項の見出しにする。
        minLength: 1
        examples:
        - 事実の変更
      condition:
        type: string
        title: 条件
        description: 該当する条件。成果物を確認して、該当するかを判定できる文にする。
        x-used-by:
          - 実行で、実行者とレビュアーが該当を判定する。
        minLength: 1
        examples:
        - 体験談の事実（人数・回数・順番・場所・数値）を変えた
      examples:
        type: object
        title: 判定の例
        description: 該当する例と該当しない例。
        x-used-by:
          - 実行で、実行者とレビュアーが該当を判定するときの例にする。
        x-shape: attributes
        additionalProperties: false
        properties:
          match:
            type: array
            title: 該当する例
            description: 該当する成果物の例。
            x-used-by:
              - 実行で、該当と判定する例にする。
            items:
              type: string
              minLength: 1
            examples:
            - - 2 回の出来事を、5 回にする
          not_match:
            type: array
            title: 該当しない例
            description: 該当しない成果物の例。
            x-used-by:
              - 実行で、該当しないと判定する例にする。
            items:
              type: string
              minLength: 1
            examples:
            - - パターン借りで、題材を別の具体に置き換える
      ask:
        type: string
        title: 判断してほしいこと
        description: 利用者に判断してほしいこと。
        x-used-by:
          - 実行で、確認の検討事項に記載する。
        minLength: 1
        examples:
        - その変更でよいか
      steps:
        type: array
        title: 工程
        description: 該当しうる工程・成果物の識別子。記載しなければ全ての工程。
        x-used-by:
          - 実行で、工程ごとに判定する項目を絞る。
        uniqueItems: true
        items:
          type: string
          minLength: 1
        examples:
        - - materials
          - script
      executor_context:
        type: object
        title: 実行者の判定
        description: 記載した項目は実行者のコンテキストにも入れ、実行者も判定する。記載しない項目は、レビュアーの確認観点だけに入れる。
        x-used-by:
          - 実行で、実行者のコンテキストに入れる項目を選ぶ。
        x-rules:
          - 重要な項目にだけ記載する。
        examples:
        - {}
      record:
        type: object
        title: 判断の記録
        description: 利用者の判断を成果のデータに記録する先。記載しない項目の判断は、検討事項にだけ残る。
        x-used-by:
          - 実行で、登録のときに判断の記録を組み立てる。
        x-shape: attributes
        additionalProperties: false
        required:
        - target
        properties:
          target:
            type: string
            title: 記録する先
            description: 判断を記録する成果のデータのキー。
            x-used-by:
              - 実行で、登録のときに判断を記録するキーにする。
            minLength: 1
            examples:
            - approvals
  note:
    type: object
    title: 補足の行
    description: 表に収まらない決まり 1 つ。
    additionalProperties: false
    required:
    - item
    - rule
    properties:
      item:
        type: string
        title: 項目
        description: 決まりの対象。
        x-used-by:
          - 生成で、補足の表の項目の列にする。
        minLength: 1
        examples:
        - 案を選ぶ工程の、案の段階
      rule:
        type: string
        title: 決まり
        description: 対象についての決まり。
        x-used-by:
          - 実行で、実行者とレビュアーが判定と確認の検討事項の記載方法に適用する。
        minLength: 1
        examples:
        - 全ての案を対象に判定する。該当する案があれば、ヒューマンゲートがオフでも、利用者が案を選ぶ。
examples:
- id: script-creation/human-escalation
  title: 台本作成
  lead: 台本作成の工程の成果が該当すれば、ヒューマンゲートがオフでも利用者に判断を仰ぐ項目。台本作成ノード（実行者）とレビュアーが参照する。
  items:
  - id: fact_change
    name: 事実の変更
    condition: 体験談の事実（人数・回数・順番・場所・数値）を変えた
    examples:
      match:
      - 2 回の出来事を、5 回にする
      not_match:
      - パターン借りで、題材を別の具体に置き換える
    ask: その変更でよいか
    steps:
    - materials
    - plan
    - outline
    - script
    record:
      target: approvals
  - id: cast_change
    name: 演者と役割の変更
    condition: 演者の人数か、誰が出るかを、受付の決定から変えた
    ask: その演者と役割でよいか
    steps:
    - cast
    - outline
    - script
    executor_context: {}
  notes:
  - item: 成果の資料の段階
    rule: 確認の検討事項に、該当した項目の `name` と、箇所と、`ask` を記載する。
