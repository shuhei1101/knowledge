$schema: https://json-schema.org/draft/2020-12/schema
title: ER 図
description: |-
  データストアの構造（DB スキーマ / JSON / YAML）を業務ドメインの分類ごとにまとめる。
  データの設計書のオブジェクトを、テーブル・カラム・制約・インデックスとして保存する DB 設計のレイヤー。
x-rules:
  - 1 ファイル = 分類 1 つにする。
  - '`source` を持つテーブル・カラムの項目の意味・一意の範囲・状態の遷移はデータの設計書に従い、`description`・`notes` には DB の都合（正規化・型の選び方・制約の理由）だけを記載する。'
  - 全テーブルの一覧と全体図は、各分類のテーブルから横断の一覧として生成する。
x-kind: er
x-folder: docs/er
x-id-prefix: ER
x-cross: tables
type: object
additionalProperties: false
required:
- id
- title
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  title:
    type: string
    title: タイトル
    description: '`ER 図: {分類名}`。'
    x-used-by:
      - 生成で、ページの見出しにする。
      - dev-docs の検索で、文書の名前にする。
    pattern: '^ER 図: .+$'
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 対象を 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - dev-docs の検索で、文書の概要文にする。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。
      - 対象そのものが変わったときだけ書き換える。
    x-bad-examples:
      - value: 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。
        reason: 仕様を冒頭リードに記載している。仕様は各項目へ分ける
  overview:
    $ref: common.schema.yaml#/$defs/markdown
    title: 概要
    description: 索引の設計書だけが持つ。データストアの種別とバージョン・物理名の命名規則・全テーブルの共通カラム。
    x-used-by:
      - 実装で、データストアの種別・物理名の命名規則・共通カラムに合わせてテーブルを定義する。
    x-heading: 概要
  er:
    $ref: common.schema.yaml#/$defs/er
    title: ER 図
    description: 当該分類のテーブル間の関連。
    x-used-by:
      - 生成で、分類の ER 図にする。
      - レビューで、テーブルどうしの関連と多重度が要件と合うかを確認する。
    x-rules:
      - 他の分類のテーブルは名前だけで配置する。
      - テーブルが 2 つ以上あるときに持つ。
    x-heading: ER 図
    x-shape: diagram
    x-diagram: er
  tables:
    type: array
    title: テーブル
    description: テーブル 1 つ = 1 要素。並びは依存の上流から下流。
    x-used-by:
      - 実装で、テーブル・ファイルの定義とマイグレーションにする。
      - 生成で、テーブルごとの節にする。
    x-heading: テーブル
    x-shape: sections
    x-key: name
    x-unique-in-kind: true
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - title
      - source
      - datastore
      - summary
      - columns
      properties:
        name:
          type: string
          title: 物理名
          description: DB は snake_case、JSON / YAML はファイルのパス。
          x-used-by:
            - 実装で、テーブル名・ファイルのパスにする。
            - 設計で、ほかの設計書の参照からテーブルを指す。
        title:
          type: string
          title: 論理名
          description: テーブルの論理名。
          x-used-by:
            - 生成で、節の見出しにする。
        source:
          $ref: common.schema.yaml#/$defs/ref
          title: 保存するデータ
          description: このテーブルが保存する、データの設計書のキー（`{ID}#fields[{キー}]`）。オブジェクト全体を保存するときは `{ID}#`。
          x-used-by:
            - 検査で、指すデータの設計書とキーが実在するかを確認する。
            - レビューで、データの設計書のどのキーを保存するかを辿り、保存しないキーが無いかを確認する。
          examples:
            - DATA-1#fields[segments[]]
        datastore:
          type: string
          title: データストア
          description: '`PostgreSQL` / `SQLite` / `JSON` / `YAML` 等。'
          x-used-by:
            - 実装で、読み書きに使うライブラリ・ドライバを決める。
        summary:
          $ref: common.schema.yaml#/$defs/summary
          title: 概要
          description: 1 行で何を担うか。
          x-used-by:
            - 生成で、テーブルの一覧の説明にする。
        primary_key:
          type: string
          title: 主キー
          description: 複合キーは `(col_a, col_b)`。
          x-used-by:
            - 実装で、主キーの制約にする。
        scale:
          type: string
          title: レコード規模
          description: 想定行数のオーダー（`～10 万`）。
          x-used-by:
            - 実装で、インデックス・ページングの要否を決める。
        growth:
          type: string
          title: 増え方
          description: 行が増える速さ（1 日あたりの行数 等）。
          x-used-by:
            - 実装で、保持期間とアーカイブの要否を決める。
        retention:
          type: string
          title: 保持期間
          description: 行を残す期間。
          x-used-by:
            - 実装で、古い行を消す処理にする。
        deletion:
          type: string
          title: 削除の方針
          description: 物理削除か論理削除か。
          x-used-by:
            - 実装で、削除を物理削除か論理削除にする。
        transaction:
          type: string
          title: 同じトランザクションのテーブル
          description: このテーブルと同じトランザクションで書き込むテーブルの物理名。
          x-used-by:
            - 実装で、トランザクションの境界にする。
          examples:
            - videos
        access:
          type: string
          title: アクセス方式
          description: JSON / YAML のとき、全件か キーで検索するか。
          x-used-by:
            - 実装で、全件を読むか、キーで検索するかを決める。
        description:
          $ref: common.schema.yaml#/$defs/markdown
          title: 説明
          x-used-by:
            - 実装で、テーブルに入れるデータと入れないデータを決める。
        columns:
          type: array
          title: カラム
          description: テーブルのカラム。1 要素 = 1 カラム。
          x-used-by:
            - 実装で、カラムの定義にする。
            - 生成で、カラムの表にする。
          x-heading: カラム
          x-shape: table
          x-key: name
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - title
            - type
            - description
            properties:
              name:
                type: string
                title: 物理名
                description: カラムの物理名。
                x-used-by:
                  - 実装で、カラム名・キー名にする。
              title:
                type: string
                title: 論理名
                description: 日本語で表した名前。
                x-used-by:
                  - 生成で、表の論理名にする。
              source:
                $ref: common.schema.yaml#/$defs/ref
                title: 保存するキー
                description: このカラムが保存する、データの設計書のキー（`{ID}#fields[{キー}]`）。JSON の列は、入れるキーの親。
                x-used-by:
                  - 検査で、指すデータの設計書とキーが実在するかを確認する。
                  - レビューで、データの設計書のキーと型・必須・一意の範囲が合うかを確認する。
                examples:
                  - DATA-1#fields[segments[].artifacts[]]
              type:
                type: string
                title: 型
                description: DB は DBMS のネイティブ型、JSON / YAML は `string` / `number` / `boolean` / `object` / `array`。
                x-used-by:
                  - 実装で、カラムの型にする。
              length:
                type: string
                title: 長さ・精度
                description: 長さ・精度・小数の桁。
                x-used-by:
                  - 実装で、型の長さ・精度にする。
                  - テストで、境界の長さのケースにする。
              not_null:
                type: boolean
                title: NOT NULL
                description: NULL を許さないカラムなら `true`。
                x-used-by:
                  - 実装で、NOT NULL の制約にする。
              primary_key:
                type: boolean
                title: 主キー
                description: 主キーのカラムなら `true`。
                x-used-by:
                  - 実装で、主キーの制約にする。
              unique:
                type: boolean
                title: 一意
                description: 値が一意のカラムなら `true`。
                x-used-by:
                  - 実装で、一意の制約にする。
              foreign_key:
                type: object
                title: 外部キー
                description: 参照先のテーブルとカラム。外部キーでないときは記載しない。
                x-used-by:
                  - 実装で、外部キーの制約にする。
                additionalProperties: false
                required:
                - table
                properties:
                  table:
                    type: string
                    title: 参照先
                    description: '`{分類}/{テーブル名}.{カラム}`（他の分類は分類名を付ける）。'
                    x-used-by:
                      - 実装で、外部キーの参照先にする。
                  on_delete:
                    type: string
                    title: 削除時の動き
                    description: 参照先を削除したときの動き（`CASCADE`・`SET NULL`・`RESTRICT` 等）。
                    x-used-by:
                      - 実装で、参照先を削除したときの動き（`CASCADE` 等）にする。
              check:
                type: string
                title: 検査制約
                description: 検査制約の式。
                x-used-by:
                  - 実装で、検査制約にする。
              default:
                type: string
                title: 既定
                description: カラムの既定値。
                x-used-by:
                  - 実装で、カラムの既定値にする。
              auto:
                type: string
                title: 自動で入る値
                description: データベースが自動で入れる値（作成日時・連番 等）。
                x-used-by:
                  - 実装で、自動で入れる値（作成日時・連番 等）にする。
                enum:
                - 採番
                - 作成日時
                - 更新日時
                - 作成者
              description:
                type: string
                title: 説明
                description: カラムの値が何を表すか（意味・単位）。
                x-used-by:
                  - 実装で、カラムに入れる値を決める。
              example:
                type: string
                title: 例
                description: 値の具体例。
                x-used-by:
                  - テストで、Factory の値にする。
              enum_values:
                type: string
                title: 値の選択肢
                description: '`''a'' / ''b''` の形式で値と意味を並べる。'
                x-used-by:
                  - 実装で、値の列挙型と検査制約にする。
              sensitivity:
                type: string
                title: 区分
                description: 個人情報・機密に該当するときだけ記載する。
                x-used-by:
                  - 実装で、暗号化・マスク・ログへの出力の可否を決める。
                enum:
                - 個人情報
                - 機密
              notes:
                type: string
                title: 補足
                description: カラムの前提（値が入る時期・ほかのカラムとの関係 等）。
                x-used-by:
                  - 実装で、カラムに値を入れる時期とほかのカラムとの整合を、処理か制約にする。
        indexes:
          type: array
          title: インデックス
          description: 検索に使用する追加のインデックスだけ。PK / UK はカラムが持つ。
          x-used-by:
            - 実装で、マイグレーションのインデックスにする。
          x-heading: インデックス
          x-shape: table
          x-key: name
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - columns
            - kind
            properties:
              name:
                type: string
                title: 名前
                description: 実 DB と一致させる（`{table}_{column}_{kind}`）。
                x-used-by:
                  - 実装で、インデックスの名前にする。
              columns:
                type: string
                title: カラム
                description: インデックスを張るカラム。複数は `,` で区切って順に並べる。
                x-used-by:
                  - 実装で、インデックスのカラムにする。
              kind:
                type: string
                title: 種別
                description: インデックスの種別（通常・一意・部分 等）。
                x-used-by:
                  - 実装で、インデックスの種別にする。
              where:
                type: string
                title: 条件
                description: 一部の行だけのインデックスの条件。
                x-used-by:
                  - 実装で、部分インデックスの条件にする。
                examples:
                  - status IN ('queued', 'running', 'succeeded')
              notes:
                type: string
                title: 補足
                description: インデックスを使用する検索の条件。
                x-used-by:
                  - レビューで、インデックスが検索の条件に合っているかを確認する。
        refs:
          type: array
          title: 関連
          description: 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。
          x-used-by:
            - 生成で、関連する設計書へのリンクにする。
            - レビューで、関連する設計書をたどって食い違いを確認する。
          items:
            $ref: common.schema.yaml#/$defs/ref
        decisions:
          type: array
          title: 検討事項
          description: 根拠になった話し合いの記録の検討事項の ID。
          x-used-by:
            - 生成で、話し合いの記録の検討事項へのリンクにする。
            - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
          items:
            $ref: common.schema.yaml#/$defs/decision
        reason:
          $ref: common.schema.yaml#/$defs/reason
        status:
          $ref: common.schema.yaml#/$defs/status
        visibility:
          $ref: common.schema.yaml#/$defs/visibility
        notes:
          $ref: common.schema.yaml#/$defs/notes
  refs:
    type: array
    title: 関連
    description: 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。
    x-used-by:
      - 生成で、関連する設計書へのリンクにする。
      - レビューで、関連する設計書をたどって食い違いを確認する。
    items:
      $ref: common.schema.yaml#/$defs/ref
  decisions:
    type: array
    title: 検討事項
    description: 根拠になった話し合いの記録の検討事項の ID。
    x-used-by:
      - 生成で、話し合いの記録の検討事項へのリンクにする。
      - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
    items:
      $ref: common.schema.yaml#/$defs/decision
  notes:
    $ref: common.schema.yaml#/$defs/notes
    x-heading: 補足
    x-shape: sections
examples:
- id: ER-1
  title: 'ER 図: タスク'
  lead: '`タスク` ドメインに属するデータストア構造。'
  er:
    entities:
    - name: ユーザー
      columns:
      - type: uuid
        name: ID
        key: PK
    - name: タスク
    - name: コメント
      columns:
      - type: uuid
        name: task_id
        key: FK
    relations:
    - from: ユーザー
      to: タスク
      from_column: ID
      to_column: user_id
      from_cardinality: '1'
      to_cardinality: 0..n
      label: 作成
    - from: タスク
      to: コメント
      from_column: id
      to_column: task_id
      from_cardinality: '1'
      to_cardinality: 0..n
      label: 持つ
  tables:
  - name: tasks
    title: タスク
    source: DATA-1#
    datastore: PostgreSQL
    summary: ユーザーが管理するタスク
    primary_key: id
    scale: ～500 万
    deletion: '`status=''archived''` で論理削除し、90 日後に物理削除する'
    columns:
    - name: id
      title: ID
      type: uuid
      not_null: true
      primary_key: true
      default: gen_random_uuid()
      auto: 採番
      description: 主キー
      example: 018f8a...
    - name: user_id
      title: ユーザー ID
      type: uuid
      not_null: true
      foreign_key:
        table: ユーザー/ユーザー.ID
        on_delete: CASCADE
      description: 所有ユーザー
    - name: title
      title: タイトル
      source: DATA-1#fields[title]
      type: varchar(200)
      not_null: true
      check: 1〜200 文字
      description: タスクのタイトル
      example: 週次レポート作成
    - name: status
      title: ステータス
      type: text
      not_null: true
      default: '''open'''
      enum_values: '''open'' = 未着手 / ''done'' = 完了 / ''archived'' = 論理削除'
      description: タスクの状態
    indexes:
    - name: tasks_user_id_ix
      columns: user_id
      kind: BTREE
      where: status <> 'archived'
      notes: ユーザー別の一覧用
  - name: comments
    title: コメント
    source: DATA-1#fields[comments[]]
    datastore: PostgreSQL
    summary: タスクへのコメント
    primary_key: id
    scale: ～1000 万
    transaction: tasks
    columns:
    - name: id
      title: ID
      type: uuid
      not_null: true
      primary_key: true
      auto: 採番
      description: 主キー
    - name: task_id
      title: タスク ID
      type: uuid
      not_null: true
      foreign_key:
        table: タスク.ID
      description: コメント先のタスク
    - name: body
      title: 本文
      type: text
      not_null: true
      description: コメントの本文
