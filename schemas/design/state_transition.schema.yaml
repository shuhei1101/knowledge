$schema: https://json-schema.org/draft/2020-12/schema
title: 状態遷移
description: 1 エンティティが取りうる状態と、許可された遷移。図は状態と遷移の表から生成する。
x-rules:
  - 1 ファイル = 1 エンティティにする。
  - 副作用・実装の関数は別の設計書に記載する。
x-kind: state_transition
x-folder: dev/設計書/状態遷移
x-id-prefix: ST
type: object
additionalProperties: false
required:
- id
- title
- state_transitions
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
  title:
    type: string
    title: タイトル
    description: '`状態遷移: {エンティティ名}`。'
    pattern: '^状態遷移: .+$'
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 対象を 1〜3 行で説明する。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。
      - 対象そのものが変わったときだけ書き換える。
    x-bad-examples:
      - value: 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。
        reason: 仕様を冒頭リードに記載している。仕様は各項目へ分ける
  state_transitions:
    $ref: common.schema.yaml#/$defs/state_transitions
    title: 状態遷移
    x-heading: 状態遷移図
    x-shape: diagram
    x-diagram: state
  refs:
    type: array
    title: 関連
    items:
      $ref: common.schema.yaml#/$defs/ref
  notes:
    $ref: common.schema.yaml#/$defs/notes
    x-heading: 補足
    x-shape: sections
examples:
- id: ST-1
  title: '状態遷移: 記事'
  lead: '`記事` が取りうる状態と許可された遷移の一覧。'
  state_transitions:
    states:
    - name: 下書き
      identifier: status = draft
    - name: 公開
      identifier: status = published
    initial: 下書き
    final:
    - 公開
    transitions:
    - from: 下書き
      to: 公開
      trigger: 承認
