$schema: https://json-schema.org/draft/2020-12/schema
title: 画面設計
description: |-
  1 画面の要素の仕様（表示条件・活性条件・制限・初期値・取得元・送信先・アクション）と入力チェック。
  1 ファイル = 1 画面。
x-kind: screen
x-folder: docs/screen
x-id-prefix: SCR
x-cross: elements
x-test-file: test_file
x-test-file-optional: true
type: object
additionalProperties: false
required:
- id
- title
- elements
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  tags:
    $ref: common.schema.yaml#/$defs/tags
  aliases:
    $ref: common.schema.yaml#/$defs/aliases
  title:
    type: string
    title: タイトル
    description: 日本語の画面名。ファイル名に合わせる。
    x-used-by:
      - 生成で、ページの見出しにする。
      - project-index の検索で、文書の名前にする。
    x-rules:
      - '種類の名前（`データ: `・`ER 図: ` など）・フォルダの名前を前置きに付けない。'
  screen:
    type: string
    title: 画面
    description: 画面の実装ファイルのパス。
    x-used-by:
      - 実装で、画面を作るファイルにする。
      - 結合テストで、開く画面にする。
  mock:
    type: string
    title: モック
    description: 採用したモックの配置場所。
    x-used-by:
      - 実装で、合意したモックの見た目に合わせる。
      - レビューで、実装した画面とモックを照合する。
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 対象を 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - project-index の検索で、文書の概要文にする。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。
      - 対象そのものが変わったときだけ書き換える。
    x-bad-examples:
      - value: 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。
        reason: 仕様を冒頭リードに記載している。仕様は各項目へ分ける
  test_file:
    type: string
    title: 対応テストファイル
    description: 対応する結合テストのファイル（規約『V字モデル』）。
    x-used-by:
      - テストで、画面を開いて確認する結合テストを作るファイルにする。
      - 検査で、テストのファイルがあるかを確認する。
    x-rules:
      - 規約『フォルダ構成』で対象の横に配置する React の結合テストは、対象の横のファイル（`*.test.ts`・`*.test.tsx`）を記載する。
    pattern: ^(?:tests/.+|.+\.test\.tsx?)$
    examples:
    - "tests/integration/task/test_タスク作成画面.py"
    - "frontend/src/features/plan/plan-list/plan-list-screen.test.tsx"
  impl_files:
    type: array
    title: 実装のファイル
    description: '`screen` のほかに、この画面だけが使用する実装のファイル（画面の中の部品・スクリプト・スタイル）の、リポジトリの直下からのパス。'
    x-used-by:
      - 実行で、判定フローチャート『結合テストの実行範囲』の Q5 で、変更したファイルが 1 つの画面の実装のファイルかを決める。
      - レビューで、実行範囲の表の R4 の行が `screen` とこの一覧のとおりかを確認する。
    x-rules:
      - 複数の画面が使用する共通の部品は記載しない。
      - 実装を作った・移したときに記載する。
    x-shape: list
    items:
      type: string
      pattern: ^(?!tests/).+
    examples:
      - - app/(authenticated)/tasks/new/_components/task-create-form.tsx
  elements:
    type: array
    title: 要素一覧
    description: 画面の要素 1 つ = 1 要素。
    x-used-by:
      - 実装で、画面の要素にする。
      - 生成で、要素一覧の表にする。
    x-rules:
      - ダイアログの中の要素も並べ、位置の先頭にダイアログ名を記載する。
      - 列の表示・非表示は dev-docs の画面の表の列の設定で切り替える。
    x-heading: 要素一覧
    x-shape: table
    x-key: name
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - kind
      - description
      allOf:
      - if:
          properties:
            io:
              const: 表示
          required:
          - io
          - source
        then:
          required:
          - overflow
      - if:
          properties:
            fixed_area:
              const: true
          required:
          - fixed_area
          anyOf:
          - required:
            - source
          - properties:
              io:
                enum:
                - 入力
                - 入出力
            required:
            - io
        then:
          required:
          - overflow
      - if:
          properties:
            kind:
              not:
                enum:
                - input
                - textarea
                - select
                - checkbox
                - radio
                - toggle
          required:
          - kind
        then:
          properties:
            required: false
            required_label: false
            constraints: false
            hint: false
            input_example: false
      - if:
          properties:
            kind:
              not:
                enum:
                - input
                - textarea
                - select
          required:
          - kind
        then:
          properties:
            placeholder: false
            autocomplete: false
      - if:
          properties:
            kind:
              not:
                enum:
                - input
                - textarea
          required:
          - kind
        then:
          properties:
            min_length: false
            max_length: false
            pattern: false
            charset: false
            inputmode: false
            prefix: false
            suffix: false
      - if:
          properties:
            kind:
              not:
                enum:
                - input
          required:
          - kind
        then:
          properties:
            range: false
      - if:
          properties:
            kind:
              not:
                enum:
                - select
                - radio
                - checkbox
          required:
          - kind
        then:
          properties:
            options: false
      - if:
          properties:
            kind:
              enum:
              - select
              - radio
          required:
          - kind
        then:
          required:
          - options
      - if:
          properties:
            kind:
              not:
                enum:
                - table_column
          required:
          - kind
        then:
          properties:
            sorting: false
      - if:
          properties:
            kind:
              enum:
              - table_column
          required:
          - kind
        then:
          required:
          - align
      - if:
          properties:
            kind:
              enum:
              - label
              - heading
              - image
              - tooltip
              - progress
              - separator
              - shortcut
          required:
          - kind
        then:
          properties:
            pending_state: false
      properties:
        name:
          type: string
          title: 要素
          description: ボタン・入力欄・ラベル・テーブル等の日本語の論理名。
          x-used-by:
            - 生成で、表の行の名前にする。
            - 設計で、入力チェックから要素を指す。
          x-rules:
            - 画面の中で一意にする。
        id:
          type: string
          title: 項目 ID
          description: 画面の中で一意な識別子。テスト・実装から参照する。
          x-used-by:
            - 実装で、要素の `id`・`data-testid` にする。
            - テストで、要素を探すセレクタにする。
        kind:
          type: string
          title: 種類
          description: 要素の役割の種類。種類ごとに、記載する欄と記載しない欄を検査で分ける。
          x-used-by:
            - 実装で、要素の HTML の要素と部品を決める。
            - 検査で、種類ごとに必須の欄と記載しない欄を決める。
          x-rules:
            - HTML の要素名（`div`・`a`・`h1`・`p`）ではなく、要素の役割で選ぶ。
            - '`button`: 押すと操作を始める要素（アイコンだけのボタン・メニューの項目を含む）。'
            - '`link`: 押すと別の画面・場所へ移る要素。'
            - '`toggle`: 押すたびにオンとオフを切り替え、切り替えた時点で反映する要素（スイッチ・押した状態を持つボタン）。'
            - '`input`: 1 行の文字・数値・日付を入力する欄。'
            - '`textarea`: 複数行の文字を入力する欄。'
            - '`select`: 選択肢を開いて選ぶ要素（ドロップダウン・コンボボックス）。'
            - '`checkbox`: 項目ごとにオンとオフを選び、送信で反映する要素。'
            - '`radio`: 並べた選択肢から 1 つを選ぶ要素（セグメントの切り替えを含む）。'
            - '`tabs`: 押した見出しの中身に切り替えるタブの並び。'
            - '`nav`: 画面の間を移るリンクの並び（グローバルナビゲーション・パンくず）。'
            - '`sidebar`: 画面の端に配置し、開閉できる区画。'
            - '`pane`: 画面を分けた区画（ヘッダー・フッター・本文・フォーム・パネル）。'
            - '`splitter`: 区画の境目をドラッグして大きさを変える要素。'
            - '`drag_handle`: 掴んで項目を並べ替える・区画を動かす要素。'
            - '`disclosure`: 見出しを押して中身を開閉する区画（アコーディオン・`details`）。'
            - '`list`: 同じ形の項目を並べる一覧。'
            - '`tree`: 項目を階層で並べ、階層ごとに開閉する一覧。'
            - '`board`: 列ごとに項目を並べるボード。'
            - '`table`: 行と列で値を並べる表。'
            - '`table_column`: 表の 1 列。'
            - '`dialog`: 画面の上に重ねて開き、閉じるまで後ろを操作させない区画（モーダル・シート）。'
            - '`popover`: 要素に添えて開く浮いた区画（メニュー・ポップオーバー）。'
            - '`tooltip`: ホバー・フォーカスで出す説明。'
            - '`heading`: 区画の見出し。'
            - '`label`: 固定の文言か取得した値を出す文字（バッジ・状態の表示を含む）。'
            - '`image`: 画像・アイコン・図。'
            - '`alert`: 画面の中に出し続ける通知（エラー・警告・情報のバー）。'
            - '`toast`: 一時的に出て消える通知。'
            - '`progress`: 処理中・読み込み中の表示（進捗バー・スピナー・スケルトン）。'
            - '`separator`: 区切り線。'
            - '`shortcut`: 見た目を持たず、画面全体で受けるキー操作。'
          enum:
          - button
          - link
          - toggle
          - input
          - textarea
          - select
          - checkbox
          - radio
          - tabs
          - nav
          - sidebar
          - pane
          - splitter
          - drag_handle
          - disclosure
          - list
          - tree
          - board
          - table
          - table_column
          - dialog
          - popover
          - tooltip
          - heading
          - label
          - image
          - alert
          - toast
          - progress
          - separator
          - shortcut
        component:
          $ref: common.schema.yaml#/$defs/ref
          title: 部品
          description: 使用する部品の部品設計（部品設計の `{ID}#`）。
          x-used-by:
            - 実装で、要素に使用する部品を決める。
          examples:
          - "CMP-5#"
          - "CMP-6#"
        args:
          type: array
          title: 部品へ指定する引数
          description: 部品設計の引数へ指定する値。`component` を持つ要素だけが持ち、部品設計の必須の引数を全て並べる。
          x-used-by:
            - 実装で、部品へ指定する値にする。
            - レビューで、部品の必須の引数が全て指定されているかを確認する。
          x-shape: table
          x-key: name
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - value
            properties:
              name:
                type: string
                title: 引数
                description: 部品設計の `args` の `name`。
                x-used-by:
                  - 実装で、指定する部品の引数にする。
                examples:
                - "status"
                - "filterable"
              value:
                type: string
                title: 指定する値
                description: 固定の値か取得元（`{インターフェース定義の論理名}.{フィールドのパス}`）。
                x-used-by:
                  - 実装で、引数に指定する固定の値か、値を取るインターフェース定義のフィールドにする。
                examples:
                - "`計画画面.行の材料[].status`"
                - "絞り込みを持つ列なら `true`"
        slots:
          type: array
          title: スロットに差し込む中身
          description: 部品設計のスロットへ差し込む要素か部品。`component` を持つ要素だけが持つ。
          x-used-by:
            - 実装で、部品のスロットへ差し込む中身にする。
          x-shape: table
          x-key: name
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - value
            properties:
              name:
                type: string
                title: スロット
                description: 部品設計の `slots` の `name`。
                x-used-by:
                  - 実装で、差し込むスロットにする。
                examples:
                - "default"
                - "actions"
              value:
                type: string
                title: 差し込む中身
                description: 差し込む要素の名前か、部品の部品設計。
                x-used-by:
                  - 実装で、差し込む要素か部品にする。
                examples:
                - "行の番号"
                - "CMP-3#"
        position:
          type: string
          title: 位置
          description: '`>` で区切った入れ子のパス。'
          x-used-by:
            - 実装で、要素を配置する入れ子の場所にする。
          examples:
            - 削除確認ダイアログ > フッター
        fixed_area:
          type: boolean
          title: 固定の領域
          description: 幅か高さが固定の領域（ヘッダー・フッター・サイドバー・ツールバー・表のセル 等）に配置する要素なら `true`。
          x-used-by:
            - 実装で、値が長くても領域の大きさを変えない折り返し・省略・横スクロールにする。
            - 検査で、`overflow` を必須にする要素を決める。
        description:
          type: string
          title: 説明
          description: 要素の役割（何を表示し、何を受け付けるか）。
          x-used-by:
            - 実装で、要素に表示する値と受け付ける入力を決める。
        label:
          type: string
          title: 表示文言
          description: 画面に固定で出る文字列。
          x-used-by:
            - 実装で、画面に出す文字列にする。
        placeholder:
          type: string
          title: プレースホルダ
          description: 入力欄が空のときに出す文言。
          x-used-by:
            - 実装で、入力欄のプレースホルダにする。
          x-rules:
            - '`kind` が `input`・`textarea`・`select` の要素だけに記載する。'
        io:
          type: string
          title: 入出力区分
          description: 表示だけか、入力を受けるかの区分。
          x-used-by:
            - 実装で、表示だけか、入力を受けるかを決める。
          enum:
          - 入力
          - 表示
          - 入出力
        type:
          type: string
          title: 型
          description: 値を持つ要素の型（文字列 / 数値 / 日付 / 真偽値 等）。
          x-used-by:
            - 実装で、値の型と入力欄の種類にする。
        visible_when:
          type: string
          title: 表示条件
          description: '`常時` か出し分けの条件。'
          x-used-by:
            - 実装で、要素を出す条件にする。
            - テストで、出る状態と出ない状態のケースにする。
        enabled_when:
          type: string
          title: 活性条件
          description: 表示はされるが操作できない条件。
          x-used-by:
            - 実装で、要素を操作できる条件にする。
            - テストで、操作できない状態のケースにする。
        required:
          type: boolean
          title: 必須
          description: 入力が必須なら `true`。
          x-used-by:
            - 実装で、入力を必須にするかを決める。
          x-rules:
            - '`kind` が `input`・`textarea`・`select`・`checkbox`・`radio`・`toggle` の要素だけに記載する。'
        condition:
          $ref: common.schema.yaml#/$defs/key_condition
        required_label:
          type: string
          title: 要否の表示
          description: '`※必須` / `※任意` の出し方。'
          x-used-by:
            - 実装で、必須・任意の表示にする。
          x-rules:
            - '`kind` が `input`・`textarea`・`select`・`checkbox`・`radio`・`toggle` の要素だけに記載する。'
        constraints:
          type: string
          title: 制限
          description: '`min_length`・`max_length`・`range`・`pattern`・`charset` で表せない入力の制限。'
          x-used-by:
            - 実装で、個別のキーで表せない入力の検証にする。
          x-rules:
            - '`kind` が `input`・`textarea`・`select`・`checkbox`・`radio`・`toggle` の要素だけに記載する。'
        min_length:
          type: integer
          title: 最小長
          description: 入力の最小の文字数。
          x-used-by:
            - 実装で、入力の最小の長さの検証にする。
            - テストで、境界の長さのケースにする。
          x-rules:
            - '`kind` が `input`・`textarea` の要素だけに記載する。'
        max_length:
          type: integer
          title: 最大長
          description: 入力の最大の文字数。
          x-used-by:
            - 実装で、入力の最大の長さの検証と `maxlength` にする。
            - テストで、境界の長さのケースにする。
          x-rules:
            - '`kind` が `input`・`textarea` の要素だけに記載する。'
        range:
          type: object
          title: 値の範囲・刻み
          description: 数値の入力の最小・最大・刻み。
          x-used-by:
            - 実装で、数値の入力の `min`・`max`・`step` にする。
          x-rules:
            - '`kind` が `input` の要素だけに記載する。'
          additionalProperties: false
          properties:
            min:
              type: string
              title: 最小
              description: 入力の最小値。
              x-used-by:
                - 実装で、入力の最小値にする。
            max:
              type: string
              title: 最大
              description: 入力の最大値。
              x-used-by:
                - 実装で、入力の最大値にする。
            step:
              type: string
              title: 刻み
              description: 入力の刻み。
              x-used-by:
                - 実装で、入力の刻みにする。
        pattern:
          type: string
          title: 形式
          description: 正規表現。
          x-used-by:
            - 実装で、入力の形式の検証にする。
          x-rules:
            - '`kind` が `input`・`textarea` の要素だけに記載する。'
        charset:
          type: string
          title: 文字種の扱い
          description: 受け付ける文字と、制限せず変換するか。
          x-used-by:
            - 実装で、受け付ける文字の検証と変換にする。
          x-rules:
            - '`kind` が `input`・`textarea` の要素だけに記載する。'
        width:
          type: string
          title: 表示幅
          description: 要素の表示幅（CSS の長さか、全体に対する割合）。
          x-used-by:
            - 実装で、要素の表示幅にする。
        overflow:
          type: object
          title: 長い値の扱い
          description: 長さが変わる値（記録から取得する値・利用者が入力する値）を表示する要素の、値が表示幅に収まらないときの扱いと、表示する値の最大の長さ。
          x-used-by:
            - 実装で、値が収まらないときの折り返し・省略・横スクロールにする。
            - テストで、最大の長さの値を入れた場面にする。
            - レビューで、最大の長さの値を入れた画面のスクリーンショットと照合する。
          x-rules:
            - 長さが変わる値を表示する要素に記載し、固定の文言だけの要素には記載しない。
            - 入力を持たない値を表示する要素（`io` が `表示` で `source` を持つ要素）には必ず記載する。
            - 固定の領域に配置する要素（`fixed_area` が `true`）で、`source` を持つか `io` が `入力`・`入出力` の要素には必ず記載する。
            - '`type` は、規約『レイアウト』の `pitfall-text-code-05`（長さが変わる値を折り返すか省略するかの既定）に従って選ぶ。'
          additionalProperties: false
          required:
          - type
          allOf:
          - if:
              properties:
                unbounded:
                  const: true
              required:
              - unbounded
            then:
              properties:
                max_length: false
          properties:
            type:
              type: string
              title: 扱い
              description: 値が収まらないときに、折り返す（`wrap`）・省略する（`truncate`）・横にスクロールする（`scroll`）のどれにするか。
              x-used-by:
                - 実装で、値の側の折り返し・省略・横スクロールの指定にする。
              x-rules:
                - '`truncate` にする要素は、省略した値の全文を出す方法を `description` に記載する。'
              enum:
              - wrap
              - truncate
              - scroll
            max_length:
              type: integer
              title: 表示する最大の長さ
              description: 表示する値の最大の文字数。
              x-used-by:
                - テストで、最大の長さの値を入れた場面の値の文字数にする。
                - レビューで、スクリーンショットの値が最大の長さかを確認する。
              x-rules:
                - 入力の最大長（`max_length`）を持たず、`unbounded` が `true` でない要素には記載する。
                - 入力を受ける要素で、入力の最大長（`max_length`）と同じ値なら省く。
            unbounded:
              type: boolean
              title: 長さの上限が無い値
              description: 表示する値の長さに上限が無い（AI や他の人が記載した文字を、長さを制限せずに表示する）なら `true`。
              x-used-by:
                - 実装で、どれだけ長い値でも崩れない折り返し・省略・横スクロールにする。
                - テストで、`x-rules` の文字数の値を入れた場面にする。
                - レビューで、長さを制限していない値の要素に `overflow` の記載が漏れていないかを確認する。
              x-rules:
                - '`true` の要素は、表示する最大の長さ（`max_length`）を記載しない。'
                - テストで入れる値の文字数は、同じ画面設計の要素の表示する最大の長さ（`overflow.max_length`、無ければ `max_length`）のうち最大の値の 3 倍にする。
                - 同じ画面設計に最大の長さを持つ要素が無いときは、テストで入れる値の文字数を `description` に記載する。
        count_limit:
          type: object
          title: 件数の上限
          description: 複数の値を並べる要素（タグ・一覧・チップ 等）の、表示する件数の上限と、上限を超えたときの扱い。
          x-used-by:
            - 実装で、表示する件数の上限と、超えた分の折り返し・件数でのまとめ・読み込みの分割にする。
            - テストで、上限の件数と上限を超える件数の値を入れた場面にする。
            - レビューで、上限を超える件数の値を入れた画面のスクリーンショットと照合する。
          x-rules:
            - 並べる値の件数が変わる要素に記載し、件数が固定の要素には記載しない。
          additionalProperties: false
          required:
          - max_count
          - type
          properties:
            max_count:
              type: integer
              minimum: 1
              title: 表示する最大の件数
              description: '`summarize`・`paginate` では一度に表示する値の最大の件数、`wrap` では折り返さずに 1 行に並べる値の最大の件数。'
              x-used-by:
                - 実装で、件数でまとめる・読み込みを分ける・折り返す境目の件数にする。
                - テストで、上限の件数と、上限を超える件数（`wrap` では折り返す件数）の値を入れた場面の件数にする。
            type:
              type: string
              title: 上限を超えたときの扱い
              description: 上限を超えたときに、折り返して全て出す（`wrap`）・超えた分を件数でまとめる（`summarize`、「+3」と出す）・読み込みを分ける（`paginate`、ページネーション・続きの読み込み）のどれにするか。
              x-used-by:
                - 実装で、上限を超えた分の出し方にする。
              x-rules:
                - '`summarize` にする要素は、まとめた値の全てを出す方法を `description` に記載する。'
              enum:
              - wrap
              - summarize
              - paginate
        display_format:
          type: string
          title: 表示形式
          description: 日付・時刻・数値の表示の形式と、表示の例。
