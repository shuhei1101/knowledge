      - violation
      - trigger
      - message
      - position
      properties:
        element:
          type: string
          title: 要素
          description: '`elements` の要素の名前。'
          x-used-by:
            - 実装で、検証する要素にする。
        violation:
          type: string
          title: 違反の条件
          description: 1 要素に 1 つの違反。
          x-used-by:
            - 実装で、エラーにする条件にする。
        trigger:
          type: string
          title: 検証の契機
          description: 入力のたび / フォーカスを失ったとき / 送信ボタンのクリック 等。
          x-used-by:
            - 実装で、検証する契機（入力・フォーカスを失ったとき・送信）にする。
        message:
          type: string
          title: エラー文言
          description: 画面に出る文字列そのまま。
          x-used-by:
