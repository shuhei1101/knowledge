          description: 部品設計のスロットへ差し込む要素か部品。`component` を持つ要素だけが持つ。
          x-used-by:
            - 実装で、部品のスロットへ差し込む中身にする。
          x-shape: table
          x-key: name
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - value
            properties:
              name:
                type: string
                title: スロット
