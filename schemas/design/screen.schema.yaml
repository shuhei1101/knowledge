        notes:
          $ref: common.schema.yaml#/$defs/notes
  input_checks:
    type: array
    title: 入力チェック
    description: 1 要素 = 1 ケースの入力チェック。無い画面は持たない。
    x-used-by:
      - 実装で、入力の検証とエラーの表示にする。
      - テストで、違反ごとのケースにする。
    x-heading: 入力チェック
    x-shape: table
    items:
      type: object
      additionalProperties: false
