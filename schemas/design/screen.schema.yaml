$schema: https://json-schema.org/draft/2020-12/schema
title: 画面設計
description: |-
  1 画面の要素の仕様（表示条件・活性条件・制限・初期値・取得元・送信先・アクション）と入力チェック。
  1 ファイル = 1 画面。
x-kind: screen
x-folder: docs/screen
x-id-prefix: SCR
x-cross: elements
x-test-file: test_file
x-test-file-optional: true
type: object
additionalProperties: false
required:
- id
- title
- screen_type
- leave_guard
- elements
allOf:
- if:
    properties:
      screen_type:
        const: list
    required:
    - screen_type
  then:
    properties:
      elements:
        contains:
          properties:
            kind:
              enum:
              - table
              - list
              - board
              - tree
          required:
          - kind
- if:
    properties:
      screen_type:
        enum:
        - list
        - detail
        - edit
        - settings
    required:
    - screen_type
  then:
    properties:
      elements:
        contains:
          properties:
            kind:
              const: heading
          required:
          - kind
- if:
    properties:
      screen_type:
        enum:
        - edit
        - settings
    required:
    - screen_type
  then:
    properties:
      elements:
        contains:
          properties:
            kind:
              enum:
              - input
              - textarea
              - select
              - checkbox
              - radio
              - toggle
          required:
          - kind
- if:
    properties:
      screen_type:
        const: shell
    required:
    - screen_type
  then:
    properties:
      elements:
        contains:
          properties:
            kind:
              enum:
              - nav
              - sidebar
          required:
          - kind
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  tags:
    $ref: common.schema.yaml#/$defs/tags
  aliases:
    $ref: common.schema.yaml#/$defs/aliases
  title:
    type: string
    title: タイトル
    description: 日本語の画面名。ファイル名に合わせる。
    x-used-by:
      - 生成で、ページの見出しにする。
      - project-index の検索で、文書の名前にする。
    x-rules:
      - '種類の名前（`データ: `・`ER 図: ` など）・フォルダの名前を前置きに付けない。'
  screen:
    type: string
    title: 画面
    description: 画面の実装ファイルのパス。
    x-used-by:
      - 実装で、画面を作るファイルにする。
      - 結合テストで、開く画面にする。
  mock:
    type: string
    title: モック
    description: 採用したモックの配置場所。
    x-used-by:
      - 実装で、合意したモックの見た目に合わせる。
      - レビューで、実装した画面とモックを照合する。
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 対象を 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - project-index の検索で、文書の概要文にする。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。
      - 対象そのものが変わったときだけ書き換える。
    x-bad-examples:
      - value: 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。
        reason: 仕様を冒頭リードに記載している。仕様は各項目へ分ける
  test_file:
    type: string
    title: 対応テストファイル
    description: 対応する結合テストのファイル（規約『V字モデル』）。
    x-used-by:
      - テストで、画面を開いて確認する結合テストを作るファイルにする。
      - 検査で、テストのファイルがあるかを確認する。
    x-rules:
      - 規約『フォルダ構成』で対象の横に配置する React の結合テストは、対象の横のファイル（`*.test.ts`・`*.test.tsx`）を記載する。
    pattern: ^(?:tests/.+|.+\.test\.tsx?)$
    examples:
    - "tests/integration/task/test_タスク作成画面.py"
    - "frontend/src/features/plan/plan-list/plan-list-screen.test.tsx"
  impl_files:
    type: array
    title: 実装のファイル
    description: '`screen` のほかに、この画面だけが使用する実装のファイル（画面の中の部品・スクリプト・スタイル）の、リポジトリの直下からのパス。'
    x-used-by:
      - 実行で、判定フローチャート『結合テストの実行範囲』の Q5 で、変更したファイルが 1 つの画面の実装のファイルかを決める。
      - レビューで、実行範囲の表の R4 の行が `screen` とこの一覧のとおりかを確認する。
    x-rules:
      - 複数の画面が使用する共通の部品は記載しない。
      - 実装を作った・移したときに記載する。
    x-shape: list
    items:
      type: string
      pattern: ^(?!tests/).+
    examples:
      - - app/(authenticated)/tasks/new/_components/task-create-form.tsx
  screen_type:
    type: string
    title: 画面の型
    description: 画面の型。型ごとに、持つべき要素の種類を検査で求める。
    x-used-by:
      - 実装で、規約『レイアウト』の `screen-template-01` の画面型の構成にする。
      - 検査で、型ごとに要る要素の `kind` があるかを確認する。
    x-rules:
      - '`list`: 項目を並べて選ぶ一覧の画面。`table`・`list`・`board`・`tree` の要素と `heading` の要素を持つ。'
      - '`detail`: 1 件を参照する詳細の画面。`heading` の要素を持つ。'
      - '`edit`: 1 件を作る・編集する画面。`heading` の要素と入力の要素を持つ。'
      - '`settings`: 設定を変える画面。`heading` の要素と入力の要素を持つ。'
      - '`shell`: ほかの画面を中に描く共通のレイアウト（ヘッダー・サイドバー・上タブ）。`nav` か `sidebar` の要素を持つ。'
      - '`other`: どの型にも該当しない画面。'
      - 一覧の画面の必須の要素（読み込み中・空の表示・ページ送り）は、規約『一覧画面』の `required-elements-01` に従って要素に並べる。
    enum:
    - list
    - detail
    - edit
    - settings
    - shell
    - other
  leave_guard:
    type: string
    title: 離脱の警告
    description: 画面を離れるときに警告する条件。
    x-used-by:
      - 実装で、画面を離れる操作（画面の移動・タブを閉じる・再読み込み）の前に警告する条件にする。
      - テストで、警告が出るケースと出ないケースにする。
    x-rules:
      - 未保存の入力があるまま画面を離れるときは警告する（規約『入力と文言』の `state-retention-02`）。
      - 自動保存の画面は、保存に失敗した入力が残るときに警告する（規約『自動保存』の `rules-01`）。
      - '`none`: 警告しない（入力を持たない画面）。'
      - '`unsaved`: 未保存の入力があるときに警告する。'
      - '`autosave_error`: 自動保存に失敗した入力が残るときに警告する。'
    enum:
    - none
    - unsaved
    - autosave_error
  retained_state:
    $ref: common.schema.yaml#/$defs/retained_state
    description: 画面全体で保持する状態（上タブ（領域）ごとに最後に開いたページ・ページ全体のスクロール位置 等）。要素ごとの状態は要素の `retained_state` に記載する。
    x-rules:
      - '`shell` の画面は、上タブ（領域）ごとに最後に開いたページを記載する（規約『入力と文言』の `state-retention-01`）。'
  elements:
    type: array
    title: 要素一覧
    description: 画面の要素 1 つ = 1 要素。
    x-used-by:
      - 実装で、画面の要素にする。
      - 生成で、要素一覧の表にする。
    x-rules:
      - ダイアログの中の要素も並べ、位置の先頭にダイアログ名を記載する。
      - 列の表示・非表示は dev-docs の画面の表の列の設定で切り替える。
    x-heading: 要素一覧
    x-shape: table
    x-key: name
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
      - name
      - kind
      - description
      allOf:
      - if:
          properties:
            io:
              const: output
          required:
          - io
          - source
        then:
          required:
          - overflow
      - if:
          properties:
            fixed_area:
              const: true
          required:
          - fixed_area
          anyOf:
          - required:
            - source
          - properties:
              io:
                enum:
                - input
                - input_output
            required:
            - io
        then:
          required:
          - overflow
      - if:
          properties:
            kind:
              not:
                enum:
                - input
                - textarea
                - select
                - checkbox
                - radio
                - toggle
          required:
          - kind
        then:
          properties:
            required: false
            required_label: false
            constraints: false
            hint: false
            input_example: false
      - if:
          properties:
            kind:
              not:
                enum:
                - input
                - textarea
                - select
          required:
          - kind
        then:
          properties:
            placeholder: false
            autocomplete: false
      - if:
          properties:
            kind:
              not:
                enum:
                - input
                - textarea
          required:
          - kind
        then:
          properties:
            min_length: false
            max_length: false
            pattern: false
            charset: false
            inputmode: false
            prefix: false
            suffix: false
      - if:
          properties:
            kind:
              not:
                enum:
                - input
          required:
          - kind
        then:
          properties:
            range: false
      - if:
          properties:
            kind:
              not:
                enum:
                - select
                - radio
                - checkbox
          required:
          - kind
        then:
          properties:
            options: false
      - if:
          properties:
            kind:
              enum:
              - select
              - radio
          required:
          - kind
        then:
          required:
          - options
      - if:
          properties:
            kind:
              not:
                enum:
                - table_column
          required:
          - kind
        then:
          properties:
            sortable: false
            filterable: false
            pinnable: false
            hideable: false
      - if:
          properties:
            kind:
              enum:
              - table_column
          required:
          - kind
        then:
          required:
          - align
          - sortable
      - if:
          properties:
            kind:
              const: button
          required:
          - kind
        then:
          required:
          - label_display
          - confirm
      - if:
          properties:
            kind:
              not:
                enum:
                - button
                - link
                - toggle
          required:
          - kind
        then:
          properties:
            label_display: false
      - if:
          properties:
            label_display:
              enum:
              - icon_only
              - icon_and_text
          required:
          - label_display
        then:
          required:
          - icon
      - if:
          properties:
            label_display:
              const: icon_only
          required:
          - label_display
        then:
          required:
          - accessible_name
          - tooltip
      - if:
          properties:
            kind:
              enum:
              - input
              - textarea
              - select
          required:
          - kind
        then:
          properties:
            icon: false
      - if:
          properties:
            kind:
              const: toggle
          required:
          - kind
        then:
          required:
          - toggle_state
      - if:
          properties:
            kind:
              not:
                enum:
                - toggle
                - button
          required:
          - kind
        then:
          properties:
            toggle_state: false
      - if:
          properties:
            kind:
              not:
                enum:
                - button
                - link
                - toggle
                - drag_handle
          required:
          - kind
        then:
          properties:
            confirm: false
      - if:
          not:
            required:
            - enabled_when
        then:
          properties:
            disabled_reason: false
      - if:
          properties:
            kind:
              const: button
          required:
          - kind
          - enabled_when
        then:
          required:
          - disabled_reason
      - if:
          properties:
            kind:
              const: tabs
          required:
          - kind
        then:
          required:
          - tabs
          - retained_state
        else:
          properties:
            tabs: false
      - if:
          properties:
            kind:
              const: sidebar
          required:
          - kind
        then:
          required:
          - pane
      - if:
          properties:
            kind:
              not:
                enum:
                - sidebar
                - pane
          required:
          - kind
        then:
          properties:
            pane: false
      - if:
          properties:
            kind:
              const: table
          required:
          - kind
        then:
          required:
          - table
        else:
          properties:
            table: false
      - if:
          properties:
            kind:
              enum:
              - dialog
              - popover
          required:
          - kind
        then:
          required:
          - close
          - initial_focus
          - return_focus
        else:
          properties:
            close: false
            initial_focus: false
            return_focus: false
            modal: false
      - if:
          properties:
            kind:
              const: shortcut
          required:
          - kind
        then:
          required:
          - shortcut
      - if:
          properties:
            kind:
              enum:
              - label
              - heading
              - image
              - tooltip
              - progress
              - separator
              - table_column
          required:
          - kind
        then:
          properties:
            shortcut: false
            feedback: false
            history: false
      - if:
          properties:
            kind:
              enum:
              - input
              - textarea
              - select
              - checkbox
              - radio
              - toggle
              - tabs
              - sidebar
              - disclosure
              - list
              - table
              - tree
              - board
          required:
          - kind
        then:
          required:
          - retained_state
      - if:
          properties:
            kind:
              enum:
              - label
              - heading
              - image
              - tooltip
              - progress
              - separator
              - toast
              - shortcut
              - link
              - table_column
          required:
          - kind
        then:
          properties:
            retained_state: false
      - if:
          properties:
            kind:
              not:
                enum:
                - alert
                - toast
                - label
                - progress
          required:
          - kind
        then:
          properties:
            live: false
      - if:
          properties:
            kind:
              enum:
              - label
              - heading
              - image
              - tooltip
              - progress
              - separator
              - shortcut
          required:
          - kind
        then:
          properties:
            pending_state: false
      properties:
        name:
          type: string
          title: 要素
          description: ボタン・入力欄・ラベル・テーブル等の日本語の論理名。
          x-used-by:
            - 生成で、表の行の名前にする。
            - 設計で、入力チェックから要素を指す。
          x-rules:
            - 画面の中で一意にする。
        id:
          type: string
          title: 項目 ID
          description: 画面の中で一意な識別子。テスト・実装から参照する。
          x-used-by:
            - 実装で、要素の `id`・`data-testid` にする。
            - テストで、要素を探すセレクタにする。
        kind:
          type: string
          title: 種類
          description: 要素の役割の種類。種類ごとに、記載する欄と記載しない欄を検査で分ける。
          x-used-by:
            - 実装で、要素の HTML の要素と部品を決める。
            - 検査で、種類ごとに必須の欄と記載しない欄を決める。
          x-rules:
            - HTML の要素名（`div`・`a`・`h1`・`p`）ではなく、要素の役割で選ぶ。
            - '`button`: 押すと操作を始める要素（アイコンだけのボタン・メニューの項目を含む）。'
            - '`link`: 押すと別の画面・場所へ移る要素。'
            - '`toggle`: 押すたびにオンとオフを切り替え、切り替えた時点で反映する要素（スイッチ・押した状態を持つボタン）。'
            - '`input`: 1 行の文字・数値・日付を入力する欄。'
            - '`textarea`: 複数行の文字を入力する欄。'
            - '`select`: 選択肢を開いて選ぶ要素（ドロップダウン・コンボボックス）。'
            - '`checkbox`: 項目ごとにオンとオフを選び、送信で反映する要素。'
            - '`radio`: 並べた選択肢から 1 つを選ぶ要素（セグメントの切り替えを含む）。'
            - '`tabs`: 押した見出しの中身に切り替えるタブの並び。'
            - '`nav`: 画面の間を移るリンクの並び（グローバルナビゲーション・パンくず）。'
            - '`sidebar`: 画面の端に配置し、開閉できる区画。'
            - '`pane`: 画面を分けた区画（ヘッダー・フッター・本文・フォーム・パネル）。'
            - '`splitter`: 区画の境目をドラッグして大きさを変える要素。'
            - '`drag_handle`: 掴んで項目を並べ替える・区画を動かす要素。'
            - '`disclosure`: 見出しを押して中身を開閉する区画（アコーディオン・`details`）。'
            - '`list`: 同じ形の項目を並べる一覧。'
            - '`tree`: 項目を階層で並べ、階層ごとに開閉する一覧。'
            - '`board`: 列ごとに項目を並べるボード。'
            - '`table`: 行と列で値を並べる表。'
            - '`table_column`: 表の 1 列。'
            - '`dialog`: 画面の上に重ねて開き、閉じるまで後ろを操作させない区画（モーダル・シート）。'
            - '`popover`: 要素に添えて開く浮いた区画（メニュー・ポップオーバー）。'
            - '`tooltip`: ホバー・フォーカスで出す説明。'
            - '`heading`: 区画の見出し。'
            - '`label`: 固定の文言か取得した値を出す文字（バッジ・状態の表示を含む）。'
            - '`image`: 画像・アイコン・図。'
            - '`alert`: 画面の中に出し続ける通知（エラー・警告・情報のバー）。'
            - '`toast`: 一時的に出て消える通知。'
            - '`progress`: 処理中・読み込み中の表示（進捗バー・スピナー・スケルトン）。'
            - '`separator`: 区切り線。'
            - '`shortcut`: 見た目を持たず、画面全体で受けるキー操作。'
          enum:
          - button
          - link
          - toggle
          - input
          - textarea
          - select
          - checkbox
          - radio
          - tabs
          - nav
          - sidebar
          - pane
          - splitter
          - drag_handle
          - disclosure
          - list
          - tree
          - board
          - table
          - table_column
          - dialog
          - popover
          - tooltip
          - heading
          - label
          - image
          - alert
          - toast
          - progress
          - separator
          - shortcut
        component:
          $ref: common.schema.yaml#/$defs/ref
          title: 部品
          description: 使用する部品の部品設計（部品設計の `{ID}#`）。
          x-used-by:
            - 実装で、要素に使用する部品を決める。
          examples:
