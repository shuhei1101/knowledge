          description: 送信を伴う動きはインターフェース定義、画面遷移は遷移先の画面設計。
          x-used-by:
            - 実装で、送信先のインターフェースか遷移先の画面を決める。
        refs:
          $ref: common.schema.yaml#/$defs/related
        decisions:
          type: array
