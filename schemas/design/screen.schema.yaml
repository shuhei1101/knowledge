          description: 入力欄の `inputmode`（`numeric`・`email` 等）。
          x-used-by:
            - 実装で、入力欄の `inputmode` にする。
          x-rules:
            - '`kind` が `input`・`textarea` の要素だけに記載する。'
        prefix:
          type: string
          title: 接頭辞
          description: 入力欄の前に出す文字列（通貨記号 等）。
          x-used-by:
            - 実装で、入力欄の前に出す文字列にする。
          x-rules:
            - '`kind` が `input`・`textarea` の要素だけに記載する。'
        suffix:
          type: string
          title: 接尾辞
          description: 入力欄の後に出す文字列（単位 等）。
          x-used-by:
            - 実装で、入力欄の後に出す文字列にする。
          x-rules:
            - '`kind` が `input`・`textarea` の要素だけに記載する。'
        options:
          type: string
          title: 選択肢
          description: 出所・並び・既定・複数選択の可否・排他入力。
          x-used-by:
            - 実装で、選択肢の出所・並び・既定・複数選択にする。
          x-rules:
            - '`kind` が `select`・`radio` の要素には必ず記載し、`checkbox` の要素には選択肢を並べるときに記載する。'
        input_example:
          type: string
          title: 入力例
          description: テストで入力する値の具体例。
          x-used-by:
            - テストで、入力する値にする。
          x-rules:
            - '`kind` が `input`・`textarea`・`select`・`checkbox`・`radio`・`toggle` の要素だけに記載する。'
        source:
          type: string
          title: 取得元
          description: '`{インターフェース定義の論理名}.{フィールドのパス}`。'
          x-used-by:
            - 実装で、要素に出す値を取るインターフェース定義のフィールドにする。
        target:
          type: string
          title: 送信先
          description: '`{インターフェース定義の論理名}.{フィールドのパス}`。変換・合成・除外は括弧書きで添える。'
          x-used-by:
            - 実装で、入力した値を送信するインターフェース定義のフィールドにする。
        action:
          type: string
