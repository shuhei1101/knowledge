examples:
- id: SCR-1
  title: タスク作成画面
  screen: app/(authenticated)/tasks/new/page.tsx
  mock: docs/mock/pages/タスク作成/12/a-plan/
  lead: タスクの新規作成フォーム画面。タスク名・優先度を入力して登録する。
  test_file: tests/integration/task/test_タスク作成画面.py
  impl_files:
  - app/(authenticated)/tasks/new/_components/task-create-form.tsx
  screen_type: edit
  leave_guard: unsaved
  elements:
  - name: 画面の見出し
    kind: heading
    position: フォーム本体 > 先頭
    description: 画面名を出す
    label: タスクの作成
    visible_when: 常時
  - name: プロジェクト名
    kind: label
    position: フォーム本体 > 見出しの下
    description: タスクを作るプロジェクトの名前を出す。1 行に収まらないときは省略し、全文をツールチップに出す
    io: output
    type: 文字列
    visible_when: 常時
    overflow:
      type: truncate
      max_length: 50
    source: プロジェクト詳細取得.project.name
  - name: プロジェクトのタグ
    kind: label
    position: フォーム本体 > プロジェクト名の下
    description: プロジェクトに付いたタグを横に並べる。1 件のタグが 20 文字を超えたら省略し、全文をツールチップに出す。上限を超えた分は「+3」にまとめ、押すと全てのタグをポップオーバーに出す
    io: output
    type: 文字列の配列
    visible_when: タグが 1 件以上あるとき
    overflow:
      type: truncate
      max_length: 20
    count_limit:
      max_count: 5
      type: summarize
    source: プロジェクト詳細取得.project.tags[]
  - name: プロジェクトの説明
    kind: label
    position: サイドバー > プロジェクトの情報
    fixed_area: true
    description: 他の人が記載したプロジェクトの説明を出す。3 行を超えたら省略し、押すと全文をダイアログに出す
    io: output
    type: 文字列
    visible_when: 説明があるとき
    overflow:
      type: truncate
      unbounded: true
    source: プロジェクト詳細取得.project.description
  - name: タスク名入力欄
    kind: input
    position: フォーム本体
    description: タスク名を入力
    placeholder: '例: 企画書を作る'
    io: input
    type: 文字列
    visible_when: 常時
    required: true
    max_length: 100
    constraints: 100 文字以内
    initial_value: 空（編集時は取得値）
    retained_state:
    - what: 入力途中の値
      store: session_storage
      key: "todo:v1:task-create:title"
      save_on: 入力のたび
      restore_on: 同じタブで画面を開き直したとき
      reset_when: 保存したとき
    source: タスク詳細取得.task.title
    target: タスク作成.title
  - name: 優先度選択
    kind: select
    position: フォーム本体
    description: 優先度を選択
    io: input
    type: 文字列
    visible_when: 常時
    options: low / medium / high（既定 medium）
    initial_value: medium
    retained_state:
    - what: 選んだ優先度
      store: none
      reason: 既定の medium から選び直す手間が小さく、入力途中の値と一緒に戻すほどではない
    target: タスク作成.priority
  - name: 優先度のバッジ
    kind: label
    component: CMP-7#
    args:
    - name: kind
      value: 優先度選択の値（low は `muted`、high は `danger`）
    - name: label
      value: 優先度の表示名（低 / 中 / 高）
    position: フォーム本体 > 優先度選択の右
    description: 選んだ優先度を色つきで出す
    visible_when: 常時
  - name: 保存ボタン
    kind: button
    component: CMP-3#
    position: フッター
    description: 入力内容でタスクを作成
    label: 保存
    label_display: text_only
    narrow:
      action: stack
    visible_when: 常時
    enabled_when: 必須項目が入力済みで制限の違反が無いとき
    disabled_reason: タスク名を入力すると保存できます（ボタンの下に出す）
    confirm: none
    feedback:
      success: タスクの詳細画面へ移り、「タスクを作成しました」の通知を出す
      failure: フォームの上にエラーのバーを出し、入力は残す
    shortcut:
      key: Control+S
      scope: screen
    pending_state: 非活性にし、ボタンの文言の左に回る表示を出す（ボタンの幅は変えない）
    action_ref: IF-1#
  input_checks:
  - element: タスク名入力欄
    violation: 空
    trigger: 保存ボタンのクリック
    message: タスク名を入力してください
    position: タスク名入力欄の下
  - element: タスク名入力欄
    violation: 101 文字以上
    trigger: 入力のたび
    message: 100 文字以内で入力してください
    position: タスク名入力欄の下
