$schema: https://json-schema.org/draft/2020-12/schema
title: 起動の構成
description: |-
  エージェント 1 つを起動するときにだけ決まる値（起動する仕組み・許可・フック・環境変数・待つ上限・終了したときの扱い）を記載する設計書。
  ほかの設計書から導ける値は記載せず、その設計書を原本にする。
x-rules:
  - 1 ファイル = 1 つのエージェントの起動にする。
  - モデル・起動方式・常駐かどうかは『エージェントの定義』の `model`・`session` から導き、記載しない。
  - MCP サーバーの接続・許可する MCP のツール・入れる引数・除く引数とそのフックは『MCP サーバーの定義』から導き、記載しない。
  - ネットワーク・作業フォルダ・マウントはコンテナ構成から導き、記載しない。
x-kind: launch
x-folder: docs/launch
x-id-prefix: LCH
type: object
additionalProperties: false
required:
- id
- title
- lead
- agent
- launcher
- timeout
properties:
  id:
    $ref: common.schema.yaml#/$defs/id
    title: ID
    description: 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。
    x-rules:
      - 設計書を作るときに振り、改名・移動でも変えない。
    examples:
    - LCH-1
  visibility:
    $ref: common.schema.yaml#/$defs/doc_visibility
    title: 公開範囲
  title:
    type: string
    title: タイトル
    description: 起動の構成の表示名。
    x-used-by:
      - 生成で、ページの見出しにする。
      - dev-docs の検索で、文書の名前にする。
    examples:
    - ブレインノードの起動
  lead:
    $ref: common.schema.yaml#/$defs/markdown
    title: 冒頭リード
    description: 起動の構成を 1〜3 行で説明する。
    x-used-by:
      - 生成で、ページの冒頭の説明にする。
      - dev-docs の検索で、文書の概要文にする。
    x-rules:
      - 初回に記載した内容のまま保ち、後から情報を追加しない。
    examples:
    - claude-balancer のコンテナで、プロジェクトを参照させずに起動する
  agent:
    $ref: common.schema.yaml#/$defs/ref
    title: エージェント
    description: 起動する『エージェントの定義』への参照。
    x-used-by:
      - 実装で、モデル・セッションの持ち方・きっかけを導く。
      - 実装で、`clients[].agent` がこのエージェントの『MCP サーバーの定義』から、MCP の接続・許可するツール・入れる引数を導く。
    examples:
    - AG-1#
  launcher:
    type: object
    title: 起動する仕組み
    description: エージェントを起動する仕組み。
    x-used-by:
      - 実装で、起動の処理の実装先を決める。
    x-shape: attributes
    additionalProperties: false
    required:
    - kind
    properties:
      kind:
        type: string
        title: 種類
        description: '`service`（ほかのサービスに起動を依頼する）か `command`（コマンドで直接起動する）。'
        x-used-by:
          - 実装で、起動の処理の実装先を決める。
        enum:
        - service
        - command
      interface:
        $ref: common.schema.yaml#/$defs/ref
        title: 起動の依頼
        description: '`kind` が `service` のときの、起動を依頼する『インターフェース定義』への参照。'
        x-used-by:
          - 実装で、起動の要求の書式にする。
        examples:
        - IF-31#
      command:
        type: string
        title: コマンド
        description: '`kind` が `command` のときの、起動するコマンド。'
        x-used-by:
          - 実装で、起動のスクリプトにする。
        examples:
        - claude --settings settings.json
    allOf:
    - if:
        properties:
          kind:
            const: service
      then:
        required:
        - interface
        properties:
          command: false
    - if:
        properties:
          kind:
            const: command
      then:
        required:
        - command
        properties:
          interface: false
  container:
    $ref: common.schema.yaml#/$defs/ref
    title: コンテナ
    description: コンテナで起動するときの、コンテナ構成のサービスへの参照。
    x-used-by:
      - 実装で、ネットワーク・作業フォルダ・マウントをコンテナ構成から導く。
    examples:
    - CTN-1#services[brain]
  system_prompt:
    type: string
    title: システムプロンプト
    description: システムプロンプトに追加する指示のプロンプトファイルの id。
    x-used-by:
      - 実装で、起動の `--append-system-prompt` にする。
    examples:
    - brain/system
  permissions:
    type: object
    title: 許可
    description: 許可の設定。
    x-used-by:
      - 実装で、起動の許可の設定にする。
    x-shape: attributes
    additionalProperties: false
    required:
    - mode
    properties:
      mode:
        type: string
        title: 許可のモード
        description: Claude Code の `--permission-mode` の値。
        x-used-by:
          - 実装で、起動の `--permission-mode` にする。
        x-rules:
          - アプリから起動するエージェントは `bypassPermissions` にする。
        enum:
        - bypassPermissions
        - dontAsk
        - acceptEdits
        - auto
        - manual
        - plan
      deny:
        type: array
        title: 使用させないツール
        description: 使用させない組み込みのツール。
        x-used-by:
          - 実装で、`settings.json` の `permissions.deny` にする。
          - 検査で、エージェントフローの `steps[].calls` の `tool` が含まれていないかを確認する。
        x-rules:
          - MCP のツールは『MCP サーバーの定義』の `clients[].allow` から導き、記載しない。
        items:
          type: string
        examples:
        - - Read
          - Edit
          - Write
          - Bash
  hooks:
    type: array
    title: フック
    description: 起動の設定に記載するフック。
    x-used-by:
      - 実装で、`settings.json` の `hooks` にする。
    x-rules:
      - MCP の引数を入れる・除くフックは『MCP サーバーの定義』から生成するので記載しない。
    x-heading: フック
    x-shape: table
    items:
      type: object
      additionalProperties: false
      required:
      - event
      - script
      - purpose
      properties:
        event:
          type: string
          title: イベント
          description: Claude Code の `settings.json` の `hooks` のキー（`SessionStart`・`PreToolUse` など）。
          x-used-by:
            - 実装で、`settings.json` の `hooks` のキーにする。
          pattern: ^[A-Z][A-Za-z]+$
          examples:
          - SessionStart
        matcher:
          type: string
          title: 対象
          description: 対象を絞る正規表現。
          x-used-by:
            - 実装で、`settings.json` の `matcher` にする。
          examples:
          - clear|compact
        script:
          type: string
          title: スクリプト
          description: 実行するスクリプトの、リポジトリの直下からのパス。
          x-used-by:
            - 実装で、`settings.json` の `command` にする。
          examples:
          - containers/brain/hooks/session_start.py
        purpose:
          type: string
          title: 目的
          description: フックでやること。
          x-used-by:
            - レビューで、フックが要るかを確認する。
          examples:
          - 返却済みの記録の削除を依頼する
  env:
    type: array
    title: 環境変数
    description: 起動のときに指定する環境変数。
    x-used-by:
      - 実装で、起動の環境にする。
    x-heading: 環境変数
    x-shape: table
    x-key: name
    items:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          title: 名前
          description: 環境変数の名前。
          x-used-by:
            - 実装で、起動の環境の変数名にする。
          pattern: ^[A-Z][A-Z0-9_]*$
          examples:
          - TZ
        value:
          type: string
          title: 値
          description: 環境変数の値。`secret_from` を記載しないときは必須。
          x-used-by:
            - 実装で、起動の環境の値にする。
          x-rules:
            - 秘匿値は記載しない。
          examples:
          - Asia/Tokyo
        secret_from:
          type: string
          title: 秘匿値の配置先
          description: 秘匿値の配置先。`value` と一方だけを記載する。
          x-used-by:
            - 実装で、起動の環境に秘匿値を読み込む。
          examples:
          - .env の AITUBER_TOKEN
      oneOf:
      - required:
        - value
      - required:
        - secret_from
  timeout:
    $ref: common.schema.yaml#/$defs/timeout
    title: 待つ上限
    description: 起動を待つ上限。
    x-used-by:
      - 実装で、起動の処理を待つ上限にする。
  restart:
    type: array
    title: 終了したときの扱い
    description: 終了したときの、理由ごとの扱い。『エージェントの定義』の `session.lifetime` が `resident` のときは必須。
    x-used-by:
      - 実装で、終了を受けた処理の分岐にする。
    x-heading: 終了したときの扱い
    x-shape: table
    x-key: reason
    items:
      type: object
      additionalProperties: false
      required:
      - reason
      - action
      properties:
        reason:
          type: string
          title: 理由
          description: 終了の理由。
          x-used-by:
            - 実装で、終了を受けた処理の分岐の条件にする。
          examples:
          - rate_limit
        action:
          type: string
          title: 扱い
          description: '`wait_and_restart`（指定の時刻まで待って再起動する）/ `retry_once`（1 回だけ再起動し、失敗したら止めて通知する）/ `stop`（何もしない）。'
          x-used-by:
            - 実装で、終了を受けた処理にする。
          enum:
          - wait_and_restart
          - retry_once
          - stop
  refs:
    type: array
    title: 関連
    description: 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。
    x-used-by:
      - 生成で、関連する設計書へのリンクにする。
      - レビューで、関連する設計書をたどって食い違いを確認する。
    items:
      $ref: common.schema.yaml#/$defs/ref
  decisions:
    type: array
    title: 検討事項
    description: 根拠になった話し合いの記録の検討事項の ID。
    x-used-by:
      - 生成で、話し合いの記録の検討事項へのリンクにする。
      - レビューで、根拠の検討事項の結論と食い違わないかを確認する。
    items:
      $ref: common.schema.yaml#/$defs/decision
  notes:
    $ref: common.schema.yaml#/$defs/notes
    x-heading: 補足
    x-shape: sections
examples:
- id: LCH-1
  title: ブレインノードの起動
  lead: claude-balancer のコンテナで、プロジェクトを参照させずに起動する
  agent: AG-1#
  launcher:
    kind: service
    interface: IF-31#
  container: CTN-1#services[brain]
  system_prompt: brain/system
  permissions:
    mode: bypassPermissions
    deny:
    - Read
    - Edit
    - Write
    - Bash
    - Grep
    - Glob
    - WebFetch
    - WebSearch
  hooks:
  - event: SessionStart
    matcher: clear|compact
    script: containers/brain/hooks/session_start.py
    purpose: clear・圧縮のときに、返却済みの記録の削除を依頼する
  env:
  - name: TZ
    value: Asia/Tokyo
  timeout:
    seconds: 60
    basis: published_spec
  restart:
  - reason: rate_limit
    action: wait_and_restart
  - reason: authentication_failed
    action: retry_once
  - reason: claude_exited
    action: retry_once
  - reason: lease_expired
    action: retry_once
  - reason: stopped
    action: stop
  refs:
  - AG-1#
  - MCP-1#
