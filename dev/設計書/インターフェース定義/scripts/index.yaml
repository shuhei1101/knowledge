summary: "検査と変換のスクリプト"
docs_index: true
items:
  - page: 文書の違反の検査.py.yaml
    summary: validators の約束で、文書 1 件の違反を配列で返す
  - page: 文書の Markdown への変換.py.yaml
    summary: converters の約束で、文書 1 件を group の階層を見出しにした Markdown にする
  - page: 全ての文書の検査.py.yaml
    summary: 全ての文書にスキーマの検査と文書の違反の検査を当てる CLI
  - page: 対応表のコピーの作成.py.yaml
    summary: 正本の対応表の YAML から、フックが読む JSON のコピーを書き出す
  - page: Pages の成果物の作成.py.yaml
    summary: 公開の文書だけを mdmark で 1 枚の HTML にまとめた、Pages の出力のフォルダを作る CLI
