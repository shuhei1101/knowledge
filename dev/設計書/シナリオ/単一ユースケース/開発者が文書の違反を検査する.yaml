id: "SC-72-6"
title: "開発者が文書の違反を検査する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 差し替えない
      - name: PR
        description: 違反の無い文書だけを持つ PR
    flow: |-
      sequenceDiagram
        actor D as 開発者
        participant G as GitHub Actions
        participant C as 検査のワークフロー
        participant V as 検査のスクリプト
        D->>G: PR を出す
        G->>C: ワークフローを起動する
        C->>C: Python と maid が入ったかを確かめる
        loop 全ての文書
          C->>C: スキーマの検査
          C->>V: 標準入力に文書の YAML
          V-->>C: 終了コード 0
        end
        C-->>G: 成功
    expected:
      - CI のジョブが成功で終わる
    test: test_normal
  - name: 異常シナリオ（違反のある文書を含む）
    setup:
      - name: Mock
        description: 差し替えない
      - name: PR
        description: ID が重複した文書と、スキーマに合わない文書を 1 つずつ含む PR
    flow: |-
      sequenceDiagram
        participant G as GitHub Actions
        participant C as 検査のワークフロー
        participant V as 検査のスクリプト
        G->>C: ワークフローを起動する
        loop 全ての文書
          C->>C: スキーマの検査
          C->>V: 標準入力に文書の YAML
          V-->>C: 終了コードと違反の一覧
        end
        C-->>G: 全ての違反を出して失敗
    expected:
      - CI のジョブが失敗で終わる
      - ログに 2 つの違反の両方が、文書のパス・項目・行・内容つきで出る
    test: test_error_when_documents_have_violations
  - name: 異常シナリオ（maid が入っていない）
    setup:
      - name: Mock
        description: ランナーの PATH から maid を外す
    flow: |-
      sequenceDiagram
        participant G as GitHub Actions
        participant C as 検査のワークフロー
        G->>C: ワークフローを起動する
        C->>C: Python と maid が入ったかを確かめる
        C-->>G: maid が無いことを出して失敗
    expected:
      - CI のジョブが、文書の検査を始めずに失敗で終わる
      - ログに maid が PATH から引けないことが出る
    test: test_error_when_maid_missing
lead: PR ごとに CI が knowledge の全ての文書へスキーマの検査と検査のスクリプトを当て、違反があれば失敗させる。
issue: 51
primary_actor: 開発者
trigger: 開発者が knowledge に PR を出すか push する
preconditions:
  - '`.github/workflows/` に検査のワークフローがある'
success_guarantee: 違反が無ければ CI が成功する。
minimal_guarantee: 違反が 1 つでもあれば CI が失敗し、全ての違反の文書のパス・項目・行・内容がログに出る。検査に要るランタイムが欠けていれば検査を始めずに失敗する。
