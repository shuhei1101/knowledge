id: "SC-148-1"
title: "エージェントが書き込んだ中身の AI slop の単語を通知される"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 差し替えない
      - name: 対応表
        description: knowledge の対応表 `word-list-ai-slop`
      - name: 書き込む中身
        description: 対応表の単語を 2 つ含む文
        notes: 'Write の `content` に「設定を直す。この形で記載する。」'
    flow: |-
      sequenceDiagram
        participant E as エージェント
        participant C as Claude Code
        participant H as slop-check のフック
        participant L as 対応表
        E->>C: Write でファイルを書き込む
        C->>C: ファイルを書き込む
        C->>H: 標準入力に PostToolUse の入力
        H->>L: 対応表を読む
        H->>H: 書き込んだ中身を対応表の各行で照合する
        H-->>C: additionalContext に通知の文
        C-->>E: 書き込みの結果と通知の文
    expected:
      - ファイルが書き込む中身のとおりに書き込まれる
      - 'フックの出力の `hookSpecificOutput.additionalContext` に通知の文が入り、表に `| 直す | 修正 |` と `| 形 | スキーマ・構造 |` の 2 行だけが対応表の並びの順で出る'
      - 通知の文に、規約『文章の書き方』と規約『入力と文言』を `search_docs` で読む行が入る
      - フックの出力に `decision` が無く、終了コードが 0
    test: test_normal
  - name: 正常シナリオ（対応表の単語を含まない）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 書き込む中身
        description: 対応表の単語を含まない文と、`allow` に当たる複合語・前後に漢字が続く漢字 1 文字の単語だけを含む文
        notes: 'Write の `content` に「設定を修正して書き直す。形式と円形を確認する。」'
    flow: |-
      sequenceDiagram
        participant E as エージェント
        participant C as Claude Code
        participant H as slop-check のフック
        E->>C: Write でファイルを書き込む
        C->>H: 標準入力に PostToolUse の入力
        H->>H: 書き込んだ中身を対応表の各行で照合する
        H-->>C: 出力なし
        C-->>E: 書き込みの結果
    expected:
      - フックの標準出力が空で、終了コードが 0
    test: test_normal_when_no_word_hits
  - name: 正常シナリオ（Edit で前からある単語）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 既存のファイル
        description: 対応表の単語「版」を含む Markdown のファイル
        notes: '「新しい版を出す。」の行を持つ'
      - name: 書き込む中身
        description: 対応表の単語を含まない差分
        notes: 'Edit の `new_string` に「設定を修正する。」'
    flow: |-
      sequenceDiagram
        participant E as エージェント
        participant C as Claude Code
        participant H as slop-check のフック
        participant F as 書き込んだファイル
        E->>C: Edit でファイルを修正する
        C->>F: 修正後の内容を書き込む
        C->>H: 標準入力に PostToolUse の入力
        H->>F: 修正後のファイル全体を読む
        H->>H: ファイル全体を対応表の各行で照合する
        H-->>C: additionalContext に通知の文
        C-->>E: 修正の結果と通知の文
    expected:
      - 通知の文の表に `| 版 | バージョン |` の行が出る
      - フックの出力に `decision` が無く、終了コードが 0
    test: test_normal_when_edit_keeps_existing_word
  - name: 正常シナリオ（MCP ツールで書き込む）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 書き込む中身
        description: dev-docs の `write_docs` で書き込む文書の文字列の項目に、対応表の単語を含む
        notes: '`operations[].set` の文字列の項目に「設定を足す。」'
    flow: |-
      sequenceDiagram
        participant E as エージェント
        participant C as Claude Code
        participant M as 書き込む MCP ツール
        participant H as slop-check のフック
        E->>C: write_docs を呼ぶ
        C->>M: ツールを呼ぶ
        M-->>C: ツールの結果
        C->>H: 標準入力に PostToolUse の入力
        H->>H: ツールの入力から書き込んだ文字列を取り出し、対応表の各行で照合する
        H-->>C: additionalContext に通知の文
        C-->>E: ツールの結果と通知の文
    expected:
      - 通知の文の表に `| 足す | 追加 |` の行が出る
      - フックの出力に `decision` が無く、終了コードが 0
    test: test_normal_when_mcp_tool_writes
  - name: 異常シナリオ（対応表が読めない）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 対応表
        description: フックが読む対応表のファイルが無い
      - name: 書き込む中身
        description: 対応表の単語を含む文
        notes: 'Write の `content` に「設定を直す。」'
    flow: |-
      sequenceDiagram
        participant E as エージェント
        participant C as Claude Code
        participant H as slop-check のフック
        E->>C: Write でファイルを書き込む
        C->>C: ファイルを書き込む
        C->>H: 標準入力に PostToolUse の入力
        H->>H: 対応表を読めない
        H-->>C: 出力なし（標準エラーに理由）
        C-->>E: 書き込みの結果
    expected:
      - ファイルが書き込む中身のとおりに書き込まれる
      - フックの標準出力が空で、終了コードが 0
      - フックの標準エラーに、読めなかった対応表のパスが出る
    test: test_error_when_word_list_missing
lead: エージェントが書き込むツールで対応表の単語を書き込むと、プラグイン slop-check の PostToolUse のフックが書き込んだ中身を対応表で照合し、書き込みを止めずに NG と OK の単語を通知する。
issue: 135
primary_actor: エージェント
trigger: エージェントが Write・Edit・NotebookEdit・書き込む MCP ツールで中身を書き込む
preconditions:
  - Claude Code にプラグイン slop-check が導入され、有効になっている
success_guarantee: 書き込んだ中身に対応表の単語があれば、ヒットした単語の行だけの表を持つ通知の文がエージェントのコンテキストに入る。
minimal_guarantee: フックの照合が失敗しても、書き込みの結果は変わらず、エージェントの作業は止まらない。
notes:
  E2E テストの動かし方: Claude Code がフックを呼ぶときと同じ PostToolUse の入力の JSON を、プラグインの `hooks.json` に登録したコマンドへ標準入力で与えて子プロセスとして起動し、標準出力の JSON・標準エラー・終了コードを確かめる。Claude Code の起動とモデルの呼び出しは含めない
test_file: tests/e2e/単一ユースケース/test_エージェントが書き込んだ中身のAIslopの単語を通知される.py
