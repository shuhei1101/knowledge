summary: "1 つの機能の正常・異常シナリオ"
docs_index: true
items:
  - page: 利用者が dev-docs に knowledge を登録する.yaml
    summary: '`/dev-docs:setup` の点検を通して `sources[]` に knowledge を登録する'
  - page: 利用者が画面で knowledge の文書を読む.yaml
    summary: dev-docs の画面で `nav` から文書を開いて読む
  - page: エージェントが knowledge の文書を検索・取得する.yaml
    summary: '`search_docs` に `source: knowledge` を渡して文書を検索・取得する'
  - page: エージェントが knowledge の文書を書き込む.yaml
    summary: '`write_docs` で検査のスクリプトを通してから文書を書き込む'
  - page: 開発者が文書の違反を検査する.yaml
    summary: CI で全ての文書にスキーマの検査と検査のスクリプトを当てる
  - page: 利用者が GitHub Pages で knowledge の公開文書を読む.yaml
    summary: master へのマージで公開の文書だけを HTML にして Pages へ配信し、ブラウザで読む
  - page: エージェントが書き込んだ中身の AI slop の単語を通知される.yaml
    summary: 書き込むツールの中身を slop-check が対応表で照合し、書き込みを止めずに NG と OK の単語を通知する
  - page: 開発者がスキーマから設計書のテンプレートを生成する.yaml
    summary: 生成のコマンドで、設計書の種類のテンプレートの本文をスキーマから書き出す
