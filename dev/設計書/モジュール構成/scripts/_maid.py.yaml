id: "MOD-72-3"
title: "検査と変換のスクリプト / scripts / _maid.py"
lead: mermaid の文法の検査で呼ぶ maid（LIB-72-3）の、PATH からの在りかの確認と、打ち切りつきの呼び出し。
data_models:
  - name: MaidFinding
    title: maid の誤り
    container: scripts/_maid.py
    usecase: 文書の違反の検査
    role: DTO
    summary: maid が返した誤り 1 件
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: line
        type: int
        description: 渡した図の中の行（1 始まり。maid の `errors[].line`）
      - name: message
        type: str
        description: maid の `errors[].message`
  - name: MaidOutputError
    title: 読めない maid の出力
    container: scripts/_maid.py
    usecase: 文書の違反の検査
    role: 例外
    summary: maid の標準出力が JSON として読めないか、終了コードが 0・1 でない
    inherits: Exception
    properties:
      - name: message
        type: str
        description: 終了コードと標準エラーの最後の 1 行
constants:
  - name: MAID
    title: maid のコマンド名
    container: scripts/_maid.py
    usecase: 文書の違反の検査
    summary: PATH から引く maid のコマンド名
    value: '"maid"'
  - name: MIN_REMAINING_SEC
    title: maid を呼ぶのに要る残り時間
    container: scripts/_maid.py
    usecase: 文書の違反の検査
    summary: 残り時間がこれより短ければ maid を呼ばずに時間切れにする（秒）
    value: '1.0'
    reason: PoC の Linux 側の maid の 1 文書の最大 0.90 秒（#133）を上回る値。実装の後に 1 ブロックあたりの p99.9 を測って見直す
functions:
  - name: find_maid
    title: maid の在りかの確認
    kind: 関数
    container: scripts/_maid.py
    usecase: 文書の違反の検査
    scope: public
    summary: PATH から maid の実行ファイルを引く
    returns:
      type: str | None
      description: 実行ファイルの絶対パス。引けなければ `None`
    process: 1. `shutil.which(MAID)` を返す
    unit_tests:
      - name: test_find_maid
        case: 正常
        summary: PATH にある maid を引く
        condition: 一時フォルダに実行できる `maid` を置き、PATH をそのフォルダだけにする
        mock: なし（`monkeypatch.setenv("PATH", ...)`）
        expected: 置いた `maid` のパス
      - name: test_find_maid_when_missing
        case: 正常
        summary: PATH に無い
        condition: PATH を空の一時フォルダだけにする
        mock: なし（`monkeypatch.setenv("PATH", ...)`）
        expected: '`None`'
  - name: run_maid
    title: maid の呼び出し
    kind: 関数
    container: scripts/_maid.py
    usecase: 文書の違反の検査
    role: 外部の境界
    scope: public
    summary: mermaid の図 1 つを maid に標準入力で渡し、誤りを返す
    side_effects: maid を子プロセスとして起動する（`--fix` を付けず、ファイルを書き換えない）
    args:
      - name: executable
        title: maid の実行ファイル
        type: str
        required: true
        description: '`find_maid` が返したパス'
      - name: diagram
        title: 図
        type: str
        required: true
        description: mermaid のコードブロックの中身（囲みの行を含めない）
      - name: timeout_sec
        title: 打ち切り
        type: float
        required: true
        description: 残り時間。超えたら maid を止める
    returns:
      type: list[MaidFinding]
      description: 誤りの一覧。正しい図は空
    process: |-
      1. `subprocess.run([executable, "-", "--format", "json"], input=diagram, capture_output=True, text=True, timeout=timeout_sec)` で呼ぶ（LIB-72-3）
      2. 終了コードが 0・1 でない場合、読めない maid の出力を送出する
      3. 標準出力を JSON で読み、`errors[]` の `line`・`message` を maid の誤りにして返す
         - JSON として読めないか `errors` が配列でない場合、読めない maid の出力を送出する
    exceptions:
      - name: MaidOutputError
        condition: 終了コードが 0・1 でない
        message: 'maid が終了コード {コード} で終わりました: {標準エラーの最後の 1 行}'
      - name: MaidOutputError
        condition: 標準出力が JSON として読めないか、`errors` が配列でない
        message: maid の出力を読めません
    unit_tests:
      - name: test_run_maid
        case: 正常
        summary: 正しい図
        condition: '`flowchart TD\n  A --> B`'
        mock: 'maid を、標準入力を読んで `{"valid": true, "errors": []}` を出し終了コード 0 で終わるスクリプトに差し替える'
        expected: 空の一覧。スクリプトに `-`・`--format`・`json` が渡る
      - name: test_run_maid_when_invalid
        case: 正常
        summary: 誤った図
        condition: 'maid が `errors` に `line: 3` の 1 件を出し終了コード 1'
        mock: maid をスクリプトに差し替える
        expected: '`MaidFinding(line=3, message=...)` の 1 件'
      - name: test_run_maid_when_crashed
        case: 異常
        summary: maid が落ちた
        condition: maid が終了コード 2 で標準エラーに 1 行出す
        mock: maid をスクリプトに差し替える
        expected: '`MaidOutputError` で、メッセージに終了コード 2 と標準エラーの行'
        exception: 終了コードが 0・1 でない
      - name: test_run_maid_when_not_json
        case: 異常
        summary: 出力が JSON でない
        condition: maid が `ok` を出し終了コード 0
        mock: maid をスクリプトに差し替える
        expected: '`MaidOutputError`'
        exception: 標準出力が JSON として読めない
