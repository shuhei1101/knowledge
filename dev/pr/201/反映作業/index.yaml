設計書のスキーマのタグの更新:
  説明: release が master へ入った後に、`design-schemas/v*` の最新のタグがこの PR の squash commit を含むかを確認し、含まなければ、そのマージの commit へ、最新のタグのパッチを上げたタグを、メッセージに `(#201)` を入れて作成して push する（この PR のスキーマの変更は `docs_index` への `x-hidden` の追加だけで、`x-hidden` は描画の注釈のため、どの設計書の検査の結果も変えない）。切り戻しは、メッセージに `(#201)` を持つタグだけを削除する
  タグ: [タグ, スキーマ]
  実行者: tester
  時期: master へ入った後
  回数: 1 回限り
  可逆: true
  疎通確認: 設計書のスキーマのタグの更新/疎通確認.sh
  実行: 設計書のスキーマのタグの更新/実行.sh
  確認: 設計書のスキーマのタグの更新/確認.sh
  切り戻し: 設計書のスキーマのタグの更新/切り戻し.sh
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`git ls-remote --tags origin 'design-schemas/*'` の最新のタグの commit の履歴に、この PR の squash commit が含まれる"
  状態: "-"
