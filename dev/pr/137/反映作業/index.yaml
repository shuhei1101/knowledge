Pages の配信元の切り替え:
  説明: リポジトリの Pages の設定の配信元を、ブランチ master の /docs（build_type が legacy）から GitHub Actions（build_type が workflow）へ切り替え、公開文書の配信のワークフローを workflow_dispatch で 1 回動かす。切り替える前に master へ入ると、ワークフローの配信のステップが失敗するため、切り替えの後に動かし直す
  タグ: [リポジトリの設定, Pages]
  実行者: tester
  時期: master へ入った後
  回数: 1 回限り
  可逆: true
  疎通確認: null
  実行: null
  確認: null
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`gh api repos/shuhei1101/knowledge/pages` の build_type が workflow で、https://shuhei1101.github.io/knowledge/ が 200 を返し、公開の文書の YAML のパス（docs/guide/ の YAML）を Pages の URL に付けて開くと 404 を返す"
