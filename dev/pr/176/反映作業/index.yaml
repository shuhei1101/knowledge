knowledge の索引の登録:
  説明: 利用者の全ての Claude Code の設定（`~/.claude*/settings.json` の 10 個）が参照する rule-inject の索引に、knowledge のメインのクローンの `rules.yaml`（master）を追加する。端末の rule-inject が設定ファイルを読むなら `~/.config/rule-inject/settings.yaml` の `global.indexes` に追加して各設定の `env` に `RULE_INJECT_CONFIG` を置き、読まないなら各設定の `RULE_INJECT_INDEXES_USER` にカンマ区切りで追加する（どちらにするかはインターフェース定義設計で決める）
