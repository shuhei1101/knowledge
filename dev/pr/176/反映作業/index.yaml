  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: 10 個の設定のそれぞれで、rule-inject が読む索引（設定ファイルの `global.indexes` か `RULE_INJECT_INDEXES_USER`）に `/mnt/c/Users/shuhe/repo/knowledge/rules.yaml` が含まれている
