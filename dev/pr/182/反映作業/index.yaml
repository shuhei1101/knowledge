設計書のスキーマのタグの作成:
  説明: release が master へ入った後に、そのマージの commit へ設計書のスキーマのタグ `design-schemas/v1.0.0` を作成して push する。各プロジェクトの `dev-docs.yaml` の `schema:` がこのタグで `schemas/design/` を指す
  タグ: [タグ, スキーマ]
  実行者: tester
  時期: master へ入った後
  回数: 1 回限り
  可逆: true
  疎通確認: 設計書のスキーマのタグの作成/疎通確認.sh
  実行: 設計書のスキーマのタグの作成/実行.sh
  確認: 設計書のスキーマのタグの作成/確認.sh
  切り戻し: 設計書のスキーマのタグの作成/切り戻し.sh
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`git ls-remote --tags origin design-schemas/v1.0.0` が、master の release のマージの commit を返す"
