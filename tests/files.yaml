        type: tests
  - path: integration/slop-check/conftest.py
    name: slop-check の結合テストの共通の fixture
    description: フックのスクリプトを子プロセスとして起動する処理を slop-check の結合テストへ提供し、フックの起動のしかたを変えるときに参照する。
