repository:
  style: モノレポ
  repositories:
    - name: shuhei1101/knowledge
subsystems:
  - name: 文書
    scope: docs
    role: 規約・テンプレート・判定フローチャート・判定表・チェックシート・使い方・変更履歴・スキルの YAML とそのスキーマ、YAML でないファイルを載せる files.yaml、dev-docs への配信の設定 `dev-docs.yaml` を持つ。各プロジェクトが `design-schemas/v*` のタグで指す設計書のスキーマの正本（`schemas/design/`）も持つ
    runtime: YAML（JSON Schema 2020-12）
    runs_on: dev-docs が読むリポジトリの作業ツリー
  - name: 検査と変換のスクリプト
    scope: scripts
    role: スキーマで見られない決まりの検査と、全ての種類の YAML から mdmark の記法の Markdown への変換を、dev-docs の validators・converters の約束で返す
    runtime: Python 3.14
    runs_on: dev-docs が起動する子プロセス・手元のコマンド・CI
  - name: CI
    scope: ci
    role: develop への push で公開の文書だけを HTML にして GitHub Pages へ配信する
    runtime: GitHub Actions のワークフロー
    runs_on: GitHub Actions
  - name: slop-check
    scope: slopcheck
    role: 書き込むツールの実行の後に、書き込んだ中身を対応表のコピーで照合し、ヒットした単語と置き換え先の通知を返す（書き込みは止めない）。対応表の正本は文書の `docs/word-list/`、コピーは検査と変換のスクリプトが作る
    runtime: Python 3.12 以上（標準ライブラリだけ）
    runs_on: Claude Code が PostToolUse で起動する子プロセス（端末の python3）
lead: |-
  knowledge は規約・テンプレートなどの文書を YAML で持ち、dev-docs の配信元として画面と文書の MCP から読まれる。
  サーバーと MCP は dev-docs が持ち、knowledge は文書・スキーマ・検査と変換のスクリプト・CI と、書き込んだ中身を照合するプラグイン slop-check だけを持つ。
external_systems:
  - name: dev-docs
    purpose: knowledge の文書を画面と文書の MCP で配信し、書き込みのときに検査のスクリプト、配信のときに変換のスクリプトを呼ぶ
    direction: 双方向
    protocol: 子プロセス（標準入力に文書の YAML、標準出力に JSON / Markdown）
    notes:
      事前確認: 不要。dev-docs が knowledge のスクリプトを呼ぶ側で、knowledge から dev-docs を呼ばない
  - name: '@probelabs/maid'
    purpose: mermaid の文法の検査（`--fix` を付けない）
    direction: 双方向
    protocol: CLI（子プロセス）
    notes:
      事前確認: 要。検査のスクリプトの起動時に `maid` が PATH から引けるかを確かめ、無ければ検査を始めずに足りないものを返す。maid を呼ぶ前に残り時間を確かめる（非機能要件のスクリプトの処理時間）
    detail: LIB-72-3#
  - name: GitHub Actions
    purpose: develop への push で公開文書の配信のワークフローを動かす
    direction: 受信のみ
    protocol: ワークフローの YAML
    notes:
      事前確認: 要。ワークフローの最初のステップで、成果物の作成に要るランタイム（Node 24・uv）を入れ、入らなければ配信せずに失敗させる
  - name: mdmark
    purpose: 公開の文書の Markdown を 1 枚の HTML にまとめる（`build`）
    direction: 双方向
    protocol: CLI（子プロセス、`npx` でタグを指定して起動）
    detail: LIB-137-1#
    notes:
      事前確認: 不要。`build` が 0 以外で終われば、Pages の成果物の作成がその標準エラーを出して失敗する
  - name: GitHub Pages
    purpose: 公開の文書の HTML を利用者へ配信する
    direction: 送信のみ
    protocol: Pages の成果物（`actions/upload-pages-artifact`・`actions/deploy-pages`）
    notes:
      事前確認: 要。配信の前に `actions/configure-pages` で Pages の設定を読み、配信元が GitHub Actions でなければ配信せずに失敗させる
  - name: Claude Code
    purpose: 書き込むツールの実行の後に、プラグイン slop-check の PostToolUse のフックを起動し、標準出力の `additionalContext` をエージェントのコンテキストへ入れる
    direction: 双方向
    protocol: フック（子プロセス、標準入力に PostToolUse の入力の JSON、標準出力に `hookSpecificOutput` の JSON）
    notes:
      事前確認: 不要。Claude Code がフックを呼ぶ側で、slop-check から Claude Code を呼ばない
