id: "IF-72-3"
visibility: internal
title: "全ての文書の検査"
entry:
  kind: operation
  value: リポジトリの直下で起動するコマンド（CLI）。開発者の手元から呼ぶ
flows:
  - name: 正常系
    summary: 違反の無い文書だけなら終了コード 0 で終わる
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '`dev-docs.yaml`・`schemas/meta.schema.yaml`・`schemas/rule.schema.yaml`・lint の違反と警告も無い `docs/rule/` の文書 2 件（`body` の文は「。」で終える）を持つ一時フォルダ'
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        participant F as リポジトリ
        C->>S: リポジトリの直下で起動する
        S->>S: maid・markdownlint-cli2・textlint があるかを確かめる
        S->>F: dev-docs.yaml の documents を読む
        loop 全ての文書
          S->>S: スキーマの検査と文書の違反の検査
        end
        S->>F: schemas/design/ の設計書のスキーマを読む
        loop 全ての設計書のスキーマ
          S->>S: 拡張したメタスキーマ・$ref・examples の検査
        end
        S->>S: 文書の Markdown の項目を 1 項目ずつ一時の .md に書き出す
        S->>S: markdownlint-cli2・textlint を 1 回ずつ呼び、yamllint を当てる
        S-->>C: 終了コード 0 と件数の行
    expected:
      - 終了コードが 0
      - 標準出力の最後の行が、文書 2 件・違反 0 件・警告 0 件を示す
    test: test_normal
  - name: 正常系（設計書のスキーマに誤りがある・終了コード 1）
    summary: 全ての設計書のスキーマを検査し終えてから、全ての誤りを違反として出して終了コード 1 で終わる
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '`dev-docs.yaml` と、`schemas/design/` に誤りのある設計書のスキーマ 4 件と、それらが `$ref` で指す `common.schema.yaml` と、`schemas/meta.schema.yaml` と、`x-rules` に文字列を書いた `schemas/template.schema.yaml` を持つ一時フォルダ'
        notes: '4 件は、`type` に `strin` を書いたスキーマ（メタスキーマの違反）、`x-rules` に文字列を書いたスキーマ（メタスキーマの違反）、`common.schema.yaml#/$defs/missing` を指すスキーマ（解決できない `$ref`）、`required` のキーを持たない `examples[0]` を持つスキーマ（`examples` の違反）'
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        participant F as リポジトリ
        C->>S: リポジトリの直下で起動する
        S->>F: dev-docs.yaml の documents を読む
        S->>F: schemas/design/ の設計書のスキーマを読む
        loop 全ての設計書のスキーマ
          S->>S: 拡張したメタスキーマ・$ref・examples の検査
        end
        S->>F: schemas/ の直下のスキーマを読む
        loop schemas/ の直下のスキーマ
          S->>S: 拡張したメタスキーマの検査
        end
        S-->>C: 終了コード 1 と全ての違反の行
    expected:
      - 終了コードが 1
      - '標準出力に `schemas/design/{ファイル名}:{行}: {項目のパス}: {内容}` の行が 4 件と、`schemas/template.schema.yaml:{行}: x-rules: metaschema: {内容}` の行が出る'
      - メタスキーマの違反の行は `type`・`x-rules` のキーの行、解決できない `$ref` の行は `$ref` のキーの行、`examples` の違反の行は `examples[0]` の要素の先頭の行
    test: test_normal_when_design_schemas_invalid
  - name: 正常系（設計書の行・終了コード 1）
    summary: 行の `schema` が `schemas/design/` のスキーマの設計書にも、スキーマの検査と lint を適用し、`$ref` は同じフォルダのスキーマで解く
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '`dev-docs.yaml`（`docs/rule/` の行と、`schema` が `schemas/design/scenario.schema.yaml` の `docs/scenario/` の行）・`schemas/meta.schema.yaml`・`schemas/rule.schema.yaml`・`schemas/knowledge-common.schema.yaml` と、`common.schema.yaml#/$defs/id` を `$ref` で指す `schemas/design/scenario.schema.yaml`・`schemas/design/common.schema.yaml` と、スキーマに合い、既存のキーの引用符の無い値に ` # bar` を付けた行（`title: シナリオ # bar`。コメントの前の空白が 1 つで、yamllint の `comments` の `min-spaces-from-content` だけに該当する）を 1 つ持つ `docs/scenario/` の設計書と、違反の無い `docs/rule/` の文書を持ち、`schemas/` の直下に `common.schema.yaml` を持たない一時フォルダ'
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        participant F as リポジトリ
        C->>S: リポジトリの直下で起動する
        S->>F: dev-docs.yaml の documents を読む
        S->>F: 行の schema と同じフォルダのスキーマを読む
        loop 全ての文書
          S->>S: スキーマの検査
          opt 行が validators に knowledge-checks を持つ
            S->>S: 文書の違反の検査
          end
        end
        S->>S: 設計書を含む文書の Markdown の項目と YAML に lint を適用する
        S-->>C: 終了コード 1 と設計書の lint の行
    expected:
      - 終了コードが 1
      - '標準出力に `{設計書のパス}:{行}: -: yamllint/comments: {内容}` の行が 1 件だけ出て、行は ` # bar` を付けた行'
      - 標準出力に、設計書のスキーマの違反と解けない `$ref` の行が出ない
    test: test_normal_when_design_documents
  - name: 正常系（リポジトリのスキーマ）
    summary: リポジトリの全てのスキーマと設計書のテンプレートが違反なしで通り、設計書のスキーマの `description` が全て 2 文以内になっている
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: knowledge のリポジトリの `schemas/` と `docs/template/` のコピーと、`documents` が空の `dev-docs.yaml` を持つ一時フォルダ
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        participant F as リポジトリ
        C->>S: リポジトリの直下で起動する
        S->>F: schemas/design/ と schemas/ の直下のスキーマを読む
        loop 全てのスキーマ
          S->>S: 拡張したメタスキーマの検査
        end
        loop テンプレートの対応表に行がある種類のスキーマ
          S->>S: 組み立てた items とテンプレートの items を比べる
        end
        S-->>C: スキーマの違反なし
    expected:
      - 終了コードが 0
      - 標準出力が、文書 0 件・違反 0 件・警告 0 件を示す 1 行だけ
      - '`schemas/design/` の全てのキーの `description` の「。」が 2 個以下'
    test: test_normal_when_repository_schemas
  - name: 正常系（違反がある・終了コード 1）
    summary: 全ての文書を検査し終えてから、全ての違反を出して終了コード 1 で終わる
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: スキーマに合わない文書（`description` が無い）と、項目の ID が重複した文書を 1 つずつ持ち、`schemas/meta.schema.yaml` を持つ一時フォルダ
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        participant F as リポジトリ
        C->>S: リポジトリの直下で起動する
        S->>F: dev-docs.yaml の documents を読む
        loop 全ての文書
          S->>S: スキーマの検査と文書の違反の検査
        end
        S-->>C: 終了コード 1 と全ての違反の行
    expected:
      - 終了コードが 1
      - 標準出力に 2 つの文書の違反が、ファイルのパス・行・項目のパス・内容つきで 1 行ずつ出る
    test: test_normal_when_violations
  - name: 正常系（対応表のコピーが正本と違う・終了コード 1）
    summary: 対応表のコピーが正本から作り直したものと違えば、違反として出す
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '`docs/word-list/word-list-ai-slop.yaml` と、その 1 行を消したコピー `plugins/slop-check/hooks/post-tool-use/word-list-ai-slop.json` と、`schemas/meta.schema.yaml` を持つ一時フォルダ'
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        participant F as リポジトリ
        C->>S: リポジトリの直下で起動する
        S->>F: dev-docs.yaml の documents を読む
        loop 全ての文書
          S->>S: スキーマの検査と文書の違反の検査
        end
        S->>F: 正本と対応表のコピーを読む
        S->>S: 正本から作り直したコピーと比べる
        S-->>C: 終了コード 1 とコピーの違反の行
    expected:
      - 終了コードが 1
      - 標準出力に、コピーのパスと、「対応表のコピーの作成」を実行する案内の行が出る
    test: test_normal_when_word_list_copy_stale
  - name: 正常系（テンプレートがスキーマとずれている・終了コード 1）
    summary: 設計書のテンプレートの items がスキーマから組み立てたものと違えば、違反として出す
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '`schemas/design/er.schema.yaml`・`schemas/design/common.schema.yaml` と、`er.schema.yaml` のキーの `x-rules` を 1 件追加する前に生成した `docs/template/template-er.yaml` と、`schemas/meta.schema.yaml`・`schemas/template.schema.yaml` を持つ一時フォルダ'
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        participant F as リポジトリ
        C->>S: リポジトリの直下で起動する
        S->>F: dev-docs.yaml の documents を読む
        loop 全ての文書
          S->>S: スキーマの検査と文書の違反の検査
        end
        S->>F: schemas/design/ の設計書のスキーマを読む
        loop 全ての設計書のスキーマ
          S->>S: 拡張したメタスキーマ・$ref・examples の検査
        end
        loop テンプレートの対応表に行がある種類のスキーマ
          S->>S: 「設計書のテンプレートの生成」と同じ組み立てで items を作り、テンプレートの items と比べる
        end
        S-->>C: 終了コード 1 とテンプレートの違反の行
    expected:
      - 終了コードが 1
      - 標準出力に、`docs/template/template-er.yaml` のパスと、生成元の `schemas/design/er.schema.yaml` と、「設計書のテンプレートの生成」を実行する案内の行が出る
    test: test_normal_when_templates_out_of_date
  - name: 正常系（Markdown・YAML の書式の違反がある・終了コード 1）
    summary: 失敗させるルールの lint の違反を、元の文書の YAML の行で出して終了コード 1 で終わる
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '`items[].body` の 3 行目が太字だけの段落の文書と、既存のキーの引用符の無い値に ` #bar` を付けた文書（`description: B の文書 #bar`）を 1 つずつ持ち、`schemas/meta.schema.yaml` を持つ一時フォルダ'
        notes: 太字だけの段落は markdownlint の `MD036`、`#bar` は yamllint の `comments` に当たる
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        participant F as リポジトリ
        C->>S: リポジトリの直下で起動する
        S->>F: dev-docs.yaml の documents を読む
        loop 全ての文書
          S->>S: スキーマの検査と文書の違反の検査
        end
        S->>S: 文書の Markdown の項目を 1 項目ずつ一時の .md に書き出す
        S->>S: markdownlint-cli2・textlint を 1 回ずつ呼び、yamllint を当てる
        S->>S: CLI の行に項目の開始行を足して、元の文書の YAML の行にする
        S-->>C: 終了コード 1 と全ての違反の行
    expected:
      - 終了コードが 1
      - '標準出力に `{文書のパス}:{行}: items[0].body: markdownlint/MD036: {内容}` の行が出て、行は文書の YAML の中の太字の段落の行'
      - '標準出力に `{文書のパス}:{行}: -: yamllint/comments: {内容}` の行が出て、行は ` #bar` を付けた行'
    test: test_normal_when_lint_violations
  - name: 正常系（スキーマにフロー形式がある・終了コード 1）
    summary: '`schemas/` のスキーマのフロー形式を yamllint の違反にし、`docs/` の文書のフロー形式は違反にしない'
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '`required: [id, title]` の行を持つ `schemas/rule.schema.yaml` と、`tags: [{name: scope:規約}]` の行を持ち、そのスキーマに合う `docs/rule/` の文書と、`schemas/meta.schema.yaml` を持つ一時フォルダ'
        notes: '`[id, title]` は `schemas/` に適用する yamllint の設定の `brackets` に当たる'
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        participant F as リポジトリ
        C->>S: リポジトリの直下で起動する
        S->>F: dev-docs.yaml の documents を読む
        S->>F: schemas/ のスキーマを読む
        S->>S: 文書に .yamllint.yaml、スキーマに .yamllint-schemas.yaml で yamllint を当てる
        S-->>C: 終了コード 1 とスキーマの違反の行
    expected:
      - 終了コードが 1
      - '標準出力に `schemas/rule.schema.yaml:{行}: -: yamllint/brackets: {内容}` の行が出て、行は `required: [id, title]` の行'
      - 標準出力に `docs/rule/` の文書の yamllint の違反の行が出ない
    test: test_normal_when_schemas_use_flow_style
  - name: 正常系（警告のルールの違反だけがある・終了コード 0）
    summary: 警告にしたルールの違反は警告の行として出し、終了コードには数えない
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '`items[].body` に `A です。B です。` の 1 行を持つ文書と `schemas/meta.schema.yaml` だけを持つ一時フォルダ'
        notes: '`--lint-dir` に一時の lint のフォルダを指定する（既定の設定に警告にするルールは無い）。一時の lint のフォルダは、`scripts/lint/` の `.markdownlint-cli2.jsonc`・`no-inline-strong.mjs`・`.yamllint.yaml`・`.yamllint-schemas.yaml` のコピーと、textlint の `one-sentence-per-line` だけを `severity: warning` にした `.textlintrc.json` を持ち、`node_modules` は `scripts/lint/node_modules` へのシンボリックリンクにする'
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        participant F as リポジトリ
        C->>S: リポジトリの直下で起動する
        S->>F: dev-docs.yaml の documents を読む
        S->>S: 文書の Markdown の項目に markdownlint-cli2・textlint を呼ぶ
        S-->>C: 終了コード 0 と警告の行
    expected:
      - 終了コードが 0
      - '標準出力に `{文書のパス}:{行}: items[0].body: warning: textlint/one-sentence-per-line: {内容}` の行が出る'
      - 標準出力の最後の行が、違反 0 件・警告 1 件を示す
    test: test_normal_when_only_warnings
  - name: 異常系（検査の CLI が無い・終了コード 2）
    summary: maid・markdownlint-cli2・textlint のどれかが引けなければ検査を始めずに終わる
    setup:
      - name: Mock
        description: PATH から maid を外し、`--lint-dir` に存在しないフォルダを指定する
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        C->>S: リポジトリの直下で起動する
        S->>S: 検査の CLI が無い
        S-->>C: 終了コード 2 と標準エラーの理由
    expected:
      - 終了コードが 2
      - 標準エラーに、引けない CLI の名前と、開発コマンドの環境構築で入れる案内が CLI ごとに 1 行ずつ出る
    test: test_error_when_check_cli_missing
  - name: 異常系（拡張したメタスキーマを使えない・終了コード 2）
    summary: 拡張したメタスキーマが無いか、読めないか、それ自身がメタスキーマに合わなければ検査を始めずに終わる
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '`dev-docs.yaml` を持ち、`schemas/meta.schema.yaml` を持たない一時フォルダ'
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        participant F as リポジトリ
        C->>S: リポジトリの直下で起動する
        S->>F: schemas/meta.schema.yaml を読む
        F-->>S: ファイルが無い
        S-->>C: 終了コード 2 と標準エラーの理由
    expected:
      - 終了コードが 2
      - 標準エラーに `schemas/meta.schema.yaml` を使えないことと理由が出る
    test: test_error_when_meta_schema_unusable
  - name: 異常系（dev-docs.yaml が読めない・終了コード 2）
    summary: dev-docs.yaml が無いか読めなければ検査を始めずに終わる
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '`dev-docs.yaml` を持たない一時フォルダ'
    flow: |-
      sequenceDiagram
        participant C as 呼び出し元
        participant S as 全ての文書の検査
        participant F as リポジトリ
        C->>S: リポジトリの直下で起動する
        S->>F: dev-docs.yaml を読む
        F-->>S: ファイルが無い
        S-->>C: 終了コード 2 と標準エラーの理由
    expected:
      - 終了コードが 2
      - 標準エラーに `dev-docs.yaml` が無いことが出る
    test: test_error_when_config_missing
lead: '`dev-docs.yaml` の `documents[]` が指す全ての文書に、行の `schema` のスキーマの検査と「文書の違反の検査」と同じ検査を当て、`schemas/design/` の設計書のスキーマにスキーマ自身の検査を当て、設計書のテンプレートがスキーマと一致するかを比べ、全ての違反を出して終了コードで合否を返す。'
identifier: check-all
idempotent: true
side_effects: なし（ファイルを書き換えない）
callers:
  - SC-72-6#scenarios[正常シナリオ]
exclusivity: 制限なし
request:
  - name: cwd
    type: Path
    required: true
    location: argument
    description: knowledge のリポジトリの直下。`dev-docs.yaml` を読む
    notes: 作業ディレクトリとして受け取る
  - name: --lint-dir
    type: Path
    required: false
    default: '`check_all.py` と同じフォルダの `lint/`'
    location: argument
    description: lint の設定と npm の依存（`node_modules/.bin/`）を持つフォルダ
    notes: 起動したフォルダによらず、同じ設定と CLI を使う
response:
  - name: stdout
    type: str
    description: '違反 1 件を 1 行で `{ファイルのパス}:{行}: {項目のパス}: {内容}` の形で出し、最後に検査した文書の数と違反の数と警告の数を 1 行で出す。lint の違反の `{内容}` は `{CLI}/{ルール}: {内容}`、ファイル全体に当てた lint（yamllint と `.md` のファイル）の `{項目のパス}` は `-`。警告にしたルールの違反は `{内容}` の前に `warning: ` を付ける'
    example: "docs/rule/a.yaml:42: items[3].body: mermaid: Expected 'end' to close subgraph"
  - name: stderr
    type: str
    description: 終了コード 2 のときの理由
  - name: exit_code
    type: Literal[0, 1, 2]
    description: 0 = 違反なし（警告だけのときを含む）。1 = 違反が 1 件以上。2 = 検査の CLI が引けないか、`dev-docs.yaml` が読めないか、拡張したメタスキーマを使えず、検査を始めなかった
exceptions:
  - name: なし（正常終了）
    condition: 全ての文書に違反が無い（終了コード 0）。警告にしたルールの違反だけのときを含む
  - name: 終了コード 1
    condition: 違反（設計書のスキーマの誤りを含む）が 1 件以上ある。全ての文書と設計書のスキーマを検査し終えてから返す
  - name: 終了コード 2
    condition: maid が PATH から引けないか、markdownlint-cli2・textlint が `--lint-dir` の `node_modules/.bin/` に無いか、`dev-docs.yaml` が無い・YAML として読めないか、`schemas/meta.schema.yaml` が無い・YAML として読めない・それ自身が JSON Schema 2020-12 のメタスキーマに合わない
constraints:
  - item: 検査の範囲
    constraint: '`dev-docs.yaml` の `documents[]` の全ての行（`docs/` の種類と files.yaml の行）。行ごとに `schema` が指すスキーマで検査し、`validators[]` に `knowledge-checks` を持つ行はその検査も当てる。

      行の `schema` の `$ref` は、そのスキーマと同じフォルダの `*.schema.yaml` をファイル名で登録して解く（`schemas/design/` の設計書のスキーマが指す `common.schema.yaml` は `schemas/design/common.schema.yaml`）'
  - item: 設計書のスキーマの検査の範囲
    constraint: '`schemas/design/*.schema.yaml` の全てのファイル（knowledge の正本）。`schemas/design/` が無ければ検査しない'
  - item: 設計書のスキーマの検査
    constraint: |-
      ファイルごとに次の 3 つを当て、誤り 1 件を違反 1 件にする。
      メタスキーマ: `schemas/meta.schema.yaml`（JSON Schema 2020-12 のメタスキーマを `allOf` で指して `x-rules`・`x-bad-examples` の形を足した拡張したメタスキーマ）に合うか。
      `$ref`: 全ての `$ref` が、`schemas/design/` のファイル名を URI にして登録したスキーマの中で解決できるか。
      `examples`: 全ての深さの `examples` の要素が、その `examples` を持つスキーマに合うか（`$ref` は同じ登録から解く）。
      `schemas/*.schema.yaml`（knowledge の文書の種類のスキーマ）とは別に登録する
  - item: 文書の種類のスキーマの検査
    constraint: '`schemas/*.schema.yaml`（`schemas/meta.schema.yaml` を含む）にも拡張したメタスキーマを当てる。`$ref`・`examples` の検査は当てない'
  - item: '`x-rules`・`x-bad-examples` の形'
    constraint: |-
      スキーマの全ての深さのキーに当てる。`examples`・`x-bad-examples` の値の中と、`properties` の中の同じ名前の項目には当てない。
      `x-rules`: 空でない文字列の、1 件以上の配列。
      `x-bad-examples`: `value`（悪い例の値。型を問わない）と `reason`（空でない文字列）だけを持つオブジェクトの、1 件以上の配列
  - item: スキーマの違反の行
    constraint: '設計書のスキーマと `schemas/*.schema.yaml` の違反の行は、スキーマの YAML の中の誤りのある位置の行。メタスキーマの違反は誤りのあるキー、`$ref` の違反は `$ref` のキー、`examples` の違反は誤りのある要素（要素の中の項目が誤りなら、その項目）の行。項目のパスは同じ位置を `format_path` の書き方で出す'
  - item: lint の当て先
    constraint: 'markdownlint-cli2・textlint は、`documents[]` の YAML の文書の Markdown の項目（パスの末尾が `body` の文字列）を 1 項目 1 ファイルの一時の `.md` にして当て、`.md` の文書にはそのまま当てる。yamllint は `documents[]` の YAML の文書と、直下の `dev-docs.yaml`・`rules.yaml` と、`schemas/*.schema.yaml`・`schemas/design/*.schema.yaml` に当てる'
  - item: lint の行
    constraint: 一時の `.md` の違反の行は、CLI の行に `iter_strings` が返す項目の開始行を足して 1 を引いた、元の文書の YAML の行で出す
  - item: lint の CLI の呼び出し
    constraint: markdownlint-cli2・textlint は全ての一時の `.md` をまとめて 1 回ずつ呼ぶ。yamllint は Python のライブラリとして同じプロセスで呼ぶ
  - item: lint の設定
    constraint: '設定は `--lint-dir` の `.markdownlint-cli2.jsonc`・`.textlintrc.json`・`.yamllint.yaml` を CLI に指定する。CLI が `warning` で返した違反を警告、`error` で返した違反を違反にする。`.yamllint.yaml` は `extends: default` に、`comments` を `level: error`、`document-start`・`line-length` を無効、`truthy` の `check-keys` を `false`（rule-inject の索引の `on` のキーを違反にしない）にする。`schemas/` のスキーマには `.yamllint.yaml` の代わりに `.yamllint-schemas.yaml` を当て、`.yamllint-schemas.yaml` は `brackets`・`braces` の `forbid: non-empty` だけを持つ（`default` を継がない）'
  - item: 警告にするルール
    constraint: '既定の設定（`scripts/lint/`）は警告にするルールを持たず、全てのルールを `error` にする。新しいルールを追加して既存の文書に違反が残るときだけ、そのルールを設定で `warning` にし、違反を修正した後に `error` へ戻す'
  - item: 対応表のコピー
    constraint: '`docs/word-list/word-list-ai-slop.yaml` から「対応表のコピーの作成」と同じ書式で作り直したバイト列が、`plugins/slop-check/hooks/post-tool-use/word-list-ai-slop.json` と一致する。違えばコピーのパスで違反 1 件にする'
    decided_by: IF-148-2#constraints[コピーの書式]
  - item: 設計書のテンプレート
    constraint: |-
      テンプレートの対応表に行がある種類のスキーマごとに、「設計書のテンプレートの生成」と同じ組み立てで作った `items` が、`docs/template/{テンプレートの ID}.yaml` の `items` と一致する。
      違えば、テンプレートのパスで違反 1 件にし、行は `items` のキーの行、内容に生成元のスキーマのパスと生成のコマンドを出す。
      テンプレートの文書が無ければ、テンプレートのパスで違反 1 件にする。
      `$ref` を解決できないスキーマは「設計書のスキーマの検査」が違反にするので、そのスキーマのテンプレートは比べない
    decided_by: IF-201-1#constraints[組み立てる items]
  - item: 1 文書あたりの処理時間
    constraint: 「文書の違反の検査」と同じ 20 秒。超えたブロックは時間切れの違反にする
    decided_by: NFR-72-1#requirements[検査と変換のスクリプトの 1 文書あたりの処理時間]
test_file: tests/integration/scripts/test_check_all.py
