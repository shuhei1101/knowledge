    summary: "公開の文書だけを mdmark で 1 枚の HTML にまとめた、Pages の出力のフォルダを作る CLI"
  - page: IF-72-3.py.yaml
    summary: "全ての文書にスキーマの検査と文書の違反の検査を適用する CLI"
  - page: IF-148-2.py.yaml
