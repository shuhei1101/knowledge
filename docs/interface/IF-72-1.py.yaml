id: "IF-72-1"
visibility: internal
title: "文書の違反の検査"
entry:
  kind: operation
  value: '`dev-docs.yaml` の `validators[]` の `knowledge-checks`（project-index が配信元の直下で子プロセスとして起動する。境界は標準入出力と終了コード）'
flows:
  - name: 正常系
    summary: 違反の無い文書に空の配列を返却する
    setup:
      - name: Mock
        description: 差し替えない。PATH の maid を使用する
      - name: 配信元
        description: '`dev-docs.yaml`（`docs/rule/*.yaml` の行だけ）と `docs/rule/a.yaml`（項目 `x` を持つ）を持つ一時フォルダ'
      - name: 標準入力
        description: '`[A](id:a#x)` と正しい mermaid を持ち、`related` の `to` が `a` の文書'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant D as project-index
        participant S as 文書の違反の検査
        participant F as 配信元の docs
        participant M as maid
        D->>S: 標準入力に文書の YAML
        S->>S: maid が PATH にあるかを確認する
        S->>F: 文書と項目の ID、alias_type を持つ行の文書の name・aliases を集める
        S->>S: 項目の ID の重複・参照の実在・aliases の衝突・文書の中の aliases の重複を確認する
        S->>M: mermaid のブロック（残り時間で打ち切る）
        M-->>S: 誤りなし
        S-->>D: 終了コード 0 と空の配列
      ```

      <!-- /map -->
    expected:
      - 終了コードが 0
      - 標準出力が `[]`
      - 配信元のファイルのハッシュが変わらない
    test: test_normal
  - name: 正常系（違反がある）
    summary: 項目の ID の重複・参照切れ・mermaid の誤りを全て配列で返却する
    setup:
      - name: Mock
        description: 差し替えない
      - name: 配信元
        description: '`dev-docs.yaml`（`docs/rule/*.yaml` の行だけ）と `docs/rule/a.yaml` を持つ一時フォルダ'
      - name: 標準入力
        description: '項目の ID が 2 つ重なり、`[B](id:missing)` と `related` の `to: missing` と `end` の抜けた subgraph を持つ文書'
        notes: 違反は 4 件
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant D as project-index
        participant S as 文書の違反の検査
        participant F as 配信元の docs
        participant M as maid
        D->>S: 標準入力に文書の YAML
        S->>F: 文書と項目の ID を集める
        S->>S: 項目の ID の重複と参照切れを記録する
        S->>M: mermaid のブロック
        M-->>S: 誤りの行と内容
        S-->>D: 終了コード 0 と違反の配列
      ```

      <!-- /map -->
    expected:
      - 終了コードが 0
      - 標準出力の配列が 4 件で、`path` が `items[1].id`・`items[2].body`・`related[0].to`・`items[3].body`
      - mermaid の違反の `rule` の行が、文書の中の誤った行と一致する
    test: test_normal_when_violations
  - name: 正常系（対応表の examples の違反）
    summary: 対応表の行の examples が照合と合わなければ、1 件 1 違反で返却する
    setup:
      - name: Mock
        description: 差し替えない
      - name: 配信元
        description: '`dev-docs.yaml`（`docs/rule/*.yaml` の行だけ）と `docs/word-list/` を持つ一時フォルダ'
      - name: 標準入力
        description: '`kind` が `word-list` の文書。`ng: 直す`・`pattern: 直す`・`examples.hit: [直した]` の行、`ng: 形`・`pattern: 形`・`examples.pass: [形式]` の行、`pattern: "形("` の行の 3 行を持つ'
        notes: 違反は 3 件
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant D as project-index
        participant S as 文書の違反の検査
        D->>S: 標準入力に対応表の YAML
        S->>S: 各行の pattern を読み込み、examples の hit と pass に適用する
        S-->>D: 終了コード 0 と違反の配列
      ```

      <!-- /map -->
    expected:
      - 終了コードが 0
      - '標準出力の配列が 3 件で、`path` が `entries[0].examples.hit[0]`・`entries[1].examples.pass[0]`・`entries[2].pattern`'
      - 各違反の `rule` の行が、文書の中の該当する行と一致する
    test: test_normal_when_word_list_examples_fail
  - name: 正常系（aliases の衝突）
    summary: ほかの文書の name・aliases と正規化して一致する aliases を、1 件 1 違反で返却する
    setup:
      - name: Mock
        description: 差し替えない
      - name: 配信元
        description: '`dev-docs.yaml`（`docs/rule/*.yaml` の行が `alias_type: doc` を持ち、`docs/word-list/*.yaml` の行は持たない）と、`docs/rule/a.yaml`（`name: Alpha 規約`・`aliases: [アルファ]`）、`docs/rule/b.yaml`（`aliases: [ベータ]`。書き込む前の `b`）、`docs/word-list/w.yaml`（`name: 単語表`）を持つ一時フォルダ'
      - name: 標準入力
        description: '`id: b` で、`aliases` が `[" ａｌｐｈａ 規約 ", アルファ, ベータ, 単語表]` の文書'
        notes: 違反は 2 件。`ベータ` は自分の書き込む前の値、`単語表` は alias_type を持たない行の文書の値で、照合の相手にならない
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant D as project-index
        participant S as 文書の違反の検査
        participant F as 配信元の docs
        D->>S: 標準入力に文書の YAML
        S->>F: dev-docs.yaml の alias_type を持つ行の文書の name・aliases を集める
        S->>S: 自分と同じ ID の文書を除き、正規化した aliases を照合する
        S-->>D: 終了コード 0 と違反の配列
      ```

      <!-- /map -->
    expected:
      - 終了コードが 0
      - 標準出力の配列が 2 件で、`path` が `aliases[0]`・`aliases[1]`
      - '`aliases[0]` の `rule` に `a` と `name`、`aliases[1]` の `rule` に `a` と `aliases` があり、各違反の `rule` の行が文書の中の該当する行と一致する'
    test: test_normal_when_aliases_collide
  - name: 正常系（文書の中の aliases の重複）
    summary: 自分の name か前の aliases と正規化して一致する aliases を、1 件 1 違反で返却する
    setup:
      - name: Mock
        description: 差し替えない
      - name: 配信元
        description: '`dev-docs.yaml`（`docs/rule/*.yaml` の行が `alias_type: doc` を持つ）と `docs/rule/a.yaml` を持つ一時フォルダ'
      - name: 標準入力
        description: '`id: b`・`name: Beta 規約` で、`aliases` が `[ベータ, " ｂｅｔａ 規約 ", "べーた", " ベータ "]` の文書'
        notes: 違反は 2 件。`べーた` は正規化しても `ベータ` と同じにならない
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant D as project-index
        participant S as 文書の違反の検査
        D->>S: 標準入力に文書の YAML
        S->>S: 正規化した aliases を、自分の name と前の aliases に照合する
        S-->>D: 終了コード 0 と違反の配列
      ```

      <!-- /map -->
    expected:
      - 終了コードが 0
      - 標準出力の配列が 2 件で、`path` が `aliases[1]`・`aliases[3]`
      - '`aliases[1]` の `rule` に `name`、`aliases[3]` の `rule` に `aliases[0]` があり、各違反の `rule` の行が文書の中の該当する行と一致する'
    test: test_normal_when_aliases_duplicate
  - name: 正常系（dev-docs.yaml が無い）
    summary: '`dev-docs.yaml` が無ければ `aliases` を照合せず、`path: $` の違反 1 件とほかの検査の違反を返却する'
    setup:
      - name: Mock
        description: 差し替えない
      - name: 配信元
        description: '`docs/rule/a.yaml` だけを持ち、`dev-docs.yaml` を持たない一時フォルダ'
      - name: 標準入力
        description: '`items[0].body` に `[B](id:missing)` を持ち、`aliases: [アルファ]` を持つ文書'
        notes: 違反は 2 件
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant D as project-index
        participant S as 文書の違反の検査
        participant F as 配信元の docs
        D->>S: 標準入力に文書の YAML
        S->>F: 文書と項目の ID を集める
        S->>F: dev-docs.yaml を読み込む
        F-->>S: ファイルが無い
        S->>S: aliases を照合せず、ほかの検査を続ける
        S-->>D: 終了コード 0 と違反の配列
      ```

      <!-- /map -->
    expected:
      - 終了コードが 0
      - '標準出力の配列が 2 件で、`path` が `$`（`rule` に `dev-docs.yaml`）と `items[0].body`（参照切れ）'
    test: test_normal_when_config_missing
  - name: 正常系（時間切れ）
    summary: 残り時間が足りない mermaid のブロックを時間切れの違反として返却する
    setup:
      - name: Mock
        description: maid を、打ち切りまで返らないスクリプトに差し替える
      - name: 処理時間の上限
        description: 上限を 1 秒にして起動する
        notes: 上限は関数の引数で差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant D as project-index
        participant S as 文書の違反の検査
        participant M as maid
        D->>S: 標準入力に文書の YAML
        S->>M: mermaid のブロック（残り時間で打ち切る）
        M-->>S: 打ち切り
        S-->>D: 終了コード 0 と時間切れの違反
      ```

      <!-- /map -->
    expected:
      - 終了コードが 0
      - 標準出力に、打ち切ったブロックの項目の `path` で時間切れを示す違反がある
      - 起動から終了までが、上限に 1 秒を加えた時間を超えない
    test: test_normal_when_timed_out
  - name: 正常系（YAML として読み込めない）
    summary: '読み込めない入力を `path: $` の違反 1 件で返却する'
    setup:
      - name: Mock
        description: 差し替えない
      - name: 標準入力
        description: 括弧が閉じていない YAML
        notes: '`items:\n  - id: a\n    name: [`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant D as project-index
        participant S as 文書の違反の検査
        D->>S: 標準入力に壊れた YAML
        S->>S: YAML として読み込めない
        S-->>D: 終了コード 0 と path $ の違反
      ```

      <!-- /map -->
    expected:
      - 終了コードが 0
      - 標準出力が 1 件で、`path` が `$`、`rule` に読み込めない行がある
    test: test_normal_when_invalid_yaml
  - name: 異常系（maid が無い・終了コード 2）
    summary: maid が PATH で見つからなければ検査を始めずに終わる
    setup:
      - name: Mock
        description: PATH から maid を除外する
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant D as project-index
        participant S as 文書の違反の検査
        D->>S: 標準入力に文書の YAML
        S->>S: maid が PATH に無い
        S-->>D: 終了コード 2 と標準エラーの理由
      ```

      <!-- /map -->
    expected:
      - 終了コードが 2
      - 標準出力が空
      - 標準エラーに maid が PATH で見つからないことと、開発コマンドの環境構築への案内が出る
    test: test_error_when_maid_missing
  - name: 正常系（用語集の用語との aliases の衝突）
    summary: '`records` を持つ行の文書は、要素ごとの `name`・`aliases` を照合の相手にする'
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '`dev-docs.yaml`（`docs/rule/*.yaml` の行が `alias_type: doc`、`docs/terms.yaml` の行が `alias_type: term`・`records: terms` を持つ）と、`terms` に用語 `ai-slop`（`name: AI slop`・`aliases: [AI らしい単語]`）を持つ `docs/terms.yaml` を持つ一時フォルダ'
      - name: 標準入力
        description: '`id: b` で、`aliases` が `[AI らしい単語]` の文書'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant D as project-index
        participant S as 文書の違反の検査
        participant F as 配信元のファイル
        D->>S: 標準入力に文書の YAML
        S->>F: dev-docs.yaml の alias_type を持つ行の文書を集める
        S->>S: records を持つ行の文書は要素ごとに name・aliases を集める
        S->>S: 正規化した aliases を照合する
        S-->>D: 終了コード 0 と違反の配列
      ```

      <!-- /map -->
    expected:
      - 標準出力の配列が 1 件で、`path` が `aliases[0]`
      - '`rule` に相手の ID `ai-slop` と `aliases` がある'
    test: test_normal_when_aliases_collide_with_terms
lead: 標準入力の文書 1 件に、スキーマで見られない決まり（項目の ID の重複・`id:` の参照と `related` の `to` の実在・`aliases` の衝突・文書の中の `aliases` の重複・mermaid の文法）を適用し、違反を project-index の validators の約束で標準出力へ返却する。
identifier: knowledge-checks
idempotent: true
side_effects: なし（ファイルを書き換えない。maid は `--fix` を付けずに呼ぶ）
callers:
  - SC-72-5#scenarios[正常シナリオ]
  - SC-72-6#scenarios[正常シナリオ]
exclusivity: 制限なし（読み込むだけで、同時に起動されても結果は変わらない）
request:
  - name: stdin
    type: str
    required: true
    location: body
    description: 検査する文書 1 件の YAML（UTF-8）。書き込みでは書き込もうとする内容
    constraints: '`schemas/{kind}.schema.yaml` の検査は project-index が先に実行する'
    notes: 標準入力で受け取る
  - name: cwd
    type: Path
    required: true
    location: argument
    description: knowledge の配信元の直下。`docs/**/*.yaml` を読み込み、`id:` の参照先と `related` の `to` が実在するかを確認する。`dev-docs.yaml` の `documents[]` を読み込み、`aliases` の照合の相手を決める
    notes: 引数ではなく、子プロセスの作業ディレクトリとして受け取る
response:
  - name: stdout
    type: list[Violation]
    description: 違反の配列の JSON。違反が無ければ `[]`
  - name: stdout[].path
    type: str
    description: 違反した項目のパス（project-index の項目のパスと同じ記載方法）。文書全体にかかるものは `$`
    example: items[3].body
  - name: stdout[].rule
    type: str
    description: '違反の内容。先頭に文書の行（1 始まり）を `{行} 行目: ` で配置する'
    example: "42 行目: mermaid: Expected 'end' to close subgraph"
  - name: stdout[].fix
    type: str
    description: 修正の仕方。1 文で記載する
    example: subgraph を end で閉じる
  - name: stderr
    type: str
    description: 終了コードが 0 以外のときの理由（1 行）。project-index が「検査を実行できませんでした」の理由に記載する
  - name: exit_code
    type: Literal[0, 1, 2]
    description: 0 = 検査を終えた（違反の有無に依らない）。1 = 想定していない例外で落ちた。2 = maid が PATH で見つからず、検査を始めなかった
response_example: |-
  ```json
  [
    {"path": "items[2].id", "rule": "18 行目: 項目の ID `overview` が items[0] と重複しています", "fix": "項目の ID を文書の中で一意にする"},
    {"path": "items[3].body", "rule": "42 行目: mermaid: Expected 'end' to close subgraph", "fix": "mermaid の文法の誤りを修正する"}
  ]
  ```
response_notes: '違反があっても終了コードは 0 にする。project-index は 0 以外の終了コードで標準出力を読み込まず、違反 1 件（`path: $`）に置き換える'
exceptions:
  - name: なし（正常終了）
    condition: 検査を終えた。違反・時間切れ・読み込めない YAML も違反として配列で返却し、終了コード 0
  - name: 終了コード 2
    condition: '`maid` が PATH で見つからない（`shutil.which` で検査の前に見分ける）'
  - name: 終了コード 1
    condition: '想定していない例外。標準エラーに traceback を出し、project-index が「検査を実行できませんでした」の違反 1 件（`path: $`）に置き換える'
constraints:
  - item: 処理時間
    constraint: 起動から 20 秒。maid を呼ぶ前に残り時間を確認し、足りなければ呼ばずに時間切れを違反として返却する。maid には残り時間を打ち切りとして指定する
    decided_by: NFR-72-1#requirements[検査と変換のスクリプトの 1 文書あたりの処理時間]
  - item: mermaid の検査の範囲
    constraint: 文字列の項目の中の mermaid のコードブロック。バッククォート 4 つ以上で囲んだ記述例の中のブロックは検査しない
  - item: 対応表の `examples`
    constraint: '`kind` が `word-list` の文書だけに適用する。各行の照合（「書き込んだ中身の照合」と同じ照合）を `examples.hit` の全件と `examples.pass` の全件に適用し、ヒットしない `hit` とヒットした `pass` を 1 件 1 違反で返却する。`pattern` が正規表現として読み込めない行は、`examples` を適用せずに `entries[{n}].pattern` の違反 1 件で返却する'
    decided_by: IF-148-1#constraints[照合]
  - item: '`aliases` の衝突'
    constraint: |-
      検査する文書の `aliases[n]` を、`dev-docs.yaml` の `documents[]` のうち `alias_type` を持つ行の `paths` に該当する文書（ID が検査する文書と同じ文書を除く）の `name`・`aliases` と照合し、一致したら `aliases[{n}]` の違反 1 件にする。
      `records` を持つ行（用語集）は、文書の `records` のキーの配列の要素を 1 件ずつ照合の相手にし、要素の `id` を相手の ID、要素の `name`・`aliases` を相手の名前にする。
      照合の前に両方の値へ、NFKC・前後の空白の除去・英字の大文字小文字の統一（`casefold`）を適用する。
      `rule` には一致した相手の文書の ID と、相手の `name`・`aliases` の別を全て並べる。`fix` は「指す文書を 1 件に決め、片方だけに登録する」。
      `dev-docs.yaml` が無い・読み込めない場合は、`aliases` を照合せず `path: $` の違反 1 件にする
  - item: 文書の中の `aliases` の重複
    constraint: |-
      検査する文書の `aliases[n]` を、同じ文書の `name` と前の要素 `aliases[m]`（m < n）と照合し、一致したら `aliases[{n}]` の違反 1 件にする。
      照合の前の正規化は `aliases` の衝突と同じ。
      `rule` には一致した相手（`name` か `aliases[{m}]`）を 1 つ記載する。`name` と前の要素の両方に一致したら `name` を記載する。`fix` は「片方だけ登録する」。
      `dev-docs.yaml` を読み込まず、`dev-docs.yaml` が無い・読み込めない場合も照合する
  - item: '`id:` の参照'
    constraint: '`[{名前}](id:{文書の ID})` は文書が、`[{名前}](id:{文書の ID}#{項目の ID})` はその文書の項目が実在する。自分を指す参照は標準入力の内容で確認する。コードブロックの中の参照は検査しない'
test_file: tests/integration/scripts/test_knowledge_checks.py
