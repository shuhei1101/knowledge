id: IF-312-1
visibility: internal
title: SKILL.md の生成
entry:
  kind: operation
  value: リポジトリの直下で起動するコマンド（CLI）。開発者の手元から呼ぶ
lead: '`docs/skill/` の `type: skill` の設計書から、`skill.path` の SKILL.md を組み立てて書き出す。'
identifier: build-skills
idempotent: true
side_effects: '`type: skill` の設計書の `skill.path` の SKILL.md のうち、組み立てた中身と違うものを書き換える（無ければフォルダごと作る）'
callers:
  - SC-312-1#scenarios[正常シナリオ]
  - SC-312-1#scenarios[異常シナリオ（設計書がスキーマに合わない）]
exclusivity: 制限なし（同じ設計書からは同じバイト列を書き出す）
flows:
  - name: 正常系
    summary: 組み立てた中身が今の SKILL.md と違う設計書だけ、SKILL.md を書き出す
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '`schemas/design/` に `agent_flow.schema.yaml`・`common.schema.yaml` を、`docs/skill/` に `a.yaml`・`b.yaml`・`c.yaml` を持つ一時フォルダ。`a.yaml` は `type: skill` で SKILL.md がまだ無い。`b.yaml` は `type: skill` で SKILL.md が今の設計書から生成した状態。`c.yaml` は `type: flow`'
        notes: '`a.yaml` は `skill.arguments` を 1 件、`skill.allowed_tools` を 1 件、`when` と `calls`（`command`・`tool`）を持つ工程と、持たない工程を 1 つずつ持つ'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as 呼び出し元
        participant G as SKILL.md の生成
        participant F as リポジトリ
        C->>G: リポジトリの直下で起動する
        G->>F: docs/skill/ の全ての設計書と agent_flow のスキーマを読み込む
        F-->>G: 設計書とスキーマ
        G->>G: 全ての設計書をスキーマで検査し、type が skill の設計書を選ぶ
        G->>G: 設計書ごとに SKILL.md の中身を組み立てる
        G->>F: 中身が違う a.yaml の skill.path だけを書き出す
        G-->>C: 書き換えた SKILL.md のパスと終了コード 0
      ```

      <!-- /map -->
    expected:
      - 終了コードが 0
      - 標準出力が `a.yaml` の `skill.path` の 1 行だけ
      - '`a.yaml` の `skill.path` の SKILL.md が、「組み立てる frontmatter」と「組み立てる本文」の約束どおり'
      - '`b.yaml` の `skill.path` の SKILL.md のバイト列が実行の前と同じ'
      - '`c.yaml` からは SKILL.md を作らない'
      - 続けてもう一度起動すると、標準出力が空で、どのファイルのバイト列も変わらない
    test: test_normal
  - name: 正常系（工程の埋め込み）
    summary: ref を持つ工程は、参照先の工程の中身に置き換えて書き出す
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '正常系の一時フォルダで、`a.yaml` の工程の 1 つを `ref: b#steps[{b.yaml の工程の名前}]` にしたもの'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as 呼び出し元
        participant G as SKILL.md の生成
        participant F as リポジトリ
        C->>G: リポジトリの直下で起動する
        G->>F: docs/skill/ の全ての設計書と agent_flow のスキーマを読み込む
        F-->>G: 設計書とスキーマ
        G->>G: ref の工程を、参照先の工程に置き換えて組み立てる
        G->>F: a.yaml の skill.path を書き出す
        G-->>C: 書き換えた SKILL.md のパスと終了コード 0
      ```

      <!-- /map -->
    expected:
      - 終了コードが 0
      - '`a.yaml` の SKILL.md のその工程のセクションが、`b.yaml` の参照先の工程の `name`・`when`・`body`・`calls` で組み立てたもの'
    test: test_normal_when_step_ref
  - name: 異常系（スキーマに合わない・終了コード 2）
    summary: スキーマに合わない設計書があれば、どの SKILL.md も書き換えずに終わる
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: 正常系の一時フォルダで、`b.yaml` の `skill.path` を削除したもの（`a.yaml` の SKILL.md はまだ無い）
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as 呼び出し元
        participant G as SKILL.md の生成
        participant F as リポジトリ
        C->>G: リポジトリの直下で起動する
        G->>F: docs/skill/ の全ての設計書と agent_flow のスキーマを読み込む
        F-->>G: 設計書とスキーマ
        G->>G: 全ての設計書をスキーマで検査する
        G-->>C: 合わない設計書のパスと項目と終了コード 2
      ```

      <!-- /map -->
    expected:
      - 終了コードが 2
      - 標準エラーに `docs/skill/b.yaml` と `skill.path` が出る
      - '`a.yaml` の SKILL.md が作られず、`b.yaml` の SKILL.md のバイト列が実行の前と同じ'
    test: test_error_when_schema_invalid
  - name: 異常系（設計書が読み込めない・終了コード 2）
    summary: YAML として読み込めない設計書があれば、どの SKILL.md も書き換えずに終わる
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: 正常系の一時フォルダで、`c.yaml` を YAML として読み込めない中身（閉じていない引用符）にしたもの
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as 呼び出し元
        participant G as SKILL.md の生成
        participant F as リポジトリ
        C->>G: リポジトリの直下で起動する
        G->>F: docs/skill/ の全ての設計書を読み込む
        F-->>G: 読み込めない設計書
        G-->>C: 読み込めない設計書のパスと終了コード 2
      ```

      <!-- /map -->
    expected:
      - 終了コードが 2
      - 標準エラーに `docs/skill/c.yaml` が出る
      - '`a.yaml` の SKILL.md が作られず、`b.yaml` の SKILL.md のバイト列が実行の前と同じ'
    test: test_error_when_doc_unreadable
  - name: 異常系（埋め込む工程が無い・終了コード 2）
    summary: ref が指す工程が無ければ、どの SKILL.md も書き換えずに終わる
    setup:
      - name: Mock
        description: 差し替えない
      - name: リポジトリ
        description: '正常系の一時フォルダで、`a.yaml` の工程の 1 つを `ref: b#steps[無い工程]` にしたもの'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant C as 呼び出し元
        participant G as SKILL.md の生成
        participant F as リポジトリ
        C->>G: リポジトリの直下で起動する
        G->>F: docs/skill/ の全ての設計書と agent_flow のスキーマを読み込む
        F-->>G: 設計書とスキーマ
        G->>G: ref の工程を参照先で探す
        G-->>C: 無い工程の ref と設計書のパスと終了コード 2
      ```

      <!-- /map -->
    expected:
      - 終了コードが 2
      - 標準エラーに `docs/skill/a.yaml` と `b#steps[無い工程]` が出る
      - '`a.yaml` の SKILL.md が作られない'
    test: test_error_when_step_ref_missing
request:
  - name: cwd
    type: Path
    required: true
    location: argument
    description: knowledge のリポジトリの直下
    notes: 引数は取らず、作業ディレクトリとして受け取る
response:
  - name: stdout
    type: str
    description: 書き換えた SKILL.md のリポジトリの直下からのパスを 1 行に 1 件、パスの昇順で出す。書き換えが無ければ空
    example: skills/text-review/SKILL.md
  - name: stderr
    type: str
    description: 終了コード 2 のときの理由（原因の設計書のパスと項目を含む）
  - name: exit_code
    type: Literal[0, 2]
    description: 0 = 全ての SKILL.md が組み立てた中身と一致した（書き換えたものを含む）。 2 = 設計書かスキーマが読み込めないか合わず、どのファイルも書き換えなかった
exceptions:
  - name: なし（正常終了）
    condition: '全ての `type: skill` の設計書の SKILL.md を組み立て、違うものを書き出した'
  - name: 終了コード 2
    condition: 設計書か `agent_flow` のスキーマが無い・ YAML として読み込めない、設計書がスキーマに合わない、`ref` が指す工程が無い、`skill.path` がリポジトリの外を指す
constraints:
  - item: 生成の対象
    constraint: '`docs/skill/*.yaml` のうち `type` が `skill` の設計書。`type` が無いか `flow` の設計書は、`ref` の参照先にだけ使用する'
  - item: スキーマの検査
    constraint: '`docs/skill/*.yaml` の全ての設計書を、`schemas/design/agent_flow.schema.yaml`（`$ref` は `schemas/design/` の中で解決する）で検査する。合わない設計書が 1 件でもあれば、全ての合わない設計書のパスと項目を標準エラーに出す'
  - item: 書き出しの順序
    constraint: 全ての設計書の読み込み・検査・`ref` の解決・全ての SKILL.md の組み立てを終えてから書き出す。書き出しの前に 1 件でも失敗したら、どのファイルも書き換えない
  - item: 組み立てる frontmatter
    constraint: |-
      先頭と末尾を `---` の行で囲む YAML に、次の並びで記載する。値が無いキーは配置しない。
      `name`: `skill.name`、無ければ `skill.path` の親のフォルダ名。
      `description`: `summary`。
      `argument-hint`: `skill.arguments[].hint` を半角空白でつないだ文字列。
      `arguments`: `skill.arguments[].name` の配列。
      `allowed-tools`: `skill.allowed_tools` の配列。
      `skill.frontmatter` のキーを、その並びのまま続ける
  - item: 組み立てる本文
    constraint: |-
      frontmatter の後ろに次の並びで記載する。
      生成元のコメント: `<!-- {設計書のパス} から生成した。このファイルを修正せず、設計書を修正して再生成する -->` の 1 行。
      見出し: `# {title}`。`title` が無ければ `name`。
      引数: `skill.arguments` があれば `## 引数` のセクションに、列を `引数`・`説明` にした表を配置し、`引数` のセルは `$名前` のインラインコード、`説明` のセルは `description`。
      工程: `## 手順` のセクションに、`steps[]` の並びで工程ごとに `### {name}` のセクションを配置し、セクションの中は「工程のセクション」の約束どおり。
      `refs`・`decisions` は本文に出さない
  - item: 工程のセクション
    constraint: |-
      次の並びで記載し、間を空行で区切る。値が無いものは配置しない。
      `when` があれば `{when}だけ行う。` の 1 行。
      `body` をそのまま。
      `calls` があれば、`calls[]` の並びで 1 件を 1 行の箇条書きにした `呼ぶもの:` の一覧。`tool` は `ツール \`{tool}\``、`mcp` は `MCP \`{server}\` の \`{tool}\``、`command` は `コマンド \`{command}\``、`skill` は `スキル \`{skill}\``、`flow` は `エージェントフロー \`{flow}\``、`agent` は `サブエージェント \`{agent_type}\`: {instruction か flow}`（`agent_type` が無ければ `general-purpose`）。`args` があれば行の後ろに 1 行の YAML（フロースタイル）のインラインコードを添える
  - item: 工程の埋め込み
    constraint: '`ref`（`{設計書の id}#steps[{name}]`）を持つ工程は、`docs/skill/{設計書の id}.yaml` の `steps[]` の同じ `name` の工程に置き換える。参照先も `ref` を持てばたどり、同じ工程へ戻る `ref` は解決できないものとして終了コード 2 にする'
  - item: 書き出す先
    constraint: リポジトリの直下からの `skill.path`。解決したパスがリポジトリの外なら終了コード 2。文字コードは UTF-8、改行は LF で、末尾を改行 1 つで終える
  - item: 処理時間
    constraint: 制限なし（手元から呼ぶコマンド）
test_file: tests/integration/scripts/test_build_skills.py
