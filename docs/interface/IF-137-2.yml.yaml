id: "IF-137-2"
visibility: internal
title: "公開文書の配信のワークフロー"
entry:
  kind: trigger
  value: '`.github/workflows/pages.yml`。`develop` への `push` と、手動の起動（`workflow_dispatch`）'
flows:
  - name: 正常系
    summary: 公開の文書の HTML を作って Pages へ配信する
    setup:
      - name: Mock
        description: 差し替えない
      - name: develop
        description: '違反の無い文書と、`visibility: public` の文書を 1 件以上持つ'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([develop への push で起動する]) --> a[ブランチを取得する] --> b[Node を入れる] --> c[uv を入れる] --> d[Pages を設定する] --> e[公開の文書を 1 枚の HTML にまとめる]
        e -- 成功 --> f[成果物に YAML が無いことを確かめる]
        f -- YAML が無い --> g[成果物をアップロードする]
        g -->|"成功（needs: build）"| h[Pages へ配信する]
        h -- 成功 --> ok([成功。サイトの URL を出す])
      ```

      <!-- /map -->
    expected:
      - '`build` と `deploy` のジョブが成功で終わる'
      - '`deploy` のジョブの出力にサイトの URL（`https://shuhei1101.github.io/knowledge/`）が出る'
  - name: 異常系（成果物を作れない・ジョブの失敗）
    summary: Pages の成果物の作成が失敗すれば、配信せずに失敗する
    setup:
      - name: Mock
        description: 変換のスクリプトを、終了コード 1 で終わるものに差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([develop への push で起動する]) --> a[ブランチを取得する] --> b[Node を入れる] --> c[uv を入れる] --> d[Pages を設定する] --> e[公開の文書を 1 枚の HTML にまとめる]
        e -->|"失敗（終了コード 1）"| ng([build が失敗し、deploy は動かない。前に配信したサイトのまま])
      ```

      <!-- /map -->
    expected:
      - '`build` のジョブが失敗で終わり、`deploy` のジョブは動かない'
      - ジョブのログに失敗した文書のパスと変換のスクリプトの標準エラーが出る
  - name: 異常系（成果物に YAML が混じる・ジョブの失敗）
    summary: 出力のフォルダに YAML があれば、配信せずに失敗する
    setup:
      - name: Mock
        description: Pages の成果物の作成の後に、出力のフォルダへ YAML のファイルを 1 つ配置する
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        s([develop への push で起動する]) --> a[ブランチを取得する] --> b[Node を入れる] --> c[uv を入れる] --> d[Pages を設定する] --> e[公開の文書を 1 枚の HTML にまとめる]
        e -- 成功 --> f[成果物に YAML が無いことを確かめる]
        f -->|"YAML がある（パスを出す）"| ng([build が失敗し、deploy は動かない。前に配信したサイトのまま])
      ```

      <!-- /map -->
    expected:
      - '`build` のジョブが失敗で終わり、`deploy` のジョブは動かない'
      - ジョブのログに混じった YAML のパスが出る
lead: 「Pages の成果物の作成」で公開の文書だけを 1 枚の HTML にし、出力に YAML が無いことを確認してから GitHub Pages へ配信する。
idempotent: true
permissions: '`contents: read`・`pages: write`・`id-token: write`'
side_effects: GitHub Pages のサイトを成果物で置き換える（リポジトリには書き込まない）
callers:
  - SC-137-1#scenarios[正常シナリオ]
  - SC-137-1#scenarios[異常シナリオ（変換のスクリプトが失敗する）]
  - SC-137-1#scenarios[異常シナリオ（成果物に YAML が混じる）]
exclusivity: '配信は 1 つずつ実行する。実行中の配信はキャンセルせず、後から来た実行を待たせる（`concurrency` の group が `pages`、`cancel-in-progress: false`）'
constraints:
  - item: ランナー
    constraint: '`ubuntu-latest`'
    decided_by: NFR-72-1#requirements[スクリプトが動く OS]
  - item: 所要時間
    constraint: 'ジョブごとに 5 分（`timeout-minutes: 5`）'
    decided_by: NFR-72-1#requirements[CI の 1 回の所要時間]
  - item: ジョブの構成
    constraint: '成果物を作る `build` と、配信する `deploy`（`needs: build`、environment は `github-pages`。配信を許すブランチに `develop` を含める）の 2 つ。`build` が失敗したら `deploy` は動かない'
  - item: YAML の検査
    constraint: 成果物を上げる前に、リポジトリの直下で `! find _site -type f \( -name '*.yaml' -o -name '*.yml' \) | grep .` を bash で実行する。該当したパスを 1 行ずつ標準出力へ出して終了コード 1、無ければ 0
  - item: 使用する Action
    constraint: '`actions/checkout`・`actions/setup-node`（Node 24）・`astral-sh/setup-uv`・`actions/configure-pages`・`actions/upload-pages-artifact`・`actions/deploy-pages`'
notes:
  確認方法: 結合テストのファイルは持たない（GitHub Actions の上でしかジョブの成否と配信を確認できない）。ジョブが起動する「Pages の成果物の作成」の合否はその結合テストが確認する。Pages への配信そのものは、develop へのマージの後の配信のジョブの結果で確認する
overall_flow: |-
  <!-- map -->

  ```mermaid
  flowchart TD
    s([develop への push・workflow_dispatch で起動する])
    subgraph build
      a[ブランチを取得する] -- 成功 --> b[Node を入れる]
      b -- 成功 --> c[uv を入れる]
      c -- 成功 --> d[Pages を設定する]
      d -- 成功 --> e[公開の文書を 1 枚の HTML にまとめる]
      e -- 成功 --> f[成果物に YAML が無いことを確かめる]
      f -- YAML が無い --> g[成果物をアップロードする]
    end
    subgraph deploy
      h[Pages へ配信する]
    end
    s --> a
    g -->|"成功（needs: build）"| h
    h -- 成功 --> ok([成功。サイトの URL を出す])
    h -- 失敗 --> ng2([deploy が失敗する])
    a & b & c & d & g -- 失敗 --> ng([build が失敗し、deploy は動かない])
    e -- 失敗 --> ng
    f -- YAML がある --> ng
  ```

  <!-- /map -->
