id: "TP-72-1"
visibility: internal
title: "テスト実行方法"
layers:
  - id: TL-1
    name: lint
    description: '`scripts/`・`tests/`・`plugins/` に、ruff の linter と formatter の check、pyright strict を適用する。設定は直下の `ruff.toml`・`pyrightconfig.json`（`plugins/slop-check/` は `plugins/slop-check/ruff.toml` で Python 3.12 の構文に合わせる）。'
    prerequisites:
      - uv と Python 3.14 が入っている
      - リポジトリの直下で実行する
    run_all: |-
      ```bash
      uvx ruff@0.17.3 check scripts tests plugins && uvx ruff@0.17.3 format --check scripts tests plugins && uv run --no-project --python 3.14 --with pyright==1.1.414 --with pytest==9.2.0 --with ruamel.yaml==0.19.1 --with jsonschema==4.26.0 --with yamllint==1.38.0 pyright
      ```
    external_cost: なし
  - id: TL-2
    name: 単体テスト（バック）
    description: pytest で `tests/unit/` を実行する。`pyproject.toml` を持たないため、`uv run --no-project` で依存を一時の環境に入れて起動する。`scripts/` と `plugins/slop-check/hooks/post-tool-use/` は直下の `pytest.ini` の `pythonpath` で import する。slop-check のフックは端末の python3（3.12 以上）で動くため、`tests/unit/slop-check/` は Python 3.12 でも実行する。
    prerequisites:
      - uv と Python 3.14 が入っている（3.12 は uv が入れる）
      - リポジトリの直下で実行する
    run_all: |-
      ```bash
      uv run --no-project --python 3.14 --with pytest==9.2.0 --with ruamel.yaml==0.19.1 --with jsonschema==4.26.0 --with yamllint==1.38.0 pytest tests/unit && uv run --no-project --python 3.12 --with pytest==9.2.0 pytest tests/unit/slop-check
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run --no-project --python 3.14 --with pytest==9.2.0 --with ruamel.yaml==0.19.1 --with jsonschema==4.26.0 --with yamllint==1.38.0 pytest {テストファイルパス}
        ```
    parallel: false
    external_cost: なし（maid は差し替えのスクリプトを使用する）
  - id: TL-3
    name: 結合テスト（バック）
    description: pytest で `tests/integration/` を実行する。入口のスクリプトを project-index・CI と同じ `uv run --frozen --script` で子プロセスとして起動し、標準入力・標準出力・終了コードを確認する。slop-check のフックは `hooks.json` と同じく PATH の `python3` で起動する。
    prerequisites:
      - uv と Python 3.14 が入っている
      - 開発コマンドの環境構築（クローン直後）を実行してあり、maid が PATH にあり、`scripts/lint/node_modules/.bin/` に markdownlint-cli2・textlint がある
      - python3（3.12 以上）が PATH にある
      - リポジトリの直下で実行する
    run_all: |-
      ```bash
      uv run --no-project --python 3.14 --with pytest==9.2.0 --with ruamel.yaml==0.19.1 --with jsonschema==4.26.0 --with yamllint==1.38.0 pytest tests/integration
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run --no-project --python 3.14 --with pytest==9.2.0 --with ruamel.yaml==0.19.1 --with jsonschema==4.26.0 --with yamllint==1.38.0 pytest {テストファイルパス}
        ```
    duration: 約 4 分（WSL の `/mnt/c`。全ての文書の検査のフローは、lint の CLI の起動で 1 件 30〜50 秒かかる）
    parallel: false
    external_cost: なし（maid は手元の PATH のものを使用する。時間切れのフローだけ差し替えのスクリプトを使用する）
  - id: TL-4
    name: 外部疎通テスト
    run_all: 未確定
  - id: TL-5
    name: 非機能要件テスト
    run_all: 未確定
  - id: TL-6
    name: E2E テスト
    run_all: 未確定
