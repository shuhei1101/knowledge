id: "TP-72-1"
visibility: internal
title: "テスト実行方法"
layers:
  - id: TL-1
    name: lint
    description: '`scripts/`・`tests/`・`plugins/` に、ruff の linter と formatter の check、pyright strict を適用する。`.github/workflows/` の workflow のファイルに actionlint を適用し、`uses:` の action のバージョンが GitHub に実在するかを `gh api` で確認する。設定は直下の `ruff.toml`・`pyrightconfig.json`（`plugins/slop-check/` は `plugins/slop-check/ruff.toml` で Python 3.12 の構文に合わせる）。'
    prerequisites:
      - uv と Python 3.14 が入っている（actionlint と、actionlint が `run:` のスクリプトの検査に使用する shellcheck は、uv が PyPI の `actionlint-py`・`shellcheck-py` から入れる）
      - '`gh` が認証してある（`uses:` のバージョンの確認で GitHub の API を呼ぶ）'
      - リポジトリの直下で実行する
    run_all: |-
      ```bash
      (rc=0; uvx ruff@0.17.3 check scripts tests plugins || rc=1; uvx ruff@0.17.3 format --check scripts tests plugins || rc=1; uv run --no-project --python 3.14 --with pyright==1.1.414 --with pytest==9.2.0 --with ruamel.yaml==0.19.1 --with jsonschema==4.26.0 --with yamllint==1.38.0 pyright || rc=1; uvx --from actionlint-py==1.7.12.25 --with shellcheck-py==0.11.0.1 actionlint || rc=1; for u in $(grep -hoE '^[[:space:]-]*uses:[[:space:]]*[^./][^[:space:]#]*@[^[:space:]#]+' .github/workflows/*.y*ml | sed -E 's/.*uses:[[:space:]]*//' | grep -v '^docker://' | sort -u); do gh api "repos/$(echo "${u%@*}" | cut -d/ -f1-2)/commits/${u##*@}" --silent || { echo "uses のバージョンがありません: $u"; rc=1; }; done; exit $rc)
      ```
    external_cost: なし
    location: local
  - id: TL-2
    name: 単体テスト（バック）
    description: pytest で `tests/unit/` を実行する。`pyproject.toml` を持たないため、`uv run --no-project` で依存を一時の環境に入れて起動する。`scripts/` と `plugins/slop-check/hooks/post-tool-use/` は直下の `pytest.ini` の `pythonpath` で import する。slop-check のフックは端末の python3（3.12 以上）で動くため、`tests/unit/slop-check/` は Python 3.12 でも実行する。
    prerequisites:
      - uv と Python 3.14 が入っている（3.12 は uv が入れる）
      - リポジトリの直下で実行する
    run_all: |-
      ```bash
      (rc=0; uv run --no-project --python 3.14 --with pytest==9.2.0 --with ruamel.yaml==0.19.1 --with jsonschema==4.26.0 --with yamllint==1.38.0 pytest tests/unit || rc=1; uv run --no-project --python 3.12 --with pytest==9.2.0 pytest tests/unit/slop-check || rc=1; exit $rc)
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run --no-project --python 3.14 --with pytest==9.2.0 --with ruamel.yaml==0.19.1 --with jsonschema==4.26.0 --with yamllint==1.38.0 pytest {テストファイルパス}
        ```
    parallel: false
    external_cost: なし
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" -f layer=unit | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (n=0; until gh api "repos/{owner}/{repo}/actions/runs/$run_id?exclude_pull_requests=true" > /dev/null 2>&1; do n=$((n+1)); if [ $n -ge 10 ]; then echo "実行 $run_id を 10 秒参照できません" >&2; exit 1; fi; sleep 1; done) && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; gh run view "$run_id" --log; exit $rc)
      ```
  - id: TL-3
    name: 結合テスト（バック）
    description: pytest で `tests/integration/` を実行する。エントリーポイントのスクリプトを project-index・CI と同じ `uv run --frozen --script` で子プロセスとして起動し、標準入力・標準出力・終了コードを確認する。slop-check のフックは `hooks.json` と同じく PATH の `python3` で起動する。
    prerequisites:
      - uv と Python 3.14 が入っている
      - 開発コマンドの環境構築（クローン直後）を実行してあり、`scripts/lint/node_modules/.bin/` に markdownlint-cli2・textlint がある
      - python3（3.12 以上）が PATH にある
      - リポジトリの直下で実行する
    run_all: |-
      ```bash
      uv run --no-project --python 3.14 --with pytest==9.2.0 --with ruamel.yaml==0.19.1 --with jsonschema==4.26.0 --with yamllint==1.38.0 pytest tests/integration
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run --no-project --python 3.14 --with pytest==9.2.0 --with ruamel.yaml==0.19.1 --with jsonschema==4.26.0 --with yamllint==1.38.0 pytest {テストファイルパス}
        ```
    duration: 約 4 分（WSL の `/mnt/c`。全ての文書の検査のフローは、lint の CLI の起動で 1 件 30〜50 秒かかる）
    parallel: false
    external_cost: なし
    location: runner
    run_runner: |-
      ```bash
      run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" -f layer=integration | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (n=0; until gh api "repos/{owner}/{repo}/actions/runs/$run_id?exclude_pull_requests=true" > /dev/null 2>&1; do n=$((n+1)); if [ $n -ge 10 ]; then echo "実行 $run_id を 10 秒参照できません" >&2; exit 1; fi; sleep 1; done) && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; gh run view "$run_id" --log; exit $rc)
      ```
  - id: TL-4
    name: 外部疎通テスト
    run_all: 未確定
  - id: TL-5
    name: 非機能要件テスト
    run_all: 未確定
  - id: TL-6
    name: E2E テスト
    description: pytest で `tests/e2e/workflow/` を実行する。エントリーポイントが `trigger` の workflow のインターフェース定義のフローごとに、検証用のブランチを push して `gh` で本物の GitHub Actions に起動し、実行の結論・step ごとの結論・成果物を確認する。検証用のブランチ（`test-workflow/...`）はテストの後に削除する。
    prerequisites:
      - uv と Python 3.14 が入っている
      - '`git push` で knowledge の origin へ push できる'
      - '`gh` が knowledge のリポジトリの workflow を起動できるアカウントで認証してある'
      - 起動する workflow が develop にある（`workflow_dispatch` は既定ブランチの workflow だけを起動できる）
      - リポジトリの直下で実行する
    run_all: |-
      ```bash
      uv run --no-project --python 3.14 --with pytest==9.2.0 pytest tests/e2e/workflow
      ```
    run_one:
      label: ファイル
      command: |-
        ```bash
        uv run --no-project --python 3.14 --with pytest==9.2.0 pytest {テストファイルパス}
        ```
    parallel: true
    external_cost: GitHub Actions のランナー（公開リポジトリの `ubuntu-latest` のため費用なし）
    location: local
    duration: 約 4 分（4 件の workflow の実行を順に待つ。1 件はランナーの割り当てと実行で 1 分前後）
refs:
  - to: IF-352-1
    type: references
    when: "`runner` の層の実行の流れを確認するとき。"
