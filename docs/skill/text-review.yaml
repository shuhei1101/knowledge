# yaml-language-server: $schema=../../schemas/design/agent_flow.schema.yaml
id: text-review
type: skill
title: 文章を点検して修正する
summary: ファイル・フォルダ・Git のコミットで指定した範囲の文章を、knowledge の文章の規約に合わせて点検して修正し、結果をサマリーで返却する
tags:
  - topic:文章
  - topic:スキル
  - topic:サマリー
  - topic:ファイル
  - topic:手順
  - action:修正
  - action:点検
skill:
  path: skills/text-review/SKILL.md
  arguments:
    - name: range
      hint: <ファイルのパス | フォルダのパス | コミット | コミットの範囲>
      description: 点検する範囲。ファイルのパス・フォルダのパス（配下をすべて）・Git のコミットかコミットの範囲（変わったファイル）のどれでもよい
  allowed_tools:
    - Bash(git diff-tree *)
    - Bash(git diff *)
steps:
  - name: 範囲をファイルに展開する
    body: |-
      - ファイルのパスはそのファイルにする
      - フォルダのパスは配下のファイルすべてにする
      - パスとして存在しなければコミットかコミットの範囲として扱い、変わったファイルにする
      - 文章でないファイル（画像・バイナリ）は除く
    calls:
      - type: command
        command: git diff-tree --no-commit-id --name-only -r --diff-filter=d {コミット}
      - type: command
        command: git diff --name-only --diff-filter=d {範囲}
  - name: ファイルが無いときは返却して終える
    when: 展開したファイルが 0 件のとき
    body: 規約を参照せずに、指定した範囲と見つからないことを出して終える。
  - name: 規約を参照する
    body: |-
      次の規約を参照する。
      『ユーザ配下ルール記載時の規約』は、範囲に `.claude/rules/` のファイルがあるときだけ参照する。

      | 規約 | ID |
      | --- | --- |
      | 文章の書き方 | `convention-writing-style` |
      | 既存文章の維持 | `convention-keep-existing-text` |
      | 論点の提示 | `convention-issue-presentation` |
      | ドキュメントの部品 | `doc-parts` |
      | ユーザ配下ルール記載時の規約 | `claude-rule-writing` |

      - project-index の `search_docs`（`mcp__plugin_project-index_project-index__search_docs`）が使えるなら、`source` を `knowledge`、`filter` を `id` の `eq` で上の ID、`view` を `full` にして参照する
      - ツールが無いか、規約が見つからないなら、`${CLAUDE_PLUGIN_ROOT}/docs/rule/{ID}.yaml` を参照する
    calls:
      - type: tool
        tool: Read
  - name: すべてを調べて修正する箇所の一覧を作る
    body: |-
      すべてのファイルの本文を参照し、規約に反する箇所を、ファイル・箇所・適用する規約・修正後の文で一覧にする。
      一覧を作り終えるまで、ファイルは修正しない。
    calls:
      - type: tool
        tool: Read
  - name: まとめて修正する
    when: 一覧が空でないとき
    body: 一覧の箇所をまとめて修正する。
    calls:
      - type: tool
        tool: Edit
  - name: サマリーを出す
    body: |-
      ファイルごとに、修正した箇所・適用した規約・件数を出す。
      一覧が空なら「修正する箇所はありませんでした」を出す。
refs:
  - convention-writing-style#
  - convention-keep-existing-text#
  - convention-issue-presentation#
  - doc-parts#
  - claude-rule-writing#
