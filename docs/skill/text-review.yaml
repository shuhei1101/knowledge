sequence: |-
  <!-- html -->

  ```html
  <mdmark-sequence>
  {
    "title": "文章を点検して修正する",
    "scope": "コミットを渡し、dev-docs があるとき",
    "updated": "2026-10-29",
    "participants": [
      { "id": "user", "kind": "external", "name": "利用者" },
      { "id": "skill", "kind": "llm", "name": "スキル" },
      { "id": "git", "kind": "script", "name": "Git" },
      { "id": "dd", "kind": "mcp", "name": "dev-docs" },
      { "id": "fs", "kind": "data", "name": "範囲のファイル" }
    ],
    "steps": [
      { "from": "user", "to": "skill", "label": "範囲（コミット）" },
      { "from": "skill", "to": "git", "label": "変わったファイルを取る" },
      { "from": "git", "to": "skill", "label": "ファイルの一覧", "reply": true },
      { "from": "skill", "to": "dd", "label": "文章の規約を ID で引く", "tip": "search_docs。配信元は knowledge" },
      { "from": "dd", "to": "skill", "label": "規約の本文", "reply": true },
      { "from": "skill", "to": "fs", "label": "本文を読む" },
      { "from": "fs", "to": "skill", "label": "本文", "reply": true },
      { "from": "skill", "to": "fs", "label": "修正した本文を記載する" },
      { "from": "skill", "to": "user", "label": "サマリー", "reply": true }
    ]
  }
  </mdmark-sequence>
  ```

  <!-- /html -->
branches:
  - name: 正常
    when: 規約に反する文がある
    result: 反する文だけが修正され、サマリーにファイルごとの修正した箇所・当てた規約・件数が出る
  - name: 正常（修正する箇所が無い）
    when: 反する文が無い
    result: ファイルは変わらず、サマリーが「修正する箇所はありませんでした」になる
  - name: 異常（範囲にファイルが無い）
    when: 無いパスか、文章のファイルを含まないコミット
    result: 規約を読まず、渡した範囲と見つからないことが出る
