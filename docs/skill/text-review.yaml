    "title": "文章を点検して修正する",
    "scope": "起動からサマリーまで",
    "updated": "2026-10-29",
    "width": 560,
    "height": 730,
    "nodes": [
      { "id": "ask", "kind": "external", "x": 170, "y": 10, "w": 220, "h": 56, "name": "スキルを起動", "sub": "範囲を渡す" },
      { "id": "range", "kind": "script", "x": 170, "y": 100, "w": 220, "h": 56, "name": "範囲をファイルに展開", "sub": "ファイル・フォルダ・コミット" },
      { "id": "any", "kind": "dm", "x": 170, "y": 190, "w": 220, "h": 56, "name": "ファイルがあるか" },
