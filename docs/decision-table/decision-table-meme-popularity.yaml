id: decision-table-meme-popularity
kind: decision-table
name: ネットミームの知名度 判定表
description: ネットミームの元になる作品・話題の知名度（1〜5）の推奨の値を判定し、ネットミームを登録するときに AI が知名度を推奨するときに参照する。
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: ネットミームの元になる作品・話題の知名度（1〜5）の推奨の値を判定し、ネットミームを登録するときに AI が知名度を推奨するときに参照する。
  - id: meme-popularity-scope-01
    name: 使用する場面
    body: |-
      利用者が知名度の値を示したときは、その値を使用し、この判定表は使用しない。
      AI が判定した値は、登録の確認で、該当した行と確認した値（部数・順位・記事）と一緒に示し、利用者が決める。
  - id: meme-popularity-level-01
    group: ネットミームの知名度 判定表
    name: 段階の基準
    body: |-
      <!-- table: {"kind": "data"} -->

      | 知名度 | 基準 | 例 |
      | --- | --- | --- |
      | 5 | アニメやネットに詳しくない人も、名前を知っている。社会現象になった・国民的なシリーズ | 葬送のフリーレン・僕のヒーローアカデミア・呪術廻戦・グランド・セフト・オートVI |
      | 4 | シリーズとして歴史があり（続編・長期の連載）、そのシーズンで上位の人気。アニメを見る人の多くが知っている | 無職転生・幼女戦記 |
      | 3 | 歴史は無いが、放送・発売のときに、ネットで話題になった。アニメを毎期見る人なら知っている | ヤニねこ・`君のことが大大大大大好きな100人の彼女` |
      | 2 | タイトルだけ知っている人が多い。内容は、あまり知られていない | どうも、好きな人に惚れ薬を依頼された魔女です。 |
      | 1 | タイトルも、あまり知られていない | - |

      <!-- /table -->
  - id: meme-popularity-table-01
    group: ネットミームの知名度 判定表
    name: 判定表
    body: |-
      上の行から順に照合し、最初に該当した行の結果を推奨の値にする。
      どれにも該当しなければ 1 にする。

      <!-- table: {"kind": "data"} -->

      | 条件 | 結果 | 補足 |
      | --- | --- | --- |
      | 原作かシリーズの累計の発行部数が 3,000 万部以上（ゲームはシリーズの累計が 1 億本以上）か、一般のニュースで繰り返し取り上げられた・流行語の賞に入った | 5 | - |
      | 続編（2 期以上）か長期のシリーズで、発行部数が 900 万部以上（ゲームは 1,000 万本以上）か、そのシーズンの人気のランキングの上位 10 位に入っている（2 件以上で確認） | 4 | - |
      | 特定の場面・言葉がネットでネタとして広まった（記事・まとめがある）か、発行部数が 200 万部以上 | 3 | - |
      | そのシーズンの人気のランキングに掲載されているか、発行部数が 100 万部以上 | 2 | - |

      <!-- /table -->
  - id: meme-popularity-rule-01
    group: ネットミームの知名度 判定表
    name: 項目ごとの決まり
    body: |-
      <!-- table: {"kind": "data"} -->

      | 項目 | 決まり |
      | --- | --- |
      | シリーズの中の 1 作 | スピンオフと、シリーズの中の 1 作（ゲームの個別のタイトル など）は、シリーズの値で判定した段階から 1 つ下げる。根拠に「シリーズとしての値」と記載する |
      | ランキング | 回答の数が少ない投票は、順位を結果が 4 と 2 の行の確認にだけ使用する（1 位でも 5 にはしない） |
      | 一般の話題・構文 | 世代を問わず通じるものは 5、ネットを使用する人の多くに通じるものは 4、ネットに詳しい人に通じるものは 3、特定の界隈だけに通じるものは 2 にする |
      | 根拠 | 該当した行の結果と、確認した値（部数・順位・記事）を、利用者への確認に示す |

      <!-- /table -->
  - id: meme-popularity-example-01
    group: ネットミームの知名度 判定表
    name: 判定の例
    body: |-
      <!-- table: {"kind": "data"} -->

      | 元 | 根拠 | 推奨の値 |
      | --- | --- | --- |
      | 薬屋のひとりごと | 累計 5,700 万部 | 5 |
      | 葬送のフリーレン | 累計 3,500 万部 | 5 |
      | とある暗部の少女共棲 | シリーズの累計 3,100 万部で 5。スピンオフなので 1 つ下げる | 4 |
      | 無職転生 | 3 期目で、累計 1,800 万部 | 4 |
      | 幼女戦記 | 2 期目で、累計 950 万部 | 4 |
      | ヤニねこ | 1 期目。放送のときに、ネットで話題になった | 3 |
      | FX戦士くるみちゃん | 1 期目。第 1 話と第 7 話が、記事とまとめになった | 3 |
      | どうも、好きな人に惚れ薬を依頼された魔女です。 | 累計 100 万部 | 2 |
      | ダークサモナーとデキている | ランキングに掲載されていない | 1 |

      <!-- /table -->
