# yaml-language-server: $schema=../../schemas/decision-table.schema.yaml
id: decision-table-poc
kind: decision-table
name: PoC を実施する条件 判定表
description: 採用候補に PoC を実施するか、候補の比較だけで採用を決めるかを判定し、採用候補のライブラリ・方式を洗い出した後に参照する。
aliases:
  - PoC要否
tags:
  - name: scope:判定表
  - name: topic:判定表
  - name: topic:条件
  - name: topic:ライブラリ
  - name: topic:方針
  - name: topic:リスク
  - name: action:判定
  - name: action:採用
  - name: action:比較
  - name: action:検証
    main: true
status: current
visibility: internal
rev: 2
items:
  - id: overview
    name: 概要
    body: 採用候補に PoC を実施するか、候補の比較だけで採用を決めるかを判定し、採用候補のライブラリ・方式を洗い出した後に参照する。
  - id: poc-table-01
    group: PoC を実施する条件 判定表
    name: 判定表
    body: |-
      1 つでも該当すれば「PoC を実施する」にする。
      どれにも該当しなければ「PoC を実施せず、候補の比較だけで採用を決める」にする。

      <!-- table: {"kind": "data"} -->

      | 条件 | 結果 | 補足 |
      | --- | --- | --- |
      | 実績の無い候補が複数あり、実際のコードで比べないと選べない ※[poc-n1] | PoC を実施する | - |
      | 採用の方針は決定しているが、API の実際の挙動を確認しないと設計を確定できない ※[poc-n2] | PoC を実施する | - |
      | 非機能要件に性能の数値の目標があり、実測しないと成立するかを判断できない ※[poc-n3] | PoC を実施する | - |
      | 既存のシステムへの結合の影響の範囲が見通せない ※[poc-n4] | PoC を実施する | - |
      | 本番に適用する前に、手順を最初から最後まで確認したい ※[poc-n5] | PoC を実施する | - |

      <!-- /table -->

      ※[poc-n1]: ライブラリ選定型: 例: Faster-Whisper と whisper.cpp。

      ※[poc-n2]: 動作確認型: 例: 定期課金のフロー。

      ※[poc-n3]: パフォーマンス検証型: 性能の目標値を実測で確認する。

      ※[poc-n4]: 統合検証型: 例: 認証のレイヤーの差し替え。

      ※[poc-n5]: 手順検証型: 本番に適用するのをぶっつけで行うと復旧が難しいもの。
          例: DB のマイグレーション。
