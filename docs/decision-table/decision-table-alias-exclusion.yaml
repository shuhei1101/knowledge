items:
  - id: overview
    name: 概要
    body: 文書 1 件を指す名前を、エイリアスとして登録するか、登録しないかを判定し、判定フローチャート『エイリアスの登録』で文書 1 件を指す名前と分かったときに参照する。
  - id: alias-exclusion-table-01
    group: エイリアスを登録しない条件 判定表
    name: 判定表
    body: |-
      上の行から順に適用し、1 つでも該当すれば、その行の結果にする。
      どれにも該当しなければ「aliases に登録する」にする。

      <!-- table: {"kind": "data"} -->

      | 条件 | 結果 | 補足 |
      | --- | --- | --- |
      | 会話・Issue・本文で、実際にその名前で呼ばれていない ※[alias-exclusion-n1] | 登録しない | - |
      | 複数の文書や用語に当てはまる一般語で ※[alias-exclusion-n2]、特定の文脈でだけその文書を指すことも無い ※[alias-exclusion-n3] | 登録しない | 特定の文脈でだけ指すなら、文書に照合条件を記載して ※[alias-exclusion-n4] 次の行へ進む |
      | 1〜2 文字か、ほかの単語の一部としてよく出る単語である ※[alias-exclusion-n5] | 登録しない | - |
      | 正規化で吸収できる表記ゆれである ※[alias-exclusion-n6] | 登録しない | - |
      | ほかの文書・用語の name か aliases に既にある | 登録しない | 指す文書を 1 件に決めて片方だけに登録する |

      <!-- /table -->

      ※[alias-exclusion-n1]: その名前で呼ばれた: その文書を指す単語として使用された実例が、会話・Issue・本文に残っている。
          作成したばかりの文書は、作成のきっかけの会話・Issue で呼んだ名前を実例にする。

      ※[alias-exclusion-n2]: 一般語: 文書に固有でなく、別の意味の文章でも使用される単語。
          登録すると、関係ない入力にもその文書の文脈が注入される。
          例: 設定・手順。

      ※[alias-exclusion-n3]: 特定の文脈: 照合した本文に出る別の単語で、その名前がこの文書を指す場面を区切れる。
          例: 「フォルダ構成」は、「React」か「tsx」を含み「Python」を含まない本文でだけ React の規約『フォルダ構成』を指す。

      ※[alias-exclusion-n4]: 照合条件: 文書の照合条件（alias-inject の `inject_when`）に、※[alias-exclusion-n3] の文脈を記載する。
          記載する構造は規約 [フィルター・照合条件の構造](id:dev-filter-condition) に従う。
          照合条件は文書に 1 つで、その文書の name と aliases の全てに適用される。
          候補がタイトルなら、照合条件の記載で判定を終える。

      ※[alias-exclusion-n5]: 1〜2 文字の単語・ほかの単語の一部: 照合で別の単語の中でもヒットする単語。
          例: 「印」は「印刷」にヒットする。

      ※[alias-exclusion-n6]: 正規化で吸収できる表記ゆれ: [一致前の正規化](id:dev-tag-term-registration#matching-01)（NFKC・英字の大文字小文字・前後の空白）で同じ単語になる表記の違い。
          例: 全角の API と半角の API は片方だけ登録する。
