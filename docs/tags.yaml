# yaml-language-server: $schema=../schemas/tags.schema.yaml
id: tags
kind: tags
name: タグの語彙
description: 文書に付けるタグの語彙。グループ（scope・topic）ごとに、含める・含めない・例を記載する。
status: current
visibility: internal
rev: 1
tags:
  - name: scope:claude
    group: scope
    description: "含める: Claude Code のスキル・フック・MCP・プラグイン・サブエージェントの作成と、Claude 向けの JSON・ルールの記載の規約。含めない: YAML の規約（scope:dev）、プロンプトの YAML の規約（scope:prompt）。例: MCP サーバー作成ルール。"
  - name: scope:dev
    group: scope
    description: "含める: 言語を問わず守る開発の共通の規約（コーディング全般・YAML・ドキュメント管理・タグと用語の登録・ルール索引・事前確認・コンテンツの置き場所）。含めない: 特定の言語・フレームワークの規約。例: ドキュメント管理。"
  - name: scope:html
    group: scope
    description: "含める: 1 枚の HTML でさっと作る単体 HTML とサーバー描画の画面の規約（HTML・CSS・TypeScript）。含めない: React の規約（scope:react）、Next.js の規約（scope:next）、実装言語によらない画面デザインの規約（scope:ui）。例: ビルドレス原則。"
  - name: scope:markdown
    group: scope
    description: "含める: Markdown とマーメイド図、判定フローチャートの記述の規約。含めない: 判定フローチャートの本体（scope:判定フローチャート）。例: Markdown 編集規約。"
  - name: scope:next
    group: scope
    description: "含める: Next.js App Router 固有の規約（バックエンド・ルート・ページ・Server Action・キャッシュ・SEO・PWA・エラーハンドラ・環境変数・セキュリティ・テスト・デプロイ）。含めない: React 一般の規約（scope:react）、言語共通の規約（scope:typescript・scope:testing）、HTML のバニラ構成の規約（scope:html）。例: Route Files。"
  - name: scope:obs
    group: scope
    description: "含める: OBS のブラウザソースで取り込む画面の前提のブラウザと、OBS 側・ページ側の作法。含めない: 画面デザイン一般の規約（scope:ui）。例: OBSのブラウザソース。"
  - name: scope:prompt
    group: scope
    description: "含める: プロンプトを YAML のファイルで持つときの規約。含めない: プロンプトを組み立てる Python の実装（scope:python の topic:llm）。例: プロンプトファイル。"
  - name: scope:python
    group: scope
    description: "含める: Python の設計・コア・並列処理・FastAPI・LLM・パッケージ・スクリプト・共通・テストの規約。含めない: Next.js・HTML の規約。例: 型ヒント。"
  - name: scope:react
    group: scope
    description: "含める: React（Vite の SPA）のビルド・フォルダ構成・命名・状態・データ・フォーム・コンポーネント・スタイル・キーボード操作・開発ツール・テストの規約。含めない: Next.js 固有の規約（scope:next）、バニラ TS の規約（scope:html）、言語共通の規約（scope:typescript・scope:testing）。例: useEffect。"
  - name: scope:testing
    group: scope
    description: "含める: 言語・フレームワークをまたぐテストの規約（テスト戦略・E2E・フィクスチャー）。含めない: Python 固有のテストの規約（scope:python）、React 固有のテストの規約（scope:react）。例: テスト戦略。"
  - name: scope:typescript
    group: scope
    description: "含める: 言語共通の TypeScript の規約（関数・型・export・型の置き場所・コメント・整形関数とロガー）。含めない: React 固有の規約（scope:react）、HTML のバニラ構成の規約（scope:html）。例: TypeScript のスタイル。"
  - name: scope:ui
    group: scope
    description: "含める: 画面の分け方・情報の階層・文言・操作・表示の安定・トークン・レイアウト・キーボード操作・タグの絞り込みなど、実装言語によらない画面デザインの規約。含めない: デザインスタイルの材料集（scope:規約）、OBS のブラウザソース（scope:obs）、ドキュメントサイトの部品（scope:ドキュメント部品）。例: 入力と文言。"
  - name: scope:規約
    group: scope
    description: "含める: プロセス・文章・論点の提示・デザインスタイルなど、プロジェクトの進め方の規約。含めない: 言語やフレームワークの規約。例: 文章の書き方。"
  - name: scope:テンプレート
    group: scope
    description: "含める: ドキュメントの書式を定めるテンプレートと、要件洗い出しの観点集・方針決めの記録の書式。含めない: テンプレートに従って記載した各プロジェクトのドキュメント。例: テンプレート: 画面設計。"
  - name: scope:判定フローチャート
    group: scope
    description: "含める: 決めたい内容が複数の判定軸で決まるときの判定フローチャート・判定表。含めない: 判定フローチャートの記述の規約（scope:markdown）。例: 設定値の置き場所。"
  - name: scope:ドキュメント部品
    group: scope
    description: "含める: ドキュメントサイトに置く部品（タブ・ステップ・ファイルツリー・コードの行マーカー・バッジ）の使いどころと置き方。含めない: 画面デザイン一般の規約（scope:ui）、文書の書き方（scope:規約）。例: ドキュメントの部品。"
  - name: scope:使い方
    group: scope
    description: "含める: 規約を各環境で使う手順。含めない: 規約の中身。例: 規約の索引を当てる。"
  - name: scope:はじめに
    group: scope
    description: "含める: 概要・コアコンセプト・変更履歴。含めない: 規約を使う手順（scope:使い方）。例: 変更履歴。"
  - name: scope:リファレンス
    group: scope
    description: "含める: 名前から引く一覧。含めない: 手順や概要。例: 名前から引く一覧のページ。"
  - name: topic:architecture
    group: topic
    description: "含める: Python の設計原則・レイアウト・依存方向・コンポジションルート・リファクタリング判断。含めない: 命名・スタイル・型（topic:core）。例: 設計原則の優先順位。"
  - name: topic:backend
    group: topic
    description: "含める: Next.js の API ルート・DB・Drizzle・認証・キャッシュ・レートリミット・Webhook。含めない: 画面の実装（topic:frontend）。例: DB 楽観的ロック。"
  - name: topic:components
    group: topic
    description: "含める: 単体 HTML の共通 UI（カスタムエレメント・共通層の先読み）。含めない: 共通層のフォルダの規約（topic:shared）。例: カスタムエレメント。"
  - name: topic:concurrency
    group: topic
    description: "含める: Python の並列処理と非同期処理。含めない: 性能の計測（topic:performance）。例: asyncio 規約。"
  - name: topic:core
    group: topic
    description: "含める: 言語・フレームワークの土台になる共通の規約（Python のコメント・スタイル・命名・型ヒント・言語ルール・デコレーター、単体 HTML のビルドレス・サーバー描画、React のビルド・フォルダ構成・ライブラリ・コンポーネントの書き方）。含めない: 機能ごとの設計（topic:architecture）。例: 型ヒント。"
  - name: topic:css
    group: topic
    description: "含める: 単体 HTML の CSS のコメント・ネスト・レイヤー構成と、React の Tailwind。含めない: CSS クラスの命名（topic:naming）。例: デザイントークン。"
  - name: topic:devops
    group: topic
    description: "含める: Next.js のデプロイ先の選択。含めない: ビルドや品質の道具（topic:devtools）。例: デプロイ。"
  - name: topic:devtools
    group: topic
    description: "含める: React の開発の道具（Storybook・MSW のモック・ESLint・Prettier・tsconfig・MCP とプラグイン）。含めない: デプロイ（topic:devops）。例: Storybook。"
  - name: topic:fastapi
    group: topic
    description: "含める: Python の FastAPI のアプリ構成・ルーター・スキーマ・認証と例外ハンドラ・ヘルスチェック。含めない: Next.js の API ルート（topic:backend）。例: ルーター実装パターン。"
  - name: topic:frontend
    group: topic
    description: "含める: React の画面（状態・データ取得・フォーム・ダイアログ・画面・キー操作）と、Next.js のページ・ルート。含めない: API ルートと DB（topic:backend）。例: クエリ。"
  - name: topic:html
    group: topic
    description: "含める: 単体 HTML のコメント。含めない: ネイティブ要素の使い方（scope:ui）。例: HTML コメント。"
  - name: topic:js
    group: topic
    description: "含める: 単体 HTML の JavaScript と TypeScript（モジュール解決・バニラ TS の方針）。含めない: 汎用の TypeScript の規約（topic:typescript）。例: モジュール解決。"
  - name: topic:llm
    group: topic
    description: "含める: Python で LLM を扱う規約（プロバイダ・Instructor・プロンプトローダー・コストとキャッシュ・例外とリトライ）。含めない: プロンプトのファイルの規約（scope:prompt）。例: プロバイダ。"
  - name: topic:naming
    group: topic
    description: "含める: React の命名と、単体 HTML の CSS クラス・カスタムエレメントの命名。含めない: 型の置き場所（topic:typescript）。例: ファイル名。"
  - name: topic:packaging
    group: topic
    description: "含める: Python のパッケージの設定・バージョン・依存管理・配布。含めない: 実行用のスクリプト（topic:scripts）。例: pyproject 設定。"
  - name: topic:performance
    group: topic
    description: "含める: Python の性能の計測と最適化。含めない: 並列処理の API の選び方（topic:concurrency）。例: パフォーマンスチートシート。"
  - name: topic:scripts
    group: topic
    description: "含める: Python の単一ファイルスクリプト・tkinter・bat と sh のランチャー。含めない: パッケージとして配布するコード（topic:packaging）。例: 単一ファイルスクリプト。"
  - name: topic:shared
    group: topic
    description: "含める: 複数の画面や機能が使う共通層の規約（単体 HTML の shared/vendor、React・Next.js のエラー・ロガー・環境変数・セキュリティ、Python の例外・ロガー・型・定数・設定）。含めない: 特定の機能や画面だけの規約。例: ロガー。"
  - name: topic:testing
    group: topic
    description: "含める: テストの戦略・単体テスト・E2E テスト・フィクスチャー・モック。含めない: 本番コードの設計。例: テスト戦略。"
  - name: topic:tooling
    group: topic
    description: "含める: 単体 HTML の tsc の運用。含めない: Next.js の開発の道具（topic:devtools）。例: tsc 運用。"
  - name: topic:typescript
    group: topic
    description: "含める: 汎用の TypeScript のコメント・型システム・関数の引数・スタイル・型の置き場所・整形関数とロガー。含めない: 単体 HTML の JavaScript の規約（topic:js）。例: 型システム。"
  - name: topic:セットアップ手順
    group: topic
    description: "含める: 1 条件 = 1 ページの個別手順。含めない: 概要や規約の中身。例: 規約の索引を当てる。"
  - name: topic:方針決め
    group: topic
    description: "含める: 方針決めの各工程の記録と、リスクと技術的負債の一覧の書式。含めない: 方針決め以外のテンプレート。例: リスクと技術的負債の一覧。"
  - name: topic:観点
    group: topic
    description: "含める: 要件洗い出しの観点集。含めない: 要件そのもの。例: ユースケース要件 観点: 一覧。"
