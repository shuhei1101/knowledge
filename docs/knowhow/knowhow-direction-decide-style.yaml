id: knowhow-direction-decide-style
kind: knowhow
name: 作り始めに劇場動画か会話劇かを決め、会話劇には演出を入れない
description: 動画の作り始めに、カメラワークや背景を使用する劇場動画か、場面をあまり変えない会話劇かを決める判断を記載し、動画に演出をどれだけ入れるかを決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: BM3
    title: Bluemist（あおもや）の note（劇場動画と会話劇）
    url: https://note.com/bluemist/n/n4ef60b4fab8b
necessity: reference
scenes:
  fits:
    - 掛け合いの動画を作り始めるとき。
evidence:
  - source: BM3
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      作り始めに、カメラワークや背景を使用する映画寄りの「劇場動画」か、場面をあまり変えない短い「会話劇」かを決める。
      会話劇には演出は要らない。
      判断の軸はテンポ・シリアスさ・話の長さ。
