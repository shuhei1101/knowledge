evidence:
  - source: PS
    speaker: practitioner
  - source: IP
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      「専門家」の役割を指定しても正答率は上がらず、分野違い・初心者の役は正答率を下げる。
      役割は口調・文体のためだけに指定する。
      課題に関係の無い設定は、性能を最大約 30 ポイント下げるので、量で盛らない。
