id: knowhow-prompt-persona-scope
kind: knowhow
name: 役割は口調のためだけに指定し、課題に関係の無い設定を盛らない
description: プロンプトの役割（persona）は口調・文体には有効だが正確さは上げず、課題に関係の無い設定は性能を下げることを記載し、プロンプトに役割やキャラクターの設定を入れるときに参照する。
