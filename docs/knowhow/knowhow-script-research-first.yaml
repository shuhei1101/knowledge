id: knowhow-script-research-first
kind: knowhow
name: 情報を伝える台本は、論と事実を固めてからジョークを書く
description: 情報を伝える台本で、論の構造と事実を先に固め、ジョークは論を示すために後から書き、ジョークが論の公正な見せ方かを調べた人が確認する技法を記載し、解説や情報系の台本を作るときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: PASTE
    title: 'How to Make a Ruin: An Oral History of How Adam Ruins Everything Actually Ruins Everything（Paste）'
    url: https://pastemagazine.com/articles/2018/11/adam-ruins-everything-trutv-adam-conover-how-to-ma.html
necessity: reference
scenes:
  fits:
    - 解説や情報系の動画・配信の台本を作るとき。
  misfits:
    - 事実を扱わない雑談やコントの台本。
evidence:
  - source: PASTE
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      情報を伝える台本は、論の構造と事実を先に固め、ジョークは論を示すために書く。
      ジョークを書いた後に、そのジョークが論の公正な見せ方かを、事実を調べた人が判定する。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 論の構造（幕ごとに示すこと）を決める
      2. 幕ごとに事実を調べて固める
      3. ジョークを書き、事実を調べた人が公正さを確認する
tags:
  - name: topic:台本
