id: knowhow-script-one-game-heighten
kind: knowhow
name: 1 つの区切りでは笑いの型を 1 つに絞り、段階を踏んで強める
description: 1 つの区切りで笑いの型（ルール）を 1 つだけ決めて理解させ、同じ型を段階を踏んで強めて最大の一撃で閉じる技法を記載し、台本の区切りの中の笑いを組み立てるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: GOLD
    title: Maggie Scudder「How to write a comedy sketch」（GOLD Comedy）
    url: https://goldcomedy.com/resources/how-to-write-a-comedy-sketch
  - id: HINES
    title: Matt Ruby「Heighten and explore」（Funny How。Will Hines の言葉の引用）
    url: https://funnyhow.substack.com/p/heighten-and-explore
  - id: OKURA
    title: オークラ「バカリズム／自意識とコメディの日々③」（OHTABOOKSTAND）
    url: https://ohtabookstand.com/2022/02/jiishiki-03/
necessity: reference
scenes:
  fits:
    - 台本の 1 つの区切りの中で笑いを組み立てるとき。
    - 掛け合いの区切りの役割と長さを決めるとき。
  misfits:
    - 情報を伝えるだけで笑いを取らない区切り。
evidence:
  - source: GOLD
    speaker: practitioner
  - source: HINES
    speaker: practitioner
  - source: OKURA
    speaker: practitioner
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      1 つの区切りでは、面白い型（ルール・状況）を 1 つだけ決め、視聴者に理解させてから展開や崩し方で笑いを作る。
      同じ型を 3 段ほど、前の段より大きくして繰り返し、最後に最大の一撃を置いて閉じる。
      型を繰り返すだけで機械的になったら、なぜそうするのかを掘り下げる時間を挟む。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 区切りの笑いの型を 1 行で書き、2 つの型が「、そして」で並ぶなら区切りを分ける
      2. 型を理解させる段を短く書き、型を強める段を前の段より大きくして並べる
      3. 最後の段に最大の一撃を置く
