id: knowhow-script-story-five-seconds
kind: knowhow
name: 体験談の核は自分が変わった 5 秒にし、始まりをその反対に置く
description: 体験談の核を話し手が変わった・気づいた短い瞬間（5 秒）に決め、話の始まりをその反対の状態に置き、終わりを始まりと違う場所にする技法と、素材を毎日記録する方法を記載し、体験談の台本を作るときに参照する。
