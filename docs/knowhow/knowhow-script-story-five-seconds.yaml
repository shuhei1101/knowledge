items:
  - id: overview
    name: 概要
    body: |-
      体験談は 1 つの瞬間についての話で、核は話し手が変わった・気づいた 5 秒（1 秒でもよい）にする。
      始まりは核の反対の状態に置き、終わりを始まりと違う場所にする。
      出来事を順に並べるだけでは話にならない。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 体験談の核の瞬間を 1 文で書く
      2. 話の始まりに、核の前の反対の状態を書く
      3. 素材を集めるときは、その日いちばん話になる瞬間を毎日 1 つ記録する（Homework for Life）
      4. 話になる瞬間は、ギャップ・「そもそも誰が言うてんねん」・「〜すぎる人」・失敗（失礼・勘違い・言い間違い）の 4 つの型で探し、忘れる前にメモする
