items:
  - id: overview
    name: 概要
    body: |-
      立ち絵に、背景の光源に合わせた光と色を加える。
      背景がイラストなら背景色の太い縁取りを付け、夜は青を加えて周辺を暗くする。
      YMM4 では、背景から色を取得して立ち絵に乗せる処理をプラグイン LightRig が自動で行う。
