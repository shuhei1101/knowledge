kind: knowhow
id: knowhow-script-setting-swap
name: よく知られた設定を 1 つだけ変え、残りの要素を律儀に対応させる
description: 誰もが知っている作品や場面の設定を 1 つ変え（大人向けのドラえもん）、元の要素を新しい設定へ律儀に対応させて移す技法を記載し、設定からネタを作るときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: NAKATA
    title: 中田一志「漫才の笑い：エラーと非効率性と非整合性」『日本語・日本文化』41 号（2014、大阪大学のリポジトリ）
    url: https://ir.library.osaka-u.ac.jp/repo/ouka/all/50778/
necessity: reference
scenes:
  fits:
    - よく知られた作品・場面を土台にネタを作るとき。
cases:
  - work: 漫才「ドラえもん」（大人向けのドラえもん）
    content: のび太は大人の野比、ジャイアンは大人の剛田武に移し、ドラえもんの解決方法は道具ではなく「現金で新しいのを買ってください」になる。
    source: NAKATA
evidence:
  - source: NAKATA
    speaker: third_party
confidence: low
items:
  - id: overview
    name: 概要
    body: |-
      よく知られた設定を 1 つだけ変え、元の登場人物・道具・解決方法を新しい設定へ 1 つずつ対応させて移す。
      移した中身は新しい設定の中では筋が通るが、元の設定と比べたときの落差が笑いになる。
      対応させ損ねた要素（大人がラジコンで遊ぶ）は違和感として残り、ツッコミどころになる。
