name: 話す側へ寄るか、話していない立ち絵を暗く・ぼかして、焦点を話す人に移す
description: 掛け合いの動画で、2 人の構図から話す側へ寄るか、焦点が移ったキャラクター以外の立ち絵を暗く・ぼかして、話す人を示す技法を記載し、話し手の切り替わりを示すときに参照する。
