items:
  - id: overview
    name: 概要
    body: |-
      2 人を映した構図から話す側へ横に寄るか、顔へ寄る。
      寄らないときは、焦点が移ったキャラクター以外をぼかすか、話していない立ち絵を暗くする（字幕がある間だけ明るくするスクリプトも配布されている）。
