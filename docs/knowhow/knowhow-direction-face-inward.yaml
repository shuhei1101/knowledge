items:
  - id: overview
    name: 概要
    body: |-
      立ち絵は、配置した位置から画面の内側を向かせる（右の位置は左向き、左の位置は右向き）。
      髪飾りや服の文字が左右で違う立ち絵は反転できないため、反転してよいかを立ち絵ごとに持つ。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 画面で見た向き（左・右・正面）と反転してよいかをキャラクターごとに記録し、向きの違う立ち絵だけ上書きする
      2. 配置の位置ごとに向かせる向きを決める（中央は決めない）
      3. 立ち絵の向きと位置の向きが逆なら左右を反転する（正面向きと、反転できない立ち絵は反転しない）
      4. 外側を向かせる演出だけ、向きを上書きする
