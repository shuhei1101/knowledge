id: knowhow-script-stance-variants
kind: knowhow
name: 同じ素材を語り手の立場を変えて何通りか作り、話し手に合う立場を選ぶ
description: 同じ出来事を、被害者意識の語り手・極端に推し進めた黒いオチなど語り手の立場を変えて何通りか作り、話し手と観客の受け取り方に合う立場を選ぶ技法を記載し、素材の切り口を決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: SCRIPTNOTES
    title: 'Scriptnotes Episode 688: Writing Jokes with Mike Birbiglia（Transcript）'
    url: https://johnaugust.com/2025/scriptnotes-episode-688-writing-jokes-with-mike-birbiglia-transcript
    note: 骨髄提供のニュースをジョークにする箇所
necessity: reference
scenes:
  fits:
    - 1 つのニュースや体験談を台本の素材にするとき。
    - 素材の切り口が 1 つしか思い付かないとき。
cases:
  - work: Scriptnotes 第 688 回の骨髄提供のニュース
    content: Craig Mazin は、父に捨てられた語り手が骨髄を求められて「愛されている」と思い込む被害者意識のバージョンと、提供を拒む主張を極端に推し進める黒いオチのバージョンを出した。Mike Birbiglia は、重い話では最初に 1 つウケるジョークで「笑ってよい」と観客に示すことが要ると述べた。
    source: SCRIPTNOTES
evidence:
  - source: SCRIPTNOTES
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      同じ素材でも、語り手の立場で笑いの取れ方が変わる。
      語り手の立場を変えたバージョンを何通りか作り、話し手のキャラクターと観客の受け取り方に合うバージョンを選ぶ。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 素材の出来事を 1 文にまとめる
      2. 被害者として語る・悲劇ぶる・極端に推し進めて黒いオチにする、など語り手の立場を変えたバージョンを作る
      3. 話し手が言って成立するバージョンを選ぶ
      4. 重い素材では、最初に笑ってよいと示す 1 つのジョークを配置する
