items:
  - id: overview
    name: 概要
    body: |-
      台本は工程ごとに観点を変えて確認する。
      執筆の後は、事実を調べた人がジョークを論の公正な見せ方かで判定する。
      読み合わせ用の稿を演者が読んだ後に、もう一度書き直す。
