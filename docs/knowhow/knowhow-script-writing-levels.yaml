id: knowhow-script-writing-levels
kind: knowhow
name: 台本は区切りごとに、一字一句・要点・自由のどれで記載するかを決める
description: 台本の区切りごとに、一字一句（決め文句だけ）・要点（名前・言う点・話すエピソードの控え）・自由（尺と上限だけ）のどれで記載するかを決める技法を記載し、台本の細かさを決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: MCLEISH
    title: Robert McLeish, Jeff Link『Radio Production』（Routledge）
    url: https://www.routledge.com/Radio-Production/McLeish-Link/p/book/9781138819979
    note: 第 4 章
necessity: reference
scenes:
  fits:
    - 配信や動画の台本で、演者やセリフ生成に任せる範囲を区切りごとに決めるとき。
evidence:
  - source: MCLEISH
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: 台本の全てを同じ細かさで記載せず、区切りごとに記載の細かさを選ぶ。
  - id: levels-01
    name: 記載の 3 段階
    body: |-
      | 細かさ | 記載するもの | 使用する区切り |
      | --- | --- | --- |
      | 一字一句 | 言う文をそのまま | 決め文句・告知など言い方を変えられない箇所だけ |
      | 要点 | 名前・言う点・話すエピソードの控え | 話の筋は決めて言い回しを任せる箇所 |
      | 自由 | 尺と上限だけ | 雑談・コメントへの応答など演者に任せる箇所 |
tags:
  - name: topic:台本
    main: true
