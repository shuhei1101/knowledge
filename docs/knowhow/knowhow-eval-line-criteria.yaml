items:
  - id: overview
    name: 概要
    body: |-
      セリフの採点観点は、会話力・一貫性・魅力（人間らしさ・表現の幅・共感）・性格の再現の軸で作成する（CharacterEval の 13 指標をまとめた 4 軸）。
      観点は、毎回出るものと条件がそろったときだけ出るものに分け、後者は引き出す質問を作る。
  - id: steps-01
    name: 観点の候補
    body: |-
      - 興味深さ・引き込み・好感・多様さ（FED）
      - SNS で共有されやすいのは強い感情、特にポジティブなもの。キャラクターのアカウントは一方的な告知ではなく、双方向と日常の物語で評価する
