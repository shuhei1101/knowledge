description: キャラクターのセリフ・つぶやきの採点観点を、既存の評価の軸（会話力・一貫性・魅力・性格の再現）で作成し、毎回出る観点と条件で出る観点に分ける技法を記載し、セリフ生成の精度評価の観点を決めるときに参照する。
