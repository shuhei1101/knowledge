items:
  - id: overview
    name: 概要
    body: |-
      素材のページの時計（`Date.now`・`performance.now`・タイマー・`requestAnimationFrame`）を、ページのスクリプトより先に差し替える。
      書き出す側が時計を 1 フレーム分ずつ進めて、絵を取り出す。
      時計で動くライブラリ（GSAP・Chart.js・three.js）は、素材のページを通常のアニメーションとして記載したまま書き出せる。
      CSS と SVG の要素のアニメーションは時計では進まないため、止めてから時刻を直接指定する。
  - id: steps-01
    name: 使用方法
    body: |-
      1. ライブラリは、ブラウザーがそのまま読み込める形式（まとめた形式）のファイルを、素材のページと同じ所に配置する。
         モジュールの形式のファイルは、別のパッケージを名前で読み込むため読み込めないことがある
      2. 画像・フォント・ライブラリの読み込みを終えたことをページから書き出す側へ伝え、動きは時刻 0 から始める。
         読み込みを終えるまでタイマーを待たない
      3. 説明に合わせて出す動きは、名前を付けた時刻（マーク）で記載する
      4. CSS のアニメーションは時刻 0 に始まるものだけを使用し、途中から始める動きは `animation-delay` に時刻を入れる。
         CSS のトランジションと、途中でクラスを追加して始めるアニメーションは使用しない
      5. SVG の要素のアニメーションは、書き出す側が `setCurrentTime` で時刻を指定する
      6. 外部のネットワークからの読み込み・引数の無い `new Date()`・`video` と `audio` の要素・Web Worker の中のタイマーは使用しない。
         乱数は種を固定したものにする
      7. 時刻を進めた後は画面の更新を待ち、続けて 2 回同じ絵になるまで取り出す
      8. 同じ絵になるかの確認は、完全な一致ではなく差の大きさを基準に判定する（CSS のアニメーションは、見た目では分からない差がまれに 1 フレーム出る）
