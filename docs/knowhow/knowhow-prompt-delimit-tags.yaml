id: knowhow-prompt-delimit-tags
kind: knowhow
name: 指示・資料・入力を別のタグで囲み、区切りの書式を 1 つに統一する
description: プロンプトの中の指示・資料・入力を XML タグなどの区切りで分け、XML か Markdown のどちらか 1 つに統一する技法を記載し、種類の違う内容が混ざるプロンプトを作るときに参照する。
