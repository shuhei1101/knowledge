cases:
  - work: ランキングの表の素材
    content: 1 回目は文字が回転しながら大きくなる動き・枠からはみ出た黒や白の余白・既定のフォントで、パワーポイントのように見えた。2 回目は動きを除外し、枠の外を透明にし、フォントを Zen Maru Gothic と Dela Gothic One にして、枠の外の黒・白が無くなった。
    source: P2
