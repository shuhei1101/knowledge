id: knowhow-design-material-template
kind: knowhow
name: 動画の素材はデザインを決めたテンプレートから作成し、回転・拡大の動きを付けない
description: 動画に出す表・見出しなどの素材を、枠・余白・色・フォントを決めたテンプレートから作成し、素材の動きを説明に合わせた控えめなものに絞り、枠の外の余白を透明にする技法を記載し、動画の素材を作るときに参照する。
