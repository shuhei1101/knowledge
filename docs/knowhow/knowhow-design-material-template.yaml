items:
  - id: overview
    name: 概要
    body: |-
      素材は、種類（表・見出し・箇条書き）ごとに枠・余白・色・フォントを決めたテンプレートに文字と画像を入れて作成し、素材を作るたびにデザインを考えない。
      回転・拡大の動き、枠の外の余白・切り取りの乱れ、既定のフォントは、素材を AI が作成したように見せる。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 素材の種類ごとに、枠・余白・色・フォントを決めたテンプレートを数件用意する
      2. フォントはテンプレートごとに選び、既定のフォントのまま使用しない
      3. 素材の動きは控えめにし、説明に合わせて 1 行ずつ出す・グラフが伸びる程度にとどめる。
         全ての要素を動かさず、なめらかに大きさを変える・回転する動きは付けない。
         出し方はフェードなどのエフェクトで選ぶ
      4. 枠の外は透明にし、描画の側で枠を描かない
      5. 動きを付けた素材を動画に書き出すときは、[動きを付けた素材は、ページの時計を差し替えて 1 フレームずつ進めて書き出す](id:knowhow-video-material-frame-clock) に従う
