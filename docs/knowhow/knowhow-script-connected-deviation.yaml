kind: knowhow
id: knowhow-script-connected-deviation
name: ボケは相手の話につながりながら、会話の原則を 1 つだけずらす
description: ボケを無関係な発言にせず、相手の話につながったまま情報の量・あいまいさ・余計な細部・順序のどれかをずらす技法を記載し、掛け合いのボケを作るときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: NAKATA
    title: 中田一志「漫才の笑い：エラーと非効率性と非整合性」『日本語・日本文化』41 号（2014、大阪大学のリポジトリ）
    url: https://ir.library.osaka-u.ac.jp/repo/ouka/all/50778/
necessity: reference
scenes:
  fits:
    - 掛け合いのボケを作るとき。
  misfits:
    - 視聴者へ正確な情報を伝える区切り。
cases:
  - work: 中川家の漫才「病院」
    content: タクシー運転手役が病院に着くまでの会話を端折り、「いや、着きましたけど」と言う（必要な情報を省きすぎる）。
    source: NAKATA
  - work: 中川家の漫才「病院」
    content: 病院に着いた話に「スリッパスリッパ」「保険証」と要らない細部を追加する（必要以上の情報）。
    source: NAKATA
  - work: NON STYLE の漫才「取調べ」
    content: 刑事役が「お前がやったんやろ」と言った直後に犯人役が「すいませんっした」と自白し、取調べの過程を飛ばす（順序の違反）。
    source: NAKATA
evidence:
  - source: NAKATA
    speaker: third_party
confidence: low
items:
  - id: overview
    name: 概要
    body: |-
      ボケを相手の話につなげることは [ボケのずれは、理屈でつながる形にする](id:knowhow-script-coherent-incongruity) に従う。
      つながったまま会話の原則をずらす方法は、情報を省きすぎる・あいまいに答える・要らない細部や関係ない情報を追加する・順序を飛ばす、の 4 つ。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 相手の発言に対して普通の返答を決める
      2. 4 つのずらし方から 1 つを選び、返答をずらす
      3. ずらした返答が相手の話題から離れていないかを確認する
