id: knowhow-script-name-the-game
kind: knowhow
name: 元ネタの面白さを、具体を外した言い方を含む複数の言い方で書き出す
description: 元ネタの場面の面白さ（ゲーム）を、具体つき・具体なし・代表の台詞・短いタイトルなど複数の言い方で書き出し、具体を外した言い方から型を取り出す技法を記載し、元ネタから台本の笑いの型を抜き出すときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: HINES
    title: 'Will Hines「Name The Game: Seven Ways」（Improv Nonsense）'
    url: https://willhines.substack.com/p/name-the-game-seven-ways
necessity: reference
scenes:
  fits:
    - 元ネタ（作品・場面・投稿）から笑いの型を抜き出すとき。
    - パロディや型を借りた台本を作るとき。
evidence:
  - source: HINES
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      同じ面白さを何通りにも言い表せ、正しい言い方は 1 つではない。
      具体を外した言い方が型の抽出になり、代表の台詞とタイトルが元ネタの核を残す。
  - id: steps-01
    name: 使用方法
    body: |-
      | 言い方 | 書くこと |
      | --- | --- |
      | 具体つき | 場面の細部を使用して面白さを短く書く |
      | 具体なし | 場面の細部をできるだけ使用せずに書く |
      | 代表の台詞 | 面白さを表す台詞を 1 つ選ぶ |
      | 短いタイトル | 6 語ほどのタイトルを付ける |
      | 行動と反応 | 面白さを作る行動と反応を書く |
      | 感情の反応 | 面白さを作る感情の反応を書く |
      | 基本・変なこと・理由 | 誰・何・どこ、普通と違う点、それでも共感できる理由を書く |
tags:
