id: knowhow-script-story-from-ending
kind: knowhow
name: 体験談は結末から逆算して組み、結末に要らない部分を削る
description: 体験談を結末から逆算して組み立て、結末に要らない部分を削り、話して録った反応で修正していく技法を記載し、体験談の台本の組み立てと推敲をするときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: BIRBIGLIA
    title: Matt Ruby「Begin with your ending – and other great storytelling advice from Mike Birbiglia」（Funny How）
    url: https://funnyhow.substack.com/p/begin-with-your-ending-and-other
  - id: HEAD
    title: Chris Head「How to tell a story in stand-up」（Chortle）
    url: https://www.chortle.co.uk/features/2022/04/10/50527/how_to_tell_a_story_in_stand-up
necessity: reference
scenes:
  fits:
    - 体験談の台本を組み立てるとき。
    - 体験談の台本を推敲するとき。
  misfits:
    - 結末を決めずに雑談として話す区切り。
evidence:
  - source: BIRBIGLIA
    speaker: practitioner
  - source: HEAD
    speaker: practitioner
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      体験談は結末を先に決め、結末から逆算して組み立てる。
      結末に関係ない部分を削る（前置きの削り方は [前置きは必要な分だけにする](id:knowhow-script-trim-words) に従う）。
      組んだ話は何度か話して録り、笑いが起きた所を聞き直して修正する。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 結末の一言を書く
      2. 結末に要る前提を並べ、それ以外の部分を削除する
      3. 台本を話して録った反応を元に、削る箇所と追加する箇所を決める
