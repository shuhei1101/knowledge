items:
  - id: overview
    name: 概要
    body: |-
      フリは、ボケの前に普通はこうなるという予測（概念 A）を観客に持たせる部分。
      スジフリで何について話すかの枠を置き、マエフリでその話題を深めて次の一言を予測させる。
      ボケは予測と別の概念 B を出す。
