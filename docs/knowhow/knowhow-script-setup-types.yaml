name: フリは、話題の枠を置くフリと、次の一言を予測させるフリの 2 段で置く
description: ボケの前に、話題全体の枠を置くフリ（スジフリ）と、話題を深めて次の一言を予測させるフリ（マエフリ）を置き、ボケで予測からずらす技法を記載し、ボケの前振りを作るときに参照する。
