cases:
  - work: ダウンタウンの漫才「誘拐」（安部 2006 の分析）
    content: 誘拐の話題を置き（スジフリ）、続けて脅迫電話の場面へ深めて（マエフリ）、観客に普通の脅迫電話を予測させてからボケる。
    source: HAN
