items:
  - id: overview
    name: 概要
    body: |-
      ツッコミのセリフは前のセリフに少し被せ、速く大きめにする。
      字幕と画面は短く動かして強調する。
  - id: steps-01
    name: 使用方法
    body: |-
      1. ツッコミのセリフを前のセリフに少し被せ、話す速さと音量を上げる
      2. ツッコミの字幕は縮小か回転で 0.5 秒以内に出し、±7px で揺らす
      3. 画面揺れを短く入れる
      4. ギャグの場面ではボケの立ち絵を拡大し、相方は一時的に画面から外す
