id: knowhow-prompt-self-check
kind: knowhow
name: 自己検証はテストやツールの結果と組み合わせ、外部の結果が無い自己修正に頼らない
description: LLM に「終える前に基準と照らして確認する」を指定する自己検証は、テストやツールの結果と組むときに有効で、外部の結果が無い自己修正は弱いことを記載し、プロンプトに確認の手順を入れるかを決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: SC
    title: LLM の自己修正の研究
    url: https://arxiv.org/abs/2406.01297
necessity: reference
scenes:
  fits:
    - コード・数学など、テストやツールで結果を確認できる課題。
  misfits:
    - 外部の結果が無く、モデル自身に見直させるだけの修正。
    - 過剰に検証する傾向のあるモデル。
evidence:
  - source: SC
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      「終える前に基準と照らして確認する」の指定は、テストやツールの結果と組むときに有効。
      外部の結果が無い自己修正は弱く、モデルによっては過剰な検証になる。
tags:
  - name: topic:プロンプト
    main: true
  - name: topic:llm
  - name: action:検証
  - name: topic:ノウハウ
