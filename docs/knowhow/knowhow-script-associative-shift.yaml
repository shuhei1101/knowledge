kind: knowhow
id: knowhow-script-associative-shift
name: 一語から連想される常識の流れや別の意味を、次々にボケへ持ち込む
description: 会話中の一語が呼び起こす一連の常識（布団→敷く→たたむ→押入れ）や多義語の別の意味（風邪を引く→網を引く）を次々にボケへ持ち込む技法を記載し、掛け合いのボケを広げるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: NAKATA
    title: 中田一志「漫才の笑い：エラーと非効率性と非整合性」『日本語・日本文化』41 号（2014、大阪大学のリポジトリ）
    url: https://ir.library.osaka-u.ac.jp/repo/ouka/all/50778/
necessity: reference
scenes:
  fits:
    - 掛け合いのボケを 1 つの話題から広げるとき。
  misfits:
    - 本筋の説明を急ぐ区切り。
cases:
  - work: 中川家の漫才「病院」
    content: 「布団の中でずっと寝てた」に対し、剛が布団をたたむ話・押入れに入れる話へ進み、本筋（風邪）から離れていく。
    source: NAKATA
  - work: 中川家の漫才「病院」
    content: 「風邪を引いて」から「網を引く」「お年寄りの手を引く」と「引く」の別の意味を並べる。
    source: NAKATA
evidence:
  - source: NAKATA
    speaker: third_party
confidence: low
items:
  - id: overview
    name: 概要
    body: |-
      会話中の一語を手がかりに、その語にまつわる一連の常識か、多義語の別の意味を呼び起こし、本筋の話へ次々に持ち込む。
      本筋から脇道に逸れる分だけ、聞き手の理解が遅れて笑いになる。
