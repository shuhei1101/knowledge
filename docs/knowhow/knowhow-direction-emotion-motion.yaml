    title: Bluemist（あおもや）の note の連載「よく見る演出や効果を YMM4 でやってみる」
    url: https://note.com/bluemist/n/ne848990a66bd
    note: '連載の他の記事: n/nd967428adc09・n/naae3e05480b4・n/n9e07fd2b018e・n/n8de1037f6acb'
necessity: reference
scenes:
  fits:
    - 表情の差分だけでは感情が伝わりにくい立ち絵に、動きを付けるとき。
evidence:
  - source: BMS
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      立ち絵の感情は、移動・回転・拡大縮小の小さな動きで表す。
      表情の選び方は [表情の型](id:knowhow-direction-expression-preset) に従う。
  - id: steps-01
    name: 感情ごとの動き
    body: |-
      | 感情・状態 | 動き |
      | --- | --- |
      | 震え・恐怖 | 5〜10px のランダム移動を 1 フレームか 0.01 秒間隔 |
      | 慌てる | ランダム回転 |
      | 怒り・驚き | 移動と回転の組み合わせ |
      | 話しかける | 跳ねる |
      | オチ | 砕け散る・崩れ落ちる |
      | 待機 | 反復移動か、6 秒周期で 100.3% の拡大縮小と −1.5px の移動（呼吸） |
