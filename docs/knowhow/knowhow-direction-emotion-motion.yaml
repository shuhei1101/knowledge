id: knowhow-direction-emotion-motion
kind: knowhow
name: 立ち絵の感情は移動・回転・拡大縮小の小さな動きで表す
description: 立ち絵の震え・慌てる・怒り・待機などの感情と状態を、移動・回転・拡大縮小の小さな動きで表す技法を記載し、立ち絵に動きを付けるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
