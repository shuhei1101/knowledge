id: knowhow-script-review-first-viewer
kind: knowhow
name: 台本は初めて見る人の頭で確認し、つながりの分からない所と身内の基準で記載した所を修正する
description: 台本のレビューで、作り手の知識を外して初めて見る人の頭で読み、つながりの分からない所と、身内の客や作り手の基準でしか伝わらない所を見つけて修正する観点を記載し、台本をレビューするときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: SCRIPTNOTES
    title: 'Scriptnotes Episode 688: Writing Jokes with Mike Birbiglia（Transcript）'
    url: https://johnaugust.com/2025/scriptnotes-episode-688-writing-jokes-with-mike-birbiglia-transcript
    note: 演出家 Seth Barrish と台本の論理を確認する箇所と、150 語が 4 語になる箇所
  - id: ISHIDA
    title: NON STYLE 石田明さんと、「お笑い」の話を。（４）令和ロマンからのヤーレンズ。（ほぼ日）
    url: https://www.1101.com/n/s/nonstyle_ishida/2025-02-10.html
    note: いつもの客を基準にするとズレる、の箇所
necessity: must
scenes:
  fits:
    - 台本・ネタをレビューするとき。
    - 作り手が素材を読み込んだ後に台本を推敲するとき。
cases:
  - work: Mike Birbiglia の一人舞台の台本
    content: 演出家の Seth Barrish は、自分の頭を空にして一度もショーを見たことがない人になりきり、「その 2 つの考えのつながりが分からない」と指摘する（知識の呪いを取り除く）。編集では 150 語の箇所が最後に 4 語になるが、その 4 語が正しい 4 語になる。
    source: SCRIPTNOTES
evidence:
  - source: SCRIPTNOTES
    speaker: practitioner
  - source: ISHIDA
    speaker: practitioner
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      作り手は素材を知っているため、つながりの抜けと内輪の前提に気付けない。
      台本は初めて見る人の頭で読み、伝わらない所を修正する。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 作り手の知っている前提を外し、初めて見る人として台本を読む
      2. 前の話と次の話のつながりが分からない所にマーカーを付ける
      3. 身内の客や作り手しか分からない言葉・前提を、初めて見る人が分かる言葉へ修正する
      4. 説明が長い所は、伝わる最小の言葉まで削る
tags:
  - name: topic:台本
    main: true
