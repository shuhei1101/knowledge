kind: knowhow
id: knowhow-script-tsukkomi-timing
name: ツッコミは相手の発話に重ね、重ねる区切りと間を空ける区切りを交互に配置する
description: ツッコミと相槌を相手の発話の終わりに重ね、重なりの多い区切りと少ない区切りを交互に配置して緩急を付ける技法を記載し、掛け合いのテンポを決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: KAWASHIMA
    title: スコギンズ・川嶋宏彰・松山隆司「間の合った発話タイミング制御を目的とした漫才の動的構造の分析」（京都大学、2005）
    url: https://vision.kuee.kyoto-u.ac.jp/japanese/happyou/pdf/Kawashima_2005_P_187.pdf
necessity: reference
scenes:
  fits:
    - 掛け合いのテンポを決めるとき。
cases:
  - work: 市販の漫才 2 本（合計約 11 分・761 発話）の計測
    content: ボケからツッコミへの移り目の 57% が重なり、43% が間を空けた。重なりの多いサブネタと少ないサブネタが交互に現れた。
    source: KAWASHIMA
evidence:
  - source: KAWASHIMA
    speaker: third_party
confidence: low
items:
  - id: overview
    name: 概要
    body: |-
      ツッコミと相槌は、相手の発話が終わる前に重ねる割合が大きい。
      話題（サブネタ）ごとに、重ねて速く応じる区切りと間を空ける区切りを交互に配置し、流れに緩急を付ける。
