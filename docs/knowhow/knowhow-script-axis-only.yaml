items:
  - id: overview
    name: 概要
    body: |-
      台本は軸と、区切りごとに「ここで何が起きるか」の 1〜2 文だけを持ち、オチ・言い回し・ボケとツッコミ・文の数はセリフ生成に任せる。
      台本でオチまで決めると、どのモデルでもセリフが面白くなくなる。
  - id: split-01
    group: 分担
    name: 台本とセリフ生成が持つもの
    body: |-
      | 工程 | 持つもの |
      | --- | --- |
      | 台本 | 軸（その動画で必ず伝えること・扱う順・事実と数字・使用する素材）と、区切りごとに起きることの 1〜2 文 |
      | セリフ生成 | オチ・言い回し・ボケとツッコミ・文の数。受け取るのは場面と目的と軸だけ |
      | 次の区切りの演出指示 | 前の区切りの実際のセリフを参照して記載し、セリフで決まったことを次に引き継ぐ |
  - id: steps-01
    name: 使用方法
    body: |-
      1. 台本の構成の前に、別のモデルに題材と尺だけを指定して流れの案を 2〜3 個出させる
      2. 案を選んで軸にまとめる
      3. 事実と数字は軸に記載し、セリフ生成には「軸の事実は変えない」だけを伝える
