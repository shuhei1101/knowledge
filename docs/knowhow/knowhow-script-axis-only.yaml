id: knowhow-script-axis-only
kind: knowhow
name: 台本は軸だけを決め、オチと言い回しはセリフ生成に任せる
description: 台本で動画の軸（必ず伝えること・順・事実・素材）だけを決め、オチ・言い回し・ボケはセリフ生成に任せ、流れの案出しを別のモデルに任せる技法を記載し、台本とセリフ生成の分担を決めるときに参照する。
