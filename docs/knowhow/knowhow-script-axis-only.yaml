    title: PoC（1 セグメントの動画の作成）の 2 回目の結果 A-156
    url: file:///mnt/c/Users/shuhe/repo/tmp/%E4%BD%95%E3%81%A7%E3%82%82%E4%BC%9A%E8%A9%B1/.mindstella/docs/A-156.md
    note: '`## セリフのプロンプト`'
necessity: reference
scenes:
  fits:
    - 台本を作る工程とセリフを生成する工程を分けて動画を作るとき。
    - 台本の段階でどこまで決めるかに迷ったとき。
  misfits:
    - 一字一句を決めた原稿を読み上げる動画を作るとき。
