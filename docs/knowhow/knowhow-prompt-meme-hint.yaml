id: knowhow-prompt-meme-hint
kind: knowhow
name: セリフ生成に渡すネットミームは、場面に最も合うものだけを選び、作品名を書かずにセリフと背景だけを記載する
description: セリフ生成のプロンプトにアニメのセリフなどのネットミームを渡すときに、渡す側が場面に最も合うものだけに絞り、作品名を書かずにセリフと背景だけを記載し、そのまま使わなくてよいと添える技法を記載し、セリフ生成にネットミームの候補を渡すときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-25'
sources:
  - id: A19
    title: セリフの依頼文にアニメのネタを渡す実験（MindStella の資料 A-19）
    url: file:///home/shuhei2441/.local/share/aituber/workspaces/299e2b07-63db-4f69-b593-c6ec6cf23ebb/docs/A-19.mark.md
    note: 4 条件・8 回の返答と、利用者の評価（スレッド TH-39）
necessity: must
scenes:
  fits:
    - キャラクターの掛け合いのセリフを LLM に生成させ、アニメのセリフなどのネタを入れたいとき。
  misfits:
    - 作品そのものを話題にする場面で、作品名を出すこと自体が必要なとき。
cases:
  - work: 琴葉葵が、琴葉茜の思いついた方法には既にテスト駆動開発という名前があると教える場面
    content: 場面に合う「今では一般攻撃魔法と呼ばれているよ」と、合わないネタ（「ググレカース」「君はヒーローになれる」など）を数を変えて渡した。使用されたのは場面に合うネタだけで、6 件渡しても使用は 1〜2 件だった。作品名を添えたため、3 回が「フリーレンみたいに言うなや」と作品名を出すツッコミの型になり、利用者は面白くないと評価した。「そのまま使わなくてよい」と添えると、「人の夢とかないんか！？」のようにもじった使い方も出た。
    source: A19
evidence:
  - source: A19
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      セリフ生成に渡すネットミームは、渡す側が場面に最も合うものだけ（1〜2 件）に絞る。
      場面に合わないネタを渡すと、ノイズになって無理に使用されることがある。
      作品名は書かず、セリフとその背景（どんな場面で言われ、ネットでどう使われるか）だけを記載する。
      作品名を渡すと、作品名を口に出すツッコミの型になりやすく、言わずにほのめかす方が面白い。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 場面の面白さに最も近いネタを、候補から 1〜2 件だけ選ぶ
      2. ネタごとに、セリフ（言葉）と背景だけを箇条書きで記載し、作品名とキャラクター名は書かない
      3. 「言い回しを変えたり一部だけ取り入れたりしてよい。合わなければ使用しなくてよい」と添える
      4. どの文で使用するかは指定しない
