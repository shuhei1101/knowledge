id: knowhow-direction-camera-move
kind: knowhow
name: カメラは動かす前と後の構図を先に決め、速く・急に動かさない
description: 動画のカメラを、動かす前と後の構図を先に決めてから遅めに動かし、交互に話す 2 人へ毎回振らずに視聴者の負担を抑える技法を記載し、動画のカメラワークを決めるときに参照する。
status: current
visibility: internal
