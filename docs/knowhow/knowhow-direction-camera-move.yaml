confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      カメラワークは動く前と後の構図をつなぐもので、止まった画もカメラワークに入る。
      カメラを動かすと視聴者に負担がかかるので、構図を先に決めて遅めに動かす。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 動かす前と後の構図を決める
      2. 遠くを速く動かさない
      3. 交互に話す 2 人へ毎回カメラを振らず、2 人を映した画に戻す
      4. 速すぎるカメラ・急な傾き・顔へ急に寄るトランジションを使用しない
      5. 手ぶれ風の揺れは酔いやすいので、部分的に使用する
      6. 背景と立ち絵に奥行きの差を付け、動かしたときに視差を出す
