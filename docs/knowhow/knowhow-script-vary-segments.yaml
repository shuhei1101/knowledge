id: knowhow-script-vary-segments
kind: knowhow
name: 1 つの題材・型で最後まで通さず、区切りごとに前から変えることを決める
description: 1 つの題材や笑いの型で台本の最初から最後まで通さず、区切りごとに前の区切りから変えることを決めて勢いを保つ技法を記載し、台本の中盤の区切りを組むときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: HANAWA
    title: ナイツ 塙が語る、M-1論と芸人の辞めどき「40歳くらいの芸人はみんな悩んでる」（Real Sound）
    url: https://realsound.jp/book/2019/11/post-448666_2.html
  - id: KURUMA
    title: M-1王者・令和ロマンが決勝戦のライバルたちと自身のネタ分析「実は最初と最後しかウケてない」!?（FANY Magazine）
    url: https://magazine.fany.lol/173869/
  - id: HINES
    title: Matt Ruby「Heighten and explore」（Funny How。Will Hines の言葉の引用）
    url: https://funnyhow.substack.com/p/heighten-and-explore
necessity: reference
scenes:
  fits:
    - 台本の中盤の区切りを組むとき。
    - 前の区切りと同じリズムが続いているとき。
cases:
  - work: ナイツの M-1 のネタ
    content: 「宮崎駿」の題材だけで最初から最後まで行くと勢いが出ないため、切り分けて色々なボケを入れて勢いを付けた。
    source: HANAWA
  - work: 令和ロマンの M-1 決勝のネタ
    content: 見直すと、最初と最後の一瞬しかウケておらず、中盤はウケていなかった。
    source: KURUMA
evidence:
  - source: HANAWA
    speaker: practitioner
  - source: KURUMA
    speaker: practitioner
  - source: HINES
    speaker: practitioner
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      1 つの題材や型で最後まで通すと、勢いが出ず中盤がウケなくなる。
      区切りごとに前の区切りから変えることを 1 つ決め、型を強める区切りの間に、なぜそうするのかを掘り下げる区切りを挟む。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 前の区切りの台詞を読み、題材・型・リズムを確認する
      2. 次の区切りで前から変えることを 1 つ決め、区切りのメモに記載する
