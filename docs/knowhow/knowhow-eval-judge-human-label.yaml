id: knowhow-eval-judge-human-label
kind: knowhow
name: LLM の採点器は人の正解ラベルとの一致率で選び、低い観点は採点に使用しない
description: LLM の採点が面白さやロールプレイで人に届かず、採点器の点を目標にすると質を上げず点だけが上がるため、人の正解ラベルとの一致率で採点器を選び、人の確認を挟む技法を記載し、LLM の採点を精度評価に使用するときに参照する。
