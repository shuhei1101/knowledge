items:
  - id: overview
    name: 概要
    body: |-
      LLM の採点は、セリフの面白さやロールプレイで人に届かない。
      採点器は人の正解ラベルとの一致率で選び、一致率の低い観点は採点に使用しない。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 人が出力の一部に正解ラベルを付ける。点を付けていくうちに基準が変わるので、基準はラベルを付けながら固める
      2. 観点ごとに採点器と人の一致率を測り、一致率の高い採点器を選ぶ
      3. 一致率の低い観点は採点に使用せず、人が確認する
      4. 採点器の点を目標に自動で修正するときは、人の確認を挟む（質を上げず点だけが上がるのを防ぐ）
  - id: notes-01
    name: 人に届かない例
    body: |-
      | 観点 | LLM と人 |
      | --- | --- |
      | 大喜利の全体の面白さ | 相関 0.17〜0.27。人は共感、LLM は新規性を重視する |
      | 誰が話しているか | 最良の LLM で約 69%、人は 90.8% |
      | キャラクターの会話の質（CharacterEval） | GPT-4 の採点と人の相関は約 0.37 |
