kind: knowhow
id: knowhow-script-nori-tsukkomi
name: ノリツッコミは同じ型で続け、ツッコミの型を混ぜない
description: 一度ボケに乗ってから指摘するノリツッコミを、キャラが毎回同じ型で使うように揃え、相手を一方的に否定する型と混ぜない技法を記載し、エージェントのツッコミ役の型を決めるときに参照する。
