    title: 呉健朗『2 体のエージェントが相補的ユーモア発言を行うインタラクションモデルの研究』（日本大学 博士論文、2023）
    url: https://nihon-u.repo.nii.ac.jp/record/2002143/files/Go%20Kenro-3.pdf
necessity: reference
scenes:
  fits:
    - ツッコミ役のキャラが繰り返し登場する配信で、ツッコミの型を決めるとき。
cases:
  - work: ボケ役とツッコミ役の 2 体の対話エージェントを 3 日間使う実験
    content: ノリツッコミだけを使う条件は日を追うごとにユーモアを感じやすくなった。否定のツッコミとノリツッコミをランダムに混ぜた条件は「統一感の無さからツッコミ役に怖さを感じた」と言われ、対話を続けたい意欲も下がった。
    source: GO
evidence:
  - source: GO
    speaker: third_party
confidence: low
items:
  - id: overview
    name: 概要
    body: |-
      ノリツッコミは、ボケを一方的に否定せず、一度同意して乗ってから指摘する。
      同じキャラが毎回同じ型で応じると、視聴者が型を覚えてユーモアを感じやすくなる。
      否定の型を混ぜると一貫性が無くなり、ツッコミ役が怖く感じられる。
