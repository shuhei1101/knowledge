items:
  - id: overview
    name: 概要
    body: |-
      役は、論や主張の構造を決めた後に決める。
      掛け合いの役を、知識を話す役・別の見方を追加する合いの手の役・視聴者の驚きを代弁する聞き手の役に分ける。
