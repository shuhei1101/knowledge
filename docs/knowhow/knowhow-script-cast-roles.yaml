name: 掛け合いの役は、主張を決めた後に、話し手・別の見方・視聴者の代弁に分ける
description: 掛け合いの台本の役を、論や主張を決めた後に、知識を話す役・別の見方を追加する合いの手の役・視聴者の驚きを代弁する聞き手の役に分ける技法を記載し、複数の演者が話す台本の役割を決めるときに参照する。
