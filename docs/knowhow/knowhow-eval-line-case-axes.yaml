name: セリフの評価ケースは、感情・ボケとツッコミの型・場面・キャラクターの知識と会話の長さを軸にする
description: キャラクターのセリフ・つぶやきの評価ケースの軸として、感情の分類・ボケとツッコミの型・場面の区分・知らないはずの知識・会話の長さを使用する技法を記載し、セリフ生成の評価ケースの軸を決めるときに参照する。
