items:
  - id: overview
    name: 概要
    body: セリフの評価ケースは、次の軸の値の組で作る。
  - id: steps-01
    name: 軸の候補
    body: |-
      | 軸 | 値 |
      | --- | --- |
      | 感情 | Plutchik の 8 つの感情と強さの段階 |
      | ボケ・ツッコミの型 | ボケ 18 種・ツッコミ 12 種。研究ではツッコミは沈黙・否定・オウム返し・比喩の 4 型 |
      | 場面 | ボイスパックの区分（時報・挨拶・応援・行事）。掛け合いの場面は別に作る |
      | キャラクターの知識 | キャラクターが知らないはずのことを尋ねるケース |
      | 会話の長さ | 100 往復を超える会話（キャラクターが崩れる） |

      キャラクターの型（元気・クール・お姉さん・ツンデレ など）は、出典ごとに境界が揺れるので、軸にするときは型ごとの定義を自分で決める。
