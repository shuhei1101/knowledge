id: knowhow-script-but-therefore
kind: knowhow
name: 区切りは「そして」でなく「でも」「だから」でつなぐ
description: 台本の区切りどうしを「そして」で並べず「でも」「だから」の因果でつなぎ、どれか 1 つを抜くと成り立たなくなる順にする技法を記載し、台本の区切りのつなぎを作るときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: DICKS
    title: 'The Knowledge Project #202「Matthew Dicks: The Storytelling Expert」'
    url: https://fs.blog/knowledge-project-podcast/matthew-dicks/
    note: 01:02:50「'And' stories vs. 'but / therefore' stories」
necessity: reference
scenes:
  fits:
    - 体験談や企画の流れを区切りに分けて作るとき。
  misfits:
    - 独立した話題を並べる雑談の区切り。
evidence:
  - source: DICKS
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      区切りを「そして」でつなぐと、出来事を順に並べた一日の報告になる。
      「でも」「だから」でつなぐと、前の区切りが次の区切りの理由になり、話として進む。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 区切りの間に「でも」「だから」のどちらかを入れて読めるかを確認する
      2. どれか 1 つの区切りを抜いても話が成り立つなら、その区切りは削るか、因果が通るように修正する
tags:
  - name: topic:台本
    main: true
  - name: topic:構成
  - name: topic:ノウハウ
