id: knowhow-prompt-open-ended-line
kind: knowhow
name: セリフのプロンプトは場面と目的だけを指定し、文の数・役割・オチを指定しない
description: LLM にキャラクターのセリフを生成させるプロンプトで、場面と目的だけを指定してオチまで任せる技法（放牧プロンプト）を記載し、セリフ生成のプロンプトを作るときに参照する。
