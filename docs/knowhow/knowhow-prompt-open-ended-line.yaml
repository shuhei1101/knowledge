confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      セリフを生成させるプロンプトには、話し手・場面・目的だけを指定し、文の数・文ごとの役割・オチ・言い回しを指定しない。
      指定するほどモデルの決められる所が無くなる。
      面白さは、モデルの違いより任せた範囲の違いで決まる。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 話し手（キャラクターの口調・一人称）と、尺の目安を記載する
      2. 場面（どこで・何をする）と目的（この場面で起きること）を 1〜2 文で記載する
      3. オチと言い回しは任せると記載する
      4. 返却する構造（JSON のキー）だけを指定する
      5. 返った文からト書きが混ざっていないかを確認し、混ざっていれば除く
