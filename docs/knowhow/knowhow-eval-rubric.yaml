id: knowhow-eval-rubric
kind: knowhow
name: LLM の採点は段階ごとの基準文と満点の参考例を指定し、理由を先に出させ、曖昧な観点は Yes/No に分ける
description: LLM に出力を採点させるときに、段階ごとの基準文・満点の参考例・理由から点の順で人との相関を上げ、曖昧な観点を Yes/No に分け、観点ごとに別の採点にする技法を記載し、採点のプロンプトを作るときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: PR
    title: Prometheus
    url: https://arxiv.org/abs/2310.08491
  - id: CK
