    url: https://arxiv.org/abs/2502.09082
necessity: reference
scenes:
  fits:
    - LLM にセリフや文章を採点させるプロンプトを作るとき。
evidence:
  - source: PR
    speaker: practitioner
  - source: CK
    speaker: practitioner
  - source: CS
    speaker: practitioner
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      段階ごとの基準文と満点の参考例を指定し、理由→点の順に出力させると、人との相関が上がる。
      曖昧な観点は Yes/No の質問に分解する。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 観点ごとに、段階ごとの基準文を記載する
      2. 満点の参考例を添える
      3. 理由を先に、点を後に出力させる
      4. 曖昧な観点は Yes/No の質問に分解する
      5. 欠点を挙げさせて減点し、観点ごとに別の採点にする（まとめて 1 回で採点すると、人との一致が約 77% から 65% に下がる）
