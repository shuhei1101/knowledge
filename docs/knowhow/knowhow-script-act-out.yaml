id: knowhow-script-act-out
kind: knowhow
name: オチは説明せず、登場人物の台詞として演じさせる
description: 話の中の出来事を語りで説明せず、登場人物の台詞や仕草として演じさせる技法（act-out）を記載し、体験談やネタの山場の台詞を書くときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: RUBY
    title: Matt Ruby「Using act outs to get laughs」（Funny How）
    url: https://funnyhow.substack.com/p/the-power-of-act-outs
  - id: HEAD
    title: Chris Head「How to tell a story in stand-up」（Chortle）
    url: https://www.chortle.co.uk/features/2022/04/10/50527/how_to_tell_a_story_in_stand-up
    note: Bringing it to life with act-outs
necessity: reference
scenes:
  fits:
    - 体験談の山場で、出てきた人の言葉を伝えるとき。
    - オチが語りでは伝わらないとき。
  misfits:
    - 事実を正確に伝える必要がある説明の区切り。
evidence:
  - source: RUBY
    speaker: practitioner
  - source: HEAD
    speaker: practitioner
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      出来事を語りで説明する代わりに、その場の人の台詞と仕草として演じさせる。
      オチが笑いにならないときは、オチを演じさせる形に書き換える。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 「〜と言われた」と説明している箇所を、その人の台詞の引用に書き換える
      2. 台詞には声色や仕草の指示を添える
tags:
  - name: topic:台本
    main: true
  - name: topic:セリフ
  - name: topic:笑い
  - name: topic:ノウハウ
