kind: knowhow
id: knowhow-script-heavy-story-permission
name: 重い話は、笑ってよいという合図を先に出す
description: 病気や死などの重い体験談で、話し手が無事でいることや、笑いが自分の向き合い方であることを示し、観客に笑ってよいと伝える技法を記載し、重い題材を笑いのある台本にするときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: PLAYBILL
    title: Mike Birbiglia Gives You Permission to Laugh（Playbill）
    url: https://playbill.com/article/mike-birbiglia-gives-you-permission-to-laugh
  - id: RUBY
    title: Matt Ruby「How to massage an extremely dark joke」（Funny How。Mike Birbiglia の話）
    url: https://funnyhow.substack.com/p/how-to-massage-an-extremely-dark
necessity: reference
scenes:
  fits:
    - 重い題材の体験談を笑いのある台本にするとき。
  misfits:
    - 視聴者や第三者の不幸を題材にする区切り。
cases:
  - work: 父の脳卒中の冗談（Mike Birbiglia）
    content: 暗い冗談で客席が笑ってよいか迷ったとき、「今夜の冗談のいくつかは自分のため。これは自分の対処の仕方で、皆さんにもそうであってほしい」と言うと客席が沸いた。
    source: RUBY
evidence:
  - source: PLAYBILL
    speaker: practitioner
  - source: RUBY
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      話し手が無事で、生きて話していると観客に伝われば、観客は重い話を笑ってよいと受け取る。
      客席が笑ってよいか迷ったときは、笑いが話し手自身の向き合い方であることを言葉にする。
