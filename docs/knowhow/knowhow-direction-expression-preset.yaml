id: knowhow-direction-expression-preset
kind: knowhow
name: 立ち絵の表情は用意した型から選び、部位を自由に組み合わせない
description: 立ち絵の表情を、目・眉・口などの部位の組を決めた型から選び、型が許可する部位だけを変える技法を記載し、動画や配信の立ち絵の表情を選ぶ仕組みを作るときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
