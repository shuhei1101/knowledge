name: 動画の映像はブラウザで時刻を指定して 1 フレームずつ撮り、音声は ffmpeg で別に合成する
description: 画面の描画を再利用して動画を書き出すときに、映像をヘッドレスのブラウザで時刻を指定して 1 フレームずつ撮り、音声・連結・BGM を ffmpeg で合成する技法と、他の書き出しの方式を選ばない理由を記載し、動画の書き出しの方式を選ぶときに参照する。
