items:
  - id: overview
    name: 概要
    body: |-
      映像と音声を分ける。
      映像はヘッドレスの Chromium で、画面と同じ描画を時刻を指定して 1 フレームずつ描いて撮る。
      音声の配置・SE・セグメントの連結・BGM の重ねとフェードは、ffmpeg を直接呼んで合成する。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 描画は、実時間のループではなく「時刻を指定すると、その時刻の絵を描く」構造にし、画面は同じ描画を実時間のループから呼ぶ。
         GSAP などのライブラリで動きを付けた素材のページは、[動きを付けた素材は、ページの時計を差し替えて 1 フレームずつ進めて書き出す](id:knowhow-video-material-frame-clock) に従う
      2. 前のフレームの状態に依存するエフェクト（粒子の位置を前のフレームから動かす雨など）は、時刻から位置を計算する構造にする
      3. 書き出しは実時間の待ちや再生の終了のイベントを使用せず、先に作成した時刻表と時刻だけで進める
      4. Playwright の `page.clock` は 30 fps の刻みに使用せず、取りこぼしたタイマーを止める用途だけにする
      5. 画面に埋め込む動画のファイルは、事前に VP9 か B フレームなしの H.264 に変換し、フレームごとに再生位置を指定して待つ
      6. 起動のモードと Chromium のバージョンを固定する。
         GPU の無い端末では WebGL をソフトウェアの描画で動かす
  - id: alternatives-01
    name: 選ばない方式
    body: |-
      <!-- table: {"kind": "data"} -->

      | 方式 | 選ばない理由 |
      | --- | --- |
      | ブラウザの中で canvas を WebCodecs で動画にする（Mediabunny） | DOM を取り込めず、字幕・立ち絵・素材の配置を canvas の描画として再実装する。撮る方式が遅すぎると分かったときの切り替え先にする |
      | HTML を撮る出来合いのツール（HyperFrames） | 更新が非常に速く、要の API が追加されて間もない。時刻から描く構造にしておけば後から置き換えられる |
      | canvas のフレームワーク（Revideo） | 保守が止まっていて、音声の不具合が残っている |
      | React のフレームワーク（Remotion） | React が前提で、無料で使用できる利用者に制限がある |
      | 全てを ffmpeg のフィルターで合成する | 画面の描画を再利用できず、見た目を二重に実装する |

      <!-- /table -->
