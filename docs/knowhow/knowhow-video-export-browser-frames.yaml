scenes:
  fits:
    - 配信の画面と同じ描画（DOM・CSS・canvas）で動画を書き出すとき。
    - 書き出しを待てるジョブとして実行できるとき。
  misfits:
    - 実時間より速い書き出しが要るとき（描画を canvas で再実装してブラウザの中で動画にする方式を検討する）。
cases:
  - work: 掛け合い動画の 1 セグメントの書き出しの調査
    content: Playwright のスクリーンショットの自作は、依存を追加せず DOM と CSS をそのまま撮れ、実時間より遅いが、ジョブとして待てる時間で書き出せた。Mediabunny は最も速いが DOM を取り込めず、HyperFrames は更新が非常に速く要の API が追加されて間もなく、Revideo は保守が止まっていた。
    source: R16
