id: knowhow-direction-background-switch
kind: knowhow
name: 背景は場所・時間が変わる所だけで切り替え、会話中はカメラの寄りやスクロールで画面を変える
description: 動画の背景を場所・時間が変わる所だけで切り替え、同じ場所の会話中はカメラの寄りやスクロールで画面を変える技法を記載し、動画の背景を切り替える所を決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: AM1
    title: あおもやの動画「カメラ制御って必要？」
    url: https://www.youtube.com/watch?v=52Xsgw79K-o
  - id: AM2
    title: あおもやの動画（場面転換）
    url: https://www.youtube.com/watch?v=5sPWcJy0oNY
necessity: reference
scenes:
  fits:
    - 劇場動画で、背景を切り替える所を決めるとき。
  misfits:
    - 同じ場所で会話が続いている途中（区切りを多用するとテンポが落ちる）。
evidence:
  - source: AM1
    speaker: practitioner
  - source: AM2
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      背景は場所・時間が変わる所だけで切り替える。
      同じ場所の会話中は背景を変えず、カメラの寄りやスクロールで画面を変える。
      大きく変わらない場面の切り替えはただのカットにし、転換の効果を多用しない。
  - id: steps-01
    name: 背景の用意
    body: |-
      カメラを振るには横長の背景が要る。
      横長の背景が無いと、画面の変化はズームが中心になる。
