    - コントや掛け合いの区切りを組むとき。
  misfits:
    - 構成を決めずに流す雑談の区切り。
cases:
  - work: The Daily Show
    content: 1 幕目はその日のニュース、2 幕目は日々のニュースから少し離れたもの（特派員のコーナーなど）にする。
    source: AMIRA
  - work: Adam Ruins Everything
    content: 各回の 3 幕の形を先に承認してから、調査と執筆に入る。
    source: PASTE
