id: knowhow-script-sketch-structure
kind: knowhow
name: 区切りは状況・1 つの面白いこと・3 段の盛り上げ・締め・button の 5 点で組む
description: コントの区切りを、短い状況の説明・1 つの面白いこと・3 段の盛り上げ・締め・最後の一言（button）の 5 点で組み、番組全体は幕ごとに役割を分けて先に決める構成の型を記載し、台本の全体と区切りの構成を決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
