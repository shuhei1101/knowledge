confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      番組全体は幕ごとに役割を分け、幕の形を先に決める。
      1 つの区切りは次の 5 点で組む。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 状況の説明: 視聴者の疑問に早く答え、台詞 5 行以内にする
      2. 面白いことを 1 つだけ出す
      3. その 1 つを 3 段ほど、前の段より大きくして盛り上げる（区切りの大半をここに当てる）
      4. やりすぎる・常識の声を入れる・新たな人を出す・時間切れにする、のどれかで締める
      5. 最後に一言の笑い（button）を付ける
