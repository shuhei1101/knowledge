id: knowhow-direction-se-timing
kind: knowhow
name: SE は画面効果を先に決めてから、音の頭をセリフ・画像・字幕・表情の変わる瞬間に合わせる
description: 動画の SE を、画面効果を決めた後に追加し、音の頭をセリフの頭・画像や字幕の出る瞬間・表情の変わる瞬間に合わせる技法を記載し、動画に SE を入れるときに参照する。
