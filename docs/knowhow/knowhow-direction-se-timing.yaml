items:
  - id: overview
    name: 概要
    body: |-
      SE は、ズーム・集中線・揺れ・フラッシュ・転換の画面効果を先に決め、その効果に合わせて後から追加する。
      鳴らし始めは、セリフ開始・画像や字幕の表示開始・表情変化・動作開始に合わせる。
      テロップとのずれは 0.1 秒でも面白さを落とす。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 区間ごとの画面効果を決める
      2. SE の音の頭を、セリフの頭か画像・字幕が出る瞬間に合わせる
      3. ツッコミの直後と場面の切り替わりにも SE を入れる
      4. 滑ったボケだけは、約 1 秒黙ってから鳴らす
      5. 芝居と BGM で伝わる場面は鳴らさない
