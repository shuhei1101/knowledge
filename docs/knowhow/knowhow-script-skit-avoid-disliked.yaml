name: 長い・本題と無関係・大げさな効果音・ボケとツッコミの連発の茶番を入れない
description: 視聴者の不満が集まる茶番（長い・本題の遅れ・本題と無関係・大げさな効果音・ボケとツッコミの連発）を記載し、茶番を入れた台本やセリフを確認するときに参照する。
