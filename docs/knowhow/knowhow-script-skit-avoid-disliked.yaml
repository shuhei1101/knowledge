items:
  - id: overview
    name: 概要
    body: 視聴者の不満は、茶番があること自体より、長さ・本題の遅れ・本題と無関係・大げさな効果音・ボケとツッコミの連発に集まる。
  - id: checks-01
    name: 確認すること
    body: |-
      - 本題が始まるまでが長くないか
      - 茶番が本題とつながっているか
      - ボケのたびにツッコミを入れていないか（流してそのまま進めてよい）
      - 効果音やエフェクトが大げさすぎないか
