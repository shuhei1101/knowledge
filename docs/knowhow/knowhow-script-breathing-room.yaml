id: knowhow-script-breathing-room
kind: knowhow
name: 本命のボケの前には小ボケを詰めず、笑う間を空ける
description: 本命のボケの直前に小さなボケを詰め込まず、ジョークの後と次のジョークの前に間を空けて、視聴者が笑いを処理できるようにする技法を記載し、台本のボケの密度と配置を決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: KALAN
    title: 99% Invisible「How to Write a Joke」（Elliott Kalan）
    url: https://99percentinvisible.org/episode/646-how-to-write-a-joke/transcript/
    note: Mystery Science Theater 3000 の観客の反応の箇所
necessity: reference
scenes:
  fits:
    - 台本のボケを並べて密度を決めるとき。
    - 本命のボケの直前の区切りを記載するとき。
evidence:
  - source: KALAN
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      ジョークが多すぎると、視聴者は 1 つのジョークを処理する前に次のジョークが来て、笑う時間が無くなる。
      ジョークの後と次のジョークの前の時間を空け、強いジョークが目立つように弱いジョークを間引く。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 本命のボケの直前には小ボケを配置しない
      2. ボケが続く区切りは、弱いボケを削って強いボケの後に間を残す
