    speaker: practitioner
  - source: ISHIDA
    speaker: practitioner
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      ジョークが多すぎると、視聴者は 1 つのジョークを処理する前に次のジョークが来て、笑う時間が無くなる。
      ジョークの後と次のジョークの前の時間を空け、強いジョークが目立つように弱いジョークを間引く。
      ウケなくてよい時間（ダレ場）に小ボケを入れると、演者の人柄が薄れる。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 笑いを取らない区切り（ダレ場）を残し、小ボケで埋めない
      2. ボケが続く区切りは、弱いボケを削って強いボケの後に間を残す
