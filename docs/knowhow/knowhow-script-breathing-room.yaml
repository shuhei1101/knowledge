id: knowhow-script-breathing-room
kind: knowhow
name: ボケを詰め込まず、ウケない時間（ダレ場）を残す
description: 台本にボケを詰め込まず、ウケなくてよい時間（ダレ場）に小ボケを入れずに、ジョークの後と次のジョークの前に間を残す技法を記載し、台本のボケの密度を決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: KALAN
    title: 99% Invisible「How to Write a Joke」（Elliott Kalan）
    url: https://99percentinvisible.org/episode/646-how-to-write-a-joke/transcript/
    note: Mystery Science Theater 3000 の観客の反応の箇所
  - id: ISHIDA
    title: NON STYLE 石田明さんと、「お笑い」の話を。（11）「人」のところでつながっている。（ほぼ日）
    url: https://www.1101.com/n/s/nonstyle_ishida/2025-02-17.html
    note: 笑福亭鶴瓶の助言「もっとダレ場を大切にしなさい」
necessity: reference
scenes:
  fits:
    - 台本のボケを並べて密度を決めるとき。
    - 笑いを取らない区切りにボケを追加したくなったとき。
evidence:
