confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      BGM は場面・雰囲気が変わる所で曲を変え、フェードでつなぐ。
      衝撃の場面や流れが変わる所では BGM を止める。
  - id: steps-01
    name: 曲の用意
    body: |-
      曲を冒頭・定番・展開・エンドで分ける作り手（ドローマン）がいる。
