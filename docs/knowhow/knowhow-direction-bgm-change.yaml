id: knowhow-direction-bgm-change
kind: knowhow
name: BGM は場面の空気が変わる所で変えてフェードでつなぎ、衝撃の場面では止める
description: 動画の BGM を場面の空気が変わる所で切り替え、衝撃の場面や流れが変わる所で止める技法と、曲の用意の仕方を記載し、動画の BGM を選ぶときに参照する。
