id: knowhow-script-tsukkomi-victim
name: ツッコミの強さは、ボケに巻き込まれた被害者らしさに合わせる
description: ツッコミをボケの被害者として立て、場面を事前に共有していて被害者らしさが薄い所では強いツッコミを避ける技法を記載し、ツッコミの強さを決めるときに参照する。
