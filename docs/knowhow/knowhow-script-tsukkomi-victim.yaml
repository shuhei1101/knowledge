    - ツッコミのセリフの強さを決めるとき。
  misfits:
    - 演者 2 人が同じ設定を演じているコントの場面。
evidence:
  - source: ISHIDA
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      ボケが加害者、ツッコミが被害者として応じるのが漫才の基本。
      ツッコミはボケが何を言うか知らない体で応じる。
      場面を共有して織り込み済みになるほど被害者らしさが薄れ、初めて聞いたような強いツッコミはうそっぽくなる。
