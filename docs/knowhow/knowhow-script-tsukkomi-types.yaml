  - id: HAN
    title: 韓雨彤「漫才と相声の比較分析――おかしみの構造から見るツッコミの違い」（山形大学。安部達雄 2005「漫才における『ツッコミ』の類型とその表現効果」の引用）
    url: https://www.yamagata-u.ac.jp/jp/files/9616/2815/6328/fe3b28ee9705a6aa4f6e79cd19319db3.pdf
