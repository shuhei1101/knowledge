  fits:
    - ツッコミのセリフを作るとき。
    - ツッコミの型が続けて同じになっていないかを確認するとき。
evidence:
  - source: HAN
    speaker: third_party
confidence: low
items:
  - id: overview
    name: 概要
    body: |-
      ツッコミはボケの後でおかしさを効果的に伝える表現で、2 系統 7 類型に分かれる。
      実際の漫才では類型を組み合わせることもある。
  - id: types-01
    name: 類型
    body: |-
      | 系統 | 類型 | 例 |
      | --- | --- | --- |
      | 注意を促す（情報を追加しない） | 否定 | 「なんでやねん」 |
      | 注意を促す（情報を追加しない） | オウム返し | 「〜って」 |
      | 注意を促す（情報を追加しない） | 沈黙 | （何も言わない） |
      | 内容に踏み込む（情報を追加する） | 訂正 | 「これは（本来の概念）だよ」 |
      | 内容に踏み込む（情報を追加する） | 意味指摘 | 「それじゃ（文脈上の新たな意味）」 |
      | 内容に踏み込む（情報を追加する） | 比喩 | 「〜じゃないんだから」 |
      | 内容に踏み込む（情報を追加する） | 否定的感想 | ボケへの否定的な感想を言う |
