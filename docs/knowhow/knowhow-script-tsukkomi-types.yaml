kind: knowhow
id: knowhow-script-tsukkomi-types
name: ツッコミの型を 2 系統 7 類型から選ぶ
description: ツッコミを、注意を促すだけの型（否定・オウム返し・沈黙）と内容に踏み込む型（訂正・意味指摘・比喩・否定的感想）の 2 系統 7 類型から選ぶ技法を記載し、ツッコミのセリフを作るときに参照する。
