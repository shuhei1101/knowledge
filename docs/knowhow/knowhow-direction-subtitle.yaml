name: 字幕は背景に合わせて箱に入れ、文の後の間も表示し、2 行は幅を揃える
description: 動画の字幕を、込み入った背景では箱に入れ、短い文は文の後の間まで表示し、2 行になる文は行の幅を揃えて改行する技法を記載し、動画の字幕の見た目と表示の長さを決めるときに参照する。
