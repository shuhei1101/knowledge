items:
  - id: overview
    name: 概要
    body: |-
      背景が込み入っているときは、字幕を箱（白い角丸の箱に黒い文字など）に入れて読みやすくする。
      短い文は文の間だけ表示すると一瞬で消えるため、文の後の間の終わりまで表示する。
      2 行になる文は行の幅を揃えて改行する。
  - id: styles-01
    group: 字幕の種類
    name: 字幕の種類と向く場面
    body: |-
      | 種類 | 向く場面 |
      | --- | --- |
      | 箱に入れた文字 | 背景が込み入っているとき。既定に向く |
      | 縁取りの文字 | 背景が単純なとき |
      | 帯 | 発表・オチなど強調する短い文。長い文は前後に分けて表示することになる |
  - id: steps-01
    name: 使用方法
    body: |-
      1. 字幕の見た目（フォント・文字の色・縁取り・箱・位置・改行）を、名前と説明を付けたプリセットで複数用意する
      2. キャラクターごとに既定の字幕を決める
      3. 強調する文だけ、別の字幕に切り替える
