    speaker: practitioner
  - source: HASHIZUME
    speaker: practitioner
  - source: SCRIPTNOTES
    speaker: practitioner
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      台本のセリフは、その人が言いそうなことを、その人が言いそうな言葉で記載する。
      言ってよいこと・言ってはいけないことは演者ごとに違う。
      ニン（その人に似合う役柄）は本当の性格ではなく、見た目と世間のイメージで決まり、ニンに合わない話は薄く聞こえる。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 演者と話したときの印象と、世間のイメージ（キャラクターの設定と見た目）を参照し、演者ごとに言いそうなことと言い回しを記録する
      2. 演者ごとに、言ってよいこと・言ってはいけないことを分ける
      3. セリフを、そのニンに合う話と言い回しで記載する
