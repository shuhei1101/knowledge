id: knowhow-script-write-for-performer
kind: knowhow
name: 台本はその人が言いそうなことを言いそうな言葉で記載し、ニンは見た目と世間のイメージから決める
description: 台本のセリフを演者ごとに、その人が言いそうなことを言いそうな言葉で記載し、言ってよいことを演者ごとに分け、ニン（似合う役柄）を本当の性格ではなく見た目と世間のイメージから決める技法を記載し、演者に合わせて台本を記載するときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: FUKUDA
    title: ニッポン放送「三四郎のオールナイトニッポン」放送作家・福田卓也にラジオ業界の裏側を聴く！（ガクセイ基地）
    url: https://gakusei-kichi.com/?p=44342
    note: 台本は誰がしゃべるのかを考えて記載する箇所
  - id: HASHIZUME
    title: 漫才のニンの話。（盆と正月 橋爪アキラ、note）
    url: https://note.com/bonsyouhashizume/n/n05f6094becc8
  - id: SCRIPTNOTES
    title: 'Scriptnotes Episode 688: Writing Jokes with Mike Birbiglia（Transcript）'
    url: https://johnaugust.com/2025/scriptnotes-episode-688-writing-jokes-with-mike-birbiglia-transcript
    note: Anthony Jeselnik は自分とは違う種類のジョークが許される、の箇所
necessity: must
scenes:
  fits:
    - キャラクターや演者ごとに台本のセリフを記載するとき。
    - 同じ内容を複数の演者の誰に言わせるかを決めるとき。
  misfits:
    - 話し手を決めずに読み上げる告知やナレーション。
cases:
  - work: ラジオ番組の台本（福田卓也）
    content: 台本は演者が読むため、誰がしゃべるのかを考え、その人が話しそうなことを話しそうな言葉で記載する。同じ内容でも、この人が言うのは OK で別の人では NG なことがある。
    source: FUKUDA
  - work: 暗いキャラクターのネタ（橋爪アキラ）
    content: 外見が明るそうな人が、家庭では暗いからと暗いキャラクターのネタをしてもうまくいかない。ニンは本当の性格ではなく見た目に近い。
    source: HASHIZUME
evidence:
