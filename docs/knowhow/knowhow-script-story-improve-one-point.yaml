kind: knowhow
id: knowhow-script-story-improve-one-point
name: 体験談は、もう少しこうだったらの 1 点だけを変えて盛り、嘘っぽさを描写と予防線で消す
description: 体験談を作り話にせず、オチのために「もう少しこうだったら」の 1 点（おもしろ改善点）だけを変えて盛り、リアルな描写と前置きの予防線で嘘っぽさを消す技法を記載し、体験談の台本を作るときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
