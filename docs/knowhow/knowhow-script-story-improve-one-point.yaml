    title: 芝山大補「【ネタ作家が教える】普通のエピソードを「すべらない話」に変える方法」（ダイヤモンド・オンライン）
    url: https://diamond.jp/articles/-/304158
  - id: SHIBA2
    title: 上阪徹「「すべらない話」は“作るもの”。元芸人が教える「話の盛り方」とは？」（ダイヤモンド・オンライン。芝山大補『おもろい話し方』の紹介）
    url: https://diamond.jp/articles/-/384079
necessity: reference
scenes:
  fits:
    - 演者の体験談を台本にするとき。
  misfits:
    - 事実の正確さが求められる解説の区切り。
cases:
  - work: シャワーの話（芝山大補）
    content: 熱いお湯が出て彼女に冷たくあしらわれた話を、冷たい水が出た話に変え、「シャワーより彼女の対応のほうがよっぽど冷たかった」のオチにする。
    source: SHIBA1
evidence:
  - source: SHIBA1
    speaker: practitioner
  - source: SHIBA2
    speaker: third_party
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      まったくの作り話は使わず、元になる出来事を見つけて編集する。
      変えるのは、オチのために「もう少しこうだったら」の 1 点だけにする。
      どこまで盛れるかは、演者が事実として自然に話せる線で決める。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 元の出来事と、目指すオチを記載する
      2. オチのために変える 1 点を決める
      3. 場所・人の見た目などのリアルな描写を追加する
      4. 「作り話かと思われるレベルなんですけど」のような予防線を前置きに配置する
