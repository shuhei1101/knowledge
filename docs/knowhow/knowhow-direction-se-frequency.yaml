items:
  - id: overview
    name: 概要
    body: |-
      SE の頻度は作り手で割れる。
      ほぼ全てのセリフに入れる作り手（すーぱーあろま・ばんでれ・ラギ）と、入れたい所の半分に絞る作り手（tadaoto）がいる。
      動画の作風を決めてから、どちらかに統一する。
