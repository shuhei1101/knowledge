name: SE の頻度は作風で決め、ほぼ全てのセリフに入れるか、入れたい所の半分に絞るかに統一する
description: 動画の SE の頻度が作り手によって割れることと、作風を決めてからどちらかに統一する判断を記載し、動画に入れる SE の量を決めるときに参照する。
