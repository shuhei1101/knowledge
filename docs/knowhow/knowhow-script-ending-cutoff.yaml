kind: knowhow
id: knowhow-script-ending-cutoff
name: オチは、これ以上続けられない状況を作って打ち切る
description: ネタの終わりを、同じずれの繰り返しか、途中で途切れていた別の話を呼び戻した複雑なずれで、これ以上続けられない状況にして打ち切る技法を記載し、ネタのオチを決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: NAKATA
    title: 中田一志「漫才の笑い：エラーと非効率性と非整合性」『日本語・日本文化』41 号（2014、大阪大学のリポジトリ）
    url: https://ir.library.osaka-u.ac.jp/repo/ouka/all/50778/
necessity: reference
scenes:
  fits:
    - 掛け合いのネタのオチを決めるとき。
cases:
  - work: チュートリアルの漫才「ドラえもん」
    content: いろいろな人向けのドラえもんを続けた後、さらに同じ展開を始めかけた所で「もうええわ」と打ち切る（ずれの繰り返し）。
    source: NAKATA
  - work: 中川家の漫才「病院」
    content: 歩いて帰った話の後、途中で途切れていた行きのタクシーの話を呼び戻して「タクシー代払ってへんぞ」と言い、終える。
    source: NAKATA
evidence:
  - source: NAKATA
    speaker: third_party
confidence: low
items:
  - id: overview
    name: 概要
    body: |-
      オチは、相方がこれ以上やり直しの指摘を続けられない状況を作って打ち切る。
      作り方は 2 つ: 同じずれを何度も起こす、途中で途切れていた別の話を突然呼び戻してずれを複雑にする。
