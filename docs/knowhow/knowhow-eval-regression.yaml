id: knowhow-eval-regression
kind: knowhow
name: プロンプトを変えるたびに、固定した評価セットの全件で旧と新を対で比べる
description: 汎用のルールの追加が一部の課題で大きく精度を下げ、同じプロンプトでも採点の基準と回数で点が変わるため、モデルを固定した評価セットの全件で旧と新を複数回比べる技法を記載し、プロンプトの変更を確認するときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: GR
    title: 汎用ルールの追加での回帰の研究
    url: https://arxiv.org/abs/2601.22025
  - id: LF
    title: 'Langfuse: Golden dataset evaluation'
    url: https://langfuse.com/resources/engineering/golden-dataset-evaluation.md
  - id: MV1
    title: プロンプトの評価のばらつきの研究
    url: https://arxiv.org/abs/2503.04818
  - id: MV2
    title: 丁寧さ・チップ・脅しの効果の研究
    url: https://arxiv.org/abs/2508.00614
necessity: must
scenes:
  fits:
    - プロンプトにルールを追加・修正するとき。
    - ノードのモデルを変えるとき。
evidence:
  - source: GR
    speaker: practitioner
  - source: LF
    speaker: third_party
  - source: MV1
    speaker: practitioner
  - source: MV2
    speaker: practitioner
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      汎用のルールを追加すると、一部の課題で大きく下がった（26/30 から 9/30）。
      同じプロンプトでも、採点の基準と回数で点が変わる。
      プロンプトを変えるたびに、モデルのバージョンを固定し、固定した評価セットの全件で旧と新を対で比べる。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 課題別の評価セットを固定し、修正するときに参照するケースと、有効かを確認するケースを分ける（分けるのは推測を含む）
      2. モデルのバージョンと採点の基準を固定する
      3. 旧と新のプロンプトを全件で複数回実行して対で比べる
      4. 丁寧さの効果は一定せず、チップ・脅しは有効でないので、そのような文言で点を上げようとしない
tags:
