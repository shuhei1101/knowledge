id: knowhow-script-hooks
kind: knowhow
name: 冒頭で何の話かを見せ、予告・溜め・ほのめかしで結果の不確かさを最後まで残す
description: 冒頭で何の話か・なぜ聞くかを見せ、先の予告・山の直前の溜め・先のほのめかしで、結果の不確かさを最後まで残して視聴者を引き留める技法を記載し、台本の冒頭と山場の前を作るときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: DICKS
    title: Matthew Dicks『Storyworthy』（New World Library）
    url: https://newworldlibrary.com/product/storyworthy
    note: Elephant・Crystal Ball・Hourglass・Breadcrumbs
  - id: EFK
    title: Ely, Frankel, Kamenica「Suspense and Surprise」（Journal of Political Economy, 2015）
    url: https://www.journals.uchicago.edu/doi/10.1086/677350
  - id: SUZ
    title: 'Simonov, Ursu, Zheng「Suspense and Surprise in Media Product Design: Evidence from Twitch」（CEPR DP17353）'
    url: https://ideas.repec.org/p/cpr/ceprdp/17353.html
necessity: reference
scenes:
  fits:
    - 台本の冒頭で視聴者の注意を集めるとき。
    - ランキングや勝敗の結果を見せる区切りを作るとき。
    - 山場の直前の区切りを作るとき。
  misfits:
    - 結論を先に伝える必要がある告知・お知らせの区切り。
evidence:
  - source: DICKS
    speaker: practitioner
  - source: EFK
    speaker: third_party
  - source: SUZ
    speaker: third_party
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      視聴者は結果がまだ分からない間は見続ける。
      Twitch の配信の研究では、結果の不確かさ（サスペンス）が配信の視聴者数の推移を説明し、驚きの効果はほとんど見られなかった。
  - id: steps-01
    name: 使用方法
    body: |-
      | 技法 | 内容 |
      | --- | --- |
      | Elephant | 冒頭で何の話か・なぜ聞くかを見せる |
      | Crystal Ball | 先の展開を予告し、予告が当たるかを気にさせる |
      | Hourglass | 山の直前で時間を遅らせる |
      | Breadcrumbs | 先をほのめかす |
      | 結果を最後まで決めない | ランキングは下位から出し、1 位を最後まで決めない。終わりを匂わせない |
tags:
  - name: topic:台本
    main: true
  - name: topic:構成
  - name: topic:ノウハウ
