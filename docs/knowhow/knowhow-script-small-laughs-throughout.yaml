id: knowhow-script-small-laughs-throughout
kind: knowhow
name: 話の途中の各段階にも小さな笑いを置く
description: 笑いをオチの 1 か所に集めず、前置きを含む話の途中の各段階にも小さな笑いを置く技法を記載し、長い話や体験談の笑いの配置を決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: HEAD
    title: Chris Head「How to tell a story in stand-up」（Chortle）
    url: https://www.chortle.co.uk/features/2022/04/10/50527/how_to_tell_a_story_in_stand-up
  - id: SHIBA
    title: 芝山大補「元芸人が教える「すべらない話」の上手な作り方」（ダイヤモンド・オンライン）
    url: https://diamond.jp/articles/-/312603
necessity: reference
scenes:
  fits:
    - 長い話や体験談の笑いの配置を決めるとき。
  misfits:
    - 本命のボケの直前（ダレ場として空ける所）。
evidence:
  - source: HEAD
    speaker: practitioner
  - source: SHIBA
    speaker: practitioner
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      笑いがオチの 1 か所だけだと話が持たない。
      前置きを含む話の各段階で、笑いの切り口を見つけて小さな笑いを置く。
      小さな笑いは、人物や場面の描写を「どんな？」まで具体的にして作れる。
      本命のボケの直前だけはボケを詰めずに空ける（[ダレ場を残す](id:knowhow-script-breathing-room)）。
