id: knowhow-script-flexible-segments
kind: knowhow
name: 時間調整に使う可変の区切りを決め、上限と延びたときの削り方を事前に記載する
description: 台本に時間調整に使う可変の区切りを決めて上限の時間を記載し、延びたときに削る箇所と、時間が余ったときに埋める予備の素材を事前に用意する技法を記載し、尺の決まった台本を作るときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: MCLEISH
    title: Robert McLeish, Jeff Link『Radio Production』（Routledge）
    url: https://www.routledge.com/Radio-Production/McLeish-Link/p/book/9781138819979
    note: 第 12・14 章
necessity: reference
scenes:
  fits:
    - 尺の決まった配信や動画の台本を作るとき。
  misfits:
    - 尺を決めない雑談配信。
evidence:
  - source: MCLEISH
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: 台本の区切りを、尺を変えない固定の区切りと、時間調整に使う可変の区切りに分ける。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 可変の区切りを決め、上限（最大何分か）を記載する
      2. 延びたときにどの区切りのどこを削るかを事前に記載する
      3. 時間が余ったときに 20 秒ほどを埋める予備の素材を用意する
