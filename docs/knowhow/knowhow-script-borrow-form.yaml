name: 元ネタの形式を借りるときは、主題を変え、元が分かる分だけを取る
description: 元ネタの形式や言葉を借りて台本を作るときに、主題を変え、元が分かる程度の分量だけを取って置く位置を変える技法（本歌取り）を記載し、パロディや形式を借りた台本を作るときに参照する。
