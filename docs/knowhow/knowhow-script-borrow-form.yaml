items:
  - id: overview
    name: 概要
    body: |-
      元ネタの形式を借り、中身（主題）を入れ替える。
      取る分量は、元ネタだと分かる程度に抑え、取った部分を置く位置は元ネタと変える。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 借りる形式と、入れ替える主題を決める
      2. 元ネタから取る言葉を、元だと分かる最小限に絞る
      3. 取った言葉を、元ネタと違う位置に置く
