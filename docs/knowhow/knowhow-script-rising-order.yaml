id: knowhow-script-rising-order
kind: knowhow
name: 台本は低く入って尻上がりにし、ボケの難しさを易しいものから上げる
description: 台本の出だしを低くゆっくり入り、ボケの難しさを易しいものから上げて後半に最大の山を配置する尻上がりの構成を記載し、台本の区切りの順番と盛り上げ方を決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: ISHIDA
    title: ノンスタ石田が考える｢面白い漫才｣の"絶対条件"（東洋経済オンライン。石田明『答え合わせ』の抜粋）
    url: https://toyokeizai.net/articles/-/834163
  - id: SHIBAYAMA
    title: 芝山大補『おもろい話し方』（ダイヤモンド社）
    url: https://www.diamond.co.jp/book/9784478114407.html
    note: 第 1 章「結果を出す人は『出だしゆっくり、声低め』」
necessity: reference
scenes:
  fits:
    - 配信や動画の台本で区切りの順番を決めるとき。
    - 配信や動画の盛り上げ方を決めるとき。
  misfits:
    - 結論を先に伝える必要がある告知・お知らせの区切り。
evidence:
  - source: ISHIDA
    speaker: practitioner
  - source: SHIBAYAMA
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      出だしは低くゆっくり入り、乗ってから上げて、後半に最大の山を置く。
      最初からテンションを最大にすると、視聴者のハードルが上がる。
  - id: steps-01
    name: 使用方法
    body: |-
      1. ボケの難しさは易しいものから上げる
      2. 冒頭の区切りは声とテンションを低めに記載し、山の区切りに向けて上げる
tags:
  - name: topic:台本
    main: true
