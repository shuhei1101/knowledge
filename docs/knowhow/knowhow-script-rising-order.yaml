    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      出だしは低くゆっくり入り、乗ってから上げて、後半に最大の山を置く。
      最初からテンションを最大にすると、視聴者のハードルが上がる。
      ネタの並び順で、前の区切りの味が次の区切りの受け取られ方を変える。
  - id: steps-01
    name: 使用方法
    body: |-
      1. ネタを強さで並べ、2 番目に強いネタを最初、弱いネタを中盤、最も強いネタを最後に置く
      2. 弱いネタは強いネタで挟む
      3. ボケの難しさは易しいものから上げる
      4. 冒頭の区切りは声とテンションを低めに記載し、山の区切りに向けて上げる
