id: knowhow-script-rising-order
kind: knowhow
name: 台本は低く入って尻上がりにし、ネタは 2 番目に強いものから出す
description: 台本の出だしを低くゆっくり入り、後半に最大の山を置く尻上がりの構成と、2 番目に強いネタを最初・弱いネタを中盤・最も強いネタを最後に置く並べ方を記載し、台本の区切りやネタの順番を決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: ISHIDA
    title: ノンスタ石田が考える｢面白い漫才｣の"絶対条件"（東洋経済オンライン。石田明『答え合わせ』の抜粋）
    url: https://toyokeizai.net/articles/-/834163
  - id: SHIBAYAMA
    title: 芝山大補『おもろい話し方』（ダイヤモンド社）
    url: https://www.diamond.co.jp/book/9784478114407.html
    note: 第 1 章「結果を出す人は『出だしゆっくり、声低め』」
necessity: reference
scenes:
  fits:
    - 配信や動画の台本で区切りの順番を決めるとき。
    - 複数のネタ・企画の並べ方を決めるとき。
  misfits:
    - 結論を先に伝える必要がある告知・お知らせの区切り。
