items:
  - id: overview
    name: 概要
    body: |-
      過去のアイデアを組み合わせつつ、今の時代に合わせる。
      高い娯楽性と流行っているものを組み合わせると強い。
      アイデアを今の生活様式に当てはめるには、どこを変えればよいかを探す。
