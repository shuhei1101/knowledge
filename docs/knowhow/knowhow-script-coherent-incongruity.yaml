id: knowhow-script-coherent-incongruity
kind: knowhow
name: ボケのずれは、理屈でつながる形にする
description: ボケのずれを無関係な飛躍にせず、聞き手が理屈をたどってつながる形にする技法を記載し、ボケの中身を決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: ITO
    title: 伊藤大幸「ユーモアの生起過程における論理的不適合および構造的不適合の役割」（認知科学 17 巻 2 号、2010）
    url: https://www.jstage.jst.go.jp/article/jcss/17/2/17_2_297/_article/-char/ja
  - id: NAKATA
    title: 中田一志「漫才の笑い：エラーと非効率性と非整合性」『日本語・日本文化』41 号（2014、大阪大学のリポジトリ）
    url: https://ir.library.osaka-u.ac.jp/repo/ouka/all/50778/
