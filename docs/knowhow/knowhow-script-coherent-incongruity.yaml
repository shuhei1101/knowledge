confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      ボケは、前の話と因果でつながりつつ、組み合わせが普通と違う形にする。
      研究では、情報どうしの因果の結びつきの強さと組み合わせの特異さが、それぞれユーモアの反応を強めた。
