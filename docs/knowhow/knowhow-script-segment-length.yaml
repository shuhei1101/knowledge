id: knowhow-script-segment-length
kind: knowhow
name: 1 つの区切りは約 6 分までにする
description: 見続けられる動画の長さの研究から、台本の 1 つの区切りを約 6 分までに収める目安を記載し、台本の区切りの長さを決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: GUO
    title: 'Guo, Kim, Rubin「How Video Production Affects Student Engagement: An Empirical Study of MOOC Videos」（L@S 2014）'
    url: https://up.csail.mit.edu/other-pubs/las2014-pguo-engagement.pdf
necessity: reference
scenes:
  fits:
    - 動画や配信の台本で 1 つの区切りの長さを決めるとき。
evidence:
  - source: GUO
    speaker: third_party
confidence: low
items:
  - id: overview
    name: 概要
    body: |-
      edX の講義動画の視聴の研究では、動画が長くなっても見続けられる時間の中央値は最大で約 6 分で、6 分未満に分けることが推奨された。
      講義動画の結果なので、娯楽の動画の区切りには目安として使用する。
