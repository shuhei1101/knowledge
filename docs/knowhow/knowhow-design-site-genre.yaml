items:
  - id: overview
    name: 概要
    body: |-
      対象は共通（単体 HTML・React）。
      サイトのジャンルごとの雰囲気・モチーフ・色・UI の味付けの例から、デザインの方向の候補を出し分ける。

      例は方向を探るためのもので、採用を決めるものではない。
      候補の出し分けに使用し、例をそのまま組み合わせて確定しない。
  - id: site-genre-01
    group: サイトのジャンル
    name: ジャンル別の雰囲気の例
    body: |-
      <!-- table: {"kind": "data"} -->

      | 分類 | ジャンル | 雰囲気のことば | モチーフ・装飾の例 | 色・文字の例 | UI 要素の味付けの例 |
      | --- | --- | --- | --- | --- | --- |
      | 学び | オンライン講座 | 前向き・明快 | 手書きのアイコン | 明るい背景に強い差し色 1 つ | 要点を差し色で目立たせる |
      | 学び | 子ども・子育て | 元気・安心・やわらか | - | 原色、丸ゴシック | 大きな角丸、押すと弾む動き |
      | 趣味 | 園芸・菜園 | 素朴・季節・育つ | 植物の線画 | セージ・生成り・テラコッタ | - |
      | 趣味 | スポーツ | 躍動・勝負・速さ | 斜めの線 | 高いコントラスト、斜体の太字 | 大きな数字 |
      | 趣味 | 料理・レシピ | おいしそう・家庭的 | 布巾のチェック柄（ギンガム） | 生成りの背景に暖色、手書き風の見出し | ギンガムの区切り線 |
      | 趣味 | 旅行 | 遠く・発見・記録 | 切手・消印・航空便の意匠 | - | 写真に切手風の枠 |
      | 趣味 | ペット | 愛らしい・のんびり | 肉球・骨のモチーフは使用しない | 暖かいパステル、丸ゴシック | - |
      | 文化 | 本・書評 | 静か・知的・紙 | 紙の背景 | 生成りの背景に墨色、本文は明朝 | 広い余白 |
      | 文化 | アニメ・漫画 | 作品の世界観しだい | コマ割り、集中線、網点、吹き出し | 作品の色 | 吹き出し形のツールチップ、コマ枠のカード |
      | 文化 | ゲーム紹介 | 没入・壮大・期待 | 世界観の背景画 | 暗い背景に差し色 | メニュー画面風のナビ |
      | 文化 | 2D ゲーム風 | 懐かしい・遊び心 | ドット絵 | 見出しだけドット文字 | 太枠のウィンドウ、会話窓風の通知、体力ゲージ風の進み具合 |
      | 文化 | 映画・音楽（作品） | 大胆・夜・余韻 | フィルムのノイズ、ポスター風の文字組み | 黒地に 1 色 | - |
      | 文化 | 写真・作品集 | 静けさ・余白 | 装飾を配置しない | 広い余白 | 写真を主役にする |
      | 文化 | 和・伝統 | 静謐・季節・余白 | 青海波・麻の葉などの文様 | 藍・朱、縦書きの見出し | - |
      | 技術 | プログラミング | 理知的・手元の道具 | プロンプト記号 | 暗い灰か白、等幅を混ぜる | - |
      | 暮らし | 医療・健康 | 清潔・穏やか・安心 | - | 青・緑、広い余白 | - |
      | 暮らし | 金融・士業 | 堅実・信頼 | 控えめな装飾 | 紺・灰・白、明朝の見出し | - |
      | 暮らし | 飲食店・カフェ | 店の空気しだい | 黒板、手書きのメニュー | - | 黒板風の見出し |
      | 暮らし | ファッション・美容 | 洗練・余白 | 装飾は極少 | 白黒と 1 色、細いセリフ体 | - |
      | 暮らし | 地域・行政 | 誰でも・明快 | 装飾を配置しない | 高いコントラスト | 太めのフォーカス枠 |
      | 仕事 | 業務・SaaS | [デザインスタイル](id:convention-design-style) の業務系のスタイルを参照 | - | - | - |

      <!-- /table -->
