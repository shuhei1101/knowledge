id: knowhow-direction-camera-easing
kind: knowhow
name: カメラの移動は距離で減速の強さを変え、前後のショットで動きの向きを統一する
description: 動画のカメラの移動に、距離と場面に応じた減速の緩急を付け、前後のショットで動きの向きを統一する技法を記載し、カメラの移動の速さを決めるときに参照する。
