confidence: medium
items:
  - id: overview
    name: 概要
    body: カメラの移動には距離と場面で緩急を付け、前後のショットで動きの向きを統一する。
  - id: steps-01
    name: 緩急の付け方
    body: |-
      | 移動 | 緩急 |
      | --- | --- |
      | 長い移動 | 緩やかに減速する |
      | 短い移動 | 強く減速する（はっと気づく場面） |
      | コミカルな場面 | 0.5 秒前後の戻る動きを付ける |
