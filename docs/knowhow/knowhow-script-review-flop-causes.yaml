id: knowhow-script-review-flop-causes
kind: knowhow
name: 台本のレビューで、流行の言葉を出す時期と、理由の無い怒りのツッコミを確認する
description: 台本のレビューで、流行の言葉を早く出すほど伝わらないため出す時期を確認し、展開の理由が無いまま怒るツッコミを残さない観点を記載し、ネタが滑る原因を台本から除くときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: ISHIDA5
    title: NON STYLE 石田明さんと、「お笑い」の話を。（５）トレンドを追いかけることの危険性。（ほぼ日）
    url: https://www.1101.com/n/s/nonstyle_ishida/2025-02-11.html
  - id: ISHIDA9
    title: NON STYLE 石田明さんと、「お笑い」の話を。（９）巻き込まれるのを大事にしたい。（ほぼ日）
    url: https://www.1101.com/n/s/nonstyle_ishida/2025-02-15.html
necessity: reference
scenes:
  fits:
    - 台本・ネタをレビューするとき。
  misfits:
    - 流行の言葉そのものを紹介する区切り。
cases:
  - work: 流行の言葉のネタ（石田明）
    content: 流行の言葉は、出した時点では万人が知らない。ウケるのは、いちばん最初か、2〜3 周後のみんなが言い飽きたころ。
    source: ISHIDA5
  - work: 後半のツッコミ（石田明）
    content: 「後半は怒ってツッコまないといけない」という情報だけが入り、後半のツッコミが意味なく怒っている漫才がある。
    source: ISHIDA9
evidence:
  - source: ISHIDA5
    speaker: practitioner
  - source: ISHIDA9
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      流行の言葉は早く出すほど知らない人が多く、伝わらない。
      ツッコミの怒りは、ボケに巻き込まれた理由が無いと、見ている側が置いていかれる。
  - id: steps-01
    name: 確認する観点
    body: |-
      - 流行の言葉は、視聴者の多くが知っている時期に出しているか
      - ツッコミが強くなる所に、ボケに巻き込まれて強くなる理由があるか
tags:
  - name: topic:台本
    main: true
  - name: topic:観点
  - name: topic:ツッコミ
  - name: action:点検
  - name: topic:ノウハウ
