items:
  - id: overview
    name: 概要
    body: |-
      台本を書く前に、その回で示すこと（問い・主張）を 1 文で決める。
      体験談では、話し手にとってその話が何の話かを 1 文に絞り、話の背骨にする。
      構成と台詞は、その 1 文と照らして要否を決める。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 「この回で何を示すか」を 1 文で書く
      2. 区切りごとに、その 1 文に役立つかを確認する
