name: 台本を書く前に、何を示すかを問い・主張の 1 文で決める
description: 台本を書く前に、その回で示すことや話の背骨を問い・主張の 1 文で決め、構成をその 1 文と照らして組む技法を記載し、台本の企画と構成を決めるときに参照する。
