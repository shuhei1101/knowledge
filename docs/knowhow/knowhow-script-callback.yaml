id: knowhow-script-callback
kind: knowhow
name: 前に出たくだりを、忘れた頃に別の場面でもう一度出す
description: 前に出たくだりや台詞を、間を空けて別の場面や文脈でもう一度出して笑いを取る技法（コールバック・天丼）を記載し、台本の区切りをまたぐ笑いを組むときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: WIKI
    title: Callback (comedy)（Wikipedia）
    url: https://en.wikipedia.org/wiki/Callback_(comedy)
  - id: YAMAZAKI
    title: 山崎慎太朗「お笑いにおける本来の『天丼』〜浅草三大コント〜」（note）
    url: https://note.com/bill_yamazaki/n/nae9a22c4e85c
necessity: reference
scenes:
  fits:
    - 台本の後半の区切りで、前半の区切りのくだりを回収するとき。
    - 長い配信で同じ視聴者が最初から見ているとき。
  misfits:
    - 途中から見始める視聴者が多い区切り。
evidence:
  - source: WIKI
    speaker: third_party
  - source: YAMAZAKI
    speaker: third_party
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      前に出たくだりや台詞を、視聴者が忘れかけた頃に、前と違う場面や文脈でもう一度出す。
      同じくだりを繰り返すときは、繰り返すたびに笑いを段階的に大きくする。
  - id: steps-01
    name: 使用方法
    body: |-
      1. くだりを振る区切りと回収する区切りの両方に、くだりと回収の位置を記載する
      2. 振る区切りと回収する区切りの間に、別の区切りを挟む
tags:
  - name: topic:台本
    main: true
  - name: topic:構成
  - name: topic:笑い
