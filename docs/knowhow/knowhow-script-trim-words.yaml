id: knowhow-script-trim-words
kind: knowhow
name: 台詞は意味が通じる所まで削り、前置きは必要な分だけにする
description: 台詞の文字数を意味が通じる所まで削り、話の前置きは聞き手に必要な情報だけにする技法を記載し、台本の台詞と前置きを推敲するときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: SHINSUKE
    title: 島田紳助「1番気を使うことは最少の文字数で伝えること」（日刊ゲンダイ。漫才作家 本多正識のコラム）
    url: https://www.nikkan-gendai.com/articles/view/geino/279988
  - id: HEAD
    title: Chris Head「How to tell a story in stand-up」（Chortle）
    url: https://www.chortle.co.uk/features/2022/04/10/50527/how_to_tell_a_story_in_stand-up
necessity: reference
scenes:
  fits:
    - 台本の台詞を推敲するとき。
    - 話の前置きの長さを決めるとき。
  misfits:
    - 正確さが要る告知・注意事項の文。
cases:
  - work: 島田紳助の漫才の台本の書き方
    content: 15 文字で書いた台詞を 14 文字、13 文字にできないかを考え、これ以上削ると意味が通じなくなる所まで削る。
    source: SHINSUKE
evidence:
  - source: SHINSUKE
    speaker: practitioner
  - source: HEAD
    speaker: practitioner
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      台詞は、これ以上削ると意味が通じなくなる所まで文字数を削る。
      話の前置きでは、聞き手が知る必要のある情報を過不足なく伝え、それ以上を追加しない。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 台詞ごとに、1 文字でも短くできる言い方がないかを確認する
      2. 前置きの文ごとに、抜いても後の笑いが伝わるかを確認し、伝わる文を削除する
