id: knowhow-script-material-selection
kind: knowhow
name: ネタは放送に適さない・演者に合わない・後追い・キレが悪い・オチが先のものだけを外し、好みでは外さない
description: 投稿や案から台本に使用するネタを選ぶときに、放送に適さない・演者に合わない・後追い・言い回しが長くキレが悪い・オチが先に来るものだけを外し、選ぶ人の好みでは外さない基準を記載し、台本のネタを選ぶときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: OKUDA
    title: オードリーのANNの裏側 第2回 構成作家・奥田泰（マイナビニュース）
    url: https://news.mynavi.jp/article/odoriann-2
    note: ネタのメールを選ぶ基準の箇所
necessity: reference
scenes:
  fits:
    - 視聴者の投稿や生成した複数の案から、台本に使用するネタを選ぶとき。
cases:
  - work: 『オードリーのオールナイトニッポン』のネタのメール（奥田泰）
    content: 放送に適さない表現のもの、2 人に合わない内容のもの（下ネタは読む人で使える言葉が変わる）を外す。よくネタにされる人の話は、新しい触れ方なら外さない。言い回しが長くキレが悪いものやオチが先に来るものでなければ、好みでは外さず、客観的に成立していれば持っていく。
    source: OKUDA
evidence:
  - source: OKUDA
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: ネタは外す理由に当たるものだけを外し、残りは選ぶ人の好みで外さない。
  - id: steps-01
    name: 外す基準
    body: |-
      - 放送に適さない表現がある
      - 演者に合わない（同じ言葉でも言う人で使えるかが変わる）
      - 後追い（よくネタにされる題材で、触れ方が新しくない）
      - 言い回しが長く、キレが悪い
      - オチが先に来ている
tags:
  - name: topic:台本
    main: true
  - name: topic:素材
  - name: action:選択
