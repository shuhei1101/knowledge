id: knowhow-direction-effect-by-target
kind: knowhow
name: 平らな立ち絵の劇場動画では、エフェクトを掛ける対象で選び、3D の配置が前提のカメラを使用しない
description: 動画編集ソフトのエフェクトの分類が掛ける対象で分かれていないことと、平らな立ち絵には 3D の配置が前提のカメラや一部の加工が合わないことを記載し、立ち絵の動画に入れるエフェクトを選ぶときに参照する。
