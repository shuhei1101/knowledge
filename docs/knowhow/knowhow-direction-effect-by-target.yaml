id: knowhow-direction-effect-by-target
kind: knowhow
name: エフェクトは掛ける対象（立ち絵・背景・画面全体）ごとに使いどころを決めて選ぶ
description: 動画編集ソフトのエフェクトの分類が掛ける対象で分かれていないことを踏まえ、立ち絵・背景・画面全体の対象ごとに使いどころを決めてエフェクトを選ぶ技法を記載し、動画にエフェクトを入れるときに参照する。
