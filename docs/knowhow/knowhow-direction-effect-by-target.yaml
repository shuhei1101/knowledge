items:
  - id: overview
    name: 概要
    body: |-
      動画編集ソフトのエフェクトの分類は、描画・加工・装飾のような機能の種類で分かれ、掛ける対象（立ち絵・背景・画面全体）では分かれていない。
      YMM4 では、掛ける対象はアイテムに付けるか、下のレイヤーに掛けるエフェクトアイテムにするかで決定する。
      エフェクトは分類ではなく、掛ける対象で選ぶ（記録の結論から導いた推測を含む）。
  - id: notes-01
    name: 平らな立ち絵に合わないもの
    body: |-
      注目カメラ・回り込みカメラは 3D の配置が前提で、平らな立ち絵には有効でない。
      クロマキー（立ち絵は透過の素材）・モーショントラッキング・VR・3D カメラ・LUT のグレーディングは、立ち絵の劇場動画では使用しない。
