items:
  - id: overview
    name: 概要
    body: |-
      窓の外だけの雨のように、背景の一部にだけ付与するエフェクトは、背景ごとに合わせた範囲（マスク）が要り、難しい。
      屋外の背景の全体に雨を降らせるなど、背景の全体に付与する使い方から使用する。
