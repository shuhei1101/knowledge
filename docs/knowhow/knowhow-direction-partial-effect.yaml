name: 背景の一部にだけ付与するエフェクトは範囲の指定が要り、難しい
description: 窓の外だけの雨のように背景の一部にだけ付与するエフェクトは、背景ごとに範囲の指定が要るため難しく、背景の全体に付与するエフェクトから使用する判断を記載し、動画のエフェクトを選ぶときに参照する。
