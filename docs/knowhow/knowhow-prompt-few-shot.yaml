items:
  - id: overview
    name: 概要
    body: |-
      書式・口調・構造は、ルールより例で示すと最も確実に伝わる。
      例は 3〜5 件にし、増やしすぎると精度が下がる。
      推論モデルはまず 0 件で試す。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 場面を変えた例を 3〜5 件用意する（似た例ばかりだと、意図しない癖も取り込む）
      2. 例の書式（タグ・改行）を完全に統一し、偏りの無い並びにする（並べ替えで結果が約 ±15% 動く）
      3. 例を `<example>` のタグで囲む
      4. 例で分かるルールは本文から削除する
      5. 例の丸写しが出るときは、「そのまま使用しない」と添え、繰り返しが出た発話を文脈から削除する
      6. 推論を使用するときは、「問題・やり方・回答」の例にする
  - id: notes-01
    name: 日本語の口調
    body: |-
      日本語のキャラクターの口調は、プロンプトの中では few-shot が有効。
      方言・語尾はプロンプトだけでは制御しきれない。
