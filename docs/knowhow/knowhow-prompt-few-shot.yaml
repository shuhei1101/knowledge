id: knowhow-prompt-few-shot
kind: knowhow
name: 例は 3〜5 件を場面を変えてばらつかせ、書式を統一してタグで囲む
description: LLM のプロンプトに入れる例（few-shot）の数・選び方・並べ方と、例の丸写しを防ぐ方法を記載し、口調や書式を例で示すプロンプトを作るときに参照する。
