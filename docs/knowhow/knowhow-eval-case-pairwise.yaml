id: knowhow-eval-case-pairwise
kind: knowhow
name: 評価ケースは軸の値の組をペアワイズで作り、端のケースを加え、自動採点で数を多くする
description: LLM の精度評価のケースを、軸の値の組をペアワイズで作り、無関係・不足・長すぎる・有害な入力の端のケースを加え、自動採点で数を多くする技法を記載し、評価ケースを作るときに参照する。
