evidence:
  - source: NI
    speaker: practitioner
  - source: AT
    speaker: practitioner
confidence: high
items:
  - id: overview
    name: 概要
    body: |-
      障害のほとんどは 1〜2 要因の組で起き、 6 を超える例は無いので、軸の値の組はペアワイズで作る。
      無関係・不足・長すぎる・有害な入力の端のケースを加える。
      少数を人が採点するより、自動採点で数を多くする。
