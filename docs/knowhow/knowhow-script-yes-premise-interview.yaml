kind: knowhow
id: knowhow-script-yes-premise-interview
name: 体験談の素材は、YES を前提にした質問で聞き出す
description: 演者から体験談の素材を聞き出すとき、「どこに行きましたか？」ではなく「どこか行ってきたんじゃないですか？」と YES を前提にした質問を続ける技法を記載し、フリートークの素材を集めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - id: NAGATA
    title: 永田篤「｢最近､どこに行きましたか?｣と聞いてはいけない…プロの聞き手が使う｢盛り上がる雑談｣の絶対ルール」（プレジデントオンライン。『一番「伝わる」会話のコツ』の抜粋）
    url: https://president.jp/articles/-/72654
necessity: reference
scenes:
  fits:
    - 演者や視聴者から体験談の素材を聞き出すとき。
cases:
  - work: ラジオのフリートークの打ち合わせ（永田篤）
    content: 「すごい人に会ったんじゃないですか？」「おいしいもの食べたんじゃないですか？」と同じ型の質問を続け、「そういえばこの前……」を引き出す。
    source: NAGATA
evidence:
  - source: NAGATA
    speaker: practitioner
confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      「行きましたか？」と聞くと、相手は「行ってない」と応じたくなる。
      「〜してきたんじゃないですか？」と YES を前提に聞くと、相手が記憶を掘り起こしやすい。
