id: knowhow-prompt-roleplay-reasoning
kind: knowhow
name: キャラクターのセリフ生成では汎用の推論を切るか浅くし、比べてから決める
description: 汎用の推論（CoT）がロールプレイの質を下げるため、セリフ生成では推論を切るか浅くして比べてから決める技法を記載し、セリフ生成に使用するモデルと推論の強さを決めるときに参照する。
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
