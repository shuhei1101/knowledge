items:
  - id: overview
    name: 概要
    body: |-
      評価ケースを合成するときは、先に軸の値の組を作り、その組を LLM に文として作成させる。
      近すぎるケースは、埋め込みの類似度で除外する。
      軸の値の組の作り方は [ペアワイズのケース](id:knowhow-eval-case-pairwise) に従う。
