id: knowhow-eval-synthetic-cases
kind: knowhow
name: 評価ケースを合成するときは、先に軸の値の組を作ってから LLM に文として作成させ、近すぎるケースを除外する
description: LLM で評価ケースを合成するときに、先に軸の値の組を作ってから文として作成させ、埋め込みの類似度で近すぎるケースを除外する技法を記載し、評価ケースを合成するときに参照する。
