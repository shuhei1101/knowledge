scenes:
  fits:
    - 立ち絵の演者と、表や画像の素材を同じ画面に出す動画を作るとき。
  misfits:
    - 素材を出さず、立ち絵だけの区間。
cases:
  - work: 「テスト前日に、ついやってしまうこと」の紹介
    content: 文 1 で「1 人が中央」、素材を出す文 4 で「素材が左で、1 人が右」、文 18 で「1 人が中央」に切り替え、素材のキューに配置を 1 件も記載せずに位置を決定できた。
    source: P3
