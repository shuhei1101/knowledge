confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      立ち絵の配置・素材の配置・レイヤーを 1 件ずつ別に選ぶと、立ち絵と素材が重なり、奥と手前が入れ替わる。
      「1 人が中央」「素材が左で、1 人が右」のように、重ならない枠の組に名前を付けた画面の構成を用意し、区間ごとに 1 つ選ぶ。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 立ち絵の枠と素材の枠を重ならないように定義した構成を用意する（枠は立ち絵を向かせる向きも持つ）
      2. 素材を出す間は、立ち絵を端の枠へ移す構成を選ぶ
      3. 素材が無い区間は、立ち絵が中央の構成へ戻す
      4. 構成の値を変えたときに備え、同じ時刻に立ち絵の枠と素材の枠が重なったら警告を出す
