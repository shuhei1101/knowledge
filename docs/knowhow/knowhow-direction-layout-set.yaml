id: knowhow-direction-layout-set
kind: knowhow
name: 立ち絵と素材は重ならない位置の組（画面の構成）から選んで配置する
description: 立ち絵の枠と素材の枠を重ならない組として名前を付けた画面の構成を用意し、区間ごとに構成を 1 つ選んで配置する技法を記載し、動画の立ち絵と素材の配置を決めるときに参照する。
