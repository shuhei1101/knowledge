confidence: medium
items:
  - id: overview
    name: 概要
    body: |-
      背景をほんの少しだけぼかすと、立ち絵と素材がはっきり見える。
      解説動画では既定で少しぼかし、背景を見せる区間だけ解除する。
      手前の机などの背景のパーツにも同じぼかしをかけ、背景だけがぼけて机がはっきり見えるのを防ぐ。
  - id: steps-01
    name: 使用方法
    body: |-
      1. 1920×1080 の背景なら半径 3 ピクセルほどから試す
      2. ぼかした背景の絵は 1 回だけ作成して再利用する（フレームごとにぼかすと書き出しが遅くなる）
