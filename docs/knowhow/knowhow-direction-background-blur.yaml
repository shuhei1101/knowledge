id: knowhow-direction-background-blur
kind: knowhow
name: 背景をほんの少しだけぼかして立ち絵と素材をはっきり見せる
description: 動画の背景にごく弱いぼかしを既定でかけ、立ち絵と素材をはっきり見せる技法と、PoC で確認したぼかしの強さを記載し、動画の背景の見せ方を決めるときに参照する。
