    plan: '#352'
  - item: 前例の公開文書の配信のワークフロー（IF-137-2）をフローチャートと全体の流れで記載し直す
    reason: '追加するのは省略できる書式で、今の記載は検査を通ったまま。この作業 PR の書式が確定しないと中身が決まらない。knowledge の workflow を設計し直す #352 で扱うかをレビューで確定する'
