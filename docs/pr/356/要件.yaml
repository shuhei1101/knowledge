  - item: workflow の静的な検査（actionlint を lint の層へ入れる・設計書と workflow のファイルの突き合わせ）
    reason: '#351 の終わりの条件に含まれない。突き合わせはこの作業 PR で決める書式を前提にする'
    plan: to_file
  - item: workflow のフローを pytest から `gh` で確認するテストの書き方（検証用のブランチの push・起動・結果の照合・削除）の規約
    reason: '#351 の終わりの条件に含まれない。フローの書式が確定してから中身が決まる'
