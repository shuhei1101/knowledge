Pages の配信を許すブランチへの develop の追加:
  説明: GitHub の環境 `github-pages` の配信を許すブランチ（今は `gh-pages`・`master`）に `develop` を足し、develop への push で動く `pages.yml` が配信できるようにする
  タグ: [GitHub の設定]
  実行者: planner
  時期: マージの前
  回数: 1 回限り
  可逆: true
  疎通確認: Pages の配信を許すブランチへの develop の追加/疎通確認.sh
  実行: Pages の配信を許すブランチへの develop の追加/実行.sh
  確認: Pages の配信を許すブランチへの develop の追加/確認.sh
  切り戻し: Pages の配信を許すブランチへの develop の追加/切り戻し.sh
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`gh api repos/shuhei1101/knowledge/environments/github-pages/deployment-branch-policies` の `branch_policies[].name` に `develop` がある"
  状態: 未
設計書のスキーマのタグの作成:
  説明: 作業 PR を develop へマージした後に、`design-schemas/v*` の最新のタグのパッチを上げたタグ（今の最新は `design-schemas/v7.0.0` で、作るタグは `design-schemas/v7.0.1`）を、メッセージに `(#323)` を入れて develop の squash commit へ作成して push する（`test_procedure.schema.yaml` の `layers` の `x-rules` の文だけを変え、設計書の検査の結果を変えない変更のため、パッチを上げる）。切り戻しは、メッセージに `(#323)` を持つタグだけを削除する
  タグ: [タグ, スキーマ]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: 設計書のスキーマのタグの作成/疎通確認.sh
  実行: 設計書のスキーマのタグの作成/実行.sh
  確認: 設計書のスキーマのタグの作成/確認.sh
  切り戻し: 設計書のスキーマのタグの作成/切り戻し.sh
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`git ls-remote --tags origin 'design-schemas/*'` の最新のタグが `design-schemas/v7.0.1` で、その commit の `schemas/design/test_procedure.schema.yaml` の `layers` の `x-rules` に「Git フックと CI では動かさない。」がある"
  状態: "-"
