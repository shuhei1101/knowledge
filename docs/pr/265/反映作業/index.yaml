設計書のスキーマのタグの作成:
  説明: 作業 PR を develop へマージした後に、`design-schemas/v*` の最新のタグを上げたタグを、メッセージに `(#265)` を入れて develop の squash commit へ作成して push する。既存のキーを廃止して既存の設計書が検査を通らなくなる場合はメジャー（今の最新の `design-schemas/v2.0.0` なら `design-schemas/v3.0.0`）、種類の追加だけの場合はマイナーを上げる。切り戻しは、メッセージに `(#265)` を持つタグだけを削除する
  タグ: [タグ, スキーマ]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: null
  実行: null
  確認: null
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`git ls-remote --tags origin 'design-schemas/*'` の最新のタグが、この PR の squash commit を指し、その commit の `schemas/design/layout.schema.yaml` がある"
  状態: "-"
