設計書のスキーマのタグの作成:
  説明: 作業 PR を develop へマージした後に、`design-schemas/v*` の最新のタグのマイナーを上げたタグを、メッセージに `(#556)` を入れて develop の squash commit へ作成して push する（エージェントの定義のスキーマへの任意の配列の追加で、今の設計書はそのまま検査を通るため、マイナーを上げる）。切り戻しは、メッセージに `(#556)` を持つタグだけを削除する
