  実行: 設計書のスキーマのタグの作成/実行.sh
  確認: 設計書のスキーマのタグの作成/確認.sh
  切り戻し: 設計書のスキーマのタグの作成/切り戻し.sh
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`git ls-remote --tags origin 'design-schemas/*'` の最新のタグの commit の `schemas/design/agent.schema.yaml` の `properties` が `turn_notices` を持つ"
