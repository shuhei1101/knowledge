設計書のスキーマのタグの作成:
  説明: 作業 PR を develop へマージした後に、`design-schemas/v*` の最新のタグのマイナーを上げたタグを、メッセージに `(#556)` を入れて develop の squash commit へ作成して push する（エージェントの定義のスキーマへの任意の配列の追加で、今の設計書はそのまま検査を通るため、マイナーを上げる）。切り戻しは、メッセージに `(#556)` を持つタグだけを削除する
  タグ: [タグ, スキーマ]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: 設計書のスキーマのタグの作成/疎通確認.sh
  実行: 設計書のスキーマのタグの作成/実行.sh
  確認: 設計書のスキーマのタグの作成/確認.sh
  切り戻し: 設計書のスキーマのタグの作成/切り戻し.sh
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`git ls-remote --tags origin 'design-schemas/*'` の最新のタグの commit の `schemas/design/agent.schema.yaml` の `properties` が `turn_notices` を持つ"
  状態: skipped
aituber の後続への連絡:
  説明: タグを作成した後に、shuhei1101/aituber の open の Issue から、ブレインノードのエージェントの定義（ゲーム実況・配信・個人チャット）へ通知を記載する後続を探し、あればその Issue の会話欄へ作成したタグの名前と追加したキー `turn_notices` を添えて着手できる旨をコメントして `確認:task-planner` を付け、無ければ同じ内容で shuhei1101/aituber へ Issue を起票する（起点 Issue #553 の後続）
  タグ: [連絡, 起票]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: null
  実行: null
  確認: null
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: shuhei1101/aituber に、作成した `design-schemas/v*` のタグの名前と `turn_notices` を含む planner の Issue かコメントがある
  状態: skipped
