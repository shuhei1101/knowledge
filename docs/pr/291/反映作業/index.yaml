設計書のスキーマのタグの作成:
  説明: 作業 PR を develop へマージした後に、`design-schemas/v*` の最新のタグのマイナーを上げたタグ（今の最新は `design-schemas/v5.0.0` で、作るタグは `design-schemas/v5.1.0`）を、メッセージに `(#291)` を入れて develop の squash commit へ作成して push する（`schemas/design/` に任意のキー `visibility`・`tags`・`aliases` を追加するだけで、既存の設計書は検査を通るため、マイナーを上げる）。切り戻しは、メッセージに `(#291)` を持つタグだけを削除する
