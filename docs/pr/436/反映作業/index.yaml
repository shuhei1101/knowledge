設計書のスキーマのタグの作成:
  説明: 作業 PR を develop へマージした後に、`design-schemas/v*` の最新のタグのマイナーを上げたタグ（今の最新は `design-schemas/v9.0.0` で、作成するタグは `design-schemas/v9.1.0`）を、メッセージに `(#436)` を入れて develop の squash commit へ作成して push する（`test_files` の件数の上限を上げ、lint 層の決まりを追加する変更で、今の設計書はそのまま検査を通るため、マイナーを上げる）。切り戻しは、メッセージに `(#436)` を持つタグだけを削除する
  タグ: [タグ, スキーマ]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: 設計書のスキーマのタグの作成/疎通確認.sh
  実行: 設計書のスキーマのタグの作成/実行.sh
  確認: 設計書のスキーマのタグの作成/確認.sh
  切り戻し: 設計書のスキーマのタグの作成/切り戻し.sh
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`git ls-remote --tags origin 'design-schemas/*'` の最新のタグが `design-schemas/v9.1.0` で、その commit の `schemas/design/module.schema.yaml` の `test_files` が `maxItems: 1` を持たない"
  状態: "-"
mdmark への連絡:
  説明: タグを作成した後に、shuhei1101/mdmark#290 へ、`design-schemas/v9.1.0` で `test_files` が実行環境ごとに単体テストのファイルを持てるようになった旨と、このタグを指せば補足へ移した 2 つ目のテストファイルを `test_files` へ戻せる旨をコメントする
  タグ: [連絡]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: mdmark への連絡/疎通確認.sh
  実行: mdmark への連絡/実行.sh
  確認: mdmark への連絡/確認.sh
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: shuhei1101/mdmark#290 の会話欄に、`design-schemas/v9.1.0` と `test_files` を含むコメントがある
  状態: "-"
