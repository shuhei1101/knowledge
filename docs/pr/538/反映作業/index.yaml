knowledge の直コミットの範囲の登録:
  説明: 端末の設定（~/.config/project-index/settings.yaml）の sources[] の knowledge の行に direct_commit.scope（/home/shuhei2441/**）を追加し、project-index の端末の設定の API で書き換えて再読み込みする。再読み込みで develop のワークツリーの project-index.yaml の direct_commit・generators も読み直す。切り戻しは同じ API で direct_commit.scope を空に戻す
  タグ: [設定, 再読み込み]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: knowledge の直コミットの範囲の登録/疎通確認.py
  実行: knowledge の直コミットの範囲の登録/実行.py
  確認: knowledge の直コミットの範囲の登録/確認.py
  切り戻し: knowledge の直コミットの範囲の登録/切り戻し.py
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: 端末の設定の API（GET /settings/sources）で knowledge の行の状態が serving で、その行の directCommit.scope が /home/shuhei2441/** になっている
