use_cases:
  - kind: single
    scenario: docs/scenario/SC-536-1.yaml
    impact: new
    detail: 手元のセッションが、ノウハウ・単語の対応表・用語集を knowledge へ直コミットで登録する。単語の対応表は対応表のコピーも同じコミットに入る。規約などほかの種類と、許可した作業場所の外部からの直コミットは断られる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-148-1.yaml
    impact: changed
    detail: 直コミットした単語の対応表の行が、プラグインを更新せずに直後の照合で通知される（要件の案 A にした場合）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-72-5.yaml
    impact: run_only
    detail: knowledge のワークツリーの中からの書き込みは変わらない。対応表のコピーの生成を登録するため、書き込みの後に生成が流れても書き込みが通ることを確認する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-514-1.yaml
    impact: none
    detail: ネットミームの配信元の直コミットは別の配信元の設定で、変わらない
    depends_on: []
