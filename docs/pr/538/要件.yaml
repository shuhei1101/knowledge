    status: todo
  - page: docs/guide/guide-setup-docs-mcp.yaml
    new: false
    change: knowledge の行の direct_commit.scope の記載手順と、直コミットできる種類の確認と、slop-check の環境変数 SLOP_CHECK_WORD_LIST の設定を追加する
    status: todo
  - page: README.md
    new: false
    change: ノウハウ・単語の対応表・用語集は許可した作業場所から直コミットで登録できることを追記する
    status: todo
  - page: docs/architecture/ARCH-72-1.yaml
    new: false
    change: 手元のセッションから project-index 経由で knowledge の develop へ直コミットする経路を追記する
    status: todo
  - page: docs/layout/LAY-72-1.yaml
    new: false
    change: project-index.yaml の contents に直コミットと生成を追記する
    status: todo
scope_out:
  - item: 規約・テンプレート・判定フローチャートなど、ほかの種類の直コミット
    reason: Issue の決定でレビューが要る種類は今までどおり作業 PR で登録する
    plan: none
  - item: 話し合いの表（A-157 のノウハウ・A-45 の単語）の登録
    reason: Issue の後続で、利用者の指示の後に話し合いの側が直コミットで登録する
    plan: none
