use_cases:
  - kind: single
    scenario: docs/scenario/SC-536-1.yaml
    impact: new
    detail: 手元のセッションが、ノウハウ・単語の対応表・用語集を knowledge へ直コミットで登録する。単語の対応表は対応表のコピーも同じコミットに入る。規約などほかの種類と、許可した作業場所の外部からの直コミットは断られる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-148-1.yaml
    impact: changed
    detail: 環境変数で knowledge の develop のワークツリーの対応表を指した端末では、直コミットした単語の対応表の行が、プラグインを更新せずに直後の照合で通知される
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-72-5.yaml
    impact: run_only
    detail: knowledge のワークツリーの中からの書き込みは変わらない。単語の対応表の行に対応表のコピーの生成を付けるため、対応表の書き込みの後に生成が実行されても書き込みが通ることを確認する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-514-1.yaml
    impact: none
    detail: ネットミームの配信元の直コミットは別の配信元の設定で、変わらない
    depends_on: []
