scope_out:
  - item: 各リポジトリの設計書のタイトルの前置きの削除と、件数の多いグループの分割
    reason: 起点 Issue の後続で、各リポジトリの Issue（shuhei1101/aituber#136・shuhei1101/mindstella#543・shuhei1101/ai-monitor#3510）が扱う。この作業 PR は完了後に着手できる旨を連絡する（反映作業）
    plan: none
  - item: 前置きのあるタイトルを検査で違反にする
    reason: 要望は説明として案内すること。違反にすると、後続の Issue で前置きを削除する前に各リポジトリの設計書が検査を通らなくなり、design-schemas のメジャーを上げる破壊的変更になる
    plan: none
