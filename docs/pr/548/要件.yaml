    reason: 起点 Issue の後続で、各リポジトリの Issue（shuhei1101/aituber#136・shuhei1101/mindstella#543・shuhei1101/ai-monitor#3510）が扱う。この作業 PR は完了後に着手できる旨を連絡する（反映作業）
