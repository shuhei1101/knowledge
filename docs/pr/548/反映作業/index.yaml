設計書のスキーマのタグの作成:
  説明: 作業 PR を develop へマージした後に、`design-schemas/v*` の最新のタグのマイナーを上げたタグを、メッセージに `(#548)` を入れて develop の squash commit へ作成して push する（`title` の説明と `x-rules` の変更と `pattern` を外す変更で、既存の設計書は検査を通ったままなので、マイナーを上げる）。切り戻しは、メッセージに `(#548)` を持つタグだけを削除する
