設計書のスキーマのタグの作成:
  説明: 作業 PR を develop へマージした後に、`design-schemas/v*` の最新のタグのマイナーを上げたタグ（今の最新は `design-schemas/v8.3.0` で、作成するタグは `design-schemas/v8.4.0`）を、メッセージに `(#415)` を入れて develop の squash commit へ作成して push する（任意のキーの追加で、既存の設計書は検査を通ったままのため、マイナーを上げる）。切り戻しは、メッセージに `(#415)` を持つタグだけを削除する
  タグ: [タグ, スキーマ]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: null
  実行: null
  確認: null
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`git ls-remote --tags origin 'design-schemas/*'` の最新のタグが `design-schemas/v8.4.0` で、その commit の `schemas/design/test_procedure.schema.yaml` の `layers[]` が全件にするパスの一覧の項目を持ち、`docs/flowchart/flowchart-integration-test-scope.yaml` がある"
  状態: "-"
