設計書のスキーマのタグの作成:
  説明: 作業 PR を develop へマージした後に、`design-schemas/v*` の最新のタグのマイナーを上げたタグを、メッセージに `(#542)` を入れて develop の squash commit へ作成して push する（設計書のスキーマ 2 つの追加と観点のスキーマの説明の変更で、既存の設計書の検査の結果を変えないため、マイナーを上げる）。切り戻しは、メッセージに `(#542)` を持つタグだけを削除する
  タグ: [タグ, スキーマ]
  実行者: planner
  時期: マージの後
  回数: 1 回限り
  可逆: true
  疎通確認: 設計書のスキーマのタグの作成/疎通確認.sh
  実行: 設計書のスキーマのタグの作成/実行.sh
  確認: 設計書のスキーマのタグの作成/確認.sh
  切り戻し: 設計書のスキーマのタグの作成/切り戻し.sh
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`git ls-remote --tags origin 'design-schemas/*'` の最新のタグの commit に、追加した 2 つの表の設計書のスキーマがあり、`schemas/design/eval_criterion.schema.yaml` の `x-rules` に語彙の表の列の決まりがある"
  状態: skipped
