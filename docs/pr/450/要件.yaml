scope_out:
  - item: scripts/・tests/ のコード（コメント・文字列・テストの入力）に残る 12 単語
    reason: Issue の対象は文書（docs/・schemas/・skills/ 等）。テストの入力やコードの文字列は照合の検査対象そのものを含み、置き換えると検査の意図が変わる。ただし、設計書のケースの summary を写したテストの docstring 5 件は、設計書と食い違わないように合わせて置き換えた
    plan: none
  - item: plugins/slop-check/hooks/post-tool-use/word-list-ai-slop.json と ruff.toml・scripts/lint/.markdownlint-cli2.jsonc のヒット
    reason: json は対応表から生成した写しで対応表そのものの単語を持つ。設定ファイルは文書ではない
    plan: none
  - item: docs/pr/・docs/word-list/ のヒット
    reason: docs/pr/ は過去の作業 PR の記録で書き換えない。docs/word-list/ は対応表そのもので NG の単語を持つ
    plan: none
  - item: 判定フローチャート『結合テストの実行範囲』の実行範囲の表の列名「結合テストが無い入口」を「結合テストが無いエントリーポイント」へ揃える。AI Monitor 側で完全一致で照合・出力している箇所（`src/ai_monitor/features/integration_scope/check.py` の `_HEADER`・`judge.py` の出力・IF-3483-1・IF-3483-2・MOD-3483-3・MOD-3483-4・PH-3038-39・SC-3038-91・テンプレート『PRドキュメント/対象システム計画』）を、移行の間は新旧の列名を両方受け付ける形で揃えてから、knowledge の列名を変える
    reason: 列名は AI Monitor の `integration_scope check` が完全一致で照合しており、knowledge だけ先に変えると、フローチャートどおりに書いた計画書で `LookupError` になり reviewer の照合が止まる（規約『複数リポジトリのAPI契約』の後方互換）。この PR では列名を「結合テストが無い入口」のまま残す
    plan: shuhei1101/ai-monitor#3570
