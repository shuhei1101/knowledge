設計書のスキーマのタグの作成:
  説明: 作業 PR を develop へマージした後に、`design-schemas/v*` の最新のタグのマイナーを上げたタグを、メッセージに `(#449)` を入れて develop の squash commit へ作成して push する（任意の項目 category の追加で後方互換を保つため、マイナーを上げる）。切り戻しは、メッセージに `(#449)` を持つタグだけを削除する
