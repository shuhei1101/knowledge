  実行: null
  確認: null
  切り戻し: null
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`git ls-remote --tags origin 'design-schemas/*'` の最新のタグの commit の `schemas/knowledge-files.schema.yaml` の `files[].items.properties` に `category` がある"
