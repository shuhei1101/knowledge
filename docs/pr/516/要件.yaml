scope_out:
  - item: テンプレートを使用している各リポジトリの既存の設計書を、条件の列で書き直す
    reason: '条件のキーは任意で、今の設計書はそのまま検査を通る。各リポジトリが design-schemas のタグを上げた後、判別のキーで分かれるキーを書くときに使用する（データ: ネットミームは #514 で使用する）'
    plan: none
  - item: dev-docs の画面の設計書の表で、条件のキーを持つ行が無い表に条件の列を出さない
    reason: 設計書の種類の表はスキーマ駆動で dev-docs のサーバーが描く。空の列を省くかは dev-docs の描き方次第で、knowledge の変更では決まらない。今の判断は、ドキュメント修正で dev-docs の描き方を確かめ、空の列を出す場合は dev-docs へ起票する。確定はレビューで行う
    plan: to_file
  - item: 条件のキーを JSON Schema の if・then に変換して、条件に該当するときの必須を検査する
    reason: 要望は表で一覧することで、条件からスキーマを生成する使い道は今無い。条件の値の型は要件.mark.md の未確定で決める
    plan: none
