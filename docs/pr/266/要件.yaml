scope_out:
  - item: knowledge 自身の設計書（`docs/architecture/`・`docs/scenario/`・`docs/interface/`・`docs/module/` など）を、見直したキーに合わせること
    reason: 判断が分かれる。#253 の後、これらの設計書は `dev-docs.yaml` で `schemas/` 直下の AI Monitor の配布物のスキーマ（`schemas/architecture.schema.yaml` など）で検査され、`schemas/design/` では検査されない。今合わせると配布物のスキーマの検査を通らなくなるため、AI Monitor が新しい `design-schemas` のタグへ追従して配布物が変わった後に合わせるのが今の判断。レビューで確定する
    plan: to_file
  - item: キーに使用先が記載されているかを検査のスクリプトで機械的に確かめること
    reason: 要望は使用先が分かる状態で、検査の追加を含まない。メタスキーマの `required` に入れると `$defs`・`allOf` などキーでないサブスキーマにも当たり、`scripts/check_all.py` の変更が要る
    plan: to_file
