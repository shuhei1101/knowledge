scope_out:
  - item: '`schemas/skill.schema.yaml` の文言の置き換え'
    reason: '#224 がテンプレート『スキル』とこのスキーマを削除する'
    plan: none
  - item: 設計書のスキーマのコピーを持つ他のプロジェクト（ai-monitor・dev-docs 等）のコピーの文言の置き換え
    reason: 各プロジェクトは `design-schemas/v*` のタグで正本を指し、新しいタグへの追従は各プロジェクトの作業
    plan: none
  - item: '`schemas/guide.schema.yaml` の「使い方」のヒット'
    reason: 文書の種類の名前の「使い方」で、動詞の「使う」ではない
    plan: none
use_cases:
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/開発者がスキーマから設計書のテンプレートを生成する.yaml
    impact: run_only
    detail: スキーマの文言を置き換えた後に設計書のテンプレートを再生成する。生成の手順は変えない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/開発者が文書の違反を検査する.yaml
    impact: run_only
    detail: スキーマの文言の置き換えで、既存の文書の検査の結果を変えない。設計書のスキーマの説明を 2 文以内にする検査が通るようになる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/エージェントが knowledge の文書を書き込む.yaml
    impact: none
    detail: スキーマの説明の文言だけが変わり、書き込みの検査の結果を変えない
    depends_on: []
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/利用者が端末に knowledge を導入して規約を引く.yaml
    impact: none
    detail: 導入と規約の参照の流れを変えない
    depends_on: []
