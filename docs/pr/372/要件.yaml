scope_out:
  - item: docs/changelog.yaml・docs/pr/ の dev-docs.yaml の記述
    reason: 当時の記録で、改名に合わせて書き換えると履歴が変わる（計画の行の概要）
    plan: none
  - item: dev-docs の端末の設定 ~/.config/dev-docs/settings.yaml の sources[] の knowledge の行
    reason: dev-docs の設定のスキーマで sources は「前のバージョンから残った配信元」で、配信に使用しないため、書き換えなくても配信は変わらない
    plan: none
  - item: 規約・README・CLAUDE.md・用語『配信元』の「dev-docs が配信する」の文の project-index への書き換え
    reason: ファイル名ではなく文の書き換えで、同じ内容の open の Issue がある
    plan: '#328'
  - item: 使い方『knowledge を project-index の配信元に登録する』の sources[] の行の例（config が 1 つのパスで id を持たない）と、端末の設定の実際の行（id と config の配列）の書式の違い
    reason: 'project-index が config の文字列 1 つの書式と id の省略を受け付ける（SourceEntry の _as_list・id: str | None）ため、使い方の例は誤りではない'
    plan: none
