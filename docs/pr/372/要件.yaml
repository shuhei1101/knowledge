use_cases:
  - kind: composite
    scenario: docs/scenario/SC-72-1.yaml
    impact: changed
    detail: 導入の前提と異常系で利用者へ返る誤りのあるファイルを、knowledge の配信元の設定 project-index.yaml に合わせる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-72-2.yaml
    impact: changed
    detail: 登録した端末の設定の sources[] の config が指すファイルと、前提・異常系の配信元の設定のファイル名を project-index.yaml に合わせる
    depends_on:
      - docs/scenario/SC-72-1.yaml
  - kind: single
    scenario: docs/scenario/SC-72-3.yaml
    impact: following
    detail: 画面のタブとサイドバーの並びの元になる設定のファイル名を project-index.yaml に合わせる
    depends_on:
      - docs/scenario/SC-72-1.yaml
  - kind: single
    scenario: docs/scenario/SC-72-6.yaml
    impact: run_only
    detail: 全ての文書の検査が読む配信元の設定のファイル名が変わる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-72-5.yaml
    impact: run_only
    detail: 書き込みの検査で project-index が起動する検査のスクリプトが読む配信元の設定のファイル名が変わる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-137-1.yaml
    impact: run_only
    detail: 公開文書の成果物を作るスクリプトが読む配信元の設定のファイル名が変わる
    depends_on: []
