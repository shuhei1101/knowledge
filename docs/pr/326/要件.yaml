scope_out:
  - item: 直下の dev-docs.yaml の project-index.yaml への改名と、設計書・規約・テンプレート・CLAUDE.md のファイル名 dev-docs.yaml の記述
    reason: 'project-index の develop は project-index.yaml が無ければ dev-docs.yaml を読む（src/project_index/features/admin/service.py の LEGACY_CONFIG_FILE）ため、改名しなくても #309 の終わりの条件は満たせる。改名すると端末の設定の sources[] の config（dev-docs.yaml を直接指す）の書き換えの反映作業が要り、#311（直下の dev-docs.yaml の AI slop）と重なるため、別の Issue に分ける（複合ユースケース設計のレビューで確定）'
    plan: '#329'
  - item: slop-check のフックとスキル text-review の MCP の名前の対応
    reason: '#309 の書き直しの判断で別の Issue に分けた'
    plan: '#313'
  - item: docs/template/ のテンプレートと schemas/design に残る AI slop の単語
    reason: '#263 と同じ切り出しの別のフォルダで、#263 の対象に含まれない'
    plan: '#261'
  - item: フォルダを分けて items を生成するテンプレートを見分けること（#281 の「フォルダかファイル名で見分けられる」）
    reason: 手で直した items は scripts/check_all.py の check_design_templates が検出し、#281 の「または生成した部分を手で直したときに検査で分かる」を develop で満たしている（#281 の受付の判断）
    plan: none
  - item: schemas/ 直下の AI Monitor の配布物のスキーマのコピーの generated_from
    reason: '#283（close 済み）でコピーを削除し、origin/develop の schemas/ 直下に配布物のコピーは無い'
    plan: none
  - item: 規約・判定フローチャート・guide-setup-apply-rule-index.yaml・README.md・CLAUDE.md の、文書の MCP・管理の MCP・配信元の登録を dev-docs が持つ記述
    reason: '#309 の対象（ARCH-72-1・SC-72-1〜SC-72-5・guide-setup-docs-mcp.yaml）の外で、この作業 PR がマージされなくても同じ内容で成り立つ'
    plan: '#328'
