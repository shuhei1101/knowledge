use_cases:
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/利用者が dev-docs に knowledge を登録する.yaml
    impact: run_only
    detail: 配信の設定に設計書の種類が加わるため、登録した後に規約と設計書が引けることを確かめる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/エージェントが knowledge の文書を検索・取得する.yaml
    impact: run_only
    detail: 文書の置き場所が変わるため、規約の検索と取得が変わらず動くことを確かめる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/利用者が GitHub Pages で knowledge の公開文書を読む.yaml
    impact: run_only
    detail: 移した設計書が公開されず、今の公開文書だけが出ることを確かめる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/開発者が文書の違反を検査する.yaml
    impact: run_only
    detail: 検査の対象に移した設計書が加わっても検査が通ることを確かめる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/開発者がスキーマから設計書のテンプレートを生成する.yaml
    impact: run_only
    detail: スキーマの置き場所が変わっても、設計書のテンプレートが同じ中身で生成されることを確かめる
    depends_on: []
