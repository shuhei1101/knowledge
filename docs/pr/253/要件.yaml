scope_out:
  - item: docs/template・docs/rule の中で、各プロジェクトの設計書の置き場所を dev/設計書/・dev/mock/・dev/ と書いている本文（template-container・template-design-policy・template-project-claude・template-project-readme・template-screen-design・template-test-fixture・dev-coding-general の NG 例）
    reason: 今の判断はスコープ外。Issue は knowledge 自身の dev/ を指すパスの追随を求め、各プロジェクトへの決まりの本文は含めていない。ただし rules.yaml の paths を移した後の置き場所にすると本文と食い違うため、含めるかはレビューで確定する
    plan: to_file
  - item: rules.yaml の template-container・template-test-fixture の paths（**/dev/設計書/コンテナ構成/**・**/dev/設計書/テストフィクスチャ.{md,yaml}）
    reason: ai-monitor#3307 の置き場所の表に、コンテナ構成・テストフィクスチャの移した後の置き場所が無い。同じテンプレートの本文の配置の記述（1 行目）と一緒に決める
    plan: to_file
