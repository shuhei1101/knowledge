    reason: 要望はモジュール構成の単体テストだけで、E2E の置き場所は規約『V字モデル』の tests/e2e/ との整合の判断を伴う。今回の変更がマージされなくても同じ内容で成り立つため、別の Issue に切り出すと判断した（判断が分かれるため、レビューで確定する）
    plan: to_file
