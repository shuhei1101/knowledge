    change: '画面全体に `screen_type`・`leave_guard`（必須）・`retained_state` を、要素に `icon`・`label_display`・`accessible_name`・`tooltip`・`narrow`・`disabled_reason`・`confirm`・`feedback`・`toggle_state`・`live`・`history`・`resets`・`shortcut`・`pane`・`tabs`・`table`・`close`・`modal`・`initial_focus`・`return_focus`・`retained_state`・列の `sortable`・`filterable`・`pinnable`・`hideable` を追加し、#600 から移した種類ごとの必須・禁止を `kind` を判別子にした `allOf` の `if` / `then` で指定する。`sorting` を削除し、`io`・`align`・`initial_state` の enum を英語にする。欄の `x-rules` から #601 の規約を参照し、`examples` を合わせる'
