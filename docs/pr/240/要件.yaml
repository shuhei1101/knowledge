use_cases:
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/エージェントが knowledge の文書を書き込む.yaml
    impact: none
    detail: 書き込みの点検の対象になるのは設計書の本文で、knowledge の文書のスキーマの本文の型は変えない。文言の置き換えは検査の結果を変えない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/開発者が文書の違反を検査する.yaml
    impact: none
    detail: スキーマの種類の値の追加と文言の置き換えで、既存の文書の検査の結果を変えない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/エージェントが knowledge の文書を検索・取得する.yaml
    impact: none
    detail: 検索・取得の手順を変えない
    depends_on: []
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/利用者が端末に knowledge を導入して規約を引く.yaml
    impact: none
    detail: 導入と規約の参照の流れを変えない
    depends_on: []
