scope_out:
  - item: シナリオの `scenarios[].flow` を mdmark の図で記載する修正と、シナリオの設計書の図の移行
    reason: mdmark の新しい図 map が入ってから map で記載する（D-373 A）
    plan: '#246'
  - item: インターフェース定義の `flow` とモジュール構成の `diagrams[].diagram` を mdmark の図で記載する修正と、その設計書の図の移行
    reason: ai-monitor#3222 でも `$defs/mermaid` を参照したままで、どの mdmark の図にするかは新しい決定になる
    plan: '#251'
  - item: knowledge の `dev/テンプレート/`（AI Monitor のテンプレートのコピー）の修正
    reason: 設計書のスキーマの原本は `schemas/design/` で、`dev/` の廃止とあわせてコピーの扱いが決まる
    plan: '#237'
  - item: 設計書のスキーマを指す他のプロジェクトの設計書の、新しいキーへの変換
    reason: 各プロジェクトは `design-schemas/v*` のタグで原本を指し、新しいタグへの追従と変換（ai-monitor の `schemas/conversions/v0.4.0.py`）は各プロジェクトと shuhei1101/ai-monitor#3188 の作業
    plan: none
