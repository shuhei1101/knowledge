use_cases:
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/開発者がスキーマから設計書のテンプレートを生成する.yaml
    impact: run_only
    detail: 修正したスキーマから設計書のテンプレートを生成し直す。生成の手順は変えない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/開発者が文書の違反を検査する.yaml
    impact: run_only
    detail: 修正したスキーマが、スキーマ自身の検査と例の検査を通り、テンプレートがスキーマと一致することを確認する。検査の手順は変えない
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/エージェントが knowledge の文書を書き込む.yaml
    impact: none
    detail: knowledge の文書のスキーマは変わらず、書き込みの検査の結果を変えない
    depends_on: []
  - kind: composite
    scenario: dev/設計書/シナリオ/複合ユースケース/利用者が端末に knowledge を導入して規約を引く.yaml
    impact: none
    detail: 規約の引き方を変えない
    depends_on: []
