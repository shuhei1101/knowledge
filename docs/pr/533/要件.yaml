use_cases:
  - kind: single
    scenario: docs/scenario/SC-526-1.yaml
    impact: new
    detail: 利用者がスキルでネットミームの登録を指示し、作品・話題ごとにリサーチャーが集めた候補を確認して、登録すると回答した作品と用語だけがネットミームの配信元へ直コミットで登録される
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-514-1.yaml
    impact: following
    detail: 登録のスキルの登録の工程が、この書き込みを呼ぶ側になる。書き込みの流れは変わらない
    depends_on:
      - docs/scenario/SC-526-1.yaml
  - kind: single
    scenario: docs/scenario/SC-312-1.yaml
    impact: run_only
    detail: 登録のスキルの設計書から SKILL.md を書き出す。生成の流れは変わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-72-6.yaml
    impact: run_only
    detail: 追加するエージェントフロー・判定表・SKILL.md と、最初に登録する作品とネットミームが、全ての文書の検査に合格する。検査の流れは変わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-72-4.yaml
    impact: none
    detail: ネットミームの配信元を検索すると、登録した作品とネットミームが返る。検索の流れは変わらない
    depends_on: []
