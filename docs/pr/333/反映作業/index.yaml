  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返す
  確認方法: "`git ls-remote --tags origin 'design-schemas/*'` の最新のタグが `design-schemas/v8.0.0` で、その commit の `schemas/design/interface.schema.yaml`・`schemas/design/module.schema.yaml` が `$defs/mermaid` を参照していない"
