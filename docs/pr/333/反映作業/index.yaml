設計書のスキーマのタグの作成:
  説明: 作業 PR を develop へマージした後に、`design-schemas/v*` の最新のタグのメジャーを上げたタグ（今の最新は `design-schemas/v7.0.1` で、作るタグは `design-schemas/v8.0.0`）を、メッセージに `(#333)` を入れて develop の squash commit へ作成して push する（インターフェース定義の `flow` とモジュール構成の `diagram` の記載方法が変わり、既存の設計書が新しい記載方法と合わなくなる変更のため、メジャーを上げる）。切り戻しは、メッセージに `(#333)` を持つタグだけを削除する
