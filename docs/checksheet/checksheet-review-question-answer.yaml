# yaml-language-server: $schema=../../schemas/checksheet.schema.yaml
id: checksheet-review-question-answer
kind: checksheet
name: "質問への回答のレビュー観点 チェックシート"
description: 質問への回答をレビューするときの観点を並べ、仕様や挙動の質問への回答をレビューするときに参照する。
aliases:
  - 回答のレビュー観点
tags:
  - name: scope:dev
  - name: topic:チェックシート
  - name: topic:観点
  - name: action:レビュー
  - name: topic:回答
    main: true
  - name: topic:根拠
status: current
visibility: internal
rev: 2
related:
  - to: checksheet-review-common
    type: references
    when: 成果物の種類によらない共通の観点も確認するとき
items:
  - id: overview
    name: 概要
    body: 質問への回答をレビューするときの観点。
aspects:
  - id: aspect-review-question-answer-01
    name: 根拠の実在
    description: 回答の根拠が、実在するドキュメントのページ・コード・Issue / PR を指していること
    note: 指した箇所を開いて確認する
    tags:
      - name: target:質問への回答
        main: true
    visibility: internal
  - id: aspect-review-question-answer-02
    name: 根拠の箇所の記載
    description: 指した箇所に、回答のとおりのことが記載されていること
    note: ハルシネーションの検査
    tags:
      - name: target:質問への回答
        main: true
    visibility: internal
  - id: aspect-review-question-answer-03
    name: 回答できなかった部分
    description: 回答できなかった部分が明示されていること
    note: 分からないことを断定していないか
    tags:
      - name: target:質問への回答
        main: true
    visibility: internal
  - id: aspect-review-question-answer-04
    name: 推測で補った箇所
    description: 推測で補った箇所が、推測と分かるように記載されていること
    tags:
      - name: target:質問への回答
        main: true
    visibility: internal
