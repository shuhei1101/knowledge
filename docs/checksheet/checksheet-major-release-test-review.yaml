kind: checksheet
id: checksheet-major-release-test-review
name: メジャーリリース前のテスト精査 チェックシート
description: メジャーのリリースで release を切る前に単体・結合・E2E のテストを精査したかを確認する観点を並べ、テストの精査の作業 PR の着手前と完了時に参照する。
aliases:
  - メジャーリリース前のテスト精査
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      メジャーのリリースで release を切る前に、単体・結合・E2E のテストを精査し、E2E とその基盤をまとめて作ったかを確認するシート。
      テストの精査の作業 PR で、着手前と完了時に確認する。
  - id: check-items-01
    group: チェック項目
    name: チェック項目
    body: |-
      <!-- table: data -->

      | 項目 | 補足 |
      | --- | --- |
      | スプリントの作業が全て develop へ入った後に着手していること | 精査の途中で仕様が変わると、精査と E2E の作成をやり直す |
      | 共通の前準備（fixture）が、各テストが使用しない部分まで作っていないこと | 広すぎる前準備はテストを遅くし、保守もしにくくする |
      | 前準備・テストデータの重複を共通のヘルパー・データの生成の仕組みへまとめていること | 同じデータの準備を複数のテストで繰り返していないかを確認する |
      | 使用されないテストデータ・前準備のフィールドを削除していること | - |
      | 新しい範囲を確認しないテストを削除か統合していること | 同じ分岐・同じ期待値を確認するテストが複数ないかを確認する |
      | 重い処理を持つテストを小さく分けるか、遅いテストの組に分けていること | 1 件 1 秒は目安 |
      | skip したままのテストを修正するか削除していること | 再試行で合格させることを方針にしない |
      | 単一ユースケース・複合ユースケースのシナリオの `test_file` と `scenarios[].test` が指す E2E を、その時点の仕様で作っていること | 開発の間は E2E を作っていないため、シナリオの文書から作る |
      | E2E のフィクスチャ・テストデータの基盤を、シナリオ全体で共通にできる部分から切り出していること | シナリオごとに同じ前準備を記載しない |
      | リファクタリングでテストの振る舞いを変えていないこと | 残したテストが精査の前後で全て pass し、削除・統合したテストの分岐を統合先が確認していること |

      <!-- /table -->
tags:
