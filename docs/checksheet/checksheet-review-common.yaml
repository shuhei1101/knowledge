# yaml-language-server: $schema=../../schemas/checksheet.schema.yaml
id: checksheet-review-common
kind: checksheet
name: "レビューの共通観点 チェックシート"
description: 成果物の種類によらずレビューで確認する共通の観点を並べ、設計書・文書・コードなどの成果物をレビューするときに参照する。
aliases:
  - レビューの共通観点
tags:
  - name: scope:dev
  - name: topic:チェックシート
  - name: topic:観点
    main: true
  - name: action:レビュー
status: current
visibility: internal
rev: 1
related:
  - to: convention-writing-style
    type: references
    when: 文章の確認表の行を確認するとき
  - to: dev-resource-values
    type: references
    when: 資源の値の導き方を確認するとき
items:
  - id: overview
    name: "概要"
    body: |-
      成果物の種類によらず、レビューで確認する共通の観点。
  - id: check-items-01
    group: チェック項目
    name: "チェック項目"
    body: |-
      <!-- table: data -->

      | 項目 | 補足 |
      | --- | --- |
      | 外部ライブラリ・外部 API・フレームワークの挙動に依る記述が、公式ドキュメントの該当箇所と一致していること | 一致を確認した箇所を指摘の根拠に記載する。ドキュメントに明記が無い挙動に測った記録が無ければ、測り方を添えて指摘する。外部ライブラリ・外部 API の設計書で動作確認済みの記述と、PoC や実行ログを添えている記述は問わない |
      | 新規に使用し始めた外部ライブラリ・外部 API が、その設計書の動作確認（`verification`）で動作確認済みであること | 未確認のままなら、動かせる対象かを確認させたうえで指摘する |
      | 実測しないと決まらない値と挙動（性能・上限・タイムアウト・件数・ライブラリの既定の振る舞い）に、測った記録があること | 記録が無ければ、測り方を添えて指摘する |
      | 資源の値（上限・待ち・回数・同時実行数・間隔）が規約 [資源の値の決め方](id:dev-resource-values) のとおりに導かれていること | 導出の元の値（外部の上限・実測・内側の待ち）が示されているかを確認する |
      | 「〜できる」「〜が必要」と断定している記述に、根拠のページか実測が示されていること | 示されていなければハルシネーションを疑う。設計の分岐がその断定を前提にしているなら、確認するまで合格にしない |
      | ライブラリが備える機能を自前で再実装していないこと | 引数・オプション・既存のユーティリティで足りないかを確認する |
      | 成果物が参照している資料（規約・上位の設計書）の記述どおりに記載されていること | - |
      | 差分が触れたページ（新規・追記・書き換え）の種類に対応するテンプレートがあれば、その構成どおりに記載されていること | 近くのページを真似た結果、テンプレートと異なる構成になっていないかを確認する |
      | 規約 [文章の書き方](id:convention-writing-style#writing-style-check-01) の確認表に該当する行が無いこと | 理由の説明・既出内容の言い換え・記載していない操作への禁止・後から増えるものの個数 |
      | 規約 [既存文章の維持](id:convention-keep-existing-text) のとおり、意味が変わらない言い換えや不要な構造変更で差分を増やしていないこと | 最初の編集で記載し切れていれば差分は小さくなる |
      | 同じ内容が他のページ・他のセクションに無いこと | ある場合は参照 1 行への置き換えを求める |
      | 採った案より良い案が無いことを確認していること | 別案を 1 つ以上自分で出して比較する |
      | 既存のものを修正すれば済むのに新規で作っていないこと | 似た役割のページ・関数・設定が既にあるかを探してから判断させる |
      | 共通化できるものを共通化していること | 同じ処理・同じ記述が 2 箇所以上に現れていないかを確認する |
      | 暫定対応・その場しのぎになっていないこと。他の変更で根本的に解決できないこと | 「いまは」「暫定的に」「後で修正する」と取れる箇所は、そのまま運用したときに何が起きるかを問う |
      | 項目・分岐・ページが増えたときに修正する箇所が増え続けないこと | 増えるたびに複数箇所を修正する構造は指摘する |
      | 上流の記述・他のページ・同じページの別セクションと矛盾していないこと | 矛盾はどちらが正かを添えて指摘する |
      | 命名が中身と一致していること | ページ名・見出し・型・関数・変数・ラベル、画面のボタン・リンクのアイコン・記号・文言、CLI のサブコマンド名・MCP ツール名が対象。対象と命名の意味が食い違えば指摘する。1 つの入口に性質の違う操作がぶら下がっていないかも確認する。同じ種類の既存のものと語彙・粒度が統一されているかも確認する。開発の現場で一般に使用する単語か・日本語にしたときに一般的な訳語か（造語・比喩で名付けていないか）も確認する |
      | 同じ遷移・同じ操作の入口が複数の場所に無いこと | 画面の導線に限らず、同じ処理への入口（CLI・MCP ツール 等）にも適用する。ある場合は、出る条件が排他（モバイル幅 / PC 幅 等）か、見えている入口への近道（キー操作 等）だと説明できなければ指摘する |
      | 変更量が少ない方に倒せていること | 新規追加と既存箇所削除のどちらでも実現できる場合、既存箇所の削除側に倒せているか |

      <!-- /table -->
