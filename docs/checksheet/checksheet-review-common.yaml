# yaml-language-server: $schema=../../schemas/checksheet.schema.yaml
id: checksheet-review-common
kind: checksheet
name: "レビューの共通観点 チェックシート"
description: 成果物の種類によらずレビューで確認する共通の観点を並べ、設計書・文書・コードなどの成果物をレビューするときに参照する。
aliases:
  - レビューの共通観点
tags:
  - name: scope:dev
  - name: topic:チェックシート
  - name: topic:観点
    main: true
  - name: action:レビュー
status: current
visibility: internal
rev: 2
related:
  - to: convention-writing-style
    type: references
    when: 文章の確認表の行を確認するとき
  - to: dev-resource-values
    type: references
    when: 資源の値の導き方を確認するとき
items:
  - id: overview
    name: "概要"
    body: |-
      成果物の種類によらず、レビューで確認する共通の観点。
aspects:
  - id: aspect-review-common-01
    name: "公式ドキュメントとの一致"
    description: "外部ライブラリ・外部 API・フレームワークの挙動に依る記述が、公式ドキュメントの該当箇所と一致していること"
    note: "一致を確認した箇所を指摘の根拠に記載する。ドキュメントに明記が無い挙動に測った記録が無ければ、どう測るかを添えて指摘する。外部ライブラリ・外部 API の設計書で動作確認済みの記述と、PoC や実行ログを添えている記述は問わない"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-02
    name: "新規の外部ライブラリの動作確認"
    description: "新規に使用し始めた外部ライブラリ・外部 API が、その設計書の動作確認（`verification`）で動作確認済みであること"
    note: "未確認のままなら、動かせる対象かを確認させたうえで指摘する"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-03
    name: "実測の記録"
    description: "実測しないと決定できない値と挙動（性能・上限・タイムアウト・件数・ライブラリの既定の振る舞い）に、測った記録があること"
    note: "記録が無ければ、どう測るかを添えて指摘する"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-04
    name: "資源の値の導き方"
    description: "資源の値（上限・待ち・回数・同時実行数・間隔）が規約 [資源の値の決め方](id:dev-resource-values) のとおりに導かれていること"
    note: "導出の元の値（外部の上限・実測・内側の待ち）が示されているかを確認する"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-05
    name: "断定の根拠"
    description: "「〜できる」「〜が必要」と断定している記述に、根拠のページか実測が示されていること"
    note: "示されていなければハルシネーションを疑う。設計の分岐がその断定を前提にしているなら、確認するまで合格にしない"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-06
    name: "ライブラリの機能の再実装"
    description: "ライブラリが備える機能を自前で再実装していないこと"
    note: "引数・オプション・既存のユーティリティで足りないかを確認する"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-07
    name: "参照する資料との一致"
    description: "成果物が参照している資料（規約・上位の設計書）の記述どおりに記載されていること"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-08
    name: "テンプレートの構成"
    description: "差分が触れたページ（新規・追記・書き換え）の種類に対応するテンプレートがあれば、その構成どおりに記載されていること"
    note: "近くのページを真似た結果、テンプレートと異なる構成になっていないかを確認する"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-09
    name: "文章の確認表"
    description: "規約 [文章の書き方](id:convention-writing-style#writing-style-check-01) の確認表に該当する行が無いこと"
    note: "理由の説明・既出内容の言い換え・記載していない操作への禁止・後から増えるものの個数"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-10
    name: "既存文章の維持"
    description: "規約 [既存文章の維持](id:convention-keep-existing-text) のとおり、意味が変わらない言い換えや不要な構造変更で差分を増やしていないこと"
    note: "最初の編集で記載し切れていれば差分は小さくなる"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-11
    name: "内容の重複"
    description: "同じ内容が他のページ・他のセクションに無いこと"
    note: "ある場合は参照 1 行への置き換えを求める"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-12
    name: "別案との比較"
    description: "採った案より良い案が無いことを確認していること"
    note: "別案を 1 つ以上自分で出して比較する"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-13
    name: "既存の修正で足りるか"
    description: "既存のものを修正すれば済むのに新規で作っていないこと"
    note: "似た役割のページ・関数・設定が既にあるかを探してから判断させる"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-14
    name: "共通化"
    description: "共通化できるものを共通化していること"
    note: "同じ処理・同じ記述が 2 箇所以上に現れていないかを確認する"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-15
    name: "暫定対応"
    description: "暫定対応・その場しのぎになっていないこと。他の変更で根本的に解決できないこと"
    note: "「いまは」「暫定的に」「後で修正する」と取れる箇所は、そのまま運用したときに何が起きるかを問う"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-16
    name: "項目が増えたときの修正箇所"
    description: "項目・分岐・ページが増えたときに修正する箇所が増え続けないこと"
    note: "増えるたびに複数箇所を修正する構造は指摘する"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-17
    name: "上流・他のページとの矛盾"
    description: "上流の記述・他のページ・同じページの別セクションと矛盾していないこと"
    note: "矛盾はどちらが正かを添えて指摘する"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-18
    name: "命名と中身の一致"
    description: "命名が中身と一致していること"
    note: "ページ名・見出し・型・関数・変数・ラベル、画面のボタン・リンクのアイコン・記号・文言、CLI のサブコマンド名・MCP ツール名が対象。対象と命名の意味が食い違えば指摘する。1 つの起点に性質の違う操作がぶら下がっていないかも確認する。同じ種類の既存のものと語彙・粒度が統一されているかも確認する。開発の現場で一般に使用する単語か・日本語にしたときに一般的な訳語か（造語・比喩で名付けていないか）も確認する"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-19
    name: "操作の起点の重複"
    description: "同じ遷移・同じ操作の起点が複数の場所に無いこと"
    note: "画面の導線に限らず、同じ処理への起点（CLI・MCP ツール 等）にも適用する。ある場合は、出る条件が排他（モバイル幅 / PC 幅 等）か、見えている起点への近道（キー操作 等）だと説明できなければ指摘する"
    tags:
      - name: target:共通
        main: true
    visibility: internal
  - id: aspect-review-common-20
    name: "変更量"
    description: "変更量が少ない方に倒せていること"
    note: "新規追加と既存箇所削除のどちらでも実現できる場合、既存箇所の削除側に倒せているか"
    tags:
      - name: target:共通
        main: true
    visibility: internal
