# yaml-language-server: $schema=../../schemas/checksheet.schema.yaml
id: checksheet-review-requirements
kind: checksheet
name: "要件のレビュー観点 チェックシート"
description: 依頼から整理した要件をレビューするときの観点を並べ、要件・影響範囲・スコープ外の整理をレビューするときに参照する。
aliases:
  - 要件定義のレビュー観点
tags:
  - name: scope:dev
  - name: topic:チェックシート
  - name: topic:観点
  - name: action:レビュー
  - name: topic:要件
    main: true
  - name: topic:スコープ
status: current
visibility: internal
rev: 1
related:
  - to: checksheet-review-common
    type: references
    when: 成果物の種類によらない共通の観点も確認するとき
items:
  - id: overview
    name: "概要"
    body: |-
      依頼から整理した要件をレビューするときの観点。
  - id: check-items-01
    group: チェック項目
    name: "チェック項目"
    body: |-
      <!-- table: data -->

      | 項目 | 補足 |
      | --- | --- |
      | 要望の本文にある要求が、要件かスコープ外のどちらかに入っていること | 取りこぼした要求を名指しで指摘する |
      | 要望が規約・テンプレートからの逸脱（または不具合）の是正のとき、同じ型の箇所が、要件かスコープ外のどちらかに記載されていること | リポジトリ全体から同じ型の箇所を探し、記載されていない箇所をパスと逸脱している規約つきで指摘する |
      | 本文に記載されていない要件を追加していないこと | 追加する場合は確認事項として出させる |
      | 既存の Issue / PR と重複する作業になっていないこと | 重複していれば既存の作業に統一する案を出す |
      | 影響するユースケースの影響有無が、現状のシナリオと突き合わせて決まっていること | 影響なしと記載したユースケースが本当に変わらないかを確認する |
      | 配布物の入れ方・起動に影響するファイルを変える変更で、利用者の入れ方で入れて起動する単一ユースケースが、影響するユースケースに挙がっていること | - |
      | 更新するドキュメントの洗い出しが要望・影響するユースケースと突き合わせて完了していること | 更新が要るのに挙がっていないページを名指しで指摘する |
      | 更新するドキュメントの各行が、実在するページか新規作成の行のどちらかになっていること | 実在しないのに新規作成と記載されていない行を名指しで指摘する |
      | スコープ外が明示され、担当外の要求を抱え込んでいないこと | - |

      <!-- /table -->
