# yaml-language-server: $schema=../../schemas/checksheet.schema.yaml
id: checksheet-review-single-uc-scenario
kind: checksheet
name: "単一ユースケースのシナリオのレビュー観点 チェックシート"
description: 単一ユースケースのシナリオをレビューするときの観点を並べ、単一ユースケースのシナリオをレビューするときに参照する。
aliases:
  - 単一 UC シナリオのレビュー観点
tags:
  - name: scope:dev
  - name: topic:チェックシート
  - name: topic:観点
  - name: action:レビュー
  - name: topic:シナリオ
    main: true
  - name: topic:ユースケース
status: current
visibility: internal
rev: 2
related:
  - to: checksheet-review-common
    type: references
    when: 成果物の種類によらない共通の観点も確認するとき
  - to: template-scenario
    type: references
    when: シナリオの書式を確認するとき
  - to: flowchart-scenario
    type: references
    when: シナリオの粒度を確認するとき
items:
  - id: overview
    name: 概要
    body: 単一ユースケースのシナリオをレビューするときの観点。
aspects:
  - id: aspect-review-single-uc-scenario-01
    name: サブシステム境界の participant
    description: 図がサブシステム境界を participant として記載されていること
    note: 内部モジュールを participant にしていないか
    tags:
      - name: target:単一 UC シナリオ
        main: true
      - name: process:単一ユースケース設計
    visibility: internal
  - id: aspect-review-single-uc-scenario-02
    name: 業務的に意味のある異常シナリオ
    description: 異常シナリオが業務的に意味のあるものに絞られていること
    note: 個別 API のバリデーションはインターフェース定義の領分
    tags:
      - name: target:単一 UC シナリオ
        main: true
      - name: process:単一ユースケース設計
    visibility: internal
  - id: aspect-review-single-uc-scenario-03
    name: 分岐を誘発するセットアップ
    description: セットアップに分岐を決定的に誘発する値が仕込まれていること
    tags:
      - name: target:単一 UC シナリオ
        main: true
      - name: process:単一ユースケース設計
    visibility: internal
  - id: aspect-review-single-uc-scenario-04
    name: アサートに落ちる期待値
    description: 期待値がテストのアサートにそのまま落ちる粒度になっていること
    tags:
      - name: target:単一 UC シナリオ
        main: true
      - name: process:単一ユースケース設計
    visibility: internal
  - id: aspect-review-single-uc-scenario-05
    name: 1 動詞句の粒度
    description: 粒度が「{対象}を{動詞}する」の 1 動詞句で表せること
    note: 判定フローチャート [シナリオ](id:flowchart-scenario)
    tags:
      - name: target:単一 UC シナリオ
        main: true
      - name: process:単一ユースケース設計
    visibility: internal
  - id: aspect-review-single-uc-scenario-06
    name: 既存の単一ユースケースとの重複
    description: 既存の単一ユースケースがあるのに同じ操作を新規で作っていないこと
    note: 既存シナリオの一覧と突き合わせる
    tags:
      - name: target:単一 UC シナリオ
        main: true
      - name: process:単一ユースケース設計
    visibility: internal
  - id: aspect-review-single-uc-scenario-07
    name: 重複部分の Mock
    description: 他のシナリオで既に確認している重複部分が Mock に置き換えられていること
    note: セットアップの Mock 行で宣言させる
    tags:
      - name: target:単一 UC シナリオ
        main: true
      - name: process:単一ユースケース設計
    visibility: internal
