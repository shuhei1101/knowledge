# yaml-language-server: $schema=../../schemas/checksheet.schema.yaml
id: checksheet-design-change-impact
kind: checksheet
name: 設計変更影響調査 チェックシート
description: 設計変更（機能の追加・方式の変更・廃止）の反映が全ての影響範囲に行き渡り、使用されない設計が残っていないかを確認し、設計を変える作業の着手前と完了時に参照する。
aliases:
  - 設計変更影響調査
tags:
  - name: scope:dev
  - name: topic:チェックシート
  - name: topic:設計書
    main: true
  - name: topic:差分
  - name: topic:シナリオ
  - name: topic:規約
  - name: topic:用語
  - name: action:検査
  - name: action:削除
  - name: action:反映
  - name: action:設計
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      設計変更（機能の追加・方式の変更・廃止）の反映が全ての影響範囲に行き渡り、使用されない設計が残っていないかを確認するシート。
      項目は実行の順で、前半（判定の一覧の作成まで）は修正の着手前に、後半は修正の完了時に確認する。
  - id: check-items-01
    group: チェック項目
    name: チェック項目
    body: |-
      <!-- table: data -->

      | 項目 | 補足 |
      | --- | --- |
      | 変更する概念を 1 文で言語化していること | 例: 「イベント → セッションの解決の方式を台帳の照合に変える」 |
      | その概念に触れる全ての要素を検索で列挙していること | 論理名と物理名の両方で検索する |
      | 列挙した各要素に 維持 / 修正 / 廃止 を判定した一覧を作っていること | 複数の作業に分けて反映する場合は、この一覧を先に提示してから着手する |
      | 「廃止」と判定した要素を削除していること | 使用されない設計を残さない（履歴は git log に任せる） |
      | 同じ質問に回答する仕組みが 2 つ残っていないこと | 旧方式と新方式の併存・責務の重複が無いことを確認する |
      | 上流 → 下流の全てのレイヤーに反映していること | シナリオ → インターフェース定義 → モジュール構成 →（テンプレート・規約・CLAUDE.md） |
      | 共通の規約（言語・テスト・ツール）と矛盾していないこと | 一般の決まりに触れた場合は、該当する規約も同じ作業で修正する |

      <!-- /table -->
  - id: docs-by-change-01
    group: 変更の種類ごとに修正する資料
    name: 変更の種類ごとに修正する資料
    body: |-
      変更の種類の行を選び、その行の資料が影響範囲の洗い出しに入っているかを確認する。
      複数の種類に当たる変更は、当たる行を全て選ぶ。

      <!-- table: data -->

      | 変更の種類 | 修正する資料 |
      | --- | --- |
      | 業務フロー（ユースケースの連鎖）の変更 | 複合ユースケースのシナリオ・連鎖に含まれる単一ユースケースのシナリオ |
      | ユーザーの操作の追加・変更 | 単一ユースケースのシナリオ・画面設計・画面一覧と画面遷移・利用者向けの使い方 |
      | サブシステムの外部インターフェース（API・ツール・コマンド）の追加・変更 | インターフェース定義・利用者向けのリファレンス・そのインターフェースを呼ぶ手順と規約 |
      | クラス・関数の構成の変更 | モジュール構成 |
      | 画面の部品の追加・変更 | 部品設計・Storybook のストーリー |
      | データストアの構造の変更 | ER 図・データフロー・既存のデータの移行の作業 |
      | 状態・遷移の追加・変更 | 状態遷移 |
      | 設定値・環境変数の追加・変更 | 設定の設計書・セットアップの手順 |
      | 外部ライブラリ・外部 API の採用・バージョンの変更 | 外部ライブラリ・外部 API の設計書・開発コマンド |
      | 開発で使うコマンドの変更 | 開発コマンド・テスト実行方法 |
      | 配布物の入れ方・起動に影響するファイルの変更 | 利用者の入れ方で入れて起動する単一ユースケースのシナリオ |
      | 規約・手順・テンプレートの変更 | 同じ型の記述を持つ他の規約・手順・テンプレートと、それを参照する手順 |
      | 用語・名前の変更 | 用語集・その単語を使用する全てのページ |

      <!-- /table -->
