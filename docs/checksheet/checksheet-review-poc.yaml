# yaml-language-server: $schema=../../schemas/checksheet.schema.yaml
id: checksheet-review-poc
kind: checksheet
name: "PoC の方針・結果のレビュー観点 チェックシート"
description: PoC の方針と結果をレビューするときの観点を並べ、PoC の方針や結果をレビューするときに参照する。
aliases:
  - PoC のレビュー観点
tags:
  - name: scope:dev
  - name: topic:チェックシート
  - name: topic:観点
  - name: action:レビュー
  - name: topic:poc
    main: true
  - name: topic:リスク
status: current
visibility: internal
rev: 2
related:
  - to: checksheet-review-common
    type: references
    when: 成果物の種類によらない共通の観点も確認するとき
  - to: decision-table-poc
    type: references
    when: PoC を実施する条件を確認するとき
items:
  - id: overview
    name: 概要
    body: PoC の方針と結果をレビューするときの観点。
aspects:
  - id: aspect-review-poc-01
    name: リスク仮説の核心
    description: リスク仮説が、成立しなければ要件が成り立たない核心に該当していること
    note: 確認しなくても分かることを検証対象にしていないか
    tags:
      - name: target:PoC
        main: true
      - name: process:PoC 検証
    visibility: internal
  - id: aspect-review-poc-02
    name: 測定できる成功条件
    description: 成功条件が測定できる値か状態で記載されていること
    note: 数値か、観測できる状態で記載させる
    tags:
      - name: target:PoC
        main: true
      - name: process:PoC 検証
    visibility: internal
  - id: aspect-review-poc-03
    name: 本番の構成との違い
    description: 検証構成が本番の構成と違う点を明示していること
    note: 違いが結論に影響するかまで記載させる
    tags:
      - name: target:PoC
        main: true
      - name: process:PoC 検証
    visibility: internal
  - id: aspect-review-poc-04
    name: 検証結果と成功条件の突き合わせ
    description: 検証結果が仮説に回答しており、成功条件と突き合わせてあること
    note: 実行ログか再現コードが添えてある
    tags:
      - name: target:PoC
        main: true
      - name: process:PoC 検証
    visibility: internal
  - id: aspect-review-poc-05
    name: 不成立のときの代替案
    description: 不成立のときの代替案が、検証で得た事実から出ていること
    tags:
      - name: target:PoC
        main: true
      - name: process:PoC 検証
    visibility: internal
