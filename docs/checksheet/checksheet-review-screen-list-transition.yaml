# yaml-language-server: $schema=../../schemas/checksheet.schema.yaml
id: checksheet-review-screen-list-transition
kind: checksheet
name: "画面一覧・画面遷移のレビュー観点 チェックシート"
description: 画面一覧と画面遷移をレビューするときの観点を並べ、画面一覧と画面遷移をレビューするときに参照する。
aliases:
  - 画面一覧のレビュー観点
  - 画面遷移のレビュー観点
tags:
  - name: scope:dev
  - name: topic:チェックシート
  - name: topic:観点
  - name: action:レビュー
  - name: topic:画面
    main: true
  - name: topic:ナビゲーション
  - name: scope:ui
status: current
visibility: internal
rev: 2
related:
  - to: checksheet-review-common
    type: references
    when: 成果物の種類によらない共通の観点も確認するとき
  - to: ui-screen-division
    type: references
    when: 画面の分け方と遷移の判定を確認するとき
items:
  - id: overview
    name: 概要
    body: 画面一覧と画面遷移をレビューするときの観点。
aspects:
  - id: aspect-review-screen-list-transition-01
    name: 単一ユースケースの操作の収容
    description: 画面一覧が単一ユースケースの操作を全て収容していること
    note: どの操作がどの画面で行われるかを対応づける
    tags:
      - name: target:画面一覧
        main: true
      - name: process:画面一覧・画面遷移
    visibility: internal
  - id: aspect-review-screen-list-transition-02
    name: 画面遷移の行き止まり
    description: 画面遷移に行き止まりが無いこと
    note: 戻れない・進めない経路を探す
    tags:
      - name: target:画面一覧
        main: true
      - name: target:画面遷移
      - name: process:画面一覧・画面遷移
    visibility: internal
  - id: aspect-review-screen-list-transition-03
    name: 既存画面で足りる新規画面
    description: 既存画面で足りるものを新規画面として作っていないこと
    tags:
      - name: target:画面一覧
        main: true
      - name: process:画面一覧・画面遷移
    visibility: internal
  - id: aspect-review-screen-list-transition-04
    name: 同じ役割の要素の作り分け
    description: 同じ役割の要素を画面ごとに作り分けていないこと
    note: 規約 [共通コンポーネント規約](id:convention-common-components)
    tags:
      - name: target:画面一覧
        main: true
      - name: process:画面一覧・画面遷移
    visibility: internal
  - id: aspect-review-screen-list-transition-05
    name: 画面の分け方と遷移の判定
    description: 画面の分け方と遷移が規約 [画面の分け方](id:ui-screen-division) の判定のとおりであること
    note: 判定が分かれた箇所は、未確定の論点として残っているか、画面一覧の補足に根拠があるかを確認する
    tags:
      - name: target:画面一覧
        main: true
      - name: target:画面遷移
      - name: process:画面一覧・画面遷移
    visibility: internal
