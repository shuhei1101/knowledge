# yaml-language-server: $schema=../../schemas/checksheet.schema.yaml
id: checksheet-review-component
kind: checksheet
name: 部品設計のレビュー観点 チェックシート
description: 部品設計の設計書をレビューするときの観点を並べ、部品設計をレビューするときに参照する。
aliases:
  - 部品設計のレビュー観点
status: current
visibility: internal
rev: 2
related:
  - to: checksheet-review-common
    type: references
    when: 成果物の種類によらない共通の観点も確認するとき
  - to: template-component
    type: references
    when: 部品設計の書式を確認するとき
  - to: html-core-buildless
    type: references
    when: ブラウザのスクリプトの拡張子を確認するとき
items:
  - id: overview
    name: 概要
    body: 部品設計の設計書をレビューするときの観点。
tags:
  - name: scope:dev
  - name: topic:チェックシート
  - name: topic:観点
  - name: action:レビュー
  - name: topic:部品
    main: true
  - name: topic:設計書
aspects:
  - id: aspect-review-component-01
    name: ブラウザのスクリプトの拡張子
    description: '`implementation` がブラウザのスクリプトを指すとき、`.ts`（`.tsx`）のファイルを指し、`.js` を手書きする設計になっていないこと'
    note: '`.js` で記載してよいのは [js で記載してよい場合](id:html-core-buildless#script-extension-02) だけ。HTML に直接記載する `<script>` の処理も `.ts` へ分けているかを確認する（[HTML に直接記載する script](id:html-core-buildless#script-extension-04)）'
    tags:
      - name: target:部品設計
        main: true
      - name: process:部品設計
    visibility: internal
  - id: aspect-review-component-02
    name: 保存する状態・画面の幅・アクセシビリティ
    description: 部品が自分で保存する状態（幅・開閉 等）を `persisted_state` に記載し、狭い幅で出し方が変わる部品は `viewport` が `mobile` の状態を持ち、アイコンだけの形状を持つ部品は `accessibility.accessible_name_arg` が読み上げ名を受け取る引数を指していること
    tags:
      - name: target:部品設計
        main: true
      - name: process:部品設計
    visibility: internal
