# yaml-language-server: $schema=../../schemas/checksheet.schema.yaml
id: checksheet-review-related-docs
kind: checksheet
name: "関連ドキュメントの修正のレビュー観点 チェックシート"
description: 決定を関連ドキュメントへ反映した修正をレビューするときの観点を並べ、関連ドキュメントの修正をレビューするときに参照する。
aliases:
  - 関連ドキュメントのレビュー観点
tags:
  - name: scope:dev
  - name: topic:チェックシート
  - name: topic:観点
  - name: action:レビュー
  - name: topic:文書
    main: true
  - name: action:反映
status: current
visibility: internal
rev: 2
related:
  - to: checksheet-review-common
    type: references
    when: 成果物の種類によらない共通の観点も確認するとき
  - to: checksheet-design-change-impact
    type: references
    when: 設計変更の影響範囲を洗い出すとき
items:
  - id: overview
    name: 概要
    body: 決定を関連ドキュメントへ反映した修正をレビューするときの観点。
aspects:
  - id: aspect-review-related-docs-01
    name: 決定内容との一致
    description: 反映元の決定内容と、更新後の記述が一致していること
    note: 決定の経緯のコメントと突き合わせる
    tags:
      - name: target:関連ドキュメント
        main: true
      - name: target:手順書
      - name: target:規約
      - name: target:テンプレート
      - name: process:ドキュメント修正
    visibility: internal
  - id: aspect-review-related-docs-02
    name: 原本への反映
    description: 反映先が原本のページになっていること
    note: コピーを修正していないか
    tags:
      - name: target:関連ドキュメント
        main: true
      - name: target:手順書
      - name: target:規約
      - name: target:テンプレート
      - name: process:ドキュメント修正
    visibility: internal
  - id: aspect-review-related-docs-03
    name: 同じ内容を持つページの反映漏れ
    description: 同じ内容を持つ他のページに反映漏れが無いこと
    tags:
      - name: target:関連ドキュメント
        main: true
      - name: target:手順書
      - name: target:規約
      - name: target:テンプレート
      - name: process:ドキュメント修正
    visibility: internal
  - id: aspect-review-related-docs-04
    name: 関係ない記述の書き換え
    description: 反映のついでに関係ない記述を書き換えていないこと
    note: 規約 [既存文章の維持](id:convention-keep-existing-text)
    tags:
      - name: target:関連ドキュメント
        main: true
      - name: target:手順書
      - name: target:規約
      - name: target:テンプレート
      - name: process:ドキュメント修正
    visibility: internal
