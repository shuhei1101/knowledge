# yaml-language-server: $schema=../../schemas/flowchart.schema.yaml
id: flowchart-timeout
kind: flowchart
name: タイムアウトの決め方 判定フローチャート
description: 下流・外部・自分の処理を待つ箇所に、タイムアウトを配置するかと、実測・公開仕様・実測の 10 倍・無出力の時間のどれで値を決めるかを判定し、タイムアウトの値を決めるときに参照する。
aliases:
  - タイムアウトの決め方
status: current
visibility: internal
rev: 2
items:
  - id: overview
    name: 概要
    body: |-
      下流・外部・自分の処理を待つ箇所に、タイムアウトを配置するかと、実測・公開仕様・実測の 10 倍・無出力の時間のどれで値を決めるかを判定し、タイムアウトの値を決めるときに参照する。

      値の導き方と既定値は規約 [資源の値の決め方](id:dev-resource-values) に従う。
  - id: timeout-flow-01
    group: タイムアウトの決め方 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "タイムアウトの決め方"} -->

      ```mermaid
      flowchart TB
        start(("待つ箇所がある"))
        q1{"待つ相手がいるか"}
        r1(["タイムアウトを配置しない"])
        q2{"利用者・上流が応答を待つか"}
        q3{"実測が 1,000 回以上あるか"}
        r2(["実測の p99.9 + 50%"])
        r3(["公開仕様の値。計測の作業を残す"])
        q4{"自分の処理の完了を待つだけで、進み具合の出力があるか"}
        r4(["無出力の時間で止まったことを検知する"])
        r5(["実測の 10 倍か外側の作業の上限"])
        start --> q1
        q1 -->|NO| r1
        q1 -->|YES| q2
        q2 -->|YES| q3
        q3 -->|YES| r2
        q3 -->|NO| r3
        q2 -->|NO| q4
        q4 -->|YES| r4
        q4 -->|NO| r5
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["timeout-n1"]}, "q2": {"annotations": ["timeout-n2"]}, "q4": {"annotations": ["timeout-n3"]}, "r4": {"annotations": ["timeout-n4"]}, "r5": {"annotations": ["timeout-n5"]}}} -->

      <!-- /map -->

      ※[timeout-n1]: 待つ相手: 応答や完了を待つ処理・接続。
          常駐のワーカーの待ち受け・キューの受信のように、来るまで待つのが仕事の箇所は相手がいない

      ※[timeout-n2]: 利用者・上流が応答を待つ: 画面からの API・外部 API の呼び出し・MCP のツールの応答など、待たせすぎるとリトライやエラー表示に切り替えるべき箇所

      ※[timeout-n3]: 自分の処理の完了を待つだけ: 反映作業のスクリプト・管理の操作（`reload` など）・バッチ・CLI・テスト。
          タイムアウトの役目はハングの検知だけ

      ※[timeout-n4]: 無出力の時間: ログ・ハートビートが途絶えた時間で止まったと判定する。
          上限は出力の間隔の実測の 10 倍

      ※[timeout-n5]: 外側の作業の上限: 実測が無ければ、外側の作業（ジョブ・CI の上限など）の上限を使用する。
          内側のタイムアウトは外側より短くする
tags:
  - name: scope:判定フローチャート
  - name: topic:判定フローチャート
  - name: topic:フローチャート
  - name: topic:タイムアウト
    main: true
  - name: topic:待ち時間
