items:
  - id: overview
    name: 概要
    body: |-
      下流・外部・自分の処理を待つ箇所に、タイムアウトを置くかと、実測・公開仕様・実測の 10 倍・無出力の時間のどれで値を決めるかを判定し、タイムアウトの値を決めるときに読む。

      値の導き方と既定値は規約 [資源の値の決め方](id:dev-resource-values) に従う。
