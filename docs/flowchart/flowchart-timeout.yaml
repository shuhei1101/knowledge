  - id: timeout-flow-02
    group: タイムアウトの決め方 判定フローチャート
    name: ※1 待つ相手
    body: "- **※1 待つ相手**: 応答や完了を待つ処理・接続。\n  常駐のワーカーの待ち受け・キューの受信のように、来るまで待つのが仕事の箇所は相手がいない"
  - id: timeout-flow-03
    group: タイムアウトの決め方 判定フローチャート
    name: ※2 利用者・上流が応答を待つ
    body: '- **※2 利用者・上流が応答を待つ**: 画面からの API・外部 API の呼び出し・MCP のツールの応答など、待たせすぎるとリトライやエラー表示に切り替えるべき箇所'
  - id: timeout-flow-04
    group: タイムアウトの決め方 判定フローチャート
    name: ※3 自分の処理の完了を待つだけ
    body: "- **※3 自分の処理の完了を待つだけ**: 反映作業のスクリプト・管理の操作（`reload` など）・バッチ・CLI・テスト。\n  タイムアウトの役目はハングの検知だけ"
  - id: timeout-flow-05
    group: タイムアウトの決め方 判定フローチャート
    name: ※4 無出力の時間
    body: "- **※4 無出力の時間**: ログ・ハートビートが途絶えた時間で止まったと判定する。\n  上限は出力の間隔の実測の 10 倍"
  - id: timeout-flow-06
    group: タイムアウトの決め方 判定フローチャート
    name: ※5 外側の作業の上限
    body: "- **※5 外側の作業の上限**: 実測が無ければ、外側の作業（ジョブ・CI の上限など）の上限を使う。\n  内側のタイムアウトは外側より短くする"
