items:
  - id: overview
    name: 概要
    body: |-
      シナリオを既存の流用・既存の修正・新規の単一ユースケース・新規の複合ユースケースのどれで記載するかを判定し、シナリオを記載するときに参照する。
  - id: scenario-flow-01
    group: シナリオ 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "シナリオ"} -->

      ```mermaid
      flowchart TB
        start(("シナリオを記載したい"))
        q0{"既存のシナリオで既にカバーされているか"}
        use_exist(["既存のシナリオを流用し、新規に作らない"])
        q0b{"既存のシナリオを軽微に修正すれば足りるか"}
        edit_exist(["既存のシナリオを修正する"])
        q0a{"単一ユースケース 1 本（1 つの E2E）で足りるか"}
        new_single(["新規に単一ユースケースとして作る"])
        q1{"達成価値を 1 文で言えるか"}
        a1["複数の複合ユースケースに分ける"]
        q2{"主要フェーズが 4 以下か"}
        a2["前段を前提状態に入れるか、複数の複合ユースケースに分ける"]
        q3{"操作ノードが 10 前後に収まるか"}
        a3["詳細のノードを前提状態に入れるか、複数の複合ユースケースに分ける"]
        q4{"単体テスト・結合テスト・単一ユースケースの E2E では再現できないか"}
        a4["再現できる部分を下位のテストに移し、E2E の範囲を削る"]
        q5{"複数のロールか複数のエンティティが登場するか"}
        r2(["新規に複合ユースケース（単一価値シナリオ）として 1 本作る"])
        q5a{"その交差が価値の中核か、権限の境界の検証が目的か"}
        a5a["ロール・エンティティ別に複数の複合ユースケースに分ける"]
        r1(["新規に複合ユースケース（交差点シナリオ）として 1 本作る"])
        start --> q0
        q0 -->|YES| use_exist
        q0 -->|NO| q0b
        q0b -->|YES| edit_exist
        q0b -->|NO| q0a
        q0a -->|YES| new_single
        q0a -->|NO| q1
        q1 -->|NO| a1
        q1 -->|YES| q2
        q2 -->|NO| a2
        q2 -->|YES| q3
        q3 -->|NO| a3
        q3 -->|YES| q4
        q4 -->|NO| a4
        q4 -->|YES| q5
        q5 -->|NO| r2
        q5 -->|YES| q5a
        q5a -->|NO| a5a
        q5a -->|YES| r1
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["scenario-n1"]}, "q2": {"annotations": ["scenario-n2"]}, "a2": {"annotations": ["scenario-n3"]}, "q3": {"annotations": ["scenario-n4"]}, "r2": {"annotations": ["scenario-n5"]}, "r1": {"annotations": ["scenario-n6"]}}} -->

      <!-- /map -->

      ※[scenario-n1]: 達成価値: シナリオが実現するユーザーの体験の結果を 1 文で言える単位。
          例: シナリオ「新規ユーザーの登録から初回のタスクの作成」の達成価値は「新規ユーザーがサインアップ・ログインを終えて自分のタスクを 1 件作成できる」。
          「登録して」「編集して」「削除して」など動詞を複数つながないと表せない場合は、複数の価値になっている。

      ※[scenario-n2]: 主要フェーズ: シナリオを構成する大きな段階。
          フロー図のまとまりか、論理的なブロックの単位。
          例: 「ユーザー A がタスクを作成」「ユーザー B が編集」「ユーザー A が結果を確認」の 3 フェーズ。
          「サインアップ画面 → API の呼び出し → 結果画面」のような細かな画面の遷移は、1 フェーズの中の操作ノードにまとめる。

      ※[scenario-n3]: 前提状態: シナリオの開始の時点で既に成立していると仮定する状態。
          例: 「ユーザー A が既にログイン済み」「タスクが 1 件既に存在する」。
          フローの前段を前提状態に入れると、シナリオの本体を小さく保てる。

      ※[scenario-n4]: 操作ノード: フロー図の中の 1 個のボックス。
          ユーザーの 1 操作か、インターフェース定義 1 件に対応する粒度。
          「サインアップ画面へ」「フォームの送信」「登録の成功」などの 1 ステップ = 1 ノード。

      ※[scenario-n5]: 単一価値シナリオ: 1 ロール 1 エンティティで完結する、単純な業務の体験。

      ※[scenario-n6]: 交差点シナリオ: 複数のロール・複数のエンティティの交わり自体が価値になるシナリオ。
          例: ユーザー A のタスクをユーザー B が編集できるかの権限の境界。
