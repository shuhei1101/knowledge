      <!-- /flow -->
  - id: scenario-flow-02
    group: シナリオ 判定フローチャート
    name: ※1 達成価値
    body: |-
      - ※1 達成価値: シナリオが実現するユーザーの体験の結果を 1 文で言える単位。
        例: シナリオ「新規ユーザーの登録から初回のタスクの作成」の達成価値は「新規ユーザーがサインアップ・ログインを終えて自分のタスクを 1 件作成できる」。
        「登録して」「編集して」「削除して」など動詞を複数つながないと表せない場合は、複数の価値になっている
  - id: scenario-flow-03
    group: シナリオ 判定フローチャート
    name: ※2 主要フェーズ
    body: |-
      - ※2 主要フェーズ: シナリオを構成する大きな段階。
        フロー図のまとまりか、論理的なブロックの単位。
        例: 「ユーザー A がタスクを作成」「ユーザー B が編集」「ユーザー A が結果を確認」の 3 フェーズ。
        「サインアップ画面 → API の呼び出し → 結果画面」のような細かな画面の遷移は、1 フェーズの中の操作ノードにまとめる
  - id: scenario-flow-04
    group: シナリオ 判定フローチャート
    name: ※3 前提状態
    body: |-
      - ※3 前提状態: シナリオの開始の時点で既に成立していると仮定する状態。
        例: 「ユーザー A が既にログイン済み」「タスクが 1 件既に存在する」。
        フローの前段を前提状態に入れると、シナリオの本体を小さく保てる
  - id: scenario-flow-05
    group: シナリオ 判定フローチャート
    name: ※4 操作ノード
    body: |-
      - ※4 操作ノード: フロー図の中の 1 個のボックス。
        ユーザーの 1 操作か、インターフェース定義 1 件に対応する粒度。
        「サインアップ画面へ」「フォームの送信」「登録の成功」などの 1 ステップ = 1 ノード
  - id: scenario-flow-06
    group: シナリオ 判定フローチャート
    name: ※5 単一価値シナリオ
    body: |-
      - ※5 単一価値シナリオ: 1 ロール 1 エンティティで完結する、単純な業務の体験
  - id: scenario-flow-07
    group: シナリオ 判定フローチャート
    name: ※6 交差点シナリオ
    body: |-
      - ※6 交差点シナリオ: 複数のロール・複数のエンティティが交わること自体が価値になるシナリオ。
        例: ユーザー A のタスクをユーザー B が編集できるかの権限の境界
