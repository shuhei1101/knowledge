  - id: fallback-flow-02
    group: フォールバックを置くか 判定フローチャート
    name: ※1 開発中に気づくべき不具合
    body: "- ※1 開発中に気づくべき不具合: 設定・ファイルの読み込みの失敗、必須の値の欠落、型・プログラムの誤り。\n  フォールバックすると開発中に気づけない（[フォールバック値を設けない](id:dev-coding-general#fallback-01)）"
  - id: fallback-flow-03
    group: フォールバックを置くか 判定フローチャート
    name: ※2 外部の一時障害
    body: "- ※2 外部の一時障害: ネットワークの切断、外部 API の 429・5xx、タイムアウト。\n  本番で実際に起きうるものに限る"
  - id: fallback-flow-04
    group: フォールバックを置くか 判定フローチャート
    name: ※3 仕様として等価
    body: "- ※3 仕様として等価: 代わりの値・経路でも、利用者から見た結果が仕様を満たすもの（例: LLM のプロバイダの切り替え、キャッシュの読み出しの失敗で正本から読む）。\n  「前の結果を使う」「空を返す」は等価ではない"
  - id: fallback-flow-05
    group: フォールバックを置くか 判定フローチャート
    name: ※4 リトライ
    body: "- ※4 リトライ: 回数と間隔を明示し、尽きたらエラーにする。\n  リトライしたことをログに残す。\n  回数と間隔は規約 [資源の値の決め方](id:dev-resource-values) で導く"
  - id: fallback-flow-06
    group: フォールバックを置くか 判定フローチャート
    name: ※5 置き方
    body: "- ※5 置き方: 切り替えたことを WARNING 以上でログに残し、回数を計測する。\n  切り替えが続いたら気づけるようにする"
