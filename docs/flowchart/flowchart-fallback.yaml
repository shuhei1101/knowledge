# yaml-language-server: $schema=../../schemas/flowchart.schema.yaml
id: flowchart-fallback
kind: flowchart
name: フォールバックを置くか 判定フローチャート
description: 失敗しうる処理に、フォールバックを配置するか、リトライだけ配置するか、配置せずにエラーにするかを判定し、失敗したときに代わりの値・経路を使用するかを決めるときに参照する。
aliases:
  - フォールバックを置くか
status: current
visibility: internal
rev: 2
items:
  - id: overview
    name: 概要
    body: 失敗しうる処理へのフォールバックの配置・リトライだけの配置・エラーにするかを判定し、失敗したときに代わりの値・経路を使用するかを決めるときに参照する。
  - id: fallback-flow-01
    group: フォールバックを置くか 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "フォールバックを置くか"} -->

      ```mermaid
      flowchart TB
        start(("失敗しうる処理がある"))
        q1{"開発中に気づくべき不具合か"}
        r1(["配置しない。エラーにする"])
        q2{"本番で起きうる外部の一時障害か"}
        r2(["配置しない。起きない失敗に備えない"])
        q3{"代わりが仕様として等価か"}
        r3(["リトライだけ配置し、尽きたらエラー"])
        r4(["フォールバックを配置する"])
        start --> q1
        q1 -->|YES| r1
        q1 -->|NO| q2
        q2 -->|NO| r2
        q2 -->|YES| q3
        q3 -->|NO| r3
        q3 -->|YES| r4
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["fallback-n1"]}, "q2": {"annotations": ["fallback-n2"]}, "q3": {"annotations": ["fallback-n3"]}, "r3": {"annotations": ["fallback-n4"]}, "r4": {"annotations": ["fallback-n5"]}}} -->

      <!-- /map -->

      ※[fallback-n1]: 開発中に気づくべき不具合: 設定・ファイルの読み込みの失敗、必須の値の欠落、型・プログラムの誤り。
          フォールバックすると開発中に気づけない（[フォールバック値を設けない](id:dev-coding-general#fallback-01)）。

      ※[fallback-n2]: 外部の一時障害: ネットワークの切断、外部 API の 429・5xx、タイムアウト。
          本番で実際に起きうるものに限る。

      ※[fallback-n3]: 仕様として等価: 代わりの値・経路でも、利用者にとっての結果が仕様を満たすもの（例: LLM のプロバイダの切り替え、キャッシュの読み出しの失敗で原本から読み込む）。
          「前の結果を使用する」と「空を返却する」は等価でない。

      ※[fallback-n4]: リトライ: 回数と間隔を明示し、尽きたらエラーにする。
          リトライしたことをログに残す。
          回数と間隔は規約 [資源の値の決め方](id:dev-resource-values) で導く。

      ※[fallback-n5]: 配置の方法: 切り替えたことを WARNING 以上でログに残し、回数を計測する。
          切り替えが続いたら気づけるようにする。
tags:
  - name: scope:判定フローチャート
  - name: topic:判定フローチャート
  - name: topic:フローチャート
  - name: topic:フォールバック
    main: true
  - name: topic:リトライ
  - name: topic:エラー
  - name: topic:ログ
  - name: action:判定
