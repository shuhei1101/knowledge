      <!-- /flow -->
  - id: log-level-flow-02
    group: ログを出すか・どのレベルか 判定フローチャート
    name: ※1 行動・調査・集計に使用する
    body: '- ※1 行動・調査・集計に使用する: 規約 [ログのレベルと記載方法](id:dev-logging#viewpoint-01) の観点（本番障害・外部連携・お金・セキュリティ・監査・データ整合・性能・監視の経路）のどれかに当てはまる'
  - id: log-level-flow-03
    group: ログを出すか・どのレベルか 判定フローチャート
    name: ※2 呼び出し元が記録する例外
    body: '- ※2 呼び出し元が記録する例外: 呼び出し元へ再送出する例外と、エラー応答を返却するために送出する例外（FastAPI の `HTTPException` など）'
  - id: log-level-flow-04
    group: ログを出すか・どのレベルか 判定フローチャート
    name: ※3 吸収した
    body: '- ※3 吸収した: リトライ・代わりの手段・既定値で結果を出せた'
