id: flowchart-log-level
kind: flowchart
name: ログを出すか・どのレベルか 判定フローチャート
description: 出来事をログに出すかと、FATAL・ERROR・WARN・INFO のどのレベルで出すかを判定し、ログを出すコードを記載・レビューするときに参照する。
aliases:
  - ログを出すか・どのレベルか
status: current
visibility: internal
rev: 1
related:
  - to: dev-logging
    type: references
    when: レベルの定義と観点ごとに出すログを確認するとき
items:
  - id: overview
    name: 概要
    body: |-
      出来事をログに出すかと、FATAL・ERROR・WARN・INFO のどのレベルで出すかを判定し、ログを出すコードを記載・レビューするときに参照する。

      レベルの定義と観点ごとの例は規約 [ログのレベルと記載方法](id:dev-logging) に従う。
  - id: log-level-flow-01
    group: ログを出すか・どのレベルか 判定フローチャート
