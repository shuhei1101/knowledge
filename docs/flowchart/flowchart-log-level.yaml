items:
  - id: overview
    name: 概要
    body: |-
      出来事をログに出すかと、FATAL・ERROR・WARN・INFO のどのレベルで出すかを判定し、ログを出すコードを記載・レビューするときに参照する。

      レベルの定義と観点ごとの例は規約 [ログのレベルと記載方法](id:dev-logging) に従う。
  - id: log-level-flow-01
    group: ログを出すか・どのレベルか 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "ログを出すか・どのレベルか"} -->

      ```mermaid
      flowchart TB
        start(("ログに出すか迷う出来事がある"))
        q1{"後で人や監視が行動・調査・集計に使用するか"}
        r0(["出さない（開発時の調査なら DEBUG）"])
        q2{"呼び出し元が同じ例外を記録するか"}
        r1(["ここでは出さない"])
        q3{"プロセスやシステムが処理を続けられないか"}
        r2(["FATAL"])
        q4{"今の処理が目的の結果を出せずに終わったか"}
        r3(["ERROR"])
        q5{"異常を吸収したか、放っておくと問題になる予兆か"}
        r4(["WARN"])
        r5(["INFO"])
        start --> q1
        q1 -->|NO| r0
        q1 -->|YES| q2
        q2 -->|YES| r1
        q2 -->|NO| q3
        q3 -->|YES| r2
        q3 -->|NO| q4
        q4 -->|YES| r3
        q4 -->|NO| q5
        q5 -->|YES| r4
        q5 -->|NO| r5
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["log-level-n1"]}, "q2": {"annotations": ["log-level-n2"]}, "q5": {"annotations": ["log-level-n3"]}}} -->

      <!-- /map -->

      ※[log-level-n1]: 行動・調査・集計に使用する: 規約 [ログのレベルと記載方法](id:dev-logging#viewpoint-01) の観点（本番障害・外部連携・お金・セキュリティ・監査・データ整合・性能・監視の経路）のどれかに当てはまる

      ※[log-level-n2]: 呼び出し元が記録する例外: 呼び出し元へ再送出する例外と、エラー応答を返却するために送出する例外（FastAPI の `HTTPException` など）

      ※[log-level-n3]: 吸収した: リトライ・代わりの手段・既定値で結果を出せた
