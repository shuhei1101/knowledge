items:
  - id: overview
    name: 概要
    body: |-
      エージェントに指定する文・処理を、SessionStart のフック・MCP の instructions・ツールでの取得のどれに配置するかを判定する。
      機能を呼ぶインターフェースと、複数の工程を順に進める手順の指定方法は、判定フローチャート [機能を呼ぶインターフェースの選び方](id:flowchart-interface-choice) で決める。
  - id: session-context-placement-flow-01
    group: エージェントに渡す文・処理の置き場所 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "エージェントに渡す文・処理の置き場所"} -->

      ```mermaid
      flowchart TB
        start(("エージェントに指定する文・処理がある"))
        q1{"処理を実行するか"}
        r1(["SessionStart のフック"])
        q2{"セッションごとに変わる事実か"}
        r2(["ツールで取得させる（SessionStart で注入しない）"])
        q3{"そのプラグインが MCP を持つか"}
        r3(["MCP の instructions"])
        r4(["SessionStart で注入する"])
        start --> q1
        q1 -->|YES| r1
        q1 -->|NO| q2
        q2 -->|YES| r2
        q2 -->|NO| q3
        q3 -->|YES| r3
        q3 -->|NO| r4
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["session-context-placement-n1"]}, "q2": {"annotations": ["session-context-placement-n2"]}, "r4": {"annotations": ["session-context-placement-n3"]}}} -->

      <!-- /map -->

      ※[session-context-placement-n1]: 処理: 常駐のサーバーの起動・環境変数の設定・記録の後片付けなど、文を指定するのではなく実行するもの。
          instructions は文を指定するだけで、処理を実行できない

      ※[session-context-placement-n2]: セッションごとに変わる事実: 作業場所から使用できる配信元など、起動した場所や時点で変わるもの

      ※[session-context-placement-n3]: SessionStart で注入するもの: MCP を持たないプラグインの常に守る決まり。
          instructions を記載するサーバーが無い