      <!-- /flow -->
  - id: session-context-placement-flow-02
    group: エージェントに渡す文・処理の置き場所 判定フローチャート
    name: ※1 処理
    body: |-
      - ※1 処理: 常駐のサーバーの起動・環境変数の設定・記録の後片付けなど、文を渡すのではなく実行するもの。
        instructions は文を渡すだけで、処理を実行できない
  - id: session-context-placement-flow-03
    group: エージェントに渡す文・処理の置き場所 判定フローチャート
    name: ※2 セッションごとに変わる事実
    body: |-
      - ※2 セッションごとに変わる事実: 作業場所から使える配信元など、起動した場所や時点で変わるもの
  - id: session-context-placement-flow-04
    group: エージェントに渡す文・処理の置き場所 判定フローチャート
    name: ※3 SessionStart で注入するもの
    body: |-
      - ※3 SessionStart で注入するもの: MCP を持たないプラグインの常に守る決まり。
        instructions を載せるサーバーが無い
