# yaml-language-server: $schema=../../schemas/flowchart.schema.yaml
id: flowchart-tag-attach
kind: flowchart
name: タグの付与 判定フローチャート
description: 文書に出てくる単語を、タグとして付けるか、使用されているタグを再利用するか、新しく付けるか、広いタグと main も付けるかを判定し、文書にタグを付けるときに参照する。
aliases:
  - タグの付与
tags:
  - name: scope:判定フローチャート
  - name: topic:タグ
    main: true
  - name: topic:フロー
  - name: topic:フローチャート
  - name: topic:判定フローチャート
  - name: topic:文書
  - name: action:付与
  - name: action:判定
status: current
visibility: internal
rev: 6
items:
  - id: overview
    name: 概要
    body: |-
      文書に出てくる単語について、タグにする・使用されているタグを再利用する・新しく付ける・広いタグと main も付けるのどれにするかを判定する。
  - id: tag-attach-flow-01
    group: タグの付与 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "タグの付与"} -->

      ```mermaid
      flowchart TB
        start(("文書にタグを付けたい"))
        a1["使用されているタグを件数つきで検索する"]
        a2["ファイルの種類ごとの範囲から単語を書き出す"]
        q1{"その単語で探した人に、この文書が出てほしいか"}
        r1(["この単語のタグは付けない"])
        q2{"評価・状態の単語か、status など別のキーで表せるか"}
        r1_2(["この単語のタグは付けない"])
        q3{"行為の単語か"}
        a3["名詞形にして action: にする"]
        q4{"これ以上分けられない単語か（単語 1 つ、または一語として定着した複合語）"}
        a5["単語に分け、分けた単語ごとに Q1 から判定する"]
        a4["道具の公式の名前なら tool:、それ以外は topic: にする。複合語なら構成語も書き出しに加える"]
        q5{"使用されているタグに、同じ概念の言い方・活用の違いのものがあるか"}
        a7["新しいタグを付け、同じ話題の既存の文書にもさかのぼって付ける"]
        a6["使用されているタグを付ける"]
        q6{"上位の広いタグがあるか"}
        a8["広いタグも付ける"]
        q7{"最も分量の多い主題か"}
        r2(["main を付ける"])
        r3(["main は付けない"])
        start --> a1
        a1 --> a2
        a2 --> q1
        q1 -->|NO| r1
        q1 -->|YES| q2
        q2 -->|NO| q3
        q2 -->|YES| r1_2
        q3 -->|YES| a3
        q3 -->|NO| q4
        q4 -->|YES| a4
        q4 -->|NO| a5
        a3 --> q5
        a4 --> q5
        q5 -->|YES| a6
        q5 -->|NO| a7
        a6 --> q6
        a7 --> q6
        q6 -->|YES| a8
        q6 -->|NO| q7
        a8 --> q7
        q7 -->|YES| r2
        q7 -->|NO| r3
      ```

      <!-- map-data: {"version": 1, "notes": {"a2": {"annotations": ["tag-attach-n1"]}, "q4": {"annotations": ["tag-attach-n2"]}}} -->

      <!-- /map -->

      ※[tag-attach-n1]: 書き出す範囲: 規約 [タグと用語の登録](id:dev-tag-term-registration) のファイルの種類ごとの表のとおり。
          見出しの識別子（関数名・ファイル名）は、概念の単語にしてから書き出す。
          ソースコードは行為の単語を書き出さない（付けるファセットは表のとおり `topic:`・`tool:` だけ）。

      ※[tag-attach-n2]: 一語として定着した複合語: 第一の基準は用語集にあるか。
          用語集に無いときは、分けると意味が変わる、または分けると関係ない文書がヒットするか。
