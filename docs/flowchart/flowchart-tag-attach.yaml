# yaml-language-server: $schema=../../schemas/flowchart.schema.yaml
id: flowchart-tag-attach
kind: flowchart
name: タグの付与 判定フローチャート
description: 文書に出てくる語を、タグとして付けるか、使われているタグを使い回すか、新しく付けるか、広いタグと main も付けるかを判定し、文書にタグを付けるときに参照する。
aliases:
  - タグの付与
tags:
  - name: scope:判定フローチャート
  - name: topic:タグ
    main: true
  - name: topic:フロー
  - name: topic:フローチャート
  - name: topic:判定フローチャート
  - name: topic:文書
  - name: action:付与
  - name: action:判定
status: current
visibility: internal
rev: 5
items:
  - id: overview
    name: 概要
    body: |-
      文書に出てくる単語について、タグにする・使用されているタグを使い回す・新しく付ける・広いタグと main も付けるのどれにするかを判定する。
