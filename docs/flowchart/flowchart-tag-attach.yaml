# yaml-language-server: $schema=../../schemas/flowchart.schema.yaml
id: flowchart-tag-attach
kind: flowchart
name: タグの付与 判定フローチャート
description: 文書に出てくる語を、タグとして付けるか、使われているタグを使い回すか、新しく付けるか、広いタグと main も付けるかを判定
tags:
  - name: scope:判定フローチャート
    main: true
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      文書に出てくる語を、タグとして付けるか、使われているタグを使い回すか、新しく付けるか、広いタグと main も付けるかを判定
  - id: tag-attach-flow-01
    group: タグの付与 判定フローチャート
    name: 判定フロー
    body: |-
      ```mermaid
      flowchart TD
        START([文書にタグを付けたい])
        A1([使われているタグを件数つきで引く ※1])
        A2([本文に出る概念・話題・道具を書き出す])
        Q1{その語で探した人に、この文書が出てほしいか?}
        Q2{評価・状態の語か、status など別のキーで表せるか?}
        Q3{使われているタグに、同じ意味か近い意味のものがあるか?}
        Q4{上位の広いタグがあるか?}
        Q5{最も分量の多い主題か?}

        A3([使われているタグを付ける])
        A4([新しいタグを付け、同じ話題の既存の文書にもさかのぼって付ける])
        A5([広いタグも付ける])
        R1([この語のタグは付けない])
        R2([main を付ける])
        R3([main は付けない])

        START --> A1
        A1 --> A2
        A2 --> Q1
        Q1 -->|NO| R1
        Q1 -->|YES| Q2
        Q2 -->|NO| Q3
        Q2 -->|YES| R1
        Q3 -->|YES| A3
        Q3 -->|NO| A4
        A3 --> Q4
        A4 --> Q4
        Q4 -->|YES| A5
        Q4 -->|NO| Q5
        A5 --> Q5
        Q5 -->|YES| R2
        Q5 -->|NO| R3
      ```
  - id: tag-attach-flow-02
    group: タグの付与 判定フローチャート
    name: ※1 使われているタグの引き方
    body: |-
      - **※1 使われているタグの引き方**: 検索の集計（dev-docs の `group_by: tags`）で、使われているタグを件数つきで引く。書き出した語ごとに Q1 から判定する
