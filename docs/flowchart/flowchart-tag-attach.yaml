      <!-- /flow -->
  - id: tag-attach-flow-02
    group: タグの付与 判定フローチャート
    name: ※1 書き出す範囲
    body: |-
      - ※1 書き出す範囲: 規約 [タグと用語の登録](id:dev-tag-term-registration) のファイルの種類ごとの表のとおり。
        見出しの識別子（関数名・ファイル名）は、概念の語にしてから書き出す。
        ソースコードは行為の語を書き出さない（付けるファセットは表のとおり `topic:`・`tool:` だけ）
  - id: tag-attach-flow-03
    group: タグの付与 判定フローチャート
    name: ※2 一語として定着した複合語
    body: |-
      - ※2 一語として定着した複合語: 第一の基準は用語集にあるか。
        用語集に無いときは、分けると意味が変わる、または分けると関係ない文書が当たるか
