id: flowchart-folder-content-type
kind: flowchart
name: フォルダの中身の種類の決め方 判定フローチャート
description: フォルダ構成の設計書のエントリに付ける中身の種類（`content_types`）を役割の単語・機能の単語・両方・付けない・フォルダの再分割のどれにするか判定し、エントリを追加するときに参照する。
aliases:
  - フォルダの中身の種類の決め方
status: current
visibility: internal
rev: 1
related:
  - to: dev-folder-layout
    type: references
    when: 再分割になるフォルダをレビューするとき
  - to: template-layout
    type: references
    when: エントリのキーの書式を確認するとき
items:
  - id: overview
    name: 概要
    body: フォルダ構成の設計書のエントリに付ける中身の種類（`content_types`）を役割の単語・機能の単語・両方・付けない・フォルダの再分割のどれにするか判定し、エントリを追加するときに参照する。
