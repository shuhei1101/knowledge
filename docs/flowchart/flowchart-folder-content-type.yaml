      <!-- /flow -->
  - id: folder-content-type-flow-02
    group: フォルダの中身の種類の決め方 判定フローチャート
    name: ※1 直下にファイルを持たないフォルダ
    body: "- ※1 直下にファイルを持たないフォルダ: `plugins/` のように、子のフォルダだけをまとめる入れ物。\n  種類は子のエントリに付ける"
  - id: folder-content-type-flow-03
    group: フォルダの中身の種類の決め方 判定フローチャート
    name: ※2 役割
    body: "- ※2 役割: 設定・スキーマ・フック・テスト・手順など、ファイルが何として使用されるか。\n  ファイルのエントリは、そのファイルの役割。\n  設計書の `content_types[]`（`group: role`）から選び、無ければ追加する"
  - id: folder-content-type-flow-04
    group: フォルダの中身の種類の決め方 判定フローチャート
    name: ※3 機能
    body: "- ※3 機能: `features/{feature}/` のような、1 つの機能の単位。\n  設計書の `content_types[]`（`group: feature`）から選び、無ければ追加する"
  - id: folder-content-type-flow-05
    group: フォルダの中身の種類の決め方 判定フローチャート
    name: ※4 再分割
    body: "- ※4 再分割: 役割と機能のどちらも一致しない中身が入っている。\n  規約 [フォルダ構成の切り方とレビュー](id:dev-folder-layout#review-02) の観点「種類が混ざる」で取り上げる"
  - id: folder-content-type-example-01
    group: 例
    name: 結果ごとの値の例
    body: |-
      | 結果 | `content_types` の例 |
      | --- | --- |
      | 役割と機能の単語を付ける | `[config, brain]`（`content/node-docs/brain/project-index.yaml`） |
      | 役割の単語だけを付ける | `[config]` |
      | 機能の単語だけを付ける | `[session]` |
