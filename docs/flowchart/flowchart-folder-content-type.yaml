id: flowchart-folder-content-type
kind: flowchart
name: フォルダの中身の種類の決め方 判定フローチャート
description: フォルダ構成の設計書のエントリに付ける中身の種類（`content_types`）を役割の単語・機能の単語・両方・付けない・フォルダの再分割のどれにするか判定し、エントリを追加するときに参照する。
aliases:
  - フォルダの中身の種類の決め方
status: current
visibility: internal
rev: 2
related:
  - to: dev-folder-layout
    type: references
    when: 再分割になるフォルダをレビューするとき
  - to: template-layout
    type: references
    when: エントリのキーの書式を確認するとき
items:
  - id: overview
    name: 概要
    body: フォルダ構成の設計書のエントリに付ける中身の種類（`content_types`）を役割の単語・機能の単語・両方・付けない・フォルダの再分割のどれにするか判定し、エントリを追加するときに参照する。
  - id: folder-content-type-flow-01
    group: フォルダの中身の種類の決め方 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "フォルダの中身の種類の決め方"} -->

      ```mermaid
      flowchart TB
        start(("エントリを追加する"))
        q0{"ファイルのエントリか"}
        q1{"直下にファイルを持たないフォルダか"}
        r0(["付けない"])
        q2{"直下のファイルは同じ役割 を持つか"}
        q3{"1 つの機能 だけが参照するか"}
        r1(["役割と機能の単語を付ける"])
        r2(["役割の単語だけを付ける"])
        q4{"機能ごとに分けたフォルダか"}
        r3(["機能の単語だけを付ける"])
        r4(["役割か機能でフォルダを再分割する"])
        start --> q0
        q0 -->|YES| q3
        q0 -->|NO| q1
        q1 -->|YES| r0
        q1 -->|NO| q2
        q2 -->|YES| q3
        q3 -->|YES| r1
        q3 -->|NO| r2
        q2 -->|NO| q4
        q4 -->|YES| r3
        q4 -->|NO| r4
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["folder-content-type-n1"]}, "q2": {"annotations": ["folder-content-type-n2"]}, "q3": {"annotations": ["folder-content-type-n3"]}, "r4": {"annotations": ["folder-content-type-n4"]}}} -->

      <!-- /map -->

      ※[folder-content-type-n1]: 直下にファイルを持たないフォルダ: `plugins/` のように、子のフォルダだけをまとめる入れ物。
          種類は子のエントリに付ける。

      ※[folder-content-type-n2]: 役割: 設定・スキーマ・フック・テスト・手順など、ファイルが何として使用されるか。
          ファイルのエントリは、そのファイルの役割。
          設計書の `content_types[]`（`group: role`）から選び、無ければ追加する。

      ※[folder-content-type-n3]: 機能: `features/{feature}/` のような、1 つの機能の単位。
          設計書の `content_types[]`（`group: feature`）から選び、無ければ追加する。

      ※[folder-content-type-n4]: 再分割: 役割と機能のどちらも一致しない中身が入っている。
          規約 [フォルダ構成の切り方とレビュー](id:dev-folder-layout#review-02) の観点「種類が混ざる」で取り上げる。
  - id: folder-content-type-example-01
    group: 例
    name: 結果ごとの値の例
    body: |-
      | 結果 | `content_types` の例 |
      | --- | --- |
      | 役割と機能の単語を付ける | `[config, brain]`（`content/node-docs/brain/project-index.yaml`） |
      | 役割の単語だけを付ける | `[config]` |
      | 機能の単語だけを付ける | `[session]` |
