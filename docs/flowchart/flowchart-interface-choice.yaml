id: flowchart-interface-choice
kind: flowchart
name: 機能を呼ぶインターフェースの選び方 判定フローチャート
description: 機能を呼ぶインターフェース（フック・MCP ツール・API・CLI）と、エージェントに指定する新しい手順の指定方法（エージェントフロー・サブエージェント・スキル）を判定し、機能や手順をエージェント・人に提供する方法を決めるときに参照する。
aliases:
  - 機能を呼ぶインターフェースの選び方
  - エージェントへの手順の指定方法
sources:
  - title: 'Claude Code: Extend Claude Code'
    url: https://code.claude.com/docs/en/features-overview
    note: 毎回必ず起きることはフック、手順はスキル、外部とのつなぎは MCP
  - title: 'Claude Code: Skills'
    url: https://code.claude.com/docs/en/skills
  - title: 'Anthropic: Writing effective tools for agents'
    url: https://www.anthropic.com/engineering/writing-tools-for-agents
    note: API をそのまま包むツールを作らず、関連する操作を 1 本にまとめる
  - title: 'Anthropic: Equipping agents for the real world with Agent Skills'
    url: https://www.anthropic.com/engineering/equipping-agents-for-the-real-world-with-agent-skills
    note: 決まった結果が欲しい処理はコードにする
  - title: 'MCP 仕様: Tools'
    url: https://modelcontextprotocol.io/specification/2025-06-18/server/tools
    note: 入力の検証・権限はサーバー側が持つ
  - title: 'CircleCI: MCP vs CLI'
    url: https://circleci.com/blog/mcp-vs-cli
    note: 手元ですばやく回す操作は CLI、共有する基盤への操作は MCP
status: current
visibility: internal
rev: 2
items:
  - id: overview
    name: 概要
    body: 機能を呼ぶインターフェース（フック・MCP ツール・API・CLI）と、エージェントに指定する新しい手順の指定方法（エージェントフロー・サブエージェント・スキル）を判定する。
  - id: interface-choice-flow-01
    group: 機能を呼ぶインターフェースの選び方 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "機能を呼ぶインターフェースの選び方"} -->

      ```mermaid
      flowchart TB
        start(("機能や手順を提供したい"))
        q0{"エージェントに複数の工程を順に進める手順を指定するか"}
        qa{"起動の仕組み（システムプロンプト・索引）で指定できない特別な理由があるか"}
        rs(["スキル"])
        qb{"レビュー（敵対的な検証）か"}
        rsub(["Agent ツールでサブエージェントを起動し、エージェントフローの ID か指示を指定する"])
        rflow(["エージェントフローにし、エージェントが MCP で参照する"])
        q2{"決まったイベントで毎回必ず走らせるか"}
        rhook(["フック"])
        q1{"エージェントがターンの途中で判断して呼ぶか"}
        q5{"ネットワーク越しに呼ぶか、常駐プロセスの状態を使用するか"}
        rapi(["API（HTTP エンドポイント）"])
        rcli(["CLI"])
        q3{"中身は知識・決まりだけで、実行は既存の道具で足りるか"}
        rdoc(["判定フローチャート『エージェントに渡す文・処理の置き場所』で決める"])
        q4{"入力の検証・状態遷移の確認・権限の制限が要る書き込みか"}
        rmcp(["MCP ツール"])
        q6{"多くのエージェント・工程から日常的に呼ぶか"}
        rmcp2(["MCP ツール"])
        rcli2(["CLI（エージェントはシェルから呼ぶ）"])
        start --> q0
        q0 -->|YES| qa
        q0 -->|NO| q2
        qa -->|YES| rs
        qa -->|NO| qb
        qb -->|YES| rsub
        qb -->|NO| rflow
        q2 -->|YES| rhook
        q2 -->|NO| q1
        q1 -->|NO| q5
        q5 -->|YES| rapi
        q5 -->|NO| rcli
        q1 -->|YES| q3
        q3 -->|YES| rdoc
        q3 -->|NO| q4
        q4 -->|YES| rmcp
        q4 -->|NO| q6
        q6 -->|YES| rmcp2
        q6 -->|NO| rcli2
      ```

      <!-- map-data: {"version": 1, "notes": {"q0": {"annotations": ["interface-choice-n1"]}, "qa": {"annotations": ["interface-choice-n2"]}, "rs": {"annotations": ["interface-choice-n3"]}, "qb": {"annotations": ["interface-choice-n4"]}, "rflow": {"annotations": ["interface-choice-n5"]}, "q2": {"annotations": ["interface-choice-n6"]}, "q3": {"annotations": ["interface-choice-n7"]}, "q4": {"annotations": ["interface-choice-n8"]}, "rmcp": {"annotations": ["interface-choice-n9"]}}} -->

      <!-- /map -->

      ※[interface-choice-n1]: 複数の工程を順に進める手順: 工程に順番があり、工程ごとにツール・コマンドを呼ぶもの。
          常に守る決まり・前提の配置先は判定フローチャート [エージェントに渡す文・処理の置き場所](id:flowchart-session-context-placement) で決める

      ※[interface-choice-n2]: 特別な理由: 起動の構成のシステムプロンプトやエージェントフローの索引では指定できない場合（起動の仕組みを持たず、利用者の Claude Code にプラグインで配布するだけ、など）。
          利用者がスラッシュコマンドで起動したいだけなら、エージェントフローにして起動の指示で呼ばせる

      ※[interface-choice-n3]: スキル: SKILL.md はエージェントフローから生成し、利用者とエージェントの両方が呼べるようにする

      ※[interface-choice-n4]: レビュー: 成果物を、作ったエージェントの文脈を持たないクリーンなコンテキストで敵対的に検証させるもの。
          計画と実装のように作業を分けるだけなら、分けた側も計画を全て参照しないと作業できないので、同じコンテキストで進める。
          サブエージェントの種類・モデル・使用させるツールは、エージェントフローに記載し、エージェントのファイル（`agents/*.md`）とスキルの `context: fork` は使用しない

      ※[interface-choice-n5]: MCP で参照する: エージェントフローの索引を起動の構成のシステムプロンプトに入れ、エージェントが条件に合うエージェントフローを MCP で取得する。
          SessionStart のフックで注入したときは、SessionStart（compact）で再度注入する。
          MCP にエージェントフローを掲載できない環境では、手順のファイルのパスを CLAUDE.md かシステムプロンプトで示し、Read で参照させる

      ※[interface-choice-n6]: 決まったイベント: ツールの実行の前後・セッションの開始など。
          必ず守らせたいことも、このイベントで走らせるフックにする。
          フックをセッションへ指定する方法は判定フローチャート [MCP・フックの渡し方](id:flowchart-mcp-hook-delivery) で決める

      ※[interface-choice-n7]: 知識・決まりだけ: 中身が文だけで、実行は既存のツール・コマンドで足りるもの

      ※[interface-choice-n8]: 検証が要る書き込み: 入力の検証・状態遷移の確認・権限の制限・監査を、呼ぶ側ではなくサーバー側で持つ必要がある書き込み

      ※[interface-choice-n9]: MCP ツール: 既存の API をそのまま包むだけのツールにせず、関連する操作は 1 本にまとめる。
          作り方は規約 [MCP サーバー作成ルール](id:claude-mcp)、セッションへの指定方法は判定フローチャート [MCP・フックの渡し方](id:flowchart-mcp-hook-delivery) に従う
  - id: interface-choice-rule-01
    group: どのインターフェースにも共通の決まり
    name: 処理の本体とインターフェースの数
    body: |-
      - 処理の本体はどのインターフェースでも関数か CLI に配置し、インターフェースはそれを呼ぶだけにする
      - 1 つの処理にインターフェースは 1 つを原則にする
  - id: interface-choice-reason-01
    group: 手順の指定方法の比較
    name: 手順の指定方法ごとの利点と欠点
    body: |-
      <!-- table: data -->

      | 方法 | 利点 | 欠点 |
      | --- | --- | --- |
      | エージェントフロー（MCP で参照する） | 変更がリロードとプラグインの更新なしに有効になり、すぐに試せる。手順の配置先が 1 つになる | 圧縮の後に参照していた手順は自動で戻らないので、エージェントフローの索引をシステムプロンプトに入れておく |
      | Agent ツールで起動するサブエージェント | 指示を呼ぶ側が動的に作れる。ファイルを配布しないので、リロードが要らない | 呼ぶたびに指示を組み立てる |
      | エージェントのファイル（`agents/*.md`）・スキルの `context: fork` | 呼び出しが短い | プラグインで配布すると、変更のたびにリロードとプラグインの更新が要り、すぐに試せない |
      | スキル | 圧縮の後に、参照していたスキルが自動で読み込まれる。利用者がスラッシュコマンドで起動できる | プラグインで配布すると、変更のたびにリロードとプラグインの更新が要り、すぐに試せない |

      <!-- /table -->
