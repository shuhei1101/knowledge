id: flowchart-interface-choice
kind: flowchart
name: 機能を呼ぶインターフェースの選び方 判定フローチャート
description: 機能を呼ぶインターフェース（フック・MCP ツール・API・CLI）と、エージェントに指定する新しい手順の指定方法（エージェントフロー・サブエージェント・スキル）を判定し、機能や手順をエージェント・人に提供する方法を決めるときに参照する。
aliases:
  - 機能を呼ぶインターフェースの選び方
  - エージェントへの手順の指定方法
sources:
  - title: 'Claude Code: Extend Claude Code'
    url: https://code.claude.com/docs/en/features-overview
    note: 毎回必ず起きることはフック、手順はスキル、外部とのつなぎは MCP
  - title: 'Claude Code: Skills'
    url: https://code.claude.com/docs/en/skills
  - title: 'Anthropic: Writing effective tools for agents'
    url: https://www.anthropic.com/engineering/writing-tools-for-agents
    note: API をそのまま包むツールを作らず、関連する操作を 1 本にまとめる
  - title: 'Anthropic: Equipping agents for the real world with Agent Skills'
    url: https://www.anthropic.com/engineering/equipping-agents-for-the-real-world-with-agent-skills
    note: 決まった結果が欲しい処理はコードにする
  - title: 'MCP 仕様: Tools'
    url: https://modelcontextprotocol.io/specification/2025-06-18/server/tools
    note: 入力の検証・権限はサーバー側が持つ
  - title: 'CircleCI: MCP vs CLI'
    url: https://circleci.com/blog/mcp-vs-cli
    note: 手元ですばやく回す操作は CLI、共有する基盤への操作は MCP
status: current
visibility: internal
rev: 1
items:
