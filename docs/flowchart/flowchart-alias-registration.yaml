# yaml-language-server: $schema=../../schemas/flowchart.schema.yaml
id: flowchart-alias-registration
kind: flowchart
name: エイリアスの登録 判定フローチャート
description: 文書を指す名前を、エイリアスとして登録するか、用語の登録の判定へ進むか、登録しないかを判定し、文書を作成・改名したときや文書が別の名前で呼ばれたときに参照する。
aliases:
  - エイリアスの登録
tags:
  - name: scope:判定フローチャート
  - name: topic:フロー
  - name: topic:フローチャート
  - name: topic:判定フローチャート
  - name: topic:エイリアス
    main: true
  - name: topic:文書
  - name: topic:用語
  - name: action:判定
  - name: action:登録
status: current
visibility: internal
rev: 5
items:
  - id: overview
    name: 概要
    body: 文書を指す名前をエイリアスとして登録するか・用語の登録の判定へ進むか・登録しないかを判定し、文書を作成・改名したときや文書が別の名前で呼ばれたときに参照する。
  - id: alias-registration-flow-01
    group: エイリアスの登録 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "エイリアスの登録"} -->

      ```mermaid
      flowchart TB
        start(("文書を作成・改名した、または文書が別の名前で呼ばれた"))
        a1["呼び名の候補を書き出す"]
        q1{"その名前が指すのは文書 1 件か"}
        r_term(["判定フローチャート『用語の登録』へ進む"])
        r_table(["判定表『エイリアスを登録しない条件』で決める"])
        start --> a1
        a1 --> q1
        q1 -->|NO| r_term
        q1 -->|YES| r_table
      ```

      <!-- map-data: {"version": 1, "notes": {"a1": {"annotations": ["alias-registration-n1"]}, "q1": {"annotations": ["alias-registration-n2"]}, "r_table": {"annotations": ["alias-registration-n3"]}}} -->

      <!-- /map -->

      ※[alias-registration-n1]: 候補: 略称・英語名・旧名（改名したときの前のタイトル）・本文や会話でその文書を呼んだ名前と、一般語のタイトル。
          候補ごとに次の判定へ進む

      ※[alias-registration-n2]: 文書 1 件か: 名前の指す先が概念・もの（例: 「ワークスペース」）なら用語（[用語の登録](id:flowchart-term-registration) へ進む）、特定の文書（例: 「索引の手順」）ならエイリアス

      ※[alias-registration-n3]: 登録しない条件: [エイリアスを登録しない条件](id:decision-table-alias-exclusion) の判定表で、登録するか、照合条件を記載するか、登録しないかを決める
