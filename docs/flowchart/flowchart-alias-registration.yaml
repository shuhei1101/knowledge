      <!-- /flow -->
  - id: alias-registration-flow-02
    group: エイリアスの登録 判定フローチャート
    name: ※1 候補
    body: |-
      - **※1 候補**: 略称・英語名・旧名（改名したときの前のタイトル）・本文や会話でその文書を呼んだ名前。候補ごとに次の判定へ進む
        タイトルそのものが一般語のときはタイトルも候補にし、※6 の照合条件の記載までを判定する（タイトルは aliases に登録しない）
  - id: alias-registration-flow-03
    group: エイリアスの登録 判定フローチャート
    name: ※2 文書 1 件か
    body: '- **※2 文書 1 件か**: 名前が指すのが概念・もの（例: 「ワークスペース」）なら用語（[用語の登録](id:flowchart-term-registration) へ進む）、特定の文書（例: 「索引の手順」）ならエイリアス'
  - id: alias-registration-flow-04
    group: エイリアスの登録 判定フローチャート
    name: ※3 その名前で呼ばれた
    body: '- **※3 その名前で呼ばれた**: その文書を指す単語として使われた実例が、会話・Issue・本文に残っている。作成したばかりの文書は、作成のきっかけの会話・Issue で呼んだ名前を実例にする'
  - id: alias-registration-flow-05
    group: エイリアスの登録 判定フローチャート
    name: ※4 一般語
    body: '- **※4 一般語**: 文書に固有でなく、別の意味の文章でも使われる単語。登録すると、関係ない入力にもその文書の文脈が注入される。例: 設定・手順'
  - id: alias-registration-flow-08
    group: エイリアスの登録 判定フローチャート
    name: ※5 特定の文脈
    body: '- **※5 特定の文脈**: 照合した本文に出る別の単語で、その名前がこの文書を指す場面を区切れる。例: 「フォルダ構成」は、「React」か「tsx」を含み「Python」を含まない本文でだけ React の規約『フォルダ構成』を指す'
  - id: alias-registration-flow-09
    group: エイリアスの登録 判定フローチャート
    name: ※6 照合条件
    body: '- **※6 照合条件**: 文書の照合条件（alias-inject の `inject_when`）に、※5 の文脈を規約 [フィルター・照合条件の構造](id:dev-filter-condition) の構造で記載する。照合条件は文書に 1 つで、その文書の name と aliases の全てに効く'
  - id: alias-registration-flow-06
    group: エイリアスの登録 判定フローチャート
    name: ※7 1〜2 文字の語・ほかの単語の一部
    body: '- **※7 1〜2 文字の語・ほかの単語の一部**: 照合で別の単語の中でも当たる単語。例: 「印」は「印刷」に当たる'
  - id: alias-registration-flow-07
    group: エイリアスの登録 判定フローチャート
    name: ※8 正規化で吸収できる表記ゆれ
    body: '- **※8 正規化で吸収できる表記ゆれ**: [一致前の正規化](id:dev-tag-term-registration#matching-01)（NFKC・英字の大文字小文字・前後の空白）で同じ単語になる表記の違い。例: 「ＡＰＩ」と「API」は片方だけ登録する'
