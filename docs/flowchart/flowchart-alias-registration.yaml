      <!-- /flow -->
  - id: alias-registration-flow-02
    group: エイリアスの登録 判定フローチャート
    name: ※1 候補
    body: |-
      - ※1 候補: 略称・英語名・旧名（改名したときの前のタイトル）・本文や会話でその文書を呼んだ名前と、一般語のタイトル。
        候補ごとに次の判定へ進む
  - id: alias-registration-flow-03
    group: エイリアスの登録 判定フローチャート
    name: ※2 文書 1 件か
    body: '- ※2 文書 1 件か: 名前の指す先が概念・もの（例: 「ワークスペース」）なら用語（[用語の登録](id:flowchart-term-registration) へ進む）、特定の文書（例: 「索引の手順」）ならエイリアス'
  - id: alias-registration-flow-04
    group: エイリアスの登録 判定フローチャート
    name: ※3 登録しない条件
    body: '- ※3 登録しない条件: [エイリアスを登録しない条件](id:decision-table-alias-exclusion) の判定表で、登録するか、照合条件を記載するか、登録しないかを決める'
