id: flowchart-alias-registration
kind: flowchart
name: エイリアスの登録 判定フローチャート
description: 文書を指す名前を、エイリアスとして登録するか、用語の登録の判定へ進むか、登録しないかを判定し、文書を作成・改名したときや文書が別の名前で呼ばれたときに参照する。
aliases:
  - エイリアスの登録
tags:
  - name: scope:判定フローチャート
  - name: topic:フロー
  - name: topic:フローチャート
  - name: topic:判定フローチャート
  - name: topic:エイリアス
    main: true
  - name: topic:文書
  - name: topic:用語
  - name: action:判定
  - name: action:登録
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: 文書を指す名前をエイリアスとして登録するか・用語の登録の判定へ進むか・登録しないかを判定し、文書を作成・改名したときや文書が別の名前で呼ばれたときに参照する。
  - id: alias-registration-flow-01
    group: エイリアスの登録 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- flow -->

      ```json
      {
        "title": "エイリアスの登録",
        "scope": "文書にエイリアスを登録するかを決めるとき",
        "updated": "2026-11-04",
        "width": 1028,
        "height": 684,
        "nodes": [
          {"id": "start", "kind": "start", "x": 434, "y": 24, "w": 160, "h": 140, "name": "文書を作成・改名した、または文書が別の名前で呼ばれた"},
          {"id": "a1", "kind": "action", "x": 394, "y": 220, "w": 240, "h": 92, "name": "呼び名の候補を書き出す ※1"},
          {"id": "q1", "kind": "question", "x": 354, "y": 368, "w": 320, "h": 164, "name": "その名前が指すのは文書 1 件か ※2"},
          {"id": "r-term", "kind": "result", "x": 764, "y": 414, "w": 240, "h": 72, "name": "判定フローチャート『用語の登録』へ進む"},
          {"id": "r-table", "kind": "result", "x": 394, "y": 588, "w": 240, "h": 72, "name": "判定表『エイリアスを登録しない条件』で決める ※3"}
        ],
        "wires": [
          {"id": "j-start-a1", "from": "start", "to": "a1", "line": "flow", "points": [[514, 164], [514, 220]]},
          {"id": "j-a1-q1", "from": "a1", "to": "q1", "line": "flow", "points": [[514, 312], [514, 368]]},
          {"id": "j-q1-r-term", "from": "q1", "to": "r-term", "line": "flow", "points": [[674, 450], [764, 450]], "label": "NO", "labelAt": [719, 450]},
          {"id": "j-q1-r-table", "from": "q1", "to": "r-table", "line": "flow", "points": [[514, 532], [514, 588]], "label": "YES", "labelAt": [514, 560]}
        ]
      }
