id: flowchart-test-location
kind: flowchart
name: テストの実行場所 判定フローチャート
description: テスト実行方法の層ごとに、GitHub Actions のランナーと手元のどちらで回すかを判定し、テスト実行方法の層の実行場所を決めるときに参照する。
aliases:
  - テストの実行場所
status: current
visibility: internal
rev: 2
items:
  - id: overview
    name: 概要
    body: |-
      テスト実行方法の層ごとに、GitHub Actions のランナーと手元のどちらで回すかを判定し、テスト実行方法の層の実行場所を決めるときに参照する。

      結果はテスト実行方法の層の実行場所（`runner` / `local`）に記載する。
  - id: test-location-flow-01
    group: テストの実行場所 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "テストの実行場所"} -->

      ```mermaid
      flowchart TB
        start(("層の実行場所を決めたい"))
        q0{"lint の層か"}
        r0(["local"])
        q1{"手元でしか用意できないものを使用するか"}
        q4{"手元が要るのは層の中の一部のテストだけか"}
        a1["手元が要るテストにマーカーを付けてランナーの全件実行から除き、残りのテストで始めから再判定する"]
        r1(["local"])
        q2{"外部のサービスへ実際に接続するか"}
        r2(["local"])
        q3{"足りない道具を workflow の中で全て入れられるか"}
        r3(["local"])
        r4(["runner"])
        start --> q0
        q0 -->|YES| r0
        q0 -->|NO| q1
        q1 -->|YES| q4
        q4 -->|YES| a1
        q4 -->|NO| r1
        q1 -->|NO| q2
        q2 -->|YES| r2
        q2 -->|NO| q3
        q3 -->|NO| r3
        q3 -->|YES| r4
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["test-location-n1"]}, "a1": {"annotations": ["test-location-n5"]}, "q2": {"annotations": ["test-location-n2"]}, "q3": {"annotations": ["test-location-n3"]}, "r4": {"annotations": ["test-location-n4"]}}} -->

      <!-- /map -->

      ※[test-location-n1]: 手元でしか用意できないもの: 手元の Claude Code と実 LLM・手元で常駐するサーバー。
          Windows 側のファイル（`/mnt/c`）・端末の設定ファイルと秘密鍵も含む

      ※[test-location-n5]: マーカーを付けたテスト: pytest の marker・Playwright の tag など、テストの実行器が選び分けられるマーカー。
          マーカーを付けたテストは skip にせず、ランナーの全件実行では実行器の選び分け（pytest の `-m "not {マーカー}"`・Playwright の `--grep-invert` 等）で除く。
          マーカーを付けたテストは手元で回し、手元の全件実行はマーカーの有無によらず全件を回す

      ※[test-location-n2]: 外部のサービスへ実際に接続する: 検証用のリポジトリへの書き込み・Webhook の送信・外部 API の疎通の確認

      ※[test-location-n3]: workflow の中で入れられる道具: apt・uv・npm・Playwright のブラウザ・公開されている配布元から取得するバイナリ

      ※[test-location-n4]: runner にした層: 手元の全件実行・個別実行のコマンドも残し、ランナーで回せないとき（無料枠の使い切り・GitHub の障害）は手元で回す。
          ランナーで回したときの skip の件数が手元と同じかを確認する。
          リポジトリの公開・非公開は判定に入れない
  - id: job-limit-01
    group: 1 ジョブの上限を超えそうな層
    name: タイムアウトと分割
    body: |-
      - ジョブのタイムアウトは判定フローチャート [タイムアウトの決め方](id:flowchart-timeout) で決める。
        外側の作業の上限は [GitHub Actions の 1 ジョブの上限](https://docs.github.com/en/actions/reference/limits)
      - 上限を超えそうな層は、`strategy: matrix` で同じジョブを複数立て、テストを分けて並列に回す
