id: flowchart-test-location
kind: flowchart
name: テストの実行場所 判定フローチャート
description: テスト実行方法の層ごとに、GitHub Actions のランナーと手元のどちらで回すかを判定し、テスト実行方法の層の実行場所を決めるときに参照する。
aliases:
  - テストの実行場所
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      テスト実行方法の層ごとに、GitHub Actions のランナーと手元のどちらで回すかを判定し、テスト実行方法の層の実行場所を決めるときに参照する。

      結果はテスト実行方法の層の実行場所（`runner` / `local`）に記載する。
