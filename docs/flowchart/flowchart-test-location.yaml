      <!-- /flow -->
  - id: test-location-flow-02
    group: テストの実行場所 判定フローチャート
    name: ※1 手元でしか用意できないもの
    body: |-
      - ※1 手元でしか用意できないもの: 手元の Claude Code と実 LLM・手元で常駐するサーバー。
        Windows 側のファイル（`/mnt/c`）・端末の設定ファイルと秘密鍵も含む
  - id: test-location-flow-03
    group: テストの実行場所 判定フローチャート
    name: ※2 外部のサービスへ実際に接続する
    body: '- ※2 外部のサービスへ実際に接続する: 検証用のリポジトリへの書き込み・Webhook の送信・外部 API の疎通の確認'
  - id: test-location-flow-04
    group: テストの実行場所 判定フローチャート
    name: ※3 workflow の中で入れられる道具
    body: '- ※3 workflow の中で入れられる道具: apt・uv・npm・Playwright のブラウザ・公開されている配布元から取得するバイナリ'
  - id: test-location-flow-05
    group: テストの実行場所 判定フローチャート
    name: ※4 runner にした層
    body: |-
      - ※4 runner にした層: 手元の全件実行・個別実行のコマンドも残し、ランナーで回せないとき（無料枠の使い切り・GitHub の障害）は手元で回す。
        ランナーで回したときの skip の件数が手元と同じかを確認する。
        リポジトリの公開・非公開は判定に入れない
  - id: test-location-flow-06
    group: テストの実行場所 判定フローチャート
    name: ※5 マーカーを付けたテスト
    body: |-
      - ※5 マーカーを付けたテスト: pytest の marker・vitest と Playwright の tag など、テストの実行器が選び分けられるマーカー。
        マーカーを付けたテストは手元で回し、手元の全件実行はマーカーの有無によらず全件を回す
  - id: job-limit-01
    group: 1 ジョブの上限を超えそうな層
    name: タイムアウトと分割
    body: |-
      - ジョブのタイムアウトは判定フローチャート [タイムアウトの決め方](id:flowchart-timeout) で決める。
        外側の作業の上限は [GitHub Actions の 1 ジョブの上限](https://docs.github.com/en/actions/reference/limits)
      - 上限を超えそうな層は、`strategy: matrix` で同じジョブを複数立て、テストを分けて並列に回す
