# yaml-language-server: $schema=../../schemas/flowchart.schema.yaml
id: flowchart-word-choice
kind: flowchart
name: 語の選び方 判定フローチャート
description: 画面・ドキュメント・コードのコメント・論理名に記載する語を、対応表・用語集・原則のどれで決めるかを判定し、文言や名前に使う語を選ぶときに読む。
tags:
  - name: scope:判定フローチャート
  - name: topic:コメント
  - name: topic:コード
  - name: topic:フロー
  - name: topic:フローチャート
  - name: topic:判定フローチャート
  - name: topic:文書
  - name: topic:文言
  - name: topic:用語
  - name: topic:画面
  - name: action:判定
  - name: action:選択
  - name: topic:語
    main: true
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      画面・ドキュメント・コードのコメント・論理名に書く語を、対応表・用語集・原則のどれで決めるかを判定
  - id: word-choice-flow-01
    group: 語の選び方 判定フローチャート
    name: 判定フロー
    body: |-
      ```mermaid
      flowchart TD
        START([書く語を選びたい])
        Q0{コードの識別子・Enum の値・定数か?}
        Q1{文章の中か?（ラベル・見出し・表の列名・項目名・論理名ではないか）}
        Q2{対応表にある語か? ※1}
        Q3{用語集・公式ドキュメントで使われている語か? ※2}
        Q4{訓読みの動詞・一字の語・比喩か?}

        R1([英語で書く])
        R2([自然な文で書く。冗長な言い回しと話し言葉を避ける])
        R3([対応表の語を使う])
        R4([その語を使う])
        A1([定着した漢語・カタカナ語に言い換える])
        R5([そのまま使う。新しい語なら用語集に載せる])

        START --> Q0
        Q0 -->|YES| R1
        Q0 -->|NO| Q1
        Q1 -->|NO| Q2
        Q1 -->|YES| R2
        Q2 -->|YES| R3
        Q2 -->|NO| Q3
        Q3 -->|NO| Q4
        Q3 -->|YES| R4
        Q4 -->|YES| A1
        Q4 -->|NO| R5
      ```
  - id: word-choice-flow-02
    group: 語の選び方 判定フローチャート
    name: ※1 対応表
    body: |-
      - **※1 対応表**: 規約『文章の書き方』の `## 語の選び方` にあるドキュメントの語の対応表と、規約『入力と文言』の UI の操作の語の対応表
  - id: word-choice-flow-03
    group: 語の選び方 判定フローチャート
    name: ※2 用語集・公式ドキュメント
    body: |-
      - **※2 用語集・公式ドキュメント**: Microsoft の用語集・Android の日本語文字列・その技術の公式ドキュメント
