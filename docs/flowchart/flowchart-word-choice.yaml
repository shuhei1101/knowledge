items:
  - id: overview
    name: 概要
    body: |-
      画面・ドキュメント・コードのコメント・論理名に記載する単語を、対応表・用語集・原則のどれで決めるかを判定する。
  - id: word-choice-flow-01
    group: 用語の選び方 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "用語の選び方"} -->

      ```mermaid
      flowchart TB
        start(("記載する単語を選びたい"))
        q0{"コードの識別子・Enum の値・定数か"}
        r1(["英語で記載する"])
        q1{"文章の中か（ラベル・見出し・表の列名・項目名・論理名ではないか）"}
        r2(["自然な文で記載する。冗長な言い回しと話し言葉を使用しない"])
        q2{"対応表にある単語か"}
        r3(["対応表の単語を使用する"])
        q3{"用語集・公式ドキュメントで使用されている単語か"}
        r4(["その単語を使用する"])
        q4{"訓読みの動詞・一字の単語・比喩か"}
        a1["定着した漢語・カタカナ語に言い換える"]
        r5(["そのまま使用する。新しい単語なら用語集に登録する"])
        start --> q0
        q0 -->|YES| r1
        q0 -->|NO| q1
        q1 -->|NO| q2
        q1 -->|YES| r2
        q2 -->|YES| r3
        q2 -->|NO| q3
        q3 -->|NO| q4
        q3 -->|YES| r4
        q4 -->|YES| a1
        q4 -->|NO| r5
      ```

      <!-- map-data: {"version": 1, "notes": {"q2": {"annotations": ["word-choice-n1"]}, "q3": {"annotations": ["word-choice-n2"]}}} -->

      <!-- /map -->

      ※[word-choice-n1]: 対応表: 規約『文章の書き方』の `## 用語の選び方` にあるドキュメントの用語の対応表と、規約『入力と文言』の UI の操作の単語の対応表。

      ※[word-choice-n2]: 用語集・公式ドキュメント: Microsoft の用語集・Android の日本語文字列・その技術の公式ドキュメント。
