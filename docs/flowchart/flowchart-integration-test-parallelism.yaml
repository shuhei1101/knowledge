      <!-- /flow -->
  - id: integration-test-parallelism-flow-02
    group: 結合テストの並列の数 判定フローチャート
    name: ※1 ランナーで実行する層
    body: |-
      - ※1 ランナーで実行する層: テスト実行方法の層の `location` が `runner` で、ランナーで実行するとき。
        端末のメモリは判定に使用しない
  - id: integration-test-parallelism-flow-03
    group: 結合テストの並列の数 判定フローチャート
    name: ※2 メモリから求めた数
    body: |-
      - ※2 メモリから求めた数: 空きのメモリ ÷ 層の `parallelism.memory_per_process_gb`（切り捨て）。
        空きのメモリは、`free -m` の `available` − 残しておくメモリ − 層の `parallelism.fixed_memory_gb`。
        残しておくメモリは、端末のメモリの合計 × [安全率](id:dev-resource-values#default-values-01)。
        層に値が無いときは、固定のメモリを 2.5GB、並列の 1 つあたりのメモリを、ブラウザを起動しないテストで 0.5GB・起動するテストで 3GB にする
  - id: integration-test-parallelism-flow-04
    group: 結合テストの並列の数 判定フローチャート
    name: ※3 層の中で並列にできる
    body: |-
      - ※3 層の中で並列にできる: 層の `parallelism.enabled` が `true`。
        `parallelism` が無い層は NO
  - id: integration-test-parallelism-flow-05
    group: 結合テストの並列の数 判定フローチャート
    name: ※4 メモリの待ちの上限
    body: '- ※4 メモリの待ちの上限: 30 分'
  - id: integration-test-parallelism-flow-06
    group: 結合テストの並列の数 判定フローチャート
    name: ※5 並列の数
    body: |-
      - ※5 並列の数: メモリから求めた数、論理コアの数 ÷ 2（切り捨て）、層の `parallelism.max` の 3 つの最小。
        ランナーで実行する層は、ランナーの論理コアの数と `parallelism.max` の最小。
        求めた数を、テスト実行方法のコマンドの `{並列の数}` に入れる
