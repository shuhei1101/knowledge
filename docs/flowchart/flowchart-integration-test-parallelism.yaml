id: flowchart-integration-test-parallelism
kind: flowchart
name: 結合テストの並列の数 判定フローチャート
description: 結合テストを実行する直前に、メモリが空くのを待つ・実行を見送る・並列の数 1 で実行する・求めた並列の数で実行するのどれにするかを判定し、結合テストを実行するコマンドの並列の数を決めるときに参照する。
aliases:
  - 結合テストの並列の数
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      結合テストを実行する直前に、メモリが空くのを待つ・実行を見送る・並列の数 1 で実行する・求めた並列の数で実行するのどれにするかを判定し、結合テストを実行するコマンドの並列の数を決めるときに参照する。

      実行する結合テストを判定フローチャート [結合テストの実行範囲](id:flowchart-integration-test-scope) で決めた後に判定する。
      判定に使用する値は、テスト実行方法の層の `parallelism` が持つ。
  - id: integration-test-parallelism-flow-01
    group: 結合テストの並列の数 判定フローチャート
    name: 判定フロー
