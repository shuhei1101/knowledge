id: flowchart-integration-test-parallelism
kind: flowchart
name: 結合テストの並列数 判定フローチャート
description: 結合テストを実行する直前に、メモリが空くのを待つ・実行を見送る・並列数 1 で実行する・求めた並列数で実行するのどれにするかを判定し、結合テストを実行するコマンドの並列数を決めるときに参照する。
aliases:
  - 結合テストの並列数
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      結合テストを実行する直前に、メモリが空くのを待つ・実行を見送る・並列数 1 で実行する・求めた並列数で実行するのどれにするかを判定し、結合テストを実行するコマンドの並列数を決めるときに参照する。

      実行する結合テストを判定フローチャート [結合テストの実行範囲](id:flowchart-integration-test-scope) で決めた後に判定する。
      判定に使用する値は、テスト実行方法の層の `parallelism` が持つ。
  - id: integration-test-parallelism-flow-01
    group: 結合テストの並列数 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "結合テストの並列数"} -->

      ```mermaid
      flowchart TB
        start(("結合テストを実行する直前"))
        q0{"ランナーで実行する層か"}
        q1{"メモリから求めた数が 1 以上か"}
        q3{"層の中で並列にできるか"}
        r2(["並列数 1 で実行する"])
        q2{"メモリが空くのを待った時間が上限を超えたか"}
        a1["メモリが空くのを待つ"]
        r3(["並列にできるテストを の並列数で実行し、続けて直列のマーカーのテストを並列数 1 で実行する"])
        r1(["実行を見送り、依頼元へ返却する"])
        start --> q0
        q0 -->|YES| q3
        q0 -->|NO| q1
        q1 -->|YES| q3
        q1 -->|NO| q2
        q2 -->|NO| a1
        a1 --> q1
        q2 -->|YES| r1
        q3 -->|NO| r2
        q3 -->|YES| r3
      ```

      <!-- map-data: {"version": 1, "notes": {"q0": {"annotations": ["integration-test-parallelism-n1"]}, "q1": {"annotations": ["integration-test-parallelism-n2"]}, "q3": {"annotations": ["integration-test-parallelism-n3"]}, "q2": {"annotations": ["integration-test-parallelism-n4"]}, "r3": {"annotations": ["integration-test-parallelism-n5"]}}} -->

      <!-- /map -->

      ※[integration-test-parallelism-n1]: ランナーで実行する層: テスト実行方法の層の `location` が `runner` で、ランナーで実行するとき。
          端末のメモリは判定に使用しない。

      ※[integration-test-parallelism-n2]: メモリから求めた数: 空きのメモリ ÷ 層の `parallelism.memory_per_process_gb`（切り捨て）。
          空きのメモリは、`free -m` の `available` − 残しておくメモリ − 層の `parallelism.fixed_memory_gb`。
          残しておくメモリは、端末のメモリの合計 × [安全率](id:dev-resource-values#default-values-01)。
          層に値が無いときは、固定のメモリを 2.5GB、1 並列あたりのメモリを、ブラウザを起動しないテストで 0.5GB・起動するテストで 3GB にする。

      ※[integration-test-parallelism-n3]: 層の中で並列にできる: 層の `parallelism.enabled` が `true`。
          `parallelism` が無い層は NO。

      ※[integration-test-parallelism-n4]: メモリの待ちの上限: 30 分。

      ※[integration-test-parallelism-n5]: 並列数: メモリから求めた数、論理コアの数 ÷ 2（切り捨て）、層の `parallelism.max` の 3 つの最小。
          ランナーで実行する層は、ランナーの論理コアの数と `parallelism.max` の最小。
          求めた数を、テスト実行方法のコマンドの `{並列数}` に入れる。
