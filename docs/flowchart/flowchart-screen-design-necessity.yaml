# yaml-language-server: $schema=../../schemas/flowchart.schema.yaml
id: flowchart-screen-design-necessity
kind: flowchart
name: "画面設計要否 判定フローチャート"
description: 変更で画面設計と、画面設計を元にした結合テストを作るかを判定し、変更の作業で画面設計を作るかを決めるときに参照する。
aliases:
  - 画面設計要否
tags:
  - name: scope:判定フローチャート
  - name: topic:判定フローチャート
  - name: topic:フローチャート
  - name: topic:画面
    main: true
  - name: topic:結合テスト
  - name: action:判定
status: current
visibility: internal
rev: 2
related:
  - to: template-screen-design
    type: references
    when: 画面設計の elements を確認するとき
items:
  - id: overview
    name: "概要"
    body: |-
      変更で画面設計と、画面設計を元にした結合テストを作るかを判定し、変更の作業で画面設計を作るかを決めるときに参照する。
  - id: screen-design-necessity-flow-01
    group: 画面設計要否 判定フローチャート
    name: "判定フロー"
    body: |-
      <!-- map: {"title": "画面設計要否"} -->

      ```mermaid
      flowchart TB
        start(("作業で画面設計を作るかを決めたい"))
        q1{"変更が画面に及ぶか"}
        r1(["画面設計を作らない"])
        q2{"UI 項目か操作が増える・変わる・消えるか"}
        r2(["画面設計と、画面設計を元にした結合テストを作る"])
        r3(["画面設計を作らない"])
        start --> q1
        q1 -->|NO| r1
        q1 -->|YES| q2
        q2 -->|YES| r2
        q2 -->|NO| r3
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["screen-design-necessity-n1"]}, "q2": {"annotations": ["screen-design-necessity-n2", "screen-design-necessity-n3"]}}} -->

      <!-- /map -->

      ※[screen-design-necessity-n1]: 画面: 利用者が開いて閲覧・操作するもの。
          本体が Markdown などで元の HTML を触らず、共通のスタイル・スクリプト（ドキュメントサイトの共通レイアウト 等）やブラウザの拡張機能で見た目を適用するものも含む

      ※[screen-design-necessity-n2]: UI 項目: ボタン・入力欄・ソート・表示のラベル・ダイアログなど、画面設計の `elements` の 1 要素に該当するもの。
          本体の HTML のほか、JS や拡張機能が追加するものも含む。
          Markdown の本文の見出し・段落・表は含まない

      ※[screen-design-necessity-n3]: UI 項目か操作の変化: CSS だけの変更と、スタイル・スクリプトの参照の付け替えは、それが適用される UI 項目の変化として扱う
  - id: screen-design-necessity-note-01
    group: 補足
    name: "結合テストを作るか"
    body: |-
      結合テストを作るかは、インターフェース定義のテストの有無と合わせて決める。
