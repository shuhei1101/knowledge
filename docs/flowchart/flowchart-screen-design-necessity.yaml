          {"id": "j-q1-q2", "from": "q1", "to": "q2", "line": "flow", "points": [[474, 320], [474, 376]], "label": "YES", "labelAt": [474, 348]},
          {"id": "j-q2-r2", "from": "q2", "to": "r2", "line": "flow", "points": [[334, 446], [264, 446]], "label": "YES", "labelAt": [299, 446]},
          {"id": "j-q2-r3", "from": "q2", "to": "r3", "line": "flow", "points": [[474, 516], [474, 572]], "label": "NO", "labelAt": [474, 544]}
