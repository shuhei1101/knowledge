      ```

      <!-- /flow -->
  - id: screen-design-necessity-flow-02
    group: 画面設計要否 判定フローチャート
    name: "※1 画面"
    body: |-
      - ※1 画面: 利用者が開いて閲覧・操作するもの。
        本体が Markdown などで元の HTML を触らず、共通のスタイル・スクリプト（ドキュメントサイトの共通レイアウト 等）やブラウザの拡張機能で見た目を適用するものも含む
  - id: screen-design-necessity-flow-03
    group: 画面設計要否 判定フローチャート
    name: "※2 UI 項目"
    body: |-
      - ※2 UI 項目: ボタン・入力欄・ソート・表示のラベル・ダイアログなど、画面設計の `elements` の 1 要素に該当するもの。
        本体の HTML のほか、JS や拡張機能が追加するものも含む。
        Markdown の本文の見出し・段落・表は含まない
  - id: screen-design-necessity-flow-04
    group: 画面設計要否 判定フローチャート
    name: "※3 UI 項目か操作の変化"
    body: |-
      - ※3 UI 項目か操作の変化: CSS だけの変更と、スタイル・スクリプトの参照の付け替えは、それが適用される UI 項目の変化として扱う
  - id: screen-design-necessity-note-01
    group: 補足
    name: "結合テストを作るか"
    body: |-
      結合テストを作るかは、インターフェース定義のテストの有無と合わせて決める。
