id: flowchart-screen-design-necessity
kind: flowchart
name: "画面設計要否 判定フローチャート"
description: 変更で画面設計と、画面設計を元にした結合テストを作るかを判定し、変更の作業で画面設計を作るかを決めるときに参照する。
aliases:
  - 画面設計要否
tags:
  - name: scope:判定フローチャート
  - name: topic:判定フローチャート
  - name: topic:フローチャート
  - name: topic:画面
    main: true
  - name: topic:結合テスト
  - name: action:判定
status: current
visibility: internal
rev: 1
related:
  - to: template-screen-design
    type: references
    when: 画面設計の elements を確認するとき
items:
  - id: overview
    name: "概要"
    body: |-
      変更で画面設計と、画面設計を元にした結合テストを作るかを判定し、変更の作業で画面設計を作るかを決めるときに参照する。
  - id: screen-design-necessity-flow-01
    group: 画面設計要否 判定フローチャート
    name: "判定フロー"
    body: |-
      <!-- flow -->

      ```json
      {
        "title": "画面設計要否",
        "scope": "変更の作業で画面設計を作るかを決めるとき",
        "updated": "2026-11-12",
        "width": 948,
        "height": 652,
        "nodes": [
          {"id": "start", "kind": "start", "x": 414, "y": 24, "w": 120, "h": 120, "name": "作業で画面設計を作るかを決めたい"},
          {"id": "q1", "kind": "question", "x": 334, "y": 200, "w": 280, "h": 120, "name": "変更が画面に及ぶか ※1"},
          {"id": "r1", "kind": "result", "x": 684, "y": 232, "w": 240, "h": 56, "name": "画面設計を作らない"},
          {"id": "q2", "kind": "question", "x": 334, "y": 376, "w": 280, "h": 140, "name": "UI 項目か操作が増える・変わる・消えるか ※2 ※3"},
          {"id": "r2", "kind": "result", "x": 24, "y": 410, "w": 240, "h": 72, "name": "画面設計と、画面設計を元にした結合テストを作る"},
          {"id": "r3", "kind": "result", "x": 354, "y": 572, "w": 240, "h": 56, "name": "画面設計を作らない"}
        ],
        "wires": [
          {"id": "j-start-q1", "from": "start", "to": "q1", "line": "flow", "points": [[474, 144], [474, 200]]},
