  - id: term-registration-flow-02
    group: 用語の登録 判定フローチャート
    name: ※1 使ってよい言い方
    body: |-
      - ※1 使ってよい言い方: 正式な語と並べて使ってよい言い方なら `aliases`、やめた言い方なら `avoid` に入れる
  - id: term-registration-flow-03
    group: 用語の登録 判定フローチャート
    name: ※2 プロジェクト固有の呼び名
    body: |-
      - ※2 プロジェクト固有の呼び名: システム名・製品の固有の語・話し合いで決めた呼び名
