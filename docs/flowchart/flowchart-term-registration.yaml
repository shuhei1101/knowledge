# yaml-language-server: $schema=../../schemas/flowchart.schema.yaml
id: flowchart-term-registration
kind: flowchart
name: 用語の登録 判定フローチャート
description: 語を用語として登録するか、knowledge 共通かリポジトリ固有か、既存の用語の aliases や avoid に入れるかを判定
tags:
  - name: scope:判定フローチャート
    main: true
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      語を用語として登録するか、knowledge 共通かリポジトリ固有か、既存の用語の aliases や avoid に入れるかを判定
  - id: term-registration-flow-01
    group: 用語の登録 判定フローチャート
    name: 判定フロー
    body: |-
      ```mermaid
      flowchart TD
        START([用語として登録するか決めたい語がある])
        Q0{1 文書の中だけで使い、他の文書に出ない語か?}
        Q1{一般的な意味のまま使っている技術用語か?}
        Q2{プロジェクト固有の呼び名か? ※1}
        Q3{一般的な語を、このプロジェクトで一般と違う・狭い意味で使っているか?}
        Q4{調べた外部のライブラリ・外部サービスの名前か?}
        Q5{複数のリポジトリで同じ意味で使うか?}
        Q6{knowledge の既存の用語と同じものの別の言い方か?}
        Q7{このリポジトリの既存の用語と同じものの別の言い方か?}
        Q8{使ってよい言い方か? ※2}

        R1([用語として登録しない])
        R2([knowledge に新しい用語として登録する])
        R3([このリポジトリに新しい用語として登録する])
        R4([既存の用語の aliases に入れる])
        R5([既存の用語の avoid に入れる])

        START --> Q0
        Q0 -->|YES| R1
        Q0 -->|NO| Q1
        Q1 -->|NO| Q2
        Q1 -->|YES| R1
        Q2 -->|YES| Q5
        Q2 -->|NO| Q3
        Q3 -->|YES| Q5
        Q3 -->|NO| Q4
        Q4 -->|NO| R1
        Q4 -->|YES| Q5
        Q5 -->|YES| Q6
        Q5 -->|NO| Q7
        Q6 -->|NO| R2
        Q6 -->|YES| Q8
        Q7 -->|NO| R3
        Q7 -->|YES| Q8
        Q8 -->|YES| R4
        Q8 -->|NO| R5
      ```
  - id: term-registration-flow-02
    group: 用語の登録 判定フローチャート
    name: ※1 プロジェクト固有の呼び名
    body: |-
      - **※1 プロジェクト固有の呼び名**: システム名・製品の固有の語・話し合いで決めた呼び名
  - id: term-registration-flow-03
    group: 用語の登録 判定フローチャート
    name: ※2 使ってよい言い方
    body: |-
      - **※2 使ってよい言い方**: 正式な語と並べて使ってよい言い方なら `aliases`、やめた言い方なら `avoid` に入れる
