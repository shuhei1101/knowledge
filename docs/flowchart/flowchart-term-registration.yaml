items:
  - id: overview
    name: 概要
    body: |-
      単語を既存の用語の aliases や avoid に入れるか、用語として登録するか、knowledge 共通かリポジトリ固有かを判定する。
  - id: term-registration-flow-01
    group: 用語の登録 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "用語の登録"} -->

      ```mermaid
      flowchart TB
        start(("用語として登録するか決めたい単語がある"))
        q0{"knowledge かこのリポジトリの既存の用語と同じものの別の言い方か"}
        q1{"使用してよい言い方か"}
        r1(["既存の用語の aliases に入れる"])
        r2(["既存の用語の avoid に入れる"])
        q2{"1 文書の中だけで使用し、他の文書に出ない単語か"}
        r3(["用語として登録しない"])
        q3{"一般的な意味のまま使用している技術用語か"}
        r3_2(["用語として登録しない"])
        q4{"プロジェクト固有の呼び名か"}
        q5{"一般的な単語を、このプロジェクトで一般と違う・狭い意味で使用しているか"}
        q6{"調べた外部のライブラリ・外部サービスの名前か"}
        r3_3(["用語として登録しない"])
        q7{"複数のリポジトリで同じ意味で使用するか"}
        r4(["knowledge に新しい用語として登録する"])
        r5(["このリポジトリに新しい用語として登録する"])
        start --> q0
        q0 -->|YES| q1
        q0 -->|NO| q2
        q1 -->|YES| r1
        q1 -->|NO| r2
        q2 -->|YES| r3
        q2 -->|NO| q3
        q3 -->|NO| q4
        q3 -->|YES| r3_2
        q4 -->|YES| q7
        q4 -->|NO| q5
        q5 -->|YES| q7
        q5 -->|NO| q6
        q6 -->|NO| r3_3
        q6 -->|YES| q7
        q7 -->|YES| r4
        q7 -->|NO| r5
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["term-registration-n1"]}, "q4": {"annotations": ["term-registration-n2"]}}} -->

      <!-- /map -->

      ※[term-registration-n1]: 使用してよい言い方: 正式な単語と並べて使用してよい言い方なら `aliases`、やめた言い方なら `avoid` に入れる

      ※[term-registration-n2]: プロジェクト固有の呼び名: システム名・製品の固有の単語・話し合いで決めた呼び名