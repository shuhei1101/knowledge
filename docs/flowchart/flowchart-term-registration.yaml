# yaml-language-server: $schema=../../schemas/flowchart.schema.yaml
id: flowchart-term-registration
kind: flowchart
name: 用語の登録 判定フローチャート
description: 語を既存の用語の aliases や avoid に入れるか、用語として登録するか、knowledge 共通かリポジトリ固有かを判定し、用語集へ登録するかを決めるときに読む。
tags:
  - name: scope:判定フローチャート
  - name: topic:フロー
  - name: topic:フローチャート
  - name: topic:プロジェクト
  - name: topic:リポジトリ
  - name: topic:用語
    main: true
  - name: action:判定
  - name: action:登録
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      語を既存の用語の aliases や avoid に入れるか、用語として登録するか、knowledge 共通かリポジトリ固有かを判定
  - id: term-registration-flow-01
    group: 用語の登録 判定フローチャート
    name: 判定フロー
    body: |-
      ```mermaid
      flowchart TD
        START([用語として登録するか決めたい語がある])
        Q0{knowledge かこのリポジトリの既存の用語と同じものの別の言い方か?}
        Q1{使ってよい言い方か? ※1}
        Q2{1 文書の中だけで使い、他の文書に出ない語か?}
        Q3{一般的な意味のまま使っている技術用語か?}
        Q4{プロジェクト固有の呼び名か? ※2}
        Q5{一般的な語を、このプロジェクトで一般と違う・狭い意味で使っているか?}
        Q6{調べた外部のライブラリ・外部サービスの名前か?}
        Q7{複数のリポジトリで同じ意味で使うか?}

        R1([既存の用語の aliases に入れる])
        R2([既存の用語の avoid に入れる])
        R3([用語として登録しない])
        R4([knowledge に新しい用語として登録する])
        R5([このリポジトリに新しい用語として登録する])

        START --> Q0
        Q0 -->|YES| Q1
        Q0 -->|NO| Q2
        Q1 -->|YES| R1
        Q1 -->|NO| R2
        Q2 -->|YES| R3
        Q2 -->|NO| Q3
        Q3 -->|NO| Q4
        Q3 -->|YES| R3
        Q4 -->|YES| Q7
        Q4 -->|NO| Q5
        Q5 -->|YES| Q7
        Q5 -->|NO| Q6
        Q6 -->|NO| R3
        Q6 -->|YES| Q7
        Q7 -->|YES| R4
        Q7 -->|NO| R5
      ```
  - id: term-registration-flow-02
    group: 用語の登録 判定フローチャート
    name: ※1 使ってよい言い方
    body: |-
      - **※1 使ってよい言い方**: 正式な語と並べて使ってよい言い方なら `aliases`、やめた言い方なら `avoid` に入れる
  - id: term-registration-flow-03
    group: 用語の登録 判定フローチャート
    name: ※2 プロジェクト固有の呼び名
    body: |-
      - **※2 プロジェクト固有の呼び名**: システム名・製品の固有の語・話し合いで決めた呼び名
