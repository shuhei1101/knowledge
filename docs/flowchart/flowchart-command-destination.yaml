      <!-- /flow -->
  - id: command-destination-flow-02
    group: コマンドの書き先 判定フローチャート
    name: ※1 1 コマンドずつ通す
    body: |-
      - ※1 1 コマンドずつ通す: 差分で変わるコマンドを洗い出し、1 つずつこの図で判定して記載先を 1 つ決める。
        依存の定義が変わる差分は、依存を追加・更新・削除するコマンドと、取り込んだ後に同期するコマンドを分けて 1 つずつ判定する
  - id: command-destination-flow-03
    group: コマンドの書き先 判定フローチャート
    name: ※2 既に同じ形で書かれている
    body: |-
      - ※2 既に同じ形で書かれている: Q1 以降で決まる記載先に、差分で変わるコマンドと前提と実行の順序が既にあること。
        記載先のページやセクションが無いとき、コマンドや前提が違うときは NO
  - id: command-destination-flow-04
    group: コマンドの書き先 判定フローチャート
    name: ※3 取り込み前の検査
    body: |-
      - ※3 取り込み前の検査: CI と同じ検査（テスト・静的検査・ビルドの組）を 1 つの手順で実行するもの。
        個別のコマンドはコピーせず、既に記載した先（テストと静的検査はテスト実行方法）を指し、他のページに無い検査だけを記載する
  - id: command-destination-flow-05
    group: コマンドの書き先 判定フローチャート
    name: ※4 取り込み後の追従
    body: |-
      - ※4 取り込み後の追従: 依存の同期・マイグレーション・生成物の作り直し・プラグインの更新・再起動など、他の人の変更を取り込んだ後に実行するもの
  - id: command-destination-flow-06
    group: コマンドの書き先 判定フローチャート
    name: ※5 特定の外部ライブラリだけが要る手順
    body: |-
      - ※5 特定の外部ライブラリだけが要る手順: 初期化・プラグインの登録・ライブラリ固有の設定など。
        依存の定義への追加と同期は Q4・Q5 で当たる
  - id: command-destination-flow-07
    group: コマンドの書き先 判定フローチャート
    name: ※6 環境構築
    body: |-
      - ※6 環境構築: ランタイム・ツールの認証・プラグインの導入など、クローンした直後に 1 度実行するもの
  - id: command-destination-flow-08
    group: コマンドの書き先 判定フローチャート
    name: ※7 起動・停止
    body: |-
      - ※7 起動・停止: 開発サーバーと補助のプロセスの起動と停止
  - id: command-destination-flow-09
    group: コマンドの書き先 判定フローチャート
    name: ※8 静的検査
    body: |-
      - ※8 静的検査: コードを実行せずに調べて修正するもの。
        linter・formatter の check・型検査・構造の検査を、テスト実行方法の lint 層の全件実行に集める
  - id: command-destination-flow-10
    group: コマンドの書き先 判定フローチャート
    name: ※9 ビルド・生成
    body: |-
      - ※9 ビルド・生成: 成果物・コード・ドキュメントを作るもの
  - id: command-destination-flow-11
    group: コマンドの書き先 判定フローチャート
    name: ※10 一度きりの作業
    body: |-
      - ※10 一度きりの作業: データの移行のように、繰り返し実行しない管理作業
