id: flowchart-command-destination
kind: flowchart
name: コマンドの書き先 判定フローチャート
description: 開発で使用するコマンドを記載するか・どの分類か・どこに記載するかを判定し、開発で使用するコマンドが変わる変更を記載するときに参照する。
aliases:
  - コマンドの書き先
tags:
  - name: scope:判定フローチャート
  - name: topic:判定フローチャート
  - name: topic:フローチャート
  - name: topic:コマンド
    main: true
  - name: topic:テンプレート
  - name: topic:lint
  - name: topic:testing
  - name: topic:セットアップ
  - name: action:判定
  - name: action:分類
  - name: action:配置
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      開発で使用するコマンドの記載の要否・分類・記載先を判定し、開発で使用するコマンドが変わる変更を記載するときに参照する。
  - id: command-destination-flow-01
    group: コマンドの書き先 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "コマンドの書き先"} -->

      ```mermaid
      flowchart TB
        start(("差分で変わるコマンド 1 つの記載先を決めたい"))
        q0{"差分で変わるコマンドが、記載先に既に同じ構造で記載されているか"}
        r0(["記載しない"])
        q1{"システムを使用する側へ向けた CLI・API・操作手順か"}
        r1(["利用者向けの使い方・リファレンス"])
        q2{"CI と同じ検査を手元でまとめて実行するコマンドか"}
        r2(["開発コマンド『取り込み前の検査』"])
        q3{"テストを実行するコマンドか"}
        r3(["テスト実行方法"])
        q4{"依存を追加・更新・削除するコマンドか"}
        r4(["開発コマンド『依存の追加・更新・削除』"])
        q5{"取り込んだ変更に手元を追従させるコマンドか"}
        r5(["開発コマンド『取り込み後の追従（pull 後）』"])
        q6{"依存の定義への追加と同期の他に、特定の外部ライブラリだけが要る手順か"}
        r6(["外部ライブラリの設計書の install"])
        q7{"クローン直後に実行する環境の用意か"}
        r7(["開発コマンド『環境構築（クローン直後）』"])
        q8{"プロセスを起動・停止するコマンドか"}
        r8(["開発コマンド『起動・停止』"])
        q9{"lint・format・型検査か"}
        r9(["テスト実行方法の lint 層"])
        q10{"ビルド・コード生成・ドキュメント生成か"}
        r10(["開発コマンド『ビルド・生成』"])
        q11{"一度きりの作業か"}
        r11(["開発コマンド『管理作業』"])
        a1["どの分類にも該当しない: 分類を追加するかを論点として挙げる"]
        start --> q0
        q0 -->|YES| r0
        q0 -->|NO| q1
        q1 -->|YES| r1
        q1 -->|NO| q2
        q2 -->|YES| r2
        q2 -->|NO| q3
        q3 -->|YES| r3
        q3 -->|NO| q4
        q4 -->|YES| r4
        q4 -->|NO| q5
        q5 -->|YES| r5
        q5 -->|NO| q6
        q6 -->|YES| r6
        q6 -->|NO| q7
        q7 -->|YES| r7
        q7 -->|NO| q8
        q8 -->|YES| r8
        q8 -->|NO| q9
        q9 -->|YES| r9
        q9 -->|NO| q10
        q10 -->|YES| r10
        q10 -->|NO| q11
        q11 -->|YES| r11
        q11 -->|NO| a1
      ```

      <!-- map-data: {"version": 1, "notes": {"start": {"annotations": ["command-destination-n1"]}, "q0": {"annotations": ["command-destination-n2"]}, "q2": {"annotations": ["command-destination-n3"]}, "q5": {"annotations": ["command-destination-n4"]}, "q6": {"annotations": ["command-destination-n5"]}, "q7": {"annotations": ["command-destination-n6"]}, "q8": {"annotations": ["command-destination-n7"]}, "q9": {"annotations": ["command-destination-n8"]}, "q10": {"annotations": ["command-destination-n9"]}, "q11": {"annotations": ["command-destination-n10"]}}} -->

      <!-- /map -->

      ※[command-destination-n1]: 1 コマンドずつ判定する: 差分で変わるコマンドを洗い出し、1 つずつこの図で判定して記載先を 1 つ決める。
          依存の定義が変わる差分は、依存を追加・更新・削除するコマンドと、取り込んだ後に同期するコマンドを分けて 1 つずつ判定する。

      ※[command-destination-n2]: 既に同じ構造で記載されている: Q1 以降で決まる記載先に、差分で変わるコマンドと前提と実行の順序が既にあること。
          記載先のページやセクションが無いとき、コマンドや前提が違うときは NO。

      ※[command-destination-n3]: 取り込み前の検査: CI と同じ検査（テスト・静的検査・ビルドの組）を 1 つの手順で実行するもの。
          個別のコマンドはコピーせず、既に記載した先（テストと静的検査はテスト実行方法）を指し、他のページに無い検査だけを記載する。

      ※[command-destination-n4]: 取り込み後の追従: 依存の同期・マイグレーション・生成物の再生成・プラグインの更新・再起動など、他の人の変更を取り込んだ後に実行するもの。

      ※[command-destination-n5]: 特定の外部ライブラリだけが要る手順: 初期化・プラグインの登録・ライブラリ固有の設定など。
          依存の定義への追加と同期は Q4・Q5 で該当する。

      ※[command-destination-n6]: 環境構築: ランタイム・ツールの認証・プラグインの導入など、クローンした直後に 1 度実行するもの。

      ※[command-destination-n7]: 起動・停止: 開発サーバーと補助のプロセスの起動と停止。

      ※[command-destination-n8]: 静的検査: コードを実行せずに調べて修正するもの。
          linter・formatter の check・型検査・構造の検査を、テスト実行方法の lint 層の全件実行に集める。

      ※[command-destination-n9]: ビルド・生成: 成果物・コード・ドキュメントを作るもの。

      ※[command-destination-n10]: 一度きりの作業: データの移行のように、繰り返し実行しない管理作業。
