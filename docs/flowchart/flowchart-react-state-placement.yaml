  - id: react-state-placement-flow-02
    group: React の状態の置き場所 判定フローチャート
    name: ※1 URL に置く値
    body: |-
      - ※1 URL に置く値: タブ・フィルタ・ソート・ページ・選択中の ID。
        個人情報・フォームの入力中の値・読み込み中とエラーの表示・スクロール位置は、URL に出さない
  - id: react-state-placement-flow-05
    group: React の状態の置き場所 判定フローチャート
    name: ※2 戻したい値
    body: |-
      - ※2 戻したい値: 戻る・別の画面からリンクで入り直す・再読み込みの後に戻したい値（スクロール位置・最後のタブや絞り込み・端末ごとの好み）。
        スクロール位置は TanStack Router の `scrollRestoration` で戻す（[URL の状態](id:react-state-url-state#scroll-restoration-01)）
  - id: react-state-placement-flow-03
    group: React の状態の置き場所 判定フローチャート
    name: ※3 Zustand の使い方
    body: |-
      - ※3 Zustand の使い方: store は公開せず、カスタム hook だけを export する。
        selector で必要な値だけを購読し、actions は state と分ける。
        永続化は `persist` を使い、保存先（sessionStorage・localStorage）は [画面の状態の保持先](id:flowchart-screen-state-retention) の結果に合わせる。
        サーバーのデータとフォームの値は入れない。
        画面をまたぐ store は `shared/stores/` に置く
  - id: react-state-placement-flow-04
    group: React の状態の置き場所 判定フローチャート
    name: ※4 Context の使い方
    body: "- ※4 Context の使い方: 1 つの Context は 1 つの責務にする。\n  Provider と同じファイルに `use{Name}` を export し、Provider の外で呼んだら throw する。\n  SPA ではルートの上に置いた Provider がページを移っても消えないので、ページをまたぐだけなら Context で足りる"
