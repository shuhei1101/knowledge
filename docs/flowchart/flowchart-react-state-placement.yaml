      | [Choosing the State Structure](https://react.dev/learn/choosing-the-state-structure) | 計算できる値は state にしない |
      | [Sharing State Between Components](https://react.dev/learn/sharing-state-between-components) | 近い親へ持ち上げる |
      | [Scaling Up with Reducer and Context](https://react.dev/learn/scaling-up-with-reducer-and-context) | Context と useReducer の組み合わせ |
      | [Does TanStack Query replace client state?](https://tanstack.com/query/latest/docs/framework/react/guides/does-this-replace-client-state) | サーバーのデータは TanStack Query に置く |
      | [Working with Zustand](https://tkdodo.eu/blog/working-with-zustand) | store を公開せず、カスタム hook と atomic selector で使う |

