id: flowchart-react-state-placement
kind: flowchart
name: React の状態の置き場所 判定フローチャート
description: React のフロントエンドで新しい値（計算・TanStack Query・URL・フォーム・useState・useReducer・親・Zustand・Context）をどこに置くかを判定し、状態の置き場所を決めるときに読む。
aliases:
  - 状態の置き場所
tags:
  - name: scope:判定フローチャート
  - name: topic:フロントエンド
  - name: topic:url
  - name: topic:クエリ
  - name: topic:コンテキスト
  - name: topic:フォーム
  - name: topic:フロー
  - name: topic:フローチャート
  - name: topic:判定フローチャート
  - name: tool:react
    main: true
  - name: tool:tanstack-query
  - name: tool:zustand
  - name: action:判定
  - name: action:計算
status: current
visibility: internal
rev: 8
related:
  - to: react-state-url-state
    type: references
    when: URL の状態を実装するとき
  - to: flowchart-screen-state-retention
    type: references
    when: 画面を離れて戻ったときに戻す値の保持先を決めるとき
sources:
  - title: Choosing the State Structure
    url: https://react.dev/learn/choosing-the-state-structure
    note: 計算できる値は state にしない
  - title: Sharing State Between Components
    url: https://react.dev/learn/sharing-state-between-components
    note: 近い親へ持ち上げる
  - title: Scaling Up with Reducer and Context
    url: https://react.dev/learn/scaling-up-with-reducer-and-context
    note: Context と useReducer の組み合わせ
  - title: Does TanStack Query replace client state?
    url: https://tanstack.com/query/latest/docs/framework/react/guides/does-this-replace-client-state
    note: サーバーのデータは TanStack Query に置く
  - title: Working with Zustand
    url: https://tkdodo.eu/blog/working-with-zustand
    note: store を公開せず、カスタム hook と atomic selector で使う
items:
  - id: overview
    name: 概要
    body: |-
      React のフロントエンドで、新しい値をどこに置くかを判定する。
      React の外のシステムと同期するときだけ `useEffect` を使う（[useEffect](id:react-state-effect)）。
