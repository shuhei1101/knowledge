items:
  - id: overview
    name: 概要
    body: |-
      React のフロントエンドで、新しい値をどこに配置するかを判定する。
      React の外のシステムと同期するときだけ `useEffect` を使用する（[useEffect](id:react-state-effect)）。
  - id: react-state-placement-flow-01
    group: React の状態の置き場所 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "React の状態の置き場所"} -->

      ```mermaid
      flowchart TB
        start(("新しい値の配置先を決めたい"))
        q0{"props・既存の state から計算できるか"}
        r1(["state にしない。描画中に計算する"])
        q1{"サーバーのデータか"}
        r2(["TanStack Query。ほかの store にコピーしない"])
        q2{"共有・ブックマークで同じ表示にしたい値か"}
        r3(["URL の状態。validateSearch + Zod"])
        q2_2{"画面を離れて戻ったとき・再読み込みの後に戻したい値か"}
        r3_2(["保持先を『画面の状態の保持先』で選ぶ。Storage に持つ値は Zustand の persist"])
        q3{"フォームの入力中の値か"}
        q4{"項目が多い、または検証が複雑か"}
        r4(["React Hook Form + Zod"])
        r5(["useState"])
        q5{"使用するのは 1 コンポーネントだけか"}
        q6{"複数の値が連動するか"}
        r6(["useReducer"])
        r5_2(["useState"])
        q7{"近い親に持ち上げて props か children で指定できるか"}
        r7(["親へ持ち上げる"])
        q8{"頻繁に更新される・一部だけ購読したい・React の外から参照する、のどれかか"}
        r8(["Zustand"])
        r9(["Context。必要なら useReducer と組み合わせる"])
        start --> q0
        q0 -->|YES| r1
        q0 -->|NO| q1
        q1 -->|NO| q2
        q1 -->|YES| r2
        q2 -->|YES| r3
        q2 -->|NO| q2_2
        q2_2 -->|YES| r3_2
        q2_2 -->|NO| q3
        q3 -->|YES| q4
        q3 -->|NO| q5
        q4 -->|YES| r4
        q4 -->|NO| r5
        q5 -->|YES| q6
        q5 -->|NO| q7
        q6 -->|YES| r6
        q6 -->|NO| r5_2
        q7 -->|NO| q8
        q7 -->|YES| r7
        q8 -->|YES| r8
        q8 -->|NO| r9
      ```

      <!-- map-data: {"version": 1, "notes": {"q2": {"annotations": ["react-state-placement-n1"]}, "q2_2": {"annotations": ["react-state-placement-n2"]}, "r8": {"annotations": ["react-state-placement-n3"]}, "r9": {"annotations": ["react-state-placement-n4"]}}} -->

      <!-- /map -->

      ※[react-state-placement-n1]: URL に配置する値: タブ・フィルタ・ソート・ページ・選択中の ID。
          個人情報・フォームの入力中の値・読み込み中とエラーの表示・スクロール位置は、URL に出さない。

      ※[react-state-placement-n2]: 戻したい値: 戻る・別の画面からリンクで再度入る・再読み込みの後に戻したい値（スクロール位置・最後のタブや絞り込み・端末ごとの好み）。
          スクロール位置は TanStack Router の `scrollRestoration` で戻す（[URL の状態](id:react-state-url-state#scroll-restoration-01)）。

      ※[react-state-placement-n3]: Zustand の使用方法: store は公開せず、カスタム hook だけを export する。
          selector で必要な値だけを購読し、actions は state と分ける。
          永続化は `persist` を使用し、保存先（sessionStorage・localStorage）は [画面の状態の保持先](id:flowchart-screen-state-retention) の結果に合わせる。
          サーバーのデータとフォームの値は入れない。
          画面をまたぐ store は `shared/stores/` に配置する。

      ※[react-state-placement-n4]: Context の使用方法: 1 つの Context は 1 つの責務にする。
          Provider と同じファイルに `use{Name}` を export し、Provider の外で呼んだら throw する。
          SPA ではルートの上に配置した Provider がページを移っても消えないので、ページをまたぐだけなら Context で足りる。
