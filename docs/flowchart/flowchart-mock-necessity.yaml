  - id: mock-necessity-flow-02
    group: モック要否 判定フローチャート
    name: "※1 画面の見た目"
    body: |-
      - ※1 画面の見た目: 利用者が開く画面の要素・配置・文言・色。
        内部の処理だけが変わり、表示が同じなら含めない
  - id: mock-necessity-flow-03
    group: モック要否 判定フローチャート
    name: "※2 作る人が決める余地"
    body: |-
      - ※2 作る人が決める余地: 依頼に見た目の結果（表示する文言・位置・色など）の記載が無く、作る人の決める部分が残っている
  - id: mock-necessity-flow-04
    group: モック要否 判定フローチャート
    name: "※3 デザイン方針"
    body: |-
      - ※3 デザイン方針: プロジェクトのデザイン方針（テンプレート [デザイン方針](id:template-design-policy) の `docs/design-policy.md`）
