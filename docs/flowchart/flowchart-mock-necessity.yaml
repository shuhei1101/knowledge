id: flowchart-mock-necessity
kind: flowchart
name: "モック要否 判定フローチャート"
description: 画面に関わる変更で、デザインスタイルの選定・画面一覧と画面遷移・モックを作るかを判定し、変更の作業で作る画面の資料を決めるときに参照する。
aliases:
  - モック要否
tags:
  - name: scope:判定フローチャート
  - name: topic:判定フローチャート
  - name: topic:フローチャート
  - name: topic:モック
    main: true
  - name: topic:画面
  - name: topic:デザインスタイル
  - name: action:判定
status: current
visibility: internal
rev: 2
related:
  - to: convention-design-style
    type: references
    when: デザインスタイルを選定するとき
  - to: template-design-policy
    type: references
    when: デザイン方針の有無を確認するとき
items:
  - id: overview
    name: "概要"
    body: |-
      画面に関わる変更で、デザインスタイルの選定・画面一覧と画面遷移・モックを作るかを判定し、変更の作業で作る画面の資料を決めるときに参照する。
  - id: mock-necessity-flow-01
    group: モック要否 判定フローチャート
    name: "判定フロー"
    body: |-
      <!-- map: {"title": "モック要否"} -->

      ```mermaid
      flowchart TB
        start(("作業で作る画面の資料を決めたい"))
        q1{"利用者に見える画面の見た目が変わるか"}
        r1(["デザインスタイルの選定・画面一覧と画面遷移・モックを作らない"])
        q2{"画面の追加・削除か、画面遷移の変更があるか"}
        a1["画面一覧・画面遷移とモックを作る"]
        q3{"見た目を作る人が決める余地があるか"}
        a2["変わる画面だけモックを作り、画面一覧・画面遷移は作らない"]
        a3["画面一覧・画面遷移とモックを作らない"]
        q4{"デザイン方針があり、変更が見た目の方向を変えるものではないか"}
        r2(["デザインスタイルを選定しない"])
        r3(["デザインスタイルを選定する"])
        start --> q1
        q1 -->|NO| r1
        q1 -->|YES| q2
        q2 -->|YES| a1
        q2 -->|NO| q3
        q3 -->|YES| a2
        q3 -->|NO| a3
        a3 --> q4
        a1 --> q4
        a2 --> q4
        q4 -->|YES| r2
        q4 -->|NO| r3
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["mock-necessity-n1"]}, "q3": {"annotations": ["mock-necessity-n2"]}, "q4": {"annotations": ["mock-necessity-n3"]}}} -->

      <!-- /map -->

      ※[mock-necessity-n1]: 画面の見た目: 利用者が開く画面の要素・配置・文言・色。
          内部の処理だけが変わり、表示が同じなら含めない。

      ※[mock-necessity-n2]: 作る人が決める余地: 依頼に見た目の結果（表示する文言・位置・色など）の記載が無く、作る人の決める部分が残っている。

      ※[mock-necessity-n3]: デザイン方針: プロジェクトのデザイン方針（テンプレート [デザイン方針](id:template-design-policy) の `docs/design-policy.md`）。
