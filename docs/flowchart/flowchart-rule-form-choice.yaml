id: flowchart-rule-form-choice
kind: flowchart
name: 決まりの表し方の選び方 判定フローチャート
description: 判断・作業の決まりを判定フローチャート・判定表・チェックシート・手順・規約のどれで表すかを判定し、規約・手順に判断や作業の決まりを記載するときに参照する。
aliases:
  - 決まりの表し方の選び方
tags:
  - name: scope:判定フローチャート
  - name: topic:判定フローチャート
  - name: topic:フローチャート
  - name: topic:表し方
    main: true
  - name: topic:判定表
  - name: topic:チェックシート
  - name: topic:手順
  - name: topic:規約
  - name: action:判定
  - name: action:選択
status: current
visibility: internal
rev: 2
items:
  - id: overview
    name: 概要
    body: |-
      判断・作業の決まりを判定フローチャート・判定表・チェックシート・手順・規約のどれで表すかを判定し、規約・手順に判断や作業の決まりを記載するときに参照する。
  - id: rule-form-choice-flow-01
    group: 決まりの表し方の選び方 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "決まりの表し方の選び方"} -->

      ```mermaid
      flowchart TB
        start(("判断・作業の決まりを記載する"))
        q1{"結果が選択肢の 1 つに決まるか"}
        q2{"前の回答で次の質問が変わるか"}
        r1(["判定フローチャート"])
        r2(["判定表（条件の組み合わせ × 結果）"])
        q3{"全ての項目を満たしたかを確認するか"}
        r3(["チェックシート"])
        q4{"実行の順番があるか"}
        r4(["手順（ステップ）"])
        q5{"値を導くか"}
        r5(["導き方の表（式・出典）"])
        r6(["規約（表・箇条書き）"])
        start --> q1
        q1 -->|YES| q2
        q2 -->|YES| r1
        q2 -->|NO| r2
        q1 -->|NO| q3
        q3 -->|YES| r3
        q3 -->|NO| q4
        q4 -->|YES| r4
        q4 -->|NO| q5
        q5 -->|YES| r5
        q5 -->|NO| r6
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["rule-form-choice-n1"]}, "q2": {"annotations": ["rule-form-choice-n2"]}, "q3": {"annotations": ["rule-form-choice-n3"]}, "q5": {"annotations": ["rule-form-choice-n4"]}}} -->

      <!-- /map -->

      ※[rule-form-choice-n1]: 選択肢の 1 つに決まる: 「どこに配置するか」「起票するか」「どの方式にするか」のように、回答が決まった候補のどれかになる。

      ※[rule-form-choice-n2]: 前の回答で次の質問が変わる: 質問を順に確認し、回答によって次の質問が変わる。
          全ての条件を毎回確認し、組み合わせで結果が決まるなら判定表にする（例: Issue・PR の別 × 相手 × 行に紐づくか）。

      ※[rule-form-choice-n3]: 全ての項目を満たしたか: 作業の完了・レビューの前に、漏れが無いかを 1 項目ずつ確認する。
          項目の順番は問わないか、実行の順に並べるだけ。

      ※[rule-form-choice-n4]: 値を導く: タイムアウト・上限・見積もりのように、元の値から数値を導く。
  - id: rule-form-choice-example-01
    group: 見分け方の例
    name: 記載の形式と表し方
    body: |-
      <!-- table: data -->

      | 記載の形式 | 表し方 |
      | --- | --- |
      | 「〜の場合は A、〜でなければ B。B のうち〜のときは C」 | 判定フローチャート |
      | 「Issue なら〜、PR で行に紐づくなら〜、紐づかないなら〜」（条件が独立） | 判定表 |
      | 質問の YES・NO がどれも同じ結果へ行き、最後だけ別の結果になる（「1 つでも該当すれば A」「全て該当すれば B」） | 判定表 |
      | 「〜したか」「〜がそろっているか」を並べる | チェックシート |
      | 「まず〜、次に〜、最後に〜」 | 手順 |

      <!-- /table -->
  - id: rule-form-choice-result-01
    group: 結果ごとの書き方
    name: 結果ごとの書式
    body: |-
      <!-- table: data -->

      | 結果 | 書式 |
      | --- | --- |
      | 判定フローチャート | [テンプレート: 判定フローチャート](id:template-flowchart) |
      | 判定表 | [テンプレート: 判定表](id:template-decision-table) |
      | チェックシート | [テンプレート: チェックシート](id:template-checksheet) |
      | 手順（ステップ） | [ドキュメントの部品](id:doc-parts) のステップ |

      <!-- /table -->

      表し方を決めた後、規約の中を図・表・箇条書き・文のどれで記載するかは [表し方の選び方](id:flowchart-presentation-choice) で決める。
