      <!-- /flow -->
  - id: rule-form-choice-flow-02
    group: 決まりの表し方の選び方 判定フローチャート
    name: ※1 選択肢の 1 つに決まる
    body: |-
      - ※1 選択肢の 1 つに決まる: 「どこに置くか」「起票するか」「どの方式にするか」のように、回答が決まった候補のどれかになる
  - id: rule-form-choice-flow-03
    group: 決まりの表し方の選び方 判定フローチャート
    name: ※2 前の回答で次の質問が変わる
    body: |-
      - ※2 前の回答で次の質問が変わる: 質問を順に問い、回答によって次に問う質問が変わる。
        全ての条件を毎回確認し、組み合わせで結果が決まるなら判定表にする（例: Issue か PR か × 相手 × 行に紐づくか）
  - id: rule-form-choice-flow-04
    group: 決まりの表し方の選び方 判定フローチャート
    name: ※3 全ての項目を満たしたか
    body: |-
      - ※3 全ての項目を満たしたか: 作業の完了・レビューの前に、漏れが無いかを 1 項目ずつ確認する。
        項目の順番は問わないか、実行の順に並べるだけ
  - id: rule-form-choice-flow-05
    group: 決まりの表し方の選び方 判定フローチャート
    name: ※4 値を導く
    body: |-
      - ※4 値を導く: タイムアウト・上限・見積もりのように、元の値から数値を導く
  - id: rule-form-choice-example-01
    group: 見分け方の例
    name: 書かれ方と表し方
    body: |-
      | 書かれ方 | 表し方 |
      | --- | --- |
      | 「〜の場合は A、〜でなければ B。B のうち〜のときは C」 | 判定フローチャート |
      | 「Issue なら〜、PR で行に紐づくなら〜、紐づかないなら〜」（条件が独立） | 判定表 |
      | 質問の YES・NO がどれも同じ結果へ行き、最後だけ別の結果になる（「1 つでも当たれば A」「全て当たれば B」） | 判定表 |
      | 「〜したか」「〜が揃っているか」を並べる | チェックシート |
      | 「まず〜、次に〜、最後に〜」 | 手順 |
  - id: rule-form-choice-result-01
    group: 結果ごとの書き方
    name: 結果ごとの書式
    body: |-
      | 結果 | 書式 |
      | --- | --- |
      | 判定フローチャート | [テンプレート: 判定フローチャート](id:template-flowchart) |
      | 判定表 | [テンプレート: 判定表](id:template-decision-table) |
      | チェックシート | [テンプレート: チェックシート](id:template-checksheet) |
      | 手順（ステップ） | [ドキュメントの部品](id:doc-parts) のステップ |

      表し方を決めた後、規約の中を図・表・箇条書き・文のどれで記載するかは [表し方の選び方](id:flowchart-presentation-choice) で決める。
