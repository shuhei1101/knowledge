id: flowchart-screen-state-retention
kind: flowchart
name: 画面の状態の保持先 判定フローチャート
description: 画面の一時的な状態を URL・サーバー・Web Storage・Cookie・ルーターの機能・メモリのどこに保持するかをスタックによらず判定し、画面の状態の保持先を決めるときに参照する。
aliases:
  - 画面の状態の保持先
inject_when:
  field: text
  op: contains
  values:
    - 画面
    - UI
    - フロントエンド
    - tsx
    - HTML
    - コンポーネント
status: current
visibility: internal
rev: 2
related: []
sources:
  - title: 'TanStack Router: Scroll Restoration'
    url: https://tanstack.com/router/latest/docs/framework/react/guide/scroll-restoration
    note: 既定のキーは履歴の項目ごとの __TSR_key
  - title: 'MDN: Window.sessionStorage'
    url: https://developer.mozilla.org/en-US/docs/Web/API/Window/sessionStorage
    note: タブごとのセッションで、再読み込みを越えて残り、タブを閉じると消える
  - title: 'MDN: History.scrollRestoration'
    url: https://developer.mozilla.org/en-US/docs/Web/API/History/scrollRestoration
  - title: 'web.dev: Back/forward cache'
    url: https://web.dev/articles/bfcache
    note: bfcache は SPA の中の移動では有効でない。unload を使用しない
  - title: 'OWASP: HTML5 Security Cheat Sheet'
    url: https://cheatsheetseries.owasp.org/cheatsheets/HTML5_Security_Cheat_Sheet.html
    note: 機密を Web Storage に配置しない
items:
  - id: overview
    name: 概要
    body: |-
      画面の一時的な状態を URL・サーバー・Web Storage・Cookie・ルーターの機能・メモリのどこに保持するかをスタックによらず判定し、画面の状態の保持先を決めるときに参照する。
      React のフロントエンドの値の配置先は、この判定の後に [React の状態の置き場所](id:flowchart-react-state-placement) で決める。
  - id: screen-state-retention-flow-01
    group: 画面の状態の保持先 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "画面の状態の保持先"} -->

      ```mermaid
      flowchart TB
        start(("画面の状態の保持先を決めたい"))
        q0{"機密（トークン・個人情報）か"}
        r0(["URL と Web Storage に配置しない。認証は httpOnly の Cookie"])
        q1{"URL を共有・ブックマークすると、同じ表示になってほしいか"}
        q2{"何を表示しているか（画面・項目）か"}
        r1(["URL のパス"])
        r2(["URL のクエリ"])
        q3{"端末を変えても残したいか"}
        r3(["サーバー"])
        q4{"ブラウザを閉じても残す、端末ごとの好みか"}
        r4(["localStorage。最初の描画で要るなら Cookie"])
        q5{"そのタブで画面を離れて戻ったときに戻したいか"}
        q6{"戻る・進むの履歴の項目ごとに違ってよいか（ページ全体のスクロール位置など）"}
        r5(["ルーターの機能か history.state"])
        r6(["sessionStorage（画面とタブを表すキー）"])
        q7{"再読み込みを越えて残したいか"}
        r7(["sessionStorage"])
        r8(["メモリ"])
        start --> q0
        q0 -->|YES| r0
        q0 -->|NO| q1
        q1 -->|YES| q2
        q1 -->|NO| q3
        q2 -->|YES| r1
        q2 -->|NO| r2
        q3 -->|YES| r3
        q3 -->|NO| q4
        q4 -->|YES| r4
        q4 -->|NO| q5
        q5 -->|YES| q6
        q5 -->|NO| q7
        q6 -->|YES| r5
        q6 -->|NO| r6
        q7 -->|YES| r7
        q7 -->|NO| r8
      ```

      <!-- map-data: {"version": 1, "notes": {"r2": {"annotations": ["screen-state-retention-n1"]}, "r5": {"annotations": ["screen-state-retention-n2"]}, "r6": {"annotations": ["screen-state-retention-n3"]}}} -->

      <!-- /map -->

      ※[screen-state-retention-n1]: URL のクエリに配置する値: タブ・絞り込み・並べ替え・ページ。
          戻る・進むで 1 つずつ戻る。
          外から入る値なので検証する。
          スクロール位置・入力途中の値は出さない

      ※[screen-state-retention-n2]: ルーターの機能: 戻る・進むで戻すスクロール位置は、ルーターの機能で履歴の項目ごとに持つ（React は [URL の状態](id:react-state-url-state#scroll-restoration-01)）。
          history.state には小さな値か Storage のキーだけを持つ。
          スクロール位置の決まりは [入力と文言](id:ui-input-wording#scroll-restoration-01) に従う

      ※[screen-state-retention-n3]: 再度入ったときの復元: URL にも値を持つ状態は URL を優先する。
          sessionStorage の値は URL に値が無いときだけ使用し、使用したら URL に replace で反映する
