      <!-- /flow -->
  - id: screen-state-retention-flow-02
    group: 画面の状態の保持先 判定フローチャート
    name: ※1 URL のクエリに配置する値
    body: '- **※1 URL のクエリに配置する値**: タブ・絞り込み・並べ替え・ページ。戻る・進むで 1 つずつ戻る。外から入る値なので検証する。スクロール位置・入力途中の値は出さない'
  - id: screen-state-retention-flow-03
    group: 画面の状態の保持先 判定フローチャート
    name: ※2 ルーターの機能
    body: '- **※2 ルーターの機能**: 戻る・進むで戻すスクロール位置は、ルーターの機能で履歴の項目ごとに持つ（React は [URL の状態](id:react-state-url-state#scroll-restoration-01)）。history.state には小さな値か Storage のキーだけを持つ。スクロール位置の決まりは [入力と文言](id:ui-input-wording#scroll-restoration-01) に従う'
  - id: screen-state-retention-flow-04
    group: 画面の状態の保持先 判定フローチャート
    name: ※3 入り直したときの復元
    body: '- **※3 入り直したときの復元**: URL にも値を持つ状態は URL を優先する。sessionStorage の値は URL に値が無いときだけ使用し、使用したら URL に replace で書き戻す'
