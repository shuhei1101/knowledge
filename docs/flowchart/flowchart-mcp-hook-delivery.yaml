      ```

      <!-- /flow -->
  - id: mcp-hook-delivery-flow-02
    group: MCP・フックの渡し方 判定フローチャート
    name: ※1 起動する場所が決まらないセッション
    body: |-
      - ※1 起動する場所が決まらないセッション: 手元の任意のフォルダで開くセッションや、プロジェクトを問わず全エージェントが使用するもの。
        例: project-index・rule-inject
  - id: mcp-hook-delivery-flow-03
    group: MCP・フックの渡し方 判定フローチャート
    name: ※2 起動する側のプログラム
    body: |-
      - ※2 起動する側のプログラム: AI Monitor のエージェント・aituber のノードの `claude -p` のように、プログラムが起動のコマンドと作業フォルダを決めるもの
  - id: mcp-hook-delivery-flow-04
    group: MCP・フックの渡し方 判定フローチャート
    name: ※3 起動の引数
    body: |-
      - ※3 起動の引数: MCP は `--mcp-config`（ほかの MCP を参照させないときは `--strict-mcp-config` も）で指定する。
        フック・許可・ツールの絞り込みは `--settings` のファイルで指定する
  - id: mcp-hook-delivery-flow-05
    group: MCP・フックの渡し方 判定フローチャート
    name: ※4 リポジトリのファイル
    body: |-
      - ※4 リポジトリのファイル: 人がリポジトリの中（作業ツリーを含む）で起動するときに使用する。
        `.mcp.json` のサーバーは、`.claude/settings.json` の `enabledMcpjsonServers` で承認しておく
  - id: delivery-target-01
    group: 渡すものごとの置き場所
    name: 指定するものごとの配置先の表
    body: |-
      <!-- table: data -->

      | 指定するもの | プラグイン | 起動の引数 | リポジトリのファイル |
      | --- | --- | --- | --- |
      | MCP の接続先 | プラグインの `.mcp.json` | `--mcp-config` | `.mcp.json` |
      | フック | プラグインの `hooks/hooks.json` | `--settings` の `hooks` | `.claude/settings.json` の `hooks` |
      | 使用方法の説明・手順 | MCP の `instructions` | MCP の `instructions` | MCP の `instructions` |
      | 起動時の処理（サーバーの起動・環境変数の設定・後片付け） | SessionStart のフック | `--settings` の SessionStart のフック | `.claude/settings.json` の SessionStart のフック |
      | ツールの絞り込み | 持てない | `--settings` の `permissions.deny`・`--disallowedTools` | `.claude/settings.json` の `permissions.deny` |
      | 更新の反映 | バージョンを上げて配り、各端末で更新する | 起動のたびに今のファイルを読み込む | ブランチの今のファイルを読み込む |

      <!-- /table -->

      使用方法の説明・手順と起動時の処理の配置先は、判定フローチャート [エージェントに渡す文・処理の置き場所](id:flowchart-session-context-placement) で決める。
