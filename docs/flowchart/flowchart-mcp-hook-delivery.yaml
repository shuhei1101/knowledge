items:
  - id: overview
    name: 概要
    body: |-
      Claude Code のセッションへ MCP・フック・ツールの絞り込みを指定するとき、プラグイン・起動の引数・リポジトリのファイルのどれにするかを判定する。
      機能を MCP・フックのどれにするかは、判定フローチャート [機能を呼ぶインターフェースの選び方](id:flowchart-interface-choice) で決める。
  - id: mcp-hook-delivery-flow-01
    group: MCP・フックの渡し方 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- flow -->

      ```json
      {
        "title": "MCP・フックの渡し方",
        "scope": "セッションへ MCP・フックを指定するとき",
        "updated": "2026-11-03",
        "width": 948,
        "height": 756,
        "nodes": [
          {"id": "start", "kind": "start", "x": 414, "y": 24, "w": 120, "h": 120, "name": "セッションへ MCP・フックを指定したい"},
          {"id": "q1", "kind": "question", "x": 334, "y": 200, "w": 280, "h": 164, "name": "起動する場所が決まらないセッションでも使用するか ※1"},
          {"id": "r1", "kind": "result", "x": 684, "y": 254, "w": 240, "h": 56, "name": "プラグインにして配る"},
          {"id": "q2", "kind": "question", "x": 334, "y": 420, "w": 280, "h": 164, "name": "起動する側のプログラムが起動のコマンドを組み立てるか ※2"},
          {"id": "r2", "kind": "result", "x": 24, "y": 466, "w": 240, "h": 72, "name": "起動の引数で指定する ※3"},
          {"id": "r3", "kind": "result", "x": 354, "y": 640, "w": 240, "h": 92, "name": "リポジトリに .mcp.json と .claude/settings.json を配置する ※4"}
        ],
        "wires": [
          {"id": "j-start-q1", "from": "start", "to": "q1", "line": "flow", "points": [[474, 144], [474, 200]]},
          {"id": "j-q1-r1", "from": "q1", "to": "r1", "line": "flow", "points": [[614, 282], [684, 282]], "label": "YES", "labelAt": [649, 282]},
          {"id": "j-q1-q2", "from": "q1", "to": "q2", "line": "flow", "points": [[474, 364], [474, 420]], "label": "NO", "labelAt": [474, 392]},
          {"id": "j-q2-r2", "from": "q2", "to": "r2", "line": "flow", "points": [[334, 502], [264, 502]], "label": "YES", "labelAt": [299, 502]},
          {"id": "j-q2-r3", "from": "q2", "to": "r3", "line": "flow", "points": [[474, 584], [474, 640]], "label": "NO", "labelAt": [474, 612]}
