description: Claude Code のセッションへ MCP・フック・ツールの絞り込みを指定するとき、プラグイン・起動の引数・リポジトリのファイルのどれにするかを判定し、MCP サーバーやフックをセッションへ指定する方法を決めるときに参照する。
aliases:
  - MCP・フックの渡し方
tags:
  - name: scope:判定フローチャート
  - name: topic:判定フローチャート
  - name: topic:フローチャート
  - name: topic:プラグイン
    main: true
  - name: topic:フック
  - name: topic:サーバー
  - name: topic:セッション
  - name: topic:引数
  - name: topic:リポジトリ
  - name: topic:設定
  - name: tool:mcp
