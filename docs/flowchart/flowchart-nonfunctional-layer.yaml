      <!-- /flow -->
  - id: nonfunctional-layer-flow-02
    group: 非機能要件のレイヤー 判定フローチャート
    name: ※1 外部の制約
    body: |-
      - ※1 外部の制約: 外部 API の上限・外部ライブラリの制限・実行基盤の公開仕様・PC の性能など、バージョンが特定できる資料で裏付けられる値
  - id: nonfunctional-layer-flow-03
    group: 非機能要件のレイヤー 判定フローチャート
    name: ※2 コンポーネントをまたいで適用される
    body: |-
      - ※2 コンポーネントをまたいで適用される: 複数のサブシステムが同じ値を守らないと成立しないもの（API のレート制限・全体のコストの予算・外部の障害のときの挙動）。
        1 コンポーネントの中で閉じるもの（画面の応答時間・ユーザビリティ・プレビューの表示）はサブシステムレベル
  - id: nonfunctional-layer-flow-04
    group: 非機能要件のレイヤー 判定フローチャート
    name: ※3 ユーザーが値を示している
    body: |-
      - ※3 ユーザーが値を示している: コストの予算・想定の利用者数のように、外部から逆算できず、ユーザーの意向で決まる値
  - id: nonfunctional-layer-flow-05
    group: 非機能要件のレイヤー 判定フローチャート
    name: ※4 自分たちで決めてよい値
    body: |-
      - ※4 自分たちで決めてよい値: 外部の制約もユーザーの指定も無い項目のうち、運用上こちらで決めきれるもの（ログの保存期間・ログレベル・リトライの回数 等）。
        ユーザーの意思決定を待たないと決まらないもの（コストの予算・想定の利用者数）は未確定で残す
