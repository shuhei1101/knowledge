# yaml-language-server: $schema=../../schemas/flowchart.schema.yaml
id: flowchart-presentation-choice
kind: flowchart
name: 表し方の選び方 判定フローチャート
description: 文書・設計書の中身を図・表・箇条書き・文のどれで表すかを判定し、表し方に迷ったときに参照する。
aliases:
  - 表し方の選び方
tags:
  - name: scope:判定フローチャート
  - name: topic:判定フローチャート
  - name: topic:フローチャート
  - name: topic:表し方
    main: true
  - name: topic:文書
  - name: topic:設計書
  - name: topic:図
  - name: topic:テーブル
  - name: topic:箇条書き
  - name: topic:手順
  - name: topic:文章
  - name: action:判定
  - name: action:選択
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      文書・設計書の中身を図・表・箇条書き・文のどれで表すかを判定し、表し方を迷ったときに参照する。
  - id: presentation-choice-before-01
    name: 前段の判定
    body: |-
      判断・作業の決まりを記載するときは、先に [決まりの表し方の選び方](id:flowchart-rule-form-choice) で判定フローチャート・判定表・チェックシート・手順・規約のどれにするかを決める。
  - id: presentation-choice-flow-01
    group: 表し方の選び方 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "表し方の選び方"} -->

      ```mermaid
      flowchart TB
        start(("表し方を選びたい内容がある"))
        q1{"つながり・順番・包含・時間の流れ・数の大小を伝えるか"}
        q6{"図で表せない値（全文のラベル・補足）があるか"}
        r1(["図にし、図で表せない値を図の下に閉じた表で配置する"])
        r2(["図だけにする"])
        q2{"同じ属性を持つ項目が 2 件以上あるか"}
        r3(["表にする"])
        q3{"1 つの項目の属性が 3 つ以上あるか"}
        r4(["「項目 / 値」の 2 列の表にする"])
        q4{"順番のある手順か"}
        r5(["番号付きの箇条書きかステップの部品にする"])
        q5{"短い事柄が並列に 2 つ以上あるか"}
        r6(["箇条書きにする"])
        r7(["文で記載する（1 文 1 行。長ければ折りたたむ）"])
        start --> q1
        q1 -->|YES| q6
        q1 -->|NO| q2
        q6 -->|YES| r1
        q6 -->|NO| r2
        q2 -->|YES| r3
        q2 -->|NO| q3
        q3 -->|NO| q4
        q3 -->|YES| r4
        q4 -->|YES| r5
        q4 -->|NO| q5
        q5 -->|NO| r7
        q5 -->|YES| r6
      ```

      <!-- map-data: {"version": 1, "notes": {"r1": {"annotations": ["presentation-choice-n1"]}, "r2": {"annotations": ["presentation-choice-n1"]}}} -->

      <!-- /map -->

      ※[presentation-choice-n1]: 図の種類: 規約 [表し方の優先順位](id:convention-doc-presentation) の、伝えるものと図の種類の表で選ぶ
