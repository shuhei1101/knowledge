id: flowchart-sidebar-group-split
kind: flowchart
name: サイドバーのグループの分け方 判定フローチャート
description: dev-docs のサイドバーの 1 つのグループを分けるかと、主題のタグ・機能・フォルダのどれで分けるかを判定し、配信の設定（project-index.yaml の nav）のグループを記載・見直すときに参照する。
aliases:
  - サイドバーのグループの分け方
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: dev-docs のサイドバーの 1 つのグループを分けるかと、主題のタグ・機能・フォルダのどれで分けるかを判定する。
  - id: sidebar-group-split-flow-01
    group: サイドバーのグループの分け方 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "サイドバーのグループの分け方"} -->

      ```mermaid
      flowchart TB
        start(("サイドバーのグループに文書を並べたい"))
        q0{"1 つのグループの文書が 10 件を超えるか"}
        r0(["分けずに並べる"])
        q1{"主題のタグの値で 2 つ以上のグループに分かれるか"}
        r1(["auto.group_by に tags[main].name を記載する"])
        q2{"機能を表す項目の値で 2 つ以上のグループに分かれるか"}
        r2(["auto.group_by にその項目のパスを記載する"])
        q3{"文書が 2 つ以上のフォルダに分かれて配置されているか"}
        r3(["auto.group_by に '@folder' を記載する"])
        q4{"主題のタグを持たない文書があるか"}
        a1["文書に主題のタグを付ける"]
        r4(["分けずに並べる"])
        start --> q0
        q0 -->|NO| r0
        q0 -->|YES| q1
        q1 -->|YES| r1
        q1 -->|NO| q2
        q2 -->|YES| r2
        q2 -->|NO| q3
        q3 -->|YES| r3
        q3 -->|NO| q4
        q4 -->|YES| a1
        q4 -->|NO| r4
        a1 --> q1
      ```

      <!-- map-data: {"version": 1, "notes": {"q0": {"annotations": ["sidebar-group-split-n1"]}, "q1": {"annotations": ["sidebar-group-split-n2"]}, "q2": {"annotations": ["sidebar-group-split-n3"]}}} -->

      <!-- /map -->

      ※[sidebar-group-split-n1]: 1 つのグループの文書: `group` か `auto` の 1 つが並べる文書。
          目次（`kind: index`）は数えない。

      ※[sidebar-group-split-n2]: 主題のタグ: 文書のタグのうち `main: true` のタグ。
          全てのグループが 1 件ずつになるときは、分かれるとしない。

      ※[sidebar-group-split-n3]: 機能を表す項目: サブシステム・ユースケースなど、利用者の作業か機能の単位を値に持つ文書の項目。
  - id: sidebar-group-split-flow-02
    group: サイドバーのグループの分け方 判定フローチャート
    name: 分けた後のグループ
    body: 分けた後のグループも 10 件を超えるときは、入れ子が 2 階層を超えない範囲で、そのグループに同じ判定を適用する。
tags:
  - name: scope:判定フローチャート
  - name: topic:サイドバー
    main: true
  - name: topic:グループ
  - name: topic:ナビゲーション
  - name: topic:判定フローチャート
  - name: topic:設定
  - name: tool:dev-docs
  - name: tool:project-index
  - name: action:判定
