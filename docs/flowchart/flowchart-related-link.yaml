items:
  - id: overview
    name: 概要
    body: |-
      文書に関連を張るか、type は何か、片側だけに記載するか両側に記載するかを判定する。
  - id: related-link-flow-01
    group: 関連の張り方 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "関連の張り方"} -->

      ```mermaid
      flowchart TB
        start(("文書に関連を張りたい相手がいる"))
        q0{"files.yaml の行の関連か"}
        r0(["ドキュメント管理の files-yaml-04 で type を選ぶ"])
        q1{"いつ参照するか（when）を 1 文で記載できるか"}
        r1(["関連を張らない"])
        q2{"本文でリンクしている相手か"}
        r1_2(["関連を張らない"])
        q3{"この文書が相手の文書を置き換えるか"}
        r2(["この文書の related だけに replaces を記載する"])
        q4{"この文書は相手の文書の一部か"}
        r3(["この文書の related だけに part_of を記載する"])
        q5{"一方を修正したらもう一方も修正が要る組か"}
        r4(["両方の文書の related に change_together を記載する"])
        q6{"この文書に従う前に相手の文書を参照する必要があるか"}
        r5(["この文書の related だけに requires を記載する"])
        r6(["この文書の related だけに references を記載する"])
        start --> q0
        q0 -->|NO| q1
        q0 -->|YES| r0
        q1 -->|NO| r1
        q1 -->|YES| q2
        q2 -->|NO| q3
        q2 -->|YES| r1_2
        q3 -->|YES| r2
        q3 -->|NO| q4
        q4 -->|NO| q5
        q4 -->|YES| r3
        q5 -->|YES| r4
        q5 -->|NO| q6
        q6 -->|YES| r5
        q6 -->|NO| r6
      ```

      <!-- map-data: {"version": 1, "notes": {"q3": {"annotations": ["related-link-n1"]}, "q4": {"annotations": ["related-link-n2"]}, "q5": {"annotations": ["related-link-n3"]}, "q6": {"annotations": ["related-link-n4"]}, "r6": {"annotations": ["related-link-n5"]}}} -->

      <!-- /map -->

      ※[related-link-n1]: replaces: この文書が相手の文書に取って代わり、相手の文書は古くなる

      ※[related-link-n2]: part_of: 相手の文書の内容を分けた 1 つがこの文書で、全体は相手の文書にある

      ※[related-link-n3]: change_together: 一方を修正したらもう一方も同じ変更の対象になり、修正し忘れを検査で見つけたい

      ※[related-link-n4]: requires: 相手の文書を参照せずに進めると、この文書の決まりに違反する

      ※[related-link-n5]: references: 相手の文書を参照すると判断の材料が増えるが、参照しなくても進められる