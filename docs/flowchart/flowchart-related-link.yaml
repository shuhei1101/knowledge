      <!-- /flow -->
  - id: related-link-flow-02
    group: 関連の張り方 判定フローチャート
    name: ※1 replaces
    body: |-
      - ※1 replaces: この文書が相手の文書に取って代わり、相手の文書は古くなる
  - id: related-link-flow-03
    group: 関連の張り方 判定フローチャート
    name: ※2 part_of
    body: |-
      - ※2 part_of: 相手の文書の内容を分けた 1 つがこの文書で、全体は相手の文書にある
  - id: related-link-flow-04
    group: 関連の張り方 判定フローチャート
    name: ※3 change_together
    body: |-
      - ※3 change_together: 一方を修正したらもう一方も同じ変更の対象になり、修正し忘れを検査で見つけたい
  - id: related-link-flow-05
    group: 関連の張り方 判定フローチャート
    name: ※4 requires
    body: |-
      - ※4 requires: 相手の文書を参照せずに進めると、この文書の決まりに違反する
  - id: related-link-flow-06
    group: 関連の張り方 判定フローチャート
    name: ※5 references
    body: |-
      - ※5 references: 相手の文書を参照すると判断の材料が増えるが、参照しなくても進められる
