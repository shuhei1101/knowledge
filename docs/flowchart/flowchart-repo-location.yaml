items:
  - id: overview
    name: 概要
    body: |-
      WSL で開発するリポジトリを Windows のドライブ（`/mnt/c`）と Linux 側のどちらに配置するかを判定し、リポジトリをクローンする場所・移す先を決めるときに参照する。

      新規のリポジトリはクローンする場所に、既存のリポジトリは移す先に、判定の結果を適用する。
  - id: repo-location-flow-01
    group: リポジトリの置き場所 判定フローチャート
    name: 判定フロー
