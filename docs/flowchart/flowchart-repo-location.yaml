      <!-- /flow -->
  - id: repo-location-flow-02
    group: リポジトリの置き場所 判定フローチャート
    name: ※1 Windows の上で実行する
    body: |-
      - ※1 Windows の上で実行する: Windows の Python・Windows のタスクスケジューラーが、リポジトリのコード・スクリプトを起動する。
        Windows 専用の依存（`sys_platform == "win32"` の依存・`pywinauto`・`pywin32`・`pycaw`）を使用するコードを含む。
        人がファイルを開いて編集するアプリは含めず、※4 の質問で判定する
  - id: repo-location-flow-03
    group: リポジトリの置き場所 判定フローチャート
    name: ※2 書き換えのたびに読み込む
    body: |-
      - ※2 書き換えのたびに読み込む: WSL 側で編集・生成したファイルを、commit を挟まずに Windows の上で読み込んで実行する。
        Windows 側で動かす前に最新の commit を取得すれば足りるものは含めない
  - id: repo-location-flow-04
    group: リポジトリの置き場所 判定フローチャート
    name: ※3 /mnt/c の別のクローン
    body: |-
      - ※3 /mnt/c の別のクローン: 同じリモートのクローンを `/mnt/c` にもう 1 つ持つ。
        Windows 側で動かす前は、`git pull` でそのクローンを最新の状態にする。
        開発・テスト・commit は Linux 側のクローンで行い、`/mnt/c` のクローンでは編集しない
  - id: repo-location-flow-05
    group: リポジトリの置き場所 判定フローチャート
    name: ※4 日常的に開く
    body: '- ※4 日常的に開く: エクスプローラー・Windows 側のエディタ・Windows のアプリで、作業のたびにリポジトリのファイルを開く'
  - id: repo-location-flow-06
    group: リポジトリの置き場所 判定フローチャート
    name: ※5 \\wsl.localhost のパスを開いて保存できる
    body: |-
      - ※5 \\wsl.localhost のパスを開いて保存できる: `\\wsl.localhost\{ディストリビューション名}\...` のパスでファイルを開いて保存できる。
        VS Code の WSL の拡張機能のように、WSL の中でファイルを開くものも含む
