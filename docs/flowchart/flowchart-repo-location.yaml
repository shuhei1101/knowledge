items:
  - id: overview
    name: 概要
    body: |-
      WSL で開発するリポジトリを Windows のドライブ（`/mnt/c`）と Linux 側のどちらに配置するかを判定し、リポジトリをクローンする場所・移す先を決めるときに参照する。

      新規のリポジトリはクローンする場所に、既存のリポジトリは移す先に、判定の結果を適用する。
  - id: repo-location-flow-01
    group: リポジトリの置き場所 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "リポジトリの置き場所"} -->

      ```mermaid
      flowchart TB
        start(("リポジトリの配置先を決めたい"))
        q1{"Windows の上でリポジトリのコード・スクリプトを実行するか"}
        q2{"WSL 側で書き換えた作業中のファイルを、書き換えのたびに Windows の上で読み込んで実行するか"}
        r1(["/mnt/c に配置する"])
        r2(["Linux 側に配置し、Windows 側で動かすものは /mnt/c の別のクローンから動かす"])
        q3{"Windows のアプリでリポジトリのファイルを日常的に開くか"}
        r3(["Linux 側に配置する"])
        q4{"そのアプリが \\wsl.localhost のパスを開いて保存できるか"}
        r4(["Linux 側に配置する"])
        r5(["/mnt/c に配置する"])
        start --> q1
        q1 -->|YES| q2
        q2 -->|YES| r1
        q2 -->|NO| r2
        q1 -->|NO| q3
        q3 -->|NO| r3
        q3 -->|YES| q4
        q4 -->|YES| r4
        q4 -->|NO| r5
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["repo-location-n1"]}, "q2": {"annotations": ["repo-location-n2"]}, "r2": {"annotations": ["repo-location-n3"]}, "q3": {"annotations": ["repo-location-n4"]}, "q4": {"annotations": ["repo-location-n5"]}}} -->

      <!-- /map -->

      ※[repo-location-n1]: Windows の上で実行する: Windows の Python・Windows のタスクスケジューラーが、リポジトリのコード・スクリプトを起動する。
          Windows 専用の依存（`sys_platform == "win32"` の依存・`pywinauto`・`pywin32`・`pycaw`）を使用するコードを含む。
          人がファイルを開いて編集するアプリは含めず、※4 の質問で判定する。

      ※[repo-location-n2]: 書き換えのたびに読み込む: WSL 側で編集・生成したファイルを、commit を挟まずに Windows の上で読み込んで実行する。
          Windows 側で動かす前に最新の commit を取得すれば足りるものは含めない。

      ※[repo-location-n3]: /mnt/c の別のクローン: 同じリモートのクローンを `/mnt/c` にもう 1 つ持つ。
          Windows 側で動かす前は、`git pull` でそのクローンを最新の状態にする。
          開発・テスト・commit は Linux 側のクローンで行い、`/mnt/c` のクローンでは編集しない。

      ※[repo-location-n4]: 日常的に開く: エクスプローラー・Windows 側のエディタ・Windows のアプリで、作業のたびにリポジトリのファイルを開く。

      ※[repo-location-n5]: \\wsl.localhost のパスを開いて保存できる: WSL 側のパスでファイルを開いて保存できる。
          パスは `\\wsl.localhost\{ディストリビューション名}\...`。
          VS Code の WSL の拡張機能のように、WSL の中でファイルを開くものも含む。
