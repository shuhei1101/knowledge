      <!-- /flow -->
  - id: accuracy-evaluation-flow-02
    group: 精度評価をするか 判定フローチャート
    name: ※1 Claude Code のエージェント
    body: '- ※1 Claude Code のエージェント: Claude Code のエージェント・サブエージェント・スキルで動き、判断して工程を進めるもの（例: 台本作成のノード・レビュアー）'
  - id: accuracy-evaluation-flow-03
    group: 精度評価をするか 判定フローチャート
    name: ※2 Mock
    body: |-
      - ※2 Mock: 決めた動きだけをする Mock にし、エージェントの判断はテストしない。
        記載方法は規約 [テストの種類と配置](id:python-testing-layers)・[結合テストの Mock パターン](id:python-testing-mock)・[E2E テスト（Playwright）](id:testing-core-e2e) に従う
  - id: accuracy-evaluation-flow-04
    group: 精度評価をするか 判定フローチャート
    name: ※3 生成物
    body: |-
      - ※3 生成物: セリフ・演出・要約など、出力そのものが利用者・視聴者に届くもの。
        後段の処理だけが参照する分類・振り分けの出力は含めない
  - id: accuracy-evaluation-flow-05
    group: 精度評価をするか 判定フローチャート
    name: ※4 基準で比べられる
    body: '- ※4 基準で比べられる: 評価ケースの入力に対して、合格基準（点数・ルーブリック・正解との一致）で出力の良し悪しを判定できる'
  - id: accuracy-evaluation-flow-06
    group: 精度評価をするか 判定フローチャート
    name: ※5 差し替える見込み
    body: '- ※5 差し替える見込み: モデルの更新・プロンプトの修正で、出力が前より悪くなっていないかを比べる必要がある'
