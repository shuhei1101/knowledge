id: flowchart-accuracy-evaluation
kind: flowchart
name: 精度評価をするか 判定フローチャート
description: LLM・意思決定モデルを使用するノードに精度評価をするか、エージェントとして E2E・結合テストで Mock にするか、精度評価をしないかを判定し、ノードの精度評価を設計するときに参照する。
aliases:
  - 精度評価をするか
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: LLM・意思決定モデルを使用するノードに精度評価をするか、エージェントとして E2E・結合テストで Mock にするか、精度評価をしないかを判定する。
  - id: accuracy-evaluation-flow-01
    group: 精度評価をするか 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "精度評価をするか"} -->

      ```mermaid
      flowchart TB
        start(("ノードの精度評価を決めたい"))
        q1{"LLM・意思決定モデルを使用するノードか"}
        r1(["精度評価をしない"])
        q2{"Claude Code のエージェントか"}
        r2(["精度評価をせず、E2E・結合テストでは Mock にする"])
        q3{"出力が利用者・視聴者に届く生成物か"}
        r3(["精度評価をしない"])
        q4{"出力の良し悪しを基準で比べられるか"}
        r4(["精度評価をしない"])
        q5{"モデル・プロンプトを差し替える見込みがあるか"}
        r5(["精度評価をしない"])
        r6(["精度評価をする（評価ケースと合格基準を設計する）"])
        start --> q1
        q1 -->|NO| r1
        q1 -->|YES| q2
        q2 -->|YES| r2
        q2 -->|NO| q3
        q3 -->|NO| r3
        q3 -->|YES| q4
        q4 -->|NO| r4
        q4 -->|YES| q5
        q5 -->|NO| r5
        q5 -->|YES| r6
      ```

      <!-- map-data: {"version": 1, "notes": {"q2": {"annotations": ["accuracy-evaluation-n1"]}, "r2": {"annotations": ["accuracy-evaluation-n2"]}, "q3": {"annotations": ["accuracy-evaluation-n3"]}, "q4": {"annotations": ["accuracy-evaluation-n4"]}, "q5": {"annotations": ["accuracy-evaluation-n5"]}}} -->

      <!-- /map -->

      ※[accuracy-evaluation-n1]: Claude Code のエージェント: Claude Code のエージェント・サブエージェント・スキルで動き、判断して工程を進めるもの。
          例: 台本作成のノード・レビュアー。

      ※[accuracy-evaluation-n2]: Mock: 決めた動きだけをする Mock にし、エージェントの判断はテストしない。
          記載方法は規約 [テストの種類と配置](id:python-testing-layers)・[結合テストの Mock パターン](id:python-testing-mock)・[E2E テスト（Playwright）](id:testing-core-e2e) に従う。

      ※[accuracy-evaluation-n3]: 生成物: セリフ・演出・要約など、出力そのものが利用者・視聴者に届くもの。
          後段の処理だけが参照する分類・振り分けの出力は含めない。

      ※[accuracy-evaluation-n4]: 基準で比べられる: 評価ケースの入力に対して、合格基準（点数・ルーブリック・正解との一致）で出力の良し悪しを判定できる。

      ※[accuracy-evaluation-n5]: 差し替える見込み: モデルの更新・プロンプトの修正で、出力が前より悪くなっていないかを比べる必要がある。
