id: flowchart-reuse-choice
kind: flowchart
name: 再利用と新規作成の選び方 判定フローチャート
description: 新しく作る関数・クラス・定数・型・設定のキー・部品の候補を、既存を使用する・既存を広げる・別に新しく作るのどれにするかを判定し、コードや部品を新しく作る前に参照する。
aliases:
  - 再利用と新規作成の選び方
status: current
visibility: internal
rev: 2
items:
  - id: overview
    name: 概要
    body: |-
      新しく作る関数・クラス・定数・型・設定のキー・部品の候補を、既存を使用する・既存を広げる・別に新しく作るのどれにするかを判定し、コードや部品を新しく作る前に参照する。
      候補ごとに 1 回判定する。
  - id: reuse-choice-flow-01
    group: 再利用と新規作成の選び方 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "再利用と新規作成の選び方"} -->

      ```mermaid
      flowchart TB
        start(("新しく作る候補がある"))
        q1{"同じ役割の既存があるか"}
        r1(["既存を使用する"])
        q2{"役割が似た既存があるか"}
        r2(["別に新しく作る（理由を記録する）"])
        q3{"既存と意味が同じ知識か"}
        r3(["既存を広げる"])
        q4{"同じ見た目のコードが 3 か所目になるか"}
        r4(["別に新しく作る（理由を記録する）"])
        q5{"広げると分岐用の引数が増えるか"}
        r5(["別に新しく作る（理由を記録する）"])
        r6(["既存を広げる（共通の配置先へ移す）"])
        start --> q1
        q1 -->|YES| r1
        q1 -->|NO| q2
        q2 -->|NO| r2
        q2 -->|YES| q3
        q3 -->|YES| r3
        q3 -->|NO| q4
        q4 -->|NO| r4
        q4 -->|YES| q5
        q5 -->|YES| r5
        q5 -->|NO| r6
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["reuse-choice-n1"]}, "q2": {"annotations": ["reuse-choice-n2"]}, "q3": {"annotations": ["reuse-choice-n3"]}, "q4": {"annotations": ["reuse-choice-n4"]}, "q5": {"annotations": ["reuse-choice-n5"]}}} -->

      <!-- /map -->

      ※[reuse-choice-n1]: 同じ役割の既存: 候補の名前の単語と役割の単語（言い換えを含む）で設計書を探し、次にコードを探して見つかった、入力・出力と意味が候補と同じもの。
          React の部品は規約 [コンポーネントカタログ](id:react-component-catalog) の「新しいコンポーネントを作る前」の順、単体 HTML の部品は規約 [共通層の先読み](id:html-components-prefetch-catalog) の順で探す。
          単体 HTML の汎用の部品は、別に新しく作るときも `common-layer-prefetch-05` のとおり共通層に作る

      ※[reuse-choice-n2]: 役割が似た既存: 扱うデータや処理の一部が候補と同じで、入力・出力か意味が違うもの

      ※[reuse-choice-n3]: 既存と意味が同じ知識: 業務ルール・定数・スキーマ・API の型のうち、既存と意味が同じで入力・出力の構造だけが違うもの。
          意味が違う知識は、値が同じでもまとめない。
          規約 [設計原則](id:dev-design-principles) の `dedup-01` のとおり、1 回目から 1 か所にまとめる

      ※[reuse-choice-n4]: 3 か所目: 既存の 2 か所と候補で、同じ見た目のコードが 3 か所になる（規約 [設計原則](id:dev-design-principles) の `dedup-02`）

      ※[reuse-choice-n5]: 分岐用の引数: 呼び出し元ごとに処理を切り替えるための引数（フラグ・種類の値）。
          規約 [設計原則](id:dev-design-principles) の `dedup-02` のとおり、増えるなら共通化しない
