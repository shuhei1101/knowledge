      <!-- /flow -->
  - id: reuse-choice-flow-02
    group: 既存を使用するか新しく作るか 判定フローチャート
    name: ※1 同じ役割の既存
    body: |-
      - ※1 同じ役割の既存: 候補の名前の単語と役割の単語（言い換えを含む）で設計書を探し、次にコードを探して見つかった、入力・出力と意味が候補と同じもの。
        React の部品は規約 [コンポーネントカタログ](id:react-component-catalog) の「新しいコンポーネントを作る前」の順、単体 HTML の部品は規約 [共通層の先読み](id:html-components-prefetch-catalog) の順で探す
  - id: reuse-choice-flow-03
    group: 既存を使用するか新しく作るか 判定フローチャート
    name: ※2 役割が似た既存
    body: '- ※2 役割が似た既存: 扱うデータや処理の一部が候補と同じで、入力・出力か意味が違うもの'
  - id: reuse-choice-flow-04
    group: 既存を使用するか新しく作るか 判定フローチャート
    name: ※3 知識
    body: |-
      - ※3 知識: 業務ルール・定数・スキーマ・API の型。
        規約 [設計原則](id:dev-design-principles) の `dedup-01` のとおり、1 回目から 1 か所にまとめる
  - id: reuse-choice-flow-05
    group: 既存を使用するか新しく作るか 判定フローチャート
    name: ※4 3 か所目
    body: '- ※4 3 か所目: 既存の 2 か所と候補で、同じ見た目のコードが 3 か所になる（規約 [設計原則](id:dev-design-principles) の `dedup-02`）'
  - id: reuse-choice-flow-06
    group: 既存を使用するか新しく作るか 判定フローチャート
    name: ※5 分岐用の引数
    body: |-
      - ※5 分岐用の引数: 呼び出し元ごとに処理を切り替えるための引数（フラグ・種類の値）。
        規約 [設計原則](id:dev-design-principles) の `dedup-02` のとおり、増えるなら共通化しない
