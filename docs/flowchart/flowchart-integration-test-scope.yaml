id: flowchart-integration-test-scope
kind: flowchart
name: 結合テストの実行範囲 判定フローチャート
description: 変更したファイルごとに、結合テストを実行しない・そのテストだけ・全件・入口のテスト・対応するフォルダ・関係するテストのどれにするかを判定し、作業 PR で結合テストの範囲を決めるときに参照する。
aliases:
  - 結合テストの実行範囲
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      変更したファイルごとに、結合テストを実行しない・そのテストだけ・全件・入口のテスト・対応するフォルダ・関係するテストのどれにするかを判定し、作業 PR で結合テストの範囲を決めるときに参照する。

      実行の単位は、テスト実行方法の層のうち、全件実行のコマンドを持つ結合テストの層。
      判定に使用する一覧と対応表は、テスト実行方法の層が持つ。
      範囲はコスト（時間・端末の資源・Issue の対応の遅れ・並列不可の作業とスケジュールへの影響）を最優先に決め、迷ったら少ない側にする。
