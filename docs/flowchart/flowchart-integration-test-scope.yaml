  - id: integration-test-scope-flow-02
    group: 結合テストの実行範囲 判定フローチャート
    name: ※1 変更したファイル
    body: |-
      - ※1 変更したファイル: マージ先のブランチとの分岐点からの差分のファイル。
        `git diff --name-only $(git merge-base HEAD origin/{マージ先のブランチ})` で取得し、1 つずつ判定する。
        削除・改名したファイルは変更の前のパスで、生成物は生成元と同じ判定にする。
        全て判定したら結果を合わせて実行範囲の表にし、どれかのファイルが全件なら、その実行の単位は全件にする
  - id: integration-test-scope-flow-03
    group: 結合テストの実行範囲 判定フローチャート
    name: ※2 実行に影響しないパスの一覧
    body: |-
      - ※2 実行に影響しないパスの一覧: テスト実行方法の層の `excluded_paths`。
        一覧に無いファイルは、影響するものとして次の質問へ進む
  - id: integration-test-scope-flow-04
    group: 結合テストの実行範囲 判定フローチャート
    name: ※3 全件にするパスの一覧
    body: |-
      - ※3 全件にするパスの一覧: テスト実行方法の層の `full_run_paths`。
        行ごとに、全件が必要だと分かっている理由を持つ
  - id: integration-test-scope-flow-05
    group: 結合テストの実行範囲 判定フローチャート
    name: ※4 フォルダの対応表
    body: |-
      - ※4 フォルダの対応表: テスト実行方法の層の `folder_map`。
        一覧と対応表のどれにも無いファイルは、全件にせず R7 へ進む。
        層が `test_selector` を持つときは、Q4・Q5 の代わりに、その道具の結果を実行する結合テストにする
  - id: integration-test-scope-flow-06
    group: 結合テストの実行範囲 判定フローチャート
    name: ※5 入口と test_file の記録
    body: |-
      - ※5 入口と test_file の記録: 入口は、結合テストの 1 ファイルが対象にする単位（1 つのエンドポイント・1 つの MCP のツール・1 つの画面・1 つのフック）。
        変更したファイルが、1 つの入口のインターフェース定義の `impl_files`・画面設計の `screen` と `impl_files` にだけ載り、その入口に `test_file` があるときだけ YES。
        複数の入口が使用するファイルと、どの入口の記録にも無いファイルは NO にし、ファイルの名前から入口を推定しない
  - id: integration-test-scope-flow-07
    group: 結合テストの実行範囲 判定フローチャート
    name: ※6 実行の単位の間の契約
    body: |-
      - ※6 実行の単位の間の契約: 実行の単位が 2 つ以上のリポジトリにあり、単位の間の API のリクエストとレスポンス・データベースのスキーマ・ファイルの形式を変えたとき YES。
        契約の相手の側の対応する結合テストのフォルダを特定できないときは、相手の単位を全件にする。
        実行の単位が 1 つのリポジトリでは、常に NO
  - id: integration-test-scope-flow-08
    group: 結合テストの実行範囲 判定フローチャート
    name: ※7 関係すると分かった結合テスト
    body: |-
      - ※7 関係すると分かった結合テスト: 変更したファイルを参照する結合テストを調べて、関係すると分かったテストのファイル。
        分からないときは、新規作成したテストだけにする。
        「分からない」を、全件を実行する理由にしない
  - id: integration-test-scope-table-01
    group: 実行範囲の表
    name: 実行範囲の表の列
    body: |-
      判定した結果は、実行する前に次の列の表にして、レビューで確認を受ける。

      | 列 | 記載する内容 |
      | --- | --- |
      | 変更したファイル | ※1 の差分のファイル。全て記載する |
      | 結果 | 判定フローチャートの結果（R1〜R7）と、該当した一覧・対応表の行 |
      | 実行する結合テスト | テストのファイルかフォルダのパス。全件のときは「全件」と、全件が必要だと分かっている理由 |
      | 結合テストが無い入口 | 対応する結合テストのフォルダが空か、入口に `test_file` が無いとき、その入口と、単体テスト・E2E のどれで確認するか |

      結果を合わせた範囲が空のときは、結合テストを実行せず、理由を「影響しない」と「結合テストが無い」に分けて記載する。
      実行するコマンドは、テスト実行方法の層の個別実行の `{結合テストのパス}` に、実行する結合テストを並べる。
      並列の数は、続けて判定フローチャート [結合テストの並列の数](id:flowchart-integration-test-parallelism) で決める。
