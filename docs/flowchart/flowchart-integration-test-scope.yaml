id: flowchart-integration-test-scope
kind: flowchart
name: 結合テストの実行範囲 判定フローチャート
description: 変更したファイルごとに、結合テストを実行しない・そのテストだけ・全件・エントリーポイントのテスト・対応するフォルダ・関係するテストのどれにするかを判定し、結合テストの範囲を決めるときに参照する。
aliases:
  - 結合テストの実行範囲
status: current
visibility: internal
rev: 2
items:
  - id: overview
    name: 概要
    body: |-
      変更したファイルごとに、結合テストを実行しない・そのテストだけ・全件・エントリーポイントのテスト・対応するフォルダ・関係するテストのどれにするかを判定し、結合テストの範囲を決めるときに参照する。

      実行の単位は、テスト実行方法の層のうち、全件実行のコマンドを持つ結合テストの層。
      判定に使用する一覧と対応表は、テスト実行方法の層が持つ。
      範囲はコスト（時間・端末の資源・Issue の対応の遅れ・並列不可の作業とスケジュールへの影響）を最優先に決め、迷ったら少ない側にする。
  - id: integration-test-scope-flow-01
    group: 結合テストの実行範囲 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "結合テストの実行範囲"} -->

      ```mermaid
      flowchart TB
        start(("作業 PR で結合テストを実行する"))
        q0{"スプリントの区切りのタグを打つ前の確認か、利用者が全件を指示したか"}
        r0(["全ての実行の単位の全件を実行する"])
        a0["変更したファイルを 1 つ取る"]
        q1{"実行に影響しないパスの一覧にあるか"}
        r1(["このファイルの分は実行しない"])
        q2{"結合テストのファイルか"}
        r2(["その結合テストのファイルを実行する"])
        q3{"全件にするパスの一覧にあるか"}
        r3(["その実行の単位の全件を実行する"])
        q4{"フォルダの対応表にあるか"}
        q5{"1 つのエントリーポイントの実装で、そのエントリーポイントに test_file の記録があるか"}
        r4(["そのエントリーポイントの test_file を実行する"])
        r5(["対応する結合テストのフォルダの全てを実行する"])
        q6{"実行の単位の間の契約を変えるか"}
        r7(["関係すると分かった結合テストだけを実行する"])
        r6(["契約の相手の、対応する結合テストのフォルダも実行する"])
        r8(["契約の相手の分は追加しない"])
        start --> q0
        q0 -->|YES| r0
        q0 -->|NO| a0
        a0 --> q1
        q1 -->|YES| r1
        q1 -->|NO| q2
        q2 -->|YES| r2
        q2 -->|NO| q3
        q3 -->|YES| r3
        q3 -->|NO| q4
        q4 -->|NO| r7
        q4 -->|YES| q5
        q5 -->|YES| r4
        q5 -->|NO| r5
        r5 --> q6
        r4 --> q6
        r3 --> q6
        r7 --> q6
        q6 -->|YES| r6
        q6 -->|NO| r8
      ```

      <!-- map-data: {"version": 1, "notes": {"a0": {"annotations": ["integration-test-scope-n1"]}, "q1": {"annotations": ["integration-test-scope-n2"]}, "q3": {"annotations": ["integration-test-scope-n3"]}, "q4": {"annotations": ["integration-test-scope-n4"]}, "q5": {"annotations": ["integration-test-scope-n5"]}, "q6": {"annotations": ["integration-test-scope-n6"]}, "r7": {"annotations": ["integration-test-scope-n7"]}}} -->

      <!-- /map -->

      ※[integration-test-scope-n1]: 変更したファイル: マージ先のブランチとの分岐点からの差分のファイル。
          `git diff --name-only $(git merge-base HEAD origin/{マージ先のブランチ})` で取得し、1 つずつ判定する。
          削除・改名したファイルは変更の前のパスで、生成物は生成元と同じ判定にする。
          全て判定したら結果を合わせて実行範囲の表にし、どれかのファイルが全件なら、その実行の単位は全件にする。

      ※[integration-test-scope-n2]: 実行に影響しないパスの一覧: テスト実行方法の層の `excluded_paths`。
          一覧に無いファイルは、影響するものとして次の質問へ進む。

      ※[integration-test-scope-n3]: 全件にするパスの一覧: テスト実行方法の層の `full_run_paths`。
          行ごとに、全件が必要だと分かっている理由を持つ。

      ※[integration-test-scope-n4]: フォルダの対応表: テスト実行方法の層の `folder_map`。
          一覧と対応表のどれにも無いファイルは、全件にせず R7 へ進む。
          層が `test_selector` を持つときは、Q4・Q5 の代わりに、その道具の結果を実行する結合テストにする。

      ※[integration-test-scope-n5]: エントリーポイントと test_file の記録: エントリーポイントは、結合テストの 1 ファイルが対象にする単位。
          例: 1 つのエンドポイント・1 つの MCP のツール・1 つの画面・1 つのフック。
          変更したファイルが、1 つのエントリーポイントのインターフェース定義の `impl_files`・画面設計の `screen` と `impl_files` にだけ載るかを確認する。
          載っていて、そのエントリーポイントに `test_file` があるときだけ YES。
          複数のエントリーポイントが使用するファイルと、どのエントリーポイントの記録にも無いファイルは NO にし、ファイルの名前からエントリーポイントを推定しない。

      ※[integration-test-scope-n6]: 実行の単位の間の契約: 実行の単位が 2 つ以上のリポジトリにあり、単位の間の契約を変えたとき YES。
          契約は、API のリクエストとレスポンス・データベースのスキーマ・ファイルの形式。
          契約の相手の側の対応する結合テストのフォルダを特定できないときは、相手の単位を全件にする。
          実行の単位が 1 つのリポジトリでは、常に NO。

      ※[integration-test-scope-n7]: 関係すると分かった結合テスト: 変更したファイルを参照する結合テストを調べて、関係すると分かったテストのファイル。
          分からないときは、新規作成したテストだけにする。
          「分からない」を、全件を実行する理由にしない。
  - id: integration-test-scope-table-01
    group: 実行範囲の表
    name: 実行範囲の表の列
    body: |-
      判定した結果は、実行する前に次の列の表にして、レビューで確認を受ける。

      | 列 | 記載する内容 |
      | --- | --- |
      | 変更したファイル | ※[integration-test-scope-n1] の差分のファイル。全て記載する |
      | 結果 | 判定フローチャートの結果（R0〜R8）と、該当した一覧・対応表の行 |
      | 実行する結合テスト | テストのファイルかフォルダのパス。全件のときは「全件」と、全件が必要だと分かっている理由 |
      | 結合テストが無いエントリーポイント | 対応する結合テストのフォルダが空か、エントリーポイントに `test_file` が無いとき、そのエントリーポイントと、単体テスト・E2E のどれで確認するか |

      結果を合わせた範囲が空のときは、結合テストを実行せず、理由を「影響しない」と「結合テストが無い」に分けて記載する。
      実行するコマンドは、`location` が `runner` の層は `run_runner`、それ以外の層は `run_one` とし、`{結合テストのパス}` に実行する結合テストを並べる。
      並列数は、続けて判定フローチャート [結合テストの並列数](id:flowchart-integration-test-parallelism) で決める。
