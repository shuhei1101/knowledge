sources:
  - title: "The Twelve-Factor App: Config"
    url: https://12factor.net/config
    note: 環境ごとに変わる値はコードの外に配置する
  - title: XDG Base Directory Specification
    url: https://specifications.freedesktop.org/basedir/latest/
    note: ユーザーごとの設定は `~/.config`（`$XDG_CONFIG_HOME`）、状態は `~/.local/state`（`$XDG_STATE_HOME`）の下に配置する
  - title: "Microsoft: ASP.NET Core での開発時のアプリのシークレット"
    url: https://learn.microsoft.com/aspnet/core/security/app-secrets
    note: 開発時の秘匿値はプロジェクトのツリーの外（ユーザーのプロファイル）に配置する
  - title: OWASP Secrets Management Cheat Sheet
    url: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    note: 本番の秘匿値は secret manager に集め、コードにもログにも出さない
  - title: "Claude Code: Settings"
    url: https://code.claude.com/docs/en/settings
    note: ユーザー → プロジェクト（コミット）→ ローカル（git の外）の順に重ね、後のものが勝つ
  - title: "Vite: Env Variables and Modes"
    url: https://vite.dev/guide/env-and-mode
    note: "`.env.local` は git の外に配置し、その checkout だけの値を持つ"
items:
  - id: overview
    name: 概要
    body: |-
      設定値・秘匿値・定数を、リポジトリのどこに配置するか、リポジトリの外のどこに配置するかを判定する。

      プロンプト・キャラクターなどの定義・素材の一覧・評価のケース・カタログはこの判定の対象外で、[コンテンツの置き場所](id:dev-content-location) に従う。
  - id: config-location-flow-01
    group: 設定値の置き場所 判定フローチャート
    name: 判定フロー
    body: |-
      <!-- map: {"title": "設定値の置き場所"} -->

      ```mermaid
      flowchart TB
        start(("配置先を決めたい値がある"))
        q0{"秘匿値か"}
        q1{"本番・共有の環境で使用するか"}
        r1(["secret manager"])
        q2{"実装のフレームワークが .env.local を読み込むか"}
        r3([".env.local"])
        r2(["ホーム配下の秘匿ファイル"])
        q3{"実行中に書き換わる状態か"}
        r4(["データ（data/ 履歴・キャッシュ。git の外）"])
        q4{"人・マシン・環境ごとに変わる値か"}
        q5{"この checkout だけ値を変えたいか"}
        r6(["checkout の上書き"])
        r5(["ホームの設定"])
        q6{"ブランチでコードとバージョンを一致させたい値か"}
        r7(["コミットする既定値"])
        q7{"言語をまたいで使用するか"}
        r8(["コミットする定数の YAML"])
        q8{"同じ言語の複数のファイルで使用するか"}
        r9(["定数モジュール"])
        q9{"同じファイルの複数箇所で使用するか"}
        r10(["ファイル先頭の定数"])
        r11(["その場の名前付き変数"])
        start --> q0
        q0 -->|YES| q1
        q0 -->|NO| q3
        q1 -->|YES| r1
        q1 -->|NO| q2
        q2 -->|YES| r3
        q2 -->|NO| r2
        q3 -->|YES| r4
        q3 -->|NO| q4
        q4 -->|YES| q5
        q4 -->|NO| q6
        q5 -->|YES| r6
        q5 -->|NO| r5
        q6 -->|NO| q7
        q6 -->|YES| r7
        q7 -->|YES| r8
        q7 -->|NO| q8
        q8 -->|NO| q9
        q8 -->|YES| r9
        q9 -->|YES| r10
        q9 -->|NO| r11
      ```

      <!-- map-data: {"version": 1, "notes": {"q0": {"annotations": ["config-location-n1"]}, "q4": {"annotations": ["config-location-n2"]}, "q5": {"annotations": ["config-location-n3"]}, "q6": {"annotations": ["config-location-n4"]}, "r8": {"annotations": ["config-location-n5"]}, "r11": {"annotations": ["config-location-n6"]}}} -->

      <!-- /map -->

      ※[config-location-n1]: 秘匿値: API キー・パスワード・トークン・秘密鍵など、漏れると悪用される値。
          git の管理下とログのどちらにも配置しない。

      ※[config-location-n2]: 環境の値: 接続先・費用の上限・マシンごとのパスなど、構造はほぼ変わらず値だけが人・マシン・環境で変わる値。

      ※[config-location-n3]: checkout の上書き: ブランチで試したい値など、その clone だけで変える値。
          リポジトリ直下の `settings.local.yaml`（git の外）に記載する。

      ※[config-location-n4]: 既定値: 項目の一覧・辞書と既定値（retry・timeout・機能フラグなど、コードを変えずに調整する値）。
          最大長のようにコードの前提になる値は含めない。
          項目の構造の原本で、ブランチのコードと同じバージョンで読み込めるようリポジトリにコミットする。

      ※[config-location-n5]: 定数の YAML: ラベル名のように、コードと文書が言語をまたいで共有する定数の原本（`config/constants.yaml` 等）。
          設定の 3 レイヤーに入れず、環境の値や checkout の上書きで上書きされない。

      ※[config-location-n6]: その場の名前付き変数: 使用する 1 か所の近くで値に名前を付ける。
          値だけでは意味が読み取れないときも、その場で名前を付ける。
  - id: three-layers-01
    group: 設定の 3 レイヤー
    name: 3 レイヤーの案内
    body: |-
      設定は次の 3 レイヤーに配置し、後のレイヤーが勝つ。
  - id: three-layers-02
    group: 設定の 3 レイヤー
    name: 3 レイヤーの表
    body: |-
      | レイヤー | 配置先 | git | 持つ値 |
      | --- | --- | --- | --- |
      | 既定値 | リポジトリの `config/defaults.yaml` | 管理する | 項目の一覧と既定値 |
      | 環境の値 | `${XDG_CONFIG_HOME:-~/.config}/{project}/settings.yaml`（秘匿値だけ分けるときは `${XDG_CONFIG_HOME:-~/.config}/{project}/secrets/`） | 管理外（ホーム配下） | 接続先・秘匿値・費用の上限など |
      | checkout の上書き | リポジトリ直下の `settings.local.yaml` | 管理外（`.gitignore`） | その checkout だけの値 |
  - id: three-layers-03
    group: 設定の 3 レイヤー
    name: 読み込む順
    body: |-
      - 読み込む順は 既定値 → 環境の値 → checkout の上書き。
        checkout の上書きは無ければ飛ばし、在るのに読み込めなければ既定値と同じくエラーにする
  - id: three-layers-04
    group: 設定の 3 レイヤー
    name: 既定値が読み込めないときはエラー
    body: |-
      - 既定値が読み込めないときはエラーにする
  - id: three-layers-05
    group: 設定の 3 レイヤー
    name: その実行だけ値を変えるとき
    body: |-
      - その実行だけ値を変えるときは、環境変数・引数で上書きする（3 レイヤーのどれよりも優先する）
        - ツールの環境変数は、`{ツール名}_CONFIG`（設定のパス）・`{ツール名}_PORT`（ポート）・`{ツール名}_STATE_DIR`（状態の配置先）と名付ける
          - `{ツール名}` はツール名を大文字にし、`-` を `_` にした名前
  - id: three-layers-06
    group: 設定の 3 レイヤー
    name: 追加・改名があっても他のブランチを動かせる
    body: |-
      - ブランチで既定値へ移した項目を追加・改名しても、ホームの設定を書き換えずに他のブランチの checkout を動かせる
  - id: three-layers-07
    group: 設定の 3 レイヤー
    name: サンプルファイルの用意
    body: |-
      - 環境の値と秘匿値のファイルには、実値を入れないサンプル（`settings.sample.yaml`、`.env.local` なら `.env.sample`）を対でコミットし、必要なキーの一覧にする
  - id: three-layers-08
    group: 設定の 3 レイヤー
    name: リポジトリの外で動くツールの状態
    body: '- リポジトリの外で動くツール（プラグイン・常駐サーバー）は、実行中に書き換わる状態・ログを `${XDG_STATE_HOME:-~/.local/state}/{ツール名}` に配置する'
