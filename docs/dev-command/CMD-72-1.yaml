id: "CMD-72-1"
visibility: internal
title: "開発コマンド"
categories:
  - name: 環境構築（クローン直後）
    prerequisites:
      - WSL では、npm のグローバルの置き場所が Linux 側のファイルシステムにある（`/mnt/c` の `node_modules` の maid は 1 回の起動に 9〜14 秒かかる）
    commands: |-
      1. mermaid の検査に使う maid を PATH から引ける場所に入れる

      ```bash
      npm install -g @probelabs/maid@0.0.29
      ```

      2. 入口のスクリプトごとに、ロックの依存を uv のキャッシュに入れる（初回の起動で依存の取得に 20 秒を超えないようにする）

      ```bash
      uv sync --script scripts/knowledge_checks.py
      uv sync --script scripts/knowledge_markdown.py
      uv sync --script scripts/check_all.py
      uv sync --script scripts/build_pages.py
      uv sync --script scripts/build_word_list.py
      uv sync --script scripts/build_templates.py
      ```

      3. 全ての文書の検査が呼ぶ markdownlint-cli2・textlint とルールを、ロック（`scripts/lint/package-lock.json`）のバージョンで `scripts/lint/node_modules/` に入れる

      ```bash
      npm ci --prefix scripts/lint
      ```
    verification:
      state: 済
      date: '2026-11-06'
      detail: WSL2 で maid 0.0.29 を入れ、`maid - --format json` が 0.35 秒で終了コード 0 を返した。3 つのスクリプトの `uv sync --script` がロックの依存を入れた（2026-10-31）。worktree で `npm ci --prefix scripts/lint` を実行し、`scripts/lint/node_modules/.bin/` に `markdownlint-cli2`・`textlint` が入った（2026-11-05）。worktree で `uv sync --script scripts/build_templates.py` がロックの依存を入れた（2026-11-06）
  - name: 取り込み後の追従（pull 後）
    commands: |-
      1. ロック（`scripts/*.py.lock`）が変わったときは、入口のスクリプトごとに依存を入れ直す

      ```bash
      uv sync --script scripts/knowledge_checks.py
      uv sync --script scripts/knowledge_markdown.py
      uv sync --script scripts/check_all.py
      uv sync --script scripts/build_pages.py
      uv sync --script scripts/build_word_list.py
      uv sync --script scripts/build_templates.py
      ```

      2. `scripts/lint/package-lock.json` が変わったときは、lint の CLI とルールを入れ直す

      ```bash
      npm ci --prefix scripts/lint
      ```
    verification:
      state: 済
      date: '2026-11-05'
      detail: 3 つのスクリプトで実行し、ロックの依存が入っていることを確かめた（2026-10-31）。2 は環境構築の 3 と同じコマンドで確かめた（2026-11-05）。`build_templates.py` の 1 は環境構築の 2 と同じコマンドで確かめた（2026-11-06）
  - name: 依存の追加・更新・削除
    commands: |-
      依存はスクリプトの PEP 723 のメタデータとロック（`{スクリプト}.py.lock`）が持つ。`pyproject.toml` は作らない。

      1. 依存を追加する（メタデータとロックを書き換える）

      ```bash
      uv add --script scripts/{スクリプト}.py "{パッケージ}{バージョンの指定}"
      ```

      2. 依存を上げる

      ```bash
      uv lock --script scripts/{スクリプト}.py --upgrade-package {パッケージ}
      ```

      3. 依存を外す

      ```bash
      uv remove --script scripts/{スクリプト}.py {パッケージ}
      ```

      4. maid のバージョンを上げるときは、環境構築と CI のワークフロー（`.github/workflows/docs-check.yml`）の `@probelabs/maid@{バージョン}` を揃えて書き換える

      5. markdownlint-cli2・textlint とルールのバージョンを上げるときは、完全なバージョンで `scripts/lint/package.json` とロックを書き換える

      ```bash
      npm install --prefix scripts/lint --save-exact {パッケージ}@{バージョン}
      ```
    verification:
      state: 済
      date: '2026-10-31'
      detail: 一時フォルダへコピーした `check_all.py` とロックで `uv add --script`・`uv lock --script --upgrade-package`・`uv remove --script` を実行し、メタデータとロックが書き換わることを確かめた
  - name: 起動・停止
    commands: 未確定
  - name: テスト
    refs:
      - TP-72-1#
  - name: 静的検査
    refs:
      - TP-72-1#layers[lint]
  - name: ビルド・生成
    prerequisites:
      - Node.js 24 以降（`npx -y` が mdmark のタグの中身と依存を呼ぶたびに取る。外部ライブラリ『mdmark』）
    commands: |-
      1. 公開の文書だけを 1 枚の HTML にまとめた Pages の成果物を `_site` に作る（IF『Pages の成果物の作成』）

      ```bash
      uv run --frozen --script scripts/build_pages.py --out _site
      ```

      2. 成果物に YAML が入っていないことを確かめる（CI のワークフローと同じ行。当たったパスを出して終了コード 1、無ければ 0）

      ```bash
      ! find _site -type f \( -name '*.yaml' -o -name '*.yml' \) | grep .
      ```

      3. 対応表の正本（`docs/word-list/word-list-ai-slop.yaml`）を変えたら、slop-check のフックが読むコピーを作り直し、正本と一緒に commit する（IF『対応表のコピーの作成』）

      ```bash
      uv run --frozen --script scripts/build_word_list.py
      ```

      4. 設計書のスキーマ（`schemas/design/`）を変えたら、`docs/template/` の設計書の種類のテンプレートを作り直し、スキーマと一緒に commit する（IF『設計書のテンプレートの生成』）

      ```bash
      uv run --frozen --script scripts/build_templates.py
      ```
    refs:
      - IF-137-1#
      - IF-137-2#constraints[YAML の検査]
      - LIB-137-1#
      - IF-148-2#
      - IF-201-1#
    verification:
      state: 済
      date: '2026-11-03'
      detail: WSL2 の Ubuntu（Node 24.14.0）で 1・2 のコマンドを実行した。公開の 5 文書が `_site/index.html` にまとまり（約 11 秒、終了コード 0）、YAML の検査は何も出さず終了コード 0 を返した（2026-10-31）。3 のコマンドは worktree で実行し、終了コード 0 で、正本から作り直したコピーが commit 済みのコピーと一致した（2026-11-03）。4 のコマンドは worktree で実行し、終了コード 0 で 15 件のテンプレートを書き出し、続けて全ての文書の検査が違反 0 件で終わった（2026-11-06）
    effects: 1 は約 11 秒（初回は `npx` が mdmark と依存を取る）。`_site` は中身を消してから書く。3 は `plugins/slop-check/hooks/post-tool-use/word-list-ai-slop.json` を上書きする。4 は `docs/template/` の設計書の種類のテンプレートのうち、スキーマから組み立てた `items` と違うものの `items` だけを上書きする
  - name: 取り込み前の検査
    prerequisites:
      - 環境構築（クローン直後）を流してある
    commands: |-
      1. CI と同じ、全ての文書の検査を流す（違反があれば終了コード 1 で、違反を 1 件 1 行で出す）

      ```bash
      uv run --frozen --script scripts/check_all.py
      ```

      2. 単体テストと静的検査は、テスト実行方法の各層の全件実行を流す
    effects: 文書 267 件で約 60 秒（WSL の `/mnt/c` の worktree。mermaid の図ごとに maid を起動し、markdownlint-cli2・textlint を 1 回ずつ起動する）。違反の行に加えて、警告にしたルールの違反を `warning:` の行で出す
    refs:
      - TP-72-1#layers[単体テスト（バック）]
      - TP-72-1#layers[lint]
    verification:
      state: 済
      date: '2026-11-05'
      detail: worktree で実行し、257 件の文書を約 10 秒で検査した。テンプレートの記述例の参照切れ 13 件で終了コード 1 を返した（2026-10-31）。lint を加えた後、267 件の文書を約 64 秒で検査し、違反 0 件・警告 837 件で終了コード 0 を返した（2026-11-05）
  - name: 管理作業
    commands: 未確定
prerequisites:
  - uv（`uv run --script` と `uv lock --script` が使えるバージョン。Python 3.14 は uv が入れる）
  - Node.js と npm（maid と、`scripts/lint/` の markdownlint-cli2・textlint を入れる）
