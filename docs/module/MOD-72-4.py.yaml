      2. `{キー}[i].id` を順に確認して、同じ配列の先に出た ID と同じなら違反にする（行は `{キー}[i].lc.value("id")` + 1）
         - `items` の場合、`path: items[{i}].id`・`{行} 行目: 項目の ID `{id}` が items[{先の添字}] と重複しています`・`項目の ID を文書の中で一意にする`
         - `aspects` の場合、`path: aspects[{i}].id`・`{行} 行目: 観点の ID `{id}` が aspects[{先の添字}] と重複しています`・`観点の ID を文書の中で一意にする`
      3. `items` の違反の後に `aspects` の違反をつないで返却する
