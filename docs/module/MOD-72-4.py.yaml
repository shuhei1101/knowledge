        expected: 空
      - name: test_check_duplicate_ids_when_aspects_duplicate
        case: 正常
        summary: 観点の ID の重複を違反にし、項目とは比べない
        condition: '`items` の ID が `a`、`aspects` の ID が `a`・`aspect-review-common-01`・`aspect-review-common-01`'
        mock: なし
        expected: 1 件で、`path` が `aspects[2].id`、`rule` が `観点の ID` と `aspects[1]` を含み、行が 3 つ目の観点の `id:` の行
    refs:
