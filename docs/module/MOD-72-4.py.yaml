id: "MOD-72-4"
visibility: internal
title: "検査と変換のスクリプト / scripts / knowledge_checks.py"
lead: project-index の validators の `knowledge-checks`。標準入力の文書 1 件に、項目の ID の重複・`id:` の参照と `related` の `to` の実在・`aliases` の衝突・文書の中の `aliases` の重複・Markdown の項目の markdownlint-cli2・textlint の違反・文書の YAML の yamllint の違反・map の点検のずれを適用し、違反の配列を返却する（IF-72-1）。
constants:
  - name: ID_LINK
    title: 'id: の参照'
    container: scripts/knowledge_checks.py
    usecase: 文書の違反の検査
    summary: 本文の `[{名前}](id:{文書の ID})`・`[{名前}](id:{文書の ID}#{項目の ID})` を取得する正規表現
    value: re.compile(r"\]\(id:([^)#\s]+)(?:#([^)\s]+))?\)")
  - name: FENCE
    title: コードブロックの囲み
    container: scripts/knowledge_checks.py
    usecase: 文書の違反の検査
    summary: 行頭のバッククォート 3 つ以上と情報文字列を取得する正規表現
    value: re.compile(r"^ {0,3}(`{3,})\s*(\S*)")
functions:
  - name: main
    title: 文書の違反の検査のエントリーポイント
    kind: 関数
    container: scripts/knowledge_checks.py
    usecase: 文書の違反の検査
    role: エントリーポイント
    scope: public
    summary: 標準入力の文書を検査し、違反の配列の JSON を標準出力へ出す
    args:
      - name: argv
        title: 引数
        type: Sequence[str] | None
        required: false
        default: None
        description: コマンドの引数。`None` は `sys.argv[1:]`。`--lint-dir`（lint の設定と `node_modules/.bin/` の markdownlint-cli2・textlint を持つフォルダ。既定は `_lint.py` の `DEFAULT_LINT_DIR`）だけを取る
    returns:
      type: int
      description: 終了コード。`0` = 検査を終えた（違反の有無に依らない）、`1` = 想定していない例外
    process: |-
      1. argparse で `--lint-dir` を読み込む
      2. 標準入出力を UTF-8 にする（`sys.stdin.reconfigure(encoding="utf-8")`・`sys.stdout` も同じ）
      3. 標準入力を読み込み、作業ディレクトリを配信元の直下にして検査する（文書の検査）
      4. 同じ文書に、`--lint-dir` で markdownlint-cli2・textlint（Markdown の lint の検査）と yamllint（yamllint の検査）を、続けて map の点検（map の点検）を適用し、違反をこの順に文書の検査の違反の後ろにつなぐ
      5. 違反の配列を `json.dumps(..., ensure_ascii=False)` で標準出力へ出し、`0` を返却する
         - 想定していない例外の場合、`traceback.print_exc()` で標準エラーへ出し `1` を返却する
    unit_tests:
      - name: test_main
        case: 正常
        summary: 違反の無い文書
        condition: '標準入力に違反の無い文書。作業ディレクトリは空の `docs/` と、`documents: []` の `project-index.yaml` を持つ一時フォルダ'
        mock: Markdown の lint の検査・yamllint の検査・map の点検を、空を返却する関数に差し替える
        expected: '`0` を返却し、標準出力が `[]`'
      - name: test_main_when_unexpected_error
        case: 正常
        summary: 想定していない例外
        condition: 文書の検査が `RuntimeError` を送出する
        mock: 文書の検査を `RuntimeError` を送出する関数に差し替える
        expected: '`1` を返却し、標準エラーに `Traceback` が出る'
      - name: test_main_when_lint_violations
        case: 正常
        summary: lint の違反をつなぐ
        condition: 標準入力に違反の無い文書。引数は `--lint-dir {一時フォルダ}`
        mock: Markdown の lint の検査・yamllint の検査を、受け取った lint のフォルダを記録して違反 1 件ずつを返却する関数に、map の点検を違反 1 件を返却する関数に差し替える
        expected: '`0` を返却し、標準出力が Markdown の lint・yamllint・map の点検の順の 3 件で、記録した lint のフォルダが 2 つとも `--lint-dir` の値'
    callees:
      - '#functions[check_document]'
      - '#functions[check_markdown_lints]'
      - '#functions[check_yamllint]'
      - '#functions[check_map]'
    refs:
      - to: IF-72-1
        type: requires
        when: "`main` を修正するときに、IF-72-1 の決まりと突き合わせる。"
  - name: check_document
    title: 文書の検査
    kind: 関数
    container: scripts/knowledge_checks.py
    usecase: 文書の違反の検査
    role: サービス
    scope: public
    summary: 文書 1 件に全ての検査を適用し、違反を並べて返却する
    args:
      - name: text
        title: 文書の YAML
        type: str
        required: true
        description: 検査する文書 1 件
      - name: root
        title: 配信元の直下
        type: Path
        required: true
        description: '`docs/**/*.yaml` を読み込むリポジトリの直下'
      - name: index
        title: ID の索引
        type: Mapping[str, frozenset[str]] | None
        required: false
        default: None
        passing: keyword
        description: 作った ID の索引。`None` ならこの関数で作る。全ての文書の検査が 1 度だけ作って指定する
      - name: names
        title: 名前の索引
        type: Mapping[str, Sequence[tuple[str, str]]] | None
        required: false
        default: None
        passing: keyword
        description: 作った名前の索引。`None` ならこの関数で `project-index.yaml` を読み込んで作る。全ての文書の検査が 1 度だけ作って指定する
    returns:
      type: list[Violation]
      description: 項目の ID の重複 → `id:` の参照 → `related` の `to` → `aliases` の衝突 → 文書の中の `aliases` の重複の順の違反
    process: |-
      1. 文書を読み込む（文書の読み込み）
         - 読み込めない文書の場合、`path: $`・`{行} 行目: YAML として読めません: {理由}`・`YAML の文法の誤りを修正する` の 1 件を返却する
      2. `index` が `None` なら ID の索引を作る（ID の索引の作成）
      3. `names` が `None` なら、`project-index.yaml` を読み込み（project-index.yaml の読み込み）、名前の索引を作る（名前の索引の作成）
         - `ConfigError` の場合、`aliases` の衝突の検査を適用せず、`path: $`・`1 行目: {理由}。aliases の衝突を検査できません`・`配信元の直下に読める project-index.yaml を置く` の違反を 1 件加える
      4. 項目の ID の重複・参照・`aliases` の衝突・文書の中の `aliases` の重複を順に検査し、違反をつないで返却する（項目の ID の重複の検査・参照の検査・aliases の衝突の検査・文書の中の aliases の重複の検査）。文書の中の `aliases` の重複の検査は、手順 3 の `ConfigError` の場合も適用する
      5. 最上位の `kind` が `word-list` なら、対応表の examples の検査の違反を後ろにつなぐ
    unit_tests:
      - name: test_check_document
        case: 正常
        summary: 違反を検査の順に並べる
        condition: '項目の ID が重なり、`[B](id:missing)` と `related` の `to: missing` を持つ文書。`index` に `a` だけ、`names` に `{}`'
        mock: 'なし'
        expected: 3 件で、`path` が `items[1].id`・`items[2].body`・`related[0].to` の順
      - name: test_check_document_when_word_list
        case: 正常
        summary: 対応表の examples の違反をつなぐ
        condition: '`kind: word-list` で、`examples.hit` の文が `ng` にヒットしない 1 行を持つ文書。`index`・`names` に `{}`'
        mock: 'なし'
        expected: '`path` が `entries[0].examples.hit[0]` の 1 件'
      - name: test_check_document_when_broken
        case: 正常
        summary: 読み込めない YAML
        condition: '`items:\n  - id: a\n    name: [`'
        mock: なし
        expected: '`path` が `$` の 1 件で、`rule` が `行目: YAML として読めません` を含む。索引を作らない'
      - name: test_check_document_when_aliases_collide
        case: 正常
        summary: aliases の衝突の違反を参照の後に並べる
        condition: '`id: b` で、`items[0].body` に `[B](id:missing)`、`aliases: [アルファ]` を持つ文書。`index` に `a` だけ、`names` に `{"アルファ": [("a", "aliases")]}`'
        mock: 'なし'
        expected: 2 件で、`path` が `items[0].body`・`aliases[0]` の順
      - name: test_check_document_when_config_missing
        case: 正常
        summary: project-index.yaml が無い
        condition: '`aliases: [アルファ]` を持つ文書。`index` に `{}`、`names` は指定しない。一時フォルダに `project-index.yaml` が無い'
        mock: 'なし'
        expected: '`path` が `$` の 1 件で、`rule` が `project-index.yaml` と `aliases の衝突を検査できません` を含む'
      - name: test_check_document_when_aliases_duplicate
        case: 正常
        summary: project-index.yaml が無くても文書の中の aliases の重複を検査する
        condition: '`aliases: [アルファ, ｱﾙﾌｧ]` を持つ文書。`index` に `{}`、`names` は指定しない。一時フォルダに `project-index.yaml` が無い'
        mock: 'なし'
        expected: 2 件で、`path` が `$`・`aliases[1]` の順
    callees:
      - MOD-72-2#functions[load_document]
      - MOD-72-2#functions[load_config]
      - '#functions[build_name_index]'
      - '#functions[check_aliases]'
      - '#functions[check_alias_duplicates]'
  - name: check_word_list
    title: 対応表の examples の検査
    kind: 関数
    container: scripts/knowledge_checks.py
    usecase: 文書の違反の検査
    scope: public
    summary: 対応表の各行の照合を examples の hit と pass に適用し、合わないものを違反にする
    args:
      - name: doc
        title: 文書
        type: CommentedMap
        required: true
        description: '`kind` が `word-list` の文書'
    returns:
      type: list[Violation]
      description: 行の並び、行の中は hit → pass の順の違反
    process: |-
      1. `entries[n]` ごとに照合の行を作る（MOD-148-2 の対応表の行の作成）
         - `re.error` の場合、`path: entries[{n}].pattern`・`{行} 行目: 正規表現として読めません: {理由}`・`Python の re で読める正規表現にする` の違反にし、その行の `examples` を適用しない
      2. `examples.hit[m]` に行の照合（MOD-148-2）を適用し、ヒットしなければ `path: entries[{n}].examples.hit[{m}]`・`{行} 行目: 「{例}」にヒットしません`・`pattern を修正するか、hit の例を修正する` にする
      3. `examples.pass[m]` がヒットすれば `path: entries[{n}].examples.pass[{m}]`・`{行} 行目: 「{例}」にヒットします`・`pattern か allow を修正するか、pass の例を修正する` にする
      4. 行は項目の行の引き当て（`line_of`）で求める
    unit_tests:
      - name: test_check_word_list
        case: 正常
        summary: hit・pass・正規表現の違反
        condition: '`hit: [直した]` の `直す` の行（`pattern: 直す`）、`pass: [形式]` の `形` の行（`pattern: 形`）、`pattern: "形("` の行'
        mock: なし
        expected: 3 件で、`path` が `entries[0].examples.hit[0]`・`entries[1].examples.pass[0]`・`entries[2].pattern`
      - name: test_check_word_list_when_valid
        case: 正常
        summary: examples が照合と合う
        condition: '`pattern: (?<![㐀-鿿々])形(?![㐀-鿿々])`・`hit: [この形で]`・`pass: [形式, 円形]` の行'
        mock: なし
        expected: 空
    callees:
      - MOD-148-2#functions[compile_entry]
      - MOD-148-2#functions[entry_hits]
      - MOD-72-2#functions[line_of]
    refs:
      - to: IF-72-1
        item: "constraints[対応表の `examples`]"
        type: requires
        when: "`check_word_list` を修正するときに、IF-72-1 の「対応表の `examples`」の決まりと突き合わせる。"
  - name: build_id_index
    title: ID の索引の作成
    kind: 関数
    container: scripts/knowledge_checks.py
    usecase: 文書の違反の検査
    role: 読み込み
    scope: public
    summary: 配信元の全ての文書から、文書の ID → 項目の ID の索引を作る
    args:
      - name: root
        title: 配信元の直下
        type: Path
        required: true
        description: '`docs/**/*.yaml` を読み込むリポジトリの直下'
    returns:
      type: dict[str, frozenset[str]]
      description: 文書の ID → `items[].id` の集合
    process: |-
      1. `root.glob("docs/**/*.yaml")` を並列に読み込む（ファイルの並列の読み込み）
      2. 各ファイルを読み込み（文書の読み込み）、最上位の `id` が文字列のものを、`items[]` の文字列の `id` の集合と並べて索引に入れる
         - 読み込めないファイル・読み込めない文書・`id` の無い文書の場合、そのファイルを飛ばす（その文書の誤りはその文書の検査で出る）
    unit_tests:
      - name: test_build_id_index
        case: 正常
        summary: 文書と項目の ID を集める
        condition: '`docs/rule/a.yaml`（項目 `x`・`y`）と `docs/guide/b.yaml`（項目なし）'
        mock: なし（一時ディレクトリ）
        expected: '`{"a": {"x", "y"}, "b": set()}`'
      - name: test_build_id_index_when_broken
        case: 正常
        summary: 読み込めない文書を飛ばす
        condition: '`docs/rule/a.yaml` と、読み込めない YAML の `docs/rule/c.yaml`'
        mock: なし（一時ディレクトリ）
        expected: '`a` だけを持つ'
    callees:
      - MOD-72-2#functions[read_texts]
      - MOD-72-2#functions[load_document]
  - name: normalize_name
    title: 名前の正規化
    kind: 関数
    container: scripts/knowledge_checks.py
    usecase: 文書の違反の検査
    role: ドメインロジック
    scope: public
    summary: 照合の前に、名前へ NFKC・前後の空白の除去・英字の大文字小文字の統一を適用する
    args:
      - name: value
        title: 名前
        type: str
        required: true
        description: 文書の `name` か `aliases` の要素
    returns:
      type: str
      description: 正規化した名前
    process: |-
      1. `unicodedata.normalize("NFKC", value).strip().casefold()` を返却する
    unit_tests:
      - name: test_normalize_name
        case: 正常
        summary: 全角・前後の空白・大文字
        condition: '`" ＡＬＰＨＡ 規約 "`'
        mock: なし
        expected: '`"alpha 規約"`'
    refs:
      - to: IF-72-1
        item: "constraints[`aliases` の衝突]"
        type: requires
        when: "`normalize_name` を修正するときに、IF-72-1 の「`aliases` の衝突」の決まりと突き合わせる。"
  - name: build_name_index
    title: 名前の索引の作成
    kind: 関数
    container: scripts/knowledge_checks.py
    usecase: 文書の違反の検査
    role: 読み込み
    scope: public
    summary: '`alias_type` を持つ行の文書（`records` を持つ行は要素）から、正規化した名前 → （文書の ID、`name` か `aliases`）の索引を作る'
    args:
      - name: root
        title: 配信元の直下
        type: Path
        required: true
        description: 行の `paths` の起点
      - name: rows
        title: documents の行
        type: Sequence[Mapping[str, Any]]
        required: true
        description: '`load_config` が返却した `documents[]` の行'
    returns:
      type: dict[str, list[tuple[str, str]]]
      description: 正規化した名前 → （文書の ID、`"name"` か `"aliases"`）の並び。同じ名前を持つ文書が複数あれば全てを並べる
    process: |-
      1. `alias_type` を持つ行ごとに、行のファイルを列挙する（documents の行のファイルの列挙）
      2. 列挙したファイルを並列に読み込む（ファイルの並列の読み込み）
      3. 各ファイルを読み込み（文書の読み込み）、照合の相手を取り出す。行が `records` を持たないときは文書そのもの 1 件、行が `records` を持つときは文書の `records` のキーの配列の要素ごとに 1 件
         - 読み込めないファイル・読み込めない文書の場合、そのファイルを飛ばす（その文書の誤りはその文書の検査で出る）
         - `records` のキーの値が配列でない場合、そのファイルを飛ばす
      4. 相手ごとに、`id` が文字列の相手の `name`（文字列のとき）と `aliases` の文字列の要素を、名前の正規化を適用したキーで索引に加える
         - `id` の無い相手の場合、その相手を飛ばす
    unit_tests:
      - name: test_build_name_index
        case: 正常
        summary: alias_type を持つ行の文書だけを集める
        condition: '`docs/rule/*.yaml` の行が `alias_type: doc` を持ち、`docs/word-list/*.yaml` の行は持たない。`docs/rule/a.yaml`（`name: Alpha`・`aliases: [アルファ]`）と `docs/word-list/w.yaml`（`name: 単語表`）'
        mock: なし（一時ディレクトリ）
        expected: '`{"alpha": [("a", "name")], "アルファ": [("a", "aliases")]}`'
      - name: test_build_name_index_when_broken
        case: 正常
        summary: 読み込めない文書を飛ばす
        condition: '`docs/rule/a.yaml` と、読み込めない YAML の `docs/rule/c.yaml`'
        mock: なし（一時ディレクトリ）
        expected: '`a` の名前だけを持つ'
      - name: test_build_name_index_when_records
        case: 正常
        summary: records を持つ行の要素を集める
        condition: '`docs/terms.yaml` の行が `alias_type: term`・`records: terms` を持つ。`docs/terms.yaml` は `id: terms`・`name: 用語集` と、`terms` に `{id: ai-slop, name: AI slop, aliases: [AI らしい単語]}` と `id` の無い要素 `{name: 名前だけ}` を持つ'
        mock: なし（一時ディレクトリ）
        expected: '`{"ai slop": [("ai-slop", "name")], "ai らしい単語": [("ai-slop", "aliases")]}`（文書そのものの `用語集` と `id` の無い要素は入らない）'
    callees:
      - MOD-72-2#functions[list_row_files]
      - MOD-72-2#functions[read_texts]
      - MOD-72-2#functions[load_document]
      - '#functions[normalize_name]'
    refs:
      - to: IF-72-1
        item: "constraints[`aliases` の衝突]"
        type: requires
        when: "`build_name_index` を修正するときに、IF-72-1 の「`aliases` の衝突」の決まりと突き合わせる。"
  - name: check_aliases
    title: aliases の衝突の検査
    kind: 関数
    container: scripts/knowledge_checks.py
    usecase: 文書の違反の検査
    scope: public
    summary: '`aliases` の要素が、ほかの文書の `name`・`aliases` と正規化して一致したら違反にする'
    args:
      - name: doc
        title: 文書
        type: CommentedMap
        required: true
        description: 読み込んだ文書
      - name: names
        title: 名前の索引
        type: Mapping[str, Sequence[tuple[str, str]]]
        required: true
        description: '`build_name_index` が作った索引'
    returns:
      type: list[Violation]
      description: 衝突した `aliases[n]` ごとの違反を、`n` の順に並べる
    process: |-
      1. `aliases` が配列でなければ空を返却する
      2. 文字列の `aliases[n]` ごとに、名前の正規化を適用したキーの相手のうち、文書の ID が最上位の `id` と異なるものを取得する
