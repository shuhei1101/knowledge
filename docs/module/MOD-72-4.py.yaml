  - name: check_markdown_lints
    title: Markdown の lint の検査
    kind: 関数
    container: scripts/knowledge_checks.py
    usecase: 文書の違反の検査
    role: 外部呼び出し
    scope: public
    summary: 文書の Markdown の項目に markdownlint-cli2・textlint を適用し、error の違反を元の文書の行の違反で返却する
    args:
      - name: text
        title: 文書
        type: str
        required: true
        description: 標準入力の文書 1 件の YAML
      - name: lint_dir
        title: lint のフォルダ
        type: Path
        required: true
        description: '`--lint-dir` の値'
    returns:
      type: list[Violation]
      description: 'markdownlint-cli2 の違反の後に textlint の違反。CLI が無い・失敗したときは `path: $` の 1 件'
    process: |-
      1. `collect_sources(PurePosixPath("-.yaml"), text)` で Markdown の項目を取り出す
         - 空の場合（Markdown の項目が無いか、YAML として読み込めない）、空を返却する
      2. `find_lint_clis(lint_dir)` で markdownlint-cli2・textlint を探す
         - どちらかが見つからない場合、`path` が `$`、`rule` が `1 行目: {見つからない CLI を「・」でつないだもの} が {lint_dir}/node_modules/.bin/ に見つかりません`、`fix` が `npm ci --prefix scripts/lint を実行して markdownlint-cli2・textlint を入れる` の 1 件を返却する
      3. `run_markdown_lints(sources, lint_dir, clis)` を呼ぶ
         - `LintOutputError` の場合、`path` が `$`、`rule` が `1 行目: markdownlint-cli2・textlint を実行できません: {例外のメッセージ}`、`fix` が `npm ci --prefix scripts/lint を実行して markdownlint-cli2・textlint を再インストールする` の 1 件を返却する
      4. `warning` が `False` の `LintFinding` ごとに、`path` が `item_path`、`rule` が `{line} 行目: {tool}/{rule}: {message}`、`fix` が `文を書き換えて {tool} の {rule} の違反を無くす` の違反を作って返却する
    unit_tests:
      - name: test_check_markdown_lints
        case: 正常
        summary: error の違反を元の文書の行で返却する
        condition: '`items[0].body` を持つ文書。`node_modules/.bin/` に `markdownlint-cli2`・`textlint` を持つ一時フォルダ'
        mock: '`run_markdown_lints` を、`tool` `markdownlint`・`line` 3・`rule` `MD019`・`warning` `False` の 1 件、`tool` `textlint`・`line` 5・`rule` `ja-technical-writing/no-doubled-joshi`・`warning` `False` の 1 件、`warning` `True` の 1 件を返却する関数に差し替える'
        expected: '2 件で、`rule` が `3 行目: markdownlint/MD019: `・`5 行目: textlint/ja-technical-writing/no-doubled-joshi: ` で始まる順。`path` はどちらも `items[0].body`'
      - name: test_check_markdown_lints_when_no_markdown
        case: 正常
        summary: Markdown の項目が無い
        condition: '`body` の項目を持たない文書。存在しない lint のフォルダ'
        mock: '`run_markdown_lints` を、呼ばれたら失敗させる関数に差し替える'
        expected: 空
      - name: test_check_markdown_lints_when_missing
        case: 正常
        summary: markdownlint-cli2 が無い
        condition: '`items[0].body` を持つ文書。`node_modules/.bin/` に `textlint` だけを持つ一時フォルダ'
        mock: '`run_markdown_lints` を、呼ばれたら失敗させる関数に差し替える'
        expected: 1 件で、`path` が `$`、`rule` に `markdownlint-cli2` と lint のフォルダがあり `textlint` が無い、`fix` に `npm ci --prefix scripts/lint`
      - name: test_check_markdown_lints_when_failed
        case: 正常
        summary: CLI が失敗した
        condition: '`items[0].body` を持つ文書。`node_modules/.bin/` に `markdownlint-cli2`・`textlint` を持つ一時フォルダ'
        mock: '`run_markdown_lints` を、`LintOutputError("markdownlint-cli2 が終了コード 2 で終わりました: boom")` を送出する関数に差し替える'
        expected: 1 件で、`path` が `$`、`rule` に `終了コード 2` と `boom`
    callees:
      - MOD-176-1#functions[collect_sources]
      - MOD-176-1#functions[find_lint_clis]
      - MOD-176-1#functions[run_markdown_lints]
    refs:
      - to: IF-72-1
        item: constraints[markdownlint-cli2・textlint が無い・失敗したとき]
        type: requires
        when: '`check_markdown_lints` を修正するときに、IF-72-1 の「markdownlint-cli2」「textlint」「markdownlint-cli2・textlint が無い・失敗したとき」の決まりと突き合わせる。'
