  - name: check_alias_duplicates
    title: 文書の中の aliases の重複の検査
    kind: 関数
    container: scripts/knowledge_checks.py
    usecase: 文書の違反の検査
    scope: public
    summary: '`aliases` の要素が、自分の `name` か前の要素と正規化して一致したら違反にする'
    args:
      - name: doc
        title: 文書
        type: CommentedMap
        required: true
        description: 読み込んだ文書
    returns:
      type: list[Violation]
      description: 一致した `aliases[n]` ごとの違反を、`n` の順に並べる
    process: |-
      1. `aliases` が配列でなければ空を返却する
      2. 最上位の `name` が文字列なら、名前の正規化を適用した値を記録する。文字列でなければ記録せず、前の要素だけと照合する
      3. 文字列の `aliases[n]` を順に確認して、名前の正規化を適用した値を照合する。文字列でない要素は照合の相手にも入れない
         - 記録した `name` と一致する場合、`path: aliases[{n}]`・`{行} 行目: 別名 `{値}` が name と同じです`・`片方だけ登録する` の違反にする
         - `name` と一致せず、前の要素 `aliases[m]` と一致する場合、`path: aliases[{n}]`・`{行} 行目: 別名 `{値}` が aliases[{m}] と重複しています`・`片方だけ登録する` の違反にする。`m` は最初に出た要素の添字
         - どちらとも一致しない場合、値と添字を前の要素として記録する
         - 行は項目の行の引き当て（`line_of`）で求める
    unit_tests:
      - name: test_check_alias_duplicates
        case: 正常
        summary: name との一致と前の要素との重複
        condition: '`name: Beta 規約`・`aliases: [ベータ, " ｂｅｔａ 規約 ", べーた, " ベータ "]`'
        mock: なし
        expected: 2 件で、`path` が `aliases[1]`・`aliases[3]`。`aliases[1]` の `rule` に `name`、`aliases[3]` の `rule` に `aliases[0]` がある
      - name: test_check_alias_duplicates_when_no_name
        case: 正常
        summary: name を持たない文書
        condition: '`name` の無い文書で、`aliases: [アルファ, ｱﾙﾌｧ]`'
        mock: なし
        expected: 1 件で、`path` が `aliases[1]`、`rule` に `aliases[0]` がある
      - name: test_check_alias_duplicates_when_unique
        case: 正常
        summary: 重複が無い
        condition: '`name: Alpha`・`aliases: [アルファ, ベータ]`'
        mock: なし
        expected: 空
    callees:
      - '#functions[normalize_name]'
      - MOD-72-2#functions[line_of]
    refs:
      - to: IF-72-1
        item: "constraints[文書の中の `aliases` の重複]"
        type: requires
        when: "`check_alias_duplicates` を修正するときに、IF-72-1 の「文書の中の `aliases` の重複」の決まりと突き合わせる。"
  - name: check_duplicate_ids
