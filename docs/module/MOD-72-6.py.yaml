    role: サービス
    scope: public
    summary: 文書 1 件にスキーマの検査と文書の違反の検査を適用し、（行、項目のパス、内容）で返却する
    args:
      - name: target
        title: 検査する文書
        type: Target
        required: true
        description: '`list_targets` が返却した 1 件'
      - name: text
        title: 中身
        type: str | None
        required: true
        description: '`read_texts` が返却した中身。読み込めなかったときは `None`'
      - name: validator
        title: スキーマの検査器
        type: Draft202012Validator | str
        required: true
        description: '`build_validators` の値'
      - name: root
        title: リポジトリの直下
        type: Path
        required: true
        description: 文書の違反の検査へ指定する
      - name: index
        title: ID の索引
        type: Mapping[str, frozenset[str]]
        required: true
        description: '`build_id_index` が 1 度だけ作った索引'
      - name: names
        title: 名前の索引
        type: Mapping[str, Sequence[tuple[str, str]]]
        required: true
        description: '`build_name_index` が 1 度だけ作った索引'
    returns:
      type: list[tuple[int, str, str]]
      description: （文書の行、項目のパス、内容）。スキーマの違反の後に文書の違反
    process: |-
      1. `text` が `None` の場合、`(1, "$", "ファイルを UTF-8 で読めません")` だけを返却する
      2. 文書として読み込む（文書の読み込み）
         - 読み込めない文書の場合、`({行}, "$", "YAML として読めません: {理由}")` だけを返却する
      3. `validator` が文字列の場合、`(1, "$", "スキーマ {schema} を使えません: {理由}")` を加える。検査器の場合、`iter_errors` の誤りごとに `(行, 項目のパス, "schema: {message}")` を加える（項目の行の引き当て・項目のパスの組み立て）
      4. `target.checks` なら、文書の違反を検査し（文書の検査。`index` と `names` を指定する）、各違反の `rule` の先頭の `{行} 行目: ` を行に、残りを内容にして加える
    unit_tests:
      - name: test_check_target
        case: 正常
        summary: スキーマと文書の違反を並べる
        condition: '`description` が無く、項目の ID が重複した文書。`checks` が `True`'
        mock: なし
        expected: '`schema: ` で始まる内容の後に、`items[{添字}].id` の重複が行つきで並ぶ。内容に `行目: ` が残らない'
      - name: test_check_target_when_no_checks
        case: 正常
        summary: 文書の違反の検査を適用しない行
        condition: 項目の ID が重複し、スキーマには合う文書。`checks` が `False`
        mock: なし
        expected: 空
      - name: test_check_target_when_unreadable
        case: 正常
        summary: 読み込めないファイル
        condition: '`text` が `None`'
        mock: なし
        expected: '`(1, "$", ...)` の 1 件'
      - name: test_check_target_when_broken
        case: 正常
        summary: 読み込めない YAML
        condition: 括弧の閉じていない YAML
        mock: なし
        expected: '`$` の 1 件で、行が読み込めなかった行'
    callees:
      - MOD-72-2#functions[load_document]
      - MOD-72-2#functions[line_of]
      - MOD-72-2#functions[format_path]
      - MOD-72-4#functions[check_document]
notes:
  依存: PEP 723 のメタデータに `ruamel.yaml==0.19.1`（LIB-72-1）と `jsonschema>=4.26.0`（LIB-72-2）と `yamllint==1.38.0`（LIB-176-3）を記載し、`knowledge_checks.py`・`build_word_list.py`・`_lint.py` を同じフォルダから import する。
test_files:
  - tests/unit/scripts/test_check_all.py
