  - name: check_design_templates
    title: 設計書のテンプレートの検査
    kind: 関数
    container: scripts/check_all.py
    usecase: 全ての文書の検査
    scope: public
    summary: 種類のスキーマから組み立てた items が、対応するテンプレートの文書の items と一致するかを確認する
    args:
      - name: root
        title: リポジトリの直下
        type: Path
        required: true
        description: '`SCHEMAS_DIR`・`TEMPLATES_DIR` の起点'
    returns:
      type: list[tuple[str, int, str, str]]
      description: （ファイルのパス、行、項目のパス、内容）。全て一致すれば空
    process: |-
      1. `schemas/design/` が無ければ空を返却する
      2. 設計書のスキーマを `$ref` を確認せずに読み込む（設計書のスキーマの読み込み）
         - `BuildError` の場合、空を返却する（読み込めないスキーマは設計書のスキーマの検査が違反にする）
      3. 対応表に行がある種類のスキーマごとに、テンプレートの文書を読み込む（文書の読み込み）
         - 無い・読み込めないテンプレートの場合、`(テンプレートのパス, 1, "$", "テンプレートがありません: {スキーマのパス}")` を追加して次へ進む
      4. items を組み立て（items の組み立て）、テンプレートの `items` を `id`・`name`・`body` の組の並びにしたものと比べる
         - `BuildError` の場合、そのスキーマを比べない（`$ref` の誤りは設計書のスキーマの検査が違反にする）
         - 違う場合、`(テンプレートのパス, items のキーの行, "items", "テンプレートがスキーマ {スキーマのパス} と一致しません。{COMMAND} で作り直してください")` を追加する
      5. 追加した違反をパスの順に返却する
    unit_tests:
      - name: test_check_design_templates
        case: 正常
        summary: 一致する
        condition: '`er`・`common` のスキーマと、生成した `template-er.yaml`'
        mock: なし（一時ディレクトリ）
        expected: 空
      - name: test_check_design_templates_when_stale
        case: 正常
        summary: 一致しない
        condition: '`er.schema.yaml` のキーの `x-rules` に 1 件追加する前に生成した `template-er.yaml`'
        mock: なし（一時ディレクトリ）
        expected: '1 件で、パスが `docs/template/template-er.yaml`、行が `items:` の行、項目のパスが `items`、内容に `schemas/design/er.schema.yaml` と `build_templates.py` がある'
      - name: test_check_design_templates_when_template_missing
        case: 正常
        summary: テンプレートが無い
        condition: '`er`・`common` のスキーマだけで、`template-er.yaml` が無い'
        mock: なし（一時ディレクトリ）
        expected: 1 件で、パスが `docs/template/template-er.yaml`
      - name: test_check_design_templates_when_ref_unresolvable
        case: 正常
        summary: $ref を解決できないスキーマ
        condition: '`er.schema.yaml` のキーの `$ref` が無い `$defs` を指し、`template-er.yaml` は古い'
        mock: なし（一時ディレクトリ）
        expected: 空（設計書のスキーマの検査が違反にする）
    callees:
      - MOD-201-1#functions[load_schemas]
      - MOD-201-1#functions[build_items]
      - MOD-72-2#functions[load_document]
    refs:
      - IF-72-3#constraints[設計書のテンプレート]
