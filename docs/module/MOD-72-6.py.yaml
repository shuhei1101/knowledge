id: "MOD-72-6"
visibility: internal
title: "検査と変換のスクリプト / scripts / check_all.py"
lead: 手元から呼ぶ「全ての文書の検査」。`project-index.yaml` の `documents[]` が指す全ての文書に、スキーマの検査と文書の違反の検査を適用し、`schemas/design/` の設計書のスキーマと `schemas/` の直下のスキーマにスキーマ自身の検査を適用し、終了コードで合否を返却する（IF-72-3）。
data_models:
  - name: Target
    title: 検査する文書
    container: scripts/check_all.py
    usecase: 全ての文書の検査
    role: DTO
    summary: '`documents[]` の行から取得した文書 1 件と、適用する検査'
    description: '`dataclass(frozen=True)`。'
    properties:
      - name: path
        type: PurePosixPath
        description: リポジトリの直下からのパス
      - name: schema
        type: str
        description: 行の `schema`（`schemas/rule.schema.yaml` など）
      - name: checks
        type: bool
        description: 行の `validators` に `knowledge-checks` を持つか
  - name: MetaSchemaError
    title: 使用できない拡張したメタスキーマ
    container: scripts/check_all.py
    usecase: 全ての文書の検査
    role: 例外
    summary: '`schemas/meta.schema.yaml` が無い・読み込めない・JSON Schema 2020-12 のメタスキーマに合わない'
    inherits: Exception
    properties:
      - name: message
        type: str
        description: 標準エラーへ出す理由の 1 行
constants:
  - name: CHECKS_ID
    title: 文書の違反の検査の ID
    container: scripts/check_all.py
    usecase: 全ての文書の検査
    summary: '`validators[]` の文書の違反の検査の `id`'
    value: '"knowledge-checks"'
  - name: YAMLLINT_EXTRA
    title: yamllint だけを適用するファイル
    container: scripts/check_all.py
    usecase: 全ての文書の検査
    summary: '`documents[]` に無く、yamllint を適用するリポジトリの直下のファイル'
    value: ("project-index.yaml", "rules.yaml")
  - name: DESIGN_SCHEMAS_DIR
    title: 設計書のスキーマのフォルダ
    container: scripts/check_all.py
    usecase: 全ての文書の検査
    summary: 設計書のスキーマ（knowledge の原本）を配置するフォルダの、リポジトリの直下からのパス
    value: PurePosixPath("schemas/design")
  - name: META_SCHEMA_PATH
    title: 拡張したメタスキーマのパス
    container: scripts/check_all.py
    usecase: 全ての文書の検査
    summary: 'JSON Schema 2020-12 のメタスキーマに `x-rules`・`x-bad-examples` の形式を追加した、拡張したメタスキーマの、リポジトリの直下からのパス。ファイルは `$dynamicAnchor: meta` と絶対 URI の `$id`（`urn:knowledge:schemas:meta`）を持つ。`$id` が無いと `$dynamicRef` が拡張したメタスキーマへ戻らず、深い位置のキーを検査しない'
    value: PurePosixPath("schemas/meta.schema.yaml")
functions:
  - name: main
    title: 全ての文書の検査の入口
    kind: 関数
    container: scripts/check_all.py
    usecase: 全ての文書の検査
    role: 入口
    scope: public
    summary: 全ての文書を検査し、違反を 1 件 1 行で出して終了コードで合否を返却する
    args:
      - name: argv
        title: 引数
        type: Sequence[str] | None
        required: false
        default: None
        description: コマンドの引数。`None` は `sys.argv[1:]`。`--lint-dir`（既定は `DEFAULT_LINT_DIR`）だけを取る
    returns:
      type: int
      description: 終了コード。`0` = 違反なし、`1` = 違反が 1 件以上か想定していない例外、`2` = 検査を始めなかった
    process: |-
      1. argparse で引数を読み込み、標準出力を UTF-8 にする
      2. lint の CLI の在りかを確認する（lint の CLI の在りかの確認）
         - 見つからない CLI がある場合、見つからない CLI ごとに標準エラーへ `{CLI} がありません。開発コマンドの『環境構築（クローン直後）』で入れてください` を出し `2` を返却する
      3. 作業ディレクトリの `project-index.yaml` の `documents[]` を読み込む（project-index.yaml の読み込み）
         - 読み込めない project-index.yaml の場合、標準エラーへ理由を出し `2` を返却する
      4. 拡張したメタスキーマの検査器を作る（拡張したメタスキーマの読み込み）
         - 使用できない拡張したメタスキーマの場合、標準エラーへ理由を出し `2` を返却する
      5. 検査する文書を列挙し（検査する文書の列挙）、並列に読み込む（ファイルの並列の読み込み）
      6. スキーマの検査器を作り（スキーマの検査器の作成）、ID の索引と、3 で読み込んだ `documents[]` の行から名前の索引を 1 度ずつ作る（ID の索引の作成・名前の索引の作成）
      7. 文書ごとに検査し（文書 1 件の検査）、違反を `{ファイルのパス}:{行}: {項目のパス}: {内容}` の 1 行ずつ、文書のパスの順に標準出力へ出す
      8. 設計書のスキーマと `schemas/` の直下のスキーマを検査し（設計書のスキーマの検査・文書の種類のスキーマの検査）、違反を同じ形式の行で出す
      9. 対応表のコピーを検査し（対応表のコピーの検査）、違反を同じ形式の行で出す
         設計書のテンプレートを検査し（設計書のテンプレートの検査）、違反を同じ形式の行で出す
      10. lint を適用する（lint の検査）。違反を `{ファイルのパス}:{行}: {項目のパス}: {tool}/{rule}: {message}`、`warning` の違反は `{内容}` の前に `warning: ` を付けた行で、文書のパスと行の順に出す
         - 読み込めない lint の出力の場合、標準エラーへ理由を出し `1` を返却する
      11. 最後に `{文書の数} 件の文書を検査し、違反は {違反の数} 件、警告は {警告の数} 件でした` を出し、違反があれば `1`、無ければ `0` を返却する（警告は数えない）
         - 想定していない例外の場合、`traceback.print_exc()` で標準エラーへ出し `1` を返却する
    unit_tests:
      - name: test_main
        case: 正常
        summary: 違反の無いリポジトリ
        condition: '`project-index.yaml`・`schemas/meta.schema.yaml`・`schemas/rule.schema.yaml`・違反の無い `docs/rule/` の文書 2 件を持つ一時フォルダ'
        mock: lint の CLI の在りかの確認を両方とも見つかったパスに、lint の検査を空を返却する関数に差し替える
        expected: '`0` を返却し、標準出力の最後の行が `2 件の文書を検査し、違反は 0 件、警告は 0 件でした`'
      - name: test_main_when_violations
        case: 正常
        summary: 違反がある
        condition: '`description` の無い文書と、項目の ID が重複した文書'
        mock: lint の CLI の在りかの確認を差し替える。lint の検査を空を返却する関数に差し替える
        expected: '`1` を返却し、2 つの文書の違反が `{パス}:{行}: {項目のパス}: ` で始まる行で出る'
      - name: test_main_when_design_schemas_invalid
        case: 正常
        summary: 設計書のスキーマに誤りがある
        condition: 違反の無いリポジトリに、`examples[0]` が `required` のキーを持たない `schemas/design/scenario.schema.yaml` を加える
        mock: lint の CLI の在りかの確認を差し替える。lint の検査を空を返却する関数に差し替える
        expected: '`1` を返却し、`schemas/design/scenario.schema.yaml:{行}: examples[0]: examples: ` で始まる行が出て、最後の行が違反 1 件'
      - name: test_main_when_document_schemas_invalid
        case: 正常
        summary: '`schemas/` の直下のスキーマに誤りがある'
        condition: 違反の無いリポジトリの `schemas/rule.schema.yaml` に、文字列の `x-rules` を加える
        mock: lint の CLI の在りかの確認を差し替える。lint の検査を空を返却する関数に差し替える
        expected: '`1` を返却し、`schemas/rule.schema.yaml:{行}: x-rules: metaschema: ` で始まる行が出る'
      - name: test_main_when_lint_findings
        case: 正常
        summary: lint の違反と警告
        condition: 違反の無いリポジトリ
        mock: lint の CLI の在りかの確認を差し替える。lint の検査を、違反 1 件と `warning` の違反 1 件を返却する関数に差し替える
        expected: '`1` を返却し、`markdownlint/MD036: ` の行と `warning: textlint/one-sentence-per-line: ` の行が出て、最後の行が違反 1 件・警告 1 件'
      - name: test_main_when_only_warnings
        case: 正常
        summary: 警告だけ
        condition: 違反の無いリポジトリ
        mock: lint の CLI の在りかの確認を差し替える。lint の検査を、`warning` の違反 1 件だけを返却する関数に差し替える
        expected: '`0` を返却する'
      - name: test_main_when_check_cli_missing
        case: 正常
        summary: 検査の CLI が無い
        condition: 違反の無いリポジトリ
        mock: '`--lint-dir` を存在しないフォルダにする'
        expected: '`2` を返却し、標準エラーに `markdownlint-cli2`・`textlint` の行が 1 行ずつ出る'
      - name: test_main_when_meta_schema_unusable
        case: 正常
        summary: 拡張したメタスキーマが無い
        condition: '`schemas/meta.schema.yaml` を持たないリポジトリ'
        mock: lint の CLI の在りかの確認を差し替える
        expected: '`2` を返却し、標準エラーに `schemas/meta.schema.yaml` が出る'
      - name: test_main_when_config_missing
        case: 正常
        summary: project-index.yaml が無い
        condition: '`project-index.yaml` を持たない一時フォルダ'
        mock: lint の CLI の在りかの確認を差し替える
        expected: '`2` を返却し、標準エラーに `project-index.yaml` が出る'
      - name: test_main_when_design_documents
        case: 正常
        summary: 設計書の行
        condition: 違反の無いリポジトリに、`common.schema.yaml#/$defs/id` を `$ref` で指す `schemas/design/scenario.schema.yaml` と `schemas/design/common.schema.yaml` と、`schema` がそのスキーマの `docs/scenario/` の行と、スキーマに合う設計書 1 件を加える（`schemas/` の直下に `common.schema.yaml` を配置しない）
        mock: lint の CLI の在りかの確認を差し替える。lint の検査を、受け取った `targets` を記録して空を返却する関数に差し替える
        expected: '`0` を返却し、最後の行が文書 3 件・違反 0 件で、lint の検査に指定した `targets` に設計書がある'
    callees:
      - '#functions[load_meta_validator]'
      - MOD-176-1#functions[find_lint_clis]
      - MOD-72-2#functions[load_config]
      - MOD-72-2#functions[read_texts]
      - MOD-72-4#functions[build_id_index]
      - MOD-72-4#functions[build_name_index]
    refs:
      - IF-72-3#
  - name: check_lints
    title: lint の検査
    kind: 関数
    container: scripts/check_all.py
    usecase: 全ての文書の検査
    role: サービス
    scope: public
    summary: 設計書を含む全ての文書の Markdown に markdownlint-cli2・textlint、YAML のファイルと `schemas/` のスキーマに yamllint を適用する
    args:
      - name: root
        title: リポジトリの直下
        type: Path
        required: true
        description: '`YAMLLINT_EXTRA` と `schemas/` のスキーマの起点'
      - name: targets
        title: 検査する文書
        type: Sequence[Target]
        required: true
        description: '`list_targets` が返却した文書'
      - name: texts
        title: 中身
        type: Mapping[Path, str | None]
        required: true
        description: '`read_texts` が返却した中身'
      - name: lint_dir
        title: lint のフォルダ
        type: Path
        required: true
        description: '`--lint-dir` の値'
      - name: clis
        title: CLI の実行ファイル
        type: Mapping[str, str]
        required: true
        description: '`find_lint_clis` が返却した絶対パス'
    returns:
      type: list[LintFinding]
      description: 文書のパスと行の順の違反
    process: |-
      1. 中身の読み込めた文書ごとに Markdown を取り出し（lint を適用する Markdown の取り出し）、まとめて Markdown の lint を呼ぶ（Markdown の lint の呼び出し）
      2. yamllint の設定を読み込み（yamllint の設定の読み込み）、拡張子が `.yaml`・`.yml` の文書と、`YAMLLINT_EXTRA` のうち在るファイルに yamllint を適用する（yamllint の呼び出し）
      3. `YAMLLINT_SCHEMAS_CONFIG` の設定を読み込み（yamllint の設定の読み込み）、`schemas/*.schema.yaml` と `DESIGN_SCHEMAS_DIR` の `*.schema.yaml` をパスの順に UTF-8 で読み込んで yamllint を適用する（yamllint の呼び出し）。UTF-8 で読み込めないファイルは、違反を設計書のスキーマの検査と文書の種類のスキーマの検査が出すため、yamllint を適用せずに飛ばす
      4. パスと行の順に並べて返却する
    unit_tests:
      - name: test_check_lints
        case: 正常
        summary: 3 つの lint の違反を並べる
        condition: '`body` が太字だけの段落の文書と、`key: foo #bar` を持つ `rules.yaml`。`lint_dir` に `extends: default`・`comments: {level: error}`・`document-start: disable`・`line-length: disable`・`truthy: {check-keys: false}`（`scripts/lint/.yamllint.yaml` と同じ内容） の `.yamllint.yaml` と、`test_check_lints_when_schemas_use_flow_style` と同じ `.yamllint-schemas.yaml`'
        mock: Markdown の lint の呼び出しを、受け取った `sources` の 1 件目に `MD036` の違反を返却する関数に差し替える
        expected: 文書の `MD036` の 1 件と、`rules.yaml` の `comments` の 2 件の 3 件がパスの順に並ぶ
      - name: test_check_lints_when_schemas_use_flow_style
        case: 正常
        summary: スキーマのフロー形式だけを違反にする
        condition: '`tags: [{name: scope:規約}]` の行を持つ文書と、`required: [id, title]` の行を持つ `schemas/rule.schema.yaml` と、`properties: {id: {type: string}}` の行を持つ `schemas/design/common.schema.yaml`。`lint_dir` に `test_check_lints` と同じ `.yamllint.yaml` と、`brackets: {forbid: non-empty}`・`braces: {forbid: non-empty}`（`scripts/lint/.yamllint-schemas.yaml` と同じ内容）の `.yamllint-schemas.yaml`'
        mock: Markdown の lint の呼び出しを、空を返却する関数に差し替える
        expected: '`schemas/design/common.schema.yaml` の `braces` の 2 件と `schemas/rule.schema.yaml` の `brackets` の 1 件の計 3 件がパスの順に並び、文書の違反は無い'
      - name: test_check_lints_when_schema_unreadable
        case: 正常
        summary: UTF-8 で読み込めないスキーマを飛ばす
        condition: '`test_check_lints_when_schemas_use_flow_style` と同じ `lint_dir` と、UTF-8 として不正なバイト列（`b"\xff"`）の `schemas/design/broken.schema.yaml` と、`required: [id, title]` の行を持つ `schemas/rule.schema.yaml`'
        mock: Markdown の lint の呼び出しを、空を返却する関数に差し替える
        expected: 例外を出さず、`schemas/rule.schema.yaml` の `brackets` の 1 件だけを返却する
    callees:
      - MOD-176-1#functions[collect_sources]
      - MOD-176-1#functions[run_markdown_lints]
      - MOD-176-1#functions[load_yamllint_config]
      - MOD-176-1#functions[run_yamllint]
    refs:
      - IF-72-3#constraints[lint の適用先]
      - IF-72-3#constraints[lint の設定]
  - name: load_meta_validator
    title: 拡張したメタスキーマの読み込み
    kind: 関数
    container: scripts/check_all.py
    usecase: 全ての文書の検査
    role: サービス
    scope: public
    summary: '`META_SCHEMA_PATH` を読み込み、スキーマの検査器を作る'
    args:
      - name: root
        title: リポジトリの直下
        type: Path
        required: true
        description: '`META_SCHEMA_PATH` の起点'
    returns:
      type: Draft202012Validator
      description: 拡張したメタスキーマの検査器
    process: |-
      1. `META_SCHEMA_PATH` を UTF-8 で読み込み、YAML として読み込む（YAML の読み込み）
         - 読み込めないファイル・YAML の場合、`MetaSchemaError` を送出する
      2. `Draft202012Validator.check_schema` で、それ自身が JSON Schema 2020-12 のメタスキーマに合うかを確認する
         - 合わない場合、`MetaSchemaError` を送出する
      3. 検査器を返却する
    exceptions:
      - name: MetaSchemaError
        condition: 拡張したメタスキーマが無い・読み込めない・JSON Schema 2020-12 のメタスキーマに合わない
        message: 'schemas/meta.schema.yaml を使えません: {理由}'
    unit_tests:
      - name: test_load_meta_validator
        case: 正常
        summary: 正しい拡張したメタスキーマ
        condition: 'リポジトリの `schemas/meta.schema.yaml`'
        mock: なし
        expected: '検査器が、最上位と `properties` の下の文字列の `x-rules` と `value` の無い `x-bad-examples` の要素と `type: strin` に誤りを返却し、`examples`・`x-bad-examples` の値の中と `properties` の `x-rules` という名前の項目には誤りを返却しない'
      - name: test_load_meta_validator_when_missing
        case: 異常
        summary: ファイルが無い
        condition: '`schemas/meta.schema.yaml` を持たない一時フォルダ'
        mock: なし（一時ディレクトリ）
        expected: '`MetaSchemaError` を送出し、`message` が `schemas/meta.schema.yaml を使えません: ` で始まる'
      - name: test_load_meta_validator_when_broken
        case: 異常
        summary: 読み込めない YAML
        condition: 括弧の閉じていない `schemas/meta.schema.yaml`
        mock: なし（一時ディレクトリ）
        expected: '`MetaSchemaError` を送出する'
      - name: test_load_meta_validator_when_invalid
        case: 異常
        summary: メタスキーマに合わない
        condition: '`type: strin` を持つ `schemas/meta.schema.yaml`'
        mock: なし（一時ディレクトリ）
        expected: '`MetaSchemaError` を送出する'
    callees:
      - MOD-72-2#functions[load_safe]
    refs:
      - IF-72-3#exceptions[終了コード 2]
  - name: check_document_schemas
    title: 文書の種類のスキーマの検査
    kind: 関数
    container: scripts/check_all.py
    usecase: 全ての文書の検査
    role: サービス
    scope: public
    summary: '`schemas/*.schema.yaml` に拡張したメタスキーマの検査を適用する'
    args:
      - name: root
        title: リポジトリの直下
        type: Path
        required: true
        description: '`schemas/` の起点'
      - name: meta
        title: 拡張したメタスキーマの検査器
        type: Draft202012Validator
        required: true
        description: 拡張したメタスキーマの読み込みの返り値
    returns:
      type: list[tuple[str, int, str, str]]
      description: （ファイルのパス、行、項目のパス、内容）。ファイルのパスの順。誤りが無ければ空
    process: |-
      1. `schemas/*.schema.yaml` を、ファイル名の順に、設計書のスキーマの検査の 2 と同じ扱いで読み込む
      2. ファイルごとに `meta` の `iter_errors` の誤りを `(パス, 行, 項目のパス, "metaschema: {message}")` にする
      3. ファイルのパス・行の順に並べて返却する
    unit_tests:
      - name: test_check_document_schemas
        case: 正常
        summary: 誤りの無いスキーマ
        condition: '`x-rules` を持つ `schemas/template.schema.yaml`'
        mock: なし（一時ディレクトリ）
        expected: 空
      - name: test_check_document_schemas_when_invalid
