  - name: check_design_schemas
    title: 設計書のスキーマの検査
    kind: 関数
    container: scripts/check_all.py
    usecase: 全ての文書の検査
    role: サービス
    scope: public
    summary: '`schemas/design/` の設計書のスキーマに、拡張したメタスキーマ・`$ref`・`examples`・`x-used-by` の検査を適用する'
    args:
      - name: root
        title: リポジトリの直下
        type: Path
        required: true
        description: '`DESIGN_SCHEMAS_DIR` の起点'
      - name: meta
        title: 拡張したメタスキーマの検査器
        type: Draft202012Validator
        required: true
        description: 拡張したメタスキーマの読み込みの返り値
    returns:
      type: list[tuple[str, int, str, str]]
      description: （ファイルのパス、行、項目のパス、内容）。ファイルのパスの順。誤りが無ければ空
    process: |-
      1. `DESIGN_SCHEMAS_DIR` が無ければ空を返却する
      2. `DESIGN_SCHEMAS_DIR` の `*.schema.yaml` をファイル名の順に UTF-8 で読み込み、文書として読み込む（文書の読み込み）
         - 読み込めないファイルの場合、`(パス, 1, "$", "ファイルを UTF-8 で読めません")` を加えて、そのファイルは以降の検査から除外する
         - 読み込めない YAML の場合、`(パス, {行}, "$", "YAML として読めません: {理由}")` を加えて、そのファイルは以降の検査から除外する
      3. 読み込めたファイルを、ファイル名を URI にした `referencing.Registry` に入れる（`build_validators` の `schemas/*.schema.yaml` の登録とは別の登録）
      4. ファイルごとに次を適用し、誤りごとに `(パス, 行, 項目のパス, 内容)` を加える。行は項目の行の引き当て、項目のパスは項目のパスの組み立てで求める
         1. メタスキーマ: `meta` の `iter_errors` の誤りを `metaschema: {message}` にする
            - メタスキーマの誤りがあるファイルの場合、そのファイルの 2〜4 は適用しない
         2. `$ref`: スキーマを辿り、文字列の `$ref` ごとに、ファイル名を基準の URI にして登録から取得する。取得できなければ `$ref` のキーの位置で `$ref: {値} を解決できません` にする
            - スキーマのキーワードとしての `examples`・`enum`・`const`・`default`・`x-bad-examples` の値の中は辿らない
            - `properties`・`patternProperties`・`$defs`・`dependentSchemas` の値（名前 → スキーマの対応）のキーは名前として扱い、キーワードと見なさずに値のスキーマを辿る（`default`・`examples` という名前のプロパティも辿る）
         3. `examples`: 2 と同じ辿り方で、キーワードとしての配列の `examples` を持つスキーマごとに、`{"$ref": "{ファイル名}#{JSON Pointer}"}` を登録つきの `Draft202012Validator` にし、要素ごとの `iter_errors` の誤りを、要素の位置に誤りの位置を続けた位置で `examples: {message}` にする
            - 検査の途中で `$ref` を解決できない場合、その要素の誤りは出さない（2 が出す）
         4. `x-used-by`: 2 と同じ辿り方で、キーワードとしての `properties` の値のスキーマ（キー）ごとに、`x-used-by` を持つかを確認する。無ければキーの位置で `x-used-by: 使用先（x-used-by）が記載されていません` にする
            - キーが文字列の `$ref` を持つ場合、ファイル名を基準の URI にして登録から解決した型が `x-used-by` を持てば違反にしない。解決できない `$ref` は違反にしない（2 が出す）
            - キーワードとしての `if` の値の中は確認しない（`if` という名前のプロパティは確認する）。`$defs` の直下の型はキーと見なさない
      5. ファイルのパス・行の順に並べて返却する
    unit_tests:
      - name: test_check_design_schemas
        case: 正常
        summary: 誤りの無いスキーマ
        condition: '`common.schema.yaml` と、それを `$ref` で指し、合う `examples` を持つ `scenario.schema.yaml`。この関数の他のテストも含め、`x-used-by` の検査を確認するテストでなければ `properties` の下のキーは `x-used-by` を持つ'
        mock: なし（一時ディレクトリ）
        expected: 空
      - name: test_check_design_schemas_when_invalid
        case: 正常
        summary: 3 種の誤り
        condition: '`type: strin` を持つスキーマ、`common.schema.yaml#/$defs/missing` を指すスキーマ、`required` のキーを持たない `examples[0]` を持つスキーマと、`common.schema.yaml`'
        mock: なし（一時ディレクトリ）
        expected: '3 件で、内容がそれぞれ `metaschema: `・`$ref: `・`examples: ` で始まり、行がそれぞれ `type` のキー・`$ref` のキー・`examples[0]` の要素の行'
      - name: test_check_design_schemas_when_x_keys_invalid
        case: 正常
        summary: '`x-rules`・`x-bad-examples` の形式が違う'
        condition: '`properties.id` に文字列の `x-rules` を持ち、`$defs.a` に `reason` の無い `x-bad-examples` の要素を持つスキーマ'
        mock: なし（一時ディレクトリ）
        expected: '2 件で、項目のパスがそれぞれ `properties.id.x-rules`・`$defs.a.x-bad-examples[0]`、内容が `metaschema: ` で始まる'
      - name: test_check_design_schemas_when_x_keys_in_data
        case: 正常
        summary: 値の中と同じ名前の項目
        condition: '`x-bad-examples` の `value` に `$ref` と文字列の `x-rules` を持つオブジェクトを記載し、`properties` に `x-rules` という名前の項目を持つスキーマ'
        mock: なし（一時ディレクトリ）
        expected: 空
      - name: test_check_design_schemas_when_nested_examples
        case: 正常
        summary: 入れ子の examples
        condition: '`properties.id` が `common.schema.yaml#/$defs/id` を `$ref` で指し、`pattern` に合わない値を `properties.id.examples` に持つスキーマ'
        mock: なし（一時ディレクトリ）
        expected: '1 件で、項目のパスが `properties.id.examples[0]`、内容が `examples: ` で始まる'
      - name: test_check_design_schemas_when_property_named_default
        case: 正常
        summary: default という名前のプロパティ
        condition: '`properties.default` が `type: string` で、文字列でない値を `properties.default.examples` に持つスキーマ'
        mock: なし（一時ディレクトリ）
        expected: '1 件で、項目のパスが `properties.default.examples[0]`、内容が `examples: ` で始まる'
      - name: test_check_design_schemas_when_folder_missing
        case: 正常
        summary: フォルダが無い
        condition: '`schemas/design/` を持たない一時フォルダ'
        mock: なし（一時ディレクトリ）
        expected: 空
      - name: test_check_design_schemas_when_broken
        case: 正常
        summary: 読み込めない YAML
        condition: 括弧の閉じていない `common.schema.yaml`
        mock: なし（一時ディレクトリ）
        expected: '`$` の 1 件で、内容が `YAML として読めません: ` で始まる'
      - name: test_check_design_schemas_when_used_by_missing
        case: 正常
        summary: x-used-by が無いキー
        condition: '`x-used-by` を持たない `properties.a`、`x-used-by` を持つ `properties.b`、`x-used-by` を持たない `allOf[0].if.properties.c` を持つスキーマ'
        mock: なし（一時ディレクトリ）
        expected: '1 件で、項目のパスが `properties.a`、行が `a` のキーの行、内容が `x-used-by: ` で始まる'
      - name: test_check_design_schemas_when_ref_type_used_by
        case: 正常
        summary: $ref の先の型の x-used-by
        condition: '`x-used-by` を持つ `$defs.t` を指す `properties.a` と、`x-used-by` を持たない `$defs.u` を指す `properties.b` と、解決できない `#/$defs/missing` を指す `properties.c` を持ち、どのキーも `x-used-by` を持たないスキーマ'
        mock: なし（一時ディレクトリ）
        expected: '2 件で、`properties.b` の内容が `x-used-by: ` で始まり、`properties.c` は内容が `$ref: ` で始まる 1 件だけ（`properties.c` の `x-used-by: ` と `$defs.u` の行は出ない）'
      - name: test_check_design_schemas_when_property_named_if
        case: 正常
        summary: if という名前のプロパティ
        condition: '`x-used-by` を持たない `properties.if` を持つスキーマ'
        mock: なし（一時ディレクトリ）
        expected: '1 件で、項目のパスが `properties.if`、内容が `x-used-by: ` で始まる'
      - name: test_check_design_schemas_when_meta_invalid_and_used_by_missing
        case: 正常
        summary: メタスキーマの誤りがあるファイルの x-used-by
        condition: '`type: strin` と `x-used-by` を持たない `properties.a` を持つスキーマ'
        mock: なし（一時ディレクトリ）
        expected: '内容が `metaschema: ` で始まる行だけで、`x-used-by: ` で始まる行が無い'
    callees:
      - MOD-72-2#functions[load_document]
      - MOD-72-2#functions[line_of]
      - MOD-72-2#functions[format_path]
    refs:
      - IF-72-3#constraints[設計書のスキーマの検査]
      - IF-72-3#constraints[スキーマの違反の行]
      - IF-72-3#constraints[`x-rules`・`x-bad-examples` の形式]
  - name: check_word_list_copy
