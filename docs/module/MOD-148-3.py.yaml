id: "MOD-148-3"
visibility: internal
title: "検査と変換のスクリプト / scripts / build_word_list.py"
lead: 手元から呼ぶ「対応表のコピーの作成」。正本の対応表の YAML から、プラグイン slop-check のフックが読む JSON のコピーを書き出す（IF-148-2）。
constants:
  - name: SOURCE
    title: 正本の対応表
    container: scripts/build_word_list.py
    usecase: 対応表のコピーの作成
    summary: リポジトリの直下からの正本のパス
    value: PurePosixPath("docs/word-list/word-list-ai-slop.yaml")
  - name: COPY
    title: 対応表のコピー
    container: scripts/build_word_list.py
    usecase: 対応表のコピーの作成
    summary: リポジトリの直下からのコピーのパス
    value: PurePosixPath("plugins/slop-check/hooks/post-tool-use/word-list-ai-slop.json")
  - name: COPY_KEYS
    title: コピーに残すキー
    container: scripts/build_word_list.py
    usecase: 対応表のコピーの作成
    summary: '`entries[]` の各行に残すキーとその順'
    value: ("id", "ng", "ok", "pattern", "allow", "note")
functions:
  - name: main
    title: 対応表のコピーの作成の入口
    kind: 関数
    container: scripts/build_word_list.py
    usecase: 対応表のコピーの作成
    role: 入口
    scope: public
    summary: 正本を読み、コピーを書き出して終了コードを返す
    side_effects: '`COPY` のファイルを書き換える'
    args:
      - name: argv
        title: 引数
        type: Sequence[str] | None
        required: false
        default: None
        description: コマンドの引数。`None` は `sys.argv[1:]`。引数は取らない（`--help` だけ）
    returns:
      type: int
      description: 終了コード。`0` = 書き出した、`2` = 正本が読めない、`1` = 想定していない例外
    process: |-
      1. argparse で引数を読む
      2. 作業ディレクトリの `SOURCE` を UTF-8 で読み、文書として読む（文書の読み込み）
         - `OSError`・`DocumentError` の場合、標準エラーへ `対応表を読めません: {SOURCE}: {理由}` を出し、コピーを書き換えずに `2` を返す
      3. コピーの中身を作り（コピーの中身の作成）、`COPY` へ UTF-8・改行 `\n` で書き出し、`0` を返す
         - 想定していない例外の場合、`traceback.print_exc()` で標準エラーへ出し `1` を返す
    unit_tests:
      - name: test_main
        case: 正常
        summary: コピーを書き出す
        condition: 2 行の正本と `plugins/slop-check/hooks/post-tool-use/` を持つ一時フォルダを作業ディレクトリにする
        mock: なし（一時ディレクトリ）
        expected: '`0` を返し、`COPY` がコピーの中身の作成の結果と一致する'
      - name: test_main_when_source_missing
        case: 正常
        summary: 正本が無い
        condition: 前回のコピーだけを持つ一時フォルダ
        mock: なし（一時ディレクトリ）
        expected: '`2` を返し、標準エラーに `SOURCE` のパスが出て、コピーが変わらない'
    callees:
      - MOD-72-2#functions[load_document]
    refs:
      - IF-148-2#
  - name: render_copy
    title: コピーの中身の作成
    kind: 関数
    container: scripts/build_word_list.py
    usecase: 共通
    scope: public
    summary: 読んだ正本から、コピーの JSON の文字列を作る
    args:
      - name: doc
        title: 正本
        type: CommentedMap
        required: true
        description: 読んだ正本の文書
    returns:
      type: str
      description: '`{"entries": [...]}` の JSON に改行を 1 つ付けた文字列'
    process: |-
      1. `entries[]` の各行から `COPY_KEYS` のキーだけを、その順で、値があるものだけ取り出す（`ok`・`allow` は配列のまま）
      2. `json.dumps({"entries": 行}, ensure_ascii=False, indent=2)` に `\n` を付けて返す
    unit_tests:
      - name: test_render_copy
        case: 正常
        summary: 残すキーだけを固定の順で
        condition: '`examples` と `note` を持つ行と、`pattern` を持たない行。キーの並びは `note`・`ng`・`id` の順'
        mock: なし
        expected: '各行が `id`・`ng`・`ok`・（`pattern`）・（`allow`）・`note` の順で、`examples` を持たず、末尾が改行 1 つ'
    refs:
      - IF-148-2#constraints[コピーの書式]
notes:
  依存: PEP 723 のメタデータに `ruamel.yaml==0.19.1`（LIB-72-1）を書き、`_common.py` を同じフォルダから import する。
test_files:
  - tests/unit/scripts/test_build_word_list.py
