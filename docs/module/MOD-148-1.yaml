id: "MOD-148-1"
visibility: internal
title: "slop-check / hooks"
lead: プラグイン slop-check の PostToolUse のフック。Python の標準ライブラリだけで書いた単一ファイルのスクリプトを `python3` で起動し、プラグインのフォルダの対応表の JSON のコピーを読む。
diagrams:
  - name: 全体
    diagram: |-
      classDiagram
          direction LR
          class hook["書き込んだ中身の照合"]
          hook : main()
          hook : extract_text()
          hook : find_hits()
          hook : build_notice()
          class entry["対応表の行"]
          entry : id
          entry : pattern
          entry : allow
          class checks["文書の違反の検査"]
          checks : check_word_list()
          class build["対応表のコピーの作成"]
          build : render_copy()
          class checkall["全ての文書の検査"]
          checkall : check_word_list_copy()
          hook ..> entry
          checks ..> hook
          checkall ..> build
notes:
  起動の方式: |-
    `hooks.json` の `PostToolUse` に、`matcher` を `Write|Edit|NotebookEdit|mcp__.*` にして `python3 ${CLAUDE_PLUGIN_ROOT}/hooks/post-tool-use/slop_check.py` を登録する。対象の MCP ツールの判定は `slop_check.py` の `is_target` だけが持ち、対象外のツールは対応表を読む前に終わる。
    `python3` は端末のもの（2026-11-03 に WSL2 で測った値は 3.12.3）で、3.12 を下限にする。
    依存を持たないため、PEP 723 のメタデータと `uv` を使わない。書き込むたびに起動するため、uv の依存の解決を起動の時間に入れない（MOD-72-1 の測った値で 0.3〜0.6 秒）。
  照合の共有: |-
    照合は `slop_check.py` が持ち、`scripts/knowledge_checks.py` の対応表の `examples` の検査は `slop_check.py` の `compile_entry`・`entry_hits` を使う。
    `knowledge_checks.py` は、リポジトリの直下からの `plugins/slop-check/hooks/post-tool-use` を `sys.path` の先頭に入れてから import する。
  テストと静的検査: |-
    単体テストは `tests/unit/slop-check/test_slop_check.py`、結合テストは `tests/integration/slop-check/` に置く。
    pytest の `pythonpath` に `plugins/slop-check/hooks/post-tool-use` を加え、ruff の `T20` を外す対象と pyright の対象に `plugins/slop-check/hooks/post-tool-use/*.py` を加える。
    `plugins/slop-check/` だけ、ruff の `target-version` を `py312`（`plugins/slop-check/ruff.toml` で `extend` する）、pyright の `executionEnvironments` の `pythonVersion` を `3.12` にする。
    単体テストは 3.14 に加えて `uv run --python 3.12` でも流す（コマンドはテスト実行方法に置く）。
