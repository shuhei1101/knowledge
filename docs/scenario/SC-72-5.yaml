id: "SC-72-5"
visibility: internal
title: "エージェントが knowledge の文書を書き込む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 差し替えない
      - name: 作業場所
        description: knowledge の worktree
      - name: 書き込む内容
        description: スキーマに合い、ID の重複・参照切れ・markdownlint-cli2・textlint・yamllint・map の点検の error の違反が無く、mdmark の警告が無い規約の YAML
        notes: '`tags` はタグの名前の配列（`["scope:dev"]`）、`main_tags` は主題のタグの名前（`["scope:dev"]`）で指定する'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        participant V as knowledge の検査のスクリプト
        participant W as knowledge の作業ツリー
        E->>M: write_docs に source knowledge と文書
        M->>M: scope.write とスキーマを確認する
        M->>V: 標準入力に文書の YAML
        V->>V: 項目の Markdown に markdownlint-cli2・textlint、文書の YAML に yamllint を適用する
        V-->>M: 終了コード 0 と空の違反の配列
        M->>W: 文書を書き込む
        M-->>E: 書き込んだ文書
      ```

      <!-- /map -->
    expected:
      - 作業ツリーの文書の `tags`・`main_tags` 以外の項目が指定した内容になる
      - '作業ツリーの文書の `tags` が `- name:` の要素で記載され、`main_tags` で指定したタグの要素に `main: true` が付く（`[{name: scope:dev, main: true}]`）'
      - 応答が `isError` でない
    test: test_normal
  - name: 異常シナリオ（検査のスクリプトが違反を返却する）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 書き込む内容
        description: スキーマには合うが、項目の ID（`items[].id`）が重複した規約の YAML
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        participant V as knowledge の検査のスクリプト
        E->>M: write_docs に source knowledge と文書
        M->>V: 標準入力に文書の YAML
        V-->>M: 終了コード 0 と違反の配列
        M-->>E: isError と違反の一覧
      ```

      <!-- /map -->
    expected:
      - 作業ツリーの文書が変わらない
      - 応答が `isError` で、違反の `path` が後に出た項目の `id` のパス、`rule` に文書の行と重複した項目の ID が入る
    test: test_error_when_validator_reports_violation
  - name: 異常シナリオ（Markdown の本文に mdmark の警告がある）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 書き込む内容
        description: スキーマと検査のスクリプトには合うが、項目の `body` の `flow` のマーカーの中の `json` のコードブロックを部品の定義として読み込めない規約の YAML
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        participant V as knowledge の検査のスクリプト
        participant C as mdmark の CLI
        E->>M: write_docs に source knowledge と文書
        M->>V: 標準入力に文書の YAML
        V-->>M: 終了コード 0 と空の違反の配列
        M->>C: check --text -（標準入力に項目の body の値）
        C-->>M: diagram_invalid の行と終了コード 1
        M-->>E: isError と違反の一覧
      ```

      <!-- /map -->
    expected:
      - 作業ツリーの文書が変わらない
      - 応答が `isError` で、違反の `path` が項目の `body` のパス、決まりに mdmark の `diagram_invalid` と行、修正方法に mdmark の内容が入る
  - name: 異常シナリオ（作業場所が scope.write の外）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 作業場所
        description: knowledge のクローンの外部の作業場所
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        E->>M: write_docs に source knowledge と文書
        M-->>E: isError と scope.write の外であること
      ```

      <!-- /map -->
    expected:
      - knowledge の作業ツリーの文書が変わらない
      - 応答が `isError` で、`scope.write` の外であることが分かる
    test: test_error_when_out_of_write_scope
  - name: 異常シナリオ（本文に textlint の違反がある）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 書き込む内容
        description: スキーマと検査のスクリプトの他の検査には合い、項目の `body` に textlint の error の違反を持つ規約の YAML
        notes: 1 文の中で同じ助詞が重なる行（`ja-technical-writing/no-doubled-joshi`）
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        participant V as knowledge の検査のスクリプト
        E->>M: write_docs に source knowledge と文書
        M->>V: 標準入力に文書の YAML
        V->>V: 項目の Markdown に textlint を適用する
        V-->>M: 終了コード 0 と違反の配列
        M-->>E: isError と違反の一覧
      ```

      <!-- /map -->
    expected:
      - 作業ツリーの文書が変わらない
      - 応答が `isError` で、違反の `path` が項目の `body` のパス、`rule` に文書の行と textlint のルール名が入る
    test: test_error_when_textlint_reports_violation
  - name: 異常シナリオ（作業ツリーに markdownlint-cli2・textlint が無い）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 作業場所
        description: '`scripts/lint/node_modules/` を持たない knowledge の worktree'
      - name: 書き込む内容
        description: 正常シナリオと同じ規約の YAML
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        participant V as knowledge の検査のスクリプト
        E->>M: write_docs に source knowledge と文書
        M->>V: 標準入力に文書の YAML
        V->>V: scripts/lint/ に markdownlint-cli2・textlint が無い
        V-->>M: 終了コード 0 と markdownlint-cli2・textlint が無いことの違反
        M-->>E: isError と違反の一覧
      ```

      <!-- /map -->
    expected:
      - 作業ツリーの文書が変わらない
      - 応答が `isError` で、違反の `path` が `$`、`rule` に markdownlint-cli2・textlint が無いこと、`fix` に `npm ci --prefix scripts/lint` が入る
    test: test_error_when_textlint_missing
  - name: 異常シナリオ（本文に markdownlint-cli2 の違反がある）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 書き込む内容
        description: スキーマと検査のスクリプトの他の検査には合い、項目の `body` に markdownlint-cli2 の error の違反を持つ規約の YAML
        notes: 見出しの `#` の後ろに空白が 2 つある行（`MD019`）
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        participant V as knowledge の検査のスクリプト
        E->>M: write_docs に source knowledge と文書
        M->>V: 標準入力に文書の YAML
        V->>V: 項目の Markdown に markdownlint-cli2 を適用する
        V-->>M: 終了コード 0 と違反の配列
        M-->>E: isError と違反の一覧
      ```

      <!-- /map -->
    expected:
      - 作業ツリーの文書が変わらない
      - 応答が `isError` で、違反の `path` が項目の `body` のパス、`rule` に文書の行と markdownlint-cli2 のルール名が入る
    test: test_error_when_markdownlint_reports_violation
  - name: 異常シナリオ（文書の YAML に yamllint の違反がある）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 作業場所
        description: knowledge の worktree
      - name: 書き込む内容
        description: yamllint の error の違反を持つ既存の規約に、`update` で違反の無い項目を書き換える
        notes: 既存の規約の 1 行目が、`#` の直後に空白の無いコメント（`comments`）
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        participant V as knowledge の検査のスクリプト
        E->>M: write_docs に source knowledge と項目の書き換え
        M->>V: 標準入力に書き換えた後の文書の YAML
        V->>V: 文書の YAML に yamllint を適用する
        V-->>M: 終了コード 0 と違反の配列
        M-->>E: isError と違反の一覧
      ```

      <!-- /map -->
    expected:
      - 作業ツリーの文書が変わらない
      - 応答が `isError` で、違反の `path` が `-`、`rule` に文書の行と yamllint のルール名 `comments` が入る
    test: test_error_when_yamllint_reports_violation
  - name: 異常シナリオ（map の図を描けない）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 書き込む内容
        description: スキーマと検査のスクリプトの他の検査には合い、項目の `body` の map の範囲の mermaid を map が描けない規約の YAML
        notes: 1 つの map の範囲に、Mermaid として解釈できる `flowchart` の mermaid のコードブロックを 2 つ配置する（mdmark の `map_invalid`）
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        participant V as knowledge の検査のスクリプト
        participant C as mdmark の CLI（npx）
        E->>M: write_docs に source knowledge と文書
        M->>V: 標準入力に文書の YAML
        V->>C: check --text -（map を含む項目）
        C-->>V: map_invalid の行と終了コード 1
        V-->>M: 終了コード 0 と違反の配列
        M-->>E: isError と違反の一覧
      ```

      <!-- /map -->
    expected:
      - 作業ツリーの文書が変わらない
      - 応答が `isError` で、違反の `path` が項目の `body` のパス、`rule` に文書の行と mdmark の `map_invalid` が入る
    test: test_error_when_map_check_reports_violation
  - name: 異常シナリオ（map を含む文書の書き込みで npx が無い）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 作業場所
        description: knowledge の worktree
      - name: 書き込む内容
        description: map の範囲を項目の `body` に持ち、ほかの違反の無い規約の YAML
      - name: project-index の起動の環境
        description: '`npx` を持たない PATH で project-index を起動する。mdmark の CLI（`check --text`）は PATH に残す'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        participant V as knowledge の検査のスクリプト
        E->>M: write_docs に source knowledge と文書
        M->>V: 標準入力に文書の YAML
        V->>V: map の点検で呼ぶ npx が無い
        V-->>M: 終了コード 0 と npx が無いことの違反
        M-->>E: isError と違反の一覧
      ```

      <!-- /map -->
    expected:
      - 作業ツリーの文書が変わらない
      - 応答が `isError` で、違反の `path` が `$`、`rule` に npx が無いこと、`fix` に Node を入れることが入る
    test: test_error_when_npx_missing
lead: エージェントが knowledge のクローンか worktree で `write_docs` を呼び、project-index がスキーマと knowledge の検査のスクリプトで検査してから文書を書き込む。
primary_actor: エージェント
trigger: エージェントが規約を追加・修正する
preconditions:
  - knowledge が project-index に登録され、配信中
  - '`check --text` を持つ mdmark の CLI が Linux 側に入り、PATH で見つかる'
  - 書き込む作業ツリーの `scripts/lint/` に markdownlint-cli2・textlint が入っている（開発コマンドの `npm ci --prefix scripts/lint`）
  - Linux 側の PATH で `npx` が見つかる（map を含む文書の map の点検で mdmark を呼ぶ）
success_guarantee: 違反の無い内容だけが knowledge の作業ツリーに書き込まれる。
minimal_guarantee: 違反のある内容・`scope.write` の外からの書き込みは、ファイルを変えずに `isError` で返却する。
test_file: tests/e2e/単一ユースケース/test_エージェントがknowledgeの文書を書き込む.py
