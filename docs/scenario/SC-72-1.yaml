id: "SC-72-1"
visibility: internal
title: "利用者が端末に knowledge を導入して規約を参照する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 差し替えない。端末の project-index・dev-docs と knowledge のクローンをそのまま使用する
      - name: knowledge のクローン
        description: develop を踏んだ knowledge のクローン。`project-index.yaml`・`files.yaml`・スクリプトがある
      - name: 端末の設定
        description: '`~/.config/project-index/settings.yaml` の `sources[]` に knowledge が無い'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        A[利用者が project-index に knowledge を登録する] --> B[利用者が画面で knowledge の文書を参照する]
        A --> C[エージェントが knowledge の文書を検索・取得する]
      ```

      <!-- /map -->
    expected:
      - '`sources[]` に knowledge の行があり、`scope.read` が全ての作業場所、`scope.write` が knowledge のクローンと worktree'
      - 画面で develop の knowledge の全ての種類の文書が開ける
      - 'knowledge のクローンの外の作業場所から `search_docs` に `source: knowledge` を指定すると knowledge の文書が返る'
    test: test_normal
    uses:
      - SC-72-2#scenarios[正常シナリオ]
      - SC-72-3#scenarios[正常シナリオ]
      - SC-72-4#scenarios[正常シナリオ]
  - name: 異常シナリオ（登録の点検で誤りがある）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 壊した knowledge のクローン
        description: '`project-index.yaml` の documents の行が存在しないスキーマを指すクローン'
        notes: '`schema: schemas/missing.schema.yaml`'
    flow: |-
      <!-- map -->

      ```mermaid
      flowchart TD
        A[利用者が project-index に knowledge を登録する] -->|点検で誤り| X[登録しない]
      ```

      <!-- /map -->
    expected:
      - '`sources[]` に knowledge の行が追加されていない'
      - 誤りのあるファイル（`project-index.yaml`）と内容が利用者へ返る
    test: test_error_when_setup_check_fails
    uses:
      - SC-72-2#scenarios[異常シナリオ（点検で違反がある）]
lead: 利用者が端末で knowledge を project-index の配信元に登録し、dev-docs の画面とエージェントの MCP から knowledge の文書を参照できるようになるまでの流れ。
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: どの作業場所からでも knowledge の規約を画面と MCP で参照できる
  - name: エージェント
    interest: '`source: knowledge` で規約を検索・取得でき、knowledge の外から誤って書き込まない'
trigger: 利用者が新しい端末で knowledge を使用し始める
preconditions:
  - 端末に knowledge のクローンがある
  - '`/project-index:global-setup` を終え、端末の設定（`~/.config/project-index/settings.yaml`）がある'
  - 画面を開く dev-docs の `/dev-docs:global-setup` を終えている
success_guarantee: '端末の設定の `sources[]` に knowledge があり、画面で develop の文書が開け、どの作業場所からも `search_docs` に `source: knowledge` を指定すると knowledge の文書が返る。'
minimal_guarantee: 登録の点検で誤りがあれば `sources[]` を書き換えず、誤りのあるファイルと内容を利用者へ返却する。
frequency: 端末ごとに 1 回（再インストール・端末の移行のときにもう 1 回）
priority: 高（shuhei1101/ai-monitor#3093 が待っている）
notes:
  E2E テストの動かし方: 登録のノードは、「利用者が project-index に knowledge を登録する」の補足のとおり、スキルを動かさずにスキルが行う処理をテストが順に行う
test_file: tests/e2e/複合ユースケース/test_利用者が端末にknowledgeを導入して規約を参照する.py
