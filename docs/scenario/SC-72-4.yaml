id: "SC-72-4"
visibility: internal
title: "エージェントが knowledge の文書を検索・取得する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 差し替えない
      - name: 作業場所
        description: 'knowledge のクローンの外の作業場所（例: 別のリポジトリのクローン）'
      - name: 配信中の knowledge
        description: 用語集に別名を持つ用語がある（用語 `A.I.VOICE 2`、別名 `A.I.VOICE2`）
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        E->>M: search_docs に source knowledge と単語・タグ
        M-->>E: ヒットした文書の名前・説明・タグ
        E->>M: search_docs に group_by tags
        M-->>E: タグの名前ごとの件数
        E->>M: search_docs に文書の ID
        M-->>E: 文書の本文
        E->>M: list_match_words に source knowledge
        M-->>E: 用語集の用語と文書の名前・別名
        E->>M: search_docs に term A.I.VOICE2
        M-->>E: 用語集の用語
      ```

      <!-- /map -->
    expected:
      - '`search_docs` が knowledge の規約を返却し、各行が `name`・`description`・`tags` を持つ'
      - 規約の `tags` がタグの名前（`topic:文章` など）の文字列の配列で返り、`tags` の `eq` でタグの名前に一致する規約がヒットする
      - '規約の `main_tags` が `main: true` のタグの名前だけを返却する'
      - "`group_by: tags` がタグの名前ごとに数え、`{'name': ...}` の値を返却しない"
      - files.yaml の行の Markdown（`skills/text-review/SKILL.md`）も検索にヒットする
      - ID で取得した本文が develop のファイルの中身と一致する
      - '`list_match_words` が用語集（`docs/terms.yaml`）の用語の `name`・`aliases` を、文書の名前・別名と並べて返却する'
      - '`search_docs` の `term` に `A.I.VOICE2` を指定すると、用語 `A.I.VOICE 2` がヒットする'
    test: test_normal
  - name: 異常シナリオ（作業場所が scope.read の外）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 端末の設定
        description: knowledge の `scope.read` を knowledge のクローンだけに狭めた設定
      - name: 作業場所
        description: knowledge のクローンの外の作業場所
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        E->>M: search_docs に source knowledge
        M-->>E: scope.read の外として返却する
      ```

      <!-- /map -->
    expected:
      - knowledge の文書が 1 件も返らず、`scope.read` の外であることが分かる応答が返る
    test: test_error_when_out_of_read_scope
lead: 'エージェントが project-index の文書の MCP の `search_docs` に `source: knowledge` を指定し、規約や files.yaml の行の Markdown・ソースコードを検索・取得する。'
primary_actor: エージェント
trigger: エージェントが作業の前に該当する規約を検索する
preconditions:
  - knowledge が project-index に登録され、配信中
  - エージェントの作業場所が knowledge の `scope.read` に入る
success_guarantee: ヒットした文書の名前・説明・タグと、取得した本文が返る。
minimal_guarantee: '`scope.read` の外の作業場所には knowledge の文書を返却しない。'
test_file: tests/e2e/単一ユースケース/test_エージェントがknowledgeの文書を検索・取得する.py
