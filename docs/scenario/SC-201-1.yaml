id: "SC-201-1"
visibility: internal
title: "開発者がスキーマから設計書のテンプレートを生成する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 差し替えない
      - name: スキーマ
        description: 設計書の種類の全てのテンプレートがスキーマから生成した状態の knowledge のクローンで、`schemas/design/er.schema.yaml` のキーの `x-rules` に 1 件追加し、他のスキーマは変えていないもの
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor D as 開発者
        participant G as 生成のスクリプト
        participant S as 設計書のスキーマ
        participant T as テンプレートの文書
        D->>G: 生成のコマンドを実行する
        G->>S: 全てのスキーマを読み込み、$ref を解決する
        G->>T: 全ての種類のスキーマに対応するテンプレートの文書があるかを確認し、読み込む
        loop 設計書の種類のスキーマ
          G->>G: 概要・キーの表・決まりと悪い例・記載例の items を組み立てる
        end
        loop 組み立てた items が今の items と違うテンプレート
          G->>T: items だけを置き換えて書き出す
        end
        G-->>D: 書き換えたテンプレートのパスを出して終了コード 0
      ```

      <!-- /map -->
    expected:
      - '`docs/template/template-er.yaml` の `items` に、追加した `x-rules` の決まりが出る'
      - '`docs/template/template-er.yaml` の `items` 以外のキー（`id`・`name`・`description`・`tags`・`status`・`visibility`・`rev`）は実行の前と同じ値'
      - 設計書の種類の他のテンプレートのファイルは実行の前とバイト単位で同じ
      - 標準出力に `docs/template/template-er.yaml` だけが出る
      - 続けて全ての文書の検査を実行すると成功で終わる
    test: test_normal
  - name: 異常シナリオ（スキーマが読めない）
    setup:
      - name: Mock
        description: 差し替えない
      - name: スキーマ
        description: '`schemas/design/er.schema.yaml` のキーの `$ref` が、無い `$defs` を指す knowledge のクローン'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor D as 開発者
        participant G as 生成のスクリプト
        participant S as 設計書のスキーマ
        D->>G: 生成のコマンドを実行する
        G->>S: 全てのスキーマを読み込み、$ref を解決する
        G-->>D: 解決できない $ref のスキーマのパスと項目を出して終了コード 2
      ```

      <!-- /map -->
    expected:
      - 終了コードが 2
      - 標準エラーに、スキーマのパスと解決できない `$ref` の項目が出る
      - 設計書の種類の全てのテンプレートのファイルは実行の前とバイト単位で同じ
    test: test_error_when_schema_unresolvable
  - name: 異常シナリオ（対応するテンプレートが無い）
    setup:
      - name: Mock
        description: 差し替えない
      - name: テンプレート
        description: '`docs/template/template-er.yaml` を削除した knowledge のクローン'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor D as 開発者
        participant G as 生成のスクリプト
        participant T as テンプレートの文書
        D->>G: 生成のコマンドを実行する
        G->>T: 全ての種類のスキーマに対応するテンプレートの文書があるかを確認する
        G-->>D: 無いテンプレートの ID とスキーマのパスを出して終了コード 2
      ```

      <!-- /map -->
    expected:
      - 終了コードが 2
      - 標準エラーに、無いテンプレートの ID（`template-er`）とスキーマのパス（`schemas/design/er.schema.yaml`）が出る
      - 設計書の種類の残りのテンプレートのファイルは実行の前とバイト単位で同じ
    test: test_error_when_template_missing
lead: 開発者が設計書のスキーマを変えた後に生成のコマンドを実行し、`docs/template/` の設計書の種類のテンプレートの本文をスキーマから書き出す。
issue: 163
primary_actor: 開発者
trigger: 開発者が `schemas/design/` のスキーマを変えて、生成のコマンドを実行する
preconditions:
  - '`schemas/design/` の設計書の種類のスキーマごとに、`docs/template/` に対応するテンプレートの文書がある'
success_guarantee: 全ての設計書の種類のテンプレートの `items` が、スキーマから組み立てたものと一致する。`items` 以外のキーは変わらない。
minimal_guarantee: スキーマが読めないか、対応するテンプレートが無ければ、どのファイルも書き換えずに終了コード 2 で終わり、原因のパスが標準エラーに出る。
notes:
  E2E テストの動かし方: 生成のコマンドを、一時フォルダへコピーした knowledge のクローンで子プロセスとして起動し、終了コード・標準出力・標準エラーと、実行の前後のファイルの中身で確認する
test_file: tests/e2e/単一ユースケース/test_開発者がスキーマから設計書のテンプレートを生成する.py
