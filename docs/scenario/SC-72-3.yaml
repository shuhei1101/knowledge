id: "SC-72-3"
visibility: internal
title: "利用者が画面で knowledge の文書を読む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 差し替えない
      - name: 配信中の knowledge
        description: develop の全ての種類の文書（rule・template・flowchart・guide・changelog・skill・用語集）と files.yaml の行がある
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant D as dev-docs の画面
        participant V as knowledge の変換のスクリプト
        U->>D: knowledge のタブとサイドバーから文書を選ぶ
        alt docs の種類の文書
          D->>V: 標準入力に文書の YAML
          V-->>D: mdmark の記法の Markdown
        else files.yaml の行
          D->>D: 行の path のファイルを本文として読む
        end
        D-->>U: 共通スタイルで描いた本文
      ```

      <!-- /map -->
    expected:
      - 全ての種類の文書が HTTP 200 で開け、本文が空でない
      - タブとサイドバーの並びが `dev-docs.yaml` の `nav` と一致する
      - '規約『文章の書き方』（`docs/rule/convention-writing-style`）の本文で、埋め込みのマーカー `<!-- embed: word-list-ai-slop -->` の位置に対応表の `| NG | OK |` の表が出て、マーカーと「埋め込めません」の注意書きが残らない'
    test: test_normal
  - name: 正常シナリオ（対応表を更新した後に開き直す）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 配信中の knowledge
        description: 規約『文章の書き方』を 1 回開いた後に、対応表 `docs/word-list/word-list-ai-slop.yaml` の `entries` へ 1 行追加する（規約の文書は変えない）
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant D as dev-docs の画面
        participant V as knowledge の変換のスクリプト
        U->>D: 規約『文章の書き方』を開く
        D->>V: 標準入力に規約の YAML
        V-->>D: mdmark の記法の Markdown
        D-->>U: 対応表の表を持つ本文
        Note over U,D: 対応表の entries へ 1 行追加する
        U->>D: 規約『文章の書き方』を開き直す
        D->>V: 標準入力に規約の YAML
        V-->>D: mdmark の記法の Markdown
        D-->>U: 追加した行を含む本文
      ```

      <!-- /map -->
    expected:
      - 開き直した本文の対応表の表に、追加した行の NG の単語が出る
    test: test_normal_when_word_list_updated
  - name: 異常シナリオ（変換のスクリプトが失敗する）
    setup:
      - name: Mock
        description: 変換のスクリプトを、終了コード 1 で終わるものに差し替える
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant D as dev-docs の画面
        participant V as knowledge の変換のスクリプト
        U->>D: docs の種類の文書を選ぶ
        D->>V: 標準入力に文書の YAML
        V-->>D: 終了コード 1
        D-->>U: 変換に失敗したことと理由
      ```

      <!-- /map -->
    expected:
      - 画面に変換に失敗したことと理由（`exit`）が出る
      - files.yaml の行の Markdown（`plugins/knowledge/skills/text-review/SKILL.md`）は開ける
    test: test_error_when_converter_fails
lead: 利用者が dev-docs の画面で、`nav` のタブとサイドバーから knowledge の文書を開き、変換した本文を読む。
primary_actor: 利用者
trigger: 利用者がブラウザで dev-docs の画面の knowledge を開く
preconditions:
  - knowledge が dev-docs に登録され、配信中
success_guarantee: 開いた文書の本文が mdmark の共通スタイルで描かれる。
minimal_guarantee: 変換に失敗した文書は、失敗したことと理由を画面に出し、他の文書は開ける。
test_file: tests/e2e/単一ユースケース/test_利用者が画面でknowledgeの文書を読む.py
