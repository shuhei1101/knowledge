id: SC-327-1
visibility: internal
title: 利用者がマーケットプレイスからプラグイン knowledge を入れてスキルを呼ぶ
lead: 利用者が knowledge のマーケットプレイスを登録してプラグイン knowledge を入れ、Claude Code のセッションでスキル `/knowledge:text-review` を呼ぶ。
primary_actor: 利用者
trigger: 利用者が端末で `claude plugin install knowledge@knowledge` か `claude plugin update knowledge@knowledge` を実行する
preconditions:
  - Claude Code を入れてある
success_guarantee: '`knowledge@knowledge` が有効になり、`installPath` が指すフォルダに `plugins/knowledge/` の中身（`.claude-plugin/plugin.json`・`skills/text-review/SKILL.md`）が入る。'
minimal_guarantee: プラグインを入れられなくても、端末の他のプラグインとマーケットプレイスの登録は変わらない。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 差し替えない
      - name: マーケットプレイス
        description: 作業ブランチのクローン。`.claude-plugin/marketplace.json` が、プラグイン knowledge の `source` に `./plugins/knowledge` を持つ
      - name: プラグインの保存先
        description: 空の一時フォルダ
        notes: '`CLAUDE_CODE_PLUGIN_CACHE_DIR` に指定する'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant C as Claude Code の CLI
        participant M as knowledge のマーケットプレイス
        U->>C: claude plugin marketplace add {クローンのパス}
        C->>M: marketplace.json を参照する
        M-->>C: プラグインの一覧と source
        U->>C: claude plugin install knowledge@knowledge
        C->>M: source の plugins/knowledge を取得する
        M-->>C: plugin.json と skills/
        C-->>U: 入れた結果
        U->>C: claude plugin list --json
        C-->>U: プラグインの一覧
      ```

      <!-- /map -->
    expected:
      - '`claude plugin list --json` に `knowledge@knowledge` が有効で出る'
      - '`installed_plugins.json` の `knowledge@knowledge` の `installPath` が指すフォルダに `.claude-plugin/plugin.json` と `skills/text-review/SKILL.md` がある'
      - '`installPath` が指すフォルダに `plugins/knowledge/` の外のファイル（`docs/`・`dev-docs.yaml`）が無い'
    test: test_normal
  - name: 正常シナリオ（導入済みの端末で更新する）
    setup:
      - name: Mock
        description: 差し替えない
      - name: プラグインの保存先
        description: 一時フォルダ。`CLAUDE_CODE_PLUGIN_CACHE_DIR` に指定する
      - name: 登録済みのマーケットプレイス
        description: クローンを `source` が `./` の commit でマーケットプレイスとして登録し、`knowledge@knowledge` を入れてある
        notes: 更新の前の `installPath` を記録しておき、クローンを作業ブランチの commit に進める
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant C as Claude Code の CLI
        participant M as knowledge のマーケットプレイス
        U->>C: claude plugin marketplace update knowledge
        C->>M: marketplace.json を参照する
        M-->>C: source が ./plugins/knowledge
        U->>C: claude plugin update knowledge@knowledge
        C->>M: source の plugins/knowledge を取得する
        M-->>C: plugin.json と skills/
        C-->>U: Restart to apply changes.
        U->>C: claude plugin list --json
        C-->>U: プラグインの一覧
      ```

      <!-- /map -->
    expected:
      - '`claude plugin list --json` に `knowledge@knowledge` が有効で出る'
      - '`installed_plugins.json` の `knowledge@knowledge` の `installPath` が更新の前と変わる'
      - 新しい `installPath` が指すフォルダに `skills/text-review/SKILL.md` があり、`plugins/knowledge/` の外のファイル（`docs/`・`dev-docs.yaml`）が無い
      - 開いているセッションへは `/reload-plugins` かセッションの起動し直しで反映する旨を CLI が出す（`Restart to apply changes.`）
    test: test_normal_when_updating_installed_plugin
test_file: tests/e2e/単一ユースケース/test_利用者がマーケットプレイスからプラグインknowledgeを入れてスキルを呼ぶ.py
notes:
  E2E テストの動かし方: '`CLAUDE_CODE_PLUGIN_CACHE_DIR` でプラグインの保存先を一時フォルダに分け、作業ブランチのクローンをマーケットプレイスとして登録して、`claude plugin` のコマンドを子プロセスとして起動し、`claude plugin list --json` の出力と `installed_plugins.json` が指すフォルダを確認する。セッションの起動とモデルの呼び出しは含めない'
