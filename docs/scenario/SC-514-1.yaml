id: SC-514-1
visibility: internal
title: エージェントがネットミームの配信元へ作品とネットミームを直コミットで書き込む
lead: エージェントが、利用者が確認した作品とネットミームを、`write_docs` の `commit` でネットミームの配信元へ書き込み、project-index がスキーマと検査のスクリプトで検査してから develop へコミットしてプッシュする。
primary_actor: エージェント
trigger: エージェントが、利用者と確認した作品かネットミームを登録する
preconditions:
  - ネットミームの配信元（`knowledge-memes`）が端末の設定の `sources[]` に登録され、配信中
  - エージェントの作業場所が、端末の設定の `sources[].direct_commit.scope` に該当する
  - knowledge のクローンに、develop を踏んだワークツリー（`.claude/worktrees/develop`）があり、リモートとの差が無い
success_guarantee: 検査に合格した作品・ネットミームだけが、develop のコミットとしてリモートへプッシュされ、ネットミームの配信元の検索で取得できる。
minimal_guarantee: 違反のある内容・直コミットを呼べない作業場所からの書き込みは、ワークツリーのファイルを変えず、コミットもせずに `isError` で返却する。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 差し替えない。プッシュ先は一時フォルダに作った bare リポジトリの `origin`
      - name: 作業場所
        description: knowledge のクローンの外部で、`direct_commit.scope` に該当する作業場所
      - name: 登録済みの作品
        description: '`memes/works/` に作品 `kusuriya`（`type: anime`）がある'
      - name: 書き込む内容
        description: 作品 `kusuriya` を指し、内容の分類のタグ `topic:セリフ` と作品のタグ `topic:薬屋` を持つネットミーム
        notes: '`id: kusuriya-dokudesu`・`work: kusuriya`・`styles: [{type: verbatim}]`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        participant V as knowledge の検査のスクリプト
        participant W as develop のワークツリー
        participant R as リモート
        E->>M: write_docs に source knowledge-memes・ネットミーム・commit
        M->>R: 最新を早送りで取り込む
        M->>M: 直コミットを呼べる作業場所とスキーマを確認する
        M->>V: 標準入力にネットミームの YAML
        V-->>M: 終了コード 0 と空の違反の配列
        M->>W: ネットミームを書き込んでコミットする
        M->>R: プッシュする
        M-->>E: 書き込んだ文書とコミット
      ```

      <!-- /map -->
    expected:
      - リモートの develop の最新のコミットが `memes/memes/kusuriya-dokudesu.yaml` だけを追加している
      - '応答の `commit` に、コミットの `sha` と `branch: develop` が入る'
      - '`search_docs` に `source: knowledge-memes` と種類 `meme` を指定すると、`name` が `term` の値、`related` が作品 `kusuriya` の文書がヒットする'
      - '`search_docs` に `source: knowledge` を指定した検索と `group_by: tags` の集計に、作品とネットミームが出ない'
    test: test_normal
  - name: 異常シナリオ（指す作品が無い）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 書き込む内容
        description: '`memes/works/` に無い作品を指すネットミーム'
        notes: '`work: missing-work`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        participant V as knowledge の検査のスクリプト
        E->>M: write_docs に source knowledge-memes・ネットミーム・commit
        M->>V: 標準入力にネットミームの YAML
        V-->>M: 終了コード 0 と違反の配列
        M-->>E: isError と違反の一覧
      ```

      <!-- /map -->
    expected:
      - ワークツリーのファイルが変わらず、リモートの develop にコミットが増えない
      - 応答が `isError` で、違反の `path` が `work`、内容に指した作品の ID が入る
    test: test_error_when_work_not_found
  - name: 異常シナリオ（内容の分類のタグが無い）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 書き込む内容
        description: 作品のタグだけを持ち、内容の分類のタグ（`topic:セリフ` など）を持たないネットミーム
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        participant V as knowledge の検査のスクリプト
        E->>M: write_docs に source knowledge-memes・ネットミーム・commit
        M->>V: 標準入力にネットミームの YAML
        V-->>M: 終了コード 0 と違反の配列
        M-->>E: isError と違反の一覧
      ```

      <!-- /map -->
    expected:
      - ワークツリーのファイルが変わらず、リモートの develop にコミットが増えない
      - 応答が `isError` で、違反の `path` が `tags`、内容に内容の分類のタグの一覧が入る
    test: test_error_when_content_tag_missing
  - name: 異常シナリオ（パロディに型が無い）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 書き込む内容
        description: '`styles[].type: parody` で `patterns` を持たないネットミーム'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        E->>M: write_docs に source knowledge-memes・ネットミーム・commit
        M->>M: スキーマを確認する
        M-->>E: isError とスキーマの違反
      ```

      <!-- /map -->
    expected:
      - ワークツリーのファイルが変わらず、リモートの develop にコミットが増えない
      - 応答が `isError` で、違反の `path` が `styles` の要素、内容に `patterns` の欠けが入る
    test: test_error_when_parody_patterns_missing
  - name: 異常シナリオ（作業場所が直コミットの範囲の外）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 作業場所
        description: '`direct_commit.scope` に該当しない作業場所'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant E as エージェント
        participant M as project-index の文書の MCP
        E->>M: write_docs に source knowledge-memes・ネットミーム・commit
        M-->>E: isError と DirectCommitNotPermittedError
      ```

      <!-- /map -->
    expected:
      - ワークツリーのファイルが変わらず、リモートの develop にコミットが増えない
      - 応答が `isError` で、`DirectCommitNotPermittedError` と該当しなかった種類 `meme` が入る
    test: test_error_when_out_of_direct_commit_scope
notes:
  E2E テストの動かし方: 一時フォルダに knowledge のクローンと bare リポジトリの `origin` を作り、一時フォルダの端末の設定で project-index を起動して、文書の MCP の `write_docs` を呼ぶ。プッシュ先は bare リポジトリにし、GitHub へはプッシュしない
test_file: tests/e2e/単一ユースケース/test_エージェントがネットミームを直コミットで書き込む.py
