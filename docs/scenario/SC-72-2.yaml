id: "SC-72-2"
visibility: internal
title: "利用者が project-index に knowledge を登録する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 差し替えない。端末の project-index（管理の MCP の `check_project`・`reload`）をそのまま使用する
      - name: knowledge のクローン
        description: develop を踏んだクローン。`project-index.yaml` と `files.yaml` が範囲のファイルと一致している
      - name: 端末の設定
        description: '`sources[]` に knowledge が無い'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant S as project-index の setup
        participant A as project-index の管理の MCP
        participant K as knowledge のクローン
        participant C as 端末の設定
        U->>S: /project-index:setup とクローンのパス
        S->>A: check_project
        A->>K: project-index.yaml と文書・スクリプトを参照する
        A-->>S: 違反なし
        S->>U: scope.write と scope.read を聞く
        U-->>S: scope.read は全ての作業場所、scope.write はクローンと worktree
        S->>C: sources に knowledge の行を記載する
        S->>A: reload
        A-->>S: 配信中
        S-->>U: 追加した配信元と点検の結果
      ```

      <!-- /map -->
    expected:
      - '`sources[]` に knowledge の行があり、`config` が knowledge の `project-index.yaml` の絶対パス'
      - '`scope.read` が全ての作業場所、`scope.write` が knowledge のクローンと worktree'
      - 管理の MCP の `status` に knowledge が配信中で載る
    test: test_normal
  - name: 異常シナリオ（点検で違反がある）
    setup:
      - name: Mock
        description: 差し替えない
      - name: 壊した knowledge のクローン
        description: '`project-index.yaml` の documents の行が存在しないスキーマを指す'
        notes: '`schema: schemas/missing.schema.yaml`'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant S as project-index の setup
        participant A as project-index の管理の MCP
        participant C as 端末の設定
        U->>S: /project-index:setup とクローンのパス
        S->>A: check_project
        A-->>S: 違反（キーのパスと理由）
        S-->>U: 違反を示して止まる
      ```

      <!-- /map -->
    expected:
      - '`sources[]` に knowledge の行が追加されていない'
      - 違反のキーのパス（`documents[...].schema`）と理由が利用者へ返る
    test: test_error_when_check_project_fails
lead: 利用者が `/project-index:setup` に knowledge のクローンのパスを指定し、点検に合格したら端末の設定の `sources[]` に knowledge を登録する。
primary_actor: 利用者
trigger: 利用者が `/project-index:setup {knowledge のクローンのパス}` を実行する
preconditions:
  - '`/project-index:global-setup` を終え、端末の設定（`~/.config/project-index/settings.yaml`）がある'
  - knowledge のクローンの直下に `project-index.yaml` がある
success_guarantee: '`sources[]` に knowledge の行（`config`・`scope.read`・`scope.write`）があり、project-index が設定を再読み込みして knowledge を配信している。'
minimal_guarantee: 点検で違反があれば端末の設定を書き換えない。
notes:
  E2E テストの動かし方: スキル `/project-index:setup` は動かさず、スキルが行う処理（管理の MCP の `check_project` → 一時フォルダの端末の設定の `sources[]` への knowledge の行の記載 → `reload` → `status`）をテストが順に行う。スキルの手順（質問の仕方・記載する行）は project-index の E2E が確認する
test_file: tests/e2e/単一ユースケース/test_利用者がproject-indexにknowledgeを登録する.py
