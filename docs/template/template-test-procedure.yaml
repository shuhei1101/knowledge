      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>project-index の配信で、文書の公開範囲のメタデータにする。 | - |
      | tags | タグ | array | - | - | - | 設計書を検索で絞り込むタグで、`name` にタグの名前（`action:`・`topic:`・`tool:` などで始める）、最も分量の多い主題 1 つに `main: true` を記載する。<br>付け方は knowledge の規約『文書のタグと description の記載』に従う。 | project-index の検索で、文書をタグで絞り込む。 | `[{main: true, name: topic:タグ}, name: action:記載]` |
      | tags[].name | タグの名前 | string | 必須 | - | minLength: `1` | タグの名前。`action:`・`topic:`・`tool:` などで始める。 | 検索で、文書をタグで絞り込む値にする。 | - |
      | tags[].main | 主題 | boolean | - | - | - | 最も分量の多い主題のタグだけ `true` にする。 | 検索で、文書の主題のタグとして扱う。 | - |
      | aliases | 別名 | array | - | - | - | 検索でヒットさせたい言い換え。 | project-index の検索で、文書を名前と同じように検索できる言い換えにする。 | - |
      | title | タイトル | string | 必須 | - | - | `テスト実行方法`。 | 生成で、ページの見出しにする。<br>project-index の検索で、文書の名前にする。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>project-index の検索で、文書の概要文にする。 | - |
      | prerequisites | 前提 | array | - | - | - | 全種別に共通の前提（言語ランタイム・依存サービス・環境変数）。 | 実行で、テストを実行する前にランタイム・依存サービス・環境変数を用意する。 | - |
      | layers | テスト種別 | array | 必須 | - | minItems: `1` | テスト種別ごとの実行コマンド。 | テストで、種別ごとに実行するコマンドを決める。<br>生成で、種別ごとのセクションにする。 | - |
      | layers[].id | ID | string | 必須 | - | pattern: `^[A-Za-z0-9_-]+$` | 設計書の中で一意な要素の ID。1 要素 1 ページにするときのページの ID になる。 | 生成で、種別を 1 ページにするときのページの ID にする。<br>設計で、ほかの設計書の参照（`TP-1#layers[lint]` 等）から種別を指す。 | `TL-1` |
      | layers[].name | 種別 | string | 必須 | `非機能要件テスト` / `E2E テスト` / `結合テスト（フロント）` / `結合テスト（バック）` / `単体テスト（フロント）` / `単体テスト（バック）` / `外部疎通テスト` / `lint` | - | テスト種別の名前（`単体`・`結合`・`E2E`・`lint`）。 | テストで、テストのレベル（単体・結合・E2E・lint）とテストの配置先を対応させる。<br>生成で、セクションの見出しにする。 | - |
      | layers[].description | 説明 | string | - | - | - | 使用するツールと実行の方式。 | テストで、使用するツールと実行の方式を決める。 | - |
      | layers[].prerequisites | 前提 | array | - | - | - | 種別に固有の前提（起動しておくもの・Mock の状況・誤実行を防ぐフラグ）。 | 実行で、種別のテストを実行する前に、起動しておくもの・Mock・フラグを用意する。 | - |
      | layers[].run_all | 全件実行 | string | 必須 | - | - | 1 コマンドのコードブロック（`bash`）。 | 実行で、実装・テスト作成の後に全件を実行するコマンドにする。<br>レビューで、配置されたテストのログが同じコマンドの出力かを照合する。 | - |
      | layers[].run_one | 個別実行 | object | - | - | - | 1 つのテストだけを実行するコマンドと、その指定方法。 | 実行で、失敗したテストだけを再実行するコマンドにする。 | - |
      | layers[].run_one.label | 単位 | string | 必須 | - | - | `シナリオ` / `画面` / `エンドポイント` / `ファイル` 等。見出しは `個別{単位}実行`。 | 生成で、`個別{単位}実行` の見出しにする。 | - |
      | layers[].run_one.command | コマンド | string | 必須 | - | - | プレースホルダの形式（`{シナリオファイルパス}`）の 1 コマンドのコードブロック。 | 実行で、失敗したテストだけを再実行するときにプレースホルダを置き換えて実行する。<br>実行で、判定フローチャート『結合テストの実行範囲』で決めた結合テストだけを実行するときにプレースホルダを置き換えて実行する。 | - |
      | layers[].location | 実行場所 | string | - | `runner` / `local` | - | 全件を回す場所（`runner` = GitHub Actions のランナー / `local` = 手元）。 | 実行で、全件をランナーの全件実行で回すか、手元の全件実行で回すかを決める。 | - |
      | layers[].run_runner | ランナーでの実行 | string | - | - | - | `location` が `runner` の層だけが持つ。層の全件か、指定した結合テストを回す workflow を `workflow_dispatch` で起動し、終わるまで待ち、ログを取得する 1 コマンドのコードブロック（`bash`）。 | 実行で、ランナーで全件を実行するコマンドにする。<br>実行で、判定フローチャート『結合テストの実行範囲』で決めた結合テストをランナーで実行するコマンドにする。<br>レビューで、配置されたテストのログが同じコマンドの出力かを照合する。 | - |
      | layers[].carry_over | セッションを跨いで実行する形式 | string | - | - | - | E2E テストだけが持つ。結果と状態を配置するフォルダ（`RUN_DIR`）と、その中のファイルの名前を記載する。 | 実行で、E2E の結果と状態を配置するフォルダとファイルを決める。 | - |
      | layers[].monitoring | 実行中の進行の監視 | string | - | - | - | E2E テストだけが持つ。 | 実行で、E2E の実行中に進行を確認する方法にする。 | - |
      | layers[].abort | 実行の中断 | string | - | - | - | 中断の仕方。E2E テストは合図ファイル（`$RUN_DIR/abort`）。 | 実行で、実行を中断するときの手順にする。 | - |
      | layers[].duration | 所要時間の目安 | string | - | - | - | 全件実行の所要時間の目安。 | 実行で、実行を待つ時間と、ほかの全件実行と重ねないかを判断する。 | - |
      | layers[].parallel | 並列にできる | boolean | - | - | - | ほかの作業の全件実行と同時に実行してよいなら `true`。 | 実行で、ほかの作業の全件実行と同時に実行してよいかを判断する。 | - |
      | layers[].excluded_paths | 実行に影響しないパス | array | - | - | - | 変更しても結合テストの結果が変わらないパスの glob。結合テストの層だけが持つ。 | 実行で、判定フローチャート『結合テストの実行範囲』の Q1 で、変更したファイルの分を実行しないかを決める。<br>レビューで、実行範囲の表の R1 の行が一覧のとおりかを確認する。 | `[docs/pr/**, README.md, tests/unit/**]` |
      | layers[].full_run_paths | 全件にするパス | array | - | - | - | 変更したら層の全件を実行するパスの glob と、全件が必要だと分かっている理由。結合テストの層だけが持つ。 | 実行で、判定フローチャート『結合テストの実行範囲』の Q3 で、層の全件を実行するかを決める。<br>レビューで、実行範囲の表の R3 の行が一覧のとおりかと、理由が全件の必要を示すかを確認する。 | `[{path: tests/conftest.py, reason: 全ての結合テストが使用するフィクスチャを持つ}, {path: uv.lock, reason: 依存のバージョンが変わると、全ての結合テストの実行環境が変わる}]` |
      | layers[].full_run_paths[].path | パス | string | 必須 | - | - | 全件にするパスの glob。 | 実行で、変更したファイルと照合する。 | - |
      | layers[].full_run_paths[].reason | 理由 | string | 必須 | - | minLength: `1` | そのパスを変更すると全件が必要だと分かっている理由。 | レビューで、全件にする理由が「安全のため」「分からないため」になっていないかを確認する。 | - |
      | layers[].folder_map | フォルダの対応表 | array | - | - | - | ソースのフォルダ（文書・スキーマ・設定のフォルダを含む）と、そのフォルダの変更で実行する結合テストのフォルダかファイル。結合テストの層だけが持つ。 | 実行で、判定フローチャート『結合テストの実行範囲』の Q4 で、変更したファイルに対応する結合テストを決める。<br>レビューで、実行範囲の表の R5 の行が対応表のとおりかを確認する。 | `[{source: src/app/mcp/**, tests: [tests/integration/mcp/]}, {source: docs/phase/**, tests: [tests/integration/docs/test_phase_docs.py]}]` |
      | layers[].folder_map[].source | ソースのフォルダ | string | 必須 | - | - | ソースのフォルダの glob。 | 実行で、変更したファイルと照合する。 | - |
      | layers[].folder_map[].tests | 結合テスト | array | 必須 | - | minItems: `1` | 実行する結合テストのフォルダかファイル。 | 実行で、個別実行の `{結合テストのパス}` に並べる。 | - |
      | layers[].test_selector | 関係するテストを選ぶ道具 | string | - | - | - | 変更したコードを通る結合テストを選ぶ道具の 1 コマンドのコードブロック（`bash`）。道具を使用できる結合テストの層だけが持つ。 | 実行で、判定フローチャート『結合テストの実行範囲』の Q4・Q5 の代わりに、道具の結果で実行する結合テストを決める。 | - |
      | layers[].parallelism | 並列の設定 | object | - | - | - | 1 回の実行の中でテストを複数のプロセスに分けて実行するときの値。結合テストの層だけが持つ。 | 実行で、判定フローチャート『結合テストの並列数』で並列数を求める。 | `{enabled: true, fixed_memory_gb: 2.5, max: 4, memory_per_process_gb: 0.5}` |
      | layers[].parallelism.enabled | 層の中で並列にできる | boolean | 必須 | - | - | 層のテストを複数のプロセスに分けて実行してよいなら `true`。 | 実行で、判定フローチャート『結合テストの並列数』の Q3 で、並列数 1 で実行するかを決める。 | - |
      | layers[].parallelism.memory_per_process_gb | 1 並列あたりのメモリ | number | - | - | - | 1 並列が使用するメモリ（GB）。全件実行の最大の実測を並列数で割った値。 | 実行で、メモリから求めた並列数の分母にする。 | - |
      | layers[].parallelism.fixed_memory_gb | 固定のメモリ | number | - | - | minimum: `0` | 並列数に比例しないメモリ（GB）。Storybook・ビルド・テストの準備処理の分。 | 実行で、メモリから求めた並列数を求めるときに空きのメモリから引く。 | - |
      | layers[].parallelism.max | 並列数の上限 | integer | - | - | minimum: `1` | 層で使用する並列数の上限。 | 実行で、メモリ・CPU から求めた数と比べて並列数を決める。 | - |
      | layers[].external_cost | 外部への依存と費用 | string | - | - | - | テストが呼ぶ外部のサービスと、発生する費用。 | 実行で、実行の前に外部への依存と費用の確認が要るかを判断する。 | - |
      | layers[].results | 結果の配置場所 | string | - | - | - | 実行した結果のログを配置する場所。 | 実行で、実行した後に結果のログを探す場所にする。 | - |
      | layers[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。 | - |
      | refs | 関連 | array | - | - | maxItems: `8` | 関連する設計書の一覧。 | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | refs[].to | 相手の ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 関連先の設計書の最上位の `id`。項目のパスは `item` に分ける。 | 検査で、関連先の設計書が実在するかを確認する。<br>project-index の `trace_related` で、文書の ID と一致させて関連をたどる。 | `IF-12` / `IF-3038-1` |
      | refs[].item | 項目のパス | string | - | - | pattern: `^(?:[^\s\[\]#]\|\[(?:[^\[\]]\|\[[^\[\]]*\])*\])(?:[^\s\[\]]\|\[(?:[^\[\]]\|\[[^\[\]]*\])*\])*$` | 関連先の項目のパス。設計書全体を指すときは記載しない。 | 検査で、`to` の設計書に項目が実在するかを確認する。<br>生成で、関連先の項目へのリンクにする。 | `flows[正常系]` / `functions[resolve_base].exceptions` |
      | refs[].type | 関係の種類 | string | 必須 | `requires` / `references` / `replaces` / `part_of` / `change_together` | - | 関係の種類で、`requires`（前提にする）/ `references`（参照する）/ `replaces`（置き換える）/ `part_of`（一部になる）/ `change_together`（同時に修正する）のどれか。 | レビューで、関連先の変更がこの設計書へ及ぶかを判断する。<br>project-index の `trace_related` で、たどった関連の影響の理由にする。 | - |
      | refs[].when | いつ参照するか | string | 必須 | - | pattern: `^[^\n]+$`, minLength: `1` | 関連先をいつ参照するかの 1 文。 | 実装とレビューで、関連先を参照する場面を判断する。 | `例外の型を変えるときに、呼び出し側の異常系のフローを確認する。` |
      | refs[].paths | 対象のパス | array | - | - | - | 機械で判定できるときだけ、関連が該当するファイルの glob を並べる。 | 検査で、該当するファイルを変えたときに関連先を確認させる。 | `[scripts/*.py]` |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。<br>実装とレビューで、`画面の起動` のセクションの手順で作業ブランチの worktree から画面を起動して閲覧 URL を開き、確認した後に止める。 | `` {画面の起動: "実装した画面を開いて確認するときは、作業ブランチの worktree で画面を配信する側に合わせて起動する。\n\n\| 画面 \| 起動 \| 止め方 \|\n\| --- \| --- \| --- \|\n\| アプリの画面 \| `npm run build` でビルドし、`uv run python -m app.preview` を裏で起動して、標準出力に出た閲覧 URL を開く \| 起動したプロセスへ `SIGTERM` を送信する \|\n\| 画面の部品（Storybook） \| `npm run storybook` を裏で起動し、標準出力に出た閲覧 URL を開く \| 起動したプロセスへ `SIGTERM` を送信する \|"} `` |

