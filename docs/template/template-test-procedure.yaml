# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-test-procedure
kind: template
name: "テンプレート: テスト実行方法"
description: テスト種別ごとの実行コマンドと前提を記載するテスト実行方法のテンプレート。
tags:
  - name: scope:テンプレート
    main: true
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      テスト種別ごとの実行コマンドと前提。1 プロジェクト 1 ファイル。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | title | タイトル | string | 必須 | - | - | `テスト実行方法`。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。<br>初回に書いた内容のまま保ち、後から情報を追加しない（仕様は各項目に書く）。<br>対象そのものが変わったときだけ書き換える。 | - |
      | prerequisites | 前提 | array | - | - | - | 全種別に共通の前提（言語ランタイム・依存サービス・環境変数）。 | - |
      | layers | テスト種別 | array | 必須 | - | minItems: 1 | テスト種別ごとの実行コマンド。コマンドが決まるまでは `run_all` を `未確定` にする。<br>`lint` 層は、プロジェクトの言語に応じて linter・formatter の check・型検査・構造と依存の向きの検査を揃える（コンパイラが担う検査は除く）。<br>CI・pre-commit・マニフェストのスクリプト・コーディング規約で使うと決めたツールが持つ検査は `lint` 層へコピーし、`lint` 層に無い検査を残さない。<br>型検査と構造の検査は、変更ファイルだけでなくプロジェクト全体に回す。<br>全件実行は、どれかが失敗しても全ての検査を最後まで回し、1 つでも失敗したら失敗で終える 1 コマンドにまとめる（task runner・スクリプト・終了コードを集約するサブシェル 等）。 | - |
      | layers[].name | 種別 | string | 必須 | 非機能要件テスト / E2E テスト / 結合テスト（フロント） / 結合テスト（バック） / 単体テスト（フロント） / 単体テスト（バック） / 外部疎通テスト / lint | - | - | - |
      | layers[].description | 説明 | string | - | - | - | 使うツールと実行の方式。 | - |
      | layers[].prerequisites | 前提 | array | - | - | - | 種別に固有の前提（起動しておくもの・Mock の状況・誤実行を防ぐフラグ）。料金・副作用のある種別は必ず書く。 | - |
      | layers[].run_all | 全件実行 | string | 必須 | - | - | 1 コマンドのコードブロック（`bash`）。 | - |
      | layers[].run_one | 個別実行 | object | - | - | - | - | - |
      | layers[].run_one.label | 単位 | string | 必須 | - | - | `シナリオ` / `画面` / `エンドポイント` / `ファイル` 等。見出しは `個別{単位}実行`。 | - |
      | layers[].run_one.command | コマンド | string | 必須 | - | - | プレースホルダの書式（`{シナリオファイルパス}`）の 1 コマンドのコードブロック。 | - |
      | layers[].monitoring | 実行中の進行の監視 | string | - | - | - | E2E テストだけが持つ。 | - |
      | layers[].abort | 実行の中断 | string | - | - | - | 中断の仕方。 | - |
      | layers[].duration | 所要時間の目安 | string | - | - | - | - | - |
      | layers[].parallel | 並列にできる | boolean | - | - | - | - | - |
      | layers[].external_cost | 外部への依存と費用 | string | - | - | - | - | - |
      | layers[].results | 結果の置き場所 | string | - | - | - | - | - |
      | layers[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |
      | refs | 関連 | array | - | - | - | - | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      title: テスト実行方法
      lead: テスト種別ごとの実行コマンドと前提。
      prerequisites:
      - Python 3.14 と uv
      - 'DB: PostgreSQL 16 のローカル起動（`docker compose up -d postgres`）'
      layers:
      - name: 単体テスト（バック）
        description: pytest で実行する。DB / API に依存しない。
        prerequisites:
        - 外部依存なし（純粋関数と Mock だけ）
        run_all: |-
          ```bash
          uv run pytest tests/unit/
          ```
        run_one:
          label: ファイル
          command: |-
            ```bash
            uv run pytest {単体テストファイルパス}
            ```
        parallel: true
      - name: 外部疎通テスト
        description: 実 API に繋いで疎通を確かめる。
        prerequisites:
        - 実 API の認証情報を環境変数に設定する
        - 料金と副作用が出ることを認識した上で実行する
        - 誤実行を防ぐため `--run-external` を必須にする
        run_all: |-
          ```bash
          uv run pytest tests/external/ --run-external
          ```
        run_one:
          label: テスト
          command: |-
            ```bash
            uv run pytest {外部疎通テストファイルパス} --run-external
            ```
        external_cost: テストごとの料金は外部API の設計書の料金を見る
      - name: lint
        description: ruff で linter・formatter の check を、pyright で型検査を、import-linter で依存の向きを検査する。型検査と依存の向きの検査はプロジェクト全体に回す。
        prerequisites:
        - 検査の設定は `pyproject.toml` が持つ
        run_all: |-
          ```bash
          (rc=0; uv run ruff check . || rc=1; uv run ruff format --check . || rc=1; uv run pyright || rc=1; uv run lint-imports || rc=1; exit $rc)
          ```
      ```
