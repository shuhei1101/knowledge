  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: {"kind": "data"} -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。<br>対象そのものが変わったときだけ書き換える。 | 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。 | 仕様を冒頭リードに記載している。仕様は各項目へ分ける |
      | layers | 初期構築では種別だけを作り、コマンドはテストを作る担当が確定させる。<br>確定させるまでは `run_all` を `未確定` にする。<br>`lint` 層は、プロジェクトの言語に応じて linter・formatter の check・型検査・構造と依存の向きの検査を全て含める（コンパイラが担う検査は除く）。<br>マニフェストのスクリプト・コーディング規約で使用すると決めたツールが持つ検査は `lint` 層へコピーし、`lint` 層に無い検査を残さない。Git フックと CI では動かさない。<br>GitHub Actions の workflow のファイル（`.github/workflows/`）を持つリポジトリは、`lint` 層に actionlint を含める。<br>GitHub Actions の workflow のファイルを持つリポジトリは、`lint` 層に、`uses:` の `{owner}/{repo}@{バージョン}` が GitHub に実在するかの検査（`gh api repos/{owner}/{repo}/commits/{バージョン}` で参照する）を含める。<br>型検査と構造の検査は、変更ファイルだけでなくプロジェクト全体に回す。<br>全件実行は、どれかが失敗しても全ての検査を最後まで回し、1 つでも失敗したら失敗で終える 1 コマンドにまとめる（task runner・スクリプト・終了コードを集約するサブシェル 等）。 | - | - |
      | layers[].id | 並びの順に `TL-{番号}` を振る。<br>新規に追加する要素には、既にある番号の最大の次を振る。<br>並べ替えても変えない。 | - | - |
      | layers[].description | 他の設計書を指すときは説明文の中にリンクを記載せず、関連は `refs`（`related_item` の配列）に持つ。 | - | - |
      | layers[].prerequisites | 料金・副作用のある種別は必ず記載する。 | - | - |
      | layers[].run_all | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。<br>`parallelism` を持つ層は、並列数をプレースホルダ `{並列数}` で記載する（pytest-xdist は `-n {並列数} --dist loadfile`、vitest は `--maxWorkers={並列数}`）。<br>プールを複数持つ実行は、`{並列数}` をプールの数で割った値を指定する。<br>直列のマーカーで分けて 2 回実行するときは、選ばれたテストが無いときの終了（pytest の終了コード 5）を成功として扱う。 | - | - |
      | layers[].run_one.command | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。<br>結合テストの層は、実行する結合テストのファイルかフォルダを空白で区切って並べるプレースホルダ `{結合テストのパス}` で記載する。<br>`parallelism` を持つ層は、`run_all` と同じく `{並列数}` で記載する。 | - | - |
      | layers[].location | 判定フローチャート『テストの実行場所』で決める。<br>決めるまでは記載しない。 | - | - |
      | layers[].run_runner | `run_all`・`run_one` は手元で回すコマンドのまま残し、ランナーで回せないときに使用する。<br>workflow は手動の起動（`workflow_dispatch`）だけで起動し、push・PR を契機にしない。<br>起動した実行を API で参照できるまで待ってから、終わるまで待つ。<br>決めた回数で実行を参照できなければ、失敗で終える。<br>失敗したときもログを取得してから失敗で終える。<br>`parallelism` を持つ層は、workflow の入力に `{並列数}` を指定するコマンドで記載する。<br>結合テストの層は、workflow の入力に `{結合テストのパス}` を指定するコマンドで記載し、入力を省いたときは全件を回す。 | - | - |
      | layers[].carry_over | 他の設計書を指すときは説明文の中にリンクを記載せず、関連は `refs`（`related_item` の配列）に持つ。 | - | - |
      | layers[].monitoring | 他の設計書を指すときは説明文の中にリンクを記載せず、関連は `refs`（`related_item` の配列）に持つ。 | - | - |
      | layers[].abort | 他の設計書を指すときは説明文の中にリンクを記載せず、関連は `refs`（`related_item` の配列）に持つ。 | - | - |
      | layers[].excluded_paths | エージェントに配信する文書・スキーマで検査する設計書・テストが参照する文書のフォルダは記載しない。<br>ソースのコードのファイルは、コメントだけの変更でも記載しない。<br>ほかの層（単体テスト・E2E など）だけが使用するテストのフォルダは記載する。<br>一覧への追加は、範囲を狭くする変更として reviewer の確認で行ってよい。 | - | - |
      | layers[].full_run_paths | テストの土台（テストのフォルダの下の、テストのファイルでないファイル）・依存のマニフェストとロックファイル・ビルドとテストと lint の設定・ほとんどのエントリーポイントが通る基盤のコードを記載する。<br>一覧への追加は範囲を広げる変更なので、利用者の確認を取ってから行う。 | - | - |
      | layers[].folder_map | 1 つのソースのフォルダを、複数の結合テストのフォルダに対応させてよい（複数の画面が使用する共通の部品は、使用する全ての画面のフォルダ）。<br>文書のフォルダは、その文書を照合するテストのファイルに対応させる。<br>行の削除は範囲を狭くする変更として reviewer の確認で行ってよく、行の追加は reviewer の確認を取ってから行う。 | - | - |
      | layers[].test_selector | 道具が選べないテスト（ソースを import しないテスト等）があるときは、その範囲を説明に記載する。 | - | - |
      | layers[].parallelism | 値は実測から記載し、実測するまでは判定フローチャート『結合テストの並列数』の初期値を使用する。 | - | - |
      | layers[].parallelism.enabled | 共有の資源（固定のポート・固定のパスのファイル・1 つのデータベース・同じ名前の tmux のセッション）を取り合うテストは、直列のマーカーを付けて `true` のまま残す。 | - | - |
      | layers[].notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |
      | refs[].item | 記載方法は参照（`ref`）の `#` より後と同じにする。 | - | - |
      | refs[].type | 片側だけに記載し、逆向きはツールで出す。`change_together` だけは両側に記載する。<br>`type` と記載する側は、規約『ドキュメント管理』の「関連」と判定フローチャート『関連の張り方』で決める。 | - | - |
      | refs[].when | `when` を記載できない関連は張らない。 | - | - |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。<br>実装した画面を作業ブランチの worktree から開く手順を持つプロジェクトは、`画面の起動` のセクションを記載する。<br>`画面の起動` のセクションは、画面・起動・止め方の列を持つ表にし、画面ごとに 1 行を記載する。<br>起動の列には、起動するコマンドと、閲覧 URL を得る方法（標準出力に出る URL・固定のポート・配信のツールの戻り値 等）を記載する。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ````yaml
      id: TP-1
      title: テスト実行方法
      lead: テスト種別ごとの実行コマンドと前提。
      prerequisites:
      - Python 3.12 と uv
      - 'DB: PostgreSQL 16 のローカル起動（`docker compose up -d postgres`）'
      layers:
      - id: TL-1
        name: 単体テスト（バック）
        description: pytest で実行する。DB / API に依存しない。
        prerequisites:
        - 外部依存なし（純粋関数と Mock だけ）
        run_all: |-
          ```bash
          uv run pytest tests/unit/
          ```
        run_one:
          label: ファイル
          command: |-
            ```bash
            uv run pytest {単体テストファイルパス}
            ```
        location: runner
        run_runner: |-
          ```bash
          run_url=$(gh workflow run test.yml --ref "$(git branch --show-current)" -f layer=unit | grep -o 'https://[^ ]*/actions/runs/[0-9]*') && run_id=${run_url##*/} && (n=0; until gh api "repos/{owner}/{repo}/actions/runs/$run_id?exclude_pull_requests=true" > /dev/null 2>&1; do n=$((n+1)); if [ $n -ge 10 ]; then echo "実行 $run_id を 10 秒参照できません" >&2; exit 1; fi; sleep 1; done) && (rc=0; gh run watch "$run_id" --exit-status > /dev/null || rc=1; gh run view "$run_id" --log; exit $rc)
          ```
        parallel: true
      - id: TL-2
        name: 外部疎通テスト
        description: 実 API に繋いで疎通を確認する。
        prerequisites:
        - 実 API の認証情報を環境変数に設定する
        - 料金と副作用が出ることを認識した上で実行する
        - 誤実行を防ぐため `--run-external` を必須にする
        run_all: |-
          ```bash
          uv run pytest tests/external/ --run-external
          ```
        run_one:
          label: テスト
          command: |-
            ```bash
            uv run pytest {外部疎通テストファイルパス} --run-external
            ```
        location: local
        external_cost: テストごとの料金は外部API の設計書の料金を参照する
      - id: TL-3
        name: lint
        description: ruff で linter・formatter の check を、mypy で型検査を、import-linter で依存の向きを検査する。型検査と依存の向きの検査はプロジェクト全体に回す。
        prerequisites:
        - 検査の設定は `pyproject.toml` が持つ
        run_all: |-
          ```bash
          (rc=0; uv run ruff check . || rc=1; uv run ruff format --check . || rc=1; uv run mypy . || rc=1; uv run lint-imports || rc=1; exit $rc)
          ```
      - id: TL-4
        name: 結合テスト（バック）
        description: pytest と pytest-xdist で、ファイルの単位でプロセスに分けて実行する。共有の資源を取り合うテストは `serial_integration` のマーカーを付け、並列の後に並列数 1 で実行する。
        run_all: |-
          ```bash
          (rc=0; uv run pytest tests/integration/ -m "not serial_integration" -n {並列数} --dist loadfile; r=$?; [ $r -eq 0 ] || [ $r -eq 5 ] || rc=1; uv run pytest tests/integration/ -m serial_integration; r=$?; [ $r -eq 0 ] || [ $r -eq 5 ] || rc=1; exit $rc)
          ```
        run_one:
          label: ファイル
          command: |-
            ```bash
            (rc=0; uv run pytest {結合テストのパス} -m "not serial_integration" -n {並列数} --dist loadfile; r=$?; [ $r -eq 0 ] || [ $r -eq 5 ] || rc=1; uv run pytest {結合テストのパス} -m serial_integration; r=$?; [ $r -eq 0 ] || [ $r -eq 5 ] || rc=1; exit $rc)
            ```
        location: local
        excluded_paths:
        - docs/pr/**
        - README.md
        - tests/unit/**
        full_run_paths:
        - path: tests/conftest.py
          reason: 全ての結合テストが使用するフィクスチャを持つ
        - path: uv.lock
          reason: 依存のバージョンが変わると、全ての結合テストの実行環境が変わる
        folder_map:
        - source: src/app/mcp/**
          tests:
          - tests/integration/mcp/
        - source: docs/phase/**
          tests:
          - tests/integration/docs/test_phase_docs.py
        parallelism:
          enabled: true
          memory_per_process_gb: 0.5
          fixed_memory_gb: 2.5
          max: 4
      ````
