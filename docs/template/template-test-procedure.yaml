  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>project-index の配信で、文書の公開範囲のメタデータにする。 | - |
      | tags | タグ | array | - | - | - | 設計書を検索で絞り込むタグで、`name` にタグの名前（`action:`・`topic:`・`tool:` などで始める）、最も分量の多い主題 1 つに `main: true` を記載する。<br>付け方は knowledge の規約『文書のタグと description の記載』に従う。 | project-index の検索で、文書をタグで絞り込む。 | `[{main: true, name: topic:タグ}, name: action:記載]` |
      | tags[].name | タグの名前 | string | 必須 | - | minLength: `1` | タグの名前。`action:`・`topic:`・`tool:` などで始める。 | 検索で、文書をタグで絞り込む値にする。 | - |
      | tags[].main | 主題 | boolean | - | - | - | 最も分量の多い主題のタグだけ `true` にする。 | 検索で、文書の主題のタグとして扱う。 | - |
      | aliases | 別名 | array | - | - | - | 検索でヒットさせたい言い換え。 | project-index の検索で、文書を名前と同じように検索できる言い換えにする。 | - |
      | title | タイトル | string | 必須 | - | - | `テスト実行方法`。 | 生成で、ページの見出しにする。<br>project-index の検索で、文書の名前にする。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>project-index の検索で、文書の概要文にする。 | - |
      | prerequisites | 前提 | array | - | - | - | 全種別に共通の前提（言語ランタイム・依存サービス・環境変数）。 | 実行で、テストを実行する前にランタイム・依存サービス・環境変数を用意する。 | - |
      | layers | テスト種別 | array | 必須 | - | minItems: `1` | テスト種別ごとの実行コマンド。 | テストで、種別ごとに実行するコマンドを決める。<br>生成で、種別ごとのセクションにする。 | - |
      | layers[].id | ID | string | 必須 | - | pattern: `^[A-Za-z0-9_-]+$` | 設計書の中で一意な要素の ID。1 要素 1 ページにするときのページの ID になる。 | 生成で、種別を 1 ページにするときのページの ID にする。<br>設計で、ほかの設計書の参照（`TP-1#layers[lint]` 等）から種別を指す。 | `TL-1` |
      | layers[].name | 種別 | string | 必須 | `非機能要件テスト` / `E2E テスト` / `結合テスト（フロント）` / `結合テスト（バック）` / `単体テスト（フロント）` / `単体テスト（バック）` / `外部疎通テスト` / `lint` | - | テスト種別の名前（`単体`・`結合`・`E2E`・`lint`）。 | テストで、テストのレベル（単体・結合・E2E・lint）とテストの配置先を対応させる。<br>生成で、セクションの見出しにする。 | - |
      | layers[].description | 説明 | string | - | - | - | 使用するツールと実行の方式。 | テストで、使用するツールと実行の方式を決める。 | - |
      | layers[].prerequisites | 前提 | array | - | - | - | 種別に固有の前提（起動しておくもの・Mock の状況・誤実行を防ぐフラグ）。 | 実行で、種別のテストを実行する前に、起動しておくもの・Mock・フラグを用意する。 | - |
      | layers[].run_all | 全件実行 | string | 必須 | - | - | 1 コマンドのコードブロック（`bash`）。 | 実行で、実装・テスト作成の後に全件を実行するコマンドにする。<br>レビューで、配置されたテストのログが同じコマンドの出力かを照合する。 | - |
      | layers[].run_one | 個別実行 | object | - | - | - | 1 つのテストだけを実行するコマンドと、その指定方法。 | 実行で、失敗したテストだけを再実行するコマンドにする。 | - |
      | layers[].run_one.label | 単位 | string | 必須 | - | - | `シナリオ` / `画面` / `エンドポイント` / `ファイル` 等。見出しは `個別{単位}実行`。 | 生成で、`個別{単位}実行` の見出しにする。 | - |
      | layers[].run_one.command | コマンド | string | 必須 | - | - | プレースホルダの形式（`{シナリオファイルパス}`）の 1 コマンドのコードブロック。 | 実行で、失敗したテストだけを再実行するときにプレースホルダを置き換えて実行する。 | - |
      | layers[].location | 実行場所 | string | - | `runner` / `local` | - | 全件を回す場所（`runner` = GitHub Actions のランナー / `local` = 手元）。 | 実行で、全件をランナーの全件実行で回すか、手元の全件実行で回すかを決める。 | - |
      | layers[].run_runner | ランナーの全件実行 | string | - | - | - | `location` が `runner` の層だけが持つ。層の全件を回す workflow を `workflow_dispatch` で起動し、終わるまで待ち、ログを取得する 1 コマンドのコードブロック（`bash`）。 | 実行で、ランナーで全件を実行するコマンドにする。<br>レビューで、配置されたテストのログが同じコマンドの出力かを照合する。 | - |
      | layers[].carry_over | セッションを跨いで実行する形式 | string | - | - | - | E2E テストだけが持つ。結果と状態を配置するフォルダ（`RUN_DIR`）と、その中のファイルの名前を記載する。 | 実行で、E2E の結果と状態を配置するフォルダとファイルを決める。 | - |
      | layers[].monitoring | 実行中の進行の監視 | string | - | - | - | E2E テストだけが持つ。 | 実行で、E2E の実行中に進行を確認する方法にする。 | - |
      | layers[].abort | 実行の中断 | string | - | - | - | 中断の仕方。E2E テストは合図ファイル（`$RUN_DIR/abort`）。 | 実行で、実行を中断するときの手順にする。 | - |
      | layers[].duration | 所要時間の目安 | string | - | - | - | 全件実行の所要時間の目安。 | 実行で、実行を待つ時間と、ほかの全件実行と重ねないかを判断する。 | - |
      | layers[].parallel | 並列にできる | boolean | - | - | - | ほかの作業の全件実行と同時に実行してよいなら `true`。 | 実行で、ほかの作業の全件実行と同時に実行してよいかを判断する。 | - |
      | layers[].external_cost | 外部への依存と費用 | string | - | - | - | テストが呼ぶ外部のサービスと、発生する費用。 | 実行で、実行の前に外部への依存と費用の確認が要るかを判断する。 | - |
      | layers[].results | 結果の配置場所 | string | - | - | - | 実行した結果のログを配置する場所。 | 実行で、実行した後に結果のログを探す場所にする。 | - |
      | layers[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。 | - |
      | refs | 関連 | array | - | - | - | 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。 | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。<br>対象そのものが変わったときだけ書き換える。 | 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。 | 仕様を冒頭リードに記載している。仕様は各項目へ分ける |
      | layers | 初期構築では種別だけを作り、コマンドはテストを作る担当が確定させる。<br>確定させるまでは `run_all` を `未確定` にする。<br>`lint` 層は、プロジェクトの言語に応じて linter・formatter の check・型検査・構造と依存の向きの検査を全て含める（コンパイラが担う検査は除く）。<br>マニフェストのスクリプト・コーディング規約で使用すると決めたツールが持つ検査は `lint` 層へコピーし、`lint` 層に無い検査を残さない。Git フックと CI では動かさない。<br>型検査と構造の検査は、変更ファイルだけでなくプロジェクト全体に回す。<br>全件実行は、どれかが失敗しても全ての検査を最後まで回し、1 つでも失敗したら失敗で終える 1 コマンドにまとめる（task runner・スクリプト・終了コードを集約するサブシェル 等）。 | - | - |
      | layers[].id | 並びの順に `TL-{番号}` を振る。<br>新しく追加する要素には、既にある番号の最大の次を振る。<br>並べ替えても変えない。 | - | - |
      | layers[].description | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | layers[].prerequisites | 料金・副作用のある種別は必ず記載する。 | - | - |
      | layers[].run_all | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | layers[].run_one.command | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | layers[].location | 判定フローチャート『テストの実行場所』で決める。<br>決めるまでは記載しない。 | - | - |
      | layers[].run_runner | `run_all`・`run_one` は手元で回すコマンドのまま残し、ランナーで回せないときに使用する。<br>workflow は手動の起動（`workflow_dispatch`）だけで起動し、push・PR を契機にしない。<br>失敗したときもログを取得してから失敗で終える。 | - | - |
      | layers[].carry_over | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | layers[].monitoring | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | layers[].abort | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | layers[].notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

