# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-reference
kind: template
name: "テンプレート: リファレンス"
description: リファレンスタブの API とコマンドの 2 ページの書式（一覧と 1 件 1 セクションの詳細）を定め、リファレンスのページを作るときに読む。
tags:
  - name: scope:テンプレート
  - name: topic:api
  - name: topic:コマンド
  - name: topic:テンプレート
  - name: topic:ページ
  - name: topic:リファレンス
    main: true
status: current
visibility: internal
rev: 4
items:
  - id: overview
    name: 概要
    body: |-
      `docs/reference/` に置く、API とコマンドの 2 ページの書式。
      1 ページに一覧と、1 件 1 セクションの詳細を持つ。

      配置先は `docs/reference/reference-api.yaml`（API を公開するプロジェクトのみ）と `docs/reference/reference-command.yaml`（ファイル名は `id`）。
  - id: section-list-01
    name: セクション一覧
    body: |-
      | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- |
      | 冒頭リード（`overview`） | - | 必須 |
      | `一覧` | - | 必須 |
      | `{名前}` | コマンド: `使い方` / `引数` / `終了コード`<br>API: `リクエスト` / `レスポンス` / `エラー` | 必須（一覧の 1 行につき 1 セクション） |
  - id: lead-01
    name: "`冒頭リード`"
    body: |-
      ### 記述例

      ```yaml
      name: コマンド
      items:
        - id: overview
          name: 概要
          body: |-
            リポジトリのクローンの直下で実行するコマンドの一覧。
            どれも前に `uv run` を付けて実行する。
      ```

      ### 補足

      - 何の一覧かと、全てに共通する実行の前提（実行する場所・前に付けるもの・読む設定）を書く
      - 初回に書いた内容のまま保ち、後から情報を追加しない。
        個別のことは各節に書く。
        対象そのものが変わったときだけ既存の記述を書き換える
  - id: list-01
    name: "`一覧`"
    body: |-
      ### 記述例

      ```yaml
      - id: list-01
        group: 一覧
        name: 一覧
        body: |-
          | 名前 | コマンド | 説明 |
          | --- | --- | --- |
          | [サーバーを起動する](id:reference-command#command-start-server-01) | `python -m taskflow` | API サーバーを起動する |
          | [データを移す](id:reference-command#command-migrate-01) | `python -m taskflow.migrate` | 旧形式のデータを新しい保存先へコピーする |
      ```

      ### 補足

      **名前列:**
      - 短い日本語の名前にし、同じページの 1 件 1 セクションの先頭の項目へのリンク（`id:{文書の ID}#{項目の ID}`）にする

      **コマンド列:**
      - 引数を除いたコマンドを書く。
        API のページでは列名を `エンドポイント` にし、`{メソッド} {パス}` を書く

      **説明列:**
      - 何をするかを 1 行で書く（セクションの冒頭の 1 行と同じ文言）

      **補足:**
      - 詳細の列は置かない（詳細はセクションに書く）
  - id: detail-name-01
    name: "`{名前}`"
    body: |-
      ### 記述例（コマンド）

      ````yaml
      - id: command-migrate-01
        group: データを移す
        name: 概要
        body: |-
          旧形式のデータを新しい保存先へコピーする。
          既にある行は飛ばす。
      - id: command-migrate-usage-01
        group: データを移す > 使い方
        name: 使い方
        body: |-
          ```bash
          uv run python -m taskflow.migrate [--dry-run]
          ```
      - id: command-migrate-args-01
        group: データを移す > 引数
        name: 引数
        body: |-
          | 引数 | 必須 / 任意 | 説明 | 例 |
          | --- | --- | --- | --- |
          | `--dry-run` | 任意 | コピーする行を出すだけで、書き込まない | `--dry-run` |
      - id: command-migrate-exit-code-01
        group: データを移す > 終了コード
        name: 終了コード
        body: |-
          | コード | 意味 |
          | --- | --- |
          | `0` | 全てコピーした |
          | `2` | コピーできなかった行がある |
      ````

      ### 記述例（API）

      ````yaml
      - id: api-create-task-01
        group: タスクを作る
        name: 概要
        body: |-
          タスクを 1 件作る。
      - id: api-create-task-request-01
        group: タスクを作る > リクエスト
        name: リクエスト
        body: |-
          ```json
          { "title": "決算資料の作成" }
          ```

          | フィールド | 必須 / 任意 | 説明 |
          | --- | --- | --- |
          | `title` | 必須 | タスク名（100 文字以内） |
      - id: api-create-task-response-01
        group: タスクを作る > レスポンス
        name: レスポンス
        body: |-
          | フィールド | 型 | 説明 |
          | --- | --- | --- |
          | `id` | str | 作ったタスクの ID |
      - id: api-create-task-error-01
        group: タスクを作る > エラー
        name: エラー
        body: |-
          | ステータスコード | 発生条件 |
          | --- | --- |
          | `400` | `title` が無い・100 文字を超える |
      ````

      ### 補足

      - `group` の最上位は `一覧` の名前列と同じ日本語の名前にする（コマンドやパスを `group` にしない）
      - セクションの冒頭の項目に何をするかを 1〜2 行で書く
      - `使い方` の項目はコマンドの全形を 1 本のコードブロックで書き、任意の引数は `[角括弧]` で囲む
      - `引数` の項目は引数を取らないとき本文に `なし` と書く
      - 詳しい仕様を設計書が持つときは、セクションの末尾に設計書へのリンクを置く（Pages に出ないページへは GitHub の `blob/develop` のリンクで書く）
