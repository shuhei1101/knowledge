# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-setup-procedure
kind: template
name: "テンプレート: セットアップ手順"
description: 使い方のセットアップ手順に置く、1 条件 = 1 ページの個別手順の書式を定めるテンプレート。
tags:
  - name: scope:テンプレート
    main: true
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      `使い方/セットアップ手順/` に置く、1 条件 = 1 ページの個別手順の書式。
      条件が来たときに引いて、そのページだけで完結させる。

      配置先は `docs/使い方/セットアップ手順/{操作}.md`（例: `docs/使い方/セットアップ手順/サーバーを起動・停止する.md`）。
      ファイル名は「{対象}を{動詞}する」の書式にし、空白を入れない。
      新規作成時は同フォルダの `index.yaml`（目次）の `items` に 1 行追加し、README を再生成する。

      個別手順を並べる順序付きリンク集（`はじめてのセットアップ.md` 等）は、冒頭リードと `## 順番` だけを持つ。
  - id: section-list-01
    name: セクション一覧
    body: |-
      <!-- table: data -->

      | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- |
      | 冒頭リード | - | 必須 |
      | `## 前提` | - | 必須 |
      | `## 手順` | `### {操作}` / `#### {説明}` | 必須 |
      | `## 反映` | - | 必須 |
      | `## 確認` | `#### {確かめること}` | 必須 |
      | `## 管理外ファイル` | - | 環境を作る手順の場合のみ |
      | `## 元に戻す` | - | 必須 |
      | `## 順番` | - | 順序付きリンク集の場合のみ（他のセクションは置かない） |

      <!-- /table -->
  - id: lead-01
    name: "`冒頭リード`"
    body: |-
      ### 記述例

      ```markdown
      # サーバーを起動・停止する

      サーバーを初めて動かすとき、コードや設定を入れ替えて再起動するとき、使い終えて止めるときに実行する。
      ```

      ### 補足

      - 1 行目は `# {操作}`（ファイル名と一致させ、読みやすいように語の間に空白を入れてよい）
      - いつ実行するか（トリガー）を 1〜2 行で書く
      - 初回に書いた内容のまま保ち、後から情報を追加しない。
        手順・症状は `## 手順` に書く（両方に書くと同じ内容を 2 箇所で持つことになる）。
        対象そのものが変わったときだけ既存の記述を書き換える
  - id: prerequisite-01
    name: "`## 前提`"
    body: |-
      ### 記述例

      ```markdown
      ## 前提

      - [設定ファイルを作る](./設定ファイルを作る.md)
      ```

      ### 補足

      - 先に済んでいる必要がある手順へのリンクを箇条書きで並べる
      - 手順以外の前提（動いている外部のサービス 等）は 1 行の文で並べる
      - 無ければ本文に `なし` と書く
  - id: procedure-01
    name: "`## 手順`"
    body: |-
      ### 記述例

      ````markdown
      ## 手順

      どのコマンドもリポジトリのクローンの直下で実行する。

      ### 起動する

      #### 待受ポートが空いているかを確かめる

      ```bash
      ss -tanH "( sport = :8000 )"
      ```

      出力が空なら空いている。
      前のサーバーがポートを持ったまま残っていると、起動した直後に落ちる。

      ### 止める

      #### tmux のセッションを閉じる

      ```bash
      tmux kill-session -t {アプリ名}-server
      ```

      残っていると、次の起動で同じ名前のセッションを作れず、起動のコマンドが失敗する。
      ````

      ### 補足

      **操作の見出し（`###`）:**
      - 続けて実行しない操作（起動する / 止める 等）が複数あるときは操作ごとに `###` を切る
      - 操作が 1 つだけのときは `###` を置かず、説明の見出しを `###` にする

      **説明の見出し（`####`）:**
      - 実行順に「説明の見出し + コマンドのコードブロック + 備考」を並べる
      - 見出しに連番を付けない
      - 説明の見出しは、その 1 歩で何をするかを動詞で書く

      **コマンドのコードブロック:**
      - コピーしてそのまま実行できる状態で書き、言語を指定する（シェルは `bash`、設定は `yaml` / `json`）
      - 置き換える箇所は `{名前}` で書く
      - コマンドを伴わない 1 歩（画面の操作 等）はコードブロックを置かず、操作を文で書く

      **備考:**
      - その 1 歩を漏らしたとき・誤ったときの症状を書く
      - 手順を表にしない
  - id: reflection-01
    name: "`## 反映`"
    body: |-
      ### 記述例

      ```markdown
      ## 反映

      `再起動`（[サーバーを起動・停止する](./サーバーを起動・停止する.md)）。
      ```

      ### 補足

      - `即時` / `/reload` / `再起動` のどれかで書く
      - 書き換えるものによって反映が分かれるときは、書き換えるものごとに箇条書きで並べる
  - id: confirmation-01
    name: "`## 確認`"
    body: |-
      ### 記述例

      ````markdown
      ## 確認

      #### セッションが動いている

      ```bash
      tmux has-session -t {アプリ名}-server && echo running
      ```

      `running` と出る。
      ````

      ### 補足

      - 成功したことを確かめる観点ごとに `####` を切り、コマンドと、成功したときに観測できる値を書く
      - 手順と同じく表にしない
  - id: unmanaged-files-01
    name: "`## 管理外ファイル`"
    body: |-
      ### 記述例

      ```markdown
      ## 管理外ファイル

      | 対象 | 操作 | 用意の仕方 | 補足 |
      | --- | --- | --- | --- |
      | `.venv/` | 構築 | `uv sync --frozen` | ロックファイルが git 管理下にあるため同じバージョンが入る |
      | `.env` | コピー | `cp {メインリポジトリ}/.env .` | worktree 側で書き換えてもメインに影響しない |
      | `config/local.yaml` | リンク | `ln -s {メインリポジトリ}/config/local.yaml config/` | メインと同じ実体を見る |
      | `data/` | 作らない | - | 実行時の状態はメインリポジトリだけが持つ |
      | `~/.config/{アプリ名}/settings.yaml` | 対象外 | - | ホーム配下にあり worktree に依存しない |
      ```

      ### 補足

      **対象列:**
      - リポジトリ内はリポジトリルートからの相対パス、リポジトリ外は絶対パスで書く

      **操作列:**
      - 次の 5 つから選ぶ

        | 操作 | 意味 |
        | --- | --- |
        | `構築` | コマンドで作る |
        | `コピー` | メインリポジトリから複製する（実体が分かれ、worktree 側の変更はメインに及ばない） |
        | `リンク` | メインリポジトリの実体を参照する（実体は 1 つで、片方の変更が両方に及ぶ） |
        | `作らない` | worktree では用意しない |
        | `対象外` | worktree に依存しない（リポジトリ外にある / 本プロジェクトで未使用） |

      - 値を書き換えて試す可能性があるものは `コピー`、常に同じ値を見たいものは `リンク` を選ぶ

      **用意の仕方列:**
      - そのまま実行できるコマンドを 1 行で書く。
        操作が `作らない` / `対象外` のときは `-`

      **補足:**
      - `.gitignore` の全行を突き合わせ、用意しないものも `作らない` / `対象外` の行として残す
  - id: rollback-01
    name: "`## 元に戻す`"
    body: |-
      ### 記述例

      ```markdown
      ## 元に戻す

      起動を戻すときは「止める」を実行する。
      止めても次のものは残り、次に起動したときに扱われる。

      | 残るもの | 扱い |
      | --- | --- |
      | `data/server.log` | 追記され続ける。要らなければ止めた後に削除する |
      ```

      ### 補足

      - 逆操作を書く（逆操作のコマンドは `## 手順` の操作の見出しを名指しして再掲しない）
      - 戻した後に残るもの（既存の Issue / PR・ファイル・ラベル 等）と、その扱いを書く
  - id: order-01
    name: "`## 順番`"
    body: |-
      ### 記述例

      ```markdown
      ## 順番

      1. [設定ファイルを作る](./設定ファイルを作る.md)
      2. [サーバーを起動・停止する](./サーバーを起動・停止する.md)
      ```

      ### 補足

      - 個別手順へのリンクを実行順の番号付きリストで並べ、手順そのものは書かない
      - 個別手順の一部の操作だけを使うときは、リンクの後ろに操作の見出しを添える
      - 条件によって追加する手順は、番号付きリストの後に `追加するもの / ページ` の表で並べる
