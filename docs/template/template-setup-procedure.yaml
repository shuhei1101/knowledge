# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-setup-procedure
kind: template
name: "テンプレート: セットアップ手順"
description: 使い方のセットアップ手順に置く 1 条件につき 1 ページの個別手順の書式を定め、セットアップ手順のページを作るときに読む。
tags:
  - name: scope:テンプレート
  - name: topic:セットアップ
  - name: topic:セットアップ手順
    main: true
  - name: topic:テンプレート
  - name: topic:ファイル
  - name: topic:ページ
  - name: topic:手順
  - name: action:反映
  - name: action:管理
status: current
visibility: internal
rev: 4
items:
  - id: overview
    name: 概要
    body: |-
      `docs/guide/` に置く、1 条件 = 1 ページの個別手順の書式。
      条件が来たときに引いて、そのページだけで完結させる。

      配置先は `docs/guide/guide-setup-{対象}.yaml`（ファイル名は `id`。例: `docs/guide/guide-setup-start-stop-server.yaml`）。
      タグは `scope:使い方` と、主題の `topic:セットアップ手順`（`main: true`）にする。
      メタデータ `name` は「{対象}を{動詞}する」の書式にする。

      個別手順を並べる順序付きリンク集（`guide-setup-first-time.yaml` 等）は、冒頭リードと `順番` の項目だけを持つ。
  - id: section-list-01
    name: セクション一覧
    body: |-
      <!-- table: data -->

      | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- |
      | 冒頭リード（`overview`） | - | 必須 |
      | `前提` | - | 必須 |
      | `手順` | `{操作}` / `{説明}` | 必須 |
      | `反映` | - | 必須 |
      | `確認` | `{確かめること}` | 必須 |
      | `管理外ファイル` | - | 環境を作る手順の場合のみ |
      | `元に戻す` | - | 必須 |
      | `順番` | - | 順序付きリンク集の場合のみ（他のセクションは置かない） |

      <!-- /table -->
  - id: lead-01
    name: "`冒頭リード`"
    body: |-
      ### 記述例

      ```yaml
      name: サーバーを起動・停止する
      items:
        - id: overview
          name: 概要
          body: |-
            サーバーを初めて動かすとき、コードや設定を入れ替えて再起動するとき、使い終えて止めるときに実行する。
      ```

      ### 補足

      - メタデータ `name` は「{対象}を{動詞}する」の書式にする（読みやすいように語の間に空白を入れてよい）
      - いつ実行するか（トリガー）を 1〜2 行で書く
      - 初回に書いた内容のまま保ち、後から情報を追加しない。
        手順・症状は `手順` の項目に書く（両方に書くと同じ内容を 2 箇所で持つことになる）。
        対象そのものが変わったときだけ既存の記述を書き換える
  - id: prerequisite-01
    name: "`前提`"
    body: |-
      ### 記述例

      ```yaml
      - id: prerequisite-01
        group: 前提
        name: "前提: 設定ファイルの作成"
        body: |-
          - [設定ファイルを作る](id:guide-setup-create-config)
      ```

      ### 補足

      - `group` は `前提` にし、`name` は「前提: {内容}」にする
      - 先に済んでいる必要がある手順へのリンクを箇条書きで並べる
      - 手順以外の前提（動いている外部のサービス 等）は 1 行の文で並べる
      - 無ければ本文に `なし` と書く
  - id: procedure-01
    name: "`手順`"
    body: |-
      ### 記述例

      ````yaml
      - id: step-01
        group: 手順
        name: コマンドの実行場所
        body: |-
          どのコマンドもリポジトリのクローンの直下で実行する。
      - id: step-start-port-01
        group: 手順 > 起動する > 待受ポートが空いているかを確かめる
        name: 待受ポートの確認
        body: |-
          ```bash
          ss -tanH "( sport = :8000 )"
          ```

          出力が空なら空いている。
          前のサーバーがポートを持ったまま残っていると、起動した直後に落ちる。
      - id: step-stop-tmux-01
        group: 手順 > 止める > tmux のセッションを閉じる
        name: tmux のセッションの終了
        body: |-
          ```bash
          tmux kill-session -t {アプリ名}-server
          ```

          残っていると、次の起動で同じ名前のセッションを作れず、起動のコマンドが失敗する。
      ````

      ### 補足

      **操作（`group` の `手順 > {操作}`）:**
      - 続けて実行しない操作（起動する / 止める 等）が複数あるときは操作ごとに `group` の階層を分ける
      - 操作が 1 つだけのときは操作の階層を置かず、`手順 > {説明}` にする

      **説明（`group` の末尾）:**
      - 実行順に「説明を `group` の末尾にした項目 + コマンドのコードブロック + 備考」を並べる
      - `group` に連番を付けない
      - 説明は、その 1 歩で何をするかを動詞で書く

      **コマンドのコードブロック:**
      - コピーしてそのまま実行できる状態で書き、言語を指定する（シェルは `bash`、設定は `yaml` / `json`）
      - 置き換える箇所は `{名前}` で書く
      - コマンドを伴わない 1 歩（画面の操作 等）はコードブロックを置かず、操作を文で書く

      **備考:**
      - その 1 歩を漏らしたとき・誤ったときの症状を書く
      - 手順を表にしない
  - id: reflection-01
    name: "`反映`"
    body: |-
      ### 記述例

      ```yaml
      - id: reflection-01
        group: 反映
        name: 反映は再起動
        body: |-
          `再起動`（[サーバーを起動・停止する](id:guide-setup-start-stop-server)）。
      ```

      ### 補足

      - `即時` / `/reload` / `再起動` のどれかで書く
      - 書き換えるものによって反映が分かれるときは、書き換えるものごとに箇条書きで並べる
  - id: confirmation-01
    name: "`確認`"
    body: |-
      ### 記述例

      ````yaml
      - id: check-session-01
        group: 確認 > セッションが動いている
        name: セッションの確認
        body: |-
          ```bash
          tmux has-session -t {アプリ名}-server && echo running
          ```

          `running` と出る。
      ````

      ### 補足

      - 成功したことを確かめる観点ごとに `group` の末尾を分け、コマンドと、成功したときに観測できる値を書く
      - 手順と同じく表にしない
  - id: unmanaged-files-01
    name: "`管理外ファイル`"
    body: |-
      ### 記述例

      ```yaml
      - id: unmanaged-files-01
        group: 管理外ファイル
        name: 管理外ファイルの用意
        body: |-
          | 対象 | 操作 | 用意の仕方 | 補足 |
          | --- | --- | --- | --- |
          | `.venv/` | 構築 | `uv sync --frozen` | ロックファイルが git 管理下にあるため同じバージョンが入る |
          | `.env` | コピー | `cp {メインリポジトリ}/.env .` | worktree 側で書き換えてもメインに影響しない |
          | `config/local.yaml` | リンク | `ln -s {メインリポジトリ}/config/local.yaml config/` | メインと同じ実体を見る |
          | `data/` | 作らない | - | 実行時の状態はメインリポジトリだけが持つ |
          | `~/.config/{アプリ名}/settings.yaml` | 対象外 | - | ホーム配下にあり worktree に依存しない |
      ```

      ### 補足

      **対象列:**
      - リポジトリ内はリポジトリルートからの相対パス、リポジトリ外は絶対パスで書く

      **操作列:**
      - 次の 5 つから選ぶ

        | 操作 | 意味 |
        | --- | --- |
        | `構築` | コマンドで作る |
        | `コピー` | メインリポジトリから複製する（実体が分かれ、worktree 側の変更はメインに及ばない） |
        | `リンク` | メインリポジトリの実体を参照する（実体は 1 つで、片方の変更が両方に及ぶ） |
        | `作らない` | worktree では用意しない |
        | `対象外` | worktree に依存しない（リポジトリ外にある / 本プロジェクトで未使用） |

      - 値を書き換えて試す可能性があるものは `コピー`、常に同じ値を見たいものは `リンク` を選ぶ

      **用意の仕方列:**
      - そのまま実行できるコマンドを 1 行で書く。
        操作が `作らない` / `対象外` のときは `-`

      **補足:**
      - `.gitignore` の全行を突き合わせ、用意しないものも `作らない` / `対象外` の行として残す
  - id: rollback-01
    name: "`元に戻す`"
    body: |-
      ### 記述例

      ```yaml
      - id: rollback-01
        group: 元に戻す
        name: 元に戻す
        body: |-
          起動を戻すときは「止める」を実行する。
          止めても次のものは残り、次に起動したときに扱われる。

          | 残るもの | 扱い |
          | --- | --- |
          | `data/server.log` | 追記され続ける。要らなければ止めた後に削除する |
      ```

      ### 補足

      - 逆操作を書く（逆操作のコマンドは `手順` の操作（`group`）を名指しして再掲しない）
      - 戻した後に残るもの（既存の Issue / PR・ファイル・ラベル 等）と、その扱いを書く
  - id: order-01
    name: "`順番`"
    body: |-
      ### 記述例

      ```yaml
      - id: order-01
        group: 順番
        name: 手順の順番
        body: |-
          1. [設定ファイルを作る](id:guide-setup-create-config)
          2. [サーバーを起動・停止する](id:guide-setup-start-stop-server)
      ```

      ### 補足

      - 個別手順へのリンクを実行順の番号付きリストで並べ、手順そのものは書かない
      - 個別手順の一部の操作だけを使うときは、リンクの後ろに操作の名前を添える
      - 条件によって追加する手順は、番号付きリストの後に `追加するもの / ページ` の表で並べる
