      | Tech Radar | {分かったこと} | [{出典名}]({URL}) | - |
      | arc42 の横断の方針 | {分かったこと} | [{出典名}]({URL}) | - |
      | ADR / MADR | {分かったこと} | [{出典名}]({URL}) | - |
      | 特性テストと fitness function | {分かったこと} | [{出典名}]({URL}) | - |
      ```

      ### 補足

      - 題材の行は記述例の 6 つで始める
  - id: answer-01
    name: "`## 回答`"
    body: |-
      ### 記述例

      テンプレート『方針決め/共通』の `## 回答` に従う。

      ### 補足

      - 論点は、`## 決定` の行を単位にする
