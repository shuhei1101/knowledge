# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-eval-case
kind: template
name: 'テンプレート: 精度評価のケース'
description: 精度評価のケース 1 つの、場面・入力・採点する観点とその上書きを記載する書式を定め、精度評価のケースを作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:精度評価
    main: true
  - name: topic:ケース
  - name: topic:テンプレート
  - name: topic:スキーマ
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      精度評価のケース 1 つの、場面・入力・採点する観点とその上書きを記載するファイル。
      評価の仕組みは、本番と同じ入力の組み立てを経由して評価の対象に入力を指定する。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 ファイル = 1 つのケースにする。
      - ケースの id はファイル名（`.yaml` を除いたもの）から導き、ファイルに記載しない。
      - ケースの id はほかのファイルから指すので、一度決めたら変えない。
      - 入力の組み立て方は、プロジェクトの精度評価の仕組みの設計書で決める。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>project-index の配信で、文書の公開範囲のメタデータにする。 | - |
      | tags | タグ | array | - | - | - | 設計書を検索で絞り込むタグで、`name` にタグの名前（`action:`・`topic:`・`tool:` などで始める）、最も分量の多い主題 1 つに `main: true` を記載する。<br>付け方は knowledge の規約『文書のタグと description の記載』に従う。 | project-index の検索で、文書をタグで絞り込む。 | `[{main: true, name: topic:タグ}, name: action:記載]` |
      | tags[].name | タグの名前 | string | 必須 | - | minLength: `1` | タグの名前。`action:`・`topic:`・`tool:` などで始める。 | 検索で、文書をタグで絞り込む値にする。 | - |
      | tags[].main | 主題 | boolean | - | - | - | 最も分量の多い主題のタグだけ `true` にする。 | 検索で、文書の主題のタグとして扱う。 | - |
      | aliases | 別名 | array | - | - | - | 検索でヒットさせたい言い換え。 | project-index の検索で、文書を名前と同じように検索できる言い換えにする。 | - |
      | summary | 概要 | string | 必須 | - | pattern: `^[^\n]+$`, minLength: `1` | どんな場面で、何を確認するか。 | 実行で、結果の一覧の説明にする。 | `朝に空腹が閾値を越えている` |
      | split | 用途 | string | 必須 | `tune` / `holdout` | - | `tune`（プロンプトを修正するときに参照する）か `holdout`（修正が有効かの確認だけに使用し、修正する側には点だけを示す）。 | 実行で、修正するときに指定する結果を分ける。 | - |
      | inputs | 入力 | object | 必須 | - | - | 入力のデータ。キーは、最初の対象が『LLM の呼び出し』なら `inputs[].from` の指すデータ、『エージェントの定義』ならきっかけのメッセージ。 | 実行で、評価の対象に指定する入力を組み立てる。 | - |
      | criteria | 採点する観点 | array | - | - | - | このケースで採点する観点。記載しなければ、使用できる全ての観点。 | 実行で、採点する観点を選ぶ。 | - |
      | criteria[].id | 観点の id | string | - | - | - | 観点のファイル名から導いた id。`custom` を記載しないときは必須。 | 実行で、採点する観点を選ぶ。 | `state_fit` |
      | criteria[].values | プレースホルダーの値 | object | - | - | - | 観点の `question`・`rubric` のプレースホルダーの値。省いた値はケースの入力から埋める。 | 実行で、採点のプロンプトのプレースホルダーを埋める。<br>検査で、埋まらないプレースホルダーのある観点を不合格にする。 | `{need: 空腹}` |
      | criteria[].rubric | 採点の基準の上書き | array | - | - | - | 採点の基準の上書き。記載した点の行だけを置き換える。 | 実行で、採点のプロンプトの基準を置き換える。 | - |
      | criteria[].rubric[].score | 点 | number | 必須 | `0` / `0.25` / `0.5` / `0.75` / `1` | - | この行の点。 | 実行で、採点の結果の値にする。 | - |
      | criteria[].rubric[].description | 様子 | string | 必須 | - | - | その点になる出力の様子。ケースの値は `{名前}` で入れる。 | 実行で、採点のプロンプトの基準の文にする。 | `{need} を満たす行動の中で、最も合うものを選んでいる` |
      | criteria[].custom | このケースだけの観点 | object | - | - | - | このケースだけで採点する観点。『精度評価の観点』のファイルと同じキーで記載する。 | 実行で、採点する観点に加える。 | `{method: llm, pass: 0.75, question: '{need} が閾値を越えているとき、それを満たす行動を選んでいるか', rubric: [{description: '{need} を満たす行動の中で、最も合うものを選んでいる', score: 1}, {description: '{need} を満たす行動を選んでいるが、より合う選択肢がある', score: 0.75}, {description: '{need} をいくらか満たすが、ほかの状態を損ねる行動を選んでいる', score: 0.5}, {description: '{need} にほとんど関係しない行動を選んでいる', score: 0.25}, {description: '{need} を悪化させる行動を選んでいる', score: 0}], tags: [aspect:状況の判断], title: 状態に合う}` / `{check: {function: aituber.evals.checks.mermaid:is_valid, gate: true}, method: rule, tags: [aspect:形式], title: Mermaid の図が描画できる}` |
      | criteria[].custom.visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>project-index の配信で、文書の公開範囲のメタデータにする。 | - |
      | criteria[].custom.aliases | 別名 | array | - | - | - | 検索でヒットさせたい言い換え。 | project-index の検索で、文書を名前と同じように検索できる言い換えにする。 | - |
      | criteria[].custom.title | 表示名 | string | 必須 | - | - | 観点の表示名。 | 実行で、結果の一覧の見出しにする。 | `状態に合う` |
      | criteria[].custom.method | 確認の方法 | string | 必須 | `rule` / `llm` / `human` | - | `rule`（判定の関数が合否と理由を返却する）/ `llm`（採点の LLM が採点の基準で点を付ける）/ `human`（採点の LLM の点を人が確定する）。 | 検査で、確認の方法ごとのキーの要否を確認する。<br>実行で、採点の流れを決める。 | - |
      | criteria[].custom.tags | タグ | array | 必須 | - | minItems: `1` | 何を確認するかの `aspect:{語彙}` を 1 つ以上と、難しい観点の `difficulty:high`。 | 実行で、タグごとに点を集計する。<br>レビューで、対象に要る `aspect:` が全て付いた観点と、`difficulty:high` の観点が 1 つ以上あるかを確認する。 | `[aspect:状況の判断, difficulty:high]` |
      | criteria[].custom.question | 質問 | string | - | - | - | 採点の LLM と人への質問で、ケースの値は `{名前}` で入れる。`method` が `llm`・`human` のときは必須。 | 実行で、採点のプロンプトと人の採点の画面の質問にする。 | `{need} が閾値を越えているとき、それを満たす行動を選んでいるか` |
      | criteria[].custom.rubric | 採点の基準 | array | - | - | minItems: `5`, maxItems: `5` | 点ごとの採点の基準。`method` が `llm`・`human` のときは必須。 | 実行で、採点のプロンプトの基準にする。 | - |
      | criteria[].custom.rubric[].score | 点 | number | 必須 | `0` / `0.25` / `0.5` / `0.75` / `1` | - | この行の点。 | 実行で、採点の結果の値にする。 | - |
      | criteria[].custom.rubric[].description | 様子 | string | 必須 | - | - | その点になる出力の様子。ケースの値は `{名前}` で入れる。 | 実行で、採点のプロンプトの基準の文にする。 | `{need} を満たす行動の中で、最も合うものを選んでいる` |
      | criteria[].custom.pass | 合格の点 | number | - | `0` / `0.25` / `0.5` / `0.75` / `1` | - | 合格の点。`method` が `llm`・`human` のときは必須。 | 実行で、実行の回数 × 採点の回数の平均と比べて、観点 × ケースの合否を出す。 | - |
      | criteria[].custom.check | 判定の関数 | object | - | - | - | `method` が `rule` のときの判定の関数。`method` が `rule` のときは必須。 | 実行で、出力を判定する。 | - |
      | criteria[].custom.check.function | 関数 | string | 必須 | - | pattern: `^[A-Za-z_][\w.]*:[A-Za-z_]\w*$` | 判定の関数で、コードの配置の `{モジュール}:{関数}`。関数は出力・ケース・`args` を受け、`{pass, reason}` を返却する。 | 実行で、判定の関数を呼ぶ。 | `aituber.evals.checks.mermaid:is_valid` |
      | criteria[].custom.check.args | 引数 | object | - | - | - | 関数に指定する引数。 | 実行で、判定の関数に引数を指定する。 | `{field: body}` |
      | criteria[].custom.check.gate | 足切り | boolean | - | - | - | `true` なら、不合格の出力はほかの観点で採点しない。記載しなければ `false`。 | 実行で、`rule` の観点を採点の LLM より先に実行し、不合格の出力のほかの観点の採点を止める。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | criteria[].custom | 1 ファイル = 1 つの観点にする。<br>観点の id はファイル名（`.yaml` を除いたもの）から導き、ファイルに記載しない。<br>観点の id はほかのファイルから指すので、一度決めたら変えない。<br>機械で判定できる観点は `rule`、文で基準を記載できる観点は `llm`、人にしか判定できない観点は `human` にする。<br>`human` の観点は、採点の LLM が採点の基準で点を付けた後、人が出力と LLM の点と理由を参照して点を確定する。<br>`aspect:` の語彙は、プロジェクトの精度評価の仕組みの設計書に記載する。 | - | - |
      | criteria[].custom.title | 表示名は id と別に、自由に変えてよい。 | - | - |
      | criteria[].custom.tags | 語彙に無いタグが要るときは、プロジェクトの語彙に追加してから付ける。 | - | - |
      | criteria[].custom.rubric | 5 つの点を全て記載する。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      summary: 朝に空腹が閾値を越えている
      split: tune
      inputs:
        character:
          sample: character/akane
        character_status:
          sample: character_status/normal
          override:
            hunger: 85
        time:
          value: 07:30
      criteria:
      - id: state_fit
        values:
          need: 空腹
      - id: character_likeness
      - custom:
          title: 朝食の時間帯を考える
          method: llm
          tags:
          - aspect:状況の判断
          - difficulty:high
          question: 朝食の時間帯であることを踏まえて行動を選んでいるか
          rubric:
          - score: 1
            description: 朝食の時間帯と空腹の両方を踏まえている
          - score: 0.75
            description: 両方を踏まえているが、選択肢の選び方に無駄がある
          - score: 0.5
            description: どちらか一方だけを踏まえている
          - score: 0.25
            description: 時間帯を誤って解釈している
          - score: 0
            description: どちらも踏まえていない
          pass: 0.75
      ```
