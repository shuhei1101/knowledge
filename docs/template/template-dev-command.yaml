# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-dev-command
kind: template
name: "テンプレート: 開発コマンド"
description: 開発者が開発で使うコマンドの前提・実行の順序・料金や副作用・確かめた記録を記載する開発コマンドの書式を定め、開発コマンドを作る・追加するときに読む。
tags:
  - name: scope:テンプレート
  - name: topic:コマンド
    main: true
  - name: topic:テンプレート
  - name: topic:副作用
  - name: topic:料金
  - name: action:実行
  - name: action:記録
  - name: action:開発
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      開発者とエージェントが開発で使用するコマンドの、分類ごとの前提・実行の順序・コマンド・料金や副作用や所要時間・確認した記録。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 プロジェクト 1 ファイルにする。
      - 何を記載するか・どの分類かは判定フローチャート『コマンドの書き先』で決める。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | `IF-12` / `IF-3038-1` |
      | title | タイトル | string | 必須 | - | - | `開発コマンド`。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。 | - |
      | prerequisites | 前提 | array | - | - | - | 全分類に共通の前提（言語ランタイム・パッケージマネージャ・認証済みのツール）。 | - |
      | categories | 分類 | array | 必須 | - | minItems: `1` | 分類ごとのセクション。 | - |
      | categories[].name | 分類 | string | 必須 | `環境構築（クローン直後）` / `取り込み後の追従（pull 後）` / `依存の追加・更新・削除` / `起動・停止` / `テスト` / `静的検査` / `ビルド・生成` / `取り込み前の検査` / `管理作業` | - | - | - |
      | categories[].prerequisites | 前提 | array | - | - | - | この分類のコマンドを実行する前に満たしておくこと（先に実行する分類・起動しておくもの・環境変数）。 | - |
      | categories[].commands | コマンド | string | - | - | - | 実行の順序どおりに並べたコマンドのコードブロック（`bash`）。 | - |
      | categories[].effects | 料金・副作用・所要時間 | string | - | - | - | 料金・外へ書き込む副作用・長い所要時間があるコマンドは、そのとおりに明記する。 | - |
      | categories[].verification | 確認した記録 | object | - | - | - | 記載したコマンドを実行して確認したか。実行できないもの（副作用・権限、または規約『開発時の従量課金APIの実行』の「比べる」の工程でユーザーへ回す料金）は、確認していないことと理由を残す。 | - |
      | categories[].verification.state | 状態 | string | 必須 | `済` / `未確認` | - | - | - |
      | categories[].verification.date | 確認日 | string | - | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | `YYYY-MM-DD`。状態が `済` のときに記載する。 | - |
      | categories[].verification.detail | 確認内容 | string | - | - | - | 確認した内容か、確認していない理由。状態が `未確認` のときは理由を記載する。 | - |
      | categories[].refs | 参照 | array | - | - | - | 他のページが持つコマンドの原本。テストのセクションはテスト実行方法（`TP-1#`）を、静的検査のセクションはその `lint` 層（`TP-1#layers[lint]`）を指す。 | - |
      | categories[].decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | - |
      | refs | 関連 | array | - | - | - | - | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。<br>対象そのものが変わったときだけ書き換える。 | 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。 | 仕様を冒頭リードに記載している。仕様は各項目へ分ける |
      | categories | 初期構築では全ての分類を作る。<br>コマンドは差分が該当した実装・テスト作成の担当が確定させ、確定させるまでは `commands` を `未確定` にする。<br>テストと静的検査以外のセクションは `commands` か `refs` のどちらかを持つ。 | - | - |
      | categories[].commands | 複数あるときは番号つきの手順にし、各コマンドの前に何をするかを 1 行で添える。<br>記載できるまでは `未確定` にする。<br>既に他のページが持つコマンドはコピーせず `refs` で指し、このページだけが持つコマンドを `commands` に記載する。<br>テストと静的検査のセクションはコマンドを持たず、`refs` でテスト実行方法を指す。 | - | - |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: CMD-1
      title: 開発コマンド
      lead: 開発で使用するコマンドの、分類ごとの前提・順序・コマンド・確認した記録。
      prerequisites:
      - Python 3.12 と uv
      categories:
      - name: 環境構築（クローン直後）
        commands: |-
          1. 依存を lock どおりに入れる

          ```bash
          uv sync --frozen
          ```
        effects: 数分かかる（依存のダウンロード）
        verification:
          state: 済
          date: '2026-01-15'
          detail: 空の作業ツリーで実行して依存が入ることを確認した
      - name: テスト
        refs:
        - TP-1#
      - name: 静的検査
        refs:
        - TP-1#layers[lint]
      - name: 管理作業
        commands: |-
          ```bash
          uv run python scripts/migrate_users.py
          ```
        effects: 本番の DB へ書き込む（戻せない）
        verification:
          state: 未確認
          detail: 本番の DB へ書き込むため走らせていない
      ```
