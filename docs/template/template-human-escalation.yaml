id: template-human-escalation
kind: template
name: 'テンプレート: ヒューマンエスカレーションの表'
description: 該当すれば必ず利用者に判断を仰ぐ項目を制作の種類 1 つ分並べる表の書式を定め、エージェントフローを持つ機能のヒューマンエスカレーションの表を作る・項目を追加するときに参照する。
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      ヒューマンゲートをオフにしていても、該当すれば必ず利用者に判断を仰ぐ項目の一覧を、制作の種類 1 つ分記載する設計書。
      実行者とレビュアーが、成果物が該当するかを判定するときに参照する。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 ファイル = 制作の種類 1 つにする。
      - ファイルの配置はフォルダ構成の設計書で決め、エージェントフローの `human_escalation.ref` から文書の ID で指す。
      - レビュアーは全ての項目を判定し、実行者は `executor_context` のある項目を判定する。エージェントゲートがオフの工程では、実行者が全ての項目を判定する。
      - 実行者とレビュアーのどちらかが該当と判定し、利用者の判断が済んでいない項目があれば、該当（`escalated`）にする。
      - 利用者が判断した項目と箇所は、内容が変わらない限り、後の工程と修正の後のレビューで該当にしない。実行者は、判断が済んだ項目・箇所・検討事項の ID を成果の資料とレビューの依頼文に記載する。
      - 利用者が確認しなくてよいと回答した項目は削除し、新規に確認したい項目は追加する。
      - 利用者に判断を仰ぐ条件は、確認観点の表（`review_checklist`）に同じ条件の項目を設けず、この表に記載する。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: {"kind": "data"} -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[a-z0-9]+(-[a-z0-9]+)*(/[a-z0-9]+(-[a-z0-9]+)*)*$` | 文書の ID。フォルダ構成で `id_root` を付けたフォルダからのパスから `.yaml` を除いたもの。 | 設計で、エージェントフローの `human_escalation.ref` から指す。<br>実行で、実行者とレビュアーが表を取得する ID にする。 | `script-creation/human-escalation` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>project-index の配信で、文書の公開範囲のメタデータにする。 | - |
      | title | タイトル | string | 必須 | - | pattern: `^ヒューマンエスカレーションの表: .+$` | `ヒューマンエスカレーションの表: {制作の種類}`。 | 生成で、ページの見出しにする。<br>project-index の検索で、文書の名前にする。 | `ヒューマンエスカレーションの表: 台本作成` |
      | lead | 冒頭リード | string | - | - | - | 何の制作の表で、誰が参照するかを 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>project-index の検索で、文書の概要文にする。 | - |
      | items | 項目 | array | 必須 | - | minItems: `1` | 該当すれば利用者に判断を仰ぐ項目。1 要素が 1 項目。 | 実行で、実行者とレビュアーが成果物ごとに該当を判定する。<br>生成で、項目の表にする。 | - |
      | items[].id | 識別子 | string | 必須 | - | pattern: `^[a-z][a-z0-9]*(_[a-z0-9]+)*$` | 項目の識別子。英語の名前を `_` でつなぐ。 | 実行で、利用者の判断の記録（台本の `approvals[].gate` など）に記載する値にする。 | `fact_change` |
      | items[].name | 名前 | string | 必須 | - | minLength: `1` | 項目の表示の名前。 | 実行で、確認の検討事項の見出しにする。 | `事実の変更` |
      | items[].condition | 条件 | string | 必須 | - | minLength: `1` | 該当する条件。成果物を確認して、該当するかを判定できる文にする。 | 実行で、実行者とレビュアーが該当を判定する。 | `体験談の事実（人数・回数・順番・場所・数値）を変えた` |
      | items[].examples | 判定の例 | object | - | - | - | 該当する例と該当しない例。 | 実行で、実行者とレビュアーが該当を判定するときの例にする。 | - |
      | items[].examples.match | 該当する例 | array | - | - | - | 該当する成果物の例。 | 実行で、該当と判定する例にする。 | `[2 回の出来事を、5 回にする]` |
      | items[].examples.not_match | 該当しない例 | array | - | - | - | 該当しない成果物の例。 | 実行で、該当しないと判定する例にする。 | `[パターン借りで、題材を別の具体に置き換える]` |
      | items[].ask | 判断してほしいこと | string | 必須 | - | minLength: `1` | 利用者に判断してほしいこと。 | 実行で、確認の検討事項に記載する。 | `その変更でよいか` |
      | items[].steps | 工程 | array | - | - | - | 該当しうる工程・成果物の識別子。記載しなければ全ての工程。 | 実行で、工程ごとに判定する項目を絞る。 | `[materials, script]` |
      | items[].executor_context | 実行者の判定 | object | - | - | - | 記載した項目は実行者のコンテキストにも入れ、実行者も判定する。記載しない項目は、レビュアーの確認観点だけに入れる。 | 実行で、実行者のコンテキストに入れる項目を選ぶ。 | `{}` |
      | items[].record | 判断の記録 | object | - | - | - | 利用者の判断を成果のデータに記録する先。記載しない項目の判断は、検討事項にだけ残る。 | 実行で、登録のときに判断の記録を組み立てる。 | - |
      | items[].record.target | 記録する先 | string | 必須 | - | minLength: `1` | 判断を記録する成果のデータのキー。 | 実行で、登録のときに判断を記録するキーにする。 | `approvals` |
      | notes | 補足 | array | - | - | - | 項目の表に収まらない、この制作の種類の決まり。 | 実行で、実行者とレビュアーが項目の判定と確認の検討事項の記載方法に適用する。<br>生成で、補足の表にする。 | - |
      | notes[].item | 項目 | string | 必須 | - | minLength: `1` | 決まりの対象。 | 生成で、補足の表の項目の列にする。 | `案を選ぶ工程の、案の段階` |
      | notes[].rule | 決まり | string | 必須 | - | minLength: `1` | 対象についての決まり。 | 実行で、実行者とレビュアーが判定と確認の検討事項の記載方法に適用する。 | `全ての案を対象に判定する。該当する案があれば、ヒューマンゲートがオフでも、利用者が案を選ぶ。` |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: {"kind": "data"} -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | - | script-creation/human_escalation | `_` でつないでいる |
      | lead | 他の設計書を指すときは説明文の中にリンクを記載せず、関連は `refs`（`related_item` の配列）に持つ。 | - | - |
      | items[].id | 一度使用した識別子は判断の記録に残るので、意味を変えない。 | - | - |
      | items[].executor_context | 重要な項目にだけ記載する。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: script-creation/human-escalation
      title: 'ヒューマンエスカレーションの表: 台本作成'
      lead: 台本作成の工程の成果が該当すれば、ヒューマンゲートがオフでも利用者に判断を仰ぐ項目。台本作成ノード（実行者）とレビュアーが参照する。
      items:
      - id: fact_change
        name: 事実の変更
        condition: 体験談の事実（人数・回数・順番・場所・数値）を変えた
        examples:
          match:
          - 2 回の出来事を、5 回にする
          not_match:
          - パターン借りで、題材を別の具体に置き換える
        ask: その変更でよいか
        steps:
        - materials
        - plan
        - outline
        - script
        record:
          target: approvals
      - id: cast_change
        name: 演者と役割の変更
        condition: 演者の人数か、誰が出るかを、受付の決定から変えた
        ask: その演者と役割でよいか
        steps:
        - cast
        - outline
        - script
        executor_context: {}
      notes:
      - item: 成果の資料の段階
        rule: 確認の検討事項に、該当した項目の `name` と、箇所と、`ask` を記載する。
      ```
tags:
