# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-launch
kind: template
name: 'テンプレート: 起動の構成'
description: エージェント 1 つを起動するときにだけ決まる値（起動する仕組み・許可・フック・環境変数・待つ上限・終了したときの扱い）を記載する書式を定め、起動の構成の設計書を作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:エージェント
    main: true
  - name: topic:起動
  - name: topic:テンプレート
  - name: topic:スキーマ
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      エージェント 1 つを起動するときにだけ決まる値（起動する仕組み・許可・フック・環境変数・待つ上限・終了したときの扱い）を記載する設計書。
      ほかの設計書から導ける値は記載せず、その設計書を原本にする。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 ファイル = 1 つのエージェントの起動にする。
      - モデル・起動方式・常駐かどうかは『エージェントの定義』の `model`・`session` から導き、記載しない。
      - MCP サーバーの接続・許可する MCP のツール・入れる引数・除く引数とそのフックは『MCP サーバーの定義』から導き、記載しない。
      - ネットワーク・作業フォルダ・マウントはコンテナ構成から導き、記載しない。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `LCH-1` |
      | title | タイトル | string | 必須 | - | - | 起動の構成の表示名。 | 生成で、ページの見出しにする。<br>dev-docs の検索で、文書の名前にする。 | `ブレインノードの起動` |
      | lead | 冒頭リード | string | 必須 | - | - | 起動の構成を 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>dev-docs の検索で、文書の概要文にする。 | `claude-balancer のコンテナで、プロジェクトを参照させずに起動する` |
      | agent | エージェント | string | 必須 | - | pattern: `^(?:[A-Z]+-\d+(?:-\d+)?)?#(?:[^\s\[]\|\[[^\]]*\])*$` | 起動する『エージェントの定義』への参照。 | 実装で、モデル・セッションの持ち方・きっかけを導く。<br>実装で、`clients[].agent` がこのエージェントの『MCP サーバーの定義』から、MCP の接続・許可するツール・入れる引数を導く。 | `AG-1#` |
      | launcher | 起動する仕組み | object | 必須 | - | - | エージェントを起動する仕組み。 | 実装で、起動の処理の実装先を決める。 | - |
      | launcher.kind | 種類 | string | 必須 | `service` / `command` | - | `service`（ほかのサービスに起動を依頼する）か `command`（コマンドで直接起動する）。 | 実装で、起動の処理の実装先を決める。 | - |
      | launcher.interface | 起動の依頼 | string | - | - | pattern: `^(?:[A-Z]+-\d+(?:-\d+)?)?#(?:[^\s\[]\|\[[^\]]*\])*$` | `kind` が `service` のときの、起動を依頼する『インターフェース定義』への参照。 | 実装で、起動の要求の書式にする。 | `IF-31#` |
      | launcher.command | コマンド | string | - | - | - | `kind` が `command` のときの、起動するコマンド。 | 実装で、起動のスクリプトにする。 | `claude --settings settings.json` |
      | container | コンテナ | string | - | - | pattern: `^(?:[A-Z]+-\d+(?:-\d+)?)?#(?:[^\s\[]\|\[[^\]]*\])*$` | コンテナで起動するときの、コンテナ構成のサービスへの参照。 | 実装で、ネットワーク・作業フォルダ・マウントをコンテナ構成から導く。 | `CTN-1#services[brain]` |
      | system_prompt | システムプロンプト | string | - | - | - | システムプロンプトに追加する指示のプロンプトファイルの id。 | 実装で、起動の `--append-system-prompt` にする。 | `brain/system` |
      | permissions | 許可 | object | - | - | - | 許可の設定。 | 実装で、起動の許可の設定にする。 | - |
      | permissions.mode | 許可のモード | string | 必須 | `bypassPermissions` / `dontAsk` / `acceptEdits` / `auto` / `manual` / `plan` | - | Claude Code の `--permission-mode` の値。 | 実装で、起動の `--permission-mode` にする。 | - |
      | permissions.deny | 使用させないツール | array | - | - | - | 使用させない組み込みのツール。 | 実装で、`settings.json` の `permissions.deny` にする。<br>検査で、エージェントフローの `steps[].calls` の `tool` が含まれていないかを確認する。 | `[Read, Edit, Write, Bash]` |
      | hooks | フック | array | - | - | - | 起動の設定に記載するフック。 | 実装で、`settings.json` の `hooks` にする。 | - |
      | hooks[].event | イベント | string | 必須 | - | pattern: `^[A-Z][A-Za-z]+$` | Claude Code の `settings.json` の `hooks` のキー（`SessionStart`・`PreToolUse` など）。 | 実装で、`settings.json` の `hooks` のキーにする。 | `SessionStart` |
      | hooks[].matcher | 対象 | string | - | - | - | 対象を絞る正規表現。 | 実装で、`settings.json` の `matcher` にする。 | `clear\|compact` |
      | hooks[].script | スクリプト | string | 必須 | - | - | 実行するスクリプトの、リポジトリの直下からのパス。 | 実装で、`settings.json` の `command` にする。 | `containers/brain/hooks/session_start.py` |
      | hooks[].purpose | 目的 | string | 必須 | - | - | フックでやること。 | レビューで、フックが要るかを確認する。 | `返却済みの記録の削除を依頼する` |
      | env | 環境変数 | array | - | - | - | 起動のときに指定する環境変数。 | 実装で、起動の環境にする。 | - |
      | env[].name | 名前 | string | 必須 | - | pattern: `^[A-Z][A-Z0-9_]*$` | 環境変数の名前。 | 実装で、起動の環境の変数名にする。 | `TZ` |
      | env[].value | 値 | string | - | - | - | 環境変数の値。`secret_from` を記載しないときは必須。 | 実装で、起動の環境の値にする。 | `Asia/Tokyo` |
      | env[].secret_from | 秘匿値の配置先 | string | - | - | - | 秘匿値の配置先。`value` と一方だけを記載する。 | 実装で、起動の環境に秘匿値を読み込む。 | `.env の AITUBER_TOKEN` |
      | timeout | 待つ上限 | object | 必須 | - | - | 起動を待つ上限。 | 実装で、起動の処理を待つ上限にする。 | - |
      | timeout.seconds | 秒数 | integer | 必須 | - | minimum: `1` | 待つ秒数。 | 実装で、待つ上限にする。 | `8` |
      | timeout.basis | 導き方 | string | 必須 | `measured_p999` / `published_spec` / `no_output` / `measured_x10` | - | 『タイムアウトの決め方』の結果。`measured_p999`（実測の p99.9 + 50%）/ `published_spec`（公開仕様の値で、計測の作業を残す）/ `no_output`（無出力の時間）/ `measured_x10`（実測の 10 倍か外側の作業の上限）。 | レビューで、値の導き方を確認する。 | - |
      | timeout.measured | 導出の元の値 | string | - | - | - | 導出の元にした値。`basis` が `published_spec` でないときは必須。 | レビューで、値の根拠を確認する。 | `p99.9 が 5.2 秒（1,200 回）` |
      | restart | 終了したときの扱い | array | - | - | - | 終了したときの、理由ごとの扱い。『エージェントの定義』の `session.lifetime` が `resident` のときは必須。 | 実装で、終了を受けた処理の分岐にする。 | - |
      | restart[].reason | 理由 | string | 必須 | - | - | 終了の理由。 | 実装で、終了を受けた処理の分岐の条件にする。 | `rate_limit` |
      | restart[].action | 扱い | string | 必須 | `wait_and_restart` / `retry_once` / `stop` | - | `wait_and_restart`（指定の時刻まで待って再起動する）/ `retry_once`（1 回だけ再起動し、失敗したら止めて通知する）/ `stop`（何もしない）。 | 実装で、終了を受けた処理にする。 | - |
      | refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにした節にする。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 初回に記載した内容のまま保ち、後から情報を追加しない。 | - | - |
      | agent | ID は指す設計書の最上位の `id` にする。<br>同じ設計書の中は `#{項目のパス}` だけでよい。<br>リストの項目は、その Schema の `x-key` で宣言したキーの値で `[{値}]` と指す（番号で指さない）。<br>設計書全体を指すときは `#` の後を空にする。<br>辞書のキーも `[{キー}]` で指し、`.` や空白を含むキーも 1 階層になる（`notes[main.py の補足]`）。<br>同じ `x-key` の値の要素の 2 つ目以降は `[{値}#{順番}]` と指す（`functions[main#3]`）。<br>同じ値の要素が無く末尾が `#{整数}` のときだけ、`[...]` の中の `#` を順番として扱う。 | IF-12#flows[0] | リストの項目を番号で指している |
      | launcher.interface | ID は指す設計書の最上位の `id` にする。<br>同じ設計書の中は `#{項目のパス}` だけでよい。<br>リストの項目は、その Schema の `x-key` で宣言したキーの値で `[{値}]` と指す（番号で指さない）。<br>設計書全体を指すときは `#` の後を空にする。<br>辞書のキーも `[{キー}]` で指し、`.` や空白を含むキーも 1 階層になる（`notes[main.py の補足]`）。<br>同じ `x-key` の値の要素の 2 つ目以降は `[{値}#{順番}]` と指す（`functions[main#3]`）。<br>同じ値の要素が無く末尾が `#{整数}` のときだけ、`[...]` の中の `#` を順番として扱う。 | IF-12#flows[0] | リストの項目を番号で指している |
      | container | ID は指す設計書の最上位の `id` にする。<br>同じ設計書の中は `#{項目のパス}` だけでよい。<br>リストの項目は、その Schema の `x-key` で宣言したキーの値で `[{値}]` と指す（番号で指さない）。<br>設計書全体を指すときは `#` の後を空にする。<br>辞書のキーも `[{キー}]` で指し、`.` や空白を含むキーも 1 階層になる（`notes[main.py の補足]`）。<br>同じ `x-key` の値の要素の 2 つ目以降は `[{値}#{順番}]` と指す（`functions[main#3]`）。<br>同じ値の要素が無く末尾が `#{整数}` のときだけ、`[...]` の中の `#` を順番として扱う。 | IF-12#flows[0] | リストの項目を番号で指している |
      | permissions.mode | アプリから起動するエージェントは `bypassPermissions` にする。 | - | - |
      | permissions.deny | MCP のツールは『MCP サーバーの定義』の `clients[].allow` から導き、記載しない。 | - | - |
      | hooks | MCP の引数を入れる・除くフックは『MCP サーバーの定義』から生成するので記載しない。 | - | - |
      | env[].value | 秘匿値は記載しない。 | - | - |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: LCH-1
      title: ブレインノードの起動
      lead: claude-balancer のコンテナで、プロジェクトを参照させずに起動する
      agent: AG-1#
      launcher:
        kind: service
        interface: IF-31#
      container: CTN-1#services[brain]
      system_prompt: brain/system
      permissions:
        mode: bypassPermissions
        deny:
        - Read
        - Edit
        - Write
        - Bash
        - Grep
        - Glob
        - WebFetch
        - WebSearch
      hooks:
      - event: SessionStart
        matcher: clear|compact
        script: containers/brain/hooks/session_start.py
        purpose: clear・圧縮のときに、返却済みの記録の削除を依頼する
      env:
      - name: TZ
        value: Asia/Tokyo
      timeout:
        seconds: 60
        basis: published_spec
      restart:
      - reason: rate_limit
        action: wait_and_restart
      - reason: authentication_failed
        action: retry_once
      - reason: claude_exited
        action: retry_once
      - reason: lease_expired
        action: retry_once
      - reason: stopped
        action: stop
      refs:
      - AG-1#
      - MCP-1#
      ```
