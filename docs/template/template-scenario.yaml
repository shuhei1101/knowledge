  - id: example-sample-01
    name: 記載例
    body: |-
      ````yaml
      id: SC-1
      title: プロフィール編集
      lead: ログイン中のユーザーが自身のプロフィール（氏名・自己紹介・アバター画像）を編集する単一ユースケース。
      test_file: tests/e2e/単一ユースケース/test_profile_edit.py
      primary_actor: ログイン中のユーザー
      trigger: プロフィール編集画面を開く
      preconditions:
      - ユーザーがログインしている
      scenarios:
      - name: 正常シナリオ
        setup:
        - name: Mock
          description: なし（実環境で実行）
        - name: createUser
          description: ログイン中のユーザー A
        - name: createProfile
          description: ユーザー A に紐づくプロフィール
          notes: '`visible: true`'
        flow: |-
          <!-- map -->

          ```mermaid
          sequenceDiagram
            actor U as ユーザー
            participant FE as 画面（フロントエンド）
            participant BE as バックエンド API
            participant DB as DB

            U->>FE: プロフィール編集画面を開く
            FE-->>BE: プロフィールを取得
            BE-->>FE: 初期値
            U->>FE: 氏名・自己紹介を編集して保存
            FE->>BE: プロフィールを更新
            BE->>DB: 更新
            BE-->>FE: 200 OK
            FE-->>U: 詳細画面へ遷移
          ```

          <!-- /map -->
        expected:
        - プロフィール表示画面に編集後の氏名・自己紹介が表示されている
        - DB の該当プロフィールが編集後の値になっている
        test: test_normal
      - name: 異常シナリオ（5MB 超の画像アップロード）
        setup:
        - name: Mock
          description: なし（実環境で実行）
        - name: createUser
          description: ログイン中のユーザー A
        flow: |-
          <!-- map -->

          ```mermaid
          sequenceDiagram
            actor U as ユーザー
            participant FE as 画面（フロントエンド）

            U->>FE: 5MB 超の画像を選択
            FE->>FE: 入力の検証に失敗
            FE-->>U: 選択欄の下にエラーを表示
          ```

          <!-- /map -->
        expected:
        - エラーが表示され、画像が選ばれていない
        test: test_error_when_image_too_large
      ````
