# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-scenario
kind: template
name: "テンプレート: シナリオ"
description: 単一ユースケースまたは複合ユースケースの正常・異常シナリオを記載するシナリオの書式を定め、シナリオを作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:シナリオ
    main: true
  - name: topic:テンプレート
  - name: topic:ユースケース
  - name: topic:複合ユースケース
status: current
visibility: internal
rev: 4
items:
  - id: overview
    name: 概要
    body: |-
      単一ユースケース（ユーザーの 1 操作）または複合ユースケース（単一ユースケースの連鎖）の正常・異常シナリオ。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 ファイル = 1 ユースケース = テストの 1 ファイルにする。
      - 外部 API は Mock 前提で記載する。
      - 既存の流用・既存の修正・新規の単一・新規の複合のどれで記載するかは判定フローチャート『シナリオ』で決める。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>dev-docs の配信で、文書の公開範囲のメタデータにする。 | - |
      | title | タイトル | string | 必須 | - | - | 単一ユースケースは機能名、複合ユースケースは業務シナリオの論理名。ファイル名に合わせる。 | 生成で、ページの見出しにする。<br>dev-docs の検索で、文書の名前にする。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>dev-docs の検索で、文書の概要文にする。 | - |
      | test_file | 対応テストファイル | string | - | - | pattern: `^tests/.+` | `tests/e2e/{単一ユースケース,複合ユースケース}/…`（規約『V字モデル』）。 | テストで、E2E テストを作るファイルにする。<br>検査で、テストのファイルがあるかを確認する。<br>計画で、作業 PR の影響するユースケースから E2E の対象を集める。 | - |
      | primary_actor | 主アクター | string | - | - | - | - | E2E テストで、操作する主体にする。<br>レビューで、主アクターの目的が満たされるかを確認する。 | - |
      | stakeholders | 関係者と関心 | array | - | - | - | - | レビューで、関係者ごとの関心が成功時の保証で守られるかを確認する。 | - |
      | stakeholders[].name | 関係者 | string | 必須 | - | - | - | レビューで、関心を守る相手にする。 | - |
      | stakeholders[].interest | 関心 | string | 必須 | - | - | - | レビューで、成功時の保証と失敗しても守ることに関心が入っているかを確認する。 | - |
      | trigger | きっかけ | string | - | - | - | - | E2E テストで、シナリオを始める操作にする。<br>設計で、インターフェース定義の入口の種類を決める。 | - |
      | preconditions | 事前条件 | array | - | - | - | - | E2E テストで、事前に用意する状態にする。 | - |
      | success_guarantee | 成功時に保証すること | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | E2E テストで、正常シナリオの終わりに確認する状態にする。 | - |
      | minimal_guarantee | 失敗しても守ること | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | E2E テストで、異常シナリオの終わりに確認する状態にする。 | - |
      | frequency | 頻度 | string | - | - | - | - | 設計で、非機能要件の性能の値を決める前提にする。 | - |
      | priority | 優先度 | string | - | - | - | - | 計画で、着手の順を決める。 | - |
      | reading | 置き換え | string | - | - | - | 1 ファイルで複数のレイヤー・役割を代表するときの置き換えの表。 | E2E テストで、1 つのファイルで代表させたレイヤー・役割へ置き換える。 | - |
      | scenarios | シナリオ | array | 必須 | - | minItems: `1` | 正常・異常のシナリオを並列に並べる。異常の無い機能は `異常シナリオ` を持たない。 | E2E テストで、シナリオごとのテスト関数にする。<br>生成で、シナリオごとの節にする。 | - |
      | scenarios[].name | シナリオ名 | string | 必須 | - | pattern: `^(正常\|異常)シナリオ(（.+）)?$` | 基本形は `正常シナリオ`。正常な結末が条件で分かれるときは `正常シナリオ（{条件}）`、異常は `異常シナリオ（{条件}）`。 | E2E テストで、テスト関数の名前に対応させる。<br>設計で、ほかの設計書の参照（`scenarios[正常シナリオ]`）からシナリオを指す。 | - |
      | scenarios[].setup | セットアップ | array | 必須 | - | minItems: `1` | 事前に要るデータ・状態と、分岐・異常を決定的に誘発する入力。 | E2E テストで、前提を作る Factory・Mock にする。 | - |
      | scenarios[].setup[].name | セットアップ | string | 必須 | - | - | 前提を作る Factory 関数名か状態の名前。 | E2E テストで、呼ぶ Factory 関数か作る状態にする。 | - |
      | scenarios[].setup[].description | 説明 | string | 必須 | - | - | その前提の意味・役割・依存関係。Mock の行は差し替える依存と応答。 | E2E テストで、前提の役割と Mock の応答にする。 | - |
      | scenarios[].setup[].notes | 補足 | string | - | - | - | 引数に指定する重要な値・分岐を決定的に誘発する値。 | E2E テストで、分岐を決定的に起こす値にする。 | - |
      | scenarios[].flow | フロー | string | 必須 | - | - | mdmark の map の図。単一ユースケースは `sequenceDiagram`、複合ユースケースは単一ユースケースをノードとして連鎖させる `flowchart TD`。 | 設計で、インターフェース定義の操作の流れと関わる相手を決める。<br>生成で、シーケンス図・フロー図にする。 | - |
      | scenarios[].expected | 期待値 | array | 必須 | - | minItems: `1` | フローの終了時点で外部から観測できる状態・戻り値。1 要素 = 1 つの確認項目。 | E2E テストで、確認する項目にする。 | - |
      | scenarios[].test | テスト | string | - | - | pattern: `^test_[A-Za-z0-9_]+$` | 対応するテスト関数（`正常シナリオ` → `test_normal` / `正常シナリオ（{条件}）` → `test_normal_when_{条件}` / `異常シナリオ（{条件}）` → `test_error_when_{条件}`。`{条件}` は英訳）。 | 検査で、テストのファイルにその名前の関数があるかを確認する。<br>レビューで、項目ごとにテストがあるかを確認する。 | - |
      | scenarios[].uses | 使用する単一ユースケース | array | - | - | - | 複合ユースケースのノードが指す単一ユースケースのシナリオ。 | テストで、複合ユースケースの E2E がつなぐ単一ユースケースのシナリオを参照する。<br>検査で、指すシナリオが実在するかを確認する。 | - |
      | scenarios[].refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | scenarios[].decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | scenarios[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにした節にする。 | - |
      | refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにした節にする。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。<br>対象そのものが変わったときだけ書き換える。 | 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。 | 仕様を冒頭リードに記載している。仕様は各項目へ分ける |
      | success_guarantee | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | minimal_guarantee | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | reading | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | scenarios[].setup | `Mock` の行（差し替える依存。差し替えないときも `なし（…）`）を必ず配置する。 | - | - |
      | scenarios[].setup[].name | `Mock` の行を必ず配置する。 | - | - |
      | scenarios[].flow | `<!-- map -->` から `<!-- /map -->` の範囲に、```mermaid のコードブロックを 1 つ記載する。<br>1 図 = 結末 1 本の一本道にする。<br>ユーザー視点で観測できる境界まで記載する。<br>複合ユースケースのノード名は `{UC名}:{シナリオ名}` にする。 | - | - |
      | scenarios[].notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

