# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-scenario
kind: template
name: "テンプレート: シナリオ"
description: 単一ユースケースまたは複合ユースケースの正常・異常シナリオを記載するシナリオの書式を定め、シナリオを作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:シナリオ
    main: true
  - name: topic:テンプレート
  - name: topic:ユースケース
  - name: topic:複合ユースケース
status: current
visibility: internal
rev: 4
items:
  - id: overview
    name: 概要
    body: |-
      単一ユースケース（ユーザーの 1 操作）または複合ユースケース（単一ユースケースの連鎖）の正常・異常シナリオ。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 ファイル = 1 ユースケース = テストの 1 ファイルにする。
      - 外部 API は Mock 前提で記載する。
      - 既存の流用・既存の修正・新規の単一・新規の複合のどれで記載するかは判定フローチャート『シナリオ』で決める。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | `IF-12` / `IF-3038-1` |
      | title | タイトル | string | 必須 | - | - | 単一ユースケースは機能名、複合ユースケースは業務シナリオの論理名。ファイル名に合わせる。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。 | - |
      | issue | 対応 Issue | integer | - | - | - | 起点の Issue の番号。 | - |
      | test_file | 対応テストファイル | string | - | - | pattern: `^tests/.+` | `tests/e2e/{単一ユースケース,複合ユースケース}/…`（規約『V字モデル』）。 | - |
      | primary_actor | 主アクター | string | - | - | - | - | - |
      | stakeholders | 関係者と関心 | array | - | - | - | - | - |
      | stakeholders[].name | 関係者 | string | 必須 | - | - | - | - |
      | stakeholders[].interest | 関心 | string | 必須 | - | - | - | - |
      | trigger | きっかけ | string | - | - | - | - | - |
      | preconditions | 事前条件 | array | - | - | - | - | - |
      | success_guarantee | 成功時に保証すること | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | - |
      | minimal_guarantee | 失敗しても守ること | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | - |
      | frequency | 頻度 | string | - | - | - | - | - |
      | priority | 優先度 | string | - | - | - | - | - |
      | reading | 置き換え | string | - | - | - | 1 ファイルで複数のレイヤー・役割を代表するときの置き換えの表。 | - |
      | scenarios | シナリオ | array | 必須 | - | minItems: `1` | 正常・異常のシナリオを並列に並べる。異常の無い機能は `異常シナリオ` を持たない。 | - |
      | scenarios[].name | シナリオ名 | string | 必須 | - | pattern: `^(正常\|異常)シナリオ(（.+）)?$` | 基本形は `正常シナリオ`。正常な結末が条件で分かれるときは `正常シナリオ（{条件}）`、異常は `異常シナリオ（{条件}）`。 | - |
      | scenarios[].setup | セットアップ | array | 必須 | - | minItems: `1` | 事前に要るデータ・状態と、分岐・異常を決定的に誘発する入力。 | - |
      | scenarios[].setup[].name | セットアップ | string | 必須 | - | - | 前提を作る Factory 関数名か状態の名前。 | - |
      | scenarios[].setup[].description | 説明 | string | 必須 | - | - | その前提の意味・役割・依存関係。Mock の行は差し替える依存と応答。 | - |
      | scenarios[].setup[].notes | 補足 | string | - | - | - | 引数に指定する重要な値・分岐を決定的に誘発する値。 | - |
      | scenarios[].flow | フロー | string | 必須 | - | - | 単一ユースケースは `sequenceDiagram`、複合ユースケースは単一ユースケースをノードとして連鎖させる `flowchart TD`。 | - |
      | scenarios[].expected | 期待値 | array | 必須 | - | minItems: `1` | フローの終了時点で外部から観測できる状態・戻り値。1 要素 = 1 つの確認項目。 | - |
      | scenarios[].test | テスト | string | - | - | pattern: `^test_[A-Za-z0-9_]+$` | 対応するテスト関数（`正常シナリオ` → `test_normal` / `正常シナリオ（{条件}）` → `test_normal_when_{条件}` / `異常シナリオ（{条件}）` → `test_error_when_{条件}`。`{条件}` は英訳）。 | - |
      | scenarios[].uses | 使用する単一ユースケース | array | - | - | - | 複合ユースケースのノードが指す単一ユースケースのシナリオ。 | - |
      | scenarios[].refs | 関連 | array | - | - | - | - | - |
      | scenarios[].decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | - |
      | scenarios[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | - |
      | refs | 関連 | array | - | - | - | - | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。<br>対象そのものが変わったときだけ書き換える。 | 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。 | 仕様を冒頭リードに記載している。仕様は各項目へ分ける |
      | success_guarantee | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | minimal_guarantee | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | reading | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | scenarios[].setup | `Mock` の行（差し替える依存。差し替えないときも `なし（…）`）を必ず配置する。 | - | - |
      | scenarios[].setup[].name | `Mock` の行を必ず配置する。 | - | - |
      | scenarios[].flow | 1 図 = 結末 1 本の一本道にする。<br>ユーザー視点で観測できる境界まで記載する。<br>複合ユースケースのノード名は `{UC名}:{シナリオ名}` にし、`click` で単一ユースケースのセクションへリンクする。 | - | - |
      | scenarios[].notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: SC-1
      title: プロフィール編集
      lead: ログイン中のユーザーが自身のプロフィール（氏名・自己紹介・アバター画像）を編集する単一ユースケース。
      issue: 12
      test_file: tests/e2e/単一ユースケース/test_profile_edit.py
      primary_actor: ログイン中のユーザー
      trigger: プロフィール編集画面を開く
      preconditions:
      - ユーザーがログインしている
      scenarios:
      - name: 正常シナリオ
        setup:
        - name: Mock
          description: なし（実環境で実行）
        - name: createUser
          description: ログイン中のユーザー A
        - name: createProfile
          description: ユーザー A に紐づくプロフィール
          notes: '`visible: true`'
        flow: |-
          ```mermaid
          sequenceDiagram
            actor U as ユーザー
            participant FE as 画面（フロントエンド）
            participant BE as バックエンド API
            participant DB as DB

            U->>FE: プロフィール編集画面を開く
            FE-->>BE: プロフィールを取得
            BE-->>FE: 初期値
            U->>FE: 氏名・自己紹介を編集して保存
            FE->>BE: プロフィールを更新
            BE->>DB: 更新
            BE-->>FE: 200 OK
            FE-->>U: 詳細画面へ遷移
          ```
        expected:
        - プロフィール表示画面に編集後の氏名・自己紹介が表示されている
        - DB の該当プロフィールが編集後の値になっている
        test: test_normal
      - name: 異常シナリオ（5MB 超の画像アップロード）
        setup:
        - name: Mock
          description: なし（実環境で実行）
        - name: createUser
          description: ログイン中のユーザー A
        flow: |-
          ```mermaid
          sequenceDiagram
            actor U as ユーザー
            participant FE as 画面（フロントエンド）

            U->>FE: 5MB 超の画像を選択
            FE->>FE: 入力の検証に失敗
            FE-->>U: 選択欄の下にエラーを表示
          ```
        expected:
        - エラーが表示され、画像が選ばれていない
        test: test_error_when_image_too_large
      ```
