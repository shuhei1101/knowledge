# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-scenario
kind: template
name: "テンプレート: シナリオ"
description: 単一ユースケースまたは複合ユースケースの正常・異常シナリオを記載するシナリオの書式を定め、シナリオを作る・修正するときに読む。
tags:
  - name: scope:テンプレート
  - name: topic:シナリオ
    main: true
  - name: topic:テンプレート
  - name: topic:ユースケース
  - name: topic:複合ユースケース
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      単一ユースケース（ユーザーの 1 操作）または複合ユースケース（単一ユースケースの連鎖）の正常・異常シナリオ。
      1 ファイル = 1 ユースケース = テストの 1 ファイル。外部 API は Mock 前提。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | title | タイトル | string | 必須 | - | - | 単一ユースケースは機能名、複合ユースケースは業務シナリオの論理名。ファイル名に合わせる。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。<br>初回に書いた内容のまま保ち、後から情報を追加しない（仕様は各項目に書く）。<br>対象そのものが変わったときだけ書き換える。 | - |
      | issue | 対応 Issue | integer | - | - | - | 起点の Issue の番号。 | - |
      | test_file | 対応テストファイル | string | - | - | pattern: ^tests/.+ | `tests/e2e/{単一ユースケース,複合ユースケース}/…`。 | - |
      | primary_actor | 主アクター | string | - | - | - | - | - |
      | stakeholders | 関係者と関心 | array | - | - | - | - | - |
      | stakeholders[].name | 関係者 | string | 必須 | - | - | - | - |
      | stakeholders[].interest | 関心 | string | 必須 | - | - | - | - |
      | trigger | きっかけ | string | - | - | - | - | - |
      | preconditions | 事前条件 | array | - | - | - | - | - |
      | success_guarantee | 成功時に保証すること | string | - | - | - | Markdown で書く本文。<br>他の設計書を指すときは説明文の中にリンクを書かず、参照は `refs`（`ref` の配列）に持つ。 | - |
      | minimal_guarantee | 失敗しても守ること | string | - | - | - | Markdown で書く本文。<br>他の設計書を指すときは説明文の中にリンクを書かず、参照は `refs`（`ref` の配列）に持つ。 | - |
      | frequency | 頻度 | string | - | - | - | - | - |
      | priority | 優先度 | string | - | - | - | - | - |
      | reading | 読み替え | string | - | - | - | 1 ファイルで複数のレイヤー・役割を代表するときの読み替えの表。 | - |
      | scenarios | シナリオ | array | 必須 | - | minItems: 1 | 正常・異常のシナリオを並列に並べる。異常の無い機能は `異常シナリオ` を持たない。 | - |
      | scenarios[].name | シナリオ名 | string | 必須 | - | pattern: ^(正常\|異常)シナリオ(（.+）)?$ | 基本形は `正常シナリオ`。正常な結末が条件で分かれるときは `正常シナリオ（{条件}）`、異常は `異常シナリオ（{条件}）`。 | - |
      | scenarios[].setup | セットアップ | array | 必須 | - | minItems: 1 | 事前に要るデータ・状態と、分岐・異常を決定的に誘発する入力。<br>`Mock` の行（差し替える依存。差し替えないときも `なし（…）`）を必ず置く。 | - |
      | scenarios[].setup[].name | セットアップ | string | 必須 | - | - | 前提を作る Factory 関数名か状態の名前。`Mock` の行を必ず置く。 | - |
      | scenarios[].setup[].description | 説明 | string | 必須 | - | - | その前提の意味・役割・依存関係。Mock の行は差し替える依存と応答。 | - |
      | scenarios[].setup[].notes | 補足 | string | - | - | - | 引数に指定する重要な値・分岐を決定的に誘発する値。 | - |
      | scenarios[].flow | フロー | string | 必須 | - | - | 単一ユースケースは `sequenceDiagram`、複合ユースケースは単一ユースケースを箱として連鎖させる `flowchart TD`。<br>1 図 = 結末 1 本の一本道。ユーザー視点で観測できる境界まで書く。<br>複合ユースケースの箱のノード名は `{UC名}:{シナリオ名}` にし、`click` で単一ユースケースのセクションへリンクする。 | - |
      | scenarios[].expected | 期待値 | array | 必須 | - | minItems: 1 | フローの終了時点で外部から観測できる状態・戻り値。1 要素 = 1 つの確かめ。 | - |
      | scenarios[].test | テスト | string | - | - | pattern: ^test_[A-Za-z0-9_]+$ | 対応するテスト関数（`正常シナリオ` → `test_normal` / `正常シナリオ（{条件}）` → `test_normal_when_{条件}` / `異常シナリオ（{条件}）` → `test_error_when_{条件}`。`{条件}` は英訳）。 | - |
      | scenarios[].uses | 使う単一ユースケース | array | - | - | - | 複合ユースケースの箱が指す単一ユースケースのシナリオ。 | - |
      | scenarios[].refs | 関連 | array | - | - | - | - | - |
      | scenarios[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |
      | refs | 関連 | array | - | - | - | - | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      title: プロフィール編集
      lead: ログイン中のユーザーが自身のプロフィール（氏名・自己紹介・アバター画像）を編集する単一ユースケース。
      issue: 12
      test_file: tests/e2e/単一ユースケース/test_profile_edit.py
      primary_actor: ログイン中のユーザー
      trigger: プロフィール編集画面を開く
      preconditions:
      - ユーザーがログインしている
      scenarios:
      - name: 正常シナリオ
        setup:
        - name: Mock
          description: なし（実環境で実行）
        - name: createUser
          description: ログイン中のユーザー A
        - name: createProfile
          description: ユーザー A に紐づくプロフィール
          notes: '`visible: true`'
        flow: |-
          ```mermaid
          sequenceDiagram
            actor U as ユーザー
            participant FE as 画面（フロントエンド）
            participant BE as バックエンド API
            participant DB as DB

            U->>FE: プロフィール編集画面を開く
            FE-->>BE: プロフィールを取得
            BE-->>FE: 初期値
            U->>FE: 氏名・自己紹介を編集して保存
            FE->>BE: プロフィールを更新
            BE->>DB: 更新
            BE-->>FE: 200 OK
            FE-->>U: 詳細画面へ遷移
          ```
        expected:
        - プロフィール表示画面に編集後の氏名・自己紹介が表示されている
        - DB の該当プロフィールが編集後の値になっている
        test: test_normal
      - name: 異常シナリオ（5MB 超の画像アップロード）
        setup:
        - name: Mock
          description: なし（実環境で実行）
        - name: createUser
          description: ログイン中のユーザー A
        flow: |-
          ```mermaid
          sequenceDiagram
            actor U as ユーザー
            participant FE as 画面（フロントエンド）

            U->>FE: 5MB 超の画像を選択
            FE->>FE: 入力の検証に失敗
            FE-->>U: 選択欄の下にエラーを表示
          ```
        expected:
        - エラーが表示され、画像が選ばれていない
        test: test_error_when_image_too_large
      ```
