# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-flowchart
kind: template
name: "テンプレート: 判定フローチャート"
description: 決めたい内容が複数の判定軸で決まる場面で使う判定フローチャートの書式を定め、判定フローチャートを作るときに読む。
tags:
  - name: scope:テンプレート
    main: true
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      判定フローチャートを作るときの書式定義。

      判定フローチャートは **決めたい内容が複数の判定軸で決まる** 場面で使う。

      新規作成時は文書の `description` に概要を記載する。
  - id: file-naming-01
    name: ファイル命名規則
    body: |-
      判定したい選択肢 2 つを表す名前を、`docs/flowchart/flowchart-{対象}.yaml`（ファイル名は `id`）の `{対象}` に入れる。
      以下のどちらかで命名する:

      | パターン | 例 |
      | --- | --- |
      | 判定 2 択の **両方を包含する上位概念**（推奨） | `flowchart-scenario.yaml`（複合ユースケース or 単一ユースケース の判定） |
      | 判定 2 択の名前を **連結** して並記 | `flowchart-composite-use-case-single-use-case.yaml` |

      - 命名から「何を判定するフローチャートか」が一目で分かることが重要
      - 判定対象が 3 択以上（例: `既存流用` / `既存修正` / `新規複合` / `新規単一`）の場合も、それらを包含する上位概念（`scenario`）を使う
      - 「粒度」「レベル」等の抽象語だけは避ける（何の粒度 / 何のレベルか分からない）
  - id: section-list-01
    name: セクション一覧
    body: |-
      | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- |
      | タイトル（メタデータ `name`・`description`） | - | 必須 |
      | `overview` の項目 | - | 必須 |
      | Mermaid ブロックを `body` に持つ項目 | - | 必須 |
      | `※n` の注記の項目 | - | Mermaid に `※n` がある場合のみ |
  - id: title-01
    name: "`タイトル`"
    body: |-
      ### 記述例

      ```yaml
      name: "{対象作業} 判定フローチャート"
      description: "{何を判定するか}を判定し、{どんなときに読むか}に読む"
      ```

      ### 補足

      - メタデータ `name` はページタイトル + `判定フローチャート` 接尾辞
      - `overview` の項目の本文に、このページの `description` と同じ 1 行を置く
  - id: mermaid-block-01
    name: "`Mermaid ブロック`"
    body: |-
      ### 記述例

      ````yaml
      - id: "{対象}-flow-01"
        group: "{対象作業} 判定フローチャート"
        name: 判定フロー
        body: |-
          ```mermaid
          flowchart TD
            START([...])
            Q0{...?}
            ...
          ```
      - id: "{対象}-flow-02"
        group: "{対象作業} 判定フローチャート"
        name: ※1 用語名
        body: |-
          - **※1 用語名**: 定義（1 行）
      - id: "{対象}-flow-03"
        group: "{対象作業} 判定フローチャート"
        name: ※2 用語名
        body: |-
          - **※2 用語名**: 定義（1 行）
      ````
