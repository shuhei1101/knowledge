# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-flowchart
kind: template
name: "テンプレート: 判定フローチャート"
description: 決めたい内容が複数の判定軸で決まる場面で使う、判定フローチャートの書式を定めるテンプレート。
tags:
  - name: scope:テンプレート
    main: true
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      判定フローチャートを作るときの書式定義。

      判定フローチャートは **決めたい内容が複数の判定軸で決まる** 場面で使う。

      新規作成時は文書の `description` に概要を記載する。
  - id: file-naming-01
    name: ファイル命名規則
    body: |-
      判定したい選択肢 2 つを表す名前を `{対象}` に入れる。
      以下のどちらかで命名する:

      | パターン | 例 |
      | --- | --- |
      | 判定 2 択の **両方を包含する上位概念**（推奨） | `シナリオ.md`（複合ユースケース or 単一ユースケース の判定） |
      | 判定 2 択の名前を **連結** して並記 | `複合ユースケース単一ユースケース.md` |

      - 命名から「何を判定するフローチャートか」が一目で分かることが重要
      - 判定対象が 3 択以上（例: `既存流用` / `既存修正` / `新規複合` / `新規単一`）の場合も、それらを包含する上位概念（`シナリオ`）を使う
      - 「粒度」「レベル」等の抽象語だけは避ける（何の粒度 / 何のレベルか分からない）
  - id: section-list-01
    name: セクション一覧
    body: |-
      | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- |
      | タイトル | - | 必須 |
      | Mermaid ブロック | - | 必須 |
  - id: title-01
    name: "`タイトル`"
    body: |-
      ### 記述例

      ```markdown
      # {対象作業} 判定フローチャート

      {何を判定するかの 1 行}
      ```

      ### 補足

      - 1 行目はページタイトル（ファイル名と一致）+ `判定フローチャート` 接尾辞
      - タイトル直下に、このページの `description` と同じ 1 行を置く
  - id: mermaid-block-01
    name: "`Mermaid ブロック`"
    body: |-
      ### 記述例

      ````markdown

      ```mermaid
      flowchart TD
        START([...])
        Q0{...?}
        ...
      ```

      - **※1 用語名**: 定義（1 行）
      - **※2 用語名**: 定義（1 行）

      ````
