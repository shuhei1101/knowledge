# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-flowchart
kind: template
name: "テンプレート: 判定フローチャート"
description: 決めたい内容が複数の判定軸で決まる場面で使用する判定フローチャートの書式を定め、判定フローチャートを作るときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:naming
  - name: topic:テンプレート
  - name: topic:ファイル
  - name: topic:フローチャート
  - name: topic:ブロック
  - name: topic:判定フローチャート
    main: true
  - name: tool:mdmark
  - name: action:判定
status: current
visibility: internal
rev: 7
items:
  - id: overview
    name: 概要
    body: |-
      判定フローチャートを作るときの書式定義。

      判定フローチャートは、決めたい内容が複数の判定軸で決まる場面に使用する。
      判定表・チェックシート・手順のどれを使用するかは判定フローチャート [決まりの表し方の選び方](id:flowchart-rule-form-choice) で決める。

      図は mdmark の map の図（Mermaid の `flowchart`）で描く。

      新規作成時は文書の `description` に概要を記載する。
  - id: file-naming-01
    name: ファイル命名規則
    body: |-
      判定したい選択肢 2 つを表す名前を、`docs/flowchart/flowchart-{対象}.yaml`（ファイル名は `id`）の `{対象}` に入れる。
      次のどちらかで命名する。

      | パターン | 例 |
      | --- | --- |
      | 判定 2 択の両方を包含する上位概念（推奨） | `flowchart-scenario.yaml`（複合ユースケース or 単一ユースケース の判定） |
      | 判定 2 択の名前を連結して並記 | `flowchart-composite-use-case-single-use-case.yaml` |

      - 命名から「何を判定するフローチャートか」が一目で分かることが重要
      - 判定対象が 3 択以上（例: `既存流用` / `既存修正` / `新規複合` / `新規単一`）の場合も、それらを包含する上位概念（`scenario`）を使用する
      - 「粒度」「レベル」等の抽象的な単語だけは使用しない（何の粒度 / 何のレベルか分からない）
  - id: section-list-01
    name: セクション一覧
    body: |-
      <!-- table: data -->

      | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- |
      | タイトル（メタデータ `name`・`description`） | - | 必須 |
      | `overview` の項目 | - | 必須 |
      | map の図と注記の定義を `body` に持つ項目 | - | 必須 |

      <!-- /table -->
  - id: title-01
    name: "`タイトル`"
    body: |-
      ### 記述例

      ```yaml
      name: "{対象作業} 判定フローチャート"
      description: "{何を判定するか}を判定し、{どんなときに参照するか}に参照する"
      ```

      ### 補足

      - メタデータ `name` はページタイトル + `判定フローチャート` 接尾辞
      - `overview` の項目の本文に、このページの `description` と同じ 1 行を配置する
  - id: flow-block-01
    name: "`map の図`"
    body: |-
      ### 記述例

      ````yaml
      - id: "{対象}-flow-01"
        group: "{対象作業} 判定フローチャート"
        name: 判定フロー
        body: |-
          <!-- map: {"title": "{対象作業}"} -->

          ```mermaid
          flowchart TB
            start(("新規に｛対象｝を記載したい"))
            q0{"Q0 の判定文"}
            a1["不合格時のアクション"]
            q1{"Q1 の判定文"}
            r1(["最終結果 1"])
            r2(["最終結果 2"])
            start --> q0
            q0 -->|YES| a1
            q0 -->|NO| q1
            q1 -->|YES| r1
            q1 -->|NO| r2
          ```

          <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["{対象}-n1"]}, "r2": {"annotations": ["{対象}-n2"]}}} -->

          <!-- /map -->

          ※[{対象}-n1]: 用語名: 定義（1 行）。

          ※[{対象}-n2]: 用語名: 定義（1 行）。
      ````

      ### 補足

      - `title` はメタデータ `name` から ` 判定フローチャート` を除いた名前にする
      - ノードの ID は英数字と `_` で記載する
      - 図の記載方法は、mdmark の使い方『Mermaidと補足で図を描く』に従う
  - id: node-kind-01
    group: ノード種類
    name: ノードの種類の表
    body: |-
      <!-- table: data -->

      | 形状 | ノード | 使用方法 |
      | --- | --- | --- |
      | `(("文"))` | 開始ノード | 1 個だけ |
      | `{"文"}` | 判定ノード | 菱形。YES / NO で分岐する |
      | `["文"]` | アクションノード | 不合格時の対応 |
      | `(["文"])` | 終端ノード | 判定通過時の最終結果 |

      <!-- /table -->
  - id: label-01
    group: ラベル
    name: 線のラベル
    body: |-
      - 線のラベル（`-->|YES|`）は `YES` / `NO` の 1 単語だけにする（補足は判定ノードの文に含める）
  - id: label-02
    group: ラベル
    name: 判定文は疑問形
    body: |-
      - 判定文は疑問形（`〜か`）で統一
  - id: term-01
    group: 用語
    name: 用語の注記
    body: |-
      - 用語の定義は、図の下に `※[{対象}-n{N}]: 用語名: 定義。` の 1 行で記載する。
        ノードからは、補足 `map-data` の `notes` の `{ノードの ID}.annotations` で注記の ID を参照する
  - id: term-02
    group: 用語
    name: 注記の ID の採番
    body: |-
      - 注記の ID の `{N}` は図の中の登場順で採番し、初出のノードだけから参照する
  - id: caution-01
    group: 注意
    name: 括弧は全角
    body: |-
      - ノード内の括弧は全角を使用する。
