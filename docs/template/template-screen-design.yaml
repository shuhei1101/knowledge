# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-screen-design
kind: template
name: "テンプレート: 画面設計"
description: 1 画面の要素の仕様と入力チェックを記載する画面設計の書式を定め、画面設計を作る・修正するときに読む。
tags:
  - name: scope:テンプレート
  - name: topic:テンプレート
  - name: topic:仕様
  - name: topic:画面
    main: true
  - name: topic:要素
  - name: action:入力
  - name: action:検査
  - name: action:設計
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      1 画面の要素の仕様（表示条件・活性条件・制限・初期値・取得元・送信先・アクション）と入力チェック。1 ファイル = 1 画面。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | title | タイトル | string | 必須 | - | - | 日本語の画面名。ファイル名に合わせる。 | - |
      | screen | 画面 | string | - | - | - | 画面の実装ファイルのパス。 | - |
      | mock | モック | string | - | - | - | 採用したモックの置き場所。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。<br>初回に書いた内容のまま保ち、後から情報を追加しない（仕様は各項目に書く）。<br>対象そのものが変わったときだけ書き換える。 | - |
      | test_file | 対応テストファイル | string | - | - | pattern: ^tests/.+ | 対応する結合テストのファイル。 | - |
      | elements | 要素一覧 | array | 必須 | - | minItems: 1 | 画面の要素 1 つ = 1 要素。ダイアログの中の要素も並べ、位置の先頭にダイアログ名を書く。 | - |
      | elements[].name | 要素 | string | 必須 | - | - | ボタン・入力欄・ラベル・テーブル等の日本語の論理名。画面の中で一意にする。 | - |
      | elements[].id | 項目 ID | string | - | - | - | 画面の中で一意な識別子。テスト・実装から引く。 | - |
      | elements[].kind | 種類 | string | 必須 | - | - | `button` / `input` / `select` / `table` / `label` 等。 | - |
      | elements[].component | 部品 | string | - | - | pattern: ^[^#\s]*#(?:[^\s\[]\|\[[^\]]*\])*$ | 使う部品の部品設計（`dev/設計書/部品設計/...#`）。部品を使わない要素は書かない。 | `dev/設計書/部品設計/計画画面/状態のバッジ.html#` |
      | elements[].args | 部品へ渡す引数 | array | - | - | - | 部品設計の引数へ渡す値。`component` を持つ要素だけが持ち、部品設計の必須の引数を全て並べる。 | - |
      | elements[].args[].name | 引数 | string | 必須 | - | - | 部品設計の `args` の `name`。 | `status` |
      | elements[].args[].value | 渡す値 | string | 必須 | - | - | 固定の値か取得元（`{インターフェース定義の論理名}.{フィールドのパス}`）。 | ``計画画面.行の材料[].status`` |
      | elements[].slots | スロットに差し込む中身 | array | - | - | - | 部品設計のスロットへ差し込む要素か部品。`component` を持つ要素だけが持つ。 | - |
      | elements[].slots[].name | スロット | string | 必須 | - | - | 部品設計の `slots` の `name`。 | `default` |
      | elements[].slots[].value | 差し込む中身 | string | 必須 | - | - | 差し込む要素の名前か、部品の部品設計。 | `行の番号` |
      | elements[].position | 位置 | string | - | - | - | `>` で区切った入れ子のパス（例 `削除確認ダイアログ > フッター`）。 | - |
      | elements[].description | 説明 | string | 必須 | - | - | - | - |
      | elements[].label | 表示文言 | string | - | - | - | 画面に固定で出る文字列。 | - |
      | elements[].placeholder | プレースホルダ | string | - | - | - | - | - |
      | elements[].io | 入出力区分 | string | - | 入力 / 表示 / 入出力 | - | - | - |
      | elements[].type | 型 | string | - | - | - | 値を持つ要素の型（文字列 / 数値 / 日付 / 真偽値 等）。 | - |
      | elements[].visible_when | 表示条件 | string | - | - | - | `常時` か出し分けの条件。 | - |
      | elements[].enabled_when | 活性条件 | string | - | - | - | 表示はされるが操作できない条件。 | - |
      | elements[].required | 必須 | boolean | - | - | - | - | - |
      | elements[].required_label | 要否の表示 | string | - | - | - | `※必須` / `※任意` の出し方。 | - |
      | elements[].constraints | 制限 | string | - | - | - | 入力の上限・許容値・形式。 | - |
      | elements[].min_length | 最小長 | integer | - | - | - | - | - |
      | elements[].max_length | 最大長 | integer | - | - | - | - | - |
      | elements[].range | 値の範囲・刻み | object | - | - | - | - | - |
      | elements[].range.min | 最小 | string | - | - | - | - | - |
      | elements[].range.max | 最大 | string | - | - | - | - | - |
      | elements[].range.step | 刻み | string | - | - | - | - | - |
      | elements[].pattern | 形式 | string | - | - | - | 正規表現。 | - |
      | elements[].charset | 文字種の扱い | string | - | - | - | 受け付ける文字と、制限せず変換するか。 | - |
      | elements[].width | 表示幅 | string | - | - | - | - | - |
      | elements[].display_format | 表示形式 | string | - | - | - | 日付・時刻・数値の表示の書式と、表示の例。 | - |
      | elements[].align | 文字揃え | string | - | 左 / 中央 / 右 | - | - | - |
      | elements[].tab_order | タブ順 | integer | - | - | - | - | - |
      | elements[].autofocus | 初期フォーカス | boolean | - | - | - | - | - |
      | elements[].initial_state | 初期状態 | string | - | 活性 / 非活性 / 読み取り専用 | - | - | - |
      | elements[].initial_value | 初期値 | string | - | - | - | 表示時点の値（`空` / 取得値 等）。 | - |
      | elements[].hint | 補助文 | string | - | - | - | ラベルの下に出す説明。 | - |
      | elements[].error_message | エラーの文言 | string | - | - | - | 項目ごとの誤りと修正方法。 | - |
      | elements[].autocomplete | 入力の目的 | string | - | - | - | 自動入力の種類（HTML の `autocomplete`）。 | - |
      | elements[].inputmode | 入力モード | string | - | - | - | - | - |
      | elements[].prefix | 接頭辞 | string | - | - | - | - | - |
      | elements[].suffix | 接尾辞 | string | - | - | - | - | - |
      | elements[].options | 選択肢 | string | - | - | - | 出所・並び・既定・複数選択の可否・排他入力。 | - |
      | elements[].sorting | 並べ替え・絞り込み | string | - | - | - | 表の列のとき、できるかと既定の並び。 | - |
      | elements[].input_example | 入力例 | string | - | - | - | - | - |
      | elements[].source | 取得元 | string | - | - | - | `{インターフェース定義の論理名}.{フィールドのパス}`。 | - |
      | elements[].target | 送信先 | string | - | - | - | `{インターフェース定義の論理名}.{フィールドのパス}`。変換・合成・除外は括弧書きで添える。 | - |
      | elements[].action | アクション | string | - | - | - | 画面の中で閉じる動きは日本語で書く。送信・画面遷移は `action_ref` に参照で持つ。 | - |
      | elements[].action_ref | アクションの参照 | string | - | - | pattern: ^[^#\s]*#(?:[^\s\[]\|\[[^\]]*\])*$ | 送信を伴う動きはインターフェース定義、画面遷移は遷移先の画面設計。 | `dev/設計書/インターフェース定義/バックエンド/タスク作成.py#flows[正常系]` |
      | elements[].refs | 関連 | array | - | - | - | - | - |
      | elements[].reason | 理由 | string | - | - | - | そうしている理由。読み手の判断が変わるものだけを書く。 | - |
      | elements[].status | 状態 | string | - | planned / implemented / deprecated / removed | - | 項目の状態。`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）。書かなければ実装済みとして扱う。 | - |
      | elements[].visibility | 公開 | string | - | user / developer | - | 公開の範囲。`user`（ユーザー向け）/ `developer`（開発者向け）。<br>書かなければ親の値を引き継ぎ、最上位の既定は `developer`。 | - |
      | elements[].implementation | 実装 | string | - | - | pattern: ^[^#\s]+(#\S+)?$ | 実装の場所。リポジトリの直下からのファイルのパスに、`#` とシンボルの名前を続けてよい。 | `src/app/features/profile/service.py#update_profile` |
      | elements[].introduced | 導入 | object | - | - | - | 入ったバージョンと PR。 | - |
      | elements[].introduced.version | バージョン | string | - | - | - | 入ったバージョンのタグ（例 `v0.3.0`）。 | - |
      | elements[].introduced.pr | PR | integer | - | - | - | 入れた PR の番号。 | - |
      | elements[].aliases | 別名 | array | - | - | - | 検索で当てたい言い換え。 | - |
      | elements[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |
      | input_checks | 入力チェック | array | - | - | - | 1 要素 = 1 ケースの入力チェック。無い画面は持たない。 | - |
      | input_checks[].element | 要素 | string | 必須 | - | - | `elements` の要素の名前。 | - |
      | input_checks[].violation | 違反の条件 | string | 必須 | - | - | 1 要素に 1 つの違反。 | - |
      | input_checks[].trigger | 検証の契機 | string | 必須 | - | - | 入力のたび / フォーカスが外れたとき / 送信ボタンのクリック 等。 | - |
      | input_checks[].message | エラー文言 | string | 必須 | - | - | 画面に出る文字列そのまま。 | - |
      | input_checks[].position | 表示位置 | string | 必須 | - | - | - | - |
      | refs | 関連 | array | - | - | - | - | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      title: タスク作成画面
      screen: app/(authenticated)/tasks/new/page.tsx
      mock: dev/mock/pages/タスク作成/12/a-plan/
      lead: タスクの新規作成フォーム画面。タスク名・優先度を入力して登録する。
      test_file: tests/integration/task/test_タスク作成画面.py
      elements:
      - name: タスク名入力欄
        kind: input
        position: フォーム本体
        description: タスク名を入力
        placeholder: '例: 企画書を作る'
        io: 入力
        type: 文字列
        visible_when: 常時
        required: true
        max_length: 100
        constraints: 100 文字以内
        initial_value: 空（編集時は取得値）
        source: タスク詳細取得.task.title
        target: タスク作成.title
      - name: 優先度選択
        kind: select
        position: フォーム本体
        description: 優先度を選択
        io: 入力
        type: 文字列
        visible_when: 常時
        options: low / medium / high（既定 medium）
        initial_value: medium
        target: タスク作成.priority
      - name: 優先度のバッジ
        kind: label
        component: dev/設計書/部品設計/共通/バッジ.html#
        args:
        - name: kind
          value: 優先度選択の値（low は `muted`、high は `danger`）
        - name: label
          value: 優先度の表示名（低 / 中 / 高）
        position: フォーム本体 > 優先度選択の右
        description: 選んだ優先度を色つきで出す
        visible_when: 常時
      - name: 保存ボタン
        kind: button
        component: dev/設計書/部品設計/共通/ボタン.html#
        position: フッター
        description: 入力内容でタスクを作成
        label: 保存
        visible_when: 常時
        enabled_when: 必須項目が入力済みで制限の違反が無いとき
        action_ref: dev/設計書/インターフェース定義/バックエンド/タスク作成.py#
      input_checks:
      - element: タスク名入力欄
        violation: 空
        trigger: 保存ボタンのクリック
        message: タスク名を入力してください
        position: タスク名入力欄の下
      - element: タスク名入力欄
        violation: 101 文字以上
        trigger: 入力のたび
        message: 100 文字以内で入力してください
        position: タスク名入力欄の下
      ```
