      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: {"kind": "data"} -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | title | 種類の名前（`データ: `・`ER 図: ` など）・フォルダの名前を前置きに付けない。 | - | - |
      | lead | 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。<br>対象そのものが変わったときだけ書き換える。 | 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。 | 仕様を冒頭リードに記載している。仕様は各項目へ分ける |
      | test_file | 規約『フォルダ構成』で対象の横に配置する React の結合テストは、対象の横のファイル（`*.test.ts`・`*.test.tsx`）を記載する。 | - | - |
      | impl_files | 複数の画面が使用する共通の部品は記載しない。<br>実装を作った・移したときに記載する。 | - | - |
      | screen_type | `list`: 項目を並べて選ぶ一覧の画面。`table`・`list`・`board`・`tree` の要素と `heading` の要素を持つ。<br>`detail`: 1 件を参照する詳細の画面。`heading` の要素を持つ。<br>`edit`: 1 件を作る・編集する画面。`heading` の要素と入力の要素を持つ。<br>`settings`: 設定を変える画面。`heading` の要素と入力の要素を持つ。<br>`shell`: ほかの画面を中に描く共通のレイアウト（ヘッダー・サイドバー・上タブ）。`nav` か `sidebar` の要素を持つ。<br>`other`: どの型にも該当しない画面。<br>一覧の画面の必須の要素（読み込み中・空の表示・ページ送り）は、規約『一覧画面』の `required-elements-01` に従って要素に並べる。 | - | - |
      | leave_guard | 未保存の入力があるまま画面を離れるときは警告する（規約『入力と文言』の `state-retention-02`）。<br>自動保存の画面は、保存に失敗した入力が残るときに警告する（規約『自動保存』の `rules-01`）。<br>`none`: 警告しない（入力を持たない画面）。<br>`unsaved`: 未保存の入力があるときに警告する。<br>`autosave_error`: 自動保存に失敗した入力が残るときに警告する。 | - | - |
      | retained_state | `shell` の画面は、上タブ（領域）ごとに最後に開いたページを記載する（規約『入力と文言』の `state-retention-01`）。 | - | - |
      | retained_state[].store | `url_path`: URL のパス。<br>`url_query`: URL の search（クエリの値）。<br>`session_storage`: sessionStorage（そのブラウザのタブの中だけ）。<br>`local_storage`: localStorage（端末ごとの好み）。<br>`cookie`: Cookie（最初の描画で要る端末ごとの好み）。<br>`router`: ルーターの機能（履歴の項目ごと）。<br>`server`: サーバー（保存ビュー 等）。<br>`memory`: 画面を開いている間だけのメモリ。<br>`none`: 保持しない。 | - | - |
      | retained_state[].key | Web Storage・Cookie のキーは、規約『入力と文言』の `storage-key-01` の書式で記載する。 | - | - |
      | retained_state[].precedence | URL に値があれば URL を優先し、sessionStorage の値を使用したら URL に `replace` で書き戻す（規約『入力と文言』の `state-retention-01`）。 | - | - |
      | retained_state[].reason | 他の設計書を指すときは説明文の中にリンクを記載せず、関連は `refs`（`related_item` の配列）に持つ。 | - | - |
      | elements | ダイアログの中の要素も並べ、位置の先頭にダイアログ名を記載する。<br>列の表示・非表示は dev-docs の画面の表の列の設定で切り替える。 | - | - |
      | elements[].name | 画面の中で一意にする。 | - | - |
      | elements[].kind | HTML の要素名（`div`・`a`・`h1`・`p`）ではなく、要素の役割で選ぶ。<br>`button`: 押すと操作を始める要素（アイコンだけのボタン・メニューの項目を含む）。<br>`link`: 押すと別の画面・場所へ移る要素。<br>`toggle`: 押すたびにオンとオフを切り替え、切り替えた時点で反映する要素（スイッチ・押した状態を持つボタン）。<br>`input`: 1 行の文字・数値・日付を入力する欄。<br>`textarea`: 複数行の文字を入力する欄。<br>`select`: 選択肢を開いて選ぶ要素（ドロップダウン・コンボボックス）。<br>`checkbox`: 項目ごとにオンとオフを選び、送信で反映する要素。<br>`radio`: 並べた選択肢から 1 つを選ぶ要素（セグメントの切り替えを含む）。<br>`tabs`: 押した見出しの中身に切り替えるタブの並び。<br>`nav`: 画面の間を移るリンクの並び（グローバルナビゲーション・パンくず）。<br>`sidebar`: 画面の端に配置し、開閉できる区画。<br>`pane`: 画面を分けた区画（ヘッダー・フッター・本文・フォーム・パネル）。<br>`splitter`: 区画の境目をドラッグして大きさを変える要素。<br>`drag_handle`: 掴んで項目を並べ替える・区画を動かす要素。<br>`disclosure`: 見出しを押して中身を開閉する区画（アコーディオン・`details`）。<br>`list`: 同じ形の項目を並べる一覧。<br>`tree`: 項目を階層で並べ、階層ごとに開閉する一覧。<br>`board`: 列ごとに項目を並べるボード。<br>`table`: 行と列で値を並べる表。<br>`table_column`: 表の 1 列。<br>`dialog`: 画面の上に重ねて開き、閉じるまで後ろを操作させない区画（モーダル・シート）。<br>`popover`: 要素に添えて開く浮いた区画（メニュー・ポップオーバー）。<br>`tooltip`: ホバー・フォーカスで出す説明。<br>`heading`: 区画の見出し。<br>`label`: 固定の文言か取得した値を出す文字（バッジ・状態の表示を含む）。<br>`image`: 画像・アイコン・図。<br>`alert`: 画面の中に出し続ける通知（エラー・警告・情報のバー）。<br>`toast`: 一時的に出て消える通知。<br>`progress`: 処理中・読み込み中の表示（進捗バー・スピナー・スケルトン）。<br>`separator`: 区切り線。<br>`shortcut`: 見た目を持たず、画面全体で受けるキー操作。 | - | - |
      | elements[].component | ID は指す設計書の最上位の `id` にする。<br>同じ設計書の中は `#{項目のパス}` だけでよい。<br>リストの項目は、その Schema の `x-key` で宣言したキーの値で `[{値}]` と指す（番号で指さない）。<br>設計書全体を指すときは `#` の後を空にする。<br>辞書のキーも `[{キー}]` で指し、`.` や空白を含むキーも 1 階層になる（`notes[main.py の補足]`）。<br>同じ `x-key` の値の要素の 2 つ目以降は `[{値}#{順番}]` と指す（`functions[main#3]`）。<br>同じ値の要素が無く末尾が `#{整数}` のときだけ、`[...]` の中の `#` を順番として扱う。<br>`[...]` の中の対応の取れた `[` `]` は値の一部として読む（`request[operations[].fields]` は `x-key` の値が `operations[].fields` の要素）。 | IF-12#flows[0] | リストの項目を番号で指している |
      | elements[].label | 見れば分かるものにラベルを付けない（規約『入力と文言』の `wording-01`）。<br>本文の区画に操作の説明文を置かない（規約『情報の階層と見た目』の `information-hierarchy-01`）。<br>単語・操作の単語・状態名は、規約『入力と文言』の `wording-term-format-02` に従う。<br>アイコンだけのボタン（`label_display` が `icon_only`）は、`label` を記載せず `accessible_name` と `tooltip` に記載する。 | - | - |
      | elements[].placeholder | `kind` が `input`・`textarea`・`select` の要素だけに記載する。 | - | - |
      | elements[].io | `input`: 入力を受けるだけで、取得した値を出さない。<br>`output`: 値を表示するだけで、入力を受けない。<br>`input_output`: 取得した値を出し、入力で変えられる。 | - | - |
      | elements[].required | `kind` が `input`・`textarea`・`select`・`checkbox`・`radio`・`toggle` の要素だけに記載する。 | - | - |
      | elements[].condition | 条件があるキーだけに記載する。<br>必須（ER 図は NOT NULL）は、条件に該当するときの扱いを記載する。<br>条件に該当しないときは、キーを持たない（ER 図は NULL にする）。 | - | - |
      | elements[].required_label | `kind` が `input`・`textarea`・`select`・`checkbox`・`radio`・`toggle` の要素だけに記載する。 | - | - |
      | elements[].constraints | `kind` が `input`・`textarea`・`select`・`checkbox`・`radio`・`toggle` の要素だけに記載する。 | - | - |
      | elements[].min_length | `kind` が `input`・`textarea` の要素だけに記載する。 | - | - |
      | elements[].max_length | `kind` が `input`・`textarea` の要素だけに記載する。 | - | - |
      | elements[].range | `kind` が `input` の要素だけに記載する。 | - | - |
      | elements[].pattern | `kind` が `input`・`textarea` の要素だけに記載する。 | - | - |
      | elements[].charset | `kind` が `input`・`textarea` の要素だけに記載する。 | - | - |
      | elements[].overflow | 長さが変わる値を表示する要素に記載し、固定の文言だけの要素には記載しない。<br>入力を持たない値を表示する要素（`io` が `output` で `source` を持つ要素）には必ず記載する。<br>固定の領域に配置する要素（`fixed_area` が `true`）で、`source` を持つか `io` が `input`・`input_output` の要素には必ず記載する。<br>`type` は、規約『レイアウト』の `pitfall-text-code-05`（長さが変わる値を折り返すか省略するかの既定）に従って選ぶ。 | - | - |
      | elements[].overflow.type | `truncate` にする要素は、省略した値の全文を出す方法を `description` に記載する。 | - | - |
      | elements[].overflow.max_length | 入力の最大長（`max_length`）を持たず、`unbounded` が `true` でない要素には記載する。<br>入力を受ける要素で、入力の最大長（`max_length`）と同じ値なら省く。 | - | - |
      | elements[].overflow.unbounded | `true` の要素は、表示する最大の長さ（`max_length`）を記載しない。<br>テストで入れる値の文字数は、同じ画面設計の要素の表示する最大の長さ（`overflow.max_length`、無ければ `max_length`）のうち最大の値の 3 倍にする。<br>同じ画面設計に最大の長さを持つ要素が無いときは、テストで入れる値の文字数を `description` に記載する。 | - | - |
      | elements[].count_limit | 並べる値の件数が変わる要素に記載し、件数が固定の要素には記載しない。 | - | - |
      | elements[].count_limit.type | `summarize` にする要素は、まとめた値の全てを出す方法を `description` に記載する。 | - | - |
      | elements[].align | `kind` が `table_column` の要素には必ず記載する。 | - | - |
      | elements[].initial_state | `enabled`: 操作できる。<br>`disabled`: 表示するが操作できない。<br>`readonly`: 値を出し、選択・コピーはできるが変えられない。 | - | - |
      | elements[].pending_state | 書き込みを始める要素と、応答を待つ間に操作を止める要素に記載する。<br>`kind` が `label`・`heading`・`image`・`tooltip`・`progress`・`separator`・`shortcut` の要素には記載しない。 | - | - |
      | elements[].icon | 同じ操作には画面をまたいで同じアイコンを使用する（規約『情報の階層と見た目』の `visual-consistency-01`）。<br>標準の操作（閉じる・コピー・設定へ移る 等）は既定でアイコンを付ける（規約『ボタンのラベル』の `icon-01`）。<br>`kind` が `input`・`textarea`・`select` の要素には記載しない。 | - | - |
      | elements[].label_display | 規約『ボタンのラベル』の `icon-or-text-01` で選ぶ。<br>`icon_only`: アイコンだけを出す。`accessible_name`・`tooltip`・`icon` を記載する。<br>`icon_and_text`: アイコンと文字を出す。`icon` を記載する。<br>`text_only`: 文字だけを出す。<br>`kind` が `button` の要素には必ず記載し、`button`・`link`・`toggle` 以外の要素には記載しない。 | - | - |
      | elements[].accessible_name | `label_display` が `icon_only` の要素には必ず記載する（規約『操作とアクセシビリティ』の `operation-accessibility-01`）。 | - | - |
      | elements[].tooltip | `label_display` が `icon_only` の要素には必ず記載する（規約『ボタンのラベル』の `tooltip-01`）。<br>ショートカットを持つ要素は、文言の後ろにキーを出す（規約『キーボード操作』の `discoverability-01`）。 | - | - |
      | elements[].narrow | 判定フローチャート『狭い幅の短い文言の対処』と、規約『レイアウト』の `responsive-01`〜`responsive-03` で選ぶ。<br>狭い幅でも出し方を変えない要素は記載しない。 | - | - |
      | elements[].narrow.action | `hidden`: 出さない。<br>`icon_only`: アイコンだけにする。<br>`short_label`: 短い別の文言にする。<br>`into_menu`: メニュー（その他の操作）へしまう。<br>`stack`: 縦に並べる。<br>`horizontal_scroll`: 横にスクロールさせる。<br>`collapse_column`: 表の列を畳み、行の詳細に出す。<br>`drawer`: ドロワーにする。 | - | - |
      | elements[].disabled_reason | `kind` が `button` で `enabled_when` を持つ要素には必ず記載する（規約『入力と文言』の `input-submit-01`）。<br>`enabled_when` を持たない要素には記載しない。 | - | - |
      | elements[].confirm | 規約『画面設計の原則』の `screen-design-principles-01` で選ぶ。<br>`dialog`: 操作の前に確認のダイアログを出す。<br>`undo`: 操作の後に取り消しの手段を出す。<br>`none`: 確認も取り消しもしない（元に戻せる操作）。<br>`kind` が `button` の要素には必ず記載し、`button`・`link`・`toggle`・`drag_handle` 以外の要素には記載しない。 | - | - |
      | elements[].feedback | 結果はアイコンの変化を先に検討する（規約『画面設計の原則』の `screen-design-principles-01`）。<br>失敗の伝え方は、規約『入力と文言』の `error-notification-01` に従う。 | - | - |
      | elements[].toggle_state | 状態でラベルを替えず、属性で状態を伝える（規約『操作とアクセシビリティ』の `operation-accessibility-01`）。<br>`pressed`: 押した状態を持つボタン。<br>`expanded`: 区画を開閉するボタン。<br>`checked`: スイッチ。<br>`kind` が `toggle` の要素には必ず記載し、`toggle`・`button` 以外の要素には記載しない。 | - | - |
      | elements[].live | `polite`: 読み上げ中の内容の後に読み上げる。<br>`assertive`: 割り込んで読み上げる（失敗の通知だけ）。<br>`kind` が `alert`・`toast`・`label`・`progress` の要素だけに記載する。 | - | - |
      | elements[].history | 絞り込みの確定とオーバーレイを開く操作は `push`、入力中の値の反映は `replace` にする（規約『URL の状態』の `write-02`・`write-03`）。<br>URL を変えない要素は記載しない。 | - | - |
      | elements[].resets | 絞り込み・並べ替えを変えるときは、ページを 1 に戻す（規約『URL の状態』の `write-03`）。 | - | - |
      | elements[].shortcut | キーの選び方と範囲は、規約『キーボード操作』の `shortcut-design-01`〜`shortcut-design-05` と `shortcut-assignment-01` に従う。<br>ボタン・メニューの項目にキーを出す（規約『キーボード操作』の `discoverability-01`）。<br>`kind` が `shortcut` の要素には必ず記載する。 | - | - |
      | elements[].shortcut.scope | `app`: アプリ全体。<br>`screen`: この画面を開いている間。<br>`pane`: その区画にフォーカスがある間。<br>`dialog`: そのダイアログを開いている間。 | - | - |
      | elements[].pane | スプリッターと開閉の決まりは、規約『レイアウト』の `splitter-01` に従う。<br>幅と開閉の保持は、要素の `retained_state` に記載する。<br>`kind` が `sidebar` の要素には必ず記載し、`sidebar`・`pane` 以外の要素には記載しない。 | - | - |
      | elements[].pane.width | 最小はペインの主な操作が収まる幅、最大はメインに主な操作が残る幅にする（規約『レイアウト』の `splitter-01`）。 | - | - |
      | elements[].pane.narrow | 狭い幅の出し方は、規約『モバイル対応ルール』の `shell-responsibility-02` と規約『画面の分け方』の `structure-transition-01` で選ぶ。<br>`drawer`: ボタンで開くドロワーにする。<br>`bottom_sheet`: 下から開くシートにする。<br>`stack_below`: メインの下に並べる。<br>`separate_screen`: 別の画面にする。<br>`hidden`: 出さない。 | - | - |
      | elements[].pane.focus_on_open | フォーカスの移し方は、規約『キーボード操作』の `focus-management-02`・`focus-management-04` に従う。 | - | - |
      | elements[].tabs | タブの決まりは、規約『画面の分け方』の `tab-01` と規約『URL の状態』の `tab-01` に従う。<br>切り替えで枠の大きさを変えない（規約『表示の安定』の `display-stability-01`）。<br>選んだタブの保持は、要素の `retained_state` に記載する。<br>`kind` が `tabs` の要素には必ず記載し、ほかの要素には記載しない。 | - | - |
      | elements[].tabs.mode | 画面の中の切り替えと画面の移動を 1 つのタブの並びに混ぜない（規約『画面の分け方』の `tab-01`）。<br>`in_screen`: 画面の中で中身を切り替える。<br>`navigation`: 押すと別の画面へ移る。 | - | - |
      | elements[].tabs.activation | キー操作は、規約『キーボード操作』の `composite-widget-01` に従う。<br>`automatic`: フォーカスを移すと選ぶ。<br>`manual`: Enter・Space で選ぶ。 | - | - |
      | elements[].tabs.empty_behavior | 中身が無くてもタブを隠さず、空の表示を出す（規約『画面の分け方』の `tab-01`）。 | - | - |
      | elements[].table | 表の機能の決まりは、規約『業務画面のUI要素』の `data-display-01`・`action-01` に従う。<br>列ごとの並べ替え・絞り込み・固定・非表示は、`table_column` の要素に記載する。<br>`kind` が `table` の要素には必ず記載し、ほかの要素には記載しない。 | - | - |
      | elements[].table.row_link | ID は指す設計書の最上位の `id` にする。<br>同じ設計書の中は `#{項目のパス}` だけでよい。<br>リストの項目は、その Schema の `x-key` で宣言したキーの値で `[{値}]` と指す（番号で指さない）。<br>設計書全体を指すときは `#` の後を空にする。<br>辞書のキーも `[{キー}]` で指し、`.` や空白を含むキーも 1 階層になる（`notes[main.py の補足]`）。<br>同じ `x-key` の値の要素の 2 つ目以降は `[{値}#{順番}]` と指す（`functions[main#3]`）。<br>同じ値の要素が無く末尾が `#{整数}` のときだけ、`[...]` の中の `#` を順番として扱う。<br>`[...]` の中の対応の取れた `[` `]` は値の一部として読む（`request[operations[].fields]` は `x-key` の値が `operations[].fields` の要素）。 | IF-12#flows[0] | リストの項目を番号で指している |
      | elements[].table.selection | `none`: 選ばない。<br>`single`: 1 行だけ選ぶ。<br>`multiple`: まとめて選ぶ。`bulk_actions` を記載する。 | - | - |
      | elements[].table.grid_navigation | キー操作は、規約『キーボード操作』の `composite-widget-01` に従う。 | - | - |
      | elements[].sortable | `kind` が `table_column` の要素には必ず記載し、ほかの要素には記載しない。 | - | - |
      | elements[].filterable | `kind` が `table_column` の要素だけに記載する。 | - | - |
      | elements[].pinnable | `kind` が `table_column` の要素だけに記載する。 | - | - |
      | elements[].hideable | `kind` が `table_column` の要素だけに記載する。 | - | - |
      | elements[].close | 規約『表示の安定』の `close-behavior-01` の表で選ぶ。<br>Esc は一番上の層だけを閉じる（規約『画面の分け方』の `modal-01`）。<br>`kind` が `dialog`・`popover` の要素には必ず記載し、ほかの要素には記載しない。 | - | - |
      | elements[].close.escape | `close`: 閉じる。<br>`confirm`: 確認を挟んでから閉じる（入力を持つダイアログ）。<br>`none`: 閉じない。 | - | - |
      | elements[].modal | `kind` が `dialog`・`popover` の要素だけに記載する。 | - | - |
      | elements[].initial_focus | 規約『キーボード操作』の `focus-management-02` に従う。<br>`kind` が `dialog`・`popover` の要素には必ず記載し、ほかの要素には記載しない。 | - | - |
      | elements[].return_focus | 規約『キーボード操作』の `focus-management-02` に従い、既定は開いた要素にする。<br>`kind` が `dialog`・`popover` の要素には必ず記載し、ほかの要素には記載しない。 | - | - |
      | elements[].retained_state | 規約『入力と文言』の `retention-design-01` の要素（入力・選択・タブ・開閉するもの・スクロール領域）には必ず記載する。<br>`kind` が `label`・`heading`・`image`・`tooltip`・`progress`・`separator`・`toast`・`shortcut`・`link`・`table_column` の要素には記載しない。 | - | - |
      | elements[].retained_state[].store | `url_path`: URL のパス。<br>`url_query`: URL の search（クエリの値）。<br>`session_storage`: sessionStorage（そのブラウザのタブの中だけ）。<br>`local_storage`: localStorage（端末ごとの好み）。<br>`cookie`: Cookie（最初の描画で要る端末ごとの好み）。<br>`router`: ルーターの機能（履歴の項目ごと）。<br>`server`: サーバー（保存ビュー 等）。<br>`memory`: 画面を開いている間だけのメモリ。<br>`none`: 保持しない。 | - | - |
      | elements[].retained_state[].key | Web Storage・Cookie のキーは、規約『入力と文言』の `storage-key-01` の書式で記載する。 | - | - |
      | elements[].retained_state[].precedence | URL に値があれば URL を優先し、sessionStorage の値を使用したら URL に `replace` で書き戻す（規約『入力と文言』の `state-retention-01`）。 | - | - |
      | elements[].retained_state[].reason | 他の設計書を指すときは説明文の中にリンクを記載せず、関連は `refs`（`related_item` の配列）に持つ。 | - | - |
      | elements[].hint | `kind` が `input`・`textarea`・`select`・`checkbox`・`radio`・`toggle` の要素だけに記載する。<br>入力の形式・範囲が、ラベルとプレースホルダで伝わらないときだけ記載する（規約『入力と文言』の `wording-01`）。 | - | - |
      | elements[].autocomplete | `kind` が `input`・`textarea`・`select` の要素だけに記載する。 | - | - |
      | elements[].inputmode | `kind` が `input`・`textarea` の要素だけに記載する。 | - | - |
      | elements[].prefix | `kind` が `input`・`textarea` の要素だけに記載する。 | - | - |
      | elements[].suffix | `kind` が `input`・`textarea` の要素だけに記載する。 | - | - |
      | elements[].options | `kind` が `select`・`radio` の要素には必ず記載し、`checkbox` の要素には選択肢を並べるときに記載する。 | - | - |
      | elements[].input_example | `kind` が `input`・`textarea`・`select`・`checkbox`・`radio`・`toggle` の要素だけに記載する。 | - | - |
      | elements[].action_ref | ID は指す設計書の最上位の `id` にする。<br>同じ設計書の中は `#{項目のパス}` だけでよい。<br>リストの項目は、その Schema の `x-key` で宣言したキーの値で `[{値}]` と指す（番号で指さない）。<br>設計書全体を指すときは `#` の後を空にする。<br>辞書のキーも `[{キー}]` で指し、`.` や空白を含むキーも 1 階層になる（`notes[main.py の補足]`）。<br>同じ `x-key` の値の要素の 2 つ目以降は `[{値}#{順番}]` と指す（`functions[main#3]`）。<br>同じ値の要素が無く末尾が `#{整数}` のときだけ、`[...]` の中の `#` を順番として扱う。<br>`[...]` の中の対応の取れた `[` `]` は値の一部として読む（`request[operations[].fields]` は `x-key` の値が `operations[].fields` の要素）。 | IF-12#flows[0] | リストの項目を番号で指している |
      | elements[].refs[].item | 記載方法は参照（`ref`）の `#` より後と同じにする。 | - | - |
      | elements[].refs[].type | 片側だけに記載し、逆向きはツールで出す。`change_together` だけは両側に記載する。<br>`type` と記載する側は、規約『ドキュメント管理』の「関連」と判定フローチャート『関連の張り方』で決める。 | - | - |
      | elements[].refs[].when | `when` を記載できない関連は張らない。 | - | - |
      | elements[].reason | 他の設計書を指すときは説明文の中にリンクを記載せず、関連は `refs`（`related_item` の配列）に持つ。 | - | - |
      | elements[].notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |
      | refs[].item | 記載方法は参照（`ref`）の `#` より後と同じにする。 | - | - |
      | refs[].type | 片側だけに記載し、逆向きはツールで出す。`change_together` だけは両側に記載する。<br>`type` と記載する側は、規約『ドキュメント管理』の「関連」と判定フローチャート『関連の張り方』で決める。 | - | - |
      | refs[].when | `when` を記載できない関連は張らない。 | - | - |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: SCR-1
      title: タスク作成画面
      screen: app/(authenticated)/tasks/new/page.tsx
      mock: docs/mock/pages/タスク作成/12/a-plan/
      lead: タスクの新規作成フォーム画面。タスク名・優先度を入力して登録する。
      test_file: tests/integration/task/test_タスク作成画面.py
      impl_files:
      - app/(authenticated)/tasks/new/_components/task-create-form.tsx
      screen_type: edit
      leave_guard: unsaved
      elements:
      - name: 画面の見出し
        kind: heading
        position: フォーム本体 > 先頭
        description: 画面名を出す
        label: タスクの作成
        visible_when: 常時
      - name: プロジェクト名
        kind: label
        position: フォーム本体 > 見出しの下
        description: タスクを作るプロジェクトの名前を出す。1 行に収まらないときは省略し、全文をツールチップに出す
        io: output
        type: 文字列
        visible_when: 常時
        overflow:
          type: truncate
          max_length: 50
        source: プロジェクト詳細取得.project.name
      - name: プロジェクトのタグ
        kind: label
        position: フォーム本体 > プロジェクト名の下
        description: プロジェクトに付いたタグを横に並べる。1 件のタグが 20 文字を超えたら省略し、全文をツールチップに出す。上限を超えた分は「+3」にまとめ、押すと全てのタグをポップオーバーに出す
        io: output
        type: 文字列の配列
        visible_when: タグが 1 件以上あるとき
        overflow:
          type: truncate
          max_length: 20
        count_limit:
          max_count: 5
          type: summarize
        source: プロジェクト詳細取得.project.tags[]
      - name: プロジェクトの説明
        kind: label
        position: サイドバー > プロジェクトの情報
        fixed_area: true
        description: 他の人が記載したプロジェクトの説明を出す。3 行を超えたら省略し、押すと全文をダイアログに出す
        io: output
        type: 文字列
        visible_when: 説明があるとき
        overflow:
          type: truncate
          unbounded: true
        source: プロジェクト詳細取得.project.description
      - name: タスク名入力欄
        kind: input
        position: フォーム本体
        description: タスク名を入力
        placeholder: '例: 企画書を作る'
        io: input
        type: 文字列
        visible_when: 常時
        required: true
        max_length: 100
        constraints: 100 文字以内
        initial_value: 空（編集時は取得値）
        retained_state:
        - what: 入力途中の値
          store: session_storage
          key: todo:v1:task-create:title
          save_on: 入力のたび
          restore_on: 同じタブで画面を開き直したとき
          reset_when: 保存したとき
        source: タスク詳細取得.task.title
        target: タスク作成.title
      - name: 優先度選択
        kind: select
        position: フォーム本体
        description: 優先度を選択
        io: input
        type: 文字列
        visible_when: 常時
        options: low / medium / high（既定 medium）
        initial_value: medium
        retained_state:
        - what: 選んだ優先度
          store: none
          reason: 既定の medium から選び直す手間が小さく、入力途中の値と一緒に戻すほどではない
        target: タスク作成.priority
      - name: 優先度のバッジ
        kind: label
        component: CMP-7#
        args:
        - name: kind
          value: 優先度選択の値（low は `muted`、high は `danger`）
        - name: label
          value: 優先度の表示名（低 / 中 / 高）
        position: フォーム本体 > 優先度選択の右
        description: 選んだ優先度を色つきで出す
        visible_when: 常時
      - name: 保存ボタン
        kind: button
        component: CMP-3#
        position: フッター
        description: 入力内容でタスクを作成
        label: 保存
        label_display: text_only
        narrow:
          action: stack
        visible_when: 常時
        enabled_when: 必須項目が入力済みで制限の違反が無いとき
        disabled_reason: タスク名を入力すると保存できます（ボタンの下に出す）
        confirm: none
        feedback:
          success: タスクの詳細画面へ移り、「タスクを作成しました」の通知を出す
          failure: フォームの上にエラーのバーを出し、入力は残す
        shortcut:
          key: Control+S
          scope: screen
        pending_state: 非活性にし、ボタンの文言の左に回る表示を出す（ボタンの幅は変えない）
        action_ref: IF-1#
      input_checks:
      - element: タスク名入力欄
        violation: 空
        trigger: 保存ボタンのクリック
        message: タスク名を入力してください
        position: タスク名入力欄の下
      - element: タスク名入力欄
        violation: 101 文字以上
        trigger: 入力のたび
        message: 100 文字以内で入力してください
        position: タスク名入力欄の下
      ```
