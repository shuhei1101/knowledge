# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-screen-design
kind: template
name: "テンプレート: 画面設計"
description: 1 画面の要素の仕様と入力チェックを記載する画面設計の書式を定め、画面設計を作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:テンプレート
  - name: topic:仕様
  - name: topic:画面
    main: true
  - name: topic:要素
  - name: action:入力
  - name: action:検査
  - name: action:設計
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      1 画面の要素の仕様（表示条件・活性条件・制限・初期値・取得元・送信先・アクション）と入力チェック。
      1 ファイル = 1 画面。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: {"kind": "data"} -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>project-index の配信で、文書の公開範囲のメタデータにする。 | - |
      | tags | タグ | array | - | - | - | 設計書を検索で絞り込むタグで、`name` にタグの名前（`action:`・`topic:`・`tool:` などで始める）、最も分量の多い主題 1 つに `main: true` を記載する。<br>付け方は knowledge の規約『文書のタグと description の記載』に従う。 | project-index の検索で、文書をタグで絞り込む。 | `[{main: true, name: topic:タグ}, name: action:記載]` |
      | tags[].name | タグの名前 | string | 必須 | - | minLength: `1` | タグの名前。`action:`・`topic:`・`tool:` などで始める。 | 検索で、文書をタグで絞り込む値にする。 | - |
      | tags[].main | 主題 | boolean | - | - | - | 最も分量の多い主題のタグだけ `true` にする。 | 検索で、文書の主題のタグとして扱う。 | - |
      | aliases | 別名 | array | - | - | - | 検索でヒットさせたい言い換え。 | project-index の検索で、文書を名前と同じように検索できる言い換えにする。 | - |
      | title | タイトル | string | 必須 | - | - | 日本語の画面名。ファイル名に合わせる。 | 生成で、ページの見出しにする。<br>project-index の検索で、文書の名前にする。 | - |
      | screen | 画面 | string | - | - | - | 画面の実装ファイルのパス。 | 実装で、画面を作るファイルにする。<br>結合テストで、開く画面にする。 | - |
      | mock | モック | string | - | - | - | 採用したモックの配置場所。 | 実装で、合意したモックの見た目に合わせる。<br>レビューで、実装した画面とモックを照合する。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>project-index の検索で、文書の概要文にする。 | - |
      | test_file | 対応テストファイル | string | - | - | pattern: `^(?:tests/.+\|.+\.test\.tsx?)$` | 対応する結合テストのファイル（規約『V字モデル』）。 | テストで、画面を開いて確認する結合テストを作るファイルにする。<br>検査で、テストのファイルがあるかを確認する。 | `tests/integration/task/test_タスク作成画面.py` / `frontend/src/features/plan/plan-list/plan-list-screen.test.tsx` |
      | impl_files | 実装のファイル | array | - | - | - | `screen` のほかに、この画面だけが使用する実装のファイル（画面の中の部品・スクリプト・スタイル）の、リポジトリの直下からのパス。 | 実行で、判定フローチャート『結合テストの実行範囲』の Q5 で、変更したファイルが 1 つの画面の実装のファイルかを決める。<br>レビューで、実行範囲の表の R4 の行が `screen` とこの一覧のとおりかを確認する。 | `[app/(authenticated)/tasks/new/_components/task-create-form.tsx]` |
      | screen_type | 画面の型 | string | 必須 | `list` / `detail` / `edit` / `settings` / `shell` / `other` | - | 画面の型。型ごとに、持つべき要素の種類を検査で求める。 | 実装で、規約『レイアウト』の `screen-template-01` の画面型の構成にする。<br>検査で、型ごとに要る要素の `kind` があるかを確認する。 | - |
      | leave_guard | 離脱の警告 | string | 必須 | `none` / `unsaved` / `autosave_error` | - | 画面を離れるときに警告する条件。 | 実装で、画面を離れる操作（画面の移動・タブを閉じる・再読み込み）の前に警告する条件にする。<br>テストで、警告が出るケースと出ないケースにする。 | - |
      | retained_state | 保持する状態 | array | - | - | minItems: `1` | 画面全体で保持する状態（上タブ（領域）ごとに最後に開いたページ・ページ全体のスクロール位置 等）。要素ごとの状態は要素の `retained_state` に記載する。 | 実装で、状態を保存する場所・キーと、保存して戻す契機にする。<br>テストで、移って戻ったとき・再読み込みしたときに状態が戻るケースにする。<br>レビューで、規約『入力と文言』の `retention-design-01` の要素に保持の記載が漏れていないかを確認する。 | - |
      | retained_state[].what | 保持するもの | string | 必須 | - | - | 保持する状態（入力した値・選んだタブ・開閉・幅・スクロール位置・領域で最後に開いたページ 等）。 | 実装で、保存して戻す値にする。 | `スクロール位置` / `領域で最後に開いたページ` |
      | retained_state[].store | 保持先 | string | 必須 | `url_path` / `url_query` / `session_storage` / `local_storage` / `cookie` / `router` / `server` / `memory` / `none` | - | 状態を保存する場所。 | 実装で、状態を保存する場所（URL・Web Storage・Cookie・ルーター・サーバー・メモリ）にする。 | - |
      | retained_state[].key | キー | string | - | - | - | Web Storage・Cookie のキーか、URL の search の名前。 | 実装で、保存と読み込みに使用するキーにする。<br>レビューで、ほかの領域・アプリのキーと重ならないかを確認する。 | `aituber:v1:admin:sidebar:{area}:scroll` / `q` |
      | retained_state[].save_on | 保存する契機 | string | - | - | - | 状態を保存する操作・タイミング。 | 実装で、状態を保存する契機にする。 | `スクロールが止まったとき` |
      | retained_state[].restore_on | 戻す契機 | string | - | - | - | 保存した状態を戻す操作・タイミング。 | 実装で、保存した状態を戻す契機にする。<br>テストで、状態が戻ることを確認する操作にする。 | `上タブを移って戻ったときと再読み込みしたとき` |
      | retained_state[].precedence | 優先する値 | string | - | - | - | 保持先が複数あるときに、どれを優先し、使用した値をどこへ書き戻すか。 | 実装で、値を参照する順と書き戻す先にする。 | `` URL の値を優先し、無ければ sessionStorage の値を使用して URL に `replace` で書き戻す `` |
      | retained_state[].reset_when | 初期に戻す条件 | string | - | - | - | 保存した状態を捨てて初期の状態に戻す条件。 | 実装で、保存した状態を捨てる条件にする。<br>テストで、初期に戻るケースにする。 | `一覧の絞り込みを変えたとき` |
      | retained_state[].reason | 理由 | string | - | - | - | そうしている理由。参照する側の判断が変わるものだけを記載する。 | レビューで、理由が今も成り立つかと、同じ判断を変える変更が無いかを確認する。 | - |
      | elements | 要素一覧 | array | 必須 | - | minItems: `1` | 画面の要素 1 つ = 1 要素。 | 実装で、画面の要素にする。<br>生成で、要素一覧の表にする。 | - |
      | elements[].name | 要素 | string | 必須 | - | - | ボタン・入力欄・ラベル・テーブル等の日本語の論理名。 | 生成で、表の行の名前にする。<br>設計で、入力チェックから要素を指す。 | - |
      | elements[].id | 項目 ID | string | - | - | - | 画面の中で一意な識別子。テスト・実装から参照する。 | 実装で、要素の `id`・`data-testid` にする。<br>テストで、要素を探すセレクタにする。 | - |
      | elements[].kind | 種類 | string | 必須 | `button` / `link` / `toggle` / `input` / `textarea` / `select` / `checkbox` / `radio` / `tabs` / `nav` / `sidebar` / `pane` / `splitter` / `drag_handle` / `disclosure` / `list` / `tree` / `board` / `table` / `table_column` / `dialog` / `popover` / `tooltip` / `heading` / `label` / `image` / `alert` / `toast` / `progress` / `separator` / `shortcut` | - | 要素の役割の種類。種類ごとに、記載する欄と記載しない欄を検査で分ける。 | 実装で、要素の HTML の要素と部品を決める。<br>検査で、種類ごとに必須の欄と記載しない欄を決める。 | - |
      | elements[].component | 部品 | string | - | - | pattern: `^(?:[A-Z]+-\d+(?:-\d+)?)?#(?:[^\s\[\]]\|\[(?:[^\[\]]\|\[[^\[\]]*\])*\])*$` | 使用する部品の部品設計（部品設計の `{ID}#`）。 | 実装で、要素に使用する部品を決める。 | `CMP-5#` / `CMP-6#` |
      | elements[].args | 部品へ指定する引数 | array | - | - | - | 部品設計の引数へ指定する値。`component` を持つ要素だけが持ち、部品設計の必須の引数を全て並べる。 | 実装で、部品へ指定する値にする。<br>レビューで、部品の必須の引数が全て指定されているかを確認する。 | - |
      | elements[].args[].name | 引数 | string | 必須 | - | - | 部品設計の `args` の `name`。 | 実装で、指定する部品の引数にする。 | `status` / `filterable` |
      | elements[].args[].value | 指定する値 | string | 必須 | - | - | 固定の値か取得元（`{インターフェース定義の論理名}.{フィールドのパス}`）。 | 実装で、引数に指定する固定の値か、値を取るインターフェース定義のフィールドにする。 | `` `計画画面.行の材料[].status` `` / `` 絞り込みを持つ列なら `true` `` |
      | elements[].slots | スロットに差し込む中身 | array | - | - | - | 部品設計のスロットへ差し込む要素か部品。`component` を持つ要素だけが持つ。 | 実装で、部品のスロットへ差し込む中身にする。 | - |
      | elements[].slots[].name | スロット | string | 必須 | - | - | 部品設計の `slots` の `name`。 | 実装で、差し込むスロットにする。 | `default` / `actions` |
      | elements[].slots[].value | 差し込む中身 | string | 必須 | - | - | 差し込む要素の名前か、部品の部品設計。 | 実装で、差し込む要素か部品にする。 | `行の番号` / `CMP-3#` |
      | elements[].position | 位置 | string | - | - | - | `>` で区切った入れ子のパス。 | 実装で、要素を配置する入れ子の場所にする。 | `削除確認ダイアログ > フッター` |
      | elements[].fixed_area | 固定の領域 | boolean | - | - | - | 幅か高さが固定の領域（ヘッダー・フッター・サイドバー・ツールバー・表のセル 等）に配置する要素なら `true`。 | 実装で、値が長くても領域の大きさを変えない折り返し・省略・横スクロールにする。<br>検査で、`overflow` を必須にする要素を決める。 | - |
      | elements[].description | 説明 | string | 必須 | - | - | 要素の役割（何を表示し、何を受け付けるか）。 | 実装で、要素に表示する値と受け付ける入力を決める。 | - |
      | elements[].label | 表示文言 | string | - | - | - | 画面に固定で出る文字列。 | 実装で、画面に出す文字列にする。 | - |
      | elements[].placeholder | プレースホルダ | string | - | - | - | 入力欄が空のときに出す文言。 | 実装で、入力欄のプレースホルダにする。 | - |
      | elements[].io | 入出力区分 | string | - | `input` / `output` / `input_output` | - | 表示だけか、入力を受けるかの区分。 | 実装で、表示だけか、入力を受けるかを決める。 | - |
      | elements[].type | 型 | string | - | - | - | 値を持つ要素の型（文字列 / 数値 / 日付 / 真偽値 等）。 | 実装で、値の型と入力欄の種類にする。 | - |
      | elements[].visible_when | 表示条件 | string | - | - | - | `常時` か出し分けの条件。 | 実装で、要素を出す条件にする。<br>テストで、出る状態と出ない状態のケースにする。 | - |
      | elements[].enabled_when | 活性条件 | string | - | - | - | 表示はされるが操作できない条件。 | 実装で、要素を操作できる条件にする。<br>テストで、操作できない状態のケースにする。 | - |
      | elements[].required | 必須 | boolean | - | - | - | 入力が必須なら `true`。 | 実装で、入力を必須にするかを決める。 | - |
      | elements[].condition | 条件 | string | - | - | pattern: `^[^\n]+$` | ほかのキーの値でこのキーを持つかが変わるときの条件。`{キー}: {値}` か、そのキーを省略したときの `{キー} なし`。 | 実装で、条件に該当するときだけキーを持たせる検証にする。<br>レビューで、判別のキーで分かれるキーを表で一覧して確認する。 | `type: anime` / `work なし` / `styles[].type: parody` |
      | elements[].required_label | 要否の表示 | string | - | - | - | `※必須` / `※任意` の出し方。 | 実装で、必須・任意の表示にする。 | - |
      | elements[].constraints | 制限 | string | - | - | - | `min_length`・`max_length`・`range`・`pattern`・`charset` で表せない入力の制限。 | 実装で、個別のキーで表せない入力の検証にする。 | - |
      | elements[].min_length | 最小長 | integer | - | - | - | 入力の最小の文字数。 | 実装で、入力の最小の長さの検証にする。<br>テストで、境界の長さのケースにする。 | - |
      | elements[].max_length | 最大長 | integer | - | - | - | 入力の最大の文字数。 | 実装で、入力の最大の長さの検証と `maxlength` にする。<br>テストで、境界の長さのケースにする。 | - |
      | elements[].range | 値の範囲・刻み | object | - | - | - | 数値の入力の最小・最大・刻み。 | 実装で、数値の入力の `min`・`max`・`step` にする。 | - |
      | elements[].range.min | 最小 | string | - | - | - | 入力の最小値。 | 実装で、入力の最小値にする。 | - |
      | elements[].range.max | 最大 | string | - | - | - | 入力の最大値。 | 実装で、入力の最大値にする。 | - |
      | elements[].range.step | 刻み | string | - | - | - | 入力の刻み。 | 実装で、入力の刻みにする。 | - |
      | elements[].pattern | 形式 | string | - | - | - | 正規表現。 | 実装で、入力の形式の検証にする。 | - |
      | elements[].charset | 文字種の扱い | string | - | - | - | 受け付ける文字と、制限せず変換するか。 | 実装で、受け付ける文字の検証と変換にする。 | - |
      | elements[].width | 表示幅 | string | - | - | - | 要素の表示幅（CSS の長さか、全体に対する割合）。 | 実装で、要素の表示幅にする。 | - |
      | elements[].overflow | 長い値の扱い | object | - | - | - | 長さが変わる値（記録から取得する値・利用者が入力する値）を表示する要素の、値が表示幅に収まらないときの扱いと、表示する値の最大の長さ。 | 実装で、値が収まらないときの折り返し・省略・横スクロールにする。<br>テストで、最大の長さの値を入れた場面にする。<br>レビューで、最大の長さの値を入れた画面のスクリーンショットと照合する。 | - |
      | elements[].overflow.type | 扱い | string | 必須 | `wrap` / `truncate` / `scroll` | - | 値が収まらないときに、折り返す（`wrap`）・省略する（`truncate`）・横にスクロールする（`scroll`）のどれにするか。 | 実装で、値の側の折り返し・省略・横スクロールの指定にする。 | - |
      | elements[].overflow.max_length | 表示する最大の長さ | integer | - | - | - | 表示する値の最大の文字数。 | テストで、最大の長さの値を入れた場面の値の文字数にする。<br>レビューで、スクリーンショットの値が最大の長さかを確認する。 | - |
      | elements[].overflow.unbounded | 長さの上限が無い値 | boolean | - | - | - | 表示する値の長さに上限が無い（AI や他の人が記載した文字を、長さを制限せずに表示する）なら `true`。 | 実装で、どれだけ長い値でも崩れない折り返し・省略・横スクロールにする。<br>テストで、`x-rules` の文字数の値を入れた場面にする。<br>レビューで、長さを制限していない値の要素に `overflow` の記載が漏れていないかを確認する。 | - |
      | elements[].count_limit | 件数の上限 | object | - | - | - | 複数の値を並べる要素（タグ・一覧・チップ 等）の、表示する件数の上限と、上限を超えたときの扱い。 | 実装で、表示する件数の上限と、超えた分の折り返し・件数でのまとめ・読み込みの分割にする。<br>テストで、上限の件数と上限を超える件数の値を入れた場面にする。<br>レビューで、上限を超える件数の値を入れた画面のスクリーンショットと照合する。 | - |
      | elements[].count_limit.max_count | 表示する最大の件数 | integer | 必須 | - | minimum: `1` | `summarize`・`paginate` では一度に表示する値の最大の件数、`wrap` では折り返さずに 1 行に並べる値の最大の件数。 | 実装で、件数でまとめる・読み込みを分ける・折り返す境目の件数にする。<br>テストで、上限の件数と、上限を超える件数（`wrap` では折り返す件数）の値を入れた場面の件数にする。 | - |
      | elements[].count_limit.type | 上限を超えたときの扱い | string | 必須 | `wrap` / `summarize` / `paginate` | - | 上限を超えたときに、折り返して全て出す（`wrap`）・超えた分を件数でまとめる（`summarize`、「+3」と出す）・読み込みを分ける（`paginate`、ページネーション・続きの読み込み）のどれにするか。 | 実装で、上限を超えた分の出し方にする。 | - |
      | elements[].display_format | 表示形式 | string | - | - | - | 日付・時刻・数値の表示の形式と、表示の例。 | 実装で、日付・時刻・数値の書式にする。 | - |
      | elements[].align | 文字揃え | string | - | `left` / `center` / `right` | - | 文字揃え（左 `left`・中央 `center`・右 `right`）。 | 実装で、文字揃えにする。 | - |
      | elements[].tab_order | タブ順 | integer | - | - | - | Tab キーで移る順番。 | 実装で、キー操作の順にする。 | - |
