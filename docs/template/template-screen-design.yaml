  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: SCR-1
      title: タスク作成画面
      screen: app/(authenticated)/tasks/new/page.tsx
      mock: docs/mock/pages/タスク作成/12/a-plan/
      lead: タスクの新規作成フォーム画面。タスク名・優先度を入力して登録する。
      test_file: tests/integration/task/test_タスク作成画面.py
      elements:
      - name: タスク名入力欄
        kind: input
        position: フォーム本体
        description: タスク名を入力
        placeholder: '例: 企画書を作る'
        io: 入力
        type: 文字列
        visible_when: 常時
        required: true
        max_length: 100
        constraints: 100 文字以内
        initial_value: 空（編集時は取得値）
        source: タスク詳細取得.task.title
        target: タスク作成.title
      - name: 優先度選択
        kind: select
        position: フォーム本体
        description: 優先度を選択
        io: 入力
        type: 文字列
        visible_when: 常時
        options: low / medium / high（既定 medium）
        initial_value: medium
        target: タスク作成.priority
      - name: 優先度のバッジ
        kind: label
        component: CMP-7#
        args:
        - name: kind
          value: 優先度選択の値（low は `muted`、high は `danger`）
        - name: label
          value: 優先度の表示名（低 / 中 / 高）
        position: フォーム本体 > 優先度選択の右
        description: 選んだ優先度を色つきで出す
        visible_when: 常時
      - name: 保存ボタン
        kind: button
        component: CMP-3#
        position: フッター
        description: 入力内容でタスクを作成
        label: 保存
        visible_when: 常時
        enabled_when: 必須項目が入力済みで制限の違反が無いとき
        action_ref: IF-1#
      input_checks:
      - element: タスク名入力欄
        violation: 空
        trigger: 保存ボタンのクリック
        message: タスク名を入力してください
        position: タスク名入力欄の下
      - element: タスク名入力欄
        violation: 101 文字以上
        trigger: 入力のたび
        message: 100 文字以内で入力してください
        position: タスク名入力欄の下
      ```
