# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-screen-design
kind: template
name: "テンプレート: 画面設計"
description: 1 画面の要素の仕様と入力チェックを記載する画面設計の書式を定め、画面設計を作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:テンプレート
  - name: topic:仕様
  - name: topic:画面
    main: true
  - name: topic:要素
  - name: action:入力
  - name: action:検査
  - name: action:設計
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      1 画面の要素の仕様（表示条件・活性条件・制限・初期値・取得元・送信先・アクション）と入力チェック。
      1 ファイル = 1 画面。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>dev-docs の配信で、文書の公開範囲のメタデータにする。 | - |
      | title | タイトル | string | 必須 | - | - | 日本語の画面名。ファイル名に合わせる。 | 生成で、ページの見出しにする。<br>dev-docs の検索で、文書の名前にする。 | - |
      | screen | 画面 | string | - | - | - | 画面の実装ファイルのパス。 | 実装で、画面を作るファイルにする。<br>結合テストで、開く画面にする。 | - |
      | mock | モック | string | - | - | - | 採用したモックの配置場所。 | 実装で、合意したモックの見た目に合わせる。<br>レビューで、実装した画面とモックを照合する。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>dev-docs の検索で、文書の概要文にする。 | - |
      | test_file | 対応テストファイル | string | - | - | pattern: `^tests/.+` | 対応する結合テストのファイル（規約『V字モデル』）。 | テストで、画面を開いて確認する結合テストを作るファイルにする。<br>検査で、テストのファイルがあるかを確認する。 | - |
      | elements | 要素一覧 | array | 必須 | - | minItems: `1` | 画面の要素 1 つ = 1 要素。 | 実装で、画面の要素にする。<br>生成で、要素一覧の表にする。 | - |
      | elements[].name | 要素 | string | 必須 | - | - | ボタン・入力欄・ラベル・テーブル等の日本語の論理名。 | 生成で、表の行の名前にする。<br>設計で、入力チェックから要素を指す。 | - |
      | elements[].id | 項目 ID | string | - | - | - | 画面の中で一意な識別子。テスト・実装から参照する。 | 実装で、要素の `id`・`data-testid` にする。<br>テストで、要素を探すセレクタにする。 | - |
      | elements[].kind | 種類 | string | 必須 | - | - | `button` / `input` / `select` / `table` / `label` 等。 | 実装で、要素の HTML の要素と部品を決める。 | - |
      | elements[].component | 部品 | string | - | - | pattern: `^(?:[A-Z]+-\d+(?:-\d+)?)?#(?:[^\s\[]\|\[[^\]]*\])*$` | 使用する部品の部品設計（部品設計の `{ID}#`）。 | 実装で、要素に使用する部品を決める。 | `CMP-5#` / `CMP-6#` |
      | elements[].args | 部品へ指定する引数 | array | - | - | - | 部品設計の引数へ指定する値。`component` を持つ要素だけが持ち、部品設計の必須の引数を全て並べる。 | 実装で、部品へ指定する値にする。<br>レビューで、部品の必須の引数が全て指定されているかを確認する。 | - |
      | elements[].args[].name | 引数 | string | 必須 | - | - | 部品設計の `args` の `name`。 | 実装で、指定する部品の引数にする。 | `status` / `filterable` |
      | elements[].args[].value | 指定する値 | string | 必須 | - | - | 固定の値か取得元（`{インターフェース定義の論理名}.{フィールドのパス}`）。 | 実装で、引数に指定する固定の値か、値を取るインターフェース定義のフィールドにする。 | `` `計画画面.行の材料[].status` `` / `` ※2 で絞り込みを持つ列なら `true` `` |
      | elements[].slots | スロットに差し込む中身 | array | - | - | - | 部品設計のスロットへ差し込む要素か部品。`component` を持つ要素だけが持つ。 | 実装で、部品のスロットへ差し込む中身にする。 | - |
      | elements[].slots[].name | スロット | string | 必須 | - | - | 部品設計の `slots` の `name`。 | 実装で、差し込むスロットにする。 | `default` / `actions` |
      | elements[].slots[].value | 差し込む中身 | string | 必須 | - | - | 差し込む要素の名前か、部品の部品設計。 | 実装で、差し込む要素か部品にする。 | `行の番号` / `CMP-3#` |
      | elements[].position | 位置 | string | - | - | - | `>` で区切った入れ子のパス。 | 実装で、要素を配置する入れ子の場所にする。 | `削除確認ダイアログ > フッター` |
      | elements[].description | 説明 | string | 必須 | - | - | 要素の役割（何を表示し、何を受け付けるか）。 | 実装で、要素に表示する値と受け付ける入力を決める。 | - |
      | elements[].label | 表示文言 | string | - | - | - | 画面に固定で出る文字列。 | 実装で、画面に出す文字列にする。 | - |
      | elements[].placeholder | プレースホルダ | string | - | - | - | 入力欄が空のときに出す文言。 | 実装で、入力欄のプレースホルダにする。 | - |
      | elements[].io | 入出力区分 | string | - | `入力` / `表示` / `入出力` | - | 表示だけか、入力を受けるかの区分。 | 実装で、表示だけか、入力を受けるかを決める。 | - |
      | elements[].type | 型 | string | - | - | - | 値を持つ要素の型（文字列 / 数値 / 日付 / 真偽値 等）。 | 実装で、値の型と入力欄の種類にする。 | - |
      | elements[].visible_when | 表示条件 | string | - | - | - | `常時` か出し分けの条件。 | 実装で、要素を出す条件にする。<br>テストで、出る状態と出ない状態のケースにする。 | - |
      | elements[].enabled_when | 活性条件 | string | - | - | - | 表示はされるが操作できない条件。 | 実装で、要素を操作できる条件にする。<br>テストで、操作できない状態のケースにする。 | - |
      | elements[].required | 必須 | boolean | - | - | - | 入力が必須なら `true`。 | 実装で、入力を必須にするかを決める。 | - |
      | elements[].required_label | 要否の表示 | string | - | - | - | `※必須` / `※任意` の出し方。 | 実装で、必須・任意の表示にする。 | - |
      | elements[].constraints | 制限 | string | - | - | - | `min_length`・`max_length`・`range`・`pattern`・`charset` で表せない入力の制限。 | 実装で、個別のキーで表せない入力の検証にする。 | - |
      | elements[].min_length | 最小長 | integer | - | - | - | 入力の最小の文字数。 | 実装で、入力の最小の長さの検証にする。<br>テストで、境界の長さのケースにする。 | - |
      | elements[].max_length | 最大長 | integer | - | - | - | 入力の最大の文字数。 | 実装で、入力の最大の長さの検証と `maxlength` にする。<br>テストで、境界の長さのケースにする。 | - |
      | elements[].range | 値の範囲・刻み | object | - | - | - | 数値の入力の最小・最大・刻み。 | 実装で、数値の入力の `min`・`max`・`step` にする。 | - |
      | elements[].range.min | 最小 | string | - | - | - | 入力の最小値。 | 実装で、入力の最小値にする。 | - |
      | elements[].range.max | 最大 | string | - | - | - | 入力の最大値。 | 実装で、入力の最大値にする。 | - |
      | elements[].range.step | 刻み | string | - | - | - | 入力の刻み。 | 実装で、入力の刻みにする。 | - |
      | elements[].pattern | 形式 | string | - | - | - | 正規表現。 | 実装で、入力の形式の検証にする。 | - |
      | elements[].charset | 文字種の扱い | string | - | - | - | 受け付ける文字と、制限せず変換するか。 | 実装で、受け付ける文字の検証と変換にする。 | - |
      | elements[].width | 表示幅 | string | - | - | - | 要素の表示幅（CSS の長さか、全体に対する割合）。 | 実装で、要素の表示幅にする。 | - |
      | elements[].display_format | 表示形式 | string | - | - | - | 日付・時刻・数値の表示の形式と、表示の例。 | 実装で、日付・時刻・数値の書式にする。 | - |
      | elements[].align | 文字揃え | string | - | `左` / `中央` / `右` | - | 文字揃え（左・中央・右）。 | 実装で、文字揃えにする。 | - |
      | elements[].tab_order | タブ順 | integer | - | - | - | Tab キーで移る順番。 | 実装で、キー操作の順にする。 | - |
      | elements[].autofocus | 初期フォーカス | boolean | - | - | - | 画面を開いたときにフォーカスを設定する要素なら `true`。 | 実装で、画面を開いたときにフォーカスを設定する要素にする。 | - |
      | elements[].initial_state | 初期状態 | string | - | `活性` / `非活性` / `読み取り専用` | - | 画面を開いたときの要素の状態（無効・非表示 等）。 | 実装で、画面を開いたときの要素の状態にする。 | - |
      | elements[].initial_value | 初期値 | string | - | - | - | 表示時点の値（`空` / 取得値 等）。 | 実装で、画面を開いたときの値にする。 | - |
      | elements[].hint | 補助文 | string | - | - | - | ラベルの下に出す説明。 | 実装で、ラベルの下の補助文にする。 | - |
      | elements[].autocomplete | 入力の目的 | string | - | - | - | 自動入力の種類（HTML の `autocomplete`）。 | 実装で、入力欄の `autocomplete` にする。 | - |
      | elements[].inputmode | 入力モード | string | - | - | - | 入力欄の `inputmode`（`numeric`・`email` 等）。 | 実装で、入力欄の `inputmode` にする。 | - |
      | elements[].prefix | 接頭辞 | string | - | - | - | 入力欄の前に出す文字列（通貨記号 等）。 | 実装で、入力欄の前に出す文字列にする。 | - |
      | elements[].suffix | 接尾辞 | string | - | - | - | 入力欄の後に出す文字列（単位 等）。 | 実装で、入力欄の後に出す文字列にする。 | - |
      | elements[].options | 選択肢 | string | - | - | - | 出所・並び・既定・複数選択の可否・排他入力。 | 実装で、選択肢の出所・並び・既定・複数選択にする。 | - |
      | elements[].sorting | 並べ替え・絞り込み | string | - | - | - | 表の列のとき、できるかと既定の並び。 | 実装で、表の列の並べ替え・絞り込みにする。 | - |
      | elements[].input_example | 入力例 | string | - | - | - | テストで入力する値の具体例。 | テストで、入力する値にする。 | - |
      | elements[].source | 取得元 | string | - | - | - | `{インターフェース定義の論理名}.{フィールドのパス}`。 | 実装で、要素に出す値を取るインターフェース定義のフィールドにする。 | - |
      | elements[].target | 送信先 | string | - | - | - | `{インターフェース定義の論理名}.{フィールドのパス}`。変換・合成・除外は括弧書きで添える。 | 実装で、入力した値を送信するインターフェース定義のフィールドにする。 | - |
      | elements[].action | アクション | string | - | - | - | 画面の中で閉じる動きは日本語で記載する。送信・画面遷移は `action_ref` に参照で持つ。 | 実装で、画面の中で閉じる動きにする。 | - |
      | elements[].action_ref | アクションの参照 | string | - | - | pattern: `^(?:[A-Z]+-\d+(?:-\d+)?)?#(?:[^\s\[]\|\[[^\]]*\])*$` | 送信を伴う動きはインターフェース定義、画面遷移は遷移先の画面設計。 | 実装で、送信先のインターフェースか遷移先の画面を決める。 | `IF-12#flows[正常系]` / `#functions[resolve_base].exceptions` / `CFG-3#` / `#notes[main.py の補足]` / `#functions[main#3]` |
      | elements[].refs | 関連 | array | - | - | - | 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。 | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | elements[].decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | elements[].reason | 理由 | string | - | - | - | そうしている理由。参照する側の判断が変わるものだけを記載する。 | レビューで、理由が今も成り立つかと、同じ判断を変える変更が無いかを確認する。 | - |
      | elements[].status | 状態 | string | - | `planned` / `implemented` / `deprecated` / `removed` | - | 項目の状態で、`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）のどれか。記載しなければ実装済みとして扱う。 | 実装で、`planned` の項目を作る対象にし、`deprecated`・`removed` の項目を新しく使用しない。<br>生成で、状態の表示にする。 | - |
      | elements[].visibility | 公開 | string | - | `user` / `developer` | - | Pages に出すか（`user` はユーザー向けで Pages に出し、`developer` は開発者向けで dev-docs の画面だけで出す）。記載しなければ親の値を引き継ぎ、最上位の既定は `developer`。 | 生成で、Pages に出すかを決める。 | - |
      | elements[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。 | - |
      | input_checks | 入力チェック | array | - | - | - | 1 要素 = 1 ケースの入力チェック。無い画面は持たない。 | 実装で、入力の検証とエラーの表示にする。<br>テストで、違反ごとのケースにする。 | - |
      | input_checks[].element | 要素 | string | 必須 | - | - | `elements` の要素の名前。 | 実装で、検証する要素にする。 | - |
      | input_checks[].violation | 違反の条件 | string | 必須 | - | - | 1 要素に 1 つの違反。 | 実装で、エラーにする条件にする。 | - |
      | input_checks[].trigger | 検証の契機 | string | 必須 | - | - | 入力のたび / フォーカスを失ったとき / 送信ボタンのクリック 等。 | 実装で、検証する契機（入力・フォーカスを失ったとき・送信）にする。 | - |
      | input_checks[].message | エラー文言 | string | 必須 | - | - | 画面に出る文字列そのまま。 | 実装で、画面に出すエラーの文言にする。 | - |
      | input_checks[].position | 表示位置 | string | 必須 | - | - | エラーを出す場所（入力欄の下・フォームの上 等）。 | 実装で、エラーを出す場所にする。 | - |
      | refs | 関連 | array | - | - | - | 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。 | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。 | - |

