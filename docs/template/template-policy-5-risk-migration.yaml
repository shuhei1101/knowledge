  - id: overview
    name: 概要
    body: |-
      方針決めの工程 5「リスクと移行計画」の記録の書式。
      リスクと対策、移行の進め方、移行の Issue の並びと前提を決める。

      `## 調べたこと` と `## 回答` は、テンプレート『方針決め/共通』に従う。
  - id: section-list-01
    name: セクション一覧
    body: |-
      | セクション | 必須or条件 |
      | --- | --- |
      | `## リスクと対策` | 必須 |
      | `## 移行の進め方` | 必須 |
      | `## 移行の Issue の並び` | 必須 |
      | `## 調べたこと` | 必須 |
      | `## 回答` | 必須（工程の確認事項が決着したとき） |
  - id: risk-countermeasure-01
    name: "`## リスクと対策`"
    body: |-
      ### 記述例

      ```markdown
      ## リスクと対策

      | リスク | 出所 | 影響 | 対策 | 補足 |
      | --- | --- | --- | --- | --- |
      | {リスクの内容} | [リスクと技術的負債の一覧]({一覧へのリンク}) の {行の内容} | {起きたときの影響} | {対策} | - |
      ```

      ### 補足

      **出所列:**
      - RE で溜めたリスクと技術的負債の一覧の行は、全て 1 行以上のリスクにするか、対策しない理由を対策列に書く
      - 工程 1〜4 の決定から新しく生じたリスクは、出所列に `新規` と書く

      **対策列:**
      - リスクを避ける・減らす・受け入れる・移すのどれかを決め、取る行動を書く
  - id: migration-approach-01
    name: "`## 移行の進め方`"
    body: |-
      ### 記述例

      ```markdown
      ## 移行の進め方

      | 質問 | 判断基準 | 回答 | 補足 |
      | --- | --- | --- | --- |
      | 段階的な置き換えか作り直しか | 旧システムを動かしたまま部分ごとに置き換えられるなら段階的な置き換えにし、置き換えられない根拠があるときだけ作り直す | {段階的な置き換え / 作り直し} | {根拠} |
      | 旧システムを止める条件は何か | 工程 1 の終わりの定義を、置き換えの単位ごとの条件へ分ける | {条件} | - |
      | 今のコードをどう残すか | 段階的な置き換えでは、置き換える今のコードを `{名前}_legacy`（例: `src/sample_legacy`）へ移して残し、新しい構成を横に作って置き換え、最後の移行の Issue で `_legacy` を削除する | {残す場所と削除する Issue} | - |
      ```

      ### 補足

      **質問列・判断基準列:**
      - 記述例の文言のまま置き、回答列だけを埋める
  - id: migration-issue-order-01
    name: "`## 移行の Issue の並び`"
    body: |-
      ### 記述例

      ```markdown
      ## 移行の Issue の並び

      | 順 | Issue の題名 | 種別 | 前提 | 完了の定義 | 補足 |
      | --- | --- | --- | --- | --- | --- |
      | 1 | {題名} | あるべき姿の設計書 | - | {観測できる完了の状態} | - |
      | 2 | {題名} | 移行 | 1 | {観測できる完了の状態} | - |
      | 3 | `_legacy` を削除する | 移行 | 2 | `{名前}_legacy` が無く、参照も残っていない | - |
      ```

      ### 補足

      **順列:**
      - 1 から始まる連番にし、前提の列が挙げる順より後ろに並べる

      **種別列:**
      - `あるべき姿の設計書` / `規約` / `移行` のどれかを書く

      **前提列:**
      - 先に完了している必要がある行の順を書く（無ければ `-`）

      **完了の定義列:**
      - Issue が独立して完了と言える状態を、観測できる状態で書く

      **`_legacy` を削除する行:**
      - 段階的な置き換えでは、全ての移行の行を前提にした最後の行に置く
  - id: researched-01
    name: "`## 調べたこと`"
    body: |-
      ### 記述例

      ```markdown
      ## 調べたこと

      | 題材 | 分かったこと | 出典 | 補足 |
      | --- | --- | --- | --- |
      | Legacy Displacement の移行の進め方 | {分かったこと} | [{出典名}]({URL}) | - |
      | Kill It with Fire の移行 | {分かったこと} | [{出典名}]({URL}) | - |
      ```

      ### 補足

      - 題材の行は記述例の 2 つで始める
