# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-er
kind: template
name: "テンプレート: ER図"
description: データストアの構造（DB スキーマ / JSON / YAML）を業務ドメインの分類ごとにまとめる ER 図の書式を定め、ER 図を作る・更新するときに読む。
tags:
  - name: scope:テンプレート
  - name: topic:db
  - name: topic:er図
    main: true
  - name: tool:json
  - name: tool:yaml
  - name: topic:スキーマ
  - name: topic:テンプレート
  - name: topic:データストア
  - name: topic:ドメイン
  - name: topic:業務
  - name: topic:構造
  - name: action:分類
status: current
visibility: internal
rev: 4
items:
  - id: overview
    name: 概要
    body: |-
      データストアの構造（DB スキーマ / JSON / YAML）を業務ドメインの分類ごとにまとめる。1 ファイル = 分類 1 つ。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | title | タイトル | string | 必須 | - | pattern: ^ER 図: .+$ | `ER 図: {分類名}`。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。<br>初回に書いた内容のまま保ち、後から情報を追加しない（仕様は各項目に書く）。<br>対象そのものが変わったときだけ書き換える。 | - |
      | overview | 概要 | string | - | - | - | 索引の設計書だけが持つ。データストアの種別とバージョン・物理名の命名規則・全テーブルの共通カラム。 | - |
      | er | ER 図 | object | - | - | - | 当該分類のテーブル間の関連。他の分類のテーブルは名前だけで置く。テーブルが 2 つ以上あるときに持つ。 | - |
      | er.entities | 実体 | array | 必須 | - | - | - | - |
      | er.entities[].name | 名前 | string | 必須 | - | pattern: ^\S+$ | 図に出すテーブルの論理名（空白なし）。他の分類のテーブルは名前だけで置く。 | - |
      | er.entities[].columns | カラム | array | - | - | - | 図に描くカラム。書かなければ、同じ設計書のテーブルのカラムから作る。 | - |
      | er.entities[].columns[].type | 型 | string | 必須 | - | - | - | - |
      | er.entities[].columns[].name | 名前 | string | 必須 | - | pattern: ^\S+$ | - | - |
      | er.entities[].columns[].key | キー | string | - | PK / FK / UK | - | - | - |
      | er.entities[].columns[].comment | 注記 | string | - | - | - | 外部キーの参照先（例 `参照: ユーザー.ID`）。 | - |
      | er.relations | 関連 | array | - | - | - | - | - |
      | er.relations[].from | 元 | string | 必須 | - | - | - | - |
      | er.relations[].to | 先 | string | 必須 | - | - | - | - |
      | er.relations[].cardinality | 多重度 | string | 必須 | - | - | `\|\|--o{` = 1:N / `\|\|--\|\|` = 1:1 / `}o--o{` = N:M。 | - |
      | er.relations[].label | ラベル | string | - | - | - | - | - |
      | tables | テーブル | array | - | - | - | テーブル 1 つ = 1 要素。並びは依存の上流から下流。 | - |
      | tables[].name | 物理名 | string | 必須 | - | - | DB は snake_case、JSON / YAML はファイルのパス。 | - |
      | tables[].title | 論理名 | string | 必須 | - | - | - | - |
      | tables[].datastore | データストア | string | 必須 | - | - | `PostgreSQL` / `SQLite` / `JSON` / `YAML` 等。 | - |
      | tables[].summary | 概要 | string | 必須 | - | minLength: 1, pattern: ^[^\n]+$ | 1 行で何を担うか。 | - |
      | tables[].primary_key | 主キー | string | - | - | - | 複合キーは `(col_a, col_b)`。 | - |
      | tables[].scale | レコード規模 | string | - | - | - | 想定行数のオーダー（`～10 万`）。 | - |
      | tables[].growth | 増え方 | string | - | - | - | - | - |
      | tables[].retention | 保持期間 | string | - | - | - | - | - |
      | tables[].deletion | 削除の方針 | string | - | - | - | 物理削除か論理削除か。 | - |
      | tables[].access | アクセス方式 | string | - | - | - | JSON / YAML のとき、全件か キーで引くか。 | - |
      | tables[].description | 説明 | string | - | - | - | Markdown で書く本文。<br>他の設計書を指すときは説明文の中にリンクを書かず、参照は `refs`（`ref` の配列）に持つ。 | - |
      | tables[].columns | カラム | array | 必須 | - | minItems: 1 | - | - |
      | tables[].columns[].name | 物理名 | string | 必須 | - | - | - | - |
      | tables[].columns[].title | 論理名 | string | 必須 | - | - | - | - |
      | tables[].columns[].type | 型 | string | 必須 | - | - | DB は DBMS のネイティブ型、JSON / YAML は `string` / `number` / `boolean` / `object` / `array`。 | - |
      | tables[].columns[].length | 長さ・精度 | string | - | - | - | 長さ・精度・小数の桁。 | - |
      | tables[].columns[].not_null | NOT NULL | boolean | - | - | - | - | - |
      | tables[].columns[].primary_key | 主キー | boolean | - | - | - | - | - |
      | tables[].columns[].unique | 一意 | boolean | - | - | - | - | - |
      | tables[].columns[].foreign_key | 外部キー | object | - | - | - | - | - |
      | tables[].columns[].foreign_key.table | 参照先 | string | 必須 | - | - | `{分類}/{テーブル名}.{カラム}`（他の分類は分類名を付ける）。 | - |
      | tables[].columns[].foreign_key.on_delete | 削除時の動き | string | - | - | - | - | - |
      | tables[].columns[].check | 検査制約 | string | - | - | - | - | - |
      | tables[].columns[].default | 既定 | string | - | - | - | - | - |
      | tables[].columns[].auto | 自動で入る値 | string | - | 採番 / 作成日時 / 更新日時 / 作成者 | - | - | - |
      | tables[].columns[].description | 説明 | string | 必須 | - | - | - | - |
      | tables[].columns[].example | 例 | string | - | - | - | - | - |
      | tables[].columns[].enum_values | 値の選択肢 | string | - | - | - | `'a' / 'b'` の書式で値と意味を並べる。 | - |
      | tables[].columns[].sensitivity | 区分 | string | - | 個人情報 / 機密 | - | 個人情報・機密に当たるときだけ書く。 | - |
      | tables[].columns[].notes | 補足 | string | - | - | - | - | - |
      | tables[].indexes | インデックス | array | - | - | - | 検索に使う追加のインデックスだけ。PK / UK はカラムが持つ。 | - |
      | tables[].indexes[].name | 名前 | string | 必須 | - | - | 実 DB と一致させる（`{table}_{column}_{kind}`）。 | - |
      | tables[].indexes[].columns | カラム | string | 必須 | - | - | - | - |
      | tables[].indexes[].kind | 種別 | string | 必須 | - | - | - | - |
      | tables[].indexes[].notes | 補足 | string | - | - | - | - | - |
      | tables[].refs | 関連 | array | - | - | - | - | - |
      | tables[].reason | 理由 | string | - | - | - | そうしている理由。読み手の判断が変わるものだけを書く。 | - |
      | tables[].status | 状態 | string | - | planned / implemented / deprecated / removed | - | 項目の状態。`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）。書かなければ実装済みとして扱う。 | - |
      | tables[].visibility | 公開 | string | - | user / developer | - | 公開の範囲。`user`（ユーザー向け）/ `developer`（開発者向け）。<br>書かなければ親の値を引き継ぎ、最上位の既定は `developer`。 | - |
      | tables[].implementation | 実装 | string | - | - | pattern: ^[^#\s]+(#\S+)?$ | 実装の場所。リポジトリの直下からのファイルのパスに、`#` とシンボルの名前を続けてよい。 | `src/app/features/profile/service.py#update_profile` |
      | tables[].introduced | 導入 | object | - | - | - | 入ったバージョンと PR。 | - |
      | tables[].introduced.version | バージョン | string | - | - | - | 入ったバージョンのタグ（例 `v0.3.0`）。 | - |
      | tables[].introduced.pr | PR | integer | - | - | - | 入れた PR の番号。 | - |
      | tables[].aliases | 別名 | array | - | - | - | 検索で当てたい言い換え。 | - |
      | tables[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |
      | refs | 関連 | array | - | - | - | - | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      title: 'ER 図: タスク'
      lead: '`タスク` ドメインに属するデータストア構造。'
      er:
        entities:
        - name: ユーザー
        - name: タスク
        - name: コメント
        relations:
        - from: ユーザー
          to: タスク
          cardinality: '||--o{'
          label: 作成
        - from: タスク
          to: コメント
          cardinality: '||--o{'
          label: 持つ
      tables:
      - name: tasks
        title: タスク
        datastore: PostgreSQL
        summary: ユーザーが管理するタスク
        primary_key: id
        scale: ～500 万
        deletion: '`status=''archived''` で論理削除し、90 日後に物理削除する'
        columns:
        - name: id
          title: ID
          type: uuid
          not_null: true
          primary_key: true
          default: gen_random_uuid()
          auto: 採番
          description: 主キー
          example: 018f8a...
        - name: user_id
          title: ユーザー ID
          type: uuid
          not_null: true
          foreign_key:
            table: ユーザー/ユーザー.ID
            on_delete: CASCADE
          description: 所有ユーザー
        - name: title
          title: タイトル
          type: varchar(200)
          not_null: true
          check: 1〜200 文字
          description: タスクのタイトル
          example: 週次レポート作成
        - name: status
          title: ステータス
          type: text
          not_null: true
          default: '''open'''
          enum_values: '''open'' = 未着手 / ''done'' = 完了 / ''archived'' = 論理削除'
          description: タスクの状態
        indexes:
        - name: tasks_user_id_ix
          columns: user_id
          kind: BTREE
          notes: ユーザー別の一覧用
      - name: comments
        title: コメント
        datastore: PostgreSQL
        summary: タスクへのコメント
        primary_key: id
        scale: ～1000 万
        columns:
        - name: id
          title: ID
          type: uuid
          not_null: true
          primary_key: true
          auto: 採番
          description: 主キー
        - name: task_id
          title: タスク ID
          type: uuid
          not_null: true
          foreign_key:
            table: タスク.ID
          description: コメント先のタスク
        - name: body
          title: 本文
          type: text
          not_null: true
          description: コメントの本文
      ```
