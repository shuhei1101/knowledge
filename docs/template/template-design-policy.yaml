# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-design-policy
kind: template
name: "テンプレート: デザイン方針"
description: プロジェクトで採用したデザインの方向性を言葉で残すデザイン方針のテンプレート。
tags:
  - name: scope:テンプレート
    main: true
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      プロジェクトで採用したデザインの方向性を言葉で残す書式。

      配置先は `dev/設計書/デザイン方針.md`（1 プロジェクト 1 ファイル）。
      値はプロジェクトのトークンのファイル、見本は画面全体を `dev/mock/styles/{採用スタイル}/`、部品を Storybook に置き、本ページからはその置き場所を指す。
  - id: section-list-01
    name: セクション一覧
    body: |-
      <!-- table: data -->

      | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- |
      | 冒頭リード | - | 必須 |
      | `## 採用スタイル` | - | 必須 |
      | `## 雰囲気のことば` | - | 必須 |
      | `## モチーフ・装飾` | - | 必須 |
      | `## 色の役割` | - | 必須 |
      | `## 文字の役割` | - | 必須 |
      | `## 形状と奥行き` | - | 必須 |
      | `## 動き` | - | 必須 |
      | `## 使わないもの` | - | 必須 |

      <!-- /table -->
  - id: lead-01
    name: "`冒頭リード`"
    body: |-
      ### 記述例

      ```markdown
      # デザイン方針

      {プロジェクト名} の画面全体に通すデザインの方向性。
      ```

      ### 補足

      - 初回に書いた内容のまま保ち、後から情報を追加しない。
        スタイルの選定理由は `## 採用スタイル`、各要素の方針は該当のセクションに書く（両方に書くと同じ内容を 2 箇所で持つことになる）。
        対象そのものが変わったときだけ既存の記述を書き換える
  - id: adopted-style-01
    name: "`## 採用スタイル`"
    body: |-
      ### 記述例

      ```markdown
      ## 採用スタイル

      | 項目 | 内容 | 補足 |
      | --- | --- | --- |
      | スタイル | ナチュラル | - |
      | 分類 | 表現系 | - |
      | 明暗 | 両方 | - |
      | 見本（画面全体） | [dev/mock/styles/ナチュラル/](../mock/styles/ナチュラル/) | - |
      | 見本（部品） | [Storybook](https://{Storybook の URL}) | - |
      | 値の置き場所 | `src/styles/tokens.css` | - |
      | 選んだ理由 | 園芸・菜園のサイトで、週末に作業の記録を付ける利用者が主。季節と育つ手触りを出す | - |
      ```

      ### 補足

      **項目列:**
      - スタイルと分類は規約『デザインスタイル』のスタイル一覧の名前で書く
      - 明暗は両方を書く。ライト / ダークの片方だけにするときは、補足列に理由を書く
      - 選んだ理由はサイトのジャンルと利用者から書く（ジャンルの呼び名は外部規約『サイトのジャンル』に揃える）
  - id: mood-words-01
    name: "`## 雰囲気のことば`"
    body: |-
      ### 記述例

      ```markdown
      ## 雰囲気のことば

      素朴・季節・育つ
      ```

      ### 補足

      - 3〜5 語を `・` で並べる
  - id: motif-decoration-01
    name: "`## モチーフ・装飾`"
    body: |-
      ### 記述例

      ```markdown
      ## モチーフ・装飾

      | モチーフ・装飾 | 使う場所 | 補足 |
      | --- | --- | --- |
      | 葉の線画 | 見出しの前 | - |
      | 蔓の線 | セクションの区切り | - |
      ```

      ### 補足

      - ユーザーの合意で確定したものだけを書く
  - id: color-role-01
    name: "`## 色の役割`"
    body: |-
      ### 記述例

      ```markdown
      ## 色の役割

      | 役割 | 使う場所 | トークン | 補足 |
      | --- | --- | --- | --- |
      | 主 | 地・本文 | `--color-bg` / `--color-text` | - |
      | 差し色 | 主ボタン・選択中 | `--color-primary` | 1 画面に 1 か所 |
      | 状態色 | 成功・警告・エラーの表示だけ | `--color-success` / `--color-warning` / `--color-danger` | - |
      ```

      ### 補足

      **トークン列:**
      - トークンの名前を書き、値はトークンのファイルに置く
  - id: text-role-01
    name: "`## 文字の役割`"
    body: |-
      ### 記述例

      ```markdown
      ## 文字の役割

      | 役割 | 書体の方向 | 補足 |
      | --- | --- | --- |
      | 見出し | 手書き風 | - |
      | 本文 | 丸ゴシック | - |
      | 数値 | 等幅 | 桁を揃える表で使う |
      ```
  - id: shape-depth-01
    name: "`## 形状と奥行き`"
    body: |-
      ### 記述例

      ```markdown
      ## 形状と奥行き

      | 要素 | 区切り方 | 補足 |
      | --- | --- | --- |
      | カード | 大きめの角丸と薄い影 | - |
      | 表 | 線で区切る | - |
      ```

      ### 補足

      **区切り方列:**
      - 角丸・線・影のどれで区切るかを書く
  - id: motion-01
    name: "`## 動き`"
    body: |-
      ### 記述例

      ```markdown
      ## 動き

      | 場所 | 動き | 補足 |
      | --- | --- | --- |
      | ボタンの押下 | 軽く沈む | - |
      | セクションの開閉 | 高さを滑らかに変える | - |
      ```
  - id: not-used-01
    name: "`## 使わないもの`"
    body: |-
      ### 記述例

      ```markdown
      ## 使わないもの

      | 使わないもの | 理由 | 補足 |
      | --- | --- | --- |
      | 光る影 | 素朴さとぶつかる | - |
      ```
