# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-config
kind: template
name: "テンプレート: 設定"
description: サブシステム 1 つの設定値・環境変数の一覧を記載する設定の書式を定め、設定の設計書を作る・修正するときに読む。
aliases:
  - テンプレート/設定
tags:
  - name: scope:テンプレート
  - name: topic:サブシステム
  - name: topic:テンプレート
  - name: topic:変数
  - name: topic:環境
  - name: topic:環境変数
  - name: topic:設定
    main: true
  - name: topic:設計書
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      サブシステム 1 つの設定値・環境変数の一覧。1 ファイル = サブシステム 1 つ。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: ^[A-Z]+-\d+(-\d+)?$ | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | `IF-12` / `IF-3038-1` |
      | title | タイトル | string | 必須 | - | pattern: ^設定: .+$ | `設定: {サブシステム名}`。 | - |
      | lead | 冒頭リード | string | - | - | - | 設定値の一覧であることと、実装・サンプルのファイルへのポインタ。<br>初回に書いた内容のまま保ち、後から情報を足さない。 | - |
      | files | ファイル一覧 | array | - | - | - | 設定ファイルを持たないサブシステムは持たない。 | - |
      | files[].file | ファイル | string | 必須 | - | - | リポジトリの直下からの相対パス・ホーム起点の絶対パス・ファイル名のいずれか。 | - |
      | files[].manages | 管理する値 | string | 必須 | - | - | - | - |
      | files[].notes | 補足 | string | - | - | - | - | - |
      | settings | キー一覧 | array | - | - | - | 設定のキー 1 つ = 1 要素。 | - |
      | settings[].key | キー | string | 必須 | - | - | 階層はドットで結ぶ（`logging.level`）。配列の要素の子は `parent[].child`。 | - |
      | settings[].title | 論理名 | string | 必須 | - | - | 業務用語。 | - |
      | settings[].file | ファイル | string | 必須 | - | - | このキーを持つファイル（`files` の `file`）。 | - |
      | settings[].type | 型 | string | 必須 | - | - | 取りうる値が限られるときはリテラルの列挙。 | - |
      | settings[].required | 必須 | boolean | - | - | - | - | - |
      | settings[].default | 既定値 | string | - | - | - | 必須のキーには書かない。 | - |
      | settings[].description | 説明 | string | 必須 | - | - | - | - |
      | settings[].missing | 欠落時の挙動 | string | - | - | - | 必須のキーが無いときの挙動（`起動時にエラー` 等）。 | - |
      | settings[].env_var | 環境変数名 | string | - | - | - | 同じ値を上書きする環境変数。 | - |
      | settings[].secret | 秘密 | boolean | - | - | - | 秘密の値か。秘密なら例・実値を書かず、表示を伏せる。 | - |
      | settings[].reload | 反映 | string | - | immediate / reload / restart | - | `immediate`（即時）/ `reload`（読み直し）/ `restart`（再起動）。 | - |
      | settings[].allowed | 許す値や範囲 | string | - | - | - | - | - |
      | settings[].per_env | 環境ごとの値 | string | - | - | - | - | - |
      | settings[].refs | 関連 | array | - | - | - | - | - |
      | settings[].reason | 理由 | string | - | - | - | そうしている理由。読み手の判断が変わるものだけを書く。 | - |
      | settings[].status | 状態 | string | - | planned / implemented / deprecated / removed | - | 項目の状態（`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止））。書かなければ実装済みとして扱う。 | - |
      | settings[].visibility | 公開 | string | - | user / developer | - | Pages に出すか（`user` はユーザー向けで Pages に出し、`developer` は開発者向けで dev-docs の画面だけで出す）。書かなければ親の値を引き継ぎ、最上位の既定は `developer`。 | - |
      | settings[].implementation | 実装 | string | - | - | pattern: ^[^#\s]+(#\S+)?$ | 実装の場所。リポジトリの直下からのファイルのパスに、`#` とシンボルの名前を続けてよい。 | `src/app/features/schemas/loader.py#load_catalog` |
      | settings[].introduced | 導入 | object | - | - | - | 入ったバージョンと PR。 | - |
      | settings[].introduced.version | バージョン | string | - | - | - | 入ったバージョンのタグ。 | `v0.3.0` |
      | settings[].introduced.pr | PR | integer | - | - | - | 入れた PR の番号。 | - |
      | settings[].aliases | 別名 | array | - | - | - | 検索で当てたい言い換え。 | - |
      | settings[].notes | 補足 | object | - | - | - | 項目に分けられない残り。節の名前 → 本文。 | - |
      | overrides | 環境ごとの差分 | array | - | - | - | 環境ごとのファイルが共通の同名キーを上書きする値。 | - |
      | overrides[].file | ファイル | string | 必須 | - | - | `settings.{環境}.yaml` など。 | - |
      | overrides[].key | キー | string | 必須 | - | - | - | - |
      | overrides[].value | 値 | string | 必須 | - | - | - | - |
      | overrides[].description | 説明 | string | - | - | - | - | - |
      | overrides[].notes | 補足 | string | - | - | - | - | - |
      | refs | 関連 | array | - | - | - | - | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。節の名前 → 本文。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 他の設計書を指すときは説明文の中にリンクを書かず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | settings[].title | 設計書の中で一意にする。 | - | - |
      | settings[].reason | 他の設計書を指すときは説明文の中にリンクを書かず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | settings[].notes | 同じ名前の節が多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |
      | notes | 同じ名前の節が多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: CFG-1
      title: '設定: バックエンド'
      lead: バックエンドの設定値一覧。
      files:
      - file: config/settings.yaml
        manages: 共通の設定値（秘匿情報を含む）
        notes: git 管理外
      settings:
      - key: port
        title: 待受ポート
        file: config/settings.yaml
        type: int
        required: false
        default: '8765'
        description: HTTP API の待受ポート
        reload: restart
        visibility: user
      ```
