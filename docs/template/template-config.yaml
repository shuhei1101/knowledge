# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-config
kind: template
name: "テンプレート: 設定"
description: サブシステム 1 つの設定値・環境変数の一覧を記載する設定の書式を定め、設定の設計書を作る・修正するときに参照する。
aliases:
  - テンプレート/設定
tags:
  - name: scope:テンプレート
  - name: topic:サブシステム
  - name: topic:テンプレート
  - name: topic:変数
  - name: topic:環境
  - name: topic:環境変数
  - name: topic:設定
    main: true
  - name: topic:設計書
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      サブシステム 1 つの設定値・環境変数の一覧。
      1 ファイル = サブシステム 1 つ。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>project-index の配信で、文書の公開範囲のメタデータにする。 | - |
      | tags | タグ | array | - | - | - | 設計書を検索で絞り込むタグで、`name` にタグの名前（`action:`・`topic:`・`tool:` などで始める）、最も分量の多い主題 1 つに `main: true` を記載する。<br>付け方は knowledge の規約『文書のタグと description の記載』に従う。 | project-index の検索で、文書をタグで絞り込む。 | `[{main: true, name: topic:タグ}, name: action:記載]` |
      | tags[].name | タグの名前 | string | 必須 | - | minLength: `1` | タグの名前。`action:`・`topic:`・`tool:` などで始める。 | 検索で、文書をタグで絞り込む値にする。 | - |
      | tags[].main | 主題 | boolean | - | - | - | 最も分量の多い主題のタグだけ `true` にする。 | 検索で、文書の主題のタグとして扱う。 | - |
      | aliases | 別名 | array | - | - | - | 検索でヒットさせたい言い換え。 | project-index の検索で、文書を名前と同じように検索できる言い換えにする。 | `[フォルダ構成の設計書]` |
      | title | タイトル | string | 必須 | - | pattern: `^設定: .+$` | `設定: {サブシステム名}`。 | 生成で、ページの見出しにする。<br>project-index の検索で、文書の名前にする。 | - |
      | lead | 冒頭リード | string | - | - | - | 設定値の一覧であることと、実装・サンプルのファイルへのポインタ。<br>初回に記載した内容のまま保ち、後から情報を追加しない。 | 生成で、ページの冒頭の説明にする。<br>project-index の検索で、文書の概要文にする。 | - |
      | files | ファイル一覧 | array | - | - | - | 設定ファイルを持たないサブシステムは持たない。 | 実装で、設定を読み込むファイルとその配置先を決める。<br>生成で、ファイル一覧の表にする。 | - |
      | files[].file | ファイル | string | 必須 | - | - | リポジトリの直下からの相対パス・ホーム起点の絶対パス・ファイル名のいずれか。 | 実装で、設定を読み込むファイルのパスにする。 | - |
      | files[].manages | 管理する値 | string | 必須 | - | - | そのファイルで管理する値の範囲。 | 実装で、ファイルごとに持たせる値を決める。 | - |
      | files[].notes | 補足 | string | - | - | - | ファイルの前提（読み込む順番・git 管理の対象外 等）。 | 実装で、ファイルを読み込む順番と、無いときの扱いを決める。 | - |
      | settings | キー一覧 | array | - | - | - | 設定のキー 1 つ = 1 要素。 | 実装で、設定を読み込む型と既定値にする。<br>生成で、キー一覧の表にする。 | - |
      | settings[].key | キー | string | 必須 | - | - | 階層はドットで結ぶ（`logging.level`）。配列の要素の子は `parent[].child`。 | 実装で、設定ファイルから値を取り出すキーにする。<br>設計で、ほかの設計書の参照（`settings[logging.level]`）からキーを指す。 | - |
      | settings[].title | 論理名 | string | 必須 | - | - | 業務用語。 | 生成で、表の論理名にする。 | - |
      | settings[].file | ファイル | string | 必須 | - | - | このキーを持つファイル（`files` の `file`）。 | 実装で、キーを読み込むファイルにする。 | - |
      | settings[].type | 型 | string | 必須 | - | - | 取りうる値が限られるときはリテラルの列挙。 | 実装で、値の型と検証にする。 | - |
      | settings[].required | 必須 | boolean | - | - | - | 省けない項目なら `true`。 | 実装で、無いときにエラーにするかを決める。 | - |
      | settings[].default | 既定値 | string | - | - | - | 必須のキーには記載しない。 | 実装で、キーが無いときの値にする。 | - |
      | settings[].description | 説明 | string | 必須 | - | - | 設定の値が何を決めるか。 | 実装で、設定の値を読み込む処理と、値で変わる挙動を決める。<br>生成で、表の説明にする。 | - |
      | settings[].missing | 欠落時の挙動 | string | - | - | - | 必須のキーが無いときの挙動（`起動時にエラー` 等）。 | 実装で、必須のキーが無いときの処理にする。<br>テストで、キーが無いときのケースにする。 | - |
      | settings[].env_var | 環境変数名 | string | - | - | - | 同じ値を上書きする環境変数。 | 実装で、値を上書きする環境変数の名前にする。 | - |
      | settings[].secret | 秘密 | boolean | - | - | - | 秘密の値か。秘密なら例・実値を記載せず、表示を伏せる。 | 実装で、ログ・画面で値を伏せる。<br>生成で、例と実値を出さない。 | - |
      | settings[].reload | 反映 | string | - | `immediate` / `reload` / `restart` | - | `immediate`（即時）/ `reload`（再読み込み）/ `restart`（再起動）。 | 実装で、値を変えたときに再読み込みするか、再起動が要るかを決める。<br>反映作業で、再起動の作業が要るかを判断する。 | - |
      | settings[].allowed | 許す値や範囲 | string | - | - | - | 許す値の候補や数値の範囲。 | 実装で、値の検証の範囲にする。<br>テストで、範囲の外の値のケースにする。 | - |
      | settings[].refs | 関連 | array | - | - | - | 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。 | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | settings[].decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | settings[].reason | 理由 | string | - | - | - | そうしている理由。参照する側の判断が変わるものだけを記載する。 | レビューで、理由が今も成り立つかと、同じ判断を変える変更が無いかを確認する。 | - |
      | settings[].status | 状態 | string | - | `planned` / `implemented` / `deprecated` / `removed` | - | 項目の状態で、`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）のどれか。記載しなければ実装済みとして扱う。 | 実装で、`planned` の項目を作る対象にし、`deprecated`・`removed` の項目を新しく使用しない。<br>生成で、状態の表示にする。 | - |
      | settings[].visibility | 公開 | string | - | `user` / `developer` | - | Pages に出すか（`user` はユーザー向けで Pages に出し、`developer` は開発者向けで dev-docs の画面だけで出す）。記載しなければ親の値を引き継ぎ、最上位の既定は `developer`。 | 生成で、Pages に出すかを決める。 | - |
      | settings[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。 | - |
      | overrides | 環境ごとの差分 | array | - | - | - | 環境ごとのファイルが共通の同名キーを上書きする値。 | 実装で、環境ごとのファイルが上書きする値にする。<br>生成で、環境ごとの差分の表にする。 | - |
      | overrides[].file | ファイル | string | 必須 | - | - | `settings.{環境}.yaml` など。 | 実装で、上書きするファイルにする。 | - |
      | overrides[].key | キー | string | 必須 | - | - | 上書きする設定のキー。 | 実装で、上書きするキーにする。 | - |
      | overrides[].value | 値 | string | 必須 | - | - | その環境での値。 | 実装で、その環境での値にする。 | - |
      | overrides[].description | 説明 | string | - | - | - | その環境で上書きする理由。 | レビューで、上書きする理由が環境の違いに対応しているかを確認する。 | - |
      | overrides[].notes | 補足 | string | - | - | - | 上書きの前提（有効になる条件・ほかの上書きとの順番 等）。 | 実装で、上書きを有効にする条件を決める。 | - |
      | refs | 関連 | array | - | - | - | 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。 | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | settings[].title | 設計書の中で一意にする。 | - | - |
      | settings[].reason | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | settings[].notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: CFG-1
      title: '設定: バックエンド'
      lead: バックエンドの設定値一覧。
      files:
      - file: config/settings.yaml
        manages: 共通の設定値（秘匿情報を含む）
        notes: git 管理外
      settings:
      - key: port
        title: 待受ポート
        file: config/settings.yaml
        type: int
        required: false
        default: '8765'
        description: HTTP API の待受ポート
        reload: restart
        visibility: user
      ```
