# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-module
kind: template
name: "テンプレート: モジュール構成"
description: サブシステムと分類 1 つ分の構成要素を記載するモジュール構成の書式を定め、モジュール構成を作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:サブシステム
  - name: topic:テンプレート
  - name: topic:モジュール
  - name: topic:構成
    main: true
  - name: topic:要素
  - name: action:分類
status: current
visibility: internal
rev: 4
items:
  - id: overview
    name: 概要
    body: |-
      物理ファイル 1 つ分の構成要素（データモデル / クラス / 関数 / 関数型 / 定数 / 画面・コンポーネント / フック / ストア / スタイル）。
      設計書の中を横断する一覧（ユースケース・役割・コンテナ・種別・名前・概要）は、各要素の項目から生成する。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 ファイル = 物理ファイル 1 つにする。
      - 全ての要素の `container` は同じ物理ファイルを指す。
      - 配置場所は `モジュール構成/{container}.yaml` にする。
      - 分類の構成図と分類全体の決まりは、分類をまとめる設計書に配置する。
      - 分類をまとめる設計書は `モジュール構成/分類/` の下に配置し、要素を持たず `diagrams`・`notes` だけを持つ。
      - ファイルの配置はフォルダ構成の設計書に記載する。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | title | タイトル | string | 必須 | - | pattern: `^.+ / .+$` | `{サブシステム名} / {分類名}`（物理ファイルの設計書は `{サブシステム名} / {分類名} / {物理ファイルの名前}`）。 | 生成で、ページの見出しにする。<br>dev-docs の検索で、文書の名前にする。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>dev-docs の検索で、文書の概要文にする。 | - |
      | test_files | 対応テストファイル | array | - | - | maxItems: `1` | 属する物理ファイルごとの単体テストのファイル（1 物理ファイル = 1 テストファイル、規約『V字モデル』）。<br>テストを作ったときに記入する（設計の時点では空でよい）。 | テストで、単体テストを作るファイルにする。<br>検査で、テストのファイルと単体テストの関数があるかを確認する。 | - |
      | external_test_files | 対応疎通テストファイル | array | - | - | - | 疎通テスト（`connectivity_tests`）を持つ関数・メソッドの、外部疎通テストのファイル（`tests/external/` の下）。<br>疎通テストを作ったときに記入する（設計の時点では空でよい）。 | テストで、外部疎通のテストを作るファイルにする。<br>検査で、テストのファイルと疎通テストの関数があるかを確認する。 | - |
      | diagrams | 構成図 | array | - | - | - | 矢印で繋がる塊 1 つ = 1 枚の図。 | 生成で、構成図にする。<br>レビューで、要素どうしの依存の向きを確認する。 | - |
      | diagrams[].name | 塊の論理名 | string | 必須 | - | - | 図が 1 枚なら `全体`。 | 実装で、ソースコードの名前にする。<br>設計で、ほかの設計書の参照（`functions[main]`）から要素を指す。 | - |
      | diagrams[].diagram | 図 | string | 必須 | - | - | Mermaid の `classDiagram`。 | 生成で、クラス図にする。 | - |
      | data_models | データモデル | array | - | - | - | プロパティ主体の型（dataclass・BaseModel・TypedDict・TS の type 等）。 | 実装で、プロパティ主体の型（dataclass・BaseModel・TypedDict 等）にする。<br>生成で、要素ごとの節にする。 | - |
      | data_models[].name | 物理名 | string | 必須 | - | - | ソースコード上の名前。項目のパスで指すときのキー。 | 実装で、ソースコードの名前にする。<br>設計で、ほかの設計書の参照（`functions[main]`）から要素を指す。 | - |
      | data_models[].title | 論理名 | string | 必須 | - | - | 図と見出しに出す名前。 | 生成で、図と見出しの名前にする。 | - |
      | data_models[].container | コンテナ | string | 必須 | - | - | 所属ファイル。 | 実装で、要素を書くファイルにする。<br>検査で、設計書の全ての要素が同じ物理ファイルを指すかを確認する。 | `oauth/service.ts` |
      | data_models[].usecase | ユースケース | string | - | - | - | 属するユースケース名。複数で共用するものは `共通`。 | 生成で、ユースケースごとの一覧にする。<br>レビューで、ユースケースの変更が及ぶ要素を探す。 | - |
      | data_models[].role | 役割 | string | - | - | - | 設計上のパターン・ロールの短いラベル（`DTO` / `リポジトリ` / `サービス` 等）。 | レビューで、役割（DTO・リポジトリ・サービス）に合う責務と依存の向きかを確認する。 | - |
      | data_models[].summary | 概要 | string | 必須 | - | pattern: `^[^\n]+$`, minLength: `1` | 1 行で何を担うか。 | 生成で、要素の一覧の説明にする。 | - |
      | data_models[].description | 説明 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 実装で、要素の前提と挙動を参照する。 | - |
      | data_models[].inherits | 継承元 | string | - | - | - | - | 実装で、継承・実装する型にする。 | - |
      | data_models[].properties | プロパティ | array | - | - | - | - | 実装で、型のフィールドにする。 | - |
      | data_models[].properties[].name | プロパティ名 | string | 必須 | - | - | - | 実装で、コード上の名前にする。 | - |
      | data_models[].properties[].title | 論理名 | string | - | - | - | - | 生成で、表の論理名にする。 | - |
      | data_models[].properties[].type | 型 | string | 必須 | - | - | 取りうる値が有限の文字列はリテラル型で列挙する。 | 実装で、型にする。 | - |
      | data_models[].properties[].access | 可視性 | string | - | - | - | `public` / `protected` / `private`。可視性の無い言語は `公開` / `内部 (_)` / `非公開 (__)`。 | 実装で、可視性（公開・内部）にする。 | - |
      | data_models[].properties[].default | デフォルト | string | - | - | - | 生成時の値。無いときは記載しない。 | 実装で、省いたときの値にする。 | - |
      | data_models[].properties[].description | 説明 | string | 必須 | - | - | - | 実装で、意味を参照する。 | - |
      | data_models[].properties[].example | 例 | string | - | - | - | - | テストで、Factory の値にする。 | - |
      | data_models[].properties[].notes | 補足 | string | - | - | - | - | 実装で、前提を参照する。 | - |
      | data_models[].methods | メソッド | array | - | - | - | - | 実装で、型のメソッドにする。 | - |
      | data_models[].methods[].name | 物理名 | string | 必須 | - | - | ソースコード上の名前。項目のパスで指すときのキー。 | 実装で、ソースコードの名前にする。<br>設計で、ほかの設計書の参照（`functions[main]`）から要素を指す。 | - |
      | data_models[].methods[].title | 論理名 | string | 必須 | - | - | 図と見出しに出す名前。 | 生成で、図と見出しの名前にする。 | - |
      | data_models[].methods[].container | コンテナ | string | - | - | - | 所属ファイル。 | 実装で、要素を書くファイルにする。<br>検査で、設計書の全ての要素が同じ物理ファイルを指すかを確認する。 | `oauth/service.ts` |
      | data_models[].methods[].usecase | ユースケース | string | - | - | - | 属するユースケース名。複数で共用するものは `共通`。 | 生成で、ユースケースごとの一覧にする。<br>レビューで、ユースケースの変更が及ぶ要素を探す。 | - |
      | data_models[].methods[].role | 役割 | string | - | - | - | 設計上のパターン・ロールの短いラベル（`DTO` / `リポジトリ` / `サービス` 等）。 | レビューで、役割（DTO・リポジトリ・サービス）に合う責務と依存の向きかを確認する。 | - |
      | data_models[].methods[].summary | 概要 | string | 必須 | - | pattern: `^[^\n]+$`, minLength: `1` | 1 行で何を担うか。 | 生成で、要素の一覧の説明にする。 | - |
      | data_models[].methods[].description | 説明 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 実装で、要素の前提と挙動を参照する。 | - |
      | data_models[].methods[].kind | 種別 | string | 必須 | `関数` / `メソッド` / `フック` | - | - | 実装で、要素の種別（クラス・抽象クラス・インタフェース・フック 等）を決める。 | - |
      | data_models[].methods[].inherits | 継承元 | string | - | - | - | 実装する関数型・インタフェースの論理名（別の設計書なら参照）。 | 実装で、継承・実装する型にする。 | - |
      | data_models[].methods[].scope | 公開範囲 | string | - | `public` / `internal` | - | `public`（外から呼ぶ）/ `internal`（先頭 `_` などの内部の関数）。 | 実装で、名前の先頭の `_` の有無と公開の範囲にする。<br>レビューで、外から呼ばれる関数だけが `public` かを確認する。 | - |
      | data_models[].methods[].is_async | 非同期 | boolean | - | - | - | 非同期関数か。 | 実装で、`async` の関数にするかを決める。 | - |
      | data_models[].methods[].thread_safe | 並行で呼べる | boolean | - | - | - | 並行で呼んでよいか。 | 実装で、ロックの要否を決める。<br>呼び出し元の実装で、並行で呼んでよいかを判断する。 | - |
      | data_models[].methods[].side_effects | 副作用 | string | - | - | - | 引数の書き換え・外への書き込み。 | 実装で、引数の書き換えと外への書き込みにする。<br>単体テストで、副作用を確認する項目にする。 | - |
      | data_models[].methods[].args | 引数 | array | - | - | - | 引数の表。引数の無い関数は持たない。 | 実装で、関数の引数にする。<br>呼び出し元の実装で、渡す値を決める。 | - |
      | data_models[].methods[].args[].name | 引数名 | string | 必須 | - | - | コード上の引数名。 | 実装で、コード上の名前にする。 | - |
      | data_models[].methods[].args[].title | 論理名 | string | - | - | - | - | 生成で、表の論理名にする。 | - |
      | data_models[].methods[].args[].type | 型 | string | 必須 | - | - | 実装言語の型名。取りうる値が限られるときはリテラルの列挙で記載する。 | 実装で、型にする。 | - |
      | data_models[].methods[].args[].required | 必須 | boolean | - | - | - | - | 実装で、省けるかを決める。 | - |
      | data_models[].methods[].args[].default | デフォルト | string | - | - | - | 省略時の値。必須の引数には記載しない。 | 実装で、省いたときの値にする。 | - |
      | data_models[].methods[].args[].passing | 指定方法 | string | - | `positional` / `keyword` / `injected` | - | `positional`（位置）/ `keyword`（キーワード引数）/ `injected`（依存の注入）。 | 実装で、位置・キーワード・依存の注入のどれで渡すかを決める。 | - |
      | data_models[].methods[].args[].description | 説明 | string | 必須 | - | - | - | 実装で、意味を参照する。 | - |
      | data_models[].methods[].args[].notes | 補足 | string | - | - | - | - | 実装で、前提を参照する。 | - |
      | data_models[].methods[].args_example | 引数例 | string | - | - | - | 呼び出しのコード 1〜数行（コードブロック）。 | 呼び出し元の実装で、呼び出しの見本にする。 | - |
      | data_models[].methods[].returns | 戻り値 | object | - | - | - | - | 実装で、戻り値にする。 | - |
      | data_models[].methods[].returns.type | 型 | string | 必須 | - | - | void / None も記載する。 | 実装で、戻り値の型にする。 | - |
      | data_models[].methods[].returns.description | 説明 | string | 必須 | - | - | - | 呼び出し元の実装で、戻り値の意味を参照する。 | - |
      | data_models[].methods[].returns.notes | 補足 | string | - | - | - | - | 実装で、戻り値の前提を参照する。 | - |
      | data_models[].methods[].returns_example | 戻り値例 | string | - | - | - | 返り値の実形（コードブロック）。void / None は持たない。 | 単体テストで、期待する戻り値の見本にする。 | - |
      | data_models[].methods[].process | 処理 | string | - | - | - | 番号付きのステップ。1 ステップ = 意味のある処理の単位。 | 実装で、処理の順と分岐にする。<br>レビューで、実装の処理が設計の順と一致するかを確認する。 | - |
      | data_models[].methods[].exceptions | 例外 | array | - | - | - | 送出する例外。 | 実装で、送出する例外にする。<br>単体テストで、例外ごとのケースにする。 | - |
      | data_models[].methods[].exceptions[].name | 例外名 | string | 必須 | - | - | 送出する例外のクラス名。 | 実装で、例外のクラスにする。 | - |
      | data_models[].methods[].exceptions[].condition | 発生条件 | string | 必須 | - | - | 送出する条件。 | 実装で、例外を送出する条件にする。 | - |
      | data_models[].methods[].exceptions[].message | メッセージ | string | - | - | - | - | 実装で、例外のメッセージにする。 | - |
      | data_models[].methods[].exceptions[].notes | 補足 | string | - | - | - | - | 実装で、例外の前提を参照する。 | - |
      | data_models[].methods[].test_setup | セットアップ | array | - | - | - | 複数のテストが共有する準備。 | 単体テストで、ケースが共有する fixture にする。 | - |
      | data_models[].methods[].test_setup[].name | セットアップ | string | 必須 | - | - | - | 単体テストで、fixture の名前にする。 | - |
      | data_models[].methods[].test_setup[].description | 説明 | string | 必須 | - | - | - | 単体テストで、準備する内容にする。 | - |
      | data_models[].methods[].test_setup[].notes | 補足 | string | - | - | - | fixture の物理名など。 | 単体テストで、fixture の物理名を参照する。 | - |
      | data_models[].methods[].unit_tests | 単体テスト | array | - | - | - | 単体テストのケース。 | 単体テストで、ケースごとのテスト関数にする。<br>検査で、テストのファイルに関数があるかを確認する。 | - |
      | data_models[].methods[].unit_tests[].name | テスト名 | string | 必須 | - | pattern: `^test_[a-z0-9_]+$` | テスト関数の名前。 | 単体テストで、テスト関数の名前にする。 | - |
      | data_models[].methods[].unit_tests[].case | 正常/異常 | string | 必須 | `正常` / `異常` | - | - | 単体テストで、正常と異常のケースを分ける。 | - |
      | data_models[].methods[].unit_tests[].summary | 概要 | string | 必須 | - | - | - | 単体テストで、関数の docstring の要約にする。 | - |
      | data_models[].methods[].unit_tests[].condition | 条件 | string | 必須 | - | - | テストの条件。Mock の応答の設定もここに記載する。 | 単体テストで、入力と Mock の応答の設定にする。 | - |
      | data_models[].methods[].unit_tests[].mock | Mock | string | 必須 | - | - | 差し替えるファイル外・プロセス外の依存だけ。差し替えないときも `なし` と記載する。 | 単体テストで、差し替える依存にする。 | - |
      | data_models[].methods[].unit_tests[].expected | 期待値 | string | 必須 | - | - | 戻り値・送出する例外と、Mock に渡った引数・呼び出しの有無。 | 単体テストで、確認する戻り値・例外・Mock に渡った引数にする。 | - |
      | data_models[].methods[].unit_tests[].exception | 対応する例外 | string | - | - | - | 自関数で送出する例外を確認する行のとき、対応する例外の行の発生条件の要旨。 | レビューで、例外の行ごとにテストがあるかを確認する。 | - |
      | data_models[].methods[].unit_tests[].notes | 補足 | string | - | - | - | - | 単体テストで、ケースの前提を参照する。 | - |
      | data_models[].methods[].connectivity_tests | 疎通テスト | array | - | - | - | 実 API を呼ぶラッパーの関数だけが持つ。使用するパラメータの値の組を 1 組 = 1 テストで並べる。 | 外部疎通のテストで、パラメータの組ごとのテスト関数にする。<br>検査で、疎通テストのファイルに関数があるかを確認する。 | - |
      | data_models[].methods[].connectivity_tests[].name | テスト名 | string | 必須 | - | pattern: `^test_ext_[a-z0-9_]+$` | `test_ext_{関数の物理名}_when_{パラメータ値}`。 | 外部疎通のテストで、テスト関数の名前にする。 | - |
      | data_models[].methods[].connectivity_tests[].api | 対象 API | string | 必須 | - | - | - | 外部疎通のテストで、呼ぶ API にする。 | - |
      | data_models[].methods[].connectivity_tests[].summary | 概要 | string | 必須 | - | - | - | 外部疎通のテストで、関数の docstring の要約にする。 | - |
      | data_models[].methods[].connectivity_tests[].checks | 確認内容 | string | 必須 | - | - | 認証・エンドポイント・使用するパラメータの値・応答の形式など。 | 外部疎通のテストで、確認する項目にする。 | - |
      | data_models[].methods[].connectivity_tests[].cost | 料金・副作用 | string | 必須 | - | - | 1 回あたりの料金と副作用。無いときも `なし` と記載する。 | 実行で、実行の前に料金と副作用からユーザーの確認が要るかを判断する。 | - |
      | data_models[].methods[].connectivity_tests[].notes | 補足 | string | - | - | - | - | 外部疎通のテストで、ケースの前提を参照する。 | - |
      | data_models[].methods[].callees | 呼び出し先 | array | - | - | - | - | 実装で、処理から呼ぶ関数・メソッドを参照する。<br>レビューで、呼び出しの依存の向きを確認する。<br>設計で、変更の影響を調べるときに呼び出し元を逆にたどる。 | - |
      | data_models[].methods[].refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
