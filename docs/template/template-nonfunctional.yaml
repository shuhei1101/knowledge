# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-nonfunctional
kind: template
name: "テンプレート: 非機能要件"
description: 外部コンポーネントの制約を踏まえてアプリとして守る値を記載する非機能要件の書式を定め、非機能要件を作る・更新するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:部品
  - name: topic:アプリ
  - name: topic:テンプレート
  - name: topic:制約
  - name: topic:要件
    main: true
status: current
visibility: internal
rev: 5
items:
  - id: overview
    name: 概要
    body: |-
      外部コンポーネントの制約を踏まえてアプリとして守る値（コンポーネントをまたぐ要件だけ）。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 プロジェクト 1 ファイルにする。
      - 1 コンポーネント内で閉じる要件は、その変更の計画に記載する（判定フローチャート『非機能要件のレイヤー』）。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>dev-docs の配信で、文書の公開範囲のメタデータにする。 | - |
      | title | タイトル | string | 必須 | - | - | `非機能要件`。 | 生成で、ページの見出しにする。<br>dev-docs の検索で、文書の名前にする。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>dev-docs の検索で、文書の概要文にする。 | - |
      | requirements | 一覧 | array | 必須 | - | minItems: `1` | 外部の制約から逆算したアプリの値。一覧の表は各要素から生成する。 | 実装で、守る値を参照する。<br>生成で、非機能要件の一覧の表と要素ごとのページにする。 | - |
      | requirements[].id | ID | string | 必須 | - | pattern: `^[A-Za-z0-9_-]+$` | 設計書の中で一意な要素の ID。1 要素 1 ページにするときのページの ID になる。 | 生成で、要素を 1 ページにするときのページの ID にする。<br>設計で、ほかの設計書の参照から要素を指す。 | `NFR-1` |
      | requirements[].name | 項目 | string | 必須 | - | - | 何についての値か。1 項目 = 1 要素。 | 生成で、表の行の名前とページの見出しにする。 | - |
      | requirements[].english_name | 英語名 | string | - | - | pattern: `^[a-z0-9_]+$` | テスト関数・ファイルの名前に使用する。 | テストで、テストの関数・ファイルの名前にする。 | - |
      | requirements[].category | カテゴリ | string | 必須 | - | - | 性能 / レート制限 / 可用性 / 耐障害 / セキュリティ / コスト / 保守性 / 動作環境 等。<br>動作環境は対応端末・OS・ブラウザ・画面サイズ・入力方式・通信を 1 項目ずつ配置する。 | 生成で、一覧の分類にする。<br>レビューで、カテゴリごとに要件の漏れが無いかを確認する。 | - |
      | requirements[].external_constraint | 外部の制約 | string | 必須 | - | - | 外部が示す上限・下限・保証値。自主基準は `制限なし`、分からなければ `未確定`。 | レビューで、決定値が外部の制約を超えていないかを確認する。 | - |
      | requirements[].source_kind | 出所種別 | string | 必須 | `外部 API の制限` / `外部ライブラリの制限` / `実行基盤の制限` / `PC 性能` / `ユーザー要望` / `制限なし` / `未確定` | - | 6 種類を 1 つずつ突き合わせ、どれにも該当しないときだけ `制限なし`。 | レビューで、外部の制約の出所を全ての種類と突き合わせたかを確認する。 | - |
      | requirements[].source | 出所 | string | - | - | - | 外部の制約を記載した設計書の参照・資料の URL・ユーザーの回答コメントの URL。<br>設計書の参照は `{ID}#{項目のパス}` で記載する。 | レビューで、外部の制約の出所をたどって値を確認する。 | - |
      | requirements[].value | 決定値 | string | 必須 | - | - | 実装とテストが参照する値。まだ決められないときは `未確定`。 | 実装で、上限・待ち・回数などの値にする。<br>テストで、境界の値にする。 | - |
      | requirements[].unit | 単位 | string | - | - | - | - | 実装で、値の単位にする。 | - |
      | requirements[].rationale | 根拠 | string | 必須 | - | - | 外部の制約そのままでない理由。未確定なら何が分かれば決まるか。 | レビューで、外部の制約そのままでない値の根拠を確認する。<br>設計で、値を変えるときに根拠が今も成り立つかを判断する。 | - |
      | requirements[].measurement | 測り方 | string | - | - | - | - | テストで、値を測る方法にする。 | - |
      | requirements[].test_file | 対応テスト | string | - | - | pattern: `^tests/.+` | 非機能要件テストのファイル（`tests/nfr/test_{英語名}.py`）。測れない項目は持たない（規約『V字モデル』）。 | テストで、非機能要件のテストを作るファイルにする。<br>検査で、テストのファイルがあるかを確認する。 | - |
      | requirements[].verification | 確認の記録 | object | - | - | - | 確認した結果。 | レビューで、実機で確認した結果を確認する。 | `{date: '2026-10-05', device: Windows 11 の PC の Edge, result: 合格, version: Edge 140}` |
      | requirements[].verification.device | 端末 | string | 必須 | - | - | 確認した端末（OS・ブラウザなど）。 | 保守で、確認した端末と違う端末で確認し直すかを判断する。 | - |
      | requirements[].verification.version | バージョン | string | 必須 | - | - | 確認した端末のバージョン（OS・ブラウザのバージョン）。 | 保守で、確認したバージョンと違うバージョンで確認し直すかを判断する。 | - |
      | requirements[].verification.date | 確認日 | string | 必須 | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | `YYYY-MM-DD`。 | 保守で、確認の記録が古くなっていないかを判断する。 | - |
      | requirements[].verification.result | 合否 | string | 必須 | `合格` / `不合格` | - | - | 実装で、不合格の要件を修正する対象にする。 | - |
      | requirements[].verification.detail | 確認内容 | string | - | - | - | 不合格のとき、起きた事象。 | 実装で、不合格の要件を修正するときに起きた事象を参照する。 | - |
      | requirements[].overflow | 超過時の挙動 | string | - | - | - | 決定値を超えたときに何が起きるか（分割 / 待機 / リトライ / エラー）。 | 実装で、値を超えたときの処理（分割・待機・リトライ・エラー）にする。<br>テストで、値を超えたときのケースにする。 | - |
      | requirements[].breakdown | 内訳 | array | - | - | - | 決定値に至る内訳（外部の上限からの差し引き、または内側の値の合計）。内訳の無い項目は持たない。 | レビューで、決定値が内訳から導けるかを確認する。 | - |
      | requirements[].breakdown[].part | 区分 | string | 必須 | - | - | - | レビューで、内訳の区分に漏れが無いかを確認する。 | - |
      | requirements[].breakdown[].value | 値 | string | 必須 | - | - | - | レビューで、内訳の値の合計・差し引きが決定値と一致するかを確認する。 | - |
      | requirements[].breakdown[].notes | 補足 | string | - | - | - | なぜその値か。 | レビューで、内訳の値の根拠を確認する。 | - |
      | requirements[].tests | 非機能要件テスト | array | - | - | - | 測れない項目・未確定の項目は持たない。 | テストで、非機能要件のテストのケースにする。<br>検査で、テストのファイルに関数があるかを確認する。 | - |
      | requirements[].tests[].name | テスト名 | string | 必須 | - | pattern: `^test_[a-z0-9_]+$` | `test_{英語名}_when_{条件}`（条件分岐の無い唯一のケースは `test_{英語名}`）。 | テストで、テスト関数の名前にする。 | - |
      | requirements[].tests[].summary | 概要 | string | 必須 | - | - | - | テストで、関数の docstring の要約にする。 | - |
      | requirements[].tests[].condition | 条件 | string | 必須 | - | - | 入力・負荷・回数を数値で。決定値の境界を 1 行以上入れる。 | テストで、入力・負荷・回数にする。 | - |
      | requirements[].tests[].measurement | 測定方法 | string | 必須 | - | - | - | テストで、測定の方法にする。 | - |
      | requirements[].tests[].expected | 期待値 | string | 必須 | - | - | 合否の判定の基準。 | テストで、合否を判定する基準にする。 | - |
      | requirements[].tests[].notes | 補足 | string | - | - | - | - | テストで、ケースの前提を参照する。 | - |
      | requirements[].refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | requirements[].decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | requirements[].status | 状態 | string | - | `planned` / `implemented` / `deprecated` / `removed` | - | 項目の状態で、`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）のどれか。記載しなければ実装済みとして扱う。 | 実装で、`planned` の項目を作る対象にし、`deprecated`・`removed` の項目を新しく使わない。<br>生成で、状態の表示にする。 | - |
      | requirements[].visibility | 公開 | string | - | `user` / `developer` | - | Pages に出すか（`user` はユーザー向けで Pages に出し、`developer` は開発者向けで dev-docs の画面だけで出す）。記載しなければ親の値を引き継ぎ、最上位の既定は `developer`。 | 生成で、Pages に出すかを決める。 | - |
      | requirements[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにした節にする。 | - |
      | refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにした節にする。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。<br>対象そのものが変わったときだけ書き換える。 | 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。 | 仕様を冒頭リードに記載している。仕様は各項目へ分ける |
      | requirements | 決まっていない項目も同じ一覧に配置し、決定値を `未確定` にする。<br>未確定だった項目が決まったら同じ要素を書き換える。 | - | - |
      | requirements[].id | 並びの順に `NFR-{番号}` を振る。<br>新しく追加する要素には、既にある番号の最大の次を振る。<br>並べ替えても変えない。 | - | - |
      | requirements[].overflow | 黙って切り捨てない。 | - | - |
      | requirements[].notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例 1
    body: |-
      ```yaml
      id: NFR-1
      title: 非機能要件
      lead: 外部の制約から逆算したアプリの決定値。
      requirements:
      - id: NFR-1
        name: 入力トークン上限
        english_name: input_limit
        category: 性能
        external_constraint: 100 万トークン
        source_kind: 外部 API の制限
        source: API-2#
        value: 10 万
        unit: トークン
        rationale: 内部のシステムプロンプトと出力枠を差し引く
        measurement: API へ渡ったトークン数を数える
        test_file: tests/nfr/test_input_limit.py
        overflow: |-
          上限を超える入力は送信の前に分割する。
          分割できない単一のメッセージが超えたときは古い履歴から切り詰め、それでも収まらなければエラーにして呼び出し元へ返却する。
        breakdown:
        - part: 外部の上限
          value: 1,000,000
          notes: モデルのコンテキストウィンドウ
        - part: 出力枠
          value: 64,000
          notes: 最大出力トークン
        - part: アプリの決定値
          value: 100,000
          notes: 入力として受け付ける上限
        tests:
        - name: test_input_limit
          summary: 上限ちょうどの入力
          condition: 100,000 トークンの入力を 1 回送る
          measurement: API へ渡ったトークン数
          expected: 分割されずに 1 回で送信される
        - name: test_input_limit_when_over
          summary: 上限を超えた入力
          condition: 100,001 トークンの入力を 1 回送る
          measurement: API へ渡ったトークン数
          expected: 2 回に分かれ、各回が 100,000 以下
      - id: NFR-2
        name: 応答の待ちの上限
        english_name: response_wait_limit
        category: 耐障害
        external_constraint: 制限なし
        source_kind: 制限なし
        value: '30'
        unit: 秒
        rationale: 内側の待ち 2 つの合計に余裕を追加する（規約『資源の値の決め方』の入れ子の待ち）
        measurement: 内側の待ちを両方とも上限まで遅らせた要求を 1 回送り、応答までの時間を測る
        overflow: 上限を超えたら呼び出し元へタイムアウトのエラーを返却する。回復は呼び出し元のリトライで待つ
        breakdown:
        - part: 内側の待ち（外部 API の呼び出し）
          value: '10'
          notes: 外部 API の実測 p99.9 + 余裕
        - part: 内側の待ち（保存）
          value: '10'
          notes: 保存の実測 p99.9 + 余裕
        - part: 余裕
          value: '10'
          notes: 実測が無いため内側の待ちの合計の 50% を仮に設定する
        - part: アプリの決定値
          value: '30'
          notes: 内側の待ちの合計 + 余裕
      - id: NFR-3
        name: 同時接続数
        category: 性能
        external_constraint: 未確定
        source_kind: 未確定
        value: 未確定
        rationale: 想定利用者数が決まる Issue「利用者管理」の要件が確定してから決める
      - id: NFR-4
        name: 対応ブラウザ
        category: 動作環境
        external_constraint: Chrome と Edge の最新版
        source_kind: ユーザー要望
        source: https://github.com/{owner}/{repo}/issues/{番号}#issuecomment-{ID}
        value: Chrome と Edge の最新版
        rationale: 利用者が社内の PC だけで使用するため
        measurement: Chrome と Edge の実機で、全ての画面の操作を最後まで完了できるかを確認する
        verification:
          device: Windows 11 の PC の Edge
          version: Edge 140
          date: '2026-10-05'
          result: 合格
      - id: NFR-5
        name: 最小画面幅
        english_name: min_viewport_width
        category: 動作環境
        external_constraint: '360'
        source_kind: ユーザー要望
        source: https://github.com/{owner}/{repo}/issues/{番号}#issuecomment-{ID}
        value: '360'
        unit: px
        rationale: スマホでは閲覧できれば足りる
        measurement: ブラウザの表示幅を変えて全ての画面を開き、横スクロールの有無を確認する
        test_file: tests/nfr/test_min_viewport_width.py
        tests:
        - name: test_min_viewport_width
          summary: 最小幅での表示
          condition: 表示幅 360px で全ての画面を開く
          measurement: 文書の横幅と表示幅
          expected: 全ての画面で文書の横幅が 360px 以下
      ```
  - id: example-sample-02
    name: 記載例 2
    body: |-
      ```yaml
      id: NFR-2
      title: 非機能要件
      lead: 外部の制約から逆算したゲームの決定値。
      requirements:
      - id: NFR-1
        name: 対応端末
        category: 動作環境
        external_constraint: Windows の PC と Nintendo Switch
        source_kind: ユーザー要望
        source: https://github.com/{owner}/{repo}/issues/{番号}#issuecomment-{ID}
        value: Windows の PC と Nintendo Switch
        rationale: 企画の工程で決めた販売先
        measurement: 各端末の実機で、タイトル画面から 1 ステージを最後まで遊べるかを確認する
        verification:
          device: Nintendo Switch の実機
          version: システムソフトウェア 19.0.0
          date: '2026-10-05'
          result: 合格
      - id: NFR-2
        name: 入力方式
        english_name: input_devices
        category: 動作環境
        external_constraint: キーボードとゲームパッド
        source_kind: ユーザー要望
        source: https://github.com/{owner}/{repo}/issues/{番号}#issuecomment-{ID}
        value: キーボードとゲームパッド
        rationale: 対応端末の標準の入力に合わせる
        measurement: 論理操作ごとに、割り当てたキーとボタンの入力を送信する
        test_file: tests/nfr/test_input_devices.py
        tests:
        - name: test_input_devices
          summary: 全ての論理操作の割り当て
          condition: 論理操作ごとに、キーボードとゲームパッドの割り当てを 1 回ずつ送信する
          measurement: ゲームが受け取った論理操作
          expected: 全ての論理操作を、どちらの入力からも受け取る
      - id: NFR-3
        name: 通信
        category: 動作環境
        external_constraint: 未確定
        source_kind: 未確定
        value: 未確定
        rationale: オンラインで遊ぶ機能を持つかが企画の工程で決まってから決める
      ```
