# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-component
kind: template
name: "テンプレート: 部品設計"
description: 画面の要素が使用する React の部品 1 つの仕様（props・children・コールバック・variants・状態）を記載する部品設計の書式を定め、部品設計を作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:props
  - name: topic:テンプレート
  - name: topic:バリエーション
  - name: topic:仕様
  - name: topic:画面
  - name: topic:要素
  - name: topic:部品
    main: true
  - name: tool:react
  - name: action:設計
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      画面の要素が使用する部品 1 つの仕様（引数・スロット・イベント・CSS カスタムプロパティ・状態）。
      状態 1 つが Storybook のストーリー 1 つに該当する。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 ファイル = 1 部品にする。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | title | タイトル | string | 必須 | - | - | 日本語の部品名。ファイル名に合わせる。 | 生成で、ページの見出しにする。<br>project-index の検索で、文書の名前にする。 | `状態のバッジ` / `列見出し` |
      | lead | 冒頭リード | string | - | - | - | 部品が何を出すかを 1〜3 行で説明する。<br>初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。 | 生成で、ページの冒頭の説明にする。<br>project-index の検索で、文書の概要文にする。 | - |
      | implementation | 実装 | string | 必須 | - | pattern: `^[^#\s]+(#\S+)?$` | 部品の実装の場所。リポジトリの直下からのファイルのパスに、`#` と部品の名前（マクロ・コンポーネント）を続ける。 | 実装で、部品を修正するファイルとシンボルを決める。<br>レビューで、部品設計と実装の差分を突き合わせる。 | `src/app/components/macros.html#header_controls` |
      | story | Storybook | string | 必須 | - | pattern: `^[A-Za-z][A-Za-z0-9]*(/[A-Za-z][A-Za-z0-9]*)+$` | Storybook のストーリーのタイトル。 | 実装で、Storybook のストーリーのタイトルにする。<br>結合テストで、開くストーリーを決める。 | `Plan/StatusBadge` / `Common/Topbar` |
      | test_file | 対応テストファイル | string | - | - | pattern: `^tests/.+` | ストーリーを開いて確認する結合テストのファイル（規約『V字モデル』）。 | テストで、ストーリーを開いて確認する結合テストを作るファイルにする。<br>検査で、テストのファイルがあるかを確認する。 | `tests/integration/storybook/test_計画画面の部品.py` |
      | args | 引数 | array | - | - | - | 部品が受け取る値。引数 1 つ = 1 要素。 | 実装で、部品の引数とストーリーの `args` にする。<br>画面設計で、部品へ指定する値を決める。<br>生成で、引数の表にする。 | - |
      | args[].name | 名前 | string | 必須 | - | pattern: `^[A-Za-z_][A-Za-z0-9_]*(\[\])?(\.[A-Za-z_][A-Za-z0-9_]*(\[\])?)*$` | 実装の引数の名前。 | 実装で、引数の名前にする。<br>設計で、状態の `args` から引数を指す。 | `status` / `dep.unresolved` / `items[].label` |
      | args[].type | 型 | string | 必須 | - | - | `文字列` / `整数` / `数値` / `真偽値` / `列挙` / `オブジェクト` / `配列` / `オブジェクトの配列` / `部品`。 | 実装で、引数の型にする。 | `列挙` / `オブジェクトの配列` |
      | args[].required | 必須 | boolean | - | - | - | 省けない項目なら `true`。 | 実装で、引数を省けるかを決める。 | - |
      | args[].default | 既定値 | string | - | - | - | 省略したときの値。必須の引数には記載しない。 | 実装で、引数を省いたときの値にする。 | `false` / `なし（件数を出さない）` |
      | args[].choices | 選択肢 | string | - | - | - | 列挙の値と、値の範囲。 | 実装で、列挙の値と範囲の検証にする。 | `todo・paused・doing・done・dropped` / `0 以上` |
      | args[].component | 受ける部品 | string | - | - | pattern: `^(?:[A-Z]+-\d+(?:-\d+)?)?#(?:[^\s\[]\|\[[^\]]*\])*$` | 型が `部品` のとき、受け取れる部品設計（部品設計の `{ID}#`）。 | 実装で、引数に受け取る部品の型にする。 | `CMP-2#` |
      | args[].enabled_when | 有効になる条件 | string | - | - | - | 他の引数の値によって意味を持つときの条件。 | 実装で、引数を使用する条件にする。<br>テストで、条件を満たす状態と満たさない状態のストーリーにする。 | `` `filterable` が `true` のとき `` |
      | args[].description | 説明 | string | 必須 | - | - | 引数に指定する値が何を表すか。 | 画面設計で、引数に何を指定するかを決める。 | `行の状態。色とアイコンを決める` |
      | args[].status | 状態 | string | - | `planned` / `implemented` / `deprecated` / `removed` | - | 項目の状態で、`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）のどれか。記載しなければ実装済みとして扱う。 | 実装で、`planned` の項目を作る対象にし、`deprecated`・`removed` の項目を新しく使用しない。<br>生成で、状態の表示にする。 | - |
      | args[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。 | - |
      | slots | スロット | array | - | - | - | 使用する側が中身を差し込む場所。スロット 1 つ = 1 要素。 | 実装で、使用する側が中身を差し込む場所にする。 | - |
      | slots[].name | 名前 | string | 必須 | - | pattern: `^[A-Za-z_][A-Za-z0-9_]*$` | 名前の無いスロットは `default`。 | 実装で、スロットの名前にする。 | `default` / `actions` |
      | slots[].description | 説明 | string | 必須 | - | - | スロットに差し込む中身。 | 画面設計で、スロットに何を差し込むかを決める。 | `見出しの右に並べる操作のボタン` |
      | slots[].accepts | 差し込める部品 | array | - | - | - | 差し込める部品設計。どれでも差し込めるときは持たない。 | レビューで、差し込む部品が許されたものかを確認する。 | `[CMP-3#]` |
      | slots[].passes | スロットに渡る値 | string | - | - | - | 差し込んだ中身から使用できる値（Jinja2 の `caller()` の引数など）。 | 実装で、差し込んだ中身に指定する値にする。 | `` `caller(item)` の `item`（行 1 件） `` |
      | events | イベント | array | - | - | - | 部品が使用する側へ通知する操作。イベント 1 つ = 1 要素。 | 実装で、使用する側へ通知するイベントにする。 | - |
      | events[].name | イベント | string | 必須 | - | - | イベントの名前（`on{名前}` の props・`CustomEvent` の型名）。 | 実装で、イベントの名前にする。 | `並べ替え` / `詳細を開く` |
      | events[].when | 発火の条件 | string | 必須 | - | - | イベントを発火させる利用者の操作・状態の変化。 | 実装で、イベントを発火させる条件にする。<br>テストで、発火を確認する操作にする。 | `見出しの文字を押したとき` |
      | events[].value | 通知する値 | string | - | - | - | 使用する側が受け取る値と、その配置場所（`data-*` 属性など）。 | 実装で、通知する値とその配置先にする。 | `` key（`data-sort`） `` / `` issue（`data-issue`） `` |
      | events[].description | 説明 | string | 必須 | - | - | 使用する側がそのイベントで何をするか。 | 画面設計で、イベントを受けて何をするかを決める。 | `使用する側が 既定 → 昇順 → 降順 → 既定 と巡る` |
      | css_properties | CSS カスタムプロパティ | array | - | - | - | 使用する側が外観を変えるインターフェース。外観を外から変えるインターフェースを持たない部品は持たない。 | 実装で、外から外観を変える CSS カスタムプロパティにする。 | - |
      | css_properties[].name | 名前 | string | 必須 | - | pattern: `^--[a-z0-9-]+$` | CSS カスタムプロパティの名前（`--` で始める）。 | 実装で、CSS カスタムプロパティの名前にする。 | `--badge-bg` |
      | css_properties[].syntax | 値の書式 | string | - | - | - | 値の書式（`@property` の `syntax`。`<color>`・`<length>` 等）。 | 実装で、値の書式（`@property` の `syntax`）にする。 | `<color>` |
      | css_properties[].default | 既定値 | string | - | - | - | 値を指定しないときの既定値。 | 実装で、値の既定にする。 | `var(--bg-subtle)` |
      | css_properties[].description | 説明 | string | 必須 | - | - | カスタムプロパティで変わる外観。 | 画面設計で、外観を変えるときに参照する。 | `バッジの地の色` |
      | states | 状態 | array | 必須 | - | minItems: `1` | 確認する状態（通常・無効・読み込み中・エラー・長文など）。状態 1 つ = Storybook のストーリー 1 つ。 | 実装で、状態ごとの Storybook のストーリーにする。<br>レビューで、状態ごとのスクリーンショットを照合する。 | - |
      | states[].name | ストーリー名 | string | 必須 | - | pattern: `^[A-Za-z][A-Za-z0-9]*$` | 英数字で記載する（日本語の名前は Storybook の id が食い違い、ストーリーが見つからなくなる）。 | 実装で、ストーリーの名前にする。 | `Todo` / `LongList` |
      | states[].description | 状態 | string | 必須 | - | - | その状態が何か。 | レビューで、ストーリーがその状態を描いているかを確認する。 | `未着手` / `` 幅を超える数の未解消の依存（`…` で省略し、全文を `title` に持たせる） `` |
      | states[].screenshot | 照合で撮る | boolean | - | - | - | レビューでこのストーリーを撮るか。記載しなければ撮る。 | レビューで、ストーリーを撮るかを決める。 | `false` |
      | states[].args | 上書きする引数 | array | - | - | - | この状態で指定する引数の値。引数を持たない部品は持たない。 | 実装で、ストーリーの `args` にする。 | - |
      | states[].args[].name | 引数 | string | 必須 | - | - | `args` の `name`。 | 実装で、上書きする引数にする。 | `status` |
      | states[].args[].value | 値 | string | 必須 | - | - | JSON として解釈できる値はその型で指定される（`true`・`12`・`["#1598"]` など）。 | 実装で、ストーリーに指定する引数の値にする。 | `todo` / `true` / `["#1598", "#1840"]` |
      | states[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。 | - |
      | uses | 使用する部品 | array | - | - | - | この部品が中で使用する別の部品。 | 実装で、中で使用する部品にする。<br>レビューで、部品の依存の向きを確認する。 | - |
      | uses[].component | 部品 | string | 必須 | - | pattern: `^(?:[A-Z]+-\d+(?:-\d+)?)?#(?:[^\s\[]\|\[[^\]]*\])*$` | 設計書の項目を指す。`{ID}#{項目のパス}` で記載する。 | 実装で、中で使用する部品と、その部品に指定する引数を決める。 | `CMP-4#` |
      | uses[].how | 使用方法 | string | 必須 | - | - | 中の部品へ指定する値とスロットへの差し込み方。 | 実装で、中の部品へ指定する値と差し込み方にする。 | `停止中の一時停止のアイコン` |
      | accessibility | アクセシビリティ | array | - | - | - | スクリーンリーダー向けの名前・キー操作・色に頼らない表し方など、部品が守ること。 | 実装で、スクリーンリーダー向けの名前・キー操作・色に頼らない表し方にする。<br>レビューで、アクセシビリティの検出を照合する。 | `` [状態を色だけで伝えない（`label` を必ず出す）] `` |
      | refs | 関連 | array | - | - | - | 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。 | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | status | 状態 | string | - | `planned` / `implemented` / `deprecated` / `removed` | - | 項目の状態で、`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）のどれか。記載しなければ実装済みとして扱う。 | 実装で、`planned` の項目を作る対象にし、`deprecated`・`removed` の項目を新しく使用しない。<br>生成で、状態の表示にする。 | - |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>project-index の配信で、文書の公開範囲のメタデータにする。 | - |
      | tags | タグ | array | - | - | - | 設計書を検索で絞り込むタグで、`name` にタグの名前（`action:`・`topic:`・`tool:` などで始める）、最も分量の多い主題 1 つに `main: true` を記載する。<br>付け方は knowledge の規約『文書のタグと description の記載』に従う。 | project-index の検索で、文書をタグで絞り込む。 | `[{main: true, name: topic:タグ}, name: action:記載]` |
      | tags[].name | タグの名前 | string | 必須 | - | minLength: `1` | タグの名前。`action:`・`topic:`・`tool:` などで始める。 | 検索で、文書をタグで絞り込む値にする。 | - |
      | tags[].main | 主題 | boolean | - | - | - | 最も分量の多い主題のタグだけ `true` にする。 | 検索で、文書の主題のタグとして扱う。 | - |
      | aliases | 別名 | array | - | - | - | 検索でヒットさせたい言い換え。 | project-index の検索で、文書を名前と同じように検索できる言い換えにする。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | story | 日本語の名前は `title` から追加する。 | - | - |
      | args | オブジェクトの子は `parent.child`、配列の要素の子は `parent[].child` で 1 要素に展開する。 | - | - |
      | args[].component | ID は指す設計書の最上位の `id` にする。<br>同じ設計書の中は `#{項目のパス}` だけでよい。<br>リストの項目は、その Schema の `x-key` で宣言したキーの値で `[{値}]` と指す（番号で指さない）。<br>設計書全体を指すときは `#` の後を空にする。<br>辞書のキーも `[{キー}]` で指し、`.` や空白を含むキーも 1 階層になる（`notes[main.py の補足]`）。<br>同じ `x-key` の値の要素の 2 つ目以降は `[{値}#{順番}]` と指す（`functions[main#3]`）。<br>同じ値の要素が無く末尾が `#{整数}` のときだけ、`[...]` の中の `#` を順番として扱う。 | IF-12#flows[0] | リストの項目を番号で指している |
      | args[].notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |
      | states | dev-docs の画面では、その状態で上書きする引数が件数で出る。 | - | - |
      | states[].notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |
      | uses[].component | ID は指す設計書の最上位の `id` にする。<br>同じ設計書の中は `#{項目のパス}` だけでよい。<br>リストの項目は、その Schema の `x-key` で宣言したキーの値で `[{値}]` と指す（番号で指さない）。<br>設計書全体を指すときは `#` の後を空にする。<br>辞書のキーも `[{キー}]` で指し、`.` や空白を含むキーも 1 階層になる（`notes[main.py の補足]`）。<br>同じ `x-key` の値の要素の 2 つ目以降は `[{値}#{順番}]` と指す（`functions[main#3]`）。<br>同じ値の要素が無く末尾が `#{整数}` のときだけ、`[...]` の中の `#` を順番として扱う。 | IF-12#flows[0] | リストの項目を番号で指している |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: CMP-1
      title: 列見出し
      lead: 表の列見出しの中身。見出しの文字（押すと並べ替え）と、絞り込み・固定のボタンを並べる。
      implementation: src/app/components/macros.html#header_controls
      story: Plan/HeaderControls
      test_file: tests/integration/storybook/test_計画画面の部品.py
      args:
      - name: key
        type: 文字列
        required: true
        description: 列のキー。並べ替え・絞り込み・固定の対象を指す
      - name: label
        type: 文字列
        required: true
        description: 見出しの文字
      - name: numeric
        type: 真偽値
        required: false
        default: 'false'
        description: 数値の列か。右揃えにする
      - name: filterable
        type: 真偽値
        required: false
        default: 'false'
        description: 絞り込みのボタンを出すか
      events:
      - name: 並べ替え
        when: 見出しの文字を押したとき
        value: key（`data-sort`）
        description: 使用する側が 既定 → 昇順 → 降順 → 既定 と巡る
      - name: 固定
        when: ピンのボタンを押したとき
        value: key（`data-pin`）
        description: 使用する側が押した列より左を横スクロールでも固定する
      states:
      - name: Text
        description: 文字の列（絞り込みできる）
        args:
        - name: key
          value: title
        - name: label
          value: タイトル
        - name: filterable
