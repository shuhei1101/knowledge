# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-component
kind: template
name: "テンプレート: 部品設計"
description: 画面の要素が使う React の部品 1 つの仕様（props・children・コールバック・variants・状態）を記載する部品設計の書式を定め、部品設計を作る・修正するときに読む。
tags:
  - name: scope:テンプレート
  - name: topic:props
  - name: topic:仕様
  - name: topic:画面
  - name: topic:要素
  - name: topic:部品
    main: true
  - name: scope:react
  - name: action:設計
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      画面の要素が使う React の部品 1 つの仕様（props・children・コールバック・variants・状態）。1 ファイル = 1 部品。状態 1 つが Storybook のストーリー（`*.stories.tsx` の export 1 つ）に当たる。
      キーは `args`・`slots`・`events`・`css_properties` のままにし、React では次の対応で記載する。
      - `args`: props。variants は、`cva` の variant 名を引数名、値を選択肢にした `列挙` の引数として記載する
      - `slots`: children と、ReactNode・render props を受ける props
      - `events`: `onXxx` のコールバックの props
      - `css_properties`: 外から見た目を変える CSS カスタムプロパティ
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | title | タイトル | string | 必須 | - | - | 日本語の部品名。ファイル名に合わせる。 | `状態のバッジ` |
      | lead | 冒頭リード | string | - | - | - | 部品が何を出すかを 1〜3 行で説明する。<br>初回に書いた内容のまま保ち、後から情報を追加しない（仕様は各項目に書く）。 | - |
      | implementation | 実装 | string | 必須 | - | pattern: ^[^#\s]+(#\S+)?$ | 部品の実装の場所。リポジトリの直下からのファイルのパスに、`#` と部品の名前（コンポーネント）を続ける。 | `frontend/src/features/plan/components/status-badge.tsx#StatusBadge` |
      | story | Storybook | string | 必須 | - | pattern: ^[A-Za-z][A-Za-z0-9]*(/[A-Za-z][A-Za-z0-9]*)+$ | Storybook のストーリーのタイトル（`*.stories.tsx` の `title`。`{分類}/{部品}` を英数字で。例 `Plan/StatusBadge`）。日本語の名前は `title` から追加する。 | `Plan/StatusBadge` |
      | test_file | 対応テストファイル | string | - | - | pattern: ^tests/.+ | ストーリーを開いて確かめる結合テストのファイル。 | `tests/integration/storybook/test_計画画面の部品.py` |
      | args | 引数 | array | - | - | - | 部品が受け取る値（props）。引数 1 つ = 1 要素。<br>オブジェクトの子は `parent.child`、配列の要素の子は `parent[].child` で 1 要素に展開する。<br>引数を持たない部品は持たない。 | - |
      | args[].name | 名前 | string | 必須 | - | pattern: ^[A-Za-z_][A-Za-z0-9_]*(\[\])?(\.[A-Za-z_][A-Za-z0-9_]*(\[\])?)*$ | 実装の引数の名前。 | `status` |
      | args[].type | 型 | string | 必須 | - | - | `文字列` / `整数` / `数値` / `真偽値` / `列挙` / `オブジェクト` / `配列` / `オブジェクトの配列` / `部品`。 | `列挙` |
      | args[].required | 必須 | boolean | - | - | - | - | - |
      | args[].default | 既定値 | string | - | - | - | 省略したときの値。必須の引数には書かない。 | `false` |
      | args[].choices | 選択肢 | string | - | - | - | 列挙の値と、値の範囲。 | `todo・paused・doing・done・dropped` |
      | args[].component | 受ける部品 | string | - | - | pattern: ^[^#\s]*#(?:[^\s\[]\|\[[^\]]*\])*$ | 型が `部品` のとき、受け取れる部品設計（`dev/設計書/部品設計/...#`）。 | `dev/設計書/部品設計/計画画面/行の番号.html#` |
      | args[].enabled_when | 有効になる条件 | string | - | - | - | 他の引数の値によって意味を持つときの条件（例 `filterable` が `true` のとき）。 | ``filterable` が `true` のとき` |
      | args[].description | 説明 | string | 必須 | - | - | - | `行の状態。色とアイコンを決める` |
      | args[].status | 状態 | string | - | planned / implemented / deprecated / removed | - | 項目の状態。`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）。書かなければ実装済みとして扱う。 | - |
      | args[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |
      | slots | スロット | array | - | - | - | 使う側が中身を差し込む場所（children・ReactNode を受ける props）。スロット 1 つ = 1 要素。スロットを持たない部品は持たない。 | - |
      | slots[].name | 名前 | string | 必須 | - | pattern: ^[A-Za-z_][A-Za-z0-9_]*$ | children は `default`。名前付きの props はその名前。 | `default` |
      | slots[].description | 説明 | string | 必須 | - | - | - | `見出しの右に並べる操作のボタン` |
      | slots[].accepts | 差し込める部品 | array | - | - | - | 差し込める部品設計。どれでも差し込めるときは持たない。 | `["dev/設計書/部品設計/共通/ボタン.html#"]` |
      | slots[].passes | スロットに渡る値 | string | - | - | - | 差し込んだ中身から使える値（render props の引数など）。 | ``renderRow(item)` の `item`（行 1 件）` |
      | events | イベント | array | - | - | - | 部品が使う側へ知らせる操作（`onXxx` のコールバックの props）。イベント 1 つ = 1 要素。イベントを持たない部品は持たない。 | - |
      | events[].name | イベント | string | 必須 | - | - | - | `並べ替え` |
      | events[].when | 発火の条件 | string | 必須 | - | - | - | `見出しの文字を押したとき` |
      | events[].value | 渡す値 | string | - | - | - | 使う側が受け取る値（コールバックの引数）。 | `key（`onSort(key)` の引数）` |
      | events[].description | 説明 | string | 必須 | - | - | 使う側がそのコールバックで何をするか。 | `使う側が 既定 → 昇順 → 降順 → 既定 と巡る` |
      | css_properties | CSS カスタムプロパティ | array | - | - | - | 使う側が見た目を変える CSS カスタムプロパティ。variants は `args` に記載する。見た目を外から変えるインターフェースを持たない部品は持たない。 | - |
      | css_properties[].name | 名前 | string | 必須 | - | pattern: ^--[a-z0-9-]+$ | - | `--badge-bg` |
      | css_properties[].syntax | 値の書式 | string | - | - | - | - | `<color>` |
      | css_properties[].default | 既定値 | string | - | - | - | - | `var(--bg-subtle)` |
      | css_properties[].description | 説明 | string | 必須 | - | - | - | `バッジの地の色` |
      | states | 状態 | array | 必須 | - | minItems: 1 | 確かめる状態（通常・無効・読み込み中・エラー・長文・variant ごとなど）。状態 1 つ = Storybook のストーリー 1 つ。 | - |
      | states[].name | ストーリー名 | string | 必須 | - | pattern: ^[A-Za-z][A-Za-z0-9]*$ | 英数字で書く（日本語の名前は Storybook の id が食い違い、ストーリーが見つからなくなる）。 | `Todo` |
      | states[].description | 状態 | string | 必須 | - | - | その状態が何か。 | `未着手` |
      | states[].screenshot | 画像を撮る | boolean | - | - | - | このストーリーのスクリーンショットを撮るか。書かなければ撮る。 | `false` |
      | states[].args | 上書きする引数 | array | - | - | - | この状態で渡す引数の値。引数を持たない部品は持たない。 | - |
      | states[].args[].name | 引数 | string | 必須 | - | - | `args` の `name`。 | `status` |
      | states[].args[].value | 値 | string | 必須 | - | - | JSON として読める値はその型で渡る（`true`・`12`・`["#1598"]` など）。 | `todo` |
      | states[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |
      | uses | 使う部品 | array | - | - | - | この部品が中で使う別の部品。使わない部品は持たない。 | - |
      | uses[].component | 部品 | string | 必須 | - | pattern: ^[^#\s]*#(?:[^\s\[]\|\[[^\]]*\])*$ | 設計書の項目を指す。`{設計書のパス}#{項目のパス}` で書く。<br>設計書のパスはリポジトリの直下から、拡張子 `.yaml` を落とした書式。同じ設計書の中は `#{項目のパス}` だけでよい。<br>リストの項目は、その Schema の `x-key` で宣言したキーの値で `[{値}]` と指す（番号で指さない）。<br>設計書全体を指すときは `#` の後を空にする。<br>辞書のキーも `[{キー}]` で指し、`.` や空白を含むキーも 1 階層になる（`notes[main.py の補足]`）。<br>同じ `x-key` の値の要素の 2 つ目以降は `[{値}#{順番}]` と指す（`functions[main#3]`）。同じ値の要素が無く末尾が `#{整数}` のときだけ、`[...]` の中の `#` を順番として読む。 | `dev/設計書/部品設計/計画画面/アイコン.html#` |
      | uses[].how | 使い方 | string | 必須 | - | - | - | `停止中の一時停止のアイコン` |
      | accessibility | アクセシビリティ | array | - | - | - | 読み上げ名・キー操作・色に頼らない表し方など、部品が守ること。 | `["状態を色だけで伝えない（`label` を必ず出す）"]` |
      | refs | 関連 | array | - | - | - | - | - |
      | status | 状態 | string | - | planned / implemented / deprecated / removed | - | 項目の状態。`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）。書かなければ実装済みとして扱う。 | - |
      | visibility | 公開 | string | - | user / developer | - | 公開の範囲。`user`（ユーザー向け）/ `developer`（開発者向け）。<br>書かなければ親の値を引き継ぎ、最上位の既定は `developer`。 | - |
      | introduced | 導入 | object | - | - | - | 入ったバージョンと PR。 | - |
      | introduced.version | バージョン | string | - | - | - | 入ったバージョンのタグ（例 `v0.3.0`）。 | - |
      | introduced.pr | PR | integer | - | - | - | 入れた PR の番号。 | - |
      | aliases | 別名 | array | - | - | - | 検索で当てたい言い換え。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      title: 列見出し
      lead: 表の列見出しの中身。見出しの文字（押すと並べ替え）と、絞り込み・固定のボタンを並べる。
      implementation: frontend/src/features/plan/components/header-controls.tsx#HeaderControls
      story: Plan/HeaderControls
      test_file: tests/integration/storybook/test_計画画面の部品.py
      args:
      - name: key
        type: 文字列
        required: true
        description: 列のキー。並べ替え・絞り込み・固定の対象を指す
      - name: label
        type: 文字列
        required: true
        description: 見出しの文字
      - name: numeric
        type: 真偽値
        required: false
        default: 'false'
        description: 数値の列か。右揃えにする
      - name: filterable
        type: 真偽値
        required: false
        default: 'false'
        description: 絞り込みのボタンを出すか
      events:
      - name: 並べ替え
        when: 見出しの文字を押したとき
        value: key（`onSort(key)` の引数）
        description: 使う側が 既定 → 昇順 → 降順 → 既定 と巡る
      - name: 固定
        when: ピンのボタンを押したとき
        value: key（`onPin(key)` の引数）
        description: 使う側が押した列より左を横スクロールでも固定する
      states:
      - name: Text
        description: 文字の列（絞り込みできる）
        args:
        - name: key
          value: title
        - name: label
          value: タイトル
        - name: filterable
          value: 'true'
      - name: Numeric
        description: 数値の列（右揃えで、絞り込みのボタンを持たない）
        args:
        - name: key
          value: created_at
        - name: label
          value: 作成日時
        - name: numeric
          value: 'true'
      accessibility:
      - 絞り込み・固定のボタンは `aria-pressed` で押した状態を伝える
      - アイコンだけのボタンに `{label} で絞り込む` などの読み上げ名を付ける
      ```
