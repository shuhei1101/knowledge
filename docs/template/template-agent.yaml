# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-agent
kind: template
name: 'テンプレート: エージェントの定義'
description: ツールを使用して手順を進める LLM のエージェント 1 つの、セッションの持ち方・モデル・きっかけ・段階を記載する書式を定め、エージェントの定義の設計書を作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:エージェント
    main: true
  - name: topic:テンプレート
  - name: topic:スキーマ
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      ツールを使用して手順を進める LLM のエージェント 1 つの、セッションの持ち方・モデル・きっかけ・エージェントフローを実行する段階を記載する設計書。
      対話モード（TUI）とヘッドレスモードのどちらで起動するエージェントにも使用する。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 ファイル = 1 エージェントにする。
      - 許可するツール・きっかけ・モデルが違う動きは、別のエージェントにする。
      - 役割（何を決め、何を決めないか）はアーキテクチャ図のサブシステムの `role` に記載し、この設計書には記載しない。
      - モデルを 1 回呼んで結果を受け取るだけの処理は、『LLM の呼び出し』に記載する。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 設計で、『MCP サーバーの定義』の `clients[].agent`・『起動の構成』の `agent`・エージェントフローの `agents` から指す。 | `AG-1` |
      | title | タイトル | string | 必須 | - | - | エージェントの名前。 | 生成で、ページの見出しにする。<br>dev-docs の検索で、文書の名前にする。 | `配信のブレインノード` |
      | lead | 冒頭リード | string | 必須 | - | - | エージェントを 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>dev-docs の検索で、文書の概要文にする。 | `配信を始めるときに起動し、配信の進行を決めるエージェント` |
      | component | サブシステム | string | - | - | pattern: `^(?:[A-Z]+-\d+(?:-\d+)?)?#(?:[^\s\[]\|\[[^\]]*\])*$` | エージェントが受け持つアーキテクチャ図のサブシステムへの参照。サブシステムでないエージェントは記載しない。 | 実装で、指したサブシステムの `role` をシステムプロンプトの役割の文にする。<br>実装で、`name` を記載しないときに、指したサブシステムの `scope` を識別子にする。 | `ARCH-1#subsystems[brain]` |
      | name | 識別子 | string | - | - | pattern: `^[a-z0-9]+(-[a-z0-9]+)*$` | 英小文字とハイフンの識別子。`component` が無いとき、または同じ `component` を指すエージェントがほかにあるときだけ記載する。 | 実装で、起動の単位とログのラベルの識別子にする。 | `planner` |
      | session | セッション | object | 必須 | - | - | セッションの持ち方。 | 設計で、『起動の構成』の起動コマンドと再開の手順を決める。 | - |
      | session.interface | 起動方式 | string | 必須 | `tui` / `headless` | - | `tui`（対話モード）か `headless`（ヘッドレスモード）。 | 設計で、『起動の構成』の起動コマンドを決める。 | - |
      | session.lifetime | 寿命 | string | 必須 | `resident` / `per_request` | - | `resident`（1 つのセッションを常駐させる）か `per_request`（要求ごとに起動する）。 | 設計で、『起動の構成』の再開の手順（`restart`）の要否と、起動するセッションの数を決める。 | - |
      | model | モデル | object | 必須 | - | - | 使用するモデル。 | - | - |
      | model.name | モデルの ID | string | 必須 | - | - | 起動の仕組み・呼び出しに指定するモデルの ID。 | 実装で、起動コマンド・呼び出しのモデルの指定にする。 | `claude-opus-5-5` |
      | model.params | 引数 | object | - | - | - | 推論の強さ・温度などの、モデルに指定する引数。 | 実装で、起動コマンド・呼び出しの引数にする。 | `{effort: medium}` |
      | model.reason | 理由 | string | - | - | - | そのモデルにする理由。 | レビューで、費用と質の釣り合いを確認する。 | `進行の判断に推論の質が要るため` |
      | triggers | きっかけ | array | 必須 | - | minItems: `1` | 起動・入力のきっかけ。 | レビューで、きっかけごとにエージェントフローがあるかを確認する。 | - |
      | triggers[].name | 名前 | string | 必須 | - | pattern: `^[a-z0-9]+(-[a-z0-9]+)*$` | きっかけの名前（英小文字とハイフン）。エージェントの中で重ねない。 | 設計で、エージェントフローの `triggers` から `{エージェントの ID}#triggers[{name}]` で指す。 | `external-event` |
      | triggers[].message | メッセージ | string | 必須 | - | pattern: `^(?:[A-Z]+-\d+(?:-\d+)?)?#(?:[^\s\[]\|\[[^\]]*\])*$` | 受けるメッセージの『インターフェース定義』への参照。 | 実装で、送信する側と受ける側のメッセージの書式にする。 | `IF-12#` |
      | triggers[].scenario | シナリオ | string | - | - | pattern: `^(?:[A-Z]+-\d+(?:-\d+)?)?#(?:[^\s\[]\|\[[^\]]*\])*$` | きっかけと主アクターを記載したシナリオへの参照。 | 実装で、シナリオの主アクターから送信する側の実装の場所を決める。 | `SC-3#scenarios[正常シナリオ]` |
      | stages | 段階 | array | - | - | - | エージェントフローを実行する段階。並びの順がエージェントフローの索引の順になる。 | 設計で、フォルダ構成の `placeholders` から段階の語彙として指す。<br>生成で、エージェントフローの索引の並びにする。 | - |
      | stages[].name | 名前 | string | 必須 | - | pattern: `^[a-z0-9]+(-[a-z0-9]+)*$` | 段階の名前（英小文字とハイフン）。 | 実装で、エージェントフローのパスの段階の部分にする。 | `startup` |
      | stages[].title | 手順の名前 | string | 必須 | - | - | この段階のエージェントフローの名前の既定。 | 生成で、エージェントフローの `title` を省いたときの名前にする。 | `起動時の手順` |
      | stages[].summary | 説明 | string | 必須 | - | pattern: `^[^\n]+$`, minLength: `1` | 段階の説明。 | 生成で、エージェントフローの索引の説明にする。 | `起動した直後` |
      | stages[].trigger | きっかけ | string | - | - | - | この段階のエージェントフローを実行するきっかけの既定。`triggers[].name` のどれか。 | 生成で、エージェントフローの `triggers` を省いたときのきっかけにする。 | `start` |
      | progress | 進み具合の書き込み | object | - | - | - | エージェントフローの工程を終えるたびに呼ぶ、進み具合を書き込むツール。 | 変換で、`type` が `flow` の全てのエージェントフローの各工程の最後に、進み具合（手順の ID・工程の名前・きっかけの ID）の書き込みを追加する。<br>実装で、再開の後に書き込み済みの工程を飛ばす。 | - |
      | progress.server | MCP サーバー | string | 必須 | - | pattern: `^(?:[A-Z]+-\d+(?:-\d+)?)?#(?:[^\s\[]\|\[[^\]]*\])*$` | ツールを持つ『MCP サーバーの定義』への参照。 | 変換で、ツールの完全な名前を作る。 | `MCP-1#` |
      | progress.tool | ツール | string | 必須 | - | - | ツールの名前（『MCP サーバーの定義』の `tools[].name`）。 | 検査で、このエージェントの `clients[].allow` にあるかを確認する。 | `write_progress` |
      | refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにした節にする。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 役割と常駐かどうかは記載しない（役割はアーキテクチャ図、常駐かどうかは `session.lifetime` が持つ）。<br>初回に記載した内容のまま保ち、後から情報を追加しない。 | - | - |
      | component | ID は指す設計書の最上位の `id` にする。<br>同じ設計書の中は `#{項目のパス}` だけでよい。<br>リストの項目は、その Schema の `x-key` で宣言したキーの値で `[{値}]` と指す（番号で指さない）。<br>設計書全体を指すときは `#` の後を空にする。<br>辞書のキーも `[{キー}]` で指し、`.` や空白を含むキーも 1 階層になる（`notes[main.py の補足]`）。<br>同じ `x-key` の値の要素の 2 つ目以降は `[{値}#{順番}]` と指す（`functions[main#3]`）。<br>同じ値の要素が無く末尾が `#{整数}` のときだけ、`[...]` の中の `#` を順番として扱う。 | IF-12#flows[0] | リストの項目を番号で指している |
      | name | `component` を 1 つのエージェントだけが指すときは記載しない。 | - | - |
      | triggers[].message | インターフェース定義の `entry.kind` にエージェントへのメッセージの種類が入るまでは、`kind: operation` で記載する。 | IF-12#flows[0] | リストの項目を番号で指している |
      | triggers[].scenario | ID は指す設計書の最上位の `id` にする。<br>同じ設計書の中は `#{項目のパス}` だけでよい。<br>リストの項目は、その Schema の `x-key` で宣言したキーの値で `[{値}]` と指す（番号で指さない）。<br>設計書全体を指すときは `#` の後を空にする。<br>辞書のキーも `[{キー}]` で指し、`.` や空白を含むキーも 1 階層になる（`notes[main.py の補足]`）。<br>同じ `x-key` の値の要素の 2 つ目以降は `[{値}#{順番}]` と指す（`functions[main#3]`）。<br>同じ値の要素が無く末尾が `#{整数}` のときだけ、`[...]` の中の `#` を順番として扱う。 | IF-12#flows[0] | リストの項目を番号で指している |
      | progress | `ref` で埋め込んだ工程は、埋め込み先の工程として 1 回書き込む。<br>進み具合を書き込むツールの無いエージェントは記載せず、再開の後はエージェントフローを最初の工程から進める。 | - | - |
      | progress.server | ID は指す設計書の最上位の `id` にする。<br>同じ設計書の中は `#{項目のパス}` だけでよい。<br>リストの項目は、その Schema の `x-key` で宣言したキーの値で `[{値}]` と指す（番号で指さない）。<br>設計書全体を指すときは `#` の後を空にする。<br>辞書のキーも `[{キー}]` で指し、`.` や空白を含むキーも 1 階層になる（`notes[main.py の補足]`）。<br>同じ `x-key` の値の要素の 2 つ目以降は `[{値}#{順番}]` と指す（`functions[main#3]`）。<br>同じ値の要素が無く末尾が `#{整数}` のときだけ、`[...]` の中の `#` を順番として扱う。 | IF-12#flows[0] | リストの項目を番号で指している |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: AG-1
      title: 配信のブレインノード
      lead: 配信を始めるときに起動し、配信の進行を決めるエージェント
      component: ARCH-1#subsystems[brain]
      name: brain-stream
      session:
        interface: tui
        lifetime: resident
      model:
        name: claude-opus-5-5
        params:
          effort: medium
        reason: 進行の判断に推論の質が要るため
      triggers:
      - name: start
        message: IF-11#
        scenario: SC-3#scenarios[正常シナリオ]
      - name: external-event
        message: IF-12#
        scenario: SC-3#scenarios[正常シナリオ]
      stages:
      - name: startup
        title: 起動時の手順
        summary: 起動した直後
        trigger: start
      - name: on-event
        title: イベントの手順
        summary: 外部イベントを受けたとき
        trigger: external-event
      - name: resume
        title: 再開の手順
        summary: 圧縮・再起動の後
      - name: shutdown
        title: 終了の手順
        summary: 配信を終えるとき
      progress:
        server: MCP-1#
        tool: write_progress
      refs:
      - SC-3#
      ```
