# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-dataflow
kind: template
name: "テンプレート: データフロー"
description: 1 つのデータがシステムをどう流れるか（DFD）を記載するデータフローの書式を定め、データフローの設計書を作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:dfd
  - name: topic:システム
  - name: topic:テンプレート
  - name: topic:データ
  - name: topic:データフロー
    main: true
  - name: topic:設計書
status: current
visibility: internal
rev: 4
items:
  - id: overview
    name: 概要
    body: |-
      1 つのデータがシステムをどう流れるか（DFD）。
      図は各レベルのノードと辺から生成する。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 ファイル = データ 1 つにする。
      - 実装の関数とは 1:1 に対応させない。
      - データ一覧の各データに DFD を作るかは判定表『データフローを作る条件』で決める。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>dev-docs の配信で、文書の公開範囲のメタデータにする。 | - |
      | title | タイトル | string | 必須 | - | pattern: `^データフロー: .+$` | `データフロー: {データ名}`。 | 生成で、ページの見出しにする。<br>dev-docs の検索で、文書の名前にする。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>dev-docs の検索で、文書の概要文にする。 | - |
      | source | 発生源 | string | - | - | - | 外部エンティティかシステムの中の処理。 | レビューで、データの発生源が図の Level 0 の外部の相手と一致するかを確認する。 | - |
      | sink | 出口 | string | - | - | - | 外部エンティティかデータストア。 | レビューで、データの出口が図の Level 0 の外部の相手・データストアと一致するかを確認する。 | - |
      | levels | 図 | array | 必須 | - | minItems: `1` | Level 0（外部の境界）と Level 1（主要な処理とデータストア）は必須。Level 2 は複雑な処理だけ。 | 生成で、レベルごとのデータフロー図にする。<br>実装で、処理とデータストアの間で受け渡すデータの型を決める。 | - |
      | levels[].name | レベル | string | 必須 | - | - | `Level 0` / `Level 1` / `Level 2: {親の処理}の分解`。 | 生成で、図の見出しにする。 | - |
      | levels[].description | 説明 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 生成で、図の説明にする。 | - |
      | levels[].diagram | 図 | object | 必須 | - | - | ノードの `kind` で外部の相手・処理・データストアを分けた図。 | 生成で、データフロー図にする。 | - |
      | levels[].diagram.direction | 向き | string | - | `TD` / `LR` | - | 図の向き（`TD` = 上から下 / `LR` = 左から右）。記載しなければ図の種類の既定（判定は `TD`、データフロー・アーキテクチャは `LR`）。 | 生成で、図の向きにする。 | - |
      | levels[].diagram.nodes | ノード | array | 必須 | - | - | 図のノード。1 要素 = 1 ノード。 | 生成で、図のノードにする。 | - |
      | levels[].diagram.nodes[].id | ID | string | 必須 | - | pattern: `^\S+$` | 図の中で一意なノードの ID。空白を含めない。 | 生成で、辺・枠・リンクが指すノードを決める。 | - |
      | levels[].diagram.nodes[].label | 表示 | string | 必須 | - | - | ノードに出す文言。半角の括弧は描画を崩すので全角で記載する。 | 生成で、ノードの文言にする。 | - |
      | levels[].diagram.nodes[].kind | 要素の種類 | string | - | `actor` / `process` / `store` / `system` / `external` / `start` / `question` / `action` / `result` | - | ノードが何を表すか（データフロー・アーキテクチャは `actor` = 人・外部の相手 / `process` = 処理 / `store` = データストア / `system` = システム・サブシステム / `external` = 外部システム、判定は `start` = 開始 / `question` = 質問 / `action` = アクション / `result` = 結果）。<br>記載しなければ `process`。 | 生成で、ノードの形と色にする。 | - |
      | levels[].diagram.nodes[].hint | 説明 | string | - | - | - | ノードのツールチップに出す説明の文。表示を短く保つために記載する。 | 生成で、ノードのツールチップにする。 | - |
      | levels[].diagram.edges | 辺 | array | 必須 | - | - | 図に描く順の辺。 | 生成で、図の矢印にする。 | - |
      | levels[].diagram.edges[].from | 元 | string | 必須 | - | - | 元のノードの `id`。 | 生成で、矢印の元にする。<br>検査で、`nodes` にある `id` かを確認する。 | - |
      | levels[].diagram.edges[].to | 先 | string | 必須 | - | - | 先のノードの `id`。 | 生成で、矢印の先にする。<br>検査で、`nodes` にある `id` かを確認する。 | - |
      | levels[].diagram.edges[].label | ラベル | string | - | - | - | 矢印のラベル。判定は `YES` / `NO`、データフローは流れるデータの名前。 | 生成で、矢印のラベルにする。 | - |
      | levels[].diagram.edges[].line | 線 | string | - | `flow` / `read` / `write` / `reply` / `loop` | - | 線の意味（`flow` = 処理の流れ / `read` = 読み取り / `write` = 書き込み / `reply` = 応答 / `loop` = 前の処理へ戻る）。記載しなければ `flow`。 | 生成で、線の種類にする。 | - |
      | levels[].diagram.edges[].tip | 詳細 | string | - | - | - | 線のツールチップに出す詳細。ラベルを短く保つために記載する。 | 生成で、線のツールチップにする。 | - |
      | levels[].diagram.frame | 枠 | object | - | - | - | 図の中で 1 つのシステムを囲む枠。 | 生成で、システムを囲む枠にする。 | - |
      | levels[].diagram.frame.label | 表示 | string | 必須 | - | - | ノードを囲む枠の見出し。 | 生成で、枠の見出しにする。 | - |
      | levels[].diagram.frame.nodes | 中のノード | array | 必須 | - | - | 枠の中に配置するノードの `id`。 | 生成で、枠の中に置くノードを決める。 | - |
      | levels[].diagram.clicks | リンク | array | - | - | - | ノードを押したときに開くリンク。1 要素 = 1 ノード。 | 生成で、ノードを押したときに開くリンクにする。 | - |
      | levels[].diagram.clicks[].id | ノード | string | 必須 | - | - | リンクを付けるノードの `id`。 | 生成で、リンクを付けるノードを決める。 | - |
      | levels[].diagram.clicks[].href | リンク先 | string | 必須 | - | - | 押したときに開く先（相対パス + アンカー）。 | 生成で、リンク先にする。 | - |
      | dictionary | データ辞書 | array | - | - | - | 処理の境界を越える主要な流れだけ。 | 実装で、処理の境界を越えるデータの構造にする。<br>レビューで、信頼境界を越える流れの脅威と対策を確認する。 | - |
      | dictionary[].name | データフロー名 | string | 必須 | - | - | 図の矢印のラベルと同じ、データフローの名前。 | 設計で、図の矢印のラベルと流れを対応させる。 | - |
      | dictionary[].from | 発生元 | string | 必須 | - | - | データが出る処理・データストア・外部実体の名前。 | レビューで、図の矢印の元と一致するかを確認する。 | - |
      | dictionary[].to | 到達先 | string | 必須 | - | - | データが届く処理・データストア・外部実体の名前。 | レビューで、図の矢印の先と一致するかを確認する。 | - |
      | dictionary[].structure | 構造 | string | 必須 | - | - | ペイロードの型（`{name, email}`）。 | 実装で、受け渡すデータの型にする。 | - |
      | dictionary[].crosses_boundary | 信頼境界を越える | boolean | - | - | - | 信頼境界を越える流れなら `true`。 | レビューで、脅威の検討が要る流れかを判断する。 | - |
      | dictionary[].sensitivity | 機密の区分 | string | - | `個人情報` / `機密` | - | 流れるデータの機密の区分（公開・社内・機密 等）。 | 実装で、暗号化・マスク・ログへの出力の可否を決める。 | - |
      | dictionary[].threats | 脅威 | array | - | - | - | 信頼境界を越える流れの STRIDE の脅威。 | 実装で、脅威ごとの対策を入れる。<br>レビューで、信頼境界を越える流れに脅威の検討があるかを確認する。 | - |
      | dictionary[].volume | 頻度と量 | string | - | - | - | データが流れる頻度と 1 回の量。 | 実装で、処理の方式（一括・逐次）と上限の値を決める。 | - |
      | dictionary[].notes | 補足 | string | - | - | - | 流れの前提・制約（順番・欠けたときの扱い 等）。 | 実装で、流れの前提・制約を満たす処理（順番の保証・欠けたときの扱い）にする。 | - |
      | refs | 関連 | array | - | - | - | 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。 | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにした節にする。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。<br>対象そのものが変わったときだけ書き換える。 | 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。 | 仕様を冒頭リードに記載している。仕様は各項目へ分ける |
      | levels[].description | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | levels[].diagram | 辺のラベルに流れるデータの名前を記載する。<br>処理は動詞句、データは名詞で記載する。<br>1 図の処理は 3〜7 個にする。<br>信頼境界は枠で描く。 | - | - |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: DF-1
      title: 'データフロー: 問い合わせメッセージ'
      lead: '`問い合わせメッセージ` がシステムを流れる過程。'
      source: 問い合わせ者
      sink: 問い合わせ DB とサポート担当
      levels:
      - name: Level 0
        diagram:
          nodes:
          - id: USER
            label: 問い合わせ者
            kind: actor
          - id: S
            label: 問い合わせ処理システム
            kind: process
          - id: SUP
            label: サポート担当
            kind: actor
          edges:
          - from: USER
            to: S
            label: 問い合わせメッセージ
          - from: S
            to: SUP
            label: 問い合わせ通知
      - name: Level 1
        diagram:
          nodes:
          - id: USER
            label: 問い合わせ者
            kind: actor
          - id: P1
            label: 1. 受付
            kind: process
          - id: P2
            label: 2. 保存
            kind: process
          - id: DB
            label: 問い合わせ DB
            kind: store
          - id: P3
            label: 3. 通知
            kind: process
          - id: SUP
            label: サポート担当
            kind: actor
          edges:
          - from: USER
            to: P1
            label: 問い合わせメッセージ
          - from: P1
            to: P2
            label: 検証済みメッセージ
          - from: P2
            to: DB
            label: 問い合わせレコード
          - from: P2
            to: P3
            label: 保存完了イベント
          - from: P3
            to: SUP
            label: 通知ペイロード
          frame:
            label: '信頼境界: システム'
            nodes:
            - P1
            - P2
            - DB
            - P3
      dictionary:
      - name: 問い合わせメッセージ
        from: 問い合わせ者
        to: 1. 受付
        structure: '{name, email, subject, body}'
        crosses_boundary: true
        sensitivity: 個人情報
        threats:
        - 改ざん
        - 情報漏えい
      - name: 問い合わせレコード
        from: 2. 保存
        to: 問い合わせ DB
        structure: '{id, name, email, subject, body, received_at}'
      ```
