# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-dataflow
kind: template
name: "テンプレート: データフロー"
description: 1 つのデータがシステムをどう流れるか（DFD）を記載するデータフローの書式を定め、データフローの設計書を作る・修正するときに読む。
tags:
  - name: scope:テンプレート
    main: true
status: current
visibility: internal
rev: 2
items:
  - id: overview
    name: 概要
    body: |-
      1 つのデータがシステムをどう流れるか（DFD）。1 ファイル = データ 1 つ。
      実装の関数とは 1:1 に対応させない。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | title | タイトル | string | 必須 | - | pattern: ^データフロー: .+$ | `データフロー: {データ名}`。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。<br>初回に書いた内容のまま保ち、後から情報を追加しない（仕様は各項目に書く）。<br>対象そのものが変わったときだけ書き換える。 | - |
      | source | 発生源 | string | - | - | - | 外部エンティティかシステムの中の処理。 | - |
      | sink | 出口 | string | - | - | - | 外部エンティティかデータストア。 | - |
      | levels | 図 | array | 必須 | - | minItems: 1 | Level 0（外部の境界）と Level 1（主要な処理とデータストア）は必須。Level 2 は複雑な処理だけ。 | - |
      | levels[].name | レベル | string | 必須 | - | - | `Level 0` / `Level 1` / `Level 2: {親の処理}の分解`。 | - |
      | levels[].description | 説明 | string | - | - | - | Markdown で書く本文。<br>他の設計書を指すときは説明文の中にリンクを書かず、参照は `refs`（`ref` の配列）に持つ。 | - |
      | levels[].diagram | 図 | object | 必須 | - | - | ノードの `kind` で外部の相手・処理・データストアを分け、辺のラベルに流れるデータの名前を書く。<br>処理は動詞句、データは名詞で書く。1 図の処理は 3〜7 個。信頼境界は枠で描く。 | - |
      | levels[].diagram.direction | 向き | string | - | TD / TB / LR / RL / BT | - | 図の向き。書かなければ図の種類の既定（判定は `TD`、データフロー・アーキテクチャは `LR`）。 | - |
      | levels[].diagram.nodes | ノード | array | 必須 | - | - | - | - |
      | levels[].diagram.nodes[].id | ID | string | 必須 | - | pattern: ^[^\s\[\](){}<>\|"]+$ | 図の中で一意なノードの ID。空白と記号を含めない。 | - |
      | levels[].diagram.nodes[].label | 表示 | string | 必須 | - | - | ノードに出す文言。半角の括弧は描画を崩すので全角で書く。 | - |
      | levels[].diagram.nodes[].shape | 形状 | string | - | rect / round / stadium / diamond / circle / cylinder / hexagon / parallelogram / subroutine | - | ノードの形状。書かなければ `rect`。<br>`rect`（四角）/ `round`（角丸）/ `stadium`（開始・終端 `([…])`）/ `diamond`（判定）/ `circle`（処理）/ `cylinder`（データストア）/ `hexagon` / `parallelogram`（入出力ポート）/ `subroutine`。 | - |
      | levels[].diagram.nodes[].kind | 要素の種類 | string | - | actor / process / store / system / external | - | データフロー・アーキテクチャで、ノードが何を表すか。`actor`（人・外部の相手）/ `process`（処理）/ `store`（データストア）/ `system`（システム・サブシステム）/ `external`（外部システム）。 | - |
      | levels[].diagram.edges | 辺 | array | 必須 | - | - | 図に描く順の辺。 | - |
      | levels[].diagram.edges[].from | 元 | string | 必須 | - | - | 元のノードの `id`。 | - |
      | levels[].diagram.edges[].to | 先 | string | 必須 | - | - | 先のノードの `id`。 | - |
      | levels[].diagram.edges[].label | ラベル | string | - | - | - | 矢印のラベル。判定は `YES` / `NO`、データフローは流れるデータの名前。 | - |
      | levels[].diagram.edges[].line | 線 | string | - | solid / dotted / thick / open | - | 線の種類。書かなければ `solid`（`-->`）。`dotted`（`-.->`）/ `thick`（`==>`）/ `open`（`---`）。 | - |
      | levels[].diagram.subgraphs | 枠 | array | - | - | - | - | - |
      | levels[].diagram.subgraphs[].id | ID | string | 必須 | - | pattern: ^[A-Za-z0-9_]+$ | - | - |
      | levels[].diagram.subgraphs[].label | 表示 | string | - | - | - | - | - |
      | levels[].diagram.subgraphs[].nodes | 中のノード | array | 必須 | - | - | 枠の中に置くノードの `id`。 | - |
      | levels[].diagram.clicks | リンク | array | - | - | - | - | - |
      | levels[].diagram.clicks[].id | ノード | string | 必須 | - | - | リンクを付けるノードの `id`。 | - |
      | levels[].diagram.clicks[].href | リンク先 | string | 必須 | - | - | 押したときに開く先（相対パス + アンカー）。 | - |
      | dictionary | データ辞書 | array | - | - | - | 処理の境界を越える主要な流れだけ。 | - |
      | dictionary[].name | データフロー名 | string | 必須 | - | - | - | - |
      | dictionary[].from | 発生元 | string | 必須 | - | - | - | - |
      | dictionary[].to | 到達先 | string | 必須 | - | - | - | - |
      | dictionary[].structure | 構造 | string | 必須 | - | - | ペイロードの型（`{name, email}`）。 | - |
      | dictionary[].crosses_boundary | 信頼境界を越える | boolean | - | - | - | - | - |
      | dictionary[].sensitivity | 機密の区分 | string | - | 個人情報 / 機密 | - | - | - |
      | dictionary[].threats | 脅威 | array | - | - | - | 信頼境界を越える流れの STRIDE の脅威。 | - |
      | dictionary[].volume | 頻度と量 | string | - | - | - | - | - |
      | dictionary[].notes | 補足 | string | - | - | - | - | - |
      | refs | 関連 | array | - | - | - | - | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      title: 'データフロー: 問い合わせメッセージ'
      lead: '`問い合わせメッセージ` がシステムを流れる過程。'
      source: 問い合わせ者
      sink: 問い合わせ DB とサポート担当
      levels:
      - name: Level 0
        diagram:
          nodes:
          - id: USER
            label: 問い合わせ者
            kind: actor
          - id: S
            label: 問い合わせ処理システム
            shape: circle
            kind: process
          - id: SUP
            label: サポート担当
            kind: actor
          edges:
          - from: USER
            to: S
            label: 問い合わせメッセージ
          - from: S
            to: SUP
            label: 問い合わせ通知
      - name: Level 1
        diagram:
          nodes:
          - id: USER
            label: 問い合わせ者
            kind: actor
          - id: P1
            label: 1. 受付
            shape: circle
            kind: process
          - id: P2
            label: 2. 保存
            shape: circle
            kind: process
          - id: DB
            label: 問い合わせ DB
            shape: cylinder
            kind: store
          - id: P3
            label: 3. 通知
            shape: circle
            kind: process
          - id: SUP
            label: サポート担当
            kind: actor
          edges:
          - from: USER
            to: P1
            label: 問い合わせメッセージ
          - from: P1
            to: P2
            label: 検証済みメッセージ
          - from: P2
            to: DB
            label: 問い合わせレコード
          - from: P2
            to: P3
            label: 保存完了イベント
          - from: P3
            to: SUP
            label: 通知ペイロード
          subgraphs:
          - id: SYS
            label: '信頼境界: システム'
            nodes:
            - P1
            - P2
            - DB
            - P3
      dictionary:
      - name: 問い合わせメッセージ
        from: 問い合わせ者
        to: 1. 受付
        structure: '{name, email, subject, body}'
        crosses_boundary: true
        sensitivity: 個人情報
        threats:
        - 改ざん
        - 情報漏えい
      - name: 問い合わせレコード
        from: 2. 保存
        to: 問い合わせ DB
        structure: '{id, name, email, subject, body, received_at}'
      ```
