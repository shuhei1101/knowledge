# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-evaluation
kind: template
name: 'テンプレート: 精度評価のスイート'
description: 精度評価 1 つの、評価の対象・つなぐ順番・再評価する変更を記載するスイートの書式を定め、精度評価のスイートを作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:精度評価
    main: true
  - name: topic:テンプレート
  - name: topic:スキーマ
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      精度評価 1 つの、評価の対象・つなぐ順番・再評価する変更を記載する設計書。
      評価の仕組みがそのまま参照するファイルで、観点は『精度評価の観点』、ケースは『精度評価のケース』のファイルを原本にする。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 ファイル = 1 つの評価にする。
      - スイートは評価の仕組みが参照する場所に配置し、同じフォルダの `criteria/` に観点、`cases/` にケースを配置する。
      - 全ての評価で共通の観点は、プロジェクトのフォルダ構成の設計書で決めた共通のフォルダに配置する。
      - 実行の回数・採点のモデル・採点の回数は設定に、結果・速度と費用・対応の記録は結果のデータベースに記載し、このファイルには記載しない。
      - 観点 × ケースの単位で合否を出し、全ての観点 × ケースが合格したときに評価を合格にする。
      - `human` の観点に人の採点が済んでいないうちは、評価全体を判定保留にする。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `EVAL-1` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>dev-docs の配信で、文書の公開範囲のメタデータにする。 | - |
      | title | タイトル | string | 必須 | - | - | 精度評価の名前。 | 生成で、ページの見出しにする。<br>実行で、結果の画面の見出しにする。 | `行動選択ノードの精度評価` |
      | lead | 冒頭リード | string | 必須 | - | - | 何を確認するかを 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>dev-docs の検索で、文書の概要文にする。 | `状態と予定に合った行動を選べるか` |
      | targets | 評価の対象 | array | 必須 | - | minItems: `1` | 評価の対象（『エージェントの定義』か『LLM の呼び出し』）への参照。並びの順につなぐ。 | 実行で、対象を並びの順に実行し、途中の出力は後処理まで実行して最後の出力だけを採点する。<br>設計で、対象の設計書から精度評価を逆引きする。 | `[LLM-3#, LLM-1#]` |
      | extra_criteria | 追加の観点のフォルダ | array | - | - | - | 同じフォルダの `criteria/` と共通の観点のほかに使用する観点のフォルダの、リポジトリの直下からのパス。 | 実行で、使用できる観点の一覧に加える。 | `[content/evals/to_document/criteria/]` |
      | rerun_on | 再評価する変更 | array | 必須 | - | minItems: `1` | 再評価する変更（`model`・`prompt`・`inputs`・`criteria`・`cases`）。 | 実行で、対象の設計書と観点・ケースの差分から再評価を起票する。 | `[model, prompt, criteria]` |
      | refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 初回に記載した内容のまま保ち、後から情報を追加しない。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: EVAL-1
      title: 行動選択ノードの精度評価
      lead: 状態と予定に合った行動を選べるか
      targets:
      - LLM-3#
      - LLM-1#
      rerun_on:
      - model
      - prompt
      - criteria
      refs:
      - LLM-1#
      ```
