  - id: overview
    name: 概要
    body: |-
      利用する外部 API 1 つにつき 1 ファイル。
      そのプロジェクトで使用するエンドポイントだけを公式ドキュメントから抜き出す。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>dev-docs の配信で、文書の公開範囲のメタデータにする。 | - |
      | title | タイトル | string | 必須 | - | - | API 名。ファイル名に合わせる。 | 生成で、ページの見出しにする。<br>dev-docs の検索で、文書の名前にする。 | - |
      | lead | 冒頭リード | string | - | - | - | API が何をするものかを 1〜3 行で要約する。 | 生成で、ページの冒頭の説明にする。<br>dev-docs の検索で、文書の概要文にする。 | - |
      | used_in | 使用箇所 | array | - | - | - | 呼び出す境界層のパス（リポジトリの直下から）。 | 保守で、API の仕様が変わったときに、修正する境界層のファイルを探す。 | - |
      | verification | 動作確認 | object | - | - | - | 動かして確認したか。 | 実装で、実装の前に API を動かして確認済みかを判断する。<br>レビューで、確認していない API に理由があるかを確認する。 | - |
      | verification.state | 状態 | string | 必須 | `済` / `未確認` | - | - | 実装で、実装の前に動作確認が要るかを判断する。 | - |
      | verification.date | 確認日 | string | - | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | `YYYY-MM-DD`。 | 保守で、確認の記録が古くなっていないかを判断する。 | - |
      | verification.detail | 確認内容 | string | - | - | - | 確認した内容か、確認できない理由。 | 実装で、確認していない API を使用してよいかを判断する。 | - |
      | version | 現在のバージョン情報 | object | 必須 | - | - | - | 実装で、指定する API のバージョンにする。 | - |
      | version.api_version | API バージョン | string | 必須 | - | - | header 指定型か URL 埋め込み型かを添える。 | 実装で、ヘッダか URL に入れる API のバージョンにする。 | - |
      | version.checked_on | 確認日 | string | 必須 | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | - | 保守で、バージョンの情報が古くなっていないかを判断する。 | - |
      | version.sunset | 廃止予定日 | string | - | - | - | - | 計画で、廃止の前に移行する作業を計画する。 | - |
      | base_urls | ベース URL | array | - | - | minItems: `1` | - | 実装で、環境ごとの接続先の設定にする。 | - |
      | base_urls[].env | 環境 | string | 必須 | - | - | - | 実装で、接続先を切り替える環境にする。 | - |
      | base_urls[].url | URL | string | 必須 | - | - | - | 実装で、接続先の URL にする。 | - |
      | official_url | 公式 URL | string | - | - | - | - | 実装で、仕様を確認するときに公式のページを開く。 | - |
      | docs_url | 公式ドキュメント | string | - | - | - | - | 実装で、仕様を確認するときに公式のドキュメントを開く。 | - |
      | terms_url | 利用規約 | string | - | - | - | - | レビューで、使い方が利用規約に反しないかを確認する。 | - |
      | contact | 連絡先 | string | - | - | - | - | 保守で、障害・不具合を問い合わせる先にする。 | - |
      | status_page | 障害情報の確認先 | string | - | - | - | - | 保守で、呼び出しが失敗したときに提供元の障害かを確認する。 | - |
      | auth | 認証セットアップ | object | 必須 | - | - | - | 実装で、認証の処理にする。 | - |
      | auth.method | 認証方式 | string | 必須 | - | - | Bearer / API Key Header / OAuth2 / JWT 等。 | 実装で、認証の方式にする。 | - |
      | auth.scopes | スコープ | array | - | - | - | - | 実装で、要求するスコープにする。<br>レビューで、スコープが必要な範囲に収まっているかを確認する。 | - |
      | auth.steps | 取得手順 | string | - | - | - | キー取得の公式ページの URL と番号付きの手順。 | 反映作業で、認証の値を発行する作業の手順にする。 | - |
      | auth.env_vars | 環境変数 | array | - | - | - | `.env.example` と一致させる。 | 実装で、認証の値を読む環境変数にする。 | - |
      | auth.usage | リクエスト時の利用 | string | - | - | - | コードブロック。 | 実装で、要求に認証の値を付ける方法にする。 | - |
      | rate_limits | レートリミット | array | - | - | - | - | 設計で、非機能要件のレート制限の値の出所にする。<br>実装で、呼び出しの間隔と同時実行数を決める。 | - |
      | rate_limits[].target | 対象 | string | 必須 | - | - | - | 実装で、上限が掛かる単位（API キー・エンドポイント）にする。 | - |
      | rate_limits[].limit | 上限 | string | 必須 | - | - | 単位（RPM / TPM 等）を付ける。 | 実装で、呼び出しの上限にする。 | - |
      | rate_limits[].notes | 補足 | string | - | - | - | - | 実装で、上限の前提を参照する。 | - |
      | retry | 再試行 | string | - | - | - | 超過時のステータスと再試行の方針（Retry-After・Exponential Backoff 等）。 | 実装で、上限を超えたときの再試行の処理にする。 | - |
      | pricing | 課金単価 | array | - | - | - | - | 実行で、実行の前に料金を見積もってユーザーの確認が要るかを判断する。 | - |
      | pricing[].target | 対象 | string | 必須 | - | - | - | 実行で、料金を見積もる単位にする。 | - |
      | pricing[].price | 単価 | string | 必須 | - | - | - | 実行で、料金の見積もりにする。 | - |
      | pricing[].notes | 補足 | string | - | - | - | - | 実行で、料金の見積もりの前提を参照する。 | - |
      | pricing_url | 課金の公式ページ | string | - | - | - | 課金の公式ページの URL。 | 保守で、単価が変わっていないかを公式のページで確認する。 | - |
      | error_format | エラー応答の形式 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 実装で、エラー応答を読む処理にする。 | - |
      | pagination | ページングの方式 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 実装で、全件を取る繰り返しの処理にする。 | - |
      | timeout | タイムアウト | string | - | - | - | - | 実装で、呼び出しのタイムアウトにする。 | - |
      | endpoints | エンドポイント | array | 必須 | - | minItems: `1` | このプロジェクトで使用するエンドポイント。一覧の表は各エンドポイントのメソッド・パス・用途から生成する。 | 実装で、呼ぶエンドポイントの要求と応答にする。<br>生成で、エンドポイントの一覧の表と節にする。 | - |
      | endpoints[].name | 名前 | string | 必須 | - | - | `{METHOD} {パス}`。パスはベース URL からの相対。 | 設計で、ほかの設計書の参照（`endpoints[GET /tasks]`）からエンドポイントを指す。<br>生成で、節の見出しにする。 | - |
      | endpoints[].method | メソッド | string | 必須 | `GET` / `POST` / `PUT` / `PATCH` / `DELETE` / `HEAD` / `OPTIONS` | - | - | 実装で、要求のメソッドにする。 | - |
      | endpoints[].path | パス | string | 必須 | - | - | - | 実装で、要求のパスにする。 | - |
      | endpoints[].summary | 用途 | string | 必須 | - | pattern: `^[^\n]+$`, minLength: `1` | 1 行の用途。 | 生成で、エンドポイントの一覧の用途にする。 | - |
      | endpoints[].operation_id | 操作の識別子 | string | - | - | - | - | 実装で、SDK の関数の名前を参照する。 | - |
      | endpoints[].tags | 分類タグ | array | - | - | - | - | 実装で、公式のドキュメントからエンドポイントの分類を参照する。 | - |
