      | endpoints[].idempotent | 冪等 | boolean | - | - | - | - | 実装で、失敗したときに再試行してよいかを決める。 | - |
      | endpoints[].description | 説明 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 実装で、エンドポイントの挙動を参照する。 | - |
      | endpoints[].request | リクエスト | array | - | - | - | - | 実装で、要求の組み立てにする。 | - |
      | endpoints[].request[].name | パラメータ | string | 必須 | - | - | オブジェクトの子は `parent.child`、配列の要素の子は `parent[].child`。 | 実装で、要求のパラメータの名前にする。 | - |
      | endpoints[].request[].type | 型 | string | 必須 | - | - | 取りうる値が限られるときは列挙し、各値の意味は補足に記載する。 | 実装で、パラメータの型にする。 | - |
      | endpoints[].request[].required | 必須 | boolean | - | - | - | - | 実装で、省けないパラメータにする。 | - |
      | endpoints[].request[].default | 既定 | string | - | - | - | 任意のパラメータの省略時の値。 | 実装で、省いたときに使われる値を参照する。 | - |
      | endpoints[].request[].description | 説明 | string | 必須 | - | - | - | 実装で、パラメータに入れる値を決める。 | - |
      | endpoints[].request[].constraints | 制限 | string | - | - | - | - | 実装で、送る前の検証にする。 | - |
      | endpoints[].request[].notes | 補足 | string | - | - | - | - | 実装で、パラメータの前提を参照する。 | - |
      | endpoints[].request[].location | 配置場所 | string | - | `path` / `query` / `header` / `cookie` / `body` | - | - | 実装で、パラメータを入れる場所（パス・クエリ・ヘッダ・本文）にする。 | - |
      | endpoints[].request[].format | 形式 | string | - | - | - | - | 実装で、文字列の形式にする。 | - |
      | endpoints[].request[].example | 例 | string | - | - | - | - | テストで、Mock の要求の値にする。 | - |
      | endpoints[].request[].nullable | 空を許す | boolean | - | - | - | - | 実装で、`null` を送ってよいかを決める。 | - |
      | endpoints[].request[].status | 状態 | string | - | `planned` / `implemented` / `deprecated` / `removed` | - | 項目の状態で、`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）のどれか。記載しなければ実装済みとして扱う。 | 実装で、`planned` の項目を作る対象にし、`deprecated`・`removed` の項目を新しく使わない。<br>生成で、状態の表示にする。 | - |
      | endpoints[].request[].verification | 確認の状態 | string | - | `verified` / `docs_only` / `unverified` | - | 外部 API・外部ライブラリの項目（パラメータ・フィールド・設定のキー）1 つを確かめた方法で、`verified`（動かして確認した）/ `docs_only`（公式ドキュメントで確認しただけ）/ `unverified`（確認していない）のどれか。記載しなければ `unverified` として扱う。 | 実装で、`docs_only`・`unverified` の値を使用する前に動かして確認し、`verified` へ書き換える。<br>レビューで、`verified` でない値を確認せずに実装していないかを確認する。<br>生成で、表の確認の状態の列にする。 | - |
      | endpoints[].request[].verified_at | 確認日時 | string | - | - | format: `date-time` | `verification` を `verified` にした日時（ISO 8601、タイムゾーン付き）。 | 保守で、外部 API・外部ライブラリの版が上がったときに、その後に確認し直したかを判断する。<br>生成で、表の確認日時の列にする。 | `2026-11-14T10:00:00+09:00` |
      | endpoints[].request_example | リクエスト例 | string | - | - | - | JSON のコードブロック。body を持たないときはリクエストライン。 | テストで、Mock の要求の見本にする。 | - |
      | endpoints[].response | レスポンス | array | - | - | - | 別のエンドポイントと同形のときは持たず、`same_as` に記載する。 | 実装で、応答を読む型にする。 | - |
      | endpoints[].response[].name | フィールド | string | 必須 | - | - | 返らないことがあるフィールドは `field?` と記載し、条件を補足に記載する。 | 実装で、応答のフィールドの名前にする。 | - |
      | endpoints[].response[].type | 型 | string | 必須 | - | - | - | 実装で、フィールドの型にする。 | - |
      | endpoints[].response[].description | 説明 | string | 必須 | - | - | - | 実装で、値の意味を参照する。 | - |
      | endpoints[].response[].constraints | 制限 | string | - | - | - | - | 実装で、応答の値の上限・形式を参照する。 | - |
      | endpoints[].response[].notes | 補足 | string | - | - | - | - | 実装で、返らないことがあるフィールドの条件を参照する。 | - |
      | endpoints[].response[].verification | 確認の状態 | string | - | `verified` / `docs_only` / `unverified` | - | 外部 API・外部ライブラリの項目（パラメータ・フィールド・設定のキー）1 つを確かめた方法で、`verified`（動かして確認した）/ `docs_only`（公式ドキュメントで確認しただけ）/ `unverified`（確認していない）のどれか。記載しなければ `unverified` として扱う。 | 実装で、`docs_only`・`unverified` の値を使用する前に動かして確認し、`verified` へ書き換える。<br>レビューで、`verified` でない値を確認せずに実装していないかを確認する。<br>生成で、表の確認の状態の列にする。 | - |
      | endpoints[].response[].verified_at | 確認日時 | string | - | - | format: `date-time` | `verification` を `verified` にした日時（ISO 8601、タイムゾーン付き）。 | 保守で、外部 API・外部ライブラリの版が上がったときに、その後に確認し直したかを判断する。<br>生成で、表の確認日時の列にする。 | `2026-11-14T10:00:00+09:00` |
      | endpoints[].same_as | 同形のレスポンス | string | - | - | - | レスポンスが同形のエンドポイントの名前。 | 実装で、同じ形の応答の型を使い回す。 | - |
      | endpoints[].response_headers | 応答のヘッダー | array | - | - | - | - | 実装で、応答のヘッダを読む処理にする。 | - |
      | endpoints[].response_headers[].name | ヘッダー | string | 必須 | - | - | - | 実装で、読むヘッダの名前にする。 | - |
      | endpoints[].response_headers[].description | 説明 | string | 必須 | - | - | - | 実装で、ヘッダの値の意味を参照する。 | - |
      | endpoints[].response_headers[].notes | 補足 | string | - | - | - | - | 実装で、ヘッダの前提を参照する。 | - |
      | endpoints[].response_example | レスポンス例 | string | - | - | - | JSON のコードブロック。 | テストで、Mock の応答にする。 | - |
      | endpoints[].status_codes | ステータスコード | array | 必須 | - | minItems: `1` | 正常・異常とも網羅する。 | 実装で、ステータスコードごとの処理にする。<br>テストで、Mock が返すステータスコードのケースにする。 | - |
      | endpoints[].status_codes[].code | ステータスコード | string | 必須 | - | - | - | 実装で、分岐するステータスコードにする。 | - |
      | endpoints[].status_codes[].condition | 発生条件 | string | 必須 | - | - | - | 実装で、そのコードが返る条件を参照する。 | - |
      | endpoints[].status_codes[].notes | 補足 | string | - | - | - | 再試行の方針など。 | 実装で、再試行の方針にする。 | - |
      | endpoints[].refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | endpoints[].decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | endpoints[].reason | 理由 | string | - | - | - | そうしている理由。参照する側の判断が変わるものだけを記載する。 | レビューで、理由が今も成り立つかと、同じ判断を変える変更が無いかを確認する。 | - |
      | endpoints[].status | 状態 | string | - | `planned` / `implemented` / `deprecated` / `removed` | - | 項目の状態で、`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）のどれか。記載しなければ実装済みとして扱う。 | 実装で、`planned` の項目を作る対象にし、`deprecated`・`removed` の項目を新しく使わない。<br>生成で、状態の表示にする。 | - |
      | endpoints[].visibility | 公開 | string | - | `user` / `developer` | - | Pages に出すか（`user` はユーザー向けで Pages に出し、`developer` は開発者向けで dev-docs の画面だけで出す）。記載しなければ親の値を引き継ぎ、最上位の既定は `developer`。 | 生成で、Pages に出すかを決める。 | - |
      | endpoints[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにした節にする。 | - |
      | issues | 不具合一覧 | array | - | - | - | 仕様どおりに使用しても期待どおり動かない事象。 | 実装で、仕様どおりに動かない事象を避ける。<br>生成で、不具合一覧の節にする。 | - |
      | issues[].title | タイトル | string | 必須 | - | - | - | 生成で、節の見出しにする。 | - |
      | issues[].summary | 概要 | string | 必須 | - | pattern: `^[^\n]+$`, minLength: `1` | 1 行で事象を要約する。 | 生成で、不具合の一覧の説明にする。 | - |
      | issues[].occurred_on | 発生日 | string | 必須 | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | 事象を確認した日（`YYYY-MM-DD`）。再確認して続いていたら更新する。 | 保守で、事象が今も続いているかを確認し直す時期を判断する。 | - |
      | issues[].state | 状態 | string | - | `未解決` / `回避策あり` / `解消済み` | - | - | 保守で、回避策を入れたままにするかを判断する。 | - |
      | issues[].description | 概要 | string | 必須 | - | - | 何が起きるかを事実だけで記載する。 | 実装で、起きる事象を参照する。 | - |
      | issues[].conditions | 条件 | array | - | - | - | 再現する状況。 | 実装で、事象を避ける条件にする。<br>テストで、事象を再現するケースにする。 | - |
      | issues[].workarounds | 対処法 | array | 必須 | - | minItems: `1` | - | 実装で、回避策を入れる。 | - |
      | issues[].workarounds[].method | 方法 | string | 必須 | - | - | 回避策が無いときは `回避策なし`。 | 実装で、回避策の方法にする。 | - |
      | issues[].workarounds[].result | 結果 | string | 必須 | - | - | 得られるものと、本来やりたかったことからのずれ。 | 実装で、回避策を選ぶときに得られるものとずれを比べる。 | - |
      | issues[].workarounds[].recommended | 推奨 | boolean | - | - | - | 最初に試す 1 案だけ。 | 実装で、最初に試す回避策にする。 | - |
      | issues[].upstream_issue | 上流の Issue | string | - | - | - | 上流の Issue の URL。 | 保守で、上流で解消したかを確認する先にする。 | - |
      | issues[].fixed_in | 解消版 | string | - | - | - | 解消したバージョン。達したら回避策を削除する候補になる。 | 保守で、解消した版へ上げた後に回避策を外す。 | - |
      | issues[].refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | issues[].decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | issues[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにした節にする。 | - |
      | refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにした節にする。 | - |

