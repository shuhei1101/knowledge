# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-project-claude
kind: template
name: "テンプレート: プロジェクト CLAUDE"
description: リポジトリルートの CLAUDE.md の書式を定めるテンプレート。
tags:
  - name: scope:テンプレート
    main: true
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      リポジトリルートの `CLAUDE.md` の書式。
      読み手は手で開いた Claude Code のセッションで、ドキュメントの索引を引く前に要る入口だけを置く。
  - id: section-list-01
    name: セクション一覧
    body: |-
      | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- |
      | `# {プロジェクト名}` | - | 必須 |
      | `## ドキュメント` | - | 必須 |
  - id: project-name-01
    name: "`# {プロジェクト名}`"
    body: |-
      ### 記述例

      ```markdown
      # TaskFlow

      チームのタスクを 1 画面で共有・編集できるタスク管理ツール。
      ```

      ### 補足

      - 見出しはプロダクト名にする
      - 直後の 1 行はプロジェクト README の 1 行と同じ文言にする
      - 初回に書いた内容のまま保ち、後から情報を追加しない。
        対象そのものが変わったときだけ既存の記述を書き換える
  - id: documents-01
    name: "`## ドキュメント`"
    body: |-
      ### 記述例

      ```markdown
      ## ドキュメント

      実体は開発ドキュメント [dev/](./dev/) と公開ドキュメント [docs/](./docs/) にある。
      使い方は [使い方](./docs/使い方/)。

      着手前に、触るファイルに当たる規約を直下の [rules.yaml](./rules.yaml) で引いて読む。
      ```

      ### 補足

      - 実体の場所は、リポジトリの中のファイルへの相対リンク（`dev/`・`docs/` とそのタブ）で書く
      - 作業の手順・規約はドキュメントに置き、ここにはコピーしない
