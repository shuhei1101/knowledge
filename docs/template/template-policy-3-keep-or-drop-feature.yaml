tags:
  - name: scope:テンプレート
  - name: topic:方針決め
    main: true
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      方針決めの工程 3「機能の残す・捨てる」の記録の書式。
      リバースエンジニアリング（RE）で起こしたシナリオを棚卸し表にし、機能ごとに残す・作り直す・移す・捨てるを決める。

      `## 調べたこと` と `## 回答` は、テンプレート『方針決め/共通』に従う。
  - id: section-list-01
    name: セクション一覧
    body: |-
      | セクション | 必須or条件 |
      | --- | --- |
      | `## 機能の棚卸し` | 必須 |
      | `## 調べたこと` | 必須 |
      | `## 回答` | 必須（工程の確認事項が決着したとき） |
  - id: feature-inventory-01
    name: "`## 機能の棚卸し`"
    body: |-
      ### 記述例

      ```markdown
      ## 機能の棚卸し

      | 機能 | 出典 | 扱い | 理由 | 補足 |
      | --- | --- | --- | --- | --- |
      | {機能の名前} | [{シナリオ名}]({シナリオへのリンク}) | 残す | {工程 1 の目的・工程 2 の品質目標に照らした理由} | - |
      ```

      ### 補足

      **機能列:**
      - RE のシナリオ（単一ユースケース）ごとに 1 行にし、シナリオの取りこぼしを残さない

      **扱い列:**
      - `残す`（今のまま使う）/ `作り直す`（同じ機能を新しい構造で作る）/ `移す`（別の場所・別のシステムへ渡す）/ `捨てる`（作らない）のどれかを書く

      **理由列:**
      - 既存システムの挙動を仕様として扱わず、工程 1 の目的と工程 2 の品質目標に照らして書く
      - `捨てる` の行は、使われていないことか目的に寄与しないことの根拠を書く

      **補足列:**
      - `移す` の行は、移し先を書く
  - id: researched-01
    name: "`## 調べたこと`"
    body: |-
      ### 記述例

      ```markdown
      ## 調べたこと

      | 題材 | 分かったこと | 出典 | 補足 |
      | --- | --- | --- | --- |
      | Legacy Displacement の Feature Parity | {分かったこと} | [{出典名}]({URL}) | - |
      ```

      ### 補足

      - 題材の行は記述例の 1 つで始める
  - id: answer-01
    name: "`## 回答`"
    body: |-
      ### 記述例

      テンプレート『方針決め/共通』の `## 回答` に従う。

      ### 補足

      - 論点は、`捨てる` と `移す` の機能と、判断が分かれた機能を単位にする
