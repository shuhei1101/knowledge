  - name: topic:方針
  - name: action:記録
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      方針決めの工程 3「機能の残す・捨てる」の記録の書式。
      リバースエンジニアリング（RE）で作成したシナリオを棚卸し表にし、機能ごとに維持・再作成・移行・廃止を決める。

      `## 調べたこと` と `## 回答` は、テンプレート『方針決め/共通』に従う。
  - id: section-list-01
    name: セクション一覧
    body: |-
      | セクション | 必須or条件 |
      | --- | --- |
      | `## 機能の棚卸し` | 必須 |
      | `## 調べたこと` | 必須 |
      | `## 回答` | 必須（工程の確認事項が決着したとき） |
  - id: feature-inventory-01
    name: "`## 機能の棚卸し`"
    body: |-
      ### 記述例

      ```markdown
      ## 機能の棚卸し

      | 機能 | 出典 | 扱い | 理由 | 補足 |
      | --- | --- | --- | --- | --- |
      | {機能の名前} | [{シナリオ名}]({シナリオへのリンク}) | 維持 | {工程 1 の目的・工程 2 の品質目標に照らした理由} | - |
      ```

      ### 補足

      <!-- table: data -->

      | 列 | 記載方法 |
      | --- | --- |
      | 機能列 | RE のシナリオ（単一ユースケース）ごとに 1 行にし、シナリオの取りこぼしを残さない |
      | 扱い列 | `維持`（今のまま使用する）/ `再作成`（同じ機能を新しい構造で作る）/ `移行`（別の場所・別のシステムへ移す）/ `廃止`（作らない）のどれかを記載する |
      | 理由列 | 既存システムの挙動を仕様として扱わず、工程 1 の目的と工程 2 の品質目標に照らして記載する<br>`廃止` の行は、使用されていないことか目的に寄与しないことの根拠を記載する |
      | 補足列 | `移行` の行は、移行先を記載する |

      <!-- /table -->
  - id: researched-01
    name: "`## 調べたこと`"
    body: |-
      ### 記述例

      ```markdown
      ## 調べたこと

      | 題材 | 分かったこと | 出典 | 補足 |
      | --- | --- | --- | --- |
      | Legacy Displacement の Feature Parity | {分かったこと} | [{出典名}]({URL}) | - |
      ```

      ### 補足

      - 題材の行は記述例の 1 つで始める
  - id: answer-01
    name: "`## 回答`"
    body: |-
      ### 記述例

      テンプレート『方針決め/共通』の `## 回答` に従う。

      ### 補足

      - 論点は、`廃止` と `移行` の機能と、判断が分かれた機能を単位にする
