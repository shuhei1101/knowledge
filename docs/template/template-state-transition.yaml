# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-state-transition
kind: template
name: "テンプレート: 状態遷移"
description: 1 エンティティが取りうる状態と許可された遷移を記載する状態遷移の書式を定め、状態遷移の設計書を作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:エンティティ
  - name: topic:テンプレート
  - name: topic:状態遷移
    main: true
  - name: topic:設計書
  - name: action:遷移
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      1 エンティティが取りうる状態と、許可された遷移。
      図は状態と遷移の表から生成する。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 ファイル = 1 エンティティにする。
      - 副作用・実装の関数は別の設計書に記載する。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | title | タイトル | string | 必須 | - | pattern: `^状態遷移: .+$` | `状態遷移: {エンティティ名}`。 | 生成で、ページの見出しにする。<br>dev-docs の検索で、文書の名前にする。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>dev-docs の検索で、文書の概要文にする。 | - |
      | state_transitions | 状態遷移 | object | 必須 | - | - | 状態の一覧と遷移の表。状態遷移図はここから生成する。 | 実装で、状態の値と許可する遷移の判定にする。<br>テストで、許可した遷移と許可しない遷移のケースにする。<br>生成で、状態遷移図と状態・遷移の表にする。 | - |
      | state_transitions.states | 状態 | array | 必須 | - | minItems: `1` | - | 実装で、状態の値の一覧にする。 | - |
      | state_transitions.states[].name | 状態名 | string | 必須 | - | - | 業務用語での状態の名前。遷移の元・先はこの名前で指す。 | 生成で、図の状態の名前にする。<br>設計で、遷移の元・先から状態を指す名前にする。 | - |
      | state_transitions.states[].identifier | 識別子 | string | 必須 | - | - | 実装上の値・ラベル・フラグ。 | 実装で、状態を表す値・ラベル・フラグにする。 | `status = draft` |
      | state_transitions.states[].sub_identifier | 備考識別子 | string | - | - | - | 複数の識別子で状態を表すときの補助の識別子（assignee・補助ラベル 等）。 | 実装で、識別子と組み合わせて状態を判定する値にする。 | - |
      | state_transitions.states[].entry_condition | 入る条件 | string | - | - | - | この状態に入る条件。 | 実装で、状態に入る前に確認する条件にする。<br>テストで、条件を満たさないときに状態に入らないケースにする。 | - |
      | state_transitions.states[].entry_value | 入る値 | string | - | - | - | この状態に入ったときに入る値。 | 実装で、状態に入ったときに書き込む値にする。 | `` `started_at` が入る `` |
      | state_transitions.states[].on_enter | 入る時の処理 | string | - | - | - | - | 実装で、状態に入ったときに実行する処理にする。 | - |
      | state_transitions.states[].on_exit | 出る時の処理 | string | - | - | - | - | 実装で、状態を出るときに実行する処理にする。 | - |
      | state_transitions.states[].notes | 補足 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 実装で、状態の前提・制約を参照する。 | - |
      | state_transitions.initial | 初期状態 | string | 必須 | - | - | 作成時に入る状態の名前。 | 実装で、作成時に入れる状態にする。<br>生成で、図の開始の矢印にする。 | - |
      | state_transitions.final | 終了状態 | array | - | - | - | 消える前の最後の状態の名前。 | 実装で、遷移を受け付けない状態にする。<br>生成で、図の終了の矢印にする。 | - |
      | state_transitions.transitions | 遷移 | array | 必須 | - | minItems: `1` | 許可された遷移。図はこの並びで描く。 | 実装で、許可する遷移の一覧にする。<br>テストで、遷移ごとのケースにする。 | - |
      | state_transitions.transitions[].from | 元 | string | 必須 | - | - | 元の状態の名前。どの状態からも入る遷移は `全状態`。 | 実装で、遷移を許可する元の状態にする。 | - |
      | state_transitions.transitions[].to | 先 | string | 必須 | - | - | 先の状態の名前。入る前の状態へ戻る遷移は `元の状態`。 | 実装で、遷移の先の状態にする。 | - |
      | state_transitions.transitions[].trigger | きっかけ | string | - | - | - | 遷移のきっかけになる操作や出来事。 | 実装で、遷移を起こす操作・出来事にする。<br>生成で、矢印のラベルにする。 | - |
      | state_transitions.transitions[].condition | 条件 | string | - | - | - | きっかけに付く条件。図では `{きっかけ} [{条件}]` と描く。 | 実装で、遷移する前に確認する条件にする。<br>生成で、矢印のラベルに添える。 | - |
      | state_transitions.transitions[].action | そのときの処理 | string | - | - | - | - | 実装で、遷移のときに実行する処理にする。 | - |
      | state_transitions.transitions[].self | 状態を出ない | boolean | - | - | - | 状態を出ずに処理だけを実行する遷移（元と先が同じ）。 | 実装で、状態を変えずに処理だけを実行する遷移にする。<br>生成で、自分へ戻る矢印にする。 | - |
      | state_transitions.transitions[].representative | 代表 | string | - | - | - | `全状態` / `元の状態` の遷移を図で代表させる状態の名前。図には代表との遷移だけを描く。 | 生成で、`全状態`・`元の状態` の遷移を描く代表の状態にする。 | - |
      | state_transitions.transitions[].note | 注記 | string | - | - | - | `全状態` の遷移に図で添える注記。 | 生成で、`全状態` の遷移の注記にする。 | - |
      | refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにした節にする。 | - |

      <!-- /table -->
  - id: key-rules-01
    name: キーごとの決まり
    body: |-
      <!-- table: data -->

      | 名前 | 決まり | 悪い例 | 理由 |
      | --- | --- | --- | --- |
      | id | 設計書を作るときに振り、改名・移動でも変えない。 | - | - |
      | lead | 初回に記載した内容のまま保ち、後から情報を追加しない（仕様は各項目に記載する）。<br>対象そのものが変わったときだけ書き換える。 | 決済の API。仕様は次のとおり。タイムアウトは 30 秒で、3 回までリトライする。 | 仕様を冒頭リードに記載している。仕様は各項目へ分ける |
      | state_transitions.states[].notes | 他の設計書を指すときは説明文の中にリンクを記載せず、参照は `refs`（`ref` の配列）に持つ。 | - | - |
      | notes | 同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補にする。 | - | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      id: ST-1
      title: '状態遷移: 記事'
      lead: '`記事` が取りうる状態と許可された遷移の一覧。'
      state_transitions:
        states:
        - name: 下書き
          identifier: status = draft
        - name: 公開
          identifier: status = published
        initial: 下書き
        final:
        - 公開
        transitions:
        - from: 下書き
          to: 公開
          trigger: 承認
      ```
