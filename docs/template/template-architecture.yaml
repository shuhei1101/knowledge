# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-architecture
kind: template
name: "テンプレート: アーキテクチャ図"
description: システム全体の輪郭（サブシステムの分け方・外部システムとの境界）を記載するアーキテクチャ図のテンプレート。
tags:
  - name: scope:テンプレート
    main: true
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      システム全体の輪郭（サブシステムの分け方・外部システムとの境界）。1 プロジェクト 1 ファイル。
      後から変えると全サブシステムに波及するものだけを扱う。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | title | タイトル | string | 必須 | - | - | `アーキテクチャ図`。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。<br>初回に書いた内容のまま保ち、後から情報を追加しない（仕様は各項目に書く）。<br>対象そのものが変わったときだけ書き換える。 | - |
      | overview | システム全体図 | object | 必須 | - | - | アクター・サブシステム・外部システムの関係を 1 枚で示す。向きは `LR`。<br>自プロジェクトのサブシステムは枠で囲み、外部システムは枠の外に置く（ノードの `kind` を `external`）。<br>矢印のラベルにはプロトコルか用途を 1 語で書く。モジュール・クラス・エンドポイントは載せない。 | - |
      | overview.direction | 向き | string | - | TD / TB / LR / RL / BT | - | 図の向き。書かなければ図の種類の既定（判定は `TD`、データフロー・アーキテクチャは `LR`）。 | - |
      | overview.nodes | ノード | array | 必須 | - | - | - | - |
      | overview.nodes[].id | ID | string | 必須 | - | pattern: ^[^\s\[\](){}<>\|"]+$ | 図の中で一意なノードの ID。空白と記号を含めない。 | - |
      | overview.nodes[].label | 表示 | string | 必須 | - | - | ノードに出す文言。半角の括弧は描画を崩すので全角で書く。 | - |
      | overview.nodes[].shape | 形状 | string | - | rect / round / stadium / diamond / circle / cylinder / hexagon / parallelogram / subroutine | - | ノードの形状。書かなければ `rect`。<br>`rect`（四角）/ `round`（角丸）/ `stadium`（開始・終端 `([…])`）/ `diamond`（判定）/ `circle`（処理）/ `cylinder`（データストア）/ `hexagon` / `parallelogram`（入出力ポート）/ `subroutine`。 | - |
      | overview.nodes[].kind | 要素の種類 | string | - | actor / process / store / system / external | - | データフロー・アーキテクチャで、ノードが何を表すか。`actor`（人・外部の相手）/ `process`（処理）/ `store`（データストア）/ `system`（システム・サブシステム）/ `external`（外部システム）。 | - |
      | overview.edges | 辺 | array | 必須 | - | - | 図に描く順の辺。 | - |
      | overview.edges[].from | 元 | string | 必須 | - | - | 元のノードの `id`。 | - |
      | overview.edges[].to | 先 | string | 必須 | - | - | 先のノードの `id`。 | - |
      | overview.edges[].label | ラベル | string | - | - | - | 矢印のラベル。判定は `YES` / `NO`、データフローは流れるデータの名前。 | - |
      | overview.edges[].line | 線 | string | - | solid / dotted / thick / open | - | 線の種類。書かなければ `solid`（`-->`）。`dotted`（`-.->`）/ `thick`（`==>`）/ `open`（`---`）。 | - |
      | overview.subgraphs | 枠 | array | - | - | - | - | - |
      | overview.subgraphs[].id | ID | string | 必須 | - | pattern: ^[A-Za-z0-9_]+$ | - | - |
      | overview.subgraphs[].label | 表示 | string | - | - | - | - | - |
      | overview.subgraphs[].nodes | 中のノード | array | 必須 | - | - | 枠の中に置くノードの `id`。 | - |
      | overview.clicks | リンク | array | - | - | - | - | - |
      | overview.clicks[].id | ノード | string | 必須 | - | - | リンクを付けるノードの `id`。 | - |
      | overview.clicks[].href | リンク先 | string | 必須 | - | - | 押したときに開く先（相対パス + アンカー）。 | - |
      | repository | リポジトリ構成 | object | 必須 | - | - | - | - |
      | repository.style | 方式 | string | 必須 | モノレポ / ポリレポ | - | - | - |
      | repository.repositories | リポジトリ | array | 必須 | - | minItems: 1 | - | - |
      | repository.repositories[].name | リポジトリ | string | 必須 | - | - | `owner/name`。 | - |
      | repository.repositories[].subsystem | サブシステム | string | - | - | - | ポリレポのとき。 | - |
      | repository.layout | 配置 | string | - | - | - | - | - |
      | repository.notes | 補足 | string | - | - | - | - | - |
      | subsystems | サブシステム一覧 | array | 必須 | - | minItems: 1 | 独立してテスト・デプロイできる単位。 | - |
      | subsystems[].name | サブシステム | string | 必須 | - | - | 業務的な役割で命名する。 | - |
      | subsystems[].scope | scope | string | 必須 | - | pattern: ^[a-z0-9]+(-[a-z0-9]+)*$ | 英小文字のケバブケースの識別子。 | - |
      | subsystems[].role | 役割 | string | 必須 | - | - | 責務の境界が読み取れる 1 行。 | - |
      | subsystems[].runtime | 言語・ランタイム | string | 必須 | - | - | 言語とメジャーバージョンまで。 | - |
      | subsystems[].runs_on | どこで動くか | string | - | - | - | - | - |
      | subsystems[].refs | 関連 | array | - | - | - | - | - |
      | subsystems[].reason | 理由 | string | - | - | - | そうしている理由。読み手の判断が変わるものだけを書く。 | - |
      | subsystems[].status | 状態 | string | - | planned / implemented / deprecated / removed | - | 項目の状態。`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）。書かなければ実装済みとして扱う。 | - |
      | subsystems[].visibility | 公開 | string | - | user / developer | - | 公開の範囲。`user`（ユーザー向け）/ `developer`（開発者向け）。<br>書かなければ親の値を引き継ぎ、最上位の既定は `developer`。 | - |
      | subsystems[].implementation | 実装 | string | - | - | pattern: ^[^#\s]+(#\S+)?$ | 実装の場所。リポジトリの直下からのファイルのパスに、`#` とシンボルの名前を続けてよい。 | `src/app/features/profile/service.py#update_profile` |
      | subsystems[].introduced | 導入 | object | - | - | - | 入ったバージョンと PR。 | - |
      | subsystems[].introduced.version | バージョン | string | - | - | - | 入ったバージョンのタグ（例 `v0.3.0`）。 | - |
      | subsystems[].introduced.pr | PR | integer | - | - | - | 入れた PR の番号。 | - |
      | subsystems[].aliases | 別名 | array | - | - | - | 検索で当てたい言い換え。 | - |
      | subsystems[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |
      | external_systems | 外部システム連携 | array | - | - | - | 境界を越えて通信する相手。1 要素 = 外部疎通のテスト 1 ファイル。無いときは持たない。 | - |
      | external_systems[].name | 外部システム | string | 必須 | - | - | 子プロセスとして起動する CLI も含む。<br>銘柄が決まっていないときは `{種別}（銘柄未定）`。 | - |
      | external_systems[].purpose | 用途 | string | 必須 | - | - | - | - |
      | external_systems[].direction | 方向 | string | 必須 | 送信のみ / 受信のみ / 双方向 | - | - | - |
      | external_systems[].protocol | 技術 | string | - | - | - | プロトコル・形式。 | - |
      | external_systems[].detail | 詳細 | string | - | - | pattern: ^[^#\s]*#(?:[^\s\[]\|\[[^\]]*\])*$ | API なら `設計書/外部API/`、それ以外（SDK・CLI 等）なら `設計書/外部ライブラリ/` の設計書。<br>持たないのは銘柄未定の行だけ（設計書はその外部システムを使い始める設計で作る）。 | `dev/設計書/インターフェース定義/バックエンド/タスク作成.py#flows[正常系]` |
      | external_systems[].test_file | 対応非機能要件テスト | string | - | - | pattern: ^tests/external/.+ | 外部疎通のテストのファイル（`tests/external/test_{名前}.py`）。1 外部システム = 1 ファイル。 | - |
      | external_systems[].cost | 料金・副作用 | string | - | - | - | - | - |
      | external_systems[].refs | 関連 | array | - | - | - | - | - |
      | external_systems[].reason | 理由 | string | - | - | - | そうしている理由。読み手の判断が変わるものだけを書く。 | - |
      | external_systems[].status | 状態 | string | - | planned / implemented / deprecated / removed | - | 項目の状態。`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）。書かなければ実装済みとして扱う。 | - |
      | external_systems[].visibility | 公開 | string | - | user / developer | - | 公開の範囲。`user`（ユーザー向け）/ `developer`（開発者向け）。<br>書かなければ親の値を引き継ぎ、最上位の既定は `developer`。 | - |
      | external_systems[].implementation | 実装 | string | - | - | pattern: ^[^#\s]+(#\S+)?$ | 実装の場所。リポジトリの直下からのファイルのパスに、`#` とシンボルの名前を続けてよい。 | `src/app/features/profile/service.py#update_profile` |
      | external_systems[].introduced | 導入 | object | - | - | - | 入ったバージョンと PR。 | - |
      | external_systems[].introduced.version | バージョン | string | - | - | - | 入ったバージョンのタグ（例 `v0.3.0`）。 | - |
      | external_systems[].introduced.pr | PR | integer | - | - | - | 入れた PR の番号。 | - |
      | external_systems[].aliases | 別名 | array | - | - | - | 検索で当てたい言い換え。 | - |
      | external_systems[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |
      | quality_goals | 品質目標 | string | - | - | - | Markdown で書く本文。<br>他の設計書を指すときは説明文の中にリンクを書かず、参照は `refs`（`ref` の配列）に持つ。 | - |
      | constraints | 制約 | string | - | - | - | Markdown で書く本文。<br>他の設計書を指すときは説明文の中にリンクを書かず、参照は `refs`（`ref` の配列）に持つ。 | - |
      | crosscutting | 横断の方針 | string | - | - | - | Markdown で書く本文。<br>他の設計書を指すときは説明文の中にリンクを書かず、参照は `refs`（`ref` の配列）に持つ。 | - |
      | refs | 関連 | array | - | - | - | - | - |
      | notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。<br>同じ名前のセクションが多くの設計書に出たら、標準の項目へ格上げする候補になる。 | - |

      <!-- /table -->
  - id: example-sample-01
    name: 記載例
    body: |-
      ```yaml
      title: アーキテクチャ図
      lead: TaskFlow のサブシステムと外部システムとの境界。
      overview:
        nodes:
        - id: U
          label: ユーザー
          shape: stadium
          kind: actor
        - id: FE
          label: フロントエンド
          kind: system
        - id: BE
          label: バックエンド
          kind: system
        - id: DB
          label: PostgreSQL
          shape: cylinder
          kind: store
        - id: MAIL
          label: SendGrid
          kind: external
        edges:
        - from: U
          to: FE
        - from: FE
          to: BE
          label: REST
        - from: BE
          to: DB
        - from: BE
          to: MAIL
          label: メール送信
        subgraphs:
        - id: SYS
          label: TaskFlow
          nodes:
          - FE
          - BE
          - DB
      repository:
        style: モノレポ
        repositories:
        - name: owner/taskflow
        layout: '`frontend/` / `backend/`'
      subsystems:
      - name: フロントエンド
        scope: frontend
        role: 画面の描画とユーザー操作の受付
        runtime: TypeScript 5 / Node.js 22
      - name: バックエンド
        scope: backend
        role: 業務ロジックと永続化
        runtime: Python 3.12
      external_systems:
      - name: SendGrid
        purpose: メール送信
        direction: 送信のみ
        protocol: HTTPS
        detail: dev/設計書/外部API/SendGrid#
        test_file: tests/external/test_sendgrid.py
        cost: '副作用: 実メールを送信する'
      - name: 認証基盤（銘柄未定）
        purpose: ユーザー認証
        direction: 双方向
      ```
