      システム全体の輪郭（サブシステムの分け方・外部システムとの境界）。
  - id: rules-01
    name: 決まり
    body: |-
      - 1 プロジェクト 1 ファイルにする。
      - 後から変えると全サブシステムに波及するものだけを扱う。
