      | tags[].main | 主題 | boolean | - | - | - | 最も分量の多い主題のタグだけ `true` にする。 | 検索で、文書の主題のタグとして扱う。 | - |
      | aliases | 別名 | array | - | - | - | 検索でヒットさせたい言い換え。 | project-index の検索で、文書を名前と同じように検索できる言い換えにする。 | `[フォルダ構成の設計書]` |
      | title | タイトル | string | 必須 | - | - | `アーキテクチャ図`。 | 生成で、ページの見出しにする。<br>project-index の検索で、文書の名前にする。 | - |
      | lead | 冒頭リード | string | - | - | - | 対象を 1〜3 行で説明する。 | 生成で、ページの冒頭の説明にする。<br>project-index の検索で、文書の概要文にする。 | - |
      | overview | システム全体図 | object | 必須 | - | - | アクター・サブシステム・外部システムの関係を 1 枚で示す。 | 生成で、システム全体図にする。<br>設計で、機能を配置するサブシステムを、サブシステムと外部システムのつながりから決める。 | - |
