      ```yaml
      id: ARCH-1
      title: アーキテクチャ図
      lead: TaskFlow のサブシステムと外部システムとの境界。
      overview:
        nodes:
        - id: U
          label: ユーザー
          kind: actor
        - id: FE
          label: フロントエンド
          kind: system
        - id: BE
          label: バックエンド
          kind: system
        - id: DB
          label: PostgreSQL
          kind: store
        - id: MAIL
          label: SendGrid
          kind: external
        edges:
        - from: U
          to: FE
        - from: FE
          to: BE
          label: REST
        - from: BE
          to: DB
        - from: BE
          to: MAIL
          label: メール送信
        frame:
          label: TaskFlow
          nodes:
          - FE
          - BE
          - DB
      repository:
        style: モノレポ
        repositories:
        - name: owner/taskflow
      subsystems:
      - name: フロントエンド
        scope: frontend
        role: 画面の描画とユーザー操作の受付
        runtime: TypeScript 5 / Node.js 22
      - name: バックエンド
        scope: backend
        role: 業務ロジックと永続化
        runtime: Python 3.12
      external_systems:
      - name: SendGrid
        purpose: メール送信
        direction: 送信のみ
        protocol: HTTPS
        detail: API-1#
        test_file: tests/external/test_sendgrid.py
        cost: '副作用: 実メールを送信する'
      - name: 認証基盤（銘柄未定）
        purpose: ユーザー認証
        direction: 双方向
      ```
