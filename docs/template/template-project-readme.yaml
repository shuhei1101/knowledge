# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-project-readme
kind: template
name: "テンプレート: プロジェクト README"
description: リポジトリルートの README.md の書式を定め、プロジェクトの README.md を作る・修正するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:readme
  - name: topic:テンプレート
  - name: topic:プロジェクト
    main: true
  - name: topic:リポジトリ
status: current
visibility: internal
rev: 4
items:
  - id: overview
    name: 概要
    body: |-
      リポジトリルートの `README.md` の書式。
      読者は GitHub でリポジトリを開いた人で、ドキュメントへの入口だけを配置する。

      `docs/` 配下の `README.md`（目次ページ）は書式が違う。
  - id: section-list-01
    name: セクション一覧
    body: |-
      | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- |
      | `# {プロジェクト名}` | - | 必須 |
  - id: project-name-01
    name: "`# {プロジェクト名}`"
    body: |-
      ### 記述例

      ```markdown
      # TaskFlow

      チームのタスクを 1 画面で共有・編集できるタスク管理ツール。

      ドキュメント: [docs/](./docs/)
      ```

      ### 補足

      - 見出し・1 行・ドキュメントへのリンクの 3 つだけを配置する
      - 見出しはプロダクト名にする（リポジトリ名と同じでもよい）
      - 1 行は GitHub の repository description と同じ文言にし、「誰の何を解決するか」を記載する
      - リンクはドキュメントのトップ 1 本だけにする
      - ドキュメントを GitHub Pages で公開しているときは、リンクを Pages のトップの URL（`https://{owner}.github.io/{repo}/`）にする
      - 初回に記載した内容のまま保ち、後から情報を追加しない。
        概要・機能・セットアップはドキュメントの `はじめに` / `使い方` に記載する。
        対象そのものが変わったときだけ既存の記述を書き換える
