# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-template
kind: template
name: "テンプレート: テンプレート"
description: テンプレートのページを作るときの共通書式（メタテンプレート）を定め、テンプレートを新しく作る・修正するときに読む。
tags:
  - name: scope:テンプレート
    main: true
  - name: topic:ページ
  - name: topic:文章
status: current
visibility: internal
rev: 4
items:
  - id: overview
    name: 概要
    body: |-
      `docs/template/template-{対象}.yaml` 形式のテンプレートページを作るときの共通書式（メタテンプレート）。
      すべてのテンプレートのページは本ページの構造に従う。

      **用語の使い分け（重要）:**
      - **テンプレート** (`docs/template/template-*.yaml`) … 実体ファイル（PR 本文 / ER 図 / 外部 API 等）の **書式定義**。
        「何を / どう書くか」の雛形
      - **規約** … プロセス・手順・ルール。
        「どう作業するか」を定める
      - 本ページは「テンプレートを書くための雛形」= **メタテンプレート** なので `docs/template/template-template.yaml`

      **テンプレートには書式だけを書く（重要）:**
      - テンプレートは本文の**たたき台**。
        書いてよいのは 冒頭リード（何の書式か 1〜3 行）/ セクション一覧 / 各セクションの記述例と記入時の補足 のみ
      - **背景説明・運用フロー・検討の進め方・他方式との対比 は書かない**（テンプレートの責務ではない）
      - テンプレートは他プロジェクトにも流用するため、**特定プロジェクト固有の内容を含ませない**
      - 補足は**正の指示（何をどう書くか）だけ**にする。
        記述例に無い内容はそもそも出力されないので、「〜は書かない」式の禁止注釈を並べない（情報量ゼロの制約はコンテキストを汚し精度を下げる）

      **テンプレートのバージョン:**

      テンプレートと実体ファイルは個別のバージョンを持たない。

      配置先は `docs/template/template-{対象}.yaml`（ファイル名は `id`。例: `docs/template/template-external-api.yaml`）。
      「ページ」サフィックスは付けない。
  - id: section-list-01
    name: セクション一覧
    body: |-
      | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- |
      | 冒頭リード（`overview`） | - | 必須 |
      | セクション一覧 | - | 必須 |
      | `{セクション名}` | `### 記述例` / `### 補足` | 必須（実体ファイルの各セクション（`group` の最上位）につき 1 つ） |
      | `{サブセクション名}` | `### 記述例` / `### 補足` | 動的サブセクション（`group` の ` > ` の下）を定義する場合のみ |
  - id: lead-01
    name: "`冒頭リード`"
    body: |-
      ### 記述例

      ```yaml
      name: "テンプレート: {対象}"
      description: （このテンプレートが何の書式を定めるかと、どんなときに読むかを 1 文。[description の書き方](id:dev-tag-term-registration#description-01)）
      items:
        - id: overview
          name: 概要
          body: |-
            （このページが何を定義しているか・何のために存在するかを 1〜3 行）

            配置先は `docs/{種類}/{ID}.yaml`（例: `docs/guide/guide-setup-install-plugin.yaml`）。
            新規作成時の手順（例: 「`rules.yaml` に行を追加」）も冒頭に記載する。
      ```

      ### 補足

      - タイトルはメタデータ `name`、概要文はメタデータ `description`、冒頭リードは `id: overview` の項目の本文に記載する
      - ページの目的を最初に明示し、読み手が「何の規約か」を 3 秒で把握できるようにする
      - 実体ファイルのファイル名規約・命名規則を冒頭で固定
      - 新規作成時に行う付随作業（`rules.yaml` への行の追加など）も冒頭でまとめる
      - 横に長くなりすぎないように「。」で区切って改行する
      - 初回に書いた内容のまま保ち、後から情報を追加しない（[冒頭リード・概要のルール（全規約共通）](id:template-template#lead-summary-rule-01)）
  - id: section-list-code-01
    name: "`セクション一覧`"
    body: |-
      ### 記述例

      ```yaml
      - id: section-list-01
        name: セクション一覧
        body: |-
          | セクション | サブセクション | 必須or条件 |
          | --- | --- | --- |
          | `概要` | - | 必須 |
          | `API 一覧` | `{メソッド名}` | 必須（一覧表の各行につき 1 サブセクション） |
      ```

      ### 補足

      **セクション列:**
      - 実体ファイルの項目の `group` の最上位の名前を `{名前}` 形式（バッククォート囲み）で

      **サブセクション列:**
      - 動的サブセクションがあれば `{名前テンプレ}`、なければ `-`

      **必須or条件列:**
      - `必須` / `{条件} の場合のみ` / `必須（{追加条件}）` などで明示

      **補足:**
      - 冒頭リードの直後に必ず置く。
        読み手が全体構造を一望できるようにする
      - 順序は実体ファイルでの登場順と揃える
  - id: section-name-01
    name: "`{セクション名}`"
    body: |-
      実体ファイルの各セクション（`group` の最上位）について、書き方を定義する単位。
      1 セクションにつき 1 つの項目（`name` は `{名前}`）を置く。

      ### 記述例

      ````yaml
      - id: overview-01
        name: "`概要`"
        body: |-
          **概要:**

          このセクションが何を書く場所か・何のために書くかを 1〜2 文で。

          **記述例:**

          ```yaml
          - id: overview
            name: 概要
            body: |-
              （実物のコピペ可能な YAML 記入例）
          ```

          **{カラム名}列:**
          - 表があるセクションの場合、各列の固有ルールをここに書く
          - 補足列は基本省略（特殊ルールがあれば書く）

          **補足:**
          - 全体的な運用ルール・注意点
          - 表の場合は「表に書ききれない内容は `※n` で表外に詳細」など
      ````

      ### 補足

      **順序:**
      - **概要 → 記述例 → カラム別ルール → 補足** を厳守
      - 「概要」は省略可（特に説明不要なシンプルなセクションのみ）

      **記述例の書式:**
      - ` ```yaml ` のコードフェンスで実物（項目の YAML）をそのまま貼る
      - コードフェンスを入れ子にする場合は外側を ` ```` ` で 4 連バッククォート

      **表のあるセクションのカラム別ルール:**
      - `**{カラム名}列:**` の太字見出し + 箇条書きで各列のルール
      - 特殊ルールがある列だけ書く
      - 補足列は汎用のため通常省略

      **補足ブロック:**
      - 必ず最後に置く（カラム別ルールの後）
      - 全体に共通する注意点・運用ルールを箇条書きで
  - id: sentence-rule-01
    name: 文章のルール（全規約共通）
    body: |-
      本文（冒頭リード・説明文・箇条書き）は**句点（。）ごとに改行する**（1 文 = 1 行。レンダリングでは 1 段落に結合される）。
      エディタで横スクロールが発生する長い 1 行を作らない。
      文を追記するときも既存行への連結ではなく新しい行に追加する。
      表のセル・見出しは対象外（セル内の改行は `<br>`）。
  - id: table-rule-common-01
    name: 表のルール（全規約共通）
    body: |-
      すべての表に以下を必須化する。

      | ルール | 内容 |
      | --- | --- |
      | 補足列 | 最右に必須（任意の追加情報用） |
      | 表外の詳細 | 表に書ききれない複雑な内容は `※1` `※2` … のマーカーを該当セルに入れ、表の直下に `※1: 〜` で記述 |
      | 該当なし | 値が該当しない列は `-` |
  - id: lead-summary-rule-01
    name: 冒頭リード・概要のルール（全規約共通）
    body: |-
      冒頭リード（`overview` の項目の本文）とメタデータ `description` は、対象が何かを示すためだけに置く。
      どちらも初回に書いた内容のまま保ち、後から情報を追加しない。

      条件・仕様・判断の根拠は本体のセクション（表・図・一覧）に書く。
      冒頭リードにも重ねて書くと同じ内容を 2 箇所で管理することになり、片方だけが古くなる。

      対象そのものが変わったときだけ、既存の記述を書き換える。

      テンプレートを新設するときは、冒頭リード（`overview`）のセクション定義の補足にこのルールを書く。
      逃がし先のセクション名は、そのテンプレートの実体ファイルに合わせて具体化する。
