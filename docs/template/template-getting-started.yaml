# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-getting-started
kind: template
name: "テンプレート: はじめに"
description: はじめにタブの概要とクイックスタートの 2 ページの書式を定め、プロジェクトを初めて使う人向けのはじめにページを作るときに読む。
tags:
  - name: scope:テンプレート
  - name: topic:はじめに
    main: true
  - name: topic:クイックスタート
  - name: topic:タブ
  - name: topic:テンプレート
  - name: topic:プロジェクト
  - name: topic:ページ
  - name: topic:手順
status: current
visibility: internal
rev: 4
items:
  - id: overview
    name: 概要
    body: |-
      `docs/guide/` に置く、はじめにの概要とクイックスタートの 2 ページの書式。
      読み手はプロジェクトを初めて使う人。

      配置先は `docs/guide/guide-getting-started-overview.yaml` と `docs/guide/guide-getting-started-quickstart.yaml`（ファイル名は `id`）。
      タグは `scope:使い方` と、主題の `topic:はじめに`（`main: true`）にする。
  - id: section-list-01
    name: セクション一覧
    body: |-
      <!-- table: data -->

      | 対象ファイル | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- | --- |
      | 概要 | 冒頭リード（`overview`） | - | 必須 |
      | 概要 | `できること` | - | 必須 |
      | 概要 | `次に読むもの` | - | 必須 |
      | クイックスタート | 冒頭リード（`overview`） | - | 必須 |
      | クイックスタート | `前提` | - | 必須 |
      | クイックスタート | `手順` | `{やること}` | 必須 |
      | クイックスタート | `次に読むもの` | - | 必須 |

      <!-- /table -->
  - id: lead-overview-01
    name: "`冒頭リード`（概要）"
    body: |-
      ### 記述例

      ```yaml
      name: 概要
      items:
        - id: overview
          name: 概要
          body: |-
            TaskFlow は、チームのタスクの作成・割り当て・進捗の更新を 1 画面で済ませるタスク管理ツールです。
      ```

      ### 補足

      - 何をするプロダクトかを 1〜2 行で、利用者に向けて書く
      - 初回に書いた内容のまま保ち、後から情報を追加しない。
        できることは `できること` の項目に書く。
        対象そのものが変わったときだけ既存の記述を書き換える
  - id: capabilities-01
    name: "`できること`"
    body: |-
      ### 記述例

      ```yaml
      - id: capabilities-01
        group: できること
        name: できること
        body: |-
          - タスクを 1 画面で共有する: 担当と期限をチームの全員が同じ画面で見る（[タスクを見る](id:guide-usage-view-task)）
          - 期限の前に知らせを受ける: 期限の前日に担当者へメールが届く（[通知先を設定する](id:guide-setup-configure-notification)）
      ```

      ### 補足

      - 5〜7 個を箇条書きで並べる
      - 1 項目は「{できること}: {どうなるか}（{実ページへのリンク}）」の 1 行にする
      - リンク先は `使い方` / `リファレンス` のページにする
  - id: next-reading-overview-01
    name: "`次に読むもの`（概要）"
    body: |-
      ### 記述例

      ```yaml
      - id: next-reading-01
        group: 次に読むもの
        name: 次に読むもの
        body: |-
          - [クイックスタート](id:guide-getting-started-quickstart): 手元で動かして最初の 1 周を試す
          - [はじめてのセットアップ](id:guide-setup-first-time): セットアップを順に済ませる
      ```

      ### 補足

      - クイックスタートとはじめてのセットアップを必ず含め、「{ページ}: {何ができるか}」の書式で並べる
  - id: lead-quickstart-01
    name: "`冒頭リード`（クイックスタート）"
    body: |-
      ### 記述例

      ```yaml
      name: クイックスタート
      items:
        - id: overview
          name: 概要
          body: |-
            終わったとき、手元で動くサーバーでタスクを 1 件作り、画面に出るところまでを確かめられています。
      ```

      ### 補足

      - 終えたときに何が確かめられているかを 1 行で書く
  - id: prerequisite-01
    name: "`前提`"
    body: |-
      ### 記述例

      ```yaml
      - id: prerequisite-01
        group: 前提
        name: 前提
        body: |-
          - Python 3.14 と uv
          - [API キーを用意する](id:guide-setup-prepare-api-key) で発行した API キー
      ```

      ### 補足

      - 手順を始める前に手元に要るもの（ランタイム・アカウント・発行済みの値）を並べ、用意する手順があればリンクする
  - id: procedure-01
    name: "`手順`"
    body: |-
      ### 記述例

      ````yaml
      - id: step-clone-01
        group: 手順 > クローンする
        name: クローン
        body: |-
          ```bash
          git clone https://github.com/{owner}/{repo}.git
          cd {repo}
          ```
      - id: step-start-01
        group: 手順 > 起動する
        name: 起動
        body: |-
          ```bash
          uv run python -m taskflow
          ```

          `http://127.0.0.1:8000` を開くと画面が出ます。
      ````

      ### 補足

      - クローン → 設定 → 起動 → 最初の 1 回の操作 → 結果の確認 までを、`group` を `手順 > {やること}` にした項目で実行順に並べる
      - 各手順は 1〜2 行の説明とコマンドのコードブロックにする
      - 詳しい設定はクイックスタートでは扱わず、`次に読むもの` でセットアップ手順へ誘導する
      - 詰まりやすい手順の後には `困ったとき` のページへのリンクを置く
  - id: next-reading-quickstart-01
    name: "`次に読むもの`（クイックスタート）"
    body: |-
      ### 記述例

      ```yaml
      - id: next-reading-01
        group: 次に読むもの
        name: 次に読むもの
        body: |-
          - [セットアップ手順](id:guide-setup-first-time): クイックスタートで飛ばした設定を済ませる
          - [困ったとき](id:guide-troubleshooting): 動かないときの切り分け
      ```

      ### 補足

      - `使い方` のセクションへの導線を「{セクション}: {何ができるか}」の書式で並べる
