# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-getting-started
kind: template
name: "テンプレート: はじめに"
description: はじめにタブの概要とクイックスタートの書式を定め、プロジェクトを初めて使う人向けのはじめにページを作るときに読む。
tags:
  - name: scope:テンプレート
    main: true
status: current
visibility: internal
rev: 2
items:
  - id: overview
    name: 概要
    body: |-
      `はじめに` タブのうち、`はじめに/概要.md` と `はじめに/クイックスタート.md` の 2 ページの書式。
      読み手はプロジェクトを初めて使う人。

      配置先は `docs/はじめに/概要.md` と `docs/はじめに/クイックスタート.md`。
      新規作成時は `docs/はじめに/index.yaml`（目次）の `items` の先頭に 概要 → クイックスタート の順で行を追加し、README を再生成する。
  - id: section-list-01
    name: セクション一覧
    body: |-
      <!-- table: data -->

      | 対象ファイル | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- | --- |
      | 概要 | 冒頭リード | - | 必須 |
      | 概要 | `## できること` | - | 必須 |
      | 概要 | `## 次に読むもの` | - | 必須 |
      | クイックスタート | 冒頭リード | - | 必須 |
      | クイックスタート | `## 前提` | - | 必須 |
      | クイックスタート | `## 手順` | `### {番号}. {やること}` | 必須 |
      | クイックスタート | `## 次に読むもの` | - | 必須 |

      <!-- /table -->
  - id: lead-overview-01
    name: "`冒頭リード`（概要）"
    body: |-
      ### 記述例

      ```markdown
      # 概要

      TaskFlow は、チームのタスクの作成・割り当て・進捗の更新を 1 画面で済ませるタスク管理ツールです。
      ```

      ### 補足

      - 何をするプロダクトかを 1〜2 行で、利用者に向けて書く
      - 初回に書いた内容のまま保ち、後から情報を追加しない。
        できることは `## できること` に書く。
        対象そのものが変わったときだけ既存の記述を書き換える
  - id: capabilities-01
    name: "`## できること`"
    body: |-
      ### 記述例

      ```markdown
      ## できること

      - タスクを 1 画面で共有する: 担当と期限をチームの全員が同じ画面で見る（[タスクを見る](../使い方/日々の操作/タスクを見る.md)）
      - 期限の前に知らせを受ける: 期限の前日に担当者へメールが届く（[通知先を設定する](../使い方/セットアップ手順/通知先を設定する.md)）
      ```

      ### 補足

      - 5〜7 個を箇条書きで並べる
      - 1 項目は「{できること}: {どうなるか}（{実ページへのリンク}）」の 1 行にする
      - リンク先は `使い方` / `リファレンス` のページにする
  - id: next-reading-overview-01
    name: "`## 次に読むもの`（概要）"
    body: |-
      ### 記述例

      ```markdown
      ## 次に読むもの

      - [クイックスタート](./クイックスタート.md): 手元で動かして最初の 1 周を試す
      - [はじめてのセットアップ](../使い方/セットアップ手順/はじめてのセットアップ.md): セットアップを順に済ませる
      ```

      ### 補足

      - クイックスタートとはじめてのセットアップを必ず含め、「{ページ}: {何ができるか}」の書式で並べる
  - id: lead-quickstart-01
    name: "`冒頭リード`（クイックスタート）"
    body: |-
      ### 記述例

      ```markdown
      # クイックスタート

      終わったとき、手元で動くサーバーでタスクを 1 件作り、画面に出るところまでを確かめられています。
      ```

      ### 補足

      - 終えたときに何が確かめられているかを 1 行で書く
  - id: prerequisite-01
    name: "`## 前提`"
    body: |-
      ### 記述例

      ```markdown
      ## 前提

      - Python 3.14 と uv
      - [API キーを用意する](../使い方/セットアップ手順/APIキーを用意する.md) で発行した API キー
      ```

      ### 補足

      - 手順を始める前に手元に要るもの（ランタイム・アカウント・発行済みの値）を並べ、用意する手順があればリンクする
  - id: procedure-01
    name: "`## 手順`"
    body: |-
      ### 記述例

      ````markdown
      ## 手順

      ### 1. クローンする

      ```bash
      git clone https://github.com/{owner}/{repo}.git
      cd {repo}
      ```

      ### 2. 起動する

      ```bash
      uv run python -m taskflow
      ```

      `http://127.0.0.1:8000` を開くと画面が出ます。
      ````

      ### 補足

      - クローン → 設定 → 起動 → 最初の 1 回の操作 → 結果の確認 までを、`### {番号}. {やること}` で番号を付けて並べる
      - 各手順は 1〜2 行の説明とコマンドのコードブロックにする
      - 詳しい設定はクイックスタートでは扱わず、`## 次に読むもの` でセットアップ手順へ誘導する
      - 詰まりやすい手順の後には `困ったとき` のページへのリンクを置く
  - id: next-reading-quickstart-01
    name: "`## 次に読むもの`（クイックスタート）"
    body: |-
      ### 記述例

      ```markdown
      ## 次に読むもの

      - [セットアップ手順](../使い方/セットアップ手順/): クイックスタートで飛ばした設定を済ませる
      - [困ったとき](../使い方/困ったとき/): 動かないときの切り分け
      ```

      ### 補足

      - `使い方` のセクションへの導線を「{セクション}: {何ができるか}」の書式で並べる
