items:
  - id: overview
    name: 概要
    body: |-
      方針決めの工程 1「目的と制約」の記録の書式。
      何を解決するための刷新かと、外せない制約・自分で課した制約を決める。

      `## 調べたこと` と `## 回答` は、テンプレート『方針決め/共通』に従う。
  - id: section-list-01
    name: セクション一覧
    body: |-
      | セクション | 必須or条件 |
      | --- | --- |
      | `## 質問と回答` | 必須 |
      | `## 制約` | 必須 |
      | `## 調べたこと` | 必須 |
      | `## 回答` | 必須（工程の確認事項が決着したとき） |
  - id: question-answer-01
    name: "`## 質問と回答`"
    body: |-
      ### 記述例

      ```markdown
      ## 質問と回答

      | 質問 | 判断基準 | 回答 | 補足 |
      | --- | --- | --- | --- |
      | 何を解決するための刷新か | 目的を 1 つに絞り、他の目的は順位を付けて並べる | {目的 1（最優先）/ 目的 2 …} | - |
      | 困っている変更の具体例は何か | 直近で実際に手間取った変更を、変更の内容と掛かった手間で書く | {変更の内容と手間} | - |
      | システムの外の手作業は何か | コードに現れない手作業（デプロイ・データの修正・確認）を、頻度と担当者つきで書く | {手作業と頻度・担当者} | - |
      | 問題にどう気づくか | 検知の手段（アラート・問い合わせ・目視）を書き、手段が無い問題は「無い」と書く | {気づき方} | - |
      | 成功の基準は何か | 刷新の前後で比べられる値か、観測できる状態で書く | {基準} | - |
      | 終わりの定義は何か | 旧システムを止める条件を、観測できる状態で書く | {定義} | - |
      | 刷新中に新機能を追加するか | 追加する / 追加しないのどちらかで回答し、追加するなら対象を書く | {追加する / 追加しない} | - |
      ```

      ### 補足

      **質問列・判断基準列:**
      - 記述例の文言のまま置き、回答列だけを埋める

      **回答列:**
      - たたき台のときは推奨の回答を書き、ユーザーの回答で確定した内容へ書き換える
      - 根拠を補足列に書く
  - id: constraint-01
    name: "`## 制約`"
    body: |-
      ### 記述例

      ```markdown
      ## 制約

      | 制約 | 種別 | 外せるか | 補足 |
      | --- | --- | --- | --- |
      | {制約の内容} | 外せない | - | {外せない理由} |
      | {制約の内容} | 自分で課した | {外せる / 外せない} | {外せる条件か外せない理由} |
      ```

      ### 補足

      **種別列:**
      - `外せない`（法令・契約・外部システムの仕様など、自分たちでは変えられないもの）か `自分で課した`（既存の技術選定・慣習・過去の判断）のどちらかを書く

      **外せるか列:**
      - 種別が `自分で課した` の行だけ、外せるかを判断して書く（`外せない` の行は `-`）
      - 外せる制約は、外した場合に得られるものを補足列に書く
  - id: researched-01
    name: "`## 調べたこと`"
    body: |-
      ### 記述例

      ```markdown
      ## 調べたこと

      | 題材 | 分かったこと | 出典 | 補足 |
      | --- | --- | --- | --- |
      | Kill It with Fire の 4 つの質問 | {分かったこと} | [{出典名}]({URL}) | - |
      | Legacy Displacement の目的 | {分かったこと} | [{出典名}]({URL}) | - |
      | arc42 の制約 | {分かったこと} | [{出典名}]({URL}) | - |
      ```

      ### 補足

      - 題材の行は記述例の 3 つで始める
  - id: answer-01
    name: "`## 回答`"
    body: |-
      ### 記述例

      テンプレート『方針決め/共通』の `## 回答` に従う。

      ### 補足

      - 論点は、目的の絞り込み・外せる制約・刷新中の新機能を単位にする
