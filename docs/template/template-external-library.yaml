# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-external-library
kind: template
name: "テンプレート: 外部ライブラリ"
description: 採用した外部ライブラリ 1 つにつき 1 ファイルで、使用する部分だけを公式ドキュメントから抜き出す外部ライブラリの書式を定め、外部ライブラリを採用して設計書を作るときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:テンプレート
  - name: topic:ファイル
  - name: topic:ライブラリ
    main: true
  - name: topic:文書
  - name: topic:設計書
  - name: action:採用
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      採用した外部ライブラリ 1 つにつき 1 ファイル。
      そのプロジェクトで使用する部分だけを公式ドキュメントから抜き出す。
  - id: rules-01
    name: 決まり
    body: |-
      - 参照はモジュール構成 → 外部ライブラリの一方向にする。
      - 自プロジェクトのファイル・モジュールには言及しない（使用箇所を除く）。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>project-index の配信で、文書の公開範囲のメタデータにする。 | - |
      | tags | タグ | array | - | - | - | 設計書を検索で絞り込むタグで、`name` にタグの名前（`action:`・`topic:`・`tool:` などで始める）、最も分量の多い主題 1 つに `main: true` を記載する。<br>付け方は knowledge の規約『文書のタグと description の記載』に従う。 | project-index の検索で、文書をタグで絞り込む。 | `[{main: true, name: topic:タグ}, name: action:記載]` |
      | tags[].name | タグの名前 | string | 必須 | - | minLength: `1` | タグの名前。`action:`・`topic:`・`tool:` などで始める。 | 検索で、文書をタグで絞り込む値にする。 | - |
      | tags[].main | 主題 | boolean | - | - | - | 最も分量の多い主題のタグだけ `true` にする。 | 検索で、文書の主題のタグとして扱う。 | - |
      | aliases | 別名 | array | - | - | - | 検索でヒットさせたい言い換え。 | project-index の検索で、文書を名前と同じように検索できる言い換えにする。 | `[フォルダ構成の設計書]` |
      | title | タイトル | string | 必須 | - | - | ライブラリ名（パッケージ名）。ファイル名に合わせる。 | 生成で、ページの見出しにする。<br>project-index の検索で、文書の名前にする。 | - |
      | lead | 冒頭リード | string | - | - | - | ライブラリが何をするものかを 1〜3 行で要約する。 | 生成で、ページの冒頭の説明にする。<br>project-index の検索で、文書の概要文にする。 | - |
      | kind | 種類 | string | 必須 | `ライブラリ` / `フレームワーク` / `CLI` / `サービス` / `コンテナ` / `CDN の JS` / `標準ライブラリ` | - | ライブラリの種類（言語のパッケージ・CLI・CDN 等）。 | 実装で、依存の定義（言語のパッケージ・CLI・CDN）のどこに入れるかを決める。 | - |
      | purl | 識別子 | string | - | - | - | パッケージの識別子（purl）。 | 保守で、脆弱性の情報とライセンスを参照する識別子にする。 | `pkg:pypi/ruamel.yaml` |
      | supplier | 提供元 | string | - | - | - | ライブラリを提供する組織・個人。 | レビューで、提供元の保守の状況を確認する。 | - |
      | dependency_scope | 依存の範囲 | string | - | `必須` / `任意` / `開発のみ` | - | 依存の範囲（実行時・開発時）。 | 実装で、依存を実行時・開発時のどちらに入れるかを決める。 | - |
      | adoption | 採用状態 | string | - | `採用` / `未採用` | - | 採用の状態（採用・検討中・廃止）。 | 実装で、採用したライブラリだけを使用し、検討中・廃止のものを新しく使用しない。 | - |
      | used_in | 使用箇所 | array | - | - | - | 呼び出す境界層のパス（リポジトリの直下から）。エージェントの手順から呼ぶ CLI は手順を持つドキュメントのパス。 | 保守で、ライブラリを上げる・削除するときに修正する境界層のファイルを探す。 | - |
      | upstream | 上流リポジトリ | string | - | - | pattern: `^[^/\s]+/[^/\s]+$` | GitHub の `owner/repo`。規約『不具合の報告』の上流 Issue の検索がここを参照する。 | 保守で、不具合に遭遇したときに上流の Issue を検索する。 | - |
      | verification | 動作確認 | object | - | - | - | 動かして確認したか。 | 実装で、実装の前にライブラリを動かして確認済みかを判断する。<br>レビューで、確認していないライブラリに理由があるかを確認する。 | - |
      | verification.state | 状態 | string | 必須 | `済` / `未確認` | - | ライブラリを動かして確認したか（`済`・`未確認`）。 | 実装で、実装の前に動作確認が要るかを判断する。 | - |
      | verification.date | 確認日 | string | - | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | `YYYY-MM-DD`。 | 保守で、確認の記録が古くなっていないかを判断する。 | - |
      | verification.detail | 確認内容 | string | - | - | - | 確認した内容か、確認できない理由。 | 実装で、確認していないライブラリを使用してよいかを判断する。 | - |
      | version | 現在のバージョン情報 | object | 必須 | - | - | 採用しているバージョンと、上げる判断に要る情報。 | 保守で、ライブラリを上げるかを判断する。 | - |
      | version.current | バージョン | string | 必須 | - | - | 採用しているバージョン。 | 保守で、最新版と比べて上げるかを判断する。<br>実行で、動作確認したバージョンと実行環境のバージョンを比べる。 | - |
      | version.latest | 最新版 | string | - | - | - | 確認した時点の最新版。 | 保守で、採用しているバージョンと比べて上げるかを判断する。 | - |
      | version.checked_on | 確認日 | string | 必須 | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | 最新バージョンを確認した日（`YYYY-MM-DD`）。 | 保守で、最新版の情報が古くなっていないかを判断する。 | - |
      | version.source | バージョンの出所 | string | - | - | - | 突き合わせる依存の定義（`uv.lock` / `pyproject.toml` / CDN の URL）。 | 保守で、採用しているバージョンを突き合わせる依存の定義のファイルを決める。 | - |
      | version.pinning | バージョンの固定方法 | string | - | - | - | バージョンの固定方法（完全一致・範囲 等）。 | 保守で、依存を上げるときのバージョンの指定の記載方法にする。 | - |
      | version.support_until | サポート期限 | string | - | - | - | サポートが切れる日（`YYYY-MM-DD`）。 | 計画で、サポートが切れる前に上げる作業を計画する。 | - |
      | version.security_until | セキュリティ対応の期限 | string | - | - | - | セキュリティ対応が切れる日（`YYYY-MM-DD`）。 | 計画で、セキュリティ対応が切れる前に上げる作業を計画する。 | - |
      | version.lts | LTS | boolean | - | - | - | 採用しているバージョンが LTS なら `true`。 | 保守で、上げる先のバージョンを LTS から選ぶ。 | - |
      | license | ライセンス | string | - | - | - | 商用利用の可否を確認して記載する。 | レビューで、配布の形態とライセンスが合うかを確認する。 | - |
      | official_url | 公式 URL | string | - | - | - | ライブラリの公式ページの URL。 | 実装で、仕様を確認するときに公式のページを開く。 | - |
      | docs_url | 公式ドキュメント | string | - | - | - | API リファレンスの URL。 | 実装で、仕様を確認するときに API リファレンスを開く。 | - |
      | selection | 選定の記録 | object | - | - | - | 採用のときに比べた候補・決め手・受け入れた制約。 | 設計で、置き換えを検討するときに、前に比べた候補を比較の対象に含める。 | - |
      | selection.candidates | 比べた候補 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 設計で、置き換えを検討するときに、前に比べた候補を比較の対象に含める。 | - |
      | selection.decision | 決めた理由 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | レビューで、採用の理由が今も成り立つかを確認する。 | - |
      | selection.consequences | 結果 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 実装で、採用で受け入れた制約を満たす使用方法にする。 | - |
      | install | インストール手順 | string | - | - | - | バージョンを固定したコマンドと、追加の設定（コードブロック）。 | 実行で、環境を作るときにライブラリを入れるコマンドにする。 | - |
      | catalogs | 一覧 | array | 必須 | - | minItems: `1` | 使用する API・コマンド・設定を単位ごとに並べた一覧。1 要素 = 1 つの単位。 | 実装で、呼ぶ API・コマンドと指定する設定を決める。<br>生成で、一覧の表とセクションにする。 | - |
      | catalogs[].name | 単位 | string | 必須 | - | - | 列挙する対象の単位（`API` / `コマンド` / `設定` / `ファイル` / `環境変数` / `同梱プラグイン` 等）。見出しは `{単位} 一覧`。 | 生成で、`{単位} 一覧` の見出しにする。 | - |
      | catalogs[].version | バージョン | string | 必須 | - | - | 一覧を作ったバージョン。 | 保守で、ライブラリを上げたときに一覧を再作成するかを判断する。 | - |
      | catalogs[].entries | 対象 | array | 必須 | - | minItems: `1` | このプロジェクトで使用する対象だけ。一覧の表は各対象の種別・名前・用途から生成する。 | 実装で、使用する関数・コマンドの呼び方にする。 | - |
      | catalogs[].entries[].name | 名前 | string | 必須 | - | - | 対象の名前（関数・コンポーネント・コマンド 等）。 | 実装で、呼ぶ関数・コンポーネント・コマンドの名前にする。<br>設計で、ほかの設計書の参照から対象を指す。 | - |
      | catalogs[].entries[].kind | 種別 | string | 必須 | - | - | `コンポーネント` / `関数` / `フック` / `クラス` / `定数` / `コマンド` 等。 | 生成で、一覧の種別にする。 | - |
      | catalogs[].entries[].purpose | 用途 | string | 必須 | - | pattern: `^[^\n]+$`, minLength: `1` | 1 行の用途。 | 生成で、一覧の用途にする。<br>実装で、目的に合う対象を選ぶ。 | - |
      | catalogs[].entries[].description | 説明 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 実装で、対象の挙動に合わせて、呼び出しの前後の処理を決める。 | - |
      | catalogs[].entries[].params | パラメータ | array | - | - | - | 使用するものだけでなく主要なパラメータも全て記載する。 | 実装で、指定する引数にする。 | - |
      | catalogs[].entries[].params[].name | パラメータ | string | 必須 | - | - | オブジェクトの子は `parent.child`、配列の要素の子は `parent[].child`。 | 実装で、引数の名前にする。 | - |
      | catalogs[].entries[].params[].type | 型 | string | 必須 | - | - | 取りうる値が限られるときは列挙し、各値の意味は補足に記載する。 | 実装で、引数の型にする。 | - |
      | catalogs[].entries[].params[].required | 必須 | boolean | - | - | - | 省けない引数なら `true`。 | 実装で、省けない引数にする。 | - |
      | catalogs[].entries[].params[].default | 既定 | string | - | - | - | 任意のパラメータの省略時の値。 | 実装で、パラメータを省くか、明示するかを決める。 | - |
      | catalogs[].entries[].params[].description | 説明 | string | 必須 | - | - | 引数が何を表すか。 | 実装で、引数に入れる値を決める。 | - |
      | catalogs[].entries[].params[].constraints | 制限 | string | - | - | - | 値の上限・下限・形式などの制限。 | 実装で、指定する前の検証にする。 | - |
      | catalogs[].entries[].params[].notes | 補足 | string | - | - | - | 引数の前提（ほかの引数との組み合わせ・既定の挙動 等）。 | 実装で、引数の組み合わせと前提を、指定する前の検証にする。 | - |
      | catalogs[].entries[].params[].verification_state | 確認の状態 | string | - | `verified` / `docs_only` / `unverified` | - | 外部 API・外部ライブラリの項目（パラメータ・フィールド・設定のキー）1 つを確認した方法で、`verified`（動かして確認した）/ `docs_only`（公式ドキュメントで確認しただけ）/ `unverified`（確認していない）のどれか。記載しなければ `unverified` として扱う。 | 実装で、`docs_only`・`unverified` の値を使用する前に動かして確認し、`verified` へ書き換える。<br>レビューで、`verified` でない値を確認せずに実装していないかを確認する。<br>生成で、表の確認の状態の列にする。 | - |
      | catalogs[].entries[].params[].verified_at | 確認日時 | string | - | - | format: `date-time` | `verification_state` を `verified` にした日時（ISO 8601、タイムゾーン付き）。 | 保守で、外部 API・外部ライブラリのバージョンが上がったときに、その後に再確認したかを判断する。<br>生成で、表の確認日時の列にする。 | `2026-11-14T10:00:00+09:00` |
      | catalogs[].entries[].params_example | パラメータ例 | string | - | - | - | import 込みの最小の動く例（コードブロック）。 | 実装で、呼び出しの見本にする。 | - |
      | catalogs[].entries[].returns | 戻り値 | array | - | - | - | 単純な値は `name` を `-` にした 1 要素。 | 実装で、戻り値の受け取りに使用する型にする。 | - |
      | catalogs[].entries[].returns[].name | フィールド | string | 必須 | - | - | 返らないことがあるフィールドは `field?` と記載し、条件を補足に記載する。 | 実装で、戻り値のフィールドの名前にする。 | - |
      | catalogs[].entries[].returns[].type | 型 | string | 必須 | - | - | フィールドの型。 | 実装で、フィールドの型にする。 | - |
      | catalogs[].entries[].returns[].description | 説明 | string | 必須 | - | - | フィールドの値が何を表すか。 | 実装で、フィールドの値で分岐する条件を決める。 | - |
      | catalogs[].entries[].returns[].constraints | 制限 | string | - | - | - | 値の上限・形式などの制限。 | 実装で、戻り値を受け取る型と検証の範囲にする。 | - |
      | catalogs[].entries[].returns[].notes | 補足 | string | - | - | - | フィールドの前提（返らない条件 等）。 | 実装で、フィールドが返らないときの扱いを決める。 | - |
      | catalogs[].entries[].returns_example | 戻り値例 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | テストで、Mock の戻り値にする。 | - |
      | catalogs[].entries[].refs | 関連 | array | - | - | - | 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。 | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | catalogs[].entries[].decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | catalogs[].entries[].reason | 理由 | string | - | - | - | そうしている理由。参照する側の判断が変わるものだけを記載する。 | レビューで、理由が今も成り立つかと、同じ判断を変える変更が無いかを確認する。 | - |
      | catalogs[].entries[].status | 状態 | string | - | `planned` / `implemented` / `deprecated` / `removed` | - | 項目の状態で、`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）のどれか。記載しなければ実装済みとして扱う。 | 実装で、`planned` の項目を作る対象にし、`deprecated`・`removed` の項目を新しく使用しない。<br>生成で、状態の表示にする。 | - |
      | catalogs[].entries[].visibility | 公開 | string | - | `user` / `developer` | - | Pages に出すか（`user` はユーザー向けで Pages に出し、`developer` は開発者向けで dev-docs の画面だけで出す）。記載しなければ親の値を引き継ぎ、最上位の既定は `developer`。 | 生成で、Pages に出すかを決める。 | - |
      | catalogs[].entries[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。 | - |
      | catalogs[].entries[].verification_state | 確認の状態 | string | - | `verified` / `docs_only` / `unverified` | - | 対象（関数・コマンド・設定のキー 等）の振る舞いを確認した方法。引数ごとの状態は `params[].verification_state` に記載する。 | 実装で、`docs_only`・`unverified` の値を使用する前に動かして確認し、`verified` へ書き換える。<br>レビューで、`verified` でない値を確認せずに実装していないかを確認する。<br>生成で、表の確認の状態の列にする。 | - |
      | catalogs[].entries[].verified_at | 確認日時 | string | - | - | format: `date-time` | `verification_state` を `verified` にした日時（ISO 8601、タイムゾーン付き）。 | 保守で、外部 API・外部ライブラリのバージョンが上がったときに、その後に再確認したかを判断する。<br>生成で、表の確認日時の列にする。 | `2026-11-14T10:00:00+09:00` |
      | limitations | 制限事項 | array | - | - | - | 仕様として常に成り立つ制約。 | 実装で、ライブラリでできないことに依存しない。<br>レビューで、制限事項に該当する使用方法が無いかを確認する。 | - |
      | limitations[].item | 事項 | string | 必須 | - | - | 制限の対象を表す短い名前。 | 生成で、表の行の名前にする。 | - |
      | limitations[].content | 内容 | string | 必須 | - | - | 制限の内容（できないこと・満たすべき条件）。 | 実装で、守る制約にする。 | - |
      | limitations[].notes | 補足 | string | - | - | - | 制限の前提（有効なバージョン・設定 等）。 | 実装で、制限が有効になるバージョン・設定のときの回避の処理を決める。 | - |
      | usage_limits | 利用上限 | array | - | - | - | 提供元が定める利用の上限。1 要素 = 1 つの上限。 | 設計で、非機能要件の利用上限の値の出所にする。<br>実装で、上限に達したときの処理にする。 | - |
      | usage_limits[].item | 項目 | string | 必須 | - | - | `利用枠` / `到達時の挙動` / `解除時刻` 等。 | 生成で、表の行の名前にする。 | - |
      | usage_limits[].content | 内容 | string | 必須 | - | - | 上限の値と、達したときの挙動。 | 実装で、上限の値と到達時の挙動にする。 | - |
      | usage_limits[].notes | 補足 | string | - | - | - | 上限の前提（数え方・プラン 等）。 | 実装で、上限を数える単位を、上限に達する前の制御にする。 | - |
      | issues | 不具合一覧 | array | - | - | - | 仕様どおりに使用しても期待どおり動かない事象。 | 実装で、仕様どおりに動かない事象を回避する。<br>生成で、不具合一覧のセクションにする。 | - |
      | issues[].title | タイトル | string | 必須 | - | - | 事象を 1 行で表したタイトル。 | 生成で、セクションの見出しにする。 | - |
      | issues[].summary | 概要 | string | 必須 | - | pattern: `^[^\n]+$`, minLength: `1` | 1 行で事象を要約する。 | 生成で、不具合の一覧の説明にする。 | - |
      | issues[].occurred_on | 発生日 | string | 必須 | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | 事象を確認した日（`YYYY-MM-DD`）。再確認して続いていたら更新する。 | 保守で、事象が今も続いているかを再確認する時期を判断する。 | - |
      | issues[].state | 状態 | string | - | `未解決` / `回避策あり` / `解消済み` | - | 提供元での対応の状態。 | 保守で、回避策を入れたままにするかを判断する。 | - |
      | issues[].description | 概要 | string | 必須 | - | - | 何が起きるかを事実だけで記載する。 | 実装で、事象を回避する処理を入れるかを決める。 | - |
      | issues[].conditions | 条件 | array | - | - | - | 再現する状況。 | 実装で、事象を回避する条件にする。<br>テストで、事象を再現するケースにする。 | - |
      | issues[].workarounds | 対処法 | array | 必須 | - | minItems: `1` | 回避策。1 要素 = 1 つの回避策。 | 実装で、回避策を入れる。 | - |
      | issues[].workarounds[].method | 方法 | string | 必須 | - | - | 回避策が無いときは `回避策なし`。 | 実装で、回避策の方法にする。 | - |
      | issues[].workarounds[].result | 結果 | string | 必須 | - | - | 得られるものと、本来やりたかったことからのずれ。 | 実装で、回避策を選ぶときに得られるものとずれを比べる。 | - |
      | issues[].workarounds[].recommended | 推奨 | boolean | - | - | - | 最初に試す 1 案だけ。 | 実装で、最初に試す回避策にする。 | - |
      | issues[].upstream_issue | 上流の Issue | string | - | - | - | 上流の Issue の URL。 | 保守で、上流で解消したかを確認する先にする。 | - |
      | issues[].fixed_in | 解消版 | string | - | - | - | 解消したバージョン。達したら回避策を削除する候補になる。 | 保守で、解消したバージョンへ上げた後に回避策を削除する。 | - |
      | issues[].refs | 関連 | array | - | - | - | 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。 | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | issues[].decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | issues[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにしたセクションにする。 | - |
      | refs | 関連 | array | - | - | - | 関連する設計書の項目を `{ID}#{項目のパス}` で記載する。 | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | notes | 補足 | object | - | - | - | 対象固有の解説セクション（セクションの名前 → 本文）。一覧・制限事項・不具合に属さないもの。 | 実装で、一覧・制限事項・不具合に属さない対象固有の挙動に合わせて使用方法を決める。 | - |

