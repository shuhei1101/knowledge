# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-external-library
kind: template
name: "テンプレート: 外部ライブラリ"
description: 採用した外部ライブラリ 1 つにつき 1 ファイルで、使用する部分だけを公式ドキュメントから抜き出す外部ライブラリの書式を定め、外部ライブラリを採用して設計書を作るときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:テンプレート
  - name: topic:ファイル
  - name: topic:ライブラリ
    main: true
  - name: topic:文書
  - name: topic:設計書
  - name: action:採用
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      採用した外部ライブラリ 1 つにつき 1 ファイル。
      そのプロジェクトで使用する部分だけを公式ドキュメントから抜き出す。
  - id: rules-01
    name: 決まり
    body: |-
      - 参照はモジュール構成 → 外部ライブラリの一方向にする。
      - 自プロジェクトのファイル・モジュールには言及しない（使用箇所を除く）。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | `IF-12` / `IF-3038-1` |
      | title | タイトル | string | 必須 | - | - | ライブラリ名（パッケージ名）。ファイル名に合わせる。 | - |
      | lead | 冒頭リード | string | - | - | - | ライブラリが何をするものかを 1〜3 行で要約する。 | - |
      | kind | 種類 | string | 必須 | `ライブラリ` / `フレームワーク` / `CLI` / `サービス` / `コンテナ` / `CDN の JS` / `標準ライブラリ` | - | - | - |
      | purl | 識別子 | string | - | - | - | パッケージの識別子（purl）。 | `pkg:pypi/ruamel.yaml` |
      | supplier | 提供元 | string | - | - | - | - | - |
      | dependency_scope | 依存の範囲 | string | - | `必須` / `任意` / `開発のみ` | - | - | - |
      | adoption | 採用状態 | string | - | `採用` / `未採用` | - | - | - |
      | used_in | 使用箇所 | array | - | - | - | 呼び出す境界層のパス（リポジトリの直下から）。エージェントの手順から呼ぶ CLI は手順を持つドキュメントのパス。 | - |
      | upstream | 上流リポジトリ | string | - | - | pattern: `^[^/\s]+/[^/\s]+$` | GitHub の `owner/repo`。規約『不具合の報告』の上流 Issue の検索がここを参照する。 | - |
      | verification | 動作確認 | object | - | - | - | 動かして確認したか。 | - |
      | verification.state | 状態 | string | 必須 | `済` / `未確認` | - | - | - |
      | verification.date | 確認日 | string | - | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | `YYYY-MM-DD`。 | - |
      | verification.detail | 確認内容 | string | - | - | - | 確認した内容か、確認できない理由。 | - |
      | version | 現在のバージョン情報 | object | 必須 | - | - | - | - |
      | version.current | バージョン | string | 必須 | - | - | 採用しているバージョン。 | - |
      | version.latest | 最新版 | string | - | - | - | - | - |
      | version.checked_on | 確認日 | string | 必須 | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | 最新バージョンを確認した日（`YYYY-MM-DD`）。 | - |
      | version.source | バージョンの出所 | string | - | - | - | 突き合わせる依存の定義（`uv.lock` / `pyproject.toml` / CDN の URL）。 | - |
      | version.pinning | バージョンの固定方法 | string | - | - | - | - | - |
      | version.support_until | サポート期限 | string | - | - | - | - | - |
      | version.security_until | セキュリティ対応の期限 | string | - | - | - | - | - |
      | version.lts | LTS | boolean | - | - | - | - | - |
      | license | ライセンス | string | - | - | - | 商用利用の可否を確認して記載する。 | - |
      | official_url | 公式 URL | string | - | - | - | - | - |
      | docs_url | 公式ドキュメント | string | - | - | - | API リファレンスの URL。 | - |
      | selection | 選定の記録 | object | - | - | - | - | - |
      | selection.candidates | 比べた候補 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | - |
      | selection.decision | 決めた理由 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | - |
      | selection.consequences | 結果 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | - |
      | install | インストール手順 | string | - | - | - | バージョンを固定したコマンドと、追加の設定（コードブロック）。 | - |
      | catalogs | 一覧 | array | 必須 | - | minItems: `1` | - | - |
      | catalogs[].name | 単位 | string | 必須 | - | - | 列挙する対象の単位（`API` / `コマンド` / `設定` / `ファイル` / `環境変数` / `同梱プラグイン` 等）。見出しは `{単位} 一覧`。 | - |
      | catalogs[].version | バージョン | string | 必須 | - | - | 一覧を作ったバージョン。 | - |
      | catalogs[].entries | 対象 | array | 必須 | - | minItems: `1` | このプロジェクトで使用する対象だけ。一覧の表は各対象の種別・名前・用途から生成する。 | - |
      | catalogs[].entries[].name | 名前 | string | 必須 | - | - | 対象の名前（関数・コンポーネント・コマンド 等）。 | - |
      | catalogs[].entries[].kind | 種別 | string | 必須 | - | - | `コンポーネント` / `関数` / `フック` / `クラス` / `定数` / `コマンド` 等。 | - |
      | catalogs[].entries[].purpose | 用途 | string | 必須 | - | pattern: `^[^\n]+$`, minLength: `1` | 1 行の用途。 | - |
      | catalogs[].entries[].description | 説明 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | - |
      | catalogs[].entries[].params | パラメータ | array | - | - | - | 使用するものだけでなく主要なパラメータも全て記載する。 | - |
      | catalogs[].entries[].params[].name | パラメータ | string | 必須 | - | - | オブジェクトの子は `parent.child`、配列の要素の子は `parent[].child`。 | - |
      | catalogs[].entries[].params[].type | 型 | string | 必須 | - | - | 取りうる値が限られるときは列挙し、各値の意味は補足に記載する。 | - |
      | catalogs[].entries[].params[].required | 必須 | boolean | - | - | - | - | - |
      | catalogs[].entries[].params[].default | 既定 | string | - | - | - | 任意のパラメータの省略時の値。 | - |
      | catalogs[].entries[].params[].description | 説明 | string | 必須 | - | - | - | - |
      | catalogs[].entries[].params[].constraints | 制限 | string | - | - | - | - | - |
      | catalogs[].entries[].params[].notes | 補足 | string | - | - | - | - | - |
      | catalogs[].entries[].params_example | パラメータ例 | string | - | - | - | import 込みの最小の動く例（コードブロック）。 | - |
      | catalogs[].entries[].returns | 戻り値 | array | - | - | - | 単純な値は `name` を `-` にした 1 要素。 | - |
      | catalogs[].entries[].returns[].name | フィールド | string | 必須 | - | - | 返らないことがあるフィールドは `field?` と記載し、条件を補足に記載する。 | - |
      | catalogs[].entries[].returns[].type | 型 | string | 必須 | - | - | - | - |
      | catalogs[].entries[].returns[].description | 説明 | string | 必須 | - | - | - | - |
      | catalogs[].entries[].returns[].constraints | 制限 | string | - | - | - | - | - |
      | catalogs[].entries[].returns[].notes | 補足 | string | - | - | - | - | - |
      | catalogs[].entries[].returns_example | 戻り値例 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | - |
      | catalogs[].entries[].refs | 関連 | array | - | - | - | - | - |
      | catalogs[].entries[].decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | - |
      | catalogs[].entries[].reason | 理由 | string | - | - | - | そうしている理由。参照する側の判断が変わるものだけを記載する。 | - |
      | catalogs[].entries[].status | 状態 | string | - | `planned` / `implemented` / `deprecated` / `removed` | - | 項目の状態で、`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）のどれか。記載しなければ実装済みとして扱う。 | - |
      | catalogs[].entries[].visibility | 公開 | string | - | `user` / `developer` | - | Pages に出すか（`user` はユーザー向けで Pages に出し、`developer` は開発者向けで dev-docs の画面だけで出す）。記載しなければ親の値を引き継ぎ、最上位の既定は `developer`。 | - |
      | catalogs[].entries[].implementation | 実装 | string | - | - | pattern: `^[^#\s]+(#\S+)?$` | 実装の場所。リポジトリの直下からのファイルのパスに、`#` とシンボルの名前を続けてよい。 | `src/app/features/schemas/loader.py#load_catalog` |
      | catalogs[].entries[].introduced | 導入 | object | - | - | - | 入ったバージョンと PR。 | - |
      | catalogs[].entries[].introduced.version | バージョン | string | - | - | - | 入ったバージョンのタグ。 | `v0.3.0` |
      | catalogs[].entries[].introduced.pr | PR | integer | - | - | - | 入れた PR の番号。 | - |
      | catalogs[].entries[].aliases | 別名 | array | - | - | - | 検索でヒットさせたい言い換え。 | - |
