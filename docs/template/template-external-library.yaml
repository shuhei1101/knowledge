      | notes | 補足 | object | - | - | - | 対象固有の解説セクション（セクションの名前 → 本文）。一覧・制限事項・不具合に属さないもの。 | 実装で、一覧・制限事項・不具合に属さない対象固有の解説を参照する。 | - |

