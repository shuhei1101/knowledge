      | catalogs[].entries[].returns[].type | 型 | string | 必須 | - | - | - | 実装で、フィールドの型にする。 | - |
      | catalogs[].entries[].returns[].description | 説明 | string | 必須 | - | - | - | 実装で、値の意味を参照する。 | - |
      | catalogs[].entries[].returns[].constraints | 制限 | string | - | - | - | - | 実装で、戻り値の上限・形式を参照する。 | - |
      | catalogs[].entries[].returns[].notes | 補足 | string | - | - | - | - | 実装で、返らないことがあるフィールドの条件を参照する。 | - |
      | catalogs[].entries[].returns_example | 戻り値例 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | テストで、Mock の戻り値にする。 | - |
      | catalogs[].entries[].refs | 関連 | array | - | - | - | - | 生成で、関連する設計書へのリンクにする。<br>レビューで、関連する設計書をたどって食い違いを確認する。 | - |
      | catalogs[].entries[].decisions | 検討事項 | array | - | - | - | 根拠になった話し合いの記録の検討事項の ID。 | 生成で、話し合いの記録の検討事項へのリンクにする。<br>レビューで、根拠の検討事項の結論と食い違わないかを確認する。 | - |
      | catalogs[].entries[].reason | 理由 | string | - | - | - | そうしている理由。参照する側の判断が変わるものだけを記載する。 | レビューで、理由が今も成り立つかと、同じ判断を変える変更が無いかを確認する。 | - |
      | catalogs[].entries[].status | 状態 | string | - | `planned` / `implemented` / `deprecated` / `removed` | - | 項目の状態で、`planned`（予定）/ `implemented`（実装済み）/ `deprecated`（非推奨）/ `removed`（廃止）のどれか。記載しなければ実装済みとして扱う。 | 実装で、`planned` の項目を作る対象にし、`deprecated`・`removed` の項目を新しく使わない。<br>生成で、状態の表示にする。 | - |
      | catalogs[].entries[].visibility | 公開 | string | - | `user` / `developer` | - | Pages に出すか（`user` はユーザー向けで Pages に出し、`developer` は開発者向けで dev-docs の画面だけで出す）。記載しなければ親の値を引き継ぎ、最上位の既定は `developer`。 | 生成で、Pages に出すかを決める。 | - |
      | catalogs[].entries[].notes | 補足 | object | - | - | - | 項目に分けられない残り。セクションの名前 → 本文。 | 実装で、項目に分けられない前提・制約を参照する。<br>生成で、セクションの名前を見出しにした節にする。 | - |
      | limitations | 制限事項 | array | - | - | - | 仕様として常に成り立つ制約。 | 実装で、ライブラリでできないことを避ける。<br>レビューで、制限事項に当たる使い方が無いかを確認する。 | - |
      | limitations[].item | 事項 | string | 必須 | - | - | - | 生成で、表の行の名前にする。 | - |
      | limitations[].content | 内容 | string | 必須 | - | - | - | 実装で、守る制約にする。 | - |
      | limitations[].notes | 補足 | string | - | - | - | - | 実装で、制約の前提を参照する。 | - |
      | usage_limits | 利用上限 | array | - | - | - | - | 設計で、非機能要件の利用上限の値の出所にする。<br>実装で、上限に達したときの処理にする。 | - |
      | usage_limits[].item | 項目 | string | 必須 | - | - | `利用枠` / `到達時の挙動` / `解除時刻` 等。 | 生成で、表の行の名前にする。 | - |
      | usage_limits[].content | 内容 | string | 必須 | - | - | - | 実装で、上限の値と到達時の挙動にする。 | - |
      | usage_limits[].notes | 補足 | string | - | - | - | - | 実装で、上限の前提を参照する。 | - |
      | issues | 不具合一覧 | array | - | - | - | 仕様どおりに使用しても期待どおり動かない事象。 | 実装で、仕様どおりに動かない事象を避ける。<br>生成で、不具合一覧の節にする。 | - |
      | issues[].title | タイトル | string | 必須 | - | - | - | 生成で、節の見出しにする。 | - |
      | issues[].summary | 概要 | string | 必須 | - | pattern: `^[^\n]+$`, minLength: `1` | 1 行で事象を要約する。 | 生成で、不具合の一覧の説明にする。 | - |
      | issues[].occurred_on | 発生日 | string | 必須 | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | 事象を確認した日（`YYYY-MM-DD`）。再確認して続いていたら更新する。 | 保守で、事象が今も続いているかを確認し直す時期を判断する。 | - |
      | issues[].state | 状態 | string | - | `未解決` / `回避策あり` / `解消済み` | - | - | 保守で、回避策を入れたままにするかを判断する。 | - |
      | issues[].description | 概要 | string | 必須 | - | - | 何が起きるかを事実だけで記載する。 | 実装で、起きる事象を参照する。 | - |
