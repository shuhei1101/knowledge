# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-external-library
kind: template
name: "テンプレート: 外部ライブラリ"
description: 採用した外部ライブラリ 1 つにつき 1 ファイルで、使用する部分だけを公式ドキュメントから抜き出す外部ライブラリの書式を定め、外部ライブラリを採用して設計書を作るときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:テンプレート
  - name: topic:ファイル
  - name: topic:ライブラリ
    main: true
  - name: topic:文書
  - name: topic:設計書
  - name: action:採用
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      採用した外部ライブラリ 1 つにつき 1 ファイル。
      そのプロジェクトで使用する部分だけを公式ドキュメントから抜き出す。
  - id: rules-01
    name: 決まり
    body: |-
      - 参照はモジュール構成 → 外部ライブラリの一方向にする。
      - 自プロジェクトのファイル・モジュールには言及しない（使用箇所を除く）。
  - id: item-list-01
    name: 項目
    body: |-
      <!-- table: data -->

      | 名前 | title | 型 | 必須 | 選択肢 | 制約 | description | 使用先 | examples |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | id | ID | string | 必須 | - | pattern: `^[A-Z]+-\d+(-\d+)?$` | 設計書の変わらない ID。他の設計書からは `{ID}#{項目のパス}` で指す。 | 検査で、ほかの設計書の参照（`{ID}#{項目のパス}`）の解決先にする。<br>生成で、ページの名前と、ほかの設計書からのリンク先にする。 | `IF-12` / `IF-3038-1` |
      | visibility | 公開範囲 | string | - | `public` / `internal` | - | 文書を Pages に出す（`public`）か出さない（`internal`）かで、記載しなければ `internal` として扱う。項目の公開（`visibility` の `user` / `developer`）とは別。 | 生成で、文書を Pages に出すかを決める。<br>dev-docs の配信で、文書の公開範囲のメタデータにする。 | - |
      | title | タイトル | string | 必須 | - | - | ライブラリ名（パッケージ名）。ファイル名に合わせる。 | 生成で、ページの見出しにする。<br>dev-docs の検索で、文書の名前にする。 | - |
      | lead | 冒頭リード | string | - | - | - | ライブラリが何をするものかを 1〜3 行で要約する。 | 生成で、ページの冒頭の説明にする。<br>dev-docs の検索で、文書の概要文にする。 | - |
      | kind | 種類 | string | 必須 | `ライブラリ` / `フレームワーク` / `CLI` / `サービス` / `コンテナ` / `CDN の JS` / `標準ライブラリ` | - | - | 実装で、依存の定義（言語のパッケージ・CLI・CDN）のどこに入れるかを決める。 | - |
      | purl | 識別子 | string | - | - | - | パッケージの識別子（purl）。 | 保守で、脆弱性の情報とライセンスを参照する識別子にする。 | `pkg:pypi/ruamel.yaml` |
      | supplier | 提供元 | string | - | - | - | - | レビューで、提供元の保守の状況を確認する。 | - |
      | dependency_scope | 依存の範囲 | string | - | `必須` / `任意` / `開発のみ` | - | - | 実装で、依存を実行時・開発時のどちらに入れるかを決める。 | - |
      | adoption | 採用状態 | string | - | `採用` / `未採用` | - | - | 実装で、採用したライブラリだけを使い、検討中・廃止のものを新しく使わない。 | - |
      | used_in | 使用箇所 | array | - | - | - | 呼び出す境界層のパス（リポジトリの直下から）。エージェントの手順から呼ぶ CLI は手順を持つドキュメントのパス。 | 保守で、ライブラリを上げる・外すときに修正する境界層のファイルを探す。 | - |
      | upstream | 上流リポジトリ | string | - | - | pattern: `^[^/\s]+/[^/\s]+$` | GitHub の `owner/repo`。規約『不具合の報告』の上流 Issue の検索がここを参照する。 | 保守で、不具合に当たったときに上流の Issue を検索する。 | - |
      | verification | 動作確認 | object | - | - | - | 動かして確認したか。 | 実装で、実装の前にライブラリを動かして確認済みかを判断する。<br>レビューで、確認していないライブラリに理由があるかを確認する。 | - |
      | verification.state | 状態 | string | 必須 | `済` / `未確認` | - | - | 実装で、実装の前に動作確認が要るかを判断する。 | - |
      | verification.date | 確認日 | string | - | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | `YYYY-MM-DD`。 | 保守で、確認の記録が古くなっていないかを判断する。 | - |
      | verification.detail | 確認内容 | string | - | - | - | 確認した内容か、確認できない理由。 | 実装で、確認していないライブラリを使用してよいかを判断する。 | - |
      | version | 現在のバージョン情報 | object | 必須 | - | - | - | 保守で、ライブラリを上げるかを判断する。 | - |
      | version.current | バージョン | string | 必須 | - | - | 採用しているバージョン。 | 保守で、最新版と比べて上げるかを判断する。<br>実行で、動作確認したバージョンと実行環境のバージョンを比べる。 | - |
      | version.latest | 最新版 | string | - | - | - | - | 保守で、採用しているバージョンと比べて上げるかを判断する。 | - |
      | version.checked_on | 確認日 | string | 必須 | - | pattern: `^[0-9]{4}-[0-9]{2}-[0-9]{2}$` | 最新バージョンを確認した日（`YYYY-MM-DD`）。 | 保守で、最新版の情報が古くなっていないかを判断する。 | - |
      | version.source | バージョンの出所 | string | - | - | - | 突き合わせる依存の定義（`uv.lock` / `pyproject.toml` / CDN の URL）。 | 保守で、採用しているバージョンを突き合わせる依存の定義を参照する。 | - |
      | version.pinning | バージョンの固定方法 | string | - | - | - | - | 保守で、依存を上げるときのバージョンの指定の書き方にする。 | - |
      | version.support_until | サポート期限 | string | - | - | - | - | 計画で、サポートが切れる前に上げる作業を計画する。 | - |
      | version.security_until | セキュリティ対応の期限 | string | - | - | - | - | 計画で、セキュリティ対応が切れる前に上げる作業を計画する。 | - |
      | version.lts | LTS | boolean | - | - | - | - | 保守で、上げる先のバージョンを LTS から選ぶ。 | - |
      | license | ライセンス | string | - | - | - | 商用利用の可否を確認して記載する。 | レビューで、配布の形とライセンスが合うかを確認する。 | - |
      | official_url | 公式 URL | string | - | - | - | - | 実装で、仕様を確認するときに公式のページを開く。 | - |
      | docs_url | 公式ドキュメント | string | - | - | - | API リファレンスの URL。 | 実装で、仕様を確認するときに API リファレンスを開く。 | - |
      | selection | 選定の記録 | object | - | - | - | - | 設計で、置き換えを検討するときに前に比べた候補と理由を参照する。 | - |
      | selection.candidates | 比べた候補 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 設計で、置き換えを検討するときに前に比べた候補を参照する。 | - |
      | selection.decision | 決めた理由 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | レビューで、採用の理由が今も成り立つかを確認する。 | - |
      | selection.consequences | 結果 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 実装で、採用で受け入れた制約を参照する。 | - |
      | install | インストール手順 | string | - | - | - | バージョンを固定したコマンドと、追加の設定（コードブロック）。 | 実行で、環境を作るときにライブラリを入れるコマンドにする。 | - |
      | catalogs | 一覧 | array | 必須 | - | minItems: `1` | - | 実装で、使う API・コマンド・設定を参照する。<br>生成で、一覧の表と節にする。 | - |
      | catalogs[].name | 単位 | string | 必須 | - | - | 列挙する対象の単位（`API` / `コマンド` / `設定` / `ファイル` / `環境変数` / `同梱プラグイン` 等）。見出しは `{単位} 一覧`。 | 生成で、`{単位} 一覧` の見出しにする。 | - |
      | catalogs[].version | バージョン | string | 必須 | - | - | 一覧を作ったバージョン。 | 保守で、ライブラリを上げたときに一覧を作り直すかを判断する。 | - |
      | catalogs[].entries | 対象 | array | 必須 | - | minItems: `1` | このプロジェクトで使用する対象だけ。一覧の表は各対象の種別・名前・用途から生成する。 | 実装で、使う関数・コマンドの呼び方にする。 | - |
      | catalogs[].entries[].name | 名前 | string | 必須 | - | - | 対象の名前（関数・コンポーネント・コマンド 等）。 | 実装で、呼ぶ関数・コンポーネント・コマンドの名前にする。<br>設計で、ほかの設計書の参照から対象を指す。 | - |
      | catalogs[].entries[].kind | 種別 | string | 必須 | - | - | `コンポーネント` / `関数` / `フック` / `クラス` / `定数` / `コマンド` 等。 | 生成で、一覧の種別にする。 | - |
      | catalogs[].entries[].purpose | 用途 | string | 必須 | - | pattern: `^[^\n]+$`, minLength: `1` | 1 行の用途。 | 生成で、一覧の用途にする。<br>実装で、目的に合う対象を選ぶ。 | - |
      | catalogs[].entries[].description | 説明 | string | - | - | - | Markdown で記載する本文。定数は `!{名前}` で埋め込める。 | 実装で、対象の挙動を参照する。 | - |
      | catalogs[].entries[].params | パラメータ | array | - | - | - | 使用するものだけでなく主要なパラメータも全て記載する。 | 実装で、渡す引数にする。 | - |
      | catalogs[].entries[].params[].name | パラメータ | string | 必須 | - | - | オブジェクトの子は `parent.child`、配列の要素の子は `parent[].child`。 | 実装で、引数の名前にする。 | - |
      | catalogs[].entries[].params[].type | 型 | string | 必須 | - | - | 取りうる値が限られるときは列挙し、各値の意味は補足に記載する。 | 実装で、引数の型にする。 | - |
      | catalogs[].entries[].params[].required | 必須 | boolean | - | - | - | - | 実装で、省けない引数にする。 | - |
      | catalogs[].entries[].params[].default | 既定 | string | - | - | - | 任意のパラメータの省略時の値。 | 実装で、省いたときに使われる値を参照する。 | - |
      | catalogs[].entries[].params[].description | 説明 | string | 必須 | - | - | - | 実装で、引数に入れる値を決める。 | - |
      | catalogs[].entries[].params[].constraints | 制限 | string | - | - | - | - | 実装で、渡す前の検証にする。 | - |
      | catalogs[].entries[].params[].notes | 補足 | string | - | - | - | - | 実装で、引数の前提を参照する。 | - |
      | catalogs[].entries[].params_example | パラメータ例 | string | - | - | - | import 込みの最小の動く例（コードブロック）。 | 実装で、呼び出しの見本にする。 | - |
