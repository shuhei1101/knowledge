      | issues[].workarounds[].result | 結果 | string | 必須 | - | - | 得られるものと、本来やりたかったことからのずれ。 | 実装で、回避策を選ぶときに得られるものとずれを比べる。 | - |
      | issues[].workarounds[].recommended | 推奨 | boolean | - | - | - | 最初に試す 1 案だけ。 | 実装で、最初に試す回避策にする。 | - |
      | issues[].upstream_issue | 上流の Issue | string | - | - | - | 上流の Issue の URL。 | 保守で、上流で解消したかを確認する先にする。 | - |
