# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-policy-risk-debt-list
kind: template
name: "テンプレート: 方針決め / リスクと技術的負債の一覧"
description: リバースエンジニアリングで見つけた改善の溜め先であるリスクと技術的負債の一覧の書式を定め、見つけた改善を一覧に記録するときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:方針決め
  - name: topic:テンプレート
  - name: topic:リスク
    main: true
  - name: topic:リバースエンジニアリング
  - name: topic:方針
  - name: topic:負債
status: current
visibility: internal
rev: 3
items:
  - id: overview
    name: 概要
    body: |-
      作業 PR のフォルダに配置する `リスクと技術的負債.md`（リバースエンジニアリングで見つけた改善の溜め先）の書式。

      改善を見つけた工程で、最初の 1 行を追加するときにファイルを作る。
  - id: section-list-01
    name: セクション一覧
    body: |-
      | セクション | 必須or条件 |
      | --- | --- |
      | 一覧の表 | 必須 |
  - id: list-table-01
    name: "`一覧の表`"
    body: |-
      ### 記述例

      ```markdown
      # リスクと技術的負債

      | 見つけた工程 | 場所 | 内容 | 種別 | 影響 | 補足 |
      | --- | --- | --- | --- | --- | --- |
      | 現状の棚卸し | `src/config.py` | タイムアウトの値が設定ファイルに出ず実装へ記載されている | 技術的負債 | 値を変えるたびにコードの変更とリリースが要る | - |
      ```

      ### 補足

      - front matter は付けず、先頭に `# リスクと技術的負債` の見出しを配置し、その下に一覧の表を 1 つだけ配置する
      - 1 件の改善 = 1 行で、表の末尾へ追記する

      <!-- table: data -->

      | 列 | 記載方法 |
      | --- | --- |
      | 見つけた段列 | 改善を見つけた設計の工程の名前（複合ユースケース設計 / 単一ユースケース設計 / 現状の棚卸し）を記載する |
      | 場所列 | 改善の対象になる実装のパスを、バッククォートで囲んで記載する |
      | 内容列 | 実装から読み取れた改善の余地を 1 文で記載する |
      | 種別列 | `リスク`（起きると困ることの元）か `技術的負債`（今の構造が将来の変更に掛けるコスト）のどちらかを記載する |
      | 影響列 | 放置したときに起きることを記載する |

      <!-- /table -->
