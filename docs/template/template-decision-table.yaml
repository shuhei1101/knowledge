# yaml-language-server: $schema=../../schemas/template.schema.yaml
id: template-decision-table
kind: template
name: "テンプレート: 判定表"
description: 結果が条件の組み合わせで決まる場面で使用する判定表の書式（条件の列・結果の列・結合の記載方法）を定め、判定表を作るときに参照する。
tags:
  - name: scope:テンプレート
  - name: topic:テンプレート
  - name: topic:判定表
    main: true
  - name: topic:テーブル
  - name: topic:条件
  - name: topic:ファイル
  - name: action:判定
status: current
visibility: internal
rev: 1
items:
  - id: overview
    name: 概要
    body: |-
      判定表を作るときの書式定義。

      判定表は結果が条件の組み合わせで決まり、前の回答で次の質問が変わらない場面で使う。
      判定フローチャート・チェックシート・手順との使い分けは判定フローチャート [決まりの表し方の選び方](id:flowchart-rule-form-choice) で決める。

      配置先は `docs/decision-table/decision-table-{対象}.yaml`（ファイル名は `id`）。
      新規作成時は文書の `description` に概要を記載する。
  - id: file-naming-01
    name: ファイル命名規則
    body: |-
      判定する対象を `decision-table-{対象}` の `{対象}` に入れる。

      - 判定フローチャートから分けた判定表は、判定フローチャートの `{対象}` に判定表の役割を続ける（例: `decision-table-alias-exclusion`）
  - id: section-list-01
    name: セクション一覧
    body: |-
      | セクション | サブセクション | 必須or条件 |
      | --- | --- | --- |
      | タイトル（メタデータ `name`・`description`） | - | 必須 |
      | `overview` の項目 | - | 必須 |
      | `判定表` | - | 必須 |
      | `※n` の注記の項目 | - | 表に `※n` がある場合のみ |
  - id: title-01
    name: "`タイトル`"
    body: |-
      ### 記述例

      ```yaml
      name: "{対象作業} 判定表"
      description: "{何を判定するか}を判定し、{どんなときに参照するか}に参照する"
      ```

      ### 補足

      - メタデータ `name` はページタイトル + `判定表` 接尾辞
      - `overview` の項目の本文に、このページの `description` と同じ 1 行を置く
      - `overview` と `description` は初回に書いた内容のまま保ち、後から情報を追加しない。
        条件と結果は `判定表` に書く
  - id: table-01
    name: "`判定表`"
    body: |-
      条件の一覧と結果を書く。
      型は次の表で選ぶ。

      | 型 | 使う場面 | 補足 |
      | --- | --- | --- |
      | 条件の一覧 | 条件のどれか（または全て）に当たるかだけで結果が決まる | 結合を表の上の 1 行に書く |
      | 条件の組み合わせ | 2 つ以上の条件の値の組み合わせで結果が変わる | 条件ごとに列を置く |

      ### 記述例（条件の一覧）

      ```yaml
      - id: "{対象}-table-01"
        group: "{対象作業} 判定表"
        name: 判定表
        body: |-
          上の行から順に当て、1 つでも当たれば、その行の結果にする。
          どれにも当たらなければ「{既定の結果}」にする。

          | 条件 | 結果 | 補足 |
          | --- | --- | --- |
          | {条件 1} ※1 | {結果 A} | - |
          | {条件 2} | {結果 A} | {結果に添える対応} |
      ```

      ### 記述例（条件の組み合わせ）

      ```yaml
      - id: "{対象}-table-01"
        group: "{対象作業} 判定表"
        name: 判定表
        body: |-
          | {条件 1} | {条件 2} | 結果 | 補足 |
          | --- | --- | --- | --- |
          | YES | YES | {結果 A} | - |
          | YES | NO | {結果 B} | - |
          | NO | - | {結果 C} | - |
      ```

      ### 補足

      | 項目 | 内容 |
      | --- | --- |
      | 結合（条件の一覧） | 表の上の 1 行に、「1 つでも当たれば」（OR）か「全て当たれば」（AND）と、当たらないときの既定の結果を書く<br>行を当てる順に意味があるときは、「上の行から順に当て」を添えてその順に並べる |
      | 「条件」列（条件の一覧） | YES / NO で回答できる 1 文で、疑問形にしない（`〜である`・`〜に当たる`） |
      | 条件の列（条件の組み合わせ） | 列見出しは条件の名前、セルは `YES` / `NO` / `-`（問わない）か、選択肢の値にする<br>全ての組み合わせが、どれか 1 つの行だけに当たるようにする |
      | 「結果」列 | 結果を 1 つ書く。<br>結果に添える対応は補足列に書く |
  - id: term-01
    name: "`※n` の注記"
    body: |-
      ### 記述例

      ```yaml
      - id: "{対象}-table-02"
        group: "{対象作業} 判定表"
        name: ※1 用語名
        body: |-
          - ※1 用語名: 定義（1 行）
      ```

      ### 補足

      - 条件・結果のセルに `※N` のマーカーを付け、1 つの注記を 1 つの項目にする
      - 番号は表中の登場順で採番し、初出だけに ※N を付ける
