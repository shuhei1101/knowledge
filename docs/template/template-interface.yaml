    body: |-
      ````yaml
      id: IF-1
      title: タスク作成
      entry:
        kind: operation
        value: '`create_task`（サービス層の公開関数）'
      lead: タイトルとサブタスクを受け取ってタスクを永続化し、採番済みのタスクを返却する。
      test_file: tests/integration/task/test_create_task.py
      request:
      - name: title
        type: str
        required: true
        location: argument
        description: タスク名
        constraints: 100 文字以内
      exceptions:
      - name: なし（正常終了）
        condition: 作成成功
      - name: ValidationError
        condition: タイトルが 100 文字を超える
      constraints:
      - item: タイムアウト
        constraint: 制限なし
      flows:
      - name: 正常系
        summary: タスクを作成する
        setup:
        - name: Mock
          description: DB を stub に差し替え
        flow: |-
          ```mermaid
          sequenceDiagram
            participant C as クライアント
            participant IF as create_task
            participant DB as DB

            C->>IF: title
            IF->>DB: タスクを保存
            IF-->>C: 採番済みのタスク
          ```
        expected:
        - 採番済みのタスクが返る
        - DB にタスクが 1 件ある
        test: test_normal
      ````
