# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: react-component-autosave-indicator
kind: rule
name: "`<AutosaveIndicator>` — 自動保存状態表示"
description: 自動保存の状態を表示する AutosaveIndicator の Props と 4 状態を定め、自動保存の状態を画面に表示するときに読む。
tags:
  - name: scope:react
  - name: topic:フロントエンド
  - name: topic:props
  - name: topic:画面
  - name: topic:自動保存
    main: true
  - name: action:保存
  - name: action:表示
  - name: action:遷移
status: current
visibility: internal
rev: 4
last_reviewed: '2026-10-30'
items:
  - id: overview
    name: 概要
    body: |-
      対象: React
  - id: autosave-indicator-01
    group: "`<AutosaveIndicator>` — 自動保存状態表示"
    name: Props
    body: |-
      - Props: `status`, `lastSavedAt: Date | null`, `onRetry: () => void`
  - id: autosave-indicator-02
    group: "`<AutosaveIndicator>` — 自動保存状態表示"
    name: 4 状態の表示
    body: |-
      - 4 状態: `idle`（lastSavedAt があれば「N 分前に保存」）/ `saving` / `saved` / `error`（retry ボタン）
  - id: autosave-indicator-03
    group: "`<AutosaveIndicator>` — 自動保存状態表示"
    name: saved から idle への遷移
    body: |-
      - `saved` → `idle` への遷移は hook 側（数秒後）
