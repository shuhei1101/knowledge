visibility: internal
rev: 5
last_reviewed: '2026-11-05'
items:
  - id: overview
    name: 概要
    body: |-
      文書を `rules.yaml`（rule-inject の索引）に記載するかの判断と、記載するときの記載方法。
      索引のキーと書式は rule-inject の [索引の書式](https://github.com/shuhei1101/rule-inject/blob/master/docs/%E3%83%AA%E3%83%95%E3%82%A1%E3%83%AC%E3%83%B3%E3%82%B9/%E7%B4%A2%E5%BC%95%E3%81%AE%E6%9B%B8%E5%BC%8F.md) に従う。
  - id: index-decision-01
    group: 記載するかの判断
    name: 強制注入の 4 つの基準
    body: |-
      索引に記載するのは、次の 4 つを全て満たす文書だけにする。
      満たさない文書（任意で参照する文書）は掲載せず、タグと `aliases` で話題に出たとき案内する。

      <!-- table: data -->

      | 基準 | 判定の目安 |
      | --- | --- |
      | 参照せずに編集すると、後から修正するのに手間が掛かる | 書式（テンプレート）、AI の既定と逆の独自の決まり、安全 |
      | 機械検査で判定できない | lint・スキーマ・型検査で判定できる部分は検査へ移し、本文から削除する |
      | glob が狭い | 特定のファイル名・フォルダで適用する。拡張子だけの glob は全言語共通の規約 1〜2 件に限る |
      | 短い | 1 ルール 4KB 以内、1 ファイルの編集で該当する合計 10KB 以内。テンプレートは例外 |

      <!-- /table -->
  - id: index-writing-02
    group: 記載するときの記載方法
    name: paths の記載
    body: |-
      - 照合は絶対パスに適用するため、`**/` で始め、`~` を使用しない
      - 拡張子の後ろに `*` を付けない（`.json`・`.python-version`・設計書の `xxx.ts.yaml` にまで該当する）
      - 波括弧は候補を 2 つ以上並べるときだけ使用する（例: `**/*.{ts,tsx}`）
  - id: index-writing-13
    group: 記載するときの記載方法
    name: MCP で読み書きする文書の規約
    body: |-
      - MCP のツールで書き込む文書の規約は、書き込みのツールを `tools` に、文書の種類・タグを `args` に記載し、`on` に `mcp` を含める
      - ファイルを直接編集する経路も残るときは、`paths` も並べて記載する
  - id: index-writing-09
    group: 記載するときの記載方法
    name: 複数の索引がある場合
    body: '- 索引が複数ある場合は、そのドキュメントを配置したリポジトリの索引に記載する'
  - id: index-review-01
    group: 見直し
    name: 規約どうしの矛盾の検出
    body: '- 索引を見直すときは、Claude Code の `/doctor prompt-audit` を実行し、同じファイルに該当する規約どうしの矛盾を確認する'
