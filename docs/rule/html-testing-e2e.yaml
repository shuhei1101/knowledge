# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: html-testing-e2e
kind: rule
name: E2E テスト（playwright）
description: playwright の E2E テストのスペックの置き場所、外部 I/O の差し替え、ロケータ、実行方法を定める。
tags:
  - name: scope:html
  - name: topic:testing
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: e2e-playwright-01
    group: E2E テスト（playwright）
    name: スペックの置き場所
    body: |-
      - スペックは `frontend/tests/e2e/{name}.spec.ts`。
  - id: e2e-playwright-02
    group: E2E テスト（playwright）
    name: 外部 I/O の差し替え
    body: |-
      - 外部 I/O（LLM / TTS 等）は `playwright.config.js` の webServer env に渡す環境変数でモックに切り替える。
        - 実課金・非決定性に依存させない。
  - id: e2e-playwright-03
    group: E2E テスト（playwright）
    name: ロケータの優先順位
    body: |-
      - ロケータは role / text / label ベースを優先。
        - 画面の `id` で参照するのは実装と対応が明確な範囲に留め、`data-testid` は最後の手段。
  - id: e2e-playwright-04
    group: E2E テスト（playwright）
    name: FastAPI 使用時は直列実行
    body: |-
      - (FastAPI使用時)実 FastAPI とファイル永続を共有するため直列実行（`workers: 1`・`fullyParallel: false`）。
  - id: e2e-playwright-05
    group: E2E テスト（playwright）
    name: 検証対象
    body: |-
      - 検証対象は「画面が組み上がる・共通シェルが付く・主要操作とバリデーション」。
  - id: e2e-playwright-06
    group: E2E テスト（playwright）
    name: 別ポートでの実行
    body: |-
      - メイン dev server 稼働中に走らせるときは worktree から別ポート（`E2E_PORT`）で起動する。
        - 設定詳細は `playwright.config.js`（worktree の src を PYTHONPATH に、メインリポジトリの venv / settings を参照）。
