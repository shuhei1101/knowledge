# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-testing-e2e
kind: rule
name: E2E テスト（Playwright）
description: Playwright の E2E テストの設定の要点、フォルダ構成、ルール、メイン dev server 起動中の実行方法を定める。
tags:
  - name: scope:next
  - name: topic:testing
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: playwright-config-01
    group: playwright.config.ts の要点
    name: testDir と並列実行
    body: |-
      - `testDir: "./tests/e2e"`、`fullyParallel: true`、CI は `retries: 2` + `workers: 1`
  - id: playwright-config-02
    group: playwright.config.ts の要点
    name: trace と screenshot
    body: |-
      - `trace: "on-first-retry"`、`screenshot: "only-on-failure"`
  - id: playwright-config-03
    group: playwright.config.ts の要点
    name: storageState の指定
    body: |-
      - projects に `storageState: "tests/e2e/.auth/user.json"` を設定（chromium / webkit / mobile）
  - id: playwright-config-04
    group: playwright.config.ts の要点
    name: global.setup と global.teardown
    body: |-
      - `global.setup.ts` / `global.teardown.ts` は setup project の `dependencies` / `teardown` で繋ぐ（`globalSetup` 設定は使わない）
  - id: playwright-config-05
    group: playwright.config.ts の要点
    name: webServer の自動起動
    body: |-
      - `webServer` で dev server 自動起動、`reuseExistingServer: !process.env.CI`
  - id: folder-responsibility-01
    group: フォルダ構成と責務
    name: フォルダ構成と責務
    body: |-
      ```
      tests/
      ├── e2e/                        # spec のみ（画面・ドメイン単位フォルダ）
      │   ├── auth/
      │   │   └── login.spec.ts
      │   ├── checkout/
      │   │   └── apply-coupon.spec.ts
      │   ├── usecases/               # 横断ユースケース
      │   ├── .auth/                  # Storage State（gitignore 対象）
      │   ├── reports/                # CI レポート出力先
      │   ├── snapshots/              # visual regression 比較画像
      │   ├── global.setup.ts         # Storage State 生成・DB 初期化
      │   └── global.teardown.ts      # 後片付け
      ├── pages/                      # Page Object（UI 操作の抽象化のみ、業務ロジック禁止）
      ├── fixtures/                   # テストデータ Factory
      └── helpers/                    # 共通操作。責務ごとに分割（helper.ts 乱立を避ける）
          ├── auth.ts
          ├── db.ts
          └── server.ts
      ```
  - id: rules-01
    group: ルール
    name: ロケータの優先順位
    body: |-
      - ロケータは role / label / placeholder ベース。`data-testid` は最後の手段
  - id: rules-02
    group: ルール
    name: ログインは Storage State で 1 回
    body: |-
      - ログインは global.setup の Storage State で 1 回だけ（各 test で繰り返さない）。`.auth/` は gitignore
  - id: rules-03
    group: ルール
    name: DB シードは helpers で直接 insert
    body: |-
      - DB シードは helpers で直接 insert（API 経由より高速・確実）
  - id: rules-04
    group: ルール
    name: DB 状態を共有するテスト
    body: |-
      - DB 状態を共有するテストは、データをテストごとに分けて独立させる（`serial` で直列化しない）
  - id: rules-05
    group: ルール
    name: 視覚回帰
    body: |-
      - 視覚回帰は `toHaveScreenshot`（`snapshotPathTemplate` で `tests/e2e/snapshots/` に保存。ベースラインは比較する環境と同じ OS で生成）
  - id: rules-06
    group: ルール
    name: a11y の検査
    body: |-
      - a11y は `@axe-core/playwright` の AxeBuilder で violations ゼロを確認
  - id: e2e-with-dev-server-01
    group: メイン dev server 起動中の E2E 実行
    name: dev server が 1 つだけの制約
    body: |-
      - Next.js は同一ディレクトリで dev server 1 つだけの制約があり、別ポートでも 2 つ目は起動エラーになる
  - id: e2e-with-dev-server-02
    group: メイン dev server 起動中の E2E 実行
    name: worktree で E2E 専用環境を作る
    body: |-
      - worktree（別ディレクトリ）に E2E 専用環境を作って実行する
        - worktree 作成 → `pnpm install` → `playwright install chromium`（初回のみ）→ 実行
        - E2E にはメインと被らない専用ポートを割り当てる
