# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: claude-subagent
kind: rule
name: サブエージェント委譲ガイド
description: スキルのステップをサブエージェントへ委譲するときのマーカー、判断基準、制約を定める。
tags:
  - name: scope:claude
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      スキル内のステップ処理をサブエージェントに委譲する方法と判断基準。

      ---
  - id: delegation-marker-01
    group: 委譲マーカー
    name: 委譲マーカー
    body: |-
      サブエージェントに委譲するステップの先頭に、以下のいずれかのマーカーを付ける。
      戻り値の形式は括弧内に明記する:

      | マーカー                                       | 使うとき                                                 |
      | ---------------------------------------------- | -------------------------------------------------------- |
      | `[サブエージェントで実行・完了を待つ]`         | 単体のサブエージェント、完了を待ってから次へ             |
      | `[サブエージェントで並列実行・完了を待つ]`     | 複数のサブエージェントを並列実行、全完了を待ってから次へ |
      | `[サブエージェントで並列実行・完了を待たない]` | 結果不要な場合のみ（稀）                                 |

      記述例:

      ```markdown
      #### 処理
      1. [サブエージェントで並列実行・完了を待つ] .claude/skills/ を Glob し各 description を収集する
         （戻り値: `[{name, description}]`）
      ```

      ---
  - id: delegation-criteria-01
    group: 委譲の判断基準
    name: 委譲の判断基準
    body: |-
      <!-- table: data -->

      | 状況                                                                 | 判断                        |
      | -------------------------------------------------------------------- | --------------------------- |
      | 必要なコンテキストが少ない（会話履歴・ファイル内容をほぼ参照しない） | ✅ サブエージェント向き     |
      | 単純な変換・転記・翻訳など                                       | ✅ サブエージェント向き     |
      | 同じ処理を複数ファイル・項目に対して並列実行したい                   | ✅ サブエージェント向き     |
      | メインエージェントのコンテキスト圧迫を防ぎたい                       | ✅ サブエージェント向き     |
      | メインの会話履歴や大量のコンテキストを参照する必要がある             | ❌ メインエージェントで実行 |
      | サブエージェントの内部処理もメインで必要                             | ❌ メインエージェントで実行 |

      <!-- /table -->
  - id: delegation-criteria-02
    group: 委譲の判断基準
    name: 区切り線
    body: |-
      ---
  - id: constraint-caution-01
    group: 制約と注意事項
    name: 戻り値のみが返る
    body: |-
      - 戻り値のみが返る: 内部処理詳細はメインに返らない。戻り値だけで十分か確認する。
  - id: constraint-caution-02
    group: 制約と注意事項
    name: コンテキストは空
    body: |-
      - コンテキストは空: 会話履歴のない状態で起動する。必要な情報はプロンプトで明示的に渡す。
