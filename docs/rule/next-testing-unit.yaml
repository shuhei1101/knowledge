# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-testing-unit
kind: rule
name: Unit / Component テスト（Vitest + Testing Library）
description: Vitest と Testing Library による Unit・Component テストの設定と、何をどうテストするかを定める。
tags:
  - name: scope:next
  - name: topic:testing
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: vitest-config-01
    group: vitest.config.ts の要点
    name: vitest の environment
    body: |-
      - `environment: "jsdom"`、`globals: true`、`setupFiles: ["./tests/setup.ts"]`（jest-dom 読み込み）
  - id: vitest-config-02
    group: vitest.config.ts の要点
    name: coverage の対象
    body: |-
      - coverage は `app/**` を include、page.tsx / layout.tsx を exclude
  - id: what-to-test-01
    group: 何をどうテストするか
    name: テスト対象別の方針の表
    body: |-
      <!-- table: data -->

      | 対象                    | 方法                                                           |
      | ----------------------- | -------------------------------------------------------------- |
      | Zod schema              | `safeParse` で有効値 / 各バリデーションエラーを網羅            |
      | 純粋関数                | 入出力のみ検証                                                 |
      | コンポーネント          | Testing Library + userEvent で振る舞いを検証                   |
      | async Server Component  | Vitest では描画できないため E2E で確認する                     |
      | カスタム hook           | `renderHook` + `waitFor`                                       |
      | service.ts              | 実 DB（test 用 schema / branch、dev と分離）で integration     |
      | クライアント API モック | MSW（setupServer、setup.ts で listen / resetHandlers / close） |

      <!-- /table -->
  - id: unit-scope-01
    group: 単体の単位
    name: 単体の単位の参照
    body: |-
      単体の単位・分岐カバレッジは `testing/テスト戦略.md`
