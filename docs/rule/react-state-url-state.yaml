# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: react-state-url-state
kind: rule
name: URL の状態
description: 画面で見ているものに影響する状態を URL の search で持つ原則と、TanStack Router の validateSearch + Zod での読み取り・書き込み・検証を定める。
tags:
  - name: scope:react
  - name: topic:frontend
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-30'
related:
  - to: flowchart-react-state-placement
    type: requires
    when: 値を URL に置くかを決めるとき
items:
  - id: overview
    name: 概要
    body: |-
      対象: React
      利用者が画面で見ているものに影響する状態（タブ・フィルタ・ソート・ページ・選択中の ID）は、URL の search に置く。
      共有・戻る / 進む・リロードでの復元・deep link が機能する。
      置くか置かないかは [状態の置き場所](id:flowchart-react-state-placement) が決める。
  - id: define-01
    group: 定義
    name: validateSearch と Zod で持つ
    body: |-
      - URL の状態は、TanStack Router の `validateSearch` と Zod で持つ。
        nuqs は使わない。
  - id: define-02
    group: 定義
    name: search.ts に Zod を置く
    body: |-
      - search の Zod スキーマは、画面の `search.ts` に置き、ルートの `validateSearch` から使う。
  - id: validation-01
    group: 検証
    name: 不正な値は既定値に落とす
    body: |-
      - URL の search は外部入力なので、Zod で parse する。
        不正な値は既定値に落とす。
  - id: read-01
    group: 読み取り
    name: 画面は getRouteApi で読む
    body: |-
      - 画面は、`getRouteApi` で取った route の `useSearch()` で読む。
  - id: write-01
    group: 書き込み
    name: navigate か Link で書き込む
    body: |-
      - 書き込みは、`navigate` か `<Link>` の `search` で行う。
        画面から `window.history` や `URLSearchParams` を直接触らない。
  - id: write-02
    group: 書き込み
    name: フィルタとソートの変更ではページを 1 に戻す
    body: |-
      - フィルタ・ソートを変えたときは、ページを 1 に戻す。
  - id: write-03
    group: 書き込み
    name: history の扱い
    body: |-
      - フィルタ・ソートの変更は履歴に積む（既定の push）。
        入力に合わせて何度も変わる検索語は、`replace: true` で履歴に積まない。
  - id: tab-01
    group: タブ
    name: Tabs に URL の状態を渡す
    body: |-
      - shadcn の `<Tabs>` の `value`・`onValueChange` に、URL の状態を渡す。
  - id: sources-01
    group: 出典
    name: "出典: TanStack Router と nuqs"
    body: |-
      - [TanStack Router: Search Params](https://tanstack.com/router/latest/docs/framework/react/guide/search-params)
      - [nuqs: Adapters](https://nuqs.dev/docs/adapters)（TanStack Router 用のアダプターが実験段階であることを確認した）
