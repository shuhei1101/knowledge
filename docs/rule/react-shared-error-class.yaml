# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: react-shared-error-class
kind: rule
name: エラークラス
description: AppError を基底にしたクライアント側のエラークラス階層と、変換する場所・処理する場所を定める。
tags:
  - name: scope:react
  - name: topic:shared
    main: true
status: current
visibility: internal
rev: 2
last_reviewed: '2026-10-30'
items:
  - id: overview
    name: 概要
    body: |-
      対象: React
  - id: app-error-01
    group: AppError
    name: AppError の派生を投げる
    body: |-
      - アプリの中のエラーは、必ず `AppError` の派生を投げる（汎用の `Error` を直接 throw しない）。
  - id: app-error-02
    group: AppError
    name: AppError のプロパティ
    body: |-
      - `AppError` は `message`・`statusCode`・`code`・`field?` を持つ。
  - id: app-error-03
    group: AppError
    name: fromResponse で復元する
    body: |-
      - `AppError.fromResponse(data, statusCode)` で、API の失敗レスポンスから復元する。
        呼ぶのは、`shared/adapters/api-client.ts` の mutator だけにする。
  - id: app-error-04
    group: AppError
    name: 握り潰さない
    body: |-
      - catch して握り潰さず、再 throw するか handler に渡す。
  - id: hierarchy-01
    group: 階層
    name: 階層と変換元の表
    body: |-
      <!-- table: data -->

      | クラス | status / code | 変換元 |
      | --- | --- | --- |
      | `ClientValueError` | 400 / VALUE | バリデーションの失敗。`field?` を持つ |
      | `ClientAuthError` | 401 / AUTH | 認証・認可の失敗 |
      | `VersionConflictError` | 409 / CONFLICT | 楽観的ロックの衝突 |
      | `RateLimitError` | 429 / RATE_LIMIT | レートリミット |
      | `AppError`（汎用） | 任意 | 404・403・500 系などの汎用 |

      <!-- /table -->
  - id: handling-01
    group: 処理する場所
    name: 処理する場所の表
    body: |-
      <!-- table: data -->

      | 場所 | Handler |
      | --- | --- |
      | query・mutation の hook | `handleAppError`（[エラークライアントハンドラー](id:react-shared-error-client-handler)） |
      | ルートの境界 | `ErrorBoundary`（[Error Boundary](id:react-component-error-boundary)） |

      <!-- /table -->
