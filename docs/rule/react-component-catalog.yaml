# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: react-component-catalog
kind: rule
name: コンポーネントカタログ
description: UI ライブラリの方針、shared/components/ の自前コンポーネントを用途別に一覧し、新しいコンポーネントを作る前の確認手順を定め、画面に使うコンポーネントを選ぶ・新しく作るときに読む。
tags:
  - name: scope:react
  - name: topic:frontend
  - name: topic:components
    main: true
  - name: topic:ui
  - name: topic:カタログ
  - name: topic:ダイアログ
  - name: topic:テーブル
  - name: topic:フォーム
  - name: topic:ボタン
  - name: topic:ライブラリ
  - name: topic:ラッパー
  - name: topic:手順
  - name: topic:画面
  - name: topic:部品
  - name: topic:非同期
  - name: tool:lucide-react
  - name: tool:react
  - name: tool:shadcn-ui
  - name: tool:tanstack-query
  - name: action:フィードバック
  - name: action:入力
status: current
visibility: internal
rev: 3
last_reviewed: '2026-10-30'
items:
  - id: overview
    name: 概要
    body: |-
      対象: React
  - id: ui-library-01
    group: UI ライブラリ
    name: shadcn/ui の Base UI 版だけを使う
    body: |-
      - UI 部品は、shadcn/ui（Base UI 版）だけを使う。
        `pnpm dlx shadcn@latest add {name}` で追加し、`shared/components/ui/` に置く。
  - id: ui-library-02
    group: UI ライブラリ
    name: 表は TanStack Table v9 で組む
    body: |-
      - 表は、TanStack Table v9 と shadcn の data-table のガイドで組む。
  - id: ui-library-03
    group: UI ライブラリ
    name: アイコンは lucide-react
    body: |-
      - アイコンの既定は `lucide-react` にする。
  - id: own-wrapper-01
    group: 自前ラッパー
    name: 自前ラッパーの一覧
    body: |-
      <!-- table: data -->

      | コンポーネント | 詳細 |
      | --- | --- |
      | `ScreenWrapper` | [スクリーンラッパー](id:react-component-screen-wrapper) |
      | `PageHeader` | [ページヘッダー](id:react-component-page-header) |
      | `LoadingButton` | 非同期処理中のボタン（下の「非同期処理中のボタン」） |
      | `EmptyState` | [空状態](id:react-component-empty-state) |
      | `RequiredMark` | [必須マーク](id:react-component-required-mark) |
      | `TagInput` | [タグ入力](id:react-component-tag-input) |
      | `AutosaveIndicator` | [自動保存インジケーター](id:react-component-autosave-indicator) |
      | `Pagination` | shadcn `<Pagination>` のラッパー |
      | `ConfirmDialogProvider` | [確認ダイアログ](id:react-component-confirm-dialog) |

      <!-- /table -->
  - id: own-wrapper-02
    group: 自前ラッパー
    name: 非同期処理中のボタン
    body: |-
      - 非同期処理中は、ボタンを押せなくしてスピナーを出す。
        この要件は `<LoadingButton>` で満たす（`isLoading={isPending}` を渡すと、disable と Loader2 のスピナー表示になる）。
  - id: usage-button-01
    group: 用途別 > ボタン
    name: ボタン系の一覧
    body: |-
      | 用途 | コンポーネント |
      |---|---|
      | 通常 | shadcn `<Button>` |
      | 非同期処理 | `<LoadingButton>` |
      | リンクへの遷移 | `<Button asChild><Link>` |
  - id: usage-form-input-01
    group: 用途別 > フォーム入力
    name: フォーム入力系の一覧
    body: |-
      <!-- table: data -->

      | 用途 | コンポーネント |
      |---|---|
      | 基本のラベル + エラー構造 | `<Controller>` + `<Field>` + `<FieldLabel>` + `<FieldError>` |
      | Text | `<Input>` |
      | Select | `<Select>` |
      | Multi-select | `<Command>` + `<Popover>` |
      | Tag | `<TagInput>` |
      | Toggle | `<Switch>` |
      | Date | `<Calendar>` + `<Popover>` |

      <!-- /table -->
  - id: usage-feedback-01
    group: 用途別 > フィードバック
    name: フィードバック系の一覧
    body: |-
      | 用途 | コンポーネント |
      |---|---|
      | Loading | `<Skeleton>` |
      | Toast | `toast.success` / `toast.error`（sonner） |
      | 確認ダイアログ | `useConfirmDialog()` |
      | 空状態 | `<EmptyState>` |
      | 自動保存の状態 | `<AutosaveIndicator>` |
  - id: usage-dialog-01
    group: 用途別 > ダイアログ系
    name: ダイアログ系の一覧
    body: |-
      | 用途 | コンポーネント |
      |---|---|
      | コンテンツのダイアログ | shadcn `<Dialog>` |
      | 確認ダイアログ | `useConfirmDialog()` |
      | サイドパネル | shadcn `<Sheet>` |
      | モバイルの下のシート | shadcn `<Drawer>` |
      | Popover | shadcn `<Popover>` |
  - id: before-new-component-01
    group: 新しいコンポーネントを作る前
    name: カタログを確認する
    body: |-
      1. このカタログを確認する
  - id: before-new-component-02
    group: 新しいコンポーネントを作る前
    name: shadcn の部品を確認する
    body: |-
      2. shadcn の部品を確認する（`shadcn add` で取れるか）
  - id: before-new-component-03
    group: 新しいコンポーネントを作る前
    name: Base UI を直接使う
    body: |-
      3. Base UI を直接使う
  - id: before-new-component-04
    group: 新しいコンポーネントを作る前
    name: 3 回目で共通化する
    body: |-
      4. 3 回目に同じものを書きそうになったら `shared/components/` に追加する
