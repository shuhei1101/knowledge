# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: convention-design-style
kind: rule
name: デザインスタイル規約
description: プロジェクト初期に画面全体の雰囲気と方向性を決めるためのデザインスタイルの一覧と、組み合わせの考え方を定める。
tags:
  - name: scope:規約
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      対象: 共通（単体 HTML・React）
      プロジェクト初期に「画面全体の雰囲気・方向性」を決めるための材料集。
      スタイル名と短い概要だけを並べる。
      配色・フォント・角丸の数値などの実装詳細はここでは扱わず、プロジェクト側の `設計書/デザイン方針.md`（テンプレート『デザイン方針』から作るページ）で決める。

      このページは網羅を狙うが、プロジェクトの要件次第で追加・改変してよい。
  - id: style-list-01
    group: スタイル一覧
    name: スタイル一覧
    body: |-
      <!-- table: data -->

      | 分類 | スタイル名 | 概要 | 向く用途 | 出典 |
      | --- | --- | --- | --- | --- |
      | 業務系 | フラット | 装飾を排し、面と色で情報を区切る。影や立体感を持たない | 業務系・情報密度が高い画面 | - |
      | コンシューマ | マテリアル | 紙のメタファで影と階層を表現する。明確な立体感を持つ | 一般消費者向け・操作の手応えを重視 | - |
      | 業務系 | モダン | フラットとマテリアルの折衷。控えめな影と適度な余白 | SaaS の標準・迷ったらここ | - |
      | 表現系 | ミニマル | 要素を極限まで減らす。余白を主役にする | ブランド訴求・ポートフォリオ | - |
      | 表現系 | ニューモーフィズム | 同色のソフトな凹凸で要素を表現する | 単機能アプリ・実験的 UI | - |
      | 表現系 | ガラスモーフィズム | 半透明とぼかしで奥行きを出す | ダッシュボード・モバイル系 | - |
      | 表現系 | スキューモーフィズム | 現実の物体（紙・革・木目）を模倣する | 学習系・ライフスタイル系 | - |
      | 表現系 | レトロ | 古い時代の意匠を引用する（90 年代 Web / 80 年代テクノなど） | エンタメ・ニッチ層向け | - |
      | 表現系 | ブルータリズム | 飾らず、生のままの要素を強調する。あえて素朴・粗野に | 個性訴求・アート系 | - |
      | 業務系 | ターミナル風 | 等幅フォント・モノクロまたは限定色で CLI を模倣する | 開発者向けツール | - |
      | 表現系 | エディトリアル | 雑誌・新聞の組版に倣う。タイポグラフィを主役にする | コンテンツ閲覧・読み物系 | - |
      | コンシューマ | カード中心 | カードを基本ユニットにし、画面全体をカードの集まりで構成する | フィード・ダッシュボード | - |
      | コンシューマ | カラフル / ポップ | 鮮やかな配色と曲線を多用する | コンシューマ・若年層向け | - |
      | 業務系 | エンタープライズ業務 | 役割ごとに画面を分け、表とフォームが中心。グレー基調にアクセント 1 色、角丸は小さめ | 基幹システム・大量データの入力 | SAP Fiori・IBM Carbon |
      | 業務系 | 業務 SaaS | 専門家でない人が迷わない。平易な文言、余白はやや広め、ブランド色 1 色 | たまにしか触らない利用者向けの業務 | SmartHR |
      | 業務系 | 監視コンソール | 暗い背景に小さなパネルを多数並べる。数値は等幅、色は状態にだけ使う | 運用監視・取引画面 | - |
      | 業務系 | 開発者ツール | 中くらいの密度。等幅を混ぜ、キーボード操作が前提。色は控えめで明暗の両方 | 開発・運用ツール | GitHub Primer |
      | 公共 | 行政・公共 | 飾りを持たない。大きめの文字と高いコントラスト、1 画面に 1 つの目的 | 申請・手続き・不特定多数向け | GOV.UK・デジタル庁 |
      | コンシューマ | OS 標準 | 動かす OS の見た目に合わせる。半透明の素材は操作部品の層にだけ使う | ネイティブアプリ風 | Fluent 2・Apple HIG |
      | 表現系 | スイス | 厳密なグリッドとサンセリフ、左右非対称の配置 | 企業サイト・情報設計重視 | 国際タイポグラフィ様式 |
      | 表現系 | ネオブルータリズム | 太い黒線と原色、ずらした影 | 個性を出したい小規模サービス | - |
      | 表現系 | クレイモーフィズム | 粘土のような柔らかい立体 | 子ども向け・親しみやすさ重視 | - |
      | 表現系 | ナチュラル | 土の色と手描きの質感、にじみ | 園芸・アウトドア・暮らし | - |
      | 表現系 | スポーティ | 高いコントラスト、斜体の太字、斜めの帯 | スポーツ・フィットネス | - |
      | 表現系 | ダーク没入 | 暗い地に世界観の背景画、映画のような見せ方 | ゲーム・映像作品 | - |
      | 表現系 | ドット絵 / 2D ゲーム | 限られた色数、ドット文字は見出しとラベルだけ、太枠のウィンドウ | ゲーム・遊び心のある個人サイト | - |
      | 表現系 | 和モダン | 余白、明朝や筆文字、生成り・墨・藍・朱、和紙の質感 | 旅館・和菓子・伝統文化 | - |

      <!-- /table -->
  - id: combination-01
    group: 組み合わせの考え方
    name: 基本は 1 つを採用する
    body: |-
      - 基本は 1 つを採用する
  - id: combination-02
    group: 組み合わせの考え方
    name: 性質が重ならない組み合わせは可
    body: |-
      - 「モダン × カード中心」のように、性質が重ならない 2 つの組み合わせは可
  - id: combination-03
    group: 組み合わせの考え方
    name: 矛盾する組み合わせは避ける
    body: |-
      - 「フラット × マテリアル」のように矛盾する組み合わせは避ける
  - id: combination-04
    group: 組み合わせの考え方
    name: 密度と明暗は別の軸
    body: |-
      - 密度（標準・コンパクト）と明暗（ライト・ダーク）は見た目のスタイルとは別の軸で選ぶ
  - id: react-apply-01
    group: React での当て方
    name: スタイルはトークンの値で表す
    body: |-
      - 選んだスタイルは、配色・角丸・影を、規約『[デザイントークン](id:ui-token)』の shadcn のセマンティックトークンの値（`--background`・`--primary`・`--radius` など）として表す。
        スタイル名の違いは、トークンの値の違いで表す。
  - id: react-apply-02
    group: React での当て方
    name: 部品の見た目の違いは variants で表す
    body: |-
      - スタイルによる部品の見た目の違いは、shadcn/ui の部品の variants（`cva`）で表し、使う側のクラスで上書きしない。
        部品の名前は、規約『[共通コンポーネント規約](id:convention-common-components)』の対応表に従う。
  - id: react-apply-03
    group: React での当て方
    name: 密度は Tailwind の既定の段階から選ぶ
    body: |-
      - スタイルが求める密度は、Tailwind の既定の段階（余白・文字・角丸）の中から選ぶ。
        既定から変える値だけを、プロジェクトのデザイン方針に記載する。
