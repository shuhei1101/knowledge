id: next-backend-db-timestamp
kind: rule
name: drizzle/schema.ts — 共通カラム（timestamps / auditFields）
description: 全テーブル共通の timestamps と機密データ向けの auditFields の定義と、テーブル区分ごとの使い方を定め、テーブルに作成・更新日時の列を付けるときに読む。
