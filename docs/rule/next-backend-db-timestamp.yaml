  - id: drizzle-schema-common-columns-04
    group: drizzle/schema.ts — 共通カラム（timestamps / auditFields）
    name: マスター系は不変なら不要
    body: |-
      - マスター系 — 不変なら `timestamps` なしで OK
  - id: drizzle-schema-common-columns-05
    group: drizzle/schema.ts — 共通カラム（timestamps / auditFields）
    name: データ系は timestamps 必須
    body: |-
      - データ系 — `...timestamps` 必須
  - id: drizzle-schema-common-columns-06
    group: drizzle/schema.ts — 共通カラム（timestamps / auditFields）
    name: 機密データ系は auditFields も付与
    body: |-
      - 機密データ系 — `...timestamps` に加えて `...auditFields` も付与
  - id: drizzle-schema-common-columns-07
    group: drizzle/schema.ts — 共通カラム（timestamps / auditFields）
    name: updatedAt は明示更新
    body: |-
      `updatedAt` はアプリケーション側で明示更新する（書き方は [DB楽観的ロック](id:next-backend-db-optimistic-lock)）。
