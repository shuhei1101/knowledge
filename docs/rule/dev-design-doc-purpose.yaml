id: dev-design-doc-purpose
kind: rule
name: 設計書を作成する目的
description: 実装の前に設計書を作成する目的と、設計書のテンプレートと実装との関係で守ることを定め、設計書を作成するか・どこまで記載するかを判断するときと、設計書のスキーマのキーを追加・修正するときに参照する。
aliases:
  - 設計
  - 設計書
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-12'
related:
  - to: dev-v-model
    type: references
    when: 設計書の種類とテストの対応を確認するとき
items:
  - id: overview
    name: 概要
    body: |-
      実装の前に設計書を作成する目的と、守ること。
      設計書の種類とテストの対応は規約 [V字モデル](id:dev-v-model) に従う。
  - id: purpose-01
    group: 目的
    name: 設計書を作成する目的の表
    body: |-
      | 目的 | 内容 |
      | --- | --- |
      | 品質をそろえる | テンプレートのキーを埋めれば、記載する人によらず一定の品質になる |
      | 漏れを見つける | 実装の段階では分からない漏れを、設計の段階で見つける |
      | 考えるべき点を考えさせる | キーを埋めるときに、そのキーで決めるべき点を考えさせる |
      | 手戻りを減らす | 設計と実装を一括で行うと、手戻りのときに変更する箇所が増える。設計書とテストを段階ごとに対応させる（[V字モデル](id:dev-v-model)） |
      | ノイズを除く | 言語・ライブラリに依存する事柄など、設計に要らない要素を設計の段階では扱わない |
  - id: rule-01
    group: 守ること
    name: 守ることの表
    body: |-
      | 守ること | 内容 |
      | --- | --- |
      | テンプレートは YAML のスキーマを原本にする | 設計書の種類ごとのスキーマ（`schemas/design/`）を原本にし、テンプレート（`docs/template/`）はスキーマから生成する |
      | 設計書と実装で二重管理にしない | 実装と同じ事柄を設計書に持たない。設計の成果物をそのまま実装の原本にできるもの（プロンプトの YAML など）は、設計の段階で原本を記載してレビューし、実装はそれを参照する |
  - id: schema-key-01
    group: 守ること
    name: スキーマのキーで考えさせる
    body: |-
      - 設計書のスキーマのキーは、`description` に何を記載するかを、`x-used-by` にその値でどの段階の何を決めるかを記載する
      - `x-used-by` が「〜を参照する」だけで決めることが読み取れないキーは、決めることを修正するか、キーを設けない
        - キーを設ける条件はメタスキーマ `schemas/meta.schema.yaml` の `x-rules` に従う
tags:
  - name: scope:dev
  - name: topic:設計書
    main: true
  - name: topic:テンプレート
  - name: topic:スキーマ
  - name: topic:正本
  - name: topic:品質
  - name: action:設計
  - name: action:判断
