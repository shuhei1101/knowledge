items:
  - id: overview
    name: 概要
    body: |-
      対象: 共通（単体 HTML・React）
      画面の骨格と部品の並びの決めかた、タップ領域、共通の枠、画面型ごとの構成、CSS の落とし穴を定める。
  - id: responsive-01
    group: レスポンシブの基準
    name: 画面の骨格はビューポートのブレークポイント
    body: |-
      - 画面の骨格は、ビューポートのブレークポイント `md`（48rem）で切り替える。
        Tailwind のモバイルファーストに合わせ、狭い画面の書き方を既定にして、`md` 以上を広げる側に書く。
  - id: responsive-02
    group: レスポンシブの基準
    name: 部品の並びは container queries
    body: |-
      - 部品の並びは、container queries で切り替える。
        サイドパネルの中に置いた部品も、置き場所の幅で正しく切り替わる。
  - id: responsive-03
    group: レスポンシブの基準
    name: スマホでも主な操作まで完了できる
    body: |-
      - スマホでも、主な操作まで完了できることを既定にする。
        PC とスマホの両対応にしない画面は、デザイン方針（`設計書/デザイン方針`）に理由を記載する。
  - id: tap-target-01
    group: タップ領域
    name: タップ領域は 2 段階
    body: |-
      <!-- table: data -->

      | 対象 | 最低の大きさ |
      | --- | --- |
      | 全ての押す部品 | 24 x 24 CSS px |
      | タッチが主な画面の主要な操作 | 44 x 44 CSS px |

      <!-- /table -->
  - id: common-shell-01
    group: 共通の枠
    name: 共通シェルに内蔵する
    body: |-
      - ヘッダー・サイドメニューなど、各画面共通のコンポーネントは共通シェルに内蔵する。
        各画面は枠を読み込むだけで、これらが自動で付く。
  - id: layout-pattern-01
    group: レイアウトパターン
    name: サイドバー + メインが標準の骨格
    body: |-
      開発ツール画面の標準骨格は、サイドバー + メイン。
      - ヘッダー: 上部固定・フル幅。左にタイトル、右にグローバルアクション。
      - サイドバー: 左固定・常時表示。セクション見出しでグルーピングし、アクティブ項目を視覚的に区別する。
      - メイン: 残り領域。
  - id: screen-template-01
    group: 画面テンプレート
    name: 画面型ごとの構成表
    body: |-
      関連画面は、ドメイン配下にまとめる（一覧・詳細・編集）。

      | 画面型 | 構成の要点 |
      | --- | --- |
      | 一覧 | タイトル + 主アクション（新規作成）右上、テーブル / カード一覧 |
      | 詳細 | タイトル + 編集アクション、読み取り表示 |
      | 設定 | セクション分け、保存アクションの位置を固定 |
  - id: pitfall-text-code-01
    group: 落とし穴チェックリスト > テキスト・コード
    name: 長い文字列の折り返し
    body: |-
      - 長い URL / トークン / ファイルパス / 半角混在の日本語長文を含む親に `overflow-wrap: anywhere` を当てる
  - id: pitfall-text-code-02
    group: 落とし穴チェックリスト > テキスト・コード
    name: pre と code の横スクロール
    body: |-
      - `<pre>` / `<code>` は `overflow-x: auto` + `white-space: pre-wrap` を両立させる
  - id: pitfall-text-code-03
    group: 落とし穴チェックリスト > テキスト・コード
    name: ellipsis の全文表示
    body: |-
      - `text-overflow: ellipsis` で省略する場合、タップ全文表示の導線を用意する
  - id: pitfall-table-01
    group: 落とし穴チェックリスト > テーブル
    name: 多列 table の横スクロール
    body: |-
      - 多列 `<table>` は親に `overflow-x: auto` のラッパを付けて横スクロール許容
  - id: pitfall-table-02
    group: 落とし穴チェックリスト > テーブル
    name: 行の縦積み変換
    body: |-
      - スマホで「行を縦積み変換」する場合、`tr { display: grid }` で 1 行 1 ブロック化
  - id: pitfall-table-03
    group: 落とし穴チェックリスト > テーブル
    name: sticky の thead の制約
    body: |-
      - `overflow-x: auto` ラッパ内では `position: sticky` の thead が機能しない
  - id: pitfall-tab-row-01
    group: 落とし穴チェックリスト > タブ・横並び
    name: 横並びタブの折り返し
    body: |-
      - ヘッダーの外に並べた横並びタブが多い場合は `overflow-x: auto` + `flex-wrap: nowrap` で横スクロール（ヘッダーの中では横スクロールさせない）
  - id: pitfall-tab-row-02
    group: 落とし穴チェックリスト > タブ・横並び
    name: フォーム行の縦並び
    body: |-
      - `.row` のフォーム行はスマホで `flex-direction: column` に倒す
  - id: pitfall-tab-row-03
    group: 落とし穴チェックリスト > タブ・横並び
    name: inline-flex の折り返し
    body: |-
      - `inline-flex` を連続で並べる親には `flex-wrap: wrap` を必ず付ける
  - id: pitfall-form-01
    group: 落とし穴チェックリスト > 入力フォーム
    name: 入力欄は 16px 以上
    body: |-
      - `input` / `textarea` / `select` の `font-size` は 16px 未満にしない
  - id: pitfall-form-02
    group: 落とし穴チェックリスト > 入力フォーム
    name: 固定 width の input
    body: |-
      - 固定 width の input は `max-width: 100%` を保証
  - id: pitfall-form-03
    group: 落とし穴チェックリスト > 入力フォーム
    name: number のスピンボタン
    body: |-
      - `<input type="number">` のスピンボタンはスマホで `appearance: none` を検討
  - id: pitfall-form-04
    group: 落とし穴チェックリスト > 入力フォーム
    name: label と input の縦積み
    body: |-
      - `label` + `input` の横並びはスマホ時に縦積み
  - id: pitfall-viewport-01
    group: 落とし穴チェックリスト > ビューポート・高さ
    name: 100dvh を使う
    body: |-
      - `100vh` / `min-height: 100vh` / `100svh` は使わず `100dvh` を使う
  - id: pitfall-viewport-02
    group: 落とし穴チェックリスト > ビューポート・高さ
    name: 100vw を使わない
    body: |-
      - `100vw` は使わず `100%` を使う
  - id: pitfall-flex-grid-01
    group: 落とし穴チェックリスト > Flexbox / Grid
    name: flex 子の min-width
    body: |-
      - flex 子要素には `min-width: 0` を明示
  - id: pitfall-flex-grid-02
    group: 落とし穴チェックリスト > Flexbox / Grid
    name: grid の列数固定を避ける
    body: |-
      - `grid-template-columns: repeat(N, 1fr)` の N 列固定は使わず、`repeat(auto-fit, minmax(MIN, 1fr))` か `@media` で 1 列化
  - id: pitfall-flex-grid-03
    group: 落とし穴チェックリスト > Flexbox / Grid
    name: sticky と align-self
    body: |-
      - flex/grid の子に `position: sticky` を使うときは `align-self: start` を付ける
  - id: pitfall-touch-01
    group: 落とし穴チェックリスト > タッチ・操作性
    name: hover 前提の UI
    body: |-
      - `:hover` 前提の UI は `click` トグルに切替、または `@media (hover: hover)` で分岐
  - id: pitfall-touch-02
    group: 落とし穴チェックリスト > タッチ・操作性
    name: touch-action の指定
    body: |-
      - 連続クリック想定の要素には `touch-action: manipulation` を付ける
  - id: pitfall-media-01
    group: 落とし穴チェックリスト > メディア要素
    name: メディア要素の max-width
    body: |-
      - `<img>` / `<canvas>` / `<svg>` は `max-width: 100%; height: auto`
  - id: pitfall-media-02
    group: 落とし穴チェックリスト > メディア要素
    name: 固定 width の画像
    body: |-
      - アバター画像など固定 width はコンテナ側で `max-width` を制約
  - id: pitfall-layer-01
    group: 落とし穴チェックリスト > レイヤ・重なり
    name: fixed の座標基準
    body: |-
      - `position: fixed` の座標は `right` / `bottom` 基準にして `max-width` で制約
  - id: pitfall-layer-02
    group: 落とし穴チェックリスト > レイヤ・重なり
    name: モーダルの flip
    body: |-
      - モーダル・ポップオーバーはビューポート境界判定で flip
