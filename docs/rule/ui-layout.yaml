status: current
visibility: internal
rev: 5
last_reviewed: '2026-11-10'
related:
  - to: ui-token
    type: references
    when: 余白・角丸などの値を決めるとき
  - to: ui-operation-accessibility
    type: references
    when: 押す部品の大きさと WCAG 2.2 の達成基準を確認するとき
  - to: flowchart-short-text-overflow
    type: references
    when: 短い固定の文言が狭い幅で折り返す・省略されるときの対処を決めるとき
items:
  - id: overview
    name: 概要
    body: |-
      対象は共通（単体 HTML・React）。
      画面の骨格と部品の並びの決めかた、タップ領域、共通シェル、画面型ごとの構成、CSS の落とし穴を定める。
  - id: responsive-01
    group: レスポンシブの基準
    name: 画面の骨格はビューポートのブレークポイント
    body: |-
      - 画面の骨格は、ビューポートのブレークポイント `md`（48rem）で切り替える。
        Tailwind のモバイルファーストに合わせ、狭い画面の記載方法を既定にして、`md` 以上を広げる側に記載する。
  - id: responsive-02
    group: レスポンシブの基準
    name: 部品の並びは container queries
    body: |-
      - 部品の並びは、container queries で切り替える。
        サイドパネルの中に配置した部品も、配置先の幅で正しく切り替わる。
  - id: responsive-03
    group: レスポンシブの基準
    name: スマホでも主な操作まで完了できる
    body: |-
      - スマホでも、主な操作まで完了できることを既定にする。
        PC とスマホの両対応にしない画面は、デザイン方針（`設計書/デザイン方針`）に理由を記載する。
  - id: tap-target-01
    group: タップ領域
    name: タップ領域は 2 段階
    body: |-
      <!-- table: {"kind": "data"} -->

      | 対象 | 最低の大きさ |
      | --- | --- |
      | 全ての押す部品 | 24 x 24 CSS px |
      | タッチが主な画面の主要な操作 | 44 x 44 CSS px |

      <!-- /table -->

      タップ領域を広げて部品の高さを変える幅では、同じ行や近くに並べた部品をまとめて広げ、高さを統一する（[情報の階層と見た目](id:ui-information-hierarchy#visual-consistency-01)）。
  - id: common-shell-01
    group: 共通シェル
    name: 共通シェルに内蔵する
    body: |-
      - ヘッダー・サイドメニューなど、各画面共通のコンポーネントは共通シェルに内蔵する。
        各画面は共通シェルを読み込むだけで、これらが自動で付く。
  - id: layout-pattern-01
    group: レイアウトパターン
    name: サイドバー + メインが標準の骨格
    body: |-
      開発ツール画面の標準骨格は、サイドバー + メイン。

      | 領域 | 配置 | 中身 |
      | --- | --- | --- |
      | ヘッダー | 上部に固定・フル幅 | 左にタイトル、右にグローバルアクション |
      | サイドバー | 左に固定。メインとの境目にスプリッターと開閉のボタンを持つ（[スプリッター](id:ui-layout#splitter-01)） | セクション見出しでグルーピングし、アクティブな項目を視覚的に区別する |
      | メイン | 残りの領域 | - |
  - id: screen-template-01
    group: 画面テンプレート
    name: 画面型ごとの構成表
    body: |-
      関連画面は、ドメイン配下にまとめる（一覧・詳細・編集）。

      | 画面型 | 構成の要点 |
      | --- | --- |
      | 一覧 | タイトル + 主アクション（新規作成）右上、テーブル / カード一覧 |
      | 詳細 | タイトル + 編集アクション、読み取り表示 |
      | 設定 | セクション分け、保存アクションの位置を固定 |
  - id: pitfall-text-code-01
    group: 落とし穴チェックリスト > テキスト・コード
    name: 長い文字列の折り返し
    body: |-
      - 長い URL / トークン / ファイルパス / 半角混在の日本語長文を含む親に `overflow-wrap: anywhere` を適用する
  - id: pitfall-text-code-02
    group: 落とし穴チェックリスト > テキスト・コード
    name: pre と code の横スクロール
    body: |-
      - `<pre>` / `<code>` は `overflow-x: auto` + `white-space: pre-wrap` を両立させる
  - id: pitfall-text-code-03
    group: 落とし穴チェックリスト > テキスト・コード
    name: ellipsis の全文表示
    body: |-
      - `text-overflow: ellipsis` で省略する場合、タップ全文表示の導線を用意する
  - id: pitfall-text-code-04
    group: 落とし穴チェックリスト > テキスト・コード
    name: 固定の文言と長さが変わる値を同じ行に並べる
    body: |-
      - 固定の文言のラベル・ボタンを長さが変わる値（記録から取得する値・利用者が入力する値）と同じ行に並べる場合、ラベル・ボタンは折り返さず縮めない。
        ラベル・ボタンには `white-space: nowrap` と `flex-shrink: 0` を付ける
      - 値の側に `min-width: 0` を付け、画面設計の `overflow` のとおりに折り返すか省略する
  - id: pitfall-text-code-05
    group: 落とし穴チェックリスト > テキスト・コード
    name: 長さが変わる値を折り返すか省略するかの既定
    body: |-
      - 画面設計の `overflow.type` は、固定の領域（`fixed_area`）に配置する要素では `truncate` にし、全文を出す導線を付ける（`pitfall-text-code-03`）
      - タグ・チップ・1 行の見出しのように、1 件ずつを 1 行に収めて並べる値も `truncate` にし、全文を出す導線を付ける
      - それ以外の要素では `wrap` にし、`overflow-wrap: anywhere` で折り返す（`pitfall-text-code-01`）
      - `<pre>` / `<code>` と多列の表のように、折り返すと判読できなくなる値だけを `scroll` にする
  - id: pitfall-text-code-06
    group: 落とし穴チェックリスト > テキスト・コード
    name: 短い固定の文言が狭い幅で収まらない
    body: |-
      - ヘッダーの文字と、通知・ボタン・ラベル・見出しの短い固定の文言が狭い幅で折り返す・省略されるときは、[狭い幅の短い文言の対処](id:flowchart-short-text-overflow) で対処を決める
  - id: pitfall-table-01
    group: 落とし穴チェックリスト > テーブル
    name: 多列 table の横スクロール
    body: |-
      - 多列 `<table>` は親に `overflow-x: auto` のラッパを付けて横スクロール許容
  - id: pitfall-table-02
    group: 落とし穴チェックリスト > テーブル
    name: 行の縦積み変換
    body: |-
      - スマホで「行を縦積み変換」する場合、`tr { display: grid }` で 1 行 1 ブロック化
  - id: pitfall-table-03
    group: 落とし穴チェックリスト > テーブル
    name: sticky の thead の制約
    body: |-
      - `overflow-x: auto` ラッパ内では `position: sticky` の thead が機能しない
  - id: pitfall-tab-row-01
    group: 落とし穴チェックリスト > タブ・横並び
    name: 横並びタブの折り返し
    body: |-
      - ヘッダーの外に並べた横並びタブが多い場合は `overflow-x: auto` + `flex-wrap: nowrap` で横スクロール（ヘッダーの中では横スクロールさせない）
  - id: pitfall-tab-row-02
    group: 落とし穴チェックリスト > タブ・横並び
    name: フォーム行の縦並び
    body: |-
      - `.row` のフォーム行はスマホで `flex-direction: column` に倒す
  - id: pitfall-tab-row-03
    group: 落とし穴チェックリスト > タブ・横並び
    name: inline-flex の折り返し
    body: |-
      - `inline-flex` を連続で並べる親には `flex-wrap: wrap` を必ず付ける
  - id: pitfall-form-01
    group: 落とし穴チェックリスト > 入力フォーム
    name: 入力欄は 16px 以上
    body: |-
      - `input` / `textarea` / `select` の `font-size` は 16px 未満にしない
  - id: pitfall-form-02
    group: 落とし穴チェックリスト > 入力フォーム
    name: 固定 width の input
    body: |-
      - 固定 width の input は `max-width: 100%` を保証
  - id: pitfall-form-03
    group: 落とし穴チェックリスト > 入力フォーム
    name: number のスピンボタン
    body: |-
      - `<input type="number">` のスピンボタンはスマホで `appearance: none` を検討
  - id: pitfall-form-04
    group: 落とし穴チェックリスト > 入力フォーム
    name: label と input の縦積み
    body: |-
      - `label` + `input` の横並びはスマホ時に縦積み
  - id: pitfall-viewport-01
    group: 落とし穴チェックリスト > ビューポート・高さ
    name: 100dvh を使用する
    body: |-
      - `100vh` / `min-height: 100vh` / `100svh` は使用せず `100dvh` を使用する
  - id: pitfall-viewport-02
    group: 落とし穴チェックリスト > ビューポート・高さ
    name: 100vw を使用しない
    body: |-
      - `100vw` は使用せず `100%` を使用する
  - id: pitfall-flex-grid-01
    group: 落とし穴チェックリスト > Flexbox / Grid
    name: flex 子の min-width
    body: |-
      - flex 子要素には `min-width: 0` を明示
  - id: pitfall-flex-grid-02
    group: 落とし穴チェックリスト > Flexbox / Grid
    name: grid の列数固定を使用しない
    body: |-
      - `grid-template-columns: repeat(N, 1fr)` の N 列固定にせず、`repeat(auto-fit, minmax(MIN, 1fr))` か `@media` で 1 列化
  - id: pitfall-flex-grid-03
    group: 落とし穴チェックリスト > Flexbox / Grid
    name: sticky と align-self
    body: |-
      - flex/grid の子に `position: sticky` を使用するときは `align-self: start` を付ける
  - id: pitfall-touch-01
    group: 落とし穴チェックリスト > タッチ・操作性
    name: hover 前提の UI
    body: |-
      - `:hover` 前提の UI は `click` トグルに切替、または `@media (hover: hover)` で分岐
  - id: pitfall-touch-02
    group: 落とし穴チェックリスト > タッチ・操作性
    name: touch-action の指定
    body: |-
      - 連続クリック想定の要素には `touch-action: manipulation` を付ける
  - id: pitfall-media-01
    group: 落とし穴チェックリスト > メディア要素
    name: メディア要素の max-width
    body: |-
      - `<img>` / `<canvas>` / `<svg>` は `max-width: 100%; height: auto`
  - id: pitfall-media-02
    group: 落とし穴チェックリスト > メディア要素
    name: 固定 width の画像
    body: |-
      - アバター画像など固定 width はコンテナ側で `max-width` を制約
  - id: pitfall-layer-01
    group: 落とし穴チェックリスト > レイヤ・重なり
    name: fixed の座標基準
    body: |-
      - `position: fixed` の座標は `right` / `bottom` 基準にして `max-width` で制約
  - id: pitfall-layer-02
    group: 落とし穴チェックリスト > レイヤ・重なり
    name: モーダルの flip
    body: |-
      - モーダル・ポップオーバーはビューポート境界判定で flip
  - id: pitfall-layer-03
    group: 落とし穴チェックリスト > レイヤ・重なり
    name: 画面の下に固定した要素の後ろの余白
    body: '- 画面の下に `position: fixed` で配置したボタン・バーがある幅では、本文の末尾にその高さ以上の余白を取り、最後までスクロールしたときに最後の要素と操作が隠れないようにする'
  - id: pitfall-tab-row-04
    group: 落とし穴チェックリスト > タブ・横並び
    name: 本文の上の操作の行
    body: |-
      - 見出し・タブ・開閉・追加などの本文の上の操作は、ボタン 1 つのために 1 行を使用せず、同じ行にまとめて縦の幅を取らないようにする
      - 狭い幅で 1 行に収まらないときは折り返さず、その行の中で横スクロールにするか、優先度の低い操作から 3 点リーダーのメニューへまとめる
  - id: splitter-01
    group: スプリッター
    name: サイドバーと補助のペインのスプリッター
    body: |-
      サイドバーと補助のペイン（詳細パネル・サイドパネル）は、`md` 以上の幅で、メインとの境目にスプリッターと、ペインを閉じる・開くボタンを持つ。

      <!-- table: {"kind": "data"} -->

      | 要素 | 決まり |
      | --- | --- |
      | 幅の変更 | スプリッターのドラッグと、キー操作（[部品ごとのキー](id:ui-keyboard#composite-widget-02) の分割線の行）で変える |
      | ドラッグの代替 | クリックで幅を一段ずつ広げる・狭めるボタンと、開閉のボタンと、スプリッターのダブルクリックで既定の幅に戻す操作を持つ（[WCAG 2.2 AA で追加された達成基準](id:ui-operation-accessibility#wcag22-01) の 2.5.7） |
      | 最小と最大の幅 | 画面設計で決める。最小はペインの主な操作が収まる幅、最大はメインに主な操作が残る幅にする |
      | 保存 | 変えた幅と開閉は、端末ごとの好みとして localStorage に保存する（[状態の保持](id:ui-input-wording#state-retention-01)） |
      | 開閉のボタン | 閉じてもボタンを残し、押したら閉じる前の幅で開く |
      | `md` 未満の幅 | スプリッターを出さず、ドロワーにする |

      <!-- /table -->
