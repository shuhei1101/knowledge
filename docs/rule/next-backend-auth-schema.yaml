id: next-backend-auth-schema
kind: rule
name: drizzle/schema.ts — 認証関連テーブル
description: Better Auth が要求する認証関連テーブルの定義と、ID・リレーション・タイムスタンプの決まりを定め、認証関連テーブルのスキーマを定義するときに読む。
