id: next-backend-webhook
kind: rule
name: Next.js App Router — Webhook Receiver
description: Webhook を受信する Route Handler の配置と、署名検証・raw body・冪等性・レスポンス時間・リトライの決まりを定め、外部サービスの Webhook を受信する処理を実装するときに読む。
