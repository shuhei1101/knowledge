items:
  - id: overview
    name: 概要
    body: |-
      検索の絞り込みと、文書・ルールを適用する照合条件を、AND・OR・NOT の入れ子で記載するときの共通の構造。
      ツールの引数・設定ファイル・文書のメタデータへ記載する条件に適用する。
      画面の条件ビルダーの構造は規約 [タグの絞り込みと保存ビュー](id:ui-tag-filter) に従い、保存するときにこの構造へ変換する。
  - id: structure-01
    group: 構造
    name: 条件と束
    body: |-
      <!-- table: data -->

      | 要素 | キー | 意味 |
      | --- | --- | --- |
      | 条件 | `field`・`op`・`values`・`match`・`case_sensitive` | 1 つの項目を比べる。`op` は project-index の `filter` の比べ方の名前（`eq`・`ne`・`contains`・`not_contains` など）を使用し、ツールが受け付ける比べ方はその一部に限ってよい。`values` が複数のときは `match: any`（どれか。既定）か `all`（全て） |
      | AND の束 | `and` | 条件か束の配列の全てに該当する |
      | OR の束 | `or` | 条件か束の配列のどれかに該当する |
      | NOT の束 | `not` | 中の 1 つの条件か束に該当しない |

      <!-- /table -->

      - 束は `and`・`or`・`not` のどれか 1 つのキーだけを持つ
  - id: rules-01
    group: 決まり
    name: 記載の決まり
    body: |-
      <!-- table: data -->

      | 決まり | 内容 |
      | --- | --- |
      | 否定の記載方法 | 1 つの条件の否定は否定の比べ方（`ne`・`not_contains`）、束の否定は `not` |
      | 入れ子の深さ | 最上位の束を 1 レイヤーとして 3 レイヤーまで。超えるなら条件を分けて登録する |
      | 値の正規化 | NFKC と英字の大文字小文字を統一して比べる（`case_sensitive: true` で解除） |
      | 空の束 | 記載しない。検査で弾く |
      | 省略形 | 条件を 1 つだけ記載するときは束で包まない |

      <!-- /table -->
  - id: example-01
    group: 例
    name: 照合条件の例
    body: |-
      alias-inject の照合条件 `inject_when` で、「React」か「tsx」を含み「Python」を含まない本文でだけ文書を案内する例。

      ```yaml
      inject_when:
        and:
          - field: text
            op: contains
            values: [React, tsx]
          - field: text
            op: not_contains
            values: [Python]
      ```
