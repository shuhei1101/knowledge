# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-backend-db-history
kind: rule
name: Drizzle — ハードデリート + 履歴テーブル
description: ソフトデリートを使わず、削除前に履歴テーブルへ退避してハードデリートする決まりを定め、レコードの削除を実装するときに読む。
tags:
  - name: scope:next
  - name: topic:バックエンド
  - name: topic:id
  - name: tool:json
  - name: topic:スナップショット
  - name: topic:ソフトデリート
  - name: topic:テーブル
  - name: topic:トランザクション
  - name: topic:ハードデリート
    main: true
  - name: topic:レコード
  - name: topic:履歴
  - name: tool:drizzle
  - name: action:削除
  - name: action:記録
  - name: action:追跡
  - name: action:退避
status: current
visibility: internal
rev: 4
last_reviewed: '2026-10-24'
items:
  - id: drizzle-hard-delete-history-01
    group: Drizzle — ハードデリート + 履歴テーブル
    name: ハードデリートと履歴
    body: |-
      - ソフトデリート（`deletedAt`）は使わず、削除前にスナップショットを履歴テーブルへ退避してハードデリート。
  - id: drizzle-hard-delete-history-02
    group: Drizzle — ハードデリート + 履歴テーブル
    name: 削除前に履歴を記録
    body: |-
      - 削除系の全 service で履歴記録 → ハードデリート の順
  - id: drizzle-hard-delete-history-03
    group: Drizzle — ハードデリート + 履歴テーブル
    name: トランザクション内で記録
    body: |-
      - 履歴記録はトランザクション内（履歴 INSERT 成功 + DELETE 成功で同期）
  - id: drizzle-hard-delete-history-04
    group: Drizzle — ハードデリート + 履歴テーブル
    name: snapshot は jsonb
    body: |-
      - `snapshot` は jsonb
  - id: drizzle-hard-delete-history-05
    group: Drizzle — ハードデリート + 履歴テーブル
    name: tableName と recordId
    body: |-
      - `tableName` + `recordId` で復元時の照合
  - id: drizzle-hard-delete-history-06
    group: Drizzle — ハードデリート + 履歴テーブル
    name: deletedBy の追跡
    body: |-
      - `deletedBy` で誰が削除したかを追跡
