# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: dev-estimate-points
kind: rule
name: "見積もりポイント"
description: 作業の規模を 1・2・3・5・8・13 の相対値で見積もる基準を定め、Issue やタスクの規模を見積もるときに参照する。
aliases:
  - 見積もりの基準
tags:
  - name: scope:dev
  - name: topic:見積もり
    main: true
  - name: topic:計画
  - name: topic:タスク
  - name: action:判定
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-12'
items:
  - id: overview
    name: "概要"
    body: |-
      作業の規模の見積もりの基準。
      値は 1 / 2 / 3 / 5 / 8 / 13 のどれかで、相対規模を表す（時間の目安ではない）。
  - id: calc-01
    group: 算出
    name: "変更の広がりと pt"
    body: |-
      変更が既存の記述の書き換えに留まるか、新しいものを追加して設計書と実装が要るかで決まる。
      追加するものが増えるほど、次の表で上の行から下の行へ進む。

      <!-- table: data -->

      | pt | 変更の広がり |
      | --- | --- |
      | 1 | 既存の記述の書き換えだけで、新しいユースケース・分岐・設定値・関数を追加しない修正（設計書の変更が既存の記述への追随に留まるものを含む） |
      | 2 | 実装 1 枚 + それに対応する設計書 1 枚 |
      | 3 | 単一ユースケースのシナリオ + インターフェース定義 + モジュール構成 + 実装・テスト |
      | 5 | 複合ユースケースのシナリオを含む設計書一式 + 実装・テスト |
      | 8 | 複数サブシステムにまたがる、またはサブシステムの新設 |
      | 13 | 分割必須（スプリントに含めない） |

      <!-- /table -->
  - id: calc-02
    group: 算出
    name: "pt に反映しないもの"
    body: |-
      実装に付随して修正する手順書・ドキュメントのページ数は pt に反映しない。
      変更の種別と pt は別々の軸として付ける。
