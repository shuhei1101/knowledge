# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: python-db-sqlalchemy
kind: rule
name: DB — SQLAlchemy と Alembic
description: DB を使用するリポジトリの ORM とマイグレーション、API のスキーマとの分け方を定め、SQLAlchemy のモデルや Alembic のマイグレーションを作るときに参照する。
tags:
  - name: scope:python
  - name: topic:db
  - name: topic:api
  - name: topic:orm
  - name: topic:スキーマ
  - name: topic:モデル
  - name: topic:リポジトリ
  - name: tool:alembic
  - name: tool:sqlalchemy
    main: true
  - name: action:宣言
  - name: action:移行
status: current
visibility: internal
rev: 3
last_reviewed: '2026-10-30'
related:
  - to: python-fastapi-schema
    type: references
    when: API の入出力のスキーマを記載するとき
items:
  - id: overview
    name: 概要
    body: |-
      DB を使用するリポジトリは SQLAlchemy 2.1 と Alembic を使用する。
  - id: orm-01
    group: ORM
    name: モデルは Mapped で宣言する
    body: |-
      - モデルは `Mapped[]` を使用する宣言（`DeclarativeBase`）で記載する
  - id: orm-02
    group: ORM
    name: API のスキーマは別に持つ
    body: |-
      - API の入出力のスキーマは Pydantic で別に持ち、ORM のモデルをレスポンスに使用しない（DB の型を OpenAPI に出さない）
  - id: migration-01
    group: マイグレーション
    name: スキーマの変更は Alembic
    body: |-
      - テーブルの変更は Alembic のマイグレーションで行う
