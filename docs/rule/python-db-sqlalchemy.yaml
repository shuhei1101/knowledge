# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: python-db-sqlalchemy
kind: rule
name: DB — SQLAlchemy と Alembic
description: DB を使うリポジトリの ORM とマイグレーション、API のスキーマとの分け方を定める。
tags:
  - name: scope:python
  - name: topic:db
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-30'
related:
  - to: python-fastapi-schema
    type: references
    when: API の入出力のスキーマを書くとき
items:
  - id: overview
    name: 概要
    body: |-
      DB を使うリポジトリは SQLAlchemy 2.1 と Alembic を使う。
  - id: orm-01
    group: ORM
    name: モデルは Mapped で宣言する
    body: |-
      - モデルは `Mapped[]` を使う宣言（`DeclarativeBase`）で書く
  - id: orm-02
    group: ORM
    name: API のスキーマは別に持つ
    body: |-
      - API の入出力のスキーマは Pydantic で別に持ち、ORM のモデルをレスポンスに使わない（DB の型を OpenAPI に出さない）
  - id: migration-01
    group: マイグレーション
    name: スキーマの変更は Alembic
    body: |-
      - テーブルの変更は Alembic のマイグレーションで行う
