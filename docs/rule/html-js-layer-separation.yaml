# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: html-js-layer-separation
kind: rule
name: レイヤー分離 UI / State / API
description: UI・State・API のレイヤー分離と、呼び出しの方向を定める。
tags:
  - name: scope:html
  - name: topic:js
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      | レイヤー | 役割                                                      |
      | -------- | --------------------------------------------------------- |
      | UI       | DOM アクセス・イベント・描画。state と api を import する |
      | State    | メモリ上の状態・派生計算。DOM を触らない                  |
      | API      | 通信。fetch ラッパー。DOM を触らない                      |
  - id: layer-separation-01
    group: レイヤー分離 UI / State / API
    name: 呼び出しは下方向のみ
    body: |-
      - 呼び出しは下方向のみ（UI → State → API）。
        - State と API は UI を import しない。
