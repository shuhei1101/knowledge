# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-backend-auth-action
kind: rule
name: app/(shared)/actions/auth.ts — 認証 Server Action
description: ログイン・サインアップ・ログアウトの認証 Server Action の配置・入力検証・結果・監査ログを定め、認証の Server Action を実装するときに読む。
tags:
  - name: scope:next
  - name: topic:backend
    main: true
status: current
visibility: internal
rev: 2
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      ログイン・サインアップ・ログアウトの Server Action 群。
  - id: auth-action-01
    group: app/(shared)/actions/auth.ts — 認証 Server Action
    name: use server と配置
    body: |-
      - ファイル冒頭に `'use server'`、配置は `app/(shared)/actions/auth.ts`（共通 action）
  - id: auth-action-02
    group: app/(shared)/actions/auth.ts — 認証 Server Action
    name: 入力は Zod でパース
    body: |-
      - 入力は Zod パース（LoginSchema / SignupSchema をファイル内に定義）
  - id: auth-action-03
    group: app/(shared)/actions/auth.ts — 認証 Server Action
    name: Better Auth API を使う
    body: |-
      - Better Auth API を使う: `auth.api.signInEmail` / `signUpEmail` / `signOut`（いずれも `headers: await headers()` を渡す）
  - id: auth-action-04
    group: app/(shared)/actions/auth.ts — 認証 Server Action
    name: 結果は ActionResult
    body: |-
      - 結果は `ActionResult<T>` 形式（`signOutAction` は redirect のみなので void 可）
  - id: auth-action-05
    group: app/(shared)/actions/auth.ts — 認証 Server Action
    name: 成功時の redirect
    body: |-
      - 成功時は `redirect(HOME_URL)` 等（redirect の扱いは [shared/エラーアクションハンドラー](id:next-shared-error-action-handler)）
  - id: auth-action-06
    group: app/(shared)/actions/auth.ts — 認証 Server Action
    name: ログイン試行の監査ログ
    body: |-
      - ログイン試行は監査ログとして記録（`action:auth` タグ）
