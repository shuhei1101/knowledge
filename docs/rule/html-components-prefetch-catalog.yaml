# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: html-components-prefetch-catalog
kind: rule
name: 共通層の先読み
description: 画面を実装する前に共通層を先読みして再利用する決まりを定め、単体 HTML の画面を実装し始めるときに読む。
tags:
  - name: scope:html
  - name: topic:components
  - name: topic:html
  - name: topic:画面
  - name: action:先読み
    main: true
  - name: action:実装
status: current
visibility: internal
rev: 3
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      対象: 単体 HTML
  - id: common-layer-prefetch-01
    group: 共通層の先読み
    name: 実装前に共通層を見る
    body: |-
      - 画面を実装する前に共通層を見て、再利用する。
  - id: common-layer-prefetch-02
    group: 共通層の先読み
    name: tokens.css の先読み
    body: |-
      1. `shared/css/tokens.css` — デザイントークン
  - id: common-layer-prefetch-03
    group: 共通層の先読み
    name: components の先読み
    body: |-
      2. `shared/components/` — 共通コンポーネント
  - id: common-layer-prefetch-04
    group: 共通層の先読み
    name: core の先読み
    body: |-
      3. `shared/core/` — ルート・定数
  - id: common-layer-prefetch-05
    group: 共通層の先読み
    name: 既存コンポーネントの再利用
    body: |-
      - 必要なコンポーネントが既にあれば import / 参照する。
        - 汎用的だが無ければ共通層に追加してから使う。
        - 画面モジュールにトースト・ダイアログ等をインライン再実装しない。
