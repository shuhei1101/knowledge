id: html-tooling-tsc
kind: rule
name: tsc 運用（バニラ TS + FastAPI）
description: tsc が生成する js の出力先、設定ファイル、scripts、gitignore の運用を定め、単体 HTML で TypeScript のビルド設定を作る・修正するときに読む。
