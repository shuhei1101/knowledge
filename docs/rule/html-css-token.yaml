# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: html-css-token
kind: rule
name: デザイントークン
description: デザイン値を :root の Custom Properties に集約するデザイントークンの決まりを定める。
tags:
  - name: scope:html
  - name: topic:css
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: design-token-01
    group: デザイントークン
    name: ":root に集約する"
    body: |-
      - 全デザイン値は `:root` の Custom Properties に集約する。 
        - 16 進カラー・px 値・フォントスタックをハードコードせず `var(--token)` 経由で参照する。
  - id: design-token-02
    group: デザイントークン
    name: 3 ティアで持つ
    body: |-
      - 3 ティアで持つ:
        - プリミティブ 生の値（`--blue-500: oklch(...)`）
        - セマンティック 用途（`--color-bg` `--color-text` `--color-primary` `--color-border`）
        - 派生 セマンティックから生成（hover / subtle / border など）
  - id: design-token-03
    group: デザイントークン
    name: 派生色の作り方
    body: |-
      - 派生色は `color-mix(in oklab, ...)` か相対カラー（`oklch(from var(--x) ...)`）で作る。
  - id: design-token-04
    group: デザイントークン
    name: "@property での登録"
    body: |-
      - アニメーションさせる / 型を固めるトークンは `@property` で登録する（`syntax` と `inherits` は必須。`syntax` が `*` 以外なら `initial-value` も必須）。
  - id: design-token-05
    group: デザイントークン
    name: ライトとダークの両対応
    body: |-
      - ライトとダークの両方に対応する。
        - 片方だけにするのは、デザイン方針（`設計書/デザイン方針.md`）の明暗に理由を書いたときだけ。
