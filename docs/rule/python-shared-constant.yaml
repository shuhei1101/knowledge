# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: python-shared-constant
kind: rule
name: shared/constants.py — 計算済み定数
description: shared/constants.py に配置する計算済み定数の範囲と記載方法、固定の選択肢の表し方を定め、Python に定数を追加する・配置先を決めるときに参照する。
aliases:
  - shared/定数
tags:
  - name: scope:python
  - name: topic:api
  - name: topic:naming
  - name: topic:プロジェクト
  - name: topic:リテラル
  - name: topic:型ヒント
  - name: topic:定数
    main: true
  - name: action:定義
  - name: action:計算
status: current
visibility: internal
rev: 6
last_reviewed: '2026-10-30'
items:
  - id: overview
    name: 概要
    body: |-
      計算済みの不変値だけを配置する。
      env で切り替える値は [shared/設定](id:python-shared-settings)。
      配置先の判断は [設定値の置き場所](id:flowchart-config-location) に従う。

      `constants.py` には、構造から計算されるパス（`PROJECT_ROOT` / `LOG_DIR`）を配置する。
      業務固定値（`MAX_TAGS_PER_POST` / `DEFAULT_PAGE_SIZE`）も配置する。
      feature 専用の定数・業務 Enum は feature の `types.py` に配置する。
  - id: writing-01
    group: 記載方法
    name: 定数の命名と型注釈
    body: |-
      - `UPPER_SNAKE_CASE` + 型注釈必須 + 説明 docstring
  - id: writing-02
    group: 記載方法
    name: PROJECT_ROOT の定義
    body: |-
      - `PROJECT_ROOT: Path = Path(__file__).resolve().parents[2]` のように 1 度だけ計算（カレントディレクトリ非依存、同じパス計算を散在させない）
  - id: writing-03
    group: 記載方法
    name: 巨大な dict は定数にしない
    body: |-
      - 巨大な dict（プロンプト等）は constants でなくファイル / config に
  - id: fixed-choices-01
    group: 固定の選択肢
    name: 固定の選択肢は API に出るなら StrEnum、それ以外は Literal
    body: |-
      API に出る選択肢は `StrEnum`（[fastapi/スキーマ](id:python-fastapi-schema)）。
      それ以外は `Literal` を基本に（`type Status = Literal["draft", "published", "archived"]`）。
      `StrEnum` はライブラリが要求するときだけ。
