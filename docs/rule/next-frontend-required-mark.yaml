# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-frontend-required-mark
kind: rule
name: "`<RequiredMark />` — 必須フィールド表示"
description: 必須フィールドを示す RequiredMark の配置と対象を定める。
tags:
  - name: scope:next
  - name: topic:frontend
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: required-mark-01
    group: "`<RequiredMark />` — 必須フィールド表示"
    name: FieldLabel の直後に配置
    body: |-
      - `<FieldLabel>` の子要素として配置（直後）
  - id: required-mark-02
    group: "`<RequiredMark />` — 必須フィールド表示"
    name: 必須フィールドにだけ付ける
    body: |-
      - Zod で必須にしているフィールドに必ず付ける（任意フィールドには付けない）
  - id: required-mark-03
    group: "`<RequiredMark />` — 必須フィールド表示"
    name: text-destructive のアスタリスク
    body: |-
      - `text-destructive` の `*`
