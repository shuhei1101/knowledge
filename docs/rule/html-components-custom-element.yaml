    body: |-
      対象: 単体 HTML
  - id: custom-element-01
    group: カスタムエレメント
    name: Light DOM の custom element
    body: |-
      - 共通 UI は Light DOM の autonomous custom element で作る。
        - Shadow DOM は使わない（既存のグローバル CSS とデザイントークンをそのまま効かせるため）。
        - セットアップは `connectedCallback` で（constructor ではなく）。移動で再度呼ばれるため、中身は 1 回だけ組む。
        - 中身は `innerHTML` か `<template>` のクローンで組む。
        - 属性で見た目・状態を切り替え、`attributeChangedCallback` で反映（`observedAttributes` に列挙）。
