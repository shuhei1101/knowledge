# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: ui-input-wording
kind: rule
name: 入力と文言
description: 入力・送信・エラー・通知の振る舞いと、画面に出す言葉（語・操作の語・状態名・空の表示）を定める。
tags:
  - name: scope:ui
    main: true
status: current
visibility: internal
rev: 2
last_reviewed: '2026-10-24'
related:
  - to: convention-writing-style
    type: requires
    when: 語の選び方の一般の決まりを確かめるとき
