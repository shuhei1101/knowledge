items:
  - id: overview
    name: 概要
    body: |-
      対象: 共通（単体 HTML・React）
      入力・送信・エラー・通知の振る舞いと、画面に出す言葉。
      画面の状態をどこに保持するか。
      出典の略号は I = Impeccable、V = Vercel Web Interface Guidelines、GOV = GOV.UK Design System、C = IBM Carbon Design System、MS = Microsoft Japanese Localization Style Guide、SH = SmartHR Design System、BK = 公用文作成の考え方、APG = WAI-ARIA Authoring Practices Guide、TR = TanStack Router、MDN = MDN Web Docs、WD = web.dev、NN = Nielsen Norman Group、BY = Baymard Institute、OW = OWASP（リンクはメタデータの `sources`）。
  - id: input-submit-01
    group: 入力と送信
    name: 入力と送信の決まり
    body: |-
      | 要素 | 出典 |
      | --- | --- |
      | ラベルは常に見せる。入力欄の中の例示文をラベルの代わりにしない | V / I |
      | 入力し終える前にエラーを出さない（1 文字ごとに検証しない） | GOV |
      | 送信中は二重送信を防ぎ、処理中であることを見せる | V / I |
      | 押せない理由が画面から読み取れないボタンを無効にしない。理由を近くに書くか、押したときに理由を示す | GOV |
      | 取り返しのつかない操作には確認か取り消し猶予を置く。安全に戻せるなら確認より取り消しを選ぶ | V / I |
  - id: error-notification-01
    group: エラーと通知
    name: エラーと通知の決まり
    body: |-
      | 要素 | 出典 |
      | --- | --- |
      | エラーは原因の近くに、何が起きたかと修正方法を書く。入力内容は削除しない | V / I |
      | 検証エラーが出たら、フォームの先頭にエラーの一覧を出し、各項目へのリンクを付けてフォーカスを移す。一覧と各項目の文言を揃える | GOV |
      | 対応が要る通知（エラー・警告）は関係する場所に置き、自動で閉じない。自動で閉じる通知は短い完了の知らせに限り、後から見返せる場所を用意する | C |
      | 通知に置く操作は 1 つにする | C |
  - id: wording-01
    group: 文言
    name: 文言の決まり
    body: |-
      | 要素 | 出典 |
      | --- | --- |
      | ボタンは起きることを動詞で書く（「OK」ではなく「Issue 作成」）。確認のボタンも操作名にする | V / I |
      | 同じ概念は最後まで同じ言葉で呼ぶ（「公開」の結果は「公開しました」） | I |
      | 内部の用語やエラーコードを主なメッセージにしない | I |
      | 見れば分かるものにラベルを付けない（切り替えの部品の前の「ビュー:」等） | - |
      | 文言は識別子より意味を先に書く（「v3.0.0（現在）」ではなく「現在（v3.0.0）」） | - |
  - id: wording-term-format-01
    group: 文言 > 語と書式
    name: 用語の選び方の参照
    body: |-
      用語の選び方の一般の決まりは規約 [文章の書き方](id:convention-writing-style) の `## 用語の選び方` に従う。
      ここは画面に固有の型を決める。
  - id: wording-term-format-02
    group: 文言 > 語と書式
    name: 語と書式の決まり
    body: |-
      | 要素 | 出典 |
      | --- | --- |
      | 一般の Web アプリと同じ形式的な語にする。やわらかさを狙った言い換えをしない（「直す」ではなく「修正」、「消す」ではなく「削除」）。長い文言は短くする（「選んだ n 件をコピー」ではなく「選択 n 件コピー」） | MS / SH |
      | 品詞を揃える。タブ・列名・見出し・状態は名詞、ボタンは操作語、説明文は敬体で述語まで書く | SH |
      | ボタンの漢語は「する」を省き、目的語の後ろの「を」も省く（追加・権限追加）。画面タイトルは名詞にする（権限の追加） | SH / - |
      | トグルは、ラベルを変えないチェックボックスかスイッチにする（状態によって「表示」と「非表示」を切り替えるボタンにしない） | APG |
      | エラーのメッセージは「〜できませんでした」「〜が見つかりません」で終える。意思の確認は「〜しますか?」にする（「〜してもよろしいですか?」にしない） | MS |
      | 長音は語末の -er / -or / -ar / -y に付ける（ユーザー・サーバー・メモリー） | BK |
  - id: wording-operation-01
    group: 文言 > 操作の語
    name: 操作の語の案内
    body: |-
      ボタンやメニューの操作は、次の語に揃える。
  - id: wording-operation-02
    group: 文言 > 操作の語
    name: 操作の語の対応表
    body: |-
      <!-- table: data -->

      | 英語 | 使う語 | 避ける語・注意 |
      | --- | --- | --- |
      | Cancel | キャンセル | 実行済みは「取り消し」、実行中は「中断」 |
      | Save | 保存 | - |
      | Submit / Send | 送信 | 送る。申請は「提出」 |
      | Add / Create | 追加 | 足す。作成・登録は内容に合うときだけ |
      | Delete / Remove | 削除 | 消す |
      | Erase / Clear | 消去・クリア・解除 | 削除との混同 |
      | Edit | 編集 | 直す |
      | Change / Modify | 変更 | 編集との混用。誤りの訂正は「修正」 |
      | Update / Refresh | 更新 | 画面の再取得は「再読み込み」 |
      | Close | 閉じる | - |
      | Back | 戻る | 「一覧に戻る」のように戻り先を添える |
      | Next | 次へ | 次 |
      | Done / Finish | 完了 | - |
      | Continue | 続行 | - |
      | Apply | 適用 | - |
      | Confirm | 確認 | ヘルプの閲覧は「参照」 |
      | Search | 検索 | - |
      | Settings | 設定 | - |
      | Copy / Duplicate | コピー（クリップボード）・複製（データ） | 写し |
      | Share | 共有 | - |
      | Download / Upload | ダウンロード・アップロード | - |
      | Import / Export | インポート・エクスポート | - |
      | Retry | ボタンは「再試行」、文は「もう一度お試しください」 | 文中の「再試行してください」 |
      | Undo / Paste / Select all | 元に戻す・貼り付け・すべて選択 | - |
      | Sign in | サインイン | 1 つの製品でログインと混ぜない |
      | Allow / Deny | 許可・拒否 | - |
      | Question / Answer | 質問・回答 | 問い・答え |
      | Mark / Flag | フラグ・〜アイコン | 印 |

      <!-- /table -->
  - id: wording-status-pattern-01
    group: 文言 > 状態名の型
    name: 状態名の型の案内
    body: |-
      状態名は次の型に当てはめる。
  - id: wording-status-pattern-02
    group: 文言 > 状態名の型
    name: 状態名の型の表
    body: |-
      | パターン | 使うとき | 例 |
      | --- | --- | --- |
      | 未〇〇 | 始まっていない | 未着手・未対応 |
      | 〇〇中 | 進行している | 対応中・確認中 |
      | 〇〇待ち | 他者の入力や作業を待っている | 確認待ち・返信待ち |
      | 〇〇済み | その作業が終わった | 対応済み・確認済み |
      | 完了 | 全体が終わった | 完了 |
      | 要〇〇 | 人の対応が要る | 要確認・要対応 |
  - id: wording-empty-pattern-01
    group: 文言 > 空の表示の型
    name: 空の表示の型
    body: |-
      | 場所 | パターン | 例 |
      | --- | --- | --- |
      | 一覧 | 〇〇はありません。 | タスクはありません。 |
      | 検索の 0 件 | 該当する〇〇はありません。別の条件を試してください。 | 該当するタスクはありません。別の条件を試してください。 |
      | 項目の値の欄 | なし か — | なし |
  - id: state-retention-01
    group: 状態の保持
    name: 状態の保持
    body: |-
      保持先の判定は判定フローチャート [画面の状態の保持先](id:flowchart-screen-state-retention) で行う。

      | 保持するもの | 置き場所 | 出典 |
      | --- | --- | --- |
      | 共有したいもの（タブ・ビュー・絞り込み・並べ替え） | URL | - |
      | 端末ごとの好み（列の表示・密度） | localStorage（最初の描画で要るなら Cookie） | - |
      | 1 回の作業中だけのもの（入力途中の下書き） | sessionStorage | - |
      | 戻る・進むで戻すページ全体のスクロール位置 | ルーターの機能（履歴の項目ごと） | TR |
      | ページの中のスクロール領域（一覧・詳細パネル・タブの中身）の位置 | sessionStorage（領域ごとのキー） | TR |
      | そのタブで別の画面からリンクで入り直したときに戻したいもの（最後のタブ・絞り込み） | sessionStorage。URL に値があれば URL を優先し、sessionStorage の値を使用したら URL に `replace` で書き戻す | - |
      | 機密（トークン・個人情報） | URL と Web Storage に配置しない | OW |
      | 保存ビュー | サーバー（画面が書き込みの経路を持たないときは localStorage） | - |
  - id: state-retention-02
    group: 状態の保持
    name: 未保存のまま離れるときの警告
    body: |-
      未保存の入力があるまま画面を離れるときは警告する（V）。
  - id: scroll-restoration-01
    group: 状態の保持
    name: スクロール位置とタブの切り替え
    body: |-
      <!-- table: data -->

      | 対象 | 決まり | 出典 |
      | --- | --- | --- |
      | ページ全体 | ルーターの機能で履歴の項目ごとに保存して復元する。戻る・進むでは戻し、リンクで新しく入ったときは一番上から表示する | TR |
      | ページの中のスクロール領域（一覧・詳細パネル・タブの中身） | 領域ごとに固定のキーを付けて保存して復元する。中身が変わる領域は、キーに項目の ID とタブを含める（例: `detail:{itemId}:{tab}`） | TR |
      | タブの中のスクロール位置 | タブの値を含むキーで保存し、切り替える前に保存して、表示した後に戻す | - |
      | 保存する時期 | 移動の前・タブを切り替える前・`pagehide`。スクロールのたびに書き込むときは間引く | TR / WD |
      | 復元する時期 | データを描画した後 | TR |
      | 戻さないもの | 中身が大きく変わった一覧と、時間が経ってから戻った一覧は戻さず、一番上から表示する | NN |
      | しないこと | `history.scrollRestoration` を自分で変更しない（ルーターが管理する）。`unload` を使用しない。スクロール位置を URL に出さない | MDN / WD |
      | 履歴に追加する単位 | 絞り込み・並べ替えの変更と、オーバーレイを開く操作は履歴に 1 つ追加し、戻るで 1 つずつ戻す | BY |

      <!-- /table -->
