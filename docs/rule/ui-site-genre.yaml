items:
  - id: overview
    name: 概要
    body: |-
      対象: 共通（単体 HTML・React）
      サイトのジャンルごとの雰囲気の例。

      方向を探るための例で、採用を決めるものではない。
      候補の出し分けに使い、例をそのまま組み合わせて確定しない。
  - id: site-genre-01
    group: サイトのジャンル
    name: ジャンル別の雰囲気の例
    body: |-
      <!-- table: data -->

      | 分類 | ジャンル | 雰囲気のことば | モチーフ・装飾の例 | 色・文字の例 | UI 要素の味付けの例 |
      | --- | --- | --- | --- | --- | --- |
      | 学び | 音楽・レッスン | 軽やか・リズム・温かい | 背景に薄い音符や五線、波形、鍵盤の白黒の帯 | 白地に深い青や臙脂、見出しに筆記体風 | 区切り線を五線に、進み具合を鍵盤に、押下で弾む |
      | 学び | オンライン講座 | 前向き・明快 | 幾何学の図形、手書きの矢印やマーカー線 | 明るい地に強い差し色 1 つ、太いゴシック | 見出しにマーカーを引く、番号を丸で囲む |
      | 学び | 子ども・子育て | 元気・安心・やわらか | クレヨン線、雲・星・動物のシルエット、紙の切り抜き | 原色やパステル、丸ゴシック | 大きな角丸、押せそうな立体、波形の区切り |
      | 趣味 | 園芸・菜園 | 素朴・季節・育つ | 葉・蔓・種の線画、土や紙の質感、水彩のにじみ | セージ・生成り・テラコッタ、手書き風の見出し | 見出しに葉、区切りを蔓の線に、カードを種袋や植物ラベル風に |
      | 趣味 | アウトドア | 無骨・開放・土の匂い | 等高線、地図の記号、木目・キャンバス地、スタンプ風 | 森の緑・土の茶・差し色のオレンジ、ステンシル風の文字 | タグやワッペン風のラベル、ロープ状の区切り |
      | 趣味 | スポーツ | 躍動・勝負・速さ | 斜めの帯、スピード線、コートやフィールドの線 | チームの色、高いコントラスト、斜体の太字 | 斜めに切った角、スコアボード風の数字、背番号風の大きな数字 |
      | 趣味 | 料理・レシピ | おいしそう・家庭的 | 布巾のチェック柄、手書きの調理器具、紙の質感 | 暖色（トマト・からし・小麦）、柔らかい明朝か丸ゴシック | レシピカード風のカード、マスキングテープ風のラベル |
      | 趣味 | 旅行 | 遠く・発見・記録 | 切手・消印・航空便の縞、地図の破線、ポラロイド風の枠 | 空と海の青、日焼けした紙の色 | 写真に白枠と傾き、破線の道のりで区切る |
      | 趣味 | ペット | 愛らしい・のんびり | 足あと、骨・毛糸玉、肉球の形 | 暖かいパステル、丸ゴシック | 肉球形のバッジ、ふわっと膨らむホバー |
      | 文化 | 本・書評 | 静か・知的・紙 | 紙の地、しおり、蔵書印、罫線 | 生成り地に墨色、本文は明朝 | 柱や章番号の意匠、しおり形のタグ |
      | 文化 | アニメ・漫画 | 作品の世界観しだい | コマ割り、集中線、網点、吹き出し、書き文字の効果音 | 作品の色、英字を添える | 吹き出し形のツールチップ、コマ枠のカード、網点の影 |
      | 文化 | ゲーム紹介 | 没入・壮大・期待 | 世界観の背景画、光の粒、紋章 | 暗い地に差し色、題字は世界観の書体 | メニュー画面風のナビ、選択中をカーソル記号で示す |
      | 文化 | 2D ゲーム風 | 懐かしい・遊び心 | ドット絵、タイル状の背景、ハート・コイン | 限られた色数、見出しだけドット文字 | 太枠のウィンドウ、会話窓風の通知、▶ のカーソル、体力ゲージ風の進み具合 |
      | 文化 | 映画・音楽（作品） | 大胆・夜・余韻 | フィルムの縁、ノイズ、ポスター風の文字組み | 黒地に 1 色、細身か極太の文字 | 字幕風のキャプション、再生ボタン風の操作 |
      | 文化 | 写真・作品集 | 静けさ・余白 | 装飾を置かない | 白か黒の地、小さな文字 | 枠線なし、ホバーで題名だけが出る |
      | 文化 | 和・伝統 | 静謐・季節・余白 | 和紙の質感、青海波・麻の葉などの文様、落款風の印 | 生成り・墨・藍・朱、明朝や筆文字、縦書きの見出し | 印鑑風のバッジ、文様の細い帯で区切る |
      | 技術 | プログラミング | 理知的・手元の道具 | プロンプト記号、括弧、方眼 | 暗い灰か白、等幅を混ぜる | コードの字句風のタグ、見出しの前に `#` |
      | 暮らし | 医療・健康 | 清潔・穏やか・安心 | 柔らかい曲線、葉、水の輪 | 青・緑、広い余白 | 大きめの角丸、穏やかな影 |
      | 暮らし | 金融・士業 | 堅実・信頼 | 細い罫、紋章風の意匠 | 紺・灰・白、明朝の見出し | 控えめな角、線で区切る表 |
      | 暮らし | 飲食店・カフェ | 店の空気しだい | 黒板、手書きのメニュー、クラフト紙、湯気 | 店の素材の色（木・タイル・漆喰） | 黒板風の見出し、スタンプ風のバッジ |
      | 暮らし | ファッション・美容 | 洗練・余白 | 装飾は極少、細い線 | 白黒と 1 色、細いセリフ体 | 下線だけのボタン、ゆっくりした切り替え |
      | 暮らし | 地域・行政 | 誰でも・明快 | 装飾を置かない | 高いコントラスト、大きめの文字 | 太めのフォーカス枠、平らなボタン |
      | 仕事 | 業務・SaaS | [デザインスタイル](id:convention-design-style) の業務系のスタイルを参照 | - | - | - |

      <!-- /table -->
