# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: react-form-hook
kind: rule
name: use{Feature}Form
description: フォームの state の hook の置き場所と、defaultValues と values・reset・dirty 判定の決まりを定める。
tags:
  - name: scope:react
  - name: topic:frontend
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-30'
items:
  - id: overview
    name: 概要
    body: |-
      対象: React
  - id: use-form-hook-01
    group: hook
    name: hook の置き場所
    body: |-
      - 画面の `hooks/use-{feature}-form.ts` に置く。
  - id: use-form-hook-02
    group: hook
    name: defaultValues にサーバーの値を流す
    body: |-
      - `defaultValues` に、サーバーの値を流す。
  - id: use-form-hook-03
    group: hook
    name: 非同期の取得は values を使う
    body: |-
      - 非同期に取得した値は、`values` で渡す（変更で自動的に reset され、`isDirty` も正しく動く）。
  - id: use-form-hook-04
    group: hook
    name: hook にするのは必要なときだけ
    body: |-
      - hook にするのは、初期値の変換が重いときと、複数の箇所で使うときだけにする。
  - id: rules-01
    group: ルール
    name: Zod スキーマは form.ts から import する
    body: |-
      - Zod スキーマは、画面の `form.ts` から import する。
  - id: rules-02
    group: ルール
    name: 送信成功後の reset
    body: |-
      - 送信に成功したら、`form.reset(data)` で dirty を戻す。
  - id: rules-03
    group: ルール
    name: dirty の判定は isDirty
    body: |-
      - dirty の判定は `formState.isDirty` で行う。
        `JSON.stringify` で比較しない。
  - id: rules-04
    group: ルール
    name: defaultValues と values を併用しない
    body: |-
      - `defaultValues` と `values` を両方使わない。
