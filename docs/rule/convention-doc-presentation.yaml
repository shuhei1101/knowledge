# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: convention-doc-presentation
kind: rule
name: 表し方の優先順位
description: 人が読む文書・設計書の中身を図・表・箇条書き・文のどれで表すかの優先順位と、図・表・キーの表・箇条書きと文・ページの分け方・本文に出さないものの決まりを定め、文書・設計書を記載するときと文書を描くビュワーの変換を作るときに読む。
tags:
  - name: scope:規約
  - name: topic:表し方
    main: true
  - name: topic:優先順位
  - name: topic:文書
  - name: topic:設計書
  - name: topic:図
  - name: topic:フロー
