      <!-- /flow -->

      - ※1 フレームワークのコンポーネント: 部品の実装がブラウザで描かれるコンポーネント（`.tsx`・`.vue` など）で、ストーリーから直に import できる
      - ※2 サーバーのテンプレート: 部品の実装がサーバーで HTML を組み立てるマクロ・部分テンプレートで、ブラウザからは import できない
      - ※3 部品を描画するサーバー: 作業ブランチのコードで部品を引数つきで描画し、HTML の断片を返すサーバー
      - ※4 静的な部品の断片: 実装を持たない部品の状態 1 つを HTML 1 ファイル（`.storybook/fragments/{部品}/{案}.html`）で持ち、部品を描画するサーバーが返す
