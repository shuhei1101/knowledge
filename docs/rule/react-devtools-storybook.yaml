visibility: internal
rev: 7
last_reviewed: '2026-11-07'
sources:
  - title: Storybook のドキュメント
    url: https://storybook.js.org/docs
items:
  - id: overview
    name: 概要
    body: |-
      対象は React。
      shadcn/ui を拡張したコンポーネントのカタログを可視化し、デザインの確認・テスト・ドキュメント化を一元化する。
      構成は Storybook + `@storybook/react-vite` + Vitest 統合（バージョンは Storybook のドキュメント）。
  - id: storybook-01
    group: Storybook
    name: 共通コンポーネントの story
    body: |-
      - 共通コンポーネント（`shared/components/`）の `.stories.tsx` は、対象の横に配置する。
  - id: storybook-02
    group: Storybook
    name: 画面の部品は story を作らない
    body: |-
      - 画面の `components/` の部品は、story を作らない（E2E で確認する）。
        画面の本体の story は任意で、配置するときは `{screen}-screen.stories.tsx` にする。
  - id: storybook-03
    group: Storybook
    name: 状態のある部品は play 関数
    body: |-
      - 状態のあるコンポーネント（Dialog など）は、`play` 関数で操作する。
  - id: storybook-04
    group: Storybook
    name: addon-a11y の導入
    body: |-
      `addon-a11y` を入れると、各 story で axe-core の検査が走り、違反が UI に表示される。
      `addon-themes` で、全 story にテーマ切り替えのトグルを追加する。
      `@chromatic-com/storybook` で各 story を Chromatic にアップロードし、視覚回帰のテストにする。
  - id: storybook-05
    group: Storybook
    name: Category の表
    body: |-
      <!-- table: data -->

      | Category | 用途 |
      | --- | --- |
      | `Shared` | `shared/components/` のカスタム |
      | `Shared / UI` | `shared/components/ui/` の shadcn のコピー（必要なとき） |
      | `Patterns` | パターンの例（一覧画面風・編集画面風） |
      | `Forms` | フォームの例 |
      | `Pages` | ページ全体のスタブ（任意） |

      <!-- /table -->
  - id: storybook-06
    group: Storybook
    name: framework の選び方
    body: |-
      部品の仕組みから、Storybook の framework とストーリーの描き方を選ぶ。

      <!-- map: {"title": "Storybook の framework の選び方"} -->

      ```mermaid
      flowchart TB
        start(("部品を Storybook に掲載したい"))
        q1{"部品をブラウザのフレームワーク（React・Vue など）のコンポーネントで記載するか"}
        q2{"Next.js のアプリか"}
        r1(["@storybook/nextjs-vite"])
        r2(["そのフレームワークの framework（@storybook/react-vite・@storybook/vue3-vite など）"])
        q3{"部品をサーバーのテンプレート（Jinja2 のマクロなど）で描くか"}
        r3(["@storybook/server-webpack5 + 部品を描画するサーバー"])
        r4(["@storybook/server-webpack5 + 静的な部品の断片"])
        start --> q1
        q1 -->|YES| q2
        q2 -->|YES| r1
        q2 -->|NO| r2
        q1 -->|NO| q3
        q3 -->|YES| r3
        q3 -->|NO| r4
      ```

      <!-- map-data: {"version": 1, "notes": {"q1": {"annotations": ["storybook-n1"]}, "q3": {"annotations": ["storybook-n2"]}, "r3": {"annotations": ["storybook-n3"]}, "r4": {"annotations": ["storybook-n4"]}}} -->

      <!-- /map -->

      ※[storybook-n1]: フレームワークのコンポーネント: 部品の実装がブラウザで描かれるコンポーネント（`.tsx`・`.vue` など）で、ストーリーから直に import できる

      ※[storybook-n2]: サーバーのテンプレート: 部品の実装がサーバーで HTML を組み立てるマクロ・部分テンプレートで、ブラウザからは import できない

      ※[storybook-n3]: 部品を描画するサーバー: 作業ブランチのコードで部品を引数つきで描画し、HTML の断片を返却するサーバー

      ※[storybook-n4]: 静的な部品の断片: 実装を持たない部品の状態 1 つを HTML 1 ファイル（`.storybook/fragments/{部品}/{案}.html`）で持ち、部品を描画するサーバーが返却する