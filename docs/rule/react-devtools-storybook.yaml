# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: react-devtools-storybook
kind: rule
name: Storybook
description: shadcn/ui を拡張したコンポーネントのカタログを Storybook で可視化する決まりを定める。
tags:
  - name: scope:react
  - name: topic:devtools
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-30'
items:
  - id: overview
    name: 概要
    body: |-
      対象: React
      shadcn/ui を拡張したコンポーネントのカタログを可視化し、デザインの確認・テスト・ドキュメント化を一元化する。
      構成は Storybook + `@storybook/react-vite` + Vitest 統合（バージョンは [Storybook のドキュメント](https://storybook.js.org/docs)）。
  - id: storybook-01
    group: Storybook
    name: 共通コンポーネントの story
    body: |-
      - 共通コンポーネント（`shared/components/`）の `.stories.tsx` は、対象の横に置く。
  - id: storybook-02
    group: Storybook
    name: フィーチャ固有は story を作らない
    body: |-
      - 画面に固有のコンポーネントは、story を作らない（E2E で確認する）。
  - id: storybook-03
    group: Storybook
    name: 状態のある部品は play 関数
    body: |-
      - 状態のあるコンポーネント（Dialog など）は、`play` 関数で操作する。
  - id: storybook-04
    group: Storybook
    name: addon-a11y の導入
    body: |-
      `addon-a11y` を入れると、各 story で axe-core の検査が走り、違反が UI に表示される。
      `addon-themes` で、全 story にテーマ切り替えのトグルを追加する。
      `@chromatic-com/storybook` で各 story を Chromatic にアップロードし、視覚回帰のテストにする。
  - id: storybook-05
    group: Storybook
    name: Category の表
    body: |-
      | Category | 用途 |
      | --- | --- |
      | `Shared` | `shared/components/` のカスタム |
      | `Shared / UI` | `shared/components/ui/` の shadcn のコピー（必要なとき） |
      | `Patterns` | パターンの例（一覧画面風・編集画面風） |
      | `Forms` | フォームの例 |
      | `Pages` | ページ全体のスタブ（任意） |
