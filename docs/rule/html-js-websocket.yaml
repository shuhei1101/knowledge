id: html-js-websocket
kind: rule
name: WebSocket
description: WebSocket クライアントの実装方法と、再接続・URL の組み立てを定める。
tags:
  - name: scope:html
  - name: topic:js
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: websocket-01
    group: WebSocket
    name: WsClient を EventTarget で実装
    body: |-
      - `class WsClient extends EventTarget` で実装し、購読側は `addEventListener` で受ける。
  - id: websocket-02
    group: WebSocket
    name: ジッター付きの指数バックオフ
    body: |-
      - 再接続はジッター付きの指数バックオフ。URL は `createWsUrl()` 経由（ハードコードしない）。
