# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: claude-mcp-docs-server
kind: rule
name: 文書の MCP サーバーの設計
description: 文書の MCP（dev-docs）のサーバーとツールの単位・mdmark と YAML の役割の分担・読み取りと差分と関連のツール・検索の手段を定め、文書の MCP のツールを作る・修正するときに参照する。
tags:
  - name: scope:claude
  - name: tool:mcp
  - name: tool:dev-docs
  - name: tool:mdmark
  - name: topic:文書
    main: true
  - name: topic:ツール
  - name: topic:差分
  - name: topic:ビュー
  - name: topic:用語
  - name: topic:エイリアス
  - name: topic:関連
  - name: action:読み取り
  - name: action:検索
  - name: action:取得
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-05'
related: []
sources:
  - title: 'Anthropic: Writing effective tools for agents'
    url: https://www.anthropic.com/engineering/writing-tools-for-agents
  - title: Google AIP-157
    url: https://google.aip.dev/157
    note: view
items:
  - id: overview
    name: 概要
    body: |-
      文書を配信する MCP サーバー（dev-docs）のサーバーとツールの決まり。
      MCP サーバー全般の決まりは [MCP サーバー作成ルール](id:claude-mcp) に従う。
  - id: server-tool-unit-01
    group: サーバーとツールの単位
    name: 文書の MCP のサーバーは dev-docs の 1 つ
    body: '- 文書の MCP のサーバーは dev-docs の 1 つにし、配信元ごとに分けない（`## 登録`）'
  - id: server-tool-unit-02
    group: サーバーとツールの単位
    name: ツールは操作で分ける
    body: |-
      - ツールは操作（検索・取得・書き込み・差分・スキーマの取得）で分け、文書の種類は `kind` の enum 引数で指す
        種類ごとのツールを作らない
  - id: server-tool-unit-03
    group: サーバーとツールの単位
    name: kind ごとのハンドラー
    body: '- 種類ごとの違い（スキーマ・独自の検査・返却する形式・読み書きの場所）は、サーバーの中で `kind` ごとのハンドラーに振り分ける'
  - id: server-tool-unit-04
    group: サーバーとツールの単位
    name: 別ツールにする操作
    body: |-
      - 操作の意味が種類に固有のものと、削除など rule-inject や権限で止めたい操作だけ、別のツールにする
        - 記録を探すのではなく、ID などから今の状態を計算して返却する取得（例: キャラクターの今の状態）
        - 種類ごとに中身と検査が違う、業務のデータの追記（例: ノードが記載する行動の選択肢）
      - 記録を探して参照するツール（コメント・ログ・ノウハウなど）は、文書でなくても `search` と ID で取るツールにまとめる
  - id: mdmark-yaml-role-01
    group: mdmark と YAML の原本・MCP の役割の分担
    name: YAML は各プロジェクト、MCP は dev-docs
    body: '- YAML の原本・スキーマ・検査と変換のスクリプトは各プロジェクトが持ち、MCP と開発ドキュメントサーバーは dev-docs が持つ'
  - id: mdmark-yaml-role-02
    group: mdmark と YAML の原本・MCP の役割の分担
    name: mdmark の役割
    body: |-
      - mdmark は Markdown の記法と共通スタイルの描画だけを受け持ち、YAML を参照しない
        用語集の表の印など Markdown の機能は mdmark に残す
  - id: mdmark-yaml-role-03
    group: mdmark と YAML の原本・MCP の役割の分担
    name: YAML から Markdown への変換
    body: '- 配信するときは、各プロジェクトのスクリプトが YAML を mdmark の記法の Markdown に変換し、mdmark で描く'
  - id: mdmark-yaml-role-04
    group: mdmark と YAML の原本・MCP の役割の分担
    name: mdmark と YAML の非依存
    body: '- mdmark と YAML の原本・MCP は互いに依存せず、使用する側のプロジェクトが両方を取り入れる'
  - id: read-tool-01
    group: 読み取りのツール
    name: search 1 つにまとめる
    body: '- 種類ごとの `list_*` を作らず、絞り込みの引数を持つ `search` 1 つにまとめる'
  - id: read-tool-03
    group: 読み取りのツール
    name: view と include の指定
    body: "- `view`（`brief` / `standard` / `full`）で返却する量を選べ、`include` / `exclude`（項目名の enum の配列）で追加・除外できるようにする。\n  既定は `search` が `brief`、1 件を取るツールが `standard`。\n  省いた項目は `omitted` で返却し、取り方を添える"
  - id: read-tool-04
    group: 読み取りのツール
    name: brief の返却する項目
    body: "- `search` の `brief` は各行に ID・名前・概要文・タグ・文字数・バージョンを返却し、中身は ID を受けるツールが返却する。\n  結果の先頭に総件数と、該当した全件の合計文字数を返却する"
  - id: read-tool-05
    group: 読み取りのツール
    name: 切り詰め時の案内
    body: '- 切り詰めたときは、`total` と返却した件数に加えて、絞り込める引数を案内する'
  - id: read-tool-06
    group: 読み取りのツール
    name: 引数なし search の結果
    body: '- 引数なしの `search` は、既定件数の先頭ページ・`brief`・タグごとの件数・総件数・`next_cursor` を返却する'
  - id: read-tool-07
    group: 読み取りのツール
    name: count_only
    body: |-
      - `search` に任意の `count_only` を持たせ、一覧を返却せずに総件数・合計文字数・タグごとの件数だけを返却できるようにする。
        手順で先に呼ぶことは強制せず、エージェントがヒットの多さを確認して絞り込むときに使用する
  - id: read-tool-08
    group: 読み取りのツール
    name: 主題タグの優先
    body: '- タグの絞り込みは、主題のタグ（`main`）が一致した文書を上に並べる'
  - id: read-tool-09
    group: 読み取りのツール
    name: ids による複数取得
    body: |-
      - 1 件を取るツールは `ids` の配列で複数を受け、指定した順に返却する。
        合計が 50,000 文字を超えるときは 1 件も返却せず、分けて呼ぶよう返却する（Claude Code は 50,000 文字を超える結果をファイルに退避する）。
        見つからない ID があれば全体を失敗にし、近い ID を添える
  - id: read-tool-10
    group: 読み取りのツール
    name: 長い文書の分割取得
    body: '- 長い文書は、セクションごとの行範囲・文字数・ハッシュを返却するツールを配置し、セクションを指定して取得させる'
  - id: read-tool-11
    group: 読み取りのツール
    name: 返却形式
    body: |-
      - 一覧は Markdown の表（各行に ID と名前）で返却する。
        1 件の本文は Markdown（文書ごとに `<document>` で包む。`read-tool-19`）、YAML が原本の項目は YAML のまま返却する。
        参照は ID と名前・概要文まで結合し、相手の本文は結合しない
  - id: read-tool-19
    group: 読み取りのツール
    name: 文書ごとの場所と範囲
    body: |-
      - 本文を返却するときは、文書ごとに場所（文書のファイルの絶対パスか URL）と範囲（`full`・`section`・`summary`）を記載する
        - markdown は文書ごとに `<document path="..." scope="...">` で包み、json は各項目に `path`・`scope` を持たせる
        - `full` は全文を返却したときだけ付ける。
          `section` はセクションを指定した取得（`read-tool-10`）、`summary` は `view` が `brief` など説明だけを返却したとき（`read-tool-03`）に付ける
        - 記載方法の詳細は rule-inject の [MCPの結果の書式](https://github.com/shuhei1101/rule-inject/blob/develop/docs/guide/MCP%E3%81%AE%E7%B5%90%E6%9E%9C%E3%81%AE%E6%9B%B8%E5%BC%8F.md) に従う
  - id: read-tool-12
    group: 読み取りのツール
    name: 用語・エイリアスの一覧付与
    body: |-
      - 本文に出る用語・エイリアスは、本文を変えずに末尾へ一覧（単語と ID）を付ける。
        単語の名前と概要文を検索するツールを配置する
  - id: read-tool-13
    group: 読み取りのツール
    name: 用語照合ツール
    body: |-
      - 用語・エイリアスの照合に使用する単語の一覧（単語・正規化した単語・ID・種類・概要・関連する文書）を返却するツールを配置する。
        指定したバージョンから変わっていなければ、変わっていないことだけを返却する。
        mod が使用するので、`format` の既定は `json` にする
  - id: diff-tool-01
    group: 差分のツール
    name: 既読時点の記録
    body: |-
      - サーバーがエージェントの既読時点を記録し、`changes_since_read` で前回から変わった項目・キー・変更前の値の一覧を返却する
        エージェントにバージョンを持たせない
  - id: diff-tool-02
    group: 差分のツール
    name: 区間の差分一覧
    body: |-
      - 区間（`from`・`to`）で追加・変更・削除された文書の一覧を返却するツールを配置する
        区間を自分で指すときは、`changes_since_read` ではなくこのツールを使用する
        `include_diff` で文書ごとの差分も返却する
  - id: diff-tool-03
    group: 差分のツール
    name: from・to の指定
    body: |-
      - `from`・`to` は git の commit・日時・ブランチ・タグのどれでも受け、サーバーが commit に解決する。
        日時はその時点の最後の commit にする。
        解決した commit と日時を結果の先頭に返却する
  - id: diff-tool-04
    group: 差分のツール
    name: 差分モード
    body: |-
      - 1 件を取るツールに差分モード（`diff_from`・`diff_to`・`context_lines`、既定 3）を持たせ、git と同じ `+`・`-` の行で返却する
        `rev` だけの変化は出さず、参照の ID には名前を添える
        `format: json` のときは、変わったキーごとの変更前後の値と、本文の変わった行の配列を返却する
  - id: diff-tool-05
    group: 差分のツール
    name: 変更通知に頼らない
    body: |-
      - MCP の変更通知（resources の購読）には頼らない
        Claude Code は購読せず、通知はモデルに届かない
  - id: search-method-01
    group: 検索の手段
    name: 検索の基本手段
    body: |-
      - 検索はタグ・メタデータ・キーワード（正規化）を基本にする
        ベクトル検索は必須にせず、ライブラリも指定しない
  - id: search-method-02
    group: 検索の手段
    name: 言い換えの探索
    body: '- 言い換えや関連の探索は、安いモデルのサブエージェントに検索のツールを使用させる'
  - id: search-method-03
    group: 検索の手段
    name: ベクトル検索の追加
    body: |-
      - ベクトル検索を追加するときは DB サーバーを起動せず、埋め込みはメモリか Git の外のキャッシュに配置する
        YAML と Git には入れない
  - id: relation-impact-tool-01
    group: 関連と影響範囲のツール
    name: 骨組みのツール
    body: '- 全文書の ID・種類・概要文を返却する骨組みのツールを配置する'
  - id: relation-impact-tool-02
    group: 関連と影響範囲のツール
    name: 関連をたどるツール
    body: '- ID を起点に関連・コード参照をたどり、影響する文書を理由つきで返却するツールを配置する'
  - id: relation-impact-tool-03
    group: 関連と影響範囲のツール
    name: 関連候補の記録
    body: |-
      - 関連の候補は、同じコミットの変更・同じ会話の編集・同じ会話の閲覧を分けて記録し、上位 3 件を概要文つきで出す。
        採用されたものだけ文書の関連に記載する
  - id: relation-impact-tool-04
    group: 関連と影響範囲のツール
    name: Issue の対応範囲の特定
    body: '- Issue の対応範囲は、骨組み → 用語集で言い換えたキーワードの検索 → 関連・コード参照のたどり → 変更の種類ごとのチェックリスト → 人の確認、の順で決める'
  - id: registration-03
    group: 登録
    name: 文書の MCP の配り方
    body: |-
      - 文書の MCP は、dev-docs のプラグインが配る
        利用者は、ユーザースコープで入れる
  - id: registration-04
    group: 登録
    name: 文書の MCP のプラグイン
    body: '- 各リポジトリは、文書の MCP のプラグインとマーケットプレイスを持たない'
  - id: registration-05
    group: 登録
    name: 文書の MCP の接続先
    body: '- 文書の MCP の接続先は dev-docs のサーバーの 1 つで、配信元はツールの引数 `source` で指す'
