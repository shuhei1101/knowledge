# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: claude-hook
kind: rule
name: フック作成ガイド
description: フックをスクリプトとして作る決まり、PreToolUse のフックの出力に記載する permissionDecision と、Bash コマンドを一度だけ止めるワンタイムトークンの使用方法を定め、Claude Code のフックを作る・修正するときに参照する。
tags:
  - name: scope:claude
  - name: topic:naming
  - name: topic:スクリプト
  - name: topic:ガイド
  - name: topic:コマンド
  - name: topic:コンテキスト
  - name: topic:セッション
  - name: topic:トークン
  - name: topic:フック
    main: true
  - name: topic:ブロック
  - name: topic:ワンタイムトークン
  - name: topic:上限
  - name: topic:設定
  - name: tool:bash
  - name: tool:claude
  - name: tool:claude-code
  - name: tool:mcp
  - name: action:作成
  - name: topic:権限
  - name: action:出力
status: current
visibility: internal
rev: 10
last_reviewed: '2026-11-12'
sources:
  - title: "Claude Code: Hooks reference"
    url: https://code.claude.com/docs/en/hooks
items:
  - id: rules-01
    group: ルール
    name: settings.json に直接記載しない
    body: |-
      - settings.json内にインラインで記載しないでください。
        - フックの定義とスクリプトの配置方法は、[フックフォルダの構成](id:claude-plugin#hook-folder-01) に従う
        - プロンプトファイルはプラグインのルートの `content/prompts/` の YAML（[プロンプトファイル](id:prompt-file)）
  - id: rules-02
    group: ルール
    name: 注入文の書き分けと書き方
    body: |-
      - hooksの`additionalContext`でコンテキストを注入する文の中身・長さは [注入文の書き分けと書き方](id:claude-context-placement) に従う
  - id: rules-03
    group: ルール
    name: 1 セッション 1 回の決まり
    body: |-
      - 文脈を注入するときは、[MCP サーバー作成ルール](id:claude-mcp) の 1 セッション 1 回の決まりに従う
  - id: rules-04
    group: ルール
    name: MCP に届かないときは何も追加しない
    body: |-
      - 文脈を追加するために MCP を呼んで届かないときは、何も追加せず、何も出力せずに終了コード 0 で終える。
  - id: one-time-token-block-01
    group: ワンタイムトークン付き条件ブロック
    name: ワンタイムトークンの用途
    body: |-
      - PreToolUseなどで特定のBashコマンドを一度だけ防ぐときの方法
  - id: one-time-token-block-02
    group: ワンタイムトークン付き条件ブロック
    name: ワンタイムトークンの使いどころ
    body: |-
      - 例えば、Push時に一度だけ確認させたい場合等に使用する
        - 「確認 → 通過 → 確認 → 通過」を交互に繰り返す。
        - トークンなし時 → トークン作成 → ブロック（確認表示）
        - トークンあり時 → トークン削除（消費）→ 通過
  - id: one-time-token-block-03
    group: ワンタイムトークン付き条件ブロック
    name: トークン命名規約
    body: |-
      - トークン命名規約:
        - フックごとに一意のトークンファイル名を使用する。
        - トークン名に `session_id` を含める。
  - id: pretooluse-output-01
    group: PreToolUse の出力
    name: permissionDecision の記載
    body: |-
      PreToolUse のフックが JSON を出力するときは、`hookSpecificOutput` に `hookEventName` と `permissionDecision` を記載する。
      許可・拒否を判断せずに文脈を加えるときは除く（`pretooluse-output-02`）。
      `permissionDecision` の値は `allow`・`deny`・`ask`・`defer` のどれか。
      `updatedInput` を返却するときは `permissionDecision` を省略しない。

      ```json
      {
        "hookSpecificOutput": {
          "hookEventName": "PreToolUse",
          "permissionDecision": "allow",
          "updatedInput": { "command": "..." }
        }
      }
      ```
  - id: pretooluse-output-02
    group: PreToolUse の出力
    name: permissionDecision の選び方
    body: |-
      <!-- table: data -->

      | フックの処理 | 出力 |
      | --- | --- |
      | 自分の MCP のツールの入力に値を追加するだけ | `permissionDecision: allow` |
      | 利用者に確認させる | `permissionDecision: ask` |
      | 呼び出しを止める | `permissionDecision: deny` と、理由を `permissionDecisionReason` |
      | 許可・拒否を判断せずに文脈を加える | `permissionDecision` を記載せず、`hookEventName` と `additionalContext` だけを出力する |
      | 許可・拒否を判断しない | 出力なしで終了コード 0 |

      <!-- /table -->

      `allow` にしても、設定の `deny`・`ask` のルールは評価される。
  - id: pretooluse-output-03
    group: PreToolUse の出力
    name: 最上位の decision を使用しない
    body: PreToolUse では、最上位の `decision`・`reason` を使用しない。
