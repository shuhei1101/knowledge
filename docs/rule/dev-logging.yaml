id: dev-logging
kind: rule
name: ログのレベルと記載方法
description: 言語に依らないログのレベルの定義・観点ごとに出すログとレベル・出してはいけないデータとイベント名や例外の記録の記載方法を定め、ログを出す箇所とレベルを決めるときや言語ごとのロガーの規約を作るときに参照する。
