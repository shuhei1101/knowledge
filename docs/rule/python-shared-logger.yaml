# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: python-shared-logger
kind: rule
name: JSON Lines 構造化ログ
description: JSON Lines の構造化ログで出力する実装の要点・レベル運用・記載方法と、OpenTelemetry・request_id・trace_id の付与方法を定め、Python でログを出力する・ロガーを設定するときに参照する。
inject_when:
  field: text
  op: contains
  values:
    - Python
    - '.py'
    - pytest
    - FastAPI
    - Pydantic
tags:
  - name: scope:python
  - name: topic:ascii
  - name: topic:id
  - name: tool:json
  - name: topic:トレース
  - name: topic:フォーマッタ
  - name: topic:モジュール
  - name: topic:ループ
  - name: topic:ロガー
  - name: topic:ログ
    main: true
  - name: topic:変数
  - name: topic:引数
  - name: topic:構造
  - name: topic:標準入出力
  - name: topic:環境
  - name: topic:環境変数
  - name: topic:設定
  - name: tool:opentelemetry
  - name: action:デバッグ
  - name: action:出力
  - name: action:反映
  - name: action:実装
  - name: action:抑制
  - name: action:運用
  - name: action:集計
status: current
visibility: internal
rev: 5
last_reviewed: '2026-10-30'
items:
  - id: overview
    name: 概要
    body: |-
      出力は JSON Lines（1 行 1 JSON）で集計・grep・dashboard 連携を見据える。
  - id: logger-implementation-01
    group: 標準実装の要点（`shared/logger.py`）
    name: JsonLinesFormatter の出力項目
    body: |-
      - `JsonLinesFormatter(logging.Formatter)`: `{ ts, level, name, msg }` に `extra={...}` のフィールドを取り込む。
        LogRecord の予約キーは除外する。
        `exc_info` は `exc` に入れる
  - id: logger-implementation-02
    group: 標準実装の要点（`shared/logger.py`）
    name: ensure_ascii の指定
    body: |-
      - `json.dumps(..., ensure_ascii=False, default=str)`
  - id: logger-implementation-03
    group: 標準実装の要点（`shared/logger.py`）
    name: root logger の設定は 1 度だけ
    body: |-
      - root logger はプロセスで 1 度だけ設定（フラグで二重登録防止）、stdout へ
  - id: logger-implementation-04
    group: 標準実装の要点（`shared/logger.py`）
    name: モジュールごとの get_logger
    body: |-
      - 各モジュールは `logger = get_logger(__name__)`（出力の name でどこから出たか即わかる）
  - id: logger-implementation-05
    group: 標準実装の要点（`shared/logger.py`）
    name: レベルは Settings から反映
    body: |-
      - レベルは `Settings.log_level` から main で反映。
        本番 INFO、開発 DEBUG
  - id: level-usage-01
    group: レベル運用
    name: ログレベルの運用表
    body: |-
      レベルの判定は規約 [ログのレベルと記載方法](id:dev-logging#level-01) に従う。
      共通のレベルと `logging` のレベル名の対応は次のとおり。

      | 共通のレベル | `logging` のレベル |
      | --- | --- |
      | DEBUG | debug |
      | INFO | info |
      | WARN | warning |
      | ERROR | error |
      | FATAL | critical |
  - id: writing-01
    group: 記載方法
    name: 集計用の構造化引数
    body: |-
      - 集計に使用するものは構造化引数（`extra={"provider": ..., "tokens": ...}`）
  - id: writing-04
    group: 記載方法
    name: ループ内の debug の抑制
    body: |-
      - ループ内の大量 debug は本番で INFO 以上に抑制
  - id: observability-01
    group: 観測
    name: OpenTelemetry は環境変数で有効にする
    body: |-
      - FastAPI 組み込みの OpenTelemetry は環境変数 `FASTAPI_OTEL_AUTO_CONFIGURE` で有効にする（送信先の collector が無いときは無効のまま）
  - id: observability-02
    group: 観測
    name: request_id と trace_id をログに記載する
    body: |-
      - `request_id` と `trace_id` は `contextvars` に持ち、`JsonLinesFormatter` が各行に記載する
  - id: output-destination-01
    group: 出力先
    name: 出力先は stdout
    body: |-
      開発 / Docker / serverless とも stdout のまま。
      単発スクリプトのファイル保存はランチャー（bat / sh）側で tee。
related:
  - to: dev-logging
    type: references
    when: ログのレベル・出すログ・出してはいけないデータを決めるとき
