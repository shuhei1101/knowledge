# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: dev-docs-navigation
kind: rule
name: 開発ドキュメントのナビゲーション
description: 開発ドキュメントサーバー（dev-docs）の画面のタブの並びと数・サイドバーのグループ・目次を並べない決まりを定め、配信の設定（project-index.yaml の nav）を記載・修正するときに参照する。
tags:
  - name: scope:dev
  - name: topic:ナビゲーション
    main: true
  - name: topic:タブ
  - name: topic:サイドバー
  - name: topic:グループ
  - name: topic:設計書
  - name: topic:設定
  - name: tool:dev-docs
  - name: tool:project-index
  - name: action:配置
  - name: action:配信
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-17'
sources:
  - title: "Mintlify: Navigation best practices"
    url: https://www.mintlify.com/docs/guides/navigation
    note: 最上位は 7 件以下。2 階層より下に隠さない
  - title: "Docker docs: hugo.yaml"
    url: https://raw.githubusercontent.com/docker/docs/main/hugo.yaml
    note: 最上位のメニューは Get started・Guides・Manuals・Reference の順
  - title: "GitLab: Global navigation"
    url: https://docs.gitlab.com/development/documentation/site_architecture/global_nav/
    note: 上の階層は利用者の作業で分け、その下を機能の名前で分ける
  - title: "Nielsen Norman Group: Alphabetical Sorting Must (Mostly) Die"
    url: https://www.nngroup.com/articles/alphabetical-sorting-must-mostly-die/
    note: アルファベット順は名前を知っている項目を探す一覧に限る
  - title: "Docusaurus: Autogenerated sidebar"
    url: https://docusaurus.io/docs/sidebar/autogenerated
    note: 自動の並びはファイル名の順で、順は明示して指定する
  - title: "project-index: 設定"
    url: https://github.com/shuhei1101/project-index/blob/develop/docs/guide/%E8%A8%AD%E5%AE%9A.md
    note: nav の tabs・group・page・auto（group_by・filter）
items:
  - id: overview
    name: 概要
    body: |-
      dev-docs の画面のタブとサイドバーの構成（`project-index.yaml` の `nav`）の決まり。
      `nav` のキーは project-index の [設定](https://github.com/shuhei1101/project-index/blob/develop/docs/guide/%E8%A8%AD%E5%AE%9A.md) の `### nav` を参照する。
  - id: tab-01
    group: タブ
    name: タブの並び
    body: |-
      - `nav.tabs[]` に、入口になるものを左に、参照用の資料を右にして、次の順で並べる。
        配信元に無いタブは飛ばす

      <!-- table: {"kind": "data"} -->

      | 順 | タブ | 入れる文書 |
      | --- | --- | --- |
      | 1 | はじめに | 概要・コアコンセプト・変更履歴 |
      | 2 | 使い方 | 利用者向けの手順（`guide` など） |
      | 3 | 設計書 | アーキテクチャ図・非機能要件・シナリオ・インターフェース定義・モジュール構成などの設計書 |
      | 4 | 規約 | 規約・テンプレート・判定フローチャート・判定表・チェックシート |
      | 5 | コード | ソースコード・スクリプトの `files.yaml` の行 |
      | 6 | リファレンス | コマンド・API・設定のキーの一覧 |
      | 7 | 用語集 | 用語集（`terms` など） |

      <!-- /table -->

      - `nav` を省いて、文書の行ごとのタブに任せない
  - id: tab-02
    group: タブ
    name: タブの数
    body: |-
      - タブは 7 件以下にする
      - 設計書の種類ごとにタブを作らず、タブ「設計書」1 つにまとめ、種類をサイドバーのグループにする（`auto` の `group_by: kind`、または種類ごとの `group`）
  - id: sidebar-01
    group: サイドバー
    name: グループでまとめる
    body: |-
      - タブの中の文書は、`group` か `auto.group_by` でグループにまとめる
      - 上の階層は利用者の作業か機能の単位で分け、その下に文書を並べる
      - 1 つのグループの直下が 7 件を超えたら、グループに分ける
      - 入れ子は 2 階層までにする
      - ページの分け方とサイドバーのまとめ方は [表し方の優先順位](id:convention-doc-presentation#page-split-01) に従う
  - id: sidebar-02
    group: サイドバー
    name: グループの中の並び
    body: |-
      - グループの中は、手順の順か重要さの順に並べる
      - 名前の順は、名前を知っている文書を探す一覧（規約の一覧・用語集など）だけにする
      - `auto` の並びが手順や重要さの順と違うときは、`page` を並べて順を指定する
  - id: index-01
    group: 目次
    name: 目次を並べない
    body: |-
      - フォルダの目次（`kind: index`）は、タブとサイドバーに並べない
      - `auto` には、`filter` に `not`（`kind` が `index`）を記載して目次を除く。
        `group_by: '@folder'` は各フォルダの `index.yaml` を先頭に並べるので、同じ `filter` を記載する
