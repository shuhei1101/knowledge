# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-frontend-page-header
kind: rule
name: "`<PageHeader>` — ページタイトル + actions"
description: ページタイトルとアクションを表示する PageHeader の Props と使い方を定める。
tags:
  - name: scope:next
  - name: topic:frontend
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: page-header-01
    group: "`<PageHeader>` — ページタイトル + actions"
    name: Props
    body: |-
      - Props: `title`, `description?`, `actions?`
  - id: page-header-02
    group: "`<PageHeader>` — ページタイトル + actions"
    name: title は h1
    body: |-
      - `title` は `<h1>`（a11y / SEO）
  - id: page-header-03
    group: "`<PageHeader>` — ページタイトル + actions"
    name: 1 Screen に 1 つ
    body: |-
      - 1 Screen に 1 つ
  - id: page-header-04
    group: "`<PageHeader>` — ページタイトル + actions"
    name: actions のリンクは URL 定数
    body: |-
      - actions のリンクは URL 定数経由
