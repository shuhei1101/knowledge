  - name: topic:html
  - name: topic:シェル
  - name: topic:チェックリスト
  - name: topic:ドロワー
  - name: topic:ビューポート
  - name: topic:ブレークポイント
  - name: topic:モバイル
    main: true
  - name: topic:レイアウト
  - name: topic:画面
  - name: topic:落とし穴
  - name: topic:責務
  - name: action:切り替え
  - name: action:集約
status: current
visibility: internal
rev: 3
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      対象: 単体 HTML
  - id: basic-policy-01
    group: 基本方針
    name: ブレークポイントは 768px 単一
    body: |-
      - ブレークポイントは [レイアウト](id:ui-layout) の `md`（48rem）単一にする。タブレット中間は設けない。
        - 新しく作る画面は `min-width` で広げる。既存のデスクトップ向けの画面は `@media (max-width: 48rem)` で足してよい。
  - id: basic-policy-02
    group: 基本方針
    name: スマホ対応は screen.css の末尾
    body: |-
      - スマホ対応は各画面の `screen.css` 末尾に `@media` ブロックを追加するだけで完結させる。
        - 新規 CSS / TS / HTML ファイルは作らない（`screen.mobile.css` 等は禁止）
        - サブディレクトリ（`_mobile/` 等）も作らない
  - id: basic-policy-03
    group: 基本方針
    name: DOM 切替は screen.ts 内で
    body: |-
      - DOM 構造の切替が本当に必要な画面のみ `screen.ts` 内で関数を増やす。別ファイルに切り出さない。
  - id: basic-policy-04
    group: 基本方針
    name: デスクトップのレイアウトを維持
    body: |-
      - デスクトップレイアウトはピクセル単位で維持。`@media` の外側を触らない。
  - id: basic-policy-05
    group: 基本方針
    name: 横幅不足で縦積みになる問題
    body: |-
      - モバイル時に横幅が足りず、文字が縦積みになる問題
        - まず、横スクロールに対応して解消する。（ただし、画面全体の横スクロール化は禁止。一部分のみなら可）
        - 次に、文字列の変更。例えば、モバイル時のみ絵文字だけにするとか、文字量を減らすとか
        - 縦積みになっていないかをテストすること
  - id: shell-responsibility-01
    group: 共通シェル（`frontend/shared/`）の責務
    name: 共通シェルでドロワー化
    body: |-
      - ヘッダー・サイドバー・ドロワー化は `app-shell` / `app-sidebar` / `layout.css` に集中させる。
        - 各画面でハンバーガーやスクリムを個別実装しない
  - id: shell-responsibility-02
    group: 共通シェル（`frontend/shared/`）の責務
    name: サイドバーのドロワー化
    body: |-
      - サイドバーはスマホ時に `position: fixed` + `transform` でドロワー化。
        - スクリム・ESC で閉じる・フォーカストラップ・開時 `<body>` の `overflow: hidden` をシェル側で持つ
        - 閉時のサイドバーは `inert` で操作不可にする
  - id: shell-responsibility-03
    group: 共通シェル（`frontend/shared/`）の責務
    name: z-index は tokens.css に集約
    body: |-
      - z-index は `tokens.css` に集約し、ドロワー / モーダルの重なりを一元管理する。
  - id: out-of-scope-screen-01
    group: 対象外画面
    name: 透過画面は対象外
    body: |-
      - 他のアプリへ埋め込む透過画面（`<style>` で `html, body { background: transparent }` を宣言、または `app-shell` 不使用の透過全画面）はモバイル対応スコープ外。
  - id: pitfall-viewport-03
    group: 落とし穴チェックリスト > ビューポート・高さ
    name: viewport meta の集約
    body: |-
      - viewport meta は `templates/_layout.html` に集約。各画面 HTML で再宣言しない
