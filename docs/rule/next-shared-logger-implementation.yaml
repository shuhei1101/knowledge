# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-shared-logger-implementation
kind: rule
name: logger.ts — JSON Lines ロガー
description: サーバー・クライアント両用の JSON Lines ロガーの仕様と、ctx の書き方を定める。
tags:
  - name: scope:next
  - name: topic:shared
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: logger-ts-jsonl-01
    group: logger.ts — JSON Lines ロガー
    name: JSON Lines の出力
    body: |-
      - サーバー / クライアント両用、出力は JSON Lines（1 行 = 1 JSON、装飾なし）
  - id: logger-ts-jsonl-02
    group: logger.ts — JSON Lines ロガー
    name: レコードの形式
    body: |-
      - レコード形式: `{ ts, level, component?, msg, ctx? }`
  - id: logger-ts-jsonl-03
    group: logger.ts — JSON Lines ロガー
    name: logger と logger.create
    body: |-
      - `logger`（デフォルト）/ `logger.create("tag")`（component 付き）を使う。`console.log` は使わない
  - id: logger-ts-jsonl-04
    group: logger.ts — JSON Lines ロガー
    name: ログレベル
    body: |-
      - レベル: debug / info / warn / error
        - `NEXT_PUBLIC_LOG_LEVEL` で設定、dev は `localStorage.setItem("log.level", ...)` で動的変更可
        - production のクライアント側は warn 以上に強制クランプ
  - id: ctx-writing-01
    group: ctx の書き方
    name: ctx で構造化する
    body: |-
      - 文字列補間せず `ctx` で構造化（`log.info("registered", { id })`）
  - id: ctx-writing-02
    group: ctx の書き方
    name: Error を直接入れない
    body: |-
      - Error オブジェクトを直接入れない→ `e.message` を取り出す。stack は 500 系のみ
  - id: ctx-writing-03
    group: ctx の書き方
    name: ctx に含めてはいけないもの
    body: |-
      - 含めてはいけないもの: パスワード / トークン / API key / セッション ID / フルメールアドレス / カード番号 / PII
