id: python-testing-fixture
kind: rule
name: Factory-as-Fixture パターン（DB リソース準備の推奨形）
description: DB リソースを準備する fixture を関数を返す Factory-as-Fixture の方式で作る決まりと、アプリの fixture の作り方を定め、Python のテストで DB リソースを準備する fixture を作るときに読む。
tags:
  - name: scope:python
  - name: topic:testing
  - name: topic:db
  - name: topic:アプリ
  - name: topic:セットアップ
  - name: topic:ハードコード
  - name: topic:パターン
  - name: topic:ファクトリ
  - name: topic:ファクトリフィクスチャ
  - name: topic:フィクスチャ
    main: true
  - name: topic:リソース
  - name: topic:引数
  - name: topic:責務
  - name: topic:関数
  - name: action:クリーンアップ
  - name: action:依存
  - name: action:起動
  - name: action:追跡
status: current
visibility: internal
rev: 5
last_reviewed: '2026-10-30'
items:
  - id: overview
    name: 概要
    body: |-
      シナリオテスト等で「複数インスタンスを作りたい」「引数付きでリソースを作りたい」ケースは、fixture が関数を返す構造にする。
      値を返す fixture で名前をハードコードする（`user_a` 等）のは避ける。
  - id: factory-as-fixture-01
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: fixture は 1 責務
    body: |-
      - 1 fixture = 1 責務（`user_factory` / `profile_factory` / `task_factory` を分けて conftest.py に並置）
  - id: factory-as-fixture-02
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: 依存は引数で明示
    body: |-
      - 依存はテスト本体で引数として明示（`profile_factory(user_a)` の書式）
  - id: factory-as-fixture-03
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: cleanup の自動追跡
    body: |-
      - cleanup は fixture 内で自動追跡し、`yield` の後で作成順の逆順に delete を回す

      ```python
      @pytest.fixture
      def user_factory():
          created = []
          def _create(name, role="user"):
              u = create_user(name=name, role=role)
              created.append(u)
              return u
          yield _create
          for u in reversed(created):
              delete_user(u.id)
      ```
  - id: factory-as-fixture-04
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: god setup の禁止
    body: |-
      - アンチパターン: `setup_all_scenario_x()` のような god setup で全リソース作らない（単一責務を保つ）
  - id: factory-as-fixture-05
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: 名前のハードコード禁止
    body: |-
      - アンチパターン: fixture 内で名前ハードコード（`user_a` 等）→ 常に factory を返す構造にする
  - id: factory-as-fixture-06
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: 手動 cleanup の禁止
    body: |-
      - アンチパターン: `try/finally` で手動 cleanup を書く → fixture の `yield` に任せる
  - id: app-fixture-01
    group: アプリの fixture
    name: LifespanManager で起動する
    body: |-
      - アプリの fixture は `build_fastapi(handlers=...)` を `LifespanManager` で起動して返す（lifespan もテストされる）
  - id: app-fixture-02
    group: アプリの fixture
    name: AsyncClient で叩く
    body: |-
      - クライアントの fixture は `AsyncClient(transport=ASGITransport(app=app))`。同期の `TestClient` は使わない
