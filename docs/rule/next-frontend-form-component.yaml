# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-frontend-form-component
kind: rule
name: "`<Controller>` + `<Field>` パターン"
description: react-hook-form・Zod・shadcn/ui で Controller と Field を組み合わせる標準パターンを定める。
tags:
  - name: scope:next
  - name: topic:frontend
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      react-hook-form + Zod + shadcn/ui の標準組み合わせ。
  - id: structure-01
    group: 構造
    name: form 構造
    body: |-
      `<form onSubmit={form.handleSubmit(onSubmit)}>` → `<Controller>` の `render` → `<Field>` → `<FieldLabel>` + 入力部品 + `<FieldError>`
  - id: structure-02
    group: 構造
    name: register を直接使わない
    body: |-
      - `register` 直接使用禁止（`<Controller render={({ field, fieldState }) => ...}>` を使う）
  - id: structure-03
    group: 構造
    name: エラー状態は fieldState.invalid
    body: |-
      - エラーの状態は `fieldState.invalid` を `<Field>` の `data-invalid` と入力部品の `aria-invalid` へ渡して出す
  - id: structure-04
    group: 構造
    name: htmlFor と id を揃える
    body: |-
      - `<FieldLabel>` の `htmlFor` と入力部品の `id` を揃える
  - id: input-type-points-01
    group: 入力タイプ別ポイント
    name: 入力タイプ別ポイントの表
    body: |-
      <!-- table: data -->

      | 型 | ポイント |
      |---|---|
      | Text / Textarea | `{...field}` でそのまま渡す |
      | Number | `onChange` で `Number()` 変換、空文字→ `null` |
      | Select | `value` を `toString()`、`onValueChange` で `Number()` 変換 |
      | Switch | `checked={field.value} onCheckedChange={field.onChange}` |
      | Tag | `<TagInput value={field.value} onChange={field.onChange}>` |
      | Date | `<Calendar>` + `<Popover>` 組み合わせ |

      <!-- /table -->
  - id: rules-01
    group: ルール
    name: 必須フィールドの RequiredMark
    body: |-
      - 必須フィールドには `<FieldLabel>` 内に `<RequiredMark />`
