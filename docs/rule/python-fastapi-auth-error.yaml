# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: python-fastapi-auth-error
kind: rule
name: 認証と例外ハンドラ
description: FastAPI の認証パターン、SecretStr の扱い、例外ハンドラの決まりを定め、FastAPI に認証やエラー応答を実装するときに参照する。
aliases:
  - fastapi/認証とエラー
inject_when:
  field: text
  op: contains
  values:
    - Python
    - '.py'
    - pytest
    - FastAPI
    - Pydantic
tags:
  - name: scope:python
  - name: tool:fastapi
  - name: topic:api
  - name: topic:エラー
  - name: topic:シークレット
  - name: topic:スコープ
  - name: topic:ハンドラ
  - name: topic:パターン
  - name: topic:ログ
  - name: topic:例外
  - name: topic:例外ハンドラ
    main: true
  - name: action:参照
  - name: action:検証
  - name: action:登録
  - name: action:認証
status: current
visibility: internal
rev: 7
last_reviewed: '2026-10-30'
sources:
  - title: "RFC 9457: Problem Details for HTTP APIs"
    url: https://www.rfc-editor.org/rfc/rfc9457.html
items:
  - id: auth-pattern-01
    group: 認証パターン
    name: Bearer 認証
    body: |-
      - Bearer: `server/auth.py` の `verify_token` を型エイリアス `Auth` にする。
        定義は `Auth = Annotated[AuthContext, Depends(verify_token)]`。
        `verify_token` は Header から検証し、`AuthContext` dataclass を返却する
  - id: auth-pattern-02
    group: 認証パターン
    name: API Key 認証
    body: |-
      - API Key: `x-api-key` ヘッダを `settings.api_key.get_secret_value()` と比較
  - id: auth-pattern-03
    group: 認証パターン
    name: Scope 検証
    body: |-
      - Scope 検証: `require_scope(scope)` の Depends ファクトリで `ForbiddenError`
  - id: auth-pattern-04
    group: 認証パターン
    name: 失敗時は UnauthorizedError
    body: |-
      - 失敗時は `UnauthorizedError` を raise（HTTPException 直 raise しない）
  - id: secret-str-01
    group: SecretStr
    name: SecretStr の扱いの参照
    body: |-
      - `SecretStr` の扱いは [shared/設定](id:python-shared-settings)
  - id: secret-str-02
    group: SecretStr
    name: 認証失敗のログレベル
    body: |-
      - 認証失敗のログのレベルは、規約 [ログのレベルと記載方法](id:dev-logging#viewpoint-01) のセキュリティの行に従う（warning）
  - id: exception-handler-01
    group: 例外ハンドラ
    name: 例外ハンドラの登録と対応表
    body: |-
      `server/error_handlers.py` の `register_exception_handlers(app)` で、例外階層を一括で HTTP にマップする。

      <!-- table: data -->

      | 例外                      | HTTP                          |
      | ------------------------- | ----------------------------- |
      | `InvalidInputError`       | 400                           |
      | `UnauthorizedError`       | 401                           |
      | `ForbiddenError`          | 403                           |
      | `NotFoundError`           | 404                           |
      | `ConflictError`           | 409                           |
      | `AppError`                | 500                           |
      | `IntegrationError`        | 502                           |
      | `LlmRateLimitError`       | 503（Retry-After 付き）       |
      | `LlmServerError`          | 503（Retry-After 付き）       |
      | `IntegrationTimeoutError` | 504                           |

      <!-- /table -->

      例外から HTTP へのマップはこの表だけに配置し、ほかのルールは参照だけにする。

      Retry-After は、`retry_after` 属性を持つ `LlmRateLimitError` ではその値にする。
      属性を持たない `LlmServerError` では [llm/例外とリトライ](id:python-llm-exception-retry#stamina-retry-01) の `wait_max` の値にする。
      上流の 5xx からの回復を待つ間隔として、同じ例外へのリトライのバックオフの上限を使用する。
  - id: exception-handler-02
    group: 例外ハンドラ
    name: 500 系はログに出す
    body: |-
      - 500 / 502 系はハンドラ内で `logger.exception`
  - id: exception-handler-03
    group: 例外ハンドラ
    name: RFC 9457 形式のレスポンス
    body: |-
      - レスポンスは RFC 9457 の Problem Details（`application/problem+json`）に統一する。
        メンバーは `type` / `title` / `status` / `detail`、拡張メンバーは `code` / `request_id`
  - id: exception-handler-04
    group: 例外ハンドラ
    name: RequestValidationError のカスタム
    body: |-
      - Pydantic の `RequestValidationError`（422）も `register_exception_handlers(app)` で ProblemDetail に統一する
