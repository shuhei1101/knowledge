# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: python-fastapi-auth-error
kind: rule
name: 認証と例外ハンドラ
description: FastAPI の認証パターン、SecretStr の扱い、例外ハンドラの決まりを定める。
tags:
  - name: scope:python
  - name: topic:fastapi
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: auth-pattern-01
    group: 認証パターン
    name: Bearer 認証
    body: |-
      - Bearer: `server/auth.py` の `verify_token`（Header から検証 → `AuthContext` dataclass を返す）を `Auth = Annotated[AuthContext, Depends(verify_token)]` に型エイリアス化
  - id: auth-pattern-02
    group: 認証パターン
    name: API Key 認証
    body: |-
      - API Key: `x-api-key` ヘッダを `settings.api_key.get_secret_value()` と比較
  - id: auth-pattern-03
    group: 認証パターン
    name: Scope 検証
    body: |-
      - Scope 検証: `require_scope(scope)` の Depends ファクトリで `ForbiddenError`
  - id: auth-pattern-04
    group: 認証パターン
    name: 失敗時は UnauthorizedError
    body: |-
      - 失敗時は `UnauthorizedError` を raise（HTTPException 直 raise しない）
  - id: secret-str-01
    group: SecretStr
    name: SecretStr の扱いの参照
    body: |-
      - `SecretStr` の扱いは `shared/設定.md`
  - id: secret-str-02
    group: SecretStr
    name: 認証失敗のログレベル
    body: |-
      - 認証失敗のログは warning 程度にする
  - id: exception-handler-01
    group: 例外ハンドラ
    name: 例外ハンドラの登録と対応表
    body: |-
      `server/error_handlers.py` の `register_exception_handlers(app)` で例外階層を一括 HTTP マップ:

      <!-- table: data -->

      | 例外                      | HTTP                          |
      | ------------------------- | ----------------------------- |
      | `ValidationError`         | 400                           |
      | `UnauthorizedError`       | 401                           |
      | `ForbiddenError`          | 403                           |
      | `NotFoundError`           | 404                           |
      | `ConflictError`           | 409                           |
      | `LlmRateLimitError`       | 429（retry-after ヘッダ付与） |
      | `AppError`                | 500                           |
      | `IntegrationError`        | 502                           |
      | `IntegrationTimeoutError` | 504                           |

      <!-- /table -->
  - id: exception-handler-02
    group: 例外ハンドラ
    name: 500 系はログに出す
    body: |-
      - 500 / 502 系はハンドラ内で `logger.exception`
  - id: exception-handler-03
    group: 例外ハンドラ
    name: RFC 9457 形式のレスポンス
    body: |-
      - レスポンスは [RFC 9457](https://www.rfc-editor.org/rfc/rfc9457.html) の Problem Details（`application/problem+json`。`type` / `title` / `status` / `detail`、拡張メンバーに `code` / `request_id`）に統一する
  - id: exception-handler-04
    group: 例外ハンドラ
    name: RequestValidationError のカスタム
    body: |-
      - Pydantic の `RequestValidationError`（デフォルト 422）もカスタム可
