# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: claude-common
kind: rule
name: Claude 成果物の共通ルール
description: SKILL.md・ルール・CLAUDE.md の文章の確認、スクリプトの配置場所、メインエージェント・スキル・カスタムサブエージェントの違い、Claude Code を確認のために起動する方法を定め、これらの Claude 成果物を作る・修正するときと、Claude Code を確認のために起動するときに参照する。
tags:
  - name: scope:claude
  - name: topic:スクリプト
  - name: topic:エージェント
  - name: topic:サブエージェント
  - name: topic:スキル
  - name: topic:ルール
  - name: topic:文章
  - name: topic:本文
  - name: tool:claude
    main: true
  - name: action:仲介
  - name: action:入力
  - name: action:呼び出し
  - name: action:定義
  - name: action:配置
  - name: action:起動
  - name: action:認証
  - name: action:ログアウト
status: current
visibility: internal
rev: 6
last_reviewed: '2026-11-28'
items:
  - id: concise-writing-01
    group: 簡潔に記載する
    name: 文章の確認表への準拠
    body: |-
      - SKILL.md・ルール・CLAUDE.md を新規作成・編集するときは規約『文章の書き方』の確認表に従う。
  - id: sentence-style-01
    group: 文の記載方法
    name: 文の記載方法の良い例と悪い例
    body: |-
      いい例: 箇条書きのインデントで表現する。

      ```md
      - ブラウザに出す依存を増やさない。
        - フレームワーク（React/Vue）・状態管理ライブラリ・UI ライブラリは使わない
        - 外部依存がどうしても必要なときだけ vendoring する
        - dev ツール（tsc / eslint / vitest 等）は別
      ```

      悪い例: 横に長い。

      ```md
      ブラウザに出す依存を増やさない。フレームワーク（React/Vue）・状態管理ライブラリ・UI ライブラリは使わない。外部依存がどうしても必要なときだけ vendoring する。dev ツール（tsc / eslint / vitest 等）は別。
      ```
  - id: script-location-01
    group: スクリプトの配置場所
    name: スクリプトの配置先
    body: |-
      - フック・MCP サーバーが呼ぶスクリプトは `{pluginsルート}/scripts/{任意のカテゴリフォルダ}/` 配下に配置する。
        - スクリプトは機能ごとにフォルダを分けてください。
  - id: script-location-02
    group: スクリプトの配置場所
    name: スクリプト呼び出しの仲介
    body: |-
      - スキルの定型の処理は、スキルのフォルダの `scripts/` に配置して `${CLAUDE_SKILL_DIR}/scripts/{スクリプト}` で呼ぶ。
        フロントマターの `allowed-tools` で許可する。
        複数のスキルが使用する処理は、プラグインの `bin/` に配置する
      - MCP を仲介するのは、状態や並行を持つ処理か、rule-inject で止めたい操作だけ。
        トランスポートは規約『MCP サーバー作成ルール』に従う
  - id: main-agent-01
    group: メインエージェント / スキル / カスタムサブエージェントの関係 > メインエージェント
    name: メインエージェントの定義
    body: |-
      - ユーザーと直接対話する Claude 本体。
        会話履歴を保持する主コンテキスト。
  - id: skill-01
    group: メインエージェント / スキル / カスタムサブエージェントの関係 > スキル（`skills/**/SKILL.md`）
    name: スキルの位置づけ
    body: |-
      - メインエージェントと同じコンテキストで読み込まれるただのファイル（別プロセスではない）。
        `context: fork` を付けたスキルだけは、サブエージェントへプロンプトとして渡る。
  - id: skill-02
    group: メインエージェント / スキル / カスタムサブエージェントの関係 > スキル（`skills/**/SKILL.md`）
    name: スキルに戻り値は無い
    body: |-
      - `context: fork` なしのスキルに戻り値の概念はない。
        スキル内で調査 / 収集した情報はメインエージェントのコンテキストに直接残るので、「戻り値」を記載する必要はない。
  - id: skill-03
    group: メインエージェント / スキル / カスタムサブエージェントの関係 > スキル（`skills/**/SKILL.md`）
    name: スキルの入力
    body: |-
      - 入力は呼び出し時の引数（`$ARGUMENTS`、`arguments` フロントマターで宣言した `$issue_number` 等）のみ。
        それ以外は「メインエージェントが知っていること」を前提にして良い。
  - id: skill-04
    group: メインエージェント / スキル / カスタムサブエージェントの関係 > スキル（`skills/**/SKILL.md`）
    name: スキルの記述の禁止事項
    body: |-
      - 記載方法の禁止事項:
        - `## 戻り値` / `## 出力` セクションを作らない
        - 「このスキルは呼び出し元に〜を返却する」等の記述は記載しない
        - スキル内のステップは「メインエージェントが順番に実行する手順書」として記載する
  - id: custom-subagent-01
    group: メインエージェント / スキル / カスタムサブエージェントの関係 > カスタムサブエージェント（`agents/**/*.md`）
    name: カスタムサブエージェントの位置づけ
    body: |-
      - 別コンテキストで起動する独立プロセス。
        呼び出し元の会話履歴・スキル内容・他ファイル情報を持たない。
  - id: custom-subagent-02
    group: メインエージェント / スキル / カスタムサブエージェントの関係 > カスタムサブエージェント（`agents/**/*.md`）
    name: サブエージェントの情報源
    body: |-
      - 情報源は呼び出し時に指定された引数（入力）・CLAUDE.md の階層・`skills` フィールドで指定したスキルのみ。
        それ以外は知らない前提で記載する。
  - id: custom-subagent-03
    group: メインエージェント / スキル / カスタムサブエージェントの関係 > カスタムサブエージェント（`agents/**/*.md`）
    name: 呼び出し元を本文に記載しない
    body: |-
      - サブエージェント側は呼び出し元を知らないので、呼び出し元のスキル名やフェーズ名を本文に記載しないこと。
  - id: launch-auth-01
    group: Claude Code の起動
    name: 認証情報をコピーして起動しない
    body: |-
      - 認証領域（`~/.claude*`）の `.credentials.json` を別の場所へコピーして `claude` を起動しない。
        コピーした先で token が取り直されると、元の認証領域がログアウトする。
  - id: launch-auth-02
    group: Claude Code の起動
    name: 認証が要る確認の起動
    body: '- 認証が要る確認は、claude-balancer からアカウントを借りて起動する（`claude-balancer exec --client {名前} -- claude ...`）。'
  - id: launch-auth-03
    group: Claude Code の起動
    name: 認証の要らない確認の起動
    body: |-
      - 認証の要らない確認（プラグイン・スキル・フックの読み込み 等）は、認証情報を配置しない一時の認証領域で起動し、`--debug-file` に出力したログで確認する。
        一時の認証領域は、`CLAUDE_CONFIG_DIR` に空のフォルダを指定して作る。
