# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: react-component-confirm-dialog
kind: rule
name: "`useConfirmDialog()` — 確認ダイアログ"
description: window.confirm の代替である useConfirmDialog の使い方と Options を定め、削除などの確認ダイアログを実装するときに読む。
tags:
  - name: scope:react
  - name: topic:frontend
  - name: topic:アクション
  - name: topic:ダイアログ
    main: true
  - name: action:ラップ
  - name: action:削除
  - name: action:確認
status: current
visibility: internal
rev: 3
last_reviewed: '2026-10-30'
items:
  - id: overview
    name: 概要
    body: |-
      対象: React
      `window.confirm` の代替。`await confirm({ ... })` で `boolean` を返す。
  - id: use-confirm-dialog-01
    group: "`useConfirmDialog()` — 確認ダイアログ"
    name: ConfirmDialogProvider で wrap
    body: |-
      - `app/providers.tsx` で `<ConfirmDialogProvider>` を wrap する。
        `useConfirmDialog` は、Provider と同じファイルに export する。
  - id: use-confirm-dialog-02
    group: "`useConfirmDialog()` — 確認ダイアログ"
    name: 削除は確認必須
    body: |-
      - 削除は確認必須、登録・更新は不要
  - id: use-confirm-dialog-03
    group: "`useConfirmDialog()` — 確認ダイアログ"
    name: 破壊的アクションは destructive
    body: |-
      - 破壊的アクションは `variant: "destructive"`
  - id: options-01
    group: Options
    name: Options の項目
    body: |-
      `title`, `description?`, `confirmText?`, `cancelText?`, `variant?: "default" | "destructive"`
