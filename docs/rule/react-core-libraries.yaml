  - id: libraries-01
    group: 採用するライブラリ
    name: 用途別の表
    body: |-
      <!-- table: data -->

      | 用途 | ライブラリ | 備考 |
      | --- | --- | --- |
      | ビルド | Vite + React Compiler | [ビルド構成](id:react-core-build) |
      | ルーター | TanStack Router | URL の状態は `validateSearch` + Zod で持つ（[URL の状態](id:react-state-url-state)） |
      | サーバーのデータ | TanStack Query | [クエリ](id:react-data-query) |
      | クライアントの状態 | Zustand | [状態の置き場所](id:flowchart-react-state-placement)で決める |
      | フォーム | React Hook Form + Zod | [フォーム](id:react-form-component) |
      | API クライアント | orval | TanStack Query のフック・Zod・MSW のモックを生成する（[API クライアント](id:react-data-api-client)） |
      | UI 部品 | shadcn/ui（Base UI 版）+ Tailwind v4 | [コンポーネントカタログ](id:react-component-catalog)・[Tailwind](id:react-core-tailwind) |
      | 表 | TanStack Table v9 | shadcn の data-table のガイドで組む |
      | アイコン | lucide-react | 既定のアイコン |
      | ショートカット | `@tanstack/react-hotkeys` | 薄いフックをかぶせて使う（[ショートカット](id:react-keyboard-shortcut)） |
      | 単体・結合テスト | Vitest | [Unit / Component テスト](id:react-testing-unit) |
      | E2E テスト | Playwright | [E2E テスト](id:testing-core-e2e) |
      | カタログ・モック | Storybook + MSW | [Storybook](id:react-devtools-storybook)・[モック](id:react-devtools-mock) |

      <!-- /table -->
