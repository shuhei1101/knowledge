id: jinja2-template-writing
kind: rule
name: Jinja2 の記載方法
description: Jinja2 で記載した本文を Markdown として描いても行がつながらないように、制御の構文の配置を定め、Jinja2 のテンプレート・プロンプトの本文を記載するときに参照する。
