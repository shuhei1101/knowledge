# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: dev-paid-api-execution
kind: rule
name: 開発時の従量課金APIの実行
description: 開発中（動作確認・疎通確認・外部の疎通テスト 等）に従量課金の外部 API を実行するときの見積もり・確認の要否・記録を定め、従量課金の API を呼ぶ動作確認やテストを実行するときに参照する。
tags:
  - name: scope:dev
  - name: topic:料金
    main: true
  - name: topic:コスト
  - name: topic:単価
  - name: topic:api
  - name: topic:上限
  - name: topic:疎通テスト
  - name: action:計算
  - name: action:確認
  - name: action:記録
  - name: action:実行
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-07'
items:
  - id: overview
    name: 概要
    body: |-
      開発中（動作確認・疎通確認・外部の疎通テスト 等）に従量課金の外部 API を実行するときの、見積もり・確認の要否・記録。
  - id: execution-01
    group: 手順
    name: 見積もる
    body: |-
      - 外部 API の設計書の課金単価に、呼ぶ回数と入出力の量を掛け、1 回の実行（同じ確認で続けて呼ぶ分を含む）の合計を円で出す
      - 外貨の単価は、見積もる時点の為替で円に換算する
      - 設計書に課金単価が無ければ、公式の課金のページから参照して設計書へ記載してから見積もる
  - id: execution-02
    group: 手順
    name: 比べる
    body: |-
      - 確認せずに実行してよい 1 回の上限の金額と、月の上限の金額は、プロジェクトで決める
      - 月の上限を超えている間は、見積もりが 1 回の上限以下でもユーザーに確認してから実行する
      - 超えていないときは、見積もりが 1 回の上限以下なら、ユーザーへ確認せずに実行する
      - 見積もりが 1 回の上限を超えるとき・課金単価が分からず見積もれないときは、ユーザーに確認してから実行する
  - id: execution-03
    group: 手順
    name: 記録する
    body: |-
      - 実行したら、見積もりと実費の目安（実際に呼んだ回数・量に単価を掛けた額）を、その実行の記録（設計書の確認の記録・完了の報告）に記載する
      - 金額の大小を問わず、実行のたびに月の使用額の記録へ実費の目安を追加する
