# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: dev-tag-term-registration
kind: rule
name: タグと用語の登録
description: 文書へのタグ・用語・エイリアスの付与と用語集への登録の条件、description の記載方法を定め、文書にタグや description を付ける・用語を登録するときに参照する。
tags:
  - name: scope:dev
  - name: topic:naming
  - name: topic:エイリアス
  - name: topic:タグ
    main: true
  - name: topic:ファイル
  - name: topic:単語
  - name: topic:文字列
  - name: topic:文書
  - name: topic:正規表現
  - name: topic:用語
  - name: topic:見出し
  - name: topic:識別子
  - name: action:付与
  - name: action:定義
  - name: action:登録
status: current
visibility: internal
rev: 11
last_reviewed: '2026-11-04'
sources:
  - title: "W3C: SKOS Reference"
    url: https://www.w3.org/TR/skos-reference
    note: prefLabel・altLabel・hiddenLabel
  - title: "Vale: substitution"
    url: https://docs.vale.sh/checks/substitution
    note: やめた言い方の点検と from / to のテスト
  - title: prh
    url: https://github.com/prh/prh
    note: やめた言い方の点検と from / to のテスト
items:
  - id: overview
    name: 概要
    body: |-
      文書にタグ・用語・エイリアスを付けるときと、用語集に登録するとき、description を記載するときの決まり。
      文書を書き込むたびに要る、タグを付ける・付けない条件と description の記載方法は、規約 [文書のタグと description の記載](id:dev-doc-tag-description) に分けた。
  - id: tag-form-01
    group: タグの構造
    name: タグは自由な文字列
    body: |-
      - タグは自由な文字列で、比較の前に正規化（NFKC・大文字小文字）する
        分類は `scope:` などの接頭辞の命名で表す
        付ける数の上限・目安は持たない
  - id: tag-split-01
    group: タグの分け方
    name: 単語まで分ける
    body: |-
      - 書き出した単語を単語まで分け、分けた単語ごとに次の命名規則の表でタグにする。
        例: 「タグ・用語・エイリアスを登録する条件」→ `topic:タグ`・`topic:用語`・`topic:エイリアス`・`action:登録`
  - id: tag-split-02
    group: タグの分け方
    name: 複合語を残す基準
    body: |-
      - 一語として定着した複合語（例: 設計書・全文検索）は分けずに残す
      - 残すかの第一の基準は、用語集（`terms.yaml`）にあるか
        用語集に無いときは、分けると意味が変わる、または分けると関係ない文書が該当するかで決める
  - id: tag-name-01
    group: タグの命名
    name: 命名規則
    body: |-
      <!-- table: data -->

      | 決まり | 例 |
      | --- | --- |
      | `facet:value` の構造。facet 名は英語の小文字 | `topic:`・`action:`・`tool:`・`kind:`・`scope:` |
      | topic は 1 概念の名詞。「A の B」の名詞句は作らない | `topic:エイリアス` ＋ `action:登録` |
      | 一語として定着した複合語は残し、構成語も付ける | `topic:設計書`（＋ `topic:設計`） |
      | action は名詞形 | `action:登録`・`action:削除`・`action:検索` |
      | tool は公式の名前を小文字・ハイフン区切り | `tool:tanstack-query` |
      | 表記ゆれは使用されているタグに合わせる | `サーバー` |

      <!-- /table -->
  - id: tag-scope-01
    group: タグにする単語の範囲
    name: 検出する範囲
    body: |-
      - `tag-scope-02` の表の範囲に出るドメインの名詞・行為の単語は、機械的に全部タグにする
        単語まで分け、使用されているタグに合わせる（`tag-attach-02`）
      - 本文だけに出る単語はタグにせず、全文検索に任せる
  - id: tag-scope-02
    group: タグにする単語の範囲
    name: ファイルの種類ごとの書き出す範囲
    body: |-
      単語を書き出す範囲と付けるファセットは、ファイルの種類で決める。

      <!-- table: data -->

      | ファイルの種類 | 書き出す範囲 | 付けるファセット |
      | --- | --- | --- |
      | Markdown | タイトル・見出し・description・表の行見出し | 全て |
      | YAML の文書（規約・フローチャート・MindStella の記録など） | 文書の `name`・`description`、項目の `name`・`group`（見出しに該当する）、本文の見出し | 全て |
      | ソースコード（files.yaml の行） | ファイル名とフォルダ名の単語・files.yaml の `description`・import している外部のライブラリ。関数名・クラス名は検出しない | `topic:`・`tool:` だけ |

      <!-- /table -->
  - id: tag-scope-03
    group: タグにする単語の範囲
    name: 見出しの識別子
    body: |-
      - 見出しの識別子（関数名・ファイル名。`list_changes`・`describe()`・`project-index.yaml`）はタグにしない。
        概念の単語にしてから付ける（`project-index.yaml` → `topic:設定`）
  - id: description-03
    group: description の記載方法
    name: 点検の表
    body: |-
      記載した `description` を次の表で点検する。

      <!-- table: data -->

      | 点検項目 | 基準 |
      | --- | --- |
      | 文の数 | 1 文（句点は文末の 1 つだけ） |
      | 文字数 | 40〜120 字。120 字を超えたら、受け持つことの列挙を代表の 2〜3 件に削るか、文書を分ける |
      | 要素 | 「何を受け持つか（定めるか）」と「どんなときに参照するか」の両方がある |
      | タイトルの言い直し | タイトルを言い換えただけの文で始めない。「〜について」「〜の文書」で終えない |
      | 検索で適用したい単語 | その文書を探す人が使用する単語（タグの topic・action に該当する単語）を含む |
      | 記載しないもの | 関数の一覧・実装の手順・検討事項の ID・Issue 番号・ファイルのパス・更新の経緯（「〜を追加した」） |
      | 変わる値 | 時期や実装で変わる値（タイムアウトの秒数・閾値・バージョン・モデル名）と、後から増えうるものの個数を記載しない。規約 [文章の書き方](id:convention-writing-style#writing-style-check-01) の確認表と同じ |
      | 用語の選び方 | 規約 [文章の書き方](id:convention-writing-style#word-choice-table-02) の対応表に沿う（和語と、外来語を無理に訳した和語を使用しない） |

      <!-- /table -->
  - id: tag-attach-02
    group: タグを付ける条件
    name: 既存のタグに寄せる
    body: |-
      - 使用されているタグに合わせるのは、同じ概念の言い方・活用の違い（「強い／強く」など）だけ
        意味が近いだけの別の概念は、別のタグにしてよい
        タグの種類の上限は持たない
  - id: term-register-01
    group: 用語を登録する条件
    name: 用語を登録する条件
    body: |-
      登録するかは判定フローチャート [用語の登録](id:flowchart-term-registration) で決める。
      次の表は例。

      <!-- table: data -->

      | 条件 | 例 |
      | --- | --- |
      | プロジェクト固有の呼び名（システム名・製品の固有の単語・話し合いで決めた呼び名） | 「ワークスペース」 |
      | 一般的な単語でも、このプロジェクトで一般と違う・狭い意味で使用する単語 | 「フェーズ」= エージェントが 1 ターンで実行する手順のまとまり |
      | 外部ライブラリ・外部サービスを調べたときのその名前（調べた資料へのエイリアスでもよい） | 「sqlite-vec」 |
      | 同じものに 2 つ以上の言い方が出たとき。正式な単語を用語に、残りを `aliases` か `avoid` に入れる | 「移し替え」と「マイグレーション」 |

      <!-- /table -->
  - id: term-not-register-01
    group: 用語を登録しない条件
    name: 用語を登録しない条件
    body: |-
      登録しないかも判定フローチャート [用語の登録](id:flowchart-term-registration) で決める。
      次の表は例。

      <!-- table: data -->

      | 条件 | 例 |
      | --- | --- |
      | 一般的な意味のまま使用している技術用語 | 「JSON」「正規表現」 |
      | 1 文書の中だけで使い他の文書に出ない単語 | ある PR の一時的な作業名 |

      <!-- /table -->
  - id: alias-register-01
    group: エイリアスを登録する条件
    name: エイリアスの定義
    body: |-
      エイリアスは、文書そのものを特定の単語に紐付ける文字列。
      利用者にはその単語にツールチップで文書を出し、エージェントはタグと並んで検索に使用する。
  - id: alias-register-02
    group: エイリアスを登録する条件
    name: エイリアスを登録する条件
    body: |-
      登録するかは判定フローチャート [エイリアスの登録](id:flowchart-alias-registration) と判定表 [エイリアスを登録しない条件](id:decision-table-alias-exclusion) で決める。
      次の表は例。

      <!-- table: data -->

      | 条件 | 例 |
      | --- | --- |
      | 本文や会話で、その文書をタイトル以外の名前で呼んでいる | 「索引と用語集を記載する」を「索引の手順」と呼ぶ |
      | 略称・英語名・旧名で参照される | `api.md` に「公開関数」 |

      <!-- /table -->
  - id: alias-not-register-01
    group: エイリアスを登録しない条件
    name: エイリアスを登録しない条件
    body: |-
      登録しないかも判定フローチャート [エイリアスの登録](id:flowchart-alias-registration) と判定表 [エイリアスを登録しない条件](id:decision-table-alias-exclusion) で決める。
      次の表は例。

      <!-- table: data -->

      | 条件 | 例 |
      | --- | --- |
      | 複数の文書や用語に当てはまる一般語（ツールチップが誤った紐付けになる）。特定の文脈でだけその文書を指すなら、照合条件を付けて登録する | 「設定」「手順」 |
      | 1〜2 文字の単語や、ほかの単語の一部としてよく出る単語 | 「印」（「印刷」に該当する） |
      | 正規化で吸収できる表記ゆれ | 全角の API と半角の API の両方は登録しない |

      <!-- /table -->
  - id: matching-01
    group: 一致のさせ方
    name: 一致前の正規化
    body: |-
      - 一致の前に NFKC・英字の大文字小文字・前後の空白を正規化し、残る揺れは `aliases` に列挙する
  - id: matching-02
    group: 一致のさせ方
    name: 正規表現の用途
    body: |-
      - 正規表現は、やめた言い方（`avoid`）の点検だけに使用し、from / to のテストを付ける
        自動の紐付け（ツールチップ・検索）には使用しない
