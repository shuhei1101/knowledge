# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-shared-logger-tag
kind: rule
name: Logger — Component tag 命名
description: logger.create に渡す component tag を {layer}:{name} 形式で命名する決まりを定める。
tags:
  - name: scope:next
  - name: topic:shared
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      `logger.create("tag")` の tag は必ず `{layer}:{name}` 形式。集約サービスで `component` キーによるフィルタを統一する。
  - id: logger-tag-01
    group: Logger — Component tag 命名
    name: tag の命名表
    body: |-
      <!-- table: data -->

      | Layer          | Format                    | Example                        |
      | -------------- | ------------------------- | ------------------------------ |
      | Page           | `page:{feature}`          | `page:resources`               |
      | Screen         | `screen:{Name}`           | `screen:ResourceEditScreen`    |
      | Hook           | `hook:{hookName}`         | `hook:useResourceForm`         |
      | Hook（共通）   | `hook:shared:{name}`      | `hook:shared:useConfirmDialog` |
      | API route      | `api:{resource}.{method}` | `api:resources.POST`           |
      | Service        | `service:{resource}`      | `service:resource`             |
      | Action         | `action:{resource}`       | `action:resources`             |
      | Client         | `client:{resource}`       | `client:resources`             |
      | Component      | `component:{Name}`        | `component:ResourceCard`       |
      | Error boundary | `error-boundary:{path}`   | `error-boundary:resources`     |
      | Webhook        | `webhook:{provider}`      | `webhook:stripe`               |
      | Cron           | `cron:{job}`              | `cron:daily-summary`           |
      | Auth           | `auth:{event}`            | `auth:login`                   |
      | Provider       | `provider:{name}`         | `provider:QueryProvider`       |

      <!-- /table -->
