# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-shared-error-route-handler
kind: rule
name: withRouteErrorHandling — route.ts のエラー変換
description: route.ts のエラーを構造化 JSON に変換する withRouteErrorHandling と、レスポンス封筒を定め、route.ts のエラー処理を実装するときに読む。
tags:
  - name: scope:next
  - name: topic:shared
    main: true
status: current
visibility: internal
rev: 2
last_reviewed: '2026-10-24'
items:
  - id: route-error-handling-01
    group: withRouteErrorHandling — route.ts のエラー変換
    name: 全 handler をラップする
    body: |-
      - 全 `route.ts` handler を `withRouteErrorHandling(async () => { ... })` で wrap（handler 内に try/catch を書かない）
  - id: route-error-handling-02
    group: withRouteErrorHandling — route.ts のエラー変換
    name: 構造化 JSON に変換
    body: |-
      - Zod / AppError 派生を構造化 JSON `{ error: { code, message, field? } }` に自動変換
  - id: route-error-handling-03
    group: withRouteErrorHandling — route.ts のエラー変換
    name: 予期しないエラーは 500
    body: |-
      - 予期しないエラーはログに stack を記録して 500 を返す（raw message / stack をレスポンスに出さない）
  - id: route-error-handling-04
    group: withRouteErrorHandling — route.ts のエラー変換
    name: Next.js 内部のエラーは再 throw
    body: |-
      - `redirect()` / `notFound()` 等の Next.js 内部のエラーは `unstable_rethrow(e)` で再 throw し、500 にしない
  - id: response-envelope-01
    group: レスポンス封筒
    name: レスポンス封筒の表
    body: |-
      <!-- table: data -->

      | Error                | Status       | code                                          |
      | -------------------- | ------------ | --------------------------------------------- |
      | ZodError             | 400          | VALIDATION（最初の issue の message + field） |
      | ClientValueError     | 400          | VALUE（field? あり）                          |
      | ClientAuthError      | 401 / 403    | AUTH                                          |
      | VersionConflictError | 409          | CONFLICT                                      |
      | AppError（404 等）   | e.statusCode | e.code                                        |
      | 予期しない           | 500          | INTERNAL（汎用文言）                          |

      <!-- /table -->
