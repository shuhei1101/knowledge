# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-backend-rate-limit
kind: rule
name: Rate Limiting
description: Upstash Ratelimit によるレートリミットの構成・キー設計・クライアント側の扱い・運用を定め、API にレート制限を設けるときに読む。
tags:
  - name: scope:next
  - name: topic:backend
    main: true
status: current
visibility: internal
rev: 2
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      第一選択は Upstash Ratelimit（Redis ベース・Edge 対応）。`@upstash/ratelimit` + `@upstash/redis`、env は `UPSTASH_REDIS_REST_URL` / `UPSTASH_REDIS_REST_TOKEN`。
  - id: structure-01
    group: 構成
    name: 用途別 limiter の定義
    body: |-
      - `app/(shared)/lib/ratelimit.ts` に用途別 limiter を定義（`prefix` で分離）
        - 用途別の上限値はプロジェクトの非機能要件で決める
  - id: structure-02
    group: 構成
    name: 既定のアルゴリズム
    body: |-
      - アルゴリズムは `slidingWindow` を既定とする。バースト許容なら `tokenBucket`
  - id: structure-03
    group: 構成
    name: proxy.ts での全体適用
    body: |-
      - 全体適用は proxy.ts（`/api/` パスで IP キーに `limit()`、超過は 429 + `X-RateLimit-*` / `Retry-After` ヘッダ）
  - id: structure-04
    group: 構成
    name: 特定エンドポイントの厳格化
    body: |-
      - 特定エンドポイント（ログイン等）はさらに route.ts 内で厳しめに適用
  - id: key-design-01
    group: キー設計
    name: ログイン済みは userId で制限
    body: |-
      - IP だけだと同一ネットワークで誤検知 → ログイン済みは `userId` ベース（`userId ?? ip:{ip}`）
  - id: key-design-02
    group: キー設計
    name: アクション別の制限
    body: |-
      - アクション別制限（1 時間に 5 投稿等）は `post:{userId}` のようなキー + `fixedWindow`
  - id: key-design-03
    group: キー設計
    name: 重い処理は cost 指定
    body: |-
      - 重い処理は cost 指定（`limit(key, { rate: 10 })`）
  - id: client-side-01
    group: クライアント側
    name: 429 の変換
    body: |-
      429 は `RateLimitError`（`RATE_LIMIT`）に変換し、`handleAppError` が長め toast を出す（[shared/エラークライアントハンドラー](id:react-shared-error-client-handler)）。
  - id: operation-01
    group: 運用
    name: dev と prod で Redis を分ける
    body: |-
      - dev / prod で別 Redis データベース（dev は高めに設定）
  - id: operation-02
    group: 運用
    name: Bot 対策
    body: |-
      - Bot 対策が必要なら Vercel Firewall / Cloudflare Turnstile（ログイン・登録・問い合わせ）
  - id: operation-03
    group: 運用
    name: 429 の監視
    body: |-
      - 短時間に多発する 429 はログで監視
