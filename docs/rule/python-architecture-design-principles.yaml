id: python-architecture-design-principles
kind: rule
name: 設計原則の優先順位
description: DRY・SOLID・拡張性の優先順位と、クラスと関数の使い分けを定め、Python の設計判断で迷ったときに読む。
tags:
  - name: scope:python
  - name: topic:architecture
    main: true
  - name: topic:testing
  - name: topic:クラス
  - name: topic:モジュール
  - name: topic:変数
  - name: topic:言語
  - name: topic:関数
  - name: action:参照
  - name: action:抽象
  - name: action:拡張
  - name: action:設計
  - name: action:適用
status: current
visibility: internal
rev: 3
last_reviewed: '2026-10-24'
items:
  - id: design-priority-01
    group: 設計原則の優先順位
    name: DRY が最重視
    body: |-
      1. DRY — 最重視
  - id: design-priority-02
    group: 設計原則の優先順位
    name: SOLID は I と L を重視
    body: |-
      2. SOLID — 重視（特に I と L）
  - id: design-priority-03
    group: 設計原則の優先順位
    name: 拡張性意識
    body: |-
      3. 拡張性意識 — YAGNI は強制しない、先回り抽象化を許容
  - id: dry-01
    group: DRY
    name: 共通化の回数の参照
    body: |-
      - 同じロジック・データ・構造を何回書いたら共通化するかは [architecture/リファクタリング判断](id:python-architecture-refactoring-criteria) の回数に従う
  - id: dry-02
    group: DRY
    name: 過剰抽象化をしない
    body: |-
      - ただし 3 箇所目以降のための過剰抽象化はしない（閾値は [architecture/リファクタリング判断](id:python-architecture-refactoring-criteria)）
  - id: dry-03
    group: DRY
    name: テスト関数には当てない
    body: |-
      - テスト関数の本文には当てない（[testing/テスト戦略](id:python-testing-strategy#test-function-format-01) の「テスト関数の書式」）
  - id: solid-01
    group: SOLID
    name: SOLID の適用表
    body: |-
      | 原則 | 適用                                                                         |
      | ---- | ---------------------------------------------------------------------------- |
      | S    | 1 関数 / 1 モジュールが複数の理由で変更されない                              |
      | O    | 新 feature / 新 provider 追加時に既存変更不要                                |
      | L    | Protocol 実装は構造的に等価（戻り値型・例外契約・副作用範囲）                |
      | I    | 巨大 Protocol を作らず用途別に小さく（`AsyncChatFn` と `EmbedFn` は別 type） |
      | D    | 高レイヤは低レイヤを関数の型エイリアスで抽象化                               |
  - id: extensibility-01
    group: 拡張性
    name: 拡張ポイントは最初に抽象化
    body: |-
      - 「いずれ来そう」な拡張ポイントは最初から関数の型で抽象化（後付けより安い）
  - id: extensibility-02
    group: 拡張性
    name: 来るか分からない抽象化
    body: |-
      - 「来るかわからない抽象化」は増やさない（Protocol / `@overload` の量産は逆効果）
  - id: class-and-function-01
    group: クラスと関数
    name: 関数ファースト
    body: |-
      関数ファースト。クラスを使ってよいものは [architecture/TypeScriptスタイル適用](id:python-architecture-typescript-style)。

      サービス / Repository / Provider / Validator 等は関数で書く。
  - id: class-and-function-02
    group: クラスと関数
    name: 可変なモジュール変数を持たない
    body: |-
      - 可変なモジュール変数を持たない。やむを得ず持つなら `_` 付きにし、関数を通して触る（定数は可）
  - id: class-and-function-03
    group: クラスと関数
    name: 使わない言語機能
    body: |-
      - メタクラスの自作・属性の動的な差し込み・import の書き換え・`__del__` を使わない（標準ライブラリとライブラリが要求するものは可）
