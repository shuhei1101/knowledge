# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: python-architecture-dependency-management
kind: rule
name: 依存方向のルール
description: レイヤー間の依存方向のルールと、同層参照が必要になったときのパターン、依存方向のチェック方法を定める。
tags:
  - name: scope:python
  - name: topic:architecture
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      ```
      features / server
              ↓
         integrations / runtime
              ↓
            shared
      ```
  - id: dependency-rules-01
    group: 依存方向のルール
    name: shared は誰にも依存しない
    body: |-
      - `shared/` は誰にも依存しない（最下層）
  - id: dependency-rules-02
    group: 依存方向のルール
    name: integrations と runtime の依存先
    body: |-
      - `integrations/` / `runtime/` は `shared/` のみに依存
  - id: dependency-rules-03
    group: 依存方向のルール
    name: 同層内の相互参照は禁止
    body: |-
      - 同層内（features 同士、integrations 同士）の相互参照は基本禁止
  - id: same-layer-patterns-01
    group: 同層参照が必要になったときの 3 パターン
    name: 同層参照のパターン表
    body: |-
      | パターン                      | 使いどき                                    |
      | ----------------------------- | ------------------------------------------- |
      | shared に共通化して引き上げ   | 複数 feature が同じユーティリティを使う     |
      | 関数の型エイリアスで DIP      | feature A が feature B のデータを必要とする |
      | server でオーケストレーション | 複数 feature を組み合わせる処理             |
  - id: type-alias-dip-01
    group: 同層参照が必要になったときの 3 パターン > 型エイリアス DIP の要点
    name: 最小 DTO を持つ
    body: |-
      - 利用側 feature の `types.py` に「自分視点の最小 DTO」（`UserMinimal` 等）と関数型（`type FindUserForChat = Callable[...]`）を定義
  - id: type-alias-dip-02
    group: 同層参照が必要になったときの 3 パターン > 型エイリアス DIP の要点
    name: 相手の DTO は知らない
    body: |-
      - 相手 feature の DTO 全体は知らない
  - id: type-alias-dip-03
    group: 同層参照が必要になったときの 3 パターン > 型エイリアス DIP の要点
    name: adapter は main.py で組む
    body: |-
      - adapter（変換 + 配線）は `main.py` で書く
  - id: dependency-check-01
    group: 依存方向チェック
    name: 依存方向チェックの方法
    body: |-
      import 文の grep で検出できる:
  - id: dependency-check-02
    group: 依存方向チェック
    name: features の import チェック
    body: |-
      - features 内に `from {pkg}.features.` がないか
  - id: dependency-check-03
    group: 依存方向チェック
    name: shared の import チェック
    body: |-
      - shared 内に shared 以外への `from {pkg}.` がないか
  - id: dependency-check-04
    group: 依存方向チェック
    name: integrations の import チェック
    body: |-
      - integrations 内に `from {pkg}.features.` がないか
  - id: type-only-import-01
    group: "例外: 型のみインポート"
    name: TYPE_CHECKING の扱い
    body: |-
      `TYPE_CHECKING` 配下の型参照は実行時依存でないため緩く扱えるが、基本はそもそも参照しない設計を優先。
