# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: react-state-effect
kind: rule
name: useEffect
description: useEffect を使ってよい場面と、使わずに済ませる場面（派生値・データ取得・イベント）を定める。
tags:
  - name: scope:react
  - name: topic:frontend
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-30'
related:
  - to: flowchart-react-state-placement
    type: requires
    when: 新しい値の置き場所を決めるとき
items:
  - id: overview
    name: 概要
    body: |-
      対象: React
  - id: effect-01
    group: useEffect
    name: 外部のシステムと同期するときだけ使う
    body: |-
      - `useEffect` は、React の外のシステム（ブラウザの API・WebSocket・外部ライブラリの購読）と同期するときだけ使う。
        購読は、cleanup で解除する。
  - id: effect-02
    group: useEffect
    name: 計算で出せる値は描画中に計算する
    body: |-
      - props と既存の state から計算できる値は、state にせず描画中に計算する。
  - id: effect-03
    group: useEffect
    name: データ取得は TanStack Query に任せる
    body: |-
      - データ取得は、TanStack Query に任せる。
        `useEffect` で fetch しない。
  - id: effect-04
    group: useEffect
    name: props を state に複製しない
    body: |-
      - props を `useState` に複製して `useEffect` で同期しない。
  - id: effect-05
    group: useEffect
    name: 操作の結果はイベントハンドラで処理する
    body: |-
      - 利用者の操作の結果は、イベントハンドラで処理する。
        state の変化を `useEffect` で受けて処理しない。
  - id: lint-01
    group: lint
    name: lint で検査する
    body: |-
      - `eslint-plugin-react-hooks` の `recommended-latest` で検査する。
  - id: sources-01
    group: 出典
    name: "出典: React の公式ドキュメント"
    body: |-
      - [You Might Not Need an Effect](https://react.dev/learn/you-might-not-need-an-effect)
      - [Synchronizing with Effects](https://react.dev/learn/synchronizing-with-effects)
