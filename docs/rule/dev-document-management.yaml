# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: dev-document-management
kind: rule
name: ドキュメント管理
description: AI エージェントが読み書きする文書の置き方・フォルダ・メタデータ・関連・配信の決まりを定める。
tags:
  - name: scope:dev
    main: true
status: current
visibility: internal
rev: 5
last_reviewed: '2026-10-30'
sources:
  - title: "Anthropic: Effective context engineering for AI agents"
    url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
    note: 軽い識別子を持たせて本文は必要なときに読む
  - title: "Backstage: Descriptor Format"
    url: https://backstage.io/docs/features/software-catalog/descriptor-format
    note: "参照は名前、関係は片側だけ記載する"
  - title: "Doorstop: Item"
    url: https://doorstop.readthedocs.io/en/latest/reference/item.html
    note: "1 項目 1 ファイル、ファイル名が UID"
items:
  - id: overview
    name: 概要
    body: |-
      AI エージェントが読み書きする文書の置き方・メタデータ・関連・配信の決まり。
  - id: placement-01
    group: 置き方
    name: 文書の正本は YAML
    body: |-
      - 文書の正本は YAML にする
        markdown にするのは、道具が markdown を前提にするファイル（README・CLAUDE.md・AGENTS.md・SKILL.md・PR の本文など）だけ
  - id: placement-02
    group: 置き方
    name: 大きな文書は項目に分ける
    body: |-
      - 大きな文書は項目ごとに分け、長い自由記述は項目の本文のキーに入れる
  - id: placement-03
    group: 置き方
    name: YAML ファイルの単位
    body: |-
      - YAML ファイルを分ける単位は [YAML ファイルの単位](id:flowchart-yaml-file-unit) で決める
  - id: placement-04
    group: 置き方
    name: フロントマターの扱い
    body: |-
      - 道具がフロントマターを要求するファイル（SKILL.md など）のほかは、フロントマターを使わない
  - id: folder-01
    group: フォルダ
    name: 文書は docs/ 1 つに置く
    body: |-
      - 文書は `docs/` 1 つに置き、その下は種類だけをフォルダにする
        種類のフォルダの中はフラットにする
  - id: folder-02
    group: フォルダ
    name: 分類はメタデータで持つ
    body: |-
      - 公開範囲・分類・トピック・言語はメタデータで持ち、フォルダにしない
  - id: folder-03
    group: フォルダ
    name: ファイル名は ID
    body: |-
      - ファイル名は ID か変わりにくいスラッグにする
  - id: folder-04
    group: フォルダ
    name: 参照は ID で記載
    body: |-
      - 文書どうしの参照は ID で記載し、パスで記載しない
  - id: folder-05
    group: フォルダ
    name: スキーマの置き場所
    body: |-
      - 種類ごとのスキーマは `schemas/{種類}.schema.yaml` に置く

      ```text
      repo/
      ├── README.md
      ├── CLAUDE.md
      ├── schemas/
      └── docs/
          ├── scenario/
          │   └── SC-12.yaml
          ├── rule/
          │   └── python-testing.yaml
          └── terms.yaml
      ```
  - id: metadata-01
    group: メタデータ
    name: メタデータのキー一覧
    body: |-
      <!-- table: data -->

      | キー | 中身 | 必須 |
      | --- | --- | --- |
      | `id` | 変わらない ID | 必須 |
      | `kind` | 文書の種類（英語の定数） | 必須 |
      | `name` | タイトル | 必須 |
      | `description` | 本文を読まずに中身が分かる 1 文。書き方は [タグと用語の登録](id:dev-tag-term-registration) | 必須 |
      | `tags` | タグ（[タグと用語の登録](id:dev-tag-term-registration)）。各要素は `name` と、主題なら `main: true` | 必須 |
      | `status` | 状態（英語の定数） | 必須 |
      | `visibility` | 公開範囲（`public` / `internal`） | 必須 |
      | `rev` | 変更ごとに増えるバージョン。書き込みのツールが付ける | 必須 |
      | `aliases` | 本文や会話でこの文書を呼ぶ別の名前 | 任意 |
      | `related` | 関連（`## 関連`） | 任意 |
      | `sources` | 参考にした出典（URL・ライブラリとバージョン・確かめた日）。本文には決めたことだけを記載する | 任意 |
      | `code_refs` | 対応するコードのパスとシンボル | 任意 |
      | `interfaces` | 定義している公開インターフェース | 任意 |
      | `last_reviewed` | 最後に内容を確かめた日 | 手順書・規約など鮮度を見たい種類だけ。種類のスキーマで決める |

      <!-- /table -->
  - id: metadata-02
    group: メタデータ
    name: 作成・更新日時は持たない
    body: |-
      - 作成日時・更新日時は持たない
        要るときは git から取る
  - id: metadata-03
    group: メタデータ
    name: メタデータは多めに持つ
    body: |-
      - 紐付けに使えるメタデータは多めに持たせ、返す量は読み取りのツールで絞る（[MCP サーバー作成ルール](id:claude-mcp)）
  - id: related-01
    group: 関連
    name: 関連の要素
    body: |-
      - 各要素に `to`（相手の ID）・`type`（関係の種類）・`when`（いつ読むか、1 文）を持たせる
        機械で判定できるときだけ `paths`（glob）を併記する
      - 関連を張る相手と各要素の中身は [関連の張り方](id:flowchart-related-link) で決める
  - id: related-02
    group: 関連
    name: 関連の type
    body: |-
      - `type` は `requires`・`references`・`replaces`・`part_of`・`change_together` から選ぶ
      - 選ぶ順と各 `type` の定義は [関連の張り方](id:flowchart-related-link) に従う
  - id: related-03
    group: 関連
    name: 関連は片側だけ記載
    body: |-
      - 片側だけ記載し、逆向きはツールで出す
        `change_together` だけは両側に記載し、修正し忘れの検査に使う
      - どちらに記載するかは [関連の張り方](id:flowchart-related-link) の結果に従う
  - id: related-04
    group: 関連
    name: when を記載できない関連
    body: |-
      - `when` を記載できない関連は張らない
        本文でリンクしている相手は重ねない
        件数の上限は種類のスキーマで決める
      - 張るかは [関連の張り方](id:flowchart-related-link) の先頭で当てる
  - id: related-05
    group: 関連
    name: 参照切れは CI で止める
    body: |-
      - 規約・手順のように従う必要がある文書への参照が切れたら、CI で止める
  - id: delivery-01
    group: 配信
    name: 開発ドキュメントサーバーの配信
    body: |-
      - 開発ドキュメントサーバーは develop ブランチの全件を配信する
  - id: delivery-02
    group: 配信
    name: GitHub Pages の配信
    body: |-
      - GitHub Pages は、master へのマージで動く GitHub Actions のワークフローで、`visibility: public` の文書だけを HTML にして配信する
        YAML の原本は成果物に入れない
  - id: delivery-03
    group: 配信
    name: ブランチ配信の方式は使わない
    body: |-
      - ブランチのフォルダをそのまま配信する Pages の方式は使わない
  - id: delivery-04
    group: 配信
    name: dev-docs の使用
    body: |-
      - 開発ドキュメントサーバーは dev-docs を使う
      - 各リポジトリは、直下に `dev-docs.yaml`・スキーマ・検査と変換のスクリプトだけを置く
  - id: delivery-05
    group: 配信
    name: dev-docs の立て方
    body: |-
      - `/dev-docs:global-setup` で端末を準備し、`/dev-docs:setup {リポジトリ}` で配信元を登録する
      - 手順の詳細は dev-docs の [dev-docsを入れる](https://github.com/shuhei1101/dev-docs/blob/develop/docs/%E4%BD%BF%E3%81%84%E6%96%B9/dev-docs%E3%82%92%E5%85%A5%E3%82%8C%E3%82%8B.md)・[配信元を配信する](https://github.com/shuhei1101/dev-docs/blob/develop/docs/%E4%BD%BF%E3%81%84%E6%96%B9/%E9%85%8D%E4%BF%A1%E5%85%83%E3%82%92%E9%85%8D%E4%BF%A1%E3%81%99%E3%82%8B.md) を参照する
  - id: delivery-06
    group: 配信
    name: 読み書きできる範囲
    body: |-
      - どの作業場所からどの配信元を読み書きできるかは、端末の設定 `~/.config/dev-docs/settings.yaml` の `sources[]` の `scope.read`・`scope.write` で決める
  - id: delivery-07
    group: 配信
    name: メタデータとエイリアスの対応づけ
    body: |-
      - 文書のメタデータとエイリアスは、`dev-docs.yaml` の documents の行の `metadata` で文書の列と対応づける
        `metadata` は列の対応だけで、`alias_type` は行の属性
      - エイリアスの共通のスキーマは、alias-inject の [エイリアスのスキーマ](https://github.com/shuhei1101/alias-inject/blob/develop/docs/%E3%83%AA%E3%83%95%E3%82%A1%E3%83%AC%E3%83%B3%E3%82%B9/%E3%82%A8%E3%82%A4%E3%83%AA%E3%82%A2%E3%82%B9%E3%81%AE%E3%82%B9%E3%82%AD%E3%83%BC%E3%83%9E.md) を参照する
  - id: delivery-08
    group: 配信
    name: YAML でない文書の files.yaml
    body: |-
      - Markdown・ソースコードなど YAML でない文書は、検索したいものをすべて、フォルダの直下の管理用の YAML（`files.yaml`）の行に載せる
        行にはパス・タグ・説明を記載する
  - id: files-yaml-01
    group: 配信
    name: files.yaml に載せるファイルの判定
    body: |-
      - 除外の条件に当たらないファイルは全て載せ、1 行を 1 ファイルにする

      ```mermaid
      flowchart TD
        START([files.yaml に載せるか決めたいファイルがある])
        Q0{生成物・ロック・バイナリ・ベンダーのコードに当たるか? ※1}
        Q1{再エクスポートや空の __init__ だけのファイルか?}
        Q2{テストか?}
        Q3{対応する設計書があるか?}

        R1([載せない])
        R2([載せる。related の tests で対象のコードを指す])
        R3([載せる。related の implements でその設計書を指す])
        R4([載せる])

        START --> Q0
        Q0 -->|YES| R1
        Q0 -->|NO| Q1
        Q1 -->|NO| Q2
        Q1 -->|YES| R1
        Q2 -->|YES| R2
        Q2 -->|NO| Q3
        Q3 -->|YES| R3
        Q3 -->|NO| R4
      ```

      - **※1 除外の条件の見分け方**: dev-docs の [文書のメタデータ](https://github.com/shuhei1101/dev-docs/blob/develop/docs/%E3%81%AF%E3%81%98%E3%82%81%E3%81%AB/%E3%82%B3%E3%82%A2%E3%82%B3%E3%83%B3%E3%82%BB%E3%83%97%E3%83%88/%E6%96%87%E6%9B%B8%E3%81%AE%E3%83%A1%E3%82%BF%E3%83%87%E3%83%BC%E3%82%BF.md) の「載せるファイルの判定」に従う
  - id: files-yaml-02
    group: 配信
    name: files.yaml の行の列に入れる値
    body: |-
      <!-- table: data -->

      | 列 | 入れる値 | 入れないもの |
      | --- | --- | --- |
      | `path` | files.yaml のフォルダからの相対パス。1 行 1 ファイル | glob |
      | `name` | 何のファイルかを表す日本語の名詞句（例 `タスクのリポジトリ`） | クラス名・ファイル名の繰り返し |
      | `description` | [タグと用語の登録](id:dev-tag-term-registration) の description の書き方 | 関数の一覧・実装の手順 |
      | `tags` | [タグと用語の登録](id:dev-tag-term-registration) の `tag-scope-02` のソースコードの行（`topic:`・`tool:`） | `kind:`・`scope:`・状態・評価の語 |
      | `related` | `implements`・`tests`・`see_also` | import で分かる依存 |
      | `status` | `deprecated` など検索で外したい状態だけ | - |

      <!-- /table -->
  - id: files-yaml-03
    group: 配信
    name: implements はコード側だけに記載する
    body: |-
      - 設計書と 1 対 1 のコードは、コード側の files.yaml の行に必ず `implements` を記載する
      - 設計書には逆向き（設計書 → コード）を記載しない
        逆向きは被参照で引く（dev-docs の `trace_related`）
  - id: files-yaml-04
    group: 配信
    name: files.yaml の related の type
    body: |-
      - files.yaml の行の `related` の `type` は `implements`・`tests`・`see_also` から選ぶ
      - `related-02` の `type`（`requires`・`references`・`replaces`・`part_of`・`change_together`）は YAML の文書に使う
  - id: delivery-09
    group: 配信
    name: 設定のキー
    body: |-
      - 設定のキーは、dev-docs の [設定](https://github.com/shuhei1101/dev-docs/blob/develop/docs/%E3%83%AA%E3%83%95%E3%82%A1%E3%83%AC%E3%83%B3%E3%82%B9/%E8%A8%AD%E5%AE%9A.md) を参照する
