# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: html-testing-fixture
kind: rule
name: Factory-as-Fixture パターン（DB リソース準備の推奨形）
description: Playwright で DB リソースを準備する fixture を、関数を返す Factory-as-Fixture の形にする決まりを定める。
tags:
  - name: scope:html
  - name: topic:testing
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      シナリオテストで「複数インスタンスを作りたい」「引数付きでリソースを作りたい」ケースは、fixture が関数（factory）を返す構造にする。
  - id: factory-as-fixture-01
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: fixture は 1 責務
    body: |-
      - 1 fixture = 1 責務（`createUser` / `createProfile` / `createTask` を分けて `tests/e2e/fixtures.ts` に並置）
  - id: factory-as-fixture-02
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: 依存は引数で明示
    body: |-
      - 依存はテスト本体で引数として明示する（`createProfile(userA)` の書式）
  - id: factory-as-fixture-03
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: cleanup の自動追跡
    body: |-
      - cleanup は fixture 内で作成したものを追跡し、`use()` の後で作成順の逆順に delete する
  - id: factory-as-fixture-04
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: 必要な factory だけ受ける
    body: |-
      - テストは必要な factory だけを引数で受ける（Playwright は要求された fixture だけ初期化する）
  - id: factory-as-fixture-05
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: god setup の禁止
    body: |-
      - アンチパターン: `setupAllScenarioX()` のような god setup で全リソースを作る
  - id: factory-as-fixture-06
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: 名前のハードコード禁止
    body: |-
      - アンチパターン: fixture 内で名前をハードコードした値を返す（`userA` 等）。常に factory を返す
  - id: factory-as-fixture-07
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: 手動 cleanup の禁止
    body: |-
      - アンチパターン: `try/finally` で手動 cleanup を書く。fixture の `use()` 後に任せる
  - id: factory-as-fixture-08
    group: Factory-as-Fixture パターン（DB リソース準備の推奨形）
    name: fixtures.ts に集約
    body: |-
      - 配置: `frontend/tests/e2e/fixtures.ts` に集約し、各 spec は `import { test } from "./fixtures"`
