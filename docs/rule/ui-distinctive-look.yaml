items:
  - id: overview
    name: 概要
    body: |-
      対象: 共通（単体 HTML・React）
      画面をシンプルに保ったまま、凡庸に見せないための決まり。
      印象は飾りの量ではなく、ワンポイントの題材・色を絞ったうえでの 1 色・文字の大きさの対比で作る。
      ワンポイントの題材・色・形状の味付けはシステムごとに選び、テンプレート『[デザイン方針](id:template-design-policy)』に記載する。
      飾りで使用しない型は規約『[情報の階層と見た目](id:ui-information-hierarchy#visual-consistency-01)』に従う。
      出典の略号は A = Apple Human Interface Guidelines、L = Linear、E = Emil Kowalski、R = Rauno Freiberg、J = Josh Comeau、F = frog、W = W3C、V = Vercel Web Interface Guidelines（リンクはメタデータの `sources`）。
  - id: one-point-01
    group: ワンポイント
    name: ワンポイントの決まり
    body: |-
      <!-- table: data -->

      | 要素 | 出典 |
      | --- | --- |
      | ワンポイントは 1 サイトに 1 つの題材に絞る。題材はそのシステム固有の物（扱うデータ・道具・名前の由来）から取る | F / R |
      | 複数のシステムを、同じ題材・同じ色のワンポイントにしない | - |
      | 特定の色・形状を規約で決めない。システムごとにデザイン方針で選ぶ | - |

      <!-- /table -->
  - id: color-01
    group: 色
    name: 色の決まり
    body: |-
      <!-- table: data -->

      | 要素 | 出典 |
      | --- | --- |
      | 強い色は 1 色に決め、ワンポイントと操作・選択に使用する。それ以外の階層は文字色と線で作る | L |
      | 状態色（成功・警告・エラー）は状態の表示だけに使用する | L |
      | 色の候補は、色相に加えて明度・彩度の組み合わせで出し、ライトとダークの両方でコントラストの基準（[操作とアクセシビリティ](id:ui-operation-accessibility#operation-accessibility-01)）を満たすものから選ぶ | - |

      <!-- /table -->
  - id: type-scale-01
    group: 文字
    name: 文字の大きさの決まり
    body: |-
      <!-- table: data -->

      | 要素 | 出典 |
      | --- | --- |
      | 見出しと本文の大きさの対比を大きく取る。ページの見出しは本文の 2.5 倍以上を目安にする | - |
      | 文字の大きさの段階は、大・本文・小の 3 つまでにする。それ以上の階層は規約『[情報の階層と見た目](id:ui-information-hierarchy#visual-consistency-01)』の文字の階層の決まりに従う | - |

      <!-- /table -->
  - id: playfulness-01
    group: 遊び
    name: 遊びの配置
    body: |-
      <!-- table: data -->

      | 要素 | 出典 |
      | --- | --- |
      | 遊び（ワンポイントの動き・隠れた反応）は、トップ・404・まれな操作（初回の完了 等）にだけ配置する | J / F |
      | 本文のページと、頻繁に繰り返す操作には遊びを配置しない | E |

      <!-- /table -->
  - id: motion-01
    group: 自動で動く図
    name: 自動で動く図の決まり
    body: |-
      <!-- table: data -->

      | 要素 | 出典 |
      | --- | --- |
      | 自動で動く図は、画面に入ったときに 1 回だけ動かす。止まった最後の状態だけで意味が通るようにする | A / E |
      | 図の向き・順序を示す動き（線の上を流れる点 等）は、規約『[表示の安定](id:ui-display-stability#display-stability-01)』の動きの決まりの例外として、繰り返して動かしてよい | - |
      | 繰り返して動く図は、画面外とタブが非表示の間は止める。5 秒を超えて動くものには停止ボタンを付ける。動きを減らす設定では止まった図にする（[操作とアクセシビリティ](id:ui-operation-accessibility#operation-accessibility-01)） | W / V |

      <!-- /table -->
