id: ui-distinctive-look
kind: rule
name: シンプルで凡庸でない見た目
description: 画面をシンプルに保ったまま凡庸に見せないための、ワンポイント・強い色・文字の大きさの対比・遊びと自動で動く図の配置の決まりを定め、画面の見た目の方向を決めるときとデザイン方針を作るときに参照する。
inject_when:
  field: text
  op: contains
  values:
    - 画面
    - UI
    - フロントエンド
    - tsx
    - HTML
    - コンポーネント
status: current
visibility: internal
rev: 1
last_reviewed: '2026-11-09'
