# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: ui-token
kind: rule
name: デザイントークン
description: デザイン値を集約するトークンの名前（shadcn の名前）・3 ティア・段階（Tailwind の既定）・CSS のレイヤーを定め、画面の色や余白などのデザイン値を定義・参照するときに読む。
tags:
  - name: scope:ui
  - name: tool:css
  - name: tool:html
  - name: topic:セマンティックトークン
  - name: topic:ダークモード
  - name: topic:デザイン
  - name: topic:デザイントークン
    main: true
  - name: topic:トークン
  - name: topic:プロパティ
  - name: topic:レイヤー
  - name: topic:画面
  - name: tool:react
  - name: tool:shadcn-ui
  - name: tool:tailwind-css
  - name: action:派生
  - name: action:登録
  - name: action:集約
status: current
visibility: internal
rev: 5
last_reviewed: '2026-10-30'
items:
  - id: overview
    name: 概要
    body: |-
      対象: 共通（単体 HTML・React）
      画面の見た目の値を、トークンの名前で参照する。
      名前と段階は単体 HTML も React も同じにする。
  - id: token-name-01
    group: トークンの名前
    name: セマンティックトークンは shadcn の名前
    body: |-
      - セマンティックトークンの名前は、shadcn の名前に統一する。
        単体 HTML も同じ名前にする。
        - 色: `background`・`foreground`・`card`・`popover`・`primary`・`primary-foreground`・`secondary`・`muted`・`muted-foreground`・`accent`・`destructive`・`border`・`input`・`ring`
        - 角丸: `--radius` から `sm`・`md`・`lg`・`xl` を派生する
  - id: token-name-02
    group: トークンの名前
    name: 独自の色の名前を作らない
    body: |-
      - `--color-bg`・`--color-text` のような独自の色の名前を作らない。
        `--color-*` は、Tailwind v4 が色のクラスを生成する名前空間にあたる。
      - 単体 HTML は `:root` の `--background` のように持つ。
        React は Tailwind の `@theme inline` で割り当てる（[Tailwind](id:react-core-tailwind)）。
  - id: token-tier-01
    group: トークンの持ち方
    name: 全てのデザイン値を :root に集約する
    body: |-
      - 全てのデザイン値は、`:root` の Custom Properties に集約する。
        16 進カラー・px 値・フォントスタックをハードコードせず、トークン経由で参照する（単体 HTML は `var(--token)`、React は Tailwind のクラス）。
  - id: token-tier-02
    group: トークンの持ち方
    name: 3 ティアで持つ
    body: |-
      - 3 ティアで持つ。
        - プリミティブ: 生の値（`--blue-500: oklch(...)`）
        - セマンティック: 用途（`--background`・`--foreground`・`--primary`・`--border`）
        - 派生: セマンティックから生成する値（hover・subtle・border など）
  - id: token-tier-03
    group: トークンの持ち方
    name: 派生色の作り方
    body: |-
      - 派生色は、`color-mix(in oklab, ...)` か相対カラー（`oklch(from var(--x) ...)`）で作る。
  - id: token-tier-04
    group: トークンの持ち方
    name: "@property での登録"
    body: |-
      - アニメーションさせるトークンと型を固めるトークンは、`@property` で登録する。
        `syntax` と `inherits` は必須で、`syntax` が `*` 以外なら `initial-value` も必須にする。
  - id: token-theme-01
    group: ライトとダーク
    name: ライトとダークの両方に対応する
    body: |-
      - ライトとダークの両方に対応する。
        片方だけにするのは、デザイン方針（`設計書/デザイン方針`）の明暗に理由を記載したときだけ。
  - id: token-scale-01
    group: トークンの段階
    name: Tailwind の既定の段階を採る
    body: |-
      - 余白・文字・角丸の段階は、Tailwind の既定を採る。
        - 余白: 0.25rem 刻み
        - 文字: `text-xs` から
        - 角丸: `--radius` から派生する
      - 単体 HTML も同じ段階の値を `:root` に置く。
  - id: token-scale-02
    group: トークンの段階
    name: 変える値はデザイン方針に記載する
    body: |-
      - 既定から変える値だけを、プロジェクトのデザイン方針（`設計書/デザイン方針`）に記載する。
        規約には値を記載しない。
  - id: css-layer-01
    group: CSS のレイヤー
    name: React は Tailwind の既定に従う
    body: |-
      - React は、Tailwind の既定のレイヤーに従う。
        Tailwind の前後に独自のレイヤーを差し込まない。
  - id: css-layer-02
    group: CSS のレイヤー
    name: 単体 HTML は 6 レイヤー
    body: |-
      - 単体 HTML は、`@layer reset, tokens, base, layout, components, utilities;` の 6 レイヤーにする（[レイヤー構成](id:html-css-layers)）。
