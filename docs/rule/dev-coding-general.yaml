# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: dev-coding-general
kind: rule
name: コーディング全般における規約
description: 例外・フォールバック・定数・識別子・コメント・外部入力・ログ・タイムスタンプについて言語を問わず守るコーディングの決まりを定め、コードを記載する・レビューするときに参照する。
aliases:
  - dev/コーディング全般
tags:
  - name: scope:dev
  - name: topic:エラー
  - name: topic:コマンド
  - name: topic:コメント
  - name: topic:タイムスタンプ
  - name: topic:パス
  - name: topic:フォールバック
  - name: topic:ログ
  - name: topic:例外
  - name: topic:定数
  - name: topic:履歴
  - name: topic:日本語
  - name: topic:英語
  - name: topic:設計書
  - name: topic:識別子
  - name: action:コーディング
    main: true
  - name: action:検証
  - name: action:秘匿
status: current
visibility: internal
rev: 7
last_reviewed: '2026-11-05'
items:
  - id: overview
    name: 概要
    body: |-
      <!-- ただし、各言語で固有のルールがある場合は、それを優先すること -->
  - id: exception-handling-01
    group: 例外ハンドル・エラーは握りつぶさない
    name: 例外ハンドルは必要な場面のみ
    body: |-
      - 例外ハンドル（try-except など）は必要な場面にだけ実装する
  - id: exception-handling-02
    group: 例外ハンドル・エラーは握りつぶさない
    name: 例外を握りつぶさない
    body: |-
      - 例外をもし実装する場合、握りつぶさないこと（エラーで画面が落ちてよい）
        - ログを出して再送出するための捕捉はOK
  - id: fallback-01
    group: フォールバック仕様
    name: フォールバック値を設けない
    body: |-
      - 特定の読み込みが失敗したときのフォールバック値などは極力設けない。
        - 読み込まれない=ソースコードや環境の不具合のため気づけるようにエラーとすべき
      - 配置するかは判定フローチャート [フォールバックを置くか](id:flowchart-fallback) で判定する
  - id: constant-01
    group: 定数関連
    name: 定数は外だしする
    body: |-
      - 定数はハードコードせず、配置先を [設定値の置き場所](id:flowchart-config-location) で決めて外だしする
  - id: constant-02
    group: 定数関連
    name: 資源の値は導き方に従う
    body: |-
      - タイムアウト・リトライ・上限の値は、規約 [資源の値の決め方](id:dev-resource-values) で導く
  - id: identifier-language-01
    group: 識別子の言語
    name: 識別子は英語
    body: |-
      - コードの識別子・Enum の値・定数は英語で記載する
        - NG例: `status = "完了"`、OK例: `status = "done"`
  - id: source-comment-01
    group: ソースコード内コメント
    name: コメントに履歴を記載しない
    body: |-
      - コメントに履歴・経緯・背景は記載せず、コードの現在の動作だけを記載する
        - NG例: `PRXXXで編集`・`旧 xxx～`・`以前は xxx だったが yyy の理由で変更`
  - id: source-comment-02
    group: ソースコード内コメント
    name: 設計書への参照を記載しない
    body: |-
      - 設計書・ドキュメントへの参照は記載しない（NG例: `仕様は dev/設計書/xxx.md を参照`）
        - 実装から仕様を探すときは、関数名・論理名で設計書側から逆引きする
  - id: source-comment-03
    group: ソースコード内コメント
    name: コメントは日本語
    body: |-
      - コメントは日本語で記載する
        - Windows の `.bat` など、日本語で動かなくなるファイルは除く
  - id: external-input-01
    group: 外部入力
    name: 外部コマンドの呼び方
    body: |-
      - 外部コマンドは、ライブラリで済むなら呼ばない
  - id: external-input-02
    group: 外部入力
    name: "-- の後ろに配置する"
    body: |-
      - 外部から来た値をコマンドの引数にするときは、オプションと解釈されないよう `--` の後ろに配置する（コマンドが対応している場合）
  - id: external-input-03
    group: 外部入力
    name: 外部名からのパスの検証
    body: |-
      - 外部から受け取った名前でファイルのパスを組むときは、解決した後に基準のフォルダの配下にあることを確認する
  - id: log-01
    group: ログ
    name: ログに秘匿値を入れない
    body: |-
      - ログのメッセージと構造化引数に秘匿値（パスワード・API キー・トークン）を入れない
      - レベル・出すログ・そのほかの出してはいけないデータは規約 [ログのレベルと記載方法](id:dev-logging) に従う
  - id: timestamp-02
    group: タイムスタンプ
    name: 場所別のタイムスタンプ規約
    body: |-
      <!-- table: data -->

      | 場所 | 規約 |
      | --- | --- |
      | ストレージ（`*.jsonl`・`*.yaml`・DB） | UTC タイムゾーン付き ISO8601（`2026-05-24T05:18:02+00:00`） |
      | UI 表示（HTML・dev 画面） | JST に変換（`05/24 14:18:02 JST`） |
      | CLI・バッチのログ（ユーザーが目で確認するログ） | JST タイムゾーン付きか、UTC なら `+00:00` を明示 |
      | コミットメッセージ・PR タイトル・コメント | JST の日付（例: 「2026-05-24 に発生した障害」） |

      <!-- /table -->
