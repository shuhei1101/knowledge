items:
  - id: auth-client-01
    group: app/(shared)/auth/client.ts — クライアント側 useSession
    name: クライアント側の hook
    body: |-
      - ブラウザから Better Auth のセッションを参照・操作する hook。
  - id: auth-client-02
    group: app/(shared)/auth/client.ts — クライアント側 useSession
    name: 配置と use client
    body: |-
      - 配置は `app/(shared)/auth/client.ts`（ファイル冒頭 `'use client'`）
  - id: auth-client-03
    group: app/(shared)/auth/client.ts — クライアント側 useSession
    name: baseURL は環境変数経由
    body: |-
      - `baseURL` は `NEXT_PUBLIC_APP_URL` 経由
  - id: auth-client-04
    group: app/(shared)/auth/client.ts — クライアント側 useSession
    name: Server Component から import しない
    body: |-
      - クライアント専用 — Server Component から import しない
  - id: auth-client-05
    group: app/(shared)/auth/client.ts — クライアント側 useSession
    name: createAuthClient の公開
    body: |-
      - `better-auth/react` の `createAuthClient` を `authClient` として export し、`useSession` を再 export する
  - id: auth-client-06
    group: app/(shared)/auth/client.ts — クライアント側 useSession
    name: isPending で loading を扱う
    body: |-
      - `isPending` で loading 状態を扱う
