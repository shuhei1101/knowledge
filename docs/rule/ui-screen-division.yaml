items:
  - id: overview
    name: 概要
    body: |-
      対象は共通（単体 HTML・React）。
      機能・情報や操作を同じ画面・タブ・パネル・モーダル・別画面のどれで扱うかと、画面間の移り方を決める。
      出典の略号は次の表のとおり（リンクはメタデータの `sources`）。

      <!-- table: data -->

      | 略号 | 出典 |
      | --- | --- |
      | N | Nielsen Norman Group |
      | M | Microsoft |
      | A | Apple Human Interface Guidelines |
      | D | Android Developers |
      | C | IBM Carbon Design System |
      | G | GOV.UK Service Manual |
      | GL | GitLab Pajamas |

      <!-- /table -->

      数値は出典の値で、目安として扱う。
  - id: function-placement-01
    group: 機能・情報の配置方法
    name: 機能・情報の配置方法の判断図
    body: |-
      <!-- map: {"title": "機能・情報の配置方法"} -->

      ```mermaid
      flowchart TB
        start(("機能・情報の配置方法を決めたい"))
        q1{"利用者が同時に見比べるか、一方を参照しながらもう一方を操作するか"}
        r1(["同じ画面に並べる"])
        q2{"一覧から 1 件を選んで中身を確認する関係か"}
        r2(["一覧と詳細を並べる"])
        q3{"決まった順番で進める手続きか"}
        r3(["ステップで進む画面にする"])
        q4{"同じ内容の見せ方の切り替えや絞り込みか"}
        r4(["同じ画面の中で表示を切り替える"])
        q5{"同じ対象について、関連するが別のまとまりか"}
        r5(["画面内のタブにする"])
        r6(["別の画面にし、ナビゲーションで行き来する"])
        start --> q1
        q1 -->|YES| r1
        q1 -->|NO| q2
        q2 -->|NO| q3
        q2 -->|YES| r2
        q3 -->|YES| r3
        q3 -->|NO| q4
        q4 -->|NO| q5
        q4 -->|YES| r4
        q5 -->|YES| r5
        q5 -->|NO| r6
      ```

      <!-- /map -->
  - id: function-placement-02
    group: 機能・情報の配置方法
    name: 機能・情報の配置方法の表
    body: |-
      <!-- table: data -->

      | 判定 | YES のとき | 出典 |
      | --- | --- | --- |
      | 利用者が同時に見比べるか、一方を参照しながらもう一方を操作するか | 同じ画面に並べる。片方が主を補う情報なら、主の横に補助の区画を配置する。狭い幅では、補助の区画は主の下か、下から出す面に配置する | N / C / D |
      | 一覧から 1 件を選んで中身を確認する関係か | 一覧と詳細を並べる。狭い幅では別画面に分け、戻る操作で一覧へ戻す | M / D |
      | 決まった順番で進める手続きか | ステップで進む画面にする。不慣れな利用者がたまに行う手続きは 1 画面 1 問から始め、慣れた利用者が繰り返す手続きは使用され方を確認してからまとめる | C / N / G |
      | 同じ内容の見せ方の切り替えや絞り込みか | 同じ画面の中で表示を切り替える | C |
      | 同じ対象について、関連するが別のまとまりか | 画面内のタブにする | C / N |
      | どれにも該当しない | 別の画面にし、ナビゲーションで行き来する | M |

      <!-- /table -->
  - id: operation-placement-01
    group: 操作の配置先
    name: 操作の配置先の判断
    body: |-
      作成・編集・確認の操作に適用する。

      <!-- map: {"title": "操作の配置先"} -->

      ```mermaid
      flowchart TB
        start(("操作の配置先を決めたい"))
        q1{"取り消せない操作の確認か、続けるのに必須の入力か"}
        r1(["モーダル"])
        q2{"1 件をすばやく追加・修正するだけか"}
        r2(["その場（行の中など）で行う"])
        q3{"元の画面を参照しながら入力するか"}
        r3(["画面の横に出すパネル"])
        q4{"入力が 2 項目ほどで、スクロールせずに収まるか"}
        r4(["モーダル"])
        r5(["別画面"])
        start --> q1
        q1 -->|YES| r1
        q1 -->|NO| q2
        q2 -->|NO| q3
        q2 -->|YES| r2
        q3 -->|YES| r3
        q3 -->|NO| q4
        q4 -->|NO| r5
        q4 -->|YES| r4
      ```

      <!-- /map -->
  - id: operation-placement-02
    group: 操作の配置先
    name: 操作の配置先の判定表
    body: |-
      <!-- table: data -->

      | 判定 | YES のとき | 出典 |
      | --- | --- | --- |
      | 取り消せない操作の確認か、続けるのに必須の入力か | モーダル | N / C / A |
      | 1 件をすばやく追加・修正するだけか | その場（行の中など）で行う | C |
      | 元の画面を参照しながら入力するか | 画面の横に出すパネル | C |
      | 入力が 2 項目ほどで、スクロールせずに収まるか | モーダル | C |
      | どれにも該当しない（区画に分かれる・複数のステップがある・使用し始める前に必ず済ませる） | 別画面 | C |

      <!-- /table -->
  - id: operation-placement-03
    group: 操作の配置先
    name: 編集は作成と同じ配置方法
    body: |-
      編集は作成と同じ配置方法にし、編集できる項目の数が作成と大きく違うときだけ変える（C）。
  - id: structure-transition-01
    group: 構造と遷移
    name: 構造と遷移の表
    body: |-
      <!-- table: data -->

      | 要素 | 出典 |
      | --- | --- |
      | 並列の画面が 7 つ以下で、どの順でも参照され、親子関係が無いなら、直接行き来できる並びにする。順序や親子関係がある、または 8 つ以上なら階層に分ける | M |
      | 行き来する画面が 5 つを超えるなら、横のメニューにする | M / C |
      | 横のメニューは 2 階層まで。3 階層目は画面内のタブにする | C |
      | 階層が 3 以上になるなら、現在地までの経路（パンくず）を出す | M |
      | タブやメニューで切り替える先には、同じ親に属する画面だけを並べる | M |
      | 関連する項目へ移るのに、一度上の画面へ戻らせない。一覧と詳細を並べるか、前後へ移る手段を配置する | M |
      | 戻る操作は確認してきた順に戻る。ダイアログやパネルは閉じるだけにして履歴に追加しない。一覧と詳細の中で項目を切り替えるのも追加しない | M / D |
      | 画面を直接開いたときも、辿って来たときと同じように上の画面へ戻れる | D |
      | 開閉で隠す階層は 2 階層まで。行き来しながら見直し合う項目は、隠さず 1 画面に配置する | N |
      | 幅が変わっても選んでいた項目を保ち、狭くなるときは確認していた側を残す | D |
      | 選ぶ部品は、選んだ結果が出る場所より上に配置する | - |

      <!-- /table -->
  - id: tab-01
    group: タブ
    name: タブの決まり
    body: |-
      <!-- table: data -->

      | 要素 | 出典 |
      | --- | --- |
      | 最初に開くタブに主な内容を配置し、他のタブには補足を配置する | N |
      | 1 つのタブの並びに、画面内の切り替えと別画面への移動を混ぜない。どのタブも同じ見た目・同じ動きにする | N |
      | 収まりきらずに隠れるほどの数のタブにしない | A / N |
      | タブは移動にだけ使用し、操作のボタンを配置しない | A |
      | 中身が無くてもタブを非表示にしたり押せなくしたりせず、中身が無い理由をタブの中に出す | A |
      | 別の中身へ切り替えるときはタブ、同じ中身の見せ方を変えるときはセグメント（ラジオ相当）を使用する。タブを 2 階層に重ねない | GL |
      | 各タブに、その中身の件数を出す | - |

      <!-- /table -->
  - id: modal-01
    group: モーダル
    name: モーダルの決まり
    body: |-
      <!-- table: data -->

      | 要素 | 出典 |
      | --- | --- |
      | 判断に外の情報が要る作業、今の作業と関係のない案内、繰り返し行う作業には使用しない | N / C |
      | 利用者の操作をきっかけにしてだけ開く。裏で動く処理の通知は通知で出す | C |
      | モーダルから別のモーダルを開かない。モーダルの中を階層にしない | C / A |
      | 大きいモーダルにも収まらない内容は別画面にする | C |
      | 入力した内容が消える閉じ方には確認を挟む | A |

      <!-- /table -->
