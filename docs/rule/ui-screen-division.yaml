items:
  - id: overview
    name: 概要
    body: |-
      対象: 共通（単体 HTML・React）
      機能・情報や操作を同じ画面・タブ・パネル・モーダル・別画面のどれで扱うかと、画面間の移り方を決める。
      出典の略号は N = Nielsen Norman Group、M = Microsoft、A = Apple Human Interface Guidelines、D = Android Developers、C = IBM Carbon Design System、G = GOV.UK Service Manual、GL = GitLab Pajamas（リンクはメタデータの `sources`）。
      数値は出典の値で、目安として扱う。
