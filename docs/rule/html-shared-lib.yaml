# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: html-shared-lib
kind: rule
name: shared/lib
description: 全画面で使う汎用ユーティリティを置く shared/lib の決まりを定める。
tags:
  - name: scope:html
  - name: topic:shared
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      全画面で使う汎用ユーティリティ（フォーマッタ・ログ・WebSocket クライアント等）。
  - id: shared-lib-01
    group: shared/lib
    name: DOM を触らない純粋なもの
    body: |-
      - DOM を触らず、特定画面に依存しない純粋なものだけ置く。
  - id: shared-lib-02
    group: shared/lib
    name: 2 回書きそうなら集約
    body: |-
      - 同じ処理（整形・エスケープ・日付変換など）を画面で 2 回書きそうなら、ここへ集約してから使う。
