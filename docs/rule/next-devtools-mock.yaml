# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-devtools-mock
kind: rule
name: Next.js App Router — Mocking (MSW)
description: MSW で開発中・テスト中の API をモックする handler の共有と運用を定める。
tags:
  - name: scope:next
  - name: topic:devtools
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      > **対象**: 開発中・テスト中の API モック。MSW で fetch をネットワークレイヤで intercept する。
  - id: mocking-msw-01
    group: Next.js App Router — Mocking (MSW)
    name: handler を Storybook・Vitest・Playwright で共有
    body: |-
      - 同じ handler 定義を Storybook・Vitest・Playwright で再利用

      ```bash
      # .env.local
      NEXT_PUBLIC_API_MOCKING=enabled
      ```
  - id: mocking-msw-02
    group: Next.js App Router — Mocking (MSW)
    name: テスト間の handler の後始末
    body: |-
      `afterEach(() => server.resetHandlers())` で上書きが他テストに漏れない。テストでは handler の無いリクエストをエラーにする。

      通常 E2E は 本物の API（dev server） に対して走るので MSW は不要。

      ただし「特定のレスポンスを返したい・障害をシミュレート」したい時は `page.route()` で fetch を intercept する。
      MSW の handler を共有したいなら `@msw/playwright`。
  - id: mocking-msw-03
    group: Next.js App Router — Mocking (MSW)
    name: handlers.ts を source of truth にする
    body: |-
      - `mocks/handlers.ts` を 1 つの source of truth にする
  - id: mocking-msw-04
    group: Next.js App Router — Mocking (MSW)
    name: 実際のレスポンス形式に合わせる
    body: |-
      - 真のレスポンス形式（封筒 `{ data, meta }` / `{ error }`）に合わせる
  - id: mocking-msw-05
    group: Next.js App Router — Mocking (MSW)
    name: 成功・失敗・空・遅延のバリエーション
    body: |-
      - 「成功 / 失敗 / 空 / ネットワーク遅延」のバリエーションを用意
  - id: mocking-msw-06
    group: Next.js App Router — Mocking (MSW)
    name: 必要なエンドポイントを網羅
    body: |-
      - 各画面で必要なエンドポイントを網羅
