# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: html-commonization
kind: rule
name: 共通化の判断（どこに置くか）
description: 新しい部品・関数・スタイルを記載する前に共通化を考える決まりと、使う範囲ごとの置き場所を定める。
tags:
  - name: scope:html
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: commonization-placement-01
    group: 共通化の判断（どこに置くか）
    name: 共通化を先に考える
    body: |-
      - 新しい部品・関数・スタイルを書く前に、共通化できるかを先に考える。
        - 同じコードを 2 か所に書きそうになったら共通化の合図。
        - 画面にロジックやスタイルを重複させない。
  - id: commonization-placement-02
    group: 共通化の判断（どこに置くか）
    name: 使う範囲が狭い階層に置く
    body: |-
      - 置き場所は「使う範囲がいちばん狭い階層」を選ぶ。
        - 範囲が広がったら上の階層へ昇格する。
  - id: commonization-placement-03
    group: 共通化の判断（どこに置くか）
    name: 置き場所の表
    body: |-
      | 使う範囲                                    | 置き場所                                                                                           |
      | ------------------------------------------- | -------------------------------------------------------------------------------------------------- |
      | その 1 画面だけ                             | 画面直下（`pages/{domain}/{screen}/`）に直接書く                                                   |
      | 同じ画面の複数タブ / 同じドメインの複数画面 | `pages/{domain}/_shared/`                                                                          |
      | ドメインをまたいで使える                    | `shared/`（UI 部品は `shared/components/`、汎用関数は `shared/lib/`、定数・環境は `shared/core/`） |
