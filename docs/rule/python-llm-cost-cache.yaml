# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: python-llm-cost-cache
kind: rule
name: トークン管理とコスト最適化
description: LLM のトークン管理、max_tokens の絞り方、プロンプトキャッシュの設計、その他のコスト最適化の定石を定め、LLM 呼び出しのコストを抑えるときに参照する。
aliases:
  - コストとキャッシュ
inject_when:
  field: text
  op: contains
  values:
    - Python
    - '.py'
    - pytest
    - FastAPI
    - Pydantic
tags:
  - name: scope:python
  - name: topic:llm
  - name: topic:api
  - name: topic:キャッシュ
  - name: topic:コスト
    main: true
  - name: topic:システム
  - name: topic:トークン
  - name: topic:バッチ
  - name: topic:プロバイダー
  - name: topic:プロンプト
  - name: topic:メッセージ
  - name: topic:モデル
  - name: topic:履歴
  - name: topic:接頭辞
  - name: action:管理
  - name: action:計測
  - name: action:設計
status: current
visibility: internal
rev: 5
last_reviewed: '2026-11-19'
sources:
  - title: 'Anthropic: Prompt caching'
    url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
    note: 最小長・割引率・保持時間・書き込みの費用・ブレイクポイント
  - title: 'OpenAI: Prompt caching'
    url: https://developers.openai.com/api/docs/guides/prompt-caching
    note: 最小長・割引率・保持時間・書き込みの費用・ブレイクポイント・世代の境のモデル
items:
  - id: token-cost-01
    group: トークン管理とコスト最適化
    name: 最適化前に計測する
    body: |-
      - 最適化前にまず計測する。
        呼び出しごとの provider / model / input_tokens / output_tokens を構造化ログへ出し、JSON Lines を集計して日次コストを出す
  - id: max-tokens-01
    group: max_tokens
    name: max_tokens を絞る
    body: |-
      用途に応じて絞る。

      <!-- table: {"kind": "data"} -->

      | 用途         | 目安      |
      | ------------ | --------- |
      | Yes/No 判定  | 50        |
      | 短い分類タグ | 100       |
      | 1 段落の要約 | 300       |
      | 構造化抽出   | 800〜1024 |
      | 長文生成     | 2048+     |

      <!-- /table -->
  - id: prompt-cache-01
    group: プロンプトキャッシュの設計（最重要）
    name: 先頭の共通プレフィックス
    body: |-
      キャッシュは「先頭から共通したプレフィックス」だけに有効になる。
      固定値は上、動的値は下に配置する。

      | 位置       | 内容                                                 |
      | ---------- | ---------------------------------------------------- |
      | 上（先頭） | 不変のキャラ設定 / 役割 / 出力スキーマ / few-shot 例 |
      | 中         | セッション単位で固定（要約・ペルソナ）               |
      | 下（末尾） | リクエストごとに変わる値（直近履歴・ユーザー入力）   |
  - id: prompt-cache-02
    group: プロンプトキャッシュの設計（最重要）
    name: system に動的値を入れない
    body: '- system に timestamp 等の動的値を埋め込まない（1 文字の差で以降全部ミス）'
  - id: prompt-cache-03
    group: プロンプトキャッシュの設計（最重要）
    name: messages の順序を保つ
    body: '- messages は前の履歴ほど上、順序を入れ替えない'
  - id: prompt-cache-04
    group: プロンプトキャッシュの設計（最重要）
    name: プロバイダ別のキャッシュ表
    body: |-
      | Provider  | 仕組み                                                 | 条件（最小長・割引率・保持時間）                                                                  |
      | --------- | ------------------------------------------------------ | ------------------------------------------------------------------------------------------------- |
      | Anthropic | `cache_control: {"type": "ephemeral"}` を指定（リクエスト直下なら自動、ブロック単位でも可） | 公式ドキュメント          |
      | OpenAI    | モデルの世代で分かれる。前の世代は自動（同一プレフィックスで有効になる、コード変更不要）。後の世代は書き込みに費用がかかり、`prompt_cache_breakpoint`・`prompt_cache_options.mode` で明示のブレイクポイントを指定できる（Responses API） | 公式ドキュメント（世代の境のモデルを含む） |
  - id: prompt-cache-07
    group: プロンプトキャッシュの設計（最重要）
    name: 毎回変わる末尾を書き込みから除外する
    body: |-
      - 自動の区切り（Anthropic のリクエスト直下の `cache_control`・OpenAI の後の世代の `implicit`）は毎回変わる末尾まで書き込み、読み出されない書き込みの費用がかかる
      - 変わらない部分の最後に明示のブレイクポイントを指定する。後ろは通常の入力の単価になる
  - id: prompt-cache-05
    group: プロンプトキャッシュの設計（最重要）
    name: 1 回きりの用途では有効にならない
    body: '- 1 回しか呼ばない用途では有効にならない（Anthropic と OpenAI の後の世代はキャッシュの書き込みが通常の入力より割高）'
  - id: prompt-cache-08
    group: プロンプトキャッシュの設計（最重要）
    name: 呼び出しの間隔と保持の時間を比べる
    body: '- 呼び出しの間隔が保持の時間（プロバイダー・モデル・指定で変わる。公式ドキュメント）より長い用途では、キャッシュを前提にしない（読み出されず、書き込みの費用だけがかかる）'
  - id: prompt-cache-06
    group: プロンプトキャッシュの設計（最重要）
    name: キャッシュ使用量の確認
    body: '- 使用量は読み出しと書き込みのトークンをログ。Anthropic は `cache_read_input_tokens`・`cache_creation_input_tokens`、OpenAI は Chat Completions が `prompt_tokens_details.cached_tokens`、Responses API が `input_tokens_details.cached_tokens`・`input_tokens_details.cache_write_tokens`'
  - id: prompt-cache-09
    group: プロンプトキャッシュの設計（最重要）
    name: エイリアスのモデルは実測する
    body: '- 中身のモデルが入れ替わるエイリアスのモデルは、入れ替わるとキャッシュの決まり（書き込みの費用・ブレイクポイント）も変わりうるので、使用量のログで書き込みと読み出しを実測する'
  - id: other-practices-01
    group: その他の定石
    name: モデルは小さい方から選ぶ
    body: '- モデル選定: 最小モデルで合格できないか試してから上げる（分類 → 小さいモデル、複雑な推論 → 上位モデル）'
  - id: other-practices-02
    group: その他の定石
    name: Batch API
    body: '- Batch API: リアルタイム不要な大量処理は割り引かれる（割引率と処理期限は各社の公式ドキュメント）'
  - id: other-practices-03
    group: その他の定石
    name: 履歴の刈り取り
    body: '- 履歴の刈り取り: 直近 N 件 + それより前の履歴は要約（要約は小さいモデルで）'
