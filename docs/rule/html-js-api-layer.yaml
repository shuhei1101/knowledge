# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: html-js-api-layer
kind: rule
name: API 層
description: 通信を api 層の fetch ラッパーに集約し、型を openapi.json から生成する決まりを定める。
tags:
  - name: scope:html
  - name: topic:js
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: api-layer-01
    group: API 層
    name: 通信は fetch ラッパーに集約
    body: |-
      - 通信は api 層の fetch ラッパーに集約する。
        - （ローカルツールの場合）同一オリジン相対パス（`/api/...`）で叩く
  - id: api-layer-02
    group: API 層
    name: 型付き Promise を返す
    body: |-
      - 型付き Promise を返す。
  - id: api-layer-03
    group: API 層
    name: 型は openapi.json から生成
    body: |-
      - 型は openapi.json から生成して参照する（クライアントは生成せず、型だけ）。
        - UI から `fetch` を直叩きしない。
