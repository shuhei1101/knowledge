id: next-frontend-form-ts
kind: rule
name: "{feature}/form.ts — Zod schema + Type"
description: フィーチャ直下の form.ts に Zod schema と型を置く決まりを定める。
tags:
  - name: scope:next
  - name: topic:frontend
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: form-ts-01
    group: "{feature}/form.ts — Zod schema + Type"
    name: フィーチャ直下に配置
    body: |-
      - 配置: フィーチャ直下（new / edit 共用）
  - id: form-ts-02
    group: "{feature}/form.ts — Zod schema + Type"
    name: defaultXxxForm を export
    body: |-
      - `defaultXxxForm` を export（new 画面で使用）
  - id: form-ts-03
    group: "{feature}/form.ts — Zod schema + Type"
    name: エラーメッセージは日本語
    body: |-
      - エラーメッセージは日本語
  - id: form-ts-04
    group: "{feature}/form.ts — Zod schema + Type"
    name: 共通プリミティブの置き場所
    body: |-
      - 共通プリミティブ（`IdSchema` / `IconIdSchema` 等）は `app/(shared)/schema.ts` に集約
  - id: form-ts-05
    group: "{feature}/form.ts — Zod schema + Type"
    name: schema を別定義しない
    body: |-
      - route.ts / actions.ts で同じ schema を別定義しない（form.ts を共用）
