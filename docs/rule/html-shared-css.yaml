# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: html-shared-css
kind: rule
name: shared/css
description: コンポーネントに属さない基盤スタイルを置く shared/css の決まりを定める。
tags:
  - name: scope:html
  - name: topic:shared
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: shared-css-01
    group: shared/css
    name: 基盤スタイルだけを置く
    body: |-
      - コンポーネントに属さない基盤スタイルだけを置く（コンポーネント CSS は `shared/components/`）
  - id: shared-css-02
    group: shared/css
    name: 各ファイルの役割の参照先
    body: |-
      - 各ファイルの役割は `html/フォルダ構成.md` のツリーに従う
  - id: shared-css-03
    group: shared/css
    name: エントリポイントは layers.css
    body: |-
      - エントリポイントは `layers.css`（`@layer` 順序宣言 + `@import` 集約）
