# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-frontend-loading-button
kind: rule
name: "`<LoadingButton>` — 非同期ボタン"
description: mutation を伴うボタンに使う非同期ボタン LoadingButton の使い方を定める。
tags:
  - name: scope:next
  - name: topic:frontend
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: loading-button-01
    group: "`<LoadingButton>` — 非同期ボタン"
    name: mutation を伴うボタンに使う
    body: |-
      - mutation を伴うボタンには必ず使う（`<Button>` 直接使用禁止）
  - id: loading-button-02
    group: "`<LoadingButton>` — 非同期ボタン"
    name: isLoading に isPending を渡す
    body: |-
      - `isLoading={isPending}` を渡す（disable + Loader2 spinner 表示）
