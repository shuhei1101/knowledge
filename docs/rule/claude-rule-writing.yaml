description: ユーザー配下のルールに特定のプロジェクトに特化した内容を入れない決まりを定め、ユーザー配下のルールを記載するときに読む。
tags:
  - name: scope:claude
  - name: topic:プロジェクト
  - name: topic:ユーザー
    main: true
  - name: action:特定
