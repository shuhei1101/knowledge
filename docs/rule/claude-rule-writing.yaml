visibility: internal
rev: 3
last_reviewed: '2026-10-24'
items:
  - id: user-rule-writing-01
    group: ユーザ配下ルール記載時の規約
    name: プロジェクト特化の内容は不可
    body: |-
      - 特定のプロジェクトに特化した内容は書かない
        - NG例: 「AITuberプロジェクトに適用するルール」←特定のプロジェクトに特化している
