items:
  - id: plugin-division-01
    group: プラグインの分け方
    name: プラグインは機能ごとに単独
    body: |-
      - プラグインは機能ごとに分ける（利用者が機能ごとのオンオフを選べる）
  - id: plugin-division-02
    group: プラグインの分け方
    name: 文書の MCP のプラグイン
    body: |-
      - 各リポジトリは文書の MCP のプラグインを持たない（[文書の MCP サーバーの設計](id:claude-mcp-docs-server) の `## 登録`）
  - id: template-folder-01
    group: テンプレートフォルダ
    name: 共通の出力をテンプレート化
    body: |-
      - プラグイン内のスキルなどで共通する出力形式や、重複している記載はテンプレート形式を用いる
        - {プラグインフォルダ}/templates/{日本語名}.md
  - id: template-folder-02
    group: テンプレートフォルダ
    name: スキル内の cat 展開
    body: |-
      - スキル内ではcatで展開する

      ```text
      <!-- 任意のスキルファイル -->
      !`cat xxx/xxx.md`
      ```
  - id: hook-folder-01
    group: フックフォルダの定義
    name: フックフォルダの構成
    body: |-
      - フォルダ構成は以下とする
        - {CLAUDE_PLUGIN_ROOT}/hooks/hooks.json
        - {CLAUDE_PLUGIN_ROOT}/hooks/{フック名}/{任意のスクリプトやj2, mdファイル}
          - 例: hooks/pre-tool-use/xxx.py
  - id: constant-management-01
    group: 定数管理ルール
    name: 定数ファイルの用途
    body: |-
      - スキル・エージェントとそこから呼ぶ Bash のコマンドが使用する定数を持つプラグインは、`{CLAUDE_PLUGIN_ROOT}/scripts/constants.sh` を用意する
  - id: constant-management-02
    group: 定数管理ルール
    name: constants.sh の適用ルール
    body: |-
      - `constants.sh` には以下のルールを適用すること
        - `#!/usr/bin/env bash` で始める
        - 定数名にはプラグイン名をアッパースネークケースで付与する（例: `GH_KIT_LABEL_WIP`）
        - 各変数は `echo "export VAR=VALUE" >> "$CLAUDE_ENV_FILE"` で `$CLAUDE_ENV_FILE` に追記する
          - `$CLAUDE_ENV_FILE` は Claude Code が各 Bash コマンドの前に実行する
  - id: constant-management-03
    group: 定数管理ルール
    name: SessionStart での自動実行
    body: |-
      - `hooks/hooks.json` の `SessionStart` フックで `constants.sh` を自動実行する

      ```json
      {
        "hooks": {
          "SessionStart": [
            {
              "hooks": [
                {
                  "_description": "{プラグイン名} 定数をセッション内に展開する",
                  "type": "command",
                  "command": "bash",
                  "args": [
                    "${CLAUDE_PLUGIN_ROOT}/scripts/constants.sh"
                  ]
                }
              ]
            }
          ]
        }
      }
      ```
  - id: constant-management-04
    group: 定数管理ルール
    name: 手動 source の禁止
    body: |-
      - スキル・エージェントファイル内では手動 `source` を呼ばない
  - id: constant-management-05
    group: 定数管理ルール
    name: フックが参照する設定の配置先
    body: |-
      - フックが自分で参照する設定は `constants.sh` に配置しない
        - プラグインと一緒に配る値はプラグイン内のファイルに配置し、フックが `${CLAUDE_PLUGIN_ROOT}` を起点に参照する
        - 利用者の環境ごと・プロジェクトごとに変わる値は、`## 設定ファイル` に従って受け取る
  - id: settings-file-01
    group: 設定ファイル
    name: 設定ファイルの全体方針
    body: |-
      プラグインのフック・スクリプト・MCP サーバーが参照する設定のうち、利用者の環境・プロジェクトで変わるものが対象。
      本体を `${XDG_CONFIG_HOME:-~/.config}` の YAML に記載して受け取る。
  - id: settings-file-02
    group: 設定ファイル
    name: env に配置する設定の指定
    body: |-
      - 既定のパス（`settings-file-03`）と違う場所に配置するときだけ、`{ツール名}_CONFIG` でパスを記載する。
        記載先はユーザースコープの `~/.claude/settings.json` の `env`
        - 環境変数の名前の付け方は [設定値の置き場所](id:flowchart-config-location) に従う
        - プラグインは値の先頭の `~` をホームに展開して参照する
        - `env` のプロジェクトスコープ（`.claude/settings.json` / `.claude/settings.local.json`）には記載しない。
          プロジェクトごとの違いは YAML の `projects` に記載する
        - `env` にパスが無いときは既定のパスを参照し、ファイルも無いときは設定なし（プラグインの既定値）で動く
        - MCP サーバーは常駐で `env` が渡らないため、サーバーを起動する環境に同じ環境変数を指定する。
          `match` に使用する起動したプロジェクトの直下は、[MCP サーバー作成ルール](id:claude-mcp) の常駐サーバーの決まりどおり PreToolUse フックでツールの引数に入れて受ける
  - id: settings-file-03
    group: 設定ファイル
    name: 設定の本体の配置先
    body: |-
      - 本体は `${XDG_CONFIG_HOME:-~/.config}/{プラグイン名}/settings.yaml` に配置する（判定フローチャート『[設定値の置き場所](id:flowchart-config-location)』の環境の値と同じ）
      - 実行中に書き換わる状態・ログは `${XDG_STATE_HOME:-~/.local/state}/{プラグイン名}` に配置する
        - 場所を変えるときだけ `env` の `{ツール名}_STATE_DIR` で上書きする
  - id: settings-file-04
    group: 設定ファイル
    name: サンプルファイルの用意
    body: |-
      - 必要なキーの一覧として、実値を入れないサンプル `settings.sample.yaml` をプラグインの中に配置する
  - id: settings-file-05
    group: 設定ファイル
    name: global と projects の構成
    body: |-
      YAML の最上位に `global` と `projects` を配置する。

      | キー | 中身 |
      | --- | --- |
      | `global` | どのプロジェクトで起動しても有効な値 |
      | `projects` | 要素ごとに `match` と、そのプロジェクトで有効な値を持つ並び |

      `match` は絶対パスかプロジェクト名で記載する。

      | `match` | 該当する条件 |
      | --- | --- |
      | 絶対パス | 起動したプロジェクトの直下（`CLAUDE_PROJECT_DIR`）がそのパスか、その配下のとき。`.claude/worktrees/` の下の worktree も本体のパスで該当する |
      | プロジェクト名 | リポジトリのフォルダ名が一致したとき。worktree は本体のフォルダ名で照合する |

      - `projects` の中の相対パスは、起動したプロジェクトの直下から解決する
      - 該当した `projects` の要素は、並びの順に `global` へ重ねる。
        辞書はキーごとに重ね、並びは `global` の後ろに `projects` の要素を追加する
  - id: settings-file-06
    group: 設定ファイル
    name: 単純な値は env に配置する
    body: |-
      - 単純な値 1 つ（プロジェクトごとに変えない、キーと値で記載できる値）だけを受け取るプラグインは、ユーザースコープの `env` で直接受け取ってよい
        - 受け取る値が増えたり、プロジェクトごとに変える値ができたりしたら、設定ファイルへ移す（`settings-file-08` に該当する値は移さない）

      ```yaml
      global:
        term_sources:
          - ~/notes/terms.md
      projects:
        - match: knowledge
          term_sources:
            - docs/terms.md
      ```
  - id: settings-file-07
    group: 設定ファイル
    name: リポジトリの設定ファイルとバージョン
    body: |-
      - リポジトリと一緒に変わる設定の配置先と、設定ファイルの `version`・移し替えは、[YAML](id:dev-yaml) の `## 設定ファイル` に従う。
        `version` は設定ファイルのもので、プラグインの manifest には適用しない（`no-version-01`）。
  - id: settings-file-08
    group: 設定ファイル
    name: YAML を参照できない仕組みも参照する値は env に配置する
    body: |-
      - 設定ファイルを持つプラグインでも、`.mcp.json` など YAML を参照できない仕組みも参照する値は、ユーザースコープの `env` に配置する。
        例は [MCP サーバー作成ルール](id:claude-mcp) の `## 登録` の `{ツール名}_PORT`
        - サーバーと `.mcp.json` の両方が同じ `env` を参照する
        - 同じ値を設定ファイルと `env` の 2 か所に記載しない
  - id: no-version-01
    group: version を配置しない規約
    name: version を配置しない
    body: |-
      `.claude-plugin/marketplace.json` に載るプラグインは、`plugins[].version` と `plugin.json` の `version` のどちらにも値を配置しない。
  - id: reload-timing-01
    group: 反映を叩くタイミング
    name: 反映のタイミング
    body: |-
      稼働中のワークツリーへ入った `plugins/` 配下とリポジトリの直下の `.claude-plugin/` 配下の変更は、手で反映しない。
      モニターが `update_plugins` と同じ更新を済ませてから再起動する。
      自動で反映されないとき（`local` で作業ツリーを修正したとき 等）は、設定 `rule_inject.source` によらず手で反映する。
      変更を commit した後に、MCP ツール `update_plugins` を実行して認証領域へ反映する。
      どちらの出所でも、実体は認証領域の cache（`{認証領域}/plugins/cache/{マーケットプレース名}/{名前}/{version}`）の複製になる。
      修正した作業ツリーがそのまま参照されることはない。
      `update_plugins` は、Claude 種別のアカウントの認証領域ごとに実行する。
      実行の順は `claude plugin marketplace update` → `claude plugin update`。
  - id: mcp-delivery-01
    group: MCP の配り方
    name: プラグインの .mcp.json で配る
    body: |-
      MCP を持つプラグインは、プラグインの `.mcp.json` で配る。
      接続先の記載方法は [MCP サーバー作成ルール](id:claude-mcp) の `## 登録`、配り方の選び方は判定フローチャート [MCP・フックの渡し方](id:flowchart-mcp-hook-delivery) に従う。
