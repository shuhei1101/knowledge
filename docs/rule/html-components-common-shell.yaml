    name: 共通シェルに内蔵する
    body: |-
      - ヘッダー・サイドメニュー等 は共通シェル（`app-shell`）に内蔵する。
        - 他にも各画面共通のコンポーネントはここに内蔵してよいものとする
  - id: common-shell-02
    group: 共通シェル
    name: 各画面は枠を読み込むだけ
    body: |-
      - 各画面はこの枠を読み込むだけで、それらが自動で付く。
