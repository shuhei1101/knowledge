# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: dev-content-location
kind: rule
name: コンテンツの置き場所
description: リポジトリ直下の content/ に配置する、コードではない原本と、配置しない値と、data/ に配置した大きいファイルを復元するための取得元の記載を定め、プロンプトや素材の一覧などを配置する場所を決めるときと、大きいファイルのメタデータを設計するときに参照する。
tags:
  - name: scope:dev
  - name: topic:カタログ
  - name: topic:コンテンツ
    main: true
  - name: topic:コード
  - name: topic:プロンプト
  - name: topic:モデル
  - name: topic:リポジトリ
  - name: topic:単価
  - name: topic:正本
  - name: action:定義
  - name: action:評価
  - name: topic:メタデータ
  - name: action:復元
status: current
visibility: internal
rev: 6
last_reviewed: '2026-11-22'
items:
  - id: overview
    name: 概要
    body: |-
      リポジトリ直下の `content/` に、Git で差分を確認したい、コードではない原本を配置する。

      `content/` に配置するのは、アプリが素材・定義として参照する本体で、設定の 3 レイヤー（既定値・環境の値・checkout の上書き）で上書きしないもの。
  - id: put-items-01
    group: 配置するもの
    name: プロンプト
    body: |-
      - プロンプト（`content/prompts/`）
  - id: put-items-02
    group: 配置するもの
    name: キャラクターなどの定義
    body: |-
      - キャラクターなどの定義
  - id: put-items-03
    group: 配置するもの
    name: 素材の一覧と説明文
    body: |-
      - 素材の一覧と説明文
  - id: put-items-04
    group: 配置するもの
    name: 評価のケース
    body: |-
      - 評価のケース
  - id: put-items-05
    group: 配置するもの
    name: 禁止語などのカタログ
    body: |-
      - 禁止語などのカタログ
  - id: put-items-06
    group: 配置するもの
    name: モデルと単価の一覧
    body: |-
      - モデルと単価の一覧
  - id: put-items-07
    group: 配置するもの
    name: アプリが実行中に書き換える定義・メタデータ・一覧
    body: |-
      - アプリが実行中に書き換える定義・メタデータ・一覧
        - 書き込みのたびに、稼働しているブランチへ直コミット（project-index の `write_docs` の `commit`）か通常のコミットで残す
  - id: put-items-08
    group: 配置するもの
    name: メタデータとファイルの本体を分ける
    body: |-
      アセットのようにメタデータと画像・音声のファイルを持つものは、メタデータの YAML だけを `content/` に配置し、ファイルは `data/` に配置する。
  - id: not-put-items-01
    group: 配置しないもの
    name: content/ に配置しない値
    body: |-
      次の値は `content/` に配置せず、[設定値の置き場所](id:flowchart-config-location) が決めた場所に配置する。
  - id: not-put-items-02
    group: 配置しないもの
    name: 値ごとの配置先
    body: |-
      | 値 | 配置先 |
      | --- | --- |
      | 設定の既定値 | `config/defaults.yaml` |
      | 定数の YAML | `config/constants.yaml` |
      | 実行の記録（履歴・キャッシュ・ジョブの結果・会話の記録） | `data/` |
      | 大きいファイル（音声・画像・動画） | `data/` |
  - id: restore-01
    group: 大きいファイルの復元
    name: 取得元から取得し直して復元する
    body: |-
      `data/` に配置した大きいファイル（音声・画像・動画）は、メタデータの YAML にファイルの取得元を記載し、端末を移したとき・失ったときは取得元から取得し直して復元する。

      取得し直せないファイル（`source.type` が `original`）と、`source` を記載していないファイルは、同期で残す。
      そのファイルを配置する `data/` のサブフォルダだけを外部の保管先へ同期し、同期し直して復元する。
      同期のツールと保管先は、各リポジトリのセットアップ手順に記載する。
  - id: restore-02
    group: 大きいファイルの復元
    name: 取得元のキー
    body: |-
      取得元は、ファイルごとのメタデータの YAML の `source` に記載する。

      <!-- table: {"kind": "data"} -->

      | キー | 型 | 必須 | 条件 | 説明 | 例 |
      | --- | --- | --- | --- | --- | --- |
      | `source` | object | | - | ファイルの取得元 | - |
      | `source.type` | string | ✓ | - | `download`（URL から取得した）/ `generated`（ツールで生成した）/ `original`（自作で、取得し直せない） | `download` |
      | `source.url` | string | ✓ | `type: download` | 取得元のページかファイルの URL | `https://example.com/bgm/track01` |
      | `source.generator` | string | ✓ | `type: generated` | 生成に使用したツールとモデルの名前 | `{ツール名} {モデル名}` |
      | `source.parameters` | object | ✓ | `type: generated` | 生成の条件（プロンプト・シード・設定の値） | `{prompt: 夜の街, seed: 42}` |
      | `source.retrieved_at` | string | ✓ | `type: download`・`type: generated` | 取得・生成した日（`YYYY-MM-DD`） | `2026-11-22` |

      <!-- /table -->

      ```yaml
      source:
        type: download
        url: https://example.com/bgm/track01
        retrieved_at: "2026-11-22"
      ```
