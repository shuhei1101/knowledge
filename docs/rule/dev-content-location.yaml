# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: dev-content-location
kind: rule
name: コンテンツの置き場所
description: リポジトリ直下の content/ に配置する、コードではない原本と、配置しない値を定め、プロンプトや素材の一覧などを配置する場所を決めるときに参照する。
tags:
  - name: scope:dev
  - name: topic:カタログ
  - name: topic:コンテンツ
    main: true
  - name: topic:コード
  - name: topic:プロンプト
  - name: topic:モデル
  - name: topic:リポジトリ
  - name: topic:単価
  - name: topic:正本
  - name: action:定義
  - name: action:評価
status: current
visibility: internal
rev: 4
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      リポジトリ直下の `content/` に、Git で差分を確認したい、コードではない原本を配置する。

      `content/` に配置するのは、アプリが素材・定義として参照する本体で、設定の 3 レイヤー（既定値・環境の値・checkout の上書き）で上書きしないもの。
  - id: put-items-01
    group: 配置するもの
    name: プロンプト
    body: |-
      - プロンプト（`content/prompts/`）
  - id: put-items-02
    group: 配置するもの
    name: キャラクターなどの定義
    body: |-
      - キャラクターなどの定義
  - id: put-items-03
    group: 配置するもの
    name: 素材の一覧と説明文
    body: |-
      - 素材の一覧と説明文
  - id: put-items-04
    group: 配置するもの
    name: 評価のケース
    body: |-
      - 評価のケース
  - id: put-items-05
    group: 配置するもの
    name: 禁止語などのカタログ
    body: |-
      - 禁止語などのカタログ
  - id: put-items-06
    group: 配置するもの
    name: モデルと単価の一覧
    body: |-
      - モデルと単価の一覧
  - id: not-put-items-01
    group: 配置しないもの
    name: content/ に配置しない値
    body: |-
      次の値は `content/` に配置せず、[設定値の置き場所](id:flowchart-config-location) が決めた場所に配置する。
  - id: not-put-items-02
    group: 配置しないもの
    name: 値ごとの配置先
    body: |-
      | 値 | 配置先 |
      | --- | --- |
      | 設定の既定値 | `config/defaults.yaml` |
      | 定数の YAML | `config/constants.yaml` |
      | ランタイムの状態 | `data/` |
