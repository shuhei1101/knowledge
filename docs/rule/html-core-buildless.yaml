  - name: topic:scripts
  - name: topic:typescript
  - name: topic:バンドル
  - name: topic:ビルドレス
    main: true
  - name: topic:ブラウザ
  - name: tool:tsc
  - name: action:ビルド
  - name: action:拡張
  - name: action:配信
