# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: html-core-buildless
kind: rule
name: ビルドレス原則（バンドルしない）
description: バンドラを使用しないビルドレス原則と、ブラウザのスクリプトの拡張子の決まりを定め、単体 HTML のビルドやスクリプトの拡張子を決めるときに参照する。
aliases:
  - html/core/ビルドレス原則
inject_when:
  field: text
  op: contains
  values:
    - HTML
    - CSS
    - カスタムエレメント
tags:
  - name: scope:html
  - name: tool:javascript
  - name: topic:スクリプト
  - name: tool:typescript
  - name: topic:バンドル
  - name: topic:ビルドレス
    main: true
  - name: topic:ブラウザ
  - name: tool:tsc
  - name: action:ビルド
  - name: action:拡張
  - name: action:配信
status: current
visibility: internal
rev: 5
last_reviewed: '2026-11-12'
items:
  - id: overview
    name: 概要
    body: |-
      対象は単体 HTML。
  - id: buildless-01
    group: ビルドレス原則（バンドルしない）
    name: バンドラを使用しない
    body: |-
      - バンドラを使用しない。
        - webpack / vite / esbuild などでブラウザ用にバンドル・最適化しない。
        - ネイティブ ES Modules と素の CSS をそのまま配信する。
          起動を軽く保つのが目的。
        - ただし TypeScript の型システムを使用するため、`tsc` による `.ts` → `.js` のトランスパイル 1 工程だけは許可する。
        - 開発時のツールは使用してよい（[html/tooling/tsc運用](id:html-tooling-tsc)）。
  - id: script-extension-01
    group: ブラウザのスクリプトの拡張子
    name: tsc を挟む配信では ts で記載
    body: |-
      - `tsc` を挟める配信（サーバーが配る画面など）では、ブラウザのスクリプトを `.ts` で記載し、`.js` を手で記載しない。
        - スクリプトを配置するフォルダの名前（`frontend/`・`static/`・`assets/` など）によらない。
  - id: script-extension-02
    group: ブラウザのスクリプトの拡張子
    name: js で記載してよい場合
    body: |-
      - `.js` で記載してよいのは、`tsc` を挟めないもの（使い捨てのモックなど）だけ。
  - id: script-extension-03
    group: ブラウザのスクリプトの拡張子
    name: 生成 js を commit して配るものも ts で記載
    body: |-
      - GitHub Pages・プラグインの同梱物・配布物など、ビルドせずにそのまま配るものも `.ts` で記載し、生成した `.js` を commit して配る。
        - commit する生成 `.js` の扱いは [html/tooling/tsc運用](id:html-tooling-tsc#generated-js-gitignore-01) に従う。
  - id: script-extension-04
    group: ブラウザのスクリプトの拡張子
    name: HTML に直接記載する script
    body: |-
      - HTML に直接記載する `<script>` の処理は `.ts` へ分け、生成した `.js` を `<script src>` で読み込む。
        1 枚の HTML で配る雛形も同じ。
        - 値だけを持つ `<script>`（`type="importmap"`・`type="application/json"`）と、`tsc` を挟めないもの（[js で記載してよい場合](id:html-core-buildless#script-extension-02)）は対象外。
