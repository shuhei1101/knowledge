id: html-core-buildless
kind: rule
name: ビルドレス原則（バンドルしない）
description: バンドラを使わないビルドレス原則と、ブラウザのスクリプトの拡張子の決まりを定め、単体 HTML のビルドやスクリプトの拡張子を決めるときに読む。
tags:
  - name: scope:html
