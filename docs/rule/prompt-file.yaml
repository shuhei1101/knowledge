# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: prompt-file
kind: rule
name: プロンプトファイル
description: LLM の呼び出し・フックの注入文・MCP の instructions・ツールの description のプロンプトを 1 枚の YAML に記載するときの配置・構造・本文・検査・スキーマの指し方・更新の決まりを定め、プロンプトを作る・修正するときに読む。
tags:
  - name: scope:prompt
