status: current
visibility: internal
rev: 6
last_reviewed: '2026-10-31'
items:
  - id: overview
    name: 概要
    body: |-
      プロンプトは 1 つにつき 1 枚の YAML に書き、言語ごとの本文を部品の `texts[]` に持つ。
      対象は LLM の呼び出し・フックの注入文・MCP の instructions・ツールの description。
  - id: layout-01
    group: 配置
    name: 1 プロンプト 1 枚の YAML
    body: |-
      - 1 つのプロンプト（LLM の呼び出し 1 種類・フックの注入文・MCP の instructions・ツールの description）に YAML 1 枚を置く
  - id: layout-02
    group: 配置
    name: prompts/{id}.yaml の配置
    body: |-
      - `prompts/{id}.yaml` を平らに並べる
  - id: layout-03
    group: 配置
    name: content/prompts/ に置く
    body: |-
      - 置き場所はリポジトリ直下の `content/prompts/`（[コンテンツの置き場所](id:dev-content-location)）
      - プラグインのフックが読む文は、プラグインのルートの `content/prompts/` に置く
  - id: layout-04
    group: 配置
    name: コードは読んで描画するだけ
    body: |-
      - コードは YAML を読んで描画するだけにし、本文をコードに埋め込まない
  - id: structure-01
    group: 構造
    name: 1 枚の構造
    body: |-
      1 枚の中に、メタデータと部品の配列 `parts` を持つ。
  - id: structure-02
    group: 構造
    name: トップレベルのキー表
    body: |-
      | キー | 必須 | 内容 |
      | --- | --- | --- |
      | `id` | ✅ | プロンプトの識別子（ファイル名の `{id}` と同じ） |
      | `name` | ✅ | 画面・検索に出す名前 |
      | `description` | ✅ | 何のための文かを 1 文で |
      | `kind` | ✅ | 文の種類。`llm`（LLM の呼び出し）/ `hook`（フックの注入文）/ `instructions`（MCP のサーバーの instructions）/ `tool`（ツールの description） |
      | `lang` | ✅ | 注入する言語（BCP 47 の言語タグ）。各部品の `texts[]` からこの言語の本文を選ぶ |
      | `tags` | - | 分類のタグ |
      | `vars` | - | 本文で使う変数。変数名 → 変数の定義（`structure-05`） |
      | `examples[]` | - | 名前付きのサンプルの値の組（`id`・`name`・`values`）。画面で組ごとに描画する。`values` で省いた変数は `vars.{名前}.example` を使う |
      | `output` | - | 出力の形式。`kind: llm` のときだけ |
      | `parts` | ✅ | 部品の配列。並びが積み順になる |
      | `x-{名前}` | - | プロジェクト固有の拡張。どの階層にも置ける。それ以外の知らないキーは検査で落とす |
  - id: structure-03
    group: 構造
    name: 部品のキー
    body: |-
      部品は次のキーを持つ。
  - id: structure-04
    group: 構造
    name: 部品のキー表
    body: |-
      | キー | 必須 | 内容 |
      | --- | --- | --- |
      | `id` | ✅ | 部品の識別子 |
      | `role` | `kind: llm` のとき ✅ | `system` / `user` など、積む先。`kind: llm` 以外では書かない |
      | `tags` | - | 部品の分類。精度評価で部品を差し替えるときに使う |
      | `when` | - | 使う条件。`vars` を使う Jinja2 の式で、無い部品は常に使う |
      | `texts[]` | ✅ | 言語ごとの本文。各要素は `lang`（BCP 47 の言語タグ）と `text`（本文） |
  - id: structure-05
    group: 構造
    name: 変数の定義のキー表
    body: |-
      変数の定義は次のキーを持ち、`items`・`properties` の下に同じキーで何段でも入れ子にできる。

      | キー | 必須 | 内容 |
      | --- | --- | --- |
      | `type` | ✅ | `string` / `integer` / `number` / `boolean` / `array` / `object` |
      | `description` | ✅ | 何が入るか。画面のツールチップに出す |
      | `required` | -（既定 `false`） | 必須か。必須でない変数は、渡されなければ `default` か `None` として渡す |
      | `example` | `vars` の直下で ✅ | `type` に合うサンプルの値 |
      | `default` | - | 渡されないときの値 |
      | `enum` | - | 取りうる値の一覧 |
      | `source` | - | 値の出どころ |
      | `items` | `type: array` のとき ✅ | 配列の要素の定義 |
      | `properties` | `type: object` のとき ✅ | キー名 → 変数の定義 |
  - id: structure-06
    group: 構造
    name: "例: kind: hook"
    body: |-
      ```yaml
      # yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/knowledge/{タグ}/schemas/prompt.schema.yaml
      id: session-context
      name: SessionStart の配信元の一覧
      kind: hook
      lang: ja
      description: 作業場所から使える配信元を、セッションの始めに伝える
      vars:
        sources:
          type: array
          required: true
          description: 作業場所から使える配信元
          example: [{id: knowledge, access: read}]
          items:
            type: object
            description: 配信元 1 件
            properties:
              id: {type: string, required: true, description: 配信元の ID}
              access: {type: string, required: true, enum: [read, read_write], description: 権限}
      examples:
        - id: no-source
          name: 配信元が無い
          values: {sources: []}
      parts:
        - id: sources
          when: "{{ sources | length > 0 }}"
          texts:
            - lang: ja
              text: |
                次の配信元を使えます。
                {% for s in sources %}- {{ s.id }}（{{ s.access }}）
                {% endfor %}
        - id: no-source
          when: "{{ sources | length == 0 }}"
          texts:
            - lang: ja
              text: |
                使える配信元はありません。
      ```
  - id: structure-07
    group: 構造
    name: "例: kind: llm"
    body: |-
      ```yaml
      # yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/knowledge/{タグ}/schemas/prompt.schema.yaml
      id: reflection
      name: 振り返りのノード
      kind: llm
      lang: en
      description: キャラクターが最近の出来事を振り返り、性格特性の基底値の変化を決める
      vars:
        character:
          type: object
          required: true
          description: 振り返るキャラクター
          example: {id: hina, display_name: ひな}
          properties:
            id: {type: string, required: true, description: キャラクターの ID}
            display_name: {type: string, required: true, description: 表示名}
        logs:
          type: array
          required: true
          description: 振り返るログの行（古い順）
          example: ["10/31 20:10 コンビニで新作のプリンを買った"]
          items: {type: string, description: ログ 1 行}
      output: write_trait_changes を 1 回呼んで終える
      parts:
        - id: role
          role: system
          texts:
            - lang: en
              text: |-
                You reflect on the recent events of "{{ character.display_name }}" (character_id: {{ character.id }}).
            - lang: ja
              text: |-
                あなたは「{{ character.display_name }}」（character_id: {{ character.id }}）の最近の出来事を振り返る担当です。
        - id: logs
          role: user
          when: "{{ logs | length > 0 }}"
          texts:
            - lang: en
              text: |-
                ### Logs to reflect on (oldest first)
                {% for line in logs -%}
                - {{ line }}
                {% endfor %}
            - lang: ja
              text: |-
                ### 振り返るログ（古い順）
                {% for line in logs -%}
                - {{ line }}
                {% endfor %}
      ```
  - id: body-text-01
    group: 本文
    name: 本文はブロックスカラー
    body: |-
      - 本文は YAML のブロックスカラー（`|`）に Jinja2 で書き、未定義の変数はエラーにする（StrictUndefined）
  - id: body-text-02
    group: 本文
    name: 実行時は lang の本文
    body: |-
      - 実行時はトップレベルの `lang` の本文を注入し、ほかの言語の本文は画面で表示する
  - id: body-text-03
    group: 本文
    name: 言語の間の同期
    body: |-
      - 言語の間で使う変数をそろえ、1 つの言語の本文を修正したら同じ変更でほかの言語も修正する
  - id: body-text-04
    group: 本文
    name: 値は変数で渡す
    body: |-
      - 字数・件数などの値は本文に書かず、変数で渡す
  - id: body-text-05
    group: 本文
    name: 日本語固有の中身
    body: |-
      - 日本語でしか書けない中身（キャラクターの語尾・話し方）は入力の値として渡す
  - id: body-text-06
    group: 本文
    name: 部品の並び順
    body: |-
      - 変数を含まない部品を上、含む部品を下に並べる（[コストとキャッシュ](id:python-llm-cost-cache) のキャッシュ境界）
  - id: inspection-01
    group: 検査
    name: 検査の対象
    body: |-
      構造はスキーマ `schemas/prompt.schema.yaml`（`## スキーマの指し方`）で検査し、スキーマで見られない次を独自の検査で検査する。
  - id: inspection-02
    group: 検査
    name: vars 外の変数の禁止
    body: |-
      - `vars` に無い変数を本文で使っていない
  - id: inspection-03
    group: 検査
    name: lang の本文の有無
    body: |-
      - トップレベルの `lang` の本文がどの部品にもある
  - id: inspection-05
    group: 検査
    name: 言語の重なりの禁止
    body: |-
      - 同じ部品で `texts[].lang` が重ならない
  - id: inspection-06
    group: 検査
    name: example と type の整合
    body: |-
      - `example` が `type` に合う
  - id: inspection-04
    group: 検査
    name: スキーマと検査の参照先
    body: |-
      スキーマの書き方と検査の通し方は [YAML](id:dev-yaml) の `## スキーマ` と `## 検査` に従う。
      スキーマには、`when` の式の書き方・`vars.*.type` に書ける型・`output` の意味を書く。
  - id: schema-ref-01
    group: スキーマの指し方
    name: モードラインで knowledge のスキーマを指す
    body: |-
      - スキーマは各プロジェクトで書かず、各ファイルの 1 行目のモードライン `# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/knowledge/{タグ}/schemas/prompt.schema.yaml` で knowledge のスキーマを指す
  - id: schema-ref-02
    group: スキーマの指し方
    name: 変えたいプロジェクトだけコピーする
    body: |-
      - スキーマを変えたいプロジェクトだけ、スキーマをコピーしてモードラインでコピーを指す
  - id: update-01
    group: 更新
    name: 更新は MCP の書き込み
    body: |-
      更新は [YAML](id:dev-yaml) の `## MCP からの書き込み` に従う。
  - id: rejected-structure-01
    group: 採らない構成
    name: "採らない構成: 外付けメタデータ"
    body: |-
      - Markdown を残して YAML でメタデータを外付けする構成
  - id: rejected-structure-02
    group: 採らない構成
    name: "採らない構成: 1 枚にまとめる"
    body: |-
      - 全ノードを 1 枚の YAML にまとめる構成
