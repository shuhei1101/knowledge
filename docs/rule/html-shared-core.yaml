# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: html-shared-core
kind: rule
name: shared/core
description: 環境・定数・ルーティングなどのコア値を集約する shared/core の決まりを定める。
tags:
  - name: scope:html
  - name: topic:shared
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: shared-core-01
    group: shared/core
    name: コア値を置く
    body: |-
      - 環境・定数・ルーティング等のコア値。
        - `env.ts`（環境判定）・`constants.ts`（モード / カテゴリの定数・ラベル辞書）・`endpoints.ts`（URL 定数）など。
  - id: shared-core-02
    group: shared/core
    name: マジック文字列を集約
    body: |-
      - URL・モード名・マジック文字列はここに集約し、画面や部品にハードコードしない。
  - id: shared-core-03
    group: shared/core
    name: 値とその導出だけを持つ
    body: |-
      - 値とその導出だけを持つ。DOM・通信は持たない。
