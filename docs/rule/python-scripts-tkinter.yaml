items:
  - id: overview
    name: 概要
    body: |-
      スクリプトに小さい操作画面を付ける程度なら tkinter で十分（本格 GUI は Electron / Tauri 等）。
  - id: design-guideline-01
    group: 設計指針
    name: UI と処理の分離
    body: |-
      - UI と処理を分離: handler は引数を集めるだけ、実処理は `_do_work()` に委譲（テスト可能に）
  - id: design-guideline-02
    group: 設計指針
    name: テーマは clam 固定
    body: |-
      - テーマは `ttk.Style(root).theme_use("clam")` 固定（OS 間の見た目を統一）
  - id: design-guideline-03
    group: 設計指針
    name: アクセントカラーは青
    body: |-
      - アクセントカラーは青で統一（`#2563eb` 基準、hover `#1d4ed8`）。`Accent.TButton` スタイルを定義
  - id: design-guideline-04
    group: 設計指針
    name: エラーは messagebox で見せる
    body: |-
      - エラーは握りつぶさず `messagebox.showerror` でユーザーに見せる
  - id: design-guideline-05
    group: 設計指針
    name: Tk は 1 つだけ
    body: |-
      - `tk.Tk()` は 1 つだけ。モーダルは `tk.Toplevel` 派生 + `transient(master)` + `grab_set()`、結果は `result` プロパティで返し `root.wait_window(dialog)` で受ける
  - id: design-guideline-06
    group: 設計指針
    name: ファイル選択のダイアログ
    body: |-
      - ファイル / フォルダ選択は `filedialog.askdirectory` / `askopenfilename(filetypes=...)` / `asksaveasfilename`
  - id: design-guideline-07
    group: 設計指針
    name: 骨格は単一ファイルスクリプトに従う
    body: |-
      - 骨格（docstring / main / sys.exit）は [scripts/Pythonスクリプト](id:python-scripts-python-script) と同じ
  - id: long-process-01
    group: 長い処理
    name: GUI スレッドをブロックしない
    body: |-
      GUI スレッドをブロックしない:
  - id: long-process-02
    group: 長い処理
    name: worker スレッドと Queue
    body: |-
      - `threading.Thread(daemon=True)` で worker を回し、結果は `Queue` へ
  - id: long-process-03
    group: 長い処理
    name: after によるポーリング
    body: |-
      - `root.after(100, poll)` のポーリングで tk イベントループ上で回収して messagebox 表示
