id: react-screen-detail
kind: rule
name: 詳細画面
description: 詳細（View）画面の構成と、編集ボタンの出し分け、データ取得との関係を定め、詳細画面を実装するときに読む。
tags:
  - name: scope:react
  - name: topic:frontend
  - name: topic:クエリ
  - name: topic:データ
  - name: topic:ビュー
  - name: topic:ボタン
  - name: topic:リンク
  - name: topic:ローダー
  - name: topic:構成
  - name: topic:画面
    main: true
  - name: action:先読み
  - name: action:取得
  - name: action:編集
  - name: action:読み取り
  - name: action:遷移
status: current
visibility: internal
rev: 3
last_reviewed: '2026-10-30'
items:
  - id: overview
    name: 概要
    body: |-
      対象: React
      詳細画面は `{screen}-screen.tsx` に置く。
  - id: view-screen-01
    group: 詳細画面
    name: 読み取り専用
    body: |-
      - 読み取り専用にする（`useMutation` と `<form>` を持たない）。
  - id: view-screen-02
    group: 詳細画面
    name: データは loader で先読みして Query で読む
    body: |-
      - ルートの loader でデータを先読みし、画面は TanStack Query の hook で読む。
        Edit と同じ API なら、hook を共有する（[クエリ](id:react-data-query)）。
  - id: view-screen-03
    group: 詳細画面
    name: canEdit で編集ボタンを出し分ける
    body: |-
      - `resource.canEdit` で、編集ボタンを出し分ける。
  - id: view-screen-04
    group: 詳細画面
    name: 編集への遷移は型付きの Link
    body: |-
      - 編集への遷移は、型付きの `<Link>` で書く。
