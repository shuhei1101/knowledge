items:
  - id: language-usage-01
    group: 文字種・言語の使い分け
    name: 言語の使い分け表
    body: |-
      <!-- table: data -->

      | 対象 | 言語 |
      | --- | --- |
      | コメント / docstring | 日本語 |
      | 識別子（変数 / 関数 / 型 / モジュール） | 英語 |
      | `print()` / `logger` の出力文字列 | 日本語 |
      | bat / PowerShell スクリプトの出力 | 英語（エンコーディングでバグるため） |
      | 例外 raise 時のメッセージ | 日本語 |
      | UI 表示文字列 | 日本語 |

      <!-- /table -->
  - id: string-format-01
    group: 文字列フォーマット
    name: f-string を標準にする
    body: |-
      - f-string を標準にする（i18n が必要な場合のみ gettext）
  - id: import-order-01
    group: import の並び
    name: import の並び
    body: |-
      ruff の `I` ルールで自動整理。
  - id: exception-01
    group: 例外
    name: 例外定義の参照
    body: |-
      - 例外の階層・vendor 例外のラップ・`raise X from e` は [shared/エラー定義](id:python-shared-error-definition)、横断関心事のハンドラーデコレータは [core/デコレーター](id:python-core-decorator)
  - id: exception-03
    group: 例外
    name: Result 型は使わない
    body: |-
      - Result 型 / Either は使わない（例外を普通に投げる）
  - id: exception-04
    group: 例外
    name: assert の使い方
    body: |-
      - `assert` を実行時の検査に使わない（最適化モードで消える）。前提の確認は例外を投げる。テストの `assert` は可
  - id: exception-05
    group: 例外
    name: try の範囲
    body: |-
      - `try` に入れるのは失敗しうる行だけにする
  - id: encoding-01
    group: エンコーディング
    name: UTF-8・BOM なし
    body: |-
      - すべて UTF-8、BOM なし
