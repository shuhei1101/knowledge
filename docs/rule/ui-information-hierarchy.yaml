id: ui-information-hierarchy
kind: rule
name: 情報の階層と見た目
description: 画面の中で何を先に見せるかと、見た目の揃え方を定め、画面の情報の優先順位や見た目の一貫性を決めるときに読む。
tags:
  - name: scope:ui
    main: true
status: current
visibility: internal
rev: 3
last_reviewed: '2026-10-24'
sources:
  - id: I
    title: pbakaus/impeccable
    url: https://github.com/pbakaus/impeccable
  - id: V
    title: Vercel Web Interface Guidelines
    url: https://vercel.com/design/guidelines
  - id: R
    title: raunofreiberg/interfaces
    url: https://github.com/raunofreiberg/interfaces
  - id: ID
    title: Dammyjay93/interface-design
