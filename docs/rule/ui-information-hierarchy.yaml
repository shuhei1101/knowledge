items:
  - id: overview
    name: 概要
    body: |-
      対象: 共通（単体 HTML・React）
      画面の中で何を先に見せるかと、見た目の揃え方。
      出典の略号は I = Impeccable、V = Vercel Web Interface Guidelines、R = raunofreiberg/interfaces、ID = interface-design、MW = modern-web-guidance（リンクはメタデータの `sources`）。
  - id: information-hierarchy-01
    group: 情報の階層
    name: 情報の階層の決まり
    body: |-
      <!-- table: data -->

      | 要素 | 出典 |
      | --- | --- |
      | 1 画面の主目的は 1 つ。主操作は 1 つ、副操作は 1〜2 つにし、残りはメニューにまとめる | I |
      | 1 か所で同時に比べさせる選択肢は 4 つ程度までにする。超えるならグループにまとめるか、段階的に見せる | I |
      | 枠や飾りより先に、距離でまとまりを作る | I |
      | 今いる場所と、選択中のものを常に示す | I |
      | 枠の中に枠を入れない。同じ文言を 1 つの枠の中で繰り返さない | I |
      | 本文の区画に操作の説明文を置かない（凡例の説明の程度は許す） | - |

      <!-- /table -->
  - id: visual-consistency-01
    group: 見た目の一貫性
    name: 見た目の一貫性の決まり
    body: |-
      <!-- table: data -->

      | 要素 | 出典 |
      | --- | --- |
      | 奥行きの表し方（線・影・面の色の差）は 1 つに決め、混ぜない | I / ID |
      | 入れ子の角丸は、外側 = 内側 + 間の余白にする | ID |
      | 文字の階層は大きさ・太さ・濃さを組み合わせる。隣り合う段階の差を小さくしすぎない | I |
      | 見出しの上の余白は、下の余白より広くする | I |
      | 強い色は操作・選択・状態にだけ使う。非活性の部品には使わない | I |
      | アイコンは 1 つのセットで揃え、線の太さを統一する | I |
      | 絵文字をアイコンの代わりにしない。ユーザーが説明のために絵文字で指定しても、画面では使わず、公式のアイコン（GitHub なら Octicons など）を使う。無ければ SVG で描く | I |
      | アイコンと文字は、見た目で上下中央に揃える | MW |
      | 同じ種類の操作部品（ボタン・セレクト・入力欄・セグメント）は、高さを 1 つの値に揃える | I |
      | 操作部品は hover / focus / 押下 / 無効 / 読み込み中 / エラーの状態を持つ。データの表示は空 / 読み込み中 / エラーの状態を持つ | I / ID |
      | 今の画面・ビューで意味を持たない（押しても何も変わらない）操作は出さない | - |
      | ホバーや選択で文字の太さを変えない | R |
      | 移った先・選択中・フォーカスを、枠の左右や片側だけの色で示さない。枠の全体か背景で示す | - |
      | 並んだ操作部品の間に、押せない隙間を作らない | V |
      | 次の型を使わない: 見出しの上の小さな英字ラベル、左端だけの太い色線、文字のグラデーション、光る影、意味のない点滅、順序の無いところの 01・02・03、同じ大きさの箱を並べただけの構成 | I |

      <!-- /table -->
