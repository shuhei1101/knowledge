id: ui-no-iframe
kind: rule
name: iframe の禁止
description: 画面で iframe を使わず、共通コンポーネントで画面を組む決まりを定め、画面に別ページの内容を埋め込もうとするときに読む。
tags:
  - name: scope:ui
  - name: topic:部品
  - name: topic:iframe
    main: true
  - name: topic:ページ
  - name: topic:画面
status: current
visibility: internal
rev: 4
last_reviewed: '2026-10-30'
items:
  - id: overview
    name: 概要
    body: |-
      対象: 共通（単体 HTML・React）
  - id: no-iframe-01
    group: iframe の禁止
    name: iframe を使わない
    body: |-
      - タブ内の画面やサイドバーを選択したときのコンテンツなど、全てで iframe を使わない。
        代わりに、共通コンポーネントを作成して各画面に配置する。
