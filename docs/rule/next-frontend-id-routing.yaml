# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-frontend-id-routing
kind: rule
name: "[id]/ — レコード単位のルーティング"
description: レコード単位の [id]/ ルーティングの構成、権限ガード、View がない画面の扱いを定め、レコード単位の画面（詳細・編集）を作るときに読む。
tags:
  - name: scope:next
  - name: topic:フロントエンド
  - name: topic:id
  - name: topic:ガード
  - name: topic:ビュー
  - name: topic:フォルダ
  - name: topic:フック
  - name: topic:ページ
  - name: topic:ルーティング
    main: true
  - name: topic:レコード
  - name: topic:構成
  - name: topic:権限
  - name: topic:画面
  - name: action:参照
  - name: action:検査
  - name: action:編集
  - name: action:配置
status: current
visibility: internal
rev: 4
last_reviewed: '2026-10-24'
items:
  - id: id-routing-01
    group: "[id]/ — レコード単位のルーティング"
    name: View と Edit の配置
    body: |-
      - `[id]/page.tsx` が View 画面そのもの、編集は `[id]/edit/page.tsx`
  - id: id-routing-02
    group: "[id]/ — レコード単位のルーティング"
    name: フォルダ構成の参照
    body: |-
      - フォルダ構成は [frontend/フィーチャーフォルダ](id:next-frontend-feature-folder)
  - id: id-routing-03
    group: "[id]/ — レコード単位のルーティング"
    name: View 専用フック
    body: |-
      - View 専用フィールド（`viewCount` 等）が要るときだけ View 専用フックを別途作る（共通に混ぜない）
  - id: permission-guard-01
    group: 権限ガード
    name: 権限ガードの前提
    body: |-
      編集権限なしで `/edit` 直アクセスされた場合:
  - id: permission-guard-02
    group: 権限ガード
    name: Edit の page で canEdit を確認
    body: |-
      - 推奨: Edit の page.tsx で `fetchResource` の `canEdit` を見て `redirect(RESOURCE_URL.view(id))`
  - id: permission-guard-03
    group: 権限ガード
    name: 軽量チェックは proxy.ts
    body: |-
      - 軽量チェックなら proxy.ts でブロック（[backend/プロキシ](id:next-backend-proxy)）
  - id: no-view-screen-01
    group: View がない画面
    name: View がない画面
    body: |-
      設定画面など Edit のみのフィーチャは `settings/page.tsx` に直接 EditScreen を render する（`[id]/` パターンに無理に当てはめない）。
