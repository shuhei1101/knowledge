# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: react-form-autosave
kind: rule
name: 自動保存
description: useAutosave による自動保存の状態・debounce・retry・離脱の検知の決まりを定め、フォームに自動保存を実装するときに読む。
tags:
  - name: scope:react
  - name: topic:frontend
    main: true
status: current
visibility: internal
rev: 2
last_reviewed: '2026-10-30'
related:
  - to: react-component-autosave-indicator
    type: references
    when: 自動保存の状態を画面に出すとき
items:
  - id: overview
    name: 概要
    body: |-
      対象: React
  - id: use-autosave-01
    group: useAutosave
    name: useAutosave の呼び出し
    body: |-
      ```ts
      const { status, lastSavedAt, retry } = useAutosave({ values, save, debounceMs })
      ```
  - id: use-autosave-02
    group: useAutosave
    name: status の種類
    body: |-
      - `status` は `"idle" | "saving" | "saved" | "error"` にする。
  - id: use-autosave-03
    group: useAutosave
    name: debounce で保存する
    body: |-
      - 値が変わってから `debounceMs`（既定 1000ms）後に保存する。
  - id: use-autosave-04
    group: useAutosave
    name: 同じ値は保存しない
    body: |-
      - 前回保存した値と同じなら、保存しない。
  - id: use-autosave-05
    group: useAutosave
    name: 古いリクエストの結果は無視する
    body: |-
      - 古いリクエストの結果は無視する（inflight の ref で判定する）。
  - id: use-autosave-06
    group: useAutosave
    name: online で自動的に retry する
    body: |-
      - online イベントが来たとき、error の状態なら自動的に retry する。
  - id: use-autosave-07
    group: useAutosave
    name: isValid で保存の対象を絞る
    body: |-
      - `isValid` で、保存の対象を絞れる。
  - id: rules-01
    group: ルール
    name: 離脱の検知は error の状態だけ
    body: |-
      - 離脱の検知（`useBeforeUnload`）は、error の状態のときだけ行う。
  - id: rules-02
    group: ルール
    name: useWatch と onChange
    body: |-
      - `useWatch` の値を `values` に渡し、`mode: "onChange"` を指定する。
