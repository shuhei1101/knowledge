# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: react-data-api-client
kind: rule
name: API クライアント
description: orval で API クライアントを生成する決まりと、生成物・mutator・WebSocket の置き場所を定める。
tags:
  - name: scope:react
  - name: topic:frontend
    main: true
status: current
visibility: internal
rev: 2
last_reviewed: '2026-10-30'
related:
  - to: react-data-query
    type: references
    when: 生成した hook を画面で使うとき
sources:
  - title: "orval: output"
    url: https://orval.dev/docs/reference/configuration/output
items:
  - id: overview
    name: 概要
    body: |-
      対象: React
      API クライアントは、OpenAPI から orval で生成する。
  - id: generate-01
    group: 生成
    name: 生成するもの
    body: |-
      - orval で、TanStack Query の hook・Zod・MSW のモックを生成する。
  - id: generate-02
    group: 生成
    name: 生成物は専用のフォルダに出す
    body: |-
      - 生成物は、`shared/api/generated/` だけに出す。
        orval の `clean` が出力先を削除するので、手書きのファイルを置かない。
  - id: mutator-01
    group: mutator
    name: fetch を呼ぶ場所は api-client.ts
    body: |-
      - mutator は `shared/adapters/api-client.ts` に置き、fetch を呼ぶ場所を 1 か所にする。
        失敗したレスポンスは、ここで `AppError` に変換して throw する。
  - id: url-01
    group: URL
    name: URL を文字列で書かない
    body: |-
      - API の URL は、生成された関数を通して使う。
        画面の遷移は、型付きの `<Link>`・`navigate` で行う。
  - id: websocket-01
    group: WebSocket
    name: 受けた値は setQueryData に反映する
    body: |-
      - WebSocket は `shared/adapters/ws-client.ts` に置き、受けた値を `queryClient.setQueryData` に反映する。
  - id: websocket-02
    group: WebSocket
    name: WsClient は EventTarget で実装する
    body: |-
      - `WsClient` は `EventTarget` を継承して実装し、購読側は `addEventListener` で受ける。
        コンポーネントからは、hook で包んで使う。
  - id: websocket-03
    group: WebSocket
    name: 再接続はジッター付きの指数バックオフ
    body: |-
      - 再接続は、ジッター付きの指数バックオフにする。
        URL は `createWsUrl()` 経由で組み立て、ハードコードしない。
