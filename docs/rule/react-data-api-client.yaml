# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: react-data-api-client
kind: rule
name: API クライアント
description: orval で API クライアントを生成する決まりと、生成物・mutator・WebSocket の配置先を定め、React から API を呼ぶクライアントを作る・WebSocket を扱うときに参照する。
inject_when:
  field: text
  op: contains
  values:
    - React
    - tsx
    - jsx
    - Vite
tags:
  - name: scope:react
  - name: topic:フロントエンド
  - name: topic:api
    main: true
  - name: topic:url
  - name: topic:websocket
  - name: topic:クエリ
  - name: topic:クライアント
  - name: topic:ジッター
  - name: topic:データ
  - name: topic:バックオフ
  - name: topic:フォルダ
  - name: topic:ミューテーション
  - name: topic:指数バックオフ
  - name: topic:文字列
  - name: tool:orval
  - name: tool:react
  - name: action:反映
  - name: action:取得
  - name: action:実装
  - name: action:接続
  - name: action:生成
status: current
visibility: internal
rev: 5
last_reviewed: '2026-10-30'
related:
  - to: react-data-query
    type: references
    when: 生成した hook を画面で使用するとき
sources:
  - title: "orval: output"
    url: https://orval.dev/docs/reference/configuration/output
items:
  - id: overview
    name: 概要
    body: |-
      対象は React。
      API クライアントは、OpenAPI から orval で生成する。
  - id: generate-01
    group: 生成
    name: 生成するもの
    body: |-
      - orval で、TanStack Query の hook・Zod・MSW のモックを生成する。
  - id: generate-02
    group: 生成
    name: 生成物は専用のフォルダに出す
    body: |-
      - 生成物は、`shared/api/generated/` だけに出す。
        orval の `clean` が出力先を削除するので、手書きのファイルを配置しない。
  - id: mutator-01
    group: mutator
    name: fetch を呼ぶ場所は api-client.ts
    body: |-
      - mutator は `shared/adapters/api-client.ts` に配置し、fetch を呼ぶ場所を 1 か所にする。
        失敗したレスポンスは、ここで `AppError` に変換して throw する。
  - id: url-01
    group: URL
    name: URL を文字列で記載しない
    body: |-
      - API の URL は、生成された関数を経由して使用する。
        画面の遷移は、型付きの `<Link>`・`navigate` で行う。
  - id: websocket-01
    group: WebSocket
    name: 受けた値は setQueryData に反映する
    body: |-
      - WebSocket は `shared/adapters/ws-client.ts` に配置し、受けた値を `queryClient.setQueryData` に反映する。
  - id: websocket-02
    group: WebSocket
    name: WsClient は EventTarget で実装する
    body: |-
      - `WsClient` は `EventTarget` を継承して実装し、購読側は `addEventListener` で受ける。
        コンポーネントからは、hook で包んで使用する。
  - id: websocket-03
    group: WebSocket
    name: 再接続はジッター付きの指数バックオフ
    body: |-
      - 再接続は、ジッター付きの指数バックオフにする。
        URL は `createWsUrl()` 経由で組み立て、ハードコードしない。
