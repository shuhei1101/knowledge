# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-frontend-use-form-pattern
kind: rule
name: hooks/use{Feature}Form.ts — フォーム state hook
description: フォーム state の hook の配置、defaultValues と values、reset、dirty 判定のルールを定める。
tags:
  - name: scope:next
  - name: topic:frontend
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: use-form-hook-01
    group: hooks/use{Feature}Form.ts — フォーム state hook
    name: hook の配置
    body: |-
      - 配置: `{feature}/[id]/edit/hooks/use{Feature}Form.ts`
  - id: use-form-hook-02
    group: hooks/use{Feature}Form.ts — フォーム state hook
    name: defaultValues にサーバー値
    body: |-
      - `defaultValues` にサーバー値を流す
  - id: use-form-hook-03
    group: hooks/use{Feature}Form.ts — フォーム state hook
    name: 非同期 fetch は values
    body: |-
      - 非同期 fetch 時は `values` プロパティを使う（変更で自動 reset、isDirty も正しく動く）
  - id: use-form-hook-04
    group: hooks/use{Feature}Form.ts — フォーム state hook
    name: hook 化は任意
    body: |-
      - hook 化は任意。初期値変換が重い・複数箇所で再利用する場合のみ
  - id: rules-01
    group: ルール
    name: Zod schema は form.ts から
    body: |-
      - Zod schema は `{feature}/form.ts` から import
  - id: rules-02
    group: ルール
    name: 送信成功後の reset
    body: |-
      - 送信成功後は `form.reset(data)` で dirty を落とす
  - id: rules-03
    group: ルール
    name: dirty 判定は isDirty
    body: |-
      - dirty 判定は `formState.isDirty`（JSON.stringify 比較しない）
  - id: rules-04
    group: ルール
    name: defaultValues と values は併用しない
    body: |-
      - `defaultValues` と `values` を両方使わない
