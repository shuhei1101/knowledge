# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: python-packaging-dependency
kind: rule
name: 依存管理 — uv 標準
description: uv を標準にした依存管理のコマンド、Git 管理の対象、依存グループの使い分けを定める。
tags:
  - name: scope:python
  - name: topic:packaging
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      `uv` を標準とする（pip / poetry は使わない）。高速・venv 管理込み・lockfile・Python バージョン管理を統合。
  - id: command-cheatsheet-01
    group: コマンド早見表
    name: uv のコマンド早見表
    body: |-
      <!-- table: data -->

      | 操作                      | コマンド                                       |
      | ------------------------- | ---------------------------------------------- |
      | 初期化                    | `uv init mypkg --package`（src レイアウト）    |
      | Python 固定               | `uv python pin {バージョン}`（`.python-version` 生成） |
      | 本番依存追加              | `uv add httpx "pydantic>=2.6"`                 |
      | dev 依存追加              | `uv add --dev pytest mypy ruff`                |
      | 削除                      | `uv remove httpx`                              |
      | 同期                      | `uv sync`（`--all-extras` / `--no-dev`）       |
      | 実行                      | `uv run pytest` / `uv run python -m mypkg`     |
      | requirements.txt から移行 | `uv add -r requirements.txt`                   |

      <!-- /table -->
  - id: command-cheatsheet-02
    group: コマンド早見表
    name: activate は不要
    body: |-
      venv の activate は不要（`uv run` が .venv を見る）。`pip install` で venv に直接入れない（uv の状態と乖離）。
  - id: git-management-01
    group: Git 管理
    name: Git 管理の表
    body: |-
      | ファイル | 管理 |
      | --- | --- |
      | `pyproject.toml` / `.python-version` | Git 管理 |
      | `uv.lock` | Git 管理（再現性のため必須、手動編集禁止） |
      | `.venv/` | gitignore |
  - id: git-management-02
    group: Git 管理
    name: CI では locked で検証
    body: |-
      CI では `uv sync --locked` でロックとの乖離を検証（`--frozen` は検証せずロックをそのまま使う）。
  - id: dependency-group-01
    group: 依存グループ
    name: optional-dependencies の用途
    body: |-
      - `optional-dependencies`: 外部ユーザー向け追加機能（`pip install mypkg[redis]`）
  - id: dependency-group-02
    group: 依存グループ
    name: dependency-groups の用途
    body: |-
      - `[dependency-groups]`（PEP 735）: 開発者用作業グループ（dev / docs / benchmark）。`uv sync --group docs`
