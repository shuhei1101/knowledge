# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: react-screen-edit
kind: rule
name: 編集・新規画面
description: 編集・新規画面の構成と、送信の流れ、保存ボタンの活性条件を定め、編集・新規画面を実装するときに読む。
tags:
  - name: scope:react
  - name: topic:フロントエンド
  - name: topic:エラー
  - name: topic:サーバー
  - name: topic:ボタン
  - name: topic:ミューテーション
  - name: topic:構成
  - name: topic:画面
    main: true
  - name: action:保存
  - name: action:編集
  - name: action:表示
  - name: action:送信
status: current
visibility: internal
rev: 4
last_reviewed: '2026-10-30'
related:
  - to: react-form-component
    type: requires
    when: フォームの入力部品を組むとき
  - to: react-data-mutation
    type: requires
    when: 送信の mutation を呼ぶとき
items:
  - id: overview
    name: 概要
    body: |-
      対象: React
      編集・新規画面は、React Hook Form + Zod + useMutation で組む。
  - id: edit-screen-01
    group: 編集・新規画面
    name: isPending は mutation から取る
    body: |-
      - 送信中かどうかは、mutation の `isPending` で管理する。
  - id: edit-screen-02
    group: 編集・新規画面
    name: defaultValues にサーバーの値を流す
    body: |-
      - `defaultValues` に、サーバーから取得した値を流す。
  - id: submit-flow-01
    group: 送信の流れ
    name: handleSubmit から mutate を呼ぶ
    body: |-
      1. `form.handleSubmit(onSubmit)` から mutation を呼ぶ
  - id: submit-flow-02
    group: 送信の流れ
    name: 失敗時のエラー表示
    body: |-
      2. 失敗したときは、`AppError` に `field` があれば `form.setError`、なければ `toast.error` で出す
  - id: submit-flow-03
    group: 送信の流れ
    name: 編集の成功時
    body: |-
      3. 編集に成功したら、`toast.success` と `form.reset(data)` を呼ぶ
  - id: submit-flow-04
    group: 送信の流れ
    name: 新規の成功時
    body: |-
      4. 新規に成功したら、`toast.success` を出し、詳細画面へ遷移する
  - id: rules-01
    group: ルール
    name: 保存ボタンの活性条件
    body: |-
      - 保存ボタンは `disabled={!form.formState.isDirty || isPending}` にする。
