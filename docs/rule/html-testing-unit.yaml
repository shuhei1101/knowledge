# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: html-testing-unit
kind: rule
name: ユニットテスト（vitest）
description: vitest と jsdom による単体テストの置き場所・対象・alias・時刻の扱いを定める。
tags:
  - name: scope:html
  - name: topic:testing
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      vitest + jsdom で素の ES modules を直接テストする。
  - id: unit-vitest-01
    group: ユニットテスト（vitest）
    name: テストの置き場所と命名
    body: |-
      - `tests/unit/` に対象ファイルの階層をミラーして `{name}.test.ts` で置く（`tests/unit/shared/lib/fmt.test.ts` 等）。
  - id: unit-vitest-02
    group: ユニットテスト（vitest）
    name: テスト対象
    body: |-
      - テスト対象は純関数・派生計算・状態ロジック（DOM や通信に依存しない部分）。
        - `state.ts` や `shared/lib` が主対象。描画の細部は結合テストに任せる。
  - id: unit-vitest-03
    group: ユニットテスト（vitest）
    name: alias の解決
    body: |-
      - import 別名 `shared/` は `vitest.config.js` の alias で解決される（相対パスに書き換えない）。
  - id: unit-vitest-04
    group: ユニットテスト（vitest）
    name: 時刻は固定日時で検証
    body: |-
      - 時刻系は固定日時を渡して JST 変換を検証する。
