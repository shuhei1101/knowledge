items:
  - id: overview
    name: 概要
    body: |-
      エージェントが書く文章の確認と、語の選び方の決まり。

      文章を追加する前に、既存の行を修正・削除することで足りないかを確かめ、足りるなら追加しない。

      ドキュメント・PR 本文・フェーズ手順に文章を追加したら、書き終えた直後に次を確認して当てはまる行を削除する。
      追加した分は以降の全ターンの起動プロンプトに載り続けるため、削除しないとノイズだけが増える。
      出典の略号は A = Anthropic Skill authoring best practices、C = Claude Code Best practices、P = Anthropic Prompting best practices、GT = Google Technical Writing One、T = textlint-rule-preset-ja-technical-writing（リンクはメタデータの `sources`）。
  - id: writing-style-check-01
    group: 文章の書き方
    name: 文章を追加した後の確認表
    body: |-
      <!-- table: data -->

      | 確認 | 当てはまったら削除する理由 | 出典 |
      | --- | --- | --- |
      | 手順に無い操作を禁じていないか | 書いていない操作は実行されない | |
      | そう書く理由・背景・経緯を説明していないか | 読み手の判断が変わらないなら要らない | |
      | 参照先（共通ルール / 規約 / テンプレート / フェーズ索引）に同じ内容が無いか | 参照を 1 行残せば足りる | |
      | 直前の正の指示の裏返しになっていないか | 「〜する」の後の「〜しない」は情報量が無い | |
      | 手順本文にあることを冒頭リードや概要で言い換えていないか | 冒頭リードは 1〜2 行 | |
      | 冒頭リード・概要に後から情報を追加していないか | 対象そのものが変わったときだけ書き換える | |
      | 後から増えうるものの個数を書いていないか | 増減のたびに数だけを修正する差分が出る。数を削除しても文は成立する | |
      | 1 つの説明が 3 行を超えていないか | 決めきれていないと言葉で埋めたくなる。内容を確定させれば短くなる | |
      | 削除しても読み手の動きが変わらない行を残していないか | 変わらない行は、他の指示を埋もれさせる | C |
      | モデルが既に知っている一般の知識（言語の仕様・ライブラリの使い方）を説明していないか | 書くのは、このプロジェクトで決めたことだけ | A / C |
      | 実装のコード例を載せていないか | 文で足りる。例は古い書き方に引っ張る。書式を示す例は、文より短く伝わるときだけ残す | A |
      | バージョン・価格・閾値・モデル名など、時期で古くなる値を書いていないか | 古くなっても修正されないまま注入され続ける。公式の参照先を書く | A / C |
      | 同じものを別の言葉で呼んでいないか | 別のものと読まれる。既出の呼び名に揃える | A / GT |
      | 選択肢を並べたまま、既定を決めていないか | 読み手が選べない。既定を 1 つ書き、例外だけ添える | A |
      | 強調（必ず・絶対・重要・太字）を追加していないか | 今のモデルは強調に過剰に反応する。重ねると、どれも目立たなくなる | P / C |
      | 推量やぼかし（〜と思われる・〜かもしれない）で書いていないか | 手順として実行できない。決めて書く | T |
      | 冗長な言い回し（することができる・を行う）を使っていないか | 省いても意味が変わらない | T |
      | 同じファイルの中で同じ説明を繰り返していないか（概要・まとめのセクションを含む） | 最も適切な 1 か所に置く | |

      <!-- /table -->
  - id: writing-style-check-02
    group: 文章の書き方
    name: 残してよい否定
    body: |-
      残してよい否定は、実行しうる操作を止めるものだけ。
      分岐の `（以降の手順は実行しない）` や、実行できてしまう操作への `（スレッドは Resolve しない）` がこれにあたる。

      既存の文章を変えないことは規約『既存文章の維持』が定める。
  - id: word-choice-01
    group: 語の選び方
    name: 文章でない所の語の選び方
    body: |-
      文章でない所（UI のラベル・見出し・表の列名・項目名・論理名）は、IT の分野で定着した語で書く。
      漢語でもカタカナ語でもよい。
      文章は自然な文でよい。話し言葉の動詞は避ける。

      定着したかは、Microsoft の用語集・Android の日本語文字列・その技術の公式ドキュメントで使われている語かで判断する。
      迷ったときの順序は判定フローチャート [語の選び方](id:flowchart-word-choice) に従う。
  - id: word-choice-principle-01
    group: 語の選び方 > 原則
    name: 対応表に無い語の判断
    body: |-
      対応表に無い語は、次の原則で判断する。
  - id: word-choice-principle-02
    group: 語の選び方 > 原則
    name: 語の選び方の原則表
    body: |-
      <!-- table: data -->

      | 原則 | 理由 | 悪い例 | 良い例 |
      | --- | --- | --- | --- |
      | 訓読みの動詞・一字の語をラベルに使わない | 意味の範囲が広く、短いラベルでは意味を特定できない | 送る・足す・題 | 送信・追加・タイトル |
      | 比喩で呼ばない | 比喩は正確さを損なう | 口・形・段 | インターフェース・スキーマ・レイヤー |
      | 定着したカタカナ語を和語に訳さない | 「造語を作らない」を「日本語に訳す」と読むと、和語の造語が増える | 写し・印 | コピー・マーカー |
      | 新しい呼び名を作る前に、辞書の語と、既存の製品・方法論での呼び名を探す。和語を名詞にした造語（〜事・〜もの・〜さ）を作らない | 辞書にも他の製品にも無い語は、読み手が意味を推測できない | 決め事・確からしさ | 検討事項・確度 |
      | 値を 1 文字だけで、何の値かを添えずに表示しない | 1 文字では何についての値か分からない | 大 | 影響度 大 |

      <!-- /table -->
  - id: word-choice-table-01
    group: 語の選び方 > ドキュメントの語の対応表
    name: 動詞は「する」を付ける
    body: |-
      文章の中の動詞は「する」を付けて使う（追加する・送信する）。
  - id: word-choice-table-02
    group: 語の選び方 > ドキュメントの語の対応表
    name: ドキュメントの語の対応表
    body: |-
      <!-- table: data -->

      | 避ける語 | 使う語 |
      | --- | --- |
      | 版 | バージョン |
      | 節 | セクション |
      | 題 | タイトル |
      | 印 | マーカー |
      | 口 | インターフェース |
      | 形 | スキーマ・構造 |
      | 段 | レイヤー・工程 |
      | 写し | コピー・複製・バックアップ |
      | 足す | 追加 |
      | 送る | 送信 |
      | 消す | 削除 |
      | 直す | 修正 |
      | 問い | 質問・リクエスト |
      | 答え | 回答・レスポンス |

      <!-- /table -->
  - id: word-choice-table-03
    group: 語の選び方 > ドキュメントの語の対応表
    name: UI の操作の語の参照
    body: |-
      画面の文言のうち、UI の操作の語は規約『入力と文言』の対応表に従う。
