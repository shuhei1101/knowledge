kind: rule
name: 文章の書き方
description: エージェントが記載する文章の確認表と、語の選び方（原則・ドキュメントの語の対応表）を定める。
tags:
  - name: scope:規約
    main: true
status: current
visibility: internal
rev: 2
last_reviewed: '2026-10-24'
related:
