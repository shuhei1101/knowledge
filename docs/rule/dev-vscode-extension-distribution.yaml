# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: dev-vscode-extension-distribution
kind: rule
name: VS Code 拡張機能の配布
description: VS Code 拡張機能のバージョンの更新・.vsix の作成・Marketplace への Trusted Publishing での公開と Open VSX への公開の決め方・利用者への入れ替えの依頼・ID・アイコンの扱いを定め、VS Code 拡張機能のコードを変更するときと公開するときに参照する。
status: current
visibility: internal
rev: 4
last_reviewed: '2026-11-14'
sources:
  - title: 'VS Code: Publishing Extensions'
    url: https://code.visualstudio.com/api/working-with-extensions/publishing-extension
    note: vsce package・publish と、Marketplace の拡張機能の ID
  - title: 'VS Code: Publish with GitHub Actions and Trusted Publishing'
    url: https://code.visualstudio.com/api/working-with-extensions/publishing-extension#publish-with-github-actions-and-trusted-publishing
    note: 'ポリシーの登録・id-token: write・vsce publish --oidc と、グローバル PAT の廃止'
  - title: 'Open VSX: Publishing Extensions'
    url: https://github.com/eclipse/openvsx/wiki/Publishing-Extensions
    note: ovsx publish
  - title: 'Open VSX: Trusted Publishing'
    url: https://github.com/eclipse/openvsx/wiki/Trusted-Publishing
    note: Open VSX の Trusted Publishing の前提
  - title: 'VS Code: Extension Manifest'
    url: https://code.visualstudio.com/api/references/extension-manifest
    note: icon の寸法
items:
  - id: overview
    name: 概要
    body: |-
      VS Code 拡張機能のバージョン・.vsix・公開・利用者への入れ替えの依頼の決まり。
      Claude プラグインは [version を置かない](id:claude-plugin#no-version-01) に従い、この規約を適用しない。
  - id: version-01
    group: バージョン
    name: コードを変えた PR でバージョンを上げる
    body: '- 拡張機能のコード（`package.json` の `contributes` を含む）を変えた PR で、`package.json` の `version` を上げる'
  - id: vsix-01
    group: .vsix
    name: タグで .vsix を作る
    body: '- タグ（例: `vscode-v{X}.{Y}.{Z}`）の push で CI が .vsix を作り、そのタグの GitHub Release に添える'
  - id: vsix-02
    group: .vsix
    name: 手動の .vsix は公開済みより上のバージョン
    body: |-
      - 手動でアップロードする .vsix は、Marketplace に公開済みのバージョンより上のバージョンにする
        - 同じバージョンは上書きできない
  - id: publish-01
    group: 公開
    name: Marketplace へは Trusted Publishing でタグから公開する
    body: |-
      - Marketplace へは、タグの push で CI が Trusted Publishing（GitHub Actions の OIDC）で公開する
        - 公開のジョブの `permissions` に `id-token: write` を付け、`vsce publish --oidc` で公開する
      - PAT では公開しない
  - id: publish-02
    group: 公開
    name: ポリシーの登録をユーザーに依頼する
    body: |-
      - Trusted Publishing のポリシーは、Marketplace の publisher 管理画面でユーザーに登録を依頼する
        - 依頼には Repository owner・Repository・Workflow のファイル名・Environment（使用しなければ空欄）を添える
  - id: publish-03
    group: 公開
    name: CI の公開の工程ができるまでの公開
    body: '- CI の公開の工程ができるまでは、.vsix を Marketplace の publisher 管理画面からアップロードして公開する'
  - id: publish-04
    group: 公開
    name: Open VSX へ公開するかはプロジェクトごとに決める
    body: '- Open VSX へ公開するかは、利用者が使用するエディタで判断し、プロジェクトごとにユーザーへ確認して決める'
  - id: reinstall-01
    group: 利用者への入れ替えの依頼
    name: 公開が自動でない間の入れ替え
    body: '- 公開が自動でない間は、反映作業で .vsix を作り、利用者に `code --install-extension {.vsix のパス}` での入れ替えを依頼する'
  - id: extension-id-01
    group: 拡張機能の ID
    name: 公開後に ID を変えない
    body: |-
      - 拡張機能の ID（`publisher.name`）は公開した後に変えない
        - 変えると別の拡張機能として載る
  - id: icon-01
    group: アイコン
    name: 初めて公開する前にアイコンを登録する
    body: |-
      - 初めて公開する前に、アイコンを作って `package.json` の `icon` に登録する
      - 図案は SVG で案を作り、ユーザーに確認して決める
      - 決まった SVG を原本としてリポジトリに配置し、`.vscodeignore` で .vsix から除く
      - `icon` には原本から書き出した PNG のパスを記載する
        - `icon` に SVG は使用できない
        - 寸法は Extension Manifest の `icon` の要件に従う
tags:
