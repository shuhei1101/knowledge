# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: python-llm-exception-retry
kind: rule
name: LLM 例外階層とリトライ戦略
description: LLM の例外階層と、リトライ・タイムアウト・サーキットブレーカーの戦略を定める。
tags:
  - name: scope:python
  - name: topic:llm
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      リトライ可否を例外の型で判断できるよう `LlmError` ベースで分類する。
  - id: llm-exception-retry-01
    group: LLM 例外階層とリトライ戦略
    name: LLM 例外階層の表
    body: |-
      <!-- table: data -->

      | 例外                      | 意味         | リトライ                                            |
      | ------------------------- | ------------ | --------------------------------------------------- |
      | `LlmRateLimitError`       | レート制限   | ✅ 指数バックオフ（`retry_after` 属性があれば尊重） |
      | `LlmServerError`          | 5xx          | ✅ 短い待ち                                         |
      | `IntegrationTimeoutError` | タイムアウト | ✅ ジッタ付き                                       |
      | `LlmBadRequestError`      | 4xx          | ❌ プロンプト修正が必要                             |
      | `LlmAuthError`            | 401 / 403    | ❌ API キー要修正                                   |
      | `LlmContentFilterError`   | フィルタ拒否 | ❌ 同じ入力は同じ結果                               |

      <!-- /table -->
  - id: with-retry-01
    group: with_retry デコレータ
    name: with_retry の引数
    body: |-
      - `@with_retry(retries=3, on=(...), base_delay=1.0, max_delay=30.0, jitter=0.2)`
  - id: with-retry-02
    group: with_retry デコレータ
    name: 指数バックオフとジッター
    body: |-
      - 指数バックオフ（`base_delay * 2^attempt` を max_delay でクランプ）+ ジッタ
  - id: with-retry-03
    group: with_retry デコレータ
    name: retry_after の優先
    body: |-
      - `LlmRateLimitError.retry_after`（Retry-After ヘッダから抽出してコンストラクタに渡す）があれば delay に優先採用
  - id: with-retry-04
    group: with_retry デコレータ
    name: リトライ時のログ
    body: |-
      - リトライ時は warning ログ（attempt / max / exception / delay_sec）、最終失敗は error ログ
  - id: timeout-01
    group: タイムアウト
    name: クライアントとデコレータのタイムアウト
    body: |-
      クライアントレベル（`AsyncOpenAI(timeout=30)`）+ デコレータレベル（`@with_timeout(seconds=60)`）の 2 レイヤー。
  - id: composition-01
    group: 合成
    name: デコレータの重ね方の参照
    body: |-
      デコレーターの重ね方は `core/デコレーター.md`。
  - id: circuit-breaker-01
    group: サーキットブレーカー
    name: サーキットブレーカーの参照
    body: |-
      外部規約『事前確認』の `## 処理ごとの確かめ方` に従う。
