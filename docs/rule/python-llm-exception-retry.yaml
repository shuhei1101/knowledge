items:
  - id: overview
    name: 概要
    body: |-
      リトライ可否を例外の型で判断できるよう `LlmError` ベースで分類する。
  - id: llm-exception-retry-01
    group: LLM 例外階層とリトライ戦略
    name: LLM 例外階層の表
    body: |-
      <!-- table: data -->

      | 例外                      | 意味         | リトライ                                            |
      | ------------------------- | ------------ | --------------------------------------------------- |
      | `LlmRateLimitError`       | レート制限   | ✅ 指数バックオフ（`retry_after` 属性があれば尊重） |
      | `LlmServerError`          | 5xx          | ✅ 短い待ち                                         |
      | `IntegrationTimeoutError` | タイムアウト | ✅ ジッタ付き                                       |
      | `LlmBadRequestError`      | 4xx          | ❌ プロンプト修正が必要                             |
      | `LlmAuthError`            | 401 / 403    | ❌ API キー要修正                                   |
      | `LlmContentFilterError`   | フィルタ拒否 | ❌ 同じ入力は同じ結果                               |

      <!-- /table -->
  - id: stamina-retry-01
    group: stamina によるリトライ
    name: stamina.retry の引数
    body: |-
      - `@stamina.retry(on=<フック関数>, attempts=<試行回数>, timeout=<全試行の待ち>, wait_initial=<最初の間隔>, wait_max=<間隔の上限>, wait_jitter=<ジッタ>)`（初回 + リトライ `<試行回数>` − 1 回。値は [クライアントとデコレータのタイムアウト](id:python-llm-exception-retry#timeout-01) の表で導く）
  - id: stamina-retry-02
    group: stamina によるリトライ
    name: 指数バックオフとジッター
    body: |-
      - 指数バックオフ（`wait_initial * wait_exp_base^(attempt - 1)` に 0〜`wait_jitter` 秒のジッタを加え、`wait_max` でクランプ）
  - id: stamina-retry-03
    group: stamina によるリトライ
    name: リトライは 1 層だけ
    body: |-
      - リトライは stamina の 1 層だけで行い、SDK のクライアントは `max_retries=0` を明示する
  - id: stamina-retry-04
    group: stamina によるリトライ
    name: retry_after の優先
    body: |-
      - `on` に渡すフック関数は、`LlmRateLimitError.retry_after`（Retry-After ヘッダから抽出してコンストラクタに渡す）があればその秒数（float）を返して待ちに使う。フックが返した待ちは `wait_max` で抑えられないため、`retry_after` が `wait_max` を超えるときは False を返してリトライせず、その値を 503 の Retry-After で返す。無ければ既定のバックオフ。同じ値を 503 の Retry-After にも使う（[fastapi/認証とエラー](id:python-fastapi-auth-error)）
  - id: stamina-retry-05
    group: stamina によるリトライ
    name: リトライ時のログ
    body: |-
      - リトライ時は warning ログ（attempt / max / exception / delay_sec）、最終失敗は error ログ
  - id: stamina-retry-06
    group: stamina によるリトライ
    name: テストではリトライの待ちを止める
    body: |-
      - テストでは `stamina.set_testing(True, attempts=...)` でバックオフの待ちを無効にする。試行の回数は `attempts`（既定は 1）になるので、リトライを確かめるテストでは `stamina-retry-01` と同じ回数を渡す
  - id: timeout-01
    group: タイムアウト
    name: クライアントとデコレータのタイムアウト
    body: |-
      クライアントレベル（`AsyncOpenAI(timeout=<各回の待ち>)`）+ stamina レベル（`@stamina.retry(timeout=<全試行の待ち>)`）+ デコレータレベル（`@with_timeout(seconds=<全体の待ち>)`）の 3 レイヤー。

      値は規約 [資源の値の決め方](id:dev-resource-values) の入れ子の待ちとリトライの導き方で、次の表のとおりに導く。
      出典の略号はメタデータの `sources` の `id`。

      <!-- table: data -->

      | 値 | 指定先 | 導き方 |
      | --- | --- | --- |
      | `<各回の待ち>` | クライアントの `timeout` | [タイムアウトの決め方](id:flowchart-timeout) で決める。公開仕様の値は、非ストリーミングの 1 回の呼び出しの上限（A / B） |
      | `<検証の再試行回数>` | Instructor の `max_retries` | 検証の失敗が解消するまでの実測の回数。実測が無ければ 1 にして測る作業を残す |
      | `<1 回の試行の待ち>` | - | `<各回の待ち>` ×（`<検証の再試行回数>` + 1）。Instructor を使用しないときは `<各回の待ち>` |
      | `<最初の間隔>`・`<ジッタ>` | stamina の `wait_initial`・`wait_jitter` | 上流の回復の実測から導く。実測が無ければ stamina の既定値（C）を明示して測る作業を残す |
      | `<間隔の上限>` | stamina の `wait_max` | `retry_after` を受けて待つ上限。`<全体の待ち>` が呼び出し元の待ちに収まる秒数 |
      | `<試行回数>` | stamina の `attempts` | `<全体の待ち>` が呼び出し元の待ちに収まる回数 |
      | `<全試行の待ち>` | stamina の `timeout` | `<1 回の試行の待ち>` × `<試行回数>` + `<間隔の上限>` ×（`<試行回数>` − 1） |
      | `<全体の待ち>` | `@with_timeout` の `seconds` | `<全試行の待ち>` + [余裕](id:dev-resource-values#default-values-01) |

      <!-- /table -->

      - 呼び出し元の待ちは、利用者・上流の待ちか外側の作業の上限
      - `<全体の待ち>` が呼び出し元の待ちを超えるときは、`<試行回数>`・`<間隔の上限>` を減らし、それでも超えるときは呼び出し元の待ちから `<各回の待ち>` を逆算する
      - stamina の `timeout` は実行中の試行を打ち切らないため、打ち切りは `@with_timeout` が担う（C）
  - id: composition-01
    group: 合成
    name: デコレータの重ね方の参照
    body: |-
      デコレーターの重ね方は [core/デコレーター](id:python-core-decorator)。
  - id: circuit-breaker-01
    group: サーキットブレーカー
    name: サーキットブレーカーの参照
    body: |-
      外部規約『事前確認』の `## 処理ごとの確かめ方` に従う。
