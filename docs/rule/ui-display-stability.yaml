# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: ui-display-stability
kind: rule
name: 表示の安定
description: 読み込み・待ち時間・動きで表示が崩れたり揺れたりしないようにする決まりを定め、画面の読み込み中の表示やアニメーションを設計・実装するときに参照する。
inject_when:
  field: text
  op: contains
  values:
    - 画面
    - UI
    - フロントエンド
    - tsx
    - HTML
    - コンポーネント
tags:
  - name: scope:ui
  - name: topic:アニメーション
  - name: topic:ダイアログ
  - name: topic:ポップオーバー
  - name: topic:待ち時間
  - name: topic:画面
  - name: action:実装
  - name: action:表示
    main: true
  - name: action:読み込み
status: current
visibility: internal
rev: 5
last_reviewed: '2026-11-10'
sources:
  - id: I
    title: pbakaus/impeccable
    url: https://github.com/pbakaus/impeccable
  - id: V
    title: Vercel Web Interface Guidelines
    url: https://vercel.com/design/guidelines
  - id: "N"
    title: "Nielsen Norman Group: Progress Indicators Make a Slow System Less Insufferable"
    url: https://www.nngroup.com/articles/progress-indicators/
  - id: MW
    title: GoogleChrome/modern-web-guidance
    url: https://github.com/GoogleChrome/modern-web-guidance
items:
  - id: overview
    name: 概要
    body: |-
      対象は共通（単体 HTML・React）。
      読み込み・待ち時間・動きで表示が崩れたり揺れたりしないようにする。
      出典の略号は次の表のとおり（リンクはメタデータの `sources`）。

      <!-- table: data -->

      | 略号 | 出典 |
      | --- | --- |
      | I | Impeccable |
      | V | Vercel Web Interface Guidelines |
      | N | Nielsen Norman Group |
      | MW | modern-web-guidance |

      <!-- /table -->
  - id: display-stability-01
    group: 表示の安定
    name: 表示の安定の決まり
    body: |-
      <!-- table: data -->

      | 要素 | 出典 |
      | --- | --- |
      | 画像は寸法を先に確保し、読み込みで周りを動かさない | V |
      | タブ・ビュー・絞り込みを切り替えても、周りのブロックの幅や高さを変えない | - |
      | ポップオーバーとメニューは、外側のクリックと Esc で閉じる。ダイアログの閉じ方は、閉じ方の表に従う | MW |
      | 幅・高さ・余白を動きの対象にしない | V / I |
      | メニューやツールチップが、親要素で切れないようにする | I |
      | 文字が他の要素に隠れたり、枠からはみ出したりしない | I |
      | 動きは状態の変化と操作への反応にだけ使う。頻繁に繰り返す操作には付けない。自動で動く図は [シンプルで凡庸でない見た目](id:ui-distinctive-look#motion-01) に従う | I / V |
      | 日時と数値は、言語標準の書式化機能で整形する | V |
      | 待ち時間で表示を変える。1 秒未満は出さない、10 秒未満は回る表示、10 秒以上は進み具合を割合で出す | N |

      <!-- /table -->
  - id: close-behavior-01
    group: 閉じ方
    name: ダイアログ・ポップオーバーの閉じ方の表
    body: |-
      <!-- table: data -->

      | 種類 | 外側のクリック | Esc |
      | --- | --- | --- |
      | ポップオーバー・メニュー | 閉じる | 閉じる |
      | 入力を持つダイアログ | 閉じない | 確認を挟んでから閉じる |
      | 確認ダイアログ | 閉じない | 閉じる |

      <!-- /table -->
  - id: close-behavior-02
    group: 閉じ方
    name: 閉じ方の実装
    body: |-
      - 単体 HTML は、`<dialog closedby>`・`popover`・`commandfor` で実装する。
        外側のクリックで閉じないダイアログは、`closedby="closerequest"` にする。
      - React は、Base UI の部品で実装する。
