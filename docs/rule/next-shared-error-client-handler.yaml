# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: next-shared-error-client-handler
kind: rule
name: handleAppError — クライアント側エラー処理
description: useQuery・useMutation のエラーをクライアント側で扱う handleAppError の使い方とエラー種別ごとの挙動を定める。
tags:
  - name: scope:next
  - name: topic:shared
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: handle-app-error-01
    group: handleAppError — クライアント側エラー処理
    name: handleAppError に渡す
    body: |-
      - `useQuery` / `useMutation` のエラーは `handleAppError(error, router)` 経由で処理
  - id: handle-app-error-02
    group: handleAppError — クライアント側エラー処理
    name: raw error を JSX に出さない
    body: |-
      - raw error / `error.message` を JSX に直接出さない
  - id: handle-app-error-03
    group: handleAppError — クライアント側エラー処理
    name: Server Action 直接呼びには使わない
    body: |-
      - Server Action 直接呼びには使わない（`result.ok` で分岐する方式）
  - id: error-kind-behavior-01
    group: エラー種別ごとの挙動
    name: エラー種別ごとの挙動表
    body: |-
      | Error                  | UX                                  |
      | ---------------------- | ----------------------------------- |
      | `ClientAuthError`      | toast + ログイン画面へ遷移          |
      | `VersionConflictError` | toast + `router.refresh()` で最新化 |
      | `RateLimitError`       | 長め（5 秒）の toast                |
      | 上記以外の AppError    | toast                               |
      | 予期しない             | 汎用文言の toast                    |
