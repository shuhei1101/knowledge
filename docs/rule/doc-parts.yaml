# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: doc-parts
kind: rule
name: ドキュメントの部品
description: ドキュメントサイトに配置する部品（タブ・ステップ・ファイルツリー・コードの行マーカー・バッジ）と使用する場面を定め、ドキュメントサイトに部品を配置するときに参照する。
tags:
  - name: scope:ドキュメント部品
  - name: topic:コード
  - name: topic:タブ
  - name: topic:ツリー
  - name: topic:バッジ
  - name: topic:ファイル
  - name: topic:マーカー
  - name: topic:文書
  - name: topic:部品
    main: true
status: current
visibility: internal
rev: 4
last_reviewed: '2026-10-24'
items:
  - id: overview
    name: 概要
    body: |-
      対象は共通（ドキュメントサイト）。
      ドキュメントサイトに配置する部品（タブ・ステップ・ファイルツリー・コードの行マーカー・バッジ）と使いどころ。
      記載方法は mdmark の使用方法『本文を部品で組む』に従う。
  - id: parts-usage-01
    group: 部品と使いどころ
    name: 部品と使いどころの表
    body: |-
      <!-- table: data -->

      | 部品 | 使用するとき | 使用しないとき |
      | --- | --- | --- |
      | タブ | 読み手が 1 つだけ選んで参照する並列の内容（OS・言語・導入方法） | 順に参照させる内容、全てを参照させたい内容 |
      | ステップ | 順に実行する手順 | 順序の無い項目 |
      | ファイルツリー | フォルダ構成を見せる | フォルダの役割を説明する文（表か地の文で記載する） |
      | コードの行マーカー | 変えた行・注目させる行をコードの中で示す | マーカーの無い行だけで足りるコード、行コメントを持たない言語（JSON 等） |
      | バッジ | 状態・バージョンなど短いラベル | 文になる説明、色で意味を分けたい区別 |

      <!-- /table -->
  - id: tab-01
    group: タブ
    name: タブの配置方法
    body: |-
      | 要素 | 配置方法 |
      | --- | --- |
      | 同じ軸のタブ | 同じページに同じ軸（OS 別など）のタブが複数あるときは `group=` を同じ値にして選択を統一する |
      | タブの中の見出し | タブ名の見出しの 1 段下にする |
  - id: step-01
    group: ステップ
    name: ステップの配置方法
    body: |-
      | 要素 | 配置方法 |
      | --- | --- |
      | 1 ステップ | 1 操作を記載する |
  - id: file-tree-01
    group: ファイルツリー
    name: ファイルツリーの配置方法
    body: |-
      | 要素 | 配置方法 |
      | --- | --- |
      | 注釈 | 説明の要る項目にだけ付ける |
  - id: code-line-marker-01
    group: コードの行マーカー
    name: コードの行マーカーの配置方法
    body: |-
      | 要素 | 配置方法 |
      | --- | --- |
      | マーカーを付ける行 | 変えた行・注目させる行に限る。コピーされる中身にはマーカーが残らない |
  - id: badge-01
    group: バッジ
    name: バッジの配置方法
    body: |-
      | 要素 | 配置方法 |
      | --- | --- |
      | 文言 | 状態・バージョンなど短いラベルにする。色は 1 色で、意味は文言で伝える |
  - id: adding-part-01
    group: 部品を追加するとき
    name: 部品の追加方法
    body: |-
      範囲を HTML コメントで包む記法を使用して追加する。
      範囲で包めない部品（コードの行マーカー・バッジ）は、GitHub で参照しても記載した文字が残る記法で追加し、打ち消し方を持たせる。
      部品と使いどころの表に行を追加し、その部品のセクションを追加する。
