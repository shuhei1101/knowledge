# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: python-packaging-python-version
kind: rule
name: Python バージョン方針
description: Python のバージョンの採用方針、最低ライン、新機能の採用判断を定める。
tags:
  - name: scope:python
  - name: topic:packaging
    main: true
status: current
visibility: internal
rev: 1
last_reviewed: '2026-10-24'
items:
  - id: python-version-01
    group: Python バージョン方針
    name: 高いバージョンを採用する
    body: |-
      - 極力高いバージョンを採用する。新規は最新安定版か 1 つ下（各版の状況は [Python のリリース状況](https://devguide.python.org/versions/)）
  - id: python-version-02
    group: Python バージョン方針
    name: 最低ラインは 3.12
    body: |-
      - `requires-python = ">=3.12"` を最低ライン（PEP 695 全面採用のため）
  - id: python-version-03
    group: Python バージョン方針
    name: マルチバージョン対応をしない
    body: |-
      - 内製 / 限定配布ならマルチバージョンサポートはしない
  - id: python-version-04
    group: Python バージョン方針
    name: バージョンの固定方法
    body: |-
      - 固定は pyproject の `requires-python` + `.python-version`（`uv python pin {バージョン}`）
  - id: new-feature-adoption-01
    group: 新機能の採用判断
    name: 新機能の採用判断
    body: |-
      新しいバージョンで入った機能は、そのバージョンの [What's New](https://docs.python.org/3/whatsnew/) で実験的な扱いでないことと、依存ライブラリが対応していることを確かめてから採用する。
  - id: lower-baseline-01
    group: 最低ラインを下げる場合
    name: 最低ラインを下げる条件
    body: |-
      レガシー連携が必須の場合のみ下げる。
