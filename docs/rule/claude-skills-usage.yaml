# yaml-language-server: $schema=../../schemas/rule.schema.yaml
id: claude-skills-usage
kind: rule
name: AgentSkills関連の知識
description: SKILL.md の公式の参照先、動的コンテキスト注入、変数の展開、ユーザー定義の環境変数の扱いを定め、SKILL.md にコンテキストや変数を埋め込むときに参照する。
