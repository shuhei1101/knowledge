id: "LIB-176-3"
visibility: internal
title: "yamllint"
kind: "ライブラリ"
version:
  current: 1.38.0
  latest: 1.38.0
  checked_on: '2026-11-05'
  source: '`scripts/check_all.py` のスクリプトの依存と uv のロック'
  pinning: 完全なバージョンで固定する
catalogs:
  - name: API
    version: 1.38.0
    entries:
      - name: yamllint.config.YamlLintConfig
        kind: クラス
        purpose: 設定ファイルを読み、検査のルールを組み立てる
        params:
          - name: file
            type: str
            required: false
            description: 設定ファイル（`.yamllint.yaml`）のパス
      - name: yamllint.linter.run
        kind: 関数
        purpose: YAML の文字列 1 つを検査し、違反を順に返す
        params:
          - name: input
            type: str
            required: true
            description: YAML の文字列
          - name: conf
            type: YamlLintConfig
            required: true
            description: 設定
          - name: filepath
            type: str
            required: false
            description: '設定の `ignore` に当てるパス'
        returns:
          - name: '[].line'
            type: int
            description: 行（1 始まり）
          - name: '[].rule'
            type: str
            description: ルールの名前（`comments` など）。YAML として読めない誤りは None
          - name: '[].level'
            type: Literal['error', 'warning']
            description: 設定の `level`
          - name: '[].desc'
            type: str
            description: 違反の内容
  - name: 設定
    version: 1.38.0
    entries:
      - name: extends・rules.{ルール}.level
        kind: 設定
        purpose: 既定の設定を引き継ぎ、ルールごとに無効・`error`・`warning` を決める
lead: YAML の構文と書き方（インデント・コメント・真偽値の書き方など）を検査する linter。
purl: pkg:pypi/yamllint@1.38.0
dependency_scope: 開発のみ
adoption: 採用
used_in:
  - scripts/
upstream: adrienverge/yamllint
verification:
  state: 未確認
  detail: PoC（#177）で CLI として既存の違反 6 件を確かめた。`yamllint.linter.run` を同じプロセスで呼ぶことは未確認
license: GPL-3.0（CI の検査で動かすだけで配布しないため、商用利用に影響しない）
official_url: https://pypi.org/project/yamllint/
docs_url: https://yamllint.readthedocs.io
selection:
  candidates: yamllint
  decision: Python で動き、`scripts/check_all.py` の依存として uv のロックで入る
install: |-
  `scripts/check_all.py` の冒頭のスクリプトの依存に追加し、`uv lock --script scripts/check_all.py` でロックする
