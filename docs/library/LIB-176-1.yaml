id: "LIB-176-1"
visibility: internal
title: "markdownlint-cli2"
kind: "CLI"
version:
  current: 0.24.0
  latest: 0.24.0
  checked_on: '2026-11-05'
  source: '`scripts/lint/package-lock.json`'
  pinning: 完全なバージョンで固定する（0.x で、出力の形式が変わりうる）
catalogs:
  - name: コマンド
    version: 0.24.0
    entries:
      - name: markdownlint-cli2 --config {設定} {ファイル}...
        kind: コマンド
        purpose: 指定した Markdown のファイルを検査し、違反を 1 件 1 行で標準エラーへ出す
        params:
          - name: --config
            type: str
            required: false
            description: 設定ファイル（`.markdownlint-cli2.jsonc`）のパス
          - name: '{ファイル}'
            type: str
            required: true
            description: 検査するファイルのパスか glob。複数を並べられる
        returns:
          - name: exit_code
            type: Literal[0, 1, 2]
            description: 0 = error の違反なし、1 = error の違反あり、2 = 設定などの誤りで検査できなかった
            notes: warning だけのときは 0
          - name: stderr
            type: str
            description: '違反 1 件を `{ファイル}:{行}[:{列}] {error|warning} {ルール名}/{別名} {内容}` の 1 行で出す'
  - name: 設定
    version: 0.24.0
    entries:
      - name: config
        kind: 設定
        purpose: ルールごとの有効・無効と、warning として扱うかを決める
        description: |-
          ルールの値は `true`・`false`・オプションのオブジェクトのほか、`"warning"` か `{"severity": "warning"}` で warning にできる。
          `default` は指定しなかったルールの既定。
      - name: customRules
        kind: 設定
        purpose: 追加のルール（JavaScript のモジュール）を読み込む
        description: '`names`・`description`・`parser`（`micromark` など）・`function(params, onError)` を持つオブジェクトを export する。`onError({lineNumber, detail})` で違反を出す'
lead: markdownlint（Markdown の lint）を設定ファイルとファイルの glob で動かす CLI。違反を行つきで出し、カスタムルールを読み込める。
purl: pkg:npm/markdownlint-cli2@0.24.0
dependency_scope: 開発のみ
adoption: 採用
used_in:
  - scripts/
  - .github/workflows/
upstream: DavidAnson/markdownlint-cli2
verification:
  state: 済
  date: '2026-11-05'
  detail: 'PoC（#177）で 0.24.0 の `customRules` と行の出力を確認した。レビュー（PR #176）で、`"MD036": "warning"` の違反が `warning` の行で出て終了コード 0 になることを確認した'
license: MIT（商用利用可）
official_url: https://www.npmjs.com/package/markdownlint-cli2
docs_url: https://github.com/DavidAnson/markdownlint-cli2
selection:
  candidates: markdownlint-cli2、markdownlint-cli
  decision: markdownlint の作者による CLI で、設定ファイルからカスタムルールを読み込める
install: |-
  ```bash
  npm ci --prefix scripts/lint
  ```

  `scripts/lint/node_modules/.bin/markdownlint-cli2` から呼ぶ
