# yaml-language-server: $schema=../../schemas/word-list.schema.yaml
id: word-list-ai-slop
kind: word-list
name: AI slop の単語の対応表
description: AI がよく使い、一般の文書では置き換えたほうがよい単語と置き換え先の対応表で、プラグイン slop-check の通知と規約『文章の書き方』が参照し、行を追加するときに読む。
tags:
  - name: scope:規約
  - name: topic:文章
  - name: topic:日本語
  - name: topic:正規表現
  - name: topic:単語
    main: true
  - name: action:選択
status: current
visibility: internal
rev: 2
last_reviewed: '2026-11-10'
items:
  - id: overview
    name: 概要
    body: |-
      AI が記載した文章だと一目で分かる単語と、その置き換え先。日本人は技術的な文章や会話でこれらの単語を普段使用しない。
      プラグイン slop-check が書き込んだ中身をこの対応表で照合して通知し、規約『文章の書き方』が本文に埋め込む。

      <!-- table: data -->

      | 種類 | 何が良くないか | NG → OK の例 |
      | --- | --- | --- |
      | 和語を使う | 和語の動詞・名詞は意味の幅が広く、何をしたかが曖昧になる。漢語に置き換えると操作が一意に決まる | 直す → 修正する、足す → 追加する |
      | 定着した外来語を和語に訳す | 一般に流通しているカタカナ語を、漢字 1 文字の単語や比喩に訳す。読み手が元の用語を推測する必要が生じ、検索でも見つからない | 節 → セクション、箱 → ノード |

      <!-- /table -->
  - id: pattern-rules-01
    group: 正規表現の記載の決まり
    name: pattern の書き方
    body: |-
      行を追加するときは、次の書き方で `pattern` を記載し、`examples` にヒットすべき文とヒットしてはいけない文を入れて検査を通す。

      <!-- table: data -->

      | 場面 | 書き方 | 例 |
      | --- | --- | --- |
      | 漢字 1 文字の単語 | 前は否定の後読み `(?<!...)`、後ろは否定の先読み `(?!...)` で、前後に漢字が続かないときだけヒットさせる | `(?<![㐀-鿿々])形(?![㐀-鿿々])`。「形容詞」「円形」はヒットしない |
      | 動詞 | 語幹の後ろに活用語尾を `(?:...)` で並べ、語幹の前に漢字の否定の後読みを付ける | `(?<![㐀-鿿々])直(?:さ\|し\|す\|せ\|そ\|っ)`。「直接」「見直す」はヒットしない |
      | ひらがなが続く複合語 | 正規表現で除かず、`allow` に入れる | 「割り当てる」「繰り返す」 |
      | 2 文字以上の名詞 | `pattern` を省き、`ng` の文字列をそのまま探す | - |
      | 表のセル・ラベル・分類の値のときだけ NG にする動詞 | 先頭に `(?m)` を付け、前を行頭・`\|`・開きかぎ括弧の後読みに限り、後ろを `\|`・行末・閉じかぎ括弧の先読みにする。バッククォートは前後の両方がバッククォートのときに限る別の分岐にする。前には「を」で終わる短い句（空白を含まない 4 文字以内か、英数字と半角空白）を許し、`note` に 1 単語の値のときだけヒットすることを記載する | `\| 一部を移す \|` はヒットし、「ログを残す。」はヒットしない |

      <!-- /table -->

      - 漢字の範囲は `[㐀-鿿々]`（CJK 統合漢字と拡張 A、「々」）で記載する。Python の `re` は `\p{Han}` を使えない
      - 後読みは固定の文字数だけ使える。1 文字の文字クラスで記載する
      - YAML ではシングルクォートで囲む
      - `ng` は通知の NG の列に出す単語で、動詞は終止形で記載する。括弧の補足は `ng` に入れず `note` に記載する
entries:
  - id: naosu
    ng: 直す
    ok: [修正]
    pattern: '(?<![㐀-鿿々])直(?:さ|し|す|せ|そ|っ|る|り|れ|ろ)'
    allow: [書き直]
    examples:
      hit: [設定を直す, 不具合を直した, 表示が直る]
      pass: [直接, 見直す, 書き直す, 直ちに]
  - id: tasu
    ng: 足す
    ok: [追加]
    pattern: '(?<![㐀-鿿々])足(?:さ|し|す|せ|そ)'
    examples:
      hit: [行を足す, 説明を足した]
      pass: [不足, 足りない, 足元]
  - id: kesu
    ng: 消す
    ok: [削除]
    pattern: '(?<![㐀-鿿々])消(?:さ|し|す|せ|そ)'
    examples:
      hit: [ファイルを消す, 行を消した]
      pass: [解消する, 消費, 消える]
  - id: katachi
    ng: 形
    ok: [スキーマ, 構造]
    pattern: '(?<![㐀-鿿々])形(?![㐀-鿿々])'
    note: 形状の意味なら「形状」
    examples:
      hit: [この形で記載する, 形が合わない]
      pass: [形容詞, 円形, 形式]
  - id: shirushi
    ng: 印
    ok: [マーカー]
    pattern: '(?<![㐀-鿿々])印(?![㐀-鿿々])'
    examples:
      hit: [行に印を付ける]
      pass: [印刷, 矢印, 目印]
  - id: okuru
    ng: 送る
    ok: [送信]
    pattern: '(?<![㐀-鿿々])送(?:ら|り|る|れ|ろ|っ)'
    examples:
      hit: [通知を送る, 結果を送った]
      pass: [送信, 転送する, 見送る]
  - id: dan
    ng: 段
    ok: [レイヤー, 工程]
    pattern: '(?<![㐀-鿿々])段(?![㐀-鿿々])'
    examples:
      hit: [次の段へ進む]
      pass: [段階, 手段, 階段]
  - id: setsu
    ng: 節
    ok: [セクション]
    pattern: '(?<![㐀-鿿々])節(?![㐀-鿿々])'
    examples:
      hit: [この節に記載する]
      pass: [調節, 節約, 季節]
  - id: han
    ng: 版
    ok: [バージョン]
    pattern: '(?<![㐀-鿿々])版(?![㐀-鿿々])'
    examples:
      hit: [新しい版を出す]
      pass: [出版, 版画]
  - id: kuchi
    ng: 口
    ok: [インターフェース]
    pattern: '(?<![㐀-鿿々])口(?![㐀-鿿々])'
    examples:
      hit: [描画の口を用意する]
      pass: [入口, 窓口, 口調]
  - id: toi
    ng: 問い
    ok: [質問, リクエスト]
    pattern: '(?<![㐀-鿿々])問い'
    allow: [問い合わせ]
    examples:
      hit: [問いに回答する]
      pass: [質問, 問い合わせ, 学問いろいろ]
  - id: dai
    ng: 題
    ok: [タイトル]
    pattern: '(?<![㐀-鿿々])題(?![㐀-鿿々])'
    examples:
      hit: [題を付ける]
      pass: [問題, 課題, 題名]
  - id: utsushi
    ng: 写し
    ok: [コピー, 複製, バックアップ]
    pattern: '(?<![㐀-鿿々])写し'
    allow: [書き写し]
    examples:
      hit: [設定の写しを残す]
      pass: [写真, 描写して, 書き写した]
  - id: kotae
    ng: 答え
    ok: [回答, レスポンス]
    pattern: '(?<![㐀-鿿々])答え'
    examples:
      hit: [答えを返却する, 質問に答える]
      pass: [回答, 応答, 口答え]
  - id: kaku
    ng: 書く
    ok: [記載]
    pattern: '(?<![㐀-鿿々])書(?:か|き|く|け|こ|い)'
    allow: [書き込, 書き出, 書き換]
    examples:
      hit: [本文に書く, 理由を書いた, 書き直す]
      pass: [文書, 書式, ファイルへ書き込む, 書き出す, 書き換える]
  - id: go
    ng: 語
    ok: [単語]
    pattern: '(?<![㐀-鿿々])語(?![㐀-鿿々])'
    examples:
      hit: [この語を使用する]
      pass: [単語, 用語, 語彙, 英語, 語りの型]
    allow:
      - 語り
  - id: shirase
    ng: 知らせ
    ok: [通知]
    pattern: '(?<![㐀-鿿々])知らせ'
    allow: [お知らせ]
    examples:
      hit: [知らせを出す, 利用者に知らせる]
      pass: [通知, お知らせ]
  - id: ateru
    ng: 当てる
    ok: [適用, ヒット]
    pattern: '(?<![㐀-鿿々])当て(?:る|た|て|な|ま|ら|れ)'
    allow: [割り当て]
    examples:
      hit: [規約を当てる]
      pass: [割り当てる, 当てはまる, 該当する]
  - id: sakeru
    ng: 避ける
    ok: [使用しない]
    pattern: '(?<![㐀-鿿々])避け(?:る|た|て|な|ま|ら|れ|ず)'
    examples:
      hit: [単語を避ける, 衝突を避けた]
      pass: [回避する, 避難]
  - id: tsukau
    ng: 使う
    ok: [使用]
    pattern: '(?<![㐀-鿿々])使(?:わ|い|う|え|お|っ)'
    examples:
      hit: [ツールを使う, 関数を使った, 使い方]
      pass: [使用する, 大使]
  - id: yomu
    ng: 読む
    ok: [参照]
    pattern: '(?<![㐀-鿿々])読(?:ま|み|む|め|も|ん)'
    allow: [読み込, 読み取]
    examples:
      hit: [規約を読む, 本文を読んだ]
      pass: [解読, 読者, 設定を読み込む, 値を読み取る]
  - id: oku
    ng: 置く
    ok: [配置]
    pattern: '(?<![㐀-鿿々])置(?:か|き|く|け|こ|い)'
    allow: [置き換]
    examples:
      hit: [ファイルを置く, ログを置いた]
      pass: [配置, 設置, 位置, 単語を置き換える]
  - id: tashikameru
    ng: 確かめる
    ok: [確認]
    pattern: '(?<![㐀-鿿々])確かめ'
    examples:
      hit: [結果を確かめる, 動作を確かめた]
      pass: [確認, 確かに]
  - id: kaesu
    ng: 返す
    ok: [返却, 回答]
    pattern: '(?<![㐀-鿿々])返(?:さ|し|す|せ|そ)'
    allow: [繰り返]
    examples:
      hit: [結果を返す, 値を返した]
      pass: [返却, 返信, 繰り返す]
  - id: miru
    ng: 見る
    ok: [確認, 参照]
    pattern: '(?<![㐀-鿿々])見(?:る|た|て|ま|れ|ず)'
    examples:
      hit: [ログを見る, 画面を見た, 差分を見ておく]
      pass: [意見, 見出し, 見つける, 予見]
  - id: watasu
    ng: 渡す
    ok: [指定]
    pattern: '(?<![㐀-鿿々])渡(?:さ|し|す|せ|そ)'
    allow: [引き渡]
    examples:
      hit: [引数に渡す, 値を渡した]
      pass: [譲渡, 引き渡し]
  - id: hazusu
    ng: 外す
    ok: [除外, 解除]
    pattern: '(?<![㐀-鿿々])外(?:さ|し|す|せ|そ|れ)'
    examples:
      hit: [ラベルを外す, 対象から外した]
      pass: [除外, 外部, 以外]
  - id: noseru
    ng: 載せる
    ok: [記載, 掲載, 表示]
    pattern: '(?<![㐀-鿿々])載せ'
    examples:
      hit: [表に載せる, 一覧に載せた]
      pass: [記載, 掲載]
  - id: nagasu
    ng: 流す
    ok: [実行, 送信]
    pattern: '(?<![㐀-鿿々])流(?:さ|し|す|せ|そ)'
    examples:
      hit: [テストを流す, 処理を流した]
      pass: [流れ, 交流, 電流]
  - id: soroeru
    ng: 揃える
    ok: [統一]
    pattern: '(?<![㐀-鿿々])揃(?:え|う|わ|い|っ)'
    examples:
      hit: [書式を揃える, 列が揃った]
      pass: [統一する]
  - id: kiku
    ng: 効く
    ok: [有効]
    pattern: '(?<![㐀-鿿々])効(?:か|き|く|け|こ|い)'
    examples:
      hit: [設定が効く, 変更が効いた]
      pass: [有効, 効果, 効率]
  - id: toosu
    ng: 通す
    ok: [実行, 合格]
    pattern: '(?<![㐀-鿿々])通(?:さ|し|す|せ|そ)'
    examples:
      hit: [検査を通す, レビューを通した]
      pass: [通信, 共通, 通知]
  - id: tsumu
    ng: 積む
    ok: [追加, 登録]
    pattern: '(?<![㐀-鿿々])積(?:ま|み|む|め|も|ん)'
    examples:
      hit: [commit を積む, 修正を積んだ]
      pass: [見積もり, 面積, 蓄積]
  - id: tateru
    ng: 立てる
    ok: [起票, 作成, 起動]
    pattern: '(?<![㐀-鿿々])立て'
    allow: [組み立て, 役立て]
    examples:
      hit: [Issue を立てる, サーバーを立てた]
      pass: [立つ, 設立, 組み立てる, 成り立つ]
  - id: tabaneru
    ng: 束ねる
    ok: [まとめる, グループ化]
    pattern: '(?<![㐀-鿿々])束ね'
    examples:
      hit: [条件を束ねる]
      pass: [約束, 拘束]
  - id: hirou
    ng: 拾う
    ok: [取得, 検出]
    pattern: '(?<![㐀-鿿々])拾(?:わ|い|う|え|お|っ)'
    examples:
      hit: [値を拾う, 例外を拾った]
      pass: [収拾]
  - id: hikaeru
    ng: 控える
    ok: [記録]
    pattern: '(?<![㐀-鿿々])控え'
    examples:
      hit: [番号を控える, 結果を控えた]
      pass: [控除]
  - id: yoseru
    ng: 寄せる
    ok: [統一, 合わせる]
    pattern: '(?<![㐀-鿿々])寄せ'
    examples:
      hit: [書き方を寄せる]
      pass: [寄与, 最寄り]
  - id: hiku
    ng: 引く
    ok: [検索, 参照]
    pattern: '(?<![㐀-鿿々])引(?:か|く|け|こ|い[たてで])'
    note: 調べる意味のとき
    examples:
      hit: [辞書を引く, 規約を引いた]
      pass: [引数, 索引, 引き継ぐ]
  - id: wo-okonau
    ng: を行う
    ok: [する]
    pattern: 'を行(?:う|い|っ|わ|え|お)'
    examples:
      hit: [確認を行う, 更新を行った]
      pass: [行数, 実行する]
  - id: suru-koto-ga-dekiru
    ng: することができる
    ok: [できる]
    pattern: 'することが(?:でき|出来)'
    examples:
      hit: [修正することができる]
      pass: [修正できる]
  - id: kamoshirenai
    ng: かもしれない
    ok: [言い切る]
    pattern: 'かもしれ(?:ない|ません)'
    examples:
      hit: [失敗するかもしれない]
      pass: [失敗する]
  - id: to-ieru
    ng: と言える
    ok: [言い切る]
    pattern: 'と言え(?:る|ます)'
    examples:
      hit: [妥当と言える]
      pass: [妥当である, と言う]
  - id: to-omowareru
    ng: と思われる
    ok: [言い切る]
    pattern: 'と思われ(?:る|ます)'
    examples:
      hit: [原因と思われる]
      pass: [原因である, と思う]
  - id: hako
    ng: 箱
    ok: [ノード]
    pattern: '(?<![㐀-鿿々])箱(?![㐀-鿿々])'
    examples:
      hit: [図の箱を並べる]
      pass: [箱庭, 本箱]
  - id: osu
    ng: 推す
    ok: [推奨]
    pattern: '(?<![㐀-鿿々])推(?:さ|し|す|せ|そ)'
    examples:
      hit: [案 A を推す, 案を推した]
      pass: [推奨, 推測, 類推]
  - id: utsusu-move
    ng: 移す
    ok: [移行, 移動]
    pattern: '(?m)(?:(?:^|(?<=\|)|(?<=[「『]))[ \t]*(?:(?:[A-Za-z0-9]{1,6} |[^\s|「」『』`、。]{1,4})を)?移す[ \t]*(?=\||$|[」』])|(?<=`)(?:(?:[A-Za-z0-9]{1,6} |[^\s|「」『』`、。]{1,4})を)?移す(?=`))'
    note: 表のセル・ラベル・分類の値など 1 単語の値のときだけヒットする
    examples:
      hit: ['| 移す |', '| 一部を移す |', '「移す」', '| A を移す |', '`行を移す`']
      pass: ['ファイルを別のフォルダへ移す。', '| 設定を新しい場所へ移す手順 |', '| 移行 |', '| 分類のタグの語彙。フォルダの目次の `README.md` の説明を移す |', '- ログを移す']
  - id: nokosu
    ng: 残す
    ok: [維持, 保持]
    pattern: '(?m)(?:(?:^|(?<=\|)|(?<=[「『]))[ \t]*(?:(?:[A-Za-z0-9]{1,6} |[^\s|「」『』`、。]{1,4})を)?残す[ \t]*(?=\||$|[」』])|(?<=`)(?:(?:[A-Za-z0-9]{1,6} |[^\s|「」『』`、。]{1,4})を)?残す(?=`))'
    note: 表のセル・ラベル・分類の値など 1 単語の値のときだけヒットする
    examples:
      hit: ['| 残す |', '| ログを残す |', '`残す`', '| PR を残す |']
      pass: ['ログを残す。', '| 残す件数 |', '| 維持 |', '- ログを残す']
  - id: utsusu-copy
    ng: 写す
    ok: [複製, コピー]
    pattern: '(?m)(?:(?:^|(?<=\|)|(?<=[「『]))[ \t]*(?:(?:[A-Za-z0-9]{1,6} |[^\s|「」『』`、。]{1,4})を)?写す[ \t]*(?=\||$|[」』])|(?<=`)(?:(?:[A-Za-z0-9]{1,6} |[^\s|「」『』`、。]{1,4})を)?写す(?=`))'
    note: 表のセル・ラベル・分類の値など 1 単語の値のときだけヒットする
    examples:
      hit: ['| 写す |', '| 設定を写す |']
      pass: ['画面を写す。', '| 書き写す |', '| 複製 |']
  - id: ireru
    ng: 入れる
    ok: [登録, 追加, 格納]
    pattern: '(?m)(?:(?:^|(?<=\|)|(?<=[「『]))[ \t]*(?:(?:[A-Za-z0-9]{1,6} |[^\s|「」『』`、。]{1,4})を)?入れる[ \t]*(?=\||$|[」』])|(?<=`)(?:(?:[A-Za-z0-9]{1,6} |[^\s|「」『』`、。]{1,4})を)?入れる(?=`))'
    note: 表のセル・ラベル・分類の値など 1 単語の値のときだけヒットする
    examples:
      hit: ['| 入れる |', '| 値を入れる |']
      pass: ['値を入れる。', '| 取り入れる |', '| 入れる場所を選ぶ |']
  - id: wakeru
    ng: 分ける
    ok: [分割, 分類]
    pattern: '(?m)(?:(?:^|(?<=\|)|(?<=[「『]))[ \t]*(?:(?:[A-Za-z0-9]{1,6} |[^\s|「」『』`、。]{1,4})を)?分ける[ \t]*(?=\||$|[」』])|(?<=`)(?:(?:[A-Za-z0-9]{1,6} |[^\s|「」『』`、。]{1,4})を)?分ける(?=`))'
    note: 表のセル・ラベル・分類の値など 1 単語の値のときだけヒットする
    examples:
      hit: ['| 分ける |', '| 行を分ける |']
      pass: ['行を分ける。', '| 見分ける |', '| 使い分ける |', '- 操作ごとに `group` の階層を分ける']
  - id: furui
    ng: 旧い
    ok:
      - 旧
    pattern: 旧い(?=[㐀-鿿々ァ-ヴー])
    note: 名詞の前に付けたとき
    examples:
      hit:
        - 旧い環境変数
        - 旧いバージョン
      pass:
        - 設定が旧い。
        - 旧環境変数
  - id: kakudo
    ng: 確度
    ok:
      - 確信度
    pattern: (?<![㐀-鿿々])確度
    examples:
      hit:
        - 確度が高い
        - 確度 高
      pass:
        - 正確度
        - 精確度
        - 確信度
  - id: katari
    ng: 語り
    ok:
      - ナレーション
      - 話し方
    pattern: (?<![㐀-鿿々])語り(?!合)
    examples:
      hit:
        - 語りの型
        - 語りかける
      pass:
        - 物語
        - 語り合う
        - 物語り
  - id: shohon
    ng: 正本
    ok:
      - 原本
    allow:
      - 修正本
      - 訂正本
      - 改正本
      - 補正本
    examples:
      hit:
        - Git で持つ正本
        - 正本の YAML
      pass:
        - 修正本文
        - 訂正本
        - 原本
  - id: dedokoro
    ng: 出どころ
    ok:
      - 出典
    examples:
      hit:
        - '出どころ: TH-1'
      pass:
        - 出典
  - id: okosu
    ng: 起こす
    ok:
      - 作成
      - 記載
    pattern: (?<![㐀-鿿々])起こ(?:さ|し|す|せ|そ)
    allow:
      - 書き起こ
      - 引き起こ
      - 掘り起こ
      - 呼び起こ
      - 思い起こ
    note: 資料・設計書にする意味のとき
    examples:
      hit:
        - 設計書に起こす
        - 図に起こした
      pass:
        - 書き起こし
        - 引き起こす
        - 掘り起こす
        - 起きる
        - 文字起こし
        - 思い起こす
  - id: ataru
    ng: 当たる
    ok:
      - 該当
      - ヒット
    pattern: (?<![㐀-鿿々])当た(?:ら|り|る|れ|ろ|っ)
    allow:
      - 当たり前
      - 突き当た
      - 行き当た
      - 差し当た
      - 思い当た
      - つ当たり
      - り当たり
    note: 条件に合う意味のとき
    examples:
      hit:
        - 条件に当たる
        - 規約に当たった
        - どれにも当たらない
      pass:
        - 当たり前
        - 突き当たり
        - 心当たり
        - 行き当たり
        - 該当する
        - 担当
        - 1 つ当たり
        - ひとり当たり
  - id: viewer
    ng: ビューアー
    ok:
      - ビュワー
    allow:
      - レビューアー
      - プレビューアー
      - インタビューアー
    examples:
      hit:
        - 成果のビューアー
      pass:
        - レビューアー
        - プレビューアー
        - ビュワー
        - インタビューアー
  - id: etsuransha
    ng: 閲覧者
    ok:
      - 読者
    examples:
      hit:
        - 閲覧者に表示する
      pass:
        - 読者
        - ページを閲覧する
  - id: accessible-name
    ng: アクセシブルネーム
    ok:
      - スクリーンリーダー向けの名前
    examples:
      hit:
        - ボタンのアクセシブルネーム
      pass:
        - スクリーンリーダー向けの名前
  - id: no-waku
    ng: 〜の枠
    ok:
      - 〜ブロック
    pattern: の枠(?![線組内外])
    allow:
      - 風の枠
    note: UI のまとまった表示のとき。枠線の意味なら「枠線」
    examples:
      hit:
        - 通知の枠
        - 読み込み中の枠を出す
        - 共通の枠
      pass:
        - 枠線を引く
        - 枠の中に枠を入れない
        - フォーカス枠
        - ポラロイド風の枠
        - 実装の枠組み
        - 表示の枠内
  - id: button-wo
    ng: 〜を追加・〜を表示
    ok:
      - 〜追加・〜表示
    pattern: '(?m)(?:(?:^|(?<=\|)|(?<=[「『]))[ \t]*(?:[A-Za-z0-9]{1,6} |[^\s|「」『』`、。]{1,4})を(?:追加|表示)[ \t]*(?=\||$|[」』])|(?<=`)(?:[A-Za-z0-9]{1,6} |[^\s|「」『』`、。]{1,4})を(?:追加|表示)(?=`))'
    note: ボタンの文言など 1 単語の値のときだけヒットする
    examples:
      hit:
        - '| コメントを追加 |'
        - 「変更を表示」
        - '`権限を追加`'
        - '| Issue を追加 |'
      pass:
        - コメントを追加する。
        - '| コメント追加 |'
        - '- 変更を表示する'
        - '| 行を追加する手順 |'
        - 変更を表示した後に保存する
