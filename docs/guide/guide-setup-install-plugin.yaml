items:
  - id: overview
    name: 概要
    body: |-
      knowledge のスキル（文章を点検して修正する `/knowledge:text-review`）を Claude Code で使いたいときに実行する。
      プラグイン slop-check を入れると、書き込むツールの実行の後に、書き込んだ中身にある AI slop の単語と置き換え先が通知される。
  - id: prerequisite-01
    group: 前提
    name: "前提: Claude Code の導入"
    body: |-
      - Claude Code を入れてある
  - id: step-marketplace-01
    group: 手順 > マーケットプレイスを登録する
    name: マーケットプレイスの登録
    body: |-
      ```bash
      claude plugin marketplace add shuhei1101/knowledge
      ```

      登録しないと、次の手順で `knowledge@knowledge` が見つからずに失敗する。
  - id: step-install-01
    group: 手順 > プラグインを入れる
    name: プラグインのインストール
    body: |-
      ```bash
      claude plugin install knowledge@knowledge
      ```

      既定はユーザースコープで、どのプロジェクトでも使える。
      特定のプロジェクトだけで使うときは、そのプロジェクトの直下で `--scope project` を付ける。
  - id: step-install-slop-check-01
    group: 手順 > AI slop の単語の通知を入れる
    name: slop-check のインストール
    body: |-
      ```bash
      claude plugin install slop-check@knowledge
      ```

      フックは端末の `python3`（3.12 以上）で起動する。`python3` が PATH に無いと、書き込むたびにフックが失敗し、通知が出ない。
  - id: reflection-01
    group: 反映
    name: 反映は reload
    body: |-
      `/reload`（開いている Claude Code のセッションで `/reload-plugins` を実行する）。
  - id: check-installed-01
    group: 確認 > プラグインが有効になっている
    name: プラグインが有効なことを確認
    body: |-
      ```bash
      claude plugin list
      ```

      `knowledge@knowledge` と、入れたときは `slop-check@knowledge` が `enabled` で並ぶ。
  - id: check-skill-01
    group: 確認 > スキルを呼べる
    name: スキルを呼べることを確認
    body: |-
      Claude Code のセッションで `/knowledge:text-review` と入力すると、スキルが候補に出る。
  - id: check-slop-check-01
    group: 確認 > AI slop の単語が通知される
    name: 単語の通知の確認
    body: |-
      Claude Code のセッションで、一時ファイルに「設定を直す。」と書き込むよう Claude に頼む。
      書き込みの後に、NG が `直す`・OK が `修正` の表を持つ通知が Claude のコンテキストに入る（通知の内容をそのまま示すよう頼むと返る）。
  - id: rollback-01
    group: 元に戻す
    name: 元に戻す
    body: |-
      ```bash
      claude plugin uninstall slop-check@knowledge
      claude plugin uninstall knowledge@knowledge
      claude plugin marketplace remove knowledge
      ```

      マーケットプレイスを削除すると、そこから入れたプラグインも外れる。
      AI slop の単語の通知だけを止めるときは、1 行目だけを実行する。
