id: guide-setup-docs-mcp
kind: guide
name: knowledge を project-index の配信元に登録する
description: knowledge を project-index の配信元に登録して dev-docs の画面と文書の MCP で文書を検索する手順と、反映・確認・元に戻す方法を示し、どの端末・作業場所からでも規約を検索・取得したいときに参照する。
