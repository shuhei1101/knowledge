items:
  - id: overview
    name: 概要
    body: どの端末・作業場所からでも、knowledge の規約を dev-docs の画面で参照し、project-index の文書の MCP で検索・取得したいときに実行する。
  - id: prerequisite-01
    group: 前提
    name: '前提: project-index と dev-docs のプラグインの導入'
    body: |-
      - 端末に uv・git・Claude Code がある
      - project-index のリポジトリをクローンしてある
      - プラグイン `project-index` をユーザースコープで入れてある（project-index の [project-indexを入れる](https://github.com/shuhei1101/project-index/blob/develop/docs/guide/project-index%E3%82%92%E5%85%A5%E3%82%8C%E3%82%8B.md) の手順 1〜2）
      - 画面で参照するときは、dev-docs のプラグイン `dev-docs` も入れてある（dev-docs の [dev-docsを入れる](https://github.com/shuhei1101/dev-docs/blob/develop/docs/guide/dev-docs%E3%82%92%E5%85%A5%E3%82%8C%E3%82%8B.md) の手順 1〜2）
  - id: step-global-setup-01
    group: 手順 > 端末を準備する
    name: global-setup の実行
    body: |-
      ```text
      /project-index:global-setup {project-index のクローンの絶対パス}
      ```

      端末の設定の場所を聞かれたら、既定の `~/.config/project-index/settings.yaml` を選ぶ。
      既に端末の設定がある端末でも同じコマンドを実行する。
      既にある `sources[]` の行は削除されない。
  - id: step-global-setup-02
    group: 手順 > 端末を準備する
    name: MCP の再接続
    body: |-
      Claude Code で `/mcp` を開き、`project-index` に再接続する。
      再接続しないと、そのセッションから文書の MCP のツールを呼べない。
  - id: step-clone-01
    group: 手順 > knowledge を clone する
    name: リポジトリの clone
    body: |-
      ```bash
      git clone https://github.com/shuhei1101/knowledge.git {clone する先}
      ```

      clone した先の絶対パスを次の手順で使用する。
      既に clone してある端末では、その場所を使用する。
  - id: step-setup-01
    group: 手順 > knowledge を配信元に登録する
    name: setup の実行
    body: |-
      ```text
      /project-index:setup {knowledge のクローンの絶対パス}
      ```

      点検は管理の MCP の `check_project` で行う。
      knowledge の `dev-docs.yaml`・スキーマ・`scripts/` に違反があると、キーのパスと理由を示して止まり、`sources[]` に行が追加されない。
      project-index は、配信元のフォルダに `project-index.yaml` が無ければ `dev-docs.yaml` を読み込む。
  - id: step-setup-02
    group: 手順 > knowledge を配信元に登録する
    name: 参照・書き込みできる範囲の回答
    body: |-
      聞かれた `scope.read` には全ての作業場所を配置するフォルダの glob、`scope.write` には knowledge のクローンのパスを回答する。
      記載する内容の表を了承すると、端末の設定の `sources[]` に次の行が追加される。

      ```yaml
      sources:
        - config: {knowledge のクローンの絶対パス}/dev-docs.yaml
          scope:
            read: ["{作業場所を配置するフォルダ}/**"]
            write: ["{knowledge のクローンの絶対パス}"]
      ```

      配信元の ID は、knowledge の `dev-docs.yaml` の `name`（`knowledge`）になる。
      worktree（`.claude/worktrees/*`）の中の作業場所はクローンにいるものとして判定するので、`scope.write` に worktree を並べなくてよい。
      `scope.read` にヒットしない作業場所からは、knowledge の文書を参照できない。
  - id: step-screen-01
    group: 手順 > 画面で参照する
    name: 画面を開く
    body: |-
      ブラウザで dev-docs の画面 `http://127.0.0.1:8781/knowledge` を開き、種類のタブとサイドバーから文書を選ぶ。
      ポートを `DEV_DOCS_PORT` で変えた端末では、その番号にする。
      画面は、project-index の読み取り API で knowledge の文書を取得して表示する。
      画面の操作は dev-docs の [画面で読む](https://github.com/shuhei1101/dev-docs/blob/develop/docs/guide/%E7%94%BB%E9%9D%A2%E3%81%A7%E8%AA%AD%E3%82%80.md) にある。
  - id: step-mcp-01
    group: 手順 > MCP で検索・取得する
    name: source に knowledge を指定する
    body: |-
      Claude Code から project-index の文書の MCP の `search_docs` に `source: knowledge` と単語・タグを指定して検索する。
      ヒットした文書の ID を指定して本文を取得する。
      `source` を省くと作業中の配信元を指すので、knowledge のクローンの外では knowledge の文書が返らない。
      ツールの引数は project-index の [文書のMCP](https://github.com/shuhei1101/project-index/blob/develop/docs/guide/%E6%96%87%E6%9B%B8%E3%81%AEMCP.md) にある。
  - id: step-mcp-02
    group: 手順 > MCP で検索・取得する
    name: 書き込みは scope.write の中から
    body: |-
      `write_docs`・`delete_docs` は、knowledge のクローンか worktree の中の作業場所から呼ぶ。
      それ以外の作業場所から呼ぶと、書き込まずに断られる。
      スキーマと検査のスクリプト（`scripts/`）に合格しない内容は、書き込まずに `isError` で返る。
  - id: reflection-01
    group: 反映
    name: 反映のタイミング
    body: |-
      - 端末の設定の `sources[]`: `即時`（`/project-index:setup` が最後に管理の MCP の `reload` を呼ぶ）
      - knowledge の `dev-docs.yaml`・スキーマ・`scripts/`: 管理の MCP の `reload` を呼ぶまで、変える前の設定で配信する。
        確認の方法は project-index の [配信元を配信する](https://github.com/shuhei1101/project-index/blob/develop/docs/guide/%E9%85%8D%E4%BF%A1%E5%85%83%E3%82%92%E9%85%8D%E4%BF%A1%E3%81%99%E3%82%8B.md) にある
  - id: check-served-01
    group: 確認 > knowledge が配信中になっている
    name: 設定画面の状態の確認
    body: |-
      ブラウザで `http://127.0.0.1:8781/_settings` を開く。

      knowledge の行の状態が `配信中` と出る。
  - id: check-search-01
    group: 確認 > クローンの外から knowledge の文書を検索できる
    name: クローンの外からの検索の確認
    body: |-
      knowledge のクローンの外の作業場所で Claude Code を起動し、`search_docs` に `source: knowledge` を指定する。

      knowledge の規約が、名前・説明・タグつきで返る。
  - id: rollback-01
    group: 元に戻す
    name: 元に戻す
    body: |-
      設定画面（`/_settings`）で、knowledge の行の削除のボタンを押す。
      端末の設定から knowledge の行が削除され、配信から除外される。
      行を残したまま配信を止めるときは、鉛筆のボタンで `配信` のスイッチをオフにする。

      | 残るもの | 扱い |
      | --- | --- |
      | knowledge のクローン | 要らなければ削除する |
      | project-index・dev-docs のプラグインと端末の設定 | ほかの配信元が使用するので残す |
