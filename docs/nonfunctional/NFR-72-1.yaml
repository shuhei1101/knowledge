id: "NFR-72-1"
visibility: internal
title: "非機能要件"
requirements:
  - id: NFR-1
    name: 検査と変換のスクリプトの 1 文書あたりの処理時間
    english_name: script_duration
    category: 性能
    external_constraint: project-index はスクリプトを端末の設定 `script_timeout_sec`（既定 30 秒）で打ち切る
    source_kind: 実行基盤の制限
    source: https://github.com/shuhei1101/project-index/blob/develop/src/project_index/features/settings/types.py
    value: '20'
    unit: 秒
    rationale: 外側の待ち 30 秒に、内側（スクリプト全体）の 50% の余裕を含めて 30 ÷ 1.5 = 20 秒にする。余裕は実測が無いので仮置きで、実装の後に最も大きい文書で測って見直す
    overflow: 30 秒を超えたときは project-index が `timeout` として返却する（書き込みは行われない）
    breakdown:
      - part: 外側の待ち（project-index の `script_timeout_sec`）
        value: 30 秒
      - part: 余裕（内側の 50%）
        value: 10 秒
        notes: 実測が無いので仮置き
      - part: スクリプト全体
        value: 20 秒
  - id: NFR-2
    name: CI の 1 回の所要時間
    english_name: ci_duration
    category: 性能
    external_constraint: GitHub Actions の GitHub ホストランナーのジョブは 6 時間で打ち切られる
    source_kind: 実行基盤の制限
    source: https://docs.github.com/ja/actions/administering-github-actions/usage-limits-billing-and-administration
    value: '5'
    unit: 分
    rationale: 外側の 6 時間は上限で、配信までの待ちは内側の所要時間で決める。内側（内訳）の合計 3 分に 50% の余裕を追加して切り上げた 5 分をジョブの `timeout-minutes` にする。内側は実測が無いので仮置きで、実装の後に CI の実行で測って見直す
    breakdown:
      - part: 環境の用意（checkout・Node 24・uv と Python 3.14・依存）
        value: 2 分
        notes: 実測が無いので仮置き
      - part: Pages の成果物の作成
        value: 1 分
        notes: 手元の測定で公開の 5 文書が約 11 秒（CMD-72-1）。ランナーの実測が無いので 1 分を仮置き
      - part: 余裕（内側の 50%）
        value: 1.5 分
      - part: ジョブの打ち切り（切り上げ）
        value: 5 分
    overflow: GitHub Actions がジョブを打ち切り、配信しない（前に配信したサイトのまま）
  - id: NFR-3
    name: スクリプトが動く OS
    english_name: supported_os
    category: 動作環境
    external_constraint: project-index は端末の WSL2 の Ubuntu で動き、CI は GitHub ホストランナーの `ubuntu-latest` で動く
    source_kind: 実行基盤の制限
    value: Linux（WSL2 の Ubuntu と ubuntu-latest）
    rationale: スクリプトを起動するのは project-index・手元のコマンド・CI だけで、どれも Linux で動く。スクリプトの仮想環境は uv のキャッシュ（Linux 側）に配置する（MOD-72-1）
    source: ARCH-72-1#subsystems[scripts]
  - id: NFR-4
    name: Markdown のテンプレートの生成の所要時間
    english_name: markdown_template_duration
    category: 性能
    external_constraint: テストの全件実行のジョブは 40 分で打ち切られ、全ての文書の検査は生成を子プロセスで待つ。初回の起動は uv が git から dev-docs と依存を取得する
    source_kind: 実行基盤の制限
    source: IF-352-1#
    value: '180'
    unit: 秒
    rationale: 内側（内訳）の合計 120 秒に 50% の余裕を追加して 180 秒にする。内側は実測が無いので仮置きで、実装の後に初回と 2 回目の起動を測って見直す
    overflow: 全ての文書の検査が子プロセスを打ち切り、他の検査を終えてから終了コード 2 で終わる
    breakdown:
      - part: dev-docs と依存の取得（初回だけ）
        value: 90 秒
        notes: 実測が無いので仮置き
      - part: 全ての種類の変換と比較
        value: 30 秒
        notes: 実測が無いので仮置き
      - part: 余裕（内側の 50%）
        value: 60 秒
      - part: 打ち切り
        value: 180 秒
lead: 外部の制約から逆算した knowledge の決定値（検査と変換のスクリプトの処理時間・CI の所要時間など）を定め、これらの値を決める・変えるときに参照する。
