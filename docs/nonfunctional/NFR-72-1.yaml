id: "NFR-72-1"
visibility: internal
title: "非機能要件"
requirements:
  - id: NFR-1
    name: 検査と変換のスクリプトの 1 文書あたりの処理時間
    english_name: script_duration
    category: 性能
    external_constraint: project-index はスクリプトを端末の設定 `script_timeout_sec`（既定 30 秒）で打ち切る
    source_kind: 実行基盤の制限
    source: https://github.com/shuhei1101/project-index/blob/develop/src/project_index/features/settings/types.py
    value: '20'
    unit: 秒
    rationale: 外側の待ち 30 秒に、内側（スクリプト全体）の 50% の余裕を含めて 30 ÷ 1.5 = 20 秒にする。余裕は実測が無いので仮置きで、実装の後に最も大きい文書で測って見直す
    overflow: スクリプトは起動時に開始時刻を記録し、maid を呼ぶ前に残り時間を確認する。残りが足りなければ maid を呼ばず、時間切れを違反として返却する（書き込みは行われない）。maid には残り時間を打ち切りとして指定する。それでも 30 秒を超えたときは project-index が `timeout` として返却する
    breakdown:
      - part: 外側の待ち（project-index の `script_timeout_sec`）
        value: 30 秒
      - part: 余裕（内側の 50%）
        value: 10 秒
        notes: 実測が無いので仮置き
      - part: スクリプト全体（maid の呼び出しを含む）
        value: 20 秒
  - id: NFR-2
    name: CI の 1 回の所要時間
    english_name: ci_duration
    category: 性能
    external_constraint: GitHub Actions の GitHub ホストランナーのジョブは 6 時間で打ち切られる
    source_kind: 実行基盤の制限
    source: https://docs.github.com/ja/actions/administering-github-actions/usage-limits-billing-and-administration
    value: '5'
    unit: 分
    rationale: 外側の 6 時間は上限で、配信までの待ちは内側の所要時間で決める。内側（内訳）の合計 3 分に 50% の余裕を追加して切り上げた 5 分をジョブの `timeout-minutes` にする。内側は実測が無いので仮置きで、実装の後に CI の実行で測って見直す
    breakdown:
      - part: 環境の用意（checkout・Node 24・uv と Python 3.14・依存）
        value: 2 分
        notes: 実測が無いので仮置き
      - part: Pages の成果物の作成
        value: 1 分
        notes: 手元の測定で公開の 5 文書が約 11 秒（CMD-72-1）。ランナーの実測が無いので 1 分を仮置き
      - part: 余裕（内側の 50%）
        value: 1.5 分
      - part: ジョブの打ち切り（切り上げ）
        value: 5 分
    overflow: GitHub Actions がジョブを打ち切り、配信しない（前に配信したサイトのまま）
  - id: NFR-3
    name: スクリプトが動く OS
    english_name: supported_os
    category: 動作環境
    external_constraint: project-index は端末の WSL2 の Ubuntu で動き、CI は GitHub ホストランナーの `ubuntu-latest` で動く
    source_kind: 実行基盤の制限
    value: Linux（WSL2 の Ubuntu と ubuntu-latest）
    rationale: スクリプトを起動するのは project-index・手元のコマンド・CI だけで、どれも Linux で動く。maid は Linux 側のファイルシステムに入れ、スクリプトの仮想環境は uv のキャッシュ（Linux 側）に配置する（MOD-72-1）
    source: ARCH-72-1#subsystems[scripts]
