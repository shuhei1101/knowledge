id: changelog
kind: changelog
name: 変更履歴
description: リリースのバージョンごとに入った PR とその変更内容を一覧し、どのバージョンで何が変わったかを調べるときに読む。
tags:
  - name: scope:はじめに
  - name: topic:http
  - name: topic:naming
  - name: topic:pr
  - name: topic:yaml
  - name: topic:キー
  - name: topic:サーバー
  - name: topic:ダークモード
  - name: topic:テキスト
  - name: topic:テンプレート
  - name: topic:バージョン
  - name: topic:ファイル
  - name: topic:フォーム
  - name: topic:フローチャート
  - name: topic:プラグイン
  - name: topic:プロジェクト
  - name: topic:プロンプト
  - name: topic:出典
