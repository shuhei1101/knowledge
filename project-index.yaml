# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/dev-docs/3fa52c474176b95140f6e05ec4a78869e1dd401c/schemas/dev-docs.schema.json
version: "3"
name: knowledge
description: どのプロジェクトでも共通で使用するコーディング規約・テンプレート・判定フローチャート・判定表・チェックシート・使い方と、台本・演出・ゲーム作りなどの創作の知見（ノウハウ）
instructions: |-
  規約（rule）・ノウハウ（knowhow）・テンプレート（template）・判定フローチャート（flowchart）・判定表（decision-table）・チェックシート（checksheet）・使い方（guide）・変更履歴（changelog）・単語の対応表（word-list）・用語集（terms）は `docs/` の YAML が原本で、種類ごとの行に分かれる。
  レビューの観点（review_aspect）は、レビューのチェックシート（`checksheet-review-*`）の `aspects` の要素 1 件ずつの文書で、`target:`（成果物の種類）・`process:`（工程）のタグで絞って取得する。
  スキル（skill）は `docs/skill/` の YAML が原本で、書式は `schemas/design/agent_flow.schema.yaml` の `type: skill` で、`steps[]` が工程を持つ。
  本文は `items[]` の各項目が持ち、`[名前](id:{文書の ID}#{項目の ID})` で他の文書・項目を指す。`related[].when` がその文書を読むときを表す。
  YAML の文書の行に当たらないファイル（`skills/`・`scripts/`・`schemas/`・`tests/`・`plugins/slop-check/`・直下・`docs/` の目次）は、各フォルダの `files.yaml` が名前・概要文・タグを持つ。`docs/pr/` は配信しない。
  設計書（`docs/` の `scenario`・`interface`・`module` などの種類のフォルダ）は AI Monitor の設計書で、書式は knowledge の原本 `schemas/design/{種類}.schema.yaml` が持ち、他の設計書は `{ID}#{項目のパス}` で指す。
  書き込みのときは knowledge-checks が、項目の ID の重複・参照先の実在・`aliases` の衝突・文書の中の `aliases` の重複を検査する。
  ノウハウ（knowhow）・単語の対応表（word-list）・用語集（terms）・規約（rule）・判定フローチャート（flowchart）・判定表（decision-table）・チェックシート（checksheet）・使い方（guide）は、端末の設定の `direct_commit.scope` に当たる作業場所から `write_docs` の `commit` で develop へ直コミットできる。規約などの本文の直コミットは行の追加と文言の修正だけにする。管理用の YAML の種類（scripts・plugin・tests・schemas・docs_folder・root）は、行のメタデータだけを直コミットでき、行が指す本文のファイルは直コミットできない（skills は本文のファイルも直コミットできる）。単語の対応表を書き込むと、生成の build-word-list が対応表のコピーを再作成する。
when:
  - コードを作成・レビューする前に、言語やフレームワークの規約を確認するとき
  - 設計書・文書を作成する前に、テンプレートと記載方法の規約を確認するとき
  - 設定の置き場所・表し方・命名などの判断に迷ったときに、判定フローチャートを参照するとき
  - 台本・演出・ゲーム作りなどの創作で、使える技法（ノウハウ）を探すとき
related:
  types: [references, requires, replaces, part_of, change_together, see_also, implements, tests]
github:
  repository: shuhei1101/knowledge
validators:
  - id: knowledge-checks
    run: [uv, run, --frozen, --script, scripts/knowledge_checks.py]
    on: [write]
converters:
  - id: knowledge-markdown
    run: [uv, run, --frozen, --script, scripts/knowledge_markdown.py]
    cache: false
generators:
  - id: build-word-list
    run: [uv, run, --frozen, --script, scripts/build_word_list.py]
direct_commit:
  branch: develop
  kinds:
    - knowhow
    - word-list
    - terms
    - rule
    - flowchart
    - decision-table
    - checksheet
    - guide
    - skills
    - {id: scripts, body: false}
    - {id: plugin, body: false}
    - {id: tests, body: false}
    - {id: schemas, body: false}
    - {id: docs_folder, body: false}
    - {id: root, body: false}
    - template
    - changelog
    - skill
    - architecture
    - nonfunctional
    - scenario
    - interface
    - module
    - library
    - test_procedure
    - dev_command
    - layout
    - index
documents:
  - id: rule
    title: 規約
    paths: ["docs/rule/*.yaml"]
    schema: schemas/rule.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: knowhow
    title: ノウハウ
    paths: ["docs/knowhow/*.yaml"]
    schema: schemas/knowhow.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: template
    title: テンプレート
    paths: ["docs/template/*.yaml"]
    schema: schemas/template.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: template-markdown
    title: テンプレート（Markdown）
    paths: [docs/template/markdown/files.yaml]
    schema: schemas/knowledge-files.schema.yaml
    records: files
    body_file: path
  - id: flowchart
    title: 判定フローチャート
    paths: ["docs/flowchart/*.yaml"]
    schema: schemas/flowchart.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: decision-table
    title: 判定表
    paths: ["docs/decision-table/*.yaml"]
    schema: schemas/decision-table.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: checksheet
    title: チェックシート
    paths: ["docs/checksheet/*.yaml"]
    schema: schemas/checksheet.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: review_aspect
    title: レビューの観点
    paths: ["docs/checksheet/checksheet-review-*.yaml"]
    schema: schemas/checksheet.schema.yaml
    records: aspects
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: guide
    title: 使い方
    paths: ["docs/guide/*.yaml"]
    schema: schemas/guide.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: changelog
    title: 変更履歴
    paths: [docs/changelog.yaml]
    schema: schemas/changelog.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: skill
    title: スキル
    paths: ["docs/skill/*.yaml"]
    schema: schemas/design/agent_flow.schema.yaml
    validators: [knowledge-checks]
    alias_type: skill
    metadata:
      name: title
      description: summary
      skill: skill.path
      tags: tags
  - id: word-list
    title: 単語の対応表
    paths: ["docs/word-list/*.yaml"]
    schema: schemas/word-list.schema.yaml
    validators: [knowledge-checks]
    after_write: [build-word-list]
    converter: knowledge-markdown
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: terms
    title: 用語集
    paths: [docs/terms.yaml]
    schema: schemas/terms.schema.yaml
    records: terms
    alias_type: term
  - id: architecture
    title: アーキテクチャ図
    alias_type: doc
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/design/architecture.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: nonfunctional
    title: 非機能要件
    alias_type: doc
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/design/nonfunctional.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: scenario
    title: シナリオ
    alias_type: doc
    paths: ["docs/scenario/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/design/scenario.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: interface
    title: インターフェース定義
    alias_type: doc
    paths: ["docs/interface/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/design/interface.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: module
    title: モジュール構成
    alias_type: doc
    paths: ["docs/module/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/design/module.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: library
    title: 外部ライブラリ
    alias_type: doc
    paths: ["docs/library/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/design/library.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: test_procedure
    title: テスト実行方法
    alias_type: doc
    paths: ["docs/test-procedure/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/design/test_procedure.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: dev_command
    title: 開発コマンド
    alias_type: doc
    paths: ["docs/dev-command/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/design/dev_command.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: layout
    title: フォルダ構成
    alias_type: doc
    paths: ["docs/layout/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/design/layout.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
      tags: tags[].name
      main_tags: tags[main].name
  - id: index
    title: 目次
    paths:
      - docs/index.yaml
      - "docs/*/index.yaml"
    schema: schemas/design/index.schema.yaml
    metadata:
      description: summary
  - id: skills
    title: スキルの本体
    paths: [skills/files.yaml]
    schema: schemas/knowledge-files.schema.yaml
    records: files
    body_file: path
  - id: scripts
    title: 検査と変換のスクリプト
    paths: [scripts/files.yaml]
    exclude: ["scripts/*.py.lock", scripts/lint/package-lock.json]
    schema: schemas/knowledge-files.schema.yaml
    records: files
    body_file: path
  - id: plugin
    title: プラグイン slop-check
    paths: [plugins/slop-check/files.yaml]
    exclude: ["plugins/slop-check/.ruff_cache/**"]
    schema: schemas/knowledge-files.schema.yaml
    records: files
    body_file: path
  - id: tests
    title: テスト
    paths: [tests/files.yaml]
    schema: schemas/knowledge-files.schema.yaml
    records: files
    body_file: path
  - id: schemas
    title: スキーマ
    paths: [schemas/files.yaml]
    schema: schemas/knowledge-files.schema.yaml
    records: files
    body_file: path
  - id: docs_folder
    title: 文書のフォルダの目次
    paths: [docs/files.yaml]
    exclude: ["docs/pr/**", "docs/generated/**"]
    schema: schemas/knowledge-files.schema.yaml
    records: files
    body_file: path
  - id: root
    title: リポジトリの直下のファイル
    paths: [files.yaml]
    exclude: [".git", "tmp/**", "docs/generated/**", "_site/**", ".pytest_cache/**", ".ruff_cache/**", "memes/**"]
    schema: schemas/knowledge-files.schema.yaml
    records: files
    body_file: path
nav:
  tabs:
    - title: はじめに
      items:
        - page: changelog
    - title: 使い方
      items:
        - auto:
            document: guide
        - group: スキル
          items:
            - auto:
                document: skill
    - title: 設計書
      items:
        - group: アーキテクチャ図
          items:
            - auto:
                document: architecture
        - group: 非機能要件
          items:
            - auto:
                document: nonfunctional
        - group: フォルダ構成
          items:
            - auto:
                document: layout
        - group: シナリオ
          items:
            - page: scenario/SC-72-1
            - page: scenario/SC-72-2
            - page: scenario/SC-72-3
            - page: scenario/SC-72-4
            - page: scenario/SC-137-1
            - page: scenario/SC-72-5
            - page: scenario/SC-148-1
            - page: scenario/SC-72-6
            - page: scenario/SC-201-1
            - page: scenario/SC-574-1
            - page: scenario/SC-352-1
        - group: インターフェース定義
          items:
            - auto:
                document: interface
        - group: モジュール構成
          items:
            - auto:
                document: module
        - group: 外部ライブラリ
          items:
            - auto:
                document: library
        - group: テスト実行方法
          items:
            - auto:
                document: test_procedure
        - group: 開発コマンド
          items:
            - auto:
                document: dev_command
    - title: 規約
      items:
        - group: 規約
          items:
            - group: 共通
              items:
                - auto:
                    document: rule
                    filter: {field: id, op: prefix, values: [convention-, doc-, markdown-, prompt-]}
            - group: 開発
              items:
                - auto:
                    document: rule
                    filter: {field: id, op: prefix, values: [dev-, testing-, obs-]}
            - group: UI
              items:
                - auto:
                    document: rule
                    filter: {field: id, op: prefix, values: [ui-]}
            - group: React
              items:
                - auto:
                    document: rule
                    filter: {field: id, op: prefix, values: [react-]}
            - group: Next.js
              items:
                - auto:
                    document: rule
                    filter: {field: id, op: prefix, values: [next-]}
            - group: HTML
              items:
                - auto:
                    document: rule
                    filter: {field: id, op: prefix, values: [html-]}
            - group: TypeScript
              items:
                - auto:
                    document: rule
                    filter: {field: id, op: prefix, values: [typescript-]}
            - group: Python
              items:
                - auto:
                    document: rule
                    filter: {field: id, op: prefix, values: [python-]}
            - group: Claude
              items:
                - auto:
                    document: rule
                    filter: {field: id, op: prefix, values: [claude-]}
        - group: テンプレート
          items:
            - auto:
                document: template
            - auto:
                document: template-markdown
        - group: 判定フローチャート
          items:
            - auto:
                document: flowchart
        - group: 判定表
          items:
            - auto:
                document: decision-table
        - group: チェックシート
          items:
            - auto:
                document: checksheet
        - group: レビューの観点
          items:
            - auto:
                document: review_aspect
        - group: 単語の対応表
          items:
            - auto:
                document: word-list
        - group: ノウハウ
          items:
            - auto:
                document: knowhow
    - title: コード
      items:
        - group: スキルの本体
          items:
            - auto:
                document: skills
        - group: 検査と変換のスクリプト
          items:
            - auto:
                document: scripts
        - group: プラグイン slop-check
          items:
            - auto:
                document: plugin
        - group: テスト
          items:
            - auto:
                document: tests
        - group: スキーマ
          items:
            - auto:
                document: schemas
        - group: リポジトリの直下と文書のフォルダの目次
          items:
            - auto:
                document: root
            - auto:
                document: docs_folder
    - title: 用語集
      items:
        - auto:
            document: terms
