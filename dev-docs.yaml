# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/dev-docs/3fa52c474176b95140f6e05ec4a78869e1dd401c/schemas/dev-docs.schema.json
version: "3"
name: knowledge
description: どのプロジェクトでも共通で使うコーディング規約・テンプレート・判定フローチャート・判定表・チェックシート・使い方
instructions: |-
  規約（rule）・テンプレート（template）・判定フローチャート（flowchart）・判定表（decision-table）・チェックシート（checksheet）・使い方（guide）・変更履歴（changelog）・単語の対応表（word-list）は `docs/` の YAML が正本で、種類ごとの行に分かれる。
  スキル（skill）は `docs/skill/` の YAML が正本で、書式は `schemas/design/agent_flow.schema.yaml` の `type: skill` で、`steps[]` が工程を持つ。
  本文は `items[]` の各項目が持ち、`[名前](id:{文書の ID}#{項目の ID})` で他の文書・項目を指す。`related[].when` がその文書を読むときを表す。
  `hooks/`・`skills/`・`scripts/` のファイルは、各フォルダの `files.yaml` が名前・概要文・タグを持つ。
  設計書（`docs/` の `scenario`・`interface`・`module` などの種類のフォルダ）は AI Monitor の設計書で、書式は `schemas/{種類}.schema.yaml`（AI Monitor の配布物）が持ち、他の設計書は `{ID}#{項目のパス}` で指す。
  書き込みのときは knowledge-checks が、項目の ID の重複・参照先の実在・`aliases` の衝突・文書の中の `aliases` の重複・mermaid の文法を検査する。
related:
  types: [references, requires, replaces, part_of, change_together, see_also, implements, tests]
github:
  repository: shuhei1101/knowledge
validators:
  - id: knowledge-checks
    run: [uv, run, --frozen, --script, scripts/knowledge_checks.py]
    on: [write]
converters:
  - id: knowledge-markdown
    run: [uv, run, --frozen, --script, scripts/knowledge_markdown.py]
    cache: false
documents:
  - id: rule
    title: 規約
    paths: ["docs/rule/*.yaml"]
    schema: schemas/rule.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: template
    title: テンプレート
    paths: ["docs/template/*.yaml"]
    schema: schemas/template.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: flowchart
    title: 判定フローチャート
    paths: ["docs/flowchart/*.yaml"]
    schema: schemas/flowchart.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: decision-table
    title: 判定表
    paths: ["docs/decision-table/*.yaml"]
    schema: schemas/decision-table.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: checksheet
    title: チェックシート
    paths: ["docs/checksheet/*.yaml"]
    schema: schemas/checksheet.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: guide
    title: 使い方
    paths: ["docs/guide/*.yaml"]
    schema: schemas/guide.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    alias_type: doc
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: changelog
    title: 変更履歴
    paths: [docs/changelog.yaml]
    schema: schemas/changelog.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: skill
    title: スキル
    paths: ["docs/skill/*.yaml"]
    schema: schemas/design/agent_flow.schema.yaml
    validators: [knowledge-checks]
    alias_type: skill
    metadata:
      name: title
      description: summary
      skill: skill.path
      tags: tags
  - id: word-list
    title: 単語の対応表
    paths: ["docs/word-list/*.yaml"]
    schema: schemas/word-list.schema.yaml
    validators: [knowledge-checks]
    converter: knowledge-markdown
    metadata:
      tags: tags[].name
      main_tags: tags[main].name
  - id: architecture
    title: アーキテクチャ図
    alias_type: doc
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/architecture.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: nonfunctional
    title: 非機能要件
    alias_type: doc
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/nonfunctional.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: scenario
    title: シナリオ
    alias_type: doc
    paths: ["docs/scenario/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/scenario.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: interface
    title: インターフェース定義
    alias_type: doc
    paths: ["docs/interface/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/interface.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: module
    title: モジュール構成
    alias_type: doc
    paths: ["docs/module/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/module.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: library
    title: 外部ライブラリ
    alias_type: doc
    paths: ["docs/library/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/library.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: test_procedure
    title: テスト実行方法
    alias_type: doc
    paths: ["docs/test-procedure/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/test-procedure.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: dev_command
    title: 開発コマンド
    alias_type: doc
    paths: ["docs/dev-command/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/dev-command.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: layout
    title: フォルダ構成
    alias_type: doc
    paths: ["docs/layout/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/layout.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: index
    title: 目次
    paths:
      - docs/index.yaml
      - "docs/*/index.yaml"
    schema: schemas/index.schema.yaml
    metadata:
      description: summary
  - id: hooks
    title: フック
    paths: [hooks/files.yaml]
    schema: schemas/knowledge-files.schema.yaml
    records: files
    body_file: path
  - id: skills
    title: スキルの本体
    paths: [skills/files.yaml]
    schema: schemas/knowledge-files.schema.yaml
    records: files
    body_file: path
  - id: scripts
    title: 検査と変換のスクリプト
    paths: [scripts/files.yaml]
    schema: schemas/knowledge-files.schema.yaml
    records: files
    body_file: path
nav:
  tabs:
    - title: 規約
      items:
        - auto:
            document: rule
        - group: 単語の対応表
          items:
            - auto:
                document: word-list
    - title: テンプレート
      items:
        - auto:
            document: template
    - title: 判定フローチャート
      items:
        - auto:
            document: flowchart
    - title: 判定表
      items:
        - auto:
            document: decision-table
    - title: チェックシート
      items:
        - auto:
            document: checksheet
    - title: 使い方
      items:
        - auto:
            document: guide
        - page: changelog
    - title: スキル
      items:
        - auto:
            document: skill
    - title: ファイル
      items:
        - group: フック
          items:
            - auto:
                document: hooks
        - group: スキルの本体
          items:
            - auto:
                document: skills
        - group: 検査と変換のスクリプト
          items:
            - auto:
                document: scripts
