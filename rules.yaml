# knowledge のルール索引（rule-inject の索引の書式）
# rule: 索引ファイルからの相対パス / paths: 当てるファイルの glob（クォート必須）
default_on: [write, mcp]
rules:
  - rule: docs/template/template-container.yaml
    paths:
      - "**/dev/設計書/コンテナ構成/**/*.md"
  - rule: docs/template/template-test-fixture.yaml
    paths:
      - "**/dev/設計書/テストフィクスチャ.md"
  - rule: docs/template/template-design-policy.yaml
    paths:
      - "**/dev/設計書/デザイン方針.md"
  - rule: docs/template/template-checksheet.yaml
    paths:
      - "**/dev/**/チェックシート/**/*.md"
  - rule: docs/template/template-flowchart.yaml
    paths:
      - "**/docs/flowchart/*.yaml"
  - rule: docs/template/template-setup-procedure.yaml
    paths:
      - "**/docs/guide/*.yaml"
  - rule: docs/template/template-getting-started.yaml
    paths:
      - "**/docs/はじめに/概要.md"
      - "**/docs/はじめに/クイックスタート.md"
  - rule: docs/template/template-reference.yaml
    paths:
      - "**/docs/リファレンス/API.md"
      - "**/docs/リファレンス/コマンド.md"
  - rule: docs/template/template-template.yaml
    paths:
      - "**/docs/template/*.yaml"
  - rule: docs/template/template-skill.yaml
    paths:
      - "**/docs/skill/*.yaml"
  - rule: docs/rule/convention-writing-style.yaml
    paths:
      - "**/*.md"
      - "**/docs/**/*.yaml"
    tools:
      - "mcp__*__comment"
      - "mcp__*__reply_comment"
      - "mcp__*__create_issue"
      - "mcp__*__create_defect_issue"
      - "mcp__*__create_monitor_rule_issue"
      - "mcp__*__create_plugin_rule_issue"
      - "mcp__*__create_review_comment"
      - "mcp__*__create_file_comment"
      - "mcp__*__reply_review_thread"
      - "mcp__*__update_body"
      - "mcp__*__update_body_if_unchanged"
      - "mcp__*__create_draft_pr"
  - rule: docs/rule/convention-issue-presentation.yaml
    paths:
      - "**/dev/pr/**/*.md"
    tools:
      - "mcp__*__comment"
      - "mcp__*__create_review_comment"
      - "mcp__*__create_file_comment"
      - "mcp__*__reply_comment"
      - "mcp__*__reply_review_thread"
  - rule: docs/rule/convention-keep-existing-text.yaml
    paths:
      - "**/*"
  - rule: docs/flowchart/flowchart-config-location.yaml
    paths:
      - "**/config/defaults.yaml*"
      - "**/settings.local.yaml*"
      - "**/settings.sample.yaml*"
  - rule: docs/rule/claude-code-tool-usage.yaml
    paths:
      - "*"
  - rule: docs/rule/claude-json.yaml
    paths:
      - "**/hooks/**"
      - "**/settings.json"
  - rule: docs/rule/claude-common.yaml
    paths:
      - "**/skills/**/SKILL.md"
      - "**/rules/**/*.md"
      - "**/hooks/**/*.md"
      - "**/mcp/**"
      - "**/CLAUDE.md"
      - "**/mcp_server.py*"
      - "**/.mcp.json"
      - "**/agents/**/*.md"
  - rule: docs/rule/claude-plugin.yaml
    paths:
      - "**/plugins/**"
      - "**/.claude-plugin/**"
  - rule: docs/rule/claude-mcp.yaml
    paths:
      - "**/mcp/**"
      - "**/mcp_server.py*"
      - "**/.mcp.json"
  - rule: docs/rule/claude-skills-usage.yaml
    paths:
      - "**/skills/*.md"
  - rule: docs/rule/claude-subagent.yaml
    paths:
      - "**/agents/**/*.md"
  - rule: docs/rule/claude-hook.yaml
    paths:
      - "**/.claude/hooks/**"
      - "**/settings.json"
  - rule: docs/rule/claude-rule-writing.yaml
    paths:
      - "**/.claude/rules/**/*.md"
  - rule: docs/rule/dev-yaml.yaml
    paths:
      - "**/*.{py,html,js,css,j2,ts,tsx,yaml,yml}*"
  - rule: docs/rule/dev-rule-index-registration.yaml
    paths:
      - "**/docs/**/*.md"
      - "**/rules*.yaml"
      - "**/docs/**/*.yaml"
  - rule: docs/rule/dev-document-management.yaml
    paths:
      - "**/docs/**/*.yaml"
      - "**/schemas/*.schema.yaml"
  - rule: docs/flowchart/flowchart-yaml-file-unit.yaml
    paths:
      - "**/docs/**/*.yaml"
  - rule: docs/rule/dev-tag-term-registration.yaml
    paths:
      - "**/terms.yaml"
  - rule: docs/rule/dev-coding-general.yaml
    paths:
      - "**/*.{py,html,js,css,j2,ts,tsx,yaml,yml}*"
  - rule: docs/rule/typescript-core-style.yaml
    paths:
      - "**/*.{ts,tsx}"
  - rule: docs/rule/ui-no-iframe.yaml
    paths:
      - "**/*.{tsx,jsx,html}"
    exclude:
      - "**/docs/_layouts/**"
      - "**/docs/_includes/**"
  - rule: docs/rule/dev-precheck.yaml
    paths:
      - "**/*.{py,js,ts,tsx}*"
      - "**/dev/設計書/アーキテクチャ図.md"
      - "**/dev/設計書/非機能要件.md"
      - "**/dev/設計書/インターフェース定義/**"
  - rule: docs/rule/dev-content-location.yaml
    paths:
      - "**/content/**"
  - rule: docs/rule/html-core-server-rendering.yaml
    paths:
      - "**/templates/**/*.{html,j2}"
  - rule: docs/rule/markdown-editing.yaml
    paths:
      - "**/*.md"
      - "**/docs/**/*.yaml"
  - rule: docs/rule/markdown-mermaid.yaml
    paths:
      - "**/*.md"
      - "**/docs/**/*.yaml"
  - rule: docs/rule/markdown-flowchart.yaml
    paths:
      - "**/*.md"
      - "**/docs/**/*.yaml"
  - rule: docs/rule/react-state-effect.yaml
    paths:
      - "**/frontend/src/features/**/*.tsx"
      - "**/frontend/src/shared/components/**/*.tsx"
      - "**/frontend/src/**/use-*.ts"
    exclude:
      - "**/*.test.tsx"
      - "**/*.test.ts"
      - "**/*.stories.tsx"
      - "**/frontend/src/shared/components/ui/**"
  - rule: docs/flowchart/flowchart-react-state-placement.yaml
    paths:
      - "**/frontend/src/**/*-screen.tsx"
      - "**/frontend/src/**/use-*.ts"
      - "**/frontend/src/**/store.ts"
      - "**/frontend/src/shared/stores/**/*.ts"
    exclude:
      - "**/*.test.tsx"
      - "**/*.test.ts"
      - "**/*.stories.tsx"
  - rule: docs/rule/dev-design-principles.yaml
    paths:
      - "**/*.{py,ts,tsx}"
    exclude:
      - "**/*.gen.ts"
      - "**/generated/**"
    on: [write]
  - rule: docs/rule/prompt-file.yaml
    paths:
      - "**/prompts/**"
      - "**/prompt/**"
  - rule: docs/rule/python-architecture-composition-root.yaml
    paths:
      - "**/main.py"
  - rule: docs/rule/python-concurrency-async.yaml
    paths:
      - "**/runtime/**/*.py"
      - "**/integrations/**/*.py"
      - "**/features/**/service.py"
  - rule: docs/rule/python-core-comment.yaml
    paths:
      - "**/*.py"
  - rule: docs/rule/python-fastapi-application.yaml
    paths:
      - "**/server/{app,lifespan,middleware}.py"
  - rule: docs/rule/python-fastapi-schema.yaml
    paths:
      - "**/features/**/route.py"
      - "**/server/routes/**/*.py"
      - "**/features/**/schemas.py"
  - rule: docs/rule/python-fastapi-health-check.yaml
    paths:
      - "**/healthz.py"
      - "**/server/routes/**/health*.py"
      - "**/server/routes/health*.py"
  - rule: docs/rule/python-fastapi-route.yaml
    paths:
      - "**/features/**/route.py"
      - "**/server/routes/**/*.py"
  - rule: docs/rule/python-fastapi-auth-error.yaml
    paths:
      - "**/server/{error_handlers,auth,deps}.py"
  - rule: docs/rule/python-llm-provider.yaml
    paths:
      - "**/integrations/llm/**/*.py"
  - rule: docs/rule/python-llm-prompt-loader.yaml
    paths:
      - "**/integrations/llm/prompts/**/*.py"
  - rule: docs/rule/python-llm-exception-retry.yaml
    paths:
      - "**/integrations/llm/**/*.py"
  - rule: docs/rule/python-packaging-pyproject.yaml
    paths:
      - "**/pyproject.toml"
  - rule: docs/rule/python-scripts-python-script.yaml
    paths:
      - "**/{tool,tools,script,scripts}/*.py"
  - rule: docs/rule/python-scripts-tkinter.yaml
    paths:
      - "**/*_gui.py"
      - "**/gui.py"
      - "**/gui/**/*.py"
  - rule: docs/rule/python-scripts-launcher-windows.yaml
    paths:
      - "**/*.bat"
  - rule: docs/rule/python-shared-error-definition.yaml
    paths:
      - "**/server/error_handlers.py"
      - "**/shared/errors.py"
      - "**/integrations/**/client.py"
  - rule: docs/rule/python-shared-type-definition.yaml
    paths:
      - "**/shared/types.py"
  - rule: docs/rule/python-shared-constant.yaml
    paths:
      - "**/shared/constants.py"
  - rule: docs/rule/python-shared-settings.yaml
    paths:
      - "**/config/settings.yaml"
      - "**/shared/settings.py"
  - rule: docs/rule/python-testing-pytest.yaml
    paths:
      - "**/benchmarks/**/*.py"
      - "**/tests/**/test_*.py"
      - "**/tests/conftest.py"
      - "**/tests/**/conftest.py"
  - rule: docs/rule/python-testing-strategy.yaml
    paths:
      - "**/tests/**/test_*.py"
  - rule: docs/rule/python-testing-fixture.yaml
    paths:
      - "**/tests/conftest.py"
      - "**/tests/**/conftest.py"
  - rule: docs/rule/ui-screen-division.yaml
    paths:
      - "**/設計書/画面設計/**"
  - rule: docs/rule/ui-screen-design-principles.yaml
    paths:
      - "**/設計書/画面設計/**"
