# knowledge のルール索引（rule-inject の索引の書式）
# rule: 索引ファイルからの相対パス / paths: 当てるファイルの glob（クォート必須）
default_on: [write, mcp]
rules:
  - rule: docs/template/template-container.yaml
    paths:
      - "**/dev/設計書/コンテナ構成/**/*.{md,yaml}"
  - rule: docs/template/template-test-fixture.yaml
    paths:
      - "**/dev/設計書/テストフィクスチャ.{md,yaml}"
  - rule: docs/template/template-design-policy.yaml
    paths:
      - "**/docs/design-policy.md"
  - rule: docs/template/template-checksheet.yaml
    paths:
      - "**/docs/checksheet/*.yaml"
  - rule: docs/template/template-decision-table.yaml
    paths:
      - "**/docs/decision-table/*.yaml"
  - rule: docs/template/template-flowchart.yaml
    paths:
      - "**/判定フローチャート/**/*.{md,yaml}"
      - "**/docs/flowchart/*.yaml"
  - rule: docs/template/template-setup-procedure.yaml
    paths:
      - "**/docs/guide/guide-setup-*.yaml"
  - rule: docs/template/template-getting-started.yaml
    paths:
      - "**/docs/guide/guide-getting-started-*.yaml"
  - rule: docs/template/template-reference.yaml
    paths:
      - "**/docs/reference/*.yaml"
  - rule: schemas/template.schema.yaml
    paths:
      - "**/docs/template/*.yaml"
  - rule: schemas/meta.schema.yaml
    paths:
      - "**/schemas/**/*.schema.yaml"
  - rule: docs/template/template-skill.yaml
    paths:
      - "**/docs/skill/*.yaml"
  - rule: docs/rule/convention-writing-style.yaml
    paths:
      - "**/docs/**/*.{md,yaml}"
    tools:
      - "mcp__*__comment"
      - "mcp__*__reply_comment"
      - "mcp__*__create_issue"
      - "mcp__*__create_defect_issue"
      - "mcp__*__create_monitor_rule_issue"
      - "mcp__*__create_plugin_rule_issue"
      - "mcp__*__create_review_comment"
      - "mcp__*__create_file_comment"
      - "mcp__*__reply_review_thread"
      - "mcp__*__update_body"
      - "mcp__*__update_body_if_unchanged"
      - "mcp__*__create_draft_pr"
  - rule: docs/rule/convention-doc-presentation.yaml
    paths:
      - "**/*.md"
      - "**/docs/**/*.yaml"
      - "**/dev-docs/**/src/dev_docs/features/convert/**"
      - "**/dev-docs/**/frontend/src/features/docs/**"
      - "**/mdmark/**/src/{render,parts,diagram}/**"
    exclude:
      - "**/CLAUDE.md"
      - "**/SKILL.md"
      - "**/.claude/agents/**"
      - "**/.claude/commands/**"
    tools:
      - "mcp__*__write_design_doc*"
  - rule: docs/rule/convention-doc-presentation.yaml
    tools:
      - "mcp__*_mindstella__add"
      - "mcp__*_mindstella__update"
    args:
      item.body_markdown:
        - 're:\|\s*キー\s*\|'
  - rule: docs/rule/convention-doc-presentation.yaml
    tools:
      - "mcp__*_mindstella__batch"
    args:
      operations.item.body_markdown:
        - 're:\|\s*キー\s*\|'
  - rule: docs/template/template-scenario.yaml
    tools:
      - "mcp__*_mindstella__add"
      - "mcp__*_mindstella__update"
    args:
      item.title:
        - "re:シナリオ"
  - rule: docs/template/template-scenario.yaml
    tools:
      - "mcp__*_mindstella__batch"
    args:
      operations.item.title:
        - "re:シナリオ"
  - rule: docs/template/template-interface.yaml
    tools:
      - "mcp__*_mindstella__add"
      - "mcp__*_mindstella__update"
    args:
      item.title:
        - "re:インターフェース定義"
  - rule: docs/template/template-interface.yaml
    tools:
      - "mcp__*_mindstella__batch"
    args:
      operations.item.title:
        - "re:インターフェース定義"
  - rule: docs/flowchart/flowchart-rule-form-choice.yaml
    paths:
      - "**/docs/rule/*.yaml"
      - "**/docs/flowchart/*.yaml"
      - "**/docs/decision-table/*.yaml"
      - "**/docs/checksheet/*.yaml"
      - "**/規約/**/*.md"
      - "**/判定フローチャート/**/*.{md,yaml}"
      - "**/チェックシート/**/*.md"
  - rule: docs/flowchart/flowchart-presentation-choice.yaml
    paths:
      - "**/*.md"
      - "**/docs/**/*.yaml"
      - "**/dev-docs/**/src/dev_docs/features/convert/**"
      - "**/dev-docs/**/frontend/src/features/docs/**"
      - "**/mdmark/**/src/{render,parts,diagram}/**"
    exclude:
      - "**/CLAUDE.md"
      - "**/SKILL.md"
      - "**/.claude/agents/**"
      - "**/.claude/commands/**"
    tools:
      - "mcp__*__write_design_doc*"
  - rule: docs/rule/convention-issue-presentation.yaml
    paths:
      - "**/docs/pr/**/*.md"
    tools:
      - "mcp__*__comment"
      - "mcp__*__create_review_comment"
      - "mcp__*__create_file_comment"
      - "mcp__*__reply_comment"
      - "mcp__*__reply_review_thread"
  - rule: docs/rule/convention-keep-existing-text.yaml
    paths:
      - "**/*.{md,yaml}"
  - rule: docs/rule/claude-json.yaml
    paths:
      - "**/.claude/settings*.json"
      - "**/hooks/hooks.json"
  - rule: docs/rule/claude-common.yaml
    paths:
      - "**/skills/*/SKILL.md"
      - "**/.claude/rules/**/*.md"
      - "**/CLAUDE.md"
      - "**/agents/*.md"
  - rule: docs/rule/claude-plugin.yaml
    paths:
      - "**/.claude-plugin/*.json"
  - rule: docs/rule/claude-hook.yaml
    paths:
      - "**/.claude/hooks/**"
      - "**/settings.json"
      - "**/hooks/hooks.json"
  - rule: docs/rule/claude-context-placement.yaml
    paths:
      - "**/hooks/**"
      - "**/mcp/**"
      - "**/mcp_server.py"
      - "**/.mcp.json"
      - "**/CLAUDE.md"
      - "**/skills/**/SKILL.md"
      - "**/content/prompts/**"
  - rule: docs/flowchart/flowchart-session-context-placement.yaml
    paths:
      - "**/hooks/**"
      - "**/mcp/**"
      - "**/mcp_server.py"
      - "**/.mcp.json"
      - "**/content/prompts/**"
  - rule: docs/flowchart/flowchart-mcp-hook-delivery.yaml
    paths:
      - "**/.mcp.json"
      - "**/plugins/**"
      - "**/.claude-plugin/**"
      - "**/.claude/settings.json"
  - rule: docs/rule/claude-rule-writing.yaml
    paths:
      - "**/.claude/rules/**/*.md"
  - rule: docs/rule/dev-rule-index-registration.yaml
    paths:
      - "**/rules*.yaml"
  - rule: docs/rule/dev-tag-term-registration.yaml
    paths:
      - "**/terms.yaml"
  - rule: docs/rule/dev-doc-tag-description.yaml
    paths:
      - "**/terms.yaml"
      - "**/docs/**/*.yaml"
    tools:
      - "mcp__*__write_docs"
      - "mcp__*__write_design_doc*"
      - "mcp__*_mindstella__add"
      - "mcp__*_mindstella__update"
      - "mcp__*_mindstella__batch"
  - rule: docs/rule/dev-filter-condition.yaml
    paths:
      - "**/*{filter,condition}*.{py,ts,tsx}"
    on: [write]
  - rule: docs/rule/dev-coding-general.yaml
    paths:
      - "**/*.{py,ts,tsx,js,jsx,mjs}"
  - rule: docs/rule/dev-vscode-extension-distribution.yaml
    paths:
      - "**/.vscodeignore"
      - "**/vscode/package.json"
      - "**/.github/workflows/vscode-*.yml"
  - rule: docs/rule/typescript-core-style.yaml
    paths:
      - "**/*.{ts,tsx}"
  - rule: docs/rule/ui-no-iframe.yaml
    paths:
      - "**/*.{tsx,jsx,html}"
    exclude:
      - "**/docs/_layouts/**"
      - "**/docs/_includes/**"
  - rule: docs/rule/dev-content-location.yaml
    paths:
      - "**/content/**"
  - rule: docs/rule/html-core-server-rendering.yaml
    paths:
      - "**/templates/**/*.{html,j2}"
  - rule: docs/rule/react-state-effect.yaml
    paths:
      - "**/frontend/src/features/**/*.tsx"
      - "**/frontend/src/shared/components/**/*.tsx"
      - "**/frontend/src/**/use-*.ts"
    exclude:
      - "**/*.test.tsx"
      - "**/*.test.ts"
      - "**/*.stories.tsx"
      - "**/frontend/src/shared/components/ui/**"
  - rule: docs/flowchart/flowchart-react-state-placement.yaml
    paths:
      - "**/frontend/src/**/*-screen.tsx"
      - "**/frontend/src/**/use-*.ts"
      - "**/frontend/src/**/store.ts"
      - "**/frontend/src/shared/stores/**/*.ts"
    exclude:
      - "**/*.test.tsx"
      - "**/*.test.ts"
      - "**/*.stories.tsx"
  - rule: docs/rule/react-core-tailwind.yaml
    paths:
      - "**/frontend/src/shared/styles/*.css"
  - rule: docs/rule/react-core-build.yaml
    paths:
      - "**/package.json"
      - "**/tsconfig*.json"
    exclude:
      - "**/node_modules/**"
  - rule: docs/rule/react-devtools-lint-format.yaml
    paths:
      - "**/eslint.config.js"
      - "**/tsconfig*.json"
    exclude:
      - "**/node_modules/**"
  - rule: docs/rule/dev-design-principles.yaml
    paths:
      - "**/*.{py,ts,tsx}"
    exclude:
      - "**/*.gen.ts"
      - "**/generated/**"
    on: [write]
  - rule: docs/rule/prompt-file.yaml
    paths:
      - "**/prompts/**/*.{yaml,md,j2}"
    exclude:
      - "**/src/**"
      - "**/frontend/**"
      - "**/tests/**"
  - rule: docs/rule/python-architecture-composition-root.yaml
    paths:
      - "**/main.py"
  - rule: docs/rule/python-concurrency-async.yaml
    paths:
      - "**/runtime/**/*.py"
      - "**/integrations/**/*.py"
      - "**/features/**/service.py"
  - rule: docs/rule/python-core-comment.yaml
    paths:
      - "**/*.py"
  - rule: docs/rule/python-fastapi-application.yaml
    paths:
      - "**/server/{app,lifespan,middleware}.py"
  - rule: docs/rule/python-fastapi-schema.yaml
    paths:
      - "**/features/**/route.py"
      - "**/server/routes/**/*.py"
      - "**/features/**/schemas.py"
  - rule: docs/rule/python-fastapi-health-check.yaml
    paths:
      - "**/healthz.py"
      - "**/server/routes/**/health*.py"
      - "**/server/routes/health*.py"
  - rule: docs/rule/python-fastapi-route.yaml
    paths:
      - "**/features/**/route.py"
      - "**/server/routes/**/*.py"
  - rule: docs/rule/python-fastapi-auth-error.yaml
    paths:
      - "**/server/{error_handlers,auth,deps}.py"
  - rule: docs/rule/python-llm-provider.yaml
    paths:
      - "**/integrations/llm/**/*.py"
  - rule: docs/rule/python-llm-prompt-loader.yaml
    paths:
      - "**/integrations/llm/prompts/**/*.py"
  - rule: docs/rule/python-llm-exception-retry.yaml
    paths:
      - "**/integrations/llm/**/*.py"
  - rule: docs/rule/python-packaging-pyproject.yaml
    paths:
      - "**/pyproject.toml"
  - rule: docs/rule/python-scripts-python-script.yaml
    paths:
      - "**/{tool,tools,script,scripts}/*.py"
  - rule: docs/rule/python-scripts-tkinter.yaml
    paths:
      - "**/*_gui.py"
      - "**/gui.py"
      - "**/gui/**/*.py"
  - rule: docs/rule/python-scripts-launcher-windows.yaml
    paths:
      - "**/*.bat"
  - rule: docs/rule/python-shared-error-definition.yaml
    paths:
      - "**/server/error_handlers.py"
      - "**/shared/errors.py"
      - "**/integrations/**/client.py"
  - rule: docs/rule/python-shared-type-definition.yaml
    paths:
      - "**/shared/types.py"
  - rule: docs/rule/python-shared-constant.yaml
    paths:
      - "**/shared/constants.py"
  - rule: docs/rule/python-shared-settings.yaml
    paths:
      - "**/config/settings.yaml"
      - "**/shared/settings.py"
  - rule: docs/rule/python-testing-pytest.yaml
    paths:
      - "**/benchmarks/**/*.py"
      - "**/tests/**/test_*.py"
      - "**/tests/conftest.py"
      - "**/tests/**/conftest.py"
  - rule: docs/rule/python-testing-strategy.yaml
    paths:
      - "**/tests/**/test_*.py"
  - rule: docs/rule/python-testing-fixture.yaml
    paths:
      - "**/tests/conftest.py"
      - "**/tests/**/conftest.py"
  - rule: docs/rule/ui-screen-division.yaml
    paths:
      - "**/設計書/画面設計/**"
  - rule: docs/rule/ui-screen-design-principles.yaml
    paths:
      - "**/設計書/画面設計/**"
  - rule: docs/word-list/word-list-ai-slop.yaml
    paths:
      - "**/docs/word-list/*.yaml"
  - rule: docs/decision-table/decision-table-dataflow.yaml
    paths:
      - "**/docs/dataflow/*.yaml"
  - rule: docs/flowchart/flowchart-nonfunctional-layer.yaml
    paths:
      - "**/docs/nonfunctional/*.yaml"
  - rule: docs/rule/dev-versioning.yaml
    paths:
      - "**/version.ini"
