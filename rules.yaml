      - "**/docs/リファレンス/API.md"
      - "**/docs/リファレンス/コマンド.md"
  - rule: dev/テンプレート/テンプレート.md
    paths:
      - "**/dev/テンプレート/**/*.md"
  - rule: dev/規約/文章の追記.md
    paths:
      - "**/*.md"
    tools:
      - "mcp__*__comment"
      - "mcp__*__reply_comment"
      - "mcp__*__create_issue"
      - "mcp__*__create_defect_issue"
      - "mcp__*__create_monitor_rule_issue"
      - "mcp__*__create_plugin_rule_issue"
      - "mcp__*__create_review_comment"
      - "mcp__*__create_file_comment"
      - "mcp__*__reply_review_thread"
      - "mcp__*__update_body"
      - "mcp__*__update_body_if_unchanged"
      - "mcp__*__create_draft_pr"
  - rule: dev/規約/論点の提示.md
    paths:
      - "**/dev/pr/**/*.md"
    tools:
      - "mcp__*__comment"
      - "mcp__*__create_review_comment"
      - "mcp__*__create_file_comment"
      - "mcp__*__reply_comment"
      - "mcp__*__reply_review_thread"
  - rule: dev/規約/既存文章の維持.md
    paths:
      - "**/*"
  - rule: dev/規約/デザインスタイル.md
