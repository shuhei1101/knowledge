# knowledge のルール索引（rule-inject の索引の書式）
# rule: 索引ファイルからの相対パス / paths: 当てるファイルの glob（クォート必須）
default_on: [write, mcp]
rules:
  - rule: dev/テンプレート/コンテナ構成.md
    paths:
      - "**/dev/設計書/コンテナ構成/**/*.md"
  - rule: dev/テンプレート/テストフィクスチャ.md
    paths:
      - "**/dev/設計書/テストフィクスチャ.md"
  - rule: dev/テンプレート/デザイン方針.md
    paths:
      - "**/dev/設計書/デザイン方針.md"
  - rule: dev/テンプレート/チェックシート.md
    paths:
      - "**/dev/**/チェックシート/**/*.md"
  - rule: dev/テンプレート/判定フローチャート.md
    paths:
      - "**/dev/エージェント運用/判定フローチャート/**/*.md"
      - "**/dev/判定フローチャート/**/*.md"
  - rule: dev/テンプレート/セットアップ手順.md
    paths:
      - "**/docs/使い方/セットアップ手順/*.md"
      - "**/docs/使い方/プロジェクトの立ち上げ/*.md"
  - rule: dev/テンプレート/はじめに.md
    paths:
      - "**/docs/はじめに/概要.md"
      - "**/docs/はじめに/クイックスタート.md"
